name: CI

on: push

# A push that lands while an older run is still going makes that run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      # `npm test` starts with the content linter, which is Python.
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # test:unit drives the real practice-repo through forge — it asserts the
      # runner produces a verdict from actual output, not a mocked one. Without
      # Foundry on PATH those cases fail as could-not-run.
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Install PyYAML
        run: pip install --disable-pip-version-check pyyaml

      - name: Install dependencies
        run: npm ci

      # lint:content  — schema, sources, citations, figure props, the conflict rules
      # check:mdx     — every lesson compiles
      # check:figures — every figure renders headlessly and fits the 760px column
      # test:unit     — scheduler, safety, practice runner, learner state
      - name: npm test
        run: npm test

      - name: npm run build
        run: npm run build

      # The practice repo must build straight from a clone. forge-std is vendored
      # precisely so no `forge install` is needed — running one here would hide a
      # regression in that, so this step deliberately does not.
      - name: forge build (practice-repo, no install step)
        run: forge build
        working-directory: practice-repo
