name: CI

on: push

# A push that lands while an older run is still going makes that run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      # `npm test` starts with the content linter, which is Python.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyYAML
        run: pip install --disable-pip-version-check pyyaml

      - name: Install dependencies
        run: npm ci

      # lint:content  — schema, sources, citations, figure props, the conflict rules
      # check:mdx     — every lesson compiles
      # check:figures — every figure renders headlessly and fits the 760px column
      # test:unit     — scheduler, safety, practice runner, learner state
      - name: npm test
        run: npm test
