moduleId: altvm-anchor
concepts:
  - id: anchor-purpose
    title: What Anchor is for
    oneLine: A Rust framework whose whole job is generating the deserialization and account validation a raw Solana program must write by hand.
    statement: >
      A raw Solana program receives a program id, a flat list of accounts, and a byte slice of instruction
      data. Everything else - deciding which instruction this is, decoding its arguments, checking that each
      account is the one intended, deserializing state, writing it back - is manual. Anchor is a Rust
      framework that generates all of it from declarations. It is not a language and not a runtime; the
      program it produces is an ordinary Solana program, and every check it adds executes on chain at your
      expense.
    volatility: evolving
    edges:
      - { to: program-is-stateless, type: requires }
      - { to: sealevel-declared-access, type: requires }
      - { to: pinocchio-what-it-is, type: contrasts }
    sources: [anchor-docs, solana-docs-anchor]
  - id: anchor-three-macros
    title: The three macros
    oneLine: '#[program] makes handlers, #[derive(Accounts)] declares and validates one instruction''s accounts, #[account] marks on-chain state.'
    statement: >
      An Anchor program is three macro layers. `#[program]` turns a module of Rust functions into instruction
      handlers with decoded arguments. `#[derive(Accounts)]` on a struct declares the account list for one
      instruction and the validation each account must pass. `#[account]` marks a struct as on-chain state,
      giving it a discriminator and Borsh serialization. Reading an unfamiliar Anchor program means reading
      the `Accounts` struct first: it is the security specification of the instruction, in one place.
    volatility: evolving
    edges:
      - { to: anchor-purpose, type: requires }
    sources: [anchor-docs, solana-docs-anchor]
  - id: eight-byte-discriminator
    title: Eight-byte discriminator
    oneLine: A hash prefix on every account and instruction payload so a program refuses to read one type as another.
    statement: >
      Anchor prefixes each account's data, and each instruction payload, with eight bytes derived from a hash
      of its name. Before deserializing, the framework compares the prefix to the expected type's
      discriminator and rejects a mismatch. It is the nearest thing Solana has to the EVM's function selector
      and to a runtime type tag at once. What it prevents is accidental and adversarial type confusion; what
      it cannot prevent is being handed a legitimate account of exactly the right type belonging to somebody
      else.
    volatility: evolving
    edges:
      - { to: anchor-three-macros, type: requires }
      - { to: abi-function-selector, type: contrasts }
    sources: [anchor-account-constraints, anchor-lang-docsrs]
    misconceptions:
      - belief: An eight-byte discriminator is a type system, so type confusion is solved.
        reality: It is a hash prefix that stops the wrong type being read; it says nothing about whether this is the caller's instance of that type.
        why: Type safety and authorization feel like the same guarantee when the compiler usually provides both.
        source: anchor-account-constraints
  - id: account-wrapper-does-three-checks
    title: Account<'info, T> does three things
    oneLine: Constructing a typed account checks program ownership, checks the discriminator, then deserializes.
    statement: >
      `Account<'info, T>` is not a typed pointer. Building one performs three steps in order: assert that the
      account's owner field equals this program's id, assert that the first eight bytes match T's
      discriminator, and only then Borsh-deserialize the remaining bytes into T. Two of the three classic
      Solana vulnerability classes - missing owner check and type confusion - are closed by that constructor
      alone, which is the single strongest argument for using the framework.
    volatility: evolving
    edges:
      - { to: eight-byte-discriminator, type: requires }
      - { to: solana-account, type: requires }
    sources: [anchor-account-constraints, anchor-lang-docsrs]
  - id: typed-account-wrappers
    title: The wrapper type is the check
    oneLine: Signer, Program, SystemAccount and UncheckedAccount each assert something different - or nothing at all.
    statement: >
      Anchor encodes the assertion you want in the type of the field. `Signer` asserts the account signed the
      transaction. `Program<'info, System>` asserts both the key and the executable flag. `SystemAccount`
      asserts system-program ownership. `UncheckedAccount` and `AccountInfo` assert nothing, and the framework
      forces you to write a `/// CHECK:` comment explaining why that is acceptable. Reviewing an Anchor
      program starts by finding every unchecked field and reading its justification.
    volatility: evolving
    edges:
      - { to: account-wrapper-does-three-checks, type: requires }
    sources: [anchor-account-constraints, anchor-lang-docsrs]
  - id: constraints-are-generated-code
    title: Constraints are generated code
    oneLine: Every attribute inside #[account(...)] expands to an ordinary runtime check that returns a specific error.
    statement: >
      `mut`, `init`, `seeds`/`bump`, `has_one`, `close`, `constraint = expr`, `address`, `owner` - each
      expands at compile time into plain Rust that executes inside the program and returns a named error on
      failure. Nothing about them is declarative at runtime and nothing runs off-chain. Two consequences
      follow directly: the checks cost compute units in proportion to how many you write, and reading the
      expanded order (owner, discriminator, deserialize, then constraints) tells you exactly which error a
      malformed call will produce.
    volatility: evolving
    edges:
      - { to: anchor-three-macros, type: requires }
    sources: [anchor-account-constraints]
    misconceptions:
      - belief: '#[derive(Accounts)] validation happens off-chain or in the client.'
        reality: The macro expands into on-chain Rust checks that execute inside the program and burn compute units.
        why: The declarative attribute syntax reads like configuration rather than code.
        source: anchor-account-constraints
  - id: anchor-error-codes
    title: Error codes tell you who rejected you
    oneLine: Anchor reserves low error ranges for its own constraint failures; user-defined errors start above them.
    statement: >
      `#[error_code]` generates an error enum with numeric codes. Anchor reserves lower ranges for its own
      framework and constraint failures and starts user-defined errors at a higher base (6000 in current
      releases), so a raw error number from a failed transaction immediately tells you whether a generated
      constraint rejected the call or your own logic did. Reading the number before reading the logs is the
      fastest triage step available on Solana, because the on-chain program cannot return a rich error
      payload the way a Solidity custom error can.
    volatility: evolving
    edges:
      - { to: constraints-are-generated-code, type: requires }
      - { to: sol-custom-error, type: contrasts }
    sources: [anchor-lang-docsrs, anchor-docs]
  - id: seeds-bump-constraint
    title: seeds and bump
    oneLine: The constraint that re-derives a PDA and compares it to the account you were handed.
    statement: >
      `seeds = [...], bump` makes Anchor derive the program address from those seeds and compare it with the
      passed account key, rejecting a mismatch. That comparison is what turns a PDA from a naming convention
      into an authorization mechanism. Storing the canonical bump in the account and reusing it
      (`bump = state.bump`) is cheaper than re-deriving it and avoids admitting several valid addresses for
      one logical key. Getting this wrong is not a style issue - it is how one user's account becomes
      reachable through another user's parameters.
    volatility: evolving
    edges:
      - { to: pda, type: requires }
      - { to: constraints-are-generated-code, type: requires }
    sources: [anchor-account-constraints]
  - id: has-one-links-accounts
    title: has_one links two accounts
    oneLine: Asserts that a pubkey stored inside an account's data equals another account passed in the same instruction.
    statement: >
      `has_one = authority` checks that the `authority` field stored in the account's data equals the key of
      the `authority` account in the same instruction - and, combined with `Signer`, that this authority
      actually signed. It is the standard way to bind an object to its owner, and it answers the third of the
      three questions a program must ask about every account: not just who owns it and did it sign, but is
      this the specific instance this caller is entitled to act on.
    volatility: evolving
    edges:
      - { to: constraints-are-generated-code, type: requires }
      - { to: typed-account-wrappers, type: requires }
    sources: [anchor-account-constraints]
  - id: init-vs-init-if-needed
    title: init versus init_if_needed
    oneLine: init creates and fails if the account exists; init_if_needed continues silently and hands you a re-initialization bug.
    statement: >
      `init` creates and funds an account and fails when it already exists. `init_if_needed` proceeds when the
      account exists, is gated behind a cargo feature, and hands you the classic Solana re-initialization
      attack surface: an instruction that resets live state - zeroing a balance, replacing an authority -
      when called a second time. Using it safely requires your own guard on an already-initialized field. The
      feature gate exists specifically because the framework cannot know which of your fields must not be
      reset.
    volatility: evolving
    edges:
      - { to: constraints-are-generated-code, type: requires }
      - { to: reinitialization-attack, type: applies }
    sources: [anchor-account-constraints]
    misconceptions:
      - belief: Using Anchor means you cannot write an insecure program.
        reality: Anchor removes the default-unsafe cases, but UncheckedAccount, init_if_needed, a missing has_one and unvalidated CPI targets are all still yours to get right.
        why: The phrase 'safe by default' gets read as 'safe'.
        source: anchor-account-constraints
  - id: idl-is-the-abi
    title: The IDL is Solana's ABI
    oneLine: A JSON description of instructions, accounts, types, errors, discriminators and PDA seeds, emitted by the build.
    statement: >
      `anchor build` emits an IDL: JSON describing every instruction, account type, custom type, error code,
      discriminator and (where it can) the seeds of each PDA. It plays the role an EVM ABI plays and carries
      strictly more - an ABI never told you how to derive an address. It is what TypeScript and Rust client
      generators consume. Unlike an ABI, which is a mechanical function of the source, the IDL is produced by
      a macro-driven build that can succeed while describing the program incompletely.
    volatility: evolving
    edges:
      - { to: eight-byte-discriminator, type: requires }
      - { to: abi-is-the-boundary, type: contrasts }
    sources: [anchor-docs, anchor-issue-4057, anchor-issue-3947]
    misconceptions:
      - belief: The IDL is a complete, trustworthy description of the program.
        reality: Known Anchor issues let a build emit an IDL missing PDA seed information, or fail on seeds that reference account fields, so a generated client can be silently wrong.
        why: People treat build output as something that cannot be incomplete.
        source: anchor-issue-4057
  - id: idl-published-on-chain
    title: The IDL can live on chain
    oneLine: An interface registry built into the framework - fetch a program's IDL from an account derived from its program id.
    statement: >
      The IDL can be written to an account derived from the program id, so an explorer or a client can fetch a
      program's interface directly from the chain with no repository, registry or verified-source step. This
      is a structural difference from Ethereum, where reading an unknown contract means finding a verified
      source or ABI off-chain, and where verification proves bytecode matches source rather than publishing an
      interface. The trade-off is that an on-chain IDL is published by whoever holds the upgrade authority and
      is not proof of anything about the deployed code.
    volatility: evolving
    edges:
      - { to: idl-is-the-abi, type: requires }
      - { to: verification-is-bytecode-matching, type: contrasts }
    sources: [anchor-docs]
  - id: anchor-costs-compute
    title: The convenience is measured in compute units
    oneLine: Every generated check and every Borsh (de)serialization of a large account is paid in CU on every call.
    statement: >
      Anchor's checks are code, so they cost compute units on every invocation, and Borsh serialization of a
      large account costs more the larger it gets. For an application instruction called a few thousand times
      a day this is irrelevant. For a primitive invoked inside other people's transactions by CPI, this fixed
      per-invocation overhead is the entire argument for dropping to a lower layer - which is what the next
      module is about.
    volatility: evolving
    edges:
      - { to: anchor-purpose, type: requires }
      - { to: compute-unit-budget, type: requires }
      - { to: pinocchio-zero-copy, type: contrasts }
    sources: [anchor-docs, anza-compute-units]
  - id: anchor-zero-copy-escape-hatch
    title: zero_copy and AccountLoader
    oneLine: For accounts too large to deserialize onto the program's small stack, memory-map them instead of copying.
    statement: >
      `#[account(zero_copy)]` plus `AccountLoader` maps an account's bytes directly with bytemuck rather than
      Borsh-deserializing them into an owned struct. It exists because a program's stack frame is small and
      fixed, so a large account can blow it simply by being loaded. Using it means taking on alignment and
      layout obligations in exchange - the same trade the whole of Pinocchio makes, offered here as an opt-in
      for one account at a time.
    volatility: evolving
    edges:
      - { to: account-wrapper-does-three-checks, type: requires }
      - { to: pinocchio-zero-copy, type: contrasts }
    sources: [anchor-docs, anchor-lang-docsrs]
  - id: anchor-test-stack
    title: Three places to run a test
    oneLine: A local validator, a fork of mainnet state, or an in-process SVM that runs in milliseconds.
    statement: >
      Program tests can run against a full local validator (slow, most realistic), against a fork of mainnet
      state (realistic data, real programs), or against an in-process SVM harness such as LiteSVM, Mollusk or
      bankrun, which skips consensus and networking entirely and executes in milliseconds. The Anchor 1.x
      templates are reported to have moved the default to the in-process path, with a mainnet-forking local
      network as the validator-shaped option. The judgement to teach is the ladder itself: run the fast
      harness constantly, and reserve the realistic ones for what actually depends on real accounts.
    volatility: hot
    edges:
      - { to: anchor-purpose, type: requires }
    sources: [anchor-releases, anchor-docs]
    misconceptions:
      - belief: Testing an Anchor program requires a local validator.
        reality: In-process SVM harnesses run the same program against an SVM instance in milliseconds, and current Anchor templates are reported to default to that path.
        why: Every pre-2026 tutorial starts by launching a test validator.
        source: anchor-releases
