moduleId: altvm-cosmos
concepts:
  - id: appchain-thesis
    title: The appchain thesis
    oneLine: An application should get its own sovereign chain rather than rent block space on a shared one.
    statement: >
      The Cosmos argument is that competing for space in someone else's blocks is the wrong default. A
      sovereign chain gives an application its own fee token, its own validator set, its own upgrade schedule
      and all of its own block space, with no neighbour's NFT mint raising its costs and no shared governance
      deciding what it may do. Everything else in the ecosystem - the SDK, the consensus engine, IBC - exists
      to make that thesis practical.
    volatility: stable
    edges:
      - { to: rollup, type: contrasts }
    sources: [cosmos-sdk-docs, cosmos-stack-roadmap-2026]
  - id: appchain-tradeoff
    title: Sovereignty costs you a validator set
    oneLine: An appchain must bootstrap and pay for its own security - the structural weakness rollups exist to avoid.
    statement: >
      A sovereign chain's safety is only as good as the stake securing it, and that stake has to be recruited,
      incentivised and paid for out of the application's own economics. A rollup borrows security from an L1
      instead, which is precisely the trade-off it is making. Neither answer is free: the appchain pays in
      security bootstrapping, the rollup pays in dependence on someone else's sequencing, data availability
      and upgrade politics.
    volatility: stable
    edges:
      - { to: appchain-thesis, type: requires }
      - { to: security-is-the-weaker-link, type: contrasts }
    sources: [cosmos-sdk-docs]
  - id: interchain-security-and-shared-security
    title: Renting a validator set
    oneLine: Shared-security arrangements let a consumer chain borrow a provider chain's validators.
    statement: >
      Because bootstrapping validators is the thesis's weak point, Cosmos added arrangements in which a
      consumer chain is secured by a provider chain's validator set rather than its own. That is a partial
      convergence with the rollup model - borrowed security in exchange for reduced sovereignty - reached from
      the opposite starting point. The current naming, adoption and operational status of these programmes was
      not established in the research behind this stub and should be checked before relying on specifics.
    volatility: hot
    edges:
      - { to: appchain-tradeoff, type: requires }
    sources: [interchain-security-docs, cosmos-sdk-docs]
  - id: cosmos-three-layers
    title: CometBFT, ABCI, and the SDK
    oneLine: Consensus and networking below, an application framework above, and a defined interface between them.
    statement: >
      The stack separates cleanly: CometBFT (formerly Tendermint) provides consensus and networking, the
      Cosmos SDK provides the application framework, and ABCI is the interface between them. You write a state
      machine and get a chain, rather than writing a contract and getting a tenant. The direct comparison
      worth drawing for an EVM developer is that a Cosmos application sits where the EVM itself sits, not
      where a contract sits.
    volatility: evolving
    edges:
      - { to: appchain-thesis, type: requires }
      - { to: state-machine-replication, type: requires }
    sources: [cosmos-sdk-docs]
  - id: cometbft-instant-finality
    title: Single-slot deterministic finality
    oneLine: A committed block is final immediately - no reorgs, no confirmation depth, but the chain halts rather than forks.
    statement: >
      CometBFT is a BFT protocol in which a committed block is final at commit: there is no probabilistic
      confirmation depth and no reorg to design around. The trade is explicit - safety over liveness - so with
      more than a third of voting power faulty or offline the chain halts instead of forking, and Cosmos
      chains have halted in practice. "Instant finality" is a statement about what a commit means, not a claim
      that the chain cannot fail.
    volatility: stable
    edges:
      - { to: cosmos-three-layers, type: requires }
      - { to: finality-is-a-spectrum, type: contrasts }
    sources: [cosmos-sdk-docs]
    misconceptions:
      - belief: Instant finality means the chain cannot fail.
        reality: CometBFT trades liveness for safety - beyond a third faulty voting power the chain halts rather than reorging.
        why: The word finality is read as robustness.
        source: cosmos-sdk-docs
  - id: sdk-modules
    title: Modules, not contracts
    oneLine: A chain is assembled from modules compiled into its binary, each owning a slice of state and handling its own messages.
    statement: >
      A Cosmos SDK chain is composed of modules - bank, staking, gov, auth, and whatever you write - each
      owning a portion of a key-value store and handling its own message types. The unit of deployment is a
      module compiled into the chain binary, which means shipping new application logic means upgrading the
      chain, through governance, rather than deploying a contract permissionlessly. That is a different
      permission model, not just a different packaging format.
    volatility: evolving
    edges:
      - { to: cosmos-three-layers, type: requires }
      - { to: contract-account, type: contrasts }
    sources: [cosmos-sdk-docs]
    misconceptions:
      - belief: Cosmos chains all run smart contracts.
        reality: The default unit of deployment is a module compiled into the chain binary; contract support is an opt-in module many chains do not add.
        why: Every other ecosystem's unit of deployment is a contract.
        source: cosmos-sdk-docs
  - id: cosmwasm-is-optional
    title: CosmWasm is a choice, not a property
    oneLine: Chains that want deployable contracts add a module that runs Rust-compiled WebAssembly.
    statement: >
      CosmWasm is an SDK module that executes WebAssembly contracts written in Rust, giving a chain
      permissionless contract deployment. It is a per-chain decision: some chains include it, many do not, and
      whether you can deploy to a given Cosmos chain at all is therefore a question about that chain's module
      list rather than about Cosmos.
    volatility: evolving
    edges:
      - { to: sdk-modules, type: requires }
    sources: [cosmwasm-docs]
  - id: ibc-light-client-trust
    title: IBC trusts a light client, not a committee
    oneLine: Each chain verifies proofs of the counterparty's state with an on-chain light client of that chain.
    statement: >
      IBC is not a bridge with a multisig. Each chain runs a light client of its counterparty and verifies
      proofs of the other chain's state against consensus rules it checks itself, so the trust assumption is
      the counterparty's consensus rather than an external signer set. That is the single most transferable
      idea in this stub: the historic bridge catastrophes were committee bridges, and this is a structurally
      different design rather than a better-run version of the same one.
    volatility: evolving
    edges:
      - { to: cometbft-instant-finality, type: requires }
      - { to: bridge-is-the-honeypot, type: contrasts }
    sources: [ibc-spec, ibc-go-docs]
    misconceptions:
      - belief: IBC is a bridge, so it carries bridge risk.
        reality: IBC verifies counterparty state with an on-chain light client; there is no external signer set to compromise.
        why: A cross-chain transfer is assumed to mean a bridge, and most bridges are committees.
        source: ibc-spec
  - id: ibc-relayers-are-permissionless
    title: Relayers are liveness, not trust
    oneLine: Relayers move packets and proofs between chains but cannot forge them, so anyone can run one.
    statement: >
      A relayer watches both chains and submits packets and their proofs. It cannot fabricate a packet,
      because the receiving chain verifies the proof against its light client of the sender. Relayers are
      therefore a liveness dependency - if none run, nothing moves - and not a trust anchor, which is why they
      are permissionless and why "who runs the relayer" is a very different question from "who runs the
      bridge".
    volatility: evolving
    edges:
      - { to: ibc-light-client-trust, type: requires }
    sources: [ibc-spec, ibc-go-docs]
  - id: ibc-classic-vs-v2
    title: IBC Classic and IBC v2
    oneLine: The multi-step connection and channel handshake collapses into a simpler model in v2, released in 2025.
    statement: >
      IBC Classic required a connection and channel handshake per application before packets could flow,
      which was a substantial integration cost for each new pair of chains and each new application. IBC v2
      (Eureka), released in 2025, collapses that model to reduce complexity, and its first release was
      deliberately compatible with then-current SDK and CometBFT lines so chains could adopt it without a
      disruptive upgrade.
    volatility: hot
    edges:
      - { to: ibc-light-client-trust, type: requires }
    sources: [ibc-go-docs, cosmoslabs-eureka]
  - id: ibc-beyond-cosmos
    title: IBC outside Cosmos
    oneLine: Light-client verification implemented in Solidity turns IBC from an intra-Cosmos protocol into a general one.
    statement: >
      The strategic point of the v2 work is reach: implementations of IBC light-client verification for chains
      that are not Cosmos SDK chains, starting with Solidity implementations for Ethereum, with further
      targets on the roadmap. Whether Ethereum mainnet transfers over IBC are fully live is not settled by the
      research behind this stub and should be checked directly rather than assumed in either direction. The
      idea itself - verify the counterparty's consensus on chain instead of trusting a committee - is what
      transfers, whatever the current deployment status.
    volatility: hot
    edges:
      - { to: ibc-classic-vs-v2, type: requires }
    sources: [cosmos-stack-roadmap-2026, cosmoslabs-eureka]
