moduleId: altvm-move
concepts:
  - id: move-origin
    title: Where Move came from
    oneLine: A Rust-influenced contract language built at Meta for Diem, now the basis of Aptos and Sui.
    statement: >
      Move was designed for the Diem payments project and outlived it: when Diem was wound down, the language
      became the foundation of Aptos and Sui, built by separate teams from the same lineage. Knowing the
      origin explains the design - it was written for a permissioned payments system where representing assets
      correctly was the central requirement, which is why the type system is where its safety story lives
      rather than in libraries or conventions.
    volatility: stable
    edges:
      - { to: erc20-is-a-ledger, type: contrasts }
    sources: [move-book, move-language-repo]
  - id: move-resources-are-linear
    title: Resources are linear
    oneLine: A value the type system forbids from being copied or silently dropped - so an asset is a compiler guarantee.
    statement: >
      Move's central idea is the resource: a value that cannot be duplicated and cannot go out of scope
      without being explicitly consumed, moved or stored. "You cannot create tokens from nothing and cannot
      accidentally destroy them" is therefore checked by the compiler, not maintained by a developer keeping a
      balance mapping consistent. The contrast with ERC-20 is exact: there a token is a number, and every
      guarantee about that number is a property of the code around it.
    volatility: stable
    edges:
      - { to: move-origin, type: requires }
      - { to: erc20-is-a-ledger, type: contrasts }
    sources: [move-book]
    misconceptions:
      - belief: Linear types make Move contracts unhackable.
        reality: They eliminate accidental duplication and loss of assets; authorization logic, oracle design and economic bugs are untouched.
        why: Resource safety is oversold as safety in general.
        source: move-book
  - id: move-abilities
    title: The four abilities
    oneLine: Types carry copy, drop, store and key - omitting copy and drop is what makes a type asset-like.
    statement: >
      Rather than a single resource keyword, Move types are annotated with up to four abilities: `copy`
      permits duplication, `drop` permits being discarded, `store` permits being held inside other structs in
      storage, and `key` permits being stored at the top level of the global state. An asset is simply a
      struct with `store` and `key` but neither `copy` nor `drop`. The ability set is the thing to read first
      in unfamiliar Move code, the way the `Accounts` struct is in an Anchor program.
    volatility: stable
    edges:
      - { to: move-resources-are-linear, type: requires }
    sources: [move-book]
  - id: move-bytecode-verifier
    title: The bytecode verifier
    oneLine: Resource, type and reference safety are re-checked at deployment, so the guarantees survive hand-written bytecode.
    statement: >
      Move ships a verifier that checks resource, type and reference safety on the bytecode at publish time,
      not only in the source compiler. A module that was never compiled by the honest toolchain still cannot
      violate linearity. The EVM has no equivalent - it will execute any bytecode you deploy, and every
      guarantee you have about a contract comes from having seen and trusted its source.
    volatility: stable
    edges:
      - { to: move-resources-are-linear, type: requires }
      - { to: verification-is-bytecode-matching, type: contrasts }
    sources: [move-language-repo, move-book]
  - id: move-two-dialects
    title: There is no single Move
    oneLine: Aptos Move keeps account-rooted global storage; Sui Move removed global storage for an object model.
    statement: >
      "Move" names a family, not a portable target. Aptos Move retains Diem's account-rooted global storage.
      Sui Move removed global storage entirely and replaced it with objects. Language-level code can look
      similar; anything that touches storage does not port, and the two dialects have continued to diverge
      with their own editions and language extensions. Teach the resource model as the transferable idea and
      treat storage as chain-specific.
    volatility: evolving
    edges:
      - { to: move-origin, type: requires }
    sources: [aptos-move-docs, sui-docs-concepts]
    misconceptions:
      - belief: Move is one language, so a Move contract runs on both Aptos and Sui.
        reality: Sui Move removed global storage and added an object model; storage-facing code is not portable.
        why: A shared name and a shared origin.
        source: sui-docs-concepts
  - id: aptos-global-storage
    title: Aptos global storage
    oneLine: Resources live inside accounts and are addressed by (account address, type), at most one per type per account.
    statement: >
      In Aptos Move, a resource is stored under an account and retrieved by the pair of account address and
      type, using `move_to`, `borrow_global` and `move_from`. A given type can appear at most once per
      account, which makes "does this user have a X" a direct question with a direct answer. It is closer to
      the EVM's model than Solana's in one respect - the state is reached by the program rather than passed in
      - and closer to Solana in another, in that it lives outside the module that defines it.
    volatility: evolving
    edges:
      - { to: move-two-dialects, type: requires }
      - { to: state-externalized, type: contrasts }
    sources: [aptos-move-docs]
  - id: sui-object-model
    title: Sui objects
    oneLine: Every stateful thing is an object with a unique id, passed explicitly into transactions rather than fetched.
    statement: >
      Sui has no global storage to borrow from. Each stateful thing is an object carrying a globally unique
      identifier, and transactions take the objects they operate on as explicit inputs. That makes a
      transaction's read/write set statically visible before execution - the same property Solana obtains by
      making clients declare an account list, reached here through the language and type system instead of
      through a transaction format.
    volatility: evolving
    edges:
      - { to: move-two-dialects, type: requires }
      - { to: aptos-global-storage, type: contrasts }
      - { to: sealevel-declared-access, type: contrasts }
    sources: [sui-docs-concepts]
  - id: sui-owned-vs-shared
    title: Owned versus shared objects
    oneLine: Transactions touching only owned objects skip full consensus; shared objects require consensus ordering.
    statement: >
      A Sui object is address-owned, shared, immutable, or owned by another object. A transaction touching
      only objects owned by its sender has no ordering conflict with anyone else, so it can settle on a
      broadcast fast path without full consensus; touching a shared object requires consensus to order the
      competing accesses. Ownership is therefore not just an access-control property, it is a performance
      class - and application design decides which path your users get.
    volatility: evolving
    edges:
      - { to: sui-object-model, type: requires }
      - { to: account-lock-semantics, type: contrasts }
    sources: [sui-docs-concepts, sui-lutris]
  - id: aptos-block-stm
    title: Block-STM
    oneLine: Aptos executes optimistically, detects read/write conflicts afterwards, and re-executes the losers.
    statement: >
      Aptos parallelises with Block-STM: run transactions speculatively in parallel, track what each read and
      wrote, detect conflicts after the fact, and re-execute the transactions that lost. Nothing has to be
      declared in advance, which is easier on developers and clients, and the cost is wasted work under
      contention plus a latency profile that degrades differently from a lock-based scheduler. It is the exact
      opposite trade to Solana's, and confusing the two is the most common error when comparing these chains.
    volatility: evolving
    edges:
      - { to: aptos-global-storage, type: requires }
      - { to: conflict-is-static-not-dynamic, type: contrasts }
    sources: [aptos-move-docs, sui-lutris]
  - id: three-parallelism-strategies
    title: Three strategies, one problem
    oneLine: Declare and lock, execute and retry, or partition by ownership and skip consensus.
    statement: >
      Three chains solved concurrency three ways. Solana declares the read/write set up front and takes
      reader/writer locks, so conflicts are avoided and never retried, at the cost of forcing declaration on
      developers. Aptos executes optimistically and re-executes conflicting transactions, at the cost of
      wasted work. Sui partitions by object ownership and bypasses consensus for owned objects, at the cost of
      a data model where sharing is expensive by construction. Every one of them pays somewhere; the question
      for a given application is only where.
    volatility: evolving
    edges:
      - { to: aptos-block-stm, type: requires }
      - { to: sui-owned-vs-shared, type: requires }
      - { to: conflict-is-static-not-dynamic, type: requires }
      - { to: parallelism-requires-declaration, type: deepens }
    sources: [sui-lutris, aptos-move-docs, sui-docs-concepts]
    misconceptions:
      - belief: Sui and Aptos parallelise the same way because both are Move chains.
        reality: Aptos uses optimistic Block-STM with re-execution; Sui partitions by object ownership and bypasses consensus for owned objects.
        why: The language and the execution engine get conflated.
        source: sui-lutris
  - id: sui-ptb
    title: Programmable Transaction Blocks
    oneLine: One transaction chains many Move calls, feeding each call's outputs into the next - closer to a script than a call.
    statement: >
      A Sui transaction can compose a sequence of Move calls, passing the results of one as inputs to the
      next, all within a single atomic transaction. The unit of interaction is therefore a small program the
      client writes, not a single entrypoint on a single contract. On Ethereum, the same composition requires
      deploying a contract to perform it, or a batching wrapper; here it is the default transaction shape.
    volatility: evolving
    edges:
      - { to: sui-object-model, type: requires }
    sources: [sui-docs-concepts]
