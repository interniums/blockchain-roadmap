moduleId: altvm-parallel-execution
concepts:
  - id: sealevel-declared-access
    title: Declared read/write sets
    oneLine: The runtime knows a transaction's complete read/write set before executing its first instruction.
    statement: >
      Every Solana transaction carries the full list of accounts it will touch, each flagged writable or
      read-only. The scheduler reads that list, not the program, to decide what may run together. This is the
      mechanism behind everything else in the module: conflict detection, the per-account fee ceiling, and the
      requirement that clients resolve every address off-chain before submitting. It is also why an
      instruction cannot decide at runtime to touch an account nobody declared.
    volatility: stable
    edges:
      - { to: declared-account-access, type: requires }
      - { to: sealevel, type: deepens }
    sources: [anza-central-scheduler, solana-docs-fees]
  - id: account-lock-semantics
    title: Reader/writer locks on account keys
    oneLine: Many transactions may hold a read lock on one account at once; a write lock excludes every other lock.
    statement: >
      Scheduling conflict is decided by classic reader/writer locks taken over account keys derived from the
      declared list. Two transactions that both only read an account can be co-scheduled. A transaction that
      writes an account excludes every other transaction that reads or writes it, for the duration. So
      "will these run in parallel?" is answerable from the two account lists alone, with no reference to what
      the programs do - which is a property the EVM cannot offer, because there the answer depends on
      execution.
    volatility: stable
    edges:
      - { to: sealevel-declared-access, type: requires }
    sources: [anza-central-scheduler]
    misconceptions:
      - belief: Two transactions calling the same program cannot run in parallel.
        reality: The program account is read-only and executable; parallelism is decided by the writable data accounts, not by which program is invoked.
        why: On Ethereum "the same contract" is the unit of state, so it feels like the unit of contention.
        source: anza-central-scheduler
  - id: conflict-is-static-not-dynamic
    title: Pessimistic, not optimistic
    oneLine: Conflicts are detected before execution and avoided, never discovered during execution and retried.
    statement: >
      Because access is declared rather than discovered, Solana never has to abort and re-run a transaction
      because of a state conflict: the scheduler simply does not co-schedule conflicting work. This is the
      opposite strategy to optimistic concurrency, where transactions run speculatively, conflicting reads are
      detected afterwards, and losers re-execute. Both are called "parallel execution" and they behave very
      differently under contention - a pessimistic scheduler serializes and delays, an optimistic one burns
      work and retries.
    volatility: stable
    edges:
      - { to: account-lock-semantics, type: requires }
      - { to: aptos-block-stm, type: contrasts }
    sources: [anza-central-scheduler]
    misconceptions:
      - belief: Solana runs transactions in parallel by executing optimistically and re-running on conflict.
        reality: Solana is pessimistic - it takes reader/writer locks from the declared account list and does not co-schedule conflicting transactions.
        why: People port the Block-STM mental model from Aptos onto Solana because both are marketed as parallel.
        source: anza-central-scheduler
  - id: declared-access-is-a-tax
    title: Declaration is a tax on program design
    oneLine: A program cannot choose at runtime which account to touch, so every possible account must be passed in.
    statement: >
      The price of static conflict detection is paid by the developer. An instruction cannot follow a pointer
      it discovers mid-execution; the client must resolve every account address off-chain and include it,
      which pushes real logic into the client, makes dynamic data structures awkward, and bounds how much a
      single instruction can do. Transaction size limits then bound how many accounts you can pass at all.
      Much of what Anchor and IDLs exist to do is manage this client-side resolution burden.
    volatility: stable
    edges:
      - { to: sealevel-declared-access, type: requires }
    sources: [anza-central-scheduler, solana-docs-fees]
  - id: banking-stage-pipeline
    title: The leader's banking stage
    oneLine: There is no global mempool - transactions go to the current leader, who buffers, schedules, and records them.
    statement: >
      Solana has no gossiped pending pool that everyone can see. Clients send transactions over QUIC to the
      current leader (and often the next few leaders). There they pass signature verification, land in the
      leader's banking-stage buffer, are scheduled onto worker threads subject to account locks, and are
      recorded into Proof of History. Anything not scheduled before the leader's slots end is forwarded or
      dropped. The consequences run all the way to the application layer: no public pending mempool to watch,
      no "pending" state you can query globally, and landing rates that depend on your RPC path to the leader.
    volatility: evolving
    edges:
      - { to: sealevel-declared-access, type: requires }
      - { to: mempool-is-a-public-broadcast, type: contrasts }
    sources: [anza-central-scheduler, solana-docs-fees]
    misconceptions:
      - belief: Solana has a mempool that you can watch for pending transactions.
        reality: Transactions are sent to the leader directly and buffered there; there is no gossiped global pending pool.
        why: Every EVM tool assumes a mempool exists, so its absence is invisible until you look for pending transactions.
        source: anza-central-scheduler
  - id: central-scheduler
    title: Central scheduler
    oneLine: One scheduling thread with a global view hands non-conflicting batches to a pool of execution workers.
    statement: >
      Agave's banking stage uses a single dedicated scheduling thread that holds the whole buffered set,
      checks account-lock conflicts, and dispatches non-conflicting batches to worker threads. It shipped as
      an optional feature in Agave v1.18, replacing an earlier design in which several threads independently
      pulled from a shared queue and contended with each other. The important consequence is that ordering is
      decided centrally over one priority-ordered view of all buffered traffic - which is exactly why fee
      pressure on one account is not perfectly isolated from everything else.
    volatility: evolving
    edges:
      - { to: banking-stage-pipeline, type: requires }
    sources: [anza-central-scheduler]
  - id: greedy-scheduler-default
    title: The scheduler is an implementation, not a protocol
    oneLine: The default scheduling algorithm has already been replaced once, and differs between clients.
    statement: >
      The original central scheduler ordered work with a prio-graph dependency structure; later Agave releases
      made a simpler greedy scheduler the default because it packs blocks with less scheduling overhead. The
      exact release that flipped the default is not settled in the research for this course. Firedancer is a
      second production client with its own scheduler. The teachable point survives all of that: scheduling is
      client-specific, so any claim of the form "Solana's scheduler does X" is really "this client's scheduler
      currently does X", while "one scheduler thread, workers, account-lock conflict checks" remains the right
      mental model.
    volatility: hot
    edges:
      - { to: central-scheduler, type: requires }
    sources: [agave-banking-stage-source, firedancer-repo, anza-central-scheduler]
    misconceptions:
      - belief: Solana's scheduling algorithm is part of the protocol.
        reality: It is client software; Agave has changed its default algorithm and Firedancer implements its own.
        why: On a chain with one dominant client, client behaviour and protocol rules blur together.
        source: anza-central-scheduler
  - id: compute-unit-budget
    title: Compute units
    oneLine: Solana's gas - a per-transaction budget defaulting to 200k CU per instruction, raisable to 1.4M, with no refund.
    statement: >
      Compute units meter execution the way gas does. Without a ComputeBudget instruction a transaction gets a
      default allowance of 200,000 CU per instruction; a transaction may explicitly request up to 1.4M CU
      total. Exceeding the budget fails the transaction. Two differences from gas matter constantly: the limit
      is requested per transaction rather than implied by a gas limit you mostly over-set for free, and unused
      CU is not refunded, so the request itself is the thing you pay on.
    volatility: evolving
    edges:
      - { to: sealevel-declared-access, type: requires }
      - { to: gas-is-a-countdown, type: contrasts }
    sources: [anza-compute-units, solana-docs-fees]
  - id: priority-fee-formula
    title: Priority fee is requested CU times CU price
    oneLine: You are billed on the compute limit you asked for, not the compute you consumed.
    statement: >
      The prioritization fee equals the requested compute-unit price, in micro-lamports per CU, multiplied by
      the requested compute-unit limit. Consumption does not enter the formula. A transaction that lazily
      requests 1.4M CU and uses 40k pays the same priority fee as one that genuinely needs 1.4M, and seven
      times what a tuned 200k request would cost at the same price. Tuning the limit from a simulation
      reading plus a margin is therefore a direct, repeatable cost reduction, and it also improves scheduling
      because the leader reserves less block space for you.
    volatility: evolving
    edges:
      - { to: compute-unit-budget, type: requires }
      - { to: eip-1559-fee-fields, type: contrasts }
    sources: [anza-compute-units, solana-docs-fees]
    misconceptions:
      - belief: The priority fee is charged on the compute units actually consumed.
        reality: It is charged on the requested limit times the price; unused compute units are not refunded.
        why: The EVM refunds unused gas, so gas limits feel free to over-set.
        source: anza-compute-units
  - id: fees-charged-on-failure
    title: Included means paid
    oneLine: Base fee and priority fee are charged for any transaction the leader includes, including one that fails.
    statement: >
      A transaction that is included in a block pays its fees whether it succeeded or not - a base fee per
      signature (5,000 lamports per signature at the time of this research) plus any priority fee. Only
      transactions that never make it into a block cost nothing. This mirrors the EVM's "a revert still burns
      gas", but the more useful comparison for a developer is the third case Ethereum barely has: on Solana a
      large share of failures under load are transactions that were never included at all, and those are free
      and invisible.
    volatility: evolving
    edges:
      - { to: priority-fee-formula, type: requires }
      - { to: tx-gas-limit-vs-used, type: contrasts }
    sources: [solana-docs-fees]
  - id: per-account-write-cu-cap
    title: The 12M per-writable-account ceiling
    oneLine: One writable account may consume at most 12M compute units in a block, far below the block limit.
    statement: >
      Independently of the block-wide compute limit, no single writable account may account for more than 12M
      CU within one block. This cap is the mechanical basis of local fee markets: contention is bounded per
      account, so the auction for one hot account is separate from block capacity as a whole. The block limit
      rose to 100M CU (SIMD-0286, activated at epoch 1009 on 29 July 2026) while the per-account cap stayed at
      12M, so a single hot account's share of a block fell from roughly a fifth to about an eighth. Raising
      block capacity did not raise what one program's hot account can do.
    volatility: hot
    edges:
      - { to: account-lock-semantics, type: requires }
      - { to: compute-unit-budget, type: requires }
    sources: [solana-100m-cu-blocks, simd-repo]
    misconceptions:
      - belief: Raising the block compute limit raises how much a single hot program can do per block.
        reality: The 12M per-writable-account cap is separate from the block limit and did not move with it.
        why: Block capacity and per-account capacity are both "how much can happen per block".
        source: solana-100m-cu-blocks
  - id: local-fee-market
    title: Local fee markets
    oneLine: Because contention is per-account, a bidding war over one hot account is meant to leave unrelated traffic cheap.
    statement: >
      Ethereum's base fee is a single global price for block space: congestion anywhere raises the price for
      everyone. Solana's design intends the opposite - priority fees are bid per transaction, contention is
      bounded per writable account, so an NFT mint or a busy AMM pool should raise the price only for
      transactions touching those accounts. This is a real structural difference and it does produce
      measurably different fee floors on different accounts. It is also weaker in practice than the slogan,
      for reasons the next concept covers.
    volatility: evolving
    edges:
      - { to: per-account-write-cu-cap, type: requires }
      - { to: priority-fee-formula, type: requires }
      - { to: eip-1559-fee-fields, type: contrasts }
    sources: [solana-docs-fees, helius-local-fee-markets]
  - id: local-fee-markets-are-leaky
    title: Locality is imperfect
    oneLine: One global priority queue over shared workers and shared block space means a fee war on one account still degrades everyone.
    statement: >
      The scheduler orders a single global priority queue and dispatches to a shared pool of worker threads
      into shared block space. High-fee traffic concentrated on one account therefore outbids and delays
      unrelated low-fee traffic even though the two never touch the same account. Practitioners running
      order books have made this argument from measurement, and it is the honest correction to the marketing
      claim: fee markets on Solana are more local than Ethereum's, and less local than "congestion on one
      dApp never affects anyone else".
    volatility: evolving
    edges:
      - { to: local-fee-market, type: requires }
      - { to: central-scheduler, type: requires }
    claimKind: empirical
    sources: [helius-local-fee-markets, lightspeed-local-fee-markets]
    misconceptions:
      - belief: Local fee markets mean congestion on one application never affects anyone else.
        reality: A single global priority queue over shared worker threads and shared block space means a fee war on one account measurably degrades unrelated traffic.
        why: The marketing shorthand is repeated without the scheduler detail that qualifies it.
        source: helius-local-fee-markets
  - id: contention-failure-modes
    title: Dropped, not reverted
    oneLine: Under load the symptom is transactions that never landed - forwarded, discarded, or expired with their blockhash.
    statement: >
      When an EVM transaction fails you usually have a receipt saying why. Under Solana contention the common
      failure has no receipt at all: the transaction sat in the leader's buffer, was forwarded or discarded,
      and eventually became unusable because its recent blockhash aged out after roughly 150 blocks. Nothing
      reverted, no fee was charged, and no on-chain record exists. Client code has to treat "no confirmation
      within the blockhash lifetime" as a first-class outcome with its own retry strategy, distinct from a
      program error.
    volatility: evolving
    edges:
      - { to: banking-stage-pipeline, type: requires }
      - { to: local-fee-market, type: requires }
    sources: [solana-docs-fees, anza-central-scheduler]
    misconceptions:
      - belief: A transaction that fails under congestion reverted.
        reality: Most congestion failures were never included at all - dropped from the leader's buffer or expired when the blockhash aged out.
        why: EVM users equate "my transaction failed" with "it executed and reverted", because there the third case barely exists.
        source: solana-docs-fees
  - id: stake-weighted-qos
    title: Stake-weighted ingress
    oneLine: Leader ingress over QUIC is rationed by stake, so which RPC you send through changes whether you land.
    statement: >
      A leader's QUIC connection capacity is allocated in proportion to validator stake, reserving a large
      share of transaction ingress for connections originating from staked validators. A transaction
      submitted through an RPC provider with staked connections has a materially better chance of reaching
      the leader's buffer under load than one sent through an unstaked endpoint. This is why landing rates
      are an infrastructure decision on Solana rather than purely a fee decision, and it has no clean EVM
      analogue - the closest is private orderflow, which solves a different problem.
    volatility: evolving
    edges:
      - { to: banking-stage-pipeline, type: requires }
    sources: [solana-swqos-guide, anza-central-scheduler]
