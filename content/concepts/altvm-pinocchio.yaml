moduleId: altvm-pinocchio
concepts:
  - id: runtime-input-buffer
    title: The runtime input buffer
    oneLine: The SVM hands a program one flat serialized buffer - program id, account metadata and data, instruction data.
    statement: >
      When the runtime invokes a program it passes a single contiguous serialized region containing the
      program id, the number of accounts, each account's metadata and data, and the instruction data. Every
      framework's first act is to parse that buffer. Understanding this is the whole foundation of the module:
      the cost people attribute to "Solana programs" is largely the cost of turning that buffer into
      comfortable Rust values, and it is paid before a single line of application logic runs.
    volatility: stable
    edges:
      - { to: sealevel-declared-access, type: requires }
    sources: [pinocchio-repo, p-token-repo]
  - id: deserialize-vs-borrow
    title: Deserialize or borrow
    oneLine: The standard entrypoint copies the buffer into owned values; the alternative is to point into it.
    statement: >
      The standard `solana-program` entrypoint walks the input buffer and builds owned Rust values - a
      `Vec<AccountInfo>` with `Rc<RefCell<..>>` interior mutability - copying account data out of the buffer
      and allocating as it goes. The alternative is to construct references that point into the buffer where
      it already sits. Nothing about the program's behaviour changes; what changes is whether reading an
      account costs a copy plus an allocation or a pointer dereference.
    volatility: stable
    edges:
      - { to: runtime-input-buffer, type: requires }
    sources: [pinocchio-repo, helius-pinocchio]
  - id: pinocchio-what-it-is
    title: Pinocchio is a lower layer, not a rival framework
    oneLine: A zero-dependency Rust library from Anza that replaces the solana-program crate, not Anchor.
    statement: >
      Pinocchio is a library with no external dependencies that replaces `solana-program` as the crate an
      on-chain program is built on. It has no account model, no constraint DSL and no IDL, because it is not
      framework-shaped: it sits below where Anchor sits. Anchor and Pinocchio are not alternatives in the way
      two web frameworks are - a program can use Pinocchio CPI helper crates from otherwise-Anchor code. What
      it trades is every convenience, in exchange for compute units and binary size.
    volatility: evolving
    edges:
      - { to: program-is-stateless, type: requires }
      - { to: anchor-purpose, type: contrasts }
    sources: [pinocchio-repo]
    misconceptions:
      - belief: Pinocchio is a competing framework to Anchor.
        reality: It replaces the solana-program crate - a lower layer with no account model, no constraint DSL and no IDL.
        why: Both are "the thing you write a Solana program with".
        source: pinocchio-repo
  - id: pinocchio-zero-copy
    title: Zero-copy account access
    oneLine: Pinocchio's AccountInfo is a typed pointer into the runtime's input buffer.
    statement: >
      Rather than copying account data into owned structures, Pinocchio constructs typed pointers into the
      input buffer in place, so reading an account costs a dereference. The saving is not clever: it is the
      removal of work that was never necessary. The cost is that you are now reading raw bytes at pointers,
      which makes alignment, padding and lifetime correctness your responsibility rather than the
      serializer's.
    volatility: evolving
    edges:
      - { to: deserialize-vs-borrow, type: requires }
    sources: [pinocchio-repo, helius-pinocchio]
    misconceptions:
      - belief: Zero-copy just means faster.
        reality: It means reading raw bytes at pointers, so you inherit the alignment, padding and lifetime obligations a serializer was handling for you.
        why: The term is marketed as a pure win.
        source: pinocchio-repo
  - id: entrypoint-is-the-big-win
    title: The overhead was the whole story
    oneLine: Roughly 70% of p-token's measured savings came from replacing the entrypoint and reading accounts zero-copy.
    statement: >
      About seventy per cent of the compute saved in p-token came from two changes that touch no application
      logic at all: replacing the standard entrypoint and reading accounts without copying. The lesson
      generalises past Solana - the dominant cost in a hot path was framework overhead that nobody had
      measured, not the algorithm everyone was looking at. It also sets the expectation correctly for your
      own program: if your instruction does substantial work, your ceiling on savings is much lower than
      p-token's.
    volatility: evolving
    edges:
      - { to: pinocchio-zero-copy, type: requires }
    sources: [helius-pinocchio, p-token-repo]
    misconceptions:
      - belief: The compute savings came from clever program logic.
        reality: Most of them came from the entrypoint and zero-copy account reading - pure framework overhead, before any business logic runs.
        why: People assume the algorithm is where the cost is.
        source: helius-pinocchio
  - id: repr-c-state-casting
    title: repr(C) state casting
    oneLine: On-chain state is a C-layout struct cast onto the account's byte slice instead of Borsh-decoded.
    statement: >
      Pinocchio programs define state as `#[repr(C)]` structs and cast them directly onto the account data
      slice. There is no serializer deciding the layout for you, so field order, alignment, padding bytes and
      endianness are yours to get right, and any change to the struct is a change to the on-chain format with
      no version tag unless you write one. Anchor's `zero_copy` is the same technique applied to one account;
      Pinocchio applies it to the whole program.
    volatility: evolving
    edges:
      - { to: pinocchio-zero-copy, type: requires }
      - { to: anchor-zero-copy-escape-hatch, type: contrasts }
    sources: [pinocchio-repo, p-token-repo]
  - id: no-allocator-no-panic-handler
    title: Dropping the allocator and the panic handler
    oneLine: Opting out of the default bump allocator and standard panic handler shrinks the binary and removes per-invocation setup.
    statement: >
      Pinocchio lets a program declare that it uses no allocator and no standard panic handler. A program
      that never heap-allocates does not need the default bump allocator installed on every invocation, and a
      program whose failures are error codes rather than panics does not need the panic machinery linked in.
      The effects are a smaller deployed binary - which is itself rent paid - and less fixed setup cost per
      call.
    volatility: evolving
    edges:
      - { to: pinocchio-what-it-is, type: requires }
      - { to: rent-exemption, type: applies }
    sources: [pinocchio-repo, helius-pinocchio]
  - id: no-automatic-validation
    title: No checks are generated for you
    oneLine: No owner check, no signer check, no discriminator check, no writability check - unless you write it.
    statement: >
      Pinocchio validates nothing about the accounts it hands you. Every guarantee Anchor derives from a
      constraint - owner equals program id, discriminator matches, this account signed, this account is
      writable, this key equals the field stored in that account - has to be written by hand, in the right
      order, in every instruction. The classic Solana vulnerability classes are not historical for a Pinocchio
      program; they are live, and they are yours.
    volatility: evolving
    edges:
      - { to: pinocchio-what-it-is, type: requires }
      - { to: constraints-are-generated-code, type: contrasts }
      - { to: account-wrapper-does-three-checks, type: contrasts }
    sources: [pinocchio-repo, p-token-repo]
  - id: no-idl-by-default
    title: No IDL falls out of the build
    oneLine: A Pinocchio program emits no interface description, so client generation needs a hand-written or annotated one.
    statement: >
      Because there are no macros describing instructions and accounts, nothing describes the program's
      interface after the build. Clients must be written against a hand-maintained interface description, or
      the program must be annotated with a separate tool to produce one. The practical cost is not the
      writing - it is that the description can drift from the program with nothing to catch it, which is
      precisely the failure mode a generated IDL exists to prevent.
    volatility: evolving
    edges:
      - { to: idl-is-the-abi, type: requires }
      - { to: idl-published-on-chain, type: contrasts }
    sources: [shank-idl-generator, pinocchio-repo]
  - id: pinocchio-security-tradeoff
    title: The trade is a budget decision
    oneLine: You move from "the framework catches the standard bugs" to "an auditor must", which costs money, not style points.
    statement: >
      Choosing Pinocchio moves account validation from generated code that is correct by construction to
      hand-written code that is correct by review. That is a decision about audit budget and team experience
      as much as about compute units. The honest framing for a team: if you cannot fund a review that
      specifically enumerates owner, signer, discriminator and relational checks per instruction, the compute
      saving is not free, it is borrowed.
    volatility: evolving
    edges:
      - { to: no-automatic-validation, type: requires }
      - { to: anchor-costs-compute, type: contrasts }
    sources: [neodyme-p-token-audit, pinocchio-repo]
  - id: p-token-case-study
    title: p-token
    oneLine: SPL Token rewritten in Pinocchio - transfer from about 4,645 CU to about 76, transfer_checked from about 6,200 to about 105.
    statement: >
      p-token is the SPL Token program reimplemented on Pinocchio with identical behaviour. Its `transfer`
      instruction dropped from roughly 4,645 compute units to roughly 76, and `transfer_checked` from roughly
      6,200 to roughly 105 - on the order of 95-98% less compute for the same semantics. Because token
      transfers are the single most invoked operation on the network, and because most of them happen by CPI
      inside other programs' transactions, this is the largest compute saving anyone has shipped on Solana.
    volatility: evolving
    edges:
      - { to: pinocchio-what-it-is, type: requires }
      - { to: entrypoint-is-the-big-win, type: requires }
    sources: [solana-upgrades-p-token, p-token-repo, simd-0266]
  - id: protocol-level-swap
    title: Swapped in behind the same address
    oneLine: SIMD-0266 replaced the token program's implementation at its existing address, so every caller got the saving for free.
    statement: >
      p-token was adopted through SIMD-0266 as a replacement implementation behind the existing token program
      address, activated at epoch 971 in 2026 and requiring validators to run a minimum client version. No
      wallet, dApp or token had to change anything to get the savings. Reported network-wide effect varies by
      source and measurement window - one framing is around a tenth of blockspace freed, another around
      twelve per cent of all chain compute including votes over a specific sampling window - and the two
      figures measure different things and should not be merged. Contrast this with Ethereum, where an
      improved ERC-20 implementation reaches only tokens deployed afterwards.
    volatility: evolving
    edges:
      - { to: p-token-case-study, type: requires }
      - { to: erc20-is-a-ledger, type: contrasts }
    sources: [simd-0266, solana-upgrades-p-token]
    misconceptions:
      - belief: You must migrate your program to Pinocchio to get the token savings.
        reality: The implementation was swapped behind the existing token program address, so the savings are automatic for every existing caller.
        why: Normal software upgrades require callers to change something.
        source: solana-upgrades-p-token
  - id: pinocchio-maturity
    title: Pre-1.0, and running the busiest program on the network
    oneLine: Version numbers say alpha; the deployment record says otherwise.
    statement: >
      The `pinocchio` crate is still in a pre-1.0 line (0.11.x at the time of this research), with satellite
      crates for system, token, token-2022 and associated-token-account versioning independently. It is
      maintained by Anza, the code built on it has passed third-party audit, and it now executes the
      network's highest-volume program. Version numbers are a poor maturity signal here; audit history and
      deployment footprint are better ones.
    volatility: hot
    edges:
      - { to: pinocchio-what-it-is, type: requires }
    sources: [pinocchio-releases, neodyme-p-token-audit]
    misconceptions:
      - belief: Pinocchio is experimental and unproven because it is pre-1.0.
        reality: It is Anza-maintained, third-party audited, and running the highest-volume program on the network.
        why: 0.x version numbers read as alpha.
        source: pinocchio-releases
  - id: when-pinocchio-pays
    title: Frequency decides
    oneLine: Fixed per-invocation overhead only matters where invocations are constant - primitives, not application logic.
    statement: >
      Framework overhead is a fixed cost per invocation, so removing it pays in proportion to how often you
      are invoked. That points at token primitives, DEX hot paths and oracles - programs called constantly and
      called by CPI inside other people's transactions - and points away from low-frequency application logic
      where the overhead is a rounding error against the work being done. The practical consequence for most
      teams is that they should benefit from Pinocchio without writing it.
    volatility: evolving
    edges:
      - { to: entrypoint-is-the-big-win, type: requires }
      - { to: compute-unit-budget, type: requires }
    sources: [helius-pinocchio, solana-upgrades-p-token]
  - id: cu-headroom-is-the-real-prize
    title: The prize is headroom, not fees
    oneLine: Cheaper instructions buy room under the 1.4M per-transaction and 12M per-account ceilings, not meaningful fee savings.
    statement: >
      Solana fees are small enough that compute savings rarely matter as money. What they buy is room: a
      single transaction can compose more instructions under the 1.4M CU limit, and a hot writable account can
      serve more users per block under the 12M cap. That is throughput and composability, and it is the
      correct argument to make internally - "our swap is cheaper" is weaker and less true than "our pool can
      serve three times as many users in one block".
    volatility: evolving
    edges:
      - { to: when-pinocchio-pays, type: requires }
      - { to: per-account-write-cu-cap, type: requires }
    sources: [solana-upgrades-p-token, anza-compute-units]
    misconceptions:
      - belief: Fewer compute units mainly saves users money.
        reality: The meaningful gain is headroom under the per-transaction and per-account limits - throughput and composability, not fees.
        why: Gas-cost intuition imported from Ethereum, where the fee is the whole point.
        source: solana-upgrades-p-token
