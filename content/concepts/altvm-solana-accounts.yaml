moduleId: altvm-solana-accounts
concepts:
  - id: solana-account
    title: Solana account
    oneLine: The single unit of state - an addressed record holding lamports, a data blob, and the program id that owns it.
    statement: >
      Everything on Solana is an account: a record at a 32-byte address (usually shown base58-encoded)
      holding a lamport balance, an arbitrary data buffer, an `executable` flag, and an `owner` field naming
      the program allowed to change its data. Wallets are accounts, programs are accounts whose data is
      compiled code, and every piece of application state is an account. The owner field is the load-bearing
      part: the runtime enforces only that a program may not write to accounts it does not own, so an
      account's contents are meaningful only in the context of its owner.
    volatility: stable
    edges:
      - { to: account, type: requires }
      - { to: state-externalized, type: deepens }
    sources: [solana-sealevel-note, chainstack-solana-architecture]
    misconceptions:
      - belief: An account address is like a contract address - it identifies code.
        reality: Most accounts hold only data; the code lives in a separate executable account named by the owner field.
        why: On Ethereum an address either has code or does not, and that is the whole taxonomy.
        source: chainstack-solana-architecture
  - id: state-externalized
    title: State lives outside the program
    oneLine: Where Ethereum keeps storage inside a contract, Solana makes each piece of state its own addressable account.
    statement: >
      An EVM contract owns a private key-value store; a balance for user X is a slot inside that contract and
      is reachable only by calling it. On Solana the equivalent state is a separate account with its own
      address, owned by the program but stored outside it. This is the core contrast of the whole track. It
      means state can be read directly by any client without invoking the program, that the set of state
      objects an operation touches is enumerable as a list of addresses, and that "which account is this"
      becomes an authorization question the program must answer for itself.
    volatility: stable
    edges:
      - { to: solana-account, type: requires }
      - { to: storage-slot, type: contrasts }
      - { to: state-as-keyvalue, type: contrasts }
    sources: [solana-sealevel-note, quicknode-solana-for-evm-devs]
    misconceptions:
      - belief: Solana accounts are just a different name for storage slots.
        reality: A storage slot is addressable only through its contract; an account is addressable globally and passed in per call.
        why: Both are "where the numbers live", so the difference in reachability is easy to miss.
        source: solana-sealevel-note
  - id: program-is-stateless
    title: Programs are stateless
    oneLine: A Solana program holds no state of its own; every byte it reads or writes arrives as an account in the instruction.
    statement: >
      A deployed Solana program is code and nothing else. It cannot reach into storage the way a Solidity
      function reaches a state variable, because it has no storage - all state it operates on is passed in as
      accounts by the caller. The consequence for design is severe: the client must know, before building the
      transaction, every account the instruction will need, and the program must validate each one, because
      the caller chose them. Porting a Solidity contract instruction-for-instruction produces bad Solana code
      precisely because Solidity lets the callee decide what state to touch and Solana does not.
    volatility: stable
    edges:
      - { to: state-externalized, type: requires }
      - { to: contract-account, type: contrasts }
    sources: [solana-sealevel-note, quicknode-solana-for-evm-devs]
    misconceptions:
      - belief: A Solana program is a smart contract with a different syntax.
        reality: Programs are stateless; state lives in accounts passed in per call, so the data model has to be redesigned rather than translated.
        why: Both are "code deployed on a chain that owns user funds".
        source: quicknode-solana-for-evm-devs
  - id: pda
    title: Program Derived Address
    oneLine: An address with no private key, derived from seeds plus a program id, that only that program can sign for.
    statement: >
      A Program Derived Address is derived by hashing a set of seeds together with a program id and a bump
      byte, and is deliberately pushed off the ed25519 curve so no private key exists for it. Nobody can sign
      for it with a keypair; the owning program signs for it by supplying the same seeds at invocation time.
      PDAs are how a stateless program gets state it exclusively controls - vaults, per-user records,
      configuration - and how it gets a deterministic address a client can recompute offline. The seeds are
      the schema: `[b"vault", user_pubkey]` is the Solana spelling of `mapping(address => Vault)`.
    volatility: stable
    edges:
      - { to: program-is-stateless, type: requires }
      - { to: create2-address, type: contrasts }
    sources: [solana-docs-pda, solana-sealevel-note, chainstack-solana-architecture]
    misconceptions:
      - belief: A PDA is an account the program owns automatically, so passing one is safe.
        reality: Anyone can pass any account; a PDA is only trustworthy once the program re-derives the address from seeds and compares.
        why: The phrase 'program derived' sounds like a runtime guarantee rather than something the program must check.
        source: chainstack-solana-architecture
  - id: rent-exemption
    title: Rent exemption
    oneLine: Storing data costs a refundable lamport deposit sized to the data; funded accounts are never purged.
    statement: >
      An account must hold a minimum lamport balance proportional to its data size to be rent-exempt. The
      deposit is not a fee: it is returned in full when the account is closed and its lamports are drained.
      Account data is capped at 10 MiB. The design makes state growth self-limiting - unlike Ethereum, where
      storage is paid for once at write time and then persists free of charge - and it makes account closure
      an economically meaningful action, since the rent is what the closer gets back. It also means every
      account creation has a funder, and the funder is a decision your program has to make explicitly.
    volatility: stable
    edges:
      - { to: solana-account, type: requires }
      - { to: state-growth-problem, type: contrasts }
    sources: [solana-docs-accounts, solana-sealevel-note]
    misconceptions:
      - belief: Rent is an ongoing fee that drains an account over time.
        reality: Rent-exemption is a refundable deposit sized to the data; an exempt account never loses lamports to rent.
        why: The name says rent, and rent is normally recurring.
        source: solana-sealevel-note
  - id: declared-account-access
    title: Declared account access
    oneLine: Every transaction lists, in advance, each account it will touch and whether it needs write access.
    statement: >
      A Solana transaction carries an explicit list of account keys plus flags marking which are signers and
      which are writable. The runtime therefore knows the complete read/write set of a transaction before
      executing a single instruction. Ethereum's EIP-2930 access list is superficially similar but is only a
      gas-pricing hint - the EVM still discovers what a transaction touches by running it, and a transaction
      may touch state its access list never mentioned. On Solana the declaration is binding: touching an
      undeclared account is an error, not a surcharge.
    volatility: stable
    edges:
      - { to: state-externalized, type: requires }
      - { to: access-list, type: contrasts }
    sources: [solana-sealevel-note, gridplus-accounts-sealevel-spl]
    misconceptions:
      - belief: An EVM access list and a Solana account list are the same mechanism.
        reality: The access list is an optional pricing hint; the Solana account list is mandatory and enforced.
        why: Both are "a list of accounts attached to a transaction".
        source: solana-sealevel-note
  - id: sealevel
    title: Sealevel
    oneLine: The runtime that executes non-overlapping transactions simultaneously across cores because it already knows what each will touch.
    statement: >
      Sealevel is Solana's execution environment. Because each transaction's read/write set is declared, the
      runtime can sort transactions into batches that do not conflict and run those batches concurrently
      across CPU cores, rather than executing one transaction at a time in listed order. Two transactions
      conflict when one writes an account the other reads or writes; transactions over disjoint accounts, or
      that only read the same account, may proceed together. Parallelism here is a scheduling result, not a
      language feature - nothing in the program says "run me in parallel".
    volatility: stable
    edges:
      - { to: declared-account-access, type: requires }
      - { to: utxo-parallelism, type: contrasts }
    sources: [solana-sealevel-note]
    misconceptions:
      - belief: Solana is fast because of better hardware or fewer validators.
        reality: The architectural reason is declared account access, which lets the scheduler run non-conflicting transactions at the same time.
        why: Throughput differences are usually explained by decentralisation trade-offs, and sometimes that is the answer - but not the mechanism here.
        source: solana-sealevel-note
  - id: parallelism-requires-declaration
    title: Parallelism is bought with declaration
    oneLine: Any chain that executes in parallel has to learn the read/write set first - Solana asks the developer, Ethereum is starting to ask the block.
    statement: >
      There is no parallel execution without prior knowledge of what each transaction touches. Solana gets it
      by making the developer and client declare it per transaction. Ethereum's EIP-7928 Block-Level Access
      Lists get it by having the block declare every account and slot it will touch, so clients can schedule
      non-conflicting transactions concurrently on the L1. The two ecosystems reached the same requirement
      from opposite directions, which is the honest framing for this whole track: these are different
      answers to shared constraints, not a better and a worse chain.
    volatility: evolving
    edges:
      - { to: sealevel, type: requires }
      - { to: block-level-access-list, type: contrasts }
      - { to: bal-enables-parallelism, type: contrasts }
    sources: [eip-7928, solana-sealevel-note]
    misconceptions:
      - belief: Ethereum and Solana made opposite architectural choices with no convergence.
        reality: Block-level access lists bring declared access to Ethereum at block granularity - the same insight arriving by a different route.
        why: The ecosystems are usually presented as rivals rather than as parallel engineering efforts.
        source: solana-sealevel-note
