moduleId: altvm-solana-security
concepts:
  - id: accounts-are-untrusted-input
    title: Accounts are untrusted input
    oneLine: The runtime guarantees the signatures are valid and that you cannot write what you do not own - nothing else.
    statement: >
      Every account in a Solana instruction was chosen by whoever built the transaction. The runtime verifies
      the transaction's signatures and refuses writes to accounts a program does not own; it makes no claim
      that an account is the one you meant, holds the data you expect, or has any relationship to the caller.
      Treat the account list the way you would treat calldata: fully attacker-controlled, structurally valid,
      semantically meaningless until your program proves otherwise.
    volatility: stable
    edges:
      - { to: declared-account-access, type: requires }
      - { to: solana-account, type: requires }
      - { to: access-control-failure, type: contrasts }
    sources: [sealevel-attacks, fuzz-on-the-beach]
    misconceptions:
      - belief: Solana programs cannot have reentrancy, so they are safer than Solidity contracts.
        reality: Self-recursive CPI is restricted, but the account-validation class has no EVM equivalent and has cost more money on Solana than reentrancy ever did on Ethereum.
        why: People compare a new platform against the vulnerability list they already know.
        source: sealevel-attacks
  - id: three-questions-per-account
    title: The three questions
    oneLine: Who owns it, did it sign, and is it the specific instance this operation is about.
    statement: >
      For every account an instruction touches, a program must be able to answer three questions: which
      program owns it, whether it signed the transaction, and whether it is the particular instance the caller
      is entitled to act on. Nearly every classic Solana exploit is a missing answer to exactly one of them.
      The third is the one people skip, because owner and discriminator checks feel like completeness -
      they establish what an account is, and say nothing about whose it is.
    volatility: stable
    edges:
      - { to: accounts-are-untrusted-input, type: requires }
    sources: [sealevel-attacks, helius-solana-security-guide, neodyme-workshop]
    misconceptions:
      - belief: An eight-byte discriminator plus an owner check means the right account was passed.
        reality: Those prove the type and the owner; a relational check is what proves it is the caller's account.
        why: Two of the three questions feel like all three.
        source: sealevel-attacks
  - id: missing-owner-check
    title: Missing owner check
    oneLine: Trusting an account's data without checking its owner lets an attacker fabricate the contents.
    statement: >
      Reading an account's data and acting on it without asserting `account.owner == program_id` means an
      attacker can create an account under a program they control, write whatever bytes make your logic do
      what they want, and pass it in. Crema Finance lost roughly $8.8M in July 2022 to exactly this: a forged
      tick account supplying fake price data. `Account<'info, T>` performs this check on construction, which
      is why the class is largely historical for Anchor programs and entirely live for programs that leave it.
    volatility: stable
    edges:
      - { to: three-questions-per-account, type: requires }
      - { to: account-wrapper-does-three-checks, type: contrasts }
      - { to: no-automatic-validation, type: applies }
    sources: [sealevel-attacks, fuzz-on-the-beach, helius-solana-hacks]
  - id: missing-signer-check
    title: Missing signer check
    oneLine: Treating an account as an authority without checking is_signer lets anyone name the victim as the authority.
    statement: >
      An account being named as the authority in an instruction proves nothing; only the `is_signer` flag
      proves the key holder consented. A program that reads an authority field and acts on it without
      checking that the authority actually signed lets any caller name any victim. This is the Solana spelling
      of a missing `msg.sender` check, with the extra hazard that there is no implicit sender to fall back
      on - the concept exists only if you assert it.
    volatility: stable
    edges:
      - { to: three-questions-per-account, type: requires }
      - { to: typed-account-wrappers, type: contrasts }
    sources: [sealevel-attacks, fuzz-on-the-beach]
  - id: account-type-confusion
    title: Type confusion, or type cosplay
    oneLine: Two account types with compatible layouts and the same owner are substitutable unless a discriminator separates them.
    statement: >
      If a program defines two account types with byte-compatible layouts, both owned by the program, then an
      account of one type can be passed where the other is expected - the owner check passes and the
      deserialization succeeds. An eight-byte discriminator is what makes the two distinguishable. The
      Wormhole exploit of February 2022, which minted 120,000 wETH, is the canonical relative of this class:
      a spoofed account supplied fabricated data that looked like a successful signature verification.
    volatility: stable
    edges:
      - { to: missing-owner-check, type: requires }
      - { to: eight-byte-discriminator, type: contrasts }
    sources: [sealevel-attacks, helius-solana-hacks]
  - id: account-substitution
    title: Account substitution
    oneLine: The right type, the right owner, someone else's instance - and only a relational check catches it.
    statement: >
      Distinct from type confusion: the attacker passes a completely legitimate account of exactly the right
      type - another user's vault, another pool's reserve. Owner and discriminator checks both pass. Only a
      relational check catches it: `has_one` binding the account to its authority, or re-deriving the address
      from seeds that include the caller. Cashio, in March 2022, lost a reported $48-53M to a version of this
      - one link in a chain of accounts had its mint field never validated, so worthless collateral minted a
      stablecoin without limit. Validating the first account in a chain is not validating the chain.
    volatility: stable
    edges:
      - { to: three-questions-per-account, type: requires }
      - { to: has-one-links-accounts, type: contrasts }
    sources: [sealevel-attacks, helius-solana-hacks]
  - id: arbitrary-cpi
    title: Arbitrary CPI
    oneLine: CPI-ing into whatever program account you were handed lets an attacker substitute one that reports success.
    statement: >
      If a program takes "the token program" as an account and invokes it, an attacker can pass a program of
      their own that returns success without moving anything - the deposit is credited, the transfer never
      happened. The fix is an explicit program-id assertion, or a typed wrapper that performs it. The EVM
      analogue is calling into an address supplied by the caller: same shape, same conclusion, and here the
      account model makes it the default rather than an unusual pattern.
    volatility: stable
    edges:
      - { to: accounts-are-untrusted-input, type: requires }
      - { to: typed-account-wrappers, type: contrasts }
      - { to: delegatecall-is-the-proxy-primitive, type: contrasts }
    sources: [sealevel-attacks, cantina-securing-solana]
  - id: sysvar-address-must-be-checked
    title: Sysvars must be checked by address
    oneLine: A forged sysvar account with fabricated contents is accepted unless you verify the address.
    statement: >
      Sysvars - the clock, rent, and especially the instructions sysvar used for introspection - are read like
      any other account, so a program that reads one without verifying the account's address will happily read
      an attacker's fabrication. Wormhole's February 2022 loss of 120,000 wETH came from a signature
      verification routine using a loader variant that did not check the instructions sysvar's address. The
      fix was the checked variant of the same call, which is a useful reminder that the safe and unsafe
      versions of these APIs often differ by one word.
    volatility: stable
    edges:
      - { to: missing-owner-check, type: requires }
    sources: [sealevel-attacks, helius-solana-hacks]
  - id: pda-seed-collision
    title: PDA seed collision
    oneLine: Concatenating variable-length seeds without delimiters makes distinct inputs derive the same address.
    statement: >
      Seeds are concatenated bytes. Two variable-length seeds joined without a delimiter or fixed width make
      ("ab","c") and ("a","bc") produce the same byte string and therefore the same PDA, so one user's
      account becomes reachable through another user's parameters. The fix is fixed-width or length-prefixed
      seeds. The failure is quiet - nothing errors, the derivation simply lands somewhere it should not, which
      is why it survives review by people who checked that the seeds constraint was present.
    volatility: stable
    edges:
      - { to: pda, type: requires }
      - { to: seeds-bump-constraint, type: requires }
    sources: [sealevel-attacks, cantina-securing-solana]
  - id: canonical-bump-matters
    title: Canonical bumps
    oneLine: Several bumps can be valid for one seed set, so accepting a user-supplied bump admits several distinct PDAs.
    statement: >
      For a given set of seeds more than one bump byte can yield a valid off-curve address; only the canonical
      one - the highest, the one address derivation returns - is unique. A program that takes the bump as an
      instruction argument and derives from it therefore admits several distinct accounts for one logical key,
      which is a double-accounting bug waiting to be found. Store the canonical bump when the account is
      created and use the stored value thereafter.
    volatility: stable
    edges:
      - { to: pda, type: requires }
      - { to: seeds-bump-constraint, type: contrasts }
    sources: [sealevel-attacks, cantina-securing-solana]
  - id: reinitialization-attack
    title: Reinitialization
    oneLine: An account that can be initialized twice can have its balances zeroed and its authority replaced.
    statement: >
      If an initializing instruction can run a second time on a live account, it resets that account's state -
      zeroing balances, replacing the authority with the caller's. This is why `init_if_needed` requires an
      explicit guard on an already-initialized field, and why it is gated behind a feature flag: the framework
      cannot know which of your fields must survive. The class is a strict superset of the Ethereum
      uninitialized-proxy problem, because here any account can be a target, not only a proxy.
    volatility: stable
    edges:
      - { to: init-vs-init-if-needed, type: requires }
    sources: [sealevel-attacks, helius-solana-security-guide]
  - id: account-revival-attack
    title: Account revival
    oneLine: Draining an account's lamports does not delete it; within the same transaction the rent can be refunded and the stale data kept.
    statement: >
      An account is garbage-collected by the runtime at the end of a transaction when its lamport balance is
      zero. Until then the data is still there, so an attacker can call your close instruction and, in the
      same transaction, transfer rent back in - leaving an account that your program believes is closed,
      still holding its old contents. Correct closure zeroes the data and writes a closed discriminator, which
      is what Anchor's `close` constraint does.
    volatility: stable
    edges:
      - { to: rent-exemption, type: requires }
      - { to: constraints-are-generated-code, type: applies }
    sources: [sealevel-attacks]
    misconceptions:
      - belief: Closing an account by transferring out its lamports deletes it.
        reality: The data survives until the runtime collects it at end of transaction, so an attacker can refund rent in the same transaction and revive it with stale state.
        why: The intuition that no lamports means gone is natural, and wrong.
        source: sealevel-attacks
  - id: duplicate-mutable-accounts
    title: The same account passed twice
    oneLine: Aliasing two parameters turns "transfer from A to B" into a self-transfer that credits without debiting.
    statement: >
      Nothing stops a caller supplying the same account key for two different parameters. If an instruction
      loads "source" and "destination" separately, mutates both, and writes both back, the second write can
      overwrite the first - crediting the destination without the debit ever persisting. The check is one
      line, `from.key() != to.key()`, and its absence is invisible in a test suite that only ever passes
      distinct accounts.
    volatility: stable
    edges:
      - { to: accounts-are-untrusted-input, type: requires }
    sources: [sealevel-attacks]
  - id: rust-overflow-not-automatic
    title: Rust does not check arithmetic in release
    oneLine: Release builds wrap silently unless overflow-checks is enabled or checked arithmetic is used.
    statement: >
      Rust panics on integer overflow in debug builds and wraps silently in release builds unless
      `overflow-checks` is turned on. Programs are deployed as release builds. "Rust is a safe language" is
      about memory, not arithmetic, and a balance subtraction that wraps to a huge number is the same bug
      Solidity had before 0.8 made checked arithmetic the default - reintroduced by a build profile rather
      than by a language decision.
    volatility: stable
    edges:
      - { to: accounts-are-untrusted-input, type: requires }
      - { to: sol-panic-codes, type: contrasts }
    sources: [rust-cargo-profiles, cantina-securing-solana]
    misconceptions:
      - belief: Rust prevents integer overflow.
        reality: Release builds wrap silently unless overflow-checks is set or checked arithmetic is used explicitly.
        why: Rust's debug-build panic behaviour is what people remember from learning the language.
        source: cantina-securing-solana
  - id: not-all-exploits-are-code
    title: The money stopped leaving through the code
    oneLine: The largest recent Solana losses came from collateral and oracle design and from compromised privileged signers, not account validation.
    statement: >
      The classic validation classes are largely closed for programs that use Anchor, and the losses moved.
      Loopscale, April 2025, roughly $5.8M: the internal pricing of a collateral token was manipulated to take
      undercollateralised loans, with no missing check anywhere. Mango Markets, October 2022, roughly $114M:
      an oracle moved on thin liquidity and borrowed against. Drift, April 2026, reported between roughly
      $270M and $285M depending on the valuation snapshot: audited, uncompromised contracts. A curriculum that
      stops at "check the owner" is teaching 2022. The counter-pressure is real too - programs that leave
      Anchor for a lower layer re-open every classic class at once.
    volatility: hot
    edges:
      - { to: three-questions-per-account, type: requires }
      - { to: oracle-manipulation, type: contrasts }
      - { to: audit-is-not-a-guarantee, type: applies }
      - { to: pinocchio-security-tradeoff, type: applies }
    claimKind: empirical
    sources: [helius-solana-hacks, halborn-loopscale, chainalysis-drift]
    misconceptions:
      - belief: An audited protocol with no code bug cannot lose hundreds of millions.
        reality: Drift's contracts were audited and uncompromised; the loss came from socially engineered pre-signed transactions and a fabricated collateral asset.
        why: Audits are sold, and bought, as the security boundary.
        source: chainalysis-drift
  - id: durable-nonce-as-attack-surface
    title: Durable nonces never expire
    oneLine: A signature obtained by deception under a durable nonce stays executable indefinitely.
    statement: >
      Ordinary Solana transactions reference a recent blockhash and become unusable after roughly 150 blocks.
      A durable nonce account replaces that with a stored nonce, so a signed transaction remains valid until
      the nonce advances - by design, for offline and multi-party signing. It is also the mechanism behind the
      largest 2026 Solana loss: after months of social engineering and device compromise, Drift's security
      council signers were induced to pre-sign durable-nonce transactions that looked routine and carried
      hidden administrative authorizations, which were held and executed later. Signature expiry is an
      operational control, and this feature removes it.
    volatility: hot
    edges:
      - { to: contention-failure-modes, type: requires }
      - { to: not-all-exploits-are-code, type: requires }
      - { to: nonce-replay-protection, type: contrasts }
    sources: [solana-durable-nonces-guide, chainalysis-drift, trm-drift, coindesk-drift-durable-nonce]
    misconceptions:
      - belief: A signed transaction that was never broadcast expires harmlessly.
        reality: Under a durable nonce it does not expire; a signature obtained under false pretences stays executable indefinitely.
        why: The ~150-block blockhash expiry is taught as if it were universal.
        source: coindesk-drift-durable-nonce
