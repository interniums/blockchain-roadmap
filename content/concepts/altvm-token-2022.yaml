moduleId: altvm-token-2022
concepts:
  - id: token2022-is-a-separate-program
    title: A separate program, not a version
    oneLine: Token-2022 is a different deployed program at a different address; the original SPL Token program is not going away.
    statement: >
      Token-2022, the Token Extensions Program, is a distinct program deployed at a distinct address. It is
      not an upgrade of the original SPL Token program and does not replace it - the two coexist
      permanently, and the original still holds the overwhelming majority of tokens. Any code that decides
      what to do based on "is this a token account" must therefore start by asking which program owns it, and
      any code that hardcodes one program id has silently chosen a subset of the token universe.
    volatility: evolving
    edges:
      - { to: program-is-stateless, type: requires }
      - { to: solana-account, type: requires }
    sources: [solana-program-token-2022, solana-docs-token-extensions]
    misconceptions:
      - belief: Token-2022 is "SPL Token v2" and supersedes the old program.
        reality: It is a separate program at a separate address; both are live and the original still holds most tokens.
        why: Version-number naming implies succession.
        source: solana-program-token-2022
  - id: token-program-id-is-a-seed
    title: The program id is a seed of the ATA
    oneLine: The same wallet and a same-looking mint derive a different associated token account under Token-2022.
    statement: >
      An Associated Token Account address is derived from the wallet, the mint, and the token program id.
      Because the program id is one of the seeds, a Token-2022 mint produces a different ATA address than a
      legacy mint would for the same wallet. Code that hardcodes the legacy program id in its derivation does
      not fail loudly - it computes a real, valid, empty address, and everything downstream behaves as though
      the user has no balance or creates an account nobody will ever fund.
    volatility: evolving
    edges:
      - { to: token2022-is-a-separate-program, type: requires }
      - { to: pda, type: requires }
    sources: [solana-program-token-2022, neodyme-token-2022]
    misconceptions:
      - belief: If my code handles SPL tokens it handles Token-2022 tokens.
        reality: The program id differs, the ATA derivation differs, account sizes are variable, and plain transfer fails on several extension sets.
        why: The instruction interface is mostly compatible, which is worse than being obviously incompatible.
        source: neodyme-token-2022
  - id: extensions-are-tlv-state
    title: Extensions are TLV state
    oneLine: Extra state is appended after the classic layout as type-length-value records, so accounts are variable-sized.
    statement: >
      A Token-2022 mint or token account starts with the classic layout and then carries an account-type
      discriminator byte followed by a chain of type-length-value extension records. Accounts are therefore
      variable-length rather than the fixed sizes a decade of code memorised, and the correct way to identify
      one is to unpack it and read the account type, never to compare `data.len()` against a constant. The
      extension records are also how you discover, from the chain alone, what a mint can do.
    volatility: evolving
    edges:
      - { to: token2022-is-a-separate-program, type: requires }
    sources: [solana-program-token-2022, rareskills-token-2022]
    misconceptions:
      - belief: An account is a token account if it is 165 bytes.
        reality: Token-2022 accounts are variable-length because of TLV extensions, so length-based type detection misclassifies or panics.
        why: A decade of legacy code did exactly this and was right at the time.
        source: neodyme-token-2022
  - id: extensions-are-set-at-creation
    title: Mostly fixed at creation
    oneLine: Most mint extensions must be enabled when the mint is initialized, which makes a mint's rules readable up front.
    statement: >
      Most mint extensions have to be enabled at initialization and cannot be added later, which is what makes
      "what can this token do" a property you can read off the mint before accepting it. The rule is not
      absolute - behaviour differs by extension and should be checked per extension against the program's own
      documentation rather than assumed. And it is not the same as immutable: a mint with a close authority
      can be destroyed and rebuilt at the same address with a different set.
    volatility: evolving
    edges:
      - { to: extensions-are-tlv-state, type: requires }
    sources: [solana-program-token-2022, solana-docs-token-extensions]
  - id: transfer-fee-extension
    title: Transfer fee
    oneLine: A fee is withheld inside the recipient's token account, so the debit and the spendable credit differ.
    statement: >
      With the transfer fee extension a percentage of each transfer is withheld inside the recipient's token
      account rather than paid by the sender out of band. The recipient's spendable balance is therefore less
      than the amount transferred, the withheld amount sits in the recipient account until harvested, and a
      separate withdraw authority collects it later. The money flow has three destinations, not two, and any
      accounting that assumes two is wrong from the first transfer.
    volatility: evolving
    edges:
      - { to: extensions-are-tlv-state, type: requires }
      - { to: fee-on-transfer-tokens, type: contrasts }
    sources: [solana-docs-token-extensions, neodyme-token-2022, quicknode-transfer-fees]
    misconceptions:
      - belief: Transfer fees are paid by the sender, so my vault receives what was sent.
        reality: The fee is withheld inside the recipient account; the vault must measure its own balance delta.
        why: The ERC-20 fee-on-transfer bug class, re-imported into a new ecosystem.
        source: neodyme-token-2022
  - id: amount-sent-is-not-amount-received
    title: Credit the delta, never the request
    oneLine: A protocol that credits the amount it asked to transfer is insolvent the moment a fee-bearing mint is listed.
    statement: >
      The single most reusable rule in the module: read the vault's balance before and after the transfer and
      credit the difference. Crediting the amount named in the instruction is correct for exactly the tokens
      without a fee, and the deficit compounds silently across every deposit until the vault cannot pay its
      last withdrawer. This is the same defect as the ERC-20 fee-on-transfer bug and it survives the change of
      ecosystem intact, which is the point worth making to a Solidity developer.
    volatility: evolving
    edges:
      - { to: transfer-fee-extension, type: requires }
      - { to: fee-on-transfer-tokens, type: contrasts }
    sources: [neodyme-token-2022, offside-token-2022-part1, solana-docs-token-extensions]
  - id: transfer-checked-is-mandatory
    title: transfer_checked, not transfer
    oneLine: Plain transfer fails on mints with fee or hook extensions, so integrators must pass the mint and decimals.
    statement: >
      Mints carrying fee or hook extensions reject the plain `transfer` instruction; integrators must use
      `transfer_checked` (or the with-fee variant), which requires the mint account and the decimals to be
      passed and validated. The practical effect is good - it forces the caller to have looked at the mint -
      but it also means an integration written against legacy SPL Token can fail at runtime on exactly the
      mints whose rules it did not account for.
    volatility: evolving
    edges:
      - { to: transfer-fee-extension, type: requires }
    sources: [solana-program-token-2022, neodyme-token-2022]
  - id: transfer-hook-extension
    title: Transfer hook
    oneLine: Every transfer CPIs into a third-party program chosen by the mint authority.
    statement: >
      The transfer hook extension makes each transfer invoke a program named by the mint. It enables
      allowlists, royalties and compliance gates - and it means arbitrary code chosen by the token's issuer
      executes inside your transfer path, consuming your compute budget and able to fail your transaction at
      will. The closest EVM analogue is a token with transfer callbacks, and the same conclusion applies:
      the token decides what runs inside your call.
    volatility: evolving
    edges:
      - { to: extensions-are-tlv-state, type: requires }
      - { to: token-callbacks-are-the-vector, type: contrasts }
    sources: [solana-docs-token-extensions, neodyme-token-2022, chainstack-token-2022-hooks]
  - id: extra-account-meta-list
    title: ExtraAccountMetaList
    oneLine: The hook's extra accounts are resolved off-chain from a PDA, and weak validation lets an attacker inject accounts.
    statement: >
      A transfer hook usually needs accounts beyond the transfer's own. Those are described in an
      `ExtraAccountMetaList` PDA that clients read to build the transaction, and the hook program must
      validate what actually arrived rather than trusting the list to have been followed. Weak validation
      there means an attacker can inject accounts of their choosing into the hook invocation - the declared
      account model's usual hazard, arriving one layer deeper than people look.
    volatility: evolving
    edges:
      - { to: transfer-hook-extension, type: requires }
      - { to: accounts-are-untrusted-input, type: applies }
    sources: [solana-program-token-2022, neodyme-token-2022, chainstack-token-2022-hooks]
  - id: hook-must-verify-transferring-flag
    title: A hook can be called outside a transfer
    oneLine: A hook program is an ordinary program; it must check the transferring flag and its caller.
    statement: >
      Nothing stops anyone invoking a hook program directly. If the hook assumes it only ever runs inside a
      Token-2022 transfer, an attacker can drive it out of context - incrementing counters, consuming
      allowances, marking state - without any transfer occurring. A correct hook verifies the token account's
      `transferring` flag and that its caller is the Token-2022 program.
    volatility: evolving
    edges:
      - { to: transfer-hook-extension, type: requires }
    sources: [solana-program-token-2022, neodyme-token-2022]
    misconceptions:
      - belief: A transfer hook only runs during transfers.
        reality: A hook program is an ordinary program and can be invoked directly; it must verify the transferring flag and its caller.
        why: The name implies the runtime enforces the context.
        source: neodyme-token-2022
  - id: permanent-delegate-extension
    title: Permanent delegate
    oneLine: An address that can transfer or burn from any account of that mint, forever, with no approval from the holder.
    statement: >
      A mint with a permanent delegate names an address that can move or burn tokens out of any account of
      that mint, indefinitely, without the holder ever approving anything. There is no ERC-20 equivalent: an
      allowance is granted per holder and can be revoked, whereas this is a property of the token itself.
      Listing such a mint hands its issuer unilateral power to drain every vault your protocol holds it in,
      which is why "does this mint have a permanent delegate" belongs in the listing decision, not the audit.
    volatility: evolving
    edges:
      - { to: extensions-are-tlv-state, type: requires }
      - { to: erc20-allowance-model, type: contrasts }
    sources: [solana-docs-token-extensions, neodyme-token-2022]
  - id: non-transferable-and-default-frozen
    title: NonTransferable and DefaultAccountState
    oneLine: Soulbound tokens, and mints whose newly created accounts are frozen until an authority thaws them.
    statement: >
      `NonTransferable` makes tokens permanently bound to their holder. `DefaultAccountState = Frozen` makes
      every newly created token account frozen until an authority thaws it, which is the standard
      configuration for KYC-gated and regulated tokens rather than an edge case. Both break the assumption
      underneath most vault and escrow code: that an account you just created can receive tokens and later
      send them.
    volatility: evolving
    edges:
      - { to: extensions-are-tlv-state, type: requires }
    sources: [solana-docs-token-extensions, offside-token-2022-part1]
    misconceptions:
      - belief: A frozen-by-default mint is a niche edge case.
        reality: It is the standard configuration for KYC-gated and regulated tokens, so any protocol creating vault accounts on demand must handle it.
        why: Developers test with permissionless mints only.
        source: solana-docs-token-extensions
  - id: rebasing-extensions
    title: InterestBearing and ScaledUiAmount
    oneLine: The displayed balance drifts from the stored raw amount, so mixing UI amounts with raw amounts drifts too.
    statement: >
      These extensions change the relationship between the raw amount stored in an account and the amount
      displayed to a user - by accruing interest, or by applying a scaling multiplier. Nothing about the raw
      ledger changes, which is exactly the trap: accounting code that stores a UI amount in one place and a
      raw amount in another produces a discrepancy that grows over time and looks like a rounding bug. Pick
      one representation, at the boundary, and convert.
    volatility: evolving
    edges:
      - { to: extensions-are-tlv-state, type: requires }
    sources: [solana-docs-token-extensions]
  - id: mint-close-and-reinit-hazard
    title: Close and reinitialize
    oneLine: A mint with a close authority can be destroyed and rebuilt at the same address with different extensions.
    statement: >
      The sharpest Token-2022 foot-gun is not a fee or a hook, it is that a mint's rules are not permanent. A
      mint with a close authority can be closed and a new mint initialized at the same address with a
      different extension set, while token accounts created under the old rules continue to exist - so an
      account created before a transfer fee existed can behave differently from one created after. Reading a
      mint's current extensions is therefore necessary and not sufficient; you also need to know whether it
      can be replaced.
    volatility: evolving
    edges:
      - { to: extensions-are-set-at-creation, type: requires }
      - { to: transfer-fee-extension, type: requires }
    sources: [solana-docs-token-extensions, neodyme-token-2022]
    misconceptions:
      - belief: Checking a mint's current extensions is enough to know its rules.
        reality: A mint with a close authority can be closed and reinitialized at the same address with a different extension set, leaving old accounts under stale assumptions.
        why: Addresses feel immutable, and on Ethereum a token contract's rules mostly are.
        source: neodyme-token-2022
  - id: confidential-transfer-extension
    title: Confidential transfers
    oneLine: Balances held as ElGamal ciphertexts with zero-knowledge proofs of correctness - amounts hidden, participants not.
    statement: >
      The confidential transfer extension holds balances as ElGamal ciphertexts and proves transfers correct
      with zero-knowledge proofs verified by a dedicated on-chain proof program. What it hides is amounts.
      Sender and recipient accounts remain public, so the anonymity set is nothing like a shielded pool's, and
      naive usage - receive one confidential transfer, immediately withdraw the whole balance - leaks the
      amount to anyone watching. Availability of the proof-verification path has changed over time and should
      be confirmed against the program's own documentation before designing on it.
    volatility: hot
    edges:
      - { to: extensions-are-tlv-state, type: requires }
      - { to: anonymity-set, type: contrasts }
    sources: [solana-docs-token-extensions, solana-program-token-2022]
    misconceptions:
      - belief: Confidential transfers make Solana transactions anonymous.
        reality: They encrypt amounts; the accounts involved are still public, and naive usage patterns leak the amount anyway.
        why: The words zero-knowledge get read as anonymous.
        source: neodyme-token-2022
  - id: confidential-pending-balance-counter
    title: The pending balance counter
    oneLine: Incoming confidential transfers land in a pending balance with a credit counter that can be exhausted by spam.
    statement: >
      Confidential deposits accumulate in a pending balance governed by a maximum pending balance credit
      counter, which the account owner clears by applying the pending balance. Set the maximum too low and an
      attacker can send a stream of tiny transfers to exhaust the counter, locking the account out of
      receiving anything further until the owner acts - a denial-of-service that costs the attacker almost
      nothing and has no equivalent in a plain token account.
    volatility: hot
    edges:
      - { to: confidential-transfer-extension, type: requires }
    sources: [neodyme-token-2022, solana-program-token-2022]
  - id: allowlist-mints-not-programs
    title: Allowlist mints, not programs
    oneLine: Accepting the Token-2022 program means accepting every mint anyone creates under it, whatever it does.
    statement: >
      Accepting the Token-2022 program as such accepts every extension set that any mint under it carries,
      including the ones you have never handled. The posture that follows is to allowlist specific mints
      together with the specific extensions you have handled. That is also the structural answer to the
      ERC-20 weird-token problem, arriving from the opposite direction: on Ethereum you cannot enumerate
      what a token might do, and here you can, because the extension records are readable off the mint -
      but only if you check, per mint, and re-check when a mint can be reinitialized.
    volatility: evolving
    edges:
      - { to: permanent-delegate-extension, type: requires }
      - { to: transfer-hook-extension, type: requires }
      - { to: amount-sent-is-not-amount-received, type: requires }
      - { to: weird-erc20-taxonomy, type: contrasts }
    sources: [solana-token-2022-extensions-ref, solana-program-token-2022, neodyme-token-2022, offside-token-2022-part1]
