moduleId: app-account-abstraction
concepts:
  - id: user-operation
    title: UserOperation
    oneLine: ERC-4337's alternative to a transaction - signed by the user, collected by bundlers, validated and executed by the EntryPoint.
    statement: >
      A UserOperation is a structured object describing what a smart account should do: the sender account,
      the calldata, gas limits, fee fields, an optional paymaster, and a signature whose meaning is defined by
      the account rather than by the protocol. It is not a transaction - no node accepts it via
      `eth_sendTransaction` - and it travels through a separate mempool to bundlers, which wrap batches of
      them into ordinary transactions calling the EntryPoint. Because the account defines what a valid
      signature is, the signing key need not be a secp256k1 EOA key.
    volatility: evolving
    edges:
      - { to: mempool-is-a-public-broadcast, type: contrasts }
      - { to: eip-2718-envelope, type: contrasts }
      - { to: contract-account, type: requires }
    sources: [erc-4337-docs]
    misconceptions:
      - belief: Account abstraction means ERC-4337.
        reality: 4337 is one route; EIP-7702 upgrades an existing EOA directly, and ERC-5792 is how apps talk to either.
        why: 4337 was the first of the three to have a name and a spec number.
        source: eip5792-getting-started
  - id: bundler
    title: Bundler
    oneLine: A network actor that collects UserOperations, packs them into a transaction, and pays L1 gas to submit it.
    statement: >
      A bundler watches the alternative mempool for UserOperations, simulates each one to confirm it will pay,
      packs a set of them into a single transaction to the EntryPoint, and submits it as an ordinary
      transaction it pays for. It is reimbursed out of the accounts' or paymasters' deposits during execution.
      Bundlers are a service you depend on: they choose what to include, they can refuse, and their
      simulation rules - not just the chain's - decide whether your UserOperation is accepted.
    volatility: evolving
    edges:
      - { to: user-operation, type: requires }
    sources: [erc-4337-bundlers]
  - id: entrypoint
    title: EntryPoint
    oneLine: The singleton contract that validates and executes UserOperations through the user's smart account.
    statement: >
      The EntryPoint is a single deployed contract that every ERC-4337 account and paymaster trusts. For each
      UserOperation it runs a validation phase - asking the account whether the signature is acceptable and
      the paymaster whether it will pay - and then an execution phase, keeping the two strictly separate so a
      bundler can decide what to include without executing it. Several EntryPoint versions exist and accounts
      and paymasters are written against a specific one; v0.7 is deployed at
      `0x0000000071727De22E5E9d8BAf0edAc6f37da032` across most major EVM chains, while later versions exist
      alongside it. Which version predominates in production varies by chain and by wallet, so check the chain
      you are deploying to rather than assuming.
    volatility: hot
    edges:
      - { to: user-operation, type: requires }
      - { to: evm-message-call, type: requires }
    sources: [erc-4337-docs]
  - id: paymaster
    title: Paymaster
    oneLine: An optional contract that agrees to pay a UserOperation's gas, letting a user transact with no ETH or pay in an ERC-20.
    statement: >
      A paymaster is a contract with a deposit at the EntryPoint that agrees, during the validation phase, to
      cover a UserOperation's gas. That is what makes a first transaction possible for a user holding no ETH,
      and what makes paying fees in an ERC-20 possible - the paymaster pays gas and takes the token. Its
      agreement is expressed in code: whatever the validation function accepts, it will pay for.
    volatility: evolving
    edges:
      - { to: entrypoint, type: requires }
      - { to: tx-gas-limit-vs-used, type: requires }
    sources: [erc-4337-docs]
  - id: paymaster-risk
    title: A paymaster is an economic surface
    oneLine: Sponsorship is a contract that spends money on rules you wrote; badly scoped rules are drained, not exploited.
    statement: >
      Because a paymaster pays for anything its validation accepts, the scoping rules are its whole security
      model. A paymaster that sponsors any call, any target, any sender, or any amount can have its deposit
      consumed by an attacker doing nothing that looks like an attack - repeatedly submitting valid, expensive,
      sponsored operations. Useful scoping constrains the target contract and function selector, the sender,
      the gas the sponsorship will cover, and the rate per account per period. Treat the paymaster as a
      spending endpoint with an attacker-controlled call pattern, not as a UX toggle.
    volatility: evolving
    edges:
      - { to: paymaster, type: requires }
    sources: [erc-4337-docs, ottersec-paymasters]
    misconceptions:
      - belief: A paymaster is a UX feature.
        reality: It is an economic contract that pays whatever its rules accept, and a permissive rule set is drained.
        why: It shows up in product decks as "gasless", which sounds like a setting.
        source: ottersec-paymasters
  - id: session-key
    title: Where session keys actually live
    oneLine: ERC-4337 does not define session keys; whatever scoping exists is enforced by the account's own validation logic.
    statement: >
      Session keys are routinely described as an ERC-4337 feature. The specification does not define them:
      4337 defines how an account is asked whether a signature is acceptable, and a session key is one answer
      an account may choose to give. The consequence is that session-key behaviour is implemented
      wallet-by-wallet, is not portable between account implementations, and cannot be relied upon by feature
      name alone. The same pattern is equally available on an EIP-7702-delegated EOA, because it is a property
      of the account's code either way.
    volatility: hot
    edges:
      - { to: entrypoint, type: requires }
      - { to: session-key-definition, type: deepens }
    sources: [erc-4337-session-keys-docs]
    misconceptions:
      - belief: Session keys are an ERC-4337 feature you get by using a 4337 account.
        reality: The spec does not define them; the account's validation logic does, and implementations differ per wallet.
        why: They are demonstrated almost exclusively in 4337 tooling.
        source: erc-4337-session-keys-docs
  - id: 7702-vs-4337
    title: 7702 and 4337 compose
    oneLine: EIP-7702 upgrades an existing EOA in place; ERC-4337 routes through a separate smart account. They are not competitors.
    statement: >
      EIP-7702 gives an existing EOA contract behaviour without changing its address, its history, or its
      token approvals - the user keeps the account they have. ERC-4337 gives a distinct smart-contract account
      with its own address, reached through the UserOperation pipeline. The two compose: a 7702-delegated EOA
      can point at ERC-4337-compatible account code and participate in the same bundler and paymaster
      infrastructure. The product question is not which standard is better but whether your users can afford
      to move to a new address.
    volatility: hot
    edges:
      - { to: user-operation, type: requires }
      - { to: delegation-designator, type: requires }
      - { to: detect-delegated-eoa, type: requires }
    sources: [eip-7702, erc-4337-docs, eip5792-getting-started]
    misconceptions:
      - belief: EIP-7702 replaced ERC-4337.
        reality: 7702 changes where the code lives, not the pipeline; a delegated EOA can run 4337 account code and use the same bundlers.
        why: Both are introduced as "account abstraction" and appear to solve the same problem.
        source: eip5792-getting-started
