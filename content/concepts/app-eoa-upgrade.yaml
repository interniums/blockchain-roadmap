moduleId: app-eoa-upgrade
concepts:
  - id: viem-sign-authorization
    title: Signing an authorization from the app
    oneLine: viem's signAuthorization produces the EIP-7702 tuple, and the transaction carries it in authorizationList.
    statement: >
      viem exposes EIP-7702 through `signAuthorization`, which signs the authorization tuple naming the
      chain, the delegate contract address and the account nonce, and through an `authorizationList` field on
      the type-0x4 transaction that carries one or more of those tuples. The signer of an authorization and
      the sender of the transaction need not be the same account, which is what allows a third party to pay
      for someone else's upgrade. The nonce inside the authorization is checked against the authorizing
      account's nonce at execution time, so an account authorizing its own upgrade inside the same
      transaction must account for the nonce that transaction itself consumes.
    volatility: hot
    edges:
      - { to: authorization-tuple, type: requires }
      - { to: set-code-transaction, type: requires }
      - { to: tx-type-4-setcode, type: requires }
      - { to: viem-wallet-client, type: requires }
    sources: [viem-sign-authorization, eip-7702]
    misconceptions:
      - belief: The account being upgraded has to pay for the upgrade.
        reality: The authorization signer and the transaction sender are separate roles, so anyone can submit and pay.
        why: Every other account change is paid for by the account itself.
        source: eip-7702
  - id: 7702-upgrade-consent
    title: What the upgrade screen owes the user
    oneLine: A 7702 upgrade is one signature that persists until cleared, so the consent screen must name the delegate and the way back.
    statement: >
      Delegating an EOA is not a per-transaction approval: the designator stays in the account until an
      authorization pointing at the zero address clears it, so one signature changes what the address can do
      indefinitely. A consent surface that does not name the delegate contract, say what capability it adds,
      and state how the user reverts it has compressed an open-ended grant into a single click. Because
      whoever controls the delegate controls everything the account can do, this screen is doing more work
      than a token approval screen, not less.
    volatility: hot
    edges:
      - { to: viem-sign-authorization, type: requires }
      - { to: delegation-clearing, type: requires }
      - { to: delegate-is-total-control, type: requires }
    sources: [eip-7702, metamask-7702-upgrade]
    misconceptions:
      - belief: The delegation applies to the transaction you approved.
        reality: It persists in the account until an authorization to the zero address clears it.
        why: Every other wallet prompt scopes to the action in front of you.
        source: eip-7702
  - id: detect-delegated-eoa
    title: Detecting a delegated account
    oneLine: Read the account's code and check for the delegation designator prefix; do not ask whether code exists.
    statement: >
      An app finds out that an address is a delegated EOA by reading its code and recognising the delegation
      designator - a short value beginning with the reserved `0xef0100` prefix and followed by the delegate's
      twenty-byte address. This is the only reliable client-side detection: a delegated EOA has non-empty
      code, so any check of the form "code length is zero, therefore this is an EOA" now returns the wrong
      answer, and the failure is silent because the address still behaves like an EOA for signing.
    volatility: hot
    edges:
      - { to: delegation-designator, type: requires }
      - { to: code-length-check-broken, type: requires }
      - { to: viem-public-client, type: requires }
    sources: [eip-7702, viem-clients]
    misconceptions:
      - belief: Non-empty code means you are talking to a contract.
        reality: A delegated EOA carries a designator in its code slot and is still controlled by a private key.
        why: The EOA/contract split was a hard binary for a decade.
        source: eip-7702
  - id: wallet-chooses-the-delegate
    title: The wallet picks the code, not your app
    oneLine: In a wallet-mediated upgrade the wallet decides which delegate implementation the account points at; apps negotiate capabilities, not addresses.
    statement: >
      When the upgrade happens inside a consumer wallet, the wallet selects and audits the delegate
      implementation it is willing to install; a dapp does not get to nominate arbitrary code for a user's
      account. The app's lever is capability negotiation - ask what the account can do and adapt - not the
      delegate address. Designing a flow that assumes a particular implementation is present makes the app
      work with one wallet build and fail with the next.
    volatility: hot
    edges:
      - { to: detect-delegated-eoa, type: requires }
      - { to: wallet-capabilities, type: requires }
    sources: [metamask-7702-upgrade, eip5792-getting-started]
    misconceptions:
      - belief: A dapp can upgrade the user's EOA to the smart account of its choosing.
        reality: In wallet-mediated flows the wallet chooses the delegate; the app can only ask what the resulting account supports.
        why: The EIP allows any address, so it reads as an app-level choice.
        source: metamask-7702-upgrade
