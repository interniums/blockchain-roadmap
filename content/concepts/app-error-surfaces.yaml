moduleId: app-error-surfaces
concepts:
  - id: revert-data-is-abi-encoded
    title: Revert data is bytes with a convention on top
    oneLine: A revert returns raw bytes; the EVM attaches no meaning to them, so every error message is an application-level convention.
    statement: >
      When a call reverts, the EVM propagates a byte string and nothing else. It does not interpret those
      bytes, does not require them to be non-empty, and has no notion of an error type. Everything that looks
      like an error message - a reason string, a panic code, a named custom error - is a convention that
      Solidity encodes into those bytes and that a client decodes back out, using an ABI it must already
      possess. There is no channel here comparable to an HTTP status code.
    volatility: stable
    edges:
      - { to: revert-data-encoding, type: requires }
      - { to: abi-encoding, type: requires }
    sources: [solidity-error-handling]
    misconceptions:
      - belief: Reverts carry a human-readable reason.
        reality: They carry ABI-encoded bytes; a reason exists only if the client holds a matching ABI and decodes it.
        why: Pre-0.8.4 require("...") trained a decade of engineers.
        source: solidity-custom-errors-blog
  - id: four-revert-shapes
    title: The four shapes of revert data
    oneLine: Empty, Error(string) at 0x08c379a0, Panic(uint256) at 0x4e487b71, or a custom error - any other selector plus encoded arguments.
    statement: >
      Revert data comes in exactly four shapes. Zero bytes, with no selector at all. `Error(string)`,
      identified by selector `0x08c379a0`, carrying a reason string. `Panic(uint256)`, identified by selector
      `0x4e487b71`, carrying a numeric code for a language-level failure. Or a custom error: any other
      four-byte selector followed by its ABI-encoded arguments. A decoder is a branch on those four cases, and
      writing that branch once is what turns error handling from string matching into dispatch.
    volatility: stable
    edges:
      - { to: revert-data-is-abi-encoded, type: requires }
      - { to: sol-error-selector, type: requires }
    sources: [solidity-error-handling, oz-panic-sol]
  - id: error-string-legacy
    title: Error(string) is the legacy path
    oneLine: require with a message and revert with a string produce Error(string) - the pre-0.8.4 default, paying for the text in both bytecode and calldata.
    statement: >
      `require(cond, "msg")` and `revert("msg")` encode as `Error(string)`. This was the only structured
      option before Solidity 0.8.4 and it is still valid, but it stores the message in the contract's bytecode
      and returns it in the revert data, which costs deployment size and gas for text a machine cannot act on.
      Modern Solidity also allows a custom error to be passed to `require` directly, so the old rule of thumb
      that `require` implies a string no longer holds.
    volatility: stable
    edges:
      - { to: four-revert-shapes, type: requires }
    sources: [solidity-custom-errors-blog, solidity-error-handling]
  - id: solidity-custom-errors
    title: A custom error on the wire
    oneLine: error Foo(uint256 a) encodes as the first four bytes of keccak of its canonical signature followed by the ABI-encoded arguments.
    statement: >
      A custom error is encoded exactly like a function call: the first four bytes of the keccak hash of its
      canonical signature, followed by its arguments ABI-encoded. It carries structured, typed data the client
      can render - the required amount, the offending address - and carries no text whatsoever. That is the
      trade the client side has to absorb: cheaper and more useful when you hold the ABI, completely opaque
      when you do not.
    volatility: stable
    edges:
      - { to: four-revert-shapes, type: requires }
      - { to: sol-custom-error, type: deepens }
      - { to: error-string-legacy, type: contrasts }
    sources: [solidity-custom-errors-blog]
  - id: panic-codes
    title: Panic codes
    oneLine: Panic(uint256) signals a language-level invariant break, with a numeric code identifying which one.
    statement: >
      `Panic(uint256)` is emitted by the compiler's own checks rather than by your business logic. The codes
      cover distinct language-level failures: `0x01` a failed `assert`, `0x11` arithmetic overflow or
      underflow, `0x12` division or modulo by zero, `0x21` a conversion to an invalid enum value, `0x31` a
      `pop` on an empty array, `0x32` an out-of-bounds array index, and `0x41` allocating too much memory or
      creating an over-large array. Further codes exist for storage byte-array encoding and for calling a
      zero-initialised internal function pointer; treat the list as a dispatch table to look up rather than
      one to memorise.
    volatility: stable
    edges:
      - { to: four-revert-shapes, type: requires }
      - { to: sol-builtin-error-selectors, type: requires }
    sources: [solidity-error-handling, oz-panic-sol]
  - id: panic-means-bug
    title: A panic is your bug
    oneLine: Panics are language-invariant breaks - a contract bug or impossible input - and must never be shown to a user as a business message.
    statement: >
      Business rules revert with `Error(string)` or a custom error. A `Panic` means the contract did something
      the language forbids: it overflowed, indexed past an array, divided by zero. That is a defect in the
      contract or a client sending input the contract never validated. Surfacing "arithmetic overflow" to a
      user is an admission of a bug dressed as a hint; the correct handling is a generic apology to the user
      and an alert to the people who can fix it.
    volatility: stable
    edges:
      - { to: panic-codes, type: requires }
    sources: [oz-panic-sol, solidity-error-handling]
    misconceptions:
      - belief: A panic is a validation error to show the user.
        reality: Panics are language-invariant breaks - a contract bug or unvalidated input - not business rules.
        why: They arrive on the same channel as business errors.
        source: oz-panic-sol
  - id: empty-revert-data
    title: Zero bytes, many causes
    oneLine: Empty revert data has several unrelated causes that are indistinguishable from the data alone.
    statement: >
      Zero-length revert data is produced by a bare `revert()`, by running out of gas, by the `INVALID`
      opcode, by calling an address that holds no code, and by a proxy whose implementation slot points at
      nothing. From the bytes alone these are the same. In practice this means a wrong-address bug and a
      deliberate business-rule failure present identically, so an empty revert must be triaged by context -
      the target's code size, the gas supplied - rather than by its content.
    volatility: stable
    edges:
      - { to: four-revert-shapes, type: requires }
      - { to: delegatecall-no-code-succeeds, type: contrasts }
    sources: [solidity-error-handling]
    misconceptions:
      - belief: An execution-reverted error with no data means a require failed.
        reality: Empty revert data is also produced by out-of-gas, INVALID, calling an address with no code, and a proxy pointing at nothing.
        why: The message names the most common cause and omits the rest.
        source: solidity-error-handling
  - id: selector-only-4-bytes
    title: Four bytes, no registry
    oneLine: An error selector is four bytes with no on-chain registry, so decoding needs an ABI you already hold - and selectors can collide.
    statement: >
      A custom-error selector is four bytes derived from a hash, and nothing on-chain maps it back to a
      signature. Decoding requires you to already possess a matching ABI. Four bytes is a small space: distinct
      signatures do collide, and public selector-lookup databases return multiple candidate signatures for one
      selector, so a lookup result is a hypothesis rather than an identification.
    volatility: stable
    edges:
      - { to: solidity-custom-errors, type: requires }
    sources: [viem-decode-error-result-doc, solidity-custom-errors-blog]
    misconceptions:
      - belief: A four-byte selector uniquely identifies an error.
        reality: There is no registry, the space is small enough for collisions, and lookup services return several candidates.
        why: Selectors look like unique identifiers.
        source: viem-decode-error-result-doc
  - id: decode-needs-the-right-abi
    title: The reverting contract is often not the one you called
    oneLine: Errors defined in a library, a token, or the implementation behind a proxy need that contract's ABI, not the one you called.
    statement: >
      A single call reaches many contracts. A router calls a token; a proxy delegates to an implementation; a
      contract calls a library. The revert bubbles up from wherever it originated, and its selector belongs to
      that contract's error definitions, which are not in the ABI of the contract you called. Decoding
      therefore requires assembling the ABIs of everything in the call path - and when you have not, the
      client hands you raw hex with no indication that a decode was even attempted.
    volatility: stable
    edges:
      - { to: selector-only-4-bytes, type: requires }
      - { to: revert-bubbling, type: requires }
    sources: [viem-errors-glossary]
    misconceptions:
      - belief: You can decode any revert with the ABI of the contract you called.
        reality: The error may be defined in a library, a token, or an implementation behind a proxy; you need that contract's ABI.
        why: One call feels like one contract.
        source: viem-errors-glossary
  - id: viem-decode-error-result
    title: Decoding in practice
    oneLine: decodeErrorResult({ abi, data }) turns revert bytes into errorName and args; BaseError.walk finds the error in the cause chain that carries them.
    statement: >
      viem separates the two jobs. `decodeErrorResult({ abi, data })` is the pure decode: given revert bytes
      and a set of error definitions, it returns `{ errorName, args }`. Getting to those bytes from a thrown
      action error is the other job, done by walking the `cause` chain to the
      `ContractFunctionRevertedError` that carries them. Building both into one helper, once, is what stops
      error handling from being re-invented at every call site with a different string match.
    volatility: evolving
    edges:
      - { to: decode-needs-the-right-abi, type: requires }
      - { to: viem-typed-revert, type: requires }
      - { to: viem-error-hierarchy, type: requires }
    sources: [viem-decode-error-result-doc, viem-errors-glossary]
  - id: estimategas-is-a-search
    title: Estimation is a search
    oneLine: eth_estimateGas dry-runs the call and then searches for the smallest gas limit at which it succeeds, so it is several executions, not one.
    statement: >
      `eth_estimateGas` does not measure the gas a call consumed. It executes the call and then searches for
      the smallest limit at which execution still succeeds, running the call repeatedly against the same
      state - go-ethereum's estimator does this by bisection, and its own comments describe the result as the
      lowest gas limit that lets the transaction run successfully. That is why estimation is far more
      expensive than a single `eth_call`, why providers meter it differently, and why an estimate on a heavy
      contract can take long enough to be a visible delay in your interface.
    volatility: evolving
    edges:
      - { to: tx-gas-limit-vs-used, type: requires }
    sources: [geth-gasestimator-source, geth-issue-21311, arkis-estimategas]
  - id: estimategas-nonmonotonic
    title: The search assumes something contracts can violate
    oneLine: Bisection assumes success is monotone in the gas limit; contracts that branch on gasleft break that assumption.
    statement: >
      A bisection search for the minimum working gas limit is only correct if success is monotone - if
      succeeding at limit L implies succeeding at every larger limit. Contracts that read `gasleft()` and
      branch on it, forward a fixed fraction of gas to a callback, or interact with refunds can violate that:
      there are limits at which the call succeeds and larger limits at which it does not. The search then
      returns a value that is wrong rather than merely tight, and the failure appears in production.
    volatility: evolving
    edges:
      - { to: estimategas-is-a-search, type: requires }
      - { to: gas-metering-control, type: recommends }
    sources: [geth-gasestimator-source, solidity-docs-global-vars, arkis-estimategas]
  - id: estimategas-63-64
    title: Why an exact estimate still fails
    oneLine: EIP-150 retains one sixty-fourth of remaining gas at each call frame, so a deep sub-call can receive less than it needs even when the total is right.
    statement: >
      EIP-150 specifies that a call may forward at most 63/64 of the gas remaining in the current frame, with
      the rest retained by the caller. Nesting compounds this: by several frames deep, the callee receives
      materially less than the top-level limit suggests. A transaction sent with exactly the estimated limit
      can therefore run out of gas inside a nested call while the top-level accounting looks correct. Adding
      headroom above the estimate is not superstition - it is compensation for a documented rule.
    volatility: stable
    edges:
      - { to: estimategas-is-a-search, type: requires }
      - { to: 63-64-rule, type: requires }
    sources: [eip-150]
    misconceptions:
      - belief: Use the estimate as the gas limit.
        reality: The 63/64 rule means a deep sub-call may receive less than it needs, and state can change before inclusion; add headroom.
        why: The number is called an estimate but read as an answer.
        source: eip-150
  - id: estimategas-failure-modes
    title: Estimation fails for at least four unrelated reasons
    oneLine: The call reverts, the sender cannot cover value plus gas, the estimate exceeds a cap, or state moved - and providers collapse them into one string.
    statement: >
      A thrown estimation has at least four distinct causes. The call genuinely reverts. The sender's balance
      cannot cover value plus gas at the estimated limit, which is a balance check and not a revert - geth's
      "gas required exceeds allowance" message comes from that check. The estimate exceeds a cap, and since
      Fusaka a single transaction is capped near 16.78 million gas even though blocks allow far more. Or the
      node's state moved between your read and the estimate. Providers frequently render all four as one
      opaque message, so the cause must be recovered by other means.
    volatility: evolving
    edges:
      - { to: estimategas-is-a-search, type: requires }
    sources: [geth-issue-21311, eip-7825]
    misconceptions:
      - belief: If eth_estimateGas throws, the transaction would revert.
        reality: It also throws on insufficient balance for value plus gas, on exceeding a cap, and when node state moved.
        why: Wallets surface every one of them as "this transaction will fail".
        source: geth-issue-21311
  - id: estimategas-is-not-simulation
    title: Estimation sizes, simulation explains
    oneLine: Estimation returns a number or throws; simulation returns the value and the revert data - use each for what it does.
    statement: >
      `eth_estimateGas` and `eth_call` answer different questions. Estimation gives you a limit to put on the
      transaction, and when it fails it throws a message that may not contain the revert data at all.
      Simulation executes the call and returns either the return value or the revert bytes you can decode into
      a named error with arguments. Using estimation to explain a failure is the reason so many applications
      show "execution reverted" - the explanation was available from a different call they never made.
    volatility: evolving
    edges:
      - { to: estimategas-failure-modes, type: requires }
      - { to: viem-simulate-before-send, type: requires }
    sources: [viem-simulate-contract, ethersjs-issue-1232]
  - id: provider-error-shape-drift
    title: The same failure looks different on every provider
    oneLine: RPC providers wrap, truncate and sometimes drop revert data, so an error that decodes locally can be opaque in production.
    statement: >
      Error objects are not standardised across the RPC boundary. Providers wrap the node's error in their own
      envelope, truncate long payloads, and in some cases do not carry revert data through an estimation
      failure at all. An error path that decodes cleanly against a local development node can therefore arrive
      as an unrecognisable string from a hosted provider, and against an L2 with a different node
      implementation it can differ again. Error handling must be tested against the provider you ship on, not
      only the one you develop on.
    volatility: evolving
    edges:
      - { to: estimategas-failure-modes, type: requires }
      - { to: revert-data-is-abi-encoded, type: requires }
    sources: [ethersjs-issue-1232, arbitrum-troubleshooting]
    misconceptions:
      - belief: Errors look the same everywhere.
        reality: Providers wrap, truncate and sometimes strip revert data, so a locally decodable error can be opaque in production.
        why: Local development runs against one node implementation with no provider layer.
        source: ethersjs-issue-1232
  - id: error-triage-taxonomy
    title: Four buckets
    oneLine: Every chain error is user-can-fix, app bug, transient chain or wallet state, or user declined - and each gets different UI.
    statement: >
      Sorting chain errors into four buckets makes the interface decisions fall out. **User can fix**:
      insufficient balance, missing approval, wrong chain - show what to do. **App bug**: a panic, a decode
      failure, malformed arguments - apologise and alert your team. **Transient chain or wallet state**: nonce
      race, RPC timeout, fee too low - offer a retry. **User declined**: they rejected the prompt - say nothing
      alarming and leave the flow intact. A single generic toast serves none of these, and it is the default
      in most applications.
    volatility: stable
    edges:
      - { to: four-revert-shapes, type: requires }
      - { to: estimategas-failure-modes, type: requires }
      - { to: viem-error-hierarchy, type: requires }
    sources: [viem-errors-glossary]
  - id: error-message-must-name-the-next-action
    title: A message that names the next action
    oneLine: State what failed, why, and the one thing the user should do - raw hex, selectors and "execution reverted" fail all three tests.
    statement: >
      A usable error message answers three questions: what failed, why, and what the person reading it should
      do next. Hex, four-byte selectors and "execution reverted" answer none of them. This is the reason the
      whole decoding and triage apparatus exists - not to satisfy a linter, but so that the string reaching
      the screen is one a non-expert can act on. If your triage function cannot produce that sentence for a
      given failure, the failure has not actually been classified yet.
    volatility: stable
    edges:
      - { to: error-triage-taxonomy, type: requires }
      - { to: error-client-surfacing, type: requires }
    sources: [viem-errors-glossary, solidity-error-handling]
