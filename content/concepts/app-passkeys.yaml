moduleId: app-passkeys
concepts:
  - id: passkey-definition
    title: Passkey
    oneLine: A WebAuthn credential - a P-256 keypair held in device secure hardware, unlocked by biometric or PIN, with a non-exportable private key.
    statement: >
      A passkey is a WebAuthn credential: a secp256r1 (P-256) keypair generated inside device secure hardware
      such as a Secure Enclave, an Android Keystore, or a hardware security key. The private key cannot be
      exported by the application; using it requires a user gesture - a biometric or a PIN - and the platform
      returns a signed assertion rather than the key. The credential is bound to a relying party and
      identified by a credential id the application stores.
    volatility: stable
    edges:
      - { to: keypair, type: requires }
      - { to: hash-function, type: requires }
    sources: [webauthn-l2, yubico-webauthn-guide]
  - id: passkey-ux-win
    title: Why a product wants passkeys
    oneLine: No seed phrase, no extension, a biometric per action, and phishing resistance that comes from the credential being bound to a domain.
    statement: >
      Passkeys remove the two hardest steps in consumer onboarding - installing an extension and recording a
      seed phrase - and replace per-action approval with a biometric the user already performs elsewhere. They
      also add something seed phrases and signature prompts do not have: because the credential is bound to a
      relying party identifier, a lookalike domain cannot elicit a usable assertion. The gain is real; the
      cost is that recovery becomes a design problem rather than a phrase in a drawer.
    volatility: evolving
    edges:
      - { to: passkey-definition, type: requires }
    sources: [yubico-webauthn-guide, webauthn-l2]
  - id: passkey-curve-mismatch
    title: The curve mismatch
    oneLine: Ethereum EOAs sign on secp256k1 and passkeys sign on secp256r1, so a passkey can never be an EOA key.
    statement: >
      Ethereum's externally owned accounts sign with ECDSA on secp256k1, and `ecrecover` recovers a signer on
      that curve only. Passkeys sign with ECDSA on secp256r1, a different curve with different parameters.
      A passkey therefore cannot be an EOA private key, cannot sign a raw Ethereum transaction, and cannot be
      verified by `ecrecover` at all - not as a matter of tooling but as a matter of arithmetic.
    volatility: stable
    edges:
      - { to: passkey-definition, type: requires }
      - { to: ecdsa-secp256k1, type: requires }
      - { to: secp256r1-p256, type: requires }
      - { to: ecrecover, type: contrasts }
    sources: [eip-7951, webauthn-l2]
    misconceptions:
      - belief: ecrecover can verify a passkey signature with the right encoding.
        reality: It operates on secp256k1; a P-256 signature is on a different curve entirely.
        why: Both are called "ECDSA".
        source: eip-7951
  - id: passkey-needs-smart-account
    title: A passkey controls funds only through a contract
    oneLine: Because of the curve, a passkey must act through code that verifies P-256 - a smart account, an ERC-1271 signer, or a delegated EOA.
    statement: >
      Since a passkey cannot be an EOA key, anything a passkey controls must sit behind code that verifies
      P-256 signatures: an ERC-4337 smart account whose validation checks the assertion, a contract
      implementing ERC-1271 signature validation, or an existing EOA delegated to such code under EIP-7702.
      The passkey authorises; the contract is the account. This is why "a passkey wallet" always implies a
      contract account somewhere, even when the product never says so.
    volatility: evolving
    edges:
      - { to: passkey-curve-mismatch, type: requires }
      - { to: delegation-designator, type: requires }
      - { to: user-operation, type: recommends }
    sources: [eip-7951, erc-4337-docs]
  - id: webauthn-signed-payload
    title: What WebAuthn actually signs
    oneLine: The authenticator signs authenticatorData concatenated with SHA-256 of clientDataJSON - your message is only the challenge field inside that JSON.
    statement: >
      A WebAuthn assertion is not a signature over your message. The authenticator signs
      `authenticatorData ‖ SHA-256(clientDataJSON)`, where `authenticatorData` carries the relying-party
      hash, the flag bits and a counter, and `clientDataJSON` is a JSON document produced by the browser that
      contains the ceremony type, the origin, and your value as the `challenge` field. Your hash is therefore
      nested two structures deep inside what was signed, which is the single fact that makes on-chain
      verification non-obvious.
    volatility: stable
    edges:
      - { to: passkey-definition, type: requires }
      - { to: hash-function, type: requires }
    sources: [webauthn-l2, mojoauth-webauthn-verify]
    misconceptions:
      - belief: A passkey signs your transaction hash.
        reality: It signs authenticatorData with the hash of clientDataJSON; your hash is only the challenge string inside that JSON.
        why: Every other Ethereum signing flow signs the digest directly.
        source: webauthn-l2
  - id: webauthn-challenge-binding
    title: The challenge must commit to the whole action
    oneLine: A challenge that does not commit to account, chain, nonce and calldata is a replay hole; the UserOperation hash is the usual answer.
    statement: >
      The only application-controlled field inside the signed payload is the challenge, so everything the
      signature must be bound to has to be inside it: the account address, the chain id, the nonce, the
      calldata, and the EntryPoint if there is one. Setting the challenge to the UserOperation hash does that
      in one step. A challenge that commits to less - a bare message, a nonce alone - lets the same assertion
      authorise a different action, a different chain, or a second execution.
    volatility: evolving
    edges:
      - { to: webauthn-signed-payload, type: requires }
      - { to: user-operation, type: requires }
      - { to: chain-id-scoping, type: requires }
    sources: [certik-passkey-wallets, webauthn-l2]
  - id: webauthn-onchain-reconstruction
    title: Rebuilding the signed bytes on-chain
    oneLine: The contract hashes clientDataJSON, appends it to authenticatorData, hashes again, and verifies that digest against the P-256 key.
    statement: >
      On-chain verification means reproducing exactly what the authenticator signed. The contract receives
      `authenticatorData` and `clientDataJSON` as calldata, computes `SHA-256(clientDataJSON)`, concatenates it
      after `authenticatorData`, hashes the result with SHA-256 to get the digest, and passes that digest with
      the signature and public key to the P-256 verifier. Any deviation - hashing the wrong field, using
      keccak instead of SHA-256, reordering the concatenation - produces a digest that will never verify.
    volatility: evolving
    edges:
      - { to: webauthn-signed-payload, type: requires }
      - { to: abi-encoding, type: requires }
    sources: [webauthn-sol, webauthn-l2]
  - id: webauthn-clientdata-checks
    title: The checks the signature does not perform
    oneLine: Verify the ceremony type, the challenge value and its position, the relying-party binding, and the flag bits - or a valid signature from elsewhere is accepted.
    statement: >
      A correct verifier does more than check the P-256 signature. It must confirm that `clientDataJSON`
      declares `type` as `webauthn.get`, that the challenge it contains is the expected value at the expected
      position rather than merely present somewhere, that the relying-party hash in `authenticatorData`
      matches, and that the user-presence flag - and where required the user-verification flag - is set.
      Skipping these lets a genuine assertion produced for another origin or another ceremony be replayed as
      authorisation here.
    volatility: evolving
    edges:
      - { to: webauthn-onchain-reconstruction, type: requires }
      - { to: webauthn-challenge-binding, type: requires }
    sources: [certik-passkey-wallets, webauthn-sol]
    misconceptions:
      - belief: Verifying the P-256 signature is the whole check.
        reality: The type, challenge value and position, relying-party hash and flag bits must all be checked too.
        why: The verifier returns a satisfying boolean and the work feels done.
        source: certik-passkey-wallets
  - id: eip-7951-precompile
    title: Calling the secp256r1 verifier
    oneLine: Address 0x100 takes exactly 160 bytes - h, r, s, qx, qy - costs 6900 gas, and signals failure by returning nothing at all.
    statement: >
      EIP-7951 places a secp256r1 verifier at address `0x100`. Its input is exactly 160 bytes: the digest,
      `r`, `s`, and the public key coordinates `qx` and `qy`, each 32 bytes, in that order. On success it
      returns 32 bytes whose value is one. On failure it returns zero-length output - it does not revert and
      does not return 32 zero bytes - and 6900 gas is charged either way. A caller that checks only whether
      the staticcall succeeded therefore treats every invalid signature as valid; the check must be on the
      returned data.
    volatility: evolving
    edges:
      - { to: p256verify-precompile, type: requires }
      - { to: webauthn-onchain-reconstruction, type: requires }
    sources: [eip-7951, rip-7212]
    misconceptions:
      - belief: The precompile reverts on a bad signature.
        reality: It returns empty output while still charging 6900 gas, so require(success) accepts an invalid signature.
        why: Solidity's require(success) idiom around low-level calls.
        source: eip-7951
  - id: p256-precompile-vs-solidity
    title: Why the precompile changed the product
    oneLine: A native verifier at a flat 6900 gas turns passkey accounts from a subsidised experiment into a default.
    statement: >
      Before a native verifier existed, P-256 verification had to be implemented in Solidity, and the cost was
      high enough that passkey accounts on L1 only made sense when someone else was paying. EIP-7951 makes the
      verification a flat 6900 gas on L1, which removes cost as the deciding argument. L2s have had a verifier
      at the same address since RIP-7212, at their own price - measure the chain you are shipping on rather
      than quoting a figure, because the L1 and L2 pricing are set by different documents.
    volatility: evolving
    edges:
      - { to: eip-7951-precompile, type: requires }
    sources: [eip-7951, rip-7212]
    misconceptions:
      - belief: P-256 verification is too expensive to do on Ethereum.
        reality: A native verifier has existed at 0x100 on L1 since Fusaka in December 2025, at a flat 6900 gas.
        why: The Solidity-implementation cost was the accepted wisdom for years.
        source: eip-7951
  - id: eip-7951-no-low-s
    title: No low-s enforcement
    oneLine: EIP-7951 deliberately accepts both (r, s) and (r, n - s), because FIPS 186-5 does not require non-malleable ECDSA.
    statement: >
      Ethereum's secp256k1 rules reject high-s signatures, so most Ethereum engineers assume a signature has
      one valid form. EIP-7951 does not impose that requirement, following NIST FIPS 186-5, which does not
      require non-malleable ECDSA. Every P-256 signature therefore has a second, equally valid form. An
      account that derives replay protection, an identifier, or a deduplication key from the signature bytes
      is exploitable; protection must come from the nonce or from normalising the signature before use.
    volatility: evolving
    edges:
      - { to: eip-7951-precompile, type: requires }
      - { to: signature-malleability, type: requires }
      - { to: low-s-normalisation, type: contrasts }
    sources: [eip-7951]
    misconceptions:
      - belief: EIP-7951 rejects malleable signatures the way Ethereum's secp256k1 rules do.
        reality: It imposes no low-s requirement, so both (r, s) and (r, n - s) verify.
        why: EIP-2 trained everyone to expect low-s enforcement.
        source: eip-7951
  - id: passkey-rp-id-binding
    title: The credential is bound to your domain
    oneLine: A passkey is scoped to a relying party id, so your DNS name becomes part of the custody model.
    statement: >
      Every passkey is created against a relying party identifier - effectively your registrable domain - and
      the authenticator will only produce assertions for that identifier. This is what gives passkeys their
      phishing resistance, and it is also a custody dependency: a domain change, a migration between
      subdomains, a lapsed registration, or an embedded cross-origin context can leave a credential that still
      exists and can no longer be used. Choose the relying party id as carefully as you would choose a
      contract address.
    volatility: stable
    edges:
      - { to: passkey-definition, type: requires }
    sources: [yubico-webauthn-guide, webauthn-l2]
    misconceptions:
      - belief: The passkey works anywhere the user goes.
        reality: It is bound to the relying party id; a domain or subdomain change can make it unusable.
        why: Wallets feel domain-independent because seed-phrase wallets are.
        source: yubico-webauthn-guide
  - id: passkey-sync-vs-device-bound
    title: Synced credentials versus device-bound ones
    oneLine: Platform passkeys synced by the OS survive device loss but move custody into the OS account; device-bound ones do not sync and die with the device.
    statement: >
      Platform passkeys that synchronise through the operating system's credential manager survive the loss of
      any single device, at the price of making the user's OS or cloud account an authority over the wallet -
      whoever controls that account controls the credential. Device-bound credentials, including those on
      hardware security keys, never leave the device and are permanently gone when it is. Both are called
      passkeys, and the difference decides your entire recovery design, so a product must know which it is
      getting.
    volatility: evolving
    edges:
      - { to: passkey-definition, type: requires }
    sources: [webauthn-l2, yubico-webauthn-guide]
    misconceptions:
      - belief: Passkeys eliminate the "lose your key, lose your money" problem.
        reality: They relocate it - to the OS account for synced credentials, to the device for bound ones.
        why: Being backed up to the cloud is marketed as recovery.
        source: yubico-webauthn-guide
  - id: passkey-recovery-is-mandatory
    title: One credential is not a wallet
    oneLine: A passkey account with a single credential and no recovery path is a single point of failure that must be fixed at account creation.
    statement: >
      A smart account carries its own authentication and authorisation logic on chain, so adding a signer is
      a state change that an already-authorised signer has to approve. An account controlled by exactly one
      passkey with no other authorised signer therefore has no recovery path at all: the only party the
      contract will listen to is the credential that no longer exists. The remedy has to be applied at
      account creation - a second credential, a co-owner, or a guardian set - because every mechanism for
      adding one later needs an existing authorisation. Deferring it to a settings screen the user will visit
      "later" means the failure mode is a user with no working credential and no way to obtain one.
    volatility: evolving
    edges:
      - { to: passkey-needs-smart-account, type: requires }
    sources: [erc-4337-docs, certik-passkey-wallets]
  - id: passkey-pubkey-must-be-registered
    title: Registering a credential is a transaction
    oneLine: The account contract must hold the credential's public key on-chain, so adding a device requires authorisation from a credential you already have.
    statement: >
      Verification requires the account to know the credential's public key, and usually its credential id, in
      its own storage. Registering a new device is therefore a state change the account must authorise - which
      means it must be signed by an existing credential, a guardian, or a co-owner. A user holding zero working
      credentials cannot register a new one, no matter what support wants to do for them, because there is no
      party the contract will listen to.
    volatility: evolving
    edges:
      - { to: passkey-needs-smart-account, type: requires }
      - { to: passkey-recovery-is-mandatory, type: requires }
    sources: [certik-passkey-wallets, erc-4337-docs]
    misconceptions:
      - belief: After losing a device you can just register a new passkey.
        reality: Registration is an on-chain change that an existing credential or guardian must authorise.
        why: Web services let a support agent re-enrol you.
        source: certik-passkey-wallets
  - id: passkey-recovery-mechanisms
    title: The recovery options and what each one costs
    oneLine: Several registered credentials, an EOA co-owner, social guardians with a timelock, or a custodial fallback - each with a different trust and phishing profile.
    statement: >
      Every recovery design is the same move in different clothing: widen the set of parties the account's
      own validation logic will accept. The designs in circulation are registering credentials on several
      authenticators; adding an EOA or hardware wallet as a co-owner; a guardian set that can rotate the
      signer after a timelock; and a custodial fallback held by the product. Because they all work by
      widening that set, they trade against each other rather than stacking - more recovery paths means more
      parties who can take the account, and a timelock that protects against guardian collusion also delays
      the honest user. No standard ranks them, so pick deliberately and state who can take the account under
      each design.
    volatility: evolving
    edges:
      - { to: passkey-recovery-is-mandatory, type: requires }
      - { to: passkey-sync-vs-device-bound, type: requires }
    sources: [erc-4337-docs, webauthn-l2, certik-passkey-wallets]
