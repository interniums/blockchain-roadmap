moduleId: app-session-keys
concepts:
  - id: session-key-definition
    title: Session key
    oneLine: A secondary keypair the account authorises to act on the user's behalf under a policy, so the app need not ask for every signature.
    statement: >
      A session key is a keypair - usually generated by the app, not by the user's wallet - which the user's
      account is configured to accept as an authorised signer for a restricted set of actions over a bounded
      period. The user consents once, at grant time; afterwards the app signs with the session key and the
      account's validation logic decides whether each action falls inside the granted policy. The user's
      primary key is never used again for those actions and never leaves the wallet.
    volatility: hot
    edges:
      - { to: session-key, type: requires }
    sources: [erc-4337-session-keys-docs, erc-7715]
    misconceptions:
      - belief: A session key is safe because it is temporary.
        reality: Safety comes from the policy bound to it; a one-hour key with unlimited transfer authority can drain everything within the hour.
        why: The word 'session' borrows web-session intuitions, where the server holds the real authority.
        source: erc-4337-session-keys-docs
  - id: session-key-needs-programmable-account
    title: Session keys need a programmable account
    oneLine: A plain EOA's authority is all-or-nothing; scoping requires either a smart account or an EOA delegated to smart-account code.
    statement: >
      A plain externally owned account cannot scope its own key: whoever holds the private key can do
      anything the account can do, and there is no code in the account to say otherwise. Scoped authority
      therefore requires code in the validation path - either an ERC-4337 smart account, or an existing EOA
      that has delegated to smart-account code under EIP-7702. The second route matters commercially because
      it does not require the user to move to a new address.
    volatility: hot
    edges:
      - { to: session-key-definition, type: requires }
      - { to: delegation-designator, type: requires }
      - { to: eoa, type: contrasts }
    sources: [eip-7702, erc-4337-docs]
    misconceptions:
      - belief: Session keys require an ERC-4337 smart account.
        reality: An EIP-7702-delegated EOA runs the same validation code at the same address, so a new account is no longer required.
        why: All the tooling predates 7702.
        source: eip-7702
  - id: session-key-policy-dimensions
    title: The dimensions a policy can constrain
    oneLine: Target addresses, function selectors, argument values, per-call and cumulative caps, rate, gas budget, chain id, and a validity window.
    statement: >
      A useful session-key policy constrains several dimensions at once: which contract addresses may be
      called, which function selectors on them, which argument values are acceptable, a per-call value cap and
      a cumulative one, a call-rate limit, a gas budget, the chain id, and a `validAfter`/`validUntil` window.
      Each dimension you leave unconstrained is a dimension an attacker chooses. Enumerating them before
      implementation is the cheapest security work available here, because the omissions are invisible once
      the happy path works.
    volatility: hot
    edges:
      - { to: session-key-definition, type: requires }
    sources: [erc-7715, erc-4337-session-keys-docs]
  - id: session-key-enforced-on-chain
    title: A policy is only real if the account enforces it
    oneLine: Client-side policy checks stop bugs, not attackers, because the attacker holds the key and skips your client.
    statement: >
      Only the account's on-chain validation logic can enforce a session-key policy. Anything checked in your
      application code is advisory: whoever holds the session key can construct calls directly, bypassing your
      client entirely. A spending cap tracked in a client-side store, or a rate limit enforced by your API, is
      a bug-prevention measure that provides no security guarantee at all against the party the policy exists
      to constrain.
    volatility: hot
    edges:
      - { to: session-key-policy-dimensions, type: requires }
    sources: [erc-7710, erc-7579]
    misconceptions:
      - belief: The app can enforce the spending limit.
        reality: The app holds the key; only the account's on-chain validation can enforce anything.
        why: Engineers map this onto API rate limits, where the server is the authority.
        source: erc-7710
  - id: erc-7579-validator-vs-executor
    title: Validators and executors are different module types
    oneLine: In a modular account a validator decides whether a call is authorised and an executor performs calls; conflating them is a privilege-escalation class.
    statement: >
      ERC-7579 defines a minimal interface for modular smart accounts with distinct module types - validators,
      executors, hooks and fallbacks. A validator answers "is this signature or permission sufficient to
      authorise this call"; an executor is granted the ability to make the account perform calls. Installing a
      module in the wrong role, or letting a validator's return value be reachable from the execution path,
      is a known way to turn a restricted permission into full account control.
    volatility: evolving
    edges:
      - { to: session-key-enforced-on-chain, type: requires }
      - { to: delegatecall-is-the-proxy-primitive, type: requires }
    sources: [erc-7579]
  - id: session-key-4337-validation-limits
    title: Validation cannot look at everything
    oneLine: ERC-4337's validation phase restricts the storage and opcodes an account may touch, so some policy checks must move to execution.
    statement: >
      So that a bundler can decide whether to include a UserOperation without executing it, ERC-4337
      constrains what the validation phase may do - notably which storage a validator may read and which
      opcodes it may use. A policy that wants to consult arbitrary external state during validation therefore
      cannot; those checks get pushed into the execution phase or a post-operation hook, where they fail
      differently and cost the bundler nothing to trigger. This is why session-key modules look more awkward
      than the policy you would write in plain Solidity.
    volatility: hot
    edges:
      - { to: session-key-enforced-on-chain, type: requires }
      - { to: entrypoint, type: requires }
      - { to: user-operation, type: requires }
    sources: [erc-4337-docs]
  - id: erc-7715-grant-permissions
    title: wallet_grantPermissions
    oneLine: ERC-7715 defines a JSON-RPC method where the dapp asks the wallet for a scoped, time-bounded permission and gets back a signed context.
    statement: >
      ERC-7715 specifies `wallet_grantPermissions`: the app describes the permission it wants - the account,
      the scope, the expiry - the wallet renders a single human-readable consent screen, and on approval
      returns a permissions context the app stores alongside its session key. It is a draft ERC, implemented
      experimentally by a small number of wallets, so an app must feature-detect it and expect the shape of
      what it gets back to differ between implementations.
    volatility: hot
    edges:
      - { to: session-key-definition, type: requires }
      - { to: wallet-capabilities, type: requires }
    sources: [erc-7715, metamask-delegation-toolkit]
    misconceptions:
      - belief: ERC-7715 is a finished standard you can rely on.
        reality: It is a draft implemented experimentally by a few wallets; assume divergence and feature-detect.
        why: Having an ERC number reads as being standardised.
        source: erc-7715
  - id: erc-7710-delegation-manager
    title: The on-chain half of a granted permission
    oneLine: ERC-7710 defines a delegation-manager interface the app calls with the permissions context each time it exercises the authority.
    statement: >
      ERC-7715 grants a permission off-chain; ERC-7710 is what redeems it on-chain. It specifies a
      delegation-manager interface: the app presents the permissions context together with the action it wants
      performed, and the manager checks the delegation and forwards the call to the account. The pairing is
      the point - a grant with no on-chain redemption path is a promise, and an on-chain manager with no
      standard grant flow is a wallet-specific integration.
    volatility: hot
    edges:
      - { to: erc-7715-grant-permissions, type: requires }
      - { to: session-key-enforced-on-chain, type: requires }
    sources: [erc-7710]
  - id: session-key-expiry-is-free
    title: Expiry costs nothing
    oneLine: A validUntil timestamp ends the authority with no transaction, which is why short-lived keys are the cheap default.
    statement: >
      Expiry is evaluated during validation against the block timestamp, so authority simply stops being
      valid when the window closes. No transaction is needed, no gas is spent, and nobody has to be online at
      the moment it happens. That asymmetry - free to expire, expensive to revoke - is the reason a
      well-designed session key is short-lived and re-granted rather than long-lived and revocable.
    volatility: evolving
    edges:
      - { to: session-key-policy-dimensions, type: requires }
    sources: [erc-7715]
  - id: session-key-revocation-costs-gas
    title: Revocation is a state change
    oneLine: Early revocation is a transaction - uninstall the module, bump a nonce, flip a registry bit - with gas, a signer, and inclusion delay.
    statement: >
      Revoking a session key before its expiry means changing on-chain state: uninstalling the validator
      module, bumping a session nonce, or flipping a bit in a registry. That is a transaction. It costs gas,
      it needs a signer who is available and funded, and it is not effective until it is included in a block.
      A product that offers a revoke button must therefore also model the funded-signer requirement and the
      pending state.
    volatility: evolving
    edges:
      - { to: session-key-expiry-is-free, type: contrasts }
      - { to: session-key-enforced-on-chain, type: requires }
    sources: [erc-7715, erc-7710]
    misconceptions:
      - belief: Revoking takes effect the moment the user clicks revoke.
        reality: It is a transaction - it costs gas, needs inclusion, and does nothing until it lands.
        why: Web sessions are revoked by deleting a row on a server.
        source: erc-7715
  - id: session-key-revocation-race
    title: The revocation race
    oneLine: Between clicking revoke and the revocation being mined, the key is still valid - and the revocation is public.
    statement: >
      A revocation transaction is visible in the public mempool before it is included. During that window the
      session key remains fully valid, and an attacker holding a compromised key can observe the revocation
      and submit their own operation with a higher fee to be included first. The defensive design is not a
      faster button: it is a policy small enough that losing the whole remaining allowance during the race is
      an acceptable outcome.
    volatility: evolving
    edges:
      - { to: session-key-revocation-costs-gas, type: requires }
      - { to: mempool-is-a-public-broadcast, type: requires }
    sources: [erc-7715]
  - id: session-key-blast-radius
    title: Blast radius, not safety
    oneLine: The security claim is never "this key is safe" - it is "if this key leaks, the loss is bounded by the policy".
    statement: >
      A session key is a key held by software, in a browser or on a server, without a human in the approval
      loop. Assume it leaks. The correct security argument is therefore about the bound on the loss, not about
      the probability of compromise: the policy must be sized to an amount you are willing to lose in one
      window. Stating that bound explicitly is what turns a session key from a convenience feature into a
      designed risk.
    volatility: stable
    edges:
      - { to: session-key-policy-dimensions, type: requires }
    sources: [erc-7715, openfort-smart-wallet-security]
  - id: session-key-material-location
    title: Where the key actually lives
    oneLine: Page memory, IndexedDB, a service worker, a device enclave, or your server - each is a different attack surface, and this usually matters more than the policy.
    statement: >
      A session key's blast radius is bounded by its policy; whether it is stolen at all is decided by where
      the private key sits. A key in page memory dies with the tab but is reachable by any script the page
      loads; a key in IndexedDB persists and is readable by any same-origin script, because IndexedDB is
      origin-scoped client-side storage; a credential held by a platform authenticator is non-exportable by
      construction but is bound to that authenticator; a key on your server makes you the custodian and
      therefore the target. Both questions have to be answered, and only the policy one has an ERC to read.
    volatility: evolving
    edges:
      - { to: session-key-definition, type: requires }
      - { to: session-key-blast-radius, type: deepens }
    sources: [mdn-indexeddb, webauthn-l2, erc-7715, openfort-smart-wallet-security]
  - id: session-key-vs-token-approval
    title: An unlimited approval is a session key with the worst policy
    oneLine: Unbounded amount, no expiry, and revocation that costs a transaction - the pattern predates the name.
    statement: >
      An unlimited ERC-20 `approve` to a router grants a third party the ability to move a token balance with
      no amount cap, no expiry, and a revocation that costs a transaction. That is structurally identical to a
      session key, with every policy dimension set to its worst value. Seeing the two as the same pattern is
      useful in both directions: it explains why unlimited approvals are dangerous, and it sets the bar a
      session key must clear to be an improvement rather than a rebrand.
    volatility: stable
    edges:
      - { to: session-key-blast-radius, type: requires }
      - { to: erc20-allowance-model, type: requires }
    sources: [erc-7710, erc-7715]
    misconceptions:
      - belief: A session key is a new idea.
        reality: An unlimited approve is the same delegation with unbounded amount, no expiry, and costly revocation.
        why: The two are taught in unrelated chapters.
        source: erc-7710
  - id: session-key-consent-moves-not-disappears
    title: Consent relocates
    oneLine: Removing the per-transaction prompt moves all the consent into one grant screen the user reads once, quickly, with less context.
    statement: >
      The per-transaction prompt is not only friction; it is where the user learns what is happening, one
      action at a time, with the action in front of them. A session key removes those prompts and concentrates
      the entire decision into a single grant screen shown before any of the actions exist. If that screen
      does not state the contract, the exact actions, the cap and the expiry, the product has made consent
      worse while measuring the improvement in prompts removed.
    volatility: stable
    edges:
      - { to: erc-7715-grant-permissions, type: requires }
      - { to: 7702-upgrade-consent, type: deepens }
    sources: [erc-7715, metamask-advanced-permissions]
    misconceptions:
      - belief: Session keys remove the need for user consent.
        reality: Consent is compressed into one grant screen; if it is vague, consent got worse rather than lighter.
        why: The UX win is measured in prompts removed, and that metric always improves.
        source: metamask-advanced-permissions
