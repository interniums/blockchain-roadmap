moduleId: app-transaction-ux
concepts:
  - id: tx-lifecycle-states
    title: The transaction state machine
    oneLine: Constructed, simulated, signed, broadcast, pending, included, confirmed, finalized - plus replaced, dropped, and included-and-reverted.
    statement: >
      A transaction moves through a sequence: constructed, simulated, signed, broadcast, pending in a mempool,
      included in a block, confirmed to some depth, and finalized. Three edges leave the happy path and each
      is a different outcome: it can be **replaced** by another transaction at the same nonce, **dropped**
      from mempools without ever being mined, or **included and reverted** - mined, charged, and having
      accomplished nothing. A UI that models only the happy path plus a timeout cannot distinguish these.
    volatility: stable
    edges:
      - { to: mempool-is-a-public-broadcast, type: requires }
      - { to: tx-type-2-1559, type: requires }
    sources: [viem-wait-for-transaction-receipt, eip-1559]
  - id: tx-is-not-request-response
    title: Sending is not a request
    oneLine: Broadcasting returns only a hash; success, failure and never-happened are discovered later and are three distinct outcomes.
    statement: >
      There is no status code. `eth_sendRawTransaction` returns a hash, which says only that a node accepted
      the bytes into its mempool. Everything you care about - whether it executed, whether it succeeded,
      whether it exists at all - is learned afterwards by polling for a receipt. Modelling this as a promise
      that resolves or rejects loses information, because "no receipt yet" and "no receipt ever" are the same
      shape and different facts.
    volatility: stable
    edges:
      - { to: tx-lifecycle-states, type: requires }
    sources: [viem-wait-for-transaction-receipt]
  - id: tx-receipt-status-zero
    title: Mined is not succeeded
    oneLine: A receipt with status reverted means the transaction was included, did nothing useful, and consumed gas.
    statement: >
      Every included transaction produces a receipt, including the ones that reverted. A receipt with a
      reverted status means the transaction occupied a block, consumed the gas it used, and left no intended
      state change. The presence of a receipt therefore proves inclusion, not success - the UI must read the
      status field, and a "confirmed" toast fired on receipt arrival is wrong roughly as often as your
      contract reverts.
    volatility: stable
    edges:
      - { to: tx-lifecycle-states, type: requires }
    sources: [viem-wait-for-transaction-receipt]
    misconceptions:
      - belief: If the transaction was mined, it worked.
        reality: Reverted receipts are mined, failed, and fully charged; you must read the receipt's status.
        why: HTTP conflates delivery with success, and so does the word "confirmed".
        source: viem-wait-for-transaction-receipt
  - id: tx-nonce-is-a-sequence
    title: One stuck transaction blocks the account
    oneLine: An account's transactions execute in strict nonce order, so a pending transaction at nonce N blocks every later nonce behind it.
    statement: >
      Each account's transactions are executed in strict nonce order. A transaction sitting unmined at nonce N
      means nothing at N+1 or beyond can be included, no matter how high a fee it offers. Users experience
      this as "all my transactions are stuck" when only one is, and applications experience it as a queue with
      head-of-line blocking that they did not know they had. Any app that submits several transactions from
      one account inherits this ordering constraint.
    volatility: stable
    edges:
      - { to: tx-lifecycle-states, type: requires }
      - { to: nonce-ordering, type: requires }
      - { to: nonce-gap, type: requires }
    sources: [eip-1559, viem-wait-for-transaction-receipt]
  - id: tx-stuck-from-fee-cap
    title: Parked, not failed
    oneLine: Under EIP-1559 a transaction is unminable while the base fee exceeds its maxFeePerGas - and becomes minable again if the base fee falls.
    statement: >
      EIP-1559 splits the fee into a protocol-set base fee and a priority fee, with `maxFeePerGas` as the
      total ceiling the sender authorises. While the block base fee is above that ceiling the transaction
      cannot be included at all. It has not failed and has not been dropped; it is parked, and a later fall in
      base fee can make it minable hours afterwards. This is why "pending for an hour" and "will never be
      mined" are different states requiring different messages and different buttons.
    volatility: stable
    edges:
      - { to: tx-lifecycle-states, type: requires }
      - { to: eip-1559-fee-fields, type: requires }
    sources: [eip-1559]
    misconceptions:
      - belief: A transaction that has not been mined for an hour has failed.
        reality: It may be parked because base fee exceeds its cap and can still be mined much later - or it may have been dropped, which is a different state.
        why: Timeouts mean failure in every other system.
        source: eip-1559
  - id: tx-dropped
    title: Dropped
    oneLine: A transaction can be evicted from mempools and never mined, and there is no event - you infer it from no receipt and a freed nonce.
    statement: >
      Mempools are node-local caches with finite capacity and their own eviction policies. A transaction can
      be discarded for offering too low a fee, for waiting too long, or simply because nodes restarted. Nothing
      announces this. You observe it indirectly: no receipt appears, and the account's next nonce is still the
      one this transaction was using, meaning the slot is free again. Detecting it requires comparing the
      account's nonce with the transaction's, not just waiting longer.
    volatility: evolving
    edges:
      - { to: tx-lifecycle-states, type: requires }
      - { to: mempool-is-not-global, type: requires }
    sources: [viem-errors-glossary, eip-1559]
  - id: tx-replacement-same-nonce
    title: Replacement is the only edit
    oneLine: You cannot modify or withdraw a pending transaction; you can only broadcast a different one at the same nonce with a higher fee.
    statement: >
      Nothing in the protocol removes a broadcast transaction. The only mechanism is to publish a different
      transaction using the same nonce and a higher fee, and hope nodes replace the old one in their mempools
      and the new one is included first. Clients require a minimum fee increase before they will accept a
      replacement; that threshold is client mempool policy rather than a protocol rule, and it differs between
      clients and between the legacy and blob pools, so treat it as a value to look up for the chain and
      client you are dealing with rather than a constant.
    volatility: evolving
    edges:
      - { to: tx-nonce-is-a-sequence, type: requires }
      - { to: transaction-replacement, type: requires }
    sources: [eip-1559]
  - id: tx-cancel-is-a-replacement
    title: Cancel is a replacement that does nothing
    oneLine: A cancel is a zero-value self-send at the same nonce - it costs gas, it can lose the race, and the original may still land.
    statement: >
      Wallets label it "Cancel" because that is the word users know, but the mechanism is a replacement whose
      payload does nothing: a zero-value transfer to yourself at the same nonce with a higher fee. It costs
      gas whether or not it helps. It can lose the race, in which case the original executes as though nothing
      happened. Any UI offering the button must say both of those things, because the user's model is a delete
      that is free and certain.
    volatility: stable
    edges:
      - { to: tx-replacement-same-nonce, type: requires }
    sources: [eip-1559]
    misconceptions:
      - belief: You can cancel a pending transaction.
        reality: You can only race it with a same-nonce replacement that costs gas and may lose.
        why: Every other queue in software supports cancellation.
        source: eip-1559
  - id: tx-replacement-reasons
    title: Three kinds of replacement
    oneLine: viem classifies a replacement as repriced, cancelled, or replaced - and they are three different things to tell the user.
    statement: >
      When `waitForTransactionReceipt` detects a different transaction from the same sender at the same nonce,
      it reports the reason: `repriced` when the value and data are unchanged and only the fee rose,
      `cancelled` when the value went to zero, and `replaced` when the value or data differ. These are
      genuinely different events - the user sped up their action, abandoned it, or did something else with the
      same slot - and collapsing them into "your transaction changed" throws away the only information the
      user needs to know what happened.
    volatility: evolving
    edges:
      - { to: tx-replacement-same-nonce, type: requires }
    sources: [viem-wait-for-transaction-receipt]
  - id: tx-replacement-changes-the-hash
    title: The hash is not a stable identifier
    oneLine: A replaced transaction has a new hash, so any record, webhook or UI keyed on the original silently orphans.
    statement: >
      The transaction hash is a hash of the signed contents, so changing the fee changes the hash. The user's
      intent did not change and the nonce did not change, but every row, webhook subscription and UI element
      keyed on the old hash now points at something that will never appear. The durable key for a user's action
      is `(address, chainId, nonce)`; the hash is a mutable attribute of it. viem's `onReplaced` callback
      exists precisely so you can re-key when this happens.
    volatility: evolving
    edges:
      - { to: tx-replacement-same-nonce, type: requires }
      - { to: tx-replacement-reasons, type: requires }
    sources: [viem-wait-for-transaction-receipt]
    misconceptions:
      - belief: The transaction hash is a stable identifier for the user's action.
        reality: Speeding up or cancelling produces a new hash for the same nonce; key on (address, chainId, nonce).
        why: Hashes look like UUIDs, and every other system hands you an immutable id.
        source: viem-wait-for-transaction-receipt
  - id: tx-simulate-before-send
    title: Simulate before you ask for a signature
    oneLine: Simulating against pending state converts most reverts into a message shown before the user signs anything.
    statement: >
      Most of the failure states in this module only exist because a transaction was sent that was never going
      to succeed. Running the call against pending state first turns those into an error you can explain
      before the wallet prompt appears - no signature, no gas, no pending state, no reverted receipt to
      explain afterwards. It is the single highest-leverage change available in transaction UX, and it costs
      one read call.
    volatility: stable
    edges:
      - { to: viem-simulate-before-send, type: requires }
      - { to: tx-receipt-status-zero, type: contrasts }
    sources: [viem-simulate-contract]
  - id: tx-confirmations-vs-finality
    title: Confirmations and finality are different guarantees
    oneLine: Confirmation depth is a probabilistic heuristic; Ethereum finality is a separate property reached after two epochs.
    statement: >
      Waiting for N blocks on top of yours is a probabilistic heuristic inherited from proof of work.
      Ethereum's consensus provides something different: a checkpoint that has been finalized cannot be
      reverted without an enormous, attributable economic loss, and that state is reached after two epochs -
      64 slots of twelve seconds under ideal conditions. Below finality, a reorg of unfinalized blocks remains
      possible. Published wall-clock figures for finality disagree - the ideal arithmetic and measured medians
      are not the same number - so treat the two-epoch mechanism as the fact and any minute count as an
      observation to re-measure.
    volatility: evolving
    edges:
      - { to: tx-lifecycle-states, type: requires }
      - { to: casper-ffg, type: requires }
      - { to: finality-is-a-spectrum, type: requires }
    sources: [ethereum-org-ssf, circle-confirmation-rules]
    misconceptions:
      - belief: One confirmation is enough because Ethereum is proof of stake.
        reality: Proof of stake gives finality after two epochs, not instant irreversibility; unfinalized blocks can still be reorged.
        why: The claim that proof of stake has finality compresses into a belief that it is instant.
        source: ethereum-org-ssf
  - id: tx-confirmation-policy-is-a-product-decision
    title: How long to wait is a value-at-risk decision
    oneLine: The number of confirmations is set by what you do next and what it costs to be wrong, not by a constant someone published.
    statement: >
      There is no universally correct confirmation count. The right policy is derived per action from the
      value at risk and the reversibility of what you do on receipt: a UI toast can move on the first
      confirmation, crediting an internal balance should wait longer, and anything irreversible off-chain -
      shipping goods, paying out, sending an email that cannot be unsent - should wait for finality. Any
      number quoted as an industry standard is a policy someone else derived from their own exposure, not
      yours.
    volatility: stable
    edges:
      - { to: tx-confirmations-vs-finality, type: requires }
    sources: [circle-confirmation-rules, ethereum-org-ssf]
    misconceptions:
      - belief: There is a standard number of confirmations dApps wait for.
        reality: Confirmation depth is a value-at-risk policy; circulating "standard" figures are unsourced and were derived for someone else's exposure.
        why: A number is easier to copy than a risk model.
        source: circle-confirmation-rules
  - id: tx-reorg-effects
    title: What a reorg does to your screen
    oneLine: An included transaction can return to pending, re-execute with different results, or vanish - and its logs are re-delivered marked removed.
    statement: >
      In a reorg the blocks on the losing branch are discarded. A transaction included in one of them may be
      re-included later, may execute against different state and produce a different result, or may never
      reappear. Log subscriptions re-deliver the affected events with a `removed` flag set, which means any
      indexer or UI that appends on log receipt must also be able to un-append. An interface that showed
      "confirmed" for something now absent is showing a state that no longer exists anywhere.
    volatility: evolving
    edges:
      - { to: tx-confirmations-vs-finality, type: requires }
      - { to: reorg, type: requires }
      - { to: log-record-shape, type: requires }
    sources: [viem-watch-contract-event, ethereum-org-ssf]
    misconceptions:
      - belief: Event logs are append-only.
        reality: Reorged logs are re-delivered with removed set; consumers that only handle additions display phantom state.
        why: Log streams look like an append-only message queue.
        source: viem-watch-contract-event
  - id: tx-l2-confirmation-tiers
    title: Confirmed on an L2 means at least three things
    oneLine: A sequencer acknowledgement, data posted to L1, and a proof or challenge window passed are different guarantees with different wall-clock costs.
    statement: >
      On a rollup, "confirmed" has several distinct meanings stacked on each other: the sequencer has accepted
      and ordered the transaction, typically in well under a second; the transaction's data has been posted to
      L1; and, depending on the proof system, a validity proof has been verified or a challenge window has
      elapsed. Only the last inherits L1's security. Because the durations differ per rollup and change, look
      them up for the specific chain rather than hardcoding a number, and decide which tier each of your
      actions requires.
    volatility: hot
    edges:
      - { to: tx-confirmations-vs-finality, type: requires }
      - { to: rollup, type: recommends }
    sources: [arbitrum-tx-lifecycle, l2beat]
    misconceptions:
      - belief: An L2 transaction confirmed by the sequencer is final.
        reality: That is a sequencer promise; the data must still reach L1 and, for optimistic rollups, survive a challenge window.
        why: L2 interfaces show a green check in under a second.
        source: l2beat
  - id: tx-one-intent-many-transactions
    title: One intent, several transactions
    oneLine: Approve-then-swap and bridge-then-act are one user intent split across transactions; EIP-5792 lets a wallet report them as one status.
    statement: >
      Users have intents; chains have transactions, and the mapping is often one to many. Approve then swap,
      bridge then act, permit then deposit - each is a single thing the user asked for and several things they
      must wait for. EIP-5792's `wallet_sendCalls` plus `wallet_getCallsStatus` lets the wallet accept and
      report on the whole group as one unit, which is what makes the interface match the intent instead of
      matching the chain's decomposition of it.
    volatility: hot
    edges:
      - { to: tx-lifecycle-states, type: requires }
      - { to: erc-5792-sendcalls, type: requires }
    sources: [eip-5792]
  - id: tx-optimistic-ui-boundary
    title: Where optimistic UI stops
    oneLine: Optimistic rendering is safe for reversible display state and unsafe for anything that triggers an irreversible off-chain effect.
    statement: >
      Showing the expected outcome before confirmation is good interface design for anything you can take
      back: a balance that re-renders, a list that re-sorts, a badge that disappears. It is unsafe the moment
      the optimistic state triggers something outside your database - dispatching an order, sending a payout,
      emailing a receipt - because a revert or a reorg leaves no way to undo it. The boundary is not the
      confidence level, it is the reversibility of the consequence.
    volatility: stable
    edges:
      - { to: tx-confirmation-policy-is-a-product-decision, type: requires }
      - { to: tx-reorg-effects, type: requires }
    sources: [ethereum-org-ssf, circle-confirmation-rules]
