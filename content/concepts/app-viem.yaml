moduleId: app-viem
concepts:
  - id: viem-client-vs-transport
    title: Client vs Transport
    oneLine: A Client is actions bound to a chain and an account; a Transport is only the wire that carries JSON-RPC.
    statement: >
      In viem a Client bundles a set of actions together with a chain and, optionally, an account. A Transport
      is a separate object that does nothing but carry JSON-RPC requests - `http()`, `webSocket()`,
      `custom(window.ethereum)`, or `fallback([...])`. Because the two are separate, the same action
      (`readContract`, `getBalance`) is unchanged whether it travels over HTTP, a socket, or an injected
      browser wallet. When something breaks, the split tells you where to look: an action that returns the
      wrong answer is a chain or ABI problem, and an action that never returns is a transport problem.
    volatility: evolving
    edges:
      - { to: rpc-endpoints-aliases, type: requires }
      - { to: viem-actions-are-functions, type: deepens }
    sources: [viem-clients]
    misconceptions:
      - belief: The client is the connection, so a new chain means a new library setup.
        reality: The client is a bundle of actions; only the transport is the connection, and it is one argument.
        why: Older libraries fused provider, signer, and network into one object.
        source: viem-clients
  - id: viem-actions-are-functions
    title: Actions are standalone functions
    oneLine: Every viem action is an importable tree-shakable function; clients are thin holders, not god objects.
    statement: >
      Each viem action is a standalone function that takes a client as its first argument, so the bundle only
      contains the actions you imported. Clients are correspondingly thin: `client.extend()` grafts extra
      action sets - public, wallet, test - onto a single client rather than forcing you to hold several.
      This is why viem has no monolithic provider object and why every action can be typed independently.
    volatility: evolving
    edges:
      - { to: viem-client-vs-transport, type: requires }
    sources: [viem-clients]
  - id: viem-public-client
    title: Public client
    oneLine: createPublicClient exposes read-only actions and never holds a key.
    statement: >
      `createPublicClient({ chain, transport })` returns a client carrying the read-only action set:
      `readContract`, `getBalance`, `estimateGas`, `call`, `getLogs`, `waitForTransactionReceipt` and the
      rest. It has no account and cannot sign, so nothing it does can move funds. Anything that changes state
      requires a different client, and that separation is enforced at the type level rather than by convention.
    volatility: evolving
    edges:
      - { to: viem-client-vs-transport, type: requires }
      - { to: viem-wallet-client, type: contrasts }
    sources: [viem-clients]
  - id: viem-wallet-client
    title: Wallet client
    oneLine: createWalletClient exposes signing and sending, backed either by a local key or by the user's wallet.
    statement: >
      `createWalletClient` carries the actions that produce signatures and broadcast transactions -
      `sendTransaction`, `writeContract`, `signMessage`, `signTypedData`. Its account is either a Local
      Account (a private key held in your process) or a JSON-RPC Account (the wallet holds the key and viem
      only asks). The client's shape is the same either way; what differs is who can refuse.
    volatility: evolving
    edges:
      - { to: viem-client-vs-transport, type: requires }
      - { to: viem-public-client, type: contrasts }
      - { to: eoa, type: requires }
    sources: [viem-clients]
  - id: viem-account-kinds
    title: Local account vs JSON-RPC account
    oneLine: A local account signs in your runtime; a JSON-RPC account delegates signing to the wallet, so viem never sees the signature in advance.
    statement: >
      A Local Account holds the private key in your process: viem builds the transaction, signs it locally,
      and submits raw bytes via `eth_sendRawTransaction`. A JSON-RPC Account holds no key at all - viem hands
      the wallet an `eth_sendTransaction` request and the wallet fills in nonce, fees, and signature according
      to its own policy. The consequence is practical: with a JSON-RPC account you cannot pre-compute the
      signature, cannot guarantee the exact fee fields, and must treat every send as a request that can be
      rejected by a human.
    volatility: evolving
    edges:
      - { to: viem-wallet-client, type: requires }
      - { to: keypair, type: requires }
    sources: [viem-clients]
    misconceptions:
      - belief: viem signs the transaction and the wallet just relays it.
        reality: With a JSON-RPC account the wallet signs; viem only describes what it wants signed.
        why: Local-account examples in tutorials look identical at the call site.
        source: viem-clients
  - id: viem-transport-fallback
    title: Fallback transport
    oneLine: fallback([http(a), http(b)]) ranks and fails over between RPC endpoints, and http() batches eligible requests by default.
    statement: >
      `fallback([http(a), http(b)])` wraps several transports into one, trying them in order and moving on
      when one errors, so a single provider outage does not take the app down. Separately, the `http()`
      transport batches eligible JSON-RPC requests into a single array request by default, which changes the
      request count your provider bills you for without changing your code.
    volatility: evolving
    edges:
      - { to: viem-client-vs-transport, type: requires }
      - { to: rpc-cost-model, type: applies }
    sources: [viem-clients]
  - id: viem-multicall-batching
    title: Multicall batching
    oneLine: multicall aggregates many reads into one Multicall3 call, trading N round trips for one.
    statement: >
      `multicall` packs many `readContract` calls into a single on-chain call to the Multicall3 contract, so
      the cost changes from N network round trips to one. With `allowFailure: true` each entry comes back with
      its own status instead of one failing entry poisoning the batch. The saving is latency and request
      count, not chain compute - the same reads still execute.
    volatility: evolving
    edges:
      - { to: viem-public-client, type: requires }
      - { to: rpc-cost-model, type: applies }
    sources: [viem-multicall]
  - id: viem-abi-const-inference
    title: Types come from the ABI value
    oneLine: An ABI declared `as const` gives TypeScript the function names, argument tuples and return types with no codegen step.
    statement: >
      viem infers contract types from the ABI value itself. An ABI declared with `as const` (or generated by
      the wagmi CLI) is a literal type, so TypeScript can narrow `functionName` to a union of the real
      function names, `args` to the correct tuple, and the return value to the correct type. A plain JSON
      import is widened to `string`/`unknown[]` and you get no inference at all - which is why "it compiles
      but has no autocomplete" is almost always an `as const` that is missing.
    volatility: evolving
    edges:
      - { to: abi-encoding, type: requires }
      - { to: function-selector, type: requires }
    sources: [viem-typescript]
    misconceptions:
      - belief: TypeScript inference works from an imported JSON ABI.
        reality: Inference needs a literal type - `as const` on an inline ABI - or you get `string` and `unknown[]`.
        why: Importing JSON is the natural habit from every other kind of API client.
        source: viem-typescript
  - id: viem-bigint-boundary
    title: Every EVM integer is a bigint
    oneLine: EVM integers cross into JavaScript as bigint, never number, and float math on token amounts is always a bug.
    statement: >
      Every integer viem returns from the chain is a JavaScript `bigint`: balances, token amounts, block
      numbers, gas values. `number` cannot represent a uint256 and silently loses precision above 2^53, so
      viem never uses it for chain values. The sanctioned conversions are `parseEther`, `parseUnits`,
      `formatEther` and `formatUnits`, which move between a human decimal string and the integer base unit.
      Any arithmetic that passes a token amount through a float is a bug even when the test passes.
    volatility: stable
    edges:
      - { to: viem-actions-are-functions, type: requires }
    sources: [viem-clients]
    misconceptions:
      - belief: Small amounts are safe to handle as numbers.
        reality: The unit is wei; 1 ETH is already 10^18, far past the safe-integer range.
        why: The displayed amount looks small, so the underlying integer feels small too.
        source: viem-clients
  - id: viem-simulate-before-send
    title: Simulate, then write
    oneLine: simulateContract runs the call against pending state and returns a `request` you hand straight to writeContract.
    statement: >
      `simulateContract` executes the call as `eth_call` against pending state and returns
      `{ result, request }`: `result` is what the function would return, and `request` is the fully prepared
      argument object you pass to `writeContract`. If the call would revert, `simulateContract` throws before
      the user is ever asked to sign. `writeContract` on its own performs no such check - it signs and
      broadcasts, and a reverting transaction is still mined and still charged.
    volatility: evolving
    edges:
      - { to: viem-public-client, type: requires }
      - { to: mempool-pending-is-not-a-queue, type: requires }
    sources: [viem-simulate-contract, viem-write-contract]
    misconceptions:
      - belief: writeContract fails fast if the contract would revert.
        reality: It signs and broadcasts; the revert happens on-chain and the gas is spent.
        why: The name reads like an assertion, and older libraries estimated gas implicitly, catching many reverts.
        source: viem-write-contract
  - id: viem-simulation-is-not-a-guarantee
    title: Simulation is a snapshot, not a promise
    oneLine: A successful simulation reflects one node's pending state at one instant; the state can change before inclusion.
    statement: >
      `simulateContract` evaluates against a single node's view of pending state at the moment you call it.
      Between that moment and inclusion, other transactions land, oracles update, and searchers reorder the
      block, any of which can invalidate the result. Simulation lowers the probability of an on-chain revert
      substantially; it does not remove it, so the UI must still handle a reverted receipt.
    volatility: stable
    edges:
      - { to: viem-simulate-before-send, type: requires }
      - { to: mempool-is-not-global, type: requires }
    sources: [viem-simulate-contract]
    misconceptions:
      - belief: A successful simulateContract means the transaction will succeed.
        reality: It means it would have succeeded against one node's pending state at that instant.
        why: The word "simulate" implies determinism.
        source: viem-simulate-contract
  - id: viem-error-hierarchy
    title: The error cause chain
    oneLine: Every viem error extends BaseError and wraps a cause chain; error.walk(fn) finds the specific class instead of matching strings.
    statement: >
      All viem errors extend `BaseError` and carry a `cause` chain that nests the lower-level failure inside
      the higher-level one - a `ContractFunctionExecutionError` wrapping a `ContractFunctionRevertedError`,
      for example. `error.walk(fn)` climbs that chain and returns the first link matching your predicate, so
      you classify failures by error class rather than by parsing `error.message`. Message text is not a
      stable interface and changes between versions and providers.
    volatility: evolving
    edges:
      - { to: viem-actions-are-functions, type: requires }
    sources: [viem-errors-glossary, viem-discussion-1789]
    misconceptions:
      - belief: You can read the revert reason from error.message.
        reality: The useful data sits in the cause chain; you must walk to ContractFunctionRevertedError and read data.errorName and data.args.
        why: Most examples log the error object and the message is the visible part.
        source: viem-discussion-1789
  - id: viem-typed-revert
    title: Typed revert data
    oneLine: ContractFunctionRevertedError exposes errorName and args only when that error is in the ABI you passed.
    statement: >
      When viem can decode a revert it exposes `data.errorName` and `data.args` on
      `ContractFunctionRevertedError`, giving you the structured arguments the contract reverted with.
      Decoding works only against the ABI you supplied: an error defined in a library, a token, or the
      implementation behind a proxy is not in that ABI and comes back as undecoded hex. There is no global
      registry of error selectors that viem can consult on your behalf.
    volatility: evolving
    edges:
      - { to: viem-error-hierarchy, type: requires }
      - { to: sol-custom-error, type: requires }
    sources: [viem-errors-glossary]
    misconceptions:
      - belief: viem decodes any custom error it encounters.
        reality: It decodes only errors present in the ABI you passed; anything else is raw hex.
        why: People assume a shared four-byte registry is consulted.
        source: viem-errors-glossary
  - id: viem-sync-send
    title: Synchronous sends
    oneLine: sendTransactionSync and writeContractSync block until a receipt via EIP-7966, and are documented as unsuitable for slow-finality chains.
    statement: >
      `sendTransactionSync` and `writeContractSync` map onto EIP-7966's `eth_sendRawTransactionSync`, which
      broadcasts and returns the receipt in one RPC call instead of broadcast-then-poll. They depend on the
      provider implementing that method, and viem's own documentation restricts them to chains with low block
      times and fast finality rather than L1 mainnet. They hide the pending state from your code; they do not
      remove it from the chain.
    volatility: hot
    edges:
      - { to: viem-wallet-client, type: requires }
      - { to: tx-type-2-1559, type: requires }
    sources: [viem-write-contract-sync, viem-send-transaction-sync, eip-7966]
    misconceptions:
      - belief: writeContractSync is a strictly better writeContract.
        reality: It requires provider support for EIP-7966 and is documented as unsuitable for chains with slow finality.
        why: Synchronous APIs feel simpler than callbacks and polling.
        source: viem-write-contract-sync
