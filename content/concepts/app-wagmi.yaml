moduleId: app-wagmi
concepts:
  - id: wagmi-is-viem-plus-query
    title: wagmi is viem plus TanStack Query
    oneLine: wagmi does no chain I/O of its own - viem does that, TanStack Query caches it, wagmi adds connectors and config.
    statement: >
      wagmi is a thin React layer over three responsibilities it does not own. viem performs the chain I/O;
      TanStack Query v5 provides caching, deduplication, retries and loading states; wagmi itself supplies
      the connector abstraction, chain switching, and a persisted config store. Every wagmi hook wraps a viem
      action, and wagmi inherits TanStack Query's cache semantics wholesale - so a wagmi caching question is a
      TanStack Query question, and a wagmi chain question is a viem question.
    volatility: evolving
    edges:
      - { to: viem-client-vs-transport, type: requires }
    sources: [wagmi-viem-guide, wagmi-tanstack-query]
  - id: wagmi-config-object
    title: The config is the single source of truth
    oneLine: createConfig({ chains, connectors, transports, storage }) holds everything; WagmiProvider only puts it in context.
    statement: >
      `createConfig({ chains, connectors, transports, storage })` is the one object that defines which chains
      exist, how to reach each of them, which wallets can connect, and where connection state persists.
      `WagmiProvider` does nothing but place that config in React context, and the vanilla `@wagmi/core`
      actions read the same config outside React. There is no per-component client to construct, and creating
      a second config is how you end up with two disagreeing views of the same wallet.
    volatility: evolving
    edges:
      - { to: wagmi-is-viem-plus-query, type: requires }
    sources: [wagmi-core-changelog, wagmi-ssr]
  - id: wagmi-read-hooks-are-queries
    title: Read hooks are cached queries
    oneLine: useReadContract and friends return TanStack Query results keyed by a structured queryKey, so identical questions fire one request.
    statement: >
      `useReadContract`, `useBalance` and the other read hooks return TanStack Query results - `data`,
      `isPending`, `isFetching`, `error`, `refetch` - and are keyed by a structured query key derived from
      the chain, address, function and arguments. Two components asking the identical question share one
      in-flight request and one cache entry. Change any argument and the key changes, which is how five
      components can become five requests without any code looking different.
    volatility: evolving
    edges:
      - { to: wagmi-config-object, type: requires }
      - { to: viem-public-client, type: requires }
    sources: [wagmi-tanstack-query, wagmi-use-read-contract]
  - id: wagmi-write-hooks-are-mutations
    title: Write hooks are mutations
    oneLine: useWriteContract, useSendTransaction and useSignMessage are TanStack mutations, and wagmi v3 normalised their names to mutate/mutateAsync.
    statement: >
      The write hooks are TanStack Query mutations, not queries: they do not run on render, they are not
      cached, and they expose an imperative trigger plus status flags. wagmi v3 normalised the per-hook
      custom trigger names to `mutate` and `mutateAsync`, which is one of several v3 renames that break code
      written against v2 - along with `useAccount` becoming `useConnection`, `useAccountEffect` becoming
      `useConnectionEffect`, and `useSwitchAccount` becoming `useSwitchConnection`.
    volatility: hot
    edges:
      - { to: wagmi-read-hooks-are-queries, type: contrasts }
      - { to: viem-wallet-client, type: requires }
    sources: [wagmi-migrate-v2-v3]
    misconceptions:
      - belief: Upgrading wagmi v2 to v3 is a version bump.
        reality: v3 renamed core hooks and made every connector dependency an optional peer dep, so connectors throw at runtime until you install their SDKs.
        why: Majors in this ecosystem are usually type-level only.
        source: wagmi-migrate-v2-v3
  - id: wagmi-no-auto-invalidation
    title: Nothing invalidates your cache for you
    oneLine: Chain state changes on its own and wagmi does not know; freshness is your job, via watch or explicit invalidation.
    statement: >
      A wagmi read hook is a cached question, not a subscription. When a balance changes on-chain nothing
      tells the cache, and the hook will serve the stale value indefinitely. The two supported ways to stay
      fresh are the hook's own `watch` option where it exists, or `useBlockNumber({ watch: true })` plus
      `queryClient.invalidateQueries({ queryKey })` in an effect. Choosing neither is choosing stale.
    volatility: evolving
    edges:
      - { to: wagmi-read-hooks-are-queries, type: requires }
    sources: [wagmi-tanstack-query]
    misconceptions:
      - belief: wagmi hooks re-render when on-chain state changes.
        reality: They are cached queries; without watch or explicit invalidation they serve a stale balance forever.
        why: The hook name reads like a subscription.
        source: wagmi-tanstack-query
  - id: wagmi-querykey-shape
    title: Build the key, do not guess it
    oneLine: Query keys come from the exported get<X>QueryOptions(config, args), so you can construct the exact key to invalidate from outside React.
    statement: >
      wagmi exports `get<X>QueryOptions(config, args)` functions that produce the same structured query key
      the hooks use. Building the key that way lets you invalidate precisely from a place that has no hook -
      an event handler, a websocket callback, a router transition. An ad-hoc string key will not match, and
      the failure is silent: `invalidateQueries` succeeds and nothing refetches.
    volatility: evolving
    edges:
      - { to: wagmi-no-auto-invalidation, type: requires }
    sources: [wagmi-tanstack-query]
  - id: wagmi-bigint-serialization
    title: BigInt breaks the default key hashing
    oneLine: BigInt is not JSON-serialisable, so wagmi ships a custom hashFn for query keys and devtools.
    statement: >
      Query keys routinely contain `bigint` values - amounts, token ids, block numbers - and `JSON.stringify`
      throws on BigInt. wagmi therefore exports a custom `hashFn` from `@wagmi/core/query` for query-key
      hashing, which you must configure for TanStack devtools and for any code of your own that stringifies a
      key. Skipping it produces a runtime throw in a place unrelated to the chain call that caused it.
    volatility: evolving
    edges:
      - { to: wagmi-querykey-shape, type: requires }
      - { to: viem-bigint-boundary, type: requires }
    sources: [wagmi-tanstack-query]
  - id: wagmi-connector-abstraction
    title: What a connector is
    oneLine: A connector adapts one wallet's transport to a uniform connect / disconnect / getAccounts / switchChain interface.
    statement: >
      A Connector is an adapter between a specific wallet's transport - an EIP-1193 injected provider, a
      WalletConnect relay session, a Safe app iframe bridge, a vendor SDK - and one uniform interface that
      wagmi's hooks call. The interface hides the wallet, not the failure modes: each transport fails
      differently, and a WalletConnect session dropping looks nothing like an extension being uninstalled.
      In wagmi v3 each connector's underlying SDK is an optional peer dependency you install yourself.
    volatility: hot
    edges:
      - { to: wagmi-config-object, type: requires }
    sources: [wagmi-migrate-v2-v3, wagmi-core-changelog]
  - id: wagmi-eip6963-discovery
    title: EIP-6963 discovery
    oneLine: Injected wallets announce themselves over an event protocol instead of racing to own window.ethereum.
    statement: >
      EIP-6963 defines a pair of window events - the page dispatches a request, each installed wallet
      responds by announcing a provider with its own uuid, name and icon. This replaces the single mutable
      `window.ethereum` slot, which multiple extensions used to overwrite in whatever order they loaded.
      wagmi's injected discovery is built on it, and it is the reason a user with three browser wallets can
      pick between them instead of getting whichever one won the race.
    volatility: stable
    edges:
      - { to: wagmi-connector-abstraction, type: requires }
    sources: [eip-6963]
    misconceptions:
      - belief: window.ethereum is the browser wallet.
        reality: It is one legacy slot that several extensions overwrite; discovery is an event protocol now.
        why: Every tutorial written before 2024 starts from window.ethereum.
        source: eip-6963
  - id: wagmi-connection-not-authentication
    title: Connection is not authentication
    oneLine: A connected wallet only means a wallet told the page an address; proving control needs a signature.
    statement: >
      Connecting produces an address that the wallet claims the user controls. Nothing about it is proof: a
      malicious page, a proxy, or a modified client can present any address it likes, and your server has no
      reason to believe one. Proving control requires the user to sign a challenge your backend issued and
      verified - the pattern EIP-4361 (Sign-In with Ethereum) standardises, including a nonce, a domain, and
      an expiry so the signature cannot be replayed elsewhere.
    volatility: stable
    edges:
      - { to: wagmi-connector-abstraction, type: requires }
      - { to: ecdsa-secp256k1, type: requires }
      - { to: eip-712-typed-data, type: recommends }
    sources: [eip-4361]
    misconceptions:
      - belief: A connected wallet means the user is authenticated.
        reality: It means a wallet exposed an address to the page; anyone can claim an address without a signature.
        why: Connect buttons are placed and styled exactly like login buttons.
        source: eip-4361
  - id: wagmi-ssr-hydration-mismatch
    title: Why server HTML cannot know your wallet
    oneLine: Connection state lives in localStorage and in browser-only discovery events, so the server renders disconnected and React complains.
    statement: >
      wagmi's connection state is reconstructed on the client from `localStorage` and from EIP-6963 discovery
      events. Neither exists on the server, so server-rendered HTML necessarily says "disconnected". If the
      client then renders "connected" on first paint, React reports a hydration mismatch; if you defer the
      read to avoid the mismatch, you instead get a visible disconnected-then-connected flash.
    volatility: evolving
    edges:
      - { to: wagmi-config-object, type: requires }
    sources: [wagmi-ssr]
  - id: wagmi-cookie-storage
    title: Cookie storage closes the flash
    oneLine: ssr true plus cookieStorage plus cookieToInitialState lets the server render the connected state from the request's cookie header.
    statement: >
      Setting `ssr: true` and `storage: createStorage({ storage: cookieStorage })` moves connection state
      into a cookie, which the server can read from the request headers. Passing
      `cookieToInitialState(config, cookie)` into `WagmiProvider` seeds the client store with that state, so
      the first paint already shows the connected address. `ssr: true` alone removes the hydration warning by
      deferring the client-store read; it does not remove the flash.
    volatility: evolving
    edges:
      - { to: wagmi-ssr-hydration-mismatch, type: requires }
    sources: [wagmi-ssr]
    misconceptions:
      - belief: ssr true alone fixes Next.js hydration.
        reality: It removes the warning but leaves a disconnected-state flash until you add cookieStorage and cookieToInitialState.
        why: The flag name suggests completeness.
        source: wagmi-ssr
  - id: wagmi-provider-is-client-component
    title: The provider is a client component, and the QueryClient is per mount
    oneLine: WagmiProvider and QueryClientProvider must live in a "use client" component, and a module-scope QueryClient leaks cache between requests.
    statement: >
      `WagmiProvider` and `QueryClientProvider` use React context and browser APIs, so they must sit inside a
      `"use client"` component. The `QueryClient` must be created per request or per mount - typically
      `useState(() => new QueryClient())` - because a module-level singleton in a server-rendering process is
      shared across every user's render, which means one user's cached balance can be rendered into another
      user's HTML.
    volatility: evolving
    edges:
      - { to: wagmi-cookie-storage, type: requires }
    sources: [wagmi-ssr]
    misconceptions:
      - belief: Create the QueryClient once at module scope.
        reality: In a server-rendering app that shares one cache across all requests and leaks data between users.
        why: The TanStack quickstart is a client-only single-page example.
        source: wagmi-ssr
  - id: wagmi-chain-mismatch
    title: Two chains, silently
    oneLine: The wallet's selected chain and the chain your hook reads are independent, and mixing them returns confidently wrong data.
    statement: >
      A read hook uses the config's transports and the `chainId` you pass, defaulting to the connection's
      chain. The wallet's own network selection is a separate piece of state. If you do not pass `chainId`
      explicitly, a user on the wrong network gets real, well-formed, wrong-chain data with no error - a
      balance from a chain they are not on. Writes have the opposite failure: they must be gated on
      `useSwitchChain` or they are sent to the wrong chain entirely.
    volatility: evolving
    edges:
      - { to: wagmi-config-object, type: requires }
      - { to: chain-id-scoping, type: requires }
    sources: [wagmi-use-read-contract]
    misconceptions:
      - belief: The wallet's selected chain is the chain your reads use.
        reality: Reads use the config's transports and the chainId you pass; the two can silently disagree.
        why: The wallet's network dropdown feels global to the page.
        source: wagmi-use-read-contract
