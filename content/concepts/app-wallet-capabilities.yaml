moduleId: app-wallet-capabilities
concepts:
  - id: wallet-capabilities
    title: Capability negotiation
    oneLine: Ask the wallet what it supports rather than inferring it from the vendor name.
    statement: >
      Wallets differ in what they can do - batching, sponsorship, delegated accounts - and those differences
      change per release and sometimes per chain. ERC-5792 defines a capability query so an app can ask the
      connected wallet what it supports, per chain, and branch on the answer. Branching on the wallet's
      identity instead is a bug with a delay fuse: it is correct until the wallet ships a version you did not
      test, and it never degrades gracefully for a wallet you have never heard of.
    volatility: evolving
    edges:
      - { to: wagmi-connector-abstraction, type: requires }
    sources: [eip-5792, eip5792-getting-started]
    misconceptions:
      - belief: Detect the wallet vendor and branch on it.
        reality: Query capabilities; vendor sniffing breaks on every release and cannot handle wallets you have not seen.
        why: User-agent sniffing is the habit the web taught us.
        source: eip5792-getting-started
  - id: use-capabilities
    title: Reading capabilities from React
    oneLine: wagmi's useCapabilities hook reports what the connected wallet can do, per chain.
    statement: >
      wagmi exposes the ERC-5792 capability query as a hook, returning the capability object the wallet
      reports for the connected account. Because it is a normal wagmi query it has loading and error states,
      and your UI must handle the case where capabilities are not yet known - which is the state the user
      sees first. Treat an unknown capability as absent, not as present.
    volatility: hot
    edges:
      - { to: wallet-capabilities, type: requires }
      - { to: wagmi-read-hooks-are-queries, type: requires }
    sources: [eip5792-getting-started, wagmi-viem-guide]
  - id: erc-5792-sendcalls
    title: wallet_sendCalls
    oneLine: One request submits several calls as a single user-visible action, tracked by one status query.
    statement: >
      ERC-5792 defines `wallet_sendCalls`, which hands the wallet an array of calls to submit as one action,
      and `wallet_getCallsStatus`, which reports on that action as a unit. viem surfaces them as `sendCalls`
      and wagmi as `useSendCalls`. The user-facing effect is the end of the approve-then-swap double prompt:
      one confirmation, one thing to wait for, one status to render.
    volatility: hot
    edges:
      - { to: wallet-capabilities, type: requires }
      - { to: viem-wallet-client, type: requires }
    sources: [eip-5792, viem-send-calls]
  - id: sendcalls-fallback
    title: Degrading instead of breaking
    oneLine: viem's experimental_fallback executes the calls sequentially over eth_sendTransaction when the wallet lacks EIP-5792.
    statement: >
      viem's `sendCalls` accepts an `experimental_fallback` option: when the connected wallet does not
      implement `wallet_sendCalls`, viem executes the same calls one at a time via `eth_sendTransaction`.
      The app keeps one code path, and the older wallet keeps working with N prompts instead of one. What you
      lose in the fallback is exactly the property that made the batch worth having - it is now N independent
      transactions with N chances to stop halfway.
    volatility: hot
    edges:
      - { to: erc-5792-sendcalls, type: requires }
    sources: [viem-send-calls]
    misconceptions:
      - belief: Using sendCalls breaks wallets that lack EIP-5792.
        reality: experimental_fallback degrades to sequential eth_sendTransaction calls.
        why: New RPC methods usually mean a hard compatibility break.
        source: viem-send-calls
  - id: batching-is-not-atomicity
    title: Batched is not atomic
    oneLine: Whether a batch is all-or-nothing depends on the account executing it, and the capability query is where you find out.
    statement: >
      `wallet_sendCalls` groups calls into one user action; it does not by itself promise that they succeed
      or fail together. Atomicity is a property of the account executing the batch, and ERC-5792 exposes it
      through the capability response rather than assuming it. An app that designs its flow around
      all-or-nothing execution without checking has a half-applied state it never wrote UI for - and the
      sequential fallback path is never atomic at all.
    volatility: hot
    edges:
      - { to: erc-5792-sendcalls, type: requires }
      - { to: sendcalls-fallback, type: deepens }
      - { to: call-returns-a-boolean, type: requires }
    sources: [eip-5792, eip5792-getting-started]
    misconceptions:
      - belief: Batched calls are atomic.
        reality: Atomicity depends on the account implementation and is reported through capabilities; check rather than assume.
        why: A database transaction is the mental model everyone brings to the word "batch".
        source: eip-5792
