moduleId: defi-amm-math
concepts:
  - id: constant-product
    title: The constant-product invariant
    oneLine: A pool holding reserves x and y keeps x times y at or above a constant k, so the marginal price is just the reserve ratio.
    statement: >
      A constant-product market maker holds two reserves x and y and enforces the invariant
      x * y >= k across every operation. The marginal (spot) price of token X in terms of token Y
      is y / x, so the pool needs no counterparty and no order book: any trade is accepted whose
      post-trade reserves still satisfy the invariant. Fees are taken by charging the input side
      before the invariant check, which makes k strictly increase over time and is how liquidity
      providers are paid. The invariant is a constraint the contract checks, not a price the
      contract sets; the price is a consequence of where the reserves currently sit on the curve.
    volatility: stable
    edges:
      - { to: erc20-is-a-ledger, type: requires }
      - { to: stableswap-invariant, type: contrasts }
    sources: [uniswap-v2-whitepaper, uniswap-v3-math-primer-2]
    misconceptions:
      - belief: The AMM looks up a price and then executes at it.
        reality: The AMM only checks that the invariant still holds after the transfer; the price is derived from the reserves, not stored.
        why: UIs display a quote before the swap, which looks like a price lookup.
        source: uniswap-v2-whitepaper
      - belief: k is constant.
        reality: k strictly increases whenever a fee is charged, and changes whenever liquidity is added or removed. Only within a single fee-free swap is it held constant.
        why: The name says constant.
        source: uniswap-v2-whitepaper

  - id: price-impact
    title: Price impact
    oneLine: Trade size moves you along the curve, so the average price you pay is always worse than the marginal price you were quoted.
    statement: >
      Because the invariant is a hyperbola, executing a trade of size dx moves the reserves and
      therefore moves the marginal price. The output for input dx into reserves (x, y) with fee f
      is dy = y * dx * (1 - f) / (x + dx * (1 - f)). The average execution price is strictly worse
      than the pre-trade marginal price, and the gap grows superlinearly with dx / x. Price impact
      is a deterministic property of the curve and current depth; it is not a fee, not slippage,
      and not caused by anyone acting against you. It is the reason quoted depth, not quoted price,
      is the number that matters when sizing a trade.
    volatility: stable
    edges:
      - { to: constant-product, type: requires }
      - { to: slippage-tolerance, type: contrasts }
    sources: [uniswap-v2-whitepaper, uniswap-v3-math-primer-2]
    misconceptions:
      - belief: Price impact and slippage are the same thing.
        reality: Price impact is what the curve charges you deterministically for your own size. Slippage is the difference between your expected execution and your realised execution caused by other transactions landing in between.
        why: Wallet UIs use the two words interchangeably.
        source: uniswap-v2-whitepaper

  - id: slippage-tolerance
    title: Slippage tolerance
    oneLine: The minimum output you are willing to accept — a security parameter that wallets present as a convenience dial.
    statement: >
      A swap transaction carries a minimum-output (or maximum-input) bound and a deadline. Any
      execution worse than that bound reverts. Because the bound is checked only at execution time,
      the gap between the quote and the bound is a window of value that anyone who controls
      ordering may take without causing a revert. Widening the tolerance does not make a trade more
      likely to succeed in any benign sense: it enlarges the set of executions the contract will
      accept, and therefore enlarges the amount an adversary may extract while still satisfying
      your check. A tolerance of zero minimum output authorises unlimited extraction.
    volatility: stable
    edges:
      - { to: price-impact, type: requires }
      - { to: mev-slippage-is-the-attack-surface, type: deepens }
    sources: [uniswap-v2-whitepaper, uniswap-v2-router02-source]
    misconceptions:
      - belief: A higher slippage tolerance makes the trade more likely to go through.
        reality: It makes a worse fill acceptable. Whether the trade goes through at a good price depends on depth and ordering, not on how much loss you have pre-approved.
        why: The setting sits in a reliability-shaped part of the UI, next to gas.
        source: uniswap-v2-whitepaper

  - id: impermanent-loss
    title: Impermanent loss
    oneLine: The invariant forces an LP to sell the asset that is rising, so the position underperforms simply holding the two tokens.
    statement: >
      As the external price of a pooled pair diverges from the pool's price, arbitrageurs trade
      against the pool until the two agree. Every such trade removes some of the appreciating asset
      from the pool and adds some of the depreciating one, so an LP is mechanically rebalanced
      against the move. The value of the position relative to simply holding the original two
      amounts is therefore a decreasing function of price divergence, before fees. The divergence
      is realised continuously in the position's composition; withdrawing does not cause the loss,
      it only stops the position from recovering if the price returns. Fee income is a separate,
      additive term, and whether an LP is profitable is the sign of (fees earned) minus
      (divergence loss), not the sign of either alone.
    volatility: stable
    edges:
      - { to: constant-product, type: requires }
      - { to: mev-arbitrage-is-lvr, type: deepens }
    sources: [uniswap-v2-understanding-returns, uniswap-v2-whitepaper, elsts-v3-liquidity-math]
    misconceptions:
      - belief: Impermanent loss becomes permanent only when you withdraw.
        reality: The rebalancing has already happened inside the pool. Holding the LP position does not preserve the original composition; it only preserves the option that the price path returns.
        why: The word impermanent implies a paper loss that a later price move can undo.
        source: elsts-v3-liquidity-math
      - belief: Earning fees means the LP position is profitable.
        reality: Fees are compared against divergence loss, not against zero. A high-fee pool on a highly divergent pair can still underperform holding.
        why: Dashboards report fee APR without the divergence term.
        source: elsts-v3-liquidity-math

  - id: stableswap-invariant
    title: The StableSwap invariant
    oneLine: A curve deliberately flattened near parity, so assets that should trade one-for-one suffer almost no price impact until reserves become badly imbalanced.
    statement: >
      StableSwap blends a constant-sum curve (zero price impact, but drainable) with a
      constant-product curve (never drainable, but high impact) using an amplification coefficient
      A. Near balanced reserves the curve behaves almost like constant-sum, so large trades between
      assets that should be worth the same execute at near-parity; as reserves become imbalanced
      the curve degrades towards constant product and price impact rises sharply. The design
      encodes an assumption — that the pooled assets are genuinely interchangeable — and the
      amplification coefficient is the strength of that assumption. When the assumption fails, the
      flat region is exactly the region in which the pool sells the good asset cheaply.
    volatility: stable
    edges:
      - { to: constant-product, type: contrasts }
      - { to: price-impact, type: requires }
    sources: [curve-stableswap-paper, curve-crvusd-overview]
    misconceptions:
      - belief: A stable pool cannot lose money because both sides are dollars.
        reality: The flat region means the pool will trade a de-pegging asset for a sound one at nearly one-to-one until reserves are heavily skewed. The flatness that makes it efficient is what makes it the first venue drained during a depeg.
        why: The word stable is read as a property of the pool rather than an assumption about its inputs.
        source: curve-crvusd-overview

  - id: flash-loan
    title: The flash loan
    oneLine: An uncollateralised loan that is valid only if it is repaid before the same transaction ends.
    statement: >
      A flash loan transfers assets to a borrower and calls back into borrower-supplied code; at the
      end of the callback the lender asserts that the principal plus fee has been returned, and
      reverts the entire transaction otherwise. Atomicity replaces collateral: there is no credit
      risk because a non-repaying borrower's actions never happened. The consequence for every
      other mechanism in DeFi is that required capital is no longer a barrier to any attack that is
      profitable within one transaction. Flash loans do not, however, remove economic cost — the
      attacker still eats fees, price impact and whatever value is handed to arbitrageurs, which is
      why they break single-block price sources but not deep time-averaged ones.
    volatility: stable
    edges:
      - { to: constant-product, type: requires }
      - { to: flash-loan-amplification, type: applies }
      - { to: liq-flash-loan-liquidator, type: applies }
    sources: [aave-v3-pool-docs]
    misconceptions:
      - belief: Flash loans are an attack.
        reality: They are a primitive. They are also the mechanism that makes liquidations and arbitrage capital-free and therefore competitive. The bug is always in the protocol that assumed capital was scarce.
        why: Headlines say flash loan attack, naming the loan rather than the flaw.
        source: aave-v3-pool-docs
      - belief: A flash loan makes an attack free.
        reality: It makes the capital free. The attacker still pays fees, price impact and value lost to arbitrageurs, which is the real cost of manipulation.
        why: Coverage quotes the size of the loan rather than the attacker's net loss.
        source: arxiv-manipulation-cost-2026
