moduleId: defi-concentrated-liquidity
concepts:
  - id: virtual-reserves
    title: Virtual reserves
    oneLine: A v3 position behaves exactly like a constant-product pool restricted to one price interval, described by reserves that need not physically exist.
    statement: >
      A concentrated-liquidity position supplies liquidity only between a lower and an upper price.
      Within that interval it is mathematically identical to a constant-product pool whose reserves
      are the real tokens plus an offset — the virtual reserves — chosen so that the curve passes
      through the position's boundaries. The offset is never held by the contract; it exists only
      so that the same x times y invariant can be reused unchanged. This is why every v3 formula is
      a v2 formula with shifted reserves, and why a position that has been pushed out of range holds
      exactly one of the two tokens: the curve segment has been fully traversed.
    volatility: stable
    edges:
      - { to: constant-product, type: requires }
      - { to: price-impact, type: requires }
    sources: [uniswap-v3-whitepaper, uniswap-v3-math-primer-2, rareskills-v3-concentrated-liquidity]
    misconceptions:
      - belief: Concentrated liquidity is a different kind of AMM.
        reality: It is the same constant-product curve, restricted to an interval, with the missing reserves supplied virtually.
        why: The v3 codebase looks nothing like the v2 codebase, so the maths is assumed to differ too.
        source: rareskills-v3-concentrated-liquidity

  - id: tick
    title: Tick
    oneLine: A discrete price level where price(t) equals 1.0001 to the power t, so one tick is one basis point of price.
    statement: >
      v3 discretises the price axis into ticks, with price(t) = 1.0001^t. Consecutive ticks differ
      by one basis point, which makes the tick index a logarithm of price and therefore turns
      multiplicative price moves into additive index moves. Positions may only start and end on
      ticks, and pools enforce a tick spacing tied to the fee tier so that the number of initialised
      ticks a swap can cross stays bounded. Crossing an initialised tick is the only moment at which
      the pool's active liquidity changes, which is what makes a swap's gas cost depend on how far
      it moves the price rather than on its notional size.
    volatility: stable
    edges:
      - { to: virtual-reserves, type: requires }
    sources: [uniswap-v3-whitepaper, mixbytes-v3-ticks, uniswap-v3-math-primer-2]
    misconceptions:
      - belief: Ticks are evenly spaced in price.
        reality: They are evenly spaced in log price. The absolute price gap between adjacent ticks grows with price.
        why: The word tick imports an order-book intuition where ticks are fixed price increments.
        source: mixbytes-v3-ticks

  - id: sqrt-price-x96
    title: Square-root price in Q64.96
    oneLine: The pool stores the square root of price as a fixed-point integer scaled by 2 to the 96, not the price itself.
    statement: >
      v3 stores sqrt(price) scaled by 2^96 (Q64.96 fixed point) in slot0. Storing the square root
      is not an optimisation detail: the relationships between liquidity L, the token amounts and
      the price are linear in sqrt(price), so the swap and position-amount formulas become additions
      and multiplications on integers rather than square roots taken at runtime. The Q64.96 scaling
      keeps enough precision for realistic price ranges while remaining in 160 bits. Every rounding
      decision in the codebase is chosen so that rounding always favours the pool, which is why
      recomputing amounts in floating point will disagree with the contract by small amounts in a
      consistent direction.
    volatility: stable
    edges:
      - { to: tick, type: requires }
    sources: [uniswap-v3-whitepaper, elsts-v3-liquidity-math, uniswap-v3-math-primer-2]
    misconceptions:
      - belief: Prices are stored as prices.
        reality: The stored value is the square root of the price in Q64.96 fixed point, so any comparison against a human-readable price must square and rescale first.
        why: slot0 is described as the current price in most explainers.
        source: elsts-v3-liquidity-math
      - belief: Small disagreements between your computed amount and the contract's are bugs in your maths.
        reality: They are usually the contract's deliberate rounding, which always rounds in the pool's favour.
        why: Reference implementations in floating point round to nearest.
        source: elsts-v3-liquidity-math

  - id: liquidity-l
    title: L, the liquidity of a position
    oneLine: L equals the square root of x times y over the virtual reserves, so a v3 position is a single bar in price-liquidity space.
    statement: >
      A position's liquidity L is defined as sqrt(x * y) over its virtual reserves. Because L is
      constant while price stays inside the range, the token amounts at any price follow directly:
      the amount of token X is L * (1/sqrt(P) - 1/sqrt(Pb)) and the amount of token Y is
      L * (sqrt(P) - sqrt(Pa)), for current price P inside the interval [Pa, Pb]. Storing the root
      rather than the two reserves means one number describes the position and additions across
      overlapping positions are simple sums. Plotted against price, a position is a rectangle: L
      units of liquidity between Pa and Pb and nothing outside.
    volatility: stable
    edges:
      - { to: virtual-reserves, type: requires }
      - { to: sqrt-price-x96, type: requires }
    sources: [elsts-v3-liquidity-math, uniswap-v3-whitepaper, uniswap-v3-math-primer-2]
    misconceptions:
      - belief: L is the dollar value of the position.
        reality: L is a curve parameter with units of sqrt(token X times token Y). Two positions with the same L hold very different token amounts if their ranges differ.
        why: The UI shows a dollar figure next to the word liquidity.
        source: elsts-v3-liquidity-math

  - id: v3-is-v2-piecewise
    title: v3 as piecewise v2
    oneLine: The v3 curve is a constant-product curve whose liquidity changes at the ticks where LPs chose to place it.
    statement: >
      Between two adjacent initialised ticks the pool is exactly a constant-product pool with a
      fixed L. At each initialised tick the pool adds or removes the net liquidity of the positions
      starting or ending there and continues on a new constant-product segment. The whole of v3 is
      therefore: a v2 pool, plus a bookkeeping layer that tracks which segment the price is in and
      how much liquidity is active there, plus fee-growth accumulators so each position can be paid
      only for the swaps that happened while it was in range. Once this framing is in place the
      swap loop, the tick bitmap and the fee accounting all read as consequences rather than as new
      ideas.
    volatility: stable
    edges:
      - { to: liquidity-l, type: requires }
      - { to: tick, type: requires }
      - { to: constant-product, type: contrasts }
    sources: [rareskills-v3-concentrated-liquidity, uniswap-v3-whitepaper, mixbytes-v3-ticks]
    misconceptions:
      - belief: Depth in a v3 pool is a single number like it is in v2.
        reality: Depth is a function of price, given by the liquidity histogram over ticks. A pool can be extremely deep at the current price and empty two percent away.
        why: Aggregators report a single TVL figure per pool.
        source: mixbytes-v3-ticks
