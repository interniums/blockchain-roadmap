moduleId: defi-hooks
concepts:
  - id: singleton-poolmanager
    title: The singleton PoolManager
    oneLine: v4 holds every pool inside one contract, so creating a pool is a state update rather than a contract deployment.
    statement: >
      In Uniswap v4 all pools live in a single PoolManager contract, keyed by a PoolKey of the two
      currencies, the fee, the tick spacing and the hook address. Creating a pool writes state
      instead of deploying bytecode, which removes deployment cost and makes multi-hop routes touch
      one contract rather than several. The singleton is also what makes the rest of v4 possible:
      because every pool's accounting sits in one place, a sequence of operations across many pools
      can be netted before any token moves. The trade-off is concentration — one contract now holds
      the assets of every pool, so its correctness is a systemic property rather than a per-pool one.
    volatility: evolving
    edges:
      - { to: constant-product, type: requires }
      - { to: v3-is-v2-piecewise, type: requires }
    sources: [uniswap-v4-poolmanager, uniswap-v4-vision]
    misconceptions:
      - belief: A singleton means all pools share liquidity.
        reality: Liquidity stays per-pool. What is shared is the contract, the accounting and the token custody, not the reserves.
        why: Singleton is heard as pooled.
        source: uniswap-v4-poolmanager

  - id: v4-flash-accounting
    title: Flash accounting
    oneLine: Balances are tracked as deltas inside a lock and only the net amounts are actually transferred when it closes.
    statement: >
      v4 operations run inside an unlock callback. Instead of transferring tokens on every step, the
      PoolManager records a signed delta per currency per caller, and requires every delta to be
      zero before the lock closes. A multi-hop route through several pools therefore performs one
      inbound and one outbound token transfer rather than one per hop. The deltas are held in
      transient storage, so the bookkeeping costs a fraction of what persistent storage would and
      is discarded automatically at the end of the transaction. The pattern is a general one: net
      first, settle once, and let the final assertion enforce solvency.
    volatility: evolving
    edges:
      - { to: singleton-poolmanager, type: requires }
      - { to: transient-storage, type: requires }
      - { to: flash-accounting, type: deepens }
    sources: [uniswap-v4-poolmanager, uniswap-v4-vision]
    misconceptions:
      - belief: Flash accounting is a kind of flash loan.
        reality: It is deferred settlement inside one lock. Nothing is lent; the caller simply may not leave a non-zero delta behind.
        why: Both names borrow the word flash from atomicity.
        source: uniswap-v4-poolmanager

  - id: hook
    title: Hook
    oneLine: A contract bound to a pool at creation that the PoolManager calls at fixed lifecycle points such as beforeSwap and afterSwap.
    statement: >
      A hook is an ordinary contract address recorded in a pool's PoolKey. At defined points in the
      pool's lifecycle — initialise, add and remove liquidity, swap, donate — the PoolManager calls
      the hook before and after the core logic. Hooks can therefore implement dynamic fees, limit
      orders, custom curves, oracle recording, access control and time-weighted average market
      making without changing the core contract. Because the hook is part of the PoolKey, the same
      token pair and fee tier with a different hook is a different pool, and a hook cannot be
      changed after the pool is created.
    volatility: evolving
    edges:
      - { to: singleton-poolmanager, type: requires }
      - { to: v4-flash-accounting, type: requires }
    sources: [uniswap-hooks-docs, uniswap-v4-vision]
    misconceptions:
      - belief: A hook can be upgraded or swapped out on a live pool.
        reality: The hook address is part of the PoolKey, so it is fixed for that pool's lifetime. A hook can, however, be an upgradeable proxy, which is a separate thing to check.
        why: Everything else in DeFi is upgradeable.
        source: uniswap-hooks-docs

  - id: hook-permission-bits
    title: Permission bits in the hook address
    oneLine: Which callbacks a hook receives is encoded in the low bits of its own address, so the address must be mined to match the intended permissions.
    statement: >
      The PoolManager decides whether to call a given hook callback by inspecting flag bits in the
      hook's address rather than by reading storage or calling the hook. A hook that wants
      beforeSwap must therefore be deployed at an address whose corresponding bit is set, which in
      practice means grinding a CREATE2 salt until the derived address matches the required mask.
      The design makes permissions a free read for the PoolManager and makes them immutable and
      publicly auditable from the address alone. It also means a deployment mistake produces a hook
      whose callbacks are simply never invoked, silently, rather than reverting.
    volatility: evolving
    edges:
      - { to: hook, type: requires }
      - { to: create2-address, type: requires }
    sources: [uniswap-hooks-docs, zealynx-v4-security]
    misconceptions:
      - belief: Hook permissions are configured after deployment.
        reality: They are encoded in the deployed address, which is why hook addresses are mined with CREATE2 salt search.
        why: Every other permission system in Solidity is a storage variable.
        source: uniswap-hooks-docs
      - belief: An address with a permission bit set means that callback is implemented.
        reality: The bit only means the PoolManager will call it. Whether the hook does anything useful or safe in that callback is a separate question entirely.
        why: The bit is described as a permission, which sounds like a capability the hook exercises.
        source: zealynx-v4-security

  - id: hook-is-trusted-code
    title: The hook is trusted code
    oneLine: A pool's hook can retax, reorder, degrade or block swaps, so choosing a pool is choosing whose code to trust.
    statement: >
      Because the PoolManager calls the hook inside every swap and liquidity operation on that pool,
      the hook can charge arbitrary additional fees, return custom deltas, revert selectively,
      condition behaviour on the caller, or take value through the donate path. None of this is a
      vulnerability in v4; it is the extension point working as designed. The security consequence
      is that trading against a v4 pool is trusting an unaudited third-party contract with the
      execution of your trade, in the same way that approving a token to a router is trusting the
      router. The user-side defence is unchanged and unglamorous: a real minimum-output bound, a
      deadline, and knowing which pool you are routed through.
    volatility: evolving
    edges:
      - { to: hook, type: requires }
      - { to: hook-permission-bits, type: requires }
      - { to: slippage-tolerance, type: requires }
      - { to: oracle-manipulation, type: contrasts }
    sources: [zealynx-v4-security, uniswap-hooks-docs]
    misconceptions:
      - belief: Trading on a v4 pool is as safe as v3 because it is the same protocol.
        reality: v3 pools have no third-party code path inside a swap. v4 pools do, and each pool's hook is chosen by whoever created that pool.
        why: The brand and the router are the same, so the trust boundary looks unchanged.
        source: zealynx-v4-security
      - belief: A malicious hook can be detected by simulating the swap.
        reality: A hook can behave differently for a simulation and for the real caller, or condition on block number, caller or state. Simulation raises the bar; it does not establish safety.
        why: Simulation is treated as equivalent to execution.
        source: zealynx-v4-security
