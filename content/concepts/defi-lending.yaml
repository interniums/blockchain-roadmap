moduleId: defi-lending
concepts:
  - id: lend-overcollateralisation
    title: Over-collateralisation
    oneLine: With no identity, credit scoring or recourse, the only enforceable loan is one backed by on-chain collateral worth more than the debt.
    statement: >
      A permissionless lending pool cannot sue, cannot repossess off-chain assets and cannot
      distinguish one borrower from a thousand fresh addresses. The only enforcement mechanism it
      has is a claim on assets it already holds, so every loan must be backed by collateral worth
      strictly more than the debt, with the excess sized to cover the price move and the execution
      cost of selling that collateral before the debt goes unbacked. Everything else in lending
      design — collateral factors, health factors, liquidation incentives, caps — is bookkeeping
      around that single structural constraint.
    volatility: stable
    edges:
      - { to: erc20-is-a-ledger, type: requires }
      - { to: flash-loan, type: contrasts }
    sources: [aave-v3-pool-docs, morpho-market-docs]
    misconceptions:
      - belief: Over-collateralised lending is a temporary limitation that on-chain credit scores will remove.
        reality: It follows from the absence of recourse, not from missing data. Any under-collateralised design must reintroduce recourse somewhere off-chain, which reintroduces permission.
        why: Under-collateralised credit is framed as a product gap rather than a trust boundary.
        source: morpho-market-docs

  - id: lend-ltv-vs-liquidation-threshold
    title: LTV versus liquidation threshold
    oneLine: LTV caps how much you may borrow at open time; the liquidation threshold is a strictly higher ratio at which the position becomes seizable.
    statement: >
      Two distinct parameters govern a collateral asset. The loan-to-value ratio (also called the
      collateral factor) limits how much debt a position may open or increase to. The liquidation
      threshold is a separate, strictly larger ratio at which the position becomes eligible for
      liquidation. The band between them is deliberate: it is the price move a borrower may absorb
      after opening at maximum leverage before being liquidated. On Aave v3 both live in the same
      packed reserve configuration word alongside the liquidation bonus, borrow and supply caps and
      the isolation-mode debt ceiling, which is a good reminder that risk configuration is one
      bit-packed struct, not a policy document.
    volatility: stable
    edges:
      - { to: lend-overcollateralisation, type: requires }
    sources: [aave-v3-pool-docs]
    misconceptions:
      - belief: LTV and the liquidation threshold are the same number.
        reality: LTV gates borrowing at open; the threshold is a higher ratio that gates seizure. The band between them is the only thing standing between a maximum-leverage borrower and instant liquidation.
        why: Most interfaces show one borrow-limit bar and hide the second parameter.
        source: aave-v3-pool-docs

  - id: lend-health-factor
    title: Health factor
    oneLine: Collateral weighted by each asset's liquidation threshold, divided by debt value — below one, the position is seizable.
    statement: >
      Health factor is the sum over collateral assets of value times liquidation threshold, divided
      by total borrow value. Below one, the position may be liquidated. Two properties follow and
      both are routinely missed. First, it is a ratio of values, so it moves whenever either leg's
      oracle price moves and whenever interest accrues — a position can become liquidatable with no
      transaction ever touching it. Second, the price move that kills a position depends on which
      leg is volatile: the same health factor implies a very different distance to liquidation for
      stable-collateral-versus-volatile-debt than for the reverse.
    volatility: stable
    edges:
      - { to: lend-ltv-vs-liquidation-threshold, type: requires }
      - { to: orac-price-feed, type: recommends }
      - { to: liq-why-liquidation-exists, type: applies }
    sources: [aave-v3-pool-docs]
    misconceptions:
      - belief: A health factor of 1.5 means you are 50 percent away from liquidation in price terms.
        reality: It is a value ratio. Translating it into a price distance requires knowing which side of the position moves, and the answer differs by a large factor between the two cases.
        why: Health factor is taught as a scalar without asking which leg is volatile.
        source: aave-v3-pool-docs
      - belief: Your position is only at risk when you act.
        reality: Interest accrual and oracle updates both change health factor with no user transaction. Positions are liquidated in their sleep.
        why: The interface only recomputes when you interact with it.
        source: aave-v3-pool-docs

  - id: lend-emode
    title: Efficiency mode
    oneLine: Higher LTV and liquidation threshold for baskets of assets the risk framework asserts are price-correlated.
    statement: >
      Efficiency mode raises the borrowing limits for positions restricted to a category of assets
      declared correlated — for example ETH against liquid staking tokens, or one dollar
      stablecoin against another. Because the two legs are assumed to move together, the residual
      price risk the buffer must cover is the tracking error between them rather than each asset's
      outright volatility, so a much thinner buffer appears adequate. The leverage this buys is
      real, and so is the substitution: the position's safety now rests on a governance assertion
      about correlation rather than on an observed price distribution.
    volatility: evolving
    edges:
      - { to: lend-ltv-vs-liquidation-threshold, type: requires }
      - { to: lend-correlation-break, type: contrasts }
    sources: [aave-v3-pool-docs]
    misconceptions:
      - belief: E-mode is a discount the protocol gives for using safer assets.
        reality: It is a bet that a specific correlation holds. The assets are not safer; the buffer is thinner because a relationship between them is assumed.
        why: It is presented in the interface as a mode you switch on, not as a risk parameter you accept.
        source: aave-v3-pool-docs

  - id: lend-correlation-break
    title: Correlation break
    oneLine: The high LTVs of a correlated basket are safe only while the correlation holds; a depeg turns the whole basket into instant mass insolvency.
    statement: >
      The buffer under efficiency mode is sized for tracking error, so a discrete break in the
      relationship — a liquid staking token trading below its redemption value, or one dollar
      stablecoin depegging against another — moves every position in the category past its
      liquidation threshold simultaneously. Two effects compound. The positions are correlated by
      construction, so liquidations arrive as a single wave rather than as a distribution; and the
      seized collateral is the depegging asset, so the exit liquidity liquidators need is exactly
      the liquidity that has just disappeared. Correlated-basket leverage converts one asset's
      credibility problem into a solvency event for a whole market.
    volatility: evolving
    edges:
      - { to: lend-emode, type: requires }
      - { to: liq-cascade, type: applies }
      - { to: stable-depeg-asymmetry, type: recommends }
    sources: [aave-v3-pool-docs, morpho-security-considerations]
    misconceptions:
      - belief: A depeg only hurts holders of the depegging asset.
        reality: Every leveraged position collateralised by it inside a correlated-asset category becomes liquidatable at once, and the liquidators need to sell into the same broken market.
        why: Depegs are framed as a pricing event rather than a leverage event.
        source: morpho-security-considerations

  - id: lend-utilisation
    title: Utilisation
    oneLine: Total borrows divided by total supplied — the one state variable that both prices money and determines whether suppliers can leave.
    statement: >
      Utilisation U is total borrows divided by total supplied. It is the sole input to the borrow
      rate in a classic pool, and it is simultaneously the withdrawal-availability metric: the
      fraction of supplied capital that is not currently in the pool is exactly the fraction that
      cannot be withdrawn. At U equal to one, no supplier can exit at any price, regardless of the
      protocol's solvency. Treating utilisation purely as a capital-efficiency number, as
      dashboards do, hides the fact that the same variable measures how close the pool is to a run.
    volatility: stable
    edges:
      - { to: lend-overcollateralisation, type: requires }
    sources: [aave-v3-rate-strategy-docs, morpho-market-docs]
    misconceptions:
      - belief: High utilisation is good because it means the pool is efficient.
        reality: It also means suppliers cannot exit. A pool pinned at 100 percent utilisation is a pool in a run, and the steep part of the rate curve exists precisely to price that state away.
        why: Capital efficiency is the framing every dashboard uses.
        source: aave-v3-rate-strategy-docs

  - id: lend-rate-kink
    title: The kinked rate curve
    oneLine: A two-slope borrow rate whose second slope is deliberately brutal, so price rather than a queue rations the last units of liquidity.
    statement: >
      The classic interest rate model is piecewise linear in utilisation. Below an optimal
      utilisation the borrow rate is base plus slope1 scaled by U over U_optimal; above it, base
      plus slope1 plus slope2 scaled by the excess over the remaining range. Slope2 is set orders
      of magnitude steeper than slope1 on purpose. Because a pool cannot queue withdrawals, the
      only instrument it has for pulling utilisation back down is to make borrowing expensive
      enough that borrowers repay and suppliers deposit. The kink is therefore not a curve-fitting
      choice; it is a rationing mechanism implemented as a price.
    volatility: stable
    edges:
      - { to: lend-utilisation, type: requires }
    sources: [aave-v3-rate-strategy-docs]
    misconceptions:
      - belief: The steep slope exists to maximise protocol revenue.
        reality: It exists to force utilisation back below the kink so suppliers can withdraw. Revenue is a side effect of a mechanism whose job is liquidity restoration.
        why: The visible outcome is a very high APY.
        source: aave-v3-rate-strategy-docs

  - id: lend-supply-rate-derivation
    title: Where the supply rate comes from
    oneLine: Supply rate equals borrow rate times utilisation times one minus the reserve factor — nobody sets it.
    statement: >
      Suppliers are paid only on the fraction of their capital that is actually borrowed, and only
      after the protocol's cut. The supply rate is therefore borrowRate * U * (1 - reserveFactor),
      a derived quantity with no independent governance parameter. Two consequences follow. At low
      utilisation the supply APY collapses towards zero however attractive the borrow APY looks,
      and the reserve factor is a straight tax whose size is invisible unless you do the
      multiplication. Any lending analysis that compares a headline supply APY across protocols
      without recovering utilisation and reserve factor is comparing three variables through one
      number.
    volatility: stable
    edges:
      - { to: lend-utilisation, type: requires }
      - { to: lend-rate-kink, type: requires }
    sources: [aave-v3-rate-strategy-docs]
    misconceptions:
      - belief: Suppliers earn the borrow rate.
        reality: They earn borrow rate times utilisation times one minus the reserve factor. At half utilisation with a meaningful reserve factor, a six percent borrow rate pays well under three percent.
        why: Dashboards display both APYs side by side with no derivation between them.
        source: aave-v3-rate-strategy-docs

  - id: lend-index-accounting
    title: Index accounting
    oneLine: The pool stores one rising index and each account stores a scaled balance, so interest accrues in O(1) and nobody is iterated.
    statement: >
      Interest is not applied per user. The pool maintains monotonically increasing liquidity and
      borrow indices, and each account stores a scaled balance equal to its nominal amount divided
      by the index at the time of its last write. A balance query multiplies the scaled balance by
      the current index. Accrual is therefore a single index update per reserve, independent of the
      number of accounts, and a user's balance changes continuously with no transaction touching
      their storage. This is also why an integration that caches a balance is wrong within one
      block, and why rounding in the index update direction is a security-relevant choice.
    volatility: stable
    edges:
      - { to: lend-supply-rate-derivation, type: requires }
    sources: [aave-v3-origin-33, aave-v3-rate-strategy-docs]
    misconceptions:
      - belief: Interest is computed per user on each block.
        reality: A global index moves and per-account scaled balances stay fixed. Nothing is iterated, which is the only reason a pool with a million accounts is feasible on chain.
        why: The mental model is imported from off-chain ledgers that post interest to accounts.
        source: aave-v3-origin-33

  - id: lend-caps-and-ceilings
    title: Caps and ceilings
    oneLine: Supply caps, borrow caps and isolation debt ceilings bound the worst-case loss per asset regardless of how wrong the LTV turned out to be.
    statement: >
      Caps are the crude risk lever and the only one whose effect does not depend on the risk model
      being right. A supply cap bounds how much of an asset can ever be deposited, a borrow cap
      bounds how much can be borrowed against it, and an isolation-mode debt ceiling bounds the
      total debt any single isolated collateral can support. Where an LTV parameter expresses a
      belief about volatility, a cap expresses a bound on consequences. When a listing turns out to
      be wrong — a bad oracle, an unbacked token, a governance capture — the cap is the parameter
      that decides whether the loss is a line item or an existential one.
    volatility: evolving
    edges:
      - { to: lend-ltv-vs-liquidation-threshold, type: requires }
    sources: [aave-v3-pool-docs]
    misconceptions:
      - belief: Caps are a growth throttle for new assets.
        reality: They are a loss bound. Their value is highest exactly when every other risk parameter has been set on a false premise.
        why: Caps are usually raised over time as an asset matures, which makes them look like onboarding friction.
        source: aave-v3-pool-docs

  - id: lend-isolated-vs-pooled
    title: Isolated versus pooled markets
    oneLine: A shared pool socialises every listing mistake across all suppliers; an isolated market confines the loss and fragments the liquidity.
    statement: >
      In a monolithic pool all collateral types back one liquidity pot, so a loss from any listing
      falls on every supplier of the borrowed asset. In an isolated design — Morpho Blue's
      immutable five-tuple of loan token, collateral token, oracle, interest rate model and LLTV,
      or Euler v2 vaults, or Aave's isolation mode — a market's loss lands only on that market's
      suppliers. The cost is fragmentation: the same asset pair exists many times with different
      parameters and thinner depth in each. The choice is not safety versus risk; it is whether
      losses are pooled and liquidity is deep, or losses are contained and liquidity is scattered.
    volatility: evolving
    edges:
      - { to: lend-caps-and-ceilings, type: requires }
    sources: [morpho-market-docs, morpho-liquidation-docs, mixbytes-morpho-blue]
    misconceptions:
      - belief: Isolated markets eliminate contagion.
        reality: They isolate accounting loss, not behavioural contagion. Shared oracles, shared collateral assets and curator vaults spread across many markets all re-couple markets that are nominally isolated.
        why: Isolated is read as independent.
        source: morpho-security-considerations

  - id: lend-curated-vaults
    title: Curated vaults
    oneLine: On isolated-market protocols the risk decision moves from a DAO framework to a curator's mandate and caps.
    statement: >
      Isolated markets are primitives, not products: a supplier would otherwise have to choose among
      hundreds of parameter combinations. Curated vaults close that gap by taking deposits and
      allocating them across markets according to a published mandate, with per-market caps. The
      risk question changes shape rather than disappearing — from trust this DAO's risk framework
      to trust this curator's mandate, their caps, and their incentive to chase yield. The
      loss-realisation semantics are a vault implementation detail with large consequences:
      MetaMorpho v1.0 vaults realise bad debt into the share price, while v1.1 vaults do not and
      leave it accruing until repaid, which is the same brand with opposite loss behaviour.
    volatility: evolving
    edges:
      - { to: lend-isolated-vs-pooled, type: requires }
    sources: [morpho-bad-debt-docs, morpho-security-considerations]
    misconceptions:
      - belief: Depositing into a curated vault is depositing into the protocol.
        reality: It is depositing into a discretionary allocator that happens to use the protocol. The vault's mandate, caps and bad-debt realisation policy are the actual terms.
        why: The vault carries the protocol's brand in its name.
        source: morpho-bad-debt-docs

  - id: lend-bad-debt
    title: Bad debt
    oneLine: Debt with no collateral left behind it, which keeps accruing interest and inflates a phantom asset until the protocol accounts for it explicitly.
    statement: >
      Bad debt — Aave calls the accounted form a deficit — is debt whose backing collateral has been
      exhausted. Left as ordinary debt it continues to accrue interest, so the protocol's books show
      a growing asset that will never be collected and every supplier's balance overstates what is
      recoverable. Aave v3.3 addressed this directly by adding on-chain deficit accounting and a
      check at the end of liquidation that an account cannot be left with zero collateral and
      non-zero debt; the residual is moved into the reserve's deficit instead. Recognising the loss
      does not recover it, but it stops the phantom interest and makes the shortfall a number the
      protocol can act on.
    volatility: evolving
    edges:
      - { to: lend-health-factor, type: requires }
      - { to: liq-bad-debt-threshold, type: recommends }
    sources: [aave-v3-origin-33, morpho-bad-debt-docs, coindesk-kelp-aave]
    misconceptions:
      - belief: Bad debt only happens when liquidators are too slow.
        reality: The largest 2026 case had no liquidation price at all — the collateral was unbacked from the moment it was deposited. Bad debt is a collateral-validity failure at least as often as a latency failure.
        why: Curricula introduce bad debt inside the liquidation chapter, so latency is the only cause on offer.
        source: coindesk-kelp-aave
      - belief: If the protocol's code was not exploited, the protocol did not fail.
        reality: In the April 2026 Kelp DAO incident an attacker released unbacked rsETH through a bridge, supplied it to Aave as collateral and borrowed real WETH against it. Aave's contracts behaved exactly as written; the control that failed was the collateral listing, which cannot distinguish unbacked from backed supply given only a price feed and a token balance.
        why: Audit scope is the contract, so failure is looked for inside the contract.
        source: coindesk-kelp-aave

  - id: lend-bad-debt-is-a-bank-run
    title: Bad debt is also a bank run
    oneLine: Withdrawals are first-come-first-served against a shared pool, so discovering bad debt rationally triggers a race that traps the slow.
    statement: >
      A shared lending pool has no pro-rata redemption. Once a loss is known but not yet
      socialised, the rational action for every supplier is to withdraw before the others, because
      the early exits leave at par and the shortfall lands on whoever remains. The resulting race
      pushes utilisation to its maximum, at which point no further withdrawals are possible at any
      rate, and the borrow rate spikes into the steep region for borrowers who had nothing to do
      with the loss. The loss and the run are separate harms: a protocol can be solvent in
      aggregate and still trap the slow half of its suppliers for as long as utilisation stays
      pinned.
    volatility: evolving
    edges:
      - { to: lend-bad-debt, type: requires }
      - { to: lend-utilisation, type: requires }
    sources: [coindesk-kelp-aave, aave-v3-rate-strategy-docs]
    misconceptions:
      - belief: If the protocol remains over-collateralised in aggregate, suppliers are fine.
        reality: Solvency is about eventual value; withdrawal is about present liquidity. A fully solvent pool at maximum utilisation lets nobody out.
        why: Solvency and liquidity are collapsed into one word, safe.
        source: aave-v3-rate-strategy-docs

  - id: lend-backstop
    title: Backstops
    oneLine: A pre-committed capital tranche that is burned to absorb residual loss, scoped narrowly enough that its holders can price what they are underwriting.
    statement: >
      When a deficit exceeds what the protocol's reserves absorb, the remaining loss has to land
      somewhere chosen in advance rather than on whoever withdraws last. Aave's Umbrella design
      does this with staked aTokens or GHO that are burned automatically to offset a deficit,
      scoped per asset and per network, so a shortfall in one market's asset burns only that
      market's stakers and requires no governance vote. Curve's response to a bad-debt event in the
      same period was instead a market-based recovery pool rather than a treasury-funded
      repayment. Both are answers to the same question — who is the loss-absorbing tranche, and did
      they consent — which is the question a lending protocol must answer before the loss, not
      after.
    volatility: evolving
    edges:
      - { to: lend-bad-debt, type: requires }
    sources: [aave-umbrella-docs, aave-umbrella-arfc, coindesk-curve-bad-debt]
    misconceptions:
      - belief: The safety module slashes staked governance tokens across the whole protocol.
        reality: That was the older design. Umbrella stakes are asset-scoped and network-scoped, so a deficit in one asset on one network burns only those stakers. Check which design is live before teaching either.
        why: The older mechanism is what most secondary material still describes.
        source: aave-umbrella-docs
      - belief: A backstop makes suppliers whole.
        reality: It caps how far the loss travels. Whether it covers a given deficit depends on the size of the staked tranche and on how much the protocol absorbs first, both of which are governance parameters that must be read rather than assumed.
        why: Insurance framing implies coverage rather than a tranche.
        source: aave-umbrella-arfc
