moduleId: defi-liquidations
concepts:
  - id: liq-why-liquidation-exists
    title: What liquidation is for
    oneLine: Not punishment — the protocol paying a third party to retire under-collateralised debt before the collateral is worth less than the loan.
    statement: >
      Liquidation exists because a protocol cannot sell. It has no mempool access, no keys and no
      execution venue of its own; it can only expose a function that lets someone else repay part of
      a position's debt in exchange for some of its collateral. The protocol's solvency is therefore
      not enforced by code but purchased, continuously, from whoever finds calling that function
      profitable. Every liquidation design is an answer to one question: what must we pay, and to
      whom, so that under-collateralised debt is retired faster than prices move.
    volatility: stable
    edges:
      - { to: lend-health-factor, type: requires }
    sources: [aave-v3-pool-docs, morpho-liquidation-docs]
    misconceptions:
      - belief: The protocol liquidated my position.
        reality: The protocol did nothing. A third party called a public function because doing so was profitable, and the protocol accepted it because the position was eligible.
        why: Interfaces phrase it in the active voice, with the protocol as subject.
        source: aave-v3-pool-docs

  - id: liq-incentive
    title: The liquidation incentive
    oneLine: The discount at which a liquidator buys seized collateral, which must exceed gas plus exit slippage plus inventory risk or nobody calls the function.
    statement: >
      The liquidation bonus is the premium a liquidator receives over the repaid debt, expressed as
      a discount on the seized collateral. A liquidation happens only when that discount exceeds
      the liquidator's total cost: transaction cost at the prevailing gas price, price impact on
      selling the collateral, any bridging or routing overhead, and the risk of holding the asset
      if the exit is not atomic. Because all four terms are position-size- and market-dependent, a
      single governance-set bonus is profitable for some positions and not others at the same
      moment — which means the incentive silently defines a minimum liquidatable position size.
    volatility: stable
    edges:
      - { to: liq-why-liquidation-exists, type: requires }
      - { to: price-impact, type: requires }
    sources: [aave-v3-pool-docs, morpho-liquidation-docs]
    misconceptions:
      - belief: A published liquidation bonus means liquidations will happen.
        reality: It means they will happen for positions large enough that the bonus clears gas and exit slippage. Below that size the function exists and nobody calls it.
        why: The bonus is quoted as a percentage, which hides its interaction with a fixed gas cost.
        source: morpho-liquidation-docs

  - id: liq-incentive-is-a-loss
    title: The incentive is paid by the borrower
    oneLine: Every unit of liquidation bonus is taken from borrower equity, so sizing it trades reliable liquidation against robbing people on a wick.
    statement: >
      The bonus is not created by the protocol; it is the difference between what the liquidator
      pays and what they receive, and that difference comes out of the borrower's remaining
      collateral. Raising the bonus makes liquidations more reliable and makes each one more
      expensive for the borrower and more damaging to the market, because a larger discount means
      more collateral must be sold to retire the same debt. There is an optimum rather than a
      monotone improvement: past some point a higher bonus accelerates the very price decline that
      created the liquidations.
    volatility: stable
    edges:
      - { to: liq-incentive, type: requires }
      - { to: liq-cascade, type: recommends }
    sources: [aave-v3-pool-docs, coindesk-19b-liquidation]
    misconceptions:
      - belief: A bigger liquidation bonus always makes the system safer.
        reality: The bonus is paid from borrower equity and each liquidation dumps more collateral at a larger discount, pushing price further and creating the next liquidation. Safety in the bonus parameter is a hump, not a slope.
        why: Incentives are reasoned about without the reflexive effect on price.
        source: coindesk-19b-liquidation

  - id: liq-close-factor
    title: Close factor
    oneLine: A cap on how much of a position one liquidation call may repay, limiting borrower damage at the cost of leaving dust.
    statement: >
      The close factor bounds the fraction of a position's debt that a single liquidation may
      retire — classically one half. It limits the damage a single call does to a borrower and
      forces the market to re-evaluate between rounds. The cost is that a partial liquidation can
      leave a residual position too small to be worth liquidating at current gas prices, which then
      sits under water indefinitely. Implementations have moved on from a single constant: Aave v3.2
      and v3.3 permit closing the whole position in defined circumstances such as small or deeply
      under-water positions, precisely to avoid stranding dust. The exact live threshold is a
      protocol constant that must be read from the deployed code rather than recalled.
    volatility: evolving
    edges:
      - { to: liq-incentive, type: requires }
      - { to: liq-bad-debt-threshold, type: recommends }
    sources: [aave-v3-pool-docs, aave-v3-origin-33]
    misconceptions:
      - belief: Aave's close factor is always fifty percent.
        reality: Fifty percent is the classic value and the one the older documentation states, but v3.2 and v3.3 allow full closure in defined cases. Treat the number as a deployed constant to read, not a fact to memorise.
        why: The constant appears in every tutorial written before the change.
        source: aave-v3-origin-33

  - id: liq-fixed-discount
    title: Fixed-discount liquidation
    oneLine: A governance-set bonus and a first-come race — atomic and simple, and it hands the entire surplus to whoever wins the ordering fight.
    statement: >
      Aave- and Compound-style liquidation sets the discount as a parameter and lets anyone call
      liquidationCall the instant a position becomes eligible. The design is atomic, composable and
      trivially integrable, which is why it dominates. Its economics are a race: the discount is
      fixed, so the only variable is who lands first, and the surplus goes entirely to whoever wins
      the ordering competition rather than to the borrower or the protocol. That race is the direct
      link between lending design and block-ordering markets, and the reason liquidation flow is
      among the most valuable orderflow on chain.
    volatility: stable
    edges:
      - { to: liq-incentive, type: requires }
      - { to: liq-dutch-auction, type: contrasts }
    sources: [aave-v3-pool-docs]
    misconceptions:
      - belief: A fixed discount means the borrower loses a predictable amount.
        reality: The borrower's loss is fixed, but the value the liquidator captures above their cost is bid away in the ordering market. The parameter sets the size of the prize, not who gets it or what they pay for it.
        why: The parameter is described from the protocol's side, not the searcher's.
        source: aave-v3-pool-docs

  - id: liq-dutch-auction
    title: Dutch-auction liquidation
    oneLine: The ask starts above market and falls until someone takes it, so the discount is discovered rather than set by governance.
    statement: >
      Maker-style liquidation runs a descending-price auction: the collateral is offered at a price
      above market that decays along a curve until a taker appears. In calm conditions this clears
      near zero discount and the borrower keeps more equity; under stress the price keeps falling
      until someone with working infrastructure is willing to act. The design replaces a governance
      guess about the right bonus with price discovery, at the cost of latency and of contract
      complexity. It was itself a response to failure: the earlier English-auction design produced
      near-zero winning bids during the March 2020 congestion, because competing keepers could not
      get transactions included and the auction cleared fairly at almost nothing.
    volatility: stable
    edges:
      - { to: liq-incentive, type: requires }
      - { to: liq-keeper-liveness-assumption, type: recommends }
    sources: [dss-clip-source, glassnode-makerdao-black-thursday]
    misconceptions:
      - belief: An auction guarantees fair price discovery.
        reality: An auction inherits the liveness assumptions of the chain it runs on. If bidders cannot land transactions, it clears fairly at whatever the one bidder who could offered.
        why: Auction theory is taught without the mempool.
        source: glassnode-makerdao-black-thursday

  - id: liq-flash-loan-liquidator
    title: The capital-free liquidator
    oneLine: Flash-borrow the debt asset, repay, seize, swap, repay the loan, keep the spread — so capital is not the barrier, ordering is.
    statement: >
      A modern liquidator holds no inventory. In one transaction it flash-borrows the debt asset,
      calls the protocol's liquidation function, receives discounted collateral, sells it on an
      AMM, repays the flash loan with fee and keeps the remainder — reverting entirely if the
      arithmetic does not work out. Capital requirement is therefore zero and the real constraints
      are transaction inclusion, gas and the depth of the exit venue. This is why liquidation
      latency on a healthy market is sub-block, and why liquidation profitability is a slippage
      budget rather than a return on capital.
    volatility: stable
    edges:
      - { to: liq-fixed-discount, type: requires }
      - { to: flash-loan, type: requires }
      - { to: mev-searcher, type: recommends }
    sources: [aave-v3-pool-docs]
    misconceptions:
      - belief: Liquidation profits reward capital provision.
        reality: No capital is committed. The profit is compensation for latency, infrastructure and the risk that the exit trade moves against you inside the same transaction.
        why: Liquidation is described as buying collateral at a discount, which implies buying power.
        source: aave-v3-pool-docs

  - id: liq-keeper-liveness-assumption
    title: The keeper liveness assumption
    oneLine: Every liquidation design assumes a competitive keeper set with working RPC, funded wallets and a profitable route — and fails exactly when that assumption does.
    statement: >
      Liquidation designs are analysed as if the keeper set were a constant. It is not: it is a
      population of bots dependent on RPC providers, funded hot wallets, working price feeds,
      liquid exit routes and profitable arithmetic at the prevailing gas price. Every one of those
      dependencies degrades under exactly the conditions that produce liquidations — RPC providers
      throttle, nodes fall behind, routes thin out, gas spikes. The assumption is therefore
      negatively correlated with the event it must survive, which is the single most important
      structural fact about liquidation reliability.
    volatility: stable
    edges:
      - { to: liq-incentive, type: requires }
      - { to: liq-flash-loan-liquidator, type: requires }
    claimKind: empirical
    sources: [gov-curve-sdola-postmortem, coindesk-19b-liquidation]
    misconceptions:
      - belief: Bad debt means the liquidators were asleep.
        reality: In the documented 2025 and 2026 on-chain cases the failure was structural — price velocity against gas cost in one, an oracle that was itself a protocol function in the other. Perfect keepers would not have prevented either.
        why: Blaming the keeper set is the simplest available story.
        source: gov-curve-sdola-postmortem

  - id: liq-gas-price-coupling
    title: Gas coupling
    oneLine: Liquidation profitability falls as congestion rises, and congestion peaks during crashes — so the incentive shrinks exactly when it must grow.
    statement: >
      A liquidation's profit is the bonus minus gas minus exit slippage. During a crash the bonus is
      unchanged, gas rises with contention, and exit slippage widens as depth is consumed. The
      minimum profitable position size therefore rises sharply at the moment the number of eligible
      positions is highest, stranding the smaller ones. Curve's CRV-collateral LlamaLend market
      accumulated bad debt during the 10 October 2025 crash for precisely this reason: price
      velocity outran what keepers could profitably act on while gas costs spiked. This is not a
      2025 discovery: an on-chain study of 28,138 liquidations across Aave, Compound, MakerDAO and
      dYdX records the same coupling in the 13 March 2020 crash, where a 43% ETH decline congested
      the network, liquidation transactions were not included promptly, and the auctions were won
      by whoever could still act. This coupling, not keeper apathy, is the mechanism that turns a
      market event into protocol insolvency.
    volatility: stable
    edges:
      - { to: liq-keeper-liveness-assumption, type: requires }
    claimKind: empirical
    sources: [coindesk-19b-liquidation, coindesk-curve-bad-debt, arxiv-defi-liquidations-empirical]
    misconceptions:
      - belief: Raising the bonus solves congestion-driven liquidation failure.
        reality: It raises the profit and also the amount of collateral dumped per liquidation, so it buys reliability at the price of a steeper cascade. It cannot make an incentive uncorrelated with the conditions that suppress it.
        why: The bonus is the only obviously tunable parameter.
        source: coindesk-19b-liquidation

  - id: liq-bad-debt-threshold
    title: The unliquidatable threshold
    oneLine: Once debt exceeds collateral value minus the incentive, rational liquidators stop and the residual is bad debt however many keepers are watching.
    statement: >
      A liquidation is profitable only while the seized collateral, after the discount, is worth
      more than the debt repaid plus costs. As price falls past the point where debt equals
      collateral value minus the incentive, the trade turns negative and every rational actor
      declines. From there no amount of keeper competition helps: the position is not slow to
      liquidate, it is unprofitable to liquidate, and the shortfall becomes bad debt. This
      threshold, not the health factor of one, is the real solvency boundary of a lending market,
      and the gap between the two is what the liquidation buffer is supposed to cover.
    volatility: stable
    edges:
      - { to: liq-incentive, type: requires }
      - { to: lend-bad-debt, type: requires }
    sources: [morpho-liquidation-docs, aave-v3-origin-33]
    misconceptions:
      - belief: A position under water can always be liquidated at some price.
        reality: Only if someone is willing to take the trade. Below the threshold the liquidation function still exists and calling it is a loss, so it stays uncalled.
        why: The function's existence is confused with its use.
        source: morpho-liquidation-docs

  - id: liq-cascade
    title: The liquidation cascade
    oneLine: Forced selling pushes price down, which pushes more positions under water, which forces more selling — bounded only by block time and exit depth.
    statement: >
      Liquidation sells collateral into the market that just moved against it. That selling consumes
      depth and moves price further, which drops more positions below their thresholds, which
      produces more forced selling. The loop is reflexive and its speed is limited only by block
      time and by how much depth remains. The 10 October 2025 event is the reference case: a market
      carrying very large open interest with no circuit breakers deleveraged across roughly a day,
      with the widely reported total around nineteen billion dollars — a figure that should be
      treated as a reported floor rather than a measurement. The under-reporting is documented in the
      venues' own API specifications: Binance's liquidation-order streams state that for each symbol
      only the latest liquidation order within 1000ms is pushed, so any period in which a symbol
      liquidates more than once per second is reported as one liquidation.
    volatility: evolving
    edges:
      - { to: liq-bad-debt-threshold, type: requires }
      - { to: price-impact, type: requires }
    claimKind: empirical
    sources: [coindesk-19b-liquidation, binance-liquidation-order-streams]
    misconceptions:
      - belief: The reported liquidation total for a cascade is a measurement.
        reality: The feeds are rate-limited by design — one liquidation per symbol per second in Binance's published stream spec — so headline totals are a reported floor rather than a measured quantity. Some analysts argue the true figure is materially higher.
        why: A single large number is easier to cite than a bound.
        source: binance-liquidation-order-streams

  - id: liq-cascade-cross-venue
    title: Cascades cross venues
    oneLine: Perpetual-futures liquidations on centralised venues move the price that on-chain lenders read, so an off-chain deleveraging becomes an on-chain liquidation event.
    statement: >
      On-chain lenders price collateral from oracles, and those oracles aggregate venues where
      leveraged derivatives trade. A deleveraging in perpetual futures therefore transmits directly
      into on-chain health factors with no on-chain trigger at all: nothing was borrowed, sold or
      swapped on chain, and yet every position's health factor moves. The consequence for design is
      that a lending protocol's tail risk is a function of leverage sitting on venues it does not
      control and cannot observe, and that a protocol's own circuit breakers cannot see the
      cascade until it is already in the price.
    volatility: evolving
    edges:
      - { to: liq-cascade, type: requires }
      - { to: orac-price-feed, type: recommends }
    sources: [chainlink-data-feeds-docs, coindesk-19b-liquidation]
    misconceptions:
      - belief: On-chain lending is insulated from centralised-exchange leverage.
        reality: The oracle is the transmission channel. Off-chain leverage sets the price your health factor is computed from.
        why: On-chain and off-chain are treated as separate systems because the venues are separate.
        source: coindesk-19b-liquidation

  - id: llamma-bands
    title: LLAMMA bands
    oneLine: The price range is cut into N bands and the collateral is spread across them, each band a concentrated-liquidity range holding collateral, stablecoin, or a mix.
    statement: >
      Curve's LLAMMA discretises a price interval into N bands, where N is chosen by the borrower
      within a protocol-defined range. Collateral is deposited equally across the bands, and each
      band behaves as a concentrated-liquidity range: fully in collateral above its price interval,
      fully in crvUSD below it, and mixed inside. The position's composition is therefore a
      deterministic function of where the price currently sits within the ladder, which is what
      makes progressive conversion possible without any discrete liquidation event.
    volatility: evolving
    edges:
      - { to: virtual-reserves, type: requires }
      - { to: liq-fixed-discount, type: contrasts }
    sources: [curve-llamma-explainer, curve-liquidation-bands]
    misconceptions:
      - belief: Bands are price alerts or trigger levels.
        reality: Each band is an actual liquidity range holding real assets. Crossing one is a trade, not a signal.
        why: The word band suggests a threshold rather than an inventory.
        source: curve-llamma-explainer

  - id: llamma-soft-liquidation
    title: Soft liquidation
    oneLine: Arbitrageurs convert the borrower's collateral into stablecoin band by band as price falls, with no liquidation event, close factor or bonus.
    statement: >
      As the price falls through the ladder, the AMM quotes the borrower's collateral cheaply enough
      that arbitrageurs buy it, band by band, paying in crvUSD which stays in the position. There is
      no discrete liquidation call, no close factor and no liquidation bonus; the position de-risks
      continuously and, if price recovers, the same arbitrage reverses and converts the stablecoin
      back into collateral. The design replaces a step function at health factor one with a smooth
      ramp, and replaces a single privileged liquidator with ordinary arbitrage.
    volatility: evolving
    edges:
      - { to: llamma-bands, type: requires }
      - { to: liq-fixed-discount, type: contrasts }
      - { to: liq-dutch-auction, type: contrasts }
    sources: [curve-llamma-explainer, curve-liquidation-bands]
    misconceptions:
      - belief: Soft liquidation means you cannot be liquidated.
        reality: It means the conversion is continuous rather than discrete. The hard liquidation path still exists and has been used.
        why: No liquidation event is marketed as no liquidation.
        source: curve-llamma-explainer

  - id: llamma-a-parameter
    title: The A parameter
    oneLine: A sets band width and therefore maximum LTV, so band count is a dial between leverage and soft-liquidation smoothness.
    statement: >
      LLAMMA's amplification parameter A determines how narrow each band is, and the maximum
      loan-to-value follows from it and the chosen band count as
      LTV = 100% - loan_discount - 100 * N / (2A). More bands make soft liquidation smoother and
      cheaper for the borrower and simultaneously reduce the leverage available; fewer bands do the
      opposite. There is no setting that is safe on both axes, which makes band count an explicit
      user-facing trade-off rather than a safety default the protocol can pick.
    volatility: evolving
    edges:
      - { to: llamma-bands, type: requires }
      - { to: lend-ltv-vs-liquidation-threshold, type: contrasts }
    sources: [curve-llamma-explainer]
    misconceptions:
      - belief: More bands is always safer.
        reality: More bands reduce soft-liquidation loss and also reduce maximum LTV through the formula. It is a leverage-versus-smoothness dial, not a free safety setting.
        why: The formula linking band count to LTV is rarely shown.
        source: curve-llamma-explainer

  - id: llamma-soft-liquidation-loss
    title: The cost of soft liquidation
    oneLine: Each oscillation through the bands sells low and buys high, so the borrower bleeds value in proportion to realised volatility inside the range.
    statement: >
      Soft liquidation is not free. Every downward pass through a band sells collateral and every
      upward pass buys it back at a higher price, and the difference is paid to the arbitrageurs
      who do the converting. The borrower's loss therefore scales with realised volatility inside
      the band range rather than with the size of any single move, which means a choppy sideways
      market can cost more than one clean liquidation would have. The discrete liquidation penalty
      has been replaced by a continuous one, not removed, and Curve's own documentation frames
      reducing it as a matter of more bands, deeper liquidity and better arbitrage.
    volatility: evolving
    edges:
      - { to: llamma-soft-liquidation, type: requires }
      - { to: liq-incentive-is-a-loss, type: contrasts }
      - { to: impermanent-loss, type: deepens }
    sources: [curve-llamma-explainer, llamarisk-crvusd-incident]
    misconceptions:
      - belief: Soft liquidation is strictly better for the borrower.
        reality: It charges a continuous cost proportional to realised volatility in the range. Whether it beats a discrete liquidation depends on the price path, not on the mechanism alone.
        why: No liquidation penalty is marketed as no cost.
        source: curve-llamma-explainer

  - id: llamma-hard-liquidation
    title: Hard liquidation in LLAMMA
    oneLine: When health goes negative after soft-liquidation losses and interest, anyone may repay the debt and take the collateral.
    statement: >
      LLAMMA defers the classic liquidation path; it does not abolish it. Health accounts for
      accrued interest and for the losses taken during soft liquidation, and when it goes below
      zero the position becomes hard-liquidatable by anyone. Both documented 2025 and 2026 failures
      in LLAMMA markets ended here — the CRV-collateral market's bad debt after the October 2025
      cascade, and the March 2026 sDOLA market incident. The correct summary is that soft
      liquidation changes the shape of the loss curve and pushes the discrete event further out; it
      does not remove the tail.
    volatility: evolving
    edges:
      - { to: llamma-soft-liquidation-loss, type: requires }
      - { to: liq-bad-debt-threshold, type: requires }
    sources: [curve-llamma-explainer, gov-curve-sdola-postmortem, coindesk-curve-bad-debt]
    misconceptions:
      - belief: LLAMMA means you can never be liquidated or accumulate bad debt.
        reality: Both a bad-debt event and a mass hard-liquidation event have occurred in LLAMMA markets. The mechanism reshapes the loss distribution; the tail remains.
        why: Soft liquidation is presented as the whole mechanism.
        source: coindesk-curve-bad-debt

  - id: llamma-oracle-coupling
    title: LLAMMA's oracle coupling
    oneLine: The internal price is pinned to an external oracle and arbitrage does the rebalancing, so a movable oracle can force positions into soft liquidation and then under water on demand.
    statement: >
      LLAMMA's quoted price tracks an external oracle, and the band mechanics depend on arbitrageurs
      responding to the difference between that price and the AMM's. An attacker who can move the
      oracle can therefore drive positions through the bands deliberately rather than waiting for
      the market. The March 2026 sDOLA market incident on LlamaLend is the demonstration: reporting
      of the post-mortem describes a flash-loan-funded swap that first forced the market's positions
      into soft liquidation, followed by an unpermissioned call that inflated the sDOLA
      exchange-rate oracle, leaving those positions insolvent and hard-liquidatable. The
      generalisable lesson is that a yield-bearing token's exchange rate is an oracle, and one that
      any caller can move is an oracle an attacker can move.
    volatility: evolving
    edges:
      - { to: llamma-soft-liquidation, type: requires }
      - { to: orac-manipulation-cost, type: recommends }
      - { to: orac-lp-token-and-rate-oracles, type: recommends }
    sources: [curve-crvusd-amm-docs, gov-curve-sdola-postmortem, curve-llamma-explainer]
    misconceptions:
      - belief: Continuous liquidation makes a market oracle-resilient because there is no single trigger price.
        reality: It makes the whole band range oracle-sensitive instead of one threshold. An attacker who controls the oracle controls where in the ladder every position sits.
        why: Removing the discrete trigger looks like removing the attack target.
        source: gov-curve-sdola-postmortem
