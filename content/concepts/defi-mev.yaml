moduleId: defi-mev
concepts:
  - id: mev-definition
    title: Maximal extractable value
    oneLine: The value obtainable purely by choosing which transactions go in a block and in what order.
    statement: >
      MEV is the profit available to whoever decides inclusion and ordering, over and above the
      standard block reward and fees. It exists because ordering is a discretionary resource with
      economic consequences, not because of any bug in any contract. Any system where a party
      chooses the sequence of state transitions and where the outcome of those transitions depends
      on the sequence will have an analogue. Removing MEV therefore means removing either the
      discretion or the ordering-dependence, not patching a vulnerability.
    volatility: stable
    edges:
      - { to: constant-product, type: requires }
      - { to: mempool-is-a-public-broadcast, type: recommends }
    sources: [ethereum-org-mev]
    misconceptions:
      - belief: MEV is caused by the mempool being public.
        reality: MEV is caused by ordering being valuable. Hiding transactions changes who captures it, not whether it exists — a builder with exclusive flow captures it silently.
        why: Sandwiching is the most visible form and it does depend on visibility.
        source: ethereum-org-mev

  - id: mev-searcher
    title: Searchers
    oneLine: Bots that find an ordering-dependent profit and bid for the right to be placed at a specific position in a block.
    statement: >
      A searcher continuously simulates candidate transaction bundles against current state, finds
      sequences that are profitable, and submits them to builders with a bid for inclusion at a
      particular position. Because entry is permissionless and the opportunity is public once
      identified, competition drives most of the profit into the bid, so searchers are price-takers
      on blockspace and price-makers only on opportunities nobody else has found. The economically
      important consequence is that the value of an opportunity ends up with whoever controls
      ordering, not with the searcher who spotted it.
    volatility: stable
    edges:
      - { to: mev-definition, type: requires }
      - { to: mev-builder, type: contrasts }
    sources: [ethereum-org-mev, flashbots-mev-share-repo]
    misconceptions:
      - belief: Searchers keep the MEV they find.
        reality: Competition pushes most of it into the bid they pay the builder. The persistent surplus accrues to whoever holds the ordering right.
        why: The searcher is the visible actor in every explanation.
        source: ethereum-org-mev

  - id: mev-atomic-arbitrage
    title: Atomic arbitrage
    oneLine: Buy on the cheap venue and sell on the expensive one inside one transaction, reverting if unprofitable — pure competition on latency and bid.
    statement: >
      Cross-venue arbitrage executed within a single transaction carries no inventory risk: if the
      profit does not materialise, the transaction reverts and the only loss is gas. This makes it
      a competition over transaction inclusion and bid size rather than over risk-taking, and it is
      the mechanism that keeps prices consistent across venues without any coordinating party. From
      the system's point of view it is the price-consistency service; the question worth asking is
      not whether it should happen but who pays for it.
    volatility: stable
    edges:
      - { to: mev-searcher, type: requires }
      - { to: price-impact, type: requires }
      - { to: mev-sandwich, type: contrasts }
    sources: [ethereum-org-mev]
    misconceptions:
      - belief: Atomic arbitrage is risky and therefore deserves its return.
        reality: The atomic version has no price risk at all — it reverts if the profit is not there. What it is paid for is infrastructure and the bid, not risk-bearing.
        why: Arbitrage in traditional markets does carry execution risk.
        source: ethereum-org-mev

  - id: mev-arbitrage-is-lvr
    title: Arbitrage is loss-versus-rebalancing
    oneLine: The arbitrageur's profit is the liquidity provider's loss, seen from the other side.
    statement: >
      When an AMM's price lags the market, the arbitrageur's gain is exactly the amount by which
      the pool sold too cheaply or bought too dearly, and that difference comes from the liquidity
      providers' inventory. Loss-versus-rebalancing measures this directly: it compares the LP
      position against a portfolio that continuously rebalances at market prices, and the gap is
      the value transferred to arbitrageurs. It is a continuous transfer rather than an occasional
      one, which is a large part of why passive liquidity provision underperforms holding, and it
      is the reason arbitrage is victimless is false even though no individual trade got worse.
    volatility: stable
    edges:
      - { to: mev-atomic-arbitrage, type: requires }
      - { to: impermanent-loss, type: requires }
    claimKind: empirical
    sources: [arxiv-lvr, ethereum-org-mev]
    misconceptions:
      - belief: Arbitrage MEV is victimless.
        reality: The profit is the LP's loss-versus-rebalancing. Passive LPs pay it continuously; no single swapper is harmed, which is why it looks victimless.
        why: Harm is looked for in individual transactions rather than in the pool's inventory.
        source: ethereum-org-mev

  - id: mev-sandwich
    title: The sandwich
    oneLine: Buy ahead of a victim's swap to push the price, let them execute worse, then sell behind them — funded entirely by their slippage tolerance.
    statement: >
      A sandwich places a buy immediately before a visible victim swap, moving the pool price
      against them; the victim's swap then executes at the worse price, which pushes the price
      further; the attacker sells immediately after, capturing the difference. The attack is
      profitable exactly up to the victim's minimum-output bound, because beyond that the victim's
      transaction reverts and the whole bundle is worthless. The victim's slippage tolerance is
      therefore not a safety setting but the attacker's profit budget, chosen by the victim,
      usually without being told that is what it is.
    volatility: stable
    edges:
      - { to: mev-searcher, type: requires }
      - { to: slippage-tolerance, type: requires }
      - { to: mev-atomic-arbitrage, type: contrasts }
    sources: [ethereum-org-mev, arxiv-sandwiching-l1-vs-rollups]
    misconceptions:
      - belief: Sandwiching requires a public mempool, so private routing makes you safe.
        reality: It requires the attacker to see the transaction before it executes. A private route removes public visibility and hands the transaction to a builder who can see it perfectly.
        why: The public mempool is the only visibility channel usually named.
        source: ethereum-org-mev

  - id: mev-slippage-is-the-attack-surface
    title: Slippage tolerance is a security parameter
    oneLine: Setting a wide tolerance does not make the trade succeed; it authorises up to that much extraction.
    statement: >
      Because a sandwich is bounded by the victim's minimum-output check, the tolerance is a
      pre-authorisation of loss. A trade that reverts on a tight tolerance has told you something
      true — that current depth cannot fill your size at that price — and widening the tolerance
      does not change the depth, it only makes a bad fill acceptable. The correct response to
      repeated reverts is a smaller size, a different route, or a different execution mechanism,
      not a larger number in a box that wallets present next to gas settings.
    volatility: stable
    edges:
      - { to: mev-sandwich, type: requires }
      - { to: slippage-tolerance, type: requires }
    sources: [uniswap-v2-router02-source, ethereum-org-mev]
    misconceptions:
      - belief: Higher slippage tolerance means your trade is more likely to succeed.
        reality: It means you have pre-authorised a larger sandwich. Success probability is about depth and ordering; tolerance is about how much loss you accept.
        why: Wallets present it as a reliability dial.
        source: ethereum-org-mev

  - id: mev-liquidation
    title: Liquidation MEV
    oneLine: The race to be first after a health-factor breach or an oracle update — the clearest case where MEV is load-bearing rather than parasitic.
    statement: >
      Liquidation MEV is the competition to call a lending protocol's liquidation function the
      instant a position becomes eligible. That competition is what delivers sub-block liquidation
      latency, and the bonus captured by the winner is the fee the protocol deliberately pays for
      its own solvency. Removing the competition would not return the bonus to anyone; it would
      remove the liveness guarantee that the bonus buys. This is the case that breaks any framing
      of MEV as uniformly extractive, and the reason MEV design questions cannot be settled by
      calling extraction bad.
    volatility: stable
    edges:
      - { to: mev-searcher, type: requires }
      - { to: liq-fixed-discount, type: requires }
      - { to: mev-sandwich, type: contrasts }
    sources: [ethereum-org-mev, coindesk-19b-liquidation]
    misconceptions:
      - belief: Liquidation MEV is a bug that better protocol design would remove.
        reality: It is the payment mechanism. The competitive bidding that captures the bonus is what guarantees the liquidation happens quickly; remove the competition and you remove the liveness.
        why: MEV is framed uniformly as extraction.
        source: coindesk-19b-liquidation

  - id: mev-toxic-vs-benign
    title: The axis that actually matters
    oneLine: Not good versus bad, but whether extraction requires a specific user to get a worse outcome or merely captures a public inconsistency.
    statement: >
      A useful taxonomy asks whether the extraction is possible only because an identified user's
      execution was degraded. Sandwiching requires a specific victim to receive less than they
      otherwise would, and cannot exist without one. Atomic arbitrage and backrunning capture a
      discrepancy that existed independently of any user's transaction. The two need different
      remedies: the first is addressed by removing the information or the ordering discretion that
      makes targeting possible, the second by deciding who should receive the value — the LP, the
      protocol, the user whose transaction created the opportunity — since it will be captured by
      someone regardless.
    volatility: stable
    edges:
      - { to: mev-sandwich, type: requires }
      - { to: mev-atomic-arbitrage, type: requires }
      - { to: mev-liquidation, type: requires }
    sources: [ethereum-org-mev]
    misconceptions:
      - belief: MEV should be minimised.
        reality: Some of it is a fee that buys a service the system needs. The design question is which categories to suppress and to whom the rest should be routed, not how to drive the total to zero.
        why: A single number invites minimisation.
        source: ethereum-org-mev

  - id: mev-pbs
    title: Proposer-builder separation
    oneLine: Splitting propose a block from order its transactions, so proposers sell the slot to the highest bidder without needing MEV expertise.
    statement: >
      Under proposer-builder separation, specialised builders assemble full blocks and bid for the
      right to have theirs proposed; the proposer signs the highest bid without seeing the block's
      contents. The effect on validators is genuinely levelling: a solo staker earns close to the
      same MEV-inclusive revenue as a sophisticated operator, because both simply take the top bid.
      The effect on the system is to concentrate the ordering decision in a small number of
      builders, since block-building is a returns-to-scale business. The mechanism as deployed today
      is out-of-protocol middleware rather than a consensus rule.
    volatility: evolving
    edges:
      - { to: mev-definition, type: requires }
      - { to: mev-searcher, type: contrasts }
    sources: [ethereum-org-mev, eip-7732]
    misconceptions:
      - belief: PBS decentralises block production.
        reality: It decentralises proposing and concentrates building. Validator income became fairer and ordering power became more concentrated at the same time.
        why: Separation is heard as distribution.
        source: buildernet-intro
      - belief: MEV-Boost is part of the Ethereum protocol.
        reality: It is out-of-protocol middleware with relays as trusted intermediaries, described even in Ethereum's own documentation as carrying higher trust assumptions. The attempt to enshrine it as EIP-7732 had not shipped as of August 2026.
        why: Very high adoption reads as canonical.
        source: ethereum-org-mev

  - id: mev-builder
    title: Builders
    oneLine: The actual ordering monopolists — exclusive orderflow compounds into better bids, which win more slots, which attract more flow.
    statement: >
      Builders are where ordering discretion actually sits. The business has a self-reinforcing
      structure: a builder receiving orderflow no one else has can construct a more valuable block,
      therefore bid higher, therefore win more slots, therefore attract more exclusive flow. The
      result is persistent concentration, with a very small number of builders producing the large
      majority of Ethereum blocks. Published market-share figures from different measurement
      windows and methodologies disagree materially, so the honest teaching claim is the
      qualitative one — two entities order most of Ethereum — with any specific percentage
      re-measured from a live builder dashboard before it is quoted.
    volatility: hot
    edges:
      - { to: mev-pbs, type: requires }
    sources: [buildernet-intro, ethereum-org-mev]
    misconceptions:
      - belief: The builder market is competitive because entry is permissionless.
        reality: Entry is permissionless and the returns to exclusive orderflow are increasing, so the equilibrium is concentrated. Permissionless entry and concentrated outcomes are entirely compatible.
        why: Permissionless is equated with competitive.
        source: buildernet-intro

  - id: mev-relay-trust
    title: Relay trust
    oneLine: A relay holds the block body until the proposer has signed the header, which is an out-of-protocol trust assumption that enshrined PBS is meant to remove.
    statement: >
      In the deployed MEV-Boost design a relay sits between builders and proposers. It receives full
      blocks from builders, gives the proposer only a header and a bid, and releases the body once
      the proposer has signed. The proposer must trust the relay to release a valid body, and the
      builder must trust it not to leak the contents. Neither assumption is enforced by consensus.
      EIP-7732 proposes to enshrine proposer-builder separation in protocol precisely to eliminate
      this intermediary; it was a headline candidate for the Glamsterdam fork and had not shipped
      as of August 2026.
    volatility: hot
    edges:
      - { to: mev-pbs, type: requires }
      - { to: mev-builder, type: requires }
    sources: [eip-7732, ethereum-org-mev]
    misconceptions:
      - belief: Enshrined PBS is coming in the next fork.
        reality: EIP-7732 is a proposal associated with Glamsterdam, which had not shipped as of August 2026. Treat any specific fork or date claim as something to verify against the current specification status.
        why: Prominent EIPs are assumed to be imminent.
        source: eip-7732

  - id: mev-private-orderflow
    title: Private orderflow
    oneLine: Routing to a builder instead of the public mempool protects the user from public-mempool attacks and entrenches the builders who receive that flow.
    statement: >
      A protected RPC endpoint sends a user's transaction directly to one or more builders rather
      than broadcasting it, so bots watching the public mempool never see it. Public-mempool
      sandwiching is genuinely suppressed by this — measurements report a substantial decline in
      sandwich extraction on Ethereum from 2024 into late 2025, attributed to protected RPC and
      intent routing rather than to any protocol change, though those figures come from a small
      number of interested sources and should be treated as directional. The trade is a shift in
      trust: the receiving builder sees everything, and exclusive flow is exactly what compounds
      builder concentration.
    volatility: evolving
    edges:
      - { to: mev-builder, type: requires }
      - { to: mev-sandwich, type: requires }
      - { to: mev-encrypted-mempool, type: contrasts }
    sources: [ethereum-org-mev, flashbots-mev-share-announcement]
    misconceptions:
      - belief: Use a protected RPC and you are safe from MEV.
        reality: Private routing stops public-mempool sandwiching. It does not stop the receiving builder from being the extractor, and it concentrates orderflow. The honest framing is a trust shift, not an elimination.
        why: The protection is real for the most visible attack, so it is generalised.
        source: flashbots-mev-share-announcement

  - id: mev-orderflow-auction
    title: Orderflow auctions
    oneLine: Sell the right to backrun a user's transaction and refund part of the proceeds to that user, converting extraction into rebate.
    statement: >
      An orderflow auction takes a user's transaction, reveals a controlled amount of information
      about it to searchers, auctions the right to be placed immediately after it, and returns part
      of the winning bid to the user. The user's transaction is never front-run because only
      backrunning is sold. This is a redistribution mechanism rather than a suppression one: the
      MEV in the user's transaction still exists and is still captured, but a share of it flows back
      to the person who created it instead of entirely to the searcher and builder.
    volatility: evolving
    edges:
      - { to: mev-private-orderflow, type: requires }
      - { to: mev-sandwich, type: contrasts }
    sources: [flashbots-mev-share-repo, flashbots-mev-share-announcement]
    misconceptions:
      - belief: An orderflow auction protects a transaction from MEV.
        reality: It sells the backrun and refunds part of the proceeds. The transaction is protected from front-running by construction and monetised for its backrun by design.
        why: Rebate and protection are both described as user benefits.
        source: flashbots-mev-share-repo

  - id: mev-intent
    title: Intents
    oneLine: Sign the outcome you want, not the path — so there is no executable transaction to front-run.
    statement: >
      An intent is a signed statement of a desired outcome and its constraints: at least this much
      of token B for exactly this much of token A, before this time. It is not a transaction, names
      no venue and no route, and the user never publishes an executable path. Somebody else — a
      solver or filler — constructs the actual transaction and is paid for doing so. Because there
      is no specific path to reorder around, the classical sandwich has nothing to target; what
      remains is whether the filler gave the user a good price.
    volatility: evolving
    edges:
      - { to: mev-private-orderflow, type: requires }
      - { to: mev-sandwich, type: contrasts }
    sources: [cow-protocol-intents-docs]
    misconceptions:
      - belief: Intents eliminate MEV.
        reality: They relocate it. The solver captures whatever ordering value exists and competes it back into the quote; if the solver set is small or colluding, the user simply gets a worse quote and never sees why.
        why: MEV-protected is the marketing phrase.
        source: cow-protocol-intents-docs

  - id: mev-solver-competition
    title: Solver competition
    oneLine: The user's protection is the competitiveness of the solver auction, not cryptography.
    statement: >
      Solvers compete, usually in a batch or descending-price auction, to fill outstanding intents,
      and the winner is the one offering the user the best execution. Any ordering value available
      in the fill is therefore competed into the user's price rather than extracted around it — but
      only to the degree that the auction is contested. A concentrated or colluding solver set
      produces a worse quote through exactly the same mechanism, with no observable event. When
      evaluating an intent system, the question is how many solvers bid, how entry works, and
      whether the auction's outcomes are publicly verifiable.
    volatility: evolving
    edges:
      - { to: mev-intent, type: requires }
      - { to: mev-encrypted-mempool, type: contrasts }
    sources: [cow-protocol-intents-docs]
    misconceptions:
      - belief: An intent system is safe because the protocol enforces best execution.
        reality: The protocol enforces the user's stated constraint. Everything better than that constraint depends on solvers bidding against each other.
        why: The constraint is mistaken for a best-execution guarantee.
        source: cow-protocol-intents-docs

  - id: mev-cow
    title: Coincidence of wants and uniform clearing
    oneLine: Two opposing intents in one batch settle against each other with no AMM, no price impact and no ordering value at all.
    statement: >
      A batch auction collects intents over an interval and settles them together at a uniform
      clearing price per token. Two intents on opposite sides of the same pair can be matched
      directly, so that portion of the flow touches no AMM, pays no price impact and no LP fee, and
      creates no arbitrage opportunity. Because every order in the batch clears at the same price,
      the position of an order within the batch is worth nothing, which removes intra-batch ordering
      value entirely rather than redistributing it. It is the one design in this module that
      eliminates a class of MEV rather than moving it.
    volatility: evolving
    edges:
      - { to: mev-solver-competition, type: requires }
      - { to: mev-atomic-arbitrage, type: contrasts }
      - { to: price-impact, type: contrasts }
    sources: [cow-protocol-intents-docs]
    misconceptions:
      - belief: Batch auctions are just slower swaps.
        reality: The uniform clearing price is the mechanism. It makes position within the batch worthless, which is a structural removal of ordering value rather than a latency trade-off.
        why: The visible difference is the delay.
        source: cow-protocol-intents-docs

  - id: mev-encrypted-mempool
    title: Encrypted mempools
    oneLine: Hide transaction contents until ordering is fixed — attacking MEV at the information layer, at the cost of a new liveness and trust assumption.
    statement: >
      Encrypting pending transactions until after ordering is committed removes the information a
      targeted attack needs, using threshold decryption, trusted hardware, or time-delay encryption.
      The trade-off is a new dependency: a decryption committee that must be live and honest, or
      hardware whose attestation must hold. Failure of that component is a liveness failure of the
      chain rather than a degraded user experience. As of 2026 this remains a live design debate
      with organised advocacy rather than a shipped Ethereum protocol feature, and it should be
      taught as a trade-off under discussion.
    volatility: hot
    edges:
      - { to: mev-private-orderflow, type: requires }
      - { to: mev-solver-competition, type: contrasts }
    sources: [encrypted-mempool-org, ethereum-org-mev]
    misconceptions:
      - belief: Encrypted mempools are the coming solution to MEV.
        reality: They are a research and advocacy programme with a real cost — a decryption committee or hardware root of trust whose failure is a chain liveness failure. They are not scheduled protocol features.
        why: A clean cryptographic story reads as inevitable.
        source: encrypted-mempool-org

  - id: mev-tee-block-building
    title: Trusted-execution block building
    oneLine: Many operators run bit-identical builder software inside enclaves, so orderflow can be shared without any operator seeing it.
    statement: >
      BuilderNet's approach is to decentralise building without giving up the value of aggregated
      orderflow. Multiple independent operators run the same builder binary inside trusted execution
      environments; each instance shares the orderflow it receives with the others, which is safe
      only because no operator can read inside the enclave. Blocks are submitted through ordinary
      relays and value is refunded to orderflow providers in proportion to measured contribution.
      The design attacks exclusive-orderflow lock-in rather than MEV itself, and it substitutes a
      hardware trust assumption for an operator trust assumption.
    volatility: hot
    edges:
      - { to: mev-builder, type: requires }
      - { to: mev-encrypted-mempool, type: requires }
    sources: [buildernet-intro, bytenoob-buildernet]
    misconceptions:
      - belief: Running builders in enclaves removes trust.
        reality: It relocates it to the hardware vendor and the attestation chain. That is a genuinely different and arguably better trust assumption, but it is not the absence of one.
        why: Cryptographic and hardware guarantees are treated as equivalent.
        source: buildernet-intro

  - id: mev-oev
    title: Oracle-extractable value as an auction
    oneLine: Auctioning the block position immediately after an oracle update lets a protocol recapture liquidation value that would otherwise go to searchers.
    statement: >
      Because the profitable ordering around an oracle update is simply be next, that position can
      be sold rather than raced for. An OEV auction offers the right to act immediately after the
      update, and routes the proceeds back to the protocol whose bonus created the value, or to the
      borrower being liquidated. The mechanism does not reduce total extraction; it changes the
      recipient from whoever wins the ordering fight to whoever the protocol nominates. Deployment
      scope and revenue-sharing terms of live OEV products vary and were not established here, so
      treat specific percentages as things to verify.
    volatility: hot
    edges:
      - { to: mev-liquidation, type: requires }
      - { to: orac-oev, type: requires }
    sources: [chainlink-svr-docs, ethereum-org-mev, chainlink-data-feeds-docs]
    misconceptions:
      - belief: OEV recapture reduces the cost of liquidation for borrowers.
        reality: It changes who receives the bonus. Whether any of it reaches the borrower depends entirely on the protocol's chosen distribution, which is a governance decision, not a property of the auction.
        why: Recapture implies returning value to the party who lost it.
        source: ethereum-org-mev

  - id: mev-l2-sequencer
    title: MEV on a single-sequencer rollup
    oneLine: The sequencer holds the entire ordering right, so L2 MEV is a policy question rather than an auction.
    statement: >
      On a rollup with one sequencer and no public mempool there is no bidding for position: the
      sequencer decides ordering by whatever policy it adopts — first-come-first-served, a private
      mempool, an internal auction, encrypted ordering. Measurement in early 2026 finds sandwiching
      endemic and profitable on Ethereum layer one but rare and largely unprofitable on rollups
      without a public mempool, which is a real result about that attack. It is not a claim that
      those chains have less MEV: the sequencer holds an unaudited ordering monopoly that is a far
      greater concentration than layer one's builder market.
    volatility: evolving
    edges:
      - { to: mev-definition, type: requires }
      - { to: mev-sandwich, type: requires }
      - { to: sequencer, type: requires }
      - { to: mev-pbs, type: contrasts }
    sources: [arxiv-sandwiching-l1-vs-rollups, ethereum-org-mev]
    misconceptions:
      - belief: L2s have less MEV because they are faster.
        reality: They have less sandwich MEV because a single sequencer without a public mempool removes the information the attack needs. The ordering right did not disappear; it was consolidated into one party.
        why: No sandwiches observed is read as no MEV.
        source: arxiv-sandwiching-l1-vs-rollups
