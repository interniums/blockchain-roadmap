moduleId: defi-oracles
concepts:
  - id: orac-price-feed
    title: The price feed as trust boundary
    oneLine: A chain has no native price of anything, so every DeFi valuation is a number some off-chain process wrote into a contract.
    statement: >
      Consensus determines who owns what, not what anything is worth. Every valuation a protocol
      makes — collateral value, health factor, liquidation eligibility, redemption rate — reads a
      number that an off-chain process placed into a contract. The oracle is therefore the trust
      boundary of the entire protocol, and the protocol's security is bounded above by the cost of
      making that number wrong. Auditing a lending market without auditing where its prices come
      from and who can influence them is auditing the wrong half of the system.
    volatility: stable
    edges:
      - { to: lend-health-factor, type: requires }
      - { to: oracle-manipulation, type: applies }
    sources: [chainlink-data-feeds-docs]
    misconceptions:
      - belief: The price is on chain, therefore it is trustless.
        reality: Being on chain says only that it was written there. Trust is in whoever wrote it and in whatever process decided the value.
        why: On-chain data inherits the credibility of consensus in most people's mental model.
        source: chainlink-data-feeds-docs

  - id: orac-push-model
    title: Push oracles
    oneLine: The operator writes updates on its own schedule and pays the gas; consumers read a storage slot, so reads are cheap and the price is whatever was last written.
    statement: >
      In a push design an off-chain network aggregates prices, agrees a value, and submits it on
      chain on its own schedule, paying the gas. Consumers call a view function such as
      latestRoundData and receive the last written round with its identifier, answer and timestamps.
      Reads are therefore cheap, synchronous and available to any contract with no coordination.
      The corresponding property is that the value's age is entirely outside the consumer's
      control: between updates the contract holds a number that is, by design, no longer the market
      price.
    volatility: stable
    edges:
      - { to: orac-price-feed, type: requires }
      - { to: orac-pull-model, type: contrasts }
    sources: [chainlink-data-feeds-docs]
    misconceptions:
      - belief: Push feeds update every block.
        reality: They update when a trigger fires. A read between triggers returns a stale value, and that is the documented behaviour rather than a malfunction.
        why: A dashboard shows a live-looking price backed by off-chain data, not by the on-chain answer.
        source: chainlink-data-feeds-docs

  - id: orac-deviation-and-heartbeat
    title: Deviation threshold and heartbeat
    oneLine: A push feed updates on two triggers only — the price moved past a threshold, or the maximum interval elapsed.
    statement: >
      A push feed writes a new round when the aggregated price differs from the last on-chain answer
      by more than a configured deviation threshold, or when the heartbeat interval since the last
      update elapses, whichever comes first. Both parameters are per-feed and per-chain, and a
      heartbeat can be hours long on feeds whose consumers do not need freshness. The window
      between triggers is therefore a knowable, published quantity within which the on-chain answer
      is legitimately wrong, and a protocol's tolerance for being wrong must be at least that wide
      or it must not use that feed.
    volatility: stable
    edges:
      - { to: orac-push-model, type: requires }
    sources: [chainlink-data-feeds-docs]
    misconceptions:
      - belief: A feed with a one-hour heartbeat updates hourly.
        reality: The heartbeat is a maximum interval, not a cadence. A volatile feed may update many times a minute on deviation and never reach its heartbeat.
        why: Heartbeat sounds like a periodic tick.
        source: chainlink-data-feeds-docs

  - id: orac-staleness-check
    title: The staleness check
    oneLine: Consuming latestRoundData without checking updatedAt against your own maximum age is the most common oracle integration bug there is.
    statement: >
      A correct consumer reads latestRoundData, compares updatedAt against a maximum age it has
      chosen for its own risk tolerance, and refuses to act if the answer is older. It must also
      handle a non-positive answer, a feed that has been paused or deprecated, and a call that
      reverts. Each of these is documented behaviour rather than an edge case. Skipping the check
      means the protocol will happily liquidate, mint or lend against a price from hours earlier at
      exactly the moment the market has moved, which is the moment an attacker will choose.
    volatility: stable
    edges:
      - { to: orac-deviation-and-heartbeat, type: requires }
      - { to: orac-sanity-bounds, type: recommends }
    sources: [chainlink-data-feeds-docs]
    misconceptions:
      - belief: If the oracle returns a value, the value is usable.
        reality: The struct includes a timestamp precisely because the caller is expected to decide whether it is fresh enough. Returning a value is not an assertion of currency.
        why: Most example code in tutorials returns the answer and ignores the rest of the tuple.
        source: chainlink-data-feeds-docs

  - id: orac-pull-model
    title: Pull oracles
    oneLine: The network signs prices continuously off chain and the consumer submits a signed update in the same transaction that uses it, paying the gas.
    statement: >
      In a pull design the oracle network publishes signed price updates off chain at high frequency
      and does not write them anywhere. A consumer that needs a price attaches the latest signed
      update to its own transaction, the contract verifies it, and the price is then read. Freshness
      becomes a property of the caller's transaction rather than of the feed's schedule, which
      supports latency-sensitive uses such as perpetual futures. The cost moves too: the consumer
      pays the update gas, and the consumer — not the oracle operator — is responsible for the
      update actually being attached.
    volatility: evolving
    edges:
      - { to: orac-price-feed, type: requires }
      - { to: orac-push-model, type: contrasts }
    sources: [pyth-pull-updates-docs, chainlink-data-streams-docs]
    misconceptions:
      - belief: A pull oracle is fresher, therefore safer.
        reality: Pull shifts update liveness onto the caller. If your keeper fails to attach a fresh update, your contract's price is as stale as any push feed — and an attacker chooses when to submit theirs.
        why: A published sub-second cadence is read as a guarantee about your contract's state.
        source: pyth-pull-updates-docs

  - id: orac-pull-verification
    title: Verifying a pull update
    oneLine: The update is trusted because the transaction verifies a signature over feed id, price and publish time against a known validator set — not because a privileged address wrote it.
    statement: >
      A pull update carries an attestation: a signature or aggregate signature over the feed
      identifier, the price, the confidence and the publish timestamp, produced by the oracle
      network's validator set. The on-chain verification contract checks that attestation before the
      value is accepted, so authenticity comes from cryptography rather than from write access. The
      security question therefore changes from who may call the setter to what the validator set is,
      how it is rotated, and what the verification contract accepts as a valid publish time.
    volatility: evolving
    edges:
      - { to: orac-pull-model, type: requires }
      - { to: ecrecover, type: recommends }
    sources: [pyth-pull-updates-docs]
    misconceptions:
      - belief: Because anyone can submit the update, anyone can set the price.
        reality: Submission is permissionless; the content is signed. The submitter chooses which valid update to relay and when, which is a timing power, not a pricing power.
        why: Permissionless writes usually mean permissionless values.
        source: pyth-pull-updates-docs

  - id: orac-confidence-interval
    title: The confidence interval
    oneLine: Pull networks publish a band alongside the price, and ignoring it discards the oracle's own statement about how much it disagrees with itself.
    statement: >
      A pull oracle aggregating many publishers can report not only a central price but a measure of
      dispersion across those publishers. That band widens exactly when venues disagree — during
      dislocations, thin liquidity and crashes — which is precisely when a protocol most needs to
      act conservatively. Using only the midpoint throws away the signal. A defensive consumer can
      instead value collateral at the pessimistic end of the band, refuse to act when the band
      exceeds a threshold, or widen its own buffers in proportion.
    volatility: evolving
    edges:
      - { to: orac-pull-model, type: requires }
    sources: [pyth-best-practices, pyth-pull-updates-docs]
    misconceptions:
      - belief: A wide confidence band means the oracle is broken.
        reality: It means the underlying venues genuinely disagree. The oracle is reporting real market conditions, and a protocol that ignores it is choosing to be precise about a number nobody agrees on.
        why: Uncertainty in a data feed is read as a defect in the feed.
        source: pyth-pull-updates-docs

  - id: orac-spot-price-is-not-an-oracle
    title: Spot price is not an oracle
    oneLine: getReserves or slot0 returns the instantaneous marginal price, which a flash loan can set to almost any value inside one transaction.
    statement: >
      Reading a pool's current reserves or its stored square-root price gives the marginal price at
      this instant. Because a swap changes that value and a flash loan supplies unlimited capital
      within a transaction, an attacker can set it to nearly any value, act on it, and restore it,
      all atomically. This is the origin of most historical oracle exploits and it is not a subtle
      bug: any protocol whose valuation reads a live pool state is a protocol whose valuation is
      chosen by the caller. The defect is not the AMM's — the marginal price is exactly what the
      AMM promises — but the consumer's, for treating a manipulable state variable as a price.
    volatility: stable
    edges:
      - { to: orac-price-feed, type: requires }
      - { to: flash-loan, type: requires }
      - { to: constant-product, type: requires }
      - { to: orac-twap, type: contrasts }
    sources: [uniswap-v2-oracles-docs, chainsecurity-multiblock-mev]
    misconceptions:
      - belief: Using a large, deep pool makes spot price safe.
        reality: Depth changes the cost of moving the price within a transaction but not the fact that it can be moved and restored atomically. Depth is a price, not a barrier.
        why: Manipulation is imagined as requiring capital that must be held.
        source: uniswap-v2-oracles-docs

  - id: orac-twap
    title: Time-weighted average price
    oneLine: Integrating price over a window turns a one-transaction attack into one that must be sustained across blocks.
    statement: >
      A TWAP oracle accumulates price over time — canonically by storing a cumulative price sum that
      any observer can difference between two timestamps — and reports the average over a chosen
      window. Because the reported value is an integral, moving it by a given amount requires
      holding the manipulated price for a corresponding fraction of the window. An attacker must
      therefore survive at least one block boundary during which arbitrageurs can trade against the
      distorted price, converting a free atomic manipulation into one with a real, computable cost.
    volatility: stable
    edges:
      - { to: orac-spot-price-is-not-an-oracle, type: requires }
    sources: [uniswap-v2-oracles-docs, uniswap-v3-pos-oracles]
    misconceptions:
      - belief: A TWAP is safe because it averages out manipulation.
        reality: It converts a cheap instantaneous attack into an expensive sustained one. The cost is finite and computable from pool depth and window length, not infinite.
        why: Average is heard as robust.
        source: chainsecurity-multiblock-mev

  - id: orac-twap-lag
    title: TWAP lag
    oneLine: A TWAP's safety and its staleness are the same parameter — a longer window costs more to attack and is more wrong during a real move.
    statement: >
      Window length is a single dial with two coupled readouts. Lengthening it raises manipulation
      cost proportionally and equally raises how far the reported price trails a genuine move. In a
      real crash a long-window TWAP reports a collateral value the market has already left, so
      positions are not liquidated until far past the point of solvency and the protocol takes bad
      debt. There is no window that is both hard to manipulate and accurate under stress; there is
      only a choice about which failure the protocol prefers, made explicit or made by accident.
    volatility: stable
    edges:
      - { to: orac-twap, type: requires }
      - { to: liq-bad-debt-threshold, type: applies }
    sources: [uniswap-v3-pos-oracles, euler-twap-cost-of-attack, uniswap-v2-oracles-docs]
    misconceptions:
      - belief: Longer TWAP windows are strictly safer.
        reality: They are strictly harder to manipulate and strictly more wrong during genuine moves. Bad debt from lag is a real, observed failure mode, not a theoretical one.
        why: Only the manipulation axis is usually discussed.
        source: euler-twap-cost-of-attack

  - id: orac-manipulation-cost
    title: The cost of manipulation
    oneLine: Not the capital deployed but the attacker's mark-to-market loss — mostly value handed to arbitrageurs and fees paid.
    statement: >
      The right measure of an oracle's security is what an attacker loses, not what they must
      borrow. Moving a pool's price means trading along the curve and paying fees; holding the
      distortion means letting arbitrageurs trade back against you at your expense. The 2026
      analysis of AMM-based oracles formalises manipulation cost as exactly this mark-to-market
      loss, and derives that aggregating several pools with liquidity weights maximises the minimum
      cost of manipulation for weighted medians — meaning equal-weight aggregation across venues of
      different depth is a demonstrably weaker design, because it lets an attacker target the
      thinnest venue.
    volatility: evolving
    edges:
      - { to: orac-twap, type: requires }
      - { to: flash-loan, type: requires }
    claimKind: empirical
    sources: [arxiv-manipulation-cost-2026, euler-twap-cost-of-attack, chainsecurity-multiblock-mev]
    misconceptions:
      - belief: Manipulation cost equals the capital the attacker needs.
        reality: Cost is the attacker's realised loss — fees paid and value handed to arbitrageurs. Flash loans drive required capital to zero while leaving the loss intact, which is why they break spot oracles and not deep TWAPs.
        why: Coverage quotes loan size because it is the largest number in the transaction.
        source: arxiv-manipulation-cost-2026
      - belief: Averaging several sources equally is a good aggregation.
        reality: Liquidity-weighted aggregation maximises the minimum manipulation cost; equal weighting hands the attacker the thinnest venue as the cheapest path.
        why: Equal weighting is the intuitive default for combining sources.
        source: arxiv-manipulation-cost-2026

  - id: orac-multiblock-mev
    title: Multi-block manipulation
    oneLine: A proposer of two consecutive slots can distort and revert a price with no arbitrageur in between, which removes the dominant term of TWAP manipulation cost.
    statement: >
      Under proof of stake the proposer for each slot is a deterministic function of the beacon
      state, so the schedule for the current epoch is computable ahead of those slots and a
      validator can see whether it also proposes the next slot. Consecutive proposal means the
      attacker controls the contents
      of both blocks: it can move the price at the end of one block and restore it at the start of
      the next, with no opportunity for anyone else to arbitrage the distortion. Since the dominant
      term in TWAP manipulation cost is value lost to arbitrageurs, removing them collapses the
      cost toward the fees paid. This is the structural reason a proof-of-work-era safety argument
      for TWAPs does not transfer unchanged to proof of stake.
    volatility: evolving
    edges:
      - { to: orac-manipulation-cost, type: requires }
      - { to: orac-twap, type: contrasts }
    sources: [consensus-specs-phase0-beacon-chain, chainsecurity-multiblock-mev, uniswap-v3-pos-oracles]
    misconceptions:
      - belief: The Merge did not change oracle security because the AMM did not change.
        reality: The AMM did not change; the availability of an uninterrupted two-block window did. Manipulation cost is a property of the surrounding market structure, not only of the pool.
        why: Oracle security is analysed as a property of the price source alone.
        source: chainsecurity-multiblock-mev

  - id: orac-multiblock-is-probabilistic
    title: Multi-block manipulation is a probability
    oneLine: Consecutive-slot chances scale with stake share, so the honest framing is expected cost per attempt, not TWAPs are broken.
    statement: >
      A validator only gets consecutive slots some of the time. Proposer selection samples the
      active set with acceptance probability proportional to effective balance, so the chance scales
      with stake share and multi-block manipulation is an opportunity that arrives probabilistically rather
      than a capability held on demand. The correct security statement is an expected cost weighted
      by the probability of back-to-back proposal, compared against the value secured — and it
      varies enormously by pair depth. Analysis from 2023 found two-block manipulation of the
      deepest pairs still prohibitively expensive; those conclusions rest on the liquidity depths
      and stake distribution of that period and should be recomputed from live pool state rather
      than cited as current figures.
    volatility: hot
    edges:
      - { to: orac-multiblock-mev, type: requires }
    sources: [consensus-specs-phase0-beacon-chain, uniswap-v3-pos-oracles, chainsecurity-multiblock-mev]
    misconceptions:
      - belief: Multi-block MEV means all TWAPs are now free to manipulate.
        reality: It requires proposing consecutive slots, whose probability scales with stake share, and the cost still depends on pool depth. The finding is a probability-weighted expected cost, not a blanket break.
        why: A conditional research result flattens easily into a slogan.
        source: uniswap-v3-pos-oracles

  - id: orac-lp-token-and-rate-oracles
    title: Protocol functions used as oracles
    oneLine: Pricing an LP share or a yield-bearing wrapper by calling its own conversion function makes that function an oracle — and if it can be moved in one transaction, so can the price.
    statement: >
      Valuing an ERC-4626 share by calling convertToAssets, a liquid staking token by its exchange
      rate, or an LP token by a pool's virtual price turns an ordinary protocol function into a
      price source. These functions were written to report internal accounting, not to resist
      adversarial input, and many can be moved by a direct donation, an unpermissioned deposit or a
      state-changing call available to anyone. This is the live 2026 attack surface rather than
      spot-price flash loans: the March 2026 LlamaLend sDOLA incident is reported to have inflated a
      savings-vault exchange rate through an unpermissioned call, and vault share-inflation attacks
      are the same bug class seen from the other side.
    volatility: hot
    edges:
      - { to: orac-spot-price-is-not-an-oracle, type: requires }
      - { to: erc-4626-vault, type: requires }
      - { to: donation-attack, type: applies }
    sources: [eip-4626, gov-curve-sdola-postmortem, arxiv-manipulation-cost-2026]
    misconceptions:
      - belief: A rate that comes from the asset's own contract is authoritative and therefore safe.
        reality: Authoritative means it defines the accounting, not that it resists manipulation. If any caller can move it inside a transaction, it is an attacker-controlled input.
        why: Reading the canonical source feels safer than reading a market.
        source: gov-curve-sdola-postmortem

  - id: orac-sanity-bounds
    title: Sanity bounds
    oneLine: Clamp the answer, cross-check a second independent source, and define in advance what happens on divergence.
    statement: >
      Defensive integration means treating the oracle as untrusted input. Reject non-positive
      answers and answers at or beyond the aggregator's own minimum and maximum, which act as a
      real circuit breaker rather than a formality. Cross-check against an independent second source
      and — this is the part usually skipped — specify the behaviour on disagreement. Taking the
      maximum, the minimum or the mean of two sources each has a distinct and exploitable failure
      mode; the only default that is safe without further analysis is to revert or pause when the
      sources diverge beyond a bound.
    volatility: stable
    edges:
      - { to: orac-staleness-check, type: requires }
    sources: [chainlink-data-feeds-docs, winsorized-uniswap-oracle]
    misconceptions:
      - belief: Using two oracles is strictly safer than one.
        reality: Only if the disagreement policy is defined. Two sources with a max, min or average rule create three new attack targets; two sources with a revert-on-divergence rule create a liveness dependency you must accept deliberately.
        why: Redundancy is assumed to compose.
        source: chainlink-data-feeds-docs

  - id: orac-rate-limit
    title: Rate limiting a feed
    oneLine: Capping how far the price may move per update turns instantaneous manipulation into multi-block manipulation, and guarantees you are wrong during a genuine gap.
    statement: >
      A rate limiter bounds the change the consuming protocol will accept per update or per unit
      time. Against manipulation it is real: an attacker must now hold the distortion across
      multiple accepted updates, which multiplies the cost and buys human or governance response
      time. Against the market it is a liability: in a genuine gap move the protocol's price is
      capped below reality, positions are not liquidated when they should be, and bad debt accrues
      from the opposite direction. Rate limiting converts one failure mode into another and buys
      response time; it does not buy correctness.
    volatility: stable
    edges:
      - { to: orac-sanity-bounds, type: requires }
      - { to: orac-twap-lag, type: contrasts }
    sources: [aave-price-cap-adapters, arxiv-manipulation-cost-2026]
    misconceptions:
      - belief: Rate-limiting the oracle prevents manipulation losses.
        reality: It converts them. You are guaranteed to be wrong during a genuine gap move, which produces bad debt from the other side. It buys time, not accuracy.
        why: Circuit breakers are framed as pure downside protection.
        source: arxiv-manipulation-cost-2026

  - id: orac-oev
    title: Oracle-extractable value
    oneLine: Whoever lands the transaction immediately after a price update captures the liquidation bonus, so the oracle's write is an auctionable right.
    statement: >
      A price update is the event that makes positions liquidatable, so the block position directly
      after it is worth the liquidation bonuses it unlocks. That value is created by the oracle's
      write and captured by whoever wins the ordering race, which means the protocol pays a bonus it
      did not have to compete for and receives nothing back. Recognising this reframes the oracle
      update as an auctionable right: mechanisms that auction the position after the update can
      route part of that value back to the protocol or to the liquidated borrower instead of to
      searchers. This is the direct bridge from oracle design to block-ordering markets.
    volatility: hot
    edges:
      - { to: orac-push-model, type: requires }
      - { to: liq-fixed-discount, type: requires }
      - { to: mev-searcher, type: recommends }
    sources: [chainlink-svr-docs, chainlink-data-feeds-docs, ethereum-org-mev]
    misconceptions:
      - belief: Oracle extractable value is a subtype of front-running the user.
        reality: There is no user transaction to front-run. The value exists because the oracle's own write changes the state, so it is the protocol's value being given away rather than a trader's.
        why: All ordering value is filed under front-running.
        source: ethereum-org-mev
