moduleId: defi-stablecoins
concepts:
  - id: stable-peg-is-not-a-property
    title: A peg is an outcome, not a property
    oneLine: No contract can set a market price; a peg is what arbitrageurs produce when a deviation creates a profitable trade.
    statement: >
      A stablecoin's price is set by whoever is willing to buy and sell it, exactly like any other
      asset. What the design contributes is a right — to redeem, or to mint — that becomes
      profitable to exercise when the market price deviates, so that exercising it pushes the price
      back. Every question about a peg therefore reduces to three: what trade does a deviation
      create, who is permitted to make that trade, and what does it cost them in fees, capital and
      time. A design whose arbitrage is gated, expensive or slow will hold its peg loosely no
      matter what its documentation asserts.
    volatility: stable
    edges:
      - { to: constant-product, type: requires }
      - { to: price-impact, type: requires }
    sources: [curve-crvusd-overview]
    misconceptions:
      - belief: A stablecoin's smart contract enforces the one-dollar price.
        reality: No contract can set a market price. The contract creates a redemption or mint right; arbitrageurs create the price.
        why: The word pegged sounds like a hard constraint rather than an equilibrium.
        source: curve-crvusd-overview

  - id: stable-redemption-right
    title: The redemption right
    oneLine: The strength of a peg equals the strength of the redemption right — who may redeem, at what size, at what fee, how fast, and whether the issuer can refuse.
    statement: >
      The arbitrage that defends a peg is only as strong as the right that enables it. Five
      properties determine that strength: eligibility (anyone, or a whitelist of institutional
      counterparties), minimum and maximum size, the fee charged, the settlement latency, and
      whether the issuer may pause or refuse. A right restricted to a handful of whitelisted
      redeemers with T plus one settlement defends the peg only through those parties' willingness
      to warehouse risk. A right that can be suspended at the issuer's discretion is not a floor
      under the price at all, and its absence is invisible on a price chart until it matters.
    volatility: stable
    edges:
      - { to: stable-peg-is-not-a-property, type: requires }
    sources: [curve-crvusd-overview, genius-act]
    misconceptions:
      - belief: Redemption at one dollar means you can redeem at one dollar.
        reality: It means someone can. If the right is whitelisted, size-gated or suspendable, retail holders have a price, not a redemption.
        why: The redemption mechanism is described without its eligibility terms.
        source: genius-act

  - id: stable-secondary-market-peg
    title: The secondary-market peg
    oneLine: Almost nobody redeems; they sell on a venue, so the visible price can deviate from redemption value by exactly the cost and latency of arbitrage.
    statement: >
      The price you see is a secondary-market price produced by holders exiting into other assets,
      not by redemption. It tracks redemption value only to the extent that arbitrageurs can move
      between the two, so it deviates by the fee, the capital cost and the latency of that round
      trip. When redemption is gated or suspended, the link is severed entirely and the secondary
      price becomes the market's estimate of eventual recovery value — which is why a token can
      trade very near one dollar right up until the moment withdrawals are frozen, and then not.
    volatility: stable
    edges:
      - { to: stable-redemption-right, type: requires }
      - { to: price-impact, type: requires }
    sources: [blockeden-stream-contagion, pharos-stream-elixir, curve-crvusd-overview]
    misconceptions:
      - belief: A token trading at one dollar on a venue is at peg.
        reality: It is at secondary-market peg. If redemption is gated or suspended, that price is a market guess at recovery value, and it can be revised in minutes.
        why: The price chart is the only continuously visible signal.
        source: blockeden-stream-contagion

  - id: stable-fiat-backed
    title: Fiat-backed stablecoins
    oneLine: An IOU on off-chain reserves, so the risk is custody, banking and legal rather than mechanism — and the contract usually has a freeze function.
    statement: >
      A fiat-backed stablecoin is a claim on assets an issuer holds off chain. The on-chain
      mechanism is trivial: mint on receipt, burn on redemption. Consequently there is essentially
      no mechanism risk to analyse and a great deal of institutional risk — where the reserves sit,
      who holds them, which jurisdiction, which bank, what happens over a weekend. The contract
      typically also carries blacklist or freeze powers, which is a real property of the asset: a
      balance can be rendered unusable by the issuer, which no amount of self-custody prevents.
    volatility: stable
    edges:
      - { to: stable-redemption-right, type: requires }
      - { to: stable-cdp, type: contrasts }
    sources: [genius-act]
    misconceptions:
      - belief: A fiat-backed stablecoin is the trustless option because the mechanism cannot fail.
        reality: The mechanism cannot fail because there barely is one. Everything that can fail is off chain, unobservable from chain data, and includes a freeze function pointed at your balance.
        why: Simplicity of the contract is read as absence of risk.
        source: genius-act

  - id: stable-reserve-composition
    title: Reserve composition
    oneLine: For a fiat-backed coin the quality and location of the reserve is the whole story — treasury bills and uninsured bank deposits do not behave the same.
    statement: >
      The reserve is not one asset class. Short-dated government bills and overnight repurchase
      agreements are liquid, marked continuously and insulated from any one institution. Uninsured
      deposits at a commercial bank are an unsecured claim on that bank, available only when it is
      open and only if it is solvent. The distinction is not academic: the March 2023 depeg of a
      major fiat-backed stablecoin followed from a portion of reserves sitting in uninsured deposits
      at a failing bank while issuance and redemption were, in the issuer's own words, constrained by
      the working hours of the US banking system. The mechanism performed exactly as designed; the
      reserve and the banking calendar did not.
    volatility: stable
    edges:
      - { to: stable-fiat-backed, type: requires }
    sources: [genius-act, fed-svb-stablecoins-note]
    misconceptions:
      - belief: The March 2023 depeg of a major stablecoin revealed a flaw in its design.
        reality: The design worked. A portion of reserves sat in an uninsured deposit at a failing bank and redemption was constrained by US banking hours over a weekend, so the arbitrage that defends the peg was unavailable exactly when it was needed.
        why: People who work on chain look for on-chain causes.
        source: fed-svb-stablecoins-note

  - id: stable-cdp
    title: Collateralised debt position stablecoins
    oneLine: Minted as over-collateralised debt against volatile collateral, so every unit in circulation is somebody's leveraged long.
    statement: >
      A CDP stablecoin is created when a borrower locks volatile collateral and mints stablecoin
      against it as debt, and destroyed when that debt is repaid. Supply is therefore not an issuer
      decision but the aggregate of user leverage demand: when borrowing appetite falls, supply
      contracts whether or not anyone wants it to. The system's solvency reduces to a lending
      problem — collateral factors, liquidation thresholds, oracles, keeper liveness — and every
      failure mode from the lending and liquidation modules applies unchanged, now with the twist
      that the borrowed asset is the one whose price is supposed to be stable.
    volatility: stable
    edges:
      - { to: lend-overcollateralisation, type: requires }
      - { to: stable-peg-is-not-a-property, type: requires }
      - { to: stable-fiat-backed, type: contrasts }
    sources: [curve-crvusd-overview]
    misconceptions:
      - belief: Over-collateralisation makes a stablecoin safe.
        reality: It makes it solvent at current oracle prices. It does not make it liquid, does not make the oracle honest, and does not make liquidation happen.
        why: The collateral ratio is the only number the dashboards show.
        source: curve-crvusd-overview

  - id: stable-psm
    title: The peg stability module
    oneLine: A contract that swaps a whitelisted asset for the stablecoin one-for-one at near-zero fee — pinning the peg hard and importing that asset's risk wholesale.
    statement: >
      A peg stability module lets anyone exchange a specified reserve asset, usually a fiat-backed
      stablecoin, for the protocol's own stablecoin at parity, subject to a fee and a ceiling. The
      arbitrage becomes trivial and near-instant, so the peg tightens to roughly the fee band, which
      is why PSMs are so effective. The cost is a change of category: a CDP stablecoin with a large
      PSM balance is partly a wrapper on the whitelisted asset, and inherits that asset's custody,
      banking, legal and freeze risks in proportion. The peg is now defended by the thing it was
      designed not to depend on.
    volatility: evolving
    edges:
      - { to: stable-cdp, type: requires }
      - { to: stable-fiat-backed, type: requires }
    sources: [dss-psm-source]
    misconceptions:
      - belief: A PSM is a peg mechanism.
        reality: It is a peg mechanism and a balance-sheet decision. Every unit swapped in makes the stablecoin more like the asset it swapped for, including its freeze powers.
        why: The module is presented as stability infrastructure rather than as reserve composition.
        source: dss-psm-source

  - id: stable-monetary-policy
    title: Steering a peg with a rate
    oneLine: Below peg, raise borrow rates to force repayment and burn supply; above peg, cut them to encourage minting.
    statement: >
      A CDP system's supply responds to the cost of borrowing, so the interest rate is a supply
      lever. Trading below peg means there is too much stablecoin relative to demand, so raising the
      stability fee makes holding the debt expensive, borrowers repay, supply burns and the price
      recovers. Trading above peg means the opposite. Curve's crvUSD implements this explicitly: an
      exponential-moving-average price aggregator across several Curve pools feeds a monetary policy
      contract that sets the borrow rate. It is negative feedback, and it is slow — a rate lever
      acts over hours and days, so it stabilises a drift and does nothing about a run.
    volatility: stable
    edges:
      - { to: stable-cdp, type: requires }
      - { to: lend-rate-kink, type: contrasts }
    sources: [curve-crvusd-overview]
    misconceptions:
      - belief: A rate lever can defend a peg during a crisis.
        reality: It works over the timescale on which borrowers respond to costs. Against a same-day run it is the wrong instrument, which is why systems that rely on it also keep a PSM or a reserve.
        why: Monetary-policy analogies imply central banks acting decisively in a crisis.
        source: curve-crvusd-overview

  - id: stable-pegkeeper
    title: PegKeepers
    oneLine: Pre-authorised contracts that mint into a stable pool when it trades above peg and buy back when below, triggered by pool imbalance.
    statement: >
      Curve's PegKeepers automate the arbitrage rather than waiting for someone to perform it. Each
      holds an allocation of crvUSD paired with another stablecoin in a StableSwap pool; when the
      pool shows crvUSD trading above parity the keeper deposits crvUSD into the pool, and when it
      trades below the keeper withdraws and burns. The trigger is pool imbalance, which is why the
      protocol's price signal is an EMA aggregated across several pools rather than a single pool's
      instantaneous state. The mechanism is fast where the rate lever is slow, and it is bounded by
      how much the keeper is authorised to deploy.
    volatility: evolving
    edges:
      - { to: stable-monetary-policy, type: requires }
      - { to: stableswap-invariant, type: requires }
      - { to: stable-psm, type: contrasts }
    sources: [curve-pegkeepers-docs, curve-crvusd-overview]
    misconceptions:
      - belief: An automated peg defender means the peg cannot break.
        reality: The keeper's allocation is finite and its trigger is pool state. It absorbs ordinary imbalance; it is not a bid of unlimited size.
        why: Automation reads as unconditional.
        source: curve-crvusd-overview

  - id: stable-algorithmic
    title: Algorithmic (seigniorage) stablecoins
    oneLine: Each unit is backed by a claim on newly minted governance tokens rather than an asset — which works while that token has value.
    statement: >
      A purely algorithmic design offers redemption not into an asset but into a variable amount of
      its own governance token, minted for the purpose. While the governance token has a market
      capitalisation comfortably larger than the stablecoin supply, the arbitrage functions and the
      peg holds. The backing is therefore a market's valuation of a claim on future protocol value,
      which is reflexively linked to confidence in the stablecoin itself. The design is not
      under-collateralised; it is un-collateralised by construction, and that distinction is the
      whole of its failure mode.
    volatility: stable
    edges:
      - { to: stable-peg-is-not-a-property, type: requires }
      - { to: stable-cdp, type: contrasts }
      - { to: stable-fiat-backed, type: contrasts }
    sources: [terra-classic-protocol-docs, terra-postmortems]
    misconceptions:
      - belief: Terra failed because it was under-collateralised.
        reality: It was un-collateralised by construction. Redemption paid out newly minted governance tokens, so the defence mechanism inflated the very asset that backed the defence.
        why: Under-collateralised is the nearest familiar concept.
        source: terra-postmortems

  - id: stable-death-spiral
    title: The death spiral
    oneLine: Depeg, redeem into governance token, its supply inflates and price falls, backing falls, deeper depeg — a run fuelled by the defence itself.
    statement: >
      The algorithmic failure mode is a positive feedback loop. A depeg makes redemption profitable;
      redemption mints governance tokens and sells them; the increased supply and selling pressure
      drop the governance token's price; the lower price means each redemption mints more tokens
      for the same claim; the backing per unit falls, deepening the depeg. Each turn of the loop
      strengthens the next. Unlike a CDP's rate lever, which is negative feedback, this is positive
      feedback with no bounded state, which is why the collapse is measured in days rather than
      quarters and why partial defences do not arrest it.
    volatility: stable
    edges:
      - { to: stable-algorithmic, type: requires }
      - { to: stable-monetary-policy, type: contrasts }
      - { to: liq-cascade, type: deepens }
    sources: [terra-classic-protocol-docs, arxiv-terra-luna-anatomy, terra-postmortems]
    misconceptions:
      - belief: A larger treasury or reserve would have saved an algorithmic design.
        reality: A reserve changes the category. Adding one converts the design into a partially collateralised one; it does not fix the reflexive loop that operates on the uncollateralised remainder.
        why: Reserves are treated as a quantity rather than as a structural change.
        source: terra-postmortems

  - id: perp-funding-rate
    title: The perpetual funding rate
    oneLine: A periodic payment between longs and shorts that keeps a perpetual future's price anchored to spot — and the yield a short position earns when longs dominate.
    statement: >
      A perpetual future has no expiry, so it is anchored to spot by a funding payment exchanged
      periodically between the two sides: when the perpetual trades above spot, longs pay shorts,
      and when below, shorts pay longs. The rate is set by the size of the basis and by venue
      parameters, not by any protocol. For anyone holding a short perpetual against spot, funding
      is therefore the return of the position — positive in the persistent long-biased regime that
      has dominated crypto, and negative whenever the market flips, with no floor on how long a
      negative regime lasts.
    volatility: stable
    edges:
      - { to: orac-price-feed, type: requires }
    sources: [hyperliquid-funding-docs, ethena-docs]
    misconceptions:
      - belief: Funding is a fee charged by the exchange.
        reality: It is a transfer between traders. The venue sets the formula and takes no side, which is why the rate can be strongly negative for extended periods and nobody is obliged to make it positive again.
        why: Anything periodic and automatic on a venue is assumed to be a venue fee.
        source: hyperliquid-funding-docs

  - id: stable-synthetic-delta-neutral
    title: Delta-neutral synthetic dollars
    oneLine: Spot crypto plus an equal short perpetual, so the dollar value is hedged and the yield is the funding rate — the backing is a trade, not a reserve.
    statement: >
      A delta-neutral synthetic dollar holds a crypto asset and an offsetting short perpetual of the
      same notional, so a move in the asset's price is cancelled by an equal and opposite move in
      the hedge and the combined position is worth approximately a constant number of dollars. The
      yield is the funding rate collected on the short, plus any staking yield on the spot leg. The
      backing is real, marked and hedged — it is not seigniorage — but it is a live position on
      venues, not an asset in custody, and that distinction determines the entire risk checklist.
    volatility: evolving
    edges:
      - { to: perp-funding-rate, type: requires }
      - { to: stable-peg-is-not-a-property, type: requires }
      - { to: stable-algorithmic, type: contrasts }
      - { to: stable-fiat-backed, type: contrasts }
    sources: [ethena-how-usde-works, ethena-docs, forbes-ethena-genius]
    misconceptions:
      - belief: A synthetic dollar is algorithmic and will fail the way Terra did.
        reality: It holds real spot collateral with an offsetting short. Its risks are venue and custody risk, sustained negative funding, and forced deleveraging — a completely different checklist from reflexive seigniorage.
        why: Synthetic dollar pattern-matches to algorithmic.
        source: forbes-ethena-genius

  - id: stable-synthetic-risks
    title: What breaks a delta-neutral dollar
    oneLine: Venue and custody risk, sustained negative funding, and forced deleveraging during a cascade — none of which resemble collateral risk.
    statement: >
      The hedge lives on trading venues, so the backing depends on those venues remaining solvent,
      remaining accessible, and honouring the position. Funding can stay negative for long stretches,
      which turns the yield into a cost that erodes the reserve. And during a violent deleveraging
      the short leg can be reduced against the holder's will by the venue's own risk system, at
      which point the position is no longer hedged in exactly the conditions that made hedging
      matter. None of these appear in a collateral ratio, which is why applying a CDP risk checklist
      to a synthetic dollar produces a clean bill of health for the wrong system.
    volatility: evolving
    edges:
      - { to: stable-synthetic-delta-neutral, type: requires }
      - { to: liq-cascade-cross-venue, type: requires }
      - { to: stable-cdp, type: contrasts }
    sources: [ethena-risks-docs, ethena-docs, forbes-ethena-genius]
    misconceptions:
      - belief: Delta-neutral means market-neutral in all conditions.
        reality: It means neutral to price while the hedge is intact. Venue insolvency, withdrawal suspension or forced deleveraging each break the hedge, and each is most likely during a crash.
        why: The neutrality is stated as a property of the strategy rather than of the venue relationship.
        source: forbes-ethena-genius

  - id: stable-yield-bearing-is-not-a-stablecoin
    title: Yield-bearing fund shares wearing a dollar's name
    oneLine: Tokens whose price is a self-reported net asset value are fund shares, so a manager loss is a permanent write-down and not a depeg.
    statement: >
      A fourth category sits outside the usual taxonomy: tokens that quote a dollar value derived
      from a net asset value the issuer computes, backed by a discretionary trading strategy rather
      than by a verifiable reserve or an on-chain position. Their price is an accounting output, not
      an arbitrage equilibrium, so a loss in the strategy is a permanent write-down of the claim
      rather than a temporary market dislocation that arbitrage will close. The diligence question
      is not what is the collateral ratio but where does the yield come from and can I verify the
      backing on chain — and if the answer is a report rather than a query, it is a fund share.
    volatility: evolving
    edges:
      - { to: stable-synthetic-delta-neutral, type: requires }
      - { to: stable-peg-is-not-a-property, type: contrasts }
      - { to: stable-secondary-market-peg, type: requires }
    claimKind: empirical
    sources: [blockeden-stream-contagion, pharos-stream-elixir]
    misconceptions:
      - belief: Stablecoins are either fiat-backed, crypto-backed or algorithmic.
        reality: The 2025 failures came from a category the three-way taxonomy has no slot for — opaque yield-bearing fund shares marketed as dollars. Learners taught the three-way split cannot classify the actual failures.
        why: The taxonomy predates the products.
        source: pharos-stream-elixir
      - belief: Yield on a dollar comes from lending it out.
        reality: In the reported 2025 cases it came from off-chain discretionary trading with no on-chain proof of reserves. Where the yield comes from, and whether you can verify it on chain, is the whole diligence question.
        why: DeFi-native yield intuition transfers badly to opaque funds.
        source: blockeden-stream-contagion

  - id: stable-collateral-contagion
    title: Collateral contagion
    oneLine: When lending markets list a yield-bearing pseudo-dollar as collateral, its write-down becomes instant bad debt everywhere it was listed.
    statement: >
      Listing an asset as collateral makes every lending market that listed it a creditor of whatever
      backs it. A net asset value write-down has no liquidation price — there is no level at which
      selling the collateral repays the debt — so the loss lands immediately as bad debt in every
      market simultaneously. The November 2025 Stream Finance and Elixir episode is the reported
      case: analyses describe a fund's losses and a withdrawal freeze propagating through a token
      that had been accepted as collateral across several lending protocols, with one researcher's
      reconstruction putting the interconnected debt at roughly two hundred and eighty-five million
      dollars — a constructed figure that should be attributed rather than stated as measured. The
      structural lesson is that isolated markets did not isolate, because they shared the listing.
    volatility: evolving
    edges:
      - { to: stable-yield-bearing-is-not-a-stablecoin, type: requires }
      - { to: lend-isolated-vs-pooled, type: requires }
      - { to: lend-bad-debt, type: requires }
    sources: [pharos-stream-elixir, blockeden-stream-contagion, morpho-security-considerations]
    misconceptions:
      - belief: Isolated lending markets contained the 2025 stablecoin contagion.
        reality: They contained the accounting within each market and did nothing about the shared cause, because several protocols had independently listed the same asset. Isolation is per market, not per risk.
        why: Isolated is read as independent.
        source: pharos-stream-elixir

  - id: stable-depeg-asymmetry
    title: Depegs are asymmetric
    oneLine: Below peg is a solvency signal that triggers a run; above peg is usually a mint-capacity signal — and the two need opposite responses.
    statement: >
      A stablecoin trading below its peg is holders paying to exit, which is what a solvency
      question looks like in a price. A stablecoin trading above its peg is buyers unable to mint
      fast enough, which is a capacity or access problem. The skill worth having is telling in real
      time whether a given deviation is a liquidity gap that arbitrage will close or a solvency gap
      that arbitrage will accelerate — because in the second case the arbitrage is precisely the
      mechanism that drains the remaining reserves to whoever is fastest, and the holders who wait
      for the price to recover are the ones who fund it.
    volatility: stable
    edges:
      - { to: stable-secondary-market-peg, type: requires }
      - { to: lend-bad-debt-is-a-bank-run, type: deepens }
    sources: [pharos-stream-elixir, curve-crvusd-overview]
    misconceptions:
      - belief: A depeg is a temporary dislocation that arbitrage will close.
        reality: Only if it is a liquidity gap. If it is a solvency gap, arbitrage is the mechanism that drains what is left to the fastest actors, and waiting is the losing move.
        why: Arbitrage closes the gap is taught unconditionally.
        source: pharos-stream-elixir

  - id: stable-regulatory-boundary
    title: The regulatory boundary
    oneLine: A compliant payment stablecoin must be fiat-reserve-backed and may not pay yield to holders, which structurally excludes CDP, algorithmic and synthetic designs.
    statement: >
      The United States GENIUS Act, signed in July 2025, defines a category of payment stablecoin
      that must be backed by fiat-denominated reserves and may not pay yield to holders, with
      required rulemakings due roughly a year later. Crypto-collateralised, algorithmic and
      delta-neutral synthetic designs have no route into that category, which means the boundary is
      structural rather than a compliance burden that can be met with disclosures. The observed
      response is a split product line: issuers ship one token designed for the regulated category
      and a separate one that keeps the yield-bearing mechanism, with the two sharing a brand and
      almost nothing else.
    volatility: hot
    edges:
      - { to: stable-fiat-backed, type: requires }
      - { to: stable-synthetic-delta-neutral, type: requires }
      - { to: stable-cdp, type: contrasts }
    sources: [genius-act, forbes-ethena-genius]
    misconceptions:
      - belief: Regulation will eventually accommodate decentralised stablecoin designs.
        reality: The statutory definition of a payment stablecoin excludes them by its reserve and yield requirements. Accommodation would require a different category, not an interpretation of this one.
        why: Regulatory frameworks are assumed to be adjustable at the margins.
        source: genius-act
      - belief: The GENIUS Act rules are in force.
        reality: The Act was signed in July 2025 with rulemakings due roughly July 2026. Whether those rulemakings completed on schedule is a separate fact that must be checked rather than assumed.
        why: Signing and implementation are conflated.
        source: genius-act
