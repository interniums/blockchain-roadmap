moduleId: evm-accounts
concepts:
  - id: account
    title: Account
    oneLine: One entry in Ethereum's global address-to-record map, holding nonce, balance, storage root and code hash.
    statement: >
      Ethereum's world state is a single map from 20-byte address to an account record, and an
      account is one entry in that map. Every account — however it is controlled — holds exactly
      four fields: a nonce, a balance in wei, the root of its own storage trie, and the hash of
      its code. Nothing else about an account exists at the protocol level: there is no type tag,
      no owner field, and no creation timestamp. An address with no entry in the map is
      indistinguishable from an entry whose four fields all hold their zero values.
    volatility: stable
    edges:
      - { to: key-value-state, type: requires }
      - { to: account-four-fields, type: deepens }
      - { to: utxo-model, type: contrasts }
    sources: [execution-specs]
    misconceptions:
      - belief: An account is created when someone "opens" it, like a bank account.
        reality: An address exists as an all-zero record whether or not anyone has ever touched it; the entry appears in the trie only once something is written to it.
        why: The word "account" imports banking assumptions that the data structure does not have.
        source: execution-specs

  - id: eoa
    title: Externally owned account
    oneLine: An account whose authority to act comes from a secp256k1 private key rather than from deployed code.
    statement: >
      An externally owned account is one whose transactions are authorised by a signature from
      the secp256k1 private key whose public key hashes to that address. It is the only kind of
      account that can originate a transaction, because a transaction must carry a signature that
      recovers to its sender. Historically an EOA was also *defined* by having no code, and that
      second definition no longer holds: since EIP-7702 an EOA may carry a delegation designator
      in its code field and still be key-controlled. Key control and code presence are now two
      independent properties of the same record.
    volatility: evolving
    edges:
      - { to: account, type: requires }
      - { to: ecrecover, type: requires }
      - { to: contract-account, type: contrasts }
    sources: [eip-7702, nethermind-7702-attack-surfaces]
    misconceptions:
      - belief: An EOA is an account with no code.
        reality: That was true before Pectra. A delegated EOA has 23 bytes of code and is still controlled entirely by its key.
        why: Every pre-2025 explainer defines the two account kinds by code length.
        source: eip-7702

  - id: contract-account
    title: Contract account
    oneLine: An account whose behaviour when called is defined by code deployed to it, with no key that can sign for it.
    statement: >
      A contract account is one created by a CREATE-family instruction, whose code field holds
      deployed runtime bytecode and for which no private key exists. It cannot originate a
      transaction; it only ever acts because something called it. Its record has the same four
      fields as any other account, so "contract" is not a type in the state — it is a description
      of how that particular account came to hold code and of the fact that nobody can sign for
      it.
    volatility: stable
    edges:
      - { to: account, type: requires }
      - { to: eoa, type: contrasts }
      - { to: initcode-vs-runtime-code, type: deepens }
    sources: [execution-specs]
    misconceptions:
      - belief: A contract account is a different record type from an EOA.
        reality: Both are the same four-field record; the difference is who or what can cause it to act.
        why: Documentation habitually presents them as two boxes side by side.
        source: execution-specs

  - id: delegation-designator
    title: Delegation designator
    oneLine: The 23-byte value 0xef0100 followed by an address, written into an account's code slot to point the EVM at that address's code.
    statement: >
      A delegation designator is the exact 23-byte sequence `0xef0100 ‖ address` stored in an
      account's code field. When any CALL, CALLCODE, STATICCALL or DELEGATECALL targets an account
      whose code is a designator, the EVM loads the code at the designated address and executes it
      in the *designating account's* context: that account's storage, that account's balance, that
      account's address as `address(this)`. The designator is ordinary account code as far as the
      state trie is concerned, which is why the code hash changes when one is installed. The
      `0xef` prefix was reserved by EIP-3541, which forbids ordinary deployed code from starting
      with that byte — this is what makes a designator unambiguous.
    volatility: evolving
    edges:
      - { to: eoa, type: requires }
      - { to: eoa-vs-contract-binary, type: supersedes }
      - { to: delegatecall-is-the-proxy-primitive, type: deepens }
      - { to: "7702-vs-4337", type: applies }
    sources: [eip-7702, eip-3541, oz-eoa-delegation]
    misconceptions:
      - belief: A delegated account stores a copy of the delegate's code.
        reality: It stores 23 bytes that name the delegate. Change the code at the delegate address and the delegated account's behaviour changes with it.
        why: '"Setting code on an EOA" sounds like copying code in.'
        source: eip-7702

  - id: set-code-transaction
    title: Set-code transaction (type 0x04)
    oneLine: The EIP-7702 transaction type that carries an authorization list and installs delegation designators before execution begins.
    statement: >
      Transaction type `0x04` extends the EIP-1559 transaction with an `authorization_list`. Each
      entry in that list is processed before the transaction's call executes: the authority is
      recovered from the signature, its nonce is checked and then incremented, and its code field
      is set to the corresponding delegation designator. The list must be non-empty, and each
      entry carries a fixed base gas cost per authorization on top of the transaction's other
      costs. Because authorizations are applied first, the transaction's own call can already
      execute against the freshly delegated account — which is what makes a self-sponsored
      "delegate and immediately use it" transaction work in one shot.
    volatility: evolving
    edges:
      - { to: delegation-designator, type: requires }
      - { to: tx-type-4-setcode, type: deepens }
    sources: [eip-7702]
    misconceptions:
      - belief: You need a separate transaction to install a delegation and then another to use it.
        reality: Authorizations are applied before the transaction's call, so one type-0x04 transaction can delegate and then exercise the delegate.
        why: Two-phase setup is the norm for approvals and permits.
        source: eip-7702

  - id: authorization-tuple
    title: Authorization tuple
    oneLine: The signed (chain_id, address, nonce) triple that authorises one delegation — signed by the account, submittable by anyone.
    statement: >
      An authorization is the tuple `[chain_id, address, nonce, y_parity, r, s]`. The authority is
      recovered as `ecrecover(keccak256(MAGIC ‖ rlp([chain_id, address, nonce])), y_parity, r, s)`
      with `MAGIC = 0x05`, and `s` must be in the lower half of the curve order as required by
      EIP-2. The signature commits to *what* is being delegated to and *when*, but not to who pays:
      any party may include a valid authorization in their own transaction. The MAGIC prefix
      exists so an authorization signature can never be replayed as a transaction signature, and
      vice versa.
    volatility: evolving
    edges:
      - { to: set-code-transaction, type: requires }
      - { to: ecrecover, type: requires }
      - { to: signature-malleability, type: deepens }
    sources: [eip-7702]
    misconceptions:
      - belief: The account that signs the authorization is the account that pays for it.
        reality: Signer and payer are separate. A relayer or dapp can include your authorization in their transaction and pay the gas.
        why: On Ethereum the signer usually is the payer, so the two roles are habitually conflated.
        source: eip-7702

  - id: chain-id-scoping
    title: Chain-id scoping of an authorization
    oneLine: chain_id pins an authorization to one chain; chain_id = 0 authorises it on every chain at once.
    statement: >
      An authorization's `chain_id` must be either the current chain's id or zero. A specific id
      confines the authorization to that chain. Zero is a deliberate wildcard: the same signed
      tuple is valid on every EVM chain, which is how a user delegates one address to the same
      wallet implementation everywhere with a single signature. The risk is that the code living
      at the delegate address may differ per chain unless it was deployed deterministically, so a
      zero-chain-id authorization is a commitment to whatever code happens to sit at that address
      on chains you have never used.
    volatility: evolving
    edges:
      - { to: authorization-tuple, type: requires }
      - { to: eip-155-chain-id-replay, type: contrasts }
      - { to: create2-address, type: recommends }
    sources: [eip-7702]
    misconceptions:
      - belief: An authorization only applies on the chain I signed it on.
        reality: Only if you set chain_id. Signing with chain_id = 0 authorises the delegation on every chain.
        why: EIP-155 trained everyone to expect chain binding by default.
        source: eip-7702

  - id: sponsored-relay-griefing
    title: Sponsored-relay griefing
    oneLine: A relayer paying to install someone else's authorization can be made to burn gas for nothing before the transaction lands.
    statement: >
      Because anyone may submit another party's authorization, a relayer can be induced to pay for
      one and then be denied the effect. The authority can invalidate the authorization by
      consuming the nonce it commits to, or can drain the balance the relayer expected to be
      compensated from, in the window between the relayer broadcasting and the transaction being
      included. The authorization itself still costs gas to process even when it turns out to be
      stale. EIP-7702 names this in its security considerations and recommends that clients bound
      the number of pending transactions they keep per delegated account.
    volatility: evolving
    edges:
      - { to: authorization-tuple, type: requires }
      - { to: mempool-is-not-a-queue, type: requires }
      - { to: nonce-ordering, type: recommends }
    sources: [eip-7702, nethermind-7702-attack-surfaces]
    misconceptions:
      - belief: Sponsoring a delegation is safe because the signature is valid.
        reality: A valid signature does not guarantee the state it depends on still holds at inclusion time.
        why: Signature validity feels like the whole check.
        source: nethermind-7702-attack-surfaces

  - id: delegate-is-total-control
    title: A delegate has total control
    oneLine: The delegate's code executes as your account, so choosing one is closer to handing over the key than to granting an allowance.
    statement: >
      Code reached through a delegation designator runs with the delegating account as
      `address(this)`, spends that account's balance, and reads and writes that account's storage.
      There is no scope, no expiry and no per-asset limit at the protocol level: any restriction
      exists only because the delegate's own code chose to impose it. A malicious or merely buggy
      delegate can therefore move every asset the account holds and every allowance it has granted.
      Selecting a delegate is a trust decision of the same order as sharing the private key, and
      the correct mitigation is to delegate only to audited wallet infrastructure, not to
      application-controlled code.
    volatility: evolving
    edges:
      - { to: delegation-designator, type: requires }
      - { to: access-control-is-top-loss, type: applies }
      - { to: erc-7710-delegation-manager, type: contrasts }
    sources: [eip-7702, oz-eoa-delegation, nethermind-7702-attack-surfaces]
    misconceptions:
      - belief: Delegation is like a token approval — bounded, revocable, low-stakes.
        reality: The delegate executes as the account. Approvals bound one token; a delegation bounds nothing.
        why: Both are "signing something that lets a contract act for you".
        source: oz-eoa-delegation

  - id: delegation-clearing
    title: Clearing a delegation
    oneLine: Delegating to the zero address removes the designator, emptying the account's code and restoring the empty-code hash.
    statement: >
      A delegation is revoked by signing a fresh authorization whose `address` field is the zero
      address. Processing it sets the account's code to empty and its code hash back to the hash of
      the empty string, returning the account to an undelegated state. Revocation therefore costs a
      transaction and requires the key: there is no expiry and no third party who can retire a
      delegation for you. Note what clearing does *not* do — the account's storage, which the
      previous delegate may have written, is untouched.
    volatility: evolving
    edges:
      - { to: delegation-designator, type: requires }
      - { to: delegate-storage-collision, type: recommends }
    sources: [eip-7702]
    misconceptions:
      - belief: Clearing a delegation resets the account.
        reality: It clears the code field only. Storage written by the old delegate remains and will be visible to the next one.
        why: '"Revoke" sounds like undo.'
        source: eip-7702

  - id: delegate-storage-collision
    title: Storage survives the delegate
    oneLine: Storage belongs to the delegating account, so switching delegates hands the new code whatever the old code wrote.
    statement: >
      Because delegated code executes in the account's own storage context, the storage written
      under one delegate is still there when the account delegates to a different implementation.
      If the two implementations assign different meanings to the same slot, the new delegate reads
      the old one's data as its own — the same class of failure as an upgradeable proxy whose
      storage layout changed between implementations. Wallet implementations mitigate this with
      namespaced storage layouts derived by hashing, so that independently written implementations
      do not land on the same slots by accident.
    volatility: evolving
    edges:
      - { to: delegation-designator, type: requires }
      - { to: storage-collision, type: applies }
      - { to: erc-7201-namespaced-storage, type: recommends }
    sources: [eip-7702, oz-eoa-delegation]
    misconceptions:
      - belief: Switching delegates gives the new implementation a clean slate.
        reality: It inherits every slot the previous implementation wrote, interpreted under the new layout.
        why: Changing code feels like changing the whole program.
        source: eip-7702

  - id: extcode-vs-code-asymmetry
    title: The outside view and the inside view disagree
    oneLine: EXTCODESIZE on a delegated account reports 23 bytes of designator; CODESIZE during its execution reports the delegate's real code.
    statement: >
      For an account holding a delegation designator, the external code-inspection opcodes —
      EXTCODESIZE, EXTCODECOPY and EXTCODEHASH — observe the designator itself, so size is 23 and
      the copied bytes are `0xef0100 ‖ address`. The self-inspection opcodes CODESIZE and CODECOPY,
      evaluated while the delegated code is running, observe the *delegate's* code. Two observers
      therefore get different answers about the same account, and any logic that compares an
      account's externally observed code against an expected hash will not match what actually
      executes.
    volatility: evolving
    edges:
      - { to: delegation-designator, type: requires }
      - { to: code-length-check-broken, type: deepens }
    sources: [eip-7702]
    misconceptions:
      - belief: EXTCODEHASH of a delegated account identifies the code that will run.
        reality: It hashes the 23-byte designator. Identifying the running code means reading the designator and inspecting the address inside it.
        why: For ordinary contracts the two coincide.
        source: eip-7702

  - id: delegation-not-chained
    title: Delegations are not chained
    oneLine: A call reads the first delegation designator and stops; if the delegate is itself delegated, that second hop is not followed.
    statement: >
      When a call resolves a delegation, the EVM reads one designator and executes the code found
      at the address it names. If that address also holds a designator rather than real code, the
      designator bytes are executed as code rather than resolved again — there is no recursion.
      One practical consequence is that delegating to a precompile address executes as empty code:
      the call succeeds and does nothing. Resolving a delegation on access also charges the normal
      account-access cost for the delegate address, cold or warm.
    volatility: evolving
    edges:
      - { to: delegation-designator, type: requires }
      - { to: cold-vs-warm-access, type: recommends }
    sources: [eip-7702]
    misconceptions:
      - belief: Delegating to another delegated account forwards through the chain.
        reality: Only one hop is resolved. The second designator is treated as code, not as a pointer.
        why: Proxy chains do forward, so delegation looks like it should too.
        source: eip-7702

  - id: eoa-vs-contract-binary
    title: The EOA-versus-contract binary (historical)
    oneLine: The superseded claim that every account is exactly one of two kinds, told apart by whether its code length is zero.
    statement: >
      Before Pectra, Ethereum documentation and a very large body of deployed code asserted that
      every account is either externally owned (no code, key-controlled) or a contract (code, not
      key-controlled), and that `code.length == 0` reliably distinguishes them. EIP-7702 broke both
      halves: an account may hold code and still be key-controlled, and the same address may be
      undelegated, delegated, and re-delegated over its lifetime. The binary is worth learning
      only because it is baked into pre-2025 contracts, audit checklists and mental models that you
      will still meet in review.
    volatility: evolving
    edges:
      - { to: eoa, type: requires }
      - { to: contract-account, type: requires }
    sources: [eip-7702, nethermind-7702-attack-surfaces]
    misconceptions:
      - belief: The binary was always a sound distinction and 7702 is the first exception.
        reality: It was already unsound during construction, when a contract's code length is zero while its constructor runs.
        why: The constructor edge case is rarely taught alongside the binary.
        source: nethermind-7702-attack-surfaces

  - id: code-length-check-broken
    title: The code-length check is broken in both directions
    oneLine: address.code.length == 0 never proved "not a contract" and now fails the other way too, and the pattern is everywhere in pre-2025 code.
    statement: >
      Testing `address.code.length == 0` to conclude "this is a plain user, not a contract" has two
      failure modes. It returned zero for a contract calling out from its own constructor, so it
      never excluded contracts. Since EIP-7702 it also returns non-zero for an ordinary
      key-controlled user who has delegated, so it now excludes people it was meant to include. Any
      guard, airdrop filter, fee discount or bot check built on it must be re-derived from the
      property it was actually trying to protect.
    volatility: evolving
    edges:
      - { to: delegation-designator, type: requires }
      - { to: eoa-vs-contract-binary, type: requires }
      - { to: access-control-failure, type: applies }
    sources: [eip-7702, nethermind-7702-attack-surfaces, tranchess-7702-impact]
    misconceptions:
      - belief: Checking code length is a cheap, reliable way to block contracts.
        reality: It is neither reliable now nor was it before; it is a proxy for a property nobody wrote down.
        why: The check is one line and appears to work in tests written with EOAs.
        source: nethermind-7702-attack-surfaces

  - id: tx-origin-check-broken
    title: msg.sender == tx.origin proves nothing now
    oneLine: A delegated EOA both originates transactions and runs code, so the classic "caller is not a contract" test no longer holds.
    statement: >
      The idiom `require(msg.sender == tx.origin)` was used to mean "the immediate caller is the
      transaction's originator, therefore it is not executing code". EIP-7702 relaxed EIP-3607 so
      that an account whose code is a valid delegation designator may still originate transactions.
      That account is simultaneously `tx.origin` and running arbitrary delegate code, so the
      equality holds while the caller *is* executing code. Protocols that used the idiom for
      flash-loan protection, bot filtering or reentrancy heuristics need a different mechanism.
    volatility: evolving
    edges:
      - { to: delegation-designator, type: requires }
      - { to: code-length-check-broken, type: requires }
      - { to: reentrancy-classic, type: applies }
    sources: [eip-7702, nethermind-7702-attack-surfaces]
    misconceptions:
      - belief: tx.origin checks are only a phishing concern.
        reality: The phishing concern is the classic one; the new one is that the check's positive case is now satisfiable by code.
        why: The well-known tx.origin lesson is about authorisation, not about contract detection.
        source: eip-7702
