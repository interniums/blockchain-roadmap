moduleId: evm-blobs-data-lane
concepts:
  - id: blob
    title: Blob
    oneLine: A fixed-size chunk of 4,096 field elements of 32 bytes each — 128 KiB — carried alongside a transaction rather than inside it.
    statement: >
      A blob is a fixed-size data structure of 4,096 field elements, each 32 bytes, giving 128 KiB
      per blob. Its size is fixed by the specification: there are no partial blobs and no larger
      ones, so a payload smaller than 128 KiB pays for a whole blob and a larger one needs several.
      Blobs travel in a network-level wrapper alongside their transaction rather than inside the
      transaction body, which is why they are not part of what the execution layer stores in the
      block and why they can be dropped later without changing any historical block.
    volatility: evolving
    edges:
      - { to: tx-type-3-blob, type: requires }
      - { to: blob-transaction, type: deepens }
    sources: [eip-4844, eip-4844-site]
    misconceptions:
      - belief: A blob is a variable-size attachment sized to your data.
        reality: It is exactly 128 KiB. Smaller payloads waste the remainder and larger ones need multiple blobs.
        why: Attachments elsewhere are sized to their content.
        source: eip-4844

  - id: blob-not-in-evm
    title: The EVM cannot read blob contents
    oneLine: A contract can see the versioned hash of a blob and nothing else — this is cheap data availability, not cheap storage.
    statement: >
      There is no instruction that reads blob data. The only blob-related thing available to
      execution is the list of versioned hashes attached to the current transaction, readable one at a
      time by index. A contract can therefore commit to a blob, check that a blob it was told about is
      the one attached, and verify a KZG opening via the point-evaluation precompile — but it can
      never read a byte of the blob itself. This is the design's whole point: the network guarantees
      that the data was published, without ever putting it where execution has to keep it.
    volatility: evolving
    edges:
      - { to: blob, type: requires }
      - { to: da-is-not-storage, type: deepens }
      - { to: storage-is-the-expensive-one, type: contrasts }
    sources: [eip-4844, eip-4844-site]
    misconceptions:
      - belief: Blobs are cheap contract storage.
        reality: The EVM cannot read blob data at all, and blobs are pruned. They provide availability, not storage.
        why: '"Cheap data on Ethereum" is heard as "cheap storage".'
        source: eip-4844-site

  - id: versioned-hash
    title: Versioned hash
    oneLine: The 32-byte value a blob transaction actually carries — a version byte followed by a hash of the blob's KZG commitment.
    statement: >
      A blob transaction does not carry the blob's 48-byte KZG commitment into the execution layer;
      it carries a 32-byte versioned hash, formed as a version byte followed by the truncated hash of
      that commitment. The version byte exists so that the commitment scheme can be replaced later
      without changing the 32-byte interface that contracts and the EVM already use. Because it fits
      in one word, a versioned hash can be pushed on the stack, stored in a slot and compared like any
      other value — which is what makes blob commitments usable from a contract at all.
    volatility: evolving
    edges:
      - { to: blob, type: requires }
      - { to: hash-function, type: requires }
      - { to: kzg-commitment, type: requires }
    sources: [eip-4844]
    misconceptions:
      - belief: The contract sees the KZG commitment.
        reality: It sees a 32-byte versioned hash of that commitment; the 48-byte commitment itself lives on the consensus side.
        why: The two are used interchangeably in casual descriptions.
        source: eip-4844

  - id: kzg-commitment
    title: KZG commitment
    oneLine: A polynomial commitment that compresses a degree-4,095 polynomial into a single elliptic-curve point, with constant-size openings at any position.
    statement: >
      A blob's 4,096 field elements are interpreted as the evaluations of a polynomial, and the KZG
      scheme commits to that polynomial as one elliptic-curve point. Two properties make this the
      right tool. Openings are constant-size: proving the polynomial's value at any chosen point costs
      one more group element, regardless of how large the polynomial is. And the commitment is
      homomorphic enough to support the erasure coding that data-availability sampling relies on. The
      cost is a trusted setup, whose ceremony output the whole scheme depends on.
    volatility: stable
    edges:
      - { to: commitment, type: requires }
      - { to: blob, type: requires }
      - { to: hash-commitment, type: contrasts }
      - { to: cell-kzg-proof, type: deepens }
    sources: [eip-4844, eip-4844-site]
    misconceptions:
      - belief: A KZG commitment is just a hash of the data.
        reality: A hash commits to the whole blob and proves nothing about a part without revealing it; KZG supports constant-size proofs about individual positions.
        why: Both are "a short value that commits to a big one".
        source: eip-4844

  - id: blob-pruning
    title: Blobs are pruned
    oneLine: Consensus nodes retain blobs for roughly eighteen days and then drop them — availability is a temporary guarantee, not permanent storage.
    statement: >
      Blob data is retained by consensus-layer nodes for a bounded window of roughly eighteen days
      and is then discarded. The window is chosen to be comfortably longer than any fraud-proof or
      reconstruction period a rollup needs, and no longer. After it, the commitment remains in the
      chain forever while the data does not: anyone who wants the bytes must have kept them or must
      get them from someone who did. Any design that assumes the chain will still hand you the blob
      body months later is wrong.
    volatility: evolving
    edges:
      - { to: blob, type: requires }
      - { to: storage-is-the-expensive-one, type: contrasts }
      - { to: da-is-not-storage, type: applies }
      - { to: blob-storage-is-separate, type: deepens }
    sources: [eip-4844, ethereum-org-peerdas]
    misconceptions:
      - belief: A rollup "posts data to Ethereum" and it stays there.
        reality: Availability is guaranteed for a window long enough to challenge or reconstruct, not forever.
        why: '"Posted to Ethereum" implies permanence.'
        source: ethereum-org-peerdas

  - id: separate-blob-fee-market
    title: Blob gas has its own market
    oneLine: Blob gas is priced independently of execution gas, with its own base fee driven by the header's excess-blob-gas field.
    statement: >
      Blob gas is a distinct resource with its own base fee, its own per-block target and maximum, and
      its own update rule driven by an excess-blob-gas field in the header. It never competes with
      execution gas: a busy blob market does not raise the execution base fee and a busy execution
      market does not raise the blob base fee. The economic point is that rollups can buy data
      capacity at a price set by data demand alone, which is what made rollup costs collapse when
      capacity rose. The blob base fee also has a floor and, unlike execution gas, the two markets can
      diverge sharply.
    volatility: hot
    edges:
      - { to: blob, type: requires }
      - { to: separate-fee-markets, type: requires }
      - { to: blob-gas-market, type: deepens }
      - { to: blob-base-fee-floor, type: deepens }
    sources: [eip-4844, eip-7918]
    misconceptions:
      - belief: Blob gas and execution gas are the same resource in different units.
        reality: They are separate markets with separate base fees and separate capacity targets, updated independently.
        why: Both are called gas and appear in the same transaction.
        source: eip-4844

  - id: data-availability-sampling
    title: Data availability sampling
    oneLine: Check a few random pieces of erasure-coded data; enough successful samples makes withholding statistically impossible to hide.
    statement: >
      Data availability sampling lets a node conclude that data was published without downloading it.
      The data is erasure-coded so that any sufficiently large subset reconstructs the whole, and the
      polynomial commitment lets each sampled piece be verified against the commitment in isolation. A
      node requests a few random pieces; if a publisher is withholding enough of the data to make
      reconstruction impossible, it must withhold a large fraction, and the probability that all of a
      node's random samples land in the available part falls off exponentially with the number of
      samples. The guarantee is probabilistic — strong, and not a proof.
    volatility: evolving
    edges:
      - { to: kzg-commitment, type: requires }
      - { to: das-security-argument, type: deepens }
      - { to: da-does-not-imply-correctness, type: contrasts }
    sources: [eip-7594, ethereum-org-peerdas]
    misconceptions:
      - belief: DAS proves the data is available.
        reality: It gives a strong probabilistic guarantee from a few sampled points, not a proof.
        why: '"Sampling" is heard as a shortcut to certainty rather than as a statistical argument.'
        source: ethereum-org-peerdas
      - belief: If the data is available, the rollup's state is correct.
        reality: Availability says the inputs were published. Correctness is a separate claim proved or challenged by a separate mechanism.
        why: Both are described as "what makes a rollup safe".
        source: eip-7594

  - id: peerdas
    title: PeerDAS
    oneLine: EIP-7594 splits blob data into 128 columns and gives each node custody of a subset, so the network holds everything while no node holds it all.
    statement: >
      PeerDAS, live since Fusaka in December 2025, is Ethereum's production data-availability
      sampling design. Blob data is erasure-coded and split into 128 columns. Each node is assigned
      custody of a subset of columns, which it stores and serves; it obtains assurance about the rest
      by sampling from peers. Distribution happens over gossip, custody assignments are discoverable
      via the node discovery layer, and sampling happens through direct peer requests. The result is
      that the network collectively holds every column while no individual node holds them all.
    volatility: hot
    edges:
      - { to: data-availability-sampling, type: requires }
      - { to: cell-kzg-proof, type: deepens }
    sources: [eip-7594, ethereum-org-peerdas, pandas-das-paper]
    misconceptions:
      - belief: Every node downloads every blob.
        reality: Since PeerDAS each node custodies a subset of the 128 columns and samples the rest.
        why: It was true from Dencun until Fusaka, so material written in that window says so.
        source: eip-7594

  - id: blob-throughput-scaling
    title: Why blob capacity can grow
    oneLine: Column custody divides each node's share of blob data by a constant, which is what made raising blob counts affordable — it lowers the slope, it does not remove it.
    statement: >
      Before PeerDAS, raising the blob count per block raised every node's bandwidth and storage
      burden in direct proportion, so capacity was bounded by the weakest node the network wanted to
      keep. Column custody weakens that coupling but does not break it. NUMBER_OF_COLUMNS is a fixed
      preset constant of 128, so adding blobs adds rows within those 128 columns rather than new
      columns: a node custodying a fixed subset still downloads more as the blob count rises. What
      PeerDAS buys is a constant divisor, which is why capacity could be raised at all — EIP-7594
      names increasing the column count as the next lever, precisely because the current one is fixed.
      Specific per-block targets and maxima change with governance and should be read from the network
      rather than memorised.
    volatility: hot
    edges:
      - { to: peerdas, type: requires }
      - { to: blob-collapsed-l2-margins, type: applies }
      - { to: da-cost-no-longer-dominant, type: applies }
    sources: [consensus-specs-fulu-preset, eip-7594, ethereum-org-peerdas]
    misconceptions:
      - belief: More blobs per block means proportionally more work for every node.
        reality: With column custody, added capacity is spread across the node set rather than duplicated onto each node.
        why: It was exactly true before PeerDAS.
        source: eip-7594
