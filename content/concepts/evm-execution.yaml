moduleId: evm-execution
concepts:
  - id: evm-execution-loop
    title: The execution loop
    oneLine: Fetch the opcode at the program counter, check the stack, charge gas, mutate state, advance — until a halting instruction or an exception.
    statement: >
      EVM execution is an ordinary interpreter loop over a byte array. Each iteration reads the byte
      at the program counter, looks up the instruction, verifies the stack has the operands it needs
      and room for its results, deducts that instruction's gas, performs its effect on stack, memory
      or state, and advances the counter. The loop ends on a halting instruction (STOP, RETURN,
      REVERT, SELFDESTRUCT) or on an exception. There is no compilation step in the specification,
      no scheduler and no runtime; production clients may optimise, but they must produce exactly
      what this loop produces.
    volatility: stable
    edges:
      - { to: state-as-keyvalue, type: requires }
      - { to: execution-specs-repo, type: deepens }
    sources: [execution-specs, yellow-paper]
    misconceptions:
      - belief: The EVM compiles contracts before running them.
        reality: The specification is an interpreter over bytes. Clients may JIT internally, but observable behaviour and gas must match the interpreter exactly.
        why: Every other virtual machine of comparable prominence is JIT-compiled.
        source: execution-specs

  - id: gas-is-a-countdown
    title: Gas is charged before the operation
    oneLine: Gas is deducted before each instruction executes, and hitting zero is not an error the code can catch — it is an immediate exceptional halt.
    statement: >
      The gas counter is decremented before an instruction takes effect, not after. If the remaining
      gas is insufficient, the instruction does not run and the frame halts exceptionally: all its
      state changes are undone and all the gas allotted to it is consumed. Running out of gas is not
      an exception a contract can observe or recover from within the frame that ran out. The only
      way to survive a callee exhausting its gas is to be the caller — which is exactly what the
      63/64 rule guarantees you can be.
    volatility: stable
    edges:
      - { to: evm-execution-loop, type: requires }
      - { to: gas, type: requires }
      - { to: three-failure-modes, type: deepens }
    sources: [execution-specs, yellow-paper]
    misconceptions:
      - belief: You can catch an out-of-gas condition and clean up.
        reality: The frame halts immediately with all state reverted; there is no handler inside it. Only an outer frame can react.
        why: try/catch exists in Solidity and looks general.
        source: execution-specs

  - id: deterministic-single-threaded
    title: Deterministic and single-threaded
    oneLine: One transaction executes alone, in order, with no concurrency, clock, I/O or randomness — because every node must reach byte-identical results.
    statement: >
      Execution has no concurrency, no wall clock, no network access, no filesystem and no source of
      randomness beyond fixed block fields. This is not a limitation that was overlooked; it is the
      requirement. Thousands of independent nodes re-execute the same transaction and must all
      compute the same state root, so every input must come from the block or the transaction. Each
      "environment" opcode — TIMESTAMP, NUMBER, PREVRANDAO, CHAINID, BASEFEE — is a fixed field, and
      each one is a value the block proposer has some influence over.
    volatility: stable
    edges:
      - { to: evm-execution-loop, type: requires }
      - { to: state-root-is-post-execution, type: requires }
      - { to: block-level-access-list, type: contrasts }
    sources: [execution-specs, yellow-paper]
    misconceptions:
      - belief: block.timestamp is a trustworthy clock.
        reality: It is a proposer-supplied field within a permitted window; treat it as adversarially influenced, not as time.
        why: It has the name and the shape of a clock.
        source: execution-specs

  - id: call-frame
    title: Call frame
    oneLine: Every call-family instruction opens a new machine with its own stack, memory, program counter and gas allowance.
    statement: >
      A CALL, CALLCODE, DELEGATECALL, STATICCALL or CREATE opens a fresh frame. The new frame has its
      own 1024-slot stack, its own zeroed memory, its own program counter and its own gas budget
      carved out of the caller's. Nothing is shared implicitly: the only things that cross frame
      boundaries are the calldata copied in, the return data copied out, and effects on world state —
      balances, storage, logs — which are journalled so they can be undone together if the frame
      reverts. Understanding what does and does not survive a frame boundary is most of what makes
      contract interaction predictable.
    volatility: stable
    edges:
      - { to: evm-execution-loop, type: requires }
      - { to: memory-is-per-frame, type: deepens }
    sources: [execution-specs, yellow-paper]
    misconceptions:
      - belief: A call is like a function call in your language.
        reality: It is closer to spawning a process with a message. Nothing is shared but the arguments, the result, and the world.
        why: Solidity's syntax makes external and internal calls look identical.
        source: execution-specs

  - id: memory-is-per-frame
    title: Memory belongs to the frame
    oneLine: A frame's memory starts zeroed, is invisible to every other frame, and disappears when the frame ends.
    statement: >
      Each frame gets its own memory, freshly zero-initialised, and it is destroyed when the frame
      returns or reverts. A callee cannot see or write the caller's memory, and the caller cannot see
      the callee's. Data crosses the boundary only by explicit copying: calldata in, return data out.
      This is why passing a large array to an external function is genuinely expensive — the bytes
      are copied into a new region and paid for again — and why memory offsets are always relative to
      the current frame.
    volatility: stable
    edges:
      - { to: call-frame, type: requires }
      - { to: memory-is-a-flat-byte-array, type: deepens }
      - { to: storage-is-the-expensive-one, type: contrasts }
    sources: [execution-specs]
    misconceptions:
      - belief: Contracts share a heap.
        reality: Each frame has a private memory that dies with it; nothing persists across the boundary except copied bytes and world-state effects.
        why: In-process function calls share a heap everywhere else.
        source: execution-specs

  - id: depth-limit-1024
    title: The 1024-frame depth limit
    oneLine: Call depth is hard-capped at 1024, and exceeding it makes the call return failure rather than throwing.
    statement: >
      The EVM refuses to open a frame at depth greater than 1024. Crucially, hitting the cap does not
      raise an exception in the caller: the call instruction simply pushes 0, exactly as if the callee
      had reverted. That failure mode — a call that returns false rather than aborting — is what made
      "always check the return value" a security rule in the first place. In practice the depth limit
      is now unreachable through gas-consuming calls, because forwarded gas decays geometrically and
      runs out long before depth 1024.
    volatility: stable
    edges:
      - { to: call-frame, type: requires }
      - { to: call-returns-a-boolean, type: deepens }
      - { to: stack-depth-1024, type: contrasts }
    sources: [execution-specs, yellow-paper]
    misconceptions:
      - belief: The 1024 depth limit and the 1024 stack limit are the same thing.
        reality: One counts nested frames, the other counts items on a single frame's operand stack. They are unrelated limits that happen to share a number.
        why: Both are "1024" and both are called stack limits in casual speech.
        source: execution-specs

  - id: four-call-variants
    title: Four call variants
    oneLine: CALL runs callee code in callee storage; DELEGATECALL runs callee code in caller storage keeping msg.sender and msg.value; STATICCALL bans mutation; CALLCODE is the deprecated ancestor.
    statement: >
      CALL executes the callee's code against the callee's storage, with `msg.sender` set to the
      caller and `address(this)` set to the callee; it may transfer value. DELEGATECALL executes the
      callee's code against the *caller's* storage, with `address(this)`, `msg.sender` and `msg.value`
      all preserved from the caller's frame — borrowed code, your identity, your state. STATICCALL is
      CALL with every state-mutating operation — SSTORE, LOG, value-bearing calls, contract creation,
      SELFDESTRUCT — disallowed, so it can be used to guarantee a read is a read. CALLCODE is
      DELEGATECALL's deprecated predecessor, which failed to preserve `msg.sender`, and exists only
      for historical compatibility.
    volatility: stable
    edges:
      - { to: call-frame, type: requires }
      - { to: delegatecall-is-the-proxy-primitive, type: deepens }
      - { to: delegatecall-storage-is-the-risk, type: applies }
    sources: [execution-specs, eip-214]
    misconceptions:
      - belief: STATICCALL just means "view function".
        reality: It is a machine-level flag that makes any mutating opcode in the whole subtree fail, including in contracts the callee calls.
        why: Solidity's `view` keyword is a compile-time annotation, which makes the runtime enforcement invisible.
        source: eip-214

  - id: delegatecall-is-the-proxy-primitive
    title: DELEGATECALL is the proxy primitive
    oneLine: Borrowed code, your storage, your identity — which makes upgradeable proxies possible and makes storage collisions inevitable.
    statement: >
      Every upgradeable proxy, every library-by-delegatecall pattern, and EIP-7702 account delegation
      are the same mechanism: execute somebody else's code while remaining yourself. The consequence
      that costs money is that the borrowed code addresses storage by slot number, and slot numbers
      are assigned by the borrowed code's own layout. If the proxy and the implementation disagree
      about what lives in slot 0, the implementation will happily overwrite the proxy's admin
      pointer. The standard mitigations — ERC-1967's fixed hashed slots and ERC-7201's namespaced
      layouts — exist precisely to move proxy state somewhere no ordinary layout will ever assign.
    volatility: stable
    edges:
      - { to: four-call-variants, type: requires }
      - { to: per-account-storage-trie, type: requires }
      - { to: delegation-designator, type: applies }
      - { to: erc-1967-slots, type: applies }
      - { to: storage-collision, type: applies }
    sources: [execution-specs, erc-1967, erc-7201]
    misconceptions:
      - belief: A proxy forwards a call to the implementation.
        reality: It does not forward. It executes the implementation's code inside itself, which is why the storage that changes is the proxy's.
        why: '"Forwarding" is how proxies work in every other context.'
        source: erc-1967

  - id: 63-64-rule
    title: The 63/64 rule
    oneLine: A call may forward at most 63/64 of the gas the caller holds, so the caller always keeps a slice and survives a callee that burns everything.
    statement: >
      EIP-150 forbids forwarding all remaining gas. Whatever a caller requests, the callee receives at
      most `floor(63/64 × remaining)`, leaving at least 1/64 with the caller. The caller therefore
      always has gas left to observe the call's result and react, no matter what the callee does. The
      rule also means forwarded gas decays geometrically with depth: after d nested calls the innermost
      frame holds at most `G × (63/64)^d`, so deep chains starve on gas long before any structural
      limit applies.
    volatility: stable
    edges:
      - { to: call-frame, type: requires }
      - { to: gas-is-a-countdown, type: requires }
      - { to: estimategas-63-64, type: applies }
    sources: [eip-150, rareskills-eip150]
    misconceptions:
      - belief: 'call{gas: gasleft()} forwards everything you have.'
        reality: It forwards at most 63/64 of it; the expression names a ceiling the rule then reduces.
        why: The syntax reads as an exact amount.
        source: eip-150

  - id: call-gas-is-a-maximum
    title: The gas argument to a call is a maximum
    oneLine: If less gas is available than you asked for, the call proceeds with less rather than failing.
    statement: >
      Post-EIP-150 the gas parameter of a call is a ceiling, not a demand. When the caller holds less
      than the requested amount, the call is not rejected — it runs with whatever 63/64 of the
      remaining gas comes to. Nothing at the machine level tells the callee how much it was supposed
      to receive, and nothing tells the caller that its request was trimmed. A contract that needs a
      subcall to have had at least N gas must check `gasleft()` itself before and after, or arrange
      for the subcall to fail loudly.
    volatility: stable
    edges:
      - { to: 63-64-rule, type: requires }
      - { to: gas-griefing, type: deepens }
    sources: [eip-150, rareskills-eip150]
    misconceptions:
      - belief: 'call{gas: x} guarantees the callee gets x.'
        reality: It is a maximum. With less available, the call proceeds with less and nobody is told.
        why: Named parameters read as guarantees.
        source: rareskills-eip150

  - id: call-depth-attack-dead
    title: The call-depth attack is dead
    oneLine: Gas decays as (63/64)^depth, so it runs out long before the 1024-frame limit — which is why the old depth-exhaustion attack no longer works.
    statement: >
      Before EIP-150 an attacker could recursively call to push the depth counter near 1024 and then
      invoke a victim contract, so that the victim's own internal call failed for reasons unrelated to
      its logic. Geometric gas decay removed the attack: reaching depth 1024 would require surviving
      `(63/64)^1024` of the original gas, which is far below one unit. The historical relevance is that
      a great deal of defensive code, and a great deal of security folklore, was written against a
      threat that stopped existing in 2016.
    volatility: stable
    edges:
      - { to: 63-64-rule, type: requires }
      - { to: depth-limit-1024, type: requires }
    sources: [eip-150, evm-opcodes-gas]
    misconceptions:
      - belief: You can exhaust the 1024-frame call stack to attack a contract.
        reality: Dead since EIP-150; gas decays exponentially and runs out first.
        why: The attack is memorable and appears in older security material without a date.
        source: eip-150

  - id: gas-griefing
    title: Gas griefing
    oneLine: A caller can forward deliberately insufficient gas so an inner call fails while the outer transaction still succeeds.
    statement: >
      Because forwarded gas is a ceiling the caller chooses, a caller can supply just enough gas for
      the outer logic to complete and too little for a subcall to finish. The subcall halts
      exceptionally, the outer frame sees a false return value, and if the outer code ignores that
      value or treats failure as an acceptable outcome, the transaction succeeds having skipped work
      it was supposed to do. This is the mechanism behind relayer griefing, unreliable callback
      patterns and several classes of denial-of-service against contracts that pay for other people's
      execution.
    volatility: stable
    edges:
      - { to: call-gas-is-a-maximum, type: requires }
      - { to: call-returns-a-boolean, type: requires }
      - { to: access-control-failure, type: applies }
    sources: [eip-150, evm-opcodes-gas]
    misconceptions:
      - belief: If the transaction succeeded, everything it was supposed to do happened.
        reality: An inner call can fail on gas while the outer frame completes normally; success at the top says nothing about the subtree.
        why: Atomicity is usually all-or-nothing, and here it is per-frame.
        source: eip-150

  - id: three-failure-modes
    title: Three ways a frame can end badly
    oneLine: REVERT undoes state, returns data and refunds gas; an exceptional halt undoes state, returns nothing and burns the frame's gas; out-of-gas is the second kind.
    statement: >
      REVERT undoes every state change made in the frame, hands back a data payload, and returns the
      unspent gas to the caller. An exceptional halt — an invalid opcode, a stack underflow or
      overflow, an out-of-bounds RETURNDATACOPY, a mutation attempted under STATICCALL — also undoes
      state changes but returns no data and consumes all gas allotted to the frame. Out of gas is a
      special case of the second. From the caller's side both look identical at first glance: the call
      pushes 0. The difference shows up in what is left in the return-data buffer and in how much gas
      came back.
    volatility: stable
    edges:
      - { to: gas-is-a-countdown, type: requires }
      - { to: call-frame, type: requires }
      - { to: revert-data-encoding, type: deepens }
      - { to: revert-blindness, type: applies }
    sources: [eip-140, solidity-error-handling]
    misconceptions:
      - belief: assert compiles to INVALID and burns all your gas.
        reality: Since Solidity 0.8.0 assert reverts with Panic(uint256) and returns unused gas. The burn-everything behaviour is pre-0.8 history.
        why: The old behaviour was heavily taught and the change is easy to miss in the docs.
        source: solidity-error-handling

  - id: call-returns-a-boolean
    title: A low-level call returns a boolean
    oneLine: A failed inner call pushes 0 and does not abort the caller, so ignoring that value silently swallows the failure.
    statement: >
      CALL, DELEGATECALL and STATICCALL push 1 for success and 0 for failure. Nothing propagates
      automatically. Solidity's high-level call syntax inserts a check and a bubble-up, which is why
      `token.transfer(...)` appears to throw on failure — but `address.call{...}` and any assembly
      `call` do not, and neither does a call made through a low-level helper. A contract that ignores
      the boolean will proceed with its own state updated as though the call had worked.
    volatility: stable
    edges:
      - { to: call-frame, type: requires }
      - { to: low-level-call-returns-bool, type: deepens }
      - { to: raw-call-no-existence-check, type: deepens }
    sources: [eip-140, execution-specs]
    misconceptions:
      - belief: A failed inner call aborts the whole transaction.
        reality: A low-level call just pushes 0; only Solidity's high-level syntax inserts an automatic bubble-up.
        why: Every mainstream language propagates exceptions by default.
        source: eip-140

  - id: returndata-buffer
    title: The return-data buffer
    oneLine: One buffer, overwritten by every sub-call including failed ones, and RETURNDATACOPY reverts on out-of-bounds reads instead of zero-padding.
    statement: >
      RETURNDATASIZE and RETURNDATACOPY read a single per-frame buffer holding the output of the most
      recent sub-call — whatever its outcome. When a call reverts, the buffer holds the revert payload,
      which is exactly how revert reasons are recovered. The buffer is overwritten by the next
      sub-call, so anything you need must be copied out immediately. Unlike CALLDATACOPY, which
      zero-pads reads past the end of its region, RETURNDATACOPY reverts on an out-of-bounds read; the
      asymmetry has produced real bugs in hand-written assembly.
    volatility: stable
    edges:
      - { to: call-frame, type: requires }
      - { to: calldata-is-read-only, type: contrasts }
      - { to: revert-bubbling, type: applies }
    sources: [eip-211]
    misconceptions:
      - belief: The return-data buffer holds the last successful call's output.
        reality: It holds the last call's output whatever the outcome, and a revert payload lands there too.
        why: The name "return data" implies success.
        source: eip-211
      - belief: RETURNDATACOPY zero-pads past the end like CALLDATACOPY.
        reality: It reverts. The two opcodes look symmetric and are not.
        why: Their names and signatures invite the analogy.
        source: eip-211

  - id: revert-data-encoding
    title: Revert payloads are ABI-encoded
    oneLine: Error(string) is selector 0x08c379a0, Panic(uint256) is 0x4e487b71, and a custom error is the 4-byte selector of its own signature.
    statement: >
      A revert payload is encoded exactly like a call: a four-byte selector followed by ABI-encoded
      arguments. `require` with a string produces `Error(string)`, selector `0x08c379a0`. Compiler-
      inserted checks — overflow, division by zero, array bounds, `assert` — produce `Panic(uint256)`,
      selector `0x4e487b71`, whose argument is a code identifying which check failed. A custom error
      produces the first four bytes of the keccak256 of its canonical signature. This is why an
      unrecognised revert appears as opaque hex: you are looking at a selector for which you do not
      have the ABI.
    volatility: stable
    edges:
      - { to: three-failure-modes, type: requires }
      - { to: returndata-buffer, type: requires }
      - { to: abi-function-selector, type: requires }
      - { to: revert-data-is-abi-encoded, type: deepens }
    sources: [solidity-error-handling, eip-140]
    misconceptions:
      - belief: A revert reason is a plain string.
        reality: It is an ABI-encoded call to a synthetic function. The string case is one selector among several.
        why: Tooling renders the Error(string) case as bare text.
        source: solidity-error-handling

  - id: initcode-vs-runtime-code
    title: Initcode is not the deployed code
    oneLine: Deployment executes the initcode, and whatever bytes it RETURNs become the account's permanent code; the constructor is not part of it.
    statement: >
      Creating a contract runs the initcode as a frame with no code at the target address yet.
      Whatever that frame RETURNs is stored as the account's runtime code. The constructor's logic and
      its arguments exist only during that one execution: they are not in the deployed bytecode and
      cannot be called later. Two practical consequences follow. EXTCODESIZE of an address under
      construction is zero, because nothing has been stored yet. And constructor arguments are
      appended to the initcode, which is why they change the initcode hash.
    volatility: stable
    edges:
      - { to: call-frame, type: requires }
      - { to: contract-account, type: requires }
      - { to: create2-address, type: deepens }
      - { to: initcode-hash-fragility, type: applies }
    sources: [execution-specs, eip-3860]
    misconceptions:
      - belief: The constructor lives in the deployed contract.
        reality: It runs once during initcode and is not part of the runtime bytecode.
        why: The source file shows one contract, so it feels like one artefact.
        source: execution-specs

  - id: create-address-from-nonce
    title: CREATE derives an address from the deployer's nonce
    oneLine: 'The new address is the last 20 bytes of keccak256(rlp([sender, nonce])), so it depends on deployment order.'
    statement: >
      CREATE computes the new contract's address as the final 20 bytes of
      `keccak256(rlp([sender, sender_nonce]))`. Because the nonce increments with every transaction or
      contract creation the deployer performs, the address depends on the deployer's entire history:
      deploy something else first and the address changes. This is the reason deterministic
      multi-chain deployments could not be done with CREATE alone, and the reason "the address our
      contract will have" was historically a fragile thing to promise.
    volatility: stable
    edges:
      - { to: call-frame, type: requires }
      - { to: account-record-four-fields, type: requires }
      - { to: rlp, type: requires }
      - { to: create-address-derivation, type: deepens }
      - { to: create2-address, type: contrasts }
    sources: [execution-specs, yellow-paper]
    misconceptions:
      - belief: A contract's address is derived from its code.
        reality: With CREATE it is derived from who deployed it and how many times they had acted before. The code plays no part.
        why: Content-addressing is the intuition people bring.
        source: execution-specs

  - id: create2-address
    title: CREATE2 derives an address from the initcode
    oneLine: keccak256(0xff ‖ deployer ‖ salt ‖ keccak256(initcode)) truncated to 20 bytes — predictable before deployment, and dependent on constructor arguments.
    statement: >
      CREATE2 computes the address as the last 20 bytes of
      `keccak256(0xff ‖ sender ‖ salt ‖ keccak256(initcode))`. The deployer's nonce is deliberately
      absent, so the address is fully determined by the deployer, a chosen salt and the exact initcode.
      That is what makes counterfactual deployment, deterministic multi-chain addresses and smart-
      account factories possible. It is also the trap: constructor arguments are part of the initcode,
      so changing a single argument — or recompiling with a different compiler version or optimizer
      setting — changes the address.
    volatility: stable
    edges:
      - { to: create-address-from-nonce, type: requires }
      - { to: hash-function, type: requires }
      - { to: create2-address, type: deepens }
      - { to: create3-pattern, type: applies }
    sources: [eip-1014]
    misconceptions:
      - belief: A CREATE2 address is fixed by the contract's source.
        reality: It is fixed by keccak256 of the initcode, which includes constructor arguments and reflects compiler settings.
        why: '"Deterministic deployment" is usually explained without mentioning constructor args.'
        source: eip-1014

  - id: code-deposit-and-size-limits
    title: Code size limits and the reserved prefix
    oneLine: Deployed code is capped at 24,576 bytes, initcode at 49,152, deployed code may not begin with 0xEF, and storing code is charged per byte.
    statement: >
      Three limits govern what can be deployed. EIP-170 caps deployed runtime code at 24,576 bytes.
      EIP-3860 caps initcode at 49,152 bytes and meters it per 32-byte word. EIP-3541 forbids newly
      deployed code from beginning with the byte `0xEF` — the reservation that later made EIP-7702's
      `0xef0100` delegation designator unambiguous. Storing the returned runtime code is charged per
      byte at deployment, which is why deployment cost scales with contract size and why splitting a
      large contract into libraries changes the bill. EIP-7903 proposes removing the initcode cap but
      is a draft.
    volatility: evolving
    edges:
      - { to: initcode-vs-runtime-code, type: requires }
      - { to: delegation-designator, type: applies }
      - { to: per-transaction-gas-cap, type: recommends }
    sources: [eip-170, eip-3860, eip-3541, eip-7903]
    misconceptions:
      - belief: EOF will lift the code size limits.
        reality: EOF was rejected for Fusaka and its Solidity backend was removed in 0.8.36; EIP-170 and EIP-3860 remain the live ceilings.
        why: EOF was extensively pre-announced through 2024 and 2025.
        source: eip-3860

  - id: selfdestruct-neutered
    title: SELFDESTRUCT no longer deletes
    oneLine: Since EIP-6780 it erases code and storage only if the contract was created in the same transaction; otherwise it merely sweeps the balance.
    statement: >
      Before Cancun, SELFDESTRUCT removed an account's code and storage and sent its balance
      elsewhere. EIP-6780 restricted the deletion to the case where the contract was created in the
      same transaction that destroys it. In every other case the code and storage survive and only the
      ether moves — so a contract that "self-destructed" is still there and still callable. The change
      was made because unbounded state deletion is incompatible with the state-format migrations being
      designed, and its effect is that the only surviving legitimate use is the same-transaction
      create-and-destroy pattern.
    volatility: stable
    edges:
      - { to: initcode-vs-runtime-code, type: requires }
      - { to: contract-account, type: requires }
      - { to: state-growth-problem, type: deepens }
    sources: [eip-6780, eest-eip6780]
    misconceptions:
      - belief: SELFDESTRUCT deletes a contract.
        reality: Since Cancun it only does so within the creating transaction; otherwise code and storage survive and only ETH moves.
        why: EIP-6780 is recent and pre-2024 material dominates search results.
        source: eip-6780
      - belief: Selfdestructing is a way to make a contract unreachable.
        reality: The contract remains deployed and callable. If you need it inert, the code must be written to become inert.
        why: The opcode name promises destruction.
        source: eip-6780
