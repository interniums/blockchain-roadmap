moduleId: evm-gas-fee-market
concepts:
  - id: gas
    title: Gas
    oneLine: The unit that meters computation so execution is guaranteed to halt and every resource used is paid for.
    statement: >
      Gas is a counter attached to each transaction that is decremented before every operation
      according to that operation's cost. Two properties follow from this and nothing else. First,
      halting is guaranteed: any program, including an infinite loop, stops when the counter reaches
      zero. Second, resource use is priced: the costs are set to track what an operation actually
      costs the network — computation, memory, bandwidth, and above all permanent state that every
      node must keep forever. Gas is a unit of work, not a currency; its price in ether is set
      separately by the fee market.
    volatility: stable
    edges:
      - { to: eip-1559-tfm, type: requires }
      - { to: gas-is-a-countdown, type: deepens }
    sources: [execution-specs, yellow-paper]
    misconceptions:
      - belief: Gas is a fee.
        reality: Gas is a quantity of work. The fee is gas multiplied by a price that the fee market sets independently.
        why: Wallets show one combined number in ether.
        source: execution-specs

  - id: tx-gas-limit-vs-used
    title: Transaction gas limit versus gas used
    oneLine: The limit is the exposure you authorise; the used amount is what executed, and the difference is never charged.
    statement: >
      A transaction's `gasLimit` is a ceiling the sender authorises. Execution consumes gas as it
      runs; whatever is left when the transaction ends is simply not charged. Raising the limit does
      not raise the cost of a successful transaction — it raises the maximum you could lose if the
      transaction runs away or reverts late. Setting it too low is the more common failure: the
      transaction runs out of gas, reverts, and you are charged for everything it consumed up to
      that point. This is distinct from the block gas limit, which is a network-wide capacity
      parameter, not something a sender chooses.
    volatility: stable
    edges:
      - { to: gas, type: requires }
      - { to: estimategas-is-a-search, type: applies }
    sources: [execution-specs, execution-apis]
    misconceptions:
      - belief: Setting a high gas limit costs more.
        reality: You pay for gas used. The limit only caps your exposure.
        why: Every other kind of limit you can set on a purchase is a commitment to spend.
        source: execution-specs
      - belief: A failed transaction is free.
        reality: You pay for everything executed before the failure. Only unused gas is returned.
        why: Failed payments are normally reversed in full elsewhere.
        source: execution-specs

  - id: intrinsic-gas
    title: Intrinsic gas
    oneLine: The fixed charge levied before the first opcode runs — 21,000 base plus a per-byte charge on calldata and per-entry charges for access lists and authorizations.
    statement: >
      Before execution begins, a transaction is charged an intrinsic cost: 21,000 gas as the base,
      plus a per-byte charge on the calldata (4 gas per zero byte and 16 per non-zero byte under
      EIP-2028), plus per-entry charges for any access-list entries and any EIP-7702 authorizations,
      plus an additional charge if the transaction creates a contract. A transaction whose gas limit
      is below its intrinsic cost is invalid and never enters a block. This is why a plain ETH
      transfer costs 21,000 gas exactly: it has no calldata and executes no opcodes.
    volatility: evolving
    edges:
      - { to: gas, type: requires }
      - { to: calldata-priced-at-the-edge, type: deepens }
      - { to: calldata-floor-price, type: deepens }
    sources: [execution-specs, eip-2028, yellow-paper]
    misconceptions:
      - belief: Calldata is charged when your code reads it.
        reality: The per-byte charge is levied once, at intrinsic-gas time. CALLDATALOAD inside execution is an ordinary cheap opcode.
        why: The two charges are usually taught together as "the cost of calldata".
        source: eip-2028

  - id: cold-vs-warm-access
    title: Cold and warm access
    oneLine: The first touch of an address or a storage slot in a transaction is priced far above every later touch, so identical code costs different gas depending on what ran before it.
    statement: >
      EIP-2929 makes each transaction maintain a set of addresses and storage slots already touched.
      The first access to an item is cold and expensive; subsequent accesses are warm and cheap.
      Measured on forge 1.7.1 with solc 0.8.36 and the optimizer off, the constants are: cold SLOAD
      2,100 and warm 100; cold account access — BALANCE, EXTCODESIZE and the call family — 2,600 and
      warm 100. The consequence for reasoning about code is that no opcode has a single price: the
      same function costs materially different gas as the first call in a transaction and as the
      third.
    volatility: evolving
    edges:
      - { to: gas, type: requires }
      - { to: per-account-storage-trie, type: requires }
      - { to: state-growth-problem, type: deepens }
      - { to: gas-folklore, type: applies }
      - { to: storage-dominates, type: applies }
    sources: [eip-2929, evm-opcodes-gas]
    misconceptions:
      - belief: The cold SLOAD cost is 800 gas.
        reality: 800 came from an early EIP-2929 draft. The shipped and measured value is 2,100.
        why: The draft number propagated into gas tables that were never revisited.
        source: eip-2929
      - belief: Opcode gas costs are constants you can memorise from a table.
        reality: State-access costs depend on transaction history, and access lists move the boundary. A single-number table is wrong by construction.
        why: Every opcode reference prints one number per opcode.
        source: eip-2929

  - id: sstore-dynamic-pricing
    title: SSTORE is priced on the transition
    oneLine: What a storage write costs depends on the value already there and the value being written, not on the fact that a write happened.
    statement: >
      SSTORE's cost is determined by the transition it performs. Measured on the same pinned
      toolchain: writing a non-zero value into a slot that held zero costs 20,000 gas; changing one
      non-zero value to a different non-zero value costs 2,900; writing the value already present
      costs 100. Each of those is charged on top of the 2,100 cold-slot surcharge when the slot has
      not been touched yet in this transaction. Clearing a slot to zero deletes it from the trie and
      earns a refund, but EIP-3529 both reduced that refund and capped the total refund a transaction
      may receive as a fraction of the gas it used, which is what killed gas-token schemes.
    volatility: evolving
    edges:
      - { to: cold-vs-warm-access, type: requires }
      - { to: zero-slot-is-absent, type: requires }
      - { to: refund-cap, type: applies }
      - { to: slot-packing, type: applies }
    sources: [eip-2929, eip-3529]
    misconceptions:
      - belief: A storage write has one price.
        reality: Zero-to-non-zero, non-zero-to-different, and no-op writes differ by more than two orders of magnitude.
        why: '"SSTORE = 20000" is the number everybody remembers.'
        source: eip-2929
      - belief: Clearing storage refunds most of what you paid.
        reality: EIP-3529 cut the per-clear refund and capped the total refund relative to gas used.
        why: Pre-London gas guides described a much larger refund.
        source: eip-3529

  - id: access-list
    title: Access list
    oneLine: A pre-declaration of the addresses and slots a transaction will touch, paid for up front in exchange for warm pricing on each.
    statement: >
      An EIP-2930 access list lets a sender declare, in the transaction itself, addresses and storage
      keys to mark warm before execution. Each declared address and each declared key carries a fixed
      up-front charge; in return, accesses to them during execution pay warm prices rather than cold
      ones. The list therefore pays only when the declared items would genuinely have been touched
      cold and pays nothing back when they would not have been touched at all. The break-even point
      is a property of a specific call path and should be measured, not assumed.
    volatility: stable
    edges:
      - { to: cold-vs-warm-access, type: requires }
      - { to: tx-type-1-access-list, type: requires }
      - { to: block-level-access-list, type: contrasts }
    sources: [eip-2930, eip-2929]
    misconceptions:
      - belief: Adding an access list is free optimisation.
        reality: Entries cost gas whether or not they are used, so an over-broad list is a net loss.
        why: The word "list" suggests metadata rather than a priced commitment.
        source: eip-2930

  - id: calldata-floor-price
    title: The calldata floor price
    oneLine: Since Pectra, a transaction whose gas is dominated by its calldata pays a floor of 10 gas per zero byte and 40 per non-zero byte instead of 4 and 16.
    statement: >
      EIP-7623, live since Pectra, added a floor to what a data-heavy transaction pays. Ordinary
      execution-heavy transactions still pay the EIP-2028 rates of 4 gas per zero calldata byte and
      16 per non-zero byte. A transaction whose total cost would otherwise be dominated by its
      calldata instead pays a floor of 10 and 40 respectively. The purpose is to bound the worst-case
      block size that a block full of pure-data transactions could produce. The practical
      consequence is that "calldata costs 16 gas per non-zero byte" is now a conditional statement,
      and anyone pricing large payloads must know which regime they are in.
    volatility: evolving
    edges:
      - { to: intrinsic-gas, type: requires }
      - { to: calldata-priced-at-the-edge, type: deepens }
      - { to: calldata-cost-model, type: applies }
      - { to: blob, type: contrasts }
    sources: [eip-7623, eip-2028]
    misconceptions:
      - belief: Calldata costs 16 gas per non-zero byte.
        reality: Only for execution-heavy transactions. Data-dominated transactions pay the EIP-7623 floor of 40.
        why: EIP-2028's numbers are in every gas table written before 2025.
        source: eip-7623
      - belief: A further increase to 64 gas per byte is coming.
        reality: EIP-7976 proposes that floor but is unscheduled and not assigned to any named fork.
        why: Draft EIPs circulate as though they were roadmap items.
        source: eip-7976

  - id: per-transaction-gas-cap
    title: The per-transaction gas cap
    oneLine: Since Fusaka a single transaction may not exceed 2^24 gas, even though the block limit is far higher.
    statement: >
      EIP-7825, live since Fusaka in December 2025, caps any single transaction at 16,777,216 gas —
      2^24 — while EIP-7935 raised the block gas limit to 60 million. A transaction is therefore no
      longer bounded only by what fits in a block: a monolithic deployment, a very large batch, or a
      single call that allocates enormous memory can now hit a ceiling that did not exist before,
      while the block itself still has room. The cap also interacts with quadratic memory pricing,
      because it puts a hard bound on how much memory one transaction can ever afford to touch.
    volatility: evolving
    edges:
      - { to: gas, type: requires }
      - { to: memory-expansion-quadratic, type: applies }
      - { to: code-deposit-and-size-limits, type: recommends }
    sources: [eip-7825, eip-7935]
    misconceptions:
      - belief: If it fits in a block, it can be one transaction.
        reality: Since Fusaka a transaction is capped at 2^24 gas independently of the 60M block limit.
        why: For a decade the block limit was the only ceiling.
        source: eip-7825
