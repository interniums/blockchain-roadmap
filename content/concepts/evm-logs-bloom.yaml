moduleId: evm-logs-bloom
concepts:
  - id: logs-are-write-only
    title: Logs are write-only
    oneLine: LOG0-LOG4 append records to the receipt, and no opcode anywhere in the EVM can read a log back.
    statement: >
      The LOG family appends a record to the current transaction's receipt. There is no corresponding
      read instruction — not for the contract's own past events, not for anyone else's. The channel
      runs one way, out of the chain to off-chain consumers, and this is a deliberate design choice:
      logs never enter the state trie, so nodes need not keep them available to execution and can
      prune or index them however they like. The consequence for contract design is absolute: if
      contract logic needs a value, that value must be in storage. Events are never a substitute.
    volatility: stable
    edges:
      - { to: evm-execution-loop, type: requires }
      - { to: receipt-contents, type: requires }
      - { to: per-account-storage-trie, type: contrasts }
      - { to: events-are-not-readable-onchain, type: deepens }
    sources: [yellow-paper, execution-specs]
    misconceptions:
      - belief: Contracts can read their own past events.
        reality: There is no log-reading opcode at all. If logic needs a value, it must be in storage.
        why: In ordinary systems an event log is just another queryable table.
        source: yellow-paper

  - id: log-record-shape
    title: The shape of a log record
    oneLine: An emitting address, zero to four 32-byte topics, and an arbitrary-length data blob — the digit in LOG0..LOG4 is the topic count.
    statement: >
      Every log is exactly three things: the address of the contract that emitted it, an ordered list
      of between zero and four topics each exactly 32 bytes, and a data field of arbitrary length.
      The instruction chosen — LOG0 through LOG4 — is simply how many topics are being supplied; the
      data is passed as a memory offset and length in every case. Nothing else about a log is
      structured. The distinction between "indexed" and "non-indexed" parameters in a high-level
      language is entirely a decision about which of the two buckets a value goes into.
    volatility: stable
    edges:
      - { to: logs-are-write-only, type: requires }
      - { to: memory-is-a-flat-byte-array, type: requires }
    sources: [yellow-paper, solidity-abi-events]
    misconceptions:
      - belief: Topics and data are different kinds of information.
        reality: They are two storage buckets in the same record. The same value can go in either; only searchability differs.
        why: The keyword `indexed` reads as a semantic annotation.
        source: solidity-abi-events

  - id: logs-still-committed
    title: Logs are committed to the chain
    oneLine: A log lives in a receipt, receipts hash into receiptsRoot, and receiptsRoot is in the header — so a log is as provable as a transaction.
    statement: >
      Logs are not loose metadata that a node might have made up. They are stored inside transaction
      receipts, receipts are the values of the receipts trie, and that trie's root is a field in the
      block header covered by consensus. A log can therefore be Merkle-proved against a block header
      exactly the way an account balance can be proved against the state root, which is what makes
      cross-chain messaging and light-client event verification possible at all. What is *not*
      guaranteed is that the RPC provider that served you the log has told you the truth — that is a
      separate trust step, and making it provable is active work rather than shipped reality.
    volatility: evolving
    edges:
      - { to: three-block-tries, type: requires }
      - { to: log-record-shape, type: requires }
      - { to: proof-vs-trust, type: requires }
      - { to: storage-proof-bridge, type: applies }
    sources: [eip-658, eip-7919]
    misconceptions:
      - belief: Events are off-chain and therefore untrustworthy.
        reality: Logs are in receipts, receipts hash into receiptsRoot, receiptsRoot is in the header — a log is Merkle-provable against the chain.
        why: '"Off-chain consumers" gets compressed into "off-chain data".'
        source: eip-658
      - belief: An eth_getLogs result is verified because logs are committed.
        reality: The commitment exists, but a normal RPC response carries no proof; you are trusting the provider unless you verify it yourself.
        why: Provability and verification-in-practice get conflated.
        source: eip-7919

  - id: logs-revert-with-the-frame
    title: Logs revert with their frame
    oneLine: An event emitted in a frame that later reverts is discarded, so a log in a receipt is evidence the code path completed.
    statement: >
      Logs are part of the journalled effects of a frame. If the frame reverts or halts
      exceptionally, its logs are discarded along with its storage writes. The consequence is that a
      log appearing in a receipt is positive evidence: the code path that emitted it ran to
      completion and was not rolled back. This is the opposite of ordinary application logging, where
      a log line is written as a side effect and survives the failure it was recording — and it is
      why "we did not get the event" is a meaningful diagnostic on-chain.
    volatility: stable
    edges:
      - { to: three-failure-modes, type: requires }
      - { to: logs-are-write-only, type: requires }
    sources: [eip-140, execution-specs]
    misconceptions:
      - belief: Events emitted before a revert still appear.
        reality: They are discarded with the rest of the frame's effects.
        why: In ordinary systems logging is a side effect outside the transaction.
        source: eip-140

  - id: topic0-is-the-signature
    title: topic0 is the event signature hash
    oneLine: For a normal Solidity event, the first topic is keccak256 of the canonical event signature — that is how consumers know what they are looking at.
    statement: >
      A non-anonymous event's first topic is keccak256 of its canonical signature: the event name,
      then the parameter types in parentheses with no spaces and no parameter names, for example
      `Transfer(address,address,uint256)`. Every indexer, wallet and analytics pipeline keys on that
      32-byte value. Nothing in the log carries the event's name in readable form, which is why
      decoding a log requires the ABI: you are matching a hash you already know against a hash in the
      record.
    volatility: stable
    edges:
      - { to: log-record-shape, type: requires }
      - { to: abi-canonical-signature, type: requires }
      - { to: anonymous-event, type: contrasts }
    sources: [solidity-abi-events]
    misconceptions:
      - belief: eth_getLogs searches event names.
        reality: It matches raw 32-byte topic values positionally; the name-to-topic0 mapping is done client-side from your ABI.
        why: Libraries hide the hashing behind a friendly interface.
        source: solidity-abi-events

  - id: indexed-means-searchable
    title: Indexed means searchable, and nothing else
    oneLine: Indexed parameters become topics and can be filtered by exact value; non-indexed parameters are ABI-encoded into the data and readable only after you have found the log.
    statement: >
      Marking a parameter `indexed` puts it into a topic slot rather than into the data blob. Topics
      are the only thing `eth_getLogs` can filter on, and only by exact 32-byte equality — no ranges,
      no partial matches. Non-indexed parameters are ABI-encoded into the data field and are perfectly
      readable, but only once a log has already been located by other means. Because topic0 holds the
      signature, a normal event has three remaining slots, so at most three parameters can be indexed.
      Each topic also has a gas cost, so indexing is a decision about the queries you intend to
      support, not a default.
    volatility: stable
    edges:
      - { to: log-record-shape, type: requires }
      - { to: topic0-is-the-signature, type: requires }
      - { to: event-indexed-reference-types, type: deepens }
    sources: [solidity-abi-events, execution-apis]
    misconceptions:
      - belief: You can index as many event parameters as you like.
        reality: Three for a normal event, four for an anonymous one — a hard consequence of four topic slots with topic0 holding the signature.
        why: The compiler error is rarely hit until late in development.
        source: solidity-abi-events

  - id: indexed-dynamic-is-hashed
    title: An indexed dynamic type is stored hashed
    oneLine: An indexed string, bytes, array or struct becomes keccak256 of its value, so you can filter for a value you already know and never recover the original.
    statement: >
      A topic is exactly 32 bytes, so a dynamic-length value cannot fit. When a string, bytes value,
      array or struct is marked `indexed`, what lands in the topic is keccak256 of its encoding, not
      the value. Filtering still works for a value you already have — hash it and compare — but the
      original is unrecoverable from the log. The usual fix is to emit the value twice: hashed and
      indexed for searching, and unindexed in the data field for reading.
    volatility: stable
    edges:
      - { to: indexed-means-searchable, type: requires }
      - { to: hash-function, type: requires }
      - { to: event-indexed-reference-types, type: deepens }
    sources: [solidity-abi-events]
    misconceptions:
      - belief: indexed on a string lets you read the string from the log.
        reality: It stores keccak256 of the string; the value is unrecoverable. You can filter for a string you already know and nothing else.
        why: '"Indexed" implies "included".'
        source: solidity-abi-events

  - id: anonymous-event
    title: Anonymous events
    oneLine: Declaring an event anonymous omits topic0, freeing the slot for a fourth indexed parameter at the cost of being unidentifiable by signature.
    statement: >
      An `anonymous` event does not write its signature hash into topic0, so all four topic slots are
      available for indexed parameters. The price is that nothing in the record says what the event
      is: a consumer must identify it by the emitting address and by position rather than by
      signature, and generic decoders will not recognise it. The trade is occasionally worth it for
      very high-volume protocol-internal events with a fixed, known emitter, and is a poor default
      for anything a third party will consume.
    volatility: stable
    edges:
      - { to: topic0-is-the-signature, type: contrasts }
      - { to: indexed-means-searchable, type: requires }
    sources: [solidity-abi-events]
    misconceptions:
      - belief: Anonymous events are private.
        reality: They are fully public; they are only harder to identify, because the signature hash is not included.
        why: '"Anonymous" sounds like a privacy property.'
        source: solidity-abi-events

  - id: logs-are-cheap
    title: Logs are cheap but not free
    oneLine: A log costs a base charge plus a measured 375 gas per topic plus a per-byte charge on the data — far below storage, and not zero.
    statement: >
      Emitting a log costs a fixed base, a per-topic charge measured at 375 gas per topic on forge
      1.7.1 with solc 0.8.36, and a per-byte charge on the data field, plus any memory expansion the
      data buffer causes. That is orders of magnitude below a storage write, because nodes never have
      to keep logs in the state trie or serve them to the EVM — but it is real money at volume, and a
      contract that logs a large blob on every call is paying for it. The right comparison to make is
      not "log versus free" but "log versus SSTORE versus calldata", each measured on your own code.
    volatility: evolving
    edges:
      - { to: logs-are-write-only, type: requires }
      - { to: storage-is-the-expensive-one, type: contrasts }
      - { to: log-gas-model, type: deepens }
    sources: [yellow-paper, eip-2929]
    misconceptions:
      - belief: Emitting an event is basically free.
        reality: There is a per-topic charge and a per-byte data charge; logging a large payload every call is a real cost.
        why: The contrast with SSTORE is so large that it reads as zero.
        source: yellow-paper

  - id: bloom-filter-idea
    title: What a Bloom filter is
    oneLine: A fixed-size bit array where each item sets a few bits — an unset bit proves absence, all bits set means only "probably present".
    statement: >
      A Bloom filter tests set membership in constant space. Each item is hashed to a small number of
      bit positions, and those bits are set. To test an item, check its bit positions: if any is
      unset, the item is definitely not in the set; if all are set, the item is probably in the set,
      because other items may have set those bits between them. False positives are possible and
      false negatives are not. The false-positive rate rises as more items are inserted into a
      fixed-size array — which is the entire story of what happened to Ethereum's.
    volatility: stable
    edges:
      - { to: hash-function, type: requires }
      - { to: bloom-saturation, type: deepens }
    sources: [yellow-paper, pureth-logs-bloom]
    misconceptions:
      - belief: A bloom hit means the item is present.
        reality: A hit means "maybe"; only a miss is conclusive.
        why: Probabilistic data structures are unfamiliar to most application developers.
        source: yellow-paper

  - id: ethereum-bloom-parameters
    title: Ethereum's specific bloom construction
    oneLine: 2048 bits, up to three bits set per item, taken as the low 11 bits of each of the first three byte-pairs of keccak256(item) — over the emitting address and every topic.
    statement: >
      Ethereum's log bloom is 2048 bits — 256 bytes. For each item, the item is keccak256-hashed and
      the first three pairs of bytes are each reduced to their low 11 bits, giving up to three
      positions in the 2048-bit array; up to three, because the three slices can collide. The items
      entered are the emitting address and every topic of every log; the data field is not included.
      This is defined normatively in the Yellow Paper as M₃:₂₀₄₈ and nowhere else, which is why
      re-implementations tend to disagree in the details.
    volatility: stable
    edges:
      - { to: bloom-filter-idea, type: requires }
      - { to: log-record-shape, type: requires }
      - { to: logs-bloom, type: deepens }
    sources: [yellow-paper, manbytesgnu-log-bloom]
    misconceptions:
      - belief: The bloom lets you search on the log's data.
        reality: Only the emitting address and the topics are entered. Non-indexed data is invisible to the filter.
        why: The filter is described as covering "the logs".
        source: yellow-paper

  - id: block-bloom-is-a-union
    title: The header bloom is a union of receipt blooms
    oneLine: Each receipt carries its own bloom, and the header's logsBloom is the bitwise OR of them all, so a node can reject an irrelevant block from 256 bytes of header.
    statement: >
      Every receipt carries a bloom over its own logs, and the header's logsBloom is the bitwise OR
      of every receipt bloom in the block. The intended workflow is hierarchical: check the header's
      256 bytes to decide whether a block could contain anything you care about, and only if it might,
      fetch the receipts and check theirs. Because OR only ever adds bits, the block-level filter is
      always at least as saturated as the worst receipt in it — which is why the union degrades faster
      than any individual filter.
    volatility: stable
    edges:
      - { to: ethereum-bloom-parameters, type: requires }
      - { to: receipt-contents, type: requires }
    sources: [yellow-paper, pureth-logs-bloom]
    misconceptions:
      - belief: Filtering by header bloom saves fetching receipts.
        reality: It does when the bloom misses. At current saturation levels it frequently hits anyway, so the receipts get fetched regardless.
        why: The design's intent is described more often than its current effectiveness.
        source: pureth-logs-bloom

  - id: bloom-saturation
    title: Bloom saturation
    oneLine: A fixed 2048-bit filter against a growing log volume fills up, the false-positive rate climbs, and the filter stops saving work.
    statement: >
      The bloom's size was fixed in 2015 and log volume was not. As blocks carry more logs, more of
      the 2048 bits are set, the false-positive rate rises, and clients end up fetching and scanning
      blocks the filter told them to consider. The filter then costs header bytes without saving
      work. Two draft EIPs address this and are proposed for Glamsterdam: EIP-7668 would force the
      blooms empty, and EIP-7745 would replace them with an adaptive two-dimensional filter-map
      structure hashed into a Merkle tree so that log queries could be *proved* rather than merely
      filtered. Glamsterdam has not shipped, its confirmed headline EIPs are others, and neither
      bloom EIP is confirmed for inclusion.
    volatility: hot
    edges:
      - { to: block-bloom-is-a-union, type: requires }
      - { to: getlogs-topic-semantics, type: deepens }
    sources: [eip-7668, eip-7745, pureth-logs-bloom, eip-7773]
    misconceptions:
      - belief: Bloom filters are how modern applications find events.
        reality: Almost all real traffic goes through eth_getLogs on a provider or a dedicated indexer; the bloom is a protocol-level pre-filter now widely considered failed.
        why: It is prominent in the Yellow Paper and in every architecture diagram.
        source: eip-7745
      - belief: The bloom is being removed in the next upgrade.
        reality: EIP-7668 and EIP-7745 are drafts proposed for Glamsterdam, which has not shipped and has not confirmed either for inclusion.
        why: '"Proposed for" a fork is routinely reported as "included in".'
        source: eip-7773

  - id: getlogs-topic-semantics
    title: How eth_getLogs matching works
    oneLine: Topics match positionally — position i must equal one of the values you gave for position i, null is a wildcard, and it is an AND across positions with an OR inside each.
    statement: >
      An `eth_getLogs` filter takes an address or addresses, a block range, and a topics array. The
      topics array is positional: element i constrains topic i. A null at a position matches anything.
      A single value at a position requires equality. An array of values at a position matches any of
      them. The overall semantics are therefore an AND across positions and an OR within a position —
      there is no way to express "topic1 equals X or topic2 equals Y" in one query. Providers also
      impose their own limits on block range and result count, which vary and must be handled by any
      real indexer.
    volatility: stable
    edges:
      - { to: indexed-means-searchable, type: requires }
      - { to: log-natural-key, type: applies }
    sources: [execution-apis]
    misconceptions:
      - belief: You can express arbitrary boolean queries over topics.
        reality: The shape is fixed — AND across positions, OR within one. Anything else must be several queries merged client-side.
        why: The array-of-arrays syntax looks more general than it is.
        source: execution-apis

  - id: events-are-an-api-contract
    title: An event signature is a published API
    oneLine: Indexers, subgraphs, wallets and analytics all key on topic0, so changing an event signature is a breaking change with no compiler to catch it downstream.
    statement: >
      topic0 is keccak256 of the canonical signature, so adding a parameter, changing a type, or
      renaming an event produces a completely different topic0. Every existing filter stops matching,
      silently: no error is raised anywhere, downstream systems simply see the event stop occurring.
      Marking a parameter `indexed` or unmarking it does not change topic0 but does move the value
      between topics and data, which breaks decoders in a different way. Treat an event as a
      versioned public interface: additive change means a new event, not an edited one.
    volatility: stable
    edges:
      - { to: topic0-is-the-signature, type: requires }
      - { to: abi-canonical-signature, type: requires }
      - { to: log-natural-key, type: applies }
    sources: [solidity-abi-events, execution-apis]
    misconceptions:
      - belief: Adding a field to an event is a backwards-compatible change.
        reality: It changes the signature, therefore topic0, therefore every existing filter — and nothing warns anybody.
        why: Adding a field is additive and safe in almost every other API technology.
        source: solidity-abi-events
