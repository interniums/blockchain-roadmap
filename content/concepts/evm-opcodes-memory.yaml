moduleId: evm-opcodes-memory
concepts:
  - id: word-is-256-bits
    title: The word is 256 bits
    oneLine: Every stack item is exactly 32 bytes; there is no smaller native word, which is why uint8 arithmetic costs more than uint256.
    statement: >
      The EVM has one operand width: 256 bits. Every stack item, every MLOAD and MSTORE, every
      storage slot is 32 bytes. A narrower Solidity type does not become a narrower machine value —
      it becomes a 32-byte value plus the masking instructions needed to keep its unused high bits
      clean, so `uint8` arithmetic on the stack is strictly more expensive than `uint256`. The width
      was chosen because the primitives the machine is built around — keccak256 output, secp256k1
      field elements, addresses padded to a word — all fit naturally in 256 bits.
    volatility: stable
    edges:
      - { to: evm-execution-loop, type: requires }
      - { to: packing-helps-storage-only, type: deepens }
      - { to: dirty-upper-bits, type: applies }
    sources: [yellow-paper, solidity-layout-storage]
    misconceptions:
      - belief: Using uint8 instead of uint256 saves gas.
        reality: On the stack and in memory it costs more because of masking. It saves only when several small values share one storage slot.
        why: Direct transfer of C-style "smaller type, less memory".
        source: solidity-layout-storage

  - id: stack-depth-1024
    title: The 1024-item operand stack
    oneLine: A frame's stack holds at most 1024 items, and overflowing or underflowing it is an exceptional halt, not a catchable error.
    statement: >
      Each call frame has its own operand stack with a hard maximum of 1024 items. Pushing past the
      maximum, or popping when the stack lacks the operands an instruction requires, halts the frame
      exceptionally: state changes are undone and the frame's gas is consumed. There is no recovery
      inside the frame. This is a different limit from the 1024-frame call-depth cap, and a different
      limit again from the 16-slot reach of DUP and SWAP that produces "stack too deep".
    volatility: stable
    edges:
      - { to: word-is-256-bits, type: requires }
      - { to: depth-limit-1024, type: contrasts }
      - { to: three-failure-modes, type: deepens }
    sources: [yellow-paper, execution-specs]
    misconceptions:
      - belief: Stack too deep means you exceeded 1024 stack items.
        reality: It means the compiler could not reach a value within the 16-slot DUP/SWAP window. 1024 is an unrelated limit.
        why: Both are called "stack limits".
        source: solidity-inline-assembly

  - id: stack-reach-16
    title: DUP and SWAP reach only 16 slots
    oneLine: DUP1-DUP16 and SWAP1-SWAP16 are the only stack-addressing instructions, so code can touch just the top sixteen items.
    statement: >
      The EVM has no random access to its stack. The only way to reach an item that is not on top is
      DUP1 through DUP16, which copy one of the top sixteen items, and SWAP1 through SWAP16, which
      exchange the top item with one of the next sixteen. Anything deeper than sixteen slots is
      unreachable until the items above it are consumed or shuffled. This single constraint shapes
      how every compiler targeting the EVM allocates local variables.
    volatility: stable
    edges:
      - { to: stack-depth-1024, type: requires }
      - { to: stack-too-deep, type: deepens }
    sources: [yellow-paper, execution-specs]
    misconceptions:
      - belief: The stack is addressable like registers.
        reality: There are exactly 32 stack-addressing instructions and all of them reach at most sixteen slots down.
        why: Compilers hide the shuffling entirely until they cannot.
        source: yellow-paper

  - id: stack-too-deep
    title: Stack too deep
    oneLine: A machine limitation surfacing as a compiler error — too many live locals for the 16-slot reach — and in August 2026 it is still real for ordinary projects.
    statement: >
      "Stack too deep" is the compiler reporting that it needed a value more than sixteen slots down
      and had no instruction to reach it. The classic workarounds all reduce the number of
      simultaneously live locals: block scopes, grouping parameters into a struct, splitting a
      function, or moving values to memory. Solidity 0.8.36 added stack-to-memory spilling that
      removes the problem, but only on the experimental SSA CFG code generator behind
      `--experimental --via-ssa-cfg`. That backend is not the default for `--via-ir`, and `--via-ir`
      is itself still not the default pipeline, so for a default compile the error is still live.
    volatility: hot
    edges:
      - { to: stack-reach-16, type: requires }
      - { to: via-ir-pipeline, type: deepens }
    sources: [solidity-0836-release, solidity-inline-assembly, argot-roadmap-2026]
    misconceptions:
      - belief: Stack-too-deep was fixed in 0.8.36.
        reality: Fixed only on the experimental SSA CFG backend, which is neither the via-IR default nor the compiler default.
        why: Release-note headlines compress the qualifier away.
        source: solidity-0836-release

  - id: memory-is-a-flat-byte-array
    title: Memory is a flat byte array
    oneLine: Zero-initialised, byte-addressable, grows on demand, private to one frame, and gone when the frame ends.
    statement: >
      A frame's memory is a byte array indexed from zero, initially all zeroes, that grows whenever an
      instruction addresses a byte beyond its current extent. It has no structure the machine
      understands: no objects, no types, no allocator. Every notion of an "array in memory" or a
      "struct in memory" is a convention imposed by the compiler on top of raw offsets. Memory is
      private to the frame and vanishes when the frame returns or reverts.
    volatility: stable
    edges:
      - { to: memory-is-per-frame, type: requires }
      - { to: storage-is-the-expensive-one, type: contrasts }
    sources: [yellow-paper, solidity-layout-memory]
    misconceptions:
      - belief: Memory is free because it is not persisted.
        reality: It is charged per word plus a quadratic term, and the charge never comes back within a frame.
        why: '"RAM is free" intuition from ordinary programming.'
        source: solidity-layout-memory

  - id: memory-word-granularity
    title: Memory moves 32 bytes at a time
    oneLine: MLOAD and MSTORE always read or write a full word; MSTORE8 is the only single-byte instruction.
    statement: >
      MLOAD reads 32 bytes starting at an arbitrary byte offset, and MSTORE writes 32 bytes at an
      arbitrary byte offset. Offsets need not be word-aligned, but the quantity moved is always a
      word. MSTORE8 is the single exception, writing one byte. Consequently "the byte at offset 5" is
      not an operation the machine has: it is a word load plus a shift and a mask, which is why
      byte-level manipulation in assembly reads the way it does, and why writing a short value into
      the middle of a buffer requires care not to clobber its neighbours.
    volatility: stable
    edges:
      - { to: memory-is-a-flat-byte-array, type: requires }
      - { to: word-is-256-bits, type: requires }
    sources: [yellow-paper, solidity-layout-memory]
    misconceptions:
      - belief: MSTORE writes only the bytes of the value you gave it.
        reality: It writes a full 32 bytes, overwriting whatever followed the target offset.
        why: Higher-level languages write exactly the width of the type.
        source: solidity-layout-memory

  - id: memory-highwater-never-shrinks
    title: The memory high-water mark never falls
    oneLine: You are charged for the highest byte offset ever touched in the frame, and there is no way to release memory.
    statement: >
      Memory expansion is charged against the highest offset the frame has ever addressed, not
      against how much is currently in use. Writing once at a large offset and then working near zero
      refunds nothing, and there is no deallocation instruction. Solidity's allocator only ever moves
      its free-memory pointer forward, so a loop that allocates a fresh array per iteration grows
      memory monotonically for the whole frame even if each array is dead immediately. The remedy is
      to reuse a buffer, not to free one.
    volatility: stable
    edges:
      - { to: memory-expansion-quadratic, type: requires }
      - { to: solidity-free-memory-pointer, type: deepens }
    sources: [solidity-layout-memory, learnevm-memory]
    misconceptions:
      - belief: You can free memory when you are done with it.
        reality: There is no deallocation. Solidity's allocator only advances its pointer.
        why: Every mainstream runtime has GC or free().
        source: solidity-layout-memory

  - id: memory-expansion-quadratic
    title: Memory expansion is quadratic
    oneLine: Growing memory to a words costs 3·a + floor(a²/512) in total, charged as the delta from the previous high-water mark.
    statement: >
      The total cost of having expanded memory to `a` 32-byte words is `3·a + floor(a² / 512)`, and
      an instruction that raises the high-water mark pays the difference between the new total and
      the old one. For small buffers the linear term dominates and memory feels nearly free; the
      quadratic term is what makes multi-megabyte buffers unaffordable, which is the point — it
      bounds how much memory a single execution can force every node to allocate. Since Fusaka the
      per-transaction gas cap puts a second, harder ceiling on the same thing. EIP-7686 proposes
      replacing the quadratic curve with a flat limit, but has not shipped.
    volatility: evolving
    edges:
      - { to: memory-is-a-flat-byte-array, type: requires }
      - { to: gas-is-a-countdown, type: requires }
      - { to: per-transaction-gas-cap, type: recommends }
    sources: [yellow-paper, eip-7686, eip-3336]
    misconceptions:
      - belief: The quadratic term is a rounding detail.
        reality: It is the entire reason large buffers are impossible; past a few hundred kilobytes it dominates the linear term completely.
        why: At the sizes used in ordinary contracts, only the linear term is visible.
        source: eip-3336

  - id: copy-costs-are-per-word
    title: Copies and hashes are charged per word
    oneLine: CALLDATACOPY, CODECOPY, RETURNDATACOPY, MCOPY and KECCAK256 each charge a small base plus a per-32-byte-word rate plus any memory expansion.
    statement: >
      Every bulk operation over a byte range is priced by length: a base cost, plus a charge per
      32-byte word touched, plus whatever memory expansion the destination causes. That includes
      KECCAK256, which is why "just hash the whole struct" is a cost that scales with the struct.
      MCOPY (opcode 0x5E, added in Cancun by EIP-5656) is the memory-to-memory copy instruction;
      before it existed, compilers and hand-written assembly emitted MLOAD/MSTORE loops for the same
      job, which cost more per word.
    volatility: stable
    edges:
      - { to: memory-expansion-quadratic, type: requires }
      - { to: memory-word-granularity, type: requires }
    sources: [eip-5656, yellow-paper, eest-mcopy]
    misconceptions:
      - belief: Hashing is a constant-cost operation.
        reality: KECCAK256 is priced per 32-byte word of input plus memory expansion for the buffer it reads.
        why: Hash functions are presented as O(1) primitives in cryptography material.
        source: eip-5656

  - id: solidity-free-memory-pointer
    title: Solidity's memory map
    oneLine: 0x00-0x3f is scratch, 0x40 holds the free-memory pointer, 0x60 is permanently zero, and allocation starts at 0x80.
    statement: >
      Solidity imposes a fixed convention on the raw byte array. Offsets `0x00`-`0x3f` are scratch
      space usable between statements, `0x40` holds the free-memory pointer, `0x60` is a zero slot
      that must never be written (it backs the empty dynamic array), and allocations begin at `0x80`.
      Allocating means reading the pointer, using the bytes it names, and writing the advanced pointer
      back. Compiler-generated code depends on this convention, so assembly that writes below `0x80`
      or fails to advance the pointer corrupts data belonging to code it never touched.
    volatility: stable
    edges:
      - { to: memory-is-a-flat-byte-array, type: requires }
      - { to: solidity-memory-model-is-a-contract, type: deepens }
    sources: [solidity-layout-memory]
    misconceptions:
      - belief: The reserved region is a convention you can ignore in your own assembly.
        reality: The compiler's own generated code relies on it, so ignoring it corrupts unrelated allocations, not just yours.
        why: '"Convention" sounds like style rather than contract.'
        source: solidity-layout-memory

  - id: calldata-is-read-only
    title: Calldata is read-only and zero-pads
    oneLine: The frame's immutable input array — readable with CALLDATALOAD and CALLDATACOPY, never writable, and reads past its end return zeros rather than reverting.
    statement: >
      Calldata is the byte array supplied to the current frame. There is no instruction that writes
      to it. Reads past its end are not an error: CALLDATALOAD returns zero-padded words and
      CALLDATACOPY zero-fills. That padding behaviour is a real security property to know, because a
      call carrying a short payload decodes as valid arguments that are all zero rather than
      failing — which is why ABI decoders must check length rather than relying on the read to fail.
      It is the opposite of RETURNDATACOPY, which reverts on an over-read.
    volatility: stable
    edges:
      - { to: call-frame, type: requires }
      - { to: returndata-buffer, type: contrasts }
      - { to: abi-decode-validates, type: applies }
    sources: [eip-211, execution-specs]
    misconceptions:
      - belief: Reading past the end of calldata reverts.
        reality: It returns zeros, which is precisely why a call with a short payload can silently decode as zero arguments.
        why: Symmetry with RETURNDATACOPY, which does revert.
        source: eip-211

  - id: calldata-priced-at-the-edge
    title: Calldata is paid for at the transaction boundary
    oneLine: The per-byte charge happens once, when the transaction enters the block; inside execution a CALLDATALOAD is an ordinary cheap opcode.
    statement: >
      Calldata's per-byte price is part of intrinsic gas, levied once as the transaction enters a
      block, because that is where the real cost lies — the bytes are permanently part of the chain's
      history and must be propagated to every node. Reading calldata during execution costs the same
      as any cheap opcode, regardless of how many times you read it. This is why declaring a
      parameter `calldata` rather than `memory` is a machine-level decision and not a style choice:
      `memory` forces a copy of the whole array and pays copy and expansion gas, while `calldata`
      reads in place.
    volatility: evolving
    edges:
      - { to: calldata-is-read-only, type: requires }
      - { to: intrinsic-gas, type: requires }
      - { to: calldata-floor-price, type: deepens }
      - { to: memory-expansion-quadratic, type: contrasts }
    sources: [eip-2028, eip-7623, solidity-layout-memory]
    misconceptions:
      - belief: Reading calldata inside a function costs gas per byte read.
        reality: The per-byte charge happens once at intrinsic-gas time; CALLDATALOAD itself is an ordinary cheap opcode.
        why: The two charges are usually taught together.
        source: eip-2028
      - belief: memory versus calldata on a parameter is a style choice.
        reality: memory copies the whole array and pays for it; calldata reads in place. For large arrays the difference is large and easily measured.
        why: The keywords read as type annotations rather than machine locations.
        source: solidity-layout-memory

  - id: four-data-locations
    title: Six places a byte can live
    oneLine: Stack, memory, calldata and storage are four different machines with different lifetimes and prices; return data and code are two more read-only regions.
    statement: >
      The EVM has four locations a contract writes to — stack, memory, calldata (write-only at the
      boundary, read-only inside), and storage — and two more it can only read: the return-data buffer
      and code. They differ on every axis that matters: lifetime (one instruction, one frame, one
      transaction, forever), addressing granularity (word, byte, byte, slot), writability, and price
      across roughly three orders of magnitude. Transient storage, added by EIP-1153, is a seventh
      region with a transaction-scoped lifetime. Choosing the location is the single highest-leverage
      gas decision in a contract, and it is made at declaration time.
    volatility: stable
    edges:
      - { to: memory-is-a-flat-byte-array, type: requires }
      - { to: calldata-is-read-only, type: requires }
      - { to: per-account-storage-trie, type: requires }
    sources: [solidity-layout-memory, solidity-layout-storage, yellow-paper]
    misconceptions:
      - belief: Data locations are a Solidity concept.
        reality: They are separate machines in the EVM with separate instructions; the keywords name hardware, not types.
        why: They appear in the type position in a declaration.
        source: solidity-layout-storage

  - id: storage-is-the-expensive-one
    title: Storage is the expensive location
    oneLine: The only location that survives the transaction, priced two to three orders of magnitude above memory because every write mutates a trie every node keeps.
    statement: >
      Storage is the only writable location whose contents outlive the transaction, and it is priced
      accordingly: a first write to a fresh slot is measured at 20,000 gas plus a 2,100 cold surcharge,
      against 3 gas per word for memory. The price is not arbitrary. A storage write changes the
      contract's storage trie, which changes the account's storageRoot, which changes the state root —
      permanent work that every node on the network must perform and then keep. Every gas-optimisation
      guide that is worth reading reduces to "touch storage less".
    volatility: evolving
    edges:
      - { to: per-account-storage-trie, type: requires }
      - { to: four-data-locations, type: requires }
      - { to: sstore-dynamic-pricing, type: deepens }
      - { to: storage-dominates, type: applies }
    sources: [eip-2929, solidity-layout-storage]
    misconceptions:
      - belief: Storage is expensive because writing to disk is slow.
        reality: It is expensive because the write is permanent and global — every node must apply it and keep it forever.
        why: Disk cost is the familiar analogy.
        source: eip-2929

  - id: packing-helps-storage-only
    title: Packing helps storage and nothing else
    oneLine: Squeezing several small values into one 32-byte slot saves real money in storage and saves nothing in memory or on the stack.
    statement: >
      Solidity packs consecutive state variables that fit together into a single 32-byte storage slot,
      and this genuinely saves gas: one slot written instead of two. In memory and on the stack every
      value occupies a full word regardless of its declared width, so packing there saves nothing and
      the masking costs more. Packing also has a downside inside storage: updating one packed field
      requires reading the slot, masking, and writing it back, so a struct whose fields are updated
      individually can cost more packed than unpacked. Packing is a trade tied to the access pattern,
      not a universal win.
    volatility: stable
    edges:
      - { to: storage-is-the-expensive-one, type: requires }
      - { to: word-is-256-bits, type: requires }
      - { to: slot-packing, type: deepens }
    sources: [solidity-layout-storage]
    misconceptions:
      - belief: Packing struct fields always saves gas.
        reality: It saves when the whole struct is written at once and can cost more when single fields are updated, because of the read-modify-write.
        why: Packing is presented as an optimisation with no counterpart.
        source: solidity-layout-storage

  - id: transient-storage
    title: Transient storage
    oneLine: A key-value store scoped to a single transaction, zeroed automatically when the transaction ends, and reverted along with the frame that wrote it.
    statement: >
      Transient storage is a per-contract key-value store, addressed exactly like storage, whose
      contents are discarded at the end of the transaction. It is not written to the state trie and
      needs no clearing write. Critically, it participates in reverts: values written in a frame that
      later reverts are rolled back with everything else in that frame, which is what makes it usable
      for locks. It is not cheap storage — it is a different lifetime. Nothing written to it can be
      observed by a later transaction, so it cannot hold anything a contract needs to remember.
    volatility: evolving
    edges:
      - { to: storage-is-the-expensive-one, type: contrasts }
      - { to: four-data-locations, type: requires }
      - { to: three-failure-modes, type: requires }
    sources: [eip-1153, solidity-transient-storage-blog]
    misconceptions:
      - belief: Transient storage is just cheap storage.
        reality: It is zeroed at transaction end, so it cannot hold anything across transactions — a different data structure, not a discount.
        why: The price difference is the first thing anyone notices about it.
        source: eip-1153

  - id: tstore-tload
    title: TSTORE and TLOAD
    oneLine: Opcodes 0x5d and 0x5c, taking the same stack arguments as SSTORE and SLOAD, measured at 100 gas each.
    statement: >
      TSTORE (`0x5d`) and TLOAD (`0x5c`), introduced by EIP-1153 in Dencun, take the same operands as
      SSTORE and SLOAD and address a parallel key space. Both were measured at 100 gas on forge 1.7.1
      with solc 0.8.36 — flat, with no cold surcharge, because nothing about them touches the state
      trie. Two practical cautions: Solidity exposes them from 0.8.24 onward, and 0.8.34 shipped a
      high-severity fix to transient-storage clearing, so pin at least 0.8.34 for anything that uses
      them; and support is not universal across EVM chains, so a contract using TSTORE is not
      automatically portable.
    volatility: evolving
    edges:
      - { to: transient-storage, type: requires }
      - { to: cold-vs-warm-access, type: contrasts }
    sources: [eip-1153, solidity-transient-storage-blog, solidity-0836-release]
    misconceptions:
      - belief: If it compiles with transient, it works on any EVM chain.
        reality: It requires Cancun-equivalent support, and several chains lag. Check the target chain before deploying.
        why: The compiler targets an EVM version, not a chain.
        source: eip-1153

  - id: transient-storage-middle-tier
    title: Transient storage as the middle tier
    oneLine: It fills the gap between per-frame memory and permanent storage — transaction-scoped, revert-aware, and shared across frames of the same contract.
    statement: >
      Memory is private to a frame and dies with it; storage is global and permanent. Transient
      storage sits between them: it survives across frames within one transaction, so a contract can
      write it in an outer frame and read it in an inner one, and it disappears at the transaction
      boundary. That combination — cross-frame visibility plus automatic cleanup plus revert
      awareness — is the property that no previous location had, and it is what the reentrancy guard
      and flash-accounting patterns are built on.
    volatility: evolving
    edges:
      - { to: four-data-locations, type: requires }
      - { to: transient-storage, type: requires }
      - { to: memory-is-per-frame, type: contrasts }
    sources: [eip-1153, solidity-transient-storage-blog]
    misconceptions:
      - belief: Transient storage is per-frame like memory.
        reality: It is per-transaction and per-contract, visible across every frame of that contract in the transaction.
        why: Its short lifetime makes it feel frame-scoped.
        source: eip-1153

  - id: transient-reentrancy-guard
    title: The transient reentrancy guard
    oneLine: The flagship use case — a lock in transient storage whose overhead is flat and small, against a storage lock whose cost depends on whether the slot is cold.
    statement: >
      A reentrancy guard writes a lock before the protected body and clears it after. Implemented in
      transient storage the overhead was measured at 284 gas per guarded call, flat. Implemented in
      ordinary storage the overhead was measured at 3,104 gas on a warm slot, and is substantially
      higher on the first guarded call in a transaction when the slot is still cold — circulating
      figures for the cold case run to roughly 7,100. The honest statement is therefore a range: the
      storage guard costs somewhere between about 3,100 and 7,100 gas depending on slot warmth, while
      the transient guard is flat. Published single numbers for the storage guard, including the
      widely repeated ~7,100, are not reproducible without stating the warmth assumption.
    volatility: evolving
    edges:
      - { to: tstore-tload, type: requires }
      - { to: cold-vs-warm-access, type: requires }
      - { to: reentrancy-guard-transient, type: applies }
      - { to: reentrancy-classic, type: applies }
    sources: [eip-1153, chainsecurity-tstore]
    misconceptions:
      - belief: The storage guard costs about 7,100 gas.
        reality: That figure assumes a cold lock slot, true only on the first guarded call in a transaction. Measured warm overhead was about 3,100.
        why: One number is easier to quote than a range, and the cold case is the one people benchmarked.
        source: chainsecurity-tstore
      - belief: Transient storage removes the reentrancy vulnerability class.
        reality: It makes the guard cheap. An unguarded function is exactly as vulnerable as before.
        why: Cheap defences get described as if they were automatic.
        source: chainsecurity-tstore

  - id: flash-accounting
    title: Flash accounting
    oneLine: Track net balance deltas transiently across a whole transaction and settle once at the end, reverting if any delta is non-zero.
    statement: >
      Flash accounting replaces per-operation token transfers with a running set of deltas held in
      transient storage. Each operation adjusts the delta for a token; at the end of the transaction a
      single settlement moves the net amounts, and the contract reverts if any delta is still
      non-zero. Uniswap v4 is the canonical implementation. The pattern only works because transient
      storage is visible across frames, is discarded automatically, and rolls back with a reverting
      frame — a storage implementation would pay for every intermediate write and a memory
      implementation could not span frames at all.
    volatility: evolving
    edges:
      - { to: transient-storage, type: requires }
      - { to: transient-storage-middle-tier, type: requires }
      - { to: solvency-invariant, type: applies }
    sources: [eip-1153, solidity-transient-storage-blog]
    misconceptions:
      - belief: Flash accounting is a Uniswap feature.
        reality: It is a general pattern that any multi-step protocol can use; Uniswap v4 is the best-known implementation, not the mechanism.
        why: It was introduced to most people through one product.
        source: solidity-transient-storage-blog

  - id: transient-composability-hazard
    title: The composability hazard
    oneLine: A lock held transiently does not survive conventions it does not control, so a design that relies on an untrusted intermediate frame to relay lock state can be defeated.
    statement: >
      Transient storage is per-contract. A lock written by contract A is invisible to contract B, so
      any protocol whose safety depends on B honouring or forwarding A's lock state depends on B's
      cooperation rather than on the machine. EIP-1153's own specification calls the composability
      risks out explicitly, and the Solidity team's announcement warns that advanced uses threaten
      composability. The safe pattern is narrow: set the lock, run the protected body, clear the lock,
      all inside one contract. Anything that spans a trust boundary needs an argument that does not
      rest on a transient value.
    volatility: evolving
    edges:
      - { to: transient-reentrancy-guard, type: requires }
      - { to: checks-effects-interactions, type: recommends }
    sources: [eip-1153, solidity-transient-storage-blog, chainsecurity-tstore]
    misconceptions:
      - belief: A transient reentrancy guard is strictly better than a storage one.
        reality: Cheaper, yes, but with composability caveats the specification names explicitly, and with different attack economics.
        why: '"Same behaviour, less gas" is the headline everyone repeats.'
        source: chainsecurity-tstore

  - id: cheap-reentrancy-economics
    title: Cheap guards change the economics both ways
    oneLine: Making a guard cost hundreds instead of thousands of gas also makes probing for an unguarded path cheaper to attempt.
    statement: >
      Lowering the price of a defence lowers the price of testing whether it is present. When a guard
      cost thousands of gas, developers omitted it from functions they judged safe and attackers paid
      real money to probe each candidate; with a cheap guard, defenders can afford to guard
      everything and attackers can afford to try far more paths per unit of budget. The honest
      framing is that transient storage changed the cost of both sides of the same game, and the
      security argument for using it is that it removes the excuse for leaving a function unguarded —
      not that it makes reentrancy harder.
