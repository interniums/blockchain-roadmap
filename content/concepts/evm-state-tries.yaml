moduleId: evm-state-tries
concepts:
  - id: state-as-keyvalue
    title: World state is one key-value map
    oneLine: Ethereum's state is a single map from address to account record; the chain of blocks is only the log of edits to it.
    statement: >
      Ethereum does not store a history of transfers that must be replayed to learn a balance. It
      stores one global map from 20-byte address to account record, and each block is a batch of
      edits to that map plus a commitment to the result. Reading a balance is a lookup, not a fold
      over history. This is the single largest structural difference from a UTXO chain, where
      there is no protocol-level balance at all, and it is what makes long-lived mutable contract
      state expressible in the first place.
    volatility: stable
    edges:
      - { to: key-value-state, type: requires }
      - { to: utxo-model, type: contrasts }
      - { to: account, type: deepens }
    sources: [execution-specs]
    misconceptions:
      - belief: The blockchain stores balances directly in blocks.
        reality: Blocks store transactions and one 32-byte root; the balance lives in a trie that clients maintain separately.
        why: The "ledger" framing imported from Bitcoin and from accounting.
        source: execution-specs

  - id: account-record-four-fields
    title: The account record is exactly four fields
    oneLine: Nonce, balance, storageRoot, codeHash — RLP-encoded, and that encoded tuple is the value stored in the state trie leaf.
    statement: >
      The value stored at an account's leaf in the state trie is the RLP encoding of exactly four
      fields, in order: nonce, balance, storageRoot, codeHash. There is no fifth field and no
      variable-length extension point. Every property people expect an account to have — an owner,
      a type, a label, a deployment block — is either derived off-chain or lives inside contract
      storage, not in the record. This fixed shape is why a new account capability such as
      delegation had to be expressed by writing into an existing field rather than by adding one.
    volatility: stable
    edges:
      - { to: state-as-keyvalue, type: requires }
      - { to: rlp, type: requires }
      - { to: account-four-fields, type: deepens }
    sources: [execution-specs, eip-1186]
    misconceptions:
      - belief: An account record can be extended with new fields as the protocol evolves.
        reality: Its shape is fixed; new capabilities are encoded into the existing four fields, which is exactly how EIP-7702 works.
        why: Extensible records are normal everywhere else.
        source: eip-7702

  - id: eoa-vs-contract-same-record
    title: Key-controlled and code-bearing accounts share one record shape
    oneLine: There is no separate account type; an account with no code simply has the empty-string code hash in the same four-field record.
    statement: >
      The state does not distinguish account kinds. An account with no code carries the hash of the
      empty string in its codeHash field, and an account with code carries the hash of that code —
      same record, different field value. This is precisely why EIP-7702 could give a key-controlled
      account code with a single field write and no new state format: writing a delegation
      designator changes codeHash and nothing structural. Any code that models accounts as a tagged
      union of two types is modelling something the protocol does not have.
    volatility: evolving
    edges:
      - { to: account-record-four-fields, type: requires }
      - { to: eoa-vs-contract-binary, type: supersedes }
      - { to: delegation-designator, type: applies }
    sources: [execution-specs, eip-7702]
    misconceptions:
      - belief: EOAs and contracts are stored differently.
        reality: Identical record shape; only the codeHash value differs.
        why: Diagrams draw them as two separate boxes.
        source: execution-specs

  - id: merkle-patricia-trie
    title: Merkle Patricia Trie
    oneLine: A hexary radix trie in which every node is referenced by the keccak256 of its RLP encoding, so one 32-byte root commits to the entire map.
    statement: >
      Ethereum commits to the world state with a hexary — 16-way — Merkle Patricia Trie. The path
      to a value is the sequence of nibbles of its key; each node is RLP-encoded and referenced by
      the keccak256 hash of that encoding; the root hash therefore changes if any byte of any value
      changes. Sixteen-way branching keeps the trie shallow, at the cost of making proofs wide:
      every level of a proof must carry the sibling hashes of a 17-slot node, which is the direct
      reason Ethereum proofs are large compared with binary-tree proofs.
    volatility: stable
    edges:
      - { to: account-record-four-fields, type: requires }
      - { to: hash-function, type: requires }
      - { to: rlp, type: requires }
      - { to: mpt-four-node-types, type: deepens }
      - { to: binary-state-tree, type: contrasts }
    sources: [execution-specs, eip-1186]
    misconceptions:
      - belief: The trie is how clients store state on disk.
        reality: The trie is a commitment. Modern clients keep flat databases and derive trie nodes, which is why archive sizes and sync behaviour differ so much between clients.
        why: '"The state trie" is described as though it were the storage engine.'
        source: execution-specs

  - id: trie-node-kinds
    title: Leaf, extension, branch
    oneLine: Three node kinds — leaf, extension for a shared path prefix, and a 17-slot branch — and the compression is what keeps proofs short on a sparse key space.
    statement: >
      The trie has three functional node kinds. A leaf holds the remaining path nibbles plus the
      value. An extension holds a run of nibbles shared by everything beneath it plus a reference to
      one child, and exists purely to compress long single-child chains. A branch holds sixteen
      child slots indexed by the next nibble plus a seventeenth slot for a key that terminates
      exactly there. Leaf and extension nodes are distinguished by a terminator flag encoded in the
      first nibble of their compact-encoded path. Without extension nodes, a trie over 32-byte
      hashed keys would be 64 levels deep almost everywhere.
    volatility: stable
    edges:
      - { to: merkle-patricia-trie, type: requires }
      - { to: mpt-branch-node, type: deepens }
      - { to: mpt-extension-node, type: deepens }
      - { to: mpt-leaf-node, type: deepens }
    sources: [execution-specs]
    misconceptions:
      - belief: Extension nodes are an optimisation you could omit.
        reality: They are part of the canonical structure; omitting one changes the root hash, so a trie without correct compression is a different trie.
        why: '"Compression" sounds optional.'
        source: execution-specs

  - id: per-account-storage-trie
    title: Each contract has its own storage trie
    oneLine: A contract's storage is a separate trie whose root sits inside that contract's account leaf, making the state a trie of tries.
    statement: >
      Contract storage is not part of the state trie's key space. Each account with storage has its
      own trie, keyed by keccak256 of the 32-byte slot number, and the root of that trie is the
      storageRoot field inside the account's leaf in the state trie. Changing one storage slot
      therefore rehashes a path up the storage trie, changes the account's storageRoot, and then
      rehashes a path up the state trie — two trie updates per write. This nesting is why a storage
      proof is two proofs: one from the state root to the account, one from the storageRoot to the
      slot.
    volatility: stable
    edges:
      - { to: merkle-patricia-trie, type: requires }
      - { to: account-record-four-fields, type: requires }
      - { to: storage-slot, type: applies }
      - { to: mapping-slot-derivation, type: applies }
    sources: [execution-specs, eip-1186]
    misconceptions:
      - belief: Contract storage is one big flat mapping you can enumerate.
        reality: It is a per-contract trie keyed by keccak256(slot); there is no supported way to list all non-zero slots over standard JSON-RPC.
        why: Solidity's mapping syntax hides the hashing entirely.
        source: eip-1186

  - id: secure-trie-hashed-keys
    title: Trie keys are hashed, not raw
    oneLine: Paths are keccak256(address) and keccak256(slot), so no attacker can grind keys into a pathologically deep subtree.
    statement: >
      The path used to walk the state trie is keccak256 of the address, and the path used in a
      storage trie is keccak256 of the 32-byte slot number — never the raw value. Hashing spreads
      keys uniformly, which bounds the expected depth of the trie and denies an attacker the ability
      to mine addresses or slot numbers sharing a long common prefix in order to build a deep,
      expensive subtree that every node must traverse. The cost is that the trie's ordering carries
      no meaning: adjacent leaves are unrelated accounts, so range queries over addresses are
      impossible by construction.
    volatility: stable
    edges:
      - { to: merkle-patricia-trie, type: requires }
      - { to: hash-function, type: requires }
      - { to: mpt-secure-trie, type: deepens }
    sources: [execution-specs]
    misconceptions:
      - belief: Hashing keys is about privacy.
        reality: It is about bounding depth. Addresses are public; what hashing prevents is a griefing attack on trie shape.
        why: Hashing is usually introduced as a privacy tool.
        source: execution-specs

  - id: zero-slot-is-absent
    title: Writing zero deletes the key
    oneLine: Setting a storage slot to zero removes it from the trie rather than storing a zero, so "never written" and "written to zero" are indistinguishable.
    statement: >
      A storage slot holding zero has no entry in the storage trie. Writing zero to a non-zero slot
      deletes the key; reading a slot that has no entry yields zero. This is why clearing storage
      earns a gas refund — it shrinks state that every node must keep — and why no contract can
      distinguish "this value was never set" from "this value was explicitly set to zero" without
      keeping a separate flag. Solidity's `delete` and assigning zero are the same operation at the
      machine level.
    volatility: stable
    edges:
      - { to: per-account-storage-trie, type: requires }
      - { to: sstore-dynamic-pricing, type: applies }
    sources: [execution-specs, eip-3529]
    misconceptions:
      - belief: Setting a slot to zero leaves a zero in the trie.
        reality: It removes the key entirely, which is precisely why clearing storage is refundable.
        why: Ordinary databases store a zero row.
        source: execution-specs
      - belief: A zero return from a getter means the value was never initialised.
        reality: The two states are indistinguishable on-chain; if you need to tell them apart you must store a separate flag.
        why: Languages with nullable types make the distinction for free.
        source: execution-specs

  - id: state-root-is-post-execution
    title: stateRoot is the world after the block
    oneLine: The header's stateRoot commits to the state produced by executing every transaction and withdrawal in that block, and every validating node recomputes it.
    statement: >
      The stateRoot in a block header is not the state the block started from — it is the root of
      the world state after every transaction in the block has executed and every consensus-layer
      withdrawal has been applied. It is the proposer's claim about the resulting world, and it is
      checked, not trusted: each validating node re-executes the block against its own copy of the
      prior state and rejects the block if its computed root differs by a single bit. This is the
      exact point at which "consensus about state" becomes a mechanical check rather than a vote.
    volatility: stable
    edges:
      - { to: merkle-patricia-trie, type: requires }
      - { to: block-header-is-the-block, type: requires }
      - { to: state-root-commits-to-all-accounts, type: deepens }
      - { to: withdrawals-root, type: recommends }
    sources: [execution-specs, eip-4895]
    misconceptions:
      - belief: The state root is a summary the network agrees to accept.
        reality: It is a value each node independently recomputes; disagreement is a rejected block, not a negotiation.
        why: '"Consensus" suggests agreement rather than verification.'
        source: execution-specs

  - id: three-block-tries
    title: The header's separate commitments
    oneLine: A header carries stateRoot (the world after), transactionsRoot (what was submitted) and receiptsRoot (what execution produced), plus withdrawalsRoot since Shanghai.
    statement: >
      A block header commits separately to three different things, because they answer different
      questions: transactionsRoot commits to what was submitted, receiptsRoot to what execution
      produced, and stateRoot to the world that resulted. Shanghai added withdrawalsRoot for state
      changes that are not transactions, and Cancun added blob-gas fields and the parent beacon
      block root. Pectra added requestsHash, which is notable because it is *not* a Merkle Patricia
      root — it is a plain SHA-256 commitment, the first header field to break the pattern that
      every root-shaped field is an MPT root.
    volatility: evolving
    edges:
      - { to: state-root-is-post-execution, type: requires }
      - { to: receipts-root, type: deepens }
      - { to: withdrawals-root, type: deepens }
      - { to: blob-gas-fields, type: recommends }
    sources: [execution-specs, eip-7685, eip-4895, execution-apis]
    misconceptions:
      - belief: Every root-shaped field in the header is a Merkle Patricia root.
        reality: requestsHash, added in Pectra, is a SHA-256 commitment rather than an MPT root.
        why: Pattern-matching on the other four fields.
        source: eip-7685
      - belief: Post-Merge headers dropped the fields proof-of-work needed.
        reality: They are still present as dead constants — difficulty is 0, nonce is 0, ommersHash is the hash of an empty list — and mixHash was repurposed to carry prevRandao.
        why: Removing a header field would be a breaking format change, so they were frozen instead.
        source: execution-apis

  - id: tx-and-receipt-tries-are-index-keyed
    title: The transaction and receipt tries are throwaway
    oneLine: They are keyed by RLP of the index within one block, exist only for that block, and are not a queryable database.
    statement: >
      Unlike the state trie, the transactions and receipts tries are keyed by the RLP encoding of an
      item's index within its own block, and each exists only to produce one root for one header.
      They are commitment structures, not indexes: there is no protocol-level mapping from
      transaction hash to transaction. Hash lookup — the thing every block explorer and RPC provider
      offers — is a client-side index built and maintained outside consensus. Since EIP-2718 the
      *values* in these tries are `type-byte ‖ payload` rather than plain RLP, which is a common
      source of bugs in hand-written decoders.
    volatility: stable
    edges:
      - { to: three-block-tries, type: requires }
      - { to: eip-2718-envelope, type: recommends }
      - { to: per-account-storage-trie, type: contrasts }
    sources: [execution-specs, eip-2718]
    misconceptions:
      - belief: The transactions trie is how you look up a transaction by hash.
        reality: It is keyed by index within one block; hash-to-transaction lookup is a client-side index, not a protocol structure.
        why: Explorers make hash lookup feel native to the chain.
        source: execution-specs

  - id: receipt-contents
    title: What a receipt contains
    oneLine: Status, cumulative gas used, logs bloom and logs — with a 1/0 status byte since Byzantium, not a post-transaction state root.
    statement: >
      A transaction receipt is the tuple [status, cumulativeGasUsed, logsBloom, logs]. Before
      Byzantium the first field was the state root after that transaction; EIP-658 replaced it with
      a single success flag, because computing an intermediate root per transaction is expensive and
      the flag is what consumers actually wanted. `cumulativeGasUsed` is the running total for the
      block up to and including this transaction, so a single transaction's gas is the difference
      between consecutive receipts. Receipts are where logs physically live.
    volatility: stable
    edges:
      - { to: three-block-tries, type: requires }
      - { to: eip-2718-envelope, type: recommends }
      - { to: logs-are-write-only, type: deepens }
    sources: [eip-658, execution-apis]
    misconceptions:
      - belief: A receipt contains the state root after that transaction.
        reality: Since Byzantium it contains a 1/0 status byte instead.
        why: Pre-2017 tutorials and diagrams are still widely copied.
        source: eip-658
      - belief: gasUsed in a receipt is the transaction's own gas.
        reality: The trie field is cumulative for the block; per-transaction gas is a difference. RPC responses often present both, which hides the distinction.
        why: The RPC layer normalises it away.
        source: execution-apis

  - id: eth-getproof
    title: eth_getProof
    oneLine: Returns the RLP node path from the state root down to an account leaf plus per-slot paths from that account's storage root, so anyone holding the root can verify a value offline.
    statement: >
      `eth_getProof`, standardised in EIP-1186, returns the account's four fields, the ordered list
      of RLP-encoded trie nodes forming the path from the state root to that account's leaf, and for
      each requested slot the corresponding node path from the account's storageRoot. Verification is
      mechanical: re-keccak each node, check that the hash matches the reference held by its parent,
      consume nibbles of keccak256(address) along the way, and confirm the final leaf's value. The
      verifier needs the 32-byte state root and nothing else from the provider — the proof is
      self-checking against it.
    volatility: stable
    edges:
      - { to: merkle-patricia-trie, type: requires }
      - { to: state-root-is-post-execution, type: requires }
      - { to: storage-proof, type: deepens }
      - { to: storage-proof-bridge, type: applies }
    sources: [eip-1186, execution-apis]
    misconceptions:
      - belief: A proof is a tree.
        reality: A proof is one path — the nodes along the route plus the sibling hashes each of those nodes already contains. Its length is the trie depth, not the trie size.
        why: '"Merkle tree" makes people picture the whole structure being sent.'
        source: eip-1186

  - id: proof-vs-trust
    title: A proof proves membership, not truth
    oneLine: A Merkle proof shows a value sits under a given root; believing that root is canonical is a separate problem you still have to solve.
    statement: >
      Verifying a proof establishes exactly one thing: that the claimed value is committed under the
      claimed root. It says nothing about whether that root belongs to a canonical, finalised block.
      Every light client and every bridge therefore needs a second, independent mechanism to obtain
      and trust the root — a consensus light client, a committee signature, or an on-chain header
      oracle. Skipping this step is the standard way a "trustless" bridge turns out to trust whoever
      supplies its headers.
    volatility: stable
    edges:
      - { to: eth-getproof, type: requires }
      - { to: finality-is-a-spectrum, type: requires }
      - { to: header-verification-problem, type: applies }
      - { to: verify-vs-reexecute, type: contrasts }
    sources: [eip-1186]
    misconceptions:
      - belief: eth_getProof proves the data is true.
        reality: It proves the data is committed under a root you supplied; obtaining a trustworthy root is a separate mechanism.
        why: '"Merkle proof" sounds self-sufficient.'
        source: eip-1186

  - id: state-growth-problem
    title: State growth is the structural constraint
    oneLine: Hashed keys make state access random and disk-bound, and the state only ever grows — which is why the trie itself is being replaced.
    statement: >
      Because trie paths are hashes, accessing state is a random-access pattern over a large
      on-disk structure, and the structure grows monotonically as new accounts and slots appear.
      This is the pressure behind three separate lines of work: client storage layouts that abandon
      the literal trie on disk in favour of flat tables, the pricing that makes cold state access
      expensive, and the design of a replacement commitment. As of August 2026 the hexary MPT is
      still what mainnet uses, and the live proposal for its successor is EIP-7864's unified binary
      tree, which would freeze the existing trie and accumulate new writes in a new one. Verkle
      trees, promoted for years as the answer, are no longer the migration target.
    volatility: hot
    edges:
      - { to: merkle-patricia-trie, type: requires }
      - { to: secure-trie-hashed-keys, type: requires }
      - { to: binary-state-tree, type: deepens }
      - { to: verkle-is-off-the-roadmap, type: deepens }
      - { to: cold-vs-warm-access, type: applies }
    sources: [eip-7864, stateless-binary-tree]
    misconceptions:
      - belief: Verkle trees are Ethereum's next state format.
        reality: Verkle was superseded by EIP-7864's unified binary tree and is not the roadmap's migration target.
        why: Verkle was heavily promoted from 2021 to 2024 and dominates older explainer content.
        source: eip-7864
      - belief: A replacement is scheduled and will arrive with the next fork.
        reality: EIP-7864 is a draft, its hash function is still undecided, and it is not in any named fork's headline set.
        why: Roadmap diagrams flatten "proposed" and "scheduled" into one row.
        source: eip-7864
