moduleId: evm-transaction-types
concepts:
  - id: eip-2718-envelope
    title: Typed transaction envelope
    oneLine: A transaction is a one-byte type prefix followed by a type-specific payload, with type numbers restricted to 0x00-0x7f.
    statement: >
      EIP-2718 turned "a transaction" into a wrapper: a single leading byte naming the type, then a
      payload whose interpretation is defined by that type. Type numbers are restricted to the range
      `0x00`-`0x7f` so that a typed transaction's first byte can never be confused with the first
      byte of an RLP list, which is how legacy transactions remain decodable without a prefix. The
      envelope is what makes adding a transaction format a non-breaking change, and it is why the
      values inside the transactions and receipts tries are now `type-byte ‖ payload` rather than
      plain RLP.
    volatility: stable
    edges:
      - { to: rlp, type: requires }
      - { to: tx-and-receipt-tries-are-index-keyed, type: applies }
    sources: [eip-2718, execution-apis]
    misconceptions:
      - belief: There is "the" Ethereum transaction format.
        reality: Five envelope types coexist on mainnet today and a wallet, indexer or signer must handle all of them.
        why: Most tutorials describe one format, usually type-2.
        source: eip-2718

  - id: tx-type-0-legacy
    title: Legacy transaction (type 0x00)
    oneLine: The original untyped format — nonce, gasPrice, gasLimit, to, value, data, v, r, s — still valid and still broadcast.
    statement: >
      A legacy transaction is the pre-2021 format: `nonce, gasPrice, gasLimit, to, value, data`
      plus the signature `v, r, s`, RLP-encoded with no type prefix. It has a single `gasPrice`
      rather than the 1559 pair, and no access list. Since EIP-155 the chain id is folded into `v`
      to prevent cross-chain replay. Legacy transactions are not deprecated and are still accepted
      on mainnet, so any decoder that assumes a leading type byte will fail on real traffic.
    volatility: stable
    edges:
      - { to: eip-2718-envelope, type: requires }
      - { to: eip-155-chain-id-replay, type: requires }
      - { to: tx-type-2-1559, type: contrasts }
    sources: [eip-2718, execution-apis]
    misconceptions:
      - belief: Legacy type-0 transactions are deprecated and gone.
        reality: They are still valid and still broadcast; production code must handle them.
        why: Wallets default to type-2, so type-0 is invisible from the sending side.
        source: execution-apis

  - id: tx-type-1-access-list
    title: Access-list transaction (type 0x01)
    oneLine: EIP-2930 added an accessList of addresses and storage keys that are pre-warmed before execution.
    statement: >
      Type `0x01` is the legacy field set plus an explicit chain id and an `accessList`: a list of
      addresses, each with a list of storage keys, that are marked warm before execution begins. The
      sender pays a fixed charge per listed address and per listed key up front, and in exchange
      every access to those items during execution is charged the warm price instead of the cold
      one. It is a bet: worth taking when the listed items would definitely have been touched cold,
      a pure loss when they would not have been touched at all.
    volatility: stable
    edges:
      - { to: eip-2718-envelope, type: requires }
      - { to: cold-vs-warm-access, type: recommends }
      - { to: access-list, type: deepens }
    sources: [eip-2930, eip-2929]
    misconceptions:
      - belief: An access list always saves gas.
        reality: You pay per entry whether or not it is used; listing items you would not have touched costs more than it saves.
        why: It is presented as an optimisation rather than as a trade.
        source: eip-2930

  - id: tx-type-2-1559
    title: 1559 transaction (type 0x02)
    oneLine: Replaces gasPrice with maxFeePerGas and maxPriorityFeePerGas, and is the default envelope for ordinary transactions.
    statement: >
      Type `0x02` replaces the single `gasPrice` with two ceilings: `maxFeePerGas`, the most the
      sender will pay per unit of gas in total, and `maxPriorityFeePerGas`, the most of that which
      may go to the block proposer as a tip. The protocol-set base fee is burned; the proposer
      receives the smaller of the priority ceiling and whatever room remains under the total
      ceiling. This is the envelope wallets emit by default, and it carries the same access list
      field that type `0x01` introduced.
    volatility: stable
    edges:
      - { to: tx-type-1-access-list, type: requires }
      - { to: eip-1559-tfm, type: requires }
      - { to: base-fee-burn, type: deepens }
      - { to: eip-1559-fee-fields, type: deepens }
    sources: [execution-apis, eip-2718]
    misconceptions:
      - belief: maxFeePerGas is what you pay.
        reality: It is a ceiling. You pay the base fee plus the effective tip, and the difference is never charged.
        why: The pre-1559 gasPrice field really was the price paid.
        source: execution-apis

  - id: tx-type-3-blob
    title: Blob transaction (type 0x03)
    oneLine: EIP-4844's envelope — it carries versioned hashes of blob commitments and pays a separate blob fee on its own market.
    statement: >
      Type `0x03` extends the 1559 field set with `maxFeePerBlobGas` and a list of versioned hashes,
      one per attached blob. The blobs themselves travel alongside the transaction in a network
      wrapper and are never part of the payload the EVM sees or the execution layer stores
      long-term. A blob transaction pays ordinary execution gas for its calldata and computation
      *and* blob gas for its blobs, priced on an independent market. Blob transactions also live in
      a separate mempool with stricter client policy — most notably a much larger fee bump required
      to replace one, and no tolerance for nonce gaps.
    volatility: evolving
    edges:
      - { to: tx-type-2-1559, type: requires }
      - { to: blob, type: deepens }
      - { to: blob-pool-different-rules, type: deepens }
      - { to: blob-transaction, type: applies }
    sources: [eip-4844, execution-apis]
    misconceptions:
      - belief: A blob transaction is how you put cheap data in a contract.
        reality: The EVM cannot read blob contents at all. A contract sees only a 32-byte versioned hash.
        why: '"Cheap data on Ethereum" is heard as "cheap storage".'
        source: eip-4844

  - id: tx-type-4-setcode
    title: Set-code transaction (type 0x04)
    oneLine: EIP-7702's envelope — a 1559 transaction plus a non-empty authorization_list that installs delegation designators before the call runs.
    statement: >
      Type `0x04` is the 1559 field set plus an `authorization_list` that must contain at least one
      entry. Each entry is processed before the transaction's call, writing a delegation designator
      into the authorising account's code field. The sender of the transaction and the authorities
      in the list need not be the same party, so this envelope is the mechanism behind both
      self-delegation and sponsored delegation. Unlike type `0x03`, it has no separate fee market:
      authorizations are charged in ordinary execution gas.
    volatility: evolving
    edges:
      - { to: tx-type-2-1559, type: requires }
      - { to: set-code-transaction, type: requires }
      - { to: erc-5792-sendcalls, type: applies }
    sources: [eip-7702, execution-apis]
    misconceptions:
      - belief: A type-4 transaction is only for setting code and does nothing else.
        reality: It is a full 1559 transaction that happens to install authorizations first, so it can delegate and then immediately call in one go.
        why: The name describes the new field, not the whole envelope.
        source: eip-7702

  - id: separate-fee-markets
    title: Blob gas and execution gas are separate markets
    oneLine: Blob demand does not raise execution gas prices and execution demand does not raise blob prices; the two are priced independently by design.
    statement: >
      Blob gas has its own base fee, its own target and maximum per block, and its own update rule
      driven by the header's excess-blob-gas field. Execution gas has a separate base fee updated by
      the EIP-1559 rule from execution gas used. Neither market's congestion feeds into the other's
      price. This separation is the point of the design: it lets rollups buy data capacity without
      bidding against ordinary users for execution capacity, and it means a spike in one market is
      not evidence about the other.
    volatility: evolving
    edges:
      - { to: tx-type-3-blob, type: requires }
      - { to: eip-1559-tfm, type: requires }
      - { to: separate-blob-fee-market, type: deepens }
      - { to: blob-gas-market, type: applies }
    sources: [eip-4844, execution-apis]
    misconceptions:
      - belief: Blob transactions make ordinary transactions cheaper or more expensive.
        reality: The markets are independent by construction; blob demand does not move the execution base fee.
        why: Both are "gas", and both appear in the same block.
        source: eip-4844

  - id: nonce-ordering
    title: Strict nonce ordering
    oneLine: A sender's transactions execute in unbroken nonce order, so one unincludable transaction blocks every later one from that sender.
    statement: >
      Each account's nonce increments by exactly one per transaction it sends, and a transaction is
      only valid when its nonce equals the account's current nonce. There is no out-of-order
      execution and no skipping: a transaction with nonce n+1 cannot be included until n has been.
      A transaction that is underpriced, or stuck for any other reason, therefore stalls the entire
      queue behind it, and the only remedies are to replace it at the same nonce with a sufficient
      fee bump or to wait. EIP-7702 adds a wrinkle worth knowing: processing an authorization
      consumes a nonce from the authorising account.
    volatility: stable
    edges:
      - { to: tx-type-0-legacy, type: requires }
      - { to: nonce-total-ordering, type: requires }
      - { to: mempool-is-not-a-queue, type: requires }
      - { to: nonce-gap, type: deepens }
    sources: [execution-specs, execution-apis]
    misconceptions:
      - belief: A stuck transaction can be cancelled.
        reality: There is no cancel operation. You replace it at the same nonce, usually with a zero-value self-send, and the replacement must clear the client's fee-bump rule.
        why: '"Cancel" is offered as a button in wallet interfaces, which hides that it is a replacement.'
        source: execution-apis
