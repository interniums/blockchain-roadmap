moduleId: evm-yul-assembly
concepts:
  - id: yul-is-the-middle-layer
    title: Yul is the middle layer
    oneLine: A small language with one type, u256, and structured control flow — the thing inline `assembly` blocks are actually written in.
    statement: >
      Yul sits between Solidity and bytecode. It has a single value type — a 256-bit word — plus
      `let`, `if`, `switch`, `for`, and user-defined functions, and it exposes the EVM instruction set
      as built-in functions. Inline `assembly { ... }` blocks in a Solidity file are Yul, not raw
      bytecode, which means the compiler still allocates stack slots, still resolves jumps, and still
      applies the Yul optimizer to what you wrote. What it no longer does is check anything about
      meaning.
    volatility: stable
    edges:
      - { to: evm-execution-loop, type: requires }
      - { to: word-is-256-bits, type: requires }
      - { to: verbatim-escape-hatch, type: deepens }
    sources: [solidity-yul, solidity-inline-assembly]
    misconceptions:
      - belief: Inline assembly is raw bytecode.
        reality: It is Yul. Stack management, jump resolution and optimisation still happen; only the semantic guarantees are gone.
        why: '"Assembly" implies one-to-one correspondence with machine instructions.'
        source: solidity-yul

  - id: via-ir-pipeline
    title: The via-IR pipeline
    oneLine: Compile Solidity to Yul, optimise the Yul, then emit bytecode — usually better runtime gas, much slower compiles, and still not the default in 2026.
    statement: >
      `--via-ir` routes compilation through Yul: Solidity is lowered to IR, the Yul optimizer runs,
      and bytecode is emitted from the result. It typically produces better runtime gas than legacy
      codegen and compiles substantially more slowly. It is not the default: as of Solidity 0.8.36
      (July 2026) legacy codegen remains the compiler default and via-IR is opt-in. It is also not
      purely an optimisation — the compiler maintains a dedicated page of observable behaviour
      differences between the pipelines, so switching a production project requires re-running the
      full test suite, not just re-benchmarking.
    volatility: hot
    edges:
      - { to: yul-is-the-middle-layer, type: requires }
      - { to: stack-too-deep, type: applies }
      - { to: foundry-profiles, type: applies }
    sources: [solidity-ir-breaking-changes, solidity-via-ir-closer-look, solidity-0836-release]
    misconceptions:
      - belief: via-IR is the default now.
        reality: As of 0.8.36 legacy codegen is still the default; via-IR remains opt-in.
        why: It has been described as imminent since the 2023 Solidity Summit.
        source: solidity-0836-release
      - belief: via-IR only changes gas, not behaviour.
        reality: The compiler maintains an "IR-based Codegen Changes" page precisely because observable behaviour can differ.
        why: '"Optimizer" implies semantics-preserving.'
        source: solidity-ir-breaking-changes

  - id: verbatim-escape-hatch
    title: verbatim
    oneLine: Yul's instruction for injecting literal bytecode the compiler will not touch — the last resort below assembly, and opaque to every analysis tool.
    statement: >
      `verbatim` embeds a literal byte sequence into the output, taking a fixed number of stack inputs
      and producing a fixed number of outputs, and the optimizer is forbidden from reasoning about or
      rewriting it. It exists for things the compiler cannot express at all. Because the bytes are
      opaque, every downstream tool — the optimizer, decompilers, static analysers, verification
      tooling — sees nothing. Reaching for it should be rare enough that its presence in a diff is
      itself the review trigger.
    volatility: stable
    edges:
      - { to: yul-is-the-middle-layer, type: requires }
      - { to: assembly-removes-the-safety-net, type: deepens }
    sources: [solidity-yul]
    misconceptions:
      - belief: verbatim is just faster assembly.
        reality: It removes the compiler's ability to reason about the block at all, which also removes every tool's ability to.
        why: It looks like one more assembly built-in.
        source: solidity-yul

  - id: assembly-removes-the-safety-net
    title: Assembly removes the whole safety net
    oneLine: Inside an assembly block there are no overflow checks, no bounds checks, no type checks, no automatic revert bubbling and no ABI decoding.
    statement: >
      Solidity 0.8's guarantees are inserted by code generation, not enforced by the runtime, so none
      of them exist inside an assembly block. `add` wraps silently. There is no array bounds check.
      There is no type system beyond "everything is a word". An external call does not bubble a
      revert, does not decode return data, and does not check that the target has code. The pragma at
      the top of the file has no effect on any of this. The correct mental model is that an assembly
      block is a hole in the language, and everything the language was doing must be re-done by hand
      inside it.
    volatility: stable
    edges:
      - { to: yul-is-the-middle-layer, type: requires }
      - { to: three-failure-modes, type: requires }
    sources: [solidity-inline-assembly]
    misconceptions:
      - belief: Arithmetic in assembly is checked because the file says pragma solidity ^0.8.
        reality: 0.8's overflow checks are inserted by codegen and do not exist inside assembly; add wraps silently.
        why: The pragma feels like a global mode.
        source: solidity-inline-assembly

  - id: dirty-upper-bits
    title: Dirty upper bits
    oneLine: Values narrower than 32 bytes may carry garbage in their unused high bits; Solidity cleans them at defined points and assembly does not.
    statement: >
      An `address` occupies 20 bytes of a 32-byte word and a `uint8` occupies one, leaving unused high
      bits that are not guaranteed to be zero. Solidity inserts cleanup at defined points so that
      comparisons, hashes and ABI encoding behave as the type suggests. Assembly does not. A raw `eq`
      on two words holding the same address can therefore return false if one carries dirty high
      bits, and a `keccak256` over an uncleaned word hashes the garbage too. The fix is to mask
      explicitly — deriving the mask rather than pasting a constant, so the width is visible in the
      code.
    volatility: stable
    edges:
      - { to: word-is-256-bits, type: requires }
      - { to: assembly-removes-the-safety-net, type: requires }
    sources: [solidity-inline-assembly, solidity-yul]
    misconceptions:
      - belief: An address in a word is always zero-padded.
        reality: Only where the compiler has cleaned it. Values arriving from assembly, calldata slicing or arithmetic can carry dirty high bits.
        why: The type says 20 bytes, so 12 zero bytes feel implied.
        source: solidity-inline-assembly

  - id: signed-vs-unsigned-opcodes
    title: Signed and unsigned are different instructions
    oneLine: Yul exposes div/sdiv, mod/smod, lt/slt, gt/sgt and shr/sar separately, and choosing the wrong one is a silent correctness bug.
    statement: >
      The EVM has no type information, so signedness is a property of the instruction, not of the
      operand. Yul exposes both variants: `div` and `sdiv`, `mod` and `smod`, `lt` and `slt`, `gt` and
      `sgt`, `shr` and `sar`. Using the unsigned comparison on a value intended as signed treats a
      negative number as an enormous positive one, and nothing warns you — it compiles, it runs, and
      it produces a wrong answer only for the inputs nobody tested. This is one of the strongest
      arguments for keeping signed arithmetic out of assembly entirely.
    volatility: stable
    edges:
      - { to: assembly-removes-the-safety-net, type: requires }
      - { to: word-is-256-bits, type: requires }
    sources: [solidity-yul]
    misconceptions:
      - belief: The compiler picks the right comparison based on the variable's declared type.
        reality: Inside assembly there are no declared types; you choose the instruction and the choice is never checked.
        why: In Solidity proper the type does drive the operator.
        source: solidity-yul

  - id: raw-call-no-existence-check
    title: A raw call does not check the target has code
    oneLine: In assembly a `call` to an address with no code returns success; Solidity's high-level calls insert an EXTCODESIZE check that assembly drops.
    statement: >
      Calling an address with no code succeeds at the machine level: there is nothing to execute, so
      the frame returns immediately with success and empty return data. Solidity's high-level external
      calls guard against this by checking EXTCODESIZE first and reverting when it is zero, so that a
      call to a non-existent contract fails loudly. Assembly `call` does none of that, and neither
      does `delegatecall`. A function that returns a decoded value will therefore decode empty return
      data — which, given calldata-style zero-padding, can look like a perfectly valid zero.
    volatility: stable
    edges:
      - { to: call-returns-a-boolean, type: requires }
      - { to: assembly-removes-the-safety-net, type: requires }
      - { to: delegatecall-no-code-succeeds, type: deepens }
    sources: [solidity-inline-assembly]
    misconceptions:
      - belief: call in assembly behaves like a Solidity external call.
        reality: It performs no code-existence check, does not decode return data, and does not bubble reverts. You must do all three yourself.
        why: The name is the same.
        source: solidity-inline-assembly

  - id: solidity-memory-model-is-a-contract
    title: Solidity's memory conventions are a contract
    oneLine: The scratch space, free-memory pointer and zero slot are relied on by compiler-generated code, so assembly that breaks them corrupts code it never touched.
    statement: >
      Solidity's memory layout — `0x00`-`0x3f` scratch, `0x40` free-memory pointer, `0x60` permanently
      zero, allocations from `0x80` — is not a style guide. The compiler's own generated code reads and
      writes those locations. An assembly block that writes at `0x40` without meaning to, or allocates
      without advancing the pointer, or writes to `0x60`, corrupts data belonging to statements
      elsewhere in the function. The failure is non-local and usually silent: the symptom appears in
      code that is correct.
    volatility: stable
    edges:
      - { to: solidity-free-memory-pointer, type: requires }
      - { to: assembly-removes-the-safety-net, type: requires }
      - { to: memory-safe-annotation, type: deepens }
    sources: [solidity-layout-memory, solidity-inline-assembly]
    misconceptions:
      - belief: If my assembly works in tests, it respects the memory model.
        reality: Violations surface only when the optimizer's choices change, which can happen because of an edit somewhere else entirely.
        why: Tests exercise one compilation, and the bug is in a different one.
        source: ottersec-memory-safety

  - id: assembly-storage-access
    title: Storage is reached through .slot and .offset
    oneLine: Solidity storage variables are not directly addressable in assembly; you use x.slot and x.offset, and calldata arrays use x.offset and x.length.
    statement: >
      Naming a storage variable inside an assembly block does not give you its value — storage lives
      behind SLOAD and SSTORE, which take slot numbers. Solidity exposes the compile-time slot
      assignment as `x.slot`, and for a packed variable the byte offset within that slot as
      `x.offset`; you must do the shifting and masking yourself. Calldata arrays and slices similarly
      expose `x.offset` and `x.length` rather than their contents. Local memory variables, by
      contrast, do resolve directly, which makes the inconsistency easy to trip over.
    volatility: stable
    edges:
      - { to: assembly-removes-the-safety-net, type: requires }
      - { to: per-account-storage-trie, type: requires }
      - { to: storage-slot, type: requires }
      - { to: slot-packing, type: applies }
    sources: [solidity-inline-assembly, solidity-layout-storage]
    misconceptions:
      - belief: You can read a storage variable in assembly by naming it.
        reality: You need x.slot, plus x.offset for packed variables. Naming it directly is a compile error or means something else.
        why: Assembly looks like it shares the enclosing scope, and for memory locals it does.
        source: solidity-inline-assembly

  - id: memory-safe-annotation
    title: The memory-safe annotation
    oneLine: '`assembly ("memory-safe")` is a promise to the optimizer about which memory the block touches — not a check the compiler performs.'
    statement: >
      Annotating a block `("memory-safe")` asserts that it only touches memory it allocated itself,
      memory Solidity allocated that it legitimately references, the scratch space at `0x00`-`0x3f`,
      or temporary space beyond the free-memory pointer that it does not leave anything depending on.
      In exchange the optimizer is free to move stack values into memory around the block. The exact
      wording of the permitted regions matters and should be read from the documentation rather than
      paraphrased. A block that neither touches memory nor assigns to a memory variable is
      automatically memory-safe and needs no annotation at all.
    volatility: stable
    edges:
      - { to: solidity-memory-model-is-a-contract, type: requires }
      - { to: annotation-is-unverified, type: deepens }
    sources: [solidity-inline-assembly, solidity-forum-memory-safe]
    misconceptions:
      - belief: ("memory-safe") makes the compiler check your assembly.
        reality: It is an unchecked assertion the optimizer trusts.
        why: The syntax looks like a safety modifier.
        source: solidity-inline-assembly
      - belief: All inline assembly needs the annotation.
        reality: A block that neither touches memory nor assigns to a memory variable is automatically memory-safe.
        why: The rule is stated once in the docs and easy to miss.
        source: solidity-inline-assembly

  - id: unannotated-assembly-disables-optimizations
    title: An unannotated block taxes the whole compilation unit
    oneLine: Any assembly block that touches memory, without the annotation, globally disables stack-to-memory movement and memory optimisations.
    statement: >
      Omitting the annotation is safe for correctness and expensive for everything else. Because the
      compiler must assume an unannotated memory-touching block could write anywhere, it disables
      stack-to-memory movement and related memory optimisations across the entire compilation unit —
      not just around that block. One lazily unannotated block therefore degrades code that has
      nothing to do with it, which is the opposite of the local, conservative choice it appears to be.
    volatility: stable
    edges:
      - { to: memory-safe-annotation, type: requires }
      - { to: via-ir-pipeline, type: recommends }
    sources: [solidity-inline-assembly]
    misconceptions:
      - belief: Omitting the annotation is the safe default.
        reality: Safe for correctness, but it disables memory optimisations across the whole compilation unit.
        why: '"Not asserting anything" feels conservative.'
        source: solidity-inline-assembly

  - id: annotation-is-unverified
    title: A false annotation is undefined behaviour
    oneLine: If you annotate memory-safe and the claim is untrue, the result is undefined behaviour that typically does not show up in tests.
    statement: >
      Nothing verifies the annotation. If the claim is false, the optimizer may place a spilled stack
      value in memory the block then overwrites, and the resulting corruption depends on the
      optimizer's choices — which depend on the surrounding code, the optimizer settings, and the
      pipeline. That means a false annotation can compile correctly today and miscompile after an
      unrelated edit, with a green test suite on both sides. Audit firms have documented this failure
      mode concretely; it is the reason the annotation is treated as a claim requiring review rather
      than a keyword.
    volatility: stable
    edges:
      - { to: memory-safe-annotation, type: requires }
      - { to: assembly-cost-is-review-cost, type: deepens }
    sources: [ottersec-memory-safety, solidity-forum-memory-safe, solidity-inline-assembly]
    misconceptions:
      - belief: If the tests pass, the annotation was accurate.
        reality: The failure depends on optimizer decisions that can change with unrelated edits, so passing tests are not evidence.
        why: Tests are the normal way of establishing that something works.
        source: ottersec-memory-safety

  - id: when-assembly-is-justified
    title: When assembly is justified
    oneLine: Custom storage slots, proxy fallbacks, hot loops in widely reused libraries, and things Solidity cannot express — not gas-shaving ordinary logic.
    statement: >
      The defensible categories are narrow. Custom storage slots, because ERC-1967 and ERC-7201 slots
      are unreachable from the language. Proxy fallbacks, because forwarding arbitrary calldata and
      returning arbitrary return data cannot be typed. Hot paths in libraries reused by many projects,
      where the review cost is amortised across all of them. And operations the language simply cannot
      express. Ordinary application logic is not on the list: with the optimizer on, hand-written
      assembly frequently matches or loses to generated code, and the gap has narrowed with every
      release, so any claimed win must be measured before it is believed.
    volatility: stable
    edges:
      - { to: assembly-removes-the-safety-net, type: requires }
      - { to: erc-1967-slots, type: applies }
      - { to: erc-7201-namespaced-storage, type: applies }
      - { to: delegatecall-is-the-proxy-primitive, type: requires }
    sources: [erc-1967, erc-7201, solidity-via-ir-closer-look, solady]
    misconceptions:
      - belief: Assembly is always faster than Solidity.
        reality: With the optimizer on, especially via-IR, generated code frequently matches or beats hand-written assembly. Measure before claiming a win.
        why: Folk knowledge from 2018-2020, when codegen was much worse.
        source: solidity-via-ir-closer-look

  - id: assembly-cost-is-review-cost
    title: Assembly's real price is review cost
    oneLine: The cost is paid in audit hours and in the reviewers who can no longer read the contract — usually to optimise the risk that does not lose money.
    statement: >
      Gas is the visible price of assembly and the smaller one. The larger price is that fewer people
      on the team can read the contract, static analysis and verification tools understand less of it,
      and each block needs an expert reviewer. Set against loss data, this is usually the wrong
      optimisation: access control, not gas, dominates what actually loses money in practice. The rule
      that survives contact with a real codebase is that an assembly block needs a named category, a
      measured benefit, and a reviewer — and that a block failing any of the three should be Solidity.
    volatility: evolving
    edges:
      - { to: when-assembly-is-justified, type: requires }
      - { to: access-control-is-top-loss, type: applies }
      - { to: gas-folklore, type: contrasts }
    sources: [solidity-via-ir-closer-look, solady, ottersec-memory-safety]
    misconceptions:
      - belief: Optimising gas with assembly is a security-neutral decision.
        reality: It changes who can review the code and what tools can analyse it, which is itself a security decision.
        why: Gas and security are treated as separate axes.
        source: ottersec-memory-safety
