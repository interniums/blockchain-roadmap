moduleId: fundamentals-crypto
concepts:
  - id: hash-function
    title: Hash function
    oneLine: A deterministic map from arbitrary-length input to a fixed-length digest, cheap forward and infeasible to invert.
    statement: >
      A cryptographic hash function maps an input of any length to a fixed-length output
      deterministically: the same bytes always produce the same digest, and any change to the
      input produces an unrelated digest. It is cheap to compute forward and infeasible to
      invert. Ethereum's is `keccak256`, written `KEC` in the Yellow Paper, producing 32 bytes.
      A hash is not encryption: there is no key and no decryption, because the output is
      smaller than the input and information is destroyed by construction.
    volatility: stable
    edges:
      - { to: keccak-vs-sha3, type: deepens }
      - { to: preimage-resistance, type: deepens }
    sources: [yellow-paper]
    misconceptions:
      - belief: Hashing is a form of encryption, so a hash can in principle be decrypted.
        reality: A hash is lossy and keyless; there is nothing to decrypt, only a search for some input that produces the same digest.
        why: Both are filed under "cryptography" and both make data unreadable.
    paysOffIn: [abi-function-selector, merkle-patricia-trie, commitment-scheme]

  - id: preimage-resistance
    title: Preimage resistance
    oneLine: Given a digest, it is infeasible to find any input that hashes to it.
    statement: >
      Preimage resistance is the property that, given a *randomly chosen* digest `h`, no feasible
      computation finds any `m` with `hash(m) = h`. NIST names it the one-way property and puts its
      expected strength at the full digest length: `L` bits for an `L`-bit hash. It is the property
      most people mean when they say "hashes cannot be reversed". It says nothing about whether an
      attacker who already holds a message can find a second one with the same digest, and
      nothing about whether they can freely construct a colliding pair. The "randomly chosen" in the
      definition is load-bearing: preimage resistance is a statement about the *function* across the
      whole input space, not about your input, so a digest of a low-entropy value is recovered by
      enumeration, not by inversion.
    volatility: stable
    edges:
      - { to: hash-function, type: requires }
      - { to: second-preimage-resistance, type: contrasts }
    sources: [nist-sp-800-107, nist-fips-202]
    misconceptions:
      - belief: A hash of a secret is safe to publish because hashes cannot be reversed.
        reality: If the secret is drawn from a small set — a phone number, a price in whole dollars, an address from a known list — the attacker enumerates the set and hashes each candidate.
        why: Preimage resistance is defined over the full input space, not over your application's input space.
    paysOffIn: [hash-commitment, commitment-scheme, mev-encrypted-mempool]

  - id: second-preimage-resistance
    title: Second-preimage resistance
    oneLine: Given one message, it is infeasible to find a different message with the same digest.
    statement: >
      Second-preimage resistance is the property that, given a specific `m1`, no feasible
      computation finds `m2 != m1` with `hash(m2) = hash(m1)`. The attacker does not get to
      choose `m1`; it is handed to them. This is the property Merkle proofs depend on, and it
      is the property a Merkle tree breaks at the application level when leaves and internal
      nodes are hashed the same way — not because keccak256 is weak, but because two different
      *meanings* were fed into the same hashing rule.
    volatility: stable
    edges:
      - { to: preimage-resistance, type: requires }
      - { to: collision-resistance, type: contrasts }
      - { to: merkle-second-preimage, type: applies }
    sources: [nist-sp-800-107, rfc-6962]
    misconceptions:
      - belief: Second-preimage resistance and collision resistance are the same guarantee.
        reality: Collision resistance is strictly stronger — the attacker chooses both messages, which is far easier and is what birthday bounds apply to.
        why: Both are described informally as "no two inputs hash the same".
    paysOffIn: [merkle-patricia-trie, storage-proof-bridge]

  - id: collision-resistance
    title: Collision resistance
    oneLine: It is infeasible to find any pair of distinct inputs sharing a digest, with both inputs attacker-chosen.
    statement: >
      Collision resistance is the property that no feasible computation finds *any* pair
      `m1 != m2` with equal digests. Because the attacker chooses both messages, the birthday
      bound applies and the expected security level is half the digest length: NIST puts a
      256-bit hash at 128 bits of collision resistance against 256 bits of preimage and
      second-preimage resistance. Collision resistance is therefore the cheapest of the three to
      break, and it is the one doing the work every place the protocol treats a digest as an
      identity — a transaction hash, a Merkle root, a storage key.
    volatility: stable
    edges:
      - { to: second-preimage-resistance, type: requires }
      - { to: hash-function, type: requires }
    sources: [nist-sp-800-107, nist-fips-202]
    misconceptions:
      - belief: A 256-bit hash gives 256 bits of collision resistance.
        reality: It gives about 128 — the birthday bound halves it, because the attacker only needs any pair to match, not a specific target.
        why: Digest length is quoted as "the security level" without saying against which attack.
    paysOffIn: [abi-selector-collision-risk, merkle-patricia-trie, create2-address]

  - id: keccak-vs-sha3
    title: keccak256 is not SHA3-256
    oneLine: Ethereum's keccak256 is pre-standardisation Keccak; the same input yields a different digest than NIST SHA3-256.
    statement: >
      Ethereum adopted Keccak before NIST finalised FIPS 202 in August 2015, and
      standardisation added a domain-separation step that Ethereum never took. FIPS 202 defines
      `SHA3-256(M) = KECCAK[512](M ‖ 01, 256)`: a two-bit `01` suffix is appended to the message
      before Keccak's own padding rule runs, explicitly so that SHA-3 inputs cannot collide with
      other uses of the same permutation. For byte-aligned messages that suffix is what makes the
      first SHA-3 padding byte `0x06` (FIPS 202, Table 6), where pre-standardisation Keccak's is
      `0x01`. Same permutation, different domain padding — so `keccak256(x)` and `SHA3-256(x)`
      return different 32-byte values for the same `x`, and a library function named `sha3` may or
      may not be what Ethereum means depending on its vintage.
    volatility: stable
    edges:
      - { to: hash-function, type: requires }
    sources: [nist-fips-202, yellow-paper, sha3-vs-keccak]
    misconceptions:
      - belief: keccak256 is SHA-3, so any SHA-3 library will reproduce Ethereum's hashes.
        reality: The padding differs, so the digests differ; you need a Keccak implementation, not a SHA-3 one.
        why: Ethereum's choice predates NIST's 2015 finalisation and the name `sha3` stuck in early tooling.
        source: sha3-vs-keccak
    paysOffIn: [abi-function-selector, abi-canonical-signature, merkle-patricia-trie]

  - id: keypair
    title: Keypair
    oneLine: A private scalar plus the public curve point derived from it; the derivation runs one way only.
    statement: >
      A keypair is a randomly chosen private scalar `d` and the public point `Q = d·G`, where
      `G` is the curve's fixed generator. Deriving `Q` from `d` is one multiplication;
      recovering `d` from `Q` is the discrete-logarithm problem and is infeasible on
      secp256k1. An Ethereum address is not the public key — it is the last 20 bytes of
      `keccak256` of the 64-byte uncompressed public key, so the address is a lossy commitment
      to the key, and the key itself only becomes public when the account first signs.
    volatility: stable
    edges:
      - { to: hash-function, type: requires }
      - { to: ecdsa-secp256k1, type: deepens }
    sources: [yellow-paper]
    misconceptions:
      - belief: An address is the public key.
        reality: It is the low 20 bytes of the keccak256 hash of the public key; the key is not recoverable from the address.
        why: Both are hex blobs that identify the same account.
    paysOffIn: [account, account-four-fields, passkey-pubkey-must-be-registered]

  - id: ecdsa-secp256k1
    title: ECDSA over secp256k1
    oneLine: Ethereum's signature scheme; a signature is `(r, s, v)`, where `v` is what makes public-key recovery possible.
    statement: >
      Ethereum signs with ECDSA over the secp256k1 curve. A signature is the pair `(r, s)`
      plus a small recovery identifier `v`. Standard ECDSA verification takes a public key and
      answers yes or no; Ethereum instead *recovers* the signing public key from the signature
      and the message hash, which is why the protocol never needs to store or transmit public
      keys and why `v` exists at all. Signing is over a 32-byte hash, never over the message
      itself, so what you are authorising is entirely determined by what was hashed.
    volatility: stable
    edges:
      - { to: keypair, type: requires }
      - { to: ecrecover, type: applies }
      - { to: secp256r1-p256, type: contrasts }
    sources: [yellow-paper, eip-2]
    misconceptions:
      - belief: You sign a message.
        reality: You sign a 32-byte digest; the message only matters insofar as it determines the digest, which is why unstructured signing prompts are dangerous.
        why: Wallet UIs display a message, so the digest is invisible.
    paysOffIn: [delegation-designator, tx-type-0-legacy, signature-replay, permit2]

  - id: ecrecover
    title: ecrecover
    oneLine: The precompile that recovers a signer address from a hash and `(r, s, v)` — and returns `address(0)` on failure instead of reverting.
    statement: >
      `ecrecover` is a precompiled contract that takes a 32-byte hash and a signature and
      returns the 20-byte address of the recovering public key. Its failure mode is the thing
      to memorise: on a malformed or unrecoverable signature it returns `address(0)` rather
      than reverting. Any contract that compares the result against a stored address without
      first rejecting the zero address will authorise a garbage signature whenever that stored
      slot is uninitialised. `ecrecover` also performs no validation beyond recoverability: it
      does not enforce low-`s`, and it does not know what the hash means.
    volatility: stable
    edges:
      - { to: ecdsa-secp256k1, type: requires }
      - { to: signature-malleability, type: deepens }
    sources: [yellow-paper]
    misconceptions:
      - belief: ecrecover reverts on a bad signature.
        reality: It returns `address(0)`, which compares equal to any uninitialised owner or signer slot.
        why: The precompile calling convention predates custom errors and reverting return paths.
      - belief: If ecrecover returns a non-zero address, the signature is valid for my purpose.
        reality: It is valid over *some* digest; whether that digest is the one you meant is your job, which is what EIP-712 domain separation is for.
        why: The precompile has no notion of application context.
    paysOffIn: [signature-replay, signature-verification-failure, webauthn-onchain-reconstruction]

  - id: signature-malleability
    title: Signature malleability
    oneLine: For any valid `(r, s)`, `(r, n − s)` is also valid over the same message, so the bytes are not a unique identifier.
    statement: >
      ECDSA is algebraically symmetric about the x-axis: if `(r, s)` verifies over a message,
      so does `(r, n − s)` where `n` is the curve order, with the recovery identifier flipped.
      Both are genuine signatures by the same key over the same digest, and they have
      different bytes. Any system that treats the signature bytes as a unique identifier — a
      `usedSignatures[keccak256(sig)]` replay guard is the archetype — can be defeated by
      submitting the mirrored form. The correct replay key is derived from the *message*
      (a nonce, a digest), never from the signature.
    volatility: stable
    edges:
      - { to: ecdsa-secp256k1, type: requires }
      - { to: low-s-normalisation, type: deepens }
    sources: [eip-2, eip-2-malleability-thread, arxiv-signature-replay]
    misconceptions:
      - belief: A signature uniquely identifies an approval, so hashing it is a safe replay key.
        reality: '`(r, n − s)` is an equally valid signature over the same message, so two distinct byte strings represent one approval.'
        why: ECDSA's algebraic symmetry, which is invisible from the API surface.
        source: eip-2-malleability-thread
    paysOffIn: [signature-replay, permit2, tx-replacement-changes-the-hash]

  - id: low-s-normalisation
    title: Low-s normalisation
    oneLine: EIP-2 constrains transaction signatures to the low half of the curve order — but `ecrecover` does not enforce it, so contracts must.
    statement: >
      EIP-2 made a transaction invalid at the protocol level if its `s` value exceeds half the
      curve order, which removes malleability for transactions and therefore makes transaction
      hashes stable. That rule is enforced by the transaction validity check, not by the
      `ecrecover` precompile. A signature passed into a contract and recovered with
      `ecrecover` is accepted with either `s` value. So a contract that needs canonical
      signatures has to reject high-`s` itself; libraries such as OpenZeppelin's ECDSA do this
      for you, and hand-rolled verification usually does not.
    volatility: stable
    edges:
      - { to: signature-malleability, type: requires }
      - { to: ecrecover, type: applies }
    sources: [eip-2, eip-2-malleability-thread]
    misconceptions:
      - belief: EIP-2's low-s rule protects my contract.
        reality: It constrains transaction signatures at the protocol layer; `ecrecover` inside a contract enforces nothing.
        why: The two live at different layers and the EIP is usually read as "malleability is fixed".
        source: eip-2
    paysOffIn: [signature-replay, access-control-failure]

  - id: eip-712-typed-data
    title: EIP-712 typed structured data
    oneLine: A hashing scheme for structured payloads so a wallet can display what is being signed and bind it to one context.
    statement: >
      EIP-712 defines how to hash a typed struct so the digest is derived from a declared
      schema rather than from an opaque byte string. The final digest is
      `keccak256(0x19 || 0x01 || domainSeparator || hashStruct(message))`. Because the type
      string is part of the hash, the wallet can render field names and values to the user,
      and because the domain separator is part of the hash, the same struct signed for one
      chain or contract will not verify for another. It is a hashing convention only — it adds
      no new cryptography and the underlying signature is still ECDSA over secp256k1.
    volatility: stable
    edges:
      - { to: ecdsa-secp256k1, type: requires }
      - { to: hash-function, type: requires }
      - { to: domain-separator, type: deepens }
    sources: [eip-712, cyfrin-signature-standards]
    misconceptions:
      - belief: EIP-712 makes a signature more secure.
        reality: It makes the signed payload legible and context-bound; the cryptographic strength is identical to signing the same digest any other way.
        why: '"Typed data" sounds like a stronger scheme rather than a hashing convention.'
    paysOffIn: [permit2, signature-replay, webauthn-signed-payload]

  - id: domain-separator
    title: Domain separator
    oneLine: The EIP-712 field that scopes a signature to one chain, contract and version, so cross-domain replay fails by construction.
    statement: >
      The domain separator is a hash of an `EIP712Domain` struct that typically carries name,
      version, `chainId` and `verifyingContract`. It is mixed into every digest under that
      domain, so a signature produced for contract A on chain 1 produces a different digest
      than the same message for contract B or on chain 2, and therefore fails to recover the
      expected signer there. Two consequences follow: a separator cached at deploy time is
      wrong after a chain fork changes `chainId`, and omitting `verifyingContract` makes a
      signature valid across every deployment of the same code.
    volatility: stable
    edges:
      - { to: eip-712-typed-data, type: requires }
      - { to: signature-malleability, type: contrasts }
    sources: [eip-712, arxiv-signature-replay]
    misconceptions:
      - belief: A nonce is enough to stop signature replay.
        reality: A nonce stops replay within one contract on one chain; without a domain separator the same signature is still fresh on a sibling deployment or a forked chain.
        why: Replay is taught as a sequencing problem rather than a scoping problem.
        source: arxiv-signature-replay
    paysOffIn: [signature-replay, permit2, bridge-message-authority]

  - id: secp256r1-p256
    title: secp256r1 (P-256)
    oneLine: The NIST curve used by Secure Enclave, Android Keystore and WebAuthn — a different curve from Ethereum's secp256k1.
    statement: >
      secp256r1, also called P-256 or prime256v1, is the NIST curve that consumer secure
      hardware and the WebAuthn/FIDO2 stack use. It is a different curve from secp256k1 with
      different parameters; a P-256 signature cannot be verified by `ecrecover` and a
      secp256k1 key cannot be generated inside a passkey authenticator. This mismatch, not
      any protocol rule, is the historical reason passkeys could not directly control an
      Ethereum account.
    volatility: stable
    edges:
      - { to: keypair, type: requires }
      - { to: ecdsa-secp256k1, type: contrasts }
      - { to: p256verify-precompile, type: deepens }
    sources: [eip-7951]
    misconceptions:
      - belief: An elliptic curve signature is an elliptic curve signature; the curve is an implementation detail.
        reality: Verification is defined over specific curve parameters, so a verifier for one curve rejects the other outright.
        why: Both are "ECDSA" and the API shapes look identical.
    paysOffIn: [passkey-curve-mismatch, passkey-definition, webauthn-onchain-reconstruction]

  - id: p256verify-precompile
    title: The P256VERIFY precompile
    oneLine: EIP-7951 adds a precompile at address `0x100` that verifies secp256r1 signatures natively for 6900 gas.
    statement: >
      EIP-7951 specifies a precompile at address `0x100` that verifies a secp256r1 signature.
      It takes 160 bytes of input — message hash, `r`, `s`, and the public key's `x` and `y`
      coordinates — costs 6900 gas per the EIP, and signals success by returning a 32-byte
      word equal to one, returning empty data on failure rather than a zero word. It shipped
      to mainnet in the Fusaka upgrade of December 2025. Unlike `ecrecover` it verifies rather
      than recovers, so the public key must be supplied, which means a passkey-controlled
      account has to have registered its key on chain beforehand.
    volatility: evolving
    edges:
      - { to: secp256r1-p256, type: requires }
      - { to: ecrecover, type: contrasts }
    sources: [eip-7951, eip-7951-magicians]
    misconceptions:
      - belief: Passkeys cannot sign for Ethereum because they use the wrong curve.
        reality: True before Fusaka; since EIP-7951 shipped, secp256r1 verification is a 6900-gas precompile call.
        why: Every pre-2026 explanation of account abstraction says this, and it was correct when written.
        source: eip-7951
      - belief: P256VERIFY recovers the signer like ecrecover does.
        reality: It verifies against a supplied public key and returns success or failure; there is no recovery, so the key must be known in advance.
        why: '`ecrecover` is the only signature primitive most Solidity developers have used.'
        source: eip-7951
    paysOffIn: [passkey-definition, passkey-needs-smart-account, passkey-pubkey-must-be-registered]

  - id: commitment
    title: Commitment
    oneLine: A value that binds you to a secret without revealing it; it must be both hiding and binding.
    statement: >
      A commitment scheme lets one party publish a value now and reveal the underlying secret
      later, with two required properties. *Hiding*: the published value tells an observer
      nothing about the secret. *Binding*: the committer cannot later open the commitment to a
      different secret. Both properties are needed and they are independent — a scheme can be
      perfectly binding and not hiding at all, which is the usual failure. Commit-reveal
      protocols, sealed-bid auctions and the whole family of polynomial commitments used in
      proving systems are instances of this one shape.
    volatility: stable
    edges:
      - { to: hash-function, type: requires }
      - { to: hash-commitment, type: deepens }
    sources: [zcash-protocol-spec]
    misconceptions:
      - belief: Publishing a hash of your bid is a sealed bid.
        reality: Only if the bid space is large and salted; otherwise the "sealed" bid is recovered by hashing every plausible bid.
        why: Hiding is assumed to follow from preimage resistance, which is a property of the function, not of your input distribution.
    paysOffIn: [commitment-scheme, polynomial-commitment, mev-encrypted-mempool]

  - id: hash-commitment
    title: Hash commitment
    oneLine: '`keccak256(value ‖ salt)` — the salt supplies hiding, collision resistance supplies binding.'
    statement: >
      The simplest commitment is the hash of the value concatenated with a high-entropy salt.
      Binding comes from collision resistance: the committer cannot find a second
      `(value, salt)` pair with the same digest. Hiding comes entirely from the salt: without
      it, a low-entropy value is recovered by enumeration in milliseconds, so "commit to a
      number between 1 and 100" is not hiding at all. The salt must be revealed alongside the
      value at open time, and it must be per-commitment, not a constant.
    volatility: stable
    edges:
      - { to: commitment, type: requires }
      - { to: preimage-resistance, type: requires }
      - { to: collision-resistance, type: requires }
    sources: [zcash-protocol-spec, nist-sp-800-107]
    misconceptions:
      - belief: A hash commitment alone is hiding.
        reality: Without a salt, a low-entropy value is brute-forced instantly; the hash hides nothing an attacker can enumerate.
        why: '"One-way function" is heard as "nothing can be learned from the output".'
    paysOffIn: [commitment-scheme, mev-encrypted-mempool, mev-orderflow-auction]

  - id: merkle-tree
    title: Merkle tree
    oneLine: A binary tree of hashes whose single root commits to every leaf.
    statement: >
      A Merkle tree hashes data items into leaves, then repeatedly hashes pairs of nodes until
      one root remains. The root is a 32-byte commitment to the entire leaf set: changing any
      leaf changes the root, and finding a different leaf set with the same root requires a
      hash collision. What the root commits to is the *tree*, which is the leaf set plus its
      arrangement — so the construction rules (ordering, padding of odd levels, how leaves are
      encoded) are part of the commitment and must be fixed before the root means anything.
    volatility: stable
    edges:
      - { to: hash-function, type: requires }
      - { to: collision-resistance, type: requires }
      - { to: merkle-inclusion-proof, type: deepens }
      - { to: trie, type: contrasts }
    sources: [rfc-6962, nist-sp-800-107]
    misconceptions:
      - belief: The Merkle root commits to the set of items.
        reality: It commits to the tree — the items plus the arrangement and encoding rules — which is why two implementations that disagree on padding produce different roots for the same data.
        why: The root is described as "a fingerprint of the data".
    paysOffIn: [merkle-patricia-trie, ssz-merkleization, kzg-commitment]

  - id: merkle-inclusion-proof
    title: Merkle inclusion proof
    oneLine: The sibling hashes along one root-to-leaf path, letting a verifier confirm membership in O(log n) without the full set.
    statement: >
      To prove a leaf is in the tree, supply the leaf and the sibling hash at each level from
      the leaf up to the root. The verifier recomputes the path and checks that the result
      equals the known root. Proof size is logarithmic in the number of leaves, and the
      verifier never needs the other leaves. Crucially the proof shows only that *some* leaf
      hashing to that value exists in the tree; if the verifier does not also pin down what a
      leaf is allowed to look like, the proof proves less than it appears to.
    volatility: stable
    edges:
      - { to: merkle-tree, type: requires }
      - { to: merkle-second-preimage, type: deepens }
      - { to: exclusion-proof, type: contrasts }
    sources: [rfc-6962, oz-merkleproof-source]
    misconceptions:
      - belief: A valid inclusion proof means the claimed item was in the original data set.
        reality: It means some 32-byte value hashed into the tree at that position; whether that value is a legitimate leaf depends on the leaf encoding rule the verifier enforces.
        why: Verification returns a boolean and the boolean is read as a statement about the data.
    paysOffIn: [storage-proof-bridge, eth-getproof, ssz-merkleization]

  - id: merkle-second-preimage
    title: Merkle second-preimage attack
    oneLine: If leaves and internal nodes are hashed identically, a 64-byte "leaf" is a disguised internal node and proves membership of data never in the tree.
    statement: >
      In a tree where an internal node is `hash(left ‖ right)` — 64 bytes of input — and a leaf
      is `hash(leafData)`, an attacker who supplies 64 bytes of leaf data can make their
      "leaf" hash exactly as an internal node does. They then present the internal node's own
      children as a valid proof, and the verifier accepts membership for a value that was
      never a leaf. In Merkle-airdrop terms this yields a claim for an entry the tree never
      contained. The bug is in the tree construction and the leaf encoding, not in the proof
      library.
    volatility: stable
    edges:
      - { to: merkle-inclusion-proof, type: requires }
      - { to: second-preimage-resistance, type: requires }
      - { to: domain-separated-hashing, type: deepens }
    sources: [rfc-6962, oz-merkleproof-source, oz-merkleproof-issue-3091, rareskills-merkle-second-preimage, nethermind-merkle-second-preimage, fsa-merkle-airdrop-study]
    misconceptions:
      - belief: Using OpenZeppelin's MerkleProof makes proofs safe by default.
        reality: The library is sound; the tree construction is the caller's responsibility, and 64-byte leaf pre-images reintroduce the attack.
        why: Security is attributed to the verification function rather than to the encoding contract between prover and verifier.
        source: oz-merkleproof-issue-3091
    paysOffIn: [storage-proof-bridge, bridge-message-authority, access-control-failure]

  - id: sorted-pair-hashing
    title: Sorted-pair hashing
    oneLine: Sorting each hash pair before concatenation makes proofs order-independent — and is exactly what enables the 64-byte confusion.
    statement: >
      Many Solidity Merkle implementations hash `min(a,b) ‖ max(a,b)` at each level so the
      proof does not need to carry left/right position bits. This makes proofs smaller and
      verification simpler. The cost is that the tree loses positional information, so a node
      cannot be distinguished by where it sits, and the second-preimage confusion between a
      64-byte leaf and an internal node becomes exploitable rather than merely theoretical.
      The two design choices interact: sorted pairs are fine, but only alongside a leaf
      encoding that can never collide with the internal-node encoding.
    volatility: stable
    edges:
      - { to: merkle-inclusion-proof, type: requires }
      - { to: merkle-second-preimage, type: contrasts }
    sources: [oz-merkle-tree-js, oz-merkleproof-source, rareskills-merkle-second-preimage, c4-merkle-tree-extension]
    misconceptions:
      - belief: Sorting hash pairs is purely a convenience.
        reality: It removes the need to encode left/right, and in doing so couples directly to the second-preimage attack surface.
        why: It is presented in library docs as a gas optimisation with no security note attached.
        source: rareskills-merkle-second-preimage
    paysOffIn: [storage-proof-bridge, merkle-patricia-trie]

  - id: domain-separated-hashing
    title: Domain-separated hashing
    oneLine: Hash different kinds of thing differently — a prefix byte, a double hash, or a distinct function — so the two can never be confused.
    statement: >
      Domain separation means mixing a tag into the hash input that identifies what kind of
      object is being hashed, so that no byte string can be interpreted as two different kinds
      of object. In Merkle trees this is `hash(0x00 ‖ leaf)` for leaves and `hash(0x01 ‖ l ‖ r)`
      for internal nodes, or the double-hash convention `hash(hash(leaf))`. It is the same
      idea as EIP-712's domain separator and as the `0x19` prefix bytes: a hash means nothing
      until you fix what its input is allowed to represent.
    volatility: stable
    edges:
      - { to: merkle-second-preimage, type: requires }
      - { to: domain-separator, type: recommends }
    sources: [rfc-6962, oz-merkle-tree-js, eip-191, nethermind-merkle-second-preimage, rareskills-merkle-second-preimage]
    misconceptions:
      - belief: Domain separation is a formality that adds a byte for no reason.
        reality: It is the entire defence against type confusion in hashed data, and its absence is a repeatedly exploited bug class in airdrops and bridges.
        why: The extra byte has no visible effect until someone constructs the colliding interpretation.
        source: nethermind-merkle-second-preimage
    paysOffIn: [merkle-patricia-trie, ssz-merkleization, bridge-message-authority]
