moduleId: fundamentals-distributed
concepts:
  - id: state-machine-replication
    title: State machine replication
    oneLine: Every node runs the same deterministic transition function over the same ordered inputs, so they agree by construction rather than by voting on outcomes.
    statement: >
      In state machine replication, participants do not agree on the *result* of a
      computation; they agree on the *order of the inputs* and then each computes the result
      independently. Given identical starting state, an identical ordered input list and an
      identical transition function, every honest node must arrive at the identical new state.
      This is why the hard problem in a blockchain is ordering and not execution, why
      consensus is about which block comes next rather than about what the balances are, and
      why a client that disagrees about the resulting state root is by definition buggy.
    volatility: stable
    edges:
      - { to: determinism-requirement, type: deepens }
      - { to: byzantine-fault, type: deepens }
    sources: [eth2book-consensus]
    misconceptions:
      - belief: Nodes vote on what the balances should be.
        reality: They agree only on the ordered list of transactions; the balances follow mechanically and are never voted on.
        why: '"Consensus" suggests agreement about facts rather than agreement about sequence.'
    paysOffIn: [merkle-patricia-trie, node-two-process-model, indexer-is-a-deterministic-fold]

  - id: determinism-requirement
    title: The determinism requirement
    oneLine: Any non-determinism — wall clock, floating point, iteration order, randomness — splits the network, which is why the EVM has none of them.
    statement: >
      Replication only works if the transition function produces the same output on every
      machine, so every source of variation must be removed. The EVM therefore has no
      floating-point arithmetic, no access to the host clock or filesystem, no randomness that
      is not derived from consensus data, and no undefined ordering. The same requirement
      applies one level up to encoding and hashing: if two clients can serialize the same
      value differently, they compute different roots and the network forks. Anything a
      contract wants that is genuinely non-deterministic — real-world prices, off-chain
      randomness — must enter as an input that was itself ordered by consensus.
    volatility: stable
    edges:
      - { to: state-machine-replication, type: requires }
      - { to: canonical-serialization, type: requires }
    sources: [yellow-paper, eth2book-consensus]
    misconceptions:
      - belief: '`block.timestamp` gives the contract the current time.'
        reality: It gives a proposer-supplied value constrained by consensus rules; it is an ordered input, not a clock reading, and it has a manipulation range.
        why: The name matches an ordinary language primitive that does read a clock.
    paysOffIn: [oracle-manipulation, gas-is-a-countdown, invariant-as-spec]

  - id: byzantine-fault
    title: Byzantine fault
    oneLine: A participant that behaves arbitrarily, including maliciously and inconsistently, rather than merely crashing.
    statement: >
      Classical distributed systems mostly assume crash faults: a node either follows the
      protocol or stops. A Byzantine participant does neither — it may send different messages
      to different peers, equivocate, lie about what it has seen, or behave correctly right up
      until the moment deviation pays. Designing for Byzantine faults is what forces
      cryptographic authentication of every message, explicit thresholds like two-thirds, and
      penalties for provable contradiction. A protocol that is correct under crash faults can
      be trivially broken under Byzantine ones.
    volatility: stable
    edges:
      - { to: state-machine-replication, type: requires }
      - { to: safety-property, type: deepens }
    sources: [eth2book-consensus, bft-formal-verification]
    misconceptions:
      - belief: Byzantine means malicious.
        reality: It means arbitrary — a badly configured node sending contradictory messages is Byzantine without intending anything, which is exactly why slashing prices the behaviour rather than the motive.
        why: The historical framing is "traitorous generals".
    paysOffIn: [slashing-conditions, threat-model-document, sequencer-failure-severity]

  - id: safety-property
    title: Safety
    oneLine: '"Nothing bad happens" — two conflicting blocks are never both finalised.'
    statement: >
      A safety property says that a bad state is never reached, and it is violated by a
      specific observable event: for Ethereum's finality gadget, two conflicting checkpoints
      both being finalised. Safety violations are permanent — once the bad thing has happened,
      no amount of subsequent correct behaviour undoes it — which is why protocols buy safety
      with thresholds and with punishments that make violation attributable and expensive.
      Safety is the property a product depends on when it hands over something it cannot
      claw back.
    volatility: stable
    edges:
      - { to: byzantine-fault, type: requires }
      - { to: liveness-property, type: contrasts }
    sources: [eth2book-consensus, ebb-and-flow-paper]
    misconceptions:
      - belief: A chain halt is a safety failure.
        reality: A halt violates liveness; safety is intact precisely because nothing conflicting was finalised.
        why: Both look like "the chain is broken" from outside.
    paysOffIn: [accountable-safety, finality-vs-confirmations, tx-confirmation-policy-is-a-product-decision]

  - id: liveness-property
    title: Liveness
    oneLine: '"Something good eventually happens" — the chain keeps making progress.'
    statement: >
      A liveness property says that a desired event eventually occurs: new blocks are
      produced, transactions are eventually included, checkpoints are eventually finalised.
      Liveness failures are recoverable in a way safety failures are not — the chain stalls
      and then resumes — but "eventually" hides the thing that matters to a user, which is
      *how long*. Censorship is a liveness problem, not a safety one, which is why the
      defences against it look completely different: inclusion lists and forced-inclusion
      paths rather than slashing.
    volatility: stable
    edges:
      - { to: safety-property, type: contrasts }
      - { to: availability-finality-dilemma, type: deepens }
    sources: [eth2book-consensus, ebb-and-flow-paper]
    misconceptions:
      - belief: If my transaction is not getting in, consensus is broken.
        reality: Consensus is working; you are experiencing a liveness limitation for your particular transaction, which is a fee, policy or censorship question.
        why: Users experience inclusion and consensus as the same thing.
    paysOffIn: [forced-inclusion, inactivity-leak, sequencer-failure-severity]

  - id: availability-finality-dilemma
    title: The availability–finality dilemma
    oneLine: Under a network partition a protocol must choose — stay available and risk conflicting finalisation, or stay safe and stall.
    statement: >
      If the network partitions and nodes cannot tell a partition from silence, a consensus
      protocol faces a forced choice. Keep producing blocks on each side and you may finalise
      conflicting histories once the partition heals; refuse to proceed without a supermajority
      and you stall until it heals. This is a real theorem about the setting, and it is stated
      here in its own terms rather than as a corollary of CAP, which is routinely misapplied to
      blockchains. Ethereum's response is not to pick a side, which is what the next concepts
      are about.
    volatility: stable
    edges:
      - { to: safety-property, type: requires }
      - { to: liveness-property, type: requires }
      - { to: ebb-and-flow, type: deepens }
    sources: [ebb-and-flow-paper, eth2book-consensus]
    misconceptions:
      - belief: This is just the CAP theorem applied to blockchains.
        reality: CAP is about a different fault and consistency model; the availability–finality result is a separate statement proved for this setting, and the CAP framing quietly imports assumptions that do not hold.
        why: CAP is the one impossibility result most engineers already know.
        source: ebb-and-flow-paper
    paysOffIn: [finality-vs-confirmations, rollup-vs-validium, data-availability]

  - id: finality-is-a-spectrum
    title: Finality is a spectrum
    oneLine: '"Confirmed" is not binary — head, justified, finalised are three different guarantees with three different costs to reverse.'
    statement: >
      A transaction passes through several distinct states, each with a different reversal
      cost. Included in the head block: reversible by an ordinary reorg at near-zero cost.
      Included under a justified checkpoint: harder. Included under a finalised checkpoint:
      reversible only by an attack that destroys a large fraction of the total stake. None of
      these is "irreversible"; they are points on a cost curve. Choosing where on that curve
      your product acts is a risk decision that should be written down with the number
      attached, not inherited from whatever a tutorial used.
    volatility: evolving
    edges:
      - { to: availability-finality-dilemma, type: requires }
      - { to: casper-ffg, type: deepens }
      - { to: finality-reversal-cost-model, type: applies }
    sources: [ethereum-org-pos, eth2book-consensus]
    misconceptions:
      - belief: Finalised means irreversible.
        reality: It means reversal requires an attack whose price is at least a third of the total stake destroyed and publicly attributable — an economic claim, not a mathematical one.
        why: '"Final" is an absolute-sounding word and the alternative phrasing is much longer.'
        source: ethereum-org-pos
      - belief: Waiting N confirmations is the right policy on any chain.
        reality: N-confirmation heuristics come from probabilistic-finality chains; here there is an explicit finalised marker to query instead.
        why: The habit predates proof-of-stake finality and survived it.
    paysOffIn: [finality-vs-confirmations, tx-confirmations-vs-finality, tx-confirmation-policy-is-a-product-decision, reorg-depth-reality]

  - id: casper-ffg
    title: Casper FFG
    oneLine: The finality gadget — validators vote on epoch-boundary checkpoints, and a two-thirds supermajority justifies and then finalises them.
    statement: >
      Casper FFG is an overlay that runs on top of a block-producing chain. Validators cast
      votes linking a source checkpoint to a target checkpoint at epoch boundaries. When a
      link attracts a supermajority of stake the target becomes justified; when a justified
      checkpoint's own child is justified in turn, it becomes finalised. FFG supplies safety
      and accountability — the rules against equivocating votes are what make a safety
      violation provable and punishable — but it deliberately says nothing about which block
      is the head between checkpoints.
    volatility: evolving
    edges:
      - { to: finality-is-a-spectrum, type: requires }
      - { to: lmd-ghost, type: contrasts }
      - { to: accountable-safety, type: deepens }
    sources: [eth2book-casper-ffg, consensus-specs, two-ghosts-trench-coat]
    misconceptions:
      - belief: Casper FFG is the consensus protocol.
        reality: It is the finality half; a separate fork-choice rule picks the head, and the two together are the protocol.
        why: One name is easier to remember than two.
        source: two-ghosts-trench-coat
    paysOffIn: [casper-ffg, attestation, slot-and-epoch, finality-vs-confirmations]

  - id: lmd-ghost
    title: LMD-GHOST
    oneLine: The fork-choice rule that picks the head between finalised checkpoints, weighted by validators' latest messages.
    statement: >
      LMD-GHOST — Latest Message Driven Greediest Heaviest Observed SubTree — decides which
      branch is the head. Starting from the last justified checkpoint it repeatedly follows
      the child subtree carrying the most weight, where weight counts each validator's most
      recent attestation only. It supplies liveness: there is always a head, even when nothing
      is finalising. Because it depends on the latest messages a node has actually received,
      the head is a local computation and two well-behaved nodes can briefly disagree, which
      is what a short reorg is.
    volatility: evolving
    edges:
      - { to: casper-ffg, type: contrasts }
      - { to: propagation-latency, type: requires }
      - { to: ebb-and-flow, type: deepens }
    sources: [eth2book-consensus, two-ghosts-trench-coat, goldfish-paper]
    misconceptions:
      - belief: The longest chain wins.
        reality: The heaviest subtree by attestation weight wins, counting one latest message per validator; chain length is not the metric.
        why: The Nakamoto rule is the one most people learned first.
        source: two-ghosts-trench-coat
    paysOffIn: [lmd-ghost, fork-choice-purpose, proposer-boost, reorg-depth-in-practice]

  - id: ebb-and-flow
    title: Ebb and flow
    oneLine: Ethereum runs an available chain and a finalised chain at the same time, which is how it declines to pick a horn of the dilemma.
    statement: >
      Rather than choosing availability or finality, Ethereum exposes two chains derived from
      the same blocks. The available chain, given by the fork choice, keeps extending under
      partition and asynchrony but can reorg. The finalised chain, given by the finality
      gadget, stalls under partition but never reverts without a provable, punishable
      violation. A client can consult either. Products differ in which one they should use,
      and the answer follows from what the action costs to undo, not from a general preference.
    volatility: stable
    edges:
      - { to: availability-finality-dilemma, type: requires }
      - { to: casper-ffg, type: requires }
      - { to: lmd-ghost, type: requires }
    sources: [ebb-and-flow-paper, two-ghosts-trench-coat]
    misconceptions:
      - belief: Ethereum solved the availability–finality dilemma.
        reality: It sidesteps the forced choice by offering both chains and pushing the decision to the application; the underlying impossibility is untouched.
        why: "\"Resolution of the dilemma\" in the paper's title reads as \"the trade-off went away\"."
        source: ebb-and-flow-paper
    paysOffIn: [finality-vs-confirmations, rollup, tx-confirmation-policy-is-a-product-decision]
