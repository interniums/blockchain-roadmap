moduleId: fundamentals-encoding
concepts:
  - id: byte-word-32
    title: The 32-byte word
    oneLine: The EVM's native unit is a 256-bit word, and almost every layout rule in Ethereum follows from that one choice.
    statement: >
      The EVM is a 256-bit machine: stack items are 32 bytes, storage slots are 32 bytes, and
      memory is addressed in bytes but read and written a word at a time. This is why ABI
      arguments are padded to 32 bytes even when the type is a `uint8`, why a storage slot
      holds several small variables packed together, and why hashing a 32-byte-aligned
      structure is the cheap default. The word size was chosen to hold a keccak256 digest and
      a secp256k1 field element without splitting them.
    volatility: stable
    edges:
      - { to: abi-encoding, type: deepens }
    sources: [yellow-paper]
    misconceptions:
      - belief: Using `uint8` instead of `uint256` for a function argument saves calldata.
        reality: A standalone ABI argument is padded to a full 32-byte word regardless of its declared width; the saving only appears inside packed storage or packed encodings.
        why: Smaller type is assumed to mean smaller wire representation, which is true in most languages and false here.
    paysOffIn: [abi-head-tail, gas-is-a-countdown, abi-static-vs-dynamic]

  - id: endianness
    title: Endianness across the two layers
    oneLine: The execution layer is big-endian; SSZ integers on the consensus layer are little-endian.
    statement: >
      Byte order is a convention, and Ethereum uses two of them. Execution-layer values —
      numbers in RLP, ABI-encoded integers, EVM words — are big-endian, most significant byte
      first, which is why a `uint8` right-aligns inside its 32-byte word. SSZ, the consensus
      layer's encoding, serialises integers little-endian. Anything that crosses the boundary
      between the two layers, or that reimplements one layer's encoding using the other's
      primitives, has to convert explicitly, and forgetting to is a silent corruption rather
      than a parse error.
    volatility: stable
    edges:
      - { to: byte-word-32, type: requires }
      - { to: ssz, type: applies }
    sources: [yellow-paper, consensus-specs]
    misconceptions:
      - belief: Ethereum is big-endian, full stop.
        reality: The execution layer is; SSZ integers on the consensus layer are little-endian, so cross-layer tooling must convert.
        why: Most developers only ever touch the execution layer.
    paysOffIn: [ssz, blob-gas-fields, node-two-process-model]

  - id: abi-encoding
    title: ABI encoding
    oneLine: Each argument padded to 32 bytes, with dynamic types stored as an offset plus a length-prefixed payload elsewhere.
    statement: >
      The contract ABI encodes a call as a 4-byte selector followed by the arguments in a
      head-and-tail layout. Static types are written inline in the head, each padded to a full
      32-byte word. Dynamic types — `bytes`, `string`, variable arrays — write a 32-byte
      *offset* in the head and place a length word followed by the padded contents in the
      tail. Offsets are measured from the start of the argument block, not from the start of
      calldata, which is the detail that trips up hand-decoding. The encoding is unambiguous
      because every element is either fixed-width or length-prefixed.
    volatility: stable
    edges:
      - { to: byte-word-32, type: requires }
      - { to: function-selector, type: deepens }
      - { to: abi-encode-vs-packed, type: contrasts }
    sources: [solidity-abi-spec]
    misconceptions:
      - belief: A dynamic argument's offset is an absolute position in calldata.
        reality: It is relative to the start of the argument block, immediately after the selector — and inside a nested structure it is relative to the start of that structure.
        why: The first level happens to look absolute once you subtract four, so the rule seems simpler than it is.
        source: solidity-abi-spec
    paysOffIn: [abi-head-tail, abi-offsets-relative, abi-static-vs-dynamic, abi-decode-validates]

  - id: function-selector
    title: Function selector
    oneLine: The first 4 bytes of `keccak256("name(type1,type2)")` — which is why selectors can collide.
    statement: >
      A function selector is the leading 4 bytes of the keccak256 hash of the function's
      canonical signature: the name, then the parameter types in parentheses, with no spaces,
      no argument names, no return types, and canonical type spellings (`uint256`, not
      `uint`). Four bytes gives roughly 4.3 billion values, so distinct functions can and do
      collide; a contract with two colliding selectors will not compile, but a proxy routing
      between two separately compiled contracts can be made to collide deliberately. The
      return type is not hashed, so two functions differing only in what they return have the
      same selector.
    volatility: stable
    edges:
      - { to: abi-encoding, type: requires }
      - { to: hash-function, type: requires }
      - { to: collision-resistance, type: contrasts }
    sources: [solidity-abi-spec]
    misconceptions:
      - belief: A selector identifies a function uniquely.
        reality: It is a 4-byte truncation of a hash; collisions are findable by brute force in seconds and are a real attack surface in proxies and function-routing contracts.
        why: In practice you never see a collision by accident, so uniqueness feels guaranteed.
        source: solidity-abi-spec
    paysOffIn: [abi-function-selector, abi-canonical-signature, abi-selector-collision-risk, abi-dispatch]

  - id: abi-encode-vs-packed
    title: abi.encode versus abi.encodePacked
    oneLine: One pads and length-prefixes every element; the other concatenates tightly with no delimiters at all.
    statement: >
      `abi.encode` produces the standard layout: 32-byte alignment, offsets, length prefixes.
      `abi.encodePacked` concatenates the minimal byte representation of each argument with no
      padding, no length prefix and no separator, so a `uint8` contributes one byte and a
      `string` contributes exactly its bytes. Packed output is smaller and cheaper to hash,
      and it is not decodable — there is no way to recover the boundaries. That
      non-decodability is exactly the property that makes it unsafe to hash when more than one
      argument has variable length.
    volatility: stable
    edges:
      - { to: abi-encoding, type: requires }
      - { to: packed-hash-collision, type: deepens }
    sources: [solidity-abi-spec, nethermind-encodepacked-collisions]
    misconceptions:
      - belief: abi.encodePacked is just a cheaper abi.encode.
        reality: It is a lossy, non-self-delimiting encoding; with two or more dynamic arguments it is ambiguous, and hashing an ambiguous encoding is a live vulnerability class.
        why: The two functions sit next to each other in the docs and differ only by a word in the name.
        source: nethermind-encodepacked-collisions
    paysOffIn: [abi-packed-encoding, signature-replay, log-gas-model]

  - id: packed-hash-collision
    title: Packed-encoding hash collision
    oneLine: '`("AB","C")` and `("A","BC")` both pack to `"ABC"`, so their hashes are equal.'
    statement: >
      With two or more dynamic arguments, packed encoding loses the boundary between them, so
      distinct argument tuples produce identical byte strings and therefore identical hashes.
      Any check of the form `keccak256(abi.encodePacked(a, b))` — a role key, a permission
      hash, a signed message digest, a mapping key — can be satisfied by a different pair of
      inputs. This is not a hash weakness; keccak256 is doing exactly what it should on the
      bytes it was given. The fixes are `abi.encode`, or a fixed-length field, or an explicit
      delimiter that cannot occur in the data.
    volatility: stable
    edges:
      - { to: abi-encode-vs-packed, type: requires }
      - { to: collision-resistance, type: requires }
    sources: [nethermind-encodepacked-collisions, scsfg-abi-hash-collisions, kadenzipfel-hash-collision, solidity-abi-spec]
    misconceptions:
      - belief: This is a hash collision, so a stronger hash function would fix it.
        reality: The two inputs are literally the same byte string; no hash function distinguishes them. The ambiguity is in the encoding, one layer up.
        why: The word "collision" points at the hash rather than at the encoder.
        source: scsfg-abi-hash-collisions
    paysOffIn: [abi-packed-encoding, signature-replay, access-control-failure]

  - id: rlp
    title: RLP (Recursive Length Prefix)
    oneLine: 'The execution layer''s serialization: exactly two types — byte strings and lists — with length-prefix rules and nothing else.'
    statement: >
      RLP encodes exactly two things: a byte string, and a list of items each of which is
      itself RLP. It carries no type information beyond that distinction and no field names,
      so the meaning of the decoded structure comes entirely from the schema the reader
      already has. Short values encode as themselves or with a single prefix byte; longer ones
      carry a length-of-the-length. Transactions, block headers and every Merkle Patricia
      Trie node are RLP, which is why a raw transaction is a nested list of byte strings and
      why hand-decoding one is a tractable exercise.
    volatility: stable
    edges:
      - { to: byte-word-32, type: requires }
      - { to: ssz, type: contrasts }
      - { to: canonical-serialization, type: deepens }
    sources: [yellow-paper, kourin-rlp-ssz]
    misconceptions:
      - belief: RLP knows the difference between a number, an address and a string.
        reality: It knows byte strings and lists. `0x01` could be the integer one, a one-byte string, or a boolean; only the schema decides.
        why: Decoded output in tooling is rendered with types already applied.
        source: kourin-rlp-ssz
    paysOffIn: [tx-type-0-legacy, merkle-patricia-trie, tx-and-receipt-tries-are-index-keyed]

  - id: ssz
    title: SSZ (Simple Serialize)
    oneLine: 'The consensus layer''s encoding: a typed schema, little-endian integers, not self-describing, with Merkleization defined alongside.'
    statement: >
      SSZ is the consensus layer's canonical serialization. Unlike RLP it has a rich type
      system — fixed and variable-length vectors and lists, containers, bitfields, unsigned
      integers of declared width — and it is not self-describing: the decoder must already
      hold the type definition or it cannot parse the bytes at all. Integers are little-endian.
      SSZ also defines how each type is Merkleized, so serialization and hashing are one
      specification rather than two. The layer split holds as of writing — execution objects
      are RLP, consensus objects are SSZ — with peer discovery via discv5 as the shared
      exception that stayed RLP on both sides. Proposals to move execution-layer objects to
      SSZ are long-running; check the execution specs before claiming any object has moved.
    volatility: evolving
    edges:
      - { to: rlp, type: contrasts }
      - { to: endianness, type: requires }
      - { to: ssz-merkleization, type: deepens }
    sources: [consensus-specs, kourin-rlp-ssz, hackmd-ssz-vs-rlp]
    misconceptions:
      - belief: SSZ is self-describing like JSON or protobuf-with-descriptors.
        reality: The schema must be known in advance; the bytes alone do not tell you where one field ends.
        why: '"Simple serialize" sounds like a general-purpose interchange format.'
        source: hackmd-ssz-vs-rlp
      - belief: Ethereum has one serialization format.
        reality: Two, split by layer, plus discv5 as a deliberate exception.
        why: Most developers only ever see the execution layer, where everything is RLP.
        source: kourin-rlp-ssz
    paysOffIn: [ssz, blob-baseline, node-two-process-model]

  - id: ssz-merkleization
    title: SSZ Merkleization
    oneLine: SSZ defines hashing as part of the type, so Merkle roots and proofs fall out of the schema rather than being bolted on.
    statement: >
      For every SSZ type the specification also defines its hash tree root: fixed-size values
      are packed into 32-byte chunks and Merkleized, containers are Merkleized over their
      fields' roots, and lists mix in a length so that two lists of different lengths cannot
      share a root. Because the tree shape is determined by the declared type, any field's
      position in the tree is computable from the schema alone — which is what makes generic
      SSZ Merkle proofs, and therefore light-client proofs against a beacon state, possible
      without custom proof code per field.
    volatility: evolving
    edges:
      - { to: ssz, type: requires }
      - { to: merkle-tree, type: requires }
      - { to: merkle-inclusion-proof, type: applies }
    sources: [consensus-specs, hackmd-ssz-vs-rlp]
    misconceptions:
      - belief: Merkleizing a structure is a separate step you choose to apply after serializing it.
        reality: In SSZ the hash tree root is part of the type definition, and it is not simply the hash of the serialized bytes.
        why: In most systems hashing is applied to the output of serialization, which is not what SSZ does.
        source: consensus-specs
    paysOffIn: [ssz, data-availability-problem, storage-proof-bridge]

  - id: canonical-serialization
    title: Canonical serialization
    oneLine: Exactly one valid byte encoding per value — because two encodings of the same data hash differently, and different hashes split consensus.
    statement: >
      An encoding is canonical when each value has exactly one valid byte representation and
      decoders reject every other representation of it. RLP achieves this with strict rules —
      no leading zero bytes in integers, the shortest applicable length form, one way to
      encode a given string — and SSZ achieves it through fixed layouts derived from the type.
      This matters because the encoded bytes get hashed and the hash is the consensus object:
      if two clients can each produce a different-but-valid encoding of the same block, they
      compute different roots and the network splits. Determinism here is a security property,
      not tidiness.
    volatility: stable
    edges:
      - { to: rlp, type: requires }
      - { to: ssz, type: requires }
      - { to: determinism-requirement, type: applies }
    sources: [yellow-paper, consensus-specs]
    misconceptions:
      - belief: Serialization is a boring implementation detail.
        reality: A non-canonical encoding accepted by one client and rejected by another is a chain split; several real client-diversity incidents have had exactly this shape.
        why: In ordinary software, "it round-trips" is the whole requirement.
    paysOffIn: [merkle-patricia-trie, mpt-canonical-root, node-two-process-model]
