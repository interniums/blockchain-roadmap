moduleId: fundamentals-incentives
concepts:
  - id: mechanism-design
    title: Mechanism design
    oneLine: Designing the rules so that participants acting in pure self-interest produce the outcome you wanted — game theory run backwards.
    statement: >
      Game theory takes rules and predicts behaviour. Mechanism design takes desired behaviour
      and constructs rules that produce it, assuming every participant is rational and
      self-interested. This is the register Ethereum's own documentation writes in: a consensus
      mechanism is described as the whole stack of protocols *and incentives*, and its security is
      called crypto-economic — rewards and penalties applied to locked capital, which encourage
      honest operation and punish the rest. There is no operator to ban a misbehaving party, so
      any property you want must survive being the thing a profit-maximising participant is trying
      to break. When you read a protocol design, the first question is what each actor is
      optimising and what the rules pay them for.
    volatility: stable
    edges:
      - { to: byzantine-fault, type: requires }
      - { to: incentive-compatibility, type: deepens }
    sources: [ethereum-org-consensus-mechanisms, eip-1559, roughgarden-tfm]
    misconceptions:
      - belief: If a behaviour is against the rules, participants will not do it.
        reality: In a permissionless system a "rule" is only real if breaking it is detectable and costly; otherwise it is a suggestion.
        why: Every centralised system the reader has built had an operator who could enforce.
    paysOffIn: [mev-definition, mev-orderflow-auction, sequencer, threat-model-document]

  - id: incentive-compatibility
    title: Incentive compatibility
    oneLine: A mechanism where honest behaviour is each participant's best strategy, so honesty needs no enforcement.
    statement: >
      A mechanism is incentive compatible when following the protocol truthfully is at least as
      good for a participant as any deviation. If a mechanism has this property, you do not
      need monitoring or punishment for the deviations it covers — nobody wants to deviate. The
      qualifiers matter enormously: best against whom, under what assumptions about the other
      players, and over what time horizon. Most real disagreements about protocol design are
      disagreements about which qualifier the mechanism satisfies. No specification defines the
      term; it comes from the economics literature, and the treatment this track follows is
      Roughgarden's analysis of the Ethereum fee market.
    volatility: stable
    claimKind: empirical
    edges:
      - { to: mechanism-design, type: requires }
      - { to: dsic, type: deepens }
    sources: [roughgarden-tfm, roughgarden-tfm-arxiv]
    misconceptions:
      - belief: Incentive compatible means nobody can cheat.
        reality: It means nobody profits by cheating *within the modelled game*; profit from outside it — a short position, a bribe, a second protocol — is not covered.
        why: The term sounds absolute and the model boundary is rarely stated.
        source: roughgarden-tfm
    paysOffIn: [mev-definition, security-is-a-price, mev-solver-competition]

  - id: first-price-auction
    title: First-price auction
    oneLine: Bidders pay what they bid, so everyone must guess how far to shade their bid — strategically complex and wasteful.
    statement: >
      In a first-price auction the winner pays their own bid. Because bidding your true value
      wins you nothing, every bidder shades downward and must estimate what others will do.
      The result is bid-guessing rather than value-revealing, wasted effort, and frequent
      overpaying or losing by a hair. Ethereum's pre-1559 fee market was exactly this, which is
      why fee estimation was a hard product problem and why users routinely paid far more than
      the clearing price.
    volatility: stable
    edges:
      - { to: mechanism-design, type: requires }
      - { to: second-price-auction, type: contrasts }
    sources: [eip-1559, roughgarden-tfm, eip-1559-dynamics-arxiv]
    misconceptions:
      - belief: Users overpaid before EIP-1559 because gas was expensive.
        reality: They overpaid because a first-price auction forces bid-shading against an unknown distribution; the mechanism, not the price level, was the estimation problem.
        why: Both show up in the wallet as a large number.
        source: roughgarden-tfm
    paysOffIn: [eip-1559-fee-fields, mev-orderflow-auction, priority-fee-formula]

  - id: second-price-auction
    title: Second-price auction
    oneLine: Bidders pay the runner-up's bid, which makes truthful bidding dominant — and which a block producer can trivially game by inserting fake bids.
    statement: >
      In a second-price (Vickrey) auction the winner pays the second-highest bid, so bidding
      your true value is optimal regardless of what anyone else does. The textbook result
      assumes the auctioneer is a neutral third party. A block producer is not: they choose
      which bids are included and can insert their own, so they can raise the price the winner
      pays to just below the winner's bid and capture the difference. EIP-1559 treats that
      conflict of interest as real — it gives "removes miner incentive to manipulate the fee in
      order to extract more fees from users" as a reason for keeping the base fee out of the
      producer's hands. Whether the second-price family was ever formally on the table for
      Ethereum's fee market is not recorded in the EIP, so do not teach it as the reason 1559
      took the shape it did.
    volatility: stable
    edges:
      - { to: first-price-auction, type: contrasts }
      - { to: mmic, type: deepens }
    sources: [eip-1559, eip-1559-dynamics-arxiv, roughgarden-tfm]
    misconceptions:
      - belief: A second-price auction would have been the textbook-correct choice for gas.
        reality: Textbook second-price assumes the auctioneer is not also a bidder; the block producer is, and can insert fake bids to inflate what the winner pays.
        why: Vickrey auctions are taught with the neutrality assumption implicit.
        source: eip-1559-dynamics-arxiv
    paysOffIn: [mev-orderflow-auction, mev-pbs, mev-solver-competition]

  - id: dsic
    title: DSIC — dominant-strategy incentive compatibility
    oneLine: Truthful bidding is optimal for a user no matter what every other participant does.
    statement: >
      A mechanism is DSIC when a user's best action does not depend on other users' actions —
      they can bid their true value without modelling anyone. This is the user-facing property
      that makes fee estimation trivial: post what the transaction is worth to you and stop
      thinking. EIP-1559 was written for exactly this outcome — because per-block base-fee changes
      are bounded and therefore predictable, the EIP expects wallets to auto-set fees reliably and
      most users never to adjust them manually. Roughgarden's analysis adds the condition the EIP
      does not state: the property holds while the base fee is stable and is lost during sudden
      demand spikes, when the base fee has not yet caught up and tips become a real auction again.
      That exception is not a footnote: it is precisely the moment fee markets matter.
    volatility: stable
    edges:
      - { to: incentive-compatibility, type: requires }
      - { to: mmic, type: contrasts }
    sources: [eip-1559, roughgarden-tfm]
    misconceptions:
      - belief: EIP-1559 is incentive compatible, full stop.
        reality: DSIC holds except under sudden demand spikes, which is exactly when users most need it.
        why: The headline result is quoted without its condition.
        source: roughgarden-tfm
    paysOffIn: [eip-1559-fee-fields, tx-stuck-from-fee-cap, priority-fee-formula]

  - id: mmic
    title: MMIC — myopic miner incentive compatibility
    oneLine: The block producer cannot profit by deviating within a single block.
    statement: >
      MMIC asks a different question from DSIC: not whether users bid truthfully, but whether
      the party assembling the block can gain by breaking the rules for that block — inserting
      fake transactions, excluding real ones, or manipulating the price users pay. It is
      "myopic" because it only considers the current block and ignores multi-block strategies.
      The concern is written into EIP-1559 itself, which gives as a reason for burning the base
      fee that "ensuring the miner of a block does not receive the base fee is important because
      it removes miner incentive to manipulate the fee in order to extract more fees from users".
      The name and the formalisation are Roughgarden's; the property is what a second-price gas
      auction fails.
    volatility: stable
    edges:
      - { to: incentive-compatibility, type: requires }
      - { to: second-price-auction, type: applies }
      - { to: oca-proofness, type: deepens }
    sources: [eip-1559, roughgarden-tfm]
    misconceptions:
      - belief: Standard auction results transfer to blockchains with minor adjustments.
        reality: The auctioneer here is a self-interested participant who writes the record of the auction; MMIC and OCA-proofness exist because that case is not covered.
        why: The mechanism looks like an auction, so auction theory looks applicable.
        source: roughgarden-tfm
    paysOffIn: [mev-pbs, mev-builder, sequencer]

  - id: oca-proofness
    title: OCA-proofness
    oneLine: Off-chain-agreement proofness — no side deal between the block producer and users beats following the protocol.
    statement: >
      Even if a mechanism is safe against unilateral deviation, producer and users might do
      better by agreeing off-chain to a different arrangement and settling privately. A
      mechanism is OCA-proof when no such coalition can beat honest participation. This is the
      property that determines what happens to the base fee: if the producer received it, the
      producer and a user could always agree to bypass the mechanism and split the difference,
      so the base fee must go somewhere neither of them can reach. The off-chain-agreement
      argument is Roughgarden's rather than the EIP's — EIP-1559 gives producer manipulation, not
      producer–user side deals, as its stated reason for the burn.
    volatility: stable
    claimKind: empirical
    edges:
      - { to: mmic, type: requires }
      - { to: base-fee-burn, type: deepens }
    sources: [roughgarden-tfm, roughgarden-tfm-arxiv]
    misconceptions:
      - belief: If nobody can cheat alone, the mechanism is safe.
        reality: Producer and user can collude off-chain; the mechanism has to be robust to the coalition, not only to individuals.
        why: Incentive compatibility is usually taught as a per-player property.
        source: roughgarden-tfm
    paysOffIn: [mev-private-orderflow, mev-orderflow-auction, mev-pbs]

  - id: base-fee-burn
    title: Burning the base fee
    oneLine: The base fee is destroyed rather than paid to the producer — a mechanism-design requirement, not a monetary-policy choice.
    statement: >
      EIP-1559 burns the base fee. The reason is structural: if the producer received it, the
      producer and a user could always strike an off-chain deal — pay less on-chain, settle the
      rest privately — leaving both better off and destroying OCA-proofness. Sending the base
      fee somewhere neither party can capture removes that possibility. The supply effects that
      the burn also produces are a consequence, not the motivation, and treating them as the
      motivation makes the mechanism look like a policy lever it is not.
    volatility: stable
    edges:
      - { to: oca-proofness, type: requires }
      - { to: eip-1559-tfm, type: deepens }
    sources: [eip-1559, roughgarden-tfm]
    misconceptions:
      - belief: Burning the base fee is a monetary-policy decision.
        reality: It is a mechanism-design necessity — an unburned base fee paid to the producer destroys OCA-proofness.
        why: The supply effect is highly visible and the mechanism argument is not.
        source: roughgarden-tfm
    paysOffIn: [eip-1559-fee-fields, priority-fee-formula, l2-gross-vs-net-revenue]

  - id: eip-1559-tfm
    title: The EIP-1559 transaction fee mechanism
    oneLine: An algorithmically adjusted base fee that is burned, plus a priority tip that goes to the producer.
    statement: >
      Under EIP-1559 each block carries a base fee per gas set by the protocol, adjusted up or
      down from the previous block according to how full that block was relative to its target.
      Every transaction burns the base fee and pays an additional priority tip to the block
      producer, subject to a user-set maximum. The point was never to lower the average fee: it
      was to make fee *estimation* tractable — the base fee is announced, not guessed — and to
      make the mechanism resistant to producer manipulation.
    volatility: evolving
    edges:
      - { to: base-fee-burn, type: requires }
      - { to: dsic, type: applies }
    sources: [eip-1559, roughgarden-tfm, acm-eip1559-dynamics]
    misconceptions:
      - belief: EIP-1559 was about lowering fees.
        reality: It was about making fee estimation tractable and the mechanism manipulation-resistant; average cost was never the target and did not fall because of it.
        why: The change was announced to users as a fee-market upgrade.
        source: roughgarden-tfm
    paysOffIn: [eip-1559-fee-fields, priority-fee-formula, blob-gas-market, tx-stuck-from-fee-cap]

  - id: security-is-a-price
    title: Security is a price, not a proof
    oneLine: The claim is not that attacking is impossible; it is that attacking costs more than it earns, denominated in a volatile asset.
    statement: >
      Outside of cryptography, nothing about a blockchain's safety is a mathematical
      impossibility. Consensus-level guarantees are economic: an attack is possible and has a
      price, and the system is secure exactly to the extent that the price exceeds the payoff.
      Two things follow. The price is denominated in an asset whose value moves, so the
      security level moves with it. And the comparison is against the largest prize an attacker
      could take, which is a property of what has been built on top, not of the chain.
    volatility: evolving
    edges:
      - { to: incentive-compatibility, type: requires }
      - { to: safety-property, type: contrasts }
      - { to: cost-of-attack, type: deepens }
    sources: [ethereum-org-pos-attack-defense, ethereum-org-pos]
    misconceptions:
      - belief: A hash and a consensus guarantee are the same kind of guarantee.
        reality: Collision resistance is a computational claim; finality is an economic one. Confusing them makes attack analysis impossible.
        why: Both are described with the word "secure" and both are cited as reasons to trust the chain.
        source: ethereum-org-pos-attack-defense
    paysOffIn: [threat-model-document, bridge-is-the-honeypot, rollup-vs-validium, tx-confirmation-policy-is-a-product-decision]

  - id: cost-of-attack
    title: Cost of attack
    oneLine: Security expressed as a number — what violating a specific property would cost, against what violating it is worth.
    statement: >
      A cost-of-attack model names one property, describes concretely what an attacker must do
      to violate it, and prices that. There is no single "cost of attacking Ethereum": censoring
      a transaction, reorganising an unfinalised block and reversing a finalised checkpoint are
      three different actions with three different price tags, and quoting one as though it
      covered the others is the most common error in this area. A usable model states the
      threshold, the mechanism that charges the attacker, and the assumptions behind every
      input number.
    volatility: evolving
    edges:
      - { to: security-is-a-price, type: requires }
      - { to: attack-threshold-one-third, type: deepens }
    sources: [ethereum-org-pos-attack-defense]
    misconceptions:
      - belief: There is one number that is "the cost of attacking Ethereum".
        reality: Each violated property has its own price; censorship, unfinalised reorgs and finality reversal differ by orders of magnitude.
        why: Headlines quote a single dollar figure without naming the attack.
        source: ethereum-org-pos-attack-defense
    paysOffIn: [threat-model-document, bridge-is-the-honeypot, tx-confirmation-policy-is-a-product-decision]

  - id: pow-vs-pos-cost-asymmetry
    title: Rental versus burn
    oneLine: A proof-of-work 51% attack rents hashpower and keeps the hardware; a proof-of-stake attack destroys the stake, so the two numbers are not comparable.
    statement: >
      Under proof of work the attacker's cost is the rental price of enough hashpower for the
      duration of the attack, and the mining hardware survives to be used or sold afterwards.
      Under proof of stake a safety violation is provable and the offending stake is destroyed:
      the cost is permanently burned capital, not a rental fee, and the attacker cannot recover
      it. Comparing a proof-of-work attack budget with a proof-of-stake one as if they measured
      the same thing produces conclusions that are wrong in both directions.
    volatility: stable
    edges:
      - { to: security-is-a-price, type: requires }
      - { to: finality-reversal-cost-model, type: contrasts }
    sources: [ethereum-org-pos-attack-defense]
    misconceptions:
      - belief: A 51% attack is the canonical attack on any chain.
        reality: Under proof of stake, majority stake buys censorship and unfinalised reorgs, not finality reversal; the thresholds and the cost structure are both different.
        why: The proof-of-work mental model, where 51% is the only number anyone learned.
        source: ethereum-org-pos-attack-defense
    paysOffIn: [threat-model-document, reorg-depth-reality]

  - id: accountable-safety
    title: Accountable safety
    oneLine: If two conflicting checkpoints both finalise, at least a third of the total stake must have signed provably contradictory messages — and anyone can prove it.
    statement: >
      Casper FFG's voting rules are designed so that a safety violation is not merely detected
      but *attributed*. If two conflicting checkpoints are both finalised, the arithmetic of the
      supermajority requirements forces at least one third of the total stake to have signed a
      pair of messages that contradict each other under the slashing conditions. Those messages
      are public and self-incriminating: any observer can submit them and cause the offending
      stake to be destroyed. This is the property that turns a safety failure into a bill.
    volatility: stable
    edges:
      - { to: casper-ffg, type: requires }
      - { to: slashing-conditions, type: requires }
      - { to: finality-reversal-cost-model, type: deepens }
    sources: [ethereum-org-pos, consensus-specs, mikeneuder-slashings]
    misconceptions:
      - belief: The protocol detects an attack and responds to it.
        reality: The protocol produces evidence; someone has to submit it. Slashing is permissionless and reactive, not automatic surveillance.
        why: '"The protocol slashes you" is how it is usually phrased.'
    paysOffIn: [casper-ffg, finality-vs-confirmations, threat-model-document]

  - id: slashing-conditions
    title: The two slashing conditions
    oneLine: Exactly two slashable consensus offences exist — a double vote and a surround vote — and both require a signed, provable contradiction.
    statement: >
      A validator is slashable for exactly two things. A double vote: two different attestations
      for the same target epoch. A surround vote: one attestation whose source-to-target span
      strictly surrounds another's. Both are contradictions the validator signed, so the
      evidence is self-contained and anyone can submit it. Nothing else is slashable — being
      offline is not, being slow is not, running the wrong client is not. Slashing requires a
      signature on two incompatible claims.
    volatility: stable
    edges:
      - { to: casper-ffg, type: requires }
      - { to: byzantine-fault, type: requires }
      - { to: inactivity-leak, type: contrasts }
    sources: [consensus-specs, ethereum-org-pos-rewards-penalties]
    misconceptions:
      - belief: Slashing punishes downtime.
        reality: Downtime incurs an inactivity penalty roughly symmetric to the reward you would have earned; slashing requires a signed, provable contradiction.
        why: Staking providers market "no slashing" as an uptime claim.
        source: ethereum-org-pos-rewards-penalties
    paysOffIn: [attestation, threat-model-document]

  - id: attack-threshold-one-third
    title: The one-third threshold
    oneLine: Below a third of stake you cannot finalise conflicting checkpoints; at or above it you can, and the protocol makes you pay for it.
    statement: >
      One third of the total stake is the safety threshold. Below it, the supermajority
      requirements make conflicting finalisation impossible. At or above it, an attacker can
      finalise two conflicting checkpoints — and by accountable safety, doing so requires
      signing evidence that gets the attacking stake destroyed. A separate consequence of the
      same threshold: more than a third of stake going offline or refusing to vote prevents
      finalisation entirely, which is a liveness attack rather than a safety one and is
      answered by the inactivity leak.
    volatility: stable
    edges:
      - { to: accountable-safety, type: requires }
      - { to: attack-threshold-one-half, type: contrasts }
      - { to: inactivity-leak, type: deepens }
    sources: [ethereum-org-pos-attack-defense]
    misconceptions:
      - belief: A third of the stake is enough to rewrite history.
        reality: It is enough to finalise a conflicting checkpoint at the cost of that stake, and enough to stall finalisation; neither is free rewriting.
        why: Thresholds are quoted without saying which property they break.
        source: ethereum-org-pos-attack-defense
    paysOffIn: [finality-vs-confirmations, threat-model-document, rollup-vs-validium]

  - id: attack-threshold-one-half
    title: The one-half threshold
    oneLine: More than half the stake buys censorship, fork-choice control and reorgs of unfinalised blocks — but not a finality reversal.
    statement: >
      Majority stake gives control of the fork choice: the attacker can decide which
      unfinalised branch is heaviest, censor transactions by excluding them from their blocks
      and out-voting others, and reorganise recent unfinalised history. What it does not give
      is the ability to reverse a finalised checkpoint, because that requires conflicting
      finalisation and therefore the accountable one-third burn. These are different attacks
      with different price tags, and conflating them is the single most common error imported
      from proof-of-work intuition.
    volatility: stable
    edges:
      - { to: lmd-ghost, type: requires }
      - { to: attack-threshold-one-third, type: contrasts }
    sources: [ethereum-org-pos-attack-defense]
    misconceptions:
      - belief: A 51% attack lets you reverse finalised transactions.
        reality: It buys censorship, fork-choice control and reorgs of unfinalised blocks; reversing a finalised checkpoint requires conflicting finality, which costs a third of stake.
        why: The proof-of-work mental model, where 51% is the only number.
        source: ethereum-org-pos-attack-defense
    paysOffIn: [reorg-depth-reality, forced-inclusion, threat-model-document]

  - id: cheap-reorgs-exist
    title: Cheap reorgs exist
    oneLine: Short unfinalised reorgs are achievable well below a third of stake and cost nothing in slashing, which is why "finalised" and "included" are different product claims.
    statement: >
      Reorganisations of the most recent unfinalised blocks — ex-ante and ex-post reorgs,
      usually motivated by capturing value from a block someone else built — do not require a
      supermajority and do not trigger the slashing conditions, because they involve no signed
      contradiction. They are a documented, achievable class of behaviour at small stake
      fractions. For anyone building a product, this is the reason a transaction being in the
      head block is a much weaker claim than a transaction being under a finalised checkpoint,
      and the reason a confirmation policy has to distinguish them.
    volatility: evolving
    edges:
      - { to: attack-threshold-one-half, type: requires }
      - { to: lmd-ghost, type: requires }
      - { to: finality-reversal-cost-model, type: contrasts }
    sources: [low-cost-attacks-arxiv, ethereum-org-pos-attack-defense]
    misconceptions:
      - belief: You need a third of the stake to do anything harmful.
        reality: Short reorgs and some liveness attacks are demonstrated well below that threshold and carry no slashing cost.
        why: The famous thresholds are the ones people memorise, so smaller attacks look impossible.
        source: low-cost-attacks-arxiv
    paysOffIn: [reorg-depth-in-practice, reorg-safe-indexing, tx-reorg-effects, mev-definition]

  - id: slashing-initial-penalty
    title: The initial slashing penalty
    oneLine: On being slashed a validator immediately loses `effective_balance / MIN_SLASHING_PENALTY_QUOTIENT` — a quotient that was raised by orders of magnitude post-Electra.
    statement: >
      A slashed validator is charged an immediate penalty equal to its effective balance
      divided by a protocol constant, then ejected and made to wait out an exit period. Before
      the Electra upgrade that quotient was 32, so a 32 ETH validator lost about 1 ETH.
      Electra raised it dramatically, making the immediate cost of a lone slashing a small
      fraction of a percent of the balance. The exact post-Electra value is reported as 4096 by
      secondary sources and by a self-consistent derived anchor, but was not confirmed against
      consensus-specs in this project's research — read it out of `slash_validator` before
      quoting a number.
    volatility: evolving
    edges:
      - { to: slashing-conditions, type: requires }
      - { to: slashing-correlation-penalty, type: contrasts }
    sources: [eip-7251, mikeneuder-slashings, ethereum-org-pos-rewards-penalties, consensus-specs]
    misconceptions:
      - belief: Getting slashed means losing your whole stake.
        reality: A lone slashed validator loses the initial penalty plus small correlation and ejection costs — a fraction of a percent post-Electra. Total loss happens only under mass correlated slashing.
        why: Pre-2023 material quoted the old quotient, and slashing is routinely conflated with the inactivity leak.
        source: mikeneuder-slashings
      - belief: One validator equals 32 ETH, so validator count times 32 gives the staked total.
        reality: Since EIP-7251 effective balances range from 32 up to 2048 ETH; count and stake have decoupled and the numbers do not multiply.
        why: The 32 ETH figure is the most-repeated fact about Ethereum staking.
        source: eip-7251
    paysOffIn: [threat-model-document, finality-vs-confirmations]

  - id: slashing-correlation-penalty
    title: The correlation penalty
    oneLine: Some weeks after slashing, a validator is charged in proportion to how much stake was slashed alongside it — and at a third of total stake it loses everything.
    statement: >
      Well after the initial penalty, a second charge is applied that scales with the total
      balance slashed in a surrounding window: the more stake that was slashed at the same
      time, the larger each offender's share of the loss. The design target is unambiguous —
      when the slashed balance in the window reaches one third of total stake, the penalty
      consumes the offender's entire effective balance. The exact intermediate curve is not
      settled in this project's research: one analysis presents a linear form as current and a
      quadratic form as proposed, while a later secondary source claims the quadratic shipped.
      Both agree at the one-third point, so the headline holds either way; do not teach the
      curve between until `process_slashings` has been read.
    volatility: hot
    edges:
      - { to: slashing-initial-penalty, type: requires }
      - { to: finality-reversal-cost-model, type: deepens }
    sources: [mikeneuder-slashings, consensus-specs, ethereum-org-pos-rewards-penalties]
    misconceptions:
      - belief: The penalty for a given offence is a fixed amount.
        reality: It depends on what everyone else did in the same window; the same offence costs almost nothing alone and everything as part of a coordinated third.
        why: Penalties in ordinary systems are per-offence, not per-correlation.
        source: mikeneuder-slashings
    paysOffIn: [finality-vs-confirmations, threat-model-document]

  - id: slashing-is-anti-correlation-not-anti-error
    title: Slashing prices correlation, not mistakes
    oneLine: The two-tier design means a lone fat-fingered operator pays almost nothing while a coordinated third pays everything.
    statement: >
      Read together, the initial and correlation penalties encode a deliberate policy: an
      isolated slashing — a misconfigured client, two processes on one key — is an operational
      accident and is priced as one, while a large fraction of stake slashed simultaneously is
      an attack and is priced as one. The mechanism is not measuring how wrong you were; it is
      measuring how many people were wrong in the same way at the same time. This is why
      client and operator diversity is a security property rather than an aesthetic
      preference: correlated failure is what the penalty curve is aimed at.
    volatility: stable
    edges:
      - { to: slashing-initial-penalty, type: requires }
      - { to: slashing-correlation-penalty, type: requires }
      - { to: security-is-a-price, type: contrasts }
    sources: [mikeneuder-slashings, ethereum-org-pos-rewards-penalties]
    misconceptions:
      - belief: Slashing exists to punish careless validators.
        reality: It exists to make coordinated attack unaffordable; the careless-validator case is deliberately made cheap so that honest operation is not a lottery.
        why: A penalty naturally reads as punishment for the individual who incurred it.
        source: mikeneuder-slashings
    paysOffIn: [threat-model-document, node-two-process-model]

  - id: inactivity-leak
    title: The inactivity leak
    oneLine: If the chain fails to finalise for several epochs, non-participating validators bleed balance until the participating set is a supermajority again.
    statement: >
      When finalisation stalls for more than a few epochs, the protocol begins penalising
      validators that are not attesting to the chain, with the penalty growing over time. The
      effect is to shrink the non-participating share of stake until the remaining
      participants once again exceed the two-thirds needed to finalise. This is how a liveness
      attack by more than a third of stake is made to end rather than persist: the attacker
      does not need to be defeated, only outlasted, and the cost of being absent grows while
      they wait.
    volatility: stable
    edges:
      - { to: attack-threshold-one-third, type: requires }
      - { to: liveness-property, type: applies }
      - { to: slashing-conditions, type: contrasts }
    sources: [ethereum-org-pos-rewards-penalties, ethereum-org-pos-attack-defense]
    misconceptions:
      - belief: If a third of validators go offline the chain is stuck forever.
        reality: The inactivity leak drains the absent stake until the active set is a supermajority again; the stall is self-correcting at the cost of the absentees.
        why: The two-thirds requirement looks like a hard deadlock condition.
        source: ethereum-org-pos-attack-defense
    paysOffIn: [finality-vs-confirmations, sequencer-failure-severity]

  - id: finality-reversal-cost-model
    title: Pricing a finality reversal
    oneLine: Reverting a finalised checkpoint costs roughly one third of the total staked ETH, destroyed — quote it in ETH, never in fiat.
    statement: >
      The cost model follows from accountable safety plus the correlation penalty: finalising
      conflicting checkpoints requires roughly a third of total stake to sign contradictory
      messages, and at that level of correlated slashing the penalty takes the offenders'
      entire effective balances. So the anchor is one third of all staked ETH, burned and
      unrecoverable. Compute it from a live staked-supply figure at the time of use: reported
      August 2026 totals disagree between sources — roughly 41.4M ETH in one and "over 34M" in
      another — so a hardcoded number is wrong before it is published. Never bake in a fiat
      value.
    volatility: hot
    edges:
      - { to: accountable-safety, type: requires }
      - { to: slashing-correlation-penalty, type: requires }
      - { to: cost-of-corruption-vs-cost-of-capital, type: deepens }
    sources: [ethereum-org-pos-attack-defense, mikeneuder-slashings, theblock-staking-share]
    misconceptions:
      - belief: The cost of attacking Ethereum is a fixed dollar figure you can look up.
        reality: It is a fraction of a quantity that changes daily, priced in an asset whose value changes by the minute; the honest form is "one third of staked ETH, destroyed", computed when you need it.
        why: Comparisons across chains demand a single number, so one gets invented.
        source: ethereum-org-pos-attack-defense
    paysOffIn: [threat-model-document, bridge-is-the-honeypot, tx-confirmation-policy-is-a-product-decision]

  - id: cost-of-corruption-vs-cost-of-capital
    title: Cost of corruption versus cost of capital
    oneLine: Acquiring a third of the stake and destroying a third of the stake are different numbers, and the honest one is the destroyed one.
    statement: >
      Two figures get quoted interchangeably and should not be. The cost of *capital* is what
      it takes to acquire a third of the stake — and it ignores that buying that much of a
      liquid asset moves the price violently against the buyer long before they finish, and
      that entry queues make the accumulation slow and visible. The cost of *corruption* is
      what the attacker loses by attacking: the stake destroyed. Corruption is the honest
      framing for a security claim, because the attacker gets to keep an acquired position
      that they never use.
    volatility: evolving
    edges:
      - { to: finality-reversal-cost-model, type: requires }
      - { to: security-is-a-price, type: contrasts }
    sources: [ethereum-org-pos-attack-defense]
    misconceptions:
      - belief: The cost of attacking Ethereum is the market price of a third of the stake.
        reality: That is the cost of acquisition; the cost of corruption is the stake destroyed, and acquiring that much on the open market would move the price against you long before you got there.
        why: Headline comparisons quote market capitalisation because it is the easiest number to find.
        source: ethereum-org-pos-attack-defense
    paysOffIn: [threat-model-document, bridge-is-the-honeypot]

  - id: attack-cost-is-not-attack-profit
    title: Cost only binds against the largest prize
    oneLine: A security budget means nothing unless attacker profit is bounded — and a short position, a bridge, or an L2 exit window can unbound it.
    statement: >
      "Attacking costs more than it earns" is only a security argument if you can bound what it
      earns, and the payoff side is the half nobody measures. Ethereum's own attack-and-defense
      documentation makes the point for one case: a finality-delay attack has no direct profit
      motive *unless the attacker holds a strategic short position*, and a majority-stake attacker
      can extract MEV by reordering blocks. The same logic extends by construction to anything
      holding value that a reversed or reordered history would release — a bridge balance, an L2
      exit window — though no source consulted here prices those, so treat them as reasoning to
      carry out yourself rather than as figures to quote. The relevant comparison is not against
      the attacker's costs in isolation but against the largest extractable prize anyone has built
      on top of the chain, which grows without the chain's consent.
    volatility: evolving
    edges:
      - { to: security-is-a-price, type: requires }
      - { to: finality-reversal-cost-model, type: contrasts }
    sources: [ethereum-org-pos-attack-defense, low-cost-attacks-arxiv]
    misconceptions:
      - belief: If the attack costs more than it earns, the chain is safe.
        reality: The documented payoff channels already include a strategic short position and MEV from reordering; anything else built on top adds more. The budget only binds relative to the largest prize.
        why: The cost side is easy to measure and the profit side is not, so only the cost side gets quoted.
        source: ethereum-org-pos-attack-defense
    paysOffIn: [bridge-is-the-honeypot, threat-model-document, rollup-vs-validium]

  - id: social-layer-recovery
    title: Social-layer recovery
    oneLine: Against an attacker who holds enough stake, the last defence is out-of-band coordination on a minority fork — a governance act, not a protocol one.
    statement: >
      If an attacker controls enough stake to finalise conflicting checkpoints or to censor
      indefinitely, the remaining defence is not in the protocol: the community coordinates on
      a fork that treats the attacker's stake as slashed, and clients, exchanges and
      applications choose to follow it. This works only insofar as people agree on which chain
      is legitimate, which is a social process with all the failure modes of one. It is a real
      part of the security model and it is deliberately not automated, because automating it
      would hand whoever wrote the automation the power it protects against.
    volatility: evolving
    edges:
      - { to: accountable-safety, type: requires }
      - { to: security-is-a-price, type: contrasts }
    sources: [ethereum-org-pos-attack-defense]
    misconceptions:
      - belief: Everything about the chain's security is enforced by code.
        reality: The final backstop against a supermajority attacker is human coordination on which fork to follow; the protocol supplies the evidence, not the verdict.
        why: '"Code is law" is the slogan, and the social layer only becomes visible in a crisis.'
        source: ethereum-org-pos-attack-defense
    paysOffIn: [threat-model-document, bridge-is-the-honeypot]
