moduleId: fundamentals-networks
concepts:
  - id: p2p-overlay
    title: The peer-to-peer overlay
    oneLine: There is no server; each node keeps connections to a handful of peers, and the network is the union of those links.
    statement: >
      Ethereum's network is an overlay built on top of TCP and UDP: every node discovers a set
      of candidate peers, connects to a small number of them, and learns everything it knows
      about the chain from those connections. No node has a global view, no node is
      authoritative, and there is no directory to consult. Two consequences run through
      everything downstream: what a node believes depends on which peers it has, and any
      property you want the network to hold must survive a peer set an adversary may have
      influenced.
    volatility: evolving
    edges:
      - { to: devp2p, type: deepens }
      - { to: eclipse-attack, type: deepens }
    sources: [ethereum-org-networking-layer, devp2p-repo, consensus-specs-p2p, hitchhikers-p2p-overlays, eth2-p2p-measurement]
    misconceptions:
      - belief: An RPC provider is a window onto "the network".
        reality: It is a window onto that provider's nodes and their peer sets; two providers can disagree about what is pending and, briefly, about what the head is.
        why: The RPC interface looks like a database query against a single system.
    paysOffIn: [mempool-is-not-global, rpc-consistency-hazard, node-two-process-model]

  - id: devp2p
    title: devp2p
    oneLine: The execution layer's networking stack — the transport that carries transactions and blocks between execution clients.
    statement: >
      devp2p is the family of protocols execution clients use to talk to each other: an
      encrypted, authenticated transport (RLPx) carrying application subprotocols, of which
      `eth` is the one that announces and requests transactions, block headers and bodies.
      It is specified in its own repository rather than in the Yellow Paper or the EIPs, and
      it is the layer at which client-specific policy — how many peers, which transactions to
      forward, what to do with an announcement — lives. Much of what developers experience as
      "network behaviour" is this policy, not protocol rules.
    volatility: evolving
    edges:
      - { to: p2p-overlay, type: requires }
      - { to: discv5, type: deepens }
    sources: [devp2p-repo, devp2p-rlpx, devp2p-eth-wire, geth-cli-options, devp2p-issue-109]
    misconceptions:
      - belief: Everything a node does on the network is specified somewhere normative.
        reality: Transport and messages are specified; peering, forwarding and mempool admission are per-client policy that changes between releases.
        why: Consensus rules are rigorously specified, so the networking layer is assumed to be too.
    paysOffIn: [node-two-process-model, mempool-is-not-global, blob-pool-different-rules]

  - id: discv5
    title: discv5
    oneLine: The discovery protocol both layers share for finding peers — and it is still RLP-encoded even on the consensus side.
    statement: >
      Node discovery version 5 is the Kademlia-style protocol nodes use to find each other:
      records identifying a node and its capabilities are stored and looked up across a
      distributed table, and both the execution and consensus layers use it. It is the one
      shared piece of networking across the layer split, and it kept RLP as its encoding even
      though everything else on the consensus side is SSZ. Discovery is also where eclipse
      resistance is won or lost, because it determines the candidate set a node's peers are
      drawn from.
    volatility: evolving
    edges:
      - { to: devp2p, type: requires }
      - { to: eclipse-attack, type: applies }
      - { to: rlp, type: applies }
    sources: [devp2p-issue-109, devp2p-issue-161]
    misconceptions:
      - belief: The consensus layer uses SSZ for everything.
        reality: Discovery is shared with the execution layer and stayed on RLP; the SSZ boundary is not the same as the layer boundary.
        why: The RLP/SSZ split is taught as "execution versus consensus" without the exception.
        source: devp2p-issue-109
    paysOffIn: [node-two-process-model, checkpoint-sync]

  - id: gossipsub
    title: GossipSub
    oneLine: The consensus layer's pub/sub propagation protocol, designed for attack resilience rather than raw speed.
    statement: >
      GossipSub propagates messages over topic-based subscriptions: each node maintains a mesh
      of peers per topic, forwards new messages eagerly to its mesh, and gossips only message
      identifiers to peers outside it, so recipients can pull what they missed. Peer scoring
      lets a node demote or drop peers that misbehave. The design goal is to keep delivery
      working while a fraction of participants are actively hostile, which is a different
      objective from minimising latency and is why the protocol accepts redundant delivery.
    volatility: evolving
    edges:
      - { to: p2p-overlay, type: requires }
      - { to: propagation-latency, type: deepens }
    sources: [libp2p-gossipsub-v1-0, libp2p-gossipsub-v1-1, consensus-specs-p2p, gossipsub-paper]
    misconceptions:
      - belief: Gossip protocols are chosen because they are fast.
        reality: They are chosen because they degrade gracefully under adversarial peers; the redundancy that costs bandwidth is the feature.
        why: '"Gossip" implies casual and cheap rather than deliberate over-delivery.'
        source: gossipsub-paper
    paysOffIn: [attestation, mev-private-orderflow, node-two-process-model]

  - id: propagation-latency
    title: Propagation latency
    oneLine: A block or transaction reaches nodes at different times rather than all at once, and the slot schedule is written around that delay.
    statement: >
      Broadcasting an object does not make it globally known; it starts a wavefront that
      reaches nodes at different times depending on hop count, bandwidth and geography. The
      consensus schedule is written around that: a validator attests either when it has received
      a valid block from the expected proposer for its slot or when the attestation deadline has
      elapsed since the start of the slot, whichever comes first, and gossip validation carries an
      explicit half-second allowance for clock disparity between honest nodes. The size of the
      spread is a measured quantity rather than a protocol constant — network measurement studies
      put it in the hundreds of milliseconds — so treat it as an observation to re-check, not a
      number to hardcode. For anyone building on top, the consequence is that "the current state"
      is a per-node opinion for a window of time, and that anyone closer to the proposer than you
      are has information you do not yet have.
    volatility: evolving
    edges:
      - { to: gossipsub, type: requires }
      - { to: mempool-is-not-a-queue, type: deepens }
    sources: [consensus-specs-validator, consensus-specs-p2p, eth2-p2p-measurement, tikuna-monitoring]
    misconceptions:
      - belief: Once a transaction is broadcast, everyone has it.
        reality: Arrival is spread out in time — measured in hundreds of milliseconds on the consensus network — and a searcher with better connectivity sees it before the rest of the network does.
        why: A single `eth_sendRawTransaction` call returns immediately with a hash, which reads as completion.
    paysOffIn: [mev-sandwich, mev-searcher, tx-lifecycle-states, reorg-depth-in-practice]

  - id: mempool-is-not-a-queue
    title: The mempool is not a queue
    oneLine: Each node holds its own set of pending transactions, ordered by its own policy; there is no single global pending list.
    statement: >
      Every node keeps a local pool of transactions it has seen and chosen to keep, subject to
      its own limits, replacement rules and admission policy. Different nodes therefore hold
      different sets, in different orders, and a transaction can be in one and absent from
      another indefinitely. Nothing about the pool is FIFO: inclusion is chosen by whoever
      builds the block, using their own ordering. Two practical consequences: querying
      "pending" from one provider tells you about that provider, and a transaction that
      disappears from a pool was not necessarily dropped by the network.
    volatility: evolving
    edges:
      - { to: propagation-latency, type: requires }
      - { to: key-value-state, type: contrasts }
    sources: [geth-txpool, geth-cli-options, devp2p-eth-wire, tikuna-monitoring, hitchhikers-p2p-overlays]
    misconceptions:
      - belief: The mempool is a global waiting room and transactions leave it in order.
        reality: It is a per-node cache with per-client policy; ordering within a block is the builder's choice, not the pool's arrival order.
        why: Block explorers render a single "pending transactions" list, which looks like the queue.
    paysOffIn: [mempool-is-not-global, mempool-is-a-public-broadcast, tx-dropped, mev-definition]

  - id: eclipse-attack
    title: Eclipse attack
    oneLine: An attacker who controls all of a victim's peer connections controls the victim's entire view of the chain.
    statement: >
      In an eclipse attack the adversary fills every one of a target node's peer slots with
      nodes they control, usually by poisoning the discovery table so the victim's candidate
      set is entirely attacker-supplied. The victim is then fed a chosen version of reality:
      withheld blocks, stale heads, transactions that never propagate. No consensus rule is
      broken, because the victim is validating everything it receives correctly — it simply
      receives only what the attacker chose. Anything that trusts a single node's view, an
      exchange deposit check included, inherits this as a trust assumption.
    volatility: evolving
    edges:
      - { to: p2p-overlay, type: requires }
      - { to: sybil-resistance, type: deepens }
    sources: [eclipse-eth-paper, devp2p-issue-109, devp2p-issue-161]
    misconceptions:
      - belief: Running your own node removes trust assumptions.
        reality: It replaces trust in a provider with trust in your peer set; an eclipsed node is a confidently wrong node.
        why: "\"Don't trust, verify\" is heard as \"verification is unconditional\"."
        source: eclipse-eth-paper
    paysOffIn: [rpc-consistency-hazard, node-two-process-model, threat-model-document]

  - id: sybil-resistance
    title: Sybil resistance
    oneLine: Identities are free in a peer-to-peer network, so no protocol may assume that peer count implies distinct participants.
    statement: >
      Creating a node identity costs nothing but entropy, so an adversary can present
      thousands of apparently independent peers from one machine. Any rule of the form
      "if most of my peers say X" is therefore meaningless without something scarce behind
      each identity. Ethereum's answer is layered: consensus weight is bought with staked
      ETH rather than with node count, and the networking layer defends separately with
      discovery-table constraints, IP diversity requirements and peer scoring. Understanding
      the split matters, because networking-layer defences are heuristics while the consensus
      layer's scarcity is economic.
    volatility: evolving
    edges:
      - { to: eclipse-attack, type: requires }
      - { to: security-is-a-price, type: recommends }
    sources: [ethereum-org-consensus-mechanisms, discv5-rationale, libp2p-gossipsub-v1-1, eclipse-eth-paper, devp2p-issue-161]
    misconceptions:
      - belief: More peers means a more trustworthy majority view.
        reality: Peers are free to create; a thousand agreeing peers can be one adversary unless something scarce backs each identity.
        why: Majority voting is the intuitive way to aggregate opinions in a distributed system.
    paysOffIn: [security-is-a-price, threat-model-document, node-two-process-model]
