moduleId: fundamentals-state
concepts:
  - id: key-value-state
    title: The world state is a key-value map
    oneLine: Ethereum's world state maps address to account, and each contract account owns its own map from 32-byte slot to 32-byte value.
    statement: >
      Logically, Ethereum's state is two nested maps. The world state maps a 20-byte address to
      an account record. A contract account's record includes the root of its own storage trie,
      which maps a 32-byte slot key to a 32-byte value. There are no tables, no indexes and no
      iteration: you can look up a slot if you know its key, and nothing in the protocol lets
      you enumerate the keys a contract has written. Every convenience layer above this —
      "all holders of this token", "this account's history" — is reconstructed off-chain from
      events, not read from state.
    volatility: stable
    edges:
      - { to: trie, type: deepens }
    sources: [ethereum-org-mpt, yellow-paper]
    misconceptions:
      - belief: You can iterate a contract's storage or list every holder of a token.
        reality: State is a map keyed by hash with no enumeration; the "list of holders" you see anywhere came from indexing event logs.
        why: Block explorers present holder lists as if they were queried from the chain.
        source: ethereum-org-mpt
    paysOffIn: [account-four-fields, indexer-why, eth-getproof, account-model-leaks-everything]

  - id: trie
    title: Trie
    oneLine: A prefix tree where a value's position in the structure encodes its key, instead of the key being stored in a node.
    statement: >
      In a trie, you find a value by consuming the key one symbol at a time and descending
      accordingly; the path you walked *is* the key, so no node needs to store the key itself.
      Two keys sharing a prefix share the top of their path, which is what makes prefix
      compression possible and what makes proving absence possible: you walk as far as the key
      takes you and show that the structure ends there. A Merkle tree gives neither of those —
      it commits to a list, not to a key space.
    volatility: stable
    edges:
      - { to: key-value-state, type: requires }
      - { to: merkle-tree, type: contrasts }
      - { to: mpt-four-node-types, type: deepens }
    sources: [ethereum-org-mpt, lambdaclass-mpt]
    misconceptions:
      - belief: The trie stores keys at its nodes.
        reality: The path through the trie is the key; nodes store structure, prefix fragments and values.
        why: Every other tree structure most engineers have used stores keys in nodes.
        source: lambdaclass-mpt
      - belief: A Merkle tree and a Patricia trie are the same thing.
        reality: The trie gives key-addressed lookup and exclusion proofs; a plain Merkle tree gives neither.
        why: Both are hash trees and the names are used loosely.
    paysOffIn: [merkle-patricia-trie, eth-getproof, statelessness]

  - id: mpt-four-node-types
    title: Four node types, no fifth
    oneLine: An MPT node is exactly one of NULL, branch (17 items), extension (2 items) or leaf (2 items).
    statement: >
      The Merkle Patricia Trie has exactly four node kinds. NULL is the empty node. A branch is
      a 17-item RLP list. An extension is a 2-item list holding a shared path fragment and a
      child reference. A leaf is a 2-item list holding the remaining path and a value. There is
      no fifth kind and no optional variant, and a decoder distinguishes branch from the other
      two by item count alone — which means the entire structure is decidable from the RLP
      shape plus one nibble.
    volatility: stable
    edges:
      - { to: trie, type: requires }
      - { to: rlp, type: requires }
      - { to: merkle-tree, type: contrasts }
      - { to: mpt-branch-node, type: deepens }
    sources: [ethereum-org-mpt, yellow-paper, execution-specs]
    misconceptions:
      - belief: The trie is a Merkle tree with a key lookup bolted on.
        reality: It is a radix trie whose edges are hash-linked; the root commits to the set of key-value pairs and no structural freedom exists.
        why: '"Merkle" is the loud word in the name.'
        source: yellow-paper
    paysOffIn: [merkle-patricia-trie, eth-getproof, statelessness]

  - id: mpt-null-node
    title: The NULL node and the empty trie
    oneLine: The empty node is the empty string, RLP `0x80`, so the empty trie's root is `keccak256(rlp(""))`.
    statement: >
      NULL is represented as the empty byte string, whose RLP encoding is the single byte
      `0x80`. The root of an empty trie is therefore the keccak256 hash of that single byte —
      a fixed 32-byte constant that appears in every genesis-adjacent context and in the
      account record of every contract that has never written storage. Compute the constant
      locally rather than copying a quoted value: the figure that circulates in secondary
      sources was not confirmed against a primary spec file in this project's research, though
      the derivation is unambiguous.
    volatility: stable
    edges:
      - { to: mpt-four-node-types, type: requires }
      - { to: rlp, type: requires }
      - { to: hash-function, type: requires }
    sources: [ethereum-org-mpt, execution-specs]
    misconceptions:
      - belief: An empty trie has a zero root.
        reality: It has the keccak256 of RLP-encoded empty string; a zero root would be indistinguishable from an uninitialised field.
        why: Empty containers usually serialize to something zero-like.
    paysOffIn: [account-four-fields, account-code-hash, eth-getproof]

  - id: nibble
    title: Nibble
    oneLine: Half a byte, four bits — the MPT's traversal unit, which is why a branch node has sixteen slots.
    statement: >
      A nibble is four bits, one hexadecimal character, sixteen possible values. The MPT
      consumes keys a nibble at a time rather than a byte at a time, so each level of the
      structure has a fan-out of sixteen rather than 256. This is a direct trade: sixteen-way
      branching keeps nodes small enough to be practical while making paths four times shorter
      than a binary walk would. Every "why sixteen?" question about branch nodes answers to
      this choice.
    volatility: stable
    edges:
      - { to: trie, type: requires }
      - { to: mpt-nibble-path, type: deepens }
    sources: [ethereum-org-mpt]
    misconceptions:
      - belief: Nibbles are an encoding quirk you can ignore when implementing.
        reality: Path length, branch width, the hex-prefix flag and the odd/even padding rule all follow from the nibble being the unit; a byte-wise implementation produces a different root.
        why: The key is bytes on the way in and bytes on the way out, so the nibble stage looks like an internal detail.
    paysOffIn: [merkle-patricia-trie, eth-getproof]

  - id: mpt-nibble-path
    title: The nibble path
    oneLine: A 32-byte key is a 64-step path, and every branch node along it fans out sixteen ways.
    statement: >
      Because traversal consumes one nibble per level, a 32-byte key produces a path of exactly
      64 steps and a 20-byte key one of 40. In the state and storage tries the key is a
      keccak256 digest, so every path is exactly 64 nibbles long — the depth of the structure
      is bounded and uniform, and no key can be chosen to make its own path longer. Actual node
      depth is much shallower than 64 because extension nodes collapse shared runs.
    volatility: stable
    edges:
      - { to: nibble, type: requires }
      - { to: mpt-four-node-types, type: requires }
      - { to: mpt-secure-trie, type: deepens }
    sources: [ethereum-org-mpt, execution-specs]
    misconceptions:
      - belief: A 64-nibble path means 64 nodes to fetch in a proof.
        reality: Extension nodes compress every run of nibbles shared by all keys below them, so real proofs are a handful of nodes deep, not 64.
        why: Path length and node count are conflated.
    paysOffIn: [eth-getproof, merkle-patricia-trie, storage-proof-bridge]

  - id: mpt-branch-node
    title: Branch node
    oneLine: A 17-item list — sixteen child slots indexed by the next nibble, plus a seventeenth holding the value of a key that ends exactly here.
    statement: >
      A branch node is the RLP list `[v0, v1, ... v15, value]`. Slots 0 through 15 hold child
      references indexed by the next nibble of the key; unused slots hold the empty string. The
      seventeenth item holds a value for a key whose path terminates at this node — possible
      when one key is a strict prefix of another, which cannot occur in the fixed-length secure
      tries but can in the index-keyed ones. A branch node is the only 17-item node in the
      structure, so item count alone identifies it.
    volatility: stable
    edges:
      - { to: mpt-nibble-path, type: requires }
      - { to: rlp, type: requires }
      - { to: mpt-extension-node, type: contrasts }
    sources: [ethereum-org-mpt, yellow-paper, execution-specs]
    misconceptions:
      - belief: The seventeenth slot is padding or a version marker.
        reality: It is the value of a key that terminates at this exact node, which is the whole reason a branch is 17 items and not 16.
        why: Sixteen children matches the nibble intuition and the extra slot looks vestigial.
        source: ethereum-org-mpt
    paysOffIn: [merkle-patricia-trie, eth-getproof, tx-and-receipt-tries-are-index-keyed]

  - id: mpt-extension-node
    title: Extension node
    oneLine: A 2-item list `[hexPrefix(sharedNibbles, false), childRef]` whose only job is to compress a run of nibbles every key below it shares.
    statement: >
      An extension node holds a hex-prefix-encoded path fragment and one child reference. It
      exists so that a run of nibbles common to every key in a subtree costs one node instead
      of one branch per nibble. The rule that makes the structure canonical is the corollary:
      no branch node may ever have exactly one non-empty child, because that situation must be
      collapsed into an extension. Extension nodes are not an optimisation you may skip — skip
      them and your root differs.
    volatility: stable
    edges:
      - { to: hex-prefix-encoding, type: requires }
      - { to: mpt-branch-node, type: requires }
      - { to: mpt-child-reference-rule, type: recommends }
      - { to: mpt-leaf-node, type: contrasts }
    sources: [ethereum-org-mpt, yellow-paper, geth-trie-package]
    misconceptions:
      - belief: Extension nodes are an optimisation you can leave out of a simple implementation.
        reality: They are mandatory — the canonical form forbids a branch with a single non-empty child, so omitting them changes the root hash.
        why: In most tree code, path compression genuinely is optional.
        source: ethereum-org-mpt
    paysOffIn: [merkle-patricia-trie, eth-getproof]

  - id: mpt-leaf-node
    title: Leaf node
    oneLine: A 2-item list `[hexPrefix(remainingNibbles, true), value]` — and the terminator flag is the only thing distinguishing it from an extension on the wire.
    statement: >
      A leaf node holds the remaining unconsumed nibbles of the key, hex-prefix encoded with
      the terminator flag set, and the value itself. Structurally it is the same shape as an
      extension node: a 2-item RLP list. The single nibble at the front of item 0 is what tells
      a decoder which it is reading, and therefore whether item 1 is a value or a child
      reference. go-ethereum reflects this directly by representing both as one type,
      `shortNode`.
    volatility: stable
    edges:
      - { to: hex-prefix-encoding, type: requires }
      - { to: mpt-extension-node, type: contrasts }
    sources: [ethereum-org-mpt, geth-trie-package, execution-specs]
    misconceptions:
      - belief: A leaf node and an extension node are different data structures.
        reality: Both are 2-item RLP lists; only the hex-prefix flag nibble tells them apart, and it also tells you whether item 2 is a value or a child reference.
        why: Diagrams draw them as different shapes, and go-ethereum calls both `shortNode`.
        source: ethereum-org-mpt
    paysOffIn: [merkle-patricia-trie, eth-getproof]

  - id: hex-prefix-encoding
    title: Hex-prefix (compact) encoding
    oneLine: Packs an odd-or-even nibble path back into whole bytes by prepending a flag nibble, plus a zero padding nibble when needed.
    statement: >
      A path fragment is a list of nibbles, which may be odd in length, but RLP items are whole
      bytes. Hex-prefix encoding — called compact encoding in ethereum.org and geth — resolves
      this by prepending a flag nibble that records two facts: whether this node is a leaf, and
      whether the nibble count is odd. If the count is even, a zero nibble is inserted after
      the flag so the payload realigns; if odd, the first real nibble occupies that position.
      HP and RLP are two independent codecs applied in that order, not one layer.
    volatility: stable
    edges:
      - { to: mpt-nibble-path, type: requires }
      - { to: hp-flag-nibble-table, type: deepens }
      - { to: rlp, type: contrasts }
    sources: [ethereum-org-mpt, yellow-paper, execution-specs]
    misconceptions:
      - belief: Hex-prefix encoding and RLP are the same layer.
        reality: HP encodes a nibble path into a byte string; RLP then encodes that byte string as one item of the node list. Two codecs, applied in order.
        why: They only ever appear together.
        source: yellow-paper
    paysOffIn: [merkle-patricia-trie, eth-getproof]

  - id: hp-flag-nibble-table
    title: The hex-prefix flag nibble
    oneLine: 0 = extension/even, 1 = extension/odd, 2 = leaf/even, 3 = leaf/odd — equivalently `flag = 2*isLeaf + isOdd`.
    statement: >
      The first nibble of a hex-prefix-encoded path is one of four values and encodes both bits
      at once: bit 1 is the terminator flag (leaf), bit 0 is the odd-length flag. So 0 and 1
      mean extension, 2 and 3 mean leaf; 0 and 2 mean even length, 1 and 3 mean odd. This
      single nibble is what a proof verifier reads first to know whether the node it is looking
      at terminates a key or continues a path, and therefore how to interpret the node's second
      item.
    volatility: stable
    edges:
      - { to: hex-prefix-encoding, type: requires }
      - { to: mpt-leaf-node, type: applies }
      - { to: hp-even-padding, type: deepens }
    sources: [ethereum-org-mpt, yellow-paper]
    misconceptions:
      - belief: The flag only says leaf or extension.
        reality: It carries two independent bits — terminator and parity — which is why there are four values and not two.
        why: The leaf/extension distinction is the interesting one, so the parity bit gets ignored.
        source: ethereum-org-mpt
    paysOffIn: [merkle-patricia-trie, eth-getproof]

  - id: hp-even-padding
    title: The even-length padding nibble
    oneLine: An even nibble count gets a zero nibble appended to the flag; an odd count puts the first real nibble in that slot instead.
    statement: >
      Because the flag occupies one nibble, an even-length path would leave the payload
      misaligned by half a byte. The encoding fixes this by inserting a single zero nibble
      after the flag when the count is even (flags 0 and 2); when the count is odd (flags 1 and
      3) the first real nibble takes that half-byte and no padding is added. This is the rule
      most from-scratch implementations get wrong, and the symptom is not a parse failure but a
      root-hash mismatch on some inputs and not others.
    volatility: stable
    edges:
      - { to: hp-flag-nibble-table, type: requires }
      - { to: hex-prefix-encoding, type: contrasts }
    sources: [ethereum-org-mpt, execution-specs]
    misconceptions:
      - belief: If the encoder round-trips correctly, it is correct.
        reality: A wrong-but-self-consistent padding rule round-trips perfectly and still produces a different root than every real client.
        why: Round-trip equality is the usual correctness test for a codec, and it is insufficient when the output is hashed into consensus.
    paysOffIn: [merkle-patricia-trie, mpt-canonical-root]

  - id: mpt-child-reference-rule
    title: The 32-byte child reference rule
    oneLine: A child is referenced by `keccak256(rlp(child))` only when that RLP is 32 bytes or longer; shorter children are inlined verbatim in the parent.
    statement: >
      Children are not uniformly hash references. If the RLP encoding of a child node is 32
      bytes or more, the parent stores its keccak256 hash. If it is shorter, the parent embeds
      the child's RLP literally, because a hash would be larger than the thing it points at.
      A proof verifier therefore has to handle both cases, and a from-scratch implementation
      that always hashes will produce correct-looking output that disagrees with every client
      on exactly the inputs with small values or short paths.
    volatility: stable
    edges:
      - { to: rlp, type: requires }
      - { to: hash-function, type: requires }
      - { to: merkle-tree, type: contrasts }
    sources: [ethereum-org-mpt, yellow-paper, geth-trie-package]
    misconceptions:
      - belief: Every child in the trie is a 32-byte hash.
        reality: If `rlp(child)` is under 32 bytes the child is embedded literally inside the parent node.
        why: The "Merkle" framing implies hash-linking everywhere, and small nodes are rare in mainnet data so the bug hides.
        source: ethereum-org-mpt
    paysOffIn: [merkle-patricia-trie, eth-getproof, storage-proof-bridge]

  - id: mpt-secure-trie
    title: The secure trie
    oneLine: State and storage tries walk `keccak256(key)`, not the key — fixing path length at 64 nibbles and stopping an attacker from deepening the trie.
    statement: >
      For the world-state trie and every storage trie, the path is the keccak256 hash of the
      key rather than the key itself. This does two things. It fixes every path at exactly 64
      nibbles and distributes keys uniformly, so nobody can mine addresses or slot keys that
      share long prefixes and force pathologically deep subtrees. And it makes the preimage
      unrecoverable from the trie, which is precisely why there is no free RPC that enumerates
      a contract's storage slots — the node holding the trie does not know what the keys were.
    volatility: stable
    edges:
      - { to: hash-function, type: requires }
      - { to: mpt-nibble-path, type: requires }
      - { to: mpt-index-keyed-tries, type: contrasts }
    sources: [ethereum-org-mpt, execution-specs]
    misconceptions:
      - belief: The trie path is the address or the storage slot.
        reality: For state and storage tries the path is `keccak256(address)` or `keccak256(slot)`; tutorials that draw `0xabc...` at the root of the path are showing the pre-image, not the path.
        why: The key you pass to `eth_getProof` is the address, so the hashing step is invisible.
        source: ethereum-org-mpt
    paysOffIn: [eth-getproof, account-model-leaks-everything, indexer-why]

  - id: mpt-index-keyed-tries
    title: Index-keyed tries
    oneLine: Transaction and receipt tries key by `rlp(index)` and are not hashed, so they are shallow, ordered, and rebuilt per block rather than persisted.
    statement: >
      Not every trie in Ethereum is secure. The per-block transaction and receipt tries key by
      the RLP encoding of the item's index within the block, with no hashing applied. Keys are
      therefore short, variable-length and ordered, which is why one key can be a prefix of
      another and why the branch node's seventeenth slot is actually used here. These tries are
      derived from a block's contents, committed to in the header and then thrown away — they
      are not part of the persistent state. The withdrawals trie is built the same way; confirm
      against the execution spec before relying on that.
    volatility: evolving
    edges:
      - { to: mpt-secure-trie, type: contrasts }
      - { to: rlp, type: requires }
      - { to: state-root, type: contrasts }
    sources: [ethereum-org-mpt, execution-specs]
    misconceptions:
      - belief: All of Ethereum's tries are stored and all of them hash their keys.
        reality: Only state and storage tries are secure and persistent; transaction and receipt tries are index-keyed and rebuilt per block.
        why: '"The trie" is discussed as though there were one.'
        source: ethereum-org-mpt
    paysOffIn: [tx-and-receipt-tries-are-index-keyed, log-record-shape, eth-getproof]

  - id: mpt-canonical-root
    title: Canonical roots
    oneLine: Every structural choice is forced, so two clients holding the same key-value set must produce byte-identical nodes and the same root.
    statement: >
      The MPT has no design freedom left at runtime. Node types are determined by the data,
      extension nodes are mandatory wherever a branch would have one child, the hex-prefix
      encoding has one form per path, the inlining threshold is fixed, and RLP is canonical.
      Consequently a root hash is a function of the key-value set alone, not of insertion order
      or implementation. This is what makes a state root a usable consensus object, and it is
      also what makes a root mismatch a precise debugging signal: something in the structure
      differs, and a minimal failing key pair will find it.
    volatility: stable
    edges:
      - { to: mpt-four-node-types, type: requires }
      - { to: hex-prefix-encoding, type: requires }
      - { to: canonical-serialization, type: requires }
      - { to: determinism-requirement, type: applies }
    sources: [yellow-paper, execution-specs, ethereum-org-mpt]
    misconceptions:
      - belief: Two tries with the same contents could legitimately differ in shape.
        reality: They cannot; the shape is fully determined, which is exactly why the root can be a consensus object.
        why: Most tree structures do depend on insertion order.
    paysOffIn: [merkle-patricia-trie, node-two-process-model, statelessness]

  - id: state-root
    title: The state root
    oneLine: The MPT root in each block header, committing to the entire world state in 32 bytes.
    statement: >
      Each block header carries a `stateRoot`: the root of the world-state trie *after*
      executing that block's transactions. Thirty-two bytes commit to every account and every
      storage slot in existence. This is what makes verification possible without holding the
      state — a party with only the header can check any claim about state against this root —
      and it is the value two clients must agree on to have executed a block identically. A
      state root disagreement is the canonical symptom of a consensus bug.
    volatility: stable
    edges:
      - { to: mpt-canonical-root, type: requires }
      - { to: merkle-tree, type: requires }
      - { to: storage-proof, type: deepens }
    sources: [yellow-paper, ethereum-org-mpt]
    misconceptions:
      - belief: The state root is the root of that block's changes.
        reality: It commits to the whole world state after the block, not to a diff; there is no "changes only" root in the header.
        why: Headers are small and blocks are described as containing changes.
    paysOffIn: [merkle-patricia-trie, eth-getproof, statelessness, storage-proof-bridge]

  - id: mpt-proof-is-node-list
    title: A proof is an ordered list of nodes
    oneLine: A Merkle Patricia proof is the RLP-encoded nodes from root to leaf; the verifier re-hashes each and checks it matches the reference its parent held.
    statement: >
      There is no separate proof format. A proof is simply the sequence of nodes encountered
      walking the key's nibble path from the root down. The verifier hashes the first node and
      checks it equals the known root, reads the next nibble to pick a slot, checks the
      reference in that slot against the hash of the next supplied node, and repeats. Because
      the node encoding carries its own type in the flag nibble, the verifier never needs the
      trie's schema — only the root, the key, and the nodes.
    volatility: stable
    edges:
      - { to: mpt-child-reference-rule, type: requires }
      - { to: mpt-canonical-root, type: requires }
      - { to: merkle-inclusion-proof, type: applies }
    sources: [ethereum-org-mpt, execution-specs, storage-proofs-arxiv]
    misconceptions:
      - belief: Verifying a proof requires trusting the node that served it.
        reality: The proof is self-checking against a root you obtained independently; the server can withhold a proof but cannot forge one.
        why: The data arrives from an RPC provider, so it feels like trusting the provider.
    paysOffIn: [eth-getproof, storage-proof-bridge, statelessness]

  - id: storage-proof
    title: Storage proof
    oneLine: A Merkle proof against the state root proving one account record or one storage slot, which is what light clients and trustless bridges read.
    statement: >
      A storage proof is two nested proofs: one from the state root down to the account record,
      and one from that account's storage root down to the requested slot. `eth_getProof`
      returns both. Anyone holding a trusted block header can verify the pair and learn the
      value of a specific slot at a specific block without holding the state or trusting the
      server. This is the mechanism behind light clients, and behind bridges that read another
      chain's state rather than asking a committee what it says.
    volatility: stable
    edges:
      - { to: state-root, type: requires }
      - { to: mpt-proof-is-node-list, type: requires }
      - { to: exclusion-proof, type: deepens }
    sources: [ethereum-org-mpt, storage-proofs-arxiv]
    misconceptions:
      - belief: A storage proof proves the current value of a slot.
        reality: It proves the value at one specific block; freshness is a separate problem, and is the hard part for cross-chain use.
        why: RPC calls default to the latest block, so the block dimension is invisible.
        source: storage-proofs-arxiv
    paysOffIn: [eth-getproof, storage-proof-bridge, bridge-is-the-honeypot, rollup-vs-validium]

  - id: exclusion-proof
    title: Exclusion proof
    oneLine: Proof that a key is absent — something a trie supports and a plain Merkle tree does not.
    statement: >
      Because position in a trie is determined by the key, you can prove a key is *not* present
      by supplying the nodes along its path and showing that the path terminates before the key
      is consumed, or diverges into a different fragment. The verifier checks those nodes
      against the root exactly as for an inclusion proof and concludes absence. A plain Merkle
      tree cannot do this: leaves have no key-determined position, so absence is only provable
      by revealing the whole leaf set.
    volatility: stable
    edges:
      - { to: storage-proof, type: requires }
      - { to: merkle-inclusion-proof, type: contrasts }
      - { to: trie, type: requires }
    sources: [ethereum-org-mpt, storage-proofs-arxiv]
    misconceptions:
      - belief: You prove absence by showing a value of zero.
        reality: An unset slot has no entry in the trie at all; the proof shows the path ends early, which is structurally different from proving a stored zero.
        why: At the RPC level an unset slot and a slot holding zero both read back as zero.
    paysOffIn: [eth-getproof, storage-proof-bridge, statelessness]

  - id: verkle-trie
    title: Verkle tries, and what actually replaced them
    oneLine: The vector-commitment structure once planned to succeed the MPT; as of August 2026 the live direction is a binary tree under EIP-7864 instead.
    statement: >
      Verkle tries replace hash-based branching with vector commitments so that a proof is a
      constant-size opening rather than a list of sibling nodes, which was the plan for making
      stateless clients practical. That is no longer the direction of travel. As of August 2026
      the successor work is EIP-7864, a unified *binary* tree merging the account trie, storage
      tries and contract code into one structure with prefix-free keys. EIP-7864 is Draft, is
      not scheduled for any named fork, and its hash function is explicitly undecided, with
      BLAKE3 used as an experimental placeholder. The stated motivation also moved: from
