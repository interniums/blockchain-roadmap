moduleId: infra-incident-response
concepts:
  - id: irreversibility-changes-everything
    title: Stopping the next transaction, not undoing the last
    oneLine: On-chain response has no rollback, no firewall rule and no session to revoke - once a transaction is included the funds are gone, so every lever acts on what has not happened yet.
    statement: >
      Every reflex from web operations assumes a lever that acts backwards: restore the database, revoke the
      session, add the firewall rule, reverse the charge. None of them exist here. No party can reverse an
      included transaction on your behalf, and once the block containing it is finalized it cannot be
      reverted at all - the funds it moved are under someone else's control from that point on. What remains
      is entirely forward-looking, and the published response checklists are shaped that way: take immediate
      action to prevent further loss of funds, protect the value that has not left yet, and warn the
      downstream protocols that may be exposed to the same mechanism. Internalising that reframes the whole
      discipline - the question during an incident is never how to recover what left, it is how much is still
      exposed and for how long.
    volatility: stable
    edges:
      - { to: monitoring-is-not-auditing, type: requires }
    sources: [eth-pos-finality, seal-frameworks-war-room, immunefi-war-room, tob-beyond-private-key-risk]
  - id: clock-is-the-adversary
    title: Seconds against minutes
    oneLine: An exploit can complete inside a single transaction while a human decision takes minutes, so every response capability must be pre-decided, pre-authorised and pre-rehearsed.
    statement: >
      The asymmetry that defines on-chain incident response is temporal. An automated attack can complete in
      seconds, sometimes inside a single transaction. A human being paged, waking, reading, understanding and
      deciding takes minutes at best, and assembling signatures takes longer. You cannot close that gap during
      the incident, which means as much of it as possible must be removed beforehand - and that is exactly the
      shape published emergency runbooks take: signers paged through a pre-configured channel, the pause
      transaction prepared from a predefined signer path, verification abbreviated to a short checklist, and
      the whole thing scoped to a first-thirty-minutes block of work. Almost all of the work that shortens a
      response has to happen on an ordinary Tuesday.
    volatility: stable
    edges:
      - { to: irreversibility-changes-everything, type: requires }
      - { to: detect-to-respond-pipeline, type: requires }
    sources: [seal-frameworks-emergency-pause-runbook, seal-frameworks-incident-response, immunefi-war-room]
  - id: war-room-roles
    title: Name the roles before the day
    oneLine: A leader who decides and sequences, responders who investigate and execute, a scribe who documents, and a communications owner - filled by name in advance, and split across people as soon as the incident is serious.
    statement: >
      Published incident-response templates converge on the same small set of roles. A leader coordinates,
      assigns tasks and makes decisions. Responders investigate and execute the fixes. A scribe documents
      everything into the incident log. Communications is a named owner as soon as the incident is large
      enough to warrant one. The same guidance is explicit that a small team may have one person wearing
      several of these hats - but also that a serious incident should have a separate scribe and leader,
      because the jobs interrupt each other: a responder answering questions from users has stopped
      responding, and a leader writing a public statement has stopped deciding. Naming the roles with real
      people in advance is the cheapest structural improvement available, and it costs nothing until the day
      it saves the response.
    volatility: stable
    edges:
      - { to: clock-is-the-adversary, type: requires }
    sources: [seal-frameworks-ir-roles, seal-frameworks-war-room, immunefi-war-room]
  - id: parallel-not-serial
    title: Analysis, containment and comms run concurrently
    oneLine: Forensics, the containment decision and communications must run at the same time from minute one; teams that finish the analysis before deciding whether to act lose the window.
    statement: >
      The engineering instinct is to diagnose before acting, and it is wrong here because the window closes
      while you diagnose. The published war-room checklist is explicitly organised as work performed in
      parallel by role: analysis scopes the attack and gathers the transactions, protocol actions take
      immediate steps to prevent further loss, front-end actions disable what needs disabling, and
      communications prepares and sends messaging - all at once, not in sequence. Decisions therefore get made
      on partial information and revised, which is uncomfortable and correct. The discipline is to keep
      revising rather than to wait.
    volatility: stable
    edges:
      - { to: war-room-roles, type: requires }
    sources: [seal-frameworks-war-room, immunefi-war-room]
    misconceptions:
      - belief: We should understand the exploit fully before deciding to pause.
        reality: Analysis, containment and communications are meant to run in parallel; serialising them spends the response window on the first step.
        why: Engineers are trained to diagnose before acting, and in most other systems that is correct.
        source: seal-frameworks-war-room
  - id: exploit-triage-questions
    title: Four questions, in order
    oneLine: What is the attack transaction, what is the mechanism, is the remaining value still exposed to it, and does the same mechanism exist in our other deployments and chains.
    statement: >
      The analysis loop answers four questions and answers them in this order, because each one gates a
      decision the lead needs. Which transaction is the attack - the concrete artifact everything else works
      from, and the first item on the published checklist. What mechanism did it use - enough to reason
      about, not a full write-up. Is the value that has not yet left still exposed to that same mechanism -
      the scoping question that decides whether to contain and how aggressively. And does the same mechanism
      exist in our other deployments, our other chains, or code we forked - the checklist treats notifying
      potentially affected downstream protocols as war-room work rather than follow-up, and the same logic
      applies to your own other deployments. The fourth is the one most easily deferred, and deferring it is
      how a contained incident restarts somewhere else.
    volatility: stable
    edges:
      - { to: parallel-not-serial, type: requires }
      - { to: simulation-for-incident-triage, type: requires }
    sources: [seal-frameworks-war-room, immunefi-war-room, dedaub-seal-911]
  - id: containment-ladder
    title: The rungs above and below pause
    oneLine: Full pause, disabling specific entry points, capping or rate-limiting flows, changing parameters to make the attack unprofitable, blacklisting, and doing nothing are all containment options with different costs.
    statement: >
      Pause is the top rung, not the ladder. The published war-room checklist already lists several rungs
      beside it: execute pre-made defensive scripts, disable deposits or withdrawals in the front end,
      blacklist addresses at the interface. Below the contract-level pause there are more: disable the
      specific entry point being used, leaving everything else live; cap or rate-limit flows so the remaining
      exposure drains slowly enough for humans to act; change parameters - fees, ratios, limits - so the
      attack stops being profitable; blacklist on chain, where the token permits it. And at the bottom,
      deliberately do nothing, because the remaining exposed surface is small and pausing would harm more
      users than the attacker will. Choosing a rung is a tradeoff between value protected and harm caused to
      honest users, and having thought about the middle rungs beforehand is what lets you avoid an
      all-or-nothing decision at minute five.
    volatility: stable
    edges:
      - { to: parallel-not-serial, type: requires }
      - { to: exploit-triage-questions, type: requires }
    sources: [seal-frameworks-war-room, oz-pausable, immunefi-war-room, halborn-pause]
  - id: negotiation-and-bounty
    title: Negotiating with the attacker
    oneLine: A public on-chain bounty offer is a real recovery path with legal and precedent consequences, which means it should be discussed with counsel in advance rather than improvised at 4am.
    statement: >
      Publicly offering an attacker a percentage to return the remainder, communicated on chain, is an
      established recovery path and has sometimes worked. It is also a set of decisions with consequences
      beyond your protocol: what you offer becomes a precedent, what you promise may bind you, and what you
      say may matter legally. None of that should be decided by whoever is awake. The preparation is to
      establish beforehand who has authority to make such an offer, what the ceiling is, and who reviews the
      wording. A documented survey of the practice names Poly Network, Euler, Allbridge and Sentiment as
      protocols that offered a retroactive bounty and got most or all of the funds back — and names Mango
      Markets as the case where an agreement with the protocol did not prevent the attacker's later
      prosecution, which is the precedent risk in concrete form. Note also that the whitehat case has since
      been standardised separately: the SEAL Safe Harbor framework lets a protocol pre-authorise whitehats,
      fix the bounty in advance and require return to a named address within 72 hours, explicitly so that
      those terms are not negotiated during an incident. That is an argument for pre-agreeing terms, not
      evidence about what a blackhat will accept. Typical figures and success rates for blackhat
      negotiations circulate widely and are not reliably sourced, so do not anchor on a number you read.
    volatility: evolving
    claimKind: empirical
    edges:
      - { to: containment-ladder, type: requires }
    sources: [dedaub-seal-911, certik-retroactive-bounty, seal-safe-harbor-framework]
  - id: pause-is-a-two-sided-risk
    title: The same key that saves you can freeze you
    oneLine: A guardian that can stop an exploit can also freeze honest users' funds indefinitely, so pause is simultaneously a security control and a centralisation vector.
    statement: >
      Pause is presented as a safety feature and it is also, unavoidably, a power to freeze other people's
      money. The same key that halts an attacker halts every honest user, for as long as its holder chooses,
      and no code distinguishes the two uses. That makes the pause guardian a centralisation vector that must
      be designed for both cases: it will be evaluated by users as a trust question and by an attacker as a
      target. Any design conversation that presents only the benign side has skipped the half that determines
      whether the control is acceptable.
    volatility: stable
    edges:
      - { to: containment-ladder, type: requires }
      - { to: pause-is-centralisation, type: requires }
    sources: [arxiv-administrated-erc20, oz-pausable]
    misconceptions:
      - belief: The pause guardian is a pure safety feature.
        reality: The same key can freeze honest users indefinitely; it is a centralisation vector that needs structural bounds.
        why: The feature is named after its benign use and documented in terms of it.
        source: arxiv-administrated-erc20
  - id: pause-design-patterns
    title: Bounding the pause structurally
    oneLine: A low-threshold guardian to pause, a governance-only path to unpause, an automatic expiry of the pause, and a cooldown before re-pausing - four mechanisms that keep pause useful without making it a permanent power.
    statement: >
      Four structural bounds make pause a bounded power rather than an open-ended one. Make pausing easy - a
      low-threshold guardian multisig - because speed is the point. Make unpausing hard and public, through
      governance, so nobody can quietly pause and resume to manipulate. Give the pause a forced expiry, so
      that inaction returns the protocol to service rather than freezing it forever. And add a cooldown
      preventing an immediate re-pause after expiry, so the expiry cannot be defeated by repetition. Together
      these keep the emergency response fast while making indefinite freezing structurally impossible rather
      than merely promised.
    volatility: evolving
    edges:
      - { to: pause-is-a-two-sided-risk, type: requires }
      - { to: access-control-failure, type: requires }
    sources: [arxiv-administrated-erc20, oz-pausable, tob-beyond-private-key-risk]
  - id: pause-efficacy-declines
    title: Pause is racing an automated adversary
    oneLine: Trail of Bits' position is that pause effectiveness declines as attackers automate, so treating pause as the answer rather than as one bounded tool is a strategic error.
    statement: >
      Pause works when there is a gap between the attacker's first transaction and their last. As attacks
      become more automated - often completing in one transaction - that gap shrinks toward zero, and Trail of
      Bits' stated position is that pause efficacy declines correspondingly, with key-centric controls being
      the thing to mature past. This is an argued position rather than a measured one, and it should be
      attributed rather than asserted as established fact. Its practical implication holds either way: a
      protocol whose entire incident plan is "we can pause" has one tool, aimed at an adversary who may not
      leave time to use it, and should be investing in designs that reduce exposure without requiring a human
      to act.
    volatility: evolving
    claimKind: empirical
    edges:
      - { to: containment-ladder, type: requires }
      - { to: pause-design-patterns, type: contrasts }
    sources: [tob-beyond-private-key-risk]
    misconceptions:
      - belief: If we get hacked we can pause and fix it.
        reality: Pause races an automated attacker who may finish in one transaction, and it does nothing about funds already taken.
        why: Web2 incident response usually does have a kill switch that works, so the analogy imports badly.
        source: tob-beyond-private-key-risk
  - id: guardian-key-operational-readiness
    title: The capability is the people, not the contract
    oneLine: A pause is only real if signers can be reached and can sign at 3am on a Sunday - which makes signer spread, an out-of-band channel, pre-built simulated calldata and a rehearsed signing flow the actual capability.
    statement: >
      Having a pause function is not having a pause capability. The published emergency-pause runbook is
      almost entirely operational rather than technical: an emergency channel and a paging system that
      actually reach the signers, a predefined signer path and threshold for this multisig, the pause
      transaction prepared through the wallet's transaction builder, an abbreviated verification checklist so
      nobody improvises under pressure, and an instruction to every signer to stay available until the
      transaction executes. That is the capability. Teams tend to discover which of these they lack during
      their first real incident, and the discovery is usually an unglamorous item - a signer who changed
      phone numbers, a hardware wallet with a flat battery, a transaction that reverts because it was
      composed at 3am.
    volatility: stable
    edges:
      - { to: pause-design-patterns, type: requires }
      - { to: simulation-for-incident-triage, type: requires }
    sources: [seal-frameworks-emergency-pause-runbook, tob-beyond-private-key-risk, immunefi-war-room]
  - id: wargames-rehearsal
    title: Runbooks decay; drills do not
    oneLine: Incident response is a perishable skill, so scheduled tabletop and live-fire exercises against a forked mainnet are what convert a written runbook into a real capability.
    statement: >
      A runbook is a hypothesis about what your team can do. A drill tests it, and the results are reliably
      humbling: the calldata reverts, a signer is unreachable, nobody has the credentials for the public
      channel, the fork environment takes twenty minutes to stand up. None of those appear in the document,
      because documents record intentions. Both formats have value - tabletop exercises test decision-making
      and role separation cheaply, live-fire drills against a forked mainnet test the mechanics - and the
      ecosystem now runs organised wargames alongside internal ones. Schedule them, because skill and
      accuracy both decay between incidents.
    volatility: evolving
    edges:
      - { to: guardian-key-operational-readiness, type: requires }
      - { to: upgrade-rehearsal, type: requires }
    sources: [seal-our-work]
    misconceptions:
      - belief: A written runbook means we are prepared.
        reality: Untested runbooks fail on the unglamorous parts - an unreachable signer, calldata that reverts, nobody with the account credentials - which only drills reveal.
        why: The document is the visible artifact and it feels like the work.
        source: seal-our-work
  - id: seal-911
    title: The number to have saved
    oneLine: SEAL 911 is a free 24/7 hotline connecting a team under active attack to vetted security responders, and having the contact path saved before you need it is itself a preparedness item.
    statement: >
      SEAL 911, run by the Security Alliance, is a free emergency contact path that connects a team under
      active attack with vetted responders at any hour. Its existence changes the preparedness checklist in a
      concrete way: the contact mechanism belongs in your runbook, saved and tested, before an incident, because
      the alternative is spending the first critical minutes working out who to ask for help. Verify the current
      contact mechanism from the project's own repository at the time you write your runbook rather than copying
      instructions from an article - the mechanism can change and a stale instruction is worse than none.
    volatility: hot
    edges:
      - { to: clock-is-the-adversary, type: requires }
    sources: [seal-911, seal-911-repo]
    misconceptions:
      - belief: We will figure out who to call when it happens.
        reality: The improvisation costs the first critical minutes, which is exactly why a standing hotline exists; the contact path belongs in the runbook beforehand.
        why: Nobody plans for the thing that has not happened yet.
        source: seal-911
  - id: whitehat-safe-harbor
    title: Deciding the legal question in advance
    oneLine: SEAL's Whitehat Safe Harbor Agreement is a pre-adoptable framework letting a protocol authorise good-faith fund rescue in advance, converting an ambiguous situation into a defined one during the rescue.
    statement: >
      When a whitehat moves funds out of a vulnerable contract to protect them, they are performing actions
      that look identical on chain to an attack, and the legal position of doing so is ambiguous by default.
      The Whitehat Safe Harbor Agreement is a framework a protocol adopts beforehand, defining who is
      authorised to act, under what conditions, where funds must be sent and what the rescuer receives. Its
      value is that it is adopted in advance: during an incident, everyone involved already knows the terms
      instead of negotiating them while funds drain. Present it as a framework a protocol can adopt, not as
      established legal protection - its standing in any given jurisdiction is not something to assert.
    volatility: evolving
    edges:
      - { to: seal-911, type: requires }
    sources: [seal-safe-harbor, seal-our-work]
  - id: comms-during-incident
    title: What you say is a security decision
    oneLine: Too early tips off copycats and can start a bank run; too late destroys trust - the workable pattern is early acknowledgement without mechanism details, a fixed update cadence, and one authoritative channel.
    statement: >
      Communication during an incident is not a public-relations task that happens after the engineering; it
      is part of the response, with its own tradeoffs. Publishing the mechanism early arms copycats and
      anyone holding a fork of your code. Saying nothing erodes trust hour by hour and does not protect you,
      because attackers read the chain rather than your announcements. The published guidance is specific
      about the shape: appoint primary and backup spokespersons rather than letting anyone speak, work from
      pre-approved notification templates, send updates on a fixed schedule - explicitly including updates
      that say there is no new information - and stick to confirmed facts rather than speculation. To that,
      add the on-chain refinement: hold back mechanism detail while the exposure is still open, and designate
      one channel as authoritative so that the absence of a message elsewhere means nothing.
    volatility: stable
    edges:
      - { to: war-room-roles, type: requires }
      - { to: copycat-window, type: requires }
    sources: [seal-frameworks-incident-comms, immunefi-war-room]
    misconceptions:
      - belief: Staying silent protects us.
        reality: Silence erodes trust hour by hour and does not stop copycats, who are reading the chain rather than your announcements.
        why: Operational-security instincts say reveal nothing, and they are right about mechanism and wrong about acknowledgement.
        source: seal-frameworks-incident-comms
  - id: postmortem-purpose
    title: Three audiences, three different needs
    oneLine: Users need to know whether they are affected and what to do, the ecosystem needs the bug class so others can check themselves, and the team needs to know which control failed - a document serving only public relations fails all three.
    statement: >
      A post-mortem is read by three groups with incompatible needs. Users want one thing: am I affected, and
      what should I do. The ecosystem wants the bug class and the mechanism, at enough detail that other teams
      can check whether they have the same problem - and sharing lessons outward, precisely so others can
      check themselves, is written into the published guidance rather than being optional courtesy. The team,
      and anyone evaluating the team, wants the answers to the review questions that guidance also names: was
      the incident detected as quickly as it should have been, were the right people involved early enough,
      did a runbook exist or was too much invented during the response. A document written to minimise
      embarrassment answers none of those, and produces no action items, which is the output the review is
      for.
    volatility: stable
    edges:
      - { to: comms-during-incident, type: requires }
    sources: [seal-frameworks-lessons-learned, immunefi-war-room]
  - id: postmortem-content
    title: What a credible post-mortem contains
    oneLine: A timeline, impact in users and funds, root cause with contributing factors, what went well and badly, and action items each with an owner and a deadline - plus, on chain, block numbers so the timeline can be checked against the chain.
    statement: >
      The published post-mortem template is a good checklist to hold yourself to. A summary someone
      unfamiliar can follow. Impact split into users affected, duration, funds at risk and actual losses.
      A timeline with the load-bearing moments marked separately - incident began, detected, response
      started, root cause identified, mitigation applied, resolved - which is what makes "detection took how
      long" and "response took how long" answerable rather than blurred together. Root cause plus
      contributing factors, at the level of specific code rather than a category. What went well, what went
      wrong, and where you got lucky. And action items that each carry an owner and a deadline. On chain,
      add one thing the generic template does not: anchor the timeline in block numbers as well as UTC
      timestamps, so a reader can verify it against the chain instead of taking your word for it.
    volatility: stable
    edges:
      - { to: postmortem-purpose, type: requires }
    sources: [seal-frameworks-postmortem-template, seal-frameworks-lessons-learned]
  - id: blameless-but-specific
    title: Blameless about people, ruthless about controls
    oneLine: Naming the missing control is useful; naming the person who made a mistake is not.
    statement: >
      The post-mortem norm is precise in an asymmetric way: blameless about individuals and unsparing about
      controls. The published template says it in four words - focus on learning, not blame - and then
      immediately demands that every action item carry an owner and a deadline. Those two rules are the whole
      discipline. Naming a person explains nothing, because the next person in that seat will face the same
      system. Naming the missing control - the invariant nobody wrote, the alert routed to a channel nobody
      reads, the review step that had no owner, the drill never run - explains everything and converts into
      exactly the owned, dated item the template asks for. The failure mode to avoid is using blamelessness
      as cover for vagueness: "process improvements are underway" is neither blameless nor specific, it is
      simply empty, and readers can tell.
    volatility: stable
    edges:
      - { to: postmortem-content, type: requires }
    sources: [seal-frameworks-postmortem-template, seal-frameworks-lessons-learned, immunefi-war-room]
