moduleId: infra-indexer-selection
concepts:
  - id: ponder-model
    title: The self-hosted TypeScript model
    oneLine: Ponder is an open-source framework where you write handlers in plain TypeScript against a Postgres-backed schema and get GraphQL and SQL over the result.
    statement: >
      Ponder takes the opposite approach to the subgraph: instead of a declarative manifest plus a
      purpose-built mapping language, you write ordinary TypeScript handlers against a schema you declare in
      TypeScript, backed by Postgres, and query the result over GraphQL or SQL. It is self-hosted by default,
      which means you own the database, the backfill time and the on-call rotation. The practical
      consequences are a fast local development loop with hot reload, ordinary debugging with ordinary tools,
      and full access to the database your product already knows how to query - traded against operating a
      stateful service yourself.
    volatility: hot
    edges:
      - { to: indexing, type: requires }
      - { to: subgraph, type: contrasts }
    sources: [ponder-docs]
  - id: envio-model
    title: The purpose-built data source model
    oneLine: Envio HyperIndex pairs TypeScript-family handlers with HyperSync, a columnar data source that replaces JSON-RPC during backfill.
    statement: >
      Envio HyperIndex looks like Ponder at the handler level - handlers in TypeScript, JavaScript or
      ReScript - and differs underneath. Its backfill does not read from a JSON-RPC endpoint at all; it reads
      from HyperSync, a columnar store built specifically for bulk historical event retrieval. That
      architectural choice, rather than the handler language, is where its backfill speed advantage comes
      from. It also relocates the coverage question: the chains you can index fast are the chains HyperSync
      covers, which is a different list from "chains with an RPC endpoint".
    volatility: hot
    edges:
      - { to: indexing, type: requires }
      - { to: subgraph, type: contrasts }
    sources: [envio-docs, hyperindex-repo]
  - id: hypersync-not-rpc
    title: The speed is in the data source
    oneLine: Envio's backfill advantage comes from not calling eth_getLogs at all, which is why no amount of subgraph tuning closes the gap.
    statement: >
      Backfill over JSON-RPC is bounded by a request-response protocol designed for point queries: chunked
      log requests, provider range caps, per-request overhead and rate limits. A columnar data source built
      for bulk historical reads is not bounded by any of those. Understanding that the difference lives in
      the data source and not in the handler explains two things at once - why tuning a subgraph's mappings
      cannot close the gap, and why the real coverage question for this architecture is which chains the
      alternative data source supports rather than which chains have a node. Independent multipliers quoted
      for this advantage vary widely and are not reliably sourced, so treat the mechanism as the durable
      lesson and any specific figure as something to measure yourself.
    volatility: hot
    edges:
      - { to: envio-model, type: requires }
      - { to: getlogs-is-the-cost-driver, type: contrasts }
    sources: [envio-docs]
    misconceptions:
      - belief: Envio is faster because its handler language is faster than AssemblyScript.
        reality: The speed comes from replacing JSON-RPC with a purpose-built columnar data source during backfill; the handler language is close to irrelevant.
        why: The handler is the part a developer writes and therefore the part they attribute performance to.
        source: envio-docs
  - id: managed-vs-self-hosted-indexer
    title: The axis that is not the framework
    oneLine: The first real decision is operating model - self-hosted means you own Postgres, backfill time and on-call; managed means you own a bill and a vendor dependency.
    statement: >
      Framework comparisons dominate the discourse, but the decision that changes your team's week is the
      operating model. Self-hosting an indexer means running a stateful service with a database that must be
      backed up, migrated and resynced, and an on-call rotation for when it falls behind. A managed indexer
      moves all of that to someone else in exchange for a bill and a dependency you cannot fix yourself when
      it breaks. Neither choice is free, and the right one is usually decided by whether the team already
      operates stateful infrastructure - if it does, self-hosting is a marginal addition; if it does not, it
      is a new competence.
    volatility: stable
    edges:
      - { to: ponder-model, type: requires }
      - { to: envio-model, type: requires }
    sources: [ponder-docs, envio-docs]
  - id: ponder-monad-ownership
    title: Ponder's steward changed
    oneLine: The Ponder team joined the Monad Foundation in February 2026; the project continues as open source, with roadmap alignment rather than abandonment as the risk to weigh.
    statement: >
      In February 2026 Ponder's small founding team joined the Monad Foundation. The first-party announcement
      states that the framework continues as open source and actively developed, and it does. The honest risk
      to state is not abandonment but direction: a project whose maintainers are employed by one L1
      foundation will tend to prioritise that L1's needs, and the bus factor on a three-person team was
      already thin. Read this the way you would read any dependency's governance - as a fact to weigh
      alongside the technical fit, not as a disqualification.
    volatility: hot
    edges:
      - { to: ponder-model, type: requires }
    sources: [monad-ponder-team]
    misconceptions:
      - belief: Ponder is abandoned because the team was acquired.
        reality: The announcement explicitly continues open-source development, and the framework remains in active use.
        why: In this industry a team joining an L1 foundation usually does mean the old project stops.
        source: monad-ponder-team
  - id: sqd-rezolve-status
    title: SQD's steward changed further
    oneLine: SQD, formerly Subsquid, was acquired by Rezolve AI in October 2025 and is mid-rebrand, so its technology still competes while its strategic direction now sits outside crypto infrastructure.
    statement: >
      SQD was acquired by Rezolve AI in October 2025, with rebranding and a token migration still in progress
      through 2026. The technology remains competitive and wins some workloads outright, particularly bulk
      transaction indexing. What changed is who sets the roadmap: an AI-commerce company whose strategy has
      no particular reason to prioritise blockchain indexing. Of the main options this carries the highest
      continuity risk, which is a statement about direction rather than a prediction of shutdown. Specific
      token or migration-date claims should not be repeated; the acquisition itself is first-party confirmed
      and the rest is not.
    volatility: hot
    edges:
      - { to: indexing, type: requires }
      - { to: ponder-monad-ownership, type: contrasts }
    sources: [rezolve-subsquid-acquisition]
    misconceptions:
      - belief: SQD is dead.
        reality: It was acquired, not shut down, and still wins some workloads; the risk is strategic direction, not immediate discontinuation.
        why: Acquisitions by companies outside the industry are read as exits.
        source: rezolve-subsquid-acquisition
  - id: benchmark-is-workload-shaped
    title: The ranking inverts by workload
    oneLine: Indexer speed rankings change places depending on whether the workload is events, events plus contract reads, or bulk transactions - and some platforms cannot run some workloads at all.
    statement: >
      In the one open indexer benchmark with published configurations and a public repository, no single
      platform wins across its six workloads: one leads on events only, a different one leads once handlers
      must also make contract reads, and a third leads on bulk transaction indexing by a wide margin - a
      workload several platforms could not run at all. That last observation matters more than any of the
      timings, because a platform that cannot execute a workload is not slow at it, it is absent. Read this
      as one benchmark's result, not as a fact about indexers: its publisher competes in it and wins two of
      the six workloads. That is a reason to read the methodology rather than the headline, not a reason to
      discard it - open methodology from an interested party still beats a closed benchmark from anyone. The
      alternative published benchmark is not a check on it: it measures a single events-only workload, it is
      published by the platform that wins that workload, and where it appeals to independent confirmation it
      appeals to this same benchmark. Two vendor benchmarks pointing at each other are one data point.
    volatility: evolving
    claimKind: empirical
    edges:
      - { to: backfill-vs-live, type: requires }
      - { to: envio-model, type: requires }
    sources: [sentio-obib, envio-benchmark-blog]
    misconceptions:
      - belief: Benchmarks tell you which indexer to pick.
        reality: Rankings invert across workloads, and whether a platform can index a data type at all matters more than how many minutes it takes.
        why: Vendors publish single-workload benchmarks, and a single number is easier to compare than a capability grid.
        source: sentio-obib
  - id: capability-gaps-matter-more-than-speed
    title: Selection is usually decided on capability
    oneLine: Whether a platform can index traces, make contract reads inside handlers, follow factory-created contracts and cover your chains eliminates candidates before speed is ever consulted.
    statement: >
      Four capability questions eliminate more candidates than any performance comparison. Can it index
      internal transactions and traces, or only logs. Can a handler make a contract read to fetch state the
      event did not carry. Can it follow contracts created at runtime by a factory, registering templates
      dynamically. Does it cover every chain your product touches. Each is a yes-or-no gate, and a no on any
      one of them removes a platform from consideration regardless of its benchmark position. Run the gates
      first; treat speed as a tiebreaker among the survivors.
    volatility: evolving
    edges:
      - { to: benchmark-is-workload-shaped, type: requires }
      - { to: indexer-choice-axes, type: deepens }
    sources: [sentio-obib, ponder-docs]
  - id: trace-completeness-limit
    title: Logs are not everything that happened
    oneLine: Log-based indexing cannot see value moved by internal calls, and the tracing path that would see it is unavailable on several major networks - so any product that must account for that value needs a trace-capable indexer.
    statement: >
      Value moves on chain in ways that emit no log. A contract forwarding ETH, an internal call inside a
      multi-hop route, a transfer triggered by a fallback - none of these necessarily produce an event, and
      an indexer that only consumes logs cannot see them. The Graph's own manifest documentation states the
      structural version of this: event handlers are supported on every EVM network, whereas the call
      handlers that would catch calls instead depend on the Parity tracing API, which several major networks
      - BNB Chain and Arbitrum among them - do not provide. The one open benchmark supplies the empirical
      version, reporting 58% completeness for subgraph-style indexing on its traces workload against a
      trace-capable indexer's 100%; treat that number as one benchmark's measurement of one workload, and
      the structural limitation as the durable claim. For an analytics dashboard the missing rows may be
      tolerable. For anything that reconciles balances, computes fees or reports to accounting, they are a
      correctness bug that will be discovered by a user rather than by a test.
    volatility: evolving
    claimKind: empirical
    edges:
      - { to: capability-gaps-matter-more-than-speed, type: requires }
      - { to: subgraph, type: contrasts }
      - { to: trace-vs-debug-namespace, type: requires }
    sources: [sentio-obib, thegraph-subgraph-manifest]
    misconceptions:
      - belief: A subgraph sees everything that happened on chain.
        reality: Log-based indexing has measured gaps on internal transactions; value can move without any event being emitted.
        why: Most protocols do emit events for the things their own users care about, so logs feel exhaustive.
        source: sentio-obib
      - belief: Adding call handlers closes the gap.
        reality: Call handlers depend on the Parity tracing API, which The Graph documents as unavailable on networks including BNB Chain and Arbitrum. On those chains the capability does not exist to enable.
        why: The feature is in the manifest schema, so it reads as universally available.
        source: thegraph-subgraph-manifest
  - id: migration-cost-shape
    title: What a migration actually costs
    oneLine: The schema and event set carry over; the mapping logic is a rewrite, and the expensive part is re-running backfill and dual-running to diff the two datasets before cutover.
    statement: >
      Moving between indexer frameworks is not a port and not a rewrite - it is both, unevenly. The entity
      schema and the set of events you consume translate almost mechanically. The mapping logic is rewritten,
      because the languages and the entity APIs differ. But neither of those is where the time goes. The time
      goes into re-running the full historical backfill on the new system, and then dual-running both
      indexers against live data long enough to diff their outputs row by row and explain every difference.
      A migration without a cutover criterion expressed as a diff result - zero row-level differences over a
      defined range for a defined period - is a migration that ships its own bugs.
    volatility: evolving
    edges:
      - { to: ponder-model, type: requires }
      - { to: graph-compatible-alternatives, type: contrasts }
    sources: [ponder-docs, thegraph-upgrading-subgraph]
    misconceptions:
      - belief: Migrating a subgraph to another framework is a port.
        reality: The schema and event set carry over, but the mapping logic is rewritten and the real work is backfill plus dual-run diffing before cutover.
        why: The two systems look structurally identical when drawn as boxes on a slide.
        source: ponder-docs
  - id: decentralisation-tradeoff
    title: What you give up by choosing the fast thing
    oneLine: The decentralised network is the only query layer with a credible neutrality claim; every faster option is a service someone can switch off.
    statement: >
      Almost every performance-competitive indexing option is a centralised service, which means it has an
      operator who can deprecate it, price it differently, or be compelled to stop serving you. The Graph's
      decentralised network is the one option that offers a credible censorship-resistance and continuity
      claim for the query layer, and it pays for that with cost and operational shape rather than being free.
      For most products this is not the deciding factor. For a protocol whose whole proposition is that its
      frontend cannot be taken down, a centralised indexer is the component that quietly makes the claim
      false - and the honest version of that protocol's architecture diagram says so.
    volatility: evolving
    edges:
      - { to: subgraph, type: requires }
      - { to: managed-vs-self-hosted-indexer, type: requires }
      - { to: envio-model, type: contrasts }
    sources: [thegraph-upgrading-subgraph]
