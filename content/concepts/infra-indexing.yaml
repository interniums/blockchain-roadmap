moduleId: infra-indexing
concepts:
  - id: indexing
    title: What an indexer is for
    oneLine: Contracts emit logs but the chain has no query engine, so an indexer replays those logs into a database that can answer product questions.
    statement: >
      A node answers "what is the value of this slot at this block". A product asks "all open positions for
      this user, sorted by size, with the fee accrued since they opened". No JSON-RPC method returns the
      second kind of answer, and no amount of calling the first kind in a loop is a substitute - it is
      slower, more expensive, and still cannot sort or filter across users. An indexer replays the chain's
      logs into a database whose schema is shaped by the product's queries rather than by the contract's
      storage. It is not a cache in front of the node: a cache returns things the node could have returned,
      and an indexer materialises derived state that the node never had.
    volatility: stable
    edges:
      - { to: logs-bloom, type: requires }
      - { to: events-are-an-api-contract, type: requires }
      - { to: getlogs-is-the-cost-driver, type: requires }
    sources: [ponder-docs]
    misconceptions:
      - belief: An indexer is a cache in front of the RPC node.
        reality: It materialises derived state - positions, balances, aggregates - that no RPC method can return at all.
        why: Both sit between the chain and the application, so they look like the same layer.
        source: ponder-docs
      - belief: You can query product data straight from an RPC node.
        reality: RPC answers what a value is now, not who did what over time; the second question needs a database you built.
        why: The node genuinely does hold all the underlying data, which makes the gap feel like a tooling problem.
        source: ponder-docs
  - id: indexer-is-a-deterministic-fold
    title: An indexer is a fold over a rewritable stream
    oneLine: An indexer is a deterministic fold from an ordered event stream into a database, and every hard part of indexing follows from the stream being rewritable.
    statement: >
      Formally, an indexer applies a deterministic function to an ordered sequence of events, accumulating a
      database as it goes. Two properties of that definition generate every difficulty in the field.
      Determinism means the same input range must always produce the same output, which is what makes
      retries, restarts and parallel backfill safe - and what makes any non-determinism in a handler a bug
      that surfaces as an unreproducible table. Rewritability means the input sequence is not append-only:
      the last few entries can be replaced with different ones at any time. Reorg handling, cursor design,
      idempotent writes and the finality boundary are all consequences of that second property, not separate
      topics.
    volatility: stable
    edges:
      - { to: indexing, type: requires }
    sources: [ponder-docs, ponder-indexing-overview]
    misconceptions:
      - belief: An indexer is a database you write once and then read from.
        reality: The input stream can be rewritten, so the fold must be able to unwind and reapply; ignoring that corrupts data quietly rather than loudly.
        why: Every other ETL pipeline most developers have built consumed an append-only source.
        source: ponder-indexing-overview
  - id: subgraph
    title: The subgraph format
    oneLine: The Graph's unit of indexing - a YAML manifest, a GraphQL schema and mapping handlers - and the nearest thing the field has to a portable standard.
    statement: >
      A subgraph is three artifacts: a manifest naming the contracts, events and start blocks to index; a
      GraphQL schema declaring the entities to materialise; and mapping handlers, historically written in
      AssemblyScript, that translate each event into entity writes. Its lasting value in 2026 is portability
      rather than capability: several independent hosts accept the same three artifacts, so a subgraph is the
      one indexer definition that is not tied to a single operator. Understanding the format is worth doing
      even if you never deploy one, because it is the shape almost every published indexing example takes.
    volatility: evolving
    edges:
      - { to: indexing, type: requires }
    sources: [thegraph-upgrading-subgraph]
  - id: hosted-service-retired
    title: The free hosted service is gone
    oneLine: The Graph fully retired its free hosted service, so every legacy subgraph had to move to the decentralised network or a third-party host - and every tutorial that starts with a hosted deploy is dead.
    statement: >
      The Graph's free hosted service, for years the default place a subgraph was deployed, is fully retired
      as of 2026. The two remaining paths are The Graph's decentralised network, where indexers are paid in
      GRT and queries go through gateways, and third-party hosts that accept the same subgraph artifacts. The
      significance is larger than one product change: it is the event that reshuffled the entire indexer
      market, because it converted a large population of projects from "we have a free indexer" to "we must
      choose and pay for one". When reading any indexing tutorial, the first thing to check is whether its
      deploy step targets a service that still exists.
    volatility: hot
    edges:
      - { to: subgraph, type: requires }
    sources: [thegraph-upgrading-subgraph, protofire-indexer-comparison]
    misconceptions:
      - belief: You deploy a subgraph to The Graph's hosted service for free.
        reality: That service is retired; the options are the decentralised network, paid in GRT, or a third-party host.
        why: It was the default for years, so it is the step in almost every tutorial written before 2026.
        source: thegraph-upgrading-subgraph
  - id: graph-compatible-alternatives
    title: Hosts that accept the same subgraph
    oneLine: Third-party hosts run subgraphs in the original manifest, schema and mapping format, which makes moving off a retired service a deploy-target change rather than a rewrite - but the set of hosts itself keeps changing.
    statement: >
      Some providers accept subgraphs in the same format, so migrating to one of them changes where you
      deploy and not what you wrote. Goldsky documents itself as a completely backwards-compatible subgraph
      indexing service with an explicit path for migrating an existing subgraph. That is the low-effort
      migration route, and it is what makes the subgraph format's portability a real asset rather than a
      theoretical one - a different decision from migrating to another framework, which is a rewrite of the
      mapping logic. The set of hosts is itself volatile, and this is not hypothetical: Alchemy ran subgraph
      hosting and then sunset it on 8 December 2025, discontinuing all subgraph and query endpoints and
      directing users to Goldsky. Check the current status and pricing of any host at the moment you choose
      it; the format's portability is the durable fact, not any particular host's existence.
    volatility: hot
    edges:
      - { to: hosted-service-retired, type: requires }
    sources: [goldsky-subgraphs-docs, alchemy-subgraphs-sunset, protofire-indexer-comparison]
  - id: backfill-vs-live
    title: Catching up and keeping up
    oneLine: Historical backfill is a throughput problem with a deterministic input; live tailing is a latency problem whose input can be rewritten - and published benchmarks measure only the first.
    statement: >
      An indexer runs in two regimes with almost nothing in common. Backfill is bounded, deterministic and
      restartable: the blocks already exist, nothing about them will change, and the only question is how
      fast you can get through them - so it parallelises. Live tail is unbounded and latency-bound, its input
      is the unfinalised tip which can be replaced, and it cannot be parallelised because ordering matters.
      Nearly every published indexer benchmark measures backfill, because it is the regime that produces a
      clean number. The regime that produces production incidents is the other one.
    volatility: stable
    edges:
      - { to: indexing, type: requires }
      - { to: rate-limit-two-axes, type: requires }
    sources: [ponder-indexing-overview, sentio-obib]
  - id: reorg-safe-indexing
    title: Unwinding is part of the job
    oneLine: When the chain replaces recent blocks, an indexer must unwind the state it derived from them and reapply the new branch - and an indexer that does not corrupts its data silently.
    statement: >
      A reorg replaces recently canonical blocks with a different branch. Events an indexer already folded
      into its tables may cease to exist, or reappear at a different block number and log index. An indexer
      that only ever appends will therefore hold rows describing an abandoned branch, mixed indistinguishably
      with valid rows, with no error raised anywhere. Correct handling means identifying the common ancestor,
      undoing every derived write attributable to the abandoned blocks, and reapplying the new ones. This is
      the single most commonly omitted topic in indexing tutorials, and it is omitted precisely because
      nothing fails visibly when you skip it - the data is simply wrong, and stays wrong.
    volatility: stable
    edges:
      - { to: indexer-is-a-deterministic-fold, type: requires }
      - { to: reorg, type: requires }
      - { to: reorg-depth-in-practice, type: requires }
    sources: [envio-reorgs, ponder-indexing-overview]
    misconceptions:
      - belief: Reorgs are rare enough to ignore in an indexer.
        reality: Shallow rewrites at the tip are routine, and the failure they cause is silent corruption rather than an error, so "rare" would not save you even if it were true.
        why: Deep reorgs are rare, and people generalise from the deep case to all cases.
        source: envio-reorgs
  - id: non-evm-indexing
    title: Indexing outside the EVM
    oneLine: Frameworks such as SQD and SubQuery reach Substrate, Cosmos and other non-EVM ecosystems, where the event model itself differs - and no framework reaches all of them.
    statement: >
      Not every chain has EVM logs. Substrate chains emit runtime events, Cosmos chains emit typed events on
      transactions, and Bitcoin has no event model at all - you index transaction outputs. Frameworks such as
      SQD and SubQuery exist because indexing those requires a different source abstraction, not just a
      different endpoint, and SubQuery's multi-chain documentation shows what that buys: a single project can
      follow XCM transfers across Polkadot parachains or IBC messages across Cosmos zones. It also shows the
      limit - coverage is per-ecosystem and incomplete, and SubQuery's own documentation states it does not
      support Bitcoin. If your product spans EVM and non-EVM chains, chain coverage becomes a hard selection
      constraint that overrides every performance consideration, because a fast indexer that cannot read one
      of your chains is not a candidate. Check the supported-network list of the version you would run
      rather than a summary of it.
    volatility: evolving
    edges:
      - { to: indexing, type: requires }
    sources: [subquery-multichain, protofire-indexer-comparison]
  - id: indexer-choice-axes
    title: There is no best indexer
    oneLine: The real decision is speed against chain coverage against migration effort against who owns the thing - and asking which is best produces an answer to a question nobody has.
    statement: >
      Indexer selection is a multi-axis tradeoff, and the axes are: backfill speed, live-tail behaviour,
      chain coverage, what the platform can index at all, how much work it is to move to and away from, the
      operating model you take on, and who steers the project. Each of those is answerable from first-party
      documentation - the frameworks publish what they can index, which chains they reach, and whether you
      run the database or someone else does. Speed is the axis with the loudest published numbers, and it is
      not the axis that eliminates candidates: the one open indexer benchmark with published configurations
      records workloads that several platforms could not execute at all, which is a harder disqualification
      than any timing. Start from the queries your product must answer and the chains it must cover,
      eliminate everything that cannot do those, and only then look at minutes.
    volatility: evolving
    edges:
      - { to: backfill-vs-live, type: requires }
      - { to: graph-compatible-alternatives, type: requires }
    sources: [ponder-docs, envio-docs, sentio-obib, protofire-indexer-comparison]
    misconceptions:
      - belief: The fastest indexer is the right choice.
        reality: Published benchmarks measure backfill; live-tail behaviour, reorg handling, chain coverage, what it can index at all, and operational burden usually decide the outcome.
        why: Speed is the only axis with a single comparable number attached to it.
        source: sentio-obib
