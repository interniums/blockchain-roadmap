moduleId: infra-monitoring
concepts:
  - id: monitoring-is-not-auditing
    title: Two different questions
    oneLine: An audit checks code at a point in time; monitoring checks state and behaviour continuously, which is the only way to catch key compromise, dependency change and economic drift.
    statement: >
      An audit answers "is this code correct" on the day it is read. Monitoring answers "is this system
      behaving correctly right now" every block, and the published guidance treats it as a standing
      requirement with its own checklist - ownership changes, admin role grants and revocations, proxy
      upgrades, oracle deviations. The gap between the two questions is where a whole class of failures
      lives: a stolen key produces perfectly valid transactions that no code review could have prevented, a
      dependency you trust upgrades to something you did not review, an oracle stops updating without
      reverting, a parameter drifts until an assumption stops holding. None of these are code defects and
      none of them are things an audit is able to catch. A protocol with an audit and no monitoring has
      addressed the code it shipped and has no view of the conditions it runs under.
    volatility: stable
    edges:
      - { to: access-control-failure, type: requires }
      - { to: upgrade-risk, type: requires }
    sources: [seal-frameworks-monitoring, seal-frameworks-monitoring-guidelines, acm-invariant-effectiveness]
    misconceptions:
      - belief: If it passed an audit, monitoring is optional.
        reality: Audits cannot cover key compromise, oracle failure, dependency upgrades or economic drift, which is exactly the surface continuous monitoring is prescribed for.
        why: The audit is the visible, purchasable, dateable security artifact, so it feels like the completed task.
        source: seal-frameworks-monitoring
  - id: three-signal-layers
    title: Transaction, state, economic
    oneLine: Monitoring has three layers - a specific call pattern, an invariant over contract storage, and an economic anomaly - with different latency, different precision and different tooling.
    statement: >
      Signals come from three distinct layers. Transaction-level detection matches a call pattern or a
      specific event and is fast and narrow. State-level detection evaluates a predicate over contract
      storage, is exactly as precise as the predicate, and catches things nobody anticipated a call pattern
      for. Economic-level detection watches value, price and flow aggregates, is the broadest, and is the
      noisiest by a wide margin. They differ in how quickly they fire, how often they are wrong, and what
      tooling they need, so a monitoring design that does not say which layer each alert lives on has no way
      to reason about its own false-positive rate.
    volatility: stable
    edges:
      - { to: monitoring-is-not-auditing, type: requires }
    sources: [oz-defender-docs]
  - id: invariant-monitoring
    title: The highest-signal alert is a broken invariant
    oneLine: A protocol-specific predicate evaluated against live state every block fires only when something is wrong by construction, not by heuristic.
    statement: >
      The strongest alert a protocol can have is its own invariant checked against live state: total shares
      against total assets, the sum of user balances against the contract's holdings, the pool's product or
      curve equation. When such a predicate breaks, something is definitionally wrong - there is no
      interpretation in which it is a busy day. That gives it the property no threshold alert has: near-zero
      false positives, which is what makes it safe to page a human on. It is also leading rather than
      lagging, because the accounting usually breaks before the funds finish leaving, which is precisely the
      window a response needs.
    volatility: evolving
    edges:
      - { to: three-signal-layers, type: requires }
      - { to: invariant, type: requires }
      - { to: solvency-invariant, type: requires }
      - { to: anomaly-heuristics, type: contrasts }
    sources: [tenderly-invariant-monitoring, acm-invariant-effectiveness, oz-defender-docs]
    misconceptions:
      - belief: Monitor for large withdrawals.
        reality: A large withdrawal is a lagging, low-precision signal; a broken protocol invariant is leading and high-precision.
        why: Withdrawal size is trivial to instrument and requires no understanding of the protocol.
        source: tenderly-invariant-monitoring
  - id: invariants-are-the-same-artifact-as-fuzzing
    title: One predicate, two deployment targets
    oneLine: The invariants asserted in a Foundry invariant test are the same predicates that should be evaluated against mainnet state, so production monitoring should deploy test artifacts rather than reimplement them.
    statement: >
      An invariant test and an invariant monitor assert the same thing about the same system; only the state
      they read differs - generated in the test, live on chain in the monitor. Treating them as one artifact
      with two deployment targets has three consequences worth having: the predicate is written once and
      cannot drift between the two, the monitoring work is already done by the time the test suite exists,
      and any invariant added after an incident automatically becomes both a regression test and a detector.
      Teams that write monitoring separately end up with a smaller, vaguer set of production checks than the
      set they already proved they could express.
    volatility: evolving
    edges:
      - { to: invariant-monitoring, type: requires }
      - { to: invariant-testing, type: requires }
      - { to: handler-pattern, type: deepens }
    sources: [foundry-invariant-testing, tenderly-invariant-monitoring]
  - id: anomaly-heuristics
    title: Thresholds catch what invariants miss, and cost precision
    oneLine: Statistical and threshold alerts catch what no invariant covers, generate false positives by design, and therefore belong on a lower-severity channel.
    statement: >
      Some things no invariant expresses: an unusual drop in total value, a mint volume far above baseline, a
      price diverging from a reference, an outsized flow to one address. Threshold and statistical detectors
      cover that space and are genuinely worth having. They are also wrong regularly, because the underlying
      quantities are volatile for legitimate reasons, so they belong on a lower-severity channel than
      invariant breaks. Published threshold values disagree by orders of magnitude across sources and are
      measuring different quantities, so there are no defaults to copy - a threshold must be derived from
      your own protocol's measured baseline and revisited when that baseline changes.
    volatility: evolving
    edges:
      - { to: three-signal-layers, type: requires }
      - { to: invariant-monitoring, type: contrasts }
    sources: [arxiv-tvl-fragility, forta-docs]
  - id: false-positive-budget
    title: Precision is a safety property
    oneLine: A channel that fires daily on noise is a channel nobody reads during a real incident, so severity tiering and precision are safety engineering rather than polish.
    statement: >
      The scarce resource in incident detection is human attention, and it is consumed by every alert whether
      or not the alert was right. A channel that fires on noise trains its readers to dismiss it, and that
      training does not switch off on the night it matters - the true positive arrives into a channel people
      have learned to ignore. The published guidance states the principle directly: a monitoring setup
      without defined responses is noise, consuming attention without producing safety, and every alert must
      name who receives it and what they do. Precision is therefore a safety property of the alerting system,
      not a quality metric. Practically, the same guidance prescribes multi-layered thresholds - primary
      thresholds for critical alerts, secondary thresholds for less urgent notifications - which is the
      concrete form of the rule: page only on signals whose expected false-positive rate is near zero, route
      everything else to a channel that is reviewed rather than pushed, and treat a paging alert that keeps
      firing without a real incident behind it as a defect in the alert.
    volatility: stable
    edges:
      - { to: anomaly-heuristics, type: requires }
    sources: [seal-frameworks-monitoring, seal-frameworks-monitoring-thresholds, houston-ndss]
    misconceptions:
      - belief: More alerts means more safety.
        reality: A noisy channel is an ignored channel, so a low false-positive rate is itself a safety property.
        why: Coverage is measurable and legible, while attention is neither.
        source: seal-frameworks-monitoring
  - id: admin-action-alerting
    title: Every privileged action pages, regardless of amount
    oneLine: Role grants and revocations, ownership transfers, proxy upgrades, timelock queueing, pause toggles, oracle source changes and fee changes must alert unconditionally - they are both the exploit path and the insider path.
    statement: >
      Privileged actions deserve the top severity tier and no threshold at all. Role granted, role revoked,
      ownership transferred, proxy upgraded, timelock operation queued or executed, paused or unpaused,
      oracle source changed, fee parameter changed - each of these should page someone every single time,
      including when it was you. There are two reasons. First, the loss data is dominated by access-control
      and key-compromise incidents rather than by exotic Solidity bugs, so this is where monitoring effort
      buys the most. Second, these events are low-frequency by nature, so unconditional alerting costs almost
      no attention. An alert that fires four times a year and catches a stolen admin key once is the best
      trade in the whole discipline.
    volatility: stable
    edges:
      - { to: three-signal-layers, type: requires }
      - { to: access-control-failure, type: requires }
      - { to: uups-proxy, type: requires }
    sources: [oz-defender-docs]
    misconceptions:
      - belief: Monitor for reentrancy patterns.
        reality: Access-control and key-compromise incidents dominate recorded losses; monitoring effort should follow the loss distribution, not the famous bug class.
        why: Reentrancy is the vulnerability every curriculum teaches first, so it is the one people instrument for.
        source: oz-defender-docs
  - id: timelock-queue-is-the-alert
    title: Alert on the queue, not the execution
    oneLine: For a timelocked system the actionable alert is the queue event, because the delay exists to give humans time and that time is only usable if queueing pages someone.
    statement: >
      A timelock's entire value is the interval between an operation being queued and being executable. If
      your alert fires on execution, you learn about the change at the exact moment your response window
      closed - the delay was spent and nobody used it. Alerting on the queue event converts the timelock from
      a formality into a real control, because it hands a human the full delay to read the payload, simulate
      it, and object. This applies to your own governance and, more importantly, to any timelock you do not
      control whose decisions affect you.
    volatility: stable
    edges:
      - { to: admin-action-alerting, type: requires }
    sources: [oz-defender-docs]
    misconceptions:
      - belief: I should alert when the timelock executes.
        reality: By execution the delay is already spent; the queue event is the alert that preserves your response window.
        why: Execution is the moment the state actually changes, so it looks like the event of interest.
        source: oz-defender-docs
  - id: dependency-monitoring
    title: Watch the contracts you do not control
    oneLine: Oracle feeds, underlying vaults and staking tokens, bridges and the pools you price against are part of your risk surface, so their upgrades, pauses and depegs must be monitored as if they were yours.
    statement: >
      A protocol's failure modes are not bounded by its own code. If you read a price from an oracle, hold a
      yield-bearing token, route through a bridge, or price against a pool, then that contract's upgrade,
      pause, parameter change or depeg is your incident. The practical step is to build the dependency graph
      explicitly - list every external contract your protocol trusts and what it trusts it for - and then
      apply the same privileged-action alerting to each of them that you apply to your own. Teams
      consistently discover during an incident that the contract that failed was one they had never written
      down as a dependency.
    volatility: stable
    edges:
      - { to: admin-action-alerting, type: requires }
    sources: [arxiv-cross-contract-detection, oz-defender-docs]
  - id: offchain-liveness-signals
    title: Not every incident is theft
    oneLine: A keeper that stopped running, an oracle gone stale, a relayer out of gas, a stalled sequencer, a stuck bridge message - liveness failures need their own inverted alerts, and they are easy to leave out.
    statement: >
      Some incidents are things quietly ceasing to happen: a keeper process exited and nobody liquidated
      anything, an oracle stopped updating but kept returning its last value, a relayer wallet ran out of
      gas, a sequencer stalled, a cross-chain message never got delivered. These produce no anomalous
      transaction to detect, because the defining characteristic is the absence of transactions. They
      therefore need explicitly inverted alerts - fire when the expected thing has not happened within a
      window. The oracle case is the clearest, because the feed's own documentation says so: track the
      update timestamp, decide what staleness is acceptable for your application, and pause or switch to an
      alternate mode if the answer has not been refreshed within the heartbeat. Published monitoring
      checklists put node and endpoint availability in the same category. These alerts are easy to leave out,
      because every tool's default shape is to notice things rather than to notice their absence.
    volatility: stable
    edges:
      - { to: monitoring-is-not-auditing, type: requires }
      - { to: invariant-monitoring, type: contrasts }
    sources: [chainlink-data-feeds-docs, seal-frameworks-monitoring-guidelines, forta-docs]
  - id: monitoring-the-monitor
    title: Silence is ambiguous
    oneLine: The monitoring stack has its own failure modes, so it needs a heartbeat or dead-man's switch - a silent monitor is indistinguishable from a healthy protocol.
    statement: >
      Indexers lag, RPC endpoints fail, bot processes exit, and a monitoring stack in any of those states
      produces exactly what a perfectly healthy protocol produces: nothing. Since alerting systems only speak
      when something is wrong, their silence cannot be interpreted. The fix is inversion: the monitor emits a
      heartbeat on a fixed cadence, and a separate, much simpler checker pages when the heartbeat goes stale.
      The checker must be independent infrastructure, because a dead-man's switch running inside the process
      it watches dies with it. Distinguish stack failures from protocol failures in the alert text too - "the
      monitor is down" and "the protocol is broken" require different first actions.
    volatility: stable
    edges:
      - { to: gap-detection-monitoring, type: requires }
    sources: [forta-docs]
    misconceptions:
      - belief: My monitoring is working because I have not seen any alerts.
        reality: Silence is ambiguous between healthy and dead; only a heartbeat with an independent checker distinguishes them.
        why: Alerting systems are designed to be quiet when things are fine, so quiet feels like confirmation.
        source: forta-docs
  - id: detect-to-respond-pipeline
    title: Detect, alert, decide, act
    oneLine: The production shape is a detector feeding an alert feeding a human decision feeding a privileged transaction, and the pipeline is only as fast as its slowest human step.
    statement: >
      Monitoring that ends at a notification has built half a system. The full shape runs detector to alert
      to decision to action, where the action is a privileged transaction - pause, parameter change,
      revocation - executed by a relayer or signed by humans. Measuring that pipeline end to end is what
      reveals where the time actually goes, and it is almost never the detector. It is the decision step: a
      human being woken, understanding an alert, and choosing. This is why pre-authorised response paths and
      pre-built, pre-simulated calldata exist - they remove work from the slowest hop rather than optimising
      the fastest one.
    volatility: evolving
    edges:
      - { to: invariant-monitoring, type: requires }
      - { to: admin-action-alerting, type: requires }
    sources: [oz-defender-docs]
  - id: automated-response-risk
    title: Auto-pause is a tradeoff, not a free win
    oneLine: Automating the response adds a privileged key to protect and turns any false positive into a liveness incident, so it is usually gated behind multiple signals or restricted to reversible actions.
    statement: >
      Wiring a detector directly to a pause transaction removes the slowest hop and is genuinely powerful. It
      also does two things nobody puts on the diagram. It creates a new privileged key - the automation's -
      which is now part of your attack surface and answers to a program rather than a person. And it converts
      every false positive into a halted protocol, which is a real incident with real user harm, so the
      detector's precision becomes a liveness property. The common mitigations are to require multiple
      independent signals before the automation fires, to restrict automation to actions that are cheaply
      reversible, and to keep the irreversible rungs of the response ladder human-gated.
    volatility: evolving
    edges:
      - { to: detect-to-respond-pipeline, type: requires }
    sources: [oz-defender-docs]
    misconceptions:
      - belief: Auto-pausing on detection is strictly safer.
        reality: It adds a privileged automated key and makes every false positive a liveness incident; it is a tradeoff to be designed, not a free improvement.
        why: Response speed is the obvious metric and the only one the feature advertises.
        source: oz-defender-docs
  - id: mempool-vs-onchain-detection
    title: The mempool is an optimisation, not a backstop
    oneLine: Detecting an exploit in the mempool buys seconds of lead time but misses anything routed privately, so post-inclusion state monitoring must be the reliable layer.
    statement: >
      Watching the public mempool can give you a few seconds of warning before an attack lands, which is
      occasionally decisive. It is not something to rely on. Private transaction routing is an ordinary,
      publicly documented product - Flashbots Protect, for example, sends transactions into a private
      mempool explicitly so they are hidden from anyone watching the public one - so an attacker who wants
      to stay unseen before inclusion simply does. Published estimates of how much total flow is private
      disagree with each other and measure different quantities, so treat the share as unknown and the
      availability as certain. Treat mempool detection as a bonus layer on top of state monitoring that runs
      after inclusion, never as the primary detector. A monitoring design whose coverage depends on seeing
      transactions before they land has a blind spot precisely for the attacker who was careful.
    volatility: evolving
    edges:
      - { to: detect-to-respond-pipeline, type: requires }
      - { to: private-orderflow, type: requires }
    sources: [flashbots-protect-docs, houston-ndss]
    misconceptions:
      - belief: Watching the mempool catches attacks before they land.
        reality: Private routing is a documented, freely available product, so an attack transaction need never appear in the public mempool at all.
        why: MEV-bot lore from before private order flow existed is still the folk model.
        source: flashbots-protect-docs
  - id: alert-enrichment
    title: An alert worth waking up for
    oneLine: An alert arriving with the decoded trace, per-address balance deltas, the funding path and the exposed value turns a twenty-minute triage into a two-minute decision.
    statement: >
      The gap between an alert and a response is triage, and triage time is mostly spent gathering context
      that the detector already had. An alert that arrives with the decoded call trace, the balance change
      per address, how the initiating address was funded, and how much value is still exposed to the same
      mechanism, lets the on-call decide immediately. An alert that says a threshold was crossed starts a
      twenty-minute investigation that a person is conducting while half asleep. Enrichment is therefore not
      presentation polish; it is the difference between an alert and a usable one, and it is the cheapest
      improvement available to a monitoring stack that already fires correctly.
    volatility: evolving
    edges:
      - { to: detect-to-respond-pipeline, type: requires }
    sources: [oz-defender-docs, tenderly-invariant-monitoring]
