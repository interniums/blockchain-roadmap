moduleId: infra-rpc-economics
concepts:
  - id: rpc-is-the-only-door
    title: The endpoint is the whole dependency
    oneLine: Every wallet, frontend, indexer and bot reaches the chain through JSON-RPC, which makes that endpoint both the hard dependency and the most common production outage.
    statement: >
      There is exactly one way for software to reach a chain: a JSON-RPC endpoint served by an execution
      client. Wallets, frontends, backends, indexers, keepers and bots all go through it. That makes the
      endpoint a single shared dependency of every part of a product, and in practice the most frequent cause
      of a user-visible outage - more frequent than a contract bug, because contracts do not have uptime.
      Treating the endpoint as configuration rather than as architecture is why so many products discover
      during an incident that a chain read failing has no defined behaviour anywhere in their codebase.
    volatility: stable
    edges:
      - { to: node-two-process-model, type: requires }
      - { to: rpc-endpoints-aliases, type: requires }
    sources: [execution-apis-spec]
  - id: privacy-of-rpc
    title: Your provider sees everything
    oneLine: The RPC provider observes every address you query and every transaction you broadcast, which is a deanonymisation surface for wallets and an intelligence leak for protocols.
    statement: >
      Every read you issue names an address, a contract and a block - that is what the JSON-RPC method
      signatures require - and every write you broadcast passes through the provider before it reaches a
      mempool. A provider is therefore in a position to link the network identity making the requests to the
      set of on-chain addresses those requests are about. For a wallet this is a deanonymisation surface, and
      it is one users cannot see or opt out of. For a protocol it is a business-intelligence leak: your query
      pattern reveals what you are building before you announce it. Ethereum's own node documentation makes
      the point from the other side - pointing a wallet at your own endpoint rather than a third party's is
      described as a privacy improvement. This is one of the few arguments for self-hosting that does not
      reduce to cost.
    volatility: stable
    edges:
      - { to: rpc-is-the-only-door, type: requires }
    sources: [execution-apis-spec, ethereum-org-nodes-clients, eth-run-a-node]
  - id: credit-unit-pricing
    title: Credits, not requests
    oneLine: Providers bill per internal unit with a per-method multiplier, so a headline price per million units says nothing until you know the multipliers.
    statement: >
      The dominant pricing family does not bill per request. It bills per internal unit - compute units, API
      credits, or simply credits - and assigns each JSON-RPC method its own multiplier. A plan advertising ten
      million units per month is not a plan for ten million calls; how many calls it buys depends entirely on
      which methods you call. Two consequences follow. First, a price per million units is not comparable
      across providers, because the multiplier tables differ and are set by each provider independently.
      Second, your bill is a property of your call mix, which means it can be predicted before you ship by
      counting calls per method and applying the provider's own published table.
    volatility: evolving
    edges:
      - { to: rpc-is-the-only-door, type: requires }
    sources: [alchemy-compute-units]
    misconceptions:
      - belief: A ten-million-requests-per-month plan means ten million RPC calls.
        reality: It means ten million internal units; at a multiplier in the mid twenties for a contract read, that is closer to four hundred thousand calls.
        why: Marketing pages headline the unit count and put the multiplier table several clicks away.
        source: alchemy-compute-units
  - id: method-cost-asymmetry
    title: Methods differ by an order of magnitude
    oneLine: Within a single provider the cheapest and most expensive standard methods differ by more than tenfold, and the expensive ones are the ones product features want.
    statement: >
      A provider's multiplier table is not flat. Simple state reads sit at the bottom; a contract call is a
      little more - Alchemy publishes 26 compute units for `eth_call`, the one cross-checked first-party
      figure available; log queries and tracing methods sit well above that, and some bulk methods carry a
      throughput charge an order of magnitude larger than any single read. Published figures for the
      log-query method disagree between the provider's own table and secondary comparisons, so read the
      current table rather than carrying a number in your head. The teachable shape survives the
      disagreement: the methods that answer interesting product questions are the expensive ones, and a
      feature's cost is set by which methods it needs, not by how many times it runs.
    volatility: hot
    edges:
      - { to: credit-unit-pricing, type: requires }
    sources: [alchemy-compute-units]
  - id: flat-request-pricing
    title: The near-flat pricing family
    oneLine: A second family meters requests with little or no per-method weighting, which changes the cost ranking for log-heavy and trace-heavy workloads.
    statement: >
      Not every provider prices per method. Chainstack, for example, publishes a two-step rule rather than a
      multiplier table: one request unit for a call against latest state, two for a call that needs archive
      state, which includes the debug and trace namespaces. Compare that to a per-method table where a
      contract call and a log query sit at very different points and the consequence is immediate - a
      workload dominated by cheap latest-state reads is usually better off on the weighted table, and one
      dominated by log queries or tracing can be dramatically better off on the near-flat one. Forecasting is
      also simpler, because the bill is close to a function of request count. The correct provider for a
      product is therefore workload-dependent. Cross-provider multiplier comparisons circulating in vendor
      blogs are not reliable enough to quote; the honest method is to count your own call mix and price it
      against each provider's own current table.
    volatility: hot
    edges:
      - { to: credit-unit-pricing, type: contrasts }
    sources: [chainstack-request-units, alchemy-compute-units]
    misconceptions:
      - belief: All providers charge roughly the same per call, so pick on latency.
        reality: Pricing models differ in kind - a per-method multiplier table and a near-flat per-request unit price the same workload very differently, and which wins flips with your call mix.
        why: People compare price per million units across providers as though the unit meant the same thing.
        source: chainstack-request-units
  - id: rate-limit-two-axes
    title: Two limits, enforced independently
    oneLine: Throughput limits produce 429s during bursts and volume caps produce a hard cutoff, and an app can be far under one while hitting the other.
    statement: >
      Providers enforce two limits that have nothing to do with each other. A throughput limit - units or
      requests per second - is what a burst hits, and it produces 429 responses that the application must
      handle. A volume cap - units per day or per month - is what sustained traffic hits, and it produces a
      hard cutoff. Being at five percent of your monthly quota tells you nothing about whether your next
      burst will be throttled. Dashboards foreground the monthly number because it is the one tied to the
      invoice, which is why teams are repeatedly surprised by the other one. The retry policy matters as much
      as the limit: naive immediate retries on 429 turn a brief burst into a sustained throttle, so backoff
      with jitter is a correctness requirement, not a nicety.
    volatility: evolving
    edges:
      - { to: credit-unit-pricing, type: requires }
    sources: [alchemy-compute-units]
    misconceptions:
      - belief: I am under my monthly quota, so I will not be rate limited.
        reality: Throughput limits are enforced independently of volume and produce 429s during bursts regardless of how much quota remains.
        why: The dashboard shows the monthly number because that is the billing number.
        source: alchemy-compute-units
  - id: websocket-vs-poll
    title: Subscriptions trade cost for a reconnection problem
    oneLine: eth_subscribe removes polling cost but introduces reconnection, missed events during the gap, and per-connection limits that are billed separately.
    statement: >
      Polling for new heads costs a request per interval per client, which scales badly with open browser
      tabs. A WebSocket subscription replaces that with a push stream and is far cheaper. What it adds is a
      lifecycle: connections drop, and everything that happened between the drop and the resubscribe is
      simply not delivered. A subscription without a gap-backfill step on reconnect is a pipeline that
      silently loses events at exactly the moments the network is unhealthy. Providers also cap concurrent
      connections and often meter subscriptions separately from HTTP requests, so the cost saving is real but
      not unbounded.
    volatility: evolving
    edges:
      - { to: rate-limit-two-axes, type: requires }
    sources: [execution-apis-spec]
  - id: getlogs-is-the-cost-driver
    title: The log query is where the money goes
    oneLine: Almost every surprise RPC bill traces to wide-range log queries or a contract call in a loop, and providers cap both the block range and the result size.
    statement: >
      Two patterns account for nearly every unexpected RPC invoice: a log query spanning a wide block range,
      and a contract call issued inside a loop over addresses or token ids. Providers respond to the first by
      capping the block range and the result size of a log query, with different caps per provider and
      sometimes per plan, which forces wide scans to be chunked. Chunk size then interacts directly with
      cost, because a smaller chunk means more requests and a larger chunk means an error. Since the L1 gas
      limit rose in late 2025 a single block can carry substantially more logs than it used to, so chunk
      sizes tuned before that change now hit result-size caps more often - a concrete reason to re-tune
      rather than inherit a constant.
    volatility: hot
    edges:
      - { to: method-cost-asymmetry, type: requires }
      - { to: logs-bloom, type: requires }
    sources: [alchemy-compute-units, execution-apis-spec]
  - id: archive-query-definition
    title: What makes a query an archive query
    oneLine: Any call carrying a block tag older than the recent-state window a full node keeps is an archive query, including an ordinary balance-at-a-snapshot read.
    statement: >
      An archive query is not an analytics query. It is any call that names a historical block older than the
      short recent-state window a full node retains - a contract call, a balance read, a storage read, or a
      trace at an old block. That means a routine product feature such as "what was this user's balance at the
      snapshot block" is an archive query, and it will fail against a full node while succeeding against an
      archive node with the identical arguments. For most providers this routes to a different backend rather
      than a different price line, and several top providers have stopped charging an archive premium at all,
      so the old teaching that archive access costs many times more is now provider-specific rather than
      generally true.
    volatility: evolving
    edges:
      - { to: sync-mode-archive, type: requires }
      - { to: rpc-is-the-only-door, type: requires }
    sources: [quicknode-full-vs-archive]
    misconceptions:
      - belief: Archive nodes are for analytics teams.
        reality: Any historical block tag makes it an archive query, including a balance lookup at a governance snapshot block.
        why: The word "archive" suggests cold storage rather than a routine product read.
        source: quicknode-full-vs-archive
  - id: trace-vs-debug-namespace
    title: Two tracing namespaces that are not interchangeable
    oneLine: The trace_ and debug_ namespaces are separate non-standard APIs with different semantics and different provider availability, so code written against one does not run against the other.
    statement: >
      Tracing is not part of the standard execution API. Two conventions exist: a `trace_` namespace
      originating with the OpenEthereum and Erigon lineage, and a `debug_` namespace originating with Geth.
      They differ in method names, in response shape, and in what they will tell you about internal calls.
      Which one an endpoint offers depends on which client is behind it and on what the provider chose to
      expose, so a working integration against one provider can fail entirely against another with the same
      plan. This is the concrete form the portability problem takes for anyone whose product needs internal
      transactions.
    volatility: evolving
    edges:
      - { to: archive-query-definition, type: requires }
      - { to: el-client-landscape, type: requires }
    sources: [execution-apis-spec, geth-ns-eth]
  - id: provider-failover-pattern
    title: Two providers, because outages correlate with the moments you need the chain
    oneLine: Production apps run at least two providers behind a fallback transport, because provider degradation is correlated with congestion, depegs and exploits.
    statement: >
      A single provider is a single point of failure for every read and write your product makes, and you
      should not assume its failures are independent of on-chain events - congestion, a depeg or a live
      exploit drive traffic across the whole ecosystem at once, which is precisely when your product needs
      the chain most, so plan for the failure to arrive at the worst moment. The standard mitigation is a
      fallback transport that takes a ranked list of endpoints and moves to the next one when a request
      fails; viem ships exactly this, with automatic ranking by latency and stability if you enable it. It
      is a few lines of client configuration, which makes it one of the highest return-on-effort changes
      available in this entire track. Its limitation is worth stating: the fallback protects against one
      provider failing, not against your two providers sitting behind the same upstream infrastructure.
    volatility: stable
    edges:
      - { to: rpc-is-the-only-door, type: requires }
    sources: [viem-fallback-transport, execution-apis-spec]
  - id: rpc-consistency-hazard
    title: The height can go backwards
    oneLine: A load-balanced provider fleet can answer two consecutive requests from nodes at different heights, so correctness-sensitive reads must pin an explicit block number.
    statement: >
      One URL is not one server. Behind a provider endpoint is a fleet, and different members of that fleet
      can be at different heights at the same instant. Two consecutive requests using the `latest` tag can
      therefore return data from different blocks, and the second can be older than the first. A UI that
      reads several values with `latest` can show a mutually inconsistent snapshot - a balance from one block
      and a price from another - with no error anywhere. The fix is mechanical: read the block number once,
      then issue every read in that refresh cycle at that explicit number. This also happens to make the
      whole refresh reproducible, which is worth having on its own.
    volatility: stable
    edges:
      - { to: provider-failover-pattern, type: requires }
      - { to: reorg, type: requires }
    sources: [execution-apis-spec]
    misconceptions:
      - belief: Calling latest twice gives non-decreasing block numbers.
        reality: A load-balanced fleet can answer from nodes at different heights, so the height can appear to go backwards between two requests.
        why: Developers reason about the URL as though one server were behind it.
        source: execution-apis-spec
  - id: enhanced-apis-lock-in
    title: Enhanced endpoints are a portability decision
    oneLine: Provider-specific namespaces for token balances, transfer history and webhooks are not standard JSON-RPC, so using them turns a provider migration into a code change.
    statement: >
      Providers offer non-standard convenience endpoints - token balance sets, NFT metadata, transfer
      history, webhook delivery - under their own namespaces. They are genuinely useful and they are
      genuinely lock-in: nothing outside that provider implements them. The moment your product depends on
      one, changing provider stops being a URL change and becomes a rewrite of whatever feature used it. The
      same is true, less obviously, of the tracing namespace choice and of any code tuned to one provider's
      log-range caps. The decision is legitimate either way; what is not legitimate is making it accidentally
      and discovering it during an outage.
    volatility: evolving
    edges:
      - { to: rpc-is-the-only-door, type: requires }
      - { to: trace-vs-debug-namespace, type: deepens }
    sources: [execution-apis-spec]
    misconceptions:
      - belief: Switching providers is a URL change.
        reality: Only if you stayed on standard JSON-RPC; enhanced namespaces, the tracing namespace choice, and per-provider log-range caps all break on migration.
        why: The base URL really is the only configuration most tutorials show.
        source: execution-apis-spec
  - id: self-host-tco
    title: The build-versus-buy line is engineering time
    oneLine: The hardware requirements are published and modest; on-call, fork upgrades, pruning and resync after corruption are the real cost, which is why self-hosting wins only at sustained volume or for capabilities nobody sells.
    statement: >
      Self-hosting a node is cheap in hardware and expensive in attention. The hardware side is the part with
      a price list - the clients publish their own requirements, and they come down to a fast multi-terabyte
      NVMe drive, a few cores and tens of gigabytes of RAM. Published monthly cost figures vary widely and
      contradict each other on scope, so price the machine yourself rather than carrying a number. The costs
      that actually decide the question are the ones without a line item: someone must upgrade the clients
      before every fork, run pruning passes that take the node offline for hours, resync after database
      corruption, and be reachable when the node falls behind. Self-hosting therefore wins in three
      situations: sustained high volume where the provider bill exceeds an engineer's time, a need for
      methods or latency that no provider sells, and a privacy requirement that no contract can satisfy. It
      loses everywhere else, and it loses hardest for small teams, whose scarcest resource is exactly the one
      it consumes.
    volatility: evolving
    edges:
      - { to: offline-pruning-treadmill, type: requires }
      - { to: credit-unit-pricing, type: requires }
    sources: [geth-hardware, geth-dbpruning, eth-run-a-node, chainstack-selfhost-myths]
    misconceptions:
      - belief: Running my own node saves money.
        reality: Hardware is the small line; fork upgrades, pruning, corruption recovery and on-call dominate, and you still pay a provider for failover.
        why: The hardware cost is the only one with an invoice attached.
        source: chainstack-selfhost-myths
  - id: self-host-does-not-remove-provider
    title: Self-hosting is additive, not a replacement
    oneLine: A self-hosted node is periodically offline for pruning, resync and fork upgrades, so budget it as an addition to a provider contract rather than a replacement for one.
    statement: >
      The build-versus-buy framing implies an exclusive choice, and the operational reality does not support
      one. A self-hosted node has scheduled unavailability built into how it is run: Geth's own documentation
      describes offline pruning as a procedure where the client is stopped and the prune can take upwards of
      twelve hours, and that is before any resync after corruption or client upgrade at a fork. Something has
      to serve your product during those windows, which in practice means a commercial endpoint kept as
      failover. The same applies across chains: running one node per chain multiplies the operational burden
      without multiplying the benefit. Budget for self-hosting as an addition to a provider contract, not as
      a way to cancel one. The realistic win is a much smaller provider plan and a much better worst case,
      not a line removed from the spreadsheet.
    volatility: stable
    edges:
      - { to: self-host-tco, type: requires }
      - { to: provider-failover-pattern, type: requires }
    sources: [geth-dbpruning, eth-run-a-node, chainstack-selfhost-myths]
