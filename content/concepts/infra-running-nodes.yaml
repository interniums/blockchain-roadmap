moduleId: infra-running-nodes
concepts:
  - id: node-two-process-model
    title: A node is two processes
    oneLine: Since the Merge, running "an Ethereum node" means running an execution client and a consensus client side by side.
    statement: >
      An Ethereum node is two independent programs. The execution client holds the EVM, the state and the
      JSON-RPC surface; the consensus client runs fork choice, attestations and block production. Neither is
      a node on its own: the execution client will not advance without being told which head to build on,
      and the consensus client cannot validate a payload it cannot execute. They communicate over the Engine
      API on a local port (8551 by convention), authenticated by a shared secret file that both processes
      read. A mismatched or missing secret is the most common reason a freshly configured node sits at a
      block forever without printing an obvious error - it looks stalled rather than broken, because from
      each side's point of view the other one simply never answered.
    volatility: stable
    edges:
      - { to: validator, type: requires }
      - { to: engine-api-jwt, type: deepens }
      - { to: el-cl-split, type: deepens }
    sources: [eth-run-a-node]
    misconceptions:
      - belief: You run "an Ethereum node" as one program.
        reality: You run two processes, an execution client and a consensus client, joined by the authenticated Engine API.
        why: Pre-Merge documentation and most surviving tutorials predate the split.
        source: eth-run-a-node
  - id: el-client-landscape
    title: The execution clients
    oneLine: Geth, Nethermind, Besu, Erigon and Reth are the production execution clients, and they differ most in how they lay out state.
    statement: >
      Five execution clients are in production use: Geth (Go), Nethermind (.NET), Besu (Java), Erigon (Go)
      and Reth (Rust). They implement the same consensus rules and expose the same standard JSON-RPC methods,
      so from an application's point of view they are interchangeable for standard calls. Where they diverge
      is state layout and sync architecture: Erigon and Reth use staged sync with flat key-value state, which
      is what makes them the usual choices for archive workloads and high-throughput historical reads, while
      Geth's classic design is trie-shaped on disk. Non-standard namespaces are the other divergence - the
      tracing methods a client offers are a client property, not a network property.
    volatility: evolving
    edges:
      - { to: node-two-process-model, type: requires }
    sources: [eth-run-a-node, eth-docker-resource-usage]
  - id: cl-client-landscape
    title: The consensus clients
    oneLine: Lighthouse, Prysm, Teku, Nimbus and Lodestar all pair with any execution client, because the Engine API is the only contract between them.
    statement: >
      Five consensus clients are in production use: Lighthouse (Rust), Prysm (Go), Teku (Java), Nimbus (Nim)
      and Lodestar (TypeScript). Any consensus client pairs with any execution client, because the only
      interface between the two halves is the Engine API - there is no vendor pairing and no matched-set
      requirement. This is what makes client diversity actionable rather than aspirational: swapping one half
      of your node is a configuration change and a resync, not a migration.
    volatility: evolving
    edges:
      - { to: node-two-process-model, type: requires }
      - { to: engine-api-jwt, type: deepens }
    sources: [eth-run-a-node]
  - id: client-diversity-risk
    title: Client share is a safety property
    oneLine: A consensus bug in a client above one third of the network stops finality; above two thirds it can finalise an invalid chain.
    statement: >
      If a single execution or consensus client implementation runs more than roughly a third of the network,
      a consensus bug in it can prevent the chain from finalising, because the honest remainder cannot reach
      the two-thirds supermajority. If one implementation exceeds two thirds, a bug in it can finalise a chain
      the other implementations consider invalid, and the damage is no longer recoverable by waiting. The
      practical consequence for an operator is that client choice is not a matter of taste: running a minority
      client is a contribution to network safety that costs you only the unfamiliarity of different logs and
      flags. Current per-client shares change continuously and must be looked up before quoting, not
      remembered.
    volatility: hot
    edges:
      - { to: node-two-process-model, type: requires }
      - { to: finality-is-a-spectrum, type: requires }
      - { to: client-diversity-thresholds, type: deepens }
    sources: [eth-run-a-node]
    misconceptions:
      - belief: Just run Geth, it is the reference implementation.
        reality: A single implementation's supermajority share is precisely the risk client diversity exists to address; the popular choice is the unsafe one at the network level.
        why: Reference implementations feel like the safe default in every other ecosystem.
        source: eth-run-a-node
  - id: sync-mode-snap
    title: Snap sync
    oneLine: Download a recent state snapshot plus headers, replay only recent blocks, reach head in hours - and have no history before the snapshot.
    statement: >
      Snap sync fetches a recent state snapshot together with the header chain, then executes only the blocks
      after that snapshot to reach head. It is the default because it takes hours rather than days. What it
      buys in time it gives up in verification and in history: the node did not itself execute the chain up to
      the snapshot point, and it holds no state from before it. A snap-synced node answers "what is this value
      now" perfectly and "what was this value two years ago" not at all.
    volatility: stable
    edges:
      - { to: node-two-process-model, type: requires }
      - { to: state-root, type: requires }
      - { to: sync-mode-archive, type: contrasts }
    sources: [nethermind-sync, eth-run-a-node]
    misconceptions:
      - belief: Snap sync is a trust-minimised way to obtain history.
        reality: It starts from a state snapshot; there is no independently executed pre-snapshot state and no historical state at all.
        why: The word "sync" implies eventual completeness.
        source: nethermind-sync
  - id: sync-mode-full-exec
    title: Full sync, and what "full" does not mean
    oneLine: A full node re-executes every block from genesis to verify the chain, then keeps all blocks but only recent state.
    statement: >
      A full node in the strict sense executes every block from genesis, which is how it verifies the chain
      for itself rather than trusting a snapshot. Once synced it retains all blocks and receipts but only a
      short window of recent state - on the order of the last hundred-odd blocks. "Full" therefore describes
      the verification, not the retention. This is the single most reliably misunderstood term in node
      operation, and it matters because a full node cannot serve a historical `eth_call` even though it has
      every transaction that ever produced that state.
    volatility: stable
    edges:
      - { to: sync-mode-snap, type: contrasts }
      - { to: sync-mode-archive, type: contrasts }
    sources: [eth-archive-nodes, nethermind-sync]
    misconceptions:
      - belief: A full node keeps the whole history of the chain's state.
        reality: A full node keeps all blocks but only recent state; querying a balance at an old block needs an archive node.
        why: The word "full" implies completeness in ordinary English.
        source: eth-archive-nodes
  - id: sync-mode-archive
    title: Archive nodes
    oneLine: An archive node keeps every historical intermediate state, which is what makes a call at an arbitrary past block possible.
    statement: >
      An archive node retains historical state - the intermediate values and trie nodes for every past block -
      so that `eth_call`, `eth_getBalance` and `eth_getStorageAt` work at an arbitrary historical block tag
      rather than only near head. That retention is the entire difference. Everything else about an archive
      node, including the blocks and receipts it stores, is the same as a full node. Whether you need one is
      decided by a single question: does any feature of your product ask what was true at a block older than
      the recent-state window.
    volatility: stable
    edges:
      - { to: sync-mode-full-exec, type: requires }
      - { to: sync-mode-snap, type: contrasts }
    sources: [eth-archive-nodes, quicknode-full-vs-archive]
  - id: checkpoint-sync
    title: Checkpoint sync
    oneLine: The consensus client starts from a trusted recent finalised state, turning days of sync into minutes at the cost of one bounded trust assumption.
    statement: >
      Rather than replaying the beacon chain from genesis, a consensus client normally starts from a finalised
      checkpoint state fetched over HTTP from a public endpoint or a node you already trust. Sync drops from
      days to minutes. The trust assumption is real but bounded and one-time: you are trusting that the state
      you were handed is on the canonical chain, which you can check against several independent providers and
      a block explorer, and which stops mattering the moment you are following head yourself. Skipping
      checkpoint sync is a defensible choice for a validator being set up with maximum paranoia; it is a waste
      of days for everyone else.
    volatility: stable
    edges:
      - { to: cl-client-landscape, type: requires }
      - { to: finality-is-a-spectrum, type: requires }
    sources: [eth-run-a-node]
  - id: archive-cost-is-state-not-blocks
    title: The archive premium is state, not history
    oneLine: All of Ethereum's blocks and receipts are a few hundred gigabytes; the terabytes are historical state.
    statement: >
      People assume an archive node is large because it stores every transaction. It is not: block bodies and
      receipts for the whole chain are on the order of hundreds of gigabytes. The archive premium is
      historical state - every intermediate trie node that ever existed - and how large that premium is
      depends almost entirely on the client's state layout, because a hash-keyed trie stores far more
      redundant intermediate nodes than a flat key-value layout does. Published archive sizes disagree sharply
      as a result: Geth's own hardware documentation still states more than 12 TB, while secondary sources
      report path-based and flat-state clients landing in the low single-digit terabytes. That disagreement is
      unresolved, so treat any specific figure as client-and-version-specific and measure the client you
      actually intend to run.
    volatility: evolving
    edges:
      - { to: sync-mode-archive, type: requires }
      - { to: merkle-patricia-trie, type: requires }
      - { to: state-growth-problem, type: deepens }
    sources: [eth-archive-nodes, geth-hardware]
    misconceptions:
      - belief: Archive nodes are big because they store all the transactions.
        reality: Blocks and receipts are a small fraction of the total; historical state is the cost.
        why: People reason by analogy to a database of transactions.
        source: eth-archive-nodes
  - id: history-expiry-4444
    title: A node is now allowed to forget
    oneLine: Since 2025 execution clients may drop pre-Merge block bodies and receipts, while still serving all headers.
    statement: >
      Partial history expiry means execution clients may discard pre-Merge block bodies and receipts, on the
      order of several hundred gigabytes, while continuing to serve the full header chain over devp2p. The
      dropped data is not lost to the ecosystem - it moves to portable era files and to the Portal Network -
      but it is no longer something every node is expected to carry. EIP-4444 is the original spec text and
      EIP-7927 is the meta-EIP tracking the rollout phases, which is the one to read for current status. The
      full rolling-window vision, where a node keeps only about a year of history at any time, had not shipped
      as a named hard fork as of August 2026. Two consequences for anyone building on top: historical data
      availability from a random peer is now a weaker assumption than it used to be, and history expiry does
      nothing whatsoever to the archive premium, because that premium is state.
    volatility: hot
    edges:
      - { to: sync-mode-full-exec, type: requires }
      - { to: archive-cost-is-state-not-blocks, type: contrasts }
    sources: [eip-4444, eip-7927, ef-partial-history-expiry]
    misconceptions:
      - belief: History expiry will shrink my archive node.
        reality: Expiry drops pre-Merge bodies and receipts; the archive premium is historical state, which expiry does not touch.
        why: Both are described with the word "history".
        source: ef-partial-history-expiry
  - id: blob-storage-is-separate
    title: Blobs live on the consensus side
    oneLine: Blob data is stored by the consensus client for a short retention window, so blob throughput changes affect consensus-side disk and bandwidth, not execution state.
    statement: >
      Blobs are propagated and stored by the consensus layer with a retention window measured in weeks, after
      which they are pruned. They never enter execution-layer state; the execution client only ever sees the
      versioned hashes committed in the transaction. The operational consequence is that raising blob capacity
      changes the consensus client's disk and bandwidth profile and leaves execution state size alone - so a
      disk-planning conversation about blobs is a conversation about a different process than a disk-planning
      conversation about state growth.
    volatility: evolving
    edges:
      - { to: cl-client-landscape, type: requires }
      - { to: blob, type: requires }
      - { to: archive-cost-is-state-not-blocks, type: contrasts }
    sources: [eth-run-a-node, eip-7594]
  - id: peerdas-node-impact
    title: Sampling breaks the bandwidth link
    oneLine: Under PeerDAS a node samples a subset of a blob's columns instead of downloading every blob, so total blob capacity can rise without every node's bandwidth rising with it.
    statement: >
      Before data availability sampling, every node downloaded every blob, which meant blob capacity and
      per-node bandwidth were the same number scaled by a constant. PeerDAS erasure-codes each blob into
      columns and has each node custody and sample only a subset, so a node can be confident the data was
      published without ever holding all of it. This decouples the two numbers: the network can carry more
      blob data per block without demanding proportionally more of a home node. The exact blob target and
      maximum in force at any moment change through parameter-only forks and should be read from the current
      spec rather than recalled.
    volatility: hot
    edges:
      - { to: blob-storage-is-separate, type: requires }
      - { to: peerdas, type: requires }
    sources: [eip-7594]
    misconceptions:
      - belief: More blobs means my node needs proportionally more bandwidth.
        reality: Under PeerDAS a node samples a subset of the columns, which decouples per-node bandwidth from total blob capacity.
        why: Pre-Fusaka every node did download every blob, which is what older material describes.
        source: eip-7594
  - id: disk-is-the-bottleneck
    title: Random reads, not throughput
    oneLine: Node performance is dominated by random-read latency on the state database, which is why network-attached and SATA storage cause a node to fall behind head.
    statement: >
      Executing a block means thousands of scattered small reads against the state database, so the metric
      that decides whether a node keeps up with head is random-read IOPS and latency - not sequential
      throughput, which is the number cloud storage dashboards advertise. A consumer NVMe SSD attached
      directly to the machine is the practical requirement. Network-attached block storage and SATA or QLC
      drives commonly produce a node that syncs, appears healthy, and then drifts a few blocks behind head
      permanently, which is a much more confusing failure than an outright refusal to start.
    volatility: stable
    edges:
      - { to: sync-mode-snap, type: requires }
    sources: [geth-hardware, eth-run-a-node]
    misconceptions:
      - belief: Any SSD-class cloud volume will do if the throughput number is high.
        reality: Random-read latency decides whether you keep up; network-attached volumes commonly cause a node to fall behind head despite good throughput figures.
        why: Cloud dashboards foreground MB/s, which is the wrong metric for this workload.
        source: geth-hardware
  - id: offline-pruning-treadmill
    title: A node is a recurring chore
    oneLine: Trie-shaped state grows continuously and must be pruned offline, so disk planning is a schedule, not a one-time sizing exercise.
    statement: >
      A hash-based state database accumulates trie nodes that are no longer reachable from any recent state
      root, so disk usage climbs steadily even when the chain's logical state does not. Reclaiming that space
      means taking the node offline and running a pruning pass. Growth-rate figures disagree between sources -
      Geth's own hardware documentation quotes roughly 14 GB per week, while vendor material claims figures
      closer to a gigabyte a day - and the disagreement was not resolved, so the number to plan against is one
      you measure on your own client and sync mode. What is not in dispute is the shape: a node on a
      tight disk is a recurring maintenance commitment with a downtime window attached, and that recurring
      commitment is the real cost line when you compare self-hosting to a provider.
    volatility: evolving
    edges:
      - { to: disk-is-the-bottleneck, type: requires }
      - { to: sync-mode-archive, type: contrasts }
    sources: [geth-dbpruning, geth-hardware]
