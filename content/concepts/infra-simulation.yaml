moduleId: infra-simulation
concepts:
  - id: simulation-definition
    title: Executing without committing
    oneLine: Simulation runs a transaction against a chosen chain state without broadcasting it, to learn its revert reason, gas, state diff, logs and balance changes first.
    statement: >
      Simulation means executing a message against a specific chain state and then discarding the result
      rather than committing it. What you get back is everything an actual execution would have produced -
      whether it reverts and with what data, how much gas it consumed, which storage slots changed, which
      logs it emitted, and how balances moved - with no transaction, no fee and no consequence. Every tool in
      this space, from a plain contract read to a hosted forked network, is a variation on that one idea; they
      differ in which state you can choose, how many calls you can chain, and how much the result is decoded
      for you.
    volatility: stable
    edges:
      - { to: rpc-is-the-only-door, type: requires }
    sources: [eth-simulatev1-spec]
  - id: eth-call-is-the-primitive
    title: The base primitive
    oneLine: eth_call executes one message against one block's state and throws the result away; everything richer is a superset of it.
    statement: >
      `eth_call` is the primitive every other simulation builds on: one message, executed against the state
      at one block, with the resulting state discarded. It gives you the return data and the revert reason
      and nothing else - no trace, no state diff, no ability to express a second call that depends on the
      first, and on most public endpoints no ability to change the state it runs against. Knowing precisely
      where its limits are is what tells you when you have outgrown it, which is earlier than most people
      assume: the moment your scenario involves two steps, or a balance the account does not have, `eth_call`
      cannot express it.
    volatility: stable
    edges:
      - { to: simulation-definition, type: requires }
    sources: [geth-ns-eth, execution-apis-spec]
  - id: estimategas-is-a-simulation
    title: Gas estimation is repeated simulation
    oneLine: eth_estimateGas binary-searches over repeated simulated executions to find a limit that succeeds, which is why it is slow, why it can be wrong, and why it fails loudly on a would-be revert.
    statement: >
      `eth_estimateGas` is not a measurement, it is a search: the node repeatedly simulates the transaction
      at different gas limits until it finds the smallest one that succeeds. Three consequences follow. It is
      far more expensive than a single call, because it is many. It returns a limit that works at the current
      state, not the gas the transaction will actually use, and state-dependent branches - a cold slot that
      will be warm, a first-time storage write - move the real figure. And it fails loudly when the
      transaction would revert at any limit, which makes it an accidental and quite useful pre-flight check
      even when you did not want a number.
    volatility: stable
    edges:
      - { to: eth-call-is-the-primitive, type: requires }
      - { to: tx-gas-limit-vs-used, type: requires }
    sources: [geth-ns-eth]
    misconceptions:
      - belief: eth_estimateGas returns the gas the transaction will use.
        reality: It binary-searches for a limit that succeeds at the current state; actual usage differs, and cold-versus-warm access moves it.
        why: The method name says estimate gas, and the returned number looks like a measurement.
        source: geth-ns-eth
  - id: eth-simulatev1
    title: The standardised simulation method
    oneLine: eth_simulateV1 is the execution-API method for multi-call, multi-block simulation with state and block overrides, which makes bundle simulation a standard capability rather than a vendor feature.
    statement: >
      `eth_simulateV1` is part of the standard Ethereum execution API. It takes a sequence of calls,
      optionally split across several simulated blocks, applies block-level and state-level overrides you
      supply, executes them in order so each sees the previous one's effects, and returns per-call results
      and logs. This is the single most consequential change to this topic since 2024: multi-transaction
      simulation with overrides used to require a commercial product and now does not. Client and provider
      support, and the per-request limits each imposes, still vary and must be checked against the specific
      endpoint you intend to use before a workflow depends on it.
    volatility: hot
    edges:
      - { to: eth-call-is-the-primitive, type: requires }
      - { to: tenderly-virtual-testnets, type: contrasts }
    sources: [eth-simulatev1-spec]
    misconceptions:
      - belief: Simulation requires a paid service.
        reality: Multi-call simulation with state overrides is a standard execution-API method, and a local forked node gives you a full chain for free.
        why: Vendor tooling dominates search results and every tutorial written before the method was standardised.
        source: eth-simulatev1-spec
  - id: state-overrides
    title: Telling the EVM a different truth
    oneLine: Simulation can override balances, nonces, code and individual storage slots before executing, which is what makes "what if this user had the tokens" answerable without deploying anything.
    statement: >
      An override replaces part of the state the simulation runs against: a balance, a nonce, a contract's
      code, or an individual storage slot. This turns simulation from a read-only observation into an
      experiment. You can ask what happens if this address held a million units of a token it does not own,
      what happens if this proxy already pointed at the new implementation, or what happens if this
      allowance were already set. The state override is what removes the setup cost from a realistic
      scenario, and it is the feature that separates a useful simulation from one that can only observe
      things already true.
    volatility: evolving
    edges:
      - { to: eth-simulatev1, type: requires }
      - { to: storage-slot, type: requires }
    sources: [eth-simulatev1-spec]
  - id: bundle-simulation
    title: Sequences that see each other
    oneLine: Simulating a sequence in which each call sees the previous one's state is required for anything realistic - approve then swap, queue then warp then execute - and a single call cannot express it.
    statement: >
      Real scenarios are sequences. An approval followed by a swap; a flash loan followed by the calls it
      funds; a governance proposal queued, the timelock elapsed, and then executed. Each step depends on the
      state the previous step produced, which a single stateless call cannot represent - simulating them
      independently tells you only that each would work if the others already had. Bundle simulation
      executes them in order against accumulating state, which is the only form in which the answer means
      anything. It is also how you discover that a sequence which passes step by step fails as a whole,
      usually on gas or on an intermediate assumption.
    volatility: evolving
    edges:
      - { to: eth-simulatev1, type: requires }
      - { to: eth-call-is-the-primitive, type: contrasts }
    sources: [eth-simulatev1-spec, tenderly-simulations]
  - id: pre-send-ux
    title: Simulation as a product feature
    oneLine: Wallets simulate before signing to show asset diffs and warnings, which is the main defence against blind-signing a drainer approval.
    statement: >
      Wallets now simulate a transaction before presenting it and show the user what it would do to their
      assets - which tokens leave, which approvals are granted, which NFTs move. This is the main practical
      defence against blind signing, because it translates unreadable calldata into a claim the user can
      evaluate. Two things follow for anyone building on chain. Your transactions should be simulable and
      legible, because a transaction whose effects the wallet cannot summarise gets a warning rather than a
      confirmation. And simulation is a product surface with its own failure modes, not merely a debugging
      convenience.
    volatility: evolving
    edges:
      - { to: simulation-definition, type: requires }
    sources: [tenderly-simulations]
  - id: simulation-is-not-a-guarantee
    title: The state drifts between simulation and inclusion
    oneLine: A simulation runs against one state; by inclusion time the price, the nonce, the allowance and the transactions ahead of yours have all moved, which is exactly where sandwiching and stale-approval failures live.
    statement: >
      A green simulation says the transaction would have succeeded against the state it was given. Between
      that moment and inclusion, other transactions execute: prices move, allowances change, nonces advance,
      and someone may deliberately position a transaction ahead of yours. The gap between simulated state and
      included state is not an edge case, it is where an entire class of failures lives, from an ordinary
      slippage revert to a deliberate sandwich. Simulation reduces uncertainty; it does not remove it, and a
      user interface that presents a simulation result as a promise is making a claim the tool cannot
      support. Post-EIP-7702 there is a further wrinkle: an externally owned account can carry a delegation
      designator and execute contract code, so simulating "a transfer from an EOA" may run code, and any
      logic that branches on whether an address has code must account for it.
    volatility: hot
    edges:
      - { to: pre-send-ux, type: requires }
      - { to: simulation-definition, type: contrasts }
      - { to: delegation-designator, type: requires }
    sources: [eth-simulatev1-spec, eip-7702]
    misconceptions:
      - belief: A successful simulation means the transaction will succeed.
        reality: It succeeded against one historical state; price moves, nonce changes, allowance changes and reordering can all flip the outcome by inclusion time.
        why: The tool returns a binary success or failure, which reads as a prediction rather than a conditional.
        source: eth-simulatev1-spec
      - belief: Simulating a transfer from an EOA cannot execute contract code.
        reality: After EIP-7702 an EOA can carry a delegation designator and run the delegate's code.
        why: The account-versus-contract distinction was absolute before that change and is still how most tooling reasons.
        source: eip-7702
  - id: fork-testing-foundry
    title: Rehearsal as a test suite
    oneLine: Running the test suite against real mainnet state at a pinned block is the cheapest way to rehearse anything that touches live protocols, and pinning is required for determinism and for cache reuse.
    statement: >
      Fork testing points a test suite at real chain state, so your contracts execute against the live
      protocols, live balances and live configuration they will meet in production - which unit tests against
      fresh deployments cannot approximate. Pinning the fork to a specific block is not optional in practice:
      an unpinned fork moves under you, which makes results non-reproducible and defeats the local cache, so
      the suite is simultaneously flaky and slow. In this track the interesting use is not testing your own
      logic but rehearsal - executing a real upgrade or a real proposal against real state and then asserting
      that everything else still works.
    volatility: stable
    edges:
      - { to: simulation-definition, type: requires }
      - { to: fork-testing-purpose, type: requires }
      - { to: tenderly-virtual-testnets, type: contrasts }
    sources: [foundry-fork-testing]
    misconceptions:
      - belief: Forking without pinning a block is fine.
        reality: An unpinned fork is non-deterministic and defeats the RPC cache, which makes the suite both flaky and slow.
        why: Omitting the flag is easier and appears to work the first time you run it.
        source: foundry-fork-testing
  - id: anvil-fork
    title: A local forked chain
    oneLine: A local node forked from a pinned block gives you a persistent, controllable chain with impersonation and time control, free, for one developer or one CI job.
    statement: >
      Forking a local development node from a pinned block produces a full chain you control: it persists
      between commands, accepts transactions from any address you choose to impersonate, and lets you move
      time and block number forward at will. That combination covers most rehearsal needs for a single
      developer or a CI run at no cost. Its limit is sharing - it lives on one machine, so a frontend, a
      backend, a bot and a multisig interface cannot all point at it without work, which is precisely the
      gap hosted forked networks exist to fill.
    volatility: stable
    edges:
      - { to: fork-testing-foundry, type: requires }
      - { to: anvil-role, type: requires }
      - { to: tenderly-virtual-testnets, type: contrasts }
    sources: [foundry-fork-testing]
  - id: cheatcodes-for-rehearsal
    title: Impersonation and time travel
    oneLine: Prank, warp, roll, store and deal let a fork test act as a multisig or timelock and skip a delay, which is what makes a full governance rehearsal expressible as a unit test.
    statement: >
      Four capabilities turn a fork test into a rehearsal. Impersonation lets the test send calls as the
      multisig, the timelock or the proxy admin without holding any key. Time and block manipulation let it
      skip a timelock delay or a voting period in an instant. Direct storage writes let it grant voting power
      or set a balance that would otherwise require a long setup. And balance manipulation funds whatever
      needs funding. Together they mean a process that takes a week in production can be executed and
      asserted in a test that runs in seconds - which is what makes rehearsing it routine rather than an
      event.
    volatility: stable
    edges:
      - { to: fork-testing-foundry, type: requires }
      - { to: cheatcode-families, type: requires }
    sources: [foundry-fork-testing]
  - id: tenderly-virtual-testnets
    title: A fork the whole team can point at
    oneLine: A hosted persistent fork with a real RPC URL lets a frontend, a backend, a bot and a multisig interface all rehearse against the same state, which a local fork cannot easily provide.
    statement: >
      A hosted virtual testnet is a persistent fork of mainnet state with its own real RPC endpoint. Because
      it is reachable over the network, every part of a system can point at it simultaneously - the frontend,
      the backend, the keeper bots and the multisig interface - which turns a rehearsal from a contract
      exercise into a whole-product one. That shared endpoint, along with decoded traces, persistence between
      sessions and continuous-integration hooks, is what the hosted option sells now that the ability to
      simulate is standardised. When reading documentation, check whether it describes this product or its
      older predecessor, and note the API version, because older tutorials reference paths that have moved.
    volatility: hot
    edges:
      - { to: fork-testing-foundry, type: contrasts }
      - { to: eth-simulatev1, type: contrasts }
    sources: [tenderly-virtual-testnets-docs, tenderly-simulations]
  - id: upgrade-rehearsal
    title: Rehearsing an upgrade at head
    oneLine: Fork at a recent block, impersonate the admin, execute the real upgrade calldata, then run the existing integration suite plus a storage-layout diff - because upgrades fail on live storage, not on fresh state.
    statement: >
      A new implementation's unit tests run against empty storage, which is the one configuration the
      upgrade will never encounter. The rehearsal that matters is: fork at a recent block so the proxy holds
      real state and real users, impersonate the admin, execute exactly the calldata you intend to send, then
      run your existing integration suite against the upgraded proxy and diff the storage layout of old
      against new. Passing means the upgrade does not break live state - a claim no unit test can make. A
      shifted slot is the classic finding, and it is one that produces silently wrong values rather than a
      revert, so nothing else in your pipeline would catch it.
    volatility: stable
    edges:
      - { to: cheatcodes-for-rehearsal, type: requires }
      - { to: state-overrides, type: requires }
      - { to: proxy-storage-slots, type: requires }
      - { to: storage-collision, type: requires }
    sources: [foundry-fork-testing]
    misconceptions:
      - belief: The new implementation's unit tests passing is enough for an upgrade.
        reality: Upgrades fail on live storage layout and live state, which only a fork rehearsal at head exercises.
        why: Unit tests run against a fresh deployment with empty storage, which never resembles the proxy you are upgrading.
        source: foundry-fork-testing
  - id: governance-rehearsal
    title: Rehearsing the whole governance flow
    oneLine: Propose, reach quorum, queue, skip the timelock and execute on a fork - because most governance failures are in the payload's encoding or the executor's permissions, not in the intent.
    statement: >
      A governance action has to be rehearsed end to end, not just at the moment of execution: propose, get
      the votes by overriding voting power or impersonating large holders, queue, advance time past the
      timelock, execute, and then assert that the intended parameter actually changed. The reason to run the
      whole thing is that governance failures cluster in the mechanical parts - a wrong target address, a
      wrong function selector, an executor that lacks the required role, value not forwarded with the call -
      rather than in the substance. Every one of those produces a failure at execute, days after the vote,
      when the proposal is expensive to redo.
    volatility: evolving
    edges:
      - { to: upgrade-rehearsal, type: requires }
      - { to: timelock-queue-is-the-alert, type: requires }
    sources: [recon-safe-utils, foundry-fork-testing]
    misconceptions:
      - belief: If the proposal's intent is right, the proposal is right.
        reality: Most governance failures are encoding and permission failures in the payload - wrong target, wrong selector, missing role, unforwarded value.
        why: Voters and authors read the description, and nobody reads the calldata.
        source: recon-safe-utils
  - id: calldata-verification
    title: What the proposal actually does
    oneLine: The artifact a voter needs is a human-readable diff of what the calldata does when executed against current state, and simulation is the only way to produce it.
    statement: >
      A governance description is a claim by the author. The verifiable artifact is a simulated execution of
      the actual calldata against current state, rendered as a diff: which contracts are called, with what
      decoded arguments, and which storage values change from what to what. Producing and publishing that
      alongside a serious proposal has become an expectation rather than a courtesy, because it is the only
      thing that lets a voter who does not read Solidity evaluate what they are approving. It is also the
      cheapest defence against a proposal whose description and payload do not match, which is a real attack
      and not a hypothetical one.
    volatility: evolving
    edges:
      - { to: governance-rehearsal, type: requires }
    sources: [recon-safe-utils, tenderly-simulations]
  - id: simulation-in-ci
    title: A rehearsal that runs on every change
    oneLine: Running the fork-based upgrade and governance rehearsal in continuous integration, pinned to a recent block, converts "we simulated it once" into a standing regression check.
    statement: >
      A rehearsal performed once is evidence about one moment. Running the same fork-based rehearsal in
      continuous integration on every change, pinned to a recent block and refreshed on a schedule, turns it
      into a standing assertion that your deployment path still works against the chain as it is now. This
      catches a whole class of drift nothing else does: a dependency upgraded, a parameter changed by someone
      else's governance, a role revoked. The cost is a cache and a pinned block; the alternative is
      discovering the drift during the deployment you were nervous about.
    volatility: evolving
    edges:
      - { to: upgrade-rehearsal, type: requires }
      - { to: ci-pipeline-shape, type: requires }
    sources: [tenderly-vnet-github-action, foundry-fork-testing]
  - id: simulation-for-incident-triage
    title: Simulation during an incident
    oneLine: Simulating the attacker's transaction with a decoded trace is the fastest way to understand the mechanism, and simulating your response before sending it prevents the second incident caused by the fix.
    statement: >
      Simulation has two jobs during an incident and they run in parallel. Replaying the attacker's
      transaction with a decoded trace is the fastest route from "funds are leaving" to "here is the
      mechanism", which is the input every containment decision needs. And simulating your own candidate
      response - the pause, the parameter change, the revocation - against current state before you send it
      is what prevents the well-documented pattern where the remediation causes a second, sometimes larger,
      incident. Both are much faster if the tooling and the forked environment already existed before the
      incident, which is the argument for doing this work while nothing is on fire.
    volatility: evolving
    edges:
      - { to: bundle-simulation, type: requires }
      - { to: detect-to-respond-pipeline, type: requires }
    sources: [tenderly-simulations, recon-safe-utils]
