moduleId: ledgers-accounts
concepts:
  - id: account-four-fields
    title: The four-field account record
    oneLine: An Ethereum account is exactly `[nonce, balance, storageRoot, codeHash]`, RLP-encoded, and nothing more.
    statement: >
      The world state maps an account key to a record of exactly four fields: `nonce`, `balance`,
      `storageRoot` and `codeHash`, RLP-encoded in that order. Everything else you think of as
      "the account" — its address, its code, its storage contents, its token holdings, its
      transaction history — is either the key it sits under, a structure it points at, or data
      derived from elsewhere. This record has not changed since Frontier.
    volatility: stable
    edges:
      - { to: rlp, type: requires }
      - { to: mpt-secure-trie, type: requires }
      - { to: utxo-model, type: contrasts }
      - { to: account, type: recommends }
    sources: [yellow-paper, ethereum-docs-accounts]

  - id: account-address-not-stored
    title: The address is the key, not a field
    oneLine: An account does not store its own address; the address is the trie key under which the record sits.
    statement: >
      The account record contains no address field. The address is the key: the path into the state
      trie is `keccak256(address)`, and the record is the value found at the end of that path. One
      consequence is practical and surprising — given only a state root you cannot enumerate
      accounts, because you would need the keccak preimages to recover addresses from paths.
    volatility: stable
    edges:
      - { to: account-four-fields, type: requires }
      - { to: mpt-secure-trie, type: requires }
      - { to: hash-function, type: applies }
    sources: [yellow-paper, ethereum-docs-accounts]
    misconceptions:
      - belief: The account stores its own address.
        reality: >
          The address is the trie key; the stored record is only the four fields. This is why you
          cannot list every account from a state root without the keccak preimages.
        why: Every database table the reader has used has an id column.
        source: yellow-paper

  - id: account-storage-root
    title: Storage is a separate trie, pointed at
    oneLine: Each account commits to a private 32-byte-key to 32-byte-value trie by a single root inside its record.
    statement: >
      `storageRoot` is a 32-byte commitment to a whole separate trie mapping 32-byte keys to
      32-byte values. The storage is not inside the account record; the record only points at it.
      This indirection is what makes a contract stateful, and it is also why a single `SSTORE`
      cascades: the slot changes, the storage root changes, the account record changes, and the
      world state root changes.
    volatility: stable
    edges:
      - { to: account-four-fields, type: requires }
      - { to: mpt-secure-trie, type: requires }
    sources: [yellow-paper, ethereum-docs-accounts]
    misconceptions:
      - belief: Contract storage is stored inside the account record.
        reality: >
          The account holds only a 32-byte `storageRoot`. Storage is a separate trie, which is why
          one storage write propagates all the way to the world state root.
        why: '"The contract has storage" reads as containment.'
        source: yellow-paper

  - id: account-code-hash
    title: Code is content-addressed, not embedded
    oneLine: '`codeHash` is the keccak of the bytecode; the bytecode itself is fetched by hash from outside the record.'
    statement: >
      `codeHash` is `keccak256(bytecode)`. The bytecode lives outside the account record and is
      retrieved by its hash, so the state model treats code as content-addressed: two accounts with
      identical bytecode reference one code entry in the state model. For an account that has never
      had code, `codeHash` is the hash of the empty byte string.
    volatility: evolving
    edges:
      - { to: account-four-fields, type: requires }
      - { to: hash-function, type: requires }
      - { to: account-storage-root, type: contrasts }
    sources: [yellow-paper, ethereum-docs-accounts]

  - id: accounts-enable-stateful-contracts
    title: Why accounts make contracts possible
    oneLine: Storage addressed by a persistent identity lets many independent callers mutate one piece of state in place.
    statement: >
      Because a contract's storage hangs off a stable account identity rather than being consumed
      and recreated, arbitrary unrelated parties can each mutate the same state in place, in a
      sequence the protocol orders for them. That is the whole basis of a pool, a registry or a
      lending market. It is also precisely the property that forces global ordering, and therefore
      contention and extractable value, onto everything that touches shared state.
    volatility: stable
    edges:
      - { to: account-storage-root, type: requires }
      - { to: account-address-not-stored, type: requires }
      - { to: utxo-model, type: contrasts }
    sources: [yellow-paper, ethereum-docs-accounts, utxo-debt-representation]

  - id: account-balance-wei
    title: ETH lives in a protocol field
    oneLine: Balance is an integer count of wei in the account record itself, not an entry in any ledger contract.
    statement: >
      `balance` is an unsigned integer count of wei, with 10^18 wei to one ether, stored directly in
      the account record. ETH is the only asset the protocol itself knows about. Every other
      "balance" a user sees is a number in some contract's storage mapping, updated by that
      contract's own rules. This asymmetry is why wrapped ETH exists at all, and why native transfer
      semantics differ from token transfer semantics.
    volatility: stable
    edges:
      - { to: account-four-fields, type: requires }
      - { to: erc20-is-a-ledger, type: contrasts }
    sources: [yellow-paper, ethereum-docs-accounts]
    misconceptions:
      - belief: Your ETH balance is a token balance like USDC's.
        reality: >
          ETH lives in the protocol's `balance` field; an ERC-20 balance lives in a contract's
          storage mapping and moves only when that contract says so. The two are not the same kind
          of object.
        why: Wallets render them in one list with one visual treatment.
        source: ethereum-docs-accounts

  - id: empty-account-clearing
    title: Empty accounts are deleted on touch
    oneLine: An account with nonce 0, balance 0 and no code is removed from state when touched, so sending it nothing leaves no trace.
    statement: >
      EIP-161 defines an account as empty when its nonce is zero, its balance is zero and it has no
      code, and requires that a touched empty account be deleted from the state trie rather than
      persisted. Sending zero wei to a fresh address therefore leaves no state entry behind. The
      rule was introduced to remove the millions of junk accounts created by a denial-of-service
      campaign against the state trie.
    volatility: stable
    edges:
      - { to: account-four-fields, type: requires }
    sources: [eip-161]

  - id: account-nonce-eoa
    title: The nonce of a key-controlled account
    oneLine: For an EOA the nonce counts transactions sent, and a transaction is valid only if its nonce equals the account's current one exactly.
    statement: >
      An externally owned account's nonce is the number of transactions it has originated. A
      transaction is valid only when its nonce is exactly equal to the sender's current nonce —
      lower is already spent, higher is not yet eligible. Since Pectra a signed EIP-7702
      authorisation also consumes the authority's nonce, so transactions are no longer the only
      thing that moves the counter.
    volatility: evolving
    edges:
      - { to: account-four-fields, type: requires }
      - { to: account-nonce-contract, type: contrasts }
      - { to: authorization-tuple, type: recommends }
    sources: [yellow-paper, eip-7702]

  - id: account-nonce-contract
    title: The nonce of a contract account
    oneLine: A contract's nonce counts the contracts it has created, and starts at 1.
    statement: >
      For a contract account the nonce counts creations, not sends, and EIP-161 requires it to start
      at 1 rather than 0. It matters because `CREATE` derives the child address from
      `keccak256(rlp([sender, nonce]))`, so a factory's deployment addresses are a deterministic
      function of how many contracts it has already made. Anything that changes the deployment order
      changes every subsequent address.
    volatility: stable
    edges:
      - { to: account-nonce-eoa, type: requires }
      - { to: hash-function, type: requires }
      - { to: create2-address, type: contrasts }
    sources: [eip-161, yellow-paper]
    misconceptions:
      - belief: A contract's nonce is always zero, or at least irrelevant.
        reality: >
          It starts at 1 and increments on every `CREATE`, which is exactly why factory-deployed
          addresses are predictable and why a nonce-free derivation was later added.
        why: The nonce is introduced only as "transaction counter".
        source: eip-161

  - id: nonce-total-ordering
    title: The nonce imposes a total order per sender
    oneLine: Nonce N cannot execute before N-1, so one sender's transactions are strictly sequential whether you want that or not.
    statement: >
      Sequential nonces mean the protocol will not execute a sender's transaction N until N-1 has
      landed. One sender therefore has a strictly ordered, non-concurrent stream of transactions.
      This is the root cause of nonce gaps, of transactions that appear stuck forever, and of the
      whole replacement-by-fee mechanism — and it is the reason a high-throughput backend sending
      from a single key is an ordering problem before it is a gas problem.
    volatility: stable
    edges:
      - { to: account-nonce-eoa, type: requires }
      - { to: nonce-gap, type: recommends }
      - { to: utxo-parallelism, type: contrasts }
    sources: [yellow-paper, ethereum-docs-accounts]

  - id: nonce-replay-protection
    title: The nonce makes a transaction single-use
    oneLine: Re-broadcasting a signed transaction after it lands is a no-op, because its nonce is already consumed.
    statement: >
      Because a transaction is valid only at exactly one nonce value, and that value is consumed
      once the transaction executes, a signed transaction can be included at most once on a given
      chain. Re-broadcasting it later is inert. This is same-chain replay protection, and it is the
      only replay protection the nonce provides.
    volatility: stable
    edges:
      - { to: account-nonce-eoa, type: requires }
      - { to: eip-155-chain-id-replay, type: contrasts }
    sources: [yellow-paper, eip-155]

  - id: eip-155-chain-id-replay
    title: Cross-chain replay is a separate problem
    oneLine: The nonce does not stop replay on another chain; EIP-155 folds the chain id into the signed payload to do that.
    statement: >
      A nonce is per-account per-chain, so the same signed transaction could originally be replayed
      on any chain where that account had the same nonce. EIP-155 folds the chain id into the signed
      payload, so a mainnet transaction is invalid elsewhere. Replay protection is therefore layered:
      the nonce covers same-chain, the chain id covers cross-chain, and an EIP-7702 authorisation
      carries its own chain id and nonce — with the value zero deliberately meaning "valid on every
      EIP-7702 chain".
    volatility: evolving
    edges:
      - { to: nonce-replay-protection, type: requires }
      - { to: authorization-tuple, type: recommends }
    sources: [eip-155, eip-7702, slowmist-7702-practices]
    misconceptions:
      - belief: The nonce prevents replay attacks.
        reality: >
          It prevents replay on the same chain only. Cross-chain replay is prevented by EIP-155's
          chain id, and an EIP-7702 authorisation signed with chain id zero is deliberately
          replayable on every EIP-7702 chain.
        why: '"Replay protection" is taught as a single idea with a single mechanism.'
        source: eip-155

  - id: eoa-contract-line-is-blurred
    title: Having code no longer means being a contract
    oneLine: Since Pectra an EOA can carry a code hash, so "has code" no longer implies "is a contract" and the tx.origin guard is broken.
    statement: >
      Since EIP-7702 shipped in Pectra (May 2025), an externally owned account can carry a non-empty
      `codeHash` holding a 23-byte delegation designator, and the EVM will execute the designated
      contract's code when that account is called. The account is still an EOA: it still has a
      private key and can still originate transactions. The durable consequence for application code
      is that `msg.sender == tx.origin` is no longer a valid test for "the caller is not a contract",
      and any guard relying on it must be replaced.
    volatility: evolving
    edges:
      - { to: account-code-hash, type: requires }
      - { to: account-four-fields, type: contrasts }
      - { to: delegation-designator, type: recommends }
      - { to: eoa-vs-contract-binary, type: supersedes }
    sources: [eip-7702, eip7702-io, arxiv-7702-phishing]
    misconceptions:
      - belief: EOAs have no code, contracts have code — that is the whole distinction.
        reality: >
          Post-EIP-7702 an EOA can have a code hash. The distinction that still holds is that only
          an EOA can be the `tx.origin` of a transaction, because only it has a private key.
        why: It was true from 2015 to May 2025, so it is in every older tutorial.
        source: eip-7702

  - id: utxo-vs-account-tradeoff
    title: What each model buys and what it charges
    oneLine: UTXO gives parallelism and replay-resistance by construction; accounts give shared mutable state and therefore ordering, contention and MEV.
    statement: >
      The two models trade the same currency in opposite directions. UTXO's disjoint inputs make
      independence explicit, so validation parallelises and replay is structurally impossible, but
      long-lived state shared between strangers is painful to express. Accounts make shared mutable
      state natural, and pay for it with a required global ordering, per-sender sequencing via
      nonces, contention over hot state, and value extractable from choosing that ordering. Neither
      is a mistake; the design axis is still live, in Solana's declared access lists and in
      Ethereum's own block-level access list work.
    volatility: evolving
    edges:
      - { to: accounts-enable-stateful-contracts, type: requires }
      - { to: utxo-parallelism, type: requires }
      - { to: solana-account, type: contrasts }
      - { to: block-level-access-list, type: recommends }
    sources: [utxo-debt-representation, ethereum-docs-accounts, eip-7928]
