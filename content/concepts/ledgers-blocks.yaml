moduleId: ledgers-blocks
concepts:
  - id: block-header-is-the-block
    title: The header is the block
    oneLine: Only the header is hashed and linked; everything in the body reaches consensus through a root inside the header.
    statement: >
      A block has a header and a body, but only the header participates in the chain. Transactions,
      receipts and withdrawals are committed to by root hashes carried inside the header, so
      verifying that a body is the right body reduces to recomputing a root and comparing it. This
      is why a light client can follow the chain with headers alone, and why "the block" and "the
      header" are used interchangeably by people who work on clients.
    volatility: evolving
    edges:
      - { to: hash-function, type: requires }
      - { to: mpt-canonical-root, type: requires }
    sources: [yellow-paper, execution-specs]

  - id: block-hash-is-header-hash
    title: The block hash is the header hash
    oneLine: '`blockHash = keccak256(rlp(header))` — nothing in the body is hashed into it directly.'
    statement: >
      The identifier everyone calls the block hash is the keccak-256 of the RLP encoding of the
      header, and only the header. No transaction byte enters that hash except through the roots
      the header carries. As of the Prague fork the header is a fixed-order list of 21 fields; the
      exact declaration order is normative and must be taken from execution-specs, because an RLP
      list is order-sensitive and a reordered field produces a different, wrong hash.
    volatility: evolving
    edges:
      - { to: block-header-is-the-block, type: requires }
      - { to: rlp, type: requires }
    sources: [yellow-paper, execution-specs]

  - id: parent-hash-chain
    title: The parent hash is what makes it a chain
    oneLine: Each header commits to its parent's hash; everything else about ordering is consensus policy layered on top.
    statement: >
      `parentHash` is the single field that makes the data structure a chain: it binds this header
      to exactly one predecessor, so changing any ancestor changes every descendant's hash. Note
      what this does not do — it does not decide which of several valid children is canonical. That
      is the fork-choice rule, a separate piece of consensus machinery layered on top of a structure
      that by itself permits branching.
    volatility: stable
    edges:
      - { to: block-hash-is-header-hash, type: requires }
      - { to: lmd-ghost, type: contrasts }
    sources: [yellow-paper, execution-specs]

  - id: state-root-commits-to-all-accounts
    title: The state root is post-execution
    oneLine: '`stateRoot` is the account trie root *after* the block executes, so it is an outcome, not an input.'
    statement: >
      The `stateRoot` in a header commits to the world state that results from executing this
      block's transactions, not the state it started from. A proposer cannot know it without
      executing, and a verifier cannot check it without executing either. This one design decision
      is why full validation requires re-execution, and it is the thing that stateless clients and
      proving systems are trying to change.
    volatility: stable
    edges:
      - { to: mpt-secure-trie, type: requires }
      - { to: account-four-fields, type: requires }
      - { to: transactions-root, type: contrasts }
    sources: [yellow-paper, execution-specs]
    misconceptions:
      - belief: The `stateRoot` in a header is the state the block started from.
        reality: >
          It is the post-execution root. That is exactly why you cannot validate a block without
          executing it.
        why: '"The block contains the state" reads as a snapshot taken at the top.'
        source: yellow-paper

  - id: transactions-root
    title: Transactions root
    oneLine: The root of an index-keyed trie over the block's transactions, committing to what was included and in what order.
    statement: >
      `transactionsRoot` is the root of a trie whose keys are the RLP-encoded transaction indices
      and whose values are the transaction envelopes. Because the key is the position, the root
      commits not only to the set of transactions but to their order. Unlike `stateRoot`, this is an
      input to execution rather than a result of it.
    volatility: stable
    edges:
      - { to: mpt-index-keyed-tries, type: requires }
      - { to: state-root-commits-to-all-accounts, type: contrasts }
    sources: [yellow-paper, execution-specs]

  - id: receipts-root
    title: Receipts root
    oneLine: The root of an index-keyed trie over receipts, which is what makes an event log provable off-chain.
    statement: >
      Each transaction produces a receipt carrying its status, the cumulative gas used at that
      point, its logs and a bloom filter over them. `receiptsRoot` commits to those receipts in
      index order. This root is the reason a log can be proven to an off-chain verifier at all: a
      Merkle proof against `receiptsRoot`, plus a header the verifier already trusts, establishes
      that a specific event was emitted by a specific transaction in a specific block.
    volatility: stable
    edges:
      - { to: mpt-index-keyed-tries, type: requires }
      - { to: transactions-root, type: contrasts }
      - { to: logs-still-committed, type: recommends }
    sources: [yellow-paper, execution-specs]

  - id: logs-bloom
    title: The block's bloom filter
    oneLine: A 2048-bit filter over every log address and topic in the block; false positives are expected, false negatives are not.
    statement: >
      `logsBloom` is a 2048-bit filter aggregating the addresses and topics of every log in the
      block. Its purpose is negative: a client scanning for events can rule out a block without
      downloading any receipt. Because it is a bloom filter, a hit means "possibly present" and must
      be confirmed against the receipts, while a miss is conclusive. Any log-scanning indexer is
      built on exactly this asymmetry.
    volatility: stable
    edges:
      - { to: receipts-root, type: requires }
      - { to: block-bloom-is-a-union, type: recommends }
    sources: [yellow-paper, execution-specs]

  - id: withdrawals-root
    title: Withdrawals are operations, not transactions
    oneLine: Validator withdrawals get their own root and their own trie — no sender, no gas, no receipt, no transaction hash.
    statement: >
      EIP-4895 added `withdrawalsRoot` to the header for beacon-chain withdrawals, which are
      system-level balance credits rather than transactions. They have no sender, consume no gas,
      produce no receipt, and never appear in the transactions trie. An indexer that reconciles
      balances by walking transactions will silently miss all validator income, which is one of the
      most common quiet data bugs in Ethereum tooling.
    volatility: stable
    edges:
      - { to: block-header-is-the-block, type: requires }
      - { to: account-balance-wei, type: applies }
      - { to: transactions-root, type: contrasts }
    sources: [eip-4895]
    misconceptions:
      - belief: Withdrawals are transactions sent from the deposit contract.
        reality: >
          They are system-level operations with their own trie and root — no sender, no gas, no
          receipt, invisible to `eth_getTransactionByHash`.
        why: Every balance change the reader has previously seen was a transaction.
        source: eip-4895

  - id: requests-hash
    title: The requests hash is not a trie root
    oneLine: Pectra's `requestsHash` is a SHA-256 accumulator over typed execution-layer requests, not a Merkle Patricia root.
    statement: >
      EIP-7685 replaced per-type request lists with a single `requestsHash` covering typed requests
      that flow from the execution layer to the consensus layer — deposits, withdrawal requests and
      consolidations. It is the only root-shaped field in the header that is not a Merkle Patricia
      root: it is a SHA-256 accumulator over the typed request byte arrays, using a different hash
      function and a different structure from everything around it. The precise nesting should be
      read out of the final EIP text before writing code against it.
    volatility: evolving
    edges:
      - { to: block-header-is-the-block, type: requires }
      - { to: withdrawals-root, type: contrasts }
    sources: [eip-7685]
    misconceptions:
      - belief: '`requestsHash` is another Merkle Patricia root.'
        reality: >
          It is a SHA-256 accumulator over typed request byte arrays — different hash function,
          different structure, no trie.
        why: Every other root in the header is an MPT root.
        source: eip-7685

  - id: post-merge-fossil-fields
    title: Fields kept only so the encoding never changed
    oneLine: '`difficulty`, `nonce` and `ommersHash` are frozen constants retained purely to preserve the header layout.'
    statement: >
      Three header fields survive the Merge as fixed values: `difficulty` is zero, the header
      `nonce` is all zero bytes, and `ommersHash` is the constant hash of an empty list. They carry
      no information. They exist because removing a field from an RLP list changes the encoding of
      every field after it, and the ecosystem preferred dead weight to a flag day. Reading a header
      is therefore partly reading fork history.
    volatility: stable
    edges:
      - { to: block-header-is-the-block, type: requires }
      - { to: rlp, type: applies }
    sources: [yellow-paper, eip-3675, execution-specs]

  - id: ommers-are-historical
    title: Ommers are gone, not rare
    oneLine: The ommers list is always empty post-Merge, because a single scheduled proposer per slot makes near-miss blocks impossible.
    statement: >
      Under proof of work, ommers (uncles) rewarded blocks that were valid but lost the race,
      reducing the centralising advantage of low latency. Proof of stake assigns exactly one
      proposer per slot, so there is no race to nearly win. The list is always empty and
      `ommersHash` is a constant. Any material presenting uncles as an occasional occurrence is
      describing a chain that no longer exists.
    volatility: stable
    edges:
      - { to: post-merge-fossil-fields, type: requires }
      - { to: slot-vs-block, type: contrasts }
    sources: [yellow-paper, eip-3675]
    misconceptions:
      - belief: Uncles still happen, they are just rare now.
        reality: >
          The list is always empty and `ommersHash` is a fixed constant. The field survives only so
          the RLP layout did not have to change.
        why: The field still prints in every header you dump.
        source: eip-3675

  - id: prev-randao
    title: prevRandao is not safe randomness
    oneLine: The old mixHash slot now carries the beacon chain's RANDAO output, which the slot's proposer can bias by declining to propose.
    statement: >
      EIP-4399 repurposed the `mixHash` slot to carry `prevRandao`, the beacon chain's accumulated
      RANDAO value, and exposed it to the EVM. It is unpredictable to most parties most of the time,
      but it is not unbiasable: a proposer who sees an unfavourable outcome can decline to propose,
      grinding one bit per slot they control. For any prize larger than the block reward that trade
      is rational, which is why contracts that draw from `block.prevrandao` are exploitable by the
      one party who most easily can.
    volatility: stable
    edges:
      - { to: post-merge-fossil-fields, type: requires }
    sources: [eip-4399]
    misconceptions:
      - belief: '`block.prevrandao` is on-chain randomness.'
        reality: >
          It is RANDAO output, and the slot proposer can bias it by choosing not to propose — one
          grind per slot they control, worth doing whenever the prize exceeds the block reward.
        why: It replaced `difficulty`, occupies a random-looking field, and is easy to reach.
        source: eip-4399

  - id: slot-vs-block
    title: Slots tick, blocks do not
    oneLine: A slot happens every 12 seconds whether or not anyone proposes; a block exists only if the assigned proposer produced one.
    statement: >
      Consensus time is divided into fixed 12-second slots, each with one assigned proposer. If that
      proposer misses their slot, the slot passes with no block. Block numbers stay contiguous
      across a missed slot while slot numbers do not, so the two counters drift apart permanently.
      `blockNumber` is therefore not a clock, and `block.timestamp` is proposer-set within loose
      bounds rather than an authoritative time. Slot time is still 12 seconds as of August 2026:
      EIP-7782's six-second proposal was declined for Glamsterdam and deferred.
    volatility: evolving
    edges:
      - { to: block-header-is-the-block, type: requires }
      - { to: state-machine-replication, type: requires }
      - { to: validator, type: recommends }
    sources: [ethereum-docs-pos, eip-7782]
    misconceptions:
      - belief: A block is produced every 12 seconds.
        reality: >
          A slot occurs every 12 seconds. If the assigned proposer misses it there is no block at
          all, so average block time sits slightly above 12 seconds and varies.
        why: Pre-Merge Ethereum had probabilistic block times around 13 seconds and the framing stuck.
        source: ethereum-docs-pos
      - belief: Multiplying block number by 12 gives you elapsed time.
        reality: >
          Missed slots break the mapping. Block numbers skip nothing; slot numbers do. Use
          timestamps, and treat even those as proposer-influenced.
        why: The two counters look interchangeable in an explorer.
        source: ethereum-docs-pos

  - id: epoch-and-finality-timing
    title: How long finality actually takes
    oneLine: 32 slots make an epoch of 6.4 minutes, and Casper FFG justifies then finalises, so finality trails the head by about two epochs.
    statement: >
      Thirty-two slots form an epoch, which is 6.4 minutes. Casper FFG operates on epoch-boundary
      checkpoints: a checkpoint is first justified and then finalised, which by construction places
      finality roughly two epochs — about 12.8 minutes — behind the head. Measured wall-clock
      medians reported by third-party benchmarks have come in noticeably higher than the mechanism's
      lower bound, so treat 12.8 minutes as the floor rather than the observed number.
    volatility: evolving
    edges:
      - { to: slot-vs-block, type: requires }
      - { to: casper-ffg, type: requires }
      - { to: accountable-safety, type: recommends }
    sources: [ethereum-docs-pos, eth2book-slashing]

  - id: parent-beacon-block-root
    title: A window from the EVM into consensus
    oneLine: EIP-4788 puts the previous beacon block root in the execution header and exposes it on-chain, so contracts can verify consensus-layer state without an oracle.
    statement: >
      `parentBeaconBlockRoot` carries the root of the previous beacon block into the execution
      header, and a system ring-buffer contract makes recent roots readable from the EVM. That gives
      a contract a trust-minimised anchor into consensus-layer state: given the root and a Merkle
      proof supplied as calldata, it can verify a validator's balance or status without asking an
      oracle. Staking, restaking and light-client contracts are all built on this one field.
    volatility: stable
    edges:
      - { to: block-header-is-the-block, type: requires }
      - { to: slot-vs-block, type: requires }
      - { to: state-root-commits-to-all-accounts, type: contrasts }
    sources: [eip-4788]

  - id: block-gas-limit
    title: The block gas limit
    oneLine: A validator-adjustable ceiling on total gas per block, doubled to 60M in Fusaka, with a separate per-transaction cap on top.
    statement: >
      `gasLimit` is the ceiling on total gas a block may consume, adjustable by proposers within a
      small bound per block; `gasUsed` is what was actually consumed, and the base fee for the next
      block is derived from how `gasUsed` compared with the target. Since Fusaka (December 2025) the
      default limit is 60 million, doubled from the 30 million that held from 2021, and EIP-7825
      adds a per-transaction cap of roughly 16.78 million so no single transaction can occupy a
      whole block. Material quoting a 30 million limit is out of date.
    volatility: hot
    edges:
      - { to: block-header-is-the-block, type: requires }
      - { to: eip-1559-tfm, type: applies }
      - { to: blob-gas-fields, type: contrasts }
    sources: [eip-7935, eip-1559, eip-7825]
    misconceptions:
      - belief: The block gas limit is 30 million.
        reality: >
          It has been 60 million since Fusaka, and a per-transaction cap of about 16.78 million now
          exists as well.
        why: 30 million was correct from 2021 until late 2025.
        source: eip-7935

  - id: blob-gas-fields
    title: The second fee market
    oneLine: '`blobGasUsed` and `excessBlobGas` run an EIP-1559 market for blob space that is entirely independent of the gas market.'
    statement: >
      Two header fields, `blobGasUsed` and `excessBlobGas`, drive a second EIP-1559-style pricing
      curve for blob data. It shares no state with the execution gas market: the blob base fee
      responds only to blob consumption, so blob prices have sat near their floor for long stretches
      while execution gas was expensive, and can spike while gas is cheap. For anyone costing an L2,
      these are two separate bills that move separately.
    volatility: hot
    edges:
      - { to: block-gas-limit, type: requires }
      - { to: blob-transaction, type: recommends }
      - { to: eip-1559-tfm, type: applies }
    sources: [eip-4844]
    misconceptions:
      - belief: Blob fees and gas fees are the same market.
        reality: >
          `excessBlobGas` drives an independent curve. The two prices are routinely uncorrelated and
          can move in opposite directions in the same block.
        why: Both are called "gas".
        source: eip-4844
