moduleId: ledgers-finality
concepts:
  - id: head-vs-justified-vs-finalized
    title: Three levels of done
    oneLine: Head, justified checkpoint and finalized checkpoint are three different confidence levels, each with a different reversal cost.
    statement: >
      Ethereum reports three distinct states, not one. The head is the current tip chosen by the
      fork choice and can change at any moment. A justified checkpoint has a two-thirds supermajority
      attesting to it and is one step from final. A finalized checkpoint cannot be reverted without
      at least a third of all stake signing provably contradictory messages, which is a price rather
      than an impossibility. "Confirmed" is a word applications invent; the protocol offers these
      three.
    volatility: stable
    edges:
      - { to: finality-is-a-spectrum, type: requires }
      - { to: casper-ffg, type: requires }
      - { to: epoch-and-finality-timing, type: requires }
    sources: [ethereum-docs-pos, eth2book-slashing]
    misconceptions:
      - belief: '"12 confirmations" is a meaningful Ethereum concept.'
        reality: >
          Proof of stake exposes explicit justified and finalized states. Counting confirmations is
          a proof-of-work habit that measures nothing here.
        why: Exchanges and wallets carried the vocabulary over from Bitcoin.
        source: ethereum-docs-pos
      - belief: Finality means a transaction can never be reversed.
        reality: >
          Reversal requires at least a third of total stake to be slashed. That is a very large
          price, not an impossibility, and the honest framing is cost rather than certainty.
        why: The word "final" is absolute in ordinary English.
        source: eth2book-slashing

  - id: reorg
    title: What a reorg is
    oneLine: The canonical head changes, so transactions that were included become un-included.
    statement: >
      A reorganisation happens when the fork choice moves to a different branch, discarding blocks
      that were previously canonical. Transactions in the discarded blocks are not reversed in any
      compensating sense — they simply were never applied on the chain that survives, and they may
      or may not be re-included later, in a different order, with different results. Anything an
      application did in response to a discarded block is now wrong.
    volatility: stable
    edges:
      - { to: head-vs-justified-vs-finalized, type: requires }
      - { to: lmd-ghost, type: requires }
    sources: [ethereum-docs-pos]

  - id: reorg-depth-in-practice
    title: What reorgs actually look like
    oneLine: Ordinary reorgs are one or two slots and cost the attacker nothing; deep ones require coordination and enormous stake.
    statement: >
      Short reorgs of one or two slots occur without any attack, from ordinary timing and
      propagation, and short reorgs driven by extractable value are achievable well below any
      slashing threshold — they cost nothing in slashing terms. Deep reorgs are a different object
      entirely: reverting a finalized checkpoint requires a third of all stake to be destroyed. The
      practical consequence is that the risk curve is steep and non-linear, and "included" and
      "finalized" are two different safety claims, not two points on one scale.
    volatility: stable
    edges:
      - { to: reorg, type: requires }
      - { to: correlation-penalty, type: requires }
      - { to: cheap-reorgs-exist, type: deepens }
      - { to: ex-ante-reorg, type: recommends }
    sources: [ethereum-docs-pos, eth2book-slashing, arxiv-low-cost-attacks]

  - id: confirmation-policy
    title: Confirmation policy is a product decision
    oneLine: How long to wait before treating something as done is derived from value at risk, not from a default someone copied.
    statement: >
      Choosing what to wait for is an economic decision made per action: the wait should be long
      enough that the cost of reversing the chain to that depth exceeds what reversing it would earn
      an attacker against you. A game action and a large settlement therefore have genuinely
      different correct answers, and a single global "confirmations" constant is almost always
      wrong. Published rules of thumb about confirmation counts on Ethereum are inherited from
      proof-of-work practice and are not supported.
    volatility: stable
    edges:
      - { to: reorg-depth-in-practice, type: requires }
      - { to: finality-reversal-cost-model, type: requires }
      - { to: attack-cost-is-not-attack-profit, type: applies }
      - { to: confirmation-rule, type: recommends }
    sources: [ethereum-docs-pos, eth2book-slashing]

  - id: mev
    title: Maximal extractable value
    oneLine: Value obtainable purely by choosing what goes into a block and in what order.
    statement: >
      Because a block producer controls inclusion and ordering, some value is available to whoever
      holds that control — independent of fees and independent of the transactions' own intent.
      Arbitrage between venues, liquidations, and sandwiching a user's trade are all instances. The
      existence of this value is a consequence of shared mutable state plus an ordering monopoly per
      block; it is not a bug that a patch removes, and several protocols depend on the benign parts
      of it functioning.
    volatility: evolving
    edges:
      - { to: mempool-pending-is-not-a-queue, type: requires }
      - { to: accounts-enable-stateful-contracts, type: requires }
      - { to: mev-definition, type: deepens }
    sources: [mev-boost-docs, arxiv-private-orderflow]
    misconceptions:
      - belief: MEV is purely theft.
        reality: >
          It includes arbitrage and liquidations that lending markets and DEXes actively rely on.
          The live problems are distribution and centralisation, not existence.
        why: The visible examples are the extractive ones.
        source: mev-boost-docs

  - id: pbs
    title: Proposer-builder separation
    oneLine: Split who assembles a block from who proposes it, so a proposer needs no extraction sophistication to earn what a block is worth.
    statement: >
      Without separation, capturing extractable value requires the proposer to be sophisticated,
      which advantages large operators and pushes toward centralised staking. Proposer-builder
      separation splits the role: specialists compete to build the most valuable block, and the
      proposer simply picks the highest bid. The proposer needs no strategy at all. Today this
      exists as an out-of-protocol market; enshrining it in the protocol is an active line of
      research.
    volatility: evolving
    edges:
      - { to: mev, type: requires }
      - { to: epbs, type: recommends }
    sources: [mev-boost-docs, ethereum-roadmap-pbs]

  - id: mev-boost
    title: MEV-Boost
    oneLine: The out-of-protocol implementation of proposer-builder separation through which the large majority of Ethereum blocks are built.
    statement: >
      MEV-Boost is middleware run alongside a validator's own clients. It solicits bids from relays,
      presents the proposer with the highest, and has the proposer sign the winning block's header
      before ever seeing its contents. It is not part of the protocol, and validators can turn it
      off — but roughly nine in ten blocks are built this way, so the realistic picture of Ethereum
      block production is this pipeline rather than the textbook one.
    volatility: hot
    edges:
      - { to: pbs, type: requires }
      - { to: mev-boost-today, type: deepens }
    sources: [mev-boost-docs, mev-boost-repo]
    misconceptions:
      - belief: Validators build the blocks they propose.
        reality: >
          The large majority outsource construction to external builders through relays and sign
          only a header.
        why: Every description of proof of stake says the proposer produces the block.
        source: mev-boost-docs

  - id: searcher-builder-relay-proposer
    title: The four roles
    oneLine: Searchers find opportunities, builders assemble blocks, relays escrow and validate them, and proposers sign headers.
    statement: >
      Four distinct parties make a modern block. Searchers detect profitable opportunities and
      submit bundles. Builders assemble complete blocks from bundles and order flow and bid for the
      slot. Relays receive builder blocks, validate them, and hold them. Proposers receive only bids
      and headers and sign the best one. Each hop has its own incentives and its own failure mode,
      and the honest question to ask of the pipeline is what each party can do to the others.
    volatility: hot
    edges:
      - { to: mev-boost, type: requires }
      - { to: private-orderflow, type: requires }
      - { to: mev-searcher, type: recommends }
    sources: [mev-boost-docs, mev-boost-repo]

  - id: relay-escrow
    title: The relay holds the payload
    oneLine: The proposer sees only the header and must sign it before the relay releases the block body.
    statement: >
      The relay exists to solve a mutual trust problem: a proposer shown a full block could steal
      its contents and propose them as their own, while a proposer shown nothing has no assurance
      the block is valid. The relay validates the builder's block, gives the proposer only the
      header, and releases the payload once the header is signed. This makes the relay a trusted
      party in the critical path — if it fails to publish after the header is signed, the proposer
      has committed to a block that may never appear.
    volatility: hot
    edges:
      - { to: searcher-builder-relay-proposer, type: requires }
      - { to: mev-relay-trust, type: deepens }
    sources: [mev-boost-docs, aestus-relay]

  - id: builder-centralization
    title: Block building is extremely concentrated
    oneLine: A very small number of builders produce the large majority of Ethereum blocks, and this is the central argument for enshrining PBS.
    statement: >
      Block construction has concentrated into a handful of firms. Published 2026 measurements put
      two builders somewhere in the region of three quarters to four fifths of all blocks, but they
      name different pairs and cannot both be current, so the correct move is to measure it live
      rather than quote a figure. What is not in dispute is the shape: the top two dominate, the top
      four are close to everything, and exclusive order flow rather than technical advantage is the
      driver. This is the concrete motivation for in-protocol PBS and for inclusion-list proposals.
    volatility: hot
    edges:
      - { to: mev-boost, type: requires }
      - { to: private-orderflow-centralises-building, type: requires }
      - { to: epbs, type: recommends }
      - { to: focil, type: recommends }
    sources: [mev-boost-docs, arxiv-private-orderflow, ethereum-roadmap-pbs]
