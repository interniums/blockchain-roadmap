moduleId: ledgers-mempool
concepts:
  - id: mempool-is-not-global
    title: There is no global mempool
    oneLine: Every node keeps its own pool with its own limits and eviction policy, so two nodes legitimately disagree about what is pending.
    statement: >
      The mempool is not a shared data structure. Each node maintains a private pool, filled by
      gossip from its peers, bounded by its own configured limits and pruned by its own eviction
      policy. Two honest, fully synced nodes can hold different sets of pending transactions at the
      same moment and both be correct. There is no object anywhere that is "the" mempool, and no
      party observes the union of them.
    volatility: stable
    edges:
      - { to: gossipsub, type: requires }
      - { to: p2p-overlay, type: requires }
    sources: [geth-txpool, geth-blobpool]
    misconceptions:
      - belief: There is a global mempool.
        reality: >
          Each node has its own pool with its own limits. The union is not observable and no node
          holds it, so "is my transaction in the mempool" is only ever answerable per node.
        why: Block explorers present a single authoritative-looking "pending" list.
        source: geth-txpool

  - id: mempool-view-is-node-local
    title: Every pending query answers for one node
    oneLine: '`txpool_content`, unmined `eth_getTransactionByHash` and pending subscriptions all answer for the node you asked, and only that node.'
    statement: >
      Every RPC method that reports on unconfirmed transactions is a report on the answering node's
      own pool. This is why two RPC providers return different answers to the same question at the
      same instant, why a transaction can be "not found" on one endpoint and pending on another, and
      why any monitoring built on a single provider is measuring that provider rather than the
      network.
    volatility: stable
    edges:
      - { to: mempool-is-not-global, type: requires }
    sources: [geth-txpool]

  - id: pending-vs-queued
    title: Pending and queued are different states
    oneLine: Pending transactions are executable now; queued transactions sit behind a nonce gap and are neither gossiped nor mined.
    statement: >
      Geth splits its pool in two. A transaction is pending when its nonce is contiguous from the
      sender's current nonce, making it executable immediately. It is queued when a nonce gap sits
      in front of it. Queued transactions are held but not promoted, not propagated to peers and not
      available to a block producer. The wallet showing "pending" for both states is the source of a
      great deal of confusion.
    volatility: evolving
    edges:
      - { to: nonce-total-ordering, type: requires }
      - { to: mempool-is-not-global, type: requires }
    sources: [geth-txpool]

  - id: nonce-gap
    title: A nonce gap is not slowness
    oneLine: Sending nonce N+1 before N leaves N+1 structurally ineligible until N lands — not slow, ineligible.
    statement: >
      If a sender broadcasts nonce N+1 while N has never been broadcast, N+1 sits queued
      indefinitely. No fee increase helps, because the transaction is not competing for inclusion at
      all — it is not eligible for it. Most incidents reported as "stuck transaction" are this, and
      the fix is to land the missing nonce, not to bid higher on the one behind it.
    volatility: stable
    edges:
      - { to: pending-vs-queued, type: requires }
      - { to: account-nonce-eoa, type: requires }
      - { to: transaction-replacement, type: contrasts }
    sources: [geth-txpool]
    misconceptions:
      - belief: Raising the priority fee gets a queued transaction in faster.
        reality: >
          A tip helps only relative to competitors for the same block. It does nothing at all for a
          transaction sitting behind a nonce gap, and nothing for one routed privately.
        why: '"Tip" sounds like a speed dial.'
        source: eip-1559

  - id: transaction-replacement
    title: Replacement, not cancellation
    oneLine: There is no cancel and no edit — only broadcasting a different transaction at the same sender and nonce and letting them race.
    statement: >
      A signed transaction cannot be withdrawn from the network. The only available move is to
      broadcast a different transaction with the same sender and the same nonce; whichever is
      included first invalidates the other, because the nonce can only be consumed once. Every
      "cancel" and "speed up" button in every wallet is this operation, and it can lose.
    volatility: stable
    edges:
      - { to: account-nonce-eoa, type: requires }
      - { to: nonce-gap, type: contrasts }
    sources: [geth-txpool]
    misconceptions:
      - belief: I can cancel a transaction I already broadcast.
        reality: >
          You can only race it with a replacement at the same nonce, and you may lose the race. The
          wallet's Cancel button is exactly this and nothing more.
        why: The button says Cancel.
        source: geth-txpool

  - id: price-bump-rule
    title: The replacement price bump is client policy
    oneLine: Nodes reject a replacement unless it beats the incumbent's fees by a configured margin — a client anti-DoS rule, not a consensus rule.
    statement: >
      A node will only accept a replacement whose fees exceed the incumbent's by a minimum
      percentage on both the max fee and the priority fee, and it rejects anything smaller with a
      "replacement transaction underpriced" error. This margin exists to stop cheap pool churn. It
      is client configuration rather than protocol: geth's documented default for the legacy pool is
      ten percent, published figures of ten and twelve and a half percent both circulate, and other
      clients set their own. Never hard-code the number — measure the endpoint you actually use.
    volatility: evolving
    edges:
      - { to: transaction-replacement, type: requires }
      - { to: eip-1559-fee-fields, type: requires }
      - { to: blob-pool-different-rules, type: contrasts }
    sources: [geth-txpool]
    misconceptions:
      - belief: Any higher gas price replaces a pending transaction.
        reality: >
          Nodes enforce a minimum percentage bump on both fee fields, so plus one wei is rejected.
          The margin is client policy and differs across clients and pools.
        why: The rule is in no EIP, so it is almost never taught.
        source: geth-txpool

  - id: cancellation-is-a-replacement
    title: Cancelling costs gas and can fail
    oneLine: Cancelling means sending a zero-value self-transfer at the same nonce with bumped fees; it can lose the race, and it costs gas when it wins.
    statement: >
      The standard cancel is a self-transfer of zero ether at the same nonce, with fees bumped past
      the replacement margin. It has two properties users are never told about: it can lose to the
      original transaction and change nothing, and when it wins it is itself a transaction that
      consumes gas and appears on-chain forever. There is no free undo.
    volatility: stable
    edges:
      - { to: transaction-replacement, type: requires }
      - { to: price-bump-rule, type: requires }
    sources: [geth-txpool]

  - id: eip-1559-fee-fields
    title: What the two fee fields actually mean
    oneLine: '`maxFeePerGas` is your tolerance ceiling; `maxPriorityFeePerGas` is the part the block producer keeps.'
    statement: >
      Under EIP-1559 a transaction names two numbers. `maxFeePerGas` is the highest total per-gas
      price you will accept; if the base fee rises above it, your transaction is simply ineligible
      for that block. `maxPriorityFeePerGas` is the tip retained by the block producer, and it is
      what you are competing on against other transactions for the same block. The base-fee portion
      is burned, and any difference between your ceiling and the realised price is refunded
      automatically.
    volatility: stable
    edges:
      - { to: block-gas-limit, type: requires }
      - { to: eip-1559-tfm, type: requires }
      - { to: base-fee-burn, type: applies }
    sources: [eip-1559]
    misconceptions:
      - belief: A transaction with a low `maxFeePerGas` will eventually be mined.
        reality: >
          It is ineligible in every block whose base fee exceeds it, and pools evict on lifetime and
          on capacity pressure, so it can vanish from every node without ever being included.
        why: '"Still pending" implies it is still alive somewhere.'
        source: eip-1559

  - id: mempool-pending-is-not-a-queue
    title: Pending is a set, not a queue
    oneLine: Pending transactions are a priced set re-sorted every block, so arrival time confers no position whatsoever.
    statement: >
      There is no line. Every block, whoever builds it selects and orders transactions to maximise
      their own revenue from the currently eligible set. A transaction submitted an hour ago has no
      standing over one submitted two hundred milliseconds ago with a better tip or a better
      position in someone's bundle. First-in-first-out is the single most damaging mental model a
      developer can bring to this system, because it makes every failure look like a delay.
    volatility: stable
    edges:
      - { to: pending-vs-queued, type: requires }
      - { to: eip-1559-fee-fields, type: requires }
      - { to: mempool-is-not-a-queue, type: deepens }
      - { to: mev, type: recommends }
    sources: [arxiv-private-orderflow, geth-txpool]
    misconceptions:
      - belief: Pending transactions are a queue and mine is in line.
        reality: >
          Pending is a re-priced set and builders reorder it every block by profit. Waiting longer
          buys you nothing.
        why: Every other system with a "pending" state the reader has used is FIFO.
        source: arxiv-private-orderflow

  - id: mempool-is-a-public-broadcast
    title: The public pool is an adversarial channel
    oneLine: Anything in the public pool is a signed, readable statement of intent to everyone, which is what makes frontrunning possible at all.
    statement: >
      Broadcasting to the public pool publishes a signed, fully specified description of what you
      are about to do, to every node that will listen, before it happens. That visibility is the
      precondition for frontrunning and sandwiching: an observer can construct transactions around
      yours and bid to have them ordered around it. The public mempool is not a staging area — it is
      a public announcement with a delay.
    volatility: stable
    edges:
      - { to: mempool-is-not-global, type: requires }
      - { to: mempool-pending-is-not-a-queue, type: requires }
      - { to: mev-sandwich, type: recommends }
    sources: [devp2p-eth-wire, arxiv-private-orderflow, arxiv-private-rpc-benchmark]

  - id: private-orderflow
    title: Private order flow
    oneLine: Users and apps increasingly submit straight to builders through private endpoints, skipping the public pool entirely.
    statement: >
      Rather than gossiping a transaction, a wallet or application can send it directly to one or
      more block builders over a private endpoint, in exchange for protection from public
      observation and sometimes a share of the value the builder captures around it. This is now the
      default path for consumer wallets in practice. The share of flow that is private has clearly
      risen, but published figures measure different things — share of transactions, of gas, of
      value — and disagree by a wide margin, so treat the direction as settled and any single
      percentage as unsupported.
    volatility: hot
    edges:
      - { to: mempool-is-a-public-broadcast, type: requires }
      - { to: mev-private-orderflow, type: recommends }
    sources: [arxiv-private-rpc-benchmark, arxiv-private-orderflow, mev-blocker-ofa]
    misconceptions:
      - belief: Watching the public mempool tells you what is about to happen on-chain.
        reality: >
          A large and growing share of value-bearing flow never appears publicly, so mempool-based
          analytics and liquidation bots see a systematically biased sample.
        why: It was substantially true in 2020.
        source: arxiv-private-orderflow
      - belief: Private RPCs are strictly better for users.
        reality: >
          They swap public frontrunning risk for trust in the operator, sometimes cost inclusion
          latency, and concentrate builder power. It is a measured trade-off, not a free upgrade.
        why: '"MEV protection" is marketed as costless.'
        source: arxiv-private-rpc-benchmark

  - id: order-flow-auctions
    title: Order flow auctions
    oneLine: An OFA auctions the right to trade around a user's transaction and returns part of the proceeds to that user.
    statement: >
      An order flow auction takes a user's transaction, exposes it under controlled conditions to
      competing searchers, auctions the right to be ordered around it, and rebates part of the
      winning bid to the user. It turns order flow from something extracted from users into
      something sold on their behalf. The trade the user makes is explicit: give the auction
      operator exclusive early sight of your intent in return for a share of what that sight is
      worth.
    volatility: hot
    edges:
      - { to: private-orderflow, type: requires }
      - { to: mev-orderflow-auction, type: recommends }
    sources: [mev-blocker-ofa]

  - id: private-orderflow-centralises-building
    claimKind: empirical
    title: Exclusive flow decides who builds blocks
    oneLine: A builder others cannot see cannot be outbid, so exclusive order flow is the structural driver of builder concentration.
    statement: >
      Block building is an auction, and the bidder holding transactions nobody else can see holds
      strictly more value than competitors bidding on the same public set. Exclusivity therefore
      compounds: more exclusive flow buys more winning bids, which attracts more exclusive flow.
      This is the causal mechanism behind the concentration of block production into a handful of
      builders — not an incidental side effect of it. Two independent empirical studies of the
      MEV-Boost auction reach the same conclusion by different routes: one traces the path from
      exclusive flow to monopoly in the bidding dynamics, the other measures which order-flow
      providers are *pivotal* — providers whose transactions the auction winner needed in order to
      win — and attributes the inequality in builders' block-building capacity to unequal access to
      exactly those providers.
    volatility: hot
    edges:
      - { to: private-orderflow, type: requires }
      - { to: builder-centralization, type: recommends }
    sources: [arxiv-private-orderflow, arxiv-builder-market-decentralization]

  - id: blob-pool-different-rules
    title: The blob pool is a different pool
    oneLine: Blob transactions live in a separate pool with a far larger replacement bump, a fee floor, and nonce gaps forbidden outright.
    statement: >
      Type-3 blob transactions are not admitted to the ordinary pool. Geth keeps a separate blob
      pool with materially different policy: a much larger replacement fee bump than the legacy pool
      (documented as one hundred percent), a minimum fee floor, and an outright prohibition on
      nonce-gapped blob transactions rather than the queue-and-wait behaviour of the legacy pool.
      Any L2 batcher written against normal-pool assumptions breaks here, and the breakage looks
      like silent rejection.
    volatility: evolving
    edges:
      - { to: price-bump-rule, type: requires }
      - { to: blob-transaction, type: recommends }
      - { to: blob-gas-fields, type: applies }
    sources: [geth-blobpool, eip-4844]
    misconceptions:
      - belief: Blob transactions behave like normal transactions with extra data attached.
        reality: >
          Separate pool, a much larger replacement bump, a fee floor, and nonce gaps disallowed
          entirely. They only look similar in an explorer.
        why: They render as one more transaction type alongside the others.
        source: geth-blobpool

  - id: pool-limits-and-eviction
    title: Transactions can silently disappear
    oneLine: Pools are bounded and time-limited, so a transaction can be dropped by every node and simply never be mined.
    statement: >
      A pool has per-account and global capacity limits and a maximum lifetime. When it is full,
      lower-priced entries are evicted; when an entry is old enough, it is dropped. A transaction
      can therefore leave every pool on the network without being included, without being replaced,
      and without any notification. Counting the ways a transaction leaves a pool unmined — replaced,
      evicted on capacity, evicted on age, invalidated by nonce or balance — is the correct mental
      checklist when one disappears.
    volatility: evolving
    edges:
      - { to: mempool-is-not-global, type: requires }
      - { to: transaction-replacement, type: contrasts }
    sources: [geth-txpool]

  - id: inclusion-lists-are-not-live
    title: Nothing obliges a proposer to include you
    oneLine: FOCIL would force proposers to include eligible public transactions, but it was declined for Glamsterdam, so no such guarantee exists today.
    statement: >
      As of August 2026 there is no protocol mechanism compelling a proposer to include any
      particular transaction. EIP-7805 (FOCIL) is the proposal that would change that, by having a
      committee construct inclusion lists that the fork choice enforces, restoring censorship
      resistance against private-flow-driven builder concentration. It was declined for Glamsterdam
      and deferred. Any material presenting inclusion lists as arriving in the next fork is wrong,
      and any product design assuming censorship resistance at L1 today is assuming a property the
      protocol does not provide.
    volatility: hot
    edges:
      - { to: private-orderflow-centralises-building, type: requires }
      - { to: focil, type: recommends }
    sources: [eip-7805]
