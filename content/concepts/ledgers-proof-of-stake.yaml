moduleId: ledgers-proof-of-stake
concepts:
  - id: validator
    title: What a validator is
    oneLine: A deposit of at least 32 ETH that buys the right and the duty to propose blocks and attest to them.
    statement: >
      A validator is created by depositing ETH into the staking contract and is identified by a
      BLS key, not by a person or a machine. Thirty-two ETH remains the minimum, but since Pectra
      shipped EIP-7251 the maximum effective balance is 2048 ETH, so one validator no longer means
      thirty-two ETH and validator count no longer tracks stake. Reason in ETH, not in validator
      counts. The deposit is what is at risk: it is simultaneously the Sybil defence and the bond
      against misbehaviour.
    volatility: evolving
    edges:
      - { to: byzantine-fault, type: requires }
      - { to: sybil-resistance, type: requires }
    sources: [ethereum-docs-pos, eip-7251]
    misconceptions:
      - belief: One validator equals 32 ETH, so validator count measures stake.
        reality: >
          Since EIP-7251 a single validator can hold up to 2048 ETH of effective balance, so count
          and stake have decoupled. Always reason in ETH.
        why: The 32 ETH figure was a fixed unit of account from 2020 to 2025.
        source: eip-7251

  - id: slot-and-epoch
    title: Slots and epochs
    oneLine: Time is divided into 12-second slots, grouped into epochs of 32 slots, or 6.4 minutes.
    statement: >
      Consensus runs on a fixed clock: a slot every twelve seconds, thirty-two slots to an epoch,
      so an epoch is six minutes and twenty-four seconds. One validator is chosen to propose per
      slot, and validator duties — attesting, committee membership, checkpoint boundaries — are
      assigned per epoch. Slot time is still twelve seconds as of August 2026; EIP-7782's
      six-second proposal was declined for Glamsterdam and deferred, so material predicting shorter
      slots in the next fork is wrong.
    volatility: evolving
    edges:
      - { to: validator, type: requires }
    sources: [ethereum-docs-pos, eip-7782]

  - id: slot-timing
    title: The twelve seconds are spoken for
    oneLine: The proposer publishes in roughly the first four seconds and the committee attests over the following eight; the budget comes from real propagation delay.
    statement: >
      A slot is not twelve idle seconds. The proposer is expected to publish near its start, and
      attesters vote partway through, leaving the remainder for those votes to propagate and be
      aggregated. That division is not arbitrary — it is sized by how long a block actually takes
      to reach most of the network. This is why proposals to shorten slots are hard rather than
      merely a constant change: the sub-slot budget has to survive the same physics.
    volatility: evolving
    edges:
      - { to: slot-and-epoch, type: requires }
      - { to: propagation-latency, type: requires }
    sources: [ethereum-docs-pos, eth2book-slashing]

  - id: attestation
    title: An attestation is three votes in one
    oneLine: A committee member's signed vote on the head of the chain plus the source and target checkpoints.
    statement: >
      An attestation is a single signed message carrying a vote for the current head, used by the
      fork choice, and a source-to-target checkpoint pair, used by the finality gadget. Bundling
      them means one message serves both mechanisms, and it is also why the slashing conditions are
      stated in terms of source and target rather than in terms of blocks: the checkpoint vote is
      the part that carries a finality commitment.
    volatility: stable
    edges:
      - { to: slot-timing, type: requires }
      - { to: casper-ffg, type: requires }
      - { to: lmd-ghost, type: applies }
    sources: [ethereum-docs-pos, eth2book-slashing]

  - id: committee
    title: Committees keep voting affordable
    oneLine: Only a sampled subset of validators attests in any given slot, so not everyone votes on everything.
    statement: >
      Validators are partitioned into committees and each committee attests in one slot of the
      epoch, so over a full epoch every active validator votes exactly once. Sampling is what keeps
      the message volume tractable with hundreds of thousands of validators. The security argument
      is that committee assignment is unpredictable enough in advance that an attacker cannot
      cheaply target the specific validators who will matter in a given slot.
    volatility: stable
    edges:
      - { to: attestation, type: requires }
    sources: [ethereum-docs-pos]
    misconceptions:
      - belief: Every validator votes on every block.
        reality: >
          Committees are sampled per slot; a validator attests once per epoch, not once per slot.
        why: '"Everyone votes" is the intuitive picture of a voting system.'
        source: ethereum-docs-pos

  - id: slashing
    title: Slashing versus leaking
    oneLine: Slashing destroys stake for provably contradictory signed messages; merely being offline leaks small penalties instead.
    statement: >
      Two different mechanisms punish two different failures. A validator that is simply absent
      forgoes rewards and bleeds a small inactivity penalty — recoverable, proportional, and
      routine. A validator that signs two messages which cannot both be honest has produced
      cryptographic evidence of misbehaviour that anyone can submit, and is slashed: penalised,
      forcibly exited and ejected. The distinction is provability. Downtime is a failure to help;
      slashing is proof of an attempt to have it both ways.
    volatility: evolving
    edges:
      - { to: validator, type: requires }
      - { to: inactivity-leak, type: contrasts }
      - { to: slashing-conditions, type: deepens }
    sources: [eth2book-slashing, ethereum-docs-pos-penalties]
    misconceptions:
      - belief: Being offline gets you slashed.
        reality: >
          Offline validators leak small inactivity penalties. Slashing requires a provably
          contradictory pair of signed messages.
        why: '"Penalty" and "slashing" are used interchangeably in casual writing.'
        source: eth2book-slashing

  - id: double-proposal-slashing
    title: Double proposal
    oneLine: Signing two different blocks for the same slot.
    statement: >
      A proposer assigned to a slot may sign exactly one block for it. Signing two distinct blocks
      for the same slot is slashable, because it hands the network two candidate histories from a
      party the protocol trusted to pick one. In practice this is almost never an attack — it is
      two copies of the same validator key running at once, which is why key redundancy is the most
      dangerous form of operational redundancy.
    volatility: stable
    edges:
      - { to: slashing, type: requires }
    sources: [eth2book-slashing]

  - id: double-vote-slashing
    title: Double vote
    oneLine: Attesting to two different candidates for the same target checkpoint.
    statement: >
      A validator may cast one attestation per target epoch. Two attestations with the same target
      epoch but different data constitute a double vote and are slashable. This is the condition
      that directly protects finality: two conflicting checkpoints can only both be justified if
      enough validators double-voted, and every one of them is provably identifiable afterwards.
    volatility: stable
    edges:
      - { to: slashing, type: requires }
      - { to: attestation, type: requires }
      - { to: accountable-safety, type: applies }
    sources: [eth2book-slashing]

  - id: surround-vote-slashing
    title: Surround vote
    oneLine: An attestation whose source-to-target span strictly contains, or is contained by, one of your own earlier attestations.
    statement: >
      A surround vote is the subtler offence. If a validator votes from source A to target B and
      later votes from an earlier source to a later target, the second vote spans the first. That
      pattern is how a validator would attempt to rewrite a stretch of history it has already
      endorsed, so the protocol makes the span relationship itself slashable, in either direction.
      This is the rule that requires validator clients to keep a persistent record of their own past
      votes — a slashing protection database — because the offence is defined against your own
      history rather than against anything visible in the present.
    volatility: stable
    edges:
      - { to: slashing, type: requires }
      - { to: attestation, type: requires }
      - { to: slashing-conditions, type: deepens }
    sources: [eth2book-slashing]

  - id: correlation-penalty
    title: The penalty scales with company
    oneLine: How much a slashed validator loses depends on how much other stake was slashed in the same window — negligible alone, total at scale.
    statement: >
      A slashed validator is charged a second, much larger penalty computed from the total stake
      slashed in a window around its own offence. Alone, this is a small fraction of the stake. As
      the slashed fraction approaches one third of total stake it reaches the validator's entire
      effective balance. Sources disagree on the exact intermediate curve — analyses present both a
      linear and a quadratic form, and which one shipped in Electra was not confirmed against
      consensus-specs — but both agree at the one-third point, so the headline is safe and the
      middle of the curve is not. Read the curve as a design statement: it prices correlation, not
      error.
    volatility: evolving
    edges:
      - { to: slashing, type: requires }
      - { to: slashing-correlation-penalty, type: deepens }
      - { to: slashing-is-anti-correlation-not-anti-error, type: applies }
      - { to: finality-reversal-cost-model, type: recommends }
    sources: [eth2book-slashing, ethereum-docs-pos-penalties, mikeneuder-slashing-7251]
    misconceptions:
      - belief: The slashing penalty is a fixed amount.
        reality: >
          It is correlated. The same offence costs a lone operator a small fraction of stake and
          costs a large coordinated group everything.
        why: Every other penalty the reader has met is a fixed fine.
        source: eth2book-slashing
      - belief: The correlation penalty punishes being large.
        reality: >
          It prices simultaneous, correlated failure — the same client, the same host, the same
          operator failing together. A large operator with genuinely uncorrelated infrastructure is
          not the target.
        why: '"Scales with how many were slashed" reads as a size penalty.'
        source: mikeneuder-slashing-7251

  - id: slashing-timeline
    title: Slashing happens over weeks
    oneLine: An immediate penalty on day one, the correlation penalty around day 18, ejection around day 36.
    statement: >
      Slashing is not a single event. An initial penalty is applied when the evidence is included,
      the correlation penalty is applied roughly eighteen days later once the size of the
      surrounding slashing window is known, and the validator is ejected roughly thirty-six days
      after that start. The size of the initial penalty is where older material is badly wrong:
      pre-2025 sources give around one ETH for a 32-ETH validator, whereas post-Electra reporting
      puts it two to three orders of magnitude lower. That change is attributed to a much larger
      minimum-penalty divisor, which was not confirmed against consensus-specs during research —
      treat the direction as reliable and the exact figure as unverified.
    volatility: evolving
    edges:
      - { to: correlation-penalty, type: requires }
      - { to: slashing-initial-penalty, type: deepens }
    sources: [eth2book-slashing, mikeneuder-slashing-7251, eip-7251]
