moduleId: ledgers-utxo
# NOTE (2026-08-25): the original research sweep retrieved no spec- or canonical-docs-tier source
# for this module, so every concept below was flagged as unsourced. That gap is now closed. The
# Bitcoin developer documentation (developer.bitcoin.org, devguide/transactions and
# devguide/block_chain), the Bitcoin whitepaper and the Ethereum whitepaper were all retrieved and
# verified live; see content/sources/gaps-fundamentals.yaml. Statements remain restricted to what
# those sources state.
concepts:
  - id: utxo
    title: Unspent transaction output
    oneLine: A discrete, indivisible chunk of value with a spending condition attached to it.
    statement: >
      A UTXO is an output of some earlier transaction that has not yet been used as an input to a
      later one. It carries an amount and a spending condition, and it is atomic: it is either
      wholly consumed or untouched. There is no operation that subtracts from a UTXO. Value moves
      only by destroying whole outputs and creating new ones.
    volatility: stable
    edges:
      - { to: key-value-state, type: contrasts }
    sources: [bitcoin-devguide-transactions, bitcoin-devguide-block-chain, ethereum-whitepaper, bitcoin-utxo-deep-dive, bitcoin-programming-survey]
    misconceptions:
      - belief: A UTXO is like a coin in a wallet that you can spend part of.
        reality: >
          You cannot spend part of one. To pay 3 from an output worth 10 you consume the whole 10
          and create two new outputs — 3 to the payee and 7 back to yourself.
        why: The word "coin" imports the idea of making change from a purse rather than from the mint.
        source: bitcoin-utxo-deep-dive

  - id: utxo-inputs-outputs
    title: Inputs, outputs and change
    oneLine: A transaction consumes whole UTXOs as inputs and creates new ones as outputs; change is an output back to yourself.
    statement: >
      A UTXO transaction is a list of inputs, each referencing a specific prior output, and a list
      of outputs, each with an amount and a locking condition. The sum of inputs must be at least
      the sum of outputs, and the difference is the fee, which is implicit rather than a named
      field. Because inputs are consumed whole, almost every real transaction includes a change
      output paying the remainder back to a key the sender controls.
    volatility: stable
    edges:
      - { to: utxo, type: requires }
    sources: [bitcoin-devguide-transactions, bitcoin-whitepaper, ethereum-whitepaper, bitcoin-utxo-deep-dive, bitcoin-p2pkh-scripts]
    misconceptions:
      - belief: The fee is a field in the transaction.
        reality: >
          The fee is inputs minus outputs and is never written down. Omitting a change output
          therefore donates the whole remainder to the block producer.
        why: Every payment system the reader has used states the fee explicitly.
        source: bitcoin-utxo-deep-dive

  - id: utxo-model
    title: The UTXO state model
    oneLine: The whole ledger state is the set of currently unspent outputs — nothing else is stored.
    statement: >
      In the UTXO model the canonical state is a set of unspent outputs. Validating a transaction
      means checking that every referenced output is still in that set, that each spending
      condition is satisfied, and that outputs do not exceed inputs. Applying it means removing the
      consumed entries and inserting the new ones. There is no address-keyed map, no per-user
      record, and no place where the protocol writes down who owns how much.
    volatility: stable
    edges:
      - { to: utxo-inputs-outputs, type: requires }
      - { to: key-value-state, type: contrasts }
      - { to: state-machine-replication, type: applies }
    sources: [ethereum-whitepaper, bitcoin-devguide-block-chain, bitcoin-programming-survey, bitcoin-utxo-deep-dive]
    misconceptions:
      - belief: UTXO is a more primitive version of the account model.
        reality: >
          It is a different trade-off, not an earlier draft. It buys natural parallelism and
          replay-resistance by construction, and it pays for them with awkward expression of
          long-lived mutable state.
        why: Bitcoin came first, so its model gets read as the prototype.
        source: utxo-debt-representation

  - id: locking-script
    title: Locking script
    oneLine: The predicate attached to an output that defines what it takes to spend it.
    statement: >
      Every output carries a locking script — `scriptPubKey` — a program fragment expressing the
      condition under which the output may later be consumed. The common case commits to a public
      key hash and demands a matching public key plus a valid signature, but the script is a
      general predicate: it can require several signatures, a hash preimage, or a time to have
      passed. Ownership in this model is a satisfiable condition, not an identity.
    volatility: stable
    edges:
      - { to: utxo, type: requires }
    sources: [bitcoin-devguide-transactions, ethereum-whitepaper, bitcoin-p2pkh-scripts, bitcoin-programming-survey]

  - id: unlocking-script
    title: Unlocking script
    oneLine: What the spender supplies to satisfy an output's predicate, usually a signature and a public key.
    statement: >
      An input carries an unlocking script — `scriptSig` — providing the data that satisfies the
      referenced output's locking script. Validation runs the supplied data against the predicate
      and accepts the spend only if execution finishes with a true value on the stack.
      Authorisation therefore lives in the transaction that spends the output, not in any account
      record.
    volatility: stable
    edges:
      - { to: locking-script, type: requires }
      - { to: ecdsa-secp256k1, type: applies }
    sources: [bitcoin-devguide-transactions, bitcoin-p2pkh-scripts]

  - id: script-vm
    title: Bitcoin Script
    oneLine: A stack-based, deliberately non-Turing-complete interpreter that decides whether a spend is valid.
    statement: >
      Bitcoin Script is a small stack machine with no unbounded loops and no general recursion, so
      every script terminates and its validation cost is bounded before it runs. That is a design
      choice, not an omission: it removes non-termination from consensus and therefore removes the
      need for a gas meter. The price is that arbitrary computation, and state that persists across
      transactions, are hard to express.
    volatility: stable
    edges:
      - { to: unlocking-script, type: requires }
      - { to: determinism-requirement, type: applies }
    sources: [bitcoin-devguide-transactions, ethereum-whitepaper, bitcoin-programming-survey, bithoven-utxo-contracts]
    misconceptions:
      - belief: Bitcoin Script cannot do anything interesting.
        reality: >
          Non-Turing-complete is not trivial. Multisig, hash-locked and time-locked spends and
          payment channels are all expressible, and current research keeps pushing the boundary.
          The constraint bounds validation cost; it does not forbid structure.
        why: '"Not Turing-complete" gets read as "not programmable".'
        source: bithoven-utxo-contracts

  - id: no-global-state
    title: No protocol-level balances
    oneLine: Bitcoin never computes anyone's balance; a wallet sums the outputs it can spend.
    statement: >
      There is no balance anywhere in Bitcoin's consensus state. What a wallet displays is a
      client-side sum over the unspent outputs whose locking scripts that wallet can satisfy. Two
      wallets holding different key material will legitimately report different balances for what a
      user thinks of as one identity, and answering "what is this address worth" requires an index
      the protocol does not maintain.
    volatility: stable
    edges:
      - { to: utxo-model, type: requires }
      - { to: key-value-state, type: contrasts }
    sources: [bitcoin-devguide-transactions, ethereum-whitepaper, bitcoin-utxo-deep-dive, bitcoin-programming-survey]
    misconceptions:
      - belief: Bitcoin has account balances, just under a different name.
        reality: >
          It has no balances at all at the protocol level. Balance is a wallet-side derivation over
          the UTXO set, which is why balance queries need indexing that consensus does not provide.
        why: Every explorer and exchange renders a balance, so the abstraction looks native.
        source: bitcoin-utxo-deep-dive

  - id: utxo-parallelism
    title: UTXO parallelism
    oneLine: Every dependency between transactions is named in the transaction itself, so independent ones can be applied in any order.
    statement: >
      Each input names the exact output it spends by txid and index, so a transaction declares its
      own dependencies before it is executed. Two transactions are independent when neither
      consumes an output the other consumes and neither spends an output the other creates: applied
      in either order, or concurrently, they produce the same result. Only two things impose an
      order. Consuming the same output is a double spend and is rejected whichever way round it is
      seen. Spending an output another transaction creates is a real dependency, and the whitepaper
      spells it out — a block containing A and B where B spends a UTXO created by A is valid only
      if A comes first. Because both cases are visible from the transaction's own fields rather
      than discovered during execution, the dependency graph is known in advance, which is what
      makes the model naturally partitionable.
    volatility: stable
    edges:
      - { to: no-global-state, type: requires }
      - { to: sealevel, type: recommends }
    sources: [ethereum-whitepaper, bitcoin-devguide-block-chain, bitcoin-programming-survey]

  - id: utxo-privacy
    title: UTXO and identity
    oneLine: A fresh output per receipt means no protocol-level identifier accumulates history.
    statement: >
      Because outputs are independent and nothing links them beyond the public transaction graph,
      standard practice is to receive each payment to a fresh script. No long-lived identifier
      accumulates history at the protocol level. This is a default of the model rather than a
      guarantee: the graph is fully public, and common-input and change-detection heuristics
      routinely re-link outputs.
    volatility: stable
    edges:
      - { to: no-global-state, type: requires }
    sources: [bitcoin-devguide-transactions, bitcoin-programming-survey, bitcoin-utxo-deep-dive]
    misconceptions:
      - belief: UTXO makes Bitcoin anonymous.
        reality: >
          It makes identity non-accumulating by default, which is a much weaker claim. The
          transaction graph is public, heuristics re-link outputs, and script reuse destroys the
          property outright.
        why: '"No account" is heard as "no identity".'
        source: bitcoin-programming-survey

  - id: why-ethereum-chose-accounts
    title: Why Ethereum chose accounts
    oneLine: Long-lived mutable state under a stable identity is what contracts need, and UTXO makes it expensive.
    statement: >
      A smart contract is state that many unrelated parties mutate in place over time — a pool
      balance, a registry, a debt position. Under the account model that is a persistent key-value
      store hanging off a stable address. Under UTXO the same thing must be encoded as a chain of
      outputs, each spend recreating the state as a new output, which forces a specific party to
      hold and advance it and makes concurrent access by strangers hard. Ethereum took the
      mutable-state model and accepted the bill: a global ordering over everything that touches
      shared state.
    volatility: stable
    edges:
      - { to: no-global-state, type: requires }
      - { to: key-value-state, type: requires }
      - { to: utxo-model, type: contrasts }
      - { to: accounts-enable-stateful-contracts, type: recommends }
    sources: [ethereum-whitepaper, bitcoin-devguide-transactions, utxo-debt-representation, bitcoin-programming-survey]
    misconceptions:
      - belief: UTXO versus accounts is a Bitcoin-versus-Ethereum trivia question.
        reality: >
          It is the architectural fork that decides whether transactions can execute in parallel.
          Solana kept accounts but made every access declared up front to recover parallelism, and
          Ethereum's own block-level access list work is chasing the same property.
        why: It is taught as history rather than as a live design axis.
        source: utxo-debt-representation
