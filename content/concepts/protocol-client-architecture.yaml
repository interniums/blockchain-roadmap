moduleId: protocol-client-architecture
concepts:
  - id: el-cl-split
    title: The execution/consensus split
    oneLine: Since the Merge an Ethereum node is two separately implemented processes, not one program.
    statement: >
      Running a full node means running two programs. The execution client holds the world state,
      runs the EVM, keeps the public transaction mempool and serves JSON-RPC. The consensus client
      speaks the beacon-chain p2p protocol, tracks validators and attestations, and runs fork
      choice. They are written by different teams in different languages against different specs,
      they are configured separately, they sync separately, and they share exactly one private
      channel. Anything that assumes a single binary — an install guide, a monitoring dashboard, a
      mental model of "the node" — is describing the pre-Merge world.
    volatility: stable
    edges:
      - { to: state-machine-replication, type: requires }
      - { to: execution-client-role, type: deepens }
      - { to: consensus-client-role, type: deepens }
    sources: [ethereum-org-nodes-clients, engine-api-spec]
    misconceptions:
      - belief: A node is one program.
        reality: It is two processes that must both be configured, both be synced, and share a JWT secret before either is useful.
        why: Before the Merge, Geth alone was a full node, and most tutorials predate 2022.
        source: ethereum-org-nodes-clients

  - id: execution-client-role
    title: What the execution client owns
    oneLine: State, the EVM, the public mempool and JSON-RPC — and no say at all in which chain is canonical.
    statement: >
      The execution client owns the world state and the machine that changes it. It executes
      transactions, maintains the account and storage tries, keeps the public transaction mempool,
      and serves the user-facing eth_* JSON-RPC that applications talk to. What it does not do is
      decide anything about the chain. It validates the block it is handed and reports the verdict;
      it is told which head to build on. Every question of the form "which chain is real" is
      answered on the other side of the wire.
    volatility: stable
    edges:
      - { to: el-cl-split, type: requires }
      - { to: state-as-keyvalue, type: requires }
      - { to: consensus-client-role, type: contrasts }
    sources: [ethereum-org-nodes-clients, engine-api-spec]
    misconceptions:
      - belief: The execution client decides which chain is canonical.
        reality: The EL only validates and executes what it is given; the CL's fork choice picks the head and pushes it down.
        why: Before the Merge the EL genuinely did run fork choice, by total difficulty.
        source: engine-api-spec

  - id: consensus-client-role
    title: What the consensus client owns
    oneLine: Validators, attestations, fork choice and finality — and the authority to tell the execution client what the head is.
    statement: >
      The consensus client speaks the beacon-chain gossip protocol, maintains the beacon state and
      the validator registry, collects and aggregates attestations, runs fork choice each slot, and
      tracks justification and finality. It is the process that knows what the canonical chain is,
      and the only one that can tell the execution client. It also owns the timing: slots, epochs,
      and every deadline a validator has to hit.
    volatility: stable
    edges:
      - { to: el-cl-split, type: requires }
      - { to: validator, type: requires }
      - { to: execution-client-role, type: contrasts }
    sources: [ethereum-org-nodes-clients, engine-api-spec]

  - id: engine-api
    title: The Engine API
    oneLine: A private, authenticated engine_* JSON-RPC namespace that is the only interface between the consensus and execution clients.
    statement: >
      The Engine API is a JSON-RPC namespace of engine_* methods served by the execution client on a
      local, authenticated port, conventionally 8551. It is the sole channel between the two
      processes: no beacon data reaches the EL any other way, and no execution verdict reaches the
      CL any other way. It is deliberately not the same surface as the public eth_* JSON-RPC, it is
      not meant to be reachable from outside the machine, and its methods are versioned per fork —
      each hardfork's spec file shows exactly which method versions became valid and which started
      returning unsupported-fork errors.
    volatility: evolving
    edges:
      - { to: el-cl-split, type: requires }
      - { to: engine-api-jwt, type: deepens }
    sources: [engine-api-spec, engine-api-common, besu-engine-api]
    misconceptions:
      - belief: The Engine API is just another JSON-RPC endpoint you can call.
        reality: It is authenticated with a local shared secret and is meant to be reachable only by the paired consensus client; exposing it is a node-compromise vector.
        why: It looks like eth_* RPC and speaks the same wire protocol.
        source: engine-api-common
      - belief: The default port 8551 is part of the specification.
        reality: 8551 is a convention that every client happens to share; the spec does not mandate a port.
        why: Universal agreement between implementations reads as a normative requirement.
        source: engine-api-common

  - id: engine-api-jwt
    title: The JWT secret both clients read
    oneLine: A shared HS256 secret in a jwt.hex file authenticates the Engine API, and a mismatch is the classic "my node will not sync" failure.
    statement: >
      The Engine API is authenticated with an HS256 JSON Web Token signed with a shared secret,
      written as hex to a file both processes read — conventionally jwt.hex. Each request carries a
      freshly issued token, so clock skew between the two processes can break authentication as
      surely as a wrong secret can. When the secret does not match, the consensus client cannot
      drive the execution client at all: the node appears to run, logs look busy, and it never
      follows the chain. It is the single most common first-time node failure, and it is diagnosable
      in seconds once you know which side reports it.
    volatility: stable
    edges:
      - { to: engine-api, type: requires }
    sources: [engine-api-common]
    misconceptions:
      - belief: If both clients are running and neither has crashed, the pairing is working.
        reality: A JWT mismatch leaves both processes alive and busy while no payload is ever validated; you have to read the logs to see it.
        why: Nothing crashes, so the usual liveness checks all pass.
        source: engine-api-common

  - id: engine-newpayload
    title: engine_newPayload — "here is a block, is it good?"
    oneLine: The consensus client hands the execution client a block body to execute and validate, and gets back VALID, INVALID, SYNCING or ACCEPTED.
    statement: >
      engine_newPayloadVn passes an execution payload down to the execution client, which executes
      it against its state and returns a status. VALID and INVALID are verdicts. SYNCING and ACCEPTED
      are not errors: they mean the execution client cannot yet decide, usually because it does not
      have the parent state, and the consensus client may import the block optimistically and revisit
      the verdict later. Treating SYNCING as a failure is a common integration bug in tooling built
      on top of a node.
    volatility: evolving
    edges:
      - { to: engine-api, type: requires }
      - { to: engine-forkchoiceupdated, type: contrasts }
    sources: [engine-api-spec, engine-api-visual-guide]
    misconceptions:
      - belief: A SYNCING response from newPayload means something is wrong.
        reality: It means the execution client cannot evaluate the payload yet; the consensus client is expected to handle it by optimistic import, not to treat it as an error.
        why: In most RPC systems a non-answer is a failure.
        source: engine-api-spec

  - id: engine-forkchoiceupdated
    title: engine_forkchoiceUpdated — "this is the chain, and maybe start building"
    oneLine: Tells the execution client the new head, safe and finalized hashes, and optionally starts a block build that returns a payloadId.
    statement: >
      engine_forkchoiceUpdatedVn does two jobs in one call. It communicates the consensus client's
      current view — head, safe and finalized block hashes — which is how the execution client learns
      what the canonical chain is and what it may prune behind. Optionally it also carries payload
      attributes, which instruct the execution client to begin assembling a block for the next slot;
      in that case it returns a payloadId identifying the build job. The ordering constraints between
      this call and newPayload are specified normatively, because getting them wrong produces a node
      that builds on the wrong parent.
    volatility: evolving
    edges:
      - { to: engine-api, type: requires }
      - { to: engine-newpayload, type: contrasts }
      - { to: engine-getpayload, type: deepens }
    sources: [engine-api-spec, engine-api-common, engine-api-visual-guide]

  - id: engine-getpayload
    title: engine_getPayload — collecting the block you asked for
    oneLine: Retrieves the block the execution client has been assembling for a payloadId, and calling later yields a fuller, higher-value block.
    statement: >
      engine_getPayloadVn fetches the current best version of the block being built under a given
      payloadId. The execution client keeps improving the build while it can, so the call is not
      idempotent in value: asking later returns a block that includes more transactions and is worth
      more. That single fact is the origin of the whole timing game around block production — a
      proposer wants to ask as late as it dares and still propagate in time. The method versions up
      with forks; after Osaka it returns a blobs bundle carrying cell proofs rather than whole-blob
      proofs.
    volatility: evolving
    edges:
      - { to: engine-forkchoiceupdated, type: requires }
      - { to: slot-phases, type: applies }
    sources: [engine-api-spec, engine-api-visual-guide]

  - id: cl-drives-el
    title: The consensus client drives, the execution client follows
    oneLine: The EL never decides finality, never gossips beacon blocks, and one CL can legally drive several ELs.
    statement: >
      The relationship is asymmetric by design. The consensus client initiates every Engine API
      call; the execution client only answers. The EL has no view of attestations, no notion of
      finality it computed itself, and no way to gossip a beacon block. Because the interface is
      one-directional in this sense, one consensus client can legally drive more than one execution
      client — a real technique for comparing implementations on live traffic. The corollary is that
      any bug in "what chain am I on" belongs to the consensus side, whatever the execution client's
      logs say.
    volatility: stable
    edges:
      - { to: engine-api, type: requires }
      - { to: execution-client-role, type: contrasts }
    sources: [engine-api-spec, engine-api-visual-guide]

  - id: slot-phases
    title: The deadlines inside a 12-second slot
    oneLine: Proposal at t=0, attestation deadline at t=4s, aggregation deadline at t=8s — and attesters who see no block by 4s vote for the previous head.
    statement: >
      A slot is 12 seconds long and has internal deadlines that matter more than its length. The
      proposer publishes at the start of the slot. Attesters must vote by roughly four seconds in,
      and an attester that has not seen a block by then attests to the previous head instead — which
      is precisely how a late block loses. Aggregates are due around eight seconds. Those deadlines
      are the real-time budget every other mechanism in the protocol has to fit inside: block
      propagation, execution validation, and data-availability sampling all compete for the same
      four seconds. A proposal to shorten slots to six seconds was considered for Glamsterdam and
      declined, so 12 seconds with a four-second attestation deadline remains what mainnet does.
    volatility: evolving
    edges:
      - { to: slot-and-epoch, type: requires }
      - { to: attestation, type: requires }
      - { to: propagation-latency, type: applies }
    sources: [engine-api-spec, rig-attestation-timings]
    misconceptions:
      - belief: Ethereum moved to six-second slots.
        reality: Shorter slots were proposed for Glamsterdam and declined; mainnet slots are still 12 seconds with the four-second attestation deadline.
        why: The proposal was widely covered as though inclusion were settled.
        source: rig-attestation-timings

  - id: validator-duties
    title: What a validator actually does all day
    oneLine: Attest once per epoch, occasionally aggregate, rarely propose, and serve on a sync committee if selected.
    statement: >
      A validator's constant job is attesting: one vote per epoch carrying a source, target and head
      choice. Aggregation duty comes round occasionally. Proposing is rare — with a single validator
      it is a matter of months between proposals — and sync-committee duty applies only if selected,
      for a fixed multi-epoch period. Attestation rewards therefore dominate validator income, which
      means the operationally important thing about a staking setup is not how well it builds blocks
      but whether it is online and on time, every epoch, forever.
    volatility: stable
    edges:
      - { to: slot-and-epoch, type: requires }
      - { to: attestation, type: requires }
      - { to: committee, type: requires }
    sources: [ethereum-org-attestations]
    misconceptions:
      - belief: A validator's main job is proposing blocks.
        reality: Proposing is rare; the constant duty is attesting once per epoch, and attestation rewards dominate income.
        why: Block production is the visible, dramatic part of the job.
        source: ethereum-org-attestations

  - id: validator-client-separation
    title: Beacon node and validator client are also separate
    oneLine: Most consensus stacks split again into a beacon node that talks to the network and a validator client that holds the signing keys.
    statement: >
      Inside the consensus side there is a second split. The beacon node handles p2p, keeps the
      beacon state, and exposes an HTTP API. The validator client holds the signing keys, asks the
      beacon node what duties it has, and signs. They can run on different machines, which is the
      point: the process exposed to the public network is not the process holding the keys, and one
      validator client can be pointed at more than one beacon node for redundancy. Slashing
      protection lives with the validator client, so moving keys between setups without moving that
      database is how operators slash themselves.
    volatility: stable
    edges:
      - { to: consensus-client-role, type: requires }
      - { to: slashing, type: applies }
    sources: [ethereum-org-nodes-clients, lighthouse-book]

  - id: client-diversity-thresholds
    title: The 33% and 66% thresholds
    oneLine: A buggy client above one third can stall finality; above two thirds it can finalise an invalid chain.
    statement: >
      Client diversity is a quantitative argument with two named breakpoints. If a client with more
      than a third of the relevant share fails, the remaining validators cannot reach the two-thirds
      supermajority that justification requires, and finality stalls — a liveness failure the network
      recovers from. Above two thirds, a buggy client can justify and finalise a chain the rest of
      the network considers invalid: a safety failure, and the honest minority cannot simply roll it
      back. Everything else about diversity — languages, teams, funding — is downstream of those two
      numbers.
    volatility: stable
    edges:
      - { to: consensus-client-role, type: requires }
      - { to: casper-ffg, type: requires }
      - { to: safety-property, type: applies }
      - { to: liveness-property, type: applies }
    sources: [ethereum-org-client-diversity]
    misconceptions:
      - belief: Client diversity matters because decentralisation is a nice property to have.
        reality: It is a concrete liveness and safety threshold — above a third a bug stalls finality, above two thirds a bug can finalise an invalid chain.
        why: Diversity is usually argued as an ideology rather than as a bug blast radius.
        source: ethereum-org-client-diversity

  - id: supermajority-client-risk
    title: Why a supermajority bug is worse than a minority bug
    oneLine: Validators on a broken minority client take small offline penalties; validators on an honest minority facing a bad finalised chain face slashing or a social fork.
    statement: >
      The asymmetry is what makes diversity urgent. If your client is in a small minority and it
      breaks, you go offline and pay inactivity penalties — unpleasant, bounded, recoverable. If a
      supermajority client finalises an invalid chain, the validators who were right are the ones in
      trouble: they are on a minority fork that cannot be reconciled by the protocol, and resolution
      becomes a social process rather than a technical one. Running the minority client is therefore
      the individually cheaper insurance as well as the collectively better outcome, which is an
      unusually favourable incentive alignment and still not enough to move the numbers.
    volatility: stable
    edges:
      - { to: client-diversity-thresholds, type: requires }
      - { to: inactivity-leak, type: applies }
      - { to: slashing, type: applies }
    sources: [ethereum-org-client-diversity, clientdiversity-org]
    misconceptions:
      - belief: Geth has about 85% share, so Ethereum is one bug away from death.
        reality: That figure is from 2023-24 and is stale. No single current share number is defensible either — the two datasets published side by side on the community dashboard measure different things (crawled node counts versus stake fingerprinting) and disagree sharply, including about which consensus client is largest.
        why: The 85% statistic was heavily circulated during the 2024 diversity push and never retired.
        source: clientdiversity-org
      - belief: You can look up the current client shares and get one answer.
        reality: The published datasets disagree because they measure different populations; the honest teaching point is the methodology gap, not a number.
        why: Both figures appear on the same page, which reads as corroboration rather than contradiction.
        source: clientdiversity-org
