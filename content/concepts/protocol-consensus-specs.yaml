moduleId: protocol-consensus-specs
concepts:
  - id: consensus-specs-repo
    title: ethereum/consensus-specs
    oneLine: The normative definition of the beacon chain — markdown documents whose Python is the specification, not an illustration of it.
    statement: >
      ethereum/consensus-specs is where beacon-chain behaviour is defined. Its documents are
      markdown containing Python, and that Python is normative: it is the specification, not
      pseudocode standing in for one. For consensus-layer behaviour it outranks the corresponding
      EIP, which frequently lags the merged specs PR. The repository README carries the current
      stable and in-development fork list, which is the fastest way to see what is actually live
      versus what is being built.
    volatility: evolving
    edges:
      - { to: consensus-client-role, type: requires }
      - { to: execution-specs-repo, type: contrasts }
    sources: [consensus-specs, consensus-specs-releases]
    misconceptions:
      - belief: The specification is prose and clients interpret it.
        reality: It is executable Python, so the reference implementation and the document are the same artifact and ambiguity has far less room to hide.
        why: Most protocol specifications a developer has met — TCP, HTTP — are prose RFCs.
        source: consensus-specs
      - belief: An EIP being merged means the change is live.
        reality: Merging an EIP only means it is formatted and numbered; inclusion is decided on All Core Devs calls, specified in the specs repos, and then shipped by clients — and proposals with merged EIPs do get cut.
        why: In ordinary open source, merged means accepted.
        source: consensus-specs

  - id: execution-specs-repo
    title: The other normative repositories
    oneLine: execution-specs holds the EVM and execution-layer spec, execution-apis holds the RPC and Engine interfaces, and EIPs holds proposals — four repos, four cadences.
    statement: >
      There is no single Ethereum specification repository. ethereum/execution-specs is the
      execution layer's normative spec, also executable Python. ethereum/execution-apis defines the
      JSON-RPC and Engine API surfaces. ethereum/EIPs holds proposals, which are the intent behind a
      change rather than its definition. ethereum/consensus-specs defines the beacon chain. They
      move on different cadences and are owned by different groups of people, and knowing which one
      answers your question is most of the skill of reading Ethereum's specifications at all.
    volatility: evolving
    edges:
      - { to: consensus-specs-repo, type: contrasts }
      - { to: engine-api, type: deepens }
    sources: [execution-specs, engine-api-spec]
    misconceptions:
      - belief: There is one Ethereum specification.
        reality: There are at least four normative repositories, and they disagree in scope, format and update speed.
        why: People talk about "the Ethereum spec" as a single object.
        source: execution-specs

  - id: cl-fork-codenames
    title: Star names, city names, and the compound upgrade name
    oneLine: The consensus layer uses star names and the execution layer uses city names; the upgrade everyone talks about is the two concatenated.
    statement: >
      The consensus layer names its forks after stars — Phase0, Altair, Bellatrix, Capella, Deneb,
      Electra, Fulu, Gloas, Heze. The execution layer names its forks after cities — Shanghai,
      Cancun, Prague, Osaka, Amsterdam. A network upgrade ships both at once and is referred to by
      the concatenation: Pectra is Prague plus Electra, Fusaka is Fulu plus Osaka, Glamsterdam is
      Gloas plus Amsterdam. When you read that something landed "in Fulu" and elsewhere that it
      landed "in Fusaka", those are the same event described from two layers.
    volatility: evolving
    edges:
      - { to: consensus-specs-repo, type: requires }
      - { to: execution-specs-repo, type: requires }
    sources: [consensus-specs]
    misconceptions:
      - belief: The star name and the city name are alternative names for the same fork.
        reality: They are the two halves of it — one names the consensus-layer change, the other the execution-layer change, and each has its own spec files and its own activation encoding.
        why: They activate simultaneously, so they look interchangeable.
        source: consensus-specs

  - id: executable-spec
    title: The specification executes
    oneLine: Tooling extracts the Python from the markdown into a runnable package, so the spec cannot contain code that does not typecheck or run.
    statement: >
      The code blocks in the specification documents are extracted by tooling into a real Python
      package. That has two consequences worth internalising. First, the specification cannot
      silently contain code that does not run — a class of ambiguity that plagues prose specs simply
      cannot survive. Second, you can execute the specification: import it, construct a state, apply
      a block, and read the result. When you are unsure what a rule means, you are one REPL session
      away from finding out rather than one email to a core developer.
    volatility: stable
    edges:
      - { to: consensus-specs-repo, type: requires }
      - { to: determinism-requirement, type: applies }
    sources: [pyspec-readme, eth2book-running-the-spec]

  - id: pyspec-build
    title: Building the pyspec
    oneLine: A make target extracts the markdown code blocks into one importable module per fork, which is how you actually read or debug the spec.
    statement: >
      Building the pyspec runs the extraction and produces, per fork, a single importable Python
      module containing the complete flattened specification for that fork. That module — not the
      markdown — is what you read when you want the whole behaviour in one place, because the
      markdown for a given fork contains only that fork's changes. The repository's own tooling has
      modernised: current instructions use the uv package manager behind a Makefile front end, so
      older tutorials that tell you to pip install a requirements file are describing a build that
      no longer matches the repo.
    volatility: evolving
    edges:
      - { to: executable-spec, type: requires }
      - { to: fork-layered-specs, type: deepens }
    sources: [pyspec-readme, devcon-pyspec-talk]

  - id: state-transition-function
    title: state_transition(state, block) -> state
    oneLine: The core of the beacon chain is one pure function, decomposed into per-slot, per-block and per-epoch processing.
    statement: >
      Everything the beacon chain does reduces to a pure function that takes a state and a signed
      block and returns the next state. It decomposes into three phases: per-slot processing, which
      advances time and caches roots; block processing, which applies the block's operations —
      attestations, deposits, slashings, withdrawals and the rest; and epoch processing, which runs
      at epoch boundaries and does the expensive accounting, including justification, finalisation
      and rewards. Knowing which phase a rule lives in tells you when it can possibly fire, and that
      is usually the first thing you need when debugging a disagreement between clients.
    volatility: stable
    edges:
      - { to: executable-spec, type: requires }
      - { to: slot-and-epoch, type: requires }
      - { to: casper-ffg, type: applies }
    sources: [consensus-specs, eth2book-running-the-spec]

  - id: fork-layered-specs
    title: Each fork's document is a diff over the last
    oneLine: A fork's spec file contains only what that fork changed, so reading one fork alone gives you an incomplete rule set.
    statement: >
      Fork specifications are written as layers. Altair is written over Phase0, and each subsequent
      fork over the one before it, so a fork's document contains its changes rather than the whole
      protocol. Reading a single fork's file and believing you have that fork's behaviour is a
      reliable way to be wrong about anything the fork did not touch. The flattened module produced
      by the pyspec build is the composition of the whole stack, which is exactly why core
      developers read the built module rather than the markdown when they need certainty.
    volatility: stable
    edges:
      - { to: consensus-specs-repo, type: requires }
      - { to: pyspec-build, type: applies }
    sources: [consensus-specs, pyspec-readme]
    misconceptions:
      - belief: You can read one fork's spec file to understand that fork.
        reality: Each file is a diff over the previous fork; the full behaviour is the composition of every layer, which the build step flattens for you.
        why: The files are named per fork and read as though self-contained.
        source: consensus-specs

  - id: presets-vs-configs
    title: Presets change the spec, configs change the network
    oneLine: Presets are compile-time constants that reshape the specification; configs are runtime values that differ between networks.
    statement: >
      Presets hold constants that change the shape of the specification itself — slots per epoch,
      committee sizes, validator registry limits — and changing one means rebuilding the spec.
      Configs hold values that differ per network at runtime: fork activation epochs, the deposit
      contract address, the chain id. The distinction matters operationally: a client running
      mainnet and a client running a devnet share the same preset and differ in config, whereas
      running the spec's own tests fast requires a different preset entirely. Both are YAML full of
      constants, which is why they get conflated.
    volatility: stable
    edges:
      - { to: consensus-specs-repo, type: requires }
      - { to: minimal-preset, type: deepens }
    sources: [consensus-specs]
    misconceptions:
      - belief: Presets and configs are the same kind of knob.
        reality: Presets are compile-time and change the spec's shape; configs are runtime network values. Changing a preset requires rebuilding the spec, changing a config does not.
        why: They are both YAML files full of constants sitting in adjacent directories.
        source: consensus-specs

  - id: minimal-preset
    title: The minimal preset
    oneLine: A shrunken parameter set — fewer slots per epoch, smaller committees — that makes the spec and its tests run in seconds.
    statement: >
      The minimal preset shrinks epochs, committees and validator counts so that behaviour which
      would take hours at mainnet parameters happens in seconds. It is what makes local
      experimentation with the spec practical: you can build a genesis state, run through several
      epochs, and watch justification and finalisation happen inside a REPL session. Results under
      minimal are structurally identical to mainnet — same code paths, different constants — which
      is precisely why the reference test vectors are generated under both.
    volatility: stable
    edges:
      - { to: presets-vs-configs, type: requires }
      - { to: pyspec-build, type: applies }
    sources: [consensus-specs, pyspec-readme]

  - id: consensus-spec-tests
    title: The reference test vectors
    oneLine: Generated SSZ-encoded pre-state, input and expected post-state triples that every consensus client runs in CI.
    statement: >
      ethereum/consensus-spec-tests publishes generated vectors per release: an SSZ-encoded
      pre-state, an input such as a block or an operation, and the expected post-state. Every
      consensus client consumes them in CI. This is the mechanism that makes six independent
      implementations in six languages actually agree — not shared code, not shared review, but a
      shared corpus of inputs with pinned outputs. A client that passes them agrees with the spec on
      everything the corpus covers, and disagreements outside that coverage are exactly where
      consensus bugs live.
    volatility: evolving
    edges:
      - { to: executable-spec, type: requires }
      - { to: ssz, type: requires }
      - { to: client-diversity-thresholds, type: applies }
    sources: [consensus-spec-tests, hive-repo]

  - id: test-vector-generation
    title: The vectors are generated by running the spec
    oneLine: Generator scripts execute the pyspec to produce the vectors, so they test client agreement with the spec rather than the spec's own correctness.
    statement: >
      Nobody hand-writes the reference vectors. Generator scripts in the specs repository run the
      built pyspec over constructed inputs and record the outputs. The consequence is worth stating
      plainly: the vectors cannot catch a bug in the specification, because they were produced by
      the specification. They catch divergence between a client and the spec. Bugs in the spec
      itself are caught by review, by devnets, and by the fact that the spec is executable and gets
      executed — never by its own vectors.
    volatility: stable
    edges:
      - { to: consensus-spec-tests, type: requires }
      - { to: pyspec-build, type: requires }
    sources: [consensus-spec-tests, consensus-specs]
    misconceptions:
      - belief: Test vectors are written by hand to test the specification.
        reality: They are generated by executing the specification, so they test client agreement with the spec, not the spec's own correctness.
        why: In ordinary software, tests are an independent check on the implementation.
        source: consensus-spec-tests

  - id: spec-release-channels
    title: Stable vectors versus nightly vectors
    oneLine: Stabilised forks get vectors attached to releases; in-development forks get nightly-generated unstable vectors, so which tests you run depends on which fork you are targeting.
    statement: >
      Reference tests come in two channels. Stable releases carry generated vectors as release
      assets, pinned to a tagged version of the spec. Forks still in development get vectors
      generated nightly from the development branch, so client teams can implement against a fork
      before it stabilises. The practical consequence is that "run the spec tests" is an ambiguous
      instruction: for a shipped fork you want the release asset, and for one under construction you
      want the nightly, which will move under you.
    volatility: evolving
    edges:
      - { to: consensus-spec-tests, type: requires }
      - { to: devnets-and-interop, type: applies }
    sources: [consensus-spec-tests, consensus-specs-releases]

  - id: reading-a-spec-change
    title: Reading a protocol change across four artifacts
    oneLine: EIP for intent, specs PR for the normative change, test vectors for observable behaviour, client PR for what was really built.
    statement: >
      A protocol change is understood by reading four things in order, and each answers a question
      the others cannot. The EIP gives intent and rationale — why anyone wanted this. The
      consensus-specs or execution-specs pull request gives the normative change — what the protocol
      now says. The added or changed test vectors give observable behaviour — what a client must
      produce. The implementing client pull requests give reality — how it is actually done, what
      was hard, and what was argued about in review. Skipping any layer produces a characteristic
      kind of wrongness: EIP-only readers describe designs that were revised, spec-only readers miss
      operational cost, and client-only readers generalise one implementation's choices.
    volatility: stable
    edges:
      - { to: consensus-specs-repo, type: requires }
      - { to: consensus-spec-tests, type: requires }
      - { to: acd-process, type: deepens }
    sources: [consensus-specs, engine-api-spec]
