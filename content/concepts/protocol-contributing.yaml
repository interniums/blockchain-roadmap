moduleId: protocol-contributing
concepts:
  - id: client-codebase-landscape
    title: The client landscape
    oneLine: Five execution clients and six-plus consensus clients implement the same specs in different languages — pick by language and review process, not by prestige.
    statement: >
      There is no single Ethereum codebase. On the execution side: Geth in Go, Nethermind in C#,
      Besu in Java, Erigon in Go, Reth in Rust. On the consensus side: Lighthouse and Grandine in
      Rust, Prysm in Go, Teku in Java, Nimbus in Nim, Lodestar in TypeScript. Each implements the
      same specification, each has its own review culture, contributor documentation and time to
      first merge. The right selection criteria for a newcomer are the language you are already fluent
      in and how tractable the project makes a first contribution — not which client is considered
      the reference. Published share figures should not enter this decision, both because they
      disagree with each other and because they say nothing about whether your PR gets reviewed.
    volatility: evolving
    edges:
      - { to: el-cl-split, type: requires }
      - { to: client-diversity-thresholds, type: applies }
    sources: [go-ethereum-repo, reth-repo, lighthouse-book, prysm-docs]
    misconceptions:
      - belief: Protocol work requires deep cryptography.
        reality: Most client work is systems engineering — networking, databases, sync, concurrency, performance. Cryptography is a specialised minority of it.
        why: Blockchain is marketed as a cryptography field.
        source: reth-repo

  - id: geth
    title: go-ethereum
    oneLine: The reference execution client — oldest, most depended on, and one of the hardest places to land a first change.
    statement: >
      Geth is where a great deal of "how Ethereum actually behaves" has been decided in practice
      rather than in a specification, which is what makes it the reference implementation and what
      makes its surface area enormous. Its size, its dependency footprint and the consequences of
      getting something wrong produce a high review bar and slow merges. That combination makes it a
      superb thing to read and a poor thing to make your first contribution to.
    volatility: stable
    edges:
      - { to: client-codebase-landscape, type: requires }
      - { to: reth, type: contrasts }
    sources: [go-ethereum-repo]
    misconceptions:
      - belief: Contributing to Geth is the goal because it is the reference client.
        reality: Its size and review bar make it one of the hardest entry points; other clients are far more tractable for a first merged PR.
        why: Reference implementation reads as "the real one".
        source: reth-repo

  - id: reth
    title: Reth
    oneLine: A Rust execution client built as a library of reusable crates, with unusually good contributor documentation and a much lower barrier to a first merged PR.
    statement: >
      Reth is a modular execution client: explicitly designed as crates you can depend on
      individually rather than a monolith you run, with an architecture book aimed at people reading
      the code rather than operating it, and labelled entry-level issues. It has moved from research
      project to production client, which also means "the execution clients are Geth, Nethermind,
      Besu and Erigon" is a stale list. For a Rust-capable engineer it is the most tractable
      execution-layer entry point.
    volatility: evolving
    edges:
      - { to: client-codebase-landscape, type: requires }
      - { to: geth, type: contrasts }
    sources: [reth-repo]

  - id: lighthouse
    title: Lighthouse
    oneLine: A Rust consensus client with a mature contributor process, labelled issues and a book-style developer guide.
    statement: >
      Lighthouse is a consensus client written in Rust with a long-standing, documented contributor
      process: a developer guide covering environment setup and testing, labelled issues, and a
      review culture used to outside contributions. Together with Reth it means an engineer who
      learns Rust can contribute on either layer — a genuine change from the Go-dominated period of
      2021 to 2023.
    volatility: evolving
    edges:
      - { to: client-codebase-landscape, type: requires }
      - { to: prysm, type: contrasts }
    sources: [lighthouse-book]

  - id: prysm
    title: Prysm
    oneLine: A Go consensus client, and the most approachable one for a backend engineer with no Rust.
    statement: >
      Prysm is a consensus client written in Go, which makes it the natural entry point for the very
      large population of backend engineers who already write Go and do not want to learn Rust first.
      It has its own contributor and development documentation and a long history of external
      contributions. The layer you can reach is the same; only the language and the team's process
      differ.
    volatility: evolving
    edges:
      - { to: client-codebase-landscape, type: requires }
      - { to: lighthouse, type: contrasts }
    sources: [prysm-docs]

  - id: spec-conformance-as-entry-point
    title: Test and spec repositories are the easiest way in
    oneLine: The lowest-risk first contribution is in the test, spec or tooling layer, because correctness is checkable and review is fast.
    statement: >
      Consensus spec test wiring, execution spec test cases, the cross-client integration harness,
      and documentation are all real contributions that are far easier to get merged than
      consensus-critical code. The reason is structural: a test case is objectively right or wrong and
      a reviewer can decide quickly, whereas a change to consensus behaviour requires deep review by
      the people with least spare time. The execution spec test repository in particular is written
      in Python and is unusually accessible for a core repository.
    volatility: stable
    edges:
      - { to: consensus-spec-tests, type: requires }
      - { to: execution-specs-repo, type: requires }
    sources: [execution-spec-tests-repo, hive-repo]
    misconceptions:
      - belief: A first contribution means writing consensus-critical code.
        reality: The highest-acceptance first pull requests are tests, docs, benchmarks, tooling and bug reproductions; consensus changes get the most scrutiny and the slowest review.
        why: The phrase core developer implies core code.
        source: execution-spec-tests-repo

  - id: good-first-issue-labels
    title: Labelled entry points
    oneLine: Every major client curates issues for newcomers, but the label taxonomy differs per repository and the lists are hand-maintained, not automatic.
    statement: >
      Client teams maintain labelled issues intended for new contributors. The labels differ between
      repositories — some use a plain good-first-issue label, others have their own category-and-
      difficulty scheme — so check each repository's own taxonomy rather than assuming a common one.
      More importantly the lists are curated by humans and go stale: an issue sitting open for a year
      is often already solved or no longer wanted, so confirm on the issue before starting.
    volatility: evolving
    edges:
      - { to: client-codebase-landscape, type: requires }
    sources: [reth-repo, lighthouse-book]

  - id: non-code-contributions
    title: The contributions nobody competes for
    oneLine: Documentation, benchmark harnesses, devnet operation, bug triage and reproductions are chronically short-staffed and are the fastest way to become a known name.
    statement: >
      Client teams are consistently short of things that are not feature code: documentation that
      matches the current release, benchmark harnesses, someone running devnets and reporting what
      broke, and triage that turns vague reports into reproducible ones. These are low-competition,
      high-gratitude contributions, and they get you known by the people who review code long before
      you submit any. They are also the fastest route to understanding a codebase, because triaging a
      bug forces you to read exactly the parts that matter.
    volatility: stable
    edges:
      - { to: devnets-and-interop, type: deepens }
    sources: [protocol-studies-repo, reth-repo]
    misconceptions:
      - belief: You should read the whole client codebase before contributing.
        reality: Successful contributors start from a specific failing test or issue and read outward; nobody holds the whole of any client in their head.
        why: Product engineers are used to owning an entire service.
        source: protocol-studies-repo

  - id: acd-process
    title: All Core Devs
    oneLine: Protocol changes flow through recurring execution and consensus calls whose agendas and notes are public — reading them is how you learn what work is wanted.
    statement: >
      Decisions about what goes into an upgrade are made on recurring All Core Devs calls, split
      between execution and consensus, with agendas, notes and recordings published in a public
      repository. Those notes are the authoritative record of what is scheduled, what is contested
      and what is blocked on someone finding time. Reading three months of them is the single highest
      information-per-hour activity available to someone deciding where to contribute, and it is how
      you avoid building something nobody asked for.
    volatility: evolving
    edges:
      - { to: reading-a-spec-change, type: requires }
      - { to: upgrade-scoping, type: deepens }
    sources: [ethereum-pm]

  - id: devnets-and-interop
    title: Devnets and interop
    oneLine: New forks are exercised on ephemeral devnets before public testnets, and running a node on one and reporting a reproducible failure is high-value work with a low skill ceiling.
    statement: >
      Before a fork reaches a public testnet it runs on short-lived multi-client devnets whose whole
      purpose is to find out what breaks when independent implementations meet. Participating means
      running a node, watching it fail, and filing something a maintainer can act on: versions,
      hardware, logs, and a reproduction. The skill ceiling is low and the value is high, because the
      people who can fix the bug usually cannot also be the people running every configuration that
      exposes it.
    volatility: evolving
    edges:
      - { to: acd-process, type: requires }
      - { to: spec-release-channels, type: applies }
    sources: [ethereum-pm, hive-repo]

  - id: epf
    title: The Ethereum Protocol Fellowship
    oneLine: A structured cohort programme pairing accepted participants with core-dev mentors, with a stipend for selected participants and a required public project.
    statement: >
      The fellowship is the Ethereum Foundation's cohort programme for people moving into protocol
      work: mentorship from core developers, a required public project, and a fixed multi-month
      duration. Cohort 7 was announced at the end of April 2026, closed applications in mid-May, and
      runs June to November 2026 — so anyone reading this in the second half of 2026 is looking at a
      cohort already in flight and should be targeting the open study group instead. The stipend goes
      to selected participants rather than to everyone accepted, so it is not a paid job.
    volatility: hot
    edges:
      - { to: epf-study-group, type: contrasts }
      - { to: acd-process, type: requires }
    sources: [epf7-announcement, epf-wiki-site]
    misconceptions:
      - belief: The fellowship pays everyone a stipend.
        reality: The announcement says select participants receive one.
        why: Fellowships are usually funded by default.
        source: epf7-announcement
      - belief: You need to be accepted to the fellowship to work on the protocol.
        reality: Every client repository takes public pull requests and the study group has no application at all; the fellowship is an accelerator for people already contributing, not a gate.
        why: It is the most visible on-ramp, so it looks like the only one.
        source: eps-2026

  - id: epf-study-group
    title: Ethereum Protocol Studies
    oneLine: The open, no-application on-ramp below the fellowship — anyone can join, and since its 2026 relaunch it is self-paced rather than calendar-locked.
    statement: >
      Protocol Studies is the open study group: no application, no selection, and explicitly
      recommended for people not yet ready to apply to the fellowship. It relaunched in February 2026
      with three tracks — Ethereum Protocol 101, Cryptography of Ethereum, and Lean Ethereum/zkEVM —
      and a self-paced learning platform alongside the community channels. The third track is new and
      is itself a signal about where the roadmap is heading: hash-based cryptography and proving.
    volatility: hot
    edges:
      - { to: epf, type: contrasts }
      - { to: study-epf-wiki, type: deepens }
    sources: [eps-2026, epf-study-group-intro]
    misconceptions:
      - belief: The study group is a live-cohort-only thing you have to wait for.
        reality: Since the 2026 relaunch it has a self-paced platform, so there is no next-cohort to wait for before starting.
        why: It began as a calendar-locked series of live calls.
        source: eps-2026

  - id: epf-wiki
    title: epf.wiki — the wiki and the application hub
    oneLine: The community-built protocol wiki and the entry point for fellowship applications, maintained in a public repository you can contribute to.
    statement: >
      epf.wiki is the community-maintained protocol wiki and the place fellowship applications are
      pointed at. It is built from a public repository, which makes correcting it a viable first
      contribution in itself — and given how fast parts of this track go stale, a genuinely useful
      one. Treat it as a well-maintained community reference rather than a normative source: for
      normative questions the specification repositories still win.
    volatility: evolving
    edges:
      - { to: epf-study-group, type: requires }
      - { to: study-epf-wiki, type: contrasts }
    sources: [epf-wiki-site, protocol-studies-repo]

  - id: study-epf-wiki
    title: study.epf.wiki — the course platform
    oneLine: A separate Moodle-based platform carrying the study group's three tracks, distinct from the wiki despite the shared domain.
    statement: >
      study.epf.wiki is the study group's learning platform — a Moodle instance carrying the three
      2026 tracks, with a chat channel and a video playlist attached. It is a different site from
      epf.wiki, which is the wiki and application hub, and learners confuse them constantly because
      of the shared branding. Details beyond that — how enrolment works, whether there is a live
      cohort schedule alongside the self-paced content, and what assessment exists — should be
      checked on the platform itself rather than taken from any description of it.
    volatility: hot
    edges:
      - { to: epf-study-group, type: requires }
      - { to: epf-wiki, type: contrasts }
    sources: [study-epf-wiki-site, eps-2026]
    misconceptions:
      - belief: epf.wiki and study.epf.wiki are the same site.
        reality: One is the community wiki and application hub, the other is a separate course platform launched for the 2026 study group.
        why: Shared domain and shared branding.
        source: study-epf-wiki-site

  - id: epf-selection-signal
    title: What actually gets you accepted
    oneLine: Recent cohorts deliberately went smaller and more focused, so arriving with prior public contributions and a concrete project proposal matters more than a CV.
    statement: >
      Cohort 7 was described by its own announcement as a smaller, more focused cohort prioritising
      depth of engagement over breadth, which means acceptance is harder than in earlier years and
      that prior public contribution weighs more. The realistic preparation is therefore a visible
      trail — merged pull requests, filed reproductions, wiki corrections — plus a specific project
      proposal aimed at something the core devs have said they need. Cohort sizes, acceptance rates
      and stipend amounts are not published, so do not plan against numbers you have read somewhere.
    volatility: hot
    edges:
      - { to: epf, type: requires }
      - { to: spec-conformance-as-entry-point, type: applies }
    sources: [epf7-announcement, epf6-recap]

  - id: public-work-log
    title: The public work log
    oneLine: Fellows publish regular development updates in the cohort repository — the programme's accountability mechanism, and the artefact that gets people hired.
    statement: >
      Fellows post development updates on a regular cadence into the public cohort repository. It
      serves the programme as accountability, and it serves the fellow as the single most useful
      career artefact the programme produces: a dated, public record of real work on real problems,
      readable by anyone deciding whether to hire or fund them. Previous cohorts' repositories are
      also the best available evidence of what a realistic project looks like, which makes them the
      right thing to read before writing a proposal.
    volatility: evolving
    edges:
      - { to: epf, type: requires }
      - { to: non-code-contributions, type: applies }
    sources: [eth-protocol-fellows-org, epf6-recap]
