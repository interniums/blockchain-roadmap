moduleId: protocol-epbs
concepts:
  - id: pbs-problem
    title: The problem proposer-builder separation solves
    oneLine: Building a maximally profitable block needs MEV expertise and low-latency infrastructure, so making proposers do it themselves would centralise staking.
    statement: >
      Extracting the full value of a block requires searchers, simulation infrastructure, exclusive
      order flow and latency engineering. If proposers had to do that work themselves, the only
      economically viable proposers would be the operators who could afford it, and staking would
      concentrate into a handful of sophisticated firms. Proposer-builder separation splits the two
      roles so that a hobbyist running one validator on a home machine still captures competitive
      block value by selling the right to build. The centralisation being avoided is in staking; the
      centralisation being accepted, deliberately, is in building.
    volatility: stable
    edges:
      - { to: pbs, type: requires }
      - { to: validator-duties, type: requires }
      - { to: mev, type: requires }
    sources: [eip-7732, flashbots-mev-boost-docs]

  - id: mev-boost-today
    title: PBS as it works today, outside the protocol
    oneLine: Proposers run MEV-Boost, which talks to relays holding builder blocks — roughly nine in ten mainnet blocks arrive this way.
    statement: >
      Today's proposer-builder separation is entirely out of protocol. The proposer runs MEV-Boost
      alongside its consensus client; MEV-Boost queries relays; relays hold blocks submitted by
      builders and offer the proposer the highest bid as a header. The proposer signs the header,
      and only then does the relay release the body. The consensus specification knows nothing about
      any of this. It is a market convention that roughly ninety percent of mainnet blocks pass
      through, which makes it load-bearing infrastructure with no protocol guarantees behind it.
    volatility: evolving
    edges:
      - { to: pbs-problem, type: requires }
      - { to: mev-boost, type: requires }
      - { to: epbs, type: contrasts }
    sources: [flashbots-mev-boost-docs, builder-specs]
    misconceptions:
      - belief: Today's proposers choose the transactions in their own blocks.
        reality: The large majority of mainnet blocks are built externally and delivered via a relay; the proposer signs a header whose contents it has not seen.
        why: The mental model of validator-as-block-producer survives from pre-Merge mining.
        source: flashbots-mev-boost-docs

  - id: relay-trust-assumption
    title: The relay is a trusted escrow agent
    oneLine: The relay verifies the builder's block, shows the proposer only a header, and releases the body after the proposer signs — both sides must trust it, and there are only a handful.
    statement: >
      The relay exists because proposer and builder cannot trade directly without one of them being
      able to cheat: a proposer shown the full block could steal its contents, and a builder paid
      before delivery could withhold. The relay solves it as escrow. It checks the builder's block
      is valid and pays what it promises, shows the proposer only a commitment, and reveals the body
      once the proposer has signed. That makes it a trusted third party in the strict sense — it can
      censor, it can fail, and it can be compelled — and the number of relays carrying meaningful
      volume is small.
    volatility: evolving
    edges:
      - { to: mev-boost-today, type: requires }
      - { to: relay-escrow, type: requires }
      - { to: epbs, type: contrasts }
    sources: [flashbots-mev-boost-docs, builder-specs, eip-7732]

  - id: relay-failure-modes
    title: How relay trust has actually failed
    oneLine: A malformed-block incident let sealed block contents leak, and relays remain a censorship chokepoint and an operational single point of failure.
    statement: >
      The escrow assumption has broken in production. In one widely analysed 2023 incident a
      malformed block interacted with relay behaviour in a way that let a party obtain and exploit
      block contents that should have stayed sealed, draining searchers who had assumed the escrow
      held. Beyond that, relays are the natural place to apply a transaction filter, so they are
      where censorship pressure lands, and their small number means outages propagate: when relays
      degrade, proposers fall back to locally built blocks and the market visibly thins. Each of
      these is an argument that the escrow role should not be an off-protocol service.
    volatility: evolving
    edges:
      - { to: relay-trust-assumption, type: requires }
      - { to: builder-centralization, type: applies }
    sources: [flashbots-mev-boost-docs, ethresearch-epbs-threads]

  - id: epbs
    title: EIP-7732 — enshrined proposer-builder separation
    oneLine: Builders become in-protocol staked entities, the proposer commits to a bid inside the beacon block, and the protocol guarantees the payment — with no relay in the loop.
    statement: >
      EIP-7732 moves the proposer-builder trade into the consensus protocol. Builders register in
      beacon state with a stake and a balance. A proposer's beacon block carries a signed bid rather
      than an execution payload, and the payment for that bid is enforced by the state transition
      rather than by an intermediary. The builder reveals the payload separately, later in the same
      slot. It is the headline change of the Glamsterdam upgrade and it has not shipped: as of
      August 2026 it has been through multi-client devnets and the upgrade is targeted for the
      second half of 2026 with no mainnet activation date published. Its design has also moved
      materially since the 2024 draft, so any description you read needs its date checked.
    volatility: hot
    edges:
      - { to: relay-trust-assumption, type: requires }
      - { to: mev-boost-today, type: contrasts }
      - { to: consensus-specs-repo, type: applies }
    sources: [eip-7732, ethereum-pm, etherworld-epbs-headliner]
    misconceptions:
      - belief: ePBS gets rid of builders.
        reality: It does the opposite — it makes builders first-class protocol citizens with stake and a registry. What it removes is the relay.
        why: 'The phrase "enshrined PBS" sounds like a fix for the whole MEV supply chain.'
        source: eip-7732
      - belief: Glamsterdam has shipped, or has a mainnet date.
        reality: As of August 2026 it reached its final devnet stage and is targeted for the second half of 2026 with no mainnet date locked; published dates circulating in secondary coverage contradict each other.
        why: Devnet milestones get reported in language that sounds like activation.
        source: ethereum-pm

  - id: payload-bid
    title: The signed payload bid
    oneLine: The beacon block body no longer carries the execution payload — it carries a signed commitment to a block hash, a builder index and a promised value.
    statement: >
      Under EIP-7732 the beacon block body loses the execution payload, the blob commitments and the
      execution requests, and gains a signed execution payload bid plus payload attestations. The bid
      commits to the payload's block hash, identifies the builder by its index in the builder
      registry, and states the value the builder will pay. This is a breaking change for every piece
      of software that parses beacon blocks — explorers, indexers, MEV tooling, anything that reaches
      into a block for its transactions — because the block no longer contains what those tools
      assume it contains.
    volatility: hot
    edges:
      - { to: epbs, type: requires }
      - { to: ssz, type: requires }
    sources: [eip-7732]

  - id: payload-envelope
    title: The payload envelope
    oneLine: The builder broadcasts the actual payload separately, later in the same slot, carrying the execution requests and blob commitments the block no longer holds.
    statement: >
      Having won the bid, the builder publishes a signed envelope containing the execution payload
      itself along with the execution requests and blob commitments. It is a separate network object
      with its own gossip topic and its own arrival deadline, and its relationship to the beacon
      block is a commitment rather than containment. Two objects per slot rather than one is the
      structural change: fork choice, block explorers, and any latency budget in the system now have
      to account for a second thing that may or may not arrive.
    volatility: hot
    edges:
      - { to: payload-bid, type: requires }
      - { to: gossipsub, type: applies }
    sources: [eip-7732]

  - id: builder-registry
    title: The builder registry in beacon state
    oneLine: Beacon state gains a builders registry with stake, withdrawal credentials and balances, plus pending payment and withdrawal queues.
    statement: >
      Builders become entities the consensus layer knows about. Beacon state gains a builders
      registry — each with withdrawal credentials and a beacon-chain balance — along with queues for
      pending builder payments and pending builder withdrawals, and the bookkeeping for expected
      withdrawals from payloads. Payment flows from a builder's beacon balance to the proposer
      through those queues, not from an execution-layer account. There is a minimum stake in the
      current draft, on the order of one ether, and it is exactly the kind of parameter that changes
      late in an upgrade's life, so read it from the merged spec rather than from any article.
    volatility: hot
    edges:
      - { to: epbs, type: requires }
      - { to: validator, type: contrasts }
    sources: [eip-7732]

  - id: unconditional-payment
    title: Payment is unconditional once the bid is signed
    oneLine: The proposer is paid whether or not the builder ever reveals the payload — which is exactly what removes the need for relay escrow.
    statement: >
      Once the proposer signs the bid, the payment is owed. The builder cannot withhold the payload
      to avoid paying, because paying is not conditional on delivering. That single design decision
      is what makes the relay unnecessary: escrow existed to stop each side cheating the other on
      delivery, and if payment does not depend on delivery there is nothing to escrow. The risk does
      not disappear, it moves: the proposer is safe, and the slot may simply end up with no
      execution payload at all.
    volatility: hot
    edges:
      - { to: builder-registry, type: requires }
      - { to: payload-bid, type: requires }
      - { to: relay-trust-assumption, type: contrasts }
    sources: [eip-7732]
    misconceptions:
      - belief: Under ePBS a proposer risks not being paid if the builder disappears.
        reality: Payment is unconditional once the bid is signed — that is the entire point. What moves is the risk that the slot has no payload.
        why: Escrow intuition says no goods, no payment.
        source: eip-7732

  - id: ptc
    title: The payload timeliness committee
    oneLine: A per-slot committee of 512 validators that votes only on whether the payload was revealed on time and its data was available — never on whether it is valid.
    statement: >
      Each slot a subset of validators, sized at 512 in the current design, is assigned to the
      payload timeliness committee. Its members attest to two things: that the payload envelope
      arrived within its window, and that its data was available. They explicitly do not re-execute
      the payload and do not vote on its validity. Execution validity is established later, against
      the following block. Reading the PTC as a validation committee is the most common
      misunderstanding of the design and it inverts the reason the committee exists at all.
    volatility: hot
    edges:
      - { to: payload-envelope, type: requires }
      - { to: committee, type: requires }
      - { to: attestation, type: contrasts }
    sources: [eip-7732]
    misconceptions:
      - belief: The payload timeliness committee validates the execution payload.
        reality: Its members attest only that the payload arrived on time and its data was available; validity is checked later against the next block.
        why: 'The phrase "committee attests to the payload" reads as validation.'
        source: eip-7732

  - id: payload-availability-bit
    title: A slot can have a block and no payload
    oneLine: Beacon state gains a payload-availability bitvector, because a valid beacon block whose payload was never revealed is now a legal chain state.
    statement: >
      Since the beacon block only commits to a payload, a slot can end with a perfectly valid beacon
      block and no execution payload at all. Beacon state records this in an execution payload
      availability bitvector. This is a genuinely new chain state that did not exist between the
      Merge and this change, and everything downstream has to handle it: fork choice, explorers,
      indexers, bridges, anything that assumes a one-to-one correspondence between beacon blocks and
      execution blocks. Most tooling written before this change assumes exactly that.
    volatility: hot
    edges:
      - { to: ptc, type: requires }
      - { to: fork-choice-purpose, type: applies }
    sources: [eip-7732]
    misconceptions:
      - belief: Every slot with a valid beacon block has an execution block.
        reality: Under ePBS a beacon block can be valid while the payload was never revealed, which is why the availability bitvector exists.
        why: The two have been one-to-one since the Merge.
        source: eip-7732

  - id: deferred-execution
    title: Deferred execution validation
    oneLine: The payload is verified against the next block rather than inside the attestation deadline, widening the propagation-and-validation budget.
    statement: >
      Today a block must propagate and be fully executed before attesters vote, which squeezes
      everything into the seconds before the attestation deadline. Under ePBS execution validity is
      established against the following block rather than within the current one, so propagation and
      validation get a materially wider window. Reported figures for the widening differ because
      sources disagree about what today's effective budget is: descriptions range from roughly two
      to four seconds today opening out to roughly six to nine seconds. Take the direction and the
      mechanism as the lesson; do not quote a single pair of numbers.
    volatility: hot
    edges:
      - { to: payload-envelope, type: requires }
      - { to: slot-phases, type: contrasts }
    sources: [eip-7732, ethresearch-epbs-threads]

  - id: epbs-slot-structure
    title: The slot gains internal phases
    oneLine: Beacon block with a bid, then attestation, then the builder's payload reveal, then the timeliness attestation — instead of one monolithic block at the top of the slot.
    statement: >
      A slot stops being "a block at t=0 and votes about it" and becomes a sequence: the proposer
      publishes a beacon block carrying the bid; validators attest to that block; the builder reveals
      the payload envelope; the payload timeliness committee attests to whether that reveal was
      timely and available. Each phase has its own deadline inside the same twelve seconds. For
      anyone operating infrastructure this is the practical change — monitoring, alerting and any
      latency assumption keyed to a single arrival event now has more than one event to key to.
    volatility: hot
    edges:
      - { to: deferred-execution, type: requires }
      - { to: ptc, type: requires }
      - { to: slot-phases, type: contrasts }
    sources: [eip-7732, ethresearch-epbs-threads]

  - id: epbs-and-scaling
    title: ePBS is a scaling prerequisite, not an MEV reform
    oneLine: Bigger blocks and more blobs need more time to propagate and validate, and deferring execution is how that time is found without lengthening the slot.
    statement: >
      The practical reason ePBS is being shipped now is capacity. Raising the gas limit and the blob
      count means more bytes to move and more work to verify inside a fixed twelve seconds, and the
      binding constraint is the attestation deadline. Deferring execution validation off that
      critical path buys the headroom without making slots longer. Filing ePBS mentally under MEV
      politics gets the motivation backwards and makes the sequencing of the roadmap look arbitrary
      when it is not.
    volatility: hot
    edges:
      - { to: deferred-execution, type: requires }
      - { to: block-gas-limit, type: applies }
      - { to: peerdas-enables-more-blobs, type: applies }
    sources: [etherworld-epbs-headliner, eip-7732]
    misconceptions:
      - belief: ePBS is a fairness or MEV-redistribution change.
        reality: Its practical driver is scaling — moving execution validation off the attestation critical path is what makes larger blocks and more blobs safe.
        why: Proposer-builder separation is filed mentally under MEV politics.
        source: etherworld-epbs-headliner

  - id: free-option-problem
    title: The builder's free option
    oneLine: Having committed to a bid, the builder can still choose not to reveal — it forfeits the payment but keeps the choice, which is a short-dated option on the payload.
    statement: >
      Between signing and revealing, the builder holds an option. If prices move against the block it
      built, it can decline to reveal: it pays the bid regardless, but it avoids executing a block
      that has become unprofitable, and it denies the slot a payload. The option is short — the
      length of one reveal window — but options on volatile assets are not worth nothing, and
      simulations of the behaviour suggest the incentive to exercise it is not negligible. It is the
      cleanest example in the module of a design removing one trust assumption and creating a new
      economic one in its place.
    volatility: hot
    edges:
      - { to: unconditional-payment, type: requires }
      - { to: payload-availability-bit, type: applies }
    sources: [ethresearch-epbs-threads, eip-7732]

  - id: epbs-does-not-fix-centralisation
    title: What enshrining PBS does not fix
    oneLine: It removes relay trust; it does not decentralise building, and it ships without the inclusion-list mechanism that was meant to address censorship.
    statement: >
      Block building is concentrated because it is an economies-of-scale business — order flow,
      simulation capacity and latency compound — and a top pair of builders produces a large
      majority of mainnet blocks. Nothing in the enshrined design changes that economics; it changes
      who holds the payload during the trade. The censorship-resistance answer was to be
      fork-choice-enforced inclusion lists, and those were declined for this upgrade. So the honest
      summary is: relay trust removed, builder concentration unchanged, censorship remedy deferred.
    volatility: hot
    edges:
      - { to: epbs, type: requires }
      - { to: builder-centralization, type: requires }
      - { to: focil, type: deepens }
      - { to: pbs-problem, type: contrasts }
    sources: [eip-7732, ethereum-pm]
    misconceptions:
      - belief: ePBS decentralises block building.
        reality: It removes the trusted relay. Building stays concentrated because concentration comes from economies of scale, not from the relay.
        why: 'The phrase "enshrined PBS" sounds like a fix for the entire supply chain.'
        source: eip-7732

  - id: block-level-access-list
    title: Block-level access lists
    oneLine: EIP-7928 declares upfront all the state a block will touch, so a client can plan disk reads and schedule execution before it starts executing.
    statement: >
      A block-level access list states, at the top of the block, every account and storage slot the
      block will read and write. That turns execution from a discovery process — find out what you
      need as you go — into a planned one. A client can fetch the state in parallel before executing,
      and it can schedule transactions that touch disjoint state to run concurrently. It is the
      other headline item of the Glamsterdam upgrade alongside ePBS, and unlike the per-transaction
      access list that already exists, it is a property of the whole block rather than an optional
      hint attached to one transaction.
    volatility: hot
    edges:
      - { to: access-list, type: requires }
      - { to: state-as-keyvalue, type: requires }
    sources: [eip-7928]

  - id: bal-enables-parallelism
    title: Declared access is what buys parallelism
    oneLine: Knowing every read and write in advance is what lets a client run non-conflicting transactions concurrently — the same insight Solana built its execution model around.
    statement: >
      Parallel execution needs to know which transactions conflict before running them, and on
      Ethereum today that information only exists after execution. Declaring access upfront supplies
      it, and non-conflicting transactions can then be scheduled across cores. This is the same
      structural idea Solana adopted from the start by requiring every transaction to declare the
      accounts it touches — arriving on Ethereum at the level of the block rather than the
      transaction, and roughly a decade later. The convergence is worth noticing: two chains that
      are usually presented as opposite design choices reached the same requirement.
    volatility: hot
    edges:
      - { to: block-level-access-list, type: requires }
      - { to: sealevel, type: contrasts }
    sources: [eip-7928]

  - id: focil
    title: FOCIL, and being cut from an upgrade
    oneLine: EIP-7805 is fork-choice-enforced inclusion lists, the censorship-resistance mechanism — declined for Glamsterdam and deferred to the upgrade after it.
    statement: >
      Fork-choice-enforced inclusion lists let a committee of validators name transactions a block
      must include, with fork choice refusing blocks that ignore them — a censorship remedy that
      does not depend on who builds the block. It was proposed for Glamsterdam and declined, on the
      argument that shipping enshrined PBS and inclusion lists together would put too much untested
      interaction on mainnet at once. It is now targeted at the following upgrade; the consensus
      layer names that fork Heze, and its pairing with the execution-layer name circulating in
      community coverage is inferred from ordering rather than confirmed.
    volatility: hot
    edges:
      - { to: epbs, type: requires }
      - { to: upgrade-scoping, type: deepens }
    sources: [ethereum-pm, consensus-specs]
    misconceptions:
      - belief: FOCIL is part of Glamsterdam.
        reality: It was declined for inclusion and deferred to the following upgrade, so the first version of enshrined PBS ships without an inclusion-list mechanism.
        why: It was discussed alongside ePBS throughout the upgrade's design phase.
        source: ethereum-pm

  - id: upgrade-scoping
    title: Upgrade scoping — EIPs get cut
    oneLine: Proposals are removed from upgrades to limit untested interaction, and having a number, a spec and public support does not make a change shipped.
    statement: >
      An upgrade's contents are decided on All Core Devs calls and shrink as the date approaches. A
      proposal can have a number, a written specification, client implementations and broad support
      and still be cut, usually because its interaction with something else in the same upgrade
      would be untested at mainnet scale. The inclusion-list proposal being pulled out of
      Glamsterdam is the current worked example; earlier upgrades have their own. For anyone
      learning the protocol the practical rule is: check what shipped against the upgrade's own
      records, and treat any content list written before activation as a forecast.
    volatility: hot
    edges:
      - { to: focil, type: requires }
      - { to: acd-process, type: deepens }
    sources: [ethereum-pm, eipsinsight-upgrades]
    misconceptions:
      - belief: An EIP with a number and a specification is going to ship.
        reality: Proposals are cut regularly and late, including ones with implementations and momentum; the upgrade's own records are the only reliable list.
        why: A numbered, specified proposal looks like a decision rather than a candidate.
        source: ethereum-pm
