moduleId: protocol-fork-choice
concepts:
  - id: fork-choice-purpose
    title: What fork choice decides
    oneLine: Given every block and vote a node has seen, which block is the head — a tie-breaker for the unfinalized tip, not a finality mechanism.
    statement: >
      Fork choice runs on every node, every slot, and answers exactly one question: of the blocks I
      know about, which is the head I should build on and attest to? It operates only on the
      unfinalized part of the tree, and it is a local computation over a local view — two honest
      nodes with different views can legitimately compute different heads for a moment. It is not
      what makes reorgs expensive; that is finality. Confusing the two is the most common error in
      reasoning about Ethereum's consensus, because both get described as "deciding the chain".
    volatility: stable
    edges:
      - { to: consensus-client-role, type: requires }
      - { to: casper-ffg, type: contrasts }
    sources: [fork-choice-spec, eth2book-fork-choice]
    misconceptions:
      - belief: Finality and fork choice are the same thing.
        reality: Fork choice runs every slot over unfinalized blocks; finality is a separate gadget that justifies and finalises checkpoints and is what makes a reorg require slashing a large fraction of stake.
        why: Both are described as deciding which chain is real.
        source: fork-choice-spec

  - id: gasper
    title: Gasper — GHOST filtered by FFG
    oneLine: LMD-GHOST picks the head each slot, Casper FFG finalises checkpoints, and fork choice only ever considers blocks descending from the last justified checkpoint.
    statement: >
      Ethereum's consensus is the composition of two mechanisms. Casper FFG justifies and finalises
      epoch-boundary checkpoints. LMD-GHOST selects a head among the blocks descending from the last
      justified checkpoint. The filtering is the load-bearing part: GHOST never gets to consider a
      branch that FFG has ruled out, which is what bounds how far a reorg can reach. Reading either
      half alone gives you a rule that looks far more attackable than the composition actually is.
    volatility: stable
    edges:
      - { to: fork-choice-purpose, type: requires }
      - { to: lmd-ghost, type: requires }
      - { to: casper-ffg, type: requires }
      - { to: ebb-and-flow, type: deepens }
    sources: [fork-choice-spec, eth2book-fork-choice]

  - id: weight-is-stake
    title: Weight is stake, not block count
    oneLine: A subtree's weight is the effective-balance-weighted stake of the validators voting for it — "heaviest" never means "longest".
    statement: >
      When fork choice walks the tree it compares subtrees by the summed effective balance of the
      validators whose latest attestation lands in each subtree. Blocks are not counted. Validators
      are not counted equally either — effective balance is the weight, so a large validator moves
      the head more than a small one. This is why describing Ethereum proof of stake as a
      longest-chain rule is not a simplification but an error: it has never been longest-chain, and
      the intuitions that come with longest-chain thinking mislead about every attack in this
      module.
    volatility: stable
    edges:
      - { to: gasper, type: requires }
      - { to: attestation, type: requires }
      - { to: validator, type: requires }
    sources: [fork-choice-spec, eth2book-fork-choice]
    misconceptions:
      - belief: Ethereum proof of stake follows the longest chain.
        reality: It follows the subtree carrying the greatest attesting stake weight, and only within the branch descending from the last justified checkpoint.
        why: Bitcoin's rule is the default mental model for anyone new to consensus.
        source: eth2book-fork-choice

  - id: latest-message-only
    title: Only a validator's latest message counts
    oneLine: Each validator contributes weight in exactly one place — wherever its newest attestation points — and that weight moves when it re-votes.
    statement: >
      Fork choice keeps one entry per validator: its most recent attestation. Weight is not
      accumulated across a validator's history; it is relocated each time the validator votes again.
      This bounds the memory a node needs and makes the rule tractable, and it has a consequence
      that seeds several attacks: a vote that was supporting a block can silently stop supporting it
      without anything being revoked. It also means an attestation count under a block is not a
      confirmation count — weight can drain away from a block that already looked well attested.
    volatility: stable
    edges:
      - { to: lmd-ghost, type: requires }
      - { to: weight-is-stake, type: requires }
    sources: [fork-choice-spec, eth2book-fork-choice]
    misconceptions:
      - belief: More attestations under a block always means the block is safer.
        reality: Only each validator's latest message counts, so weight can move away from a block as validators re-vote; safety comes from justification, not from an attestation count snapshot.
        why: Attestation counts look like the confirmation counts everyone learned from Bitcoin.
        source: eth2book-fork-choice

  - id: proposer-boost
    title: Proposer boost
    oneLine: A timely block gets a temporary fork-choice weight bonus, sized as a percentage of one committee's weight, applied only during its own slot.
    statement: >
      When a node receives a block on time in the current slot, it adds a temporary bonus to that
      block's fork-choice weight, expressed as a percentage of a single committee's weight. The
      bonus lasts for that slot only and is removed afterwards; it is not a permanent property of
      the block. Its purpose is to defend a freshly published honest block against attestations an
      adversary has been withholding. The constant is defined in the fork-choice specification and
      has been changed at least once in response to analysis, so read it out of the spec rather than
      out of an article.
    volatility: evolving
    edges:
      - { to: lmd-ghost, type: requires }
      - { to: slot-phases, type: requires }
      - { to: view-merge, type: contrasts }
    sources: [fork-choice-spec, vbuterin-lmd-ghost-mitigation, casper-ex-ante-mitigation]

  - id: proposer-boost-tradeoff
    title: The boost is a dial with two failure modes
    oneLine: Too low and ex-ante reorgs and balancing attacks get cheap; too high and a malicious proposer can cheaply reorg the block before it.
    statement: >
      There is no setting of the boost that makes both attacks expensive. A low boost leaves an
      honest block underdefended against withheld attestations released after publication, which is
      the ex-ante direction. A high boost hands every proposer a large weight bonus it can aim at
      the previous block, which is the ex-post direction. The value that ships is a judgement about
      which failure is more tolerable, not a solution, and it was revised downward once analysis
      showed the original setting made ex-post reorgs too cheap. Recognising the shape of this
      tradeoff is the point; memorising the current integer is not.
    volatility: evolving
    edges:
      - { to: proposer-boost, type: requires }
      - { to: ex-ante-reorg, type: deepens }
      - { to: ex-post-reorg, type: deepens }
    sources: [neu-tas-tse-two-attacks, fork-choice-spec]
    misconceptions:
      - belief: Proposer boost eliminated the balancing attack.
        reality: It raised the cost, but variants survive it because of how equivocating votes are counted — and it made ex-post reorgs easier at the same time.
        why: The boost was announced as the fix for that attack.
        source: neu-tas-tse-two-attacks

  - id: ex-ante-reorg
    title: Ex-ante reorg
    oneLine: The attacker withholds its own block and votes, lets an honest block be published, then releases the hidden fork with enough accumulated weight to displace it.
    statement: >
      In an ex-ante reorg the attack is set up before the victim block exists. The adversary
      proposes but does not publish, and withholds attestations from its own validators. An honest
      proposer then publishes normally. At the right moment the adversary releases the withheld
      block and votes together, so that its subtree outweighs the honest one and honest nodes switch
      to it. The defence is proposer boost: the honest block's temporary bonus must exceed what the
      adversary can release. That is the entire reason the boost exists.
    volatility: stable
    edges:
      - { to: lmd-ghost, type: requires }
      - { to: latest-message-only, type: requires }
      - { to: ex-post-reorg, type: contrasts }
    sources: [ethereum-org-pos-attack-defense, casper-ex-ante-mitigation, neu-tas-tse-two-attacks]

  - id: ex-post-reorg
    title: Ex-post reorg
    oneLine: The attacker sees an honest block already published, then uses its own proposer boost plus withheld attestations to build a sibling that outweighs it.
    statement: >
      In an ex-post reorg the adversary acts after seeing the victim block. Being the next slot's
      proposer, it builds on the victim's parent instead of on the victim, and its own block
      receives proposer boost. If the boost plus whatever attestations it has withheld outweighs the
      honest block's accumulated weight, honest nodes abandon the honest block. Nothing has to be
      withheld in advance and no equivocation is needed — which is why raising the boost to defend
      against ex-ante attacks makes this one cheaper.
    volatility: stable
    edges:
      - { to: proposer-boost, type: requires }
      - { to: ex-ante-reorg, type: contrasts }
    sources: [neu-tas-tse-two-attacks, fork-choice-spec]

  - id: balancing-attack
    title: Balancing attack
    oneLine: A small adversary with control over message timing splits honest validators into two roughly equal views and keeps the chain from converging.
    statement: >
      A balancing attack does not try to win a fork; it tries to prevent either fork from winning.
      The adversary equivocates — releasing conflicting votes to different parts of the network — and
      then feeds each half just enough weight to keep the two subtrees within a hair of each other.
      Honest validators split, neither branch gains a decisive lead, and justification stalls. It
      requires very little stake and a great deal of control over who receives what, when. Proposer
      boost raised its cost without closing it, which is what motivated the redesigns.
    volatility: stable
    edges:
      - { to: lmd-ghost, type: requires }
      - { to: latest-message-only, type: requires }
      - { to: liveness-property, type: applies }
      - { to: ex-post-reorg, type: contrasts }
    sources: [neu-tas-tse-two-attacks, ethereum-org-pos-attack-defense]

  - id: equivocation-handling
    title: Counting equivocating votes
    oneLine: Counting one vote per validator per slot is not enough — an attacker who controls delivery chooses which one each node sees.
    statement: >
      An equivocating validator has published two conflicting attestations. Fork choice must decide
      what to do with weight it can no longer attribute honestly. Counting only one of the votes is
      the obvious move, and it is not sufficient: which one a node counts depends on what it
      received first, which is exactly what an adversary controlling propagation gets to choose.
      Closing this required refinements to how votes are attributed and discounted, on top of
      proposer boost, and the fact that it needed more than one mechanism is the point worth
      remembering.
    volatility: evolving
    edges:
      - { to: balancing-attack, type: requires }
      - { to: slashing, type: contrasts }
    sources: [neu-tas-tse-two-attacks, fork-choice-spec]

  - id: honest-reorg-of-late-blocks
    title: The honest late-block reorg rule
    oneLine: An optional client rule lets a proposer legitimately reorg the previous block if it arrived too late, gated on head weight, parent weight and epochs since finalization.
    statement: >
      Clients ship a rule that lets a proposer deliberately build on the grandparent rather than a
      parent that arrived late, on the grounds that the late block did not deserve to win. It is
      gated: the late block must have gathered little weight, its parent must have gathered a lot,
      and finality must be recent. It is optional in the specification, not mandatory, so its
      behaviour depends on which clients enabled it and with what thresholds — read them out of the
      spec and the client's own configuration, not from articles. In practice it reduced the number
      of late blocks that survived, at the cost of making some reorgs a normal, intended event.
    volatility: evolving
    edges:
      - { to: proposer-boost, type: requires }
      - { to: reorg-depth-in-practice, type: applies }
      - { to: ex-post-reorg, type: contrasts }
    sources: [fork-choice-spec, eth2book-fork-choice]
    misconceptions:
      - belief: Reorgs on Ethereum are theoretical.
        reality: A multi-block reorg happened on mainnet in 2022 from a fork-choice implementation and deployment interaction, and single-block reorgs of late blocks are routine and sometimes deliberate.
        why: The word finality is heard as "nothing ever reorgs".
        source: monnot-reorg-post

  - id: view-merge
    title: View merge
    oneLine: Instead of nudging weight, attesters freeze their view and the proposer publishes its own, so everyone judges the same set of messages.
    statement: >
      View merge attacks the same problem as proposer boost from the other end. Instead of giving a
      timely block extra weight to overcome disagreement about what has been seen, it removes the
      disagreement: attesters freeze their view shortly before the slot, and the proposer publishes
      the messages it has seen alongside its block, so honest validators evaluate the same set. The
      appeal is that it has no dial to mis-set — no value trades ex-ante safety against ex-post
      safety, because it is not compensating for divergent views but eliminating them.
    volatility: evolving
    edges:
      - { to: proposer-boost-tradeoff, type: requires }
      - { to: proposer-boost, type: contrasts }
    sources: [goldfish-paper]
    needsSource: true

  - id: rlmd-ghost
    title: RLMD-GHOST
    oneLine: Recent-latest-message-driven GHOST expires votes older than a window, making the rule hold up under dynamic participation where plain LMD-GHOST does not.
    statement: >
      Plain LMD-GHOST keeps a validator's latest message forever, which means weight from validators
      that have gone away continues to count. RLMD-GHOST expires messages older than a bounded
      window, so the rule reflects who is currently participating. The formal payoff is that the
      protocol keeps its guarantees under dynamic availability — validators joining and leaving —
      which the plain rule does not. It is a research direction with no fork assignment, presented
      here because it isolates which property of LMD-GHOST the attacks are actually exploiting.
    volatility: evolving
    edges:
      - { to: lmd-ghost, type: requires }
      - { to: latest-message-only, type: contrasts }
    sources: [rlmd-ghost-paper]
    needsSource: true

  - id: three-slot-finality
    title: Three-slot finality
    oneLine: The leading single-slot-finality design finalises within a small constant number of slots using multiple vote rounds, shrinking the fork-choice surface dramatically.
    statement: >
      Three-slot finality replaces the split between a head rule and a separate finality gadget with
      a protocol that runs several vote rounds and finalises within a small constant number of
      slots. If blocks finalise almost immediately, the tree of unfinalized blocks that fork choice
      operates over is tiny, and most of the attacks in this module lose their room to work. It is
      the leading design in the single-slot-finality family, it is research with no fork assignment,
      and its name is a corrective: the family is called SSF but the concrete proposals do not claim
      one slot.
    volatility: hot
    edges:
      - { to: casper-ffg, type: requires }
      - { to: gasper, type: contrasts }
    sources: [3sf-paper, 3sf-ethresearch, ethereum-org-ssf-roadmap]
    misconceptions:
      - belief: Single slot finality means finality in one slot.
        reality: The leading design finalises in a small constant number of slots; SSF is a family name, not a latency claim.
        why: The name says single slot.
        source: 3sf-ethresearch

  - id: orbit-ssf
    title: Orbit — scaling the validator set under fast finality
    oneLine: Sample a rotating committee large enough for economic security each slot instead of having the entire validator set vote every slot.
    statement: >
      Fast finality is expensive because it needs the whole validator set to vote often. Orbit is
      the half of the plan that addresses that: rather than every validator voting every slot,
      sample a rotating committee large enough that corrupting it is economically infeasible. The
      security argument becomes statistical rather than exhaustive, which is a real change in what
      the protocol promises. Committee sizes discussed in the literature are research parameters,
      not spec values, and nothing here is scheduled for a fork.
    volatility: hot
    edges:
      - { to: three-slot-finality, type: requires }
      - { to: committee, type: requires }
    sources: [ethereum-org-ssf-roadmap, 3sf-paper]

  - id: confirmation-rule
    title: The fast confirmation rule
    oneLine: A fork-choice-derived rule that says a block cannot be reorged unless more than a stated fraction of stake is adversarial, giving strong confidence in seconds rather than minutes.
    statement: >
      Finality takes roughly two epochs. The confirmation rule offers something weaker and much
      faster: a computation over the same fork-choice data that concludes a block cannot be reorged
      unless more than some stated fraction of stake is adversarial. That is a conditional
      guarantee, and the condition must be stated whenever the result is used. It is aimed squarely
      at the products that currently pick an arbitrary confirmation depth — exchanges, bridges,
      payment flows — and lets them replace a guess with a named assumption. Whether a given client
      exposes it on its API, and under what flag, has to be checked per client and per release.
    volatility: hot
    edges:
      - { to: gasper, type: requires }
      - { to: confirmation-policy, type: applies }
      - { to: casper-ffg, type: contrasts }
    sources: [fork-choice-spec, ethereum-org-ssf-roadmap]
    misconceptions:
      - belief: A missed slot means someone attacked the chain.
        reality: Most missed slots are offline or late proposers; the base rate of ordinary misses is far higher than the rate of attacks.
        why: Every gap in a block list looks suspicious.
        source: ethereum-org-pos-attack-defense
