moduleId: protocol-peerdas
concepts:
  - id: data-availability-problem
    title: The data availability problem
    oneLine: A rollup must convince Ethereum its data was published, but making every node download every byte does not scale — sampling gives statistical certainty from a fraction of the data.
    statement: >
      A rollup's safety rests on its data having been published: if the batch is unavailable, nobody
      can reconstruct state, challenge a wrong claim, or exit. The brute-force guarantee is that
      every node downloads everything, and it is exactly what caps capacity. Data availability
      sampling replaces it with a statistical guarantee: each node checks a small random portion, and
      the combination of many independent checks makes successful withholding overwhelmingly
      unlikely. The trade is explicit and worth stating plainly — individual nodes know less, and the
      network as a whole knows enough.
    volatility: stable
    edges:
      - { to: data-availability, type: requires }
      - { to: data-availability-sampling, type: requires }
      - { to: rollup, type: applies }
    sources: [eip-7594, ethereum-org-peerdas]

  - id: blob-baseline
    title: What a blob is, precisely
    oneLine: 4096 field elements of 32 bytes — 128 KiB — referenced from the EVM only by the versioned hash of its KZG commitment.
    statement: >
      A blob is a fixed-size object of 4096 field elements, each 32 bytes, for 128 KiB in total. It
      travels alongside a transaction rather than inside it, and the execution layer never sees its
      contents: the EVM can obtain the versioned hash of the blob's KZG commitment and can verify a
      claimed evaluation through a precompile, but it cannot read a byte. That restriction is the
      entire reason blob data can be priced so far below calldata, and it is the fixed unit
      everything in this module is built on.
    volatility: stable
    edges:
      - { to: blob, type: requires }
      - { to: kzg-commitment, type: requires }
      - { to: blob-not-in-evm, type: requires }
    sources: [eip-4844, eip-7594]

  - id: erasure-extension
    title: Extend to twice the length, recover from any half
    oneLine: Each blob is Reed-Solomon extended to twice its length, so any 50% of the extended data reconstructs the original.
    statement: >
      Before anything is sampled, each blob is Reed-Solomon extended so the extended blob has twice
      as many field elements as the original. The property that buys is recovery: any half of the
      extended data suffices to reconstruct all of it. This is what makes sampling meaningful.
      Without extension an adversary could withhold a single per-cent of the original data and no
      random sample would reliably notice; with extension, withholding enough to make the data
      unrecoverable means withholding more than half, which random sampling detects easily.
    volatility: stable
    edges:
      - { to: blob-baseline, type: requires }
      - { to: data-availability-problem, type: requires }
    sources: [eip-7594, fulu-das-core]
    misconceptions:
      - belief: Sampling means downloading a random sample of the blob's actual bytes.
        reality: Nodes sample from the erasure-extended data. Extension is what makes a random sample informative; sampling raw data would miss small withholding entirely.
        why: The word sampling suggests statistics over the original population.
        source: eip-7594

  - id: cell
    title: The cell
    oneLine: The smallest independently authenticatable unit — 64 field elements, giving 128 cells per extended blob.
    statement: >
      An extended blob is divided into cells of 64 field elements each, which works out to 128 cells
      per extended blob. The cell is the unit of everything downstream: it is the smallest piece
      that can be transferred, verified in isolation, and counted towards reconstruction. Choosing a
      cell size is a tradeoff between proof overhead per unit of data and the granularity of
      sampling, and the values here are spec constants read from the current consensus specs rather
      than free parameters.
    volatility: evolving
    edges:
      - { to: erasure-extension, type: requires }
    sources: [fulu-das-core, eip-7594]

  - id: cell-kzg-proof
    title: Every cell carries its own proof
    oneLine: A cell can be verified against the blob's KZG commitment on its own, and the proofs are computed by the sender because verification is the cheap side.
    statement: >
      Each cell ships with a KZG proof opening it against the blob's commitment, so a node that
      received one cell and nothing else can confirm the cell is genuinely part of that blob. That
      is what makes isolated sampling possible at all. Computing those proofs is expensive and
      verifying them is cheap, so the work sits with the sender: since Fusaka the transaction wrapper
      carries cell proofs rather than whole-blob proofs, which is a change every blob-submitting
      rollup and tool had to make.
    volatility: evolving
    edges:
      - { to: cell, type: requires }
      - { to: kzg-commitment, type: requires }
    sources: [fulu-das-core, eip-7594]

  - id: data-matrix
    title: The block's data matrix
    oneLine: All blobs in a slot form a matrix — one row per blob, 128 columns — and a column is one cell index taken across every blob.
    statement: >
      Arrange every extended blob in a block as a row and you get a matrix with as many rows as the
      block has blobs and 128 columns. A column is the same cell index taken from every blob in the
      block. This is the single most useful picture in the module, because everything about custody,
      sampling and bandwidth is a statement about which stripes of that matrix a node holds. Adding
      blobs to a block grows the matrix downward; it does not make it wider.
    volatility: evolving
    edges:
      - { to: cell, type: requires }
      - { to: blob-baseline, type: requires }
    sources: [fulu-das-core, ethereum-org-peerdas]

  - id: column-not-row-custody
    title: Nodes custody columns, not blobs
    oneLine: Because custody is vertical, no ordinary node holds any single blob in full — and a node's bandwidth stops depending on how many blobs a block carries.
    statement: >
      Custody is assigned by column, which means an ordinary node holds a slice of every blob and the
      whole of none. That sounds like a downside and is the central design win: since adding blobs
      adds rows rather than columns, a node's share of the matrix stays the same fraction as capacity
      grows. Per-node bandwidth is therefore roughly independent of blob count, which is precisely
      what made it safe to start raising blob capacity on a fast cadence through standalone
      parameter forks.
    volatility: evolving
    edges:
      - { to: data-matrix, type: requires }
      - { to: bpo-fork, type: applies }
      - { to: peerdas-enables-more-blobs, type: applies }
    sources: [fulu-das-core, ethereum-org-peerdas]
    misconceptions:
      - belief: More blobs per block means more bandwidth for every node.
        reality: Custody is per column, so more blobs grows the matrix vertically while a node's slice stays the same fraction of it.
        why: Before PeerDAS, blob count did scale node bandwidth linearly.
        source: ethereum-org-peerdas
      - belief: Blobs are gossiped as whole blobs to everyone.
        reality: On mainnet since Fusaka the gossiped unit is the data column sidecar across 128 subnets; a node never downloads a whole blob.
        why: It was true from EIP-4844 until Fusaka, and most explanatory material dates from then.
        source: fulu-p2p

  - id: custody-groups
    title: Custody groups
    oneLine: Custody is assigned in 128 groups derived from a node's id by repeated hashing, and columns are then derived from groups.
    statement: >
      Custody is not assigned column by column. There are 128 custody groups, and a node's groups are
      derived deterministically from its node id by repeated hashing; the columns it must hold follow
      from the groups. The indirection matters when reading older material: drafts before the shipped
      design assigned columns directly, so anything written before mid-2025 describes a model the
      network does not use. Group count and column count happen both to be 128 in the current spec,
      which makes it easy to miss that they are separate concepts.
    volatility: evolving
    edges:
      - { to: column-not-row-custody, type: requires }
      - { to: hash-function, type: requires }
    sources: [fulu-das-core]
    misconceptions:
      - belief: Custody is randomly assigned, or chosen by the operator.
        reality: It is derived deterministically from the node id by hashing, which is what allows peers to be found by the columns they hold.
        why: The word assignment implies a coordinator handing out slices.
        source: fulu-das-core

  - id: custody-requirement
    title: How much you must custody
    oneLine: A plain full node custodies 4 custody groups; a node with validators custodies at least 8, scaling up by one group per 32 ETH of attached balance, capped at all 128.
    statement: >
      The spec sets a floor of 4 custody groups for any full node. A node with validators attached
      must custody at least 8, and that requirement scales with the attached balance — one additional
      group per 32 ETH — up to the cap of 128 groups, at which point the node is a supernode holding
      everything. The scaling encodes a fairness argument: the more stake depends on your view, the
      more of the data you must be able to serve. It also means the network's reconstruction
      behaviour depends on how many supernodes actually run, which is a measurable thing worth
      measuring rather than assuming.
    volatility: evolving
    edges:
      - { to: custody-groups, type: requires }
      - { to: validator, type: requires }
    sources: [fulu-das-core, fulu-validator]
    misconceptions:
      - belief: Every node stores blob data in full.
        reality: A plain full node custodies 4 of 128 custody groups; only supernodes custody all of them, and most nodes hold a small slice.
        why: The pre-4844 model where every node stores everything is still the default assumption.
        source: fulu-das-core

  - id: deterministic-custody-from-nodeid
    title: Custody derived from node id makes peers findable
    oneLine: Because custody follows from the node id and is advertised in the ENR, peers can be discovered by the columns they hold rather than asked one at a time.
    statement: >
      Deriving custody from the node id turns discovery into a lookup. A node advertises its custody
      group count in its discovery record, and any peer can compute from that id and count exactly
      which columns it holds — without asking, and before connecting. That is what makes
      column-targeted peering possible: a node missing column 37 can go looking for peers who must
      have column 37, rather than sampling the peer set and hoping. The cost is that custody cannot
      be chosen, and rotating it means changing identity.
    volatility: evolving
    edges:
      - { to: custody-groups, type: requires }
      - { to: discv5, type: requires }
    sources: [fulu-das-core, fulu-p2p]

  - id: sampling
    title: Sampling beyond custody
    oneLine: An honest node samples 8 custody groups' worth of columns per slot beyond what it holds — or its own custody count, whichever is larger.
    statement: >
      Custody is what a node keeps and serves. Sampling is what it checks. Each slot an honest node
      samples the equivalent of 8 custody groups, or its own custody count if that is larger, and
      treats the block's data as available for its own purposes only if those samples succeed.
      Sampling is not storage: the sampled data need not be retained. The separation of the two roles
      — keep a little, check a bit more — is what lets the network's aggregate assurance far exceed
      any individual node's knowledge.
    volatility: evolving
    edges:
      - { to: custody-groups, type: requires }
      - { to: data-availability-sampling, type: requires }
    sources: [fulu-das-core]

  - id: das-security-argument
    title: Why a handful of samples is enough
    oneLine: Withholding enough to prevent reconstruction means withholding over half the columns, and k random samples miss that with probability one in two to the k.
    statement: >
      The argument has two halves. First, because of erasure extension, an adversary who wants the
      data to be unrecoverable must withhold more than half the columns. Second, a node drawing k
      random columns fails to notice such withholding with probability at most one half to the power
      k — so eight samples already leaves a small chance of being fooled, and thousands of nodes
      sampling independently leaves essentially none. The per-node guarantee is deliberately weak;
      the network-wide guarantee is what the design is buying.
    volatility: stable
    edges:
      - { to: sampling, type: requires }
      - { to: erasure-extension, type: requires }
    sources: [fulu-das-core, eip-7594]
    misconceptions:
      - belief: If a node's samples pass, the data definitely exists.
        reality: It is a probabilistic conclusion per node. Security comes from many nodes sampling independently, so an adversary would have to fool nearly all of them at once.
        why: Availability is presented as a yes-or-no property.
        source: fulu-das-core

  - id: reconstruction-rule
    title: Reconstruct once you hold half
    oneLine: A node holding 50% or more of the columns should reconstruct the whole matrix — after a random delay, so the network does not all reconstruct at once.
    statement: >
      A node that has obtained at least half the columns can and should rebuild the entire matrix
      from them. The specification adds an unusual instruction: wait a random interval first. If
      every capable node reconstructed the moment it could, the network would burn a large amount of
      redundant CPU at the same instant and flood the same gossip topics. The random delay
      desynchronises them, and often means the missing columns arrive from someone else before you
      need to do the work at all.
    volatility: evolving
    edges:
      - { to: erasure-extension, type: requires }
      - { to: data-matrix, type: requires }
    sources: [fulu-das-core]
    misconceptions:
      - belief: Reconstruction is a rare disaster-recovery path.
        reality: It is normal operation, to the point that the spec tells nodes to stagger it so they do not all do it simultaneously.
        why: The word reconstruct sounds like recovery from failure.
        source: fulu-das-core

  - id: cross-seeding
    title: Cross-seeding — how a partially withheld block heals
    oneLine: After reconstructing, a node must re-expose the recovered columns as though it had received them, and may then discard what it does not custody.
    statement: >
      Reconstruction alone would only help the node that did it. The rule that makes it a network
      property is what comes next: a node that reconstructs must re-expose the recovered columns —
      gossiping them to its mesh, or at minimum advertising that it can serve them — and may then
      delete the ones outside its own custody. That turns every node holding half the matrix into a
      repair point. An adversary that withholds a minority of columns finds them republished from
      several directions within the slot, which is why partial withholding is not a viable attack.
    volatility: evolving
    edges:
      - { to: reconstruction-rule, type: requires }
      - { to: gossipsub, type: requires }
    sources: [fulu-das-core, fulu-p2p]

  - id: column-subnets
    title: One gossip subnet per column
    oneLine: 128 subnets carry data column sidecars, one per column index, and a node subscribes only to the subnets it custodies.
    statement: >
      Data column sidecars are gossiped on 128 subnets, one per column, with the subnet chosen by the
      column index. A node subscribes to the subnets for the columns it custodies and no others,
      which is what keeps its inbound traffic proportional to its custody rather than to the whole
      block. Columns it merely samples are fetched by direct request from peers rather than by
      subscribing, and the retention window for serving those requests is a spec constant, not a
      client preference.
    volatility: evolving
    edges:
      - { to: custody-groups, type: requires }
      - { to: gossipsub, type: requires }
      - { to: p2p-overlay, type: requires }
    sources: [fulu-p2p]

  - id: das-timebound
    title: Sampling is a hard real-time problem
    oneLine: A validator must decide whether the block's data is available by the attestation deadline, so sampling has seconds, not a background window.
    statement: >
      Sampling is not a background download that finishes when it finishes. A validator has to decide
      whether to attest to a block, and that decision is due at the attestation deadline a few
      seconds into the slot. Every sample request, every peer round trip and every verification has
      to fit inside that budget, on a network with real latency and real peers who may not answer.
      This is what makes data availability sampling a networking engineering problem rather than a
      cryptography problem, and it is the constraint that shapes the peering strategy, the subnet
      design and the escape hatches.
    volatility: evolving
    edges:
      - { to: sampling, type: requires }
      - { to: slot-phases, type: requires }
      - { to: propagation-latency, type: applies }
    sources: [fulu-das-core, fradamt-das-fork-choice]

  - id: getblobs-shortcut
    title: Pulling blob data from your own execution client
    oneLine: engine_getBlobs lets a consensus client that received a block but not its data fetch it from the local execution client's blob mempool instead of waiting on gossip.
    statement: >
      Blob-carrying transactions reach execution clients through the transaction mempool before the
      block that includes them is proposed. So when a consensus client has a beacon block but is
      missing data, it can ask its own execution client over the Engine API rather than waiting for
      the network. The Osaka-fork methods come in two shapes: one that answers all or nothing, and
      one that answers partially with gaps marked. It is a latency escape hatch rather than a
      correctness mechanism, and it materially helps sampling meet its deadline.
    volatility: evolving
    edges:
      - { to: engine-api, type: requires }
      - { to: das-timebound, type: requires }
      - { to: mempool-is-not-a-queue, type: applies }
    sources: [engine-api-spec, fulu-das-core]

  - id: is-data-available
    title: What "available" means to fork choice now
    oneLine: A block is gated on is_data_available, which checks only the node's own custodied columns and samples — not that the node has all the data.
    statement: >
      Fork choice will not consider a block whose data availability check has not passed. What that
      check verifies has changed: it confirms the node holds its custodied columns and that its
      samples succeeded, not that the node has the data. This is a genuine weakening of what each
      node individually knows, accepted in exchange for capacity, and it is the conceptual heart of
      the module. The obligation to serve those columns is also bounded — the retention window is
      4096 epochs, roughly eighteen days — after which nodes may prune and long-term availability is
      somebody else's problem.
    volatility: evolving
    edges:
      - { to: das-timebound, type: requires }
      - { to: fork-choice-purpose, type: requires }
      - { to: blob-pruning, type: requires }
    sources: [fulu-fork-choice, fulu-p2p]
    misconceptions:
      - belief: PeerDAS lets Ethereum store rollup data permanently.
        reality: Nodes must serve column sidecars for 4096 epochs, roughly eighteen days, and may prune afterwards. Long-term availability is the rollup's or a third party's problem.
        why: 'The phrase "data availability layer" is heard as "data storage layer".'
        source: fulu-p2p
