moduleId: protocol-statelessness
concepts:
  - id: ethereum-state
    title: What state actually is, and why it costs
    oneLine: Every account plus every contract's storage — hundreds of gigabytes, growing monotonically, and the real reason running a node is expensive.
    statement: >
      State is the set of all accounts — balance, nonce, code hash, storage root — together with
      every contract's storage. It is what the state root commits to and what a node must hold to
      execute a block. It is measured in hundreds of gigabytes, it grows with every write and shrinks
      almost never, and it is random-access rather than sequential, which is why it punishes cheap
      disks so badly. Every proposal in this module exists because that growth is unbounded and the
      hardware requirement it implies is the practical limit on how many people can run a node.
    volatility: stable
    edges:
      - { to: state-as-keyvalue, type: requires }
      - { to: state-growth-problem, type: requires }
      - { to: merkle-patricia-trie, type: requires }
    sources: [eip-7864, stateless-fyi-binary-tree]

  - id: state-vs-history
    title: State and history are different problems
    oneLine: History is old blocks and receipts and is pruned by EIP-4444; state is current balances and storage, and it is what statelessness and expiry address.
    statement: >
      Conflating the two produces wrong conclusions about node cost. History is the record of what
      happened — old blocks, receipts, old transactions — it is append-only, it is sequential, and
      bounding it in execution clients is a largely settled direction. State is what is true now, it
      is random-access, and it is the part that must be held to execute the next block. Pruning
      history does not reduce the state a node must keep, and a proposal about one does not help with
      the other, however similar "Ethereum forgets old data" sounds in both cases.
    volatility: evolving
    edges:
      - { to: ethereum-state, type: requires }
    sources: [eip-4444, stateless-fyi-binary-tree]
    misconceptions:
      - belief: State expiry and history pruning are the same idea.
        reality: History pruning drops old blocks and receipts and is a largely solved direction; state expiry drops unused current state and is unscheduled with unsolved resurrection ergonomics.
        why: Both get described as Ethereum forgetting old data.
        source: eip-4444

  - id: witness
    title: The witness
    oneLine: The state values plus sibling hashes needed to prove a block read and wrote exactly what it claims — the input a verifier needs instead of the whole state.
    statement: >
      A witness accompanies a block and contains everything a verifier needs to check execution
      without holding state: the values of every state item the block touched, and the trie path
      material — sibling hashes — proving each of those values was really in the state committed by
      the parent's state root. Given the block and a valid witness, a verifier can execute and
      confirm the resulting state root while holding nothing. The idea is old and the obstacle has
      always been size.
    volatility: stable
    edges:
      - { to: merkle-patricia-trie, type: requires }
      - { to: eth-getproof, type: applies }
    sources: [stateless-fyi-binary-tree, eip-7864]

  - id: statelessness
    title: Stateless verification, and the weak version that is actually the target
    oneLine: Verifying a block from the block plus its witness alone — with weak statelessness, where only builders keep state, as the real target.
    statement: >
      A fully stateless client holds no state and verifies each block from the block and its witness
      alone. That is the pure form, and it is not what is being targeted. Weak statelessness is: block
      builders hold full state, because someone must in order to construct a block and its witness,
      and everyone else verifies statelessly. The distinction matters because it tells you where the
      cost went rather than that it vanished — it concentrates in the parties already specialising in
      block production, which is a centralisation the design accepts explicitly.
    volatility: evolving
    edges:
      - { to: witness, type: requires }
      - { to: pbs-problem, type: applies }
    sources: [stateless-fyi-binary-tree]
    misconceptions:
      - belief: Statelessness means nobody stores state.
        reality: Weak statelessness is the target — block builders keep full state and everyone else verifies with witnesses. Someone must still hold state to build a block at all.
        why: The name implies total elimination.
        source: stateless-fyi-binary-tree

  - id: witness-size-is-the-blocker
    title: Witness size is what blocks statelessness
    oneLine: Witnesses must be small enough to gossip inside a slot, and hexary-trie witnesses for a full block are far too large — so the state commitment has to change first.
    statement: >
      Statelessness is not blocked by cryptography or by client architecture. It is blocked by bytes.
      A witness has to reach every verifier inside the same seconds that already carry the block, the
      blobs and the sampling traffic, and witnesses over today's sixteen-way trie run to megabytes
      for an ordinary block because every level of every path drags along up to fifteen sibling
      hashes. That is why the state commitment structure has to change before statelessness is
      possible: the tree shape is the size, and the size is the blocker.
    volatility: evolving
    edges:
      - { to: witness, type: requires }
      - { to: merkle-patricia-trie, type: requires }
      - { to: das-timebound, type: applies }
    sources: [eip-7864, stateless-fyi-binary-tree]

  - id: vector-commitment
    title: Vector commitments
    oneLine: A commitment to a list where any position can be opened with a proof whose size does not grow with the list's width — which is what makes wide trees cheap to prove.
    statement: >
      With a plain hash-based node, proving one child requires revealing all the siblings, so
      widening a node makes proofs worse. A vector commitment breaks that link: it commits to a whole
      list such that any single position can be opened with a proof whose size is independent of how
      many entries the list has. Given one, wide trees become attractive — fewer levels, and no
      sibling cost per level. This is the single idea that made Verkle trees worth pursuing, and
      understanding it is what makes the eventual reversal to arity two make sense rather than look
      like a retreat.
    volatility: stable
    edges:
      - { to: kzg-commitment, type: requires }
      - { to: hash-function, type: contrasts }
    sources: [eip-6800, stateless-fyi-binary-tree]

  - id: verkle-tree
    title: Verkle trees
    oneLine: A state tree using polynomial vector commitments so a very wide node can be opened without publishing siblings, shrinking witnesses by roughly an order of magnitude.
    statement: >
      A Verkle tree replaces each node's hash with a polynomial vector commitment, so a node of high
      arity — 256 children in the proposed design — can be opened at one position without publishing
      the other 255. Fewer levels and no per-level sibling cost together reduced witness sizes by
      roughly an order of magnitude compared with the hexary trie, which was expected to be enough to
      make statelessness practical. It was the state-tree plan through roughly 2024 and is described
      as such in a very large amount of still-circulating material.
    volatility: evolving
    edges:
      - { to: vector-commitment, type: requires }
      - { to: merkle-patricia-trie, type: contrasts }
      - { to: binary-state-tree, type: supersedes }
    sources: [eip-6800]

  - id: verkle-is-off-the-roadmap
    title: Verkle was dropped, not delayed
    oneLine: The direction moved to hash-based binary trees; the reasons given are post-quantum security and proving-friendliness, not performance.
    statement: >
      Verkle is no longer the plan. The successor proposal is an explicitly hash-based tree, and the
      reasons stated consistently in its rationale and in the surrounding technical discussion are
      that polynomial commitments rest on elliptic-curve cryptography, which is not post-quantum
      secure, and that they are expensive to verify inside a proof system, which conflicts with the
      direction towards proving blocks. Note the shape of this claim: it is consistent across the
      proposal's own rationale and community discussion, and there is no single announcement post to
      point at. Any course still teaching that the state-tree upgrade is Verkle is teaching a
      cancelled design.
    volatility: hot
    edges:
      - { to: verkle-tree, type: requires }
      - { to: binary-state-tree, type: contrasts }
    sources: [eip-7864, eip7864-magicians]
    misconceptions:
      - belief: Verkle trees are Ethereum's next big upgrade.
        reality: They were dropped in favour of a hash-based binary tree; the material teaching Verkle as upcoming was written between 2022 and 2024 and was correct then.
        why: Verkle was heavily promoted for years and appears in almost every roadmap explainer.
        source: eip-7864
      - belief: Verkle was dropped because it was too slow.
        reality: The decisive objections were post-quantum security and unfriendliness to proving, not raw speed.
        why: 'The word "dropped" is usually assumed to mean it failed on performance.'
        source: eip7864-magicians

  - id: binary-state-tree
    title: The unified binary tree
    oneLine: EIP-7864 replaces the sixteen-way trie with an arity-2 tree using only a hash function — more levels, but one sibling per level.
    statement: >
      The current direction is a binary tree over a single unified key space, using nothing but a
      hash function. The counterintuitive part is that a deeper tree gives smaller proofs: arity two
      means exactly one sibling per level, and one sibling times many levels beats fifteen siblings
      times few levels. The proposal quotes branch sizes on the order of hundreds of bytes at arity
      two against thousands at arity sixteen for an equivalently sized tree — those are branch
      figures for a single path, not whole-block witness sizes, and the two get quoted
      interchangeably. It is a Draft and is not assigned to any fork.
    volatility: hot
    edges:
      - { to: merkle-patricia-trie, type: requires }
      - { to: hash-function, type: requires }
      - { to: verkle-tree, type: contrasts }
    sources: [eip-7864, stateless-fyi-binary-tree]
    misconceptions:
      - belief: A binary tree gives bigger proofs than a wide tree because it has more levels.
        reality: More levels but only one sibling each; arity two minimises total proof size when your only primitive is a hash. Wide arity only wins when a vector commitment removes the sibling cost.
        why: Deeper looks like more work, and for lookups it is.
        source: eip-7864

  - id: hash-choice-tbd
    title: The hash function is not decided
    oneLine: Reference implementations use BLAKE3, with Keccak and Poseidon2 as candidates — a live tradeoff between proving cost and cryptanalytic confidence.
    statement: >
      The tree's hash function is explicitly unsettled. Reference implementations use BLAKE3;
      Keccak and Poseidon2 are candidates. The tradeoff is legible: an arithmetisation-friendly hash
      such as Poseidon2 is dramatically cheaper to verify inside a proof system, which matters
      enormously if blocks are going to be proved, and it has far less cryptanalytic history behind
      it than Keccak. Choosing here is choosing how much novel cryptography to put underneath the
      state commitment of a network securing very large amounts of value.
    volatility: hot
    edges:
      - { to: binary-state-tree, type: requires }
      - { to: hash-function, type: requires }
      - { to: statelessness-vs-zk, type: deepens }
    sources: [eip-7864, eip7864-magicians]

  - id: unified-key-space
    title: One 32-byte key space for everything
    oneLine: Account headers, code and storage all live in one key space with subtree prefixes, removing the per-account storage trie entirely.
    statement: >
      Today an account's storage lives in its own trie hanging off the account record, so reaching a
      storage slot means descending one trie to find an account and another to find the slot. The
      proposal puts everything — account header fields, contract code, and storage — into a single
      32-byte key space, distinguished by subtree prefixes. The per-account storage trie disappears.
      Proofs stop being nested, and the cost of touching a slot stops depending on which contract it
      belongs to.
    volatility: hot
    edges:
      - { to: binary-state-tree, type: requires }
      - { to: per-account-storage-trie, type: supersedes }
    sources: [eip-7864]

  - id: stem-and-suffix
    title: Stem and suffix — locality made structural
    oneLine: Keys split into a 31-byte stem and a 1-byte suffix, so 256 related values share a stem and one branch opening covers all of them.
    statement: >
      Each key is a 31-byte stem plus a 1-byte suffix, which means 256 values sit under a shared
      stem and a single branch opening reaches all of them. Adjacent storage slots of the same
      contract land under the same stem by construction, so a contract that reads several nearby
      slots pays for one path rather than several. This is a locality optimisation with consequences
      for application developers: access patterns become an optimisation surface, and there is active
      work on making gas reflect what a state access actually costs to prove.
    volatility: hot
    edges:
      - { to: unified-key-space, type: requires }
      - { to: storage-slot, type: applies }
    sources: [eip-7864, dedaub-locality]
    misconceptions:
      - belief: Changing the state tree is invisible to smart contract developers.
        reality: A shared stem makes nearby slots cheap to prove together, and there is live work on pricing state access by locality — so storage layout becomes a cost decision, not just a style one.
        why: Trie shape feels like a pure client implementation detail.
        source: dedaub-locality

  - id: frozen-mpt-migration
    title: Freeze the old tree, do not convert it
    oneLine: The new tree starts empty and takes new writes while the old trie is frozen, with a later fork sweeping the remaining state across.
    statement: >
      Converting hundreds of gigabytes of state in one hard fork is not a plan anybody wants to
      execute. The approach instead is to freeze the existing trie and start the new tree empty:
      reads fall through to the frozen trie, writes go to the new tree, and a separate later fork
      sweeps the remainder across in a controlled way. The consequence for clients is that they must
      maintain both structures during the interval, which is more implementation work than a
      conversion but far less risk concentrated at a single moment.
    volatility: hot
    edges:
      - { to: binary-state-tree, type: requires }
      - { to: ethereum-state, type: requires }
    sources: [eip-7864, eip-7748]
    misconceptions:
      - belief: The migration converts all state in one hard fork.
        reality: The plan freezes the old trie and starts the new one empty, sweeping the remainder in a later fork.
        why: A single-shot migration is the obvious design and was assumed for years.
        source: eip-7864

  - id: pbt
    title: Partitioned binary trees
    oneLine: A further evolution beyond the current binary-tree proposal, which is itself positioned as a stepping stone rather than the destination.
    statement: >
      EIP-7864 specifies the unified binary state tree that is the current proposal. Discussion on that
      EIP's own Ethereum Magicians thread raises partitioned binary trees as a possible direction beyond
      it. There is no numbered proposal and no specification for that successor, so it belongs in your
      model as a research direction and a warning rather than as a plan: the state tree has been
      redesigned twice in four years, and anything you build on assumptions about its shape should say
      so out loud.
    volatility: hot
    edges:
      - { to: binary-state-tree, type: requires }
    sources: [eip-7864, eip7864-magicians]

  - id: state-expiry
    title: State expiry, parked
    oneLine: Making untouched state inactive until revived by a resurrection proof — repeatedly deferred, because resurrection ergonomics and address-format changes are brutal.
    statement: >
      State expiry would make state that nobody has touched for a period stop being part of the
      active state, requiring a proof to revive it before use. It attacks state growth directly
      rather than working around it. It has been deferred repeatedly, because the consequences are
      severe in exactly the places users notice: an address that quietly stops working, a wallet that
      must produce a resurrection proof, and address-format changes to carry the information needed.
      Sources describe its current status in different terms — parked rather than formally abandoned —
      and none of them puts it in a fork.
    volatility: hot
    edges:
      - { to: ethereum-state, type: requires }
      - { to: statelessness, type: contrasts }
    sources: [eip-7864, stateless-fyi-binary-tree]

  - id: statelessness-vs-zk
    title: Two roads to a verifier that holds nothing
    oneLine: Block plus witness, or block plus validity proof — real-time proving is now a serious competitor to statelessness for the same goal, and the sources do not agree which wins.
    statement: >
      Statelessness gets a verifier off state by sending it a witness. Real-time proving gets it off
      state by sending a validity proof: if the block comes with a proof that it was executed
      correctly, the verifier needs neither the state nor a large witness. The two solve the same
      problem with different costs and different risks — witness bandwidth against proving latency
      and novel cryptography. Which is the priority is contested framing rather than a settled
      decision, and the honest position is to hold both, understand what each buys, and watch which
      one gets fork-scheduled first.
    volatility: hot
    edges:
      - { to: statelessness, type: requires }
      - { to: zkvm, type: requires }
      - { to: witness-size-is-the-blocker, type: contrasts }
    sources: [stateless-fyi-binary-tree, eip7864-magicians]
