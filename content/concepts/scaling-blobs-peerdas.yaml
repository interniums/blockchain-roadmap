moduleId: scaling-blobs-peerdas
concepts:
  - id: batcher
    title: 'Batcher'
    oneLine: 'The rollup component that collects sequenced L2 transactions, compresses them, and submits them to L1 as a batch.'
    statement: >
      The batcher takes the ordering the sequencer produced, compresses it, and submits it to L1.
      It is a separate component with a separate key, a separate L1 balance to keep topped up, and
      a separate failure mode: if the batcher stops, the sequencer can keep issuing soft
      confirmations while nothing reaches L1 at all, so the chain looks healthy and its hard
      finality stops advancing. Sequencing decides order; batching decides when that order becomes
      checkable by anyone else.
    volatility: stable
    edges:
      - { to: sequencer, type: requires }
      - { to: rollup, type: requires }
      - { to: blob-transaction, type: deepens }
    sources: [op-specs-protocol-overview, optimism-fusaka-is-live]
  - id: batch-vs-state-commitment
    title: 'Batch versus state commitment'
    oneLine: 'Posting the data and posting the claimed resulting state root are two different L1 submissions with different cadences and different failure modes.'
    statement: >
      A rollup makes two distinct submissions to L1: the batch, which is the data needed to
      reconstruct L2 state, and the state commitment, which is the claimed root that withdrawals
      are proved against. They come from different components — batcher and proposer — on different
      schedules, and either can stall without the other. If batching stops, nobody can verify; if
      proposing stops, withdrawals freeze even though everything is verifiable. Treating them as
      one step hides one of the two chokepoints.
    volatility: stable
    edges:
      - { to: batcher, type: requires }
      - { to: state-root, type: requires }
      - { to: proposer-failure, type: deepens }
    sources: [op-specs-protocol-overview, l2beat-arbitrum-project]
  - id: batch-compression
    title: 'Batch compression'
    oneLine: 'Rollups compress batches before posting, so the effective L1 cost per L2 transaction is far below the raw byte cost.'
    statement: >
      Batches are compressed before posting, using general-purpose compression such as Brotli or
      zlib on top of domain-specific encoding that strips redundancy the rollup already knows —
      repeated addresses, predictable nonces, recoverable signature components. The result is that
      the L1 bytes attributable to one L2 transaction are a fraction of that transaction's raw
      size, and the ratio depends heavily on the transaction mix. Any per-transaction DA cost figure
      is meaningless without the compression ratio stated alongside it.
    volatility: stable
    edges:
      - { to: batcher, type: requires }
    sources: [op-specs-protocol-overview]
  - id: blob-transaction
    title: 'Blob transaction'
    oneLine: 'Transaction type 0x03 carrying blob sidecars, referenced on-chain only by versioned hashes of KZG commitments.'
    statement: >
      A blob transaction is type 0x03. The blob data travels as a sidecar on the consensus layer,
      not in the transaction body, and the execution layer sees only 32-byte versioned hashes of the
      blobs' KZG commitments. The EVM can read those hashes with BLOBHASH and can verify a claimed
      value at a point using the point-evaluation precompile, but it can never read blob bytes.
      That asymmetry is the whole design: data cheap enough to publish because the EVM never has to
      touch it.
    volatility: stable
    edges:
      - { to: blob, type: requires }
      - { to: batcher, type: requires }
      - { to: versioned-hash, type: requires }
      - { to: point-evaluation-precompile, type: recommends }
    sources: [eip-4844]
    misconceptions:
      - belief: 'The EVM can read blob data, so contracts can verify what was posted.'
        reality: 'Contracts see only the versioned hash via BLOBHASH; blob bytes never enter the EVM, and verification is done by KZG point evaluation at the precompile.'
        why: '"Posted on Ethereum" implies readable on Ethereum.'
        source: eip-4844
      - belief: 'Blobs are stored on Ethereum permanently.'
        reality: 'Blob sidecars are pruned after roughly eighteen days, which is chosen to outlast the challenge window and nothing more.'
        source: eip-4844
  - id: blob-gas-market
    title: 'The blob gas market'
    oneLine: 'Blobs price on their own EIP-1559-style market with its own base fee, which can spike while execution gas is calm.'
    statement: >
      Blob gas is accounted and priced entirely separately from execution gas. It has its own
      cumulative excess counter and its own base fee, updated block to block by the same
      exponential rule shape but from independent demand. The consequence is that the two markets
      routinely diverge: a congested execution layer does not raise the cost of posting data, and a
      surge of rollup posting does not raise the cost of a swap. One word, "gas", covers two
      unrelated prices.
    volatility: stable
    edges:
      - { to: blob-transaction, type: requires }
      - { to: gas, type: requires }
    sources: [eip-4844, blocknative-blob-gas]
    misconceptions:
      - belief: 'Blob fees are part of the normal gas market, so a busy Ethereum block makes DA expensive.'
        reality: 'Blob gas has an entirely separate base fee; the two markets routinely move in opposite directions.'
        why: 'They share the word "gas".'
        source: blocknative-blob-gas
  - id: blob-target-vs-max
    title: 'Blob target and max'
    oneLine: 'Each block has a blob target and a higher max; the base fee rises above target and falls below it, so the target is the price-setting parameter.'
    statement: >
      Every block has two blob parameters: a target and a higher maximum. The maximum caps how many
      blobs a block may carry; the target is what the fee mechanism steers towards, raising the blob
      base fee when usage exceeds it and lowering it when usage falls short. Capacity is therefore
      set by the max and price is set by the target, and raising one without the other changes the
      market's behaviour. Verified values: BPO1, activated 2025-12-09, set target 10 and max 15;
      BPO2, activated 2026-01-07, set target 14 and max 21. Later changes ship on their own
      schedule, so read the current values from the EIP index rather than from any lesson.
    volatility: hot
    edges:
      - { to: blob-gas-market, type: requires }
      - { to: bpo-fork, type: deepens }
    sources: [eip-7892, fusaka-mainnet-announcement, eip-4844]
    misconceptions:
      - belief: 'The blob target is 3 and the max is 6.'
        reality: 'Those were the original EIP-4844 values, superseded by Pectra''s 6 and 9 and then by the BPO forks. Any fixed pair you memorise will go stale.'
        why: 'The 4844 numbers were taught for two years and stuck.'
        source: fusaka-mainnet-announcement
  - id: blob-base-fee-floor
    title: 'The blob base fee floor'
    oneLine: 'When blob demand sits below target the blob base fee decays to its 1 wei floor, making data posting effectively free — until demand crosses target again.'
    statement: >
      The blob base fee has a hard floor of 1 wei. Whenever sustained demand sits below the target,
      the update rule drives the fee down to that floor and holds it there, so posting data costs
      effectively nothing. This is a regime, not a permanent state: the moment demand exceeds the
      target the fee climbs exponentially from a very low base, so relative increases look enormous
      while absolute costs are still small. Build batchers that behave correctly in both regimes,
      and be sceptical of any ratio quoted against a 1 wei baseline.
    volatility: hot
    edges:
      - { to: blob-gas-market, type: requires }
      - { to: blob-target-vs-max, type: requires }
    sources: [eip-4844, ieee-4844-impact]
    misconceptions:
      - belief: 'Blobs are scarce and rollups fight over them.'
        reality: 'That was true in specific windows. Whenever demand sits below target the fee returns to its floor. Both regimes recur, so neither is the permanent state.'
        why: 'People generalise from whichever regime was current when they learned.'
        source: ieee-4844-impact
  - id: dual-market-batching-decision
    title: 'The blob-or-calldata decision'
    oneLine: 'A batcher must continuously compare the cost of a type-3 blob submission against plain type-2 calldata and pick the cheaper path per batch.'
    statement: >
      Because blob gas and execution gas are separate markets, neither posting path is always
      cheaper. A batcher must price both for the batch it is about to send — blob gas times blob
      base fee against calldata bytes at the execution base fee, including the calldata floor
      pricing — and choose per batch. Chains that hard-code one path pay for it in exactly the
      periods where the other market is calm. This decision is a permanent part of running a
      rollup, not a migration that finished when 4844 shipped.
    volatility: evolving
    edges:
      - { to: blob-gas-market, type: requires }
      - { to: calldata-priced-at-the-edge, type: requires }
      - { to: batcher, type: applies }
    sources: [eip-4844, optimism-fusaka-is-live]
  - id: batch-posting-cadence-tradeoff
    title: 'Posting cadence is a tradeoff, not a setting'
    oneLine: 'Posting more often shortens time to hard finality and shrinks reorg exposure; posting less often is cheaper but leaves users on soft confirmations longer.'
    statement: >
      How often the batcher posts is a direct trade between cost and finality. Frequent posting
      shortens the gap between soft confirmation and hard finality, reduces how much L2 history is
      exposed to an L1 reorg, and speeds up anything downstream that waits on posted data —
      including bridge withdrawals. Infrequent posting fills blobs more completely and costs less.
      The parameter therefore belongs to whoever owns the product's risk, not only to whoever owns
      the infrastructure bill.
    volatility: stable
    edges:
      - { to: batcher, type: requires }
      - { to: hard-finality, type: requires }
      - { to: deposit-is-fast-withdrawal-is-slow, type: applies }
    sources: [optimism-fusaka-is-live, arbitrum-chain-finality]
  - id: bpo-fork
    title: 'Blob-parameter-only fork'
    oneLine: 'EIP-7892 config-only hardforks that change blob target, max and the fee update fraction, decoupled from named upgrades.'
    statement: >
      EIP-7892 defines blob-parameter-only forks: hardforks whose entire payload is a change to blob
      configuration — target, maximum, and the base-fee update fraction — scheduled independently of
      named upgrades like Fusaka. The point is cadence. Blob capacity can now be raised on the
      evidence of live telemetry rather than waiting for the next feature release, and it can be
      paused just as easily. Practically this means the current blob parameters are a moving value
      you look up, not a constant you learn.
    volatility: hot
    edges:
      - { to: blob-target-vs-max, type: requires }
    sources: [eip-7892, eip-8135, fusaka-mainnet-announcement]
    misconceptions:
      - belief: 'Blob target and max are set by the named hardfork.'
        reality: 'Since EIP-7892 they are changed by standalone BPO forks on their own cadence; Fusaka enabled the mechanism, and the BPO forks delivered the increases.'
        why: 'Every previous parameter change had arrived with a named upgrade.'
        source: eip-7892
  - id: peerdas-enables-more-blobs
    title: 'PeerDAS is what made more blobs safe'
    oneLine: 'Validators sample columns instead of downloading every blob, which is what makes raising the blob count safe without raising node bandwidth linearly.'
    statement: >
      PeerDAS splits each blob into columns and has validators custody and sample a subset rather
      than download every blob in full. Because a node's bandwidth requirement stops scaling
      linearly with the blob count, the network can carry far more blobs at the same hardware bar.
      Note the causal order: PeerDAS made more blobs safe to carry, the BPO forks then raised the
      count, and the increased supply is what moved the price. From the rollup's side nothing
      changed — a rollup still submits whole blobs.
    volatility: evolving
    edges:
      - { to: blob, type: requires }
      - { to: data-availability-sampling, type: requires }
      - { to: bpo-fork, type: applies }
    sources: [eip-7594, ethereum-org-fusaka]
    misconceptions:
      - belief: 'PeerDAS made blobs cheaper.'
        reality: 'PeerDAS made more blobs safe to carry. The BPO forks raised the count, and the extra supply lowered the price.'
        why: 'The enabling mechanism and its economic consequence get merged into one event.'
        source: eip-7892
      - belief: 'With PeerDAS a rollup posts columns instead of blobs.'
        reality: 'Column splitting happens on the consensus network. The rollup-side interface is unchanged; a batcher still submits whole blobs.'
        source: eip-7594
  - id: da-cost-no-longer-dominant
    title: 'Data stopped being the expensive part'
    oneLine: 'After 4844 and the blob capacity increases, L1 data is a minor line item for most rollups, so proving, operations and demand now dominate unit economics.'
    statement: >
      For most rollups the L1 data bill is no longer the dominant cost line it was in 2023. What
      dominates now depends on the chain: proving compute for validity rollups, node and RPC
      operations, and above all whether there is enough transaction demand to cover fixed costs.
      The practical consequence is that rollup economics diagrams built around data cost are
      misleading, and that a chain's differentiation has moved away from squeezing bytes. Avoid
      quoting specific per-transaction fee figures — they are volatile and were not verifiable.
    volatility: hot
    edges:
      - { to: blob-base-fee-floor, type: requires }
      - { to: l2-gross-vs-net-revenue, type: requires }
      - { to: proving-cost, type: deepens }
    sources: [optimism-fusaka-is-live]
    misconceptions:
      - belief: 'The L2 fee I pay is mostly the L1 data cost.'
        reality: 'Once blob capacity rose, the DA component became typically small; L2 fees are increasingly the operator''s execution charge and margin.'
        why: '2023-era rollup economics diagrams persist unchanged.'
        source: optimism-fusaka-is-live
