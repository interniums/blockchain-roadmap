moduleId: scaling-bridges
concepts:
  - id: native-bridge
    title: 'Native bridge'
    oneLine: 'The bridge built into the rollup itself, whose security is the rollup''s own proof system and L1 contracts.'
    statement: >
      A rollup's native bridge is part of the rollup: an L1 escrow plus the L2 counterpart, secured
      by the same contracts and the same proof system that secure the chain itself. Using it adds
      no trust assumption you were not already making by using the chain. That makes it the
      baseline every other bridge should be measured against, and the reason "which bridge" is
      really the question "what am I trusting on top of the rollup".
    volatility: stable
    edges:
      - { to: rollup, type: requires }
      - { to: cross-domain-messenger, type: deepens }
      - { to: third-party-bridge, type: contrasts }
    sources: [op-docs-smart-contracts, scroll-cross-domain-messaging]
  - id: cross-domain-messenger
    title: 'Cross-domain messenger'
    oneLine: 'The L1/L2 contract pair that carries arbitrary messages between the domains, with the token bridge built on top of it.'
    statement: >
      Underneath a rollup's token bridge sits a general message-passing layer — a matched pair of
      contracts, one on each side, that lets a call on one domain cause a call on the other. Token
      transfers are one application of it; arbitrary contract calls are another. Understanding the
      messenger rather than only the token bridge is what lets you see why deposits and withdrawals
      behave so differently and where an application-level bridge can go wrong.
    volatility: stable
    edges:
      - { to: native-bridge, type: requires }
      - { to: deposit-transaction, type: deepens }
    sources: [op-docs-smart-contracts, scroll-cross-domain-messaging]
  - id: deposit-is-fast-withdrawal-is-slow
    title: 'Deposits are fast, withdrawals are slow, by construction'
    oneLine: 'L1 to L2 is near-instant because the L2 only has to read L1; L2 to L1 is slow because L1 must be convinced the L2 state is correct.'
    statement: >
      The asymmetry is structural, not an implementation shortcoming. Going in, the L2 derives its
      state from L1 anyway, so a deposit is just another L1 event the L2 reads — it lands in
      minutes. Coming out, an L1 contract has to be convinced that the L2 state you are claiming
      against is correct, which means waiting for a challenge window or for a validity proof. The
      bridge is not slow; it is waiting for the chain's proof system, and no bridge can remove that
      wait without replacing it with a trust assumption.
    volatility: stable
    edges:
      - { to: cross-domain-messenger, type: requires }
      - { to: challenge-window, type: requires }
      - { to: liquidity-bridge, type: deepens }
    sources: [op-docs-smart-contracts, scroll-cross-domain-messaging]
    misconceptions:
      - belief: 'Bridging back to L1 is slow because the bridge is slow.'
        reality: 'It is slow because L1 has to become convinced the L2 state is correct — the challenge window or the proof. The bridge is just waiting.'
        why: 'Users blame the visible component.'
  - id: third-party-bridge
    title: 'Third-party bridge'
    oneLine: 'An independent protocol moving value between chains, adding its own validator set, oracle or solver network as a trust assumption.'
    statement: >
      A third-party bridge is a separate protocol with its own contracts, its own operators and its
      own security assumptions, sitting alongside chains that already have native bridges. It exists
      because native bridges are slow in one direction and because native bridges only connect a
      rollup to its own L1 — they cannot take you between two unrelated chains. Every third-party
      bridge is therefore the native path plus somebody new to trust, and the honest way to compare
      them is to name that somebody.
    volatility: evolving
    edges:
      - { to: native-bridge, type: requires }
      - { to: bridge-is-the-honeypot, type: deepens }
    sources: [ethereum-org-bridges, conduit-native-vs-third-party]
    misconceptions:
      - belief: 'The native bridge and the fast bridge give the same guarantees.'
        reality: 'The native bridge''s security is the rollup''s. A third-party bridge adds a solver, relayer or validator-set assumption and usually a separate contract holding pooled funds.'
        why: 'Both are one button in the same UI.'
        source: conduit-native-vs-third-party
  - id: lock-and-mint
    title: 'Lock and mint'
    oneLine: 'Lock the asset on the source chain, mint a representation on the destination; the minted token is only as good as the lock.'
    statement: >
      The classic bridge pattern escrows the real asset on the source chain and mints a wrapped
      representation on the destination, burning the wrapper to release the original later. The
      wrapper's value rests entirely on the escrow still being there and the minting authority
      still being honest. If either fails, the wrapper becomes an unbacked token while the original
      asset sits untouched somewhere else — which is exactly what happened in the largest bridge
      failures.
    volatility: stable
    edges:
      - { to: third-party-bridge, type: requires }
      - { to: bridge-is-the-honeypot, type: applies }
    sources: [scroll-cross-domain-messaging]
    misconceptions:
      - belief: 'Wrapped tokens from a bridge are the same asset.'
        reality: 'They are a claim on that specific bridge''s lock. If the bridge is drained the wrapper is worthless while the original asset is untouched.'
        why: 'Wallets display them under the same ticker.'
        source: wormhole-postmortem
  - id: liquidity-bridge
    title: 'Liquidity bridge'
    oneLine: 'A third-party bridge that fronts you funds on the destination immediately and claims the slow native withdrawal itself, selling you time for a fee.'
    statement: >
      A liquidity bridge does not make withdrawal faster; it buys the wait from you. Rather than
      minting a wrapper, it pays you on the destination chain out of capital already sitting there
      and settles with itself afterwards over the slow native path. Because the assets on both
      sides are real and the underlying chains verify their own transfers, this family is
      classified as locally verified and fast, and it does not by itself carry arbitrary messages.
      The fee is the price of the time plus the risk the operator now carries, and the trust you
      add is over the pool and whoever runs it.
    volatility: evolving
    edges:
      - { to: third-party-bridge, type: requires }
      - { to: deposit-is-fast-withdrawal-is-slow, type: requires }
      - { to: intent-bridge, type: deepens }
    sources: [ethereum-org-bridges, conduit-native-vs-third-party]
  - id: storage-proof-bridge
    title: 'Storage-proof bridge'
    oneLine: 'Prove a specific storage slot''s value on the source chain to the destination chain, removing the need for a trusted attester.'
    statement: >
      A storage-proof bridge replaces "an attester says this happened" with "here is a Merkle proof
      that this storage slot had this value under a block header the destination chain accepts".
      For state, that is a genuine reduction in trust: no committee has to be honest. In practice
      these designs are real but not dominant, and the ones that ship generally fall back to the
      native messenger when a proof is unavailable, which is the honest engineering answer.
    volatility: evolving
    edges:
      - { to: third-party-bridge, type: requires }
      - { to: storage-proof, type: requires }
      - { to: merkle-patricia-trie, type: requires }
      - { to: header-verification-problem, type: deepens }
    sources: [eip-1186, aligned-storage-proof-bridge]
  - id: header-verification-problem
    title: 'The header verification problem'
    oneLine: 'Storage proofs only shift the trust question to how the destination chain learns a real source-chain header.'
    statement: >
      A Merkle proof is only as good as the root it is checked against, so a storage-proof bridge
      must first convince the destination chain of a genuine source-chain block header. Every
      option carries its own assumption: an on-chain light client keeps the bridge trustless but
      constrains which chains it can connect and costs real gas to run, a validity proof of
      consensus adds proving infrastructure, and an external verifier set attesting to headers puts
      the trusted party back exactly where the storage proof removed it. The proof moves the
      question; it does not answer it.
    volatility: evolving
    edges:
      - { to: storage-proof-bridge, type: requires }
    sources: [ethereum-org-bridges, aligned-storage-proof-bridge]
    misconceptions:
      - belief: 'Storage-proof bridges are trustless.'
        reality: 'They are trust-minimised for state, but still need a trusted or proven source of source-chain headers.'
        why: 'The proof is the visible part and the header is not.'
        source: aligned-storage-proof-bridge
  - id: intent-bridge
    title: 'Intent bridge'
    oneLine: 'The user signs the outcome they want; a solver fronts their own liquidity on the destination and is reimbursed later through a settlement path.'
    statement: >
      With an intent, the user does not specify a route. They sign an order describing the outcome
      they want — this much of that asset on that chain — and a specialised actor called a solver
      or filler executes the steps required, is paid by a settlement process afterwards, and
      therefore fronts the capital in between. The standardisation effort around this model
      describes exactly that lifecycle: user expresses an intent, an application creates an order,
      the order reaches a feed, a solver evaluates and fills it, and settlement pays the solver.
      The risk did not vanish; it moved to solver liquidity concentration and to the settlement gap
      the solver is exposed during, which is its own research subject.
    volatility: evolving
    edges:
      - { to: liquidity-bridge, type: requires }
      - { to: mev-solver-competition, type: recommends }
      - { to: erc-7683, type: deepens }
    sources: [erc-7683, arxiv-intent-liquidity-exhaustion]
    misconceptions:
      - belief: 'Intents are safer because there is no honeypot contract.'
        reality: 'The risk moves to solver liquidity concentration and to delayed settlement; liquidity-exhaustion attacks on intent bridges are an active research topic.'
        why: 'The absence of a large pooled escrow is read as the absence of risk.'
        source: arxiv-intent-liquidity-exhaustion
      - belief: 'Bridging means lock-and-mint.'
        reality: 'Intent-based transfers — sign an order, a solver fills it, a slower path settles underneath — are now a distinct and widely implemented pattern alongside it.'
        why: 'Lock-and-mint was the only pattern for years.'
  - id: erc-7683
    title: 'ERC-7683'
    oneLine: 'The cross-chain intents ERC — now a solver-facing resolver interface rather than a common order struct, and still Draft.'
    statement: >
      ERC-7683 is a Standards Track ERC, status Draft, aimed at letting one solver serve many
      intent protocols. The current text does not standardise escrow, settlement or a fill
      function; it standardises only how an order is read. A protocol publishes orders as opaque
      payloads and supplies a resolver contract that a solver calls off-chain to obtain a common
      representation — a list of steps and variables it can evaluate for safety and profitability.
      An earlier draft did define order structs and settler interfaces, and the ERC's own rationale
      now says that standardisation was only superficial because the structs carried
      implementation-specific fields. Material describing ERC-7683 as a universal order struct is
      describing that superseded draft. Adoption percentages circulating for it trace to a single
      vendor source and should not be repeated.
    volatility: hot
    edges:
      - { to: intent-bridge, type: requires }
      - { to: abi-encoding, type: recommends }
    sources: [erc-7683]
    misconceptions:
      - belief: 'ERC-7683 is a finalised standard giving every intent protocol one common order struct.'
        reality: 'It is still Draft, and the current text deliberately standardises only the solver-facing resolver interface, leaving escrow, settlement and fill to each protocol.'
        why: 'The widely circulated explainers describe the earlier draft, which the ERC itself has since superseded.'
        source: erc-7683
  - id: bridge-is-the-honeypot
    title: 'A bridge is a honeypot by construction'
    oneLine: 'A bridge concentrates the value of everything that crossed it into one contract or key set, which is why bridges dominate the largest-exploit list.'
    statement: >
      Whatever pattern it uses, a bridge ends up holding the escrowed value of everything that ever
      crossed it, guarded by one contract and one key set. That structure means the payoff for
      breaking it grows with adoption while the number of things that must be defended does not.
      It is why bridges dominate the list of largest crypto exploits, and why the security question
      to ask about a bridge is never "is the code audited" but "how many keys, held by whom, guard
      how much".
    volatility: stable
    edges:
      - { to: third-party-bridge, type: requires }
      - { to: access-control-failure, type: recommends }
    sources: [ethereum-org-bridges, certik-bridge-exploits-2022, zealynx-bridge-checklist]
    misconceptions:
      - belief: 'Bridges get hacked because the cryptography is weak.'
        reality: 'The headline losses came from stolen keys, missing access control and verification code that did not verify — not from broken cryptography.'
        why: '"Bridge hack" sounds cryptographic.'
        source: certik-bridge-exploits-2022
  - id: signature-verification-failure
    title: 'Verification that does not verify'
    oneLine: 'The Wormhole class — the contract accepted a message without actually checking that the authorised signer set had signed it.'
    statement: >
      In this failure class the verification code runs, returns success, and checks nothing binding.
      Wormhole in February 2022, roughly $326M, is the canonical case: the Solana-side verifier was
      induced to read its signer set from an account the caller controlled, so a forged guardian
      signature verified against a forged guardian set. The general shape is any verifier whose
      trusted inputs — signer set, root, config — can be influenced by the caller. Bind them to
      immutable or storage the caller cannot reach.
    volatility: stable
    edges:
      - { to: bridge-is-the-honeypot, type: requires }
      - { to: key-compromise-failure, type: contrasts }
    claimKind: empirical
    sources: [wormhole-postmortem, certik-bridge-exploits-2022]
  - id: key-compromise-failure
    title: 'Key compromise'
    oneLine: 'The Ronin and Harmony class — the cryptography was fine and the operators'' private keys were stolen, usually socially.'
    statement: >
      Here nothing in the contract was wrong. Ronin in March 2022, roughly $625M, fell against a
      five-of-nine validator threshold that was never five independent signers: an advanced spear
      phishing campaign gave the attacker the four validators Sky Mavis ran, and the fifth signature
      came from the Axie DAO validator because a temporary permission for Sky Mavis to sign on its
      behalf had never been revoked. Harmony Horizon in June 2022, roughly $100M, fell when two of
      the five keys in a two-of-five multisig were compromised. The real security parameters in this
      class are threshold size, key custody diversity, and whether temporary operational changes to
      either get reverted. Treat approximate figures as approximate; sources differ on exact
      valuations and even on incident dates.
    volatility: stable
    edges:
      - { to: bridge-is-the-honeypot, type: requires }
      - { to: signature-verification-failure, type: contrasts }
    claimKind: empirical
    sources: [certik-bridge-exploits-2022, chainlink-bridge-vulns, sok-cross-chain-bridge-security]
    misconceptions:
      - belief: 'A multisig-secured bridge is decentralised.'
        reality: 'Ronin was five-of-nine and Harmony was two-of-five, and both fell to key compromise. Threshold size and custody diversity are the actual security parameters.'
        why: 'The word multisig implies distribution without saying how much.'
        source: certik-bridge-exploits-2022
      - belief: 'Reaching the threshold means compromising that many independent parties.'
        reality: 'On Ronin four of the five signatures came from one company, and the fifth was obtainable through a permission that company already held. The threshold counted signatures, not signers.'
        why: 'The threshold is a number in the contract; independence is a fact about the world outside it.'
        source: sok-cross-chain-bridge-security
  - id: initialisation-failure
    title: 'Initialisation failure'
    oneLine: 'The Nomad class — an upgrade left the trusted root at zero, so every message verified as pre-approved.'
    statement: >
      In August 2022 a Nomad upgrade set the trusted root to zero, which made every message
      validate as already proven; roughly $190M left in hours. The distinguishing feature was not
      sophistication but reproducibility: after the first transaction the exploit was
      copy-pasteable by anyone who changed the destination address, and hundreds of ordinary wallets
      joined in. The lesson generalises past bridges — a default or uninitialised value in a
      verification path is a live authorisation bypass, and post-upgrade state checks are the
      control that catches it.
    volatility: stable
    edges:
      - { to: bridge-is-the-honeypot, type: requires }
      - { to: access-control-failure, type: recommends }
    claimKind: empirical
    sources: [certik-bridge-exploits-2022, zealynx-bridge-checklist]
    misconceptions:
      - belief: 'Nomad was exploited by a sophisticated attacker.'
        reality: 'After the first transaction the exploit was copy-pasteable by anyone changing an address, and hundreds of ordinary wallets participated.'
        why: 'Large losses are assumed to require advanced capability.'
        source: certik-bridge-exploits-2022
