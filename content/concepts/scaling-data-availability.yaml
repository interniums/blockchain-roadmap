moduleId: scaling-data-availability
concepts:
  - id: data-availability
    title: 'Data availability'
    oneLine: 'The guarantee that the data behind a state commitment was actually published, so anyone can download it and recompute the state.'
    statement: >
      Data availability is the guarantee that, at the moment a state commitment was made, the data
      needed to reproduce that state was genuinely published to a network that will serve it. It is
      what makes independent verification possible: without the data, a state root is an assertion
      nobody outside the operator can check, and no user can construct the proof needed to withdraw.
      Availability is a property of publication at a point in time, and it is enforced by whichever
      consensus set is responsible for the data — not by the rollup.
    volatility: stable
    edges:
      - { to: rollup, type: requires }
      - { to: da-is-not-storage, type: deepens }
      - { to: data-availability-sampling, type: deepens }
    sources: [l2beat-glossary, celestia-da-101]
  - id: da-does-not-imply-correctness
    title: 'Availability and validity are orthogonal'
    oneLine: 'Publishing the data proves nothing about whether the state transition was valid; that is the proof system''s job.'
    statement: >
      Data availability and state validity are two independent guarantees provided by two different
      mechanisms. Availability means someone can check the work. Validity means the work was
      actually checked and was right. A chain can publish perfect data and still commit an invalid
      state if its proof system is broken or inactive; a chain can have flawless proofs and be
      unusable if its data is withheld. Assess them separately, and remember that a chain's real
      security is the weaker of the two.
    volatility: stable
    edges:
      - { to: data-availability, type: requires }
      - { to: validity-rollup, type: contrasts }
      - { to: optimistic-rollup, type: contrasts }
      - { to: security-is-the-weaker-link, type: deepens }
    sources: [l2beat-glossary]
    misconceptions:
      - belief: 'If the data is available, the state is correct.'
        reality: 'Availability lets someone check; proofs are what actually check. Neither substitutes for the other.'
        why: 'Both get filed under the single heading "rollup security".'
        source: l2beat-glossary
  - id: da-is-not-storage
    title: 'Availability is not storage'
    oneLine: 'DA is a statement about publication at the time of the block, not a promise that anyone will still serve you the bytes years later.'
    statement: >
      A data availability guarantee covers the moment of publication: the data went out, and enough
      of the network saw it that withholding was not possible. It does not commit anyone to keeping
      the data. Ethereum prunes blob sidecars after roughly eighteen days, deliberately chosen to
      outlast the challenge and proof windows rather than to serve as archival storage. Long-term
      access is a separate problem with a separate and weaker security argument.
    volatility: stable
    edges:
      - { to: data-availability, type: requires }
      - { to: retrievability, type: contrasts }
      - { to: ethereum-blob-da, type: applies }
    sources: [celestia-da-faq, eip-4844]
    misconceptions:
      - belief: 'Data availability means the data is stored forever.'
        reality: 'It means the data was published and verifiable at the time. Blobs are pruned after about eighteen days, and long-term access rests on someone choosing to archive.'
        why: '"Available" reads like "hosted".'
        source: celestia-da-faq
  - id: retrievability
    title: 'Retrievability'
    oneLine: 'The separate, weaker property that some node still has the historical data and will serve it, secured by a 1-of-N honest-archiver assumption.'
    statement: >
      Retrievability is the property that historical data can still be obtained after the
      availability window closes. It is not secured by consensus. It rests on at least one party
      among many — an archive node, an indexer, a rollup operator, a block explorer — having kept
      the data and being willing to serve it. That is a 1-of-N honest-archiver assumption, which is
      a reasonable bet in practice and a materially different guarantee from the one consensus
      provides during the availability window.
    volatility: stable
    edges:
      - { to: da-is-not-storage, type: requires }
    sources: [celestia-da-faq, da-retrievability-faq]
  - id: ethereum-blob-da
    title: 'Ethereum blob DA'
    oneLine: 'Ethereum''s native data availability — blobs carried by consensus, verified by validators, pruned after about eighteen days.'
    statement: >
      Ethereum's native DA is the blob: data carried alongside a block, propagated and attested by
      the consensus layer, referenced on-chain only by a versioned hash of its KZG commitment, and
      pruned after roughly eighteen days. A rollup that posts its batches to blobs gets availability
      backed by Ethereum's own validator set, with no additional trust assumption and no additional
      bridge. That is the property that makes a chain a rollup under L2BEAT's definition.
    volatility: evolving
    edges:
      - { to: blob, type: requires }
      - { to: data-availability, type: requires }
      - { to: versioned-hash, type: requires }
      - { to: alt-da, type: contrasts }
    sources: [eip-4844, l2beat-da-scaling]
  - id: erasure-coding-for-da
    title: 'Erasure coding for DA'
    oneLine: 'Data is expanded with redundancy so any sufficiently large subset reconstructs the whole, which is what makes random sampling meaningful.'
    statement: >
      Before it is sampled, block data is erasure-coded: expanded with redundancy so that any
      sufficiently large subset of the pieces reconstructs the original. This is what gives
      sampling its power. To hide any part of the data, a withholder must now suppress enough
      pieces that reconstruction becomes impossible, and suppressing that many pieces means a
      randomly sampling node will almost certainly ask for one of them and be refused. Without
      erasure coding, a withholder could hide a single small piece and pass nearly every sample.
    volatility: stable
    edges:
      - { to: data-availability-sampling, type: requires }
      - { to: data-availability, type: requires }
    sources: [celestia-da-101, eip-7594]
    misconceptions:
      - belief: 'Data availability sampling means every light node has the data.'
        reality: 'Sampling proves the data could be reconstructed by the network as a whole. No individual sampler holds it.'
        why: 'Sampling gets read as a small download rather than as a statistical test.'
        source: celestia-da-101
  - id: alt-da
    title: 'Alternative DA'
    oneLine: 'Posting rollup data to an external DA network instead of Ethereum, trading cost for an added trust assumption.'
    statement: >
      Alternative DA means publishing a chain's data to a network other than Ethereum — Celestia,
      EigenDA and Avail are the main options — and having the chain's L1 contracts accept an
      attestation that it was published. The saving is real and so is the added assumption: the
      chain's availability now depends on that network's validator set or committee rather than on
      Ethereum's. The three options differ mainly in the shape of that trust, not in throughput,
      and that is the axis worth comparing them on.
    volatility: evolving
    edges:
      - { to: data-availability, type: requires }
      - { to: ethereum-blob-da, type: contrasts }
      - { to: da-bridge, type: deepens }
    sources: [l2beat-da-summary, altlayer-celestia-da]
    misconceptions:
      - belief: 'DA layers are interchangeable, so pick on price.'
        reality: 'L2BEAT classifies them by bridge risk — whether an L1 contract can verify the attestation at all — and that difference dominates price.'
        why: 'DA is presented as a commodity input.'
        source: l2beat-da-summary
  - id: rollup-vs-validium
    title: 'Rollup, validium, optimium'
    oneLine: 'If the data lives on a permissionless L1 it is a rollup; if it lives anywhere else it is a validium (with validity proofs) or an optimium (with fraud proofs).'
    statement: >
      The label follows one question: where does the data go. Data on a permissionless L1 makes the
      chain a rollup. Data anywhere else makes it a validium if it uses validity proofs, or an
      optimium if it uses fraud proofs. This is L2BEAT's taxonomy and it is deliberately about
      availability rather than proof type, because withholding is a qualitatively different failure
      from an invalid state. Since the OP Stack ships an alt-DA mode, whether a given chain is a
      rollup is now a per-deployment configuration question, not a property of the stack it runs.
    volatility: evolving
    edges:
      - { to: alt-da, type: requires }
      - { to: ethereum-blob-da, type: requires }
      - { to: rollup, type: contrasts }
      - { to: configurability-is-not-freedom, type: applies }
    sources: [l2beat-glossary, l2beat-da-scaling]
    misconceptions:
      - belief: 'A validium is just a cheaper rollup.'
        reality: 'L2BEAT will not call it a rollup, and its withholding failure mode is qualitatively different from anything a rollup can suffer.'
        why: 'The cost difference is visible and the failure mode is not.'
        source: l2beat-glossary
  - id: data-availability-committee
    title: 'Data availability committee'
    oneLine: 'A fixed member set that signs "we have the data", with an on-chain verifier checking a signature threshold.'
    statement: >
      A DAC is a named, fixed set of members who sign attestations that they hold a chain's data.
      An L1 contract checks that some threshold of those signatures is present before accepting the
      corresponding state commitment. The security of the arrangement is exactly the honesty and
      independence of that committee: if enough members collude or are compromised, they can attest
      to data that was never published, and the chain's contracts will accept it. Committee size,
      threshold and custody diversity are the parameters that matter.
    volatility: stable
    edges:
      - { to: alt-da, type: requires }
      - { to: validium-withholding-risk, type: applies }
    sources: [l2beat-glossary, l2beat-da-summary]
  - id: da-bridge
    title: 'DA bridge'
    oneLine: 'The L1 contract that attests an external DA layer''s data was published; without one, the rollup''s L1 contracts are trusting an off-chain claim outright.'
    statement: >
      A DA bridge is an L1 contract that verifies an external DA layer's claim that data was
      published — checking a committee threshold, a light-client header, or a proof. Its presence
      or absence is the sharpest distinction between alt-DA setups: with a bridge, the L1 contracts
      can at least reject an unattested commitment; without one, they accept the operator's word.
      L2BEAT classifies DA layers by exactly this, which is why the same DA network appears twice
      in its listings, once with a bridge and once without.
    volatility: evolving
    edges:
      - { to: alt-da, type: requires }
      - { to: data-availability-committee, type: contrasts }
    sources: [l2beat-celestia-no-bridge, l2beat-da-summary]
  - id: validium-withholding-risk
    title: 'Data withholding'
    oneLine: 'With a valid proof but withheld data, the state is provably correct and nobody can compute their balance to construct a withdrawal.'
    statement: >
      In a data withholding attack the operator produces valid proofs and simply does not publish
      the data behind them. Every state transition verifies. Nothing on L1 looks wrong. But no user
      can reconstruct the current state, so no user can build the Merkle proof a withdrawal
      requires, and no one can demonstrate misbehaviour to an L1 contract because none of the rules
      were broken. Funds are frozen by an action that is provably not a protocol violation, which
      is why withholding has no equivalent in a rollup.
    volatility: stable
    edges:
      - { to: rollup-vs-validium, type: requires }
      - { to: escape-hatch, type: requires }
      - { to: data-availability-committee, type: applies }
    sources: [l2beat-glossary, celestia-da-faq]
    misconceptions:
      - belief: 'A validium with ZK proofs is safer than an optimistic rollup, because it has real proofs.'
        reality: 'If the validium''s data is withheld the proof is still valid and your funds are still unreachable, because you cannot construct the withdrawal without the state.'
        why: 'Proof type is taught as the security axis, so the DA axis goes unexamined.'
        source: l2beat-glossary
  - id: security-is-the-weaker-link
    title: 'Security is the weaker link'
    oneLine: 'A chain''s real security is the minimum of its proof system and its DA layer, not the maximum.'
    statement: >
      Proof strength and data availability are both necessary and neither is sufficient. A chain's
      operational security is the weaker of the two, because an attacker only needs one of them to
      fail. A validity proof over withheld data buys nothing you can use; perfect availability under
      a broken or inactive proof system buys nothing either. When a chain markets one of the two
      loudly, that is a prompt to go and check the other.
    volatility: stable
    edges:
      - { to: validium-withholding-risk, type: requires }
      - { to: proofs-do-not-imply-trustless, type: requires }
      - { to: proof-type-is-not-trust-level, type: deepens }
    sources: [l2beat-glossary, l2beat-da-scaling]
    misconceptions:
      - belief: 'Using Celestia, EigenDA or Avail means the chain is still secured by Ethereum.'
        reality: 'Security becomes the weaker of the proof system and the DA layer, and L2BEAT stops calling such a chain a rollup.'
        why: 'Marketing describes these setups as "Ethereum-aligned".'
        source: l2beat-da-scaling
