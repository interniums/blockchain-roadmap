moduleId: scaling-forced-inclusion
concepts:
  - id: delayed-inbox
    title: 'Delayed inbox'
    oneLine: 'The L1 contract queue that forced transactions land in, which the sequencer is supposed to drain.'
    statement: >
      The delayed inbox is an L1 contract that anyone can push an L2 message into. In normal
      operation the sequencer reads it and folds the messages into its ordering, so the queue is
      just another input. The escape hatch is what happens when it does not: after a
      protocol-defined delay, the messages sitting in the queue can be pushed into the canonical L2
      ordering by anyone. Submitting to the inbox is therefore always available; completing the
      inclusion is what the delay gates.
    volatility: stable
    edges:
      - { to: forced-inclusion, type: requires }
      - { to: force-include-call, type: deepens }
      - { to: deposit-transaction, type: contrasts }
    sources: [arbitrum-sequencer, arbitrum-tx-lifecycle-deep-dive]
  - id: force-include-call
    title: 'The force-include call'
    oneLine: 'The permissionless L1 function anyone can call, after the delay elapses, to push queued messages into the canonical L2 ordering.'
    statement: >
      Once the delay has elapsed, a permissionless function on the L1 sequencer inbox contract
      moves queued messages into the canonical L2 ordering. Anyone can call it — it does not have
      to be the person whose transaction is queued — and the L2's derivation rules then treat those
      messages as part of the chain. This is the moment the escape hatch becomes real rather than
      theoretical, and it is the call your incident runbook needs by name and address.
    volatility: stable
    edges:
      - { to: delayed-inbox, type: requires }
      - { to: forced-inclusion-is-not-forced-execution, type: deepens }
    sources: [arbitrum-sequencer, arbitrum-nitro-whitepaper]
  - id: force-inclusion-delay
    title: 'The force-inclusion delay'
    oneLine: 'The deliberate waiting period before forcing works, so the sequencer can order normally and L1 reorgs cannot rewrite L2 history.'
    statement: >
      The delay before forcing becomes possible is a safety parameter, not an implementation limit.
      It gives the sequencer room to order normally rather than having every user race it to the
      inbox, and it keeps a shallow L1 reorg from rewriting L2 history by ensuring forced messages
      are drawn from L1 blocks that are settled. On Arbitrum the threshold is the lesser of
      delayBlocks and delayBuffer; the documented default for delayBlocks is 24 hours and
      delayBuffer is configurable in a range of roughly 30 minutes to 48 hours. These are per-chain
      configuration values, so read them from the SequencerInbox contract rather than from a doc.
    volatility: evolving
    edges:
      - { to: force-include-call, type: requires }
      - { to: reorg, type: requires }
    sources: [arbitrum-chain-finality, arbitrum-sequencer]
    misconceptions:
      - belief: 'The delay exists because forced inclusion is technically hard.'
        reality: 'It exists so normal sequencing works and so L1 reorgs cannot rewrite L2 history. It is a safety parameter.'
        source: arbitrum-chain-finality
      - belief: 'All Arbitrum-family chains have a 24-hour force window.'
        reality: 'It is configured per chain via delayBlocks and delayBuffer. Orbit chains set their own; read the value from the contract.'
        source: arbitrum-chain-finality
  - id: censorship-timeout
    title: 'Censorship timeout'
    oneLine: 'Adaptive shortening of the force-inclusion threshold when the sequencer appears to be delaying or censoring.'
    statement: >
      A censorship timeout makes the escape hatch faster exactly when it is needed. Rather than a
      single fixed delay, the chain tracks whether the sequencer is behaving as expected and
      shortens the effective force-inclusion threshold when its behaviour looks like delay or
      outage. The design point is that a fixed 24-hour delay is a reasonable price for orderly
      operation and an unreasonable one during an incident. This adaptive shortening, rather than a
      lower fixed number, has been the notable recent movement in escape hatch design.
    volatility: evolving
    edges:
      - { to: force-inclusion-delay, type: requires }
    sources: [arbitrum-chain-finality]
  - id: sequencing-window
    title: 'Sequencing window'
    oneLine: 'The OP Stack''s version — L1 blocks older than the window must be derived into L2 blocks, so a deposit appears on L2 within the window even with the sequencer dead.'
    statement: >
      Instead of a queue with a force-include call, the OP Stack makes forcing a consequence of its
      derivation rules. Any L1 block older than the sequencing window must be derived into L2
      blocks, so a deposit placed on L1 is guaranteed to appear on L2 within that window whatever
      the sequencer does. Past the window, honest nodes deterministically produce blocks containing
      only the forced transactions. The documented value is 12 hours; it is a chain configuration
      and worth re-checking against the current contract release.
    volatility: evolving
    edges:
      - { to: forced-inclusion, type: requires }
      - { to: derivation, type: recommends }
      - { to: delayed-inbox, type: contrasts }
    sources: [op-docs-forced-transaction, op-specs-protocol-overview]
  - id: sequencer-failure-severity
    title: 'Sequencer failure severity'
    oneLine: 'L2BEAT''s three-level rating — self-sequence, enqueue-via-L1, or no mechanism at all.'
    statement: >
      L2BEAT grades what a user can do when the sequencer stops or censors, in three levels. Self
      sequence means you can complete inclusion yourself from L1. Enqueue via L1 means you can
      submit a message but cannot complete the inclusion without the operator. No mechanism means
      you are stuck. Only the first is an escape hatch in any useful sense, and coverage across the
      long tail of chains is very uneven, so the rating has to be read per chain rather than assumed
      from the stack it runs.
    volatility: hot
    edges:
      - { to: forced-inclusion, type: requires }
      - { to: proposer-failure, type: contrasts }
    sources: [l2beat-arbitrum-project, l2beat-stages]
    misconceptions:
      - belief: 'Every rollup has an escape hatch.'
        reality: 'Having a delayed inbox is not the same as having a path a user can complete alone; plenty of smaller chains sit in the weaker two categories.'
        why: 'The mechanism is described as a property of rollups in general rather than as a per-chain configuration.'
        source: l2beat-arbitrum-project
  - id: proposer-failure
    title: 'Proposer failure'
    oneLine: 'Even with your transaction included, if only whitelisted proposers can post state roots and they stop, withdrawals freeze.'
    statement: >
      Withdrawing from an L2 needs a state root on L1 to prove against. On many chains only
      whitelisted proposers may post those roots. If they stop — through outage, coercion or
      choice — no new state root appears, no withdrawal can be proved, and forced inclusion does
      nothing about it, because the problem is downstream of ordering. This is a second, independent
      chokepoint that most curricula ignore entirely, and it is common enough across analysed L2
      projects that you have to check it per chain rather than assume it is handled.
    volatility: hot
    edges:
      - { to: forced-inclusion, type: requires }
      - { to: batch-vs-state-commitment, type: requires }
      - { to: sequencer-failure-severity, type: contrasts }
    sources: [l2beat-arbitrum-project, arxiv-l2-ethical-risk]
    misconceptions:
      - belief: 'The escape hatch means my funds are always recoverable.'
        reality: 'Withdrawals also need a state root posted by a proposer. If proposing is whitelisted and the proposer stops, withdrawals freeze regardless of inclusion.'
        why: 'Sequencer failure and proposer failure are taught as one risk.'
        source: l2beat-arbitrum-project
  - id: forced-inclusion-is-not-forced-execution
    title: 'Inclusion is not the outcome you wanted'
    oneLine: 'Getting your transaction ordered does not guarantee it succeeds; the state it lands in may have already moved against you.'
    statement: >
      Forced inclusion guarantees ordering and nothing more. Your transaction executes against
      whatever state exists when it lands, which after a delay measured in hours may be a very
      different state: a position liquidated, a price moved, an allowance revoked, a pool drained.
      It can also simply revert. When you design around the escape hatch, design for the outcome
      you can still get after the delay, not the outcome you wanted when you queued.
    volatility: stable
    edges:
      - { to: force-include-call, type: requires }
      - { to: force-inclusion-delay, type: requires }
    sources: [arbitrum-sequencer]
    misconceptions:
      - belief: 'Forced inclusion means my transaction succeeds.'
        reality: 'It means your transaction gets ordered. It can still revert, and by then a liquidation or price move may have happened.'
        why: 'Inclusion and execution outcome get conflated.'
  - id: exit-window
    title: 'Exit window'
    oneLine: 'The time between an upgrade being announced and taking effect — the only period in which you can leave before a hostile upgrade lands.'
    statement: >
      An exit window is the delay a chain imposes between announcing a contract upgrade and
      executing it. It is the only mechanism that lets a user who dislikes an upgrade withdraw
      before it takes effect, and to be usable it must be longer than the chain's full withdrawal
      path — inclusion delay plus proposing plus challenge window or proving. Instantly upgradeable
      contracts have an exit window of zero, which means the escape hatch offers no protection at
      all against the upgrade key.
    volatility: hot
    edges:
      - { to: upgrade-key-risk, type: requires }
      - { to: escape-hatch, type: requires }
    sources: [l2beat-arbitrum-project, l2beat-stages]
    misconceptions:
      - belief: 'The escape hatch protects me from a bad upgrade.'
        reality: 'Only if the exit window is longer than zero and longer than your withdrawal path. Instantly upgradeable contracts mean an upgrade can land before you can leave.'
        source: l2beat-stages
  - id: walkaway-test
    title: 'The walkaway test'
    oneLine: 'Can users exit if the operators are malicious and the Security Council vanishes? Passing this is what "escapable" actually means.'
    statement: >
      The walkaway test asks one question about a chain: assume the operators are actively hostile
      and every emergency body has disappeared — can a user still get their assets out using only
      L1 contracts and their own key? Answering it forces you through every chokepoint in order,
      and it is the framing that turns a list of features into a verdict. A chain passes only if
      inclusion, proposing, proving and claiming can all be driven by the user.
    volatility: evolving
    edges:
      - { to: exit-window, type: requires }
      - { to: forced-inclusion, type: requires }
      - { to: proposer-failure, type: requires }
      - { to: l2beat-stage-2, type: applies }
    sources: [l2beat-stages, l2beat-stages-intro]
  - id: escape-hatch-requires-l1-liveness
    title: 'The escape hatch needs L1 exactly when L1 is busiest'
    oneLine: 'Every escape path costs L1 gas and needs L1 inclusion, so it is least usable during the congestion a mass exit would itself cause.'
    statement: >
      Every step of an escape — queueing the message on L1, forcing inclusion, proving the
      withdrawal, claiming it — is an L1 transaction that must be included in an L1 block and paid
      for in L1 gas. That is not incidental; it is how the mechanism gets its guarantee. But it
      means the escape path is priced by Ethereum's fee market, whose base fee rises with sustained
      demand by design. The mechanism reads as designed for one user being censored while the rest
      of the world is calm; the scenario people actually fear is everyone trying at once, when the
      base fee is highest and a small position is worth less than the gas to rescue it. Model the
      congested case explicitly, because nobody designs for it by default.
    volatility: stable
    edges:
      - { to: forced-inclusion, type: requires }
      - { to: walkaway-test, type: deepens }
    sources: [op-docs-forced-transaction, eip-1559, arbitrum-sequencer]
    misconceptions:
      - belief: 'An escape hatch is useful in a crisis.'
        reality: 'It requires L1 gas and L1 inclusion at exactly the moment everyone else is trying the same thing; it is designed for individual censorship, not a bank run.'
        why: 'Nobody models the congested case.'
