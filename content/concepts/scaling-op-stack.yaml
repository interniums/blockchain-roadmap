moduleId: scaling-op-stack
concepts:
  - id: op-stack
    title: 'OP Stack'
    oneLine: 'A modular open-source rollup codebase — execution client, derivation client, batcher, proposer, challenger, L1 contracts — that many chains run as their own L2.'
    statement: >
      The OP Stack is the open-source implementation of an optimistic rollup: an execution client,
      a derivation client, a batcher, a proposer, a challenger, and a set of L1 contracts. Running
      a chain means running all of those, not just deploying the contracts. Because the components
      are modular, choices like where data goes and which dispute game is respected are per-chain
      configuration, which is why two chains on the same stack can have materially different
      security properties.
    volatility: evolving
    edges:
      - { to: rollup, type: requires }
      - { to: two-client-node, type: deepens }
    sources: [op-specs-protocol-overview, op-docs-superchain-explainer]
    misconceptions:
      - belief: 'Launching an OP Stack chain gives you Ethereum''s security automatically.'
        reality: 'It gives you the codebase. Permissionless fault proofs, a challenger actually running, non-custodial upgrade keys and Ethereum DA are all per-deployment choices.'
        why: 'The stack''s reputation is inherited by every chain that runs it.'
        source: op-docs-standard-configuration
  - id: two-client-node
    title: 'A node is two processes'
    oneLine: 'An execution client that builds and executes blocks, and a consensus client that decides what those blocks must contain.'
    statement: >
      An OP Stack node is a pair of processes. The execution client, op-geth, is a modified
      Ethereum client that executes transactions and maintains state. The consensus client,
      op-node, decides what blocks must contain by reading L1 and driving the execution client
      through the engine API. The naming misleads: op-node runs no consensus with other L2 nodes.
      It is a derivation engine, and it is the component that makes the chain reproducible by
      anyone.
    volatility: evolving
    edges:
      - { to: op-stack, type: requires }
      - { to: derivation, type: deepens }
    sources: [op-specs-protocol-overview, optimism-releases]
  - id: derivation
    title: 'Derivation'
    oneLine: 'L2 blocks are a deterministic function of L1 data — given L1, every honest node computes the identical L2 chain.'
    statement: >
      Derivation is the rule that the L2 chain is a deterministic function of data already on L1:
      batches, deposits and L1 block metadata in, a unique sequence of L2 blocks out. Two honest
      nodes given the same L1 produce byte-identical L2 chains, so there is nothing for L2 nodes to
      agree on and no consensus protocol among them. This is the single idea the rest of the stack
      hangs off, including forced inclusion, block labels, and the ability to rebuild the chain
      from scratch.
    volatility: stable
    edges:
      - { to: two-client-node, type: requires }
      - { to: derivation-is-the-security-model, type: deepens }
      - { to: sequencing-window, type: applies }
    sources: [op-specs-protocol-overview]
    misconceptions:
      - belief: 'L2 nodes reach consensus with each other.'
        reality: 'OP Stack L2 nodes run no consensus among themselves. The chain is derived deterministically from L1 data, which is why one honest sequencer output is enough.'
        why: 'The component is called a consensus client.'
        source: op-specs-protocol-overview
  - id: derivation-is-the-security-model
    title: 'Derivation is the security model'
    oneLine: 'Because L2 state is derived from L1, a node needs no trust in the sequencer for history; the sequencer only decides what enters L1 in the first place.'
    statement: >
      Once data is on L1, the sequencer has no further influence over the chain: anyone can derive
      the same L2 history without asking it anything. The sequencer's power is entirely upstream —
      choosing what gets into the batch and in what order — which is precisely the power that
      forced inclusion constrains. This is why the honest framing of sequencer risk is ordering
      and liveness rather than custody, and why a dead sequencer threatens new blocks rather than
      old ones.
    volatility: stable
    edges:
      - { to: derivation, type: requires }
      - { to: soft-confirmation, type: requires }
      - { to: sequencer-worst-case-is-bounded, type: deepens }
    sources: [op-specs-protocol-overview]
    misconceptions:
      - belief: 'If the sequencer disappears, the chain''s history is at risk.'
        reality: 'History is reconstructible from L1 by anyone running op-node. What is at risk is new block production.'
        source: op-specs-protocol-overview
  - id: unsafe-safe-finalized
    title: 'Unsafe, safe, finalized'
    oneLine: 'The three OP Stack block labels — from the sequencer''s gossip, derived from posted L1 data, and derived from L1 data that is itself finalised.'
    statement: >
      An OP Stack chain exposes three heads. Unsafe blocks come from the sequencer's gossip and
      have no L1 backing. Safe blocks have been derived from batch data that is now on L1. Finalized
      blocks were derived from L1 data that is itself finalised under Ethereum consensus. The gaps
      between them are the chain's real trust gradient: a shallow L1 reorg can un-safe a block that
      is not yet finalized, so a product that treats safe as final has accepted a reorg risk it
      probably has not priced.
    volatility: stable
    edges:
      - { to: derivation, type: requires }
      - { to: hard-finality, type: requires }
      - { to: reorg, type: recommends }
    sources: [op-specs-protocol-overview, optimism-releases]
    misconceptions:
      - belief: 'Safe and finalized mean the same thing on an L2.'
        reality: 'Safe means derived from posted L1 data; finalized means that L1 data is itself finalised. A shallow L1 reorg can un-safe a block that is not yet finalized.'
        why: 'Ethereum''s own labels get borrowed without their L2 meaning.'
  - id: deposit-transaction
    title: 'Deposit transaction'
    oneLine: 'A transaction created by derivation from an L1 event rather than submitted to L2 — the mechanism behind both L1 to L2 messaging and forced inclusion.'
    statement: >
      A deposit transaction is not submitted to the L2 at all. It is emitted by an L1 contract as
      an event, and the derivation pipeline turns that event into a transaction in a specific L2
      block. Because inclusion is a consequence of derivation rather than a decision by the
      sequencer, deposits arrive whether or not the sequencer cooperates. The same mechanism carries
      ordinary L1 to L2 messages and carries forced transactions, which is why the two look so
      similar on this stack.
    volatility: stable
    edges:
      - { to: derivation, type: requires }
      - { to: forced-inclusion, type: requires }
      - { to: cross-domain-messenger, type: applies }
    sources: [op-specs-protocol-overview, op-docs-forced-transaction]
  - id: superchain
    title: 'Superchain'
    oneLine: 'A set of OP Stack chains sharing a governance-approved contract release, a standard configuration, and eventually a common interop mesh.'
    statement: >
      The Superchain is a set of OP Stack chains that share a governance-approved contract release,
      a standard configuration, and a common upgrade process — with native cross-chain messaging as
      the intended future addition. What it shares today is contracts, standards and governance.
      What it does not share today is sequencing: shared sequencing remains a plan pointed at an
      external network, not a shipped fact.
    volatility: hot
    edges:
      - { to: op-stack, type: requires }
      - { to: standard-rollup-charter, type: deepens }
      - { to: shared-sequencer, type: contrasts }
    sources: [op-docs-superchain-explainer]
    misconceptions:
      - belief: 'The Superchain is a shared sequencer.'
        reality: 'It currently shares contracts, standards, governance and — in development — messaging. Shared sequencing is a plan, not a shipped feature.'
        why: '"Superchain" sounds like a single chain with one ordering.'
        source: op-docs-superchain-explainer
  - id: standard-rollup-charter
    title: 'Standard Rollup Charter'
    oneLine: 'The configuration and contract-release requirements a chain must meet to be classified as a Standard Rollup in the Superchain Registry.'
    statement: >
      The Standard Rollup Charter is the concrete checklist behind the word "standard": which
      contract release the chain runs, which parameters it may and may not deviate on, how upgrades
      are governed, and what its proof configuration must be. Meeting it is what earns
      superchain_level 2 in the registry. It is the closest thing the ecosystem has to a written
      definition of a conforming OP Stack chain, which makes it the right artefact to check a real
      chain against rather than trusting a badge.
    volatility: hot
    edges:
      - { to: superchain, type: requires }
      - { to: l2beat-stage-1, type: recommends }
    sources: [op-docs-standard-configuration]
  - id: superchain-registry
    title: 'Superchain Registry'
    oneLine: 'The public index that is the source of truth for which chains are in the Superchain and whether each is standard.'
    statement: >
      The Superchain Registry is a public repository listing member chains along with their
      configuration — superchain_level, data availability setting, gas token and contract
      addresses. Any OP Stack chain may join at a lower level; only superchain_level 2 attests to
      the Standard Rollup Charter. Registry membership is therefore an index entry, not a security
      claim, and reading the raw data is a better guide to what a chain is than any summary of it.
    volatility: hot
    edges:
      - { to: standard-rollup-charter, type: requires }
    sources: [op-docs-superchain-registry, superchain-registry-repo]
    misconceptions:
      - belief: 'Being in the Superchain Registry means a chain is secure or standard.'
        reality: 'Any OP Stack chain may join. Only superchain_level 2 attests to the Standard Rollup Charter.'
        source: superchain-registry-repo
  - id: op-deployer
    title: 'op-deployer'
    oneLine: 'The mandated deployment tool — since 1 March 2025 a chain must be deployed with it to be added to the registry as standard.'
    statement: >
      op-deployer is the supported way to deploy an OP Stack chain's L1 contracts, and since
      1 March 2025 it is mandatory for standard status: hand-rolled deployments are no longer
      eligible. The reason is reproducibility. A deployment produced by a known tool from a known
      release can be checked against the charter mechanically, whereas a bespoke script cannot be
      distinguished from a subtly non-standard one.
    volatility: evolving
    edges:
      - { to: superchain-registry, type: requires }
      - { to: op-contracts-manager, type: deepens }
    sources: [op-docs-deploy-contracts]
  - id: op-contracts-manager
    title: 'OP Contracts Manager'
    oneLine: 'The contract that deploys and upgrades an OP Stack chain''s L1 contract set as a versioned unit.'
    statement: >
      The OP Contracts Manager deploys and upgrades a chain's whole L1 contract set as one
      versioned release rather than contract by contract. This is how "governance-approved release"
      becomes mechanically enforceable: a chain is on a version, upgrades move it to another
      version, and partial or bespoke upgrades are visible as deviations. It also means adopting a
      release is a scheduled operational event with its own review, not an ad-hoc deployment.
    volatility: evolving
    edges:
      - { to: op-deployer, type: requires }
      - { to: upgrade-key-risk, type: applies }
    sources: [op-specs-op-contracts-manager, optimism-releases]
  - id: configurability-is-not-freedom
    title: 'Every option costs you a classification'
    oneLine: 'An OP Stack chain can enable alt-DA, a custom gas token or L3 mode, but each choice can move it out of standard and change its L2BEAT classification.'
    statement: >
      The stack's configurability is real and every knob has a consequence beyond the technical
      one. Choosing alt-DA can make the chain an optimium rather than a rollup. A custom gas token
      or an L3 deployment can put it outside the Standard Rollup Charter. Keeping challenger
      whitelisting can keep it below Stage 1. None of these are refused by the tooling; they are
      simply reflected in what the chain is afterwards, which is why the deployment decision and
      the classification decision are the same decision.
    volatility: evolving
    edges:
      - { to: standard-rollup-charter, type: requires }
      - { to: alt-da, type: requires }
      - { to: rollup-vs-validium, type: requires }
      - { to: permissionless-challenging, type: recommends }
    sources: [op-docs-standard-configuration, op-docs-configure-challenger]
    misconceptions:
      - belief: 'Every OP Stack chain is a rollup.'
        reality: 'The deployer supports alt-DA and custom gas tokens; such a chain may be an optimium, and L2BEAT will classify it accordingly.'
        source: op-docs-standard-configuration
      - belief: 'Deploying an OP Stack chain is a weekend project.'
        reality: 'Deploying the contracts is scriptable. Running a batcher, proposer, challenger, RPC fleet, monitoring and an upgrade process is an ongoing operations commitment, which is why rollup-as-a-service providers exist.'
        source: op-docs-configure-challenger
  - id: superchain-interop
    title: 'Superchain interop'
    oneLine: 'Native cross-chain messaging where an initiating log on the source chain is consumed by an executing message on the destination.'
    statement: >
      Superchain interop carries messages between member chains without a third-party bridge: an
      initiating message is emitted as a log on the source chain, and an executing message on the
      destination consumes it. The safety rule is that a destination chain may not advance past an
      executing message until the corresponding initiating message has been reproduced from the
      source chain's own data. As of the research window this is in active development and
      available for testing, not a universally live mainnet feature.
    volatility: hot
    edges:
      - { to: derivation, type: requires }
      - { to: cross-domain-messenger, type: requires }
      - { to: dependency-set, type: deepens }
    sources: [op-specs-interop-overview, op-docs-interop-explainer]
    misconceptions:
      - belief: 'Superchain interop means tokens move instantly and trustlessly between OP chains today.'
        reality: 'It is in active development and available for testing, and the design requires the destination to reproduce the initiating message from the source before advancing.'
        source: op-docs-interop-explainer
  - id: dependency-set
    title: 'Dependency set'
    oneLine: 'The set of chains whose messages a given chain will accept; in the Superchain design a fully connected mesh.'
    statement: >
      A chain's dependency set is the list of chains whose initiating messages it is willing to
      execute. It is a security boundary: accepting a chain's messages means accepting its
      derivation and its failure modes as inputs to your own chain's validity. The Superchain design
      points at a fully connected mesh so any member can message any other, which maximises utility
      and also means the set of things your chain depends on is the whole membership.
    volatility: hot
    edges:
      - { to: superchain-interop, type: requires }
      - { to: security-is-the-weaker-link, type: applies }
    sources: [op-specs-interop-overview]
  - id: op-supernode
    title: 'op-supernode'
    oneLine: 'A node that runs every chain in a dependency set in one process with a shared L1 and beacon client, because following N chains separately is prohibitively expensive.'
    statement: >
      Verifying executing messages requires actually following every chain in the dependency set,
      and running N independent node stacks with N L1 clients does not scale. op-supernode runs the
      whole set in one process against a shared L1 and beacon client. Its existence is the honest
      measure of what a fully connected interop mesh costs to verify: the mesh is cheap to use and
      expensive to check, and the software exists because somebody has to check it.
    volatility: hot
    edges:
      - { to: dependency-set, type: requires }
    sources: [op-docs-interop-explainer]
