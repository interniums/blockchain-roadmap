moduleId: scaling-proof-systems
concepts:
  - id: fraud-proof
    title: 'Fraud proof'
    oneLine: 'A protocol where the posted state is assumed correct and anyone may challenge it within a window; a successful challenge rejects the assertion.'
    statement: >
      A fraud proof — also called a fault proof — is the dispute protocol behind an optimistic
      rollup. An asserter posts a claimed state; anyone may dispute it during the challenge window;
      if the dispute resolves against the asserter the claim is rejected and its bond is forfeited.
      Nothing is proved in the normal case, which is what makes the mechanism cheap. The cost is
      that safety depends on a dispute actually being raised, which makes it a liveness assumption
      about participants rather than a property of the code.
    volatility: stable
    edges:
      - { to: optimistic-rollup, type: requires }
      - { to: interactive-bisection, type: deepens }
      - { to: validity-proof, type: contrasts }
    sources: [op-specs-fault-proof, arbitrum-interactive-fraud-proofs]
  - id: validity-proof
    title: 'Validity proof'
    oneLine: 'A succinct cryptographic proof, verified on L1, that the state transition was computed correctly — no window and no challenger needed.'
    statement: >
      A validity proof is a succinct argument that a claimed state transition follows from the prior
      state and the published inputs, small and cheap enough for an L1 contract to verify directly.
      Because correctness is established rather than assumed, there is no challenge window and no
      dependence on anyone watching. What it costs instead is proving: a real, recurring compute
      bill and a real wall-clock delay between execution and having a verifiable proof. The
      guarantee is stronger and narrower than people expect — it covers execution only.
    volatility: stable
    edges:
      - { to: validity-rollup, type: requires }
      - { to: fraud-proof, type: contrasts }
      - { to: proofs-do-not-imply-trustless, type: deepens }
    sources: [arxiv-zk-rollup-bottlenecks, l2beat-glossary]
  - id: interactive-bisection
    title: 'Interactive bisection'
    oneLine: 'The dispute is halved repeatedly — block range, then instruction range — until the parties disagree about exactly one instruction.'
    statement: >
      Bisection turns an argument about a whole batch into an argument about one instruction. The
      two parties commit to a trace of the disputed execution; each round they are asked about the
      midpoint of the range still in dispute, and whichever half they first disagree about becomes
      the new range. After a logarithmic number of rounds the disputed range is a single step. The
      cost to L1 is a handful of small transactions plus one execution, rather than re-running the
      batch — which is the only reason a fraud proof is affordable at all.
    volatility: stable
    edges:
      - { to: fraud-proof, type: requires }
      - { to: one-step-proof, type: deepens }
    sources: [op-specs-fault-dispute-game, arbitrum-interactive-fraud-proofs]
    misconceptions:
      - belief: 'A fraud proof re-executes the whole disputed batch on L1.'
        reality: 'Bisection narrows the dispute to one instruction, and L1 executes only that instruction inside the fault-proof VM.'
        why: '"Proving fraud" sounds like re-running everything, which would defeat the point of a rollup.'
        source: op-specs-fault-dispute-game
  - id: one-step-proof
    title: 'One-step proof'
    oneLine: 'The final on-chain step — replay the single disputed instruction inside an on-chain VM and see who was right.'
    statement: >
      The one-step proof is the only thing L1 ever executes in a dispute. Given the pre-state
      committed by both parties and the single instruction they disagree about, an L1 contract runs
      that instruction in the fault-proof VM and compares the result to each party's claimed
      post-state. Whoever's claim matches wins; the loser's bond is forfeited. Everything before it
      — every bisection round — exists only to make this step small enough to be affordable.
    volatility: stable
    edges:
      - { to: interactive-bisection, type: requires }
      - { to: fault-proof-vm, type: deepens }
    sources: [op-specs-fault-dispute-game, arbitrum-interactive-fraud-proofs]
  - id: fault-proof-vm
    title: 'Fault-proof VM'
    oneLine: 'A deterministic VM that emulates the rollup''s state transition so a single instruction can be replayed on L1.'
    statement: >
      A fault-proof VM is a small, fully deterministic machine — Cannon, a MIPS VM, for the OP
      Stack; a WASM-based machine for Arbitrum — whose instruction set is simple enough to
      implement on-chain in Solidity. The rollup's real state transition program is compiled to
      that machine, so any step of it can be replayed by an L1 contract. Determinism is
      non-negotiable: if the same instruction could yield two results, the dispute could not be
      settled. The OP Stack makes the game type pluggable, so which program runs on the VM can
      change without changing the trust model — the Karst release in June 2026 moved the respected
      game type from CANNON to CANNON_KONA on exactly that basis.
    volatility: evolving
    edges:
      - { to: one-step-proof, type: requires }
      - { to: evm-execution-loop, type: contrasts }
    sources: [op-docs-cannon, op-specs-dispute-game-interface]
  - id: challenge-window
    title: 'Challenge window'
    oneLine: 'The fixed period during which an assertion can be disputed; withdrawals cannot finalise until it elapses.'
    statement: >
      The challenge window is the fixed period after an assertion during which a dispute may be
      opened. It is about seven days on both major optimistic stacks and has not shortened. Its
      length is not set by how long a proof takes to compute; it is set by how long an honest
      challenger might need to get a transaction included on L1 while someone is trying to censor
      them. Withdrawals wait out the window because until it closes the state they are drawn from
      can still be overturned.
    volatility: stable
    edges:
      - { to: fraud-proof, type: requires }
      - { to: deposit-is-fast-withdrawal-is-slow, type: applies }
    sources: [op-specs-fault-dispute-game, op-docs-fault-proofs-explainer]
    misconceptions:
      - belief: 'The seven-day window exists because fraud proofs are slow to generate.'
        reality: 'It exists to guarantee an honest challenger has time to get a transaction included on L1 even under censorship. It is a censorship-resistance budget.'
        why: 'Every other delay in the stack is a performance limit.'
        source: op-specs-fault-dispute-game
  - id: one-honest-challenger-assumption
    title: 'The one-honest-challenger assumption'
    oneLine: 'An optimistic rollup is safe only if at least one honest party is watching, funded, and able to get transactions on-chain during the window.'
    statement: >
      An optimistic rollup's safety reduces to a chain of practical requirements: someone must be
      running challenger software, that software must be correctly configured and actually looking
      at the right chain, its operator must hold enough capital to post bonds, and their
      transactions must reach L1 within the window. Break any link and an invalid assertion
      finalises. This is a liveness assumption about people and operations, which is a different
      kind of assumption from a cryptographic one and fails in different ways.
    volatility: stable
    edges:
      - { to: challenge-window, type: requires }
      - { to: forced-inclusion, type: requires }
      - { to: escape-hatch-requires-l1-liveness, type: deepens }
    sources: [op-docs-challenger]
    misconceptions:
      - belief: 'The fraud proof protects me automatically.'
        reality: 'It protects you if at least one honest, funded party is watching and can reach L1 during the window. That is an assumption about people, not about code.'
        why: 'The word "trustless" is applied to the whole system rather than to the mechanism it describes.'
        source: op-docs-challenger
  - id: permissionless-challenging
    title: 'Permissionless challenging'
    oneLine: 'Whether anyone can challenge, or only a whitelist — the difference between a real fraud proof and a decorative one.'
    statement: >
      A fraud proof system is only as good as the set of parties allowed to use it. If challenging
      is restricted to a whitelist, then the same operators who could post a bad assertion are the
      only ones who could dispute it, and the mechanism guarantees nothing. Moving to permissionless
      challenging is a specific migration a chain performs, with its own documented procedure, and
      it is a Stage 1 requirement precisely because it is the point where the proof system starts
      binding anyone. Both major optimistic stacks now run permissionless systems; parts of the long
      tail do not.
    volatility: hot
    edges:
      - { to: one-honest-challenger-assumption, type: requires }
      - { to: l2beat-stage-1, type: requires }
    sources: [op-docs-migrating-permissionless, l2beat-stages]
    misconceptions:
      - belief: 'Anyone can already challenge on every optimistic rollup.'
        reality: 'Permissionless challenging is a migration a chain has to perform; some still whitelist. Check the chain''s L2BEAT risk row rather than assuming.'
        source: op-docs-migrating-permissionless
      - belief: 'Optimistic rollups have no working fraud proofs.'
        reality: 'Arbitrum''s BoLD launched in 2025 and the OP Stack fault proof system is live and permissionless; the criticism outlived the thing it described.'
        source: oplabs-fault-proof-available
  - id: delay-attack
    title: 'Delay attack'
    oneLine: 'An adversary spams disputes to stall confirmations and drain honest challengers'' capital and attention.'
    statement: >
      A delay attack does not try to win a dispute. It tries to make disputing expensive: opening
      many claims, responding at the last permitted moment, and forcing honest parties to stay
      engaged and keep capital locked in bonds. The damage is stalled confirmations and exhausted
      challengers rather than a stolen state root. Arbitrum's BoLD is designed specifically so that
      a single honest party bonding the correct state still prevails with the total delay bounded,
      and the economics of censorship and delay remain an active research area.
    volatility: evolving
    edges:
      - { to: interactive-bisection, type: requires }
      - { to: bonded-challenging, type: deepens }
    sources: [arbitrum-bold-deep-dive, arxiv-economic-censorship-games]
    misconceptions:
      - belief: 'An attacker can win a dispute by simply outspending the honest party.'
        reality: 'BoLD is designed so that one honest party bonding the correct state prevails, with delay bounded. The live concern is delay and censorship economics, not outright purchase of the outcome.'
        source: arxiv-economic-censorship-games
  - id: bonded-challenging
    title: 'Bonded challenging'
    oneLine: 'Challengers and asserters post bonds; the loser''s bond pays the winner, which funds honest watching and prices spam.'
    statement: >
      Both sides of a dispute put up a bond, and the loser's bond is paid to the winner. This does
      two jobs at once: it gives someone a reason to run challenger software and keep capital ready,
      and it puts a price on opening frivolous disputes. Bond sizing is the tuning knob — too small
      and spam is cheap, too large and only well-capitalised parties can defend the chain, which
      quietly narrows the honest set the whole system depends on.
    volatility: evolving
    edges:
      - { to: delay-attack, type: requires }
      - { to: one-honest-challenger-assumption, type: applies }
    sources: [arbitrum-bold-economics]
  - id: proving-cost
    title: 'Proving cost'
    oneLine: 'A validity rollup pays a real, recurring compute bill per batch that an optimistic rollup simply does not have.'
    statement: >
      Generating validity proofs costs money continuously: specialised hardware, typically GPU
      clusters, running for every batch the chain produces. It is an operating expense with no
      equivalent on the optimistic side, where the normal case proves nothing at all. That the cost
      is fundamentally a hardware and energy cost is visible in how the Ethereum Foundation
      specifies proving at all — its realtime-proving definition is written as a capital-expenditure
      ceiling and a power ceiling alongside the latency target, not as a fee. Published dollar
      figures disagree badly and are not even in comparable units — some quote cost per proof,
      others cost per transaction — so no single number should be taught. What is safe to teach is
      the shape: recurring, hardware-bound, and scaling with throughput.
    volatility: hot
    edges:
      - { to: validity-proof, type: requires }
      - { to: l2-gross-vs-net-revenue, type: applies }
    sources: [ef-realtime-proving, arxiv-zk-rollup-bottlenecks, succinct-realtime-proving]
    misconceptions:
      - belief: 'Validity proofs cost nothing once the circuit is written.'
        reality: 'Proving is a recurring compute bill per batch with meaningful hardware requirements — an ongoing operating cost optimistic rollups never pay.'
        source: succinct-realtime-proving
  - id: proving-latency
    title: 'Proving latency'
    oneLine: 'The wall-clock time from executing a batch to having a verifiable proof — real minutes or more, not instant.'
    statement: >
      Proving takes time. Between the moment a validity rollup executes a batch and the moment it
      has a proof an L1 contract will accept, the chain is running on soft confirmations exactly
      like an optimistic rollup. That this delay is the binding constraint rather than a detail is
      why the Ethereum Foundation had to define a proving-latency target at all — ten seconds or
      less for the 99th percentile of mainnet blocks, stated together with the hardware and power
      budget it must be achieved on. Note the workload in that target: one L1 block, not an L2
      batch. Reported latencies vary by more than an order of magnitude across systems, years and
      workloads, so a figure quoted without its workload and its hardware is not a number. Teach
      the existence and the variance.
    volatility: hot
    edges:
      - { to: validity-proof, type: requires }
      - { to: soft-confirmation, type: applies }
      - { to: hard-finality, type: contrasts }
    sources: [ef-realtime-proving, arxiv-zk-rollup-bottlenecks, succinct-realtime-proving]
    misconceptions:
      - belief: 'ZK rollups are final immediately and optimistic rollups take seven days.'
        reality: 'Both give a soft confirmation in about a second. The seven days is the optimistic withdrawal window, and validity rollups have their own proving latency before L1 finality.'
        why: 'Two different delays wear the same word, "finality".'
        source: arxiv-zk-rollup-bottlenecks
  - id: proof-type-is-not-trust-level
    title: 'Proof type is not trust level'
    oneLine: 'Trust depends on who can upgrade, whether challenging is permissionless, and whether the proof system is actually active — not on which proof family it belongs to.'
    statement: >
      Once you know how both families work, the ranking people reach for — validity above optimistic
      — stops being available. What determines how much you must trust a chain is who holds the
      upgrade authority and how long the exit window is, whether challenging or proving is
      permissionless, and whether the proof system is live in production rather than configured and
      dormant. The boundary is also dissolving: validity proving is available as a configuration on
      the OP Stack, so proof type is increasingly a per-chain choice rather than a stack property.
    volatility: hot
    edges:
      - { to: permissionless-challenging, type: requires }
      - { to: proofs-do-not-imply-trustless, type: requires }
      - { to: l2beat-stage-1, type: applies }
    sources: [l2beat-stages, succinct-op-succinct]
    misconceptions:
      - belief: 'Choosing a ZK rollup over an optimistic one reduces the trust I place in the operator.'
        reality: 'It removes the withdrawal window. It does not change who can upgrade the contracts, who sequences, or whether the data was published — and those are what the stage framework grades.'
        why: 'Proof type is the most visible difference between chains, so it becomes the assumed ranking.'
        source: l2beat-stages
