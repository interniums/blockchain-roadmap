moduleId: scaling-rollup-stages
concepts:
  - id: rollup
    title: 'Rollup'
    oneLine: 'Execute off-chain, publish the data and a proof to L1, and inherit L1''s data availability and settlement.'
    statement: >
      A rollup executes transactions on its own chain and publishes two things to Ethereum: the
      transaction data needed to reconstruct its state, and a claim about the resulting state that
      Ethereum's contracts can reject. Because the data is on a permissionless L1, anyone can
      recompute the rollup's state independently; because settlement happens in L1 contracts, the
      rollup cannot finalise a state Ethereum's rules reject. Those two properties — not throughput
      — are what the word rollup means. A chain that publishes its data anywhere else is not a
      rollup, whatever it calls itself.
    volatility: stable
    edges:
      - { to: blob, type: requires }
      - { to: state-root, type: requires }
      - { to: rollup-vs-validium, type: deepens }
    sources: [l2beat-glossary, l2beat-stages]
    misconceptions:
      - belief: 'A rollup is a separate blockchain that occasionally checkpoints to Ethereum.'
        reality: 'A rollup publishes the full data needed to rebuild its state, which is what lets anyone check it and exit; a checkpoint alone gives neither.'
        why: 'Sidechains checkpoint too, and the two get described with the same words.'
        source: l2beat-glossary
  - id: sequencer
    title: 'Sequencer'
    oneLine: 'The party that receives L2 transactions, picks their order, and publishes that ordering.'
    statement: >
      The sequencer receives users' L2 transactions, chooses the order they execute in, and
      publishes the resulting ordering. On every major L2 in 2026 this is a single process run by
      one company — Offchain Labs for Arbitrum One and Nova, Coinbase for Base, OP Labs for OP
      Mainnet. Sequencing is a distinct role from proving and from upgrading the contracts, and
      each of the three fails differently. Treat single-operator sequencing as the current steady
      state, not as a transitional stage about to end.
    volatility: evolving
    edges:
      - { to: rollup, type: requires }
      - { to: sequencer-feed, type: deepens }
      - { to: forced-inclusion, type: contrasts }
    sources: [arbitrum-sequencer, l2beat-stages]
    misconceptions:
      - belief: 'Sequencer decentralisation is coming next year.'
        reality: 'It has been coming next year since 2023, and no top-5 L2 has shipped it; teach the current assumption as the design you are actually using.'
        why: 'Roadmap documents circulate more widely than deployments.'
        source: l2beat-stages
  - id: optimistic-rollup
    title: 'Optimistic rollup'
    oneLine: 'Assume the posted state is right, let anyone challenge it inside a window, and delay withdrawals until the window closes.'
    statement: >
      An optimistic rollup posts a claimed state root without proving it, and treats the claim as
      correct unless someone disputes it within a fixed challenge window — about seven days on both
      major stacks. If a dispute succeeds the claim is rejected. Withdrawals cannot finalise until
      the window elapses, because until then the state they are drawn from could still be
      overturned. The safety of the whole arrangement rests on at least one honest party actually
      watching and being able to reach L1 during the window.
    volatility: stable
    edges:
      - { to: rollup, type: requires }
      - { to: fraud-proof, type: deepens }
      - { to: challenge-window, type: deepens }
    sources: [op-docs-fault-proofs-explainer, arbitrum-interactive-fraud-proofs]
    misconceptions:
      - belief: 'Optimistic rollups have no working fraud proofs; it is all theatre.'
        reality: 'That was a fair criticism until 2024-2025. Arbitrum''s BoLD launched in 2025 and OP Stack ships permissionless fault proofs; both are live.'
        why: 'The criticism was accurate for years and outlived the thing it described.'
        source: oplabs-fault-proof-available
      - belief: 'The seven-day window exists because generating a fraud proof is slow.'
        reality: 'It exists so an honest challenger has time to get a transaction included on L1 even under censorship. The window is a censorship-resistance budget, not a compute budget.'
        why: 'Every other delay in the stack is a performance limit, so this one gets read the same way.'
        source: op-specs-fault-dispute-game
  - id: validity-rollup
    title: 'Validity rollup'
    oneLine: 'Prove each batch correct with a succinct proof verified on L1, so no challenge window is needed.'
    statement: >
      A validity rollup generates a succinct cryptographic proof that its state transition was
      computed correctly and has an L1 contract verify it. Because correctness is established
      rather than assumed, there is no challenge window and no dependence on a watching challenger.
      What the proof removes is the withdrawal delay. It does not remove the sequencer's control
      over ordering, it does not make confirmations instant — proving takes real wall-clock time —
      and it says nothing about who can replace the verifier contract.
    volatility: stable
    edges:
      - { to: rollup, type: requires }
      - { to: optimistic-rollup, type: contrasts }
      - { to: validity-proof, type: deepens }
      - { to: zk-rollups-are-not-zk, type: recommends }
    sources: [l2beat-glossary, l2beat-stages]
    misconceptions:
      - belief: 'A ZK rollup gives you instant finality.'
        reality: 'Both rollup families give a soft confirmation in about a second. Validity proofs remove the withdrawal window, not the confirmation delay, and add proving latency of their own.'
        why: 'The phrase instant finality is used as marketing shorthand for no seven-day wait.'
        source: arxiv-zk-rollup-bottlenecks
  - id: forced-inclusion
    title: 'Forced inclusion'
    oneLine: 'An L1 path that obliges the L2 to include your transaction even if the sequencer refuses to.'
    statement: >
      Forced inclusion means submitting your L2 transaction to an L1 contract so that, after a
      protocol-defined delay, the L2's own rules oblige it to include that transaction whether or
      not the sequencer cooperates. It is what makes a rollup escapable rather than merely cheap:
      without it, a censoring sequencer can hold your funds indefinitely without ever breaking a
      rule. Having a queue on L1 is not the same as having a path a user can complete alone —
      whether you can finish the job yourself is the distinction that matters.
    volatility: evolving
    edges:
      - { to: sequencer, type: requires }
      - { to: rollup, type: requires }
      - { to: delayed-inbox, type: deepens }
      - { to: escape-hatch, type: applies }
    sources: [arbitrum-sequencer, op-docs-forced-transaction]
    misconceptions:
      - belief: 'If the sequencer censors me I can immediately go to L1.'
        reality: 'You can queue immediately, but forcing only becomes possible after the delay elapses — Arbitrum''s default delayBlocks is 24 hours, and OP Stack''s sequencing window is 12 hours.'
        why: '"Escape hatch" sounds like an exit you can use right now.'
        source: arbitrum-sequencer
  - id: escape-hatch
    title: 'Escape hatch'
    oneLine: 'The ability to get your funds out without the operator''s cooperation.'
    statement: >
      An escape hatch is the property that a user can withdraw their assets from an L2 without any
      operator choosing to help. It requires more than forced inclusion: the transaction must be
      included, a state root covering it must be posted, the proof or challenge window must
      complete, and the withdrawal must be claimed on L1. Each of those is a separate chokepoint
      with a separate party who can stall it. A chain has an escape hatch only if a user can drive
      every one of those steps themselves.
    volatility: evolving
    edges:
      - { to: forced-inclusion, type: requires }
      - { to: walkaway-test, type: deepens }
      - { to: proposer-failure, type: deepens }
    sources: [l2beat-stages, l2beat-arbitrum-project]
    misconceptions:
      - belief: 'Every rollup has an escape hatch.'
        reality: 'Having a delayed inbox is not the same as having a path a user can complete alone, and a whitelisted state-root proposer that stops freezes withdrawals independently of inclusion.'
        why: 'Sequencer failure and proposer failure are usually taught as one risk.'
        source: l2beat-arbitrum-project
  - id: upgrade-key-risk
    title: 'Upgrade key risk'
    oneLine: 'Whoever can replace the rollup''s contracts can override every other guarantee it offers.'
    statement: >
      A rollup's L1 contracts — the bridge, the verifier, the dispute game — sit behind upgradeable
      proxies. Whoever controls the upgrade authority can replace the verifier with one that
      accepts anything, or change the bridge to release escrowed funds. That capability sits above
      the proof system rather than beside it: no proof constrains a contract that can be swapped
      out. When you assess a chain, the upgrade authority and its exit window are the first thing
      to look at, not the last.
    volatility: evolving
    edges:
      - { to: rollup, type: requires }
      - { to: transparent-proxy, type: recommends }
      - { to: exit-window, type: deepens }
      - { to: l2beat-stage-0, type: applies }
    sources: [l2beat-stages, l2beat-stages-intro]
    misconceptions:
      - belief: '"Secured by Ethereum" means my funds are as safe on the L2 as on L1.'
        reality: 'At Stage 0 a compromised multisig can alter the protocol unilaterally, including the contracts that hold the escrowed funds.'
        why: 'The phrase describes where the data goes, and gets heard as a statement about custody.'
        source: l2beat-stages-intro
  - id: proofs-do-not-imply-trustless
    title: 'A proof constrains execution, not governance'
    oneLine: 'A validity proof says the state transition was computed correctly; it says nothing about who can replace the verifier.'
    statement: >
      A validity proof establishes exactly one thing: that the claimed state transition follows from
      the previous state and the published inputs under the rollup's rules. It does not establish
      that those rules cannot be changed, that the verifier contract cannot be swapped, that the
      sequencer will include your transaction, or that the data behind the proof was published at
      all. zkSync Era and Linea both run validity proofs in production and both sit at Stage 0,
      because their upgrade authority and operator control remain centralised. Proof type and trust
      level are independent axes.
    volatility: hot
    edges:
      - { to: validity-rollup, type: requires }
      - { to: upgrade-key-risk, type: requires }
      - { to: l2beat-stage-0, type: applies }
      - { to: security-is-the-weaker-link, type: deepens }
      - { to: proof-type-is-not-trust-level, type: deepens }
    sources: [l2beat-stages, l2beat-stages-intro, zksecurity-l2-formal]
    misconceptions:
      - belief: 'A ZK rollup is trustless because the proof is mathematical.'
        reality: 'zkSync Era and Linea are Stage 0 despite shipping validity proofs. The proof constrains execution; the upgrade key constrains everything else, including the proof system.'
        why: 'Cryptographic guarantees are assumed to be the binding constraint because they are the most impressive part of the design.'
        source: l2beat-stages
      - belief: 'Optimistic rollups are inherently less secure than ZK rollups.'
        reality: 'Stage is determined by governance and exit guarantees, not proof type. As of mid-2026 several optimistic rollups sit at Stage 1 while several validity rollups sit at Stage 0.'
        why: 'Proof type is the most visible difference, so it becomes the assumed ranking.'
        source: l2beat-stages
  - id: l2beat-stage-0
    title: 'Stage 0'
    oneLine: 'The rollup runs, and a centralised multisig can still change the protocol unilaterally.'
    statement: >
      Stage 0 means the rollup is operational and posts its data, but a centralised operator set
      retains unilateral upgrade authority over its contracts. A compromised or coerced key set can
      alter the protocol — including replacing a working proof system — without user consent and
      potentially without an exit window. Stage 0 is a statement about governance, not about
      whether the chain works or whether its proofs are real. As of mid-2026 zkSync Era and Linea
      are the standing examples: production validity proofs, Stage 0.
    volatility: hot
    edges:
      - { to: upgrade-key-risk, type: requires }
      - { to: l2beat-stage-1, type: contrasts }
    sources: [l2beat-stages, l2beat-stages-intro]
    misconceptions:
      - belief: 'Stage 0 means the chain is unfinished or experimental.'
        reality: 'The largest and most-used L2s have spent years at Stage 0 while being entirely production-ready. The rating is about who can override the protocol, not about maturity of the software.'
        why: 'A zero reads as a beta label.'
        source: l2beat-stages-intro
  - id: l2beat-stage-1
    title: 'Stage 1'
    oneLine: 'Governed by contracts with a working proof system and permissionless exits, with a Security Council still able to intervene.'
    statement: >
      Stage 1 requires that the protocol is governed by its smart contracts rather than by an
      operator's discretion: a functional proof system, permissionless submission of fraud proofs
      or their equivalent, and users able to exit without the operator's cooperation. A Security
      Council may still act, but only under constrained conditions such as a demonstrated bug, and
      the requirements on that council's composition have tightened over time. As of May 2026
      Arbitrum One, Base, OP Mainnet, Starknet and Scroll were classified Stage 1; membership moves,
      so check L2BEAT rather than a lesson.
    volatility: hot
    edges:
      - { to: l2beat-stage-0, type: requires }
      - { to: permissionless-challenging, type: recommends }
      - { to: l2beat-stage-2, type: contrasts }
    sources: [l2beat-stages, l2beat-stages-security-council]
    misconceptions:
      - belief: 'Stage 1 means no one can override the chain.'
        reality: 'A Security Council can still intervene at Stage 1. What changes is that intervention is constrained and visible rather than unilateral and routine.'
        why: '"Governed by smart contracts" gets read as "no humans in the loop".'
        source: l2beat-stages-security-council
  - id: l2beat-stage-2
    title: 'Stage 2'
    oneLine: 'No administrator can override the protocol, and there is no emergency admin capability at all.'
    statement: >
      Stage 2 means the protocol is fully trust-minimised: no administrator, council or operator can
      override its rules, and there is no emergency admin capability held in reserve. Upgrades, if
      possible at all, run through a process with an exit window long enough for users to leave
      first. As of the research behind this module no major L2 had reached Stage 2 — every
      significant chain retained some override capability. Treat any claim that a chain is Stage 2
      as something to verify on L2BEAT directly.
    volatility: hot
    edges:
      - { to: l2beat-stage-1, type: requires }
      - { to: exit-window, type: recommends }
    sources: [l2beat-stages, l2beat-stages-intro]
    misconceptions:
      - belief: 'The big L2s are basically at Stage 2 by now.'
        reality: 'As of the mid-2026 research window no major rollup had reached Stage 2; the emergency override is the last thing anyone gives up.'
        why: 'Progress on proofs gets read as progress on governance.'
        source: l2beat-stages
