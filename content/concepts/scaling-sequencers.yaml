moduleId: scaling-sequencers
concepts:
  - id: sequencer-feed
    title: 'Sequencer feed'
    oneLine: 'The real-time stream of the sequencer''s accepted ordering, published before anything reaches L1.'
    statement: >
      The sequencer feed is a public real-time stream on which the sequencer publishes the ordering
      it has accepted, ahead of any L1 posting. Wallets, RPC providers and block explorers read the
      feed and render its contents as confirmed transactions. It is a real endpoint you can connect
      to yourself, which is the fastest way to see that the "confirmation" your UI shows originates
      from one operator's process and not from consensus.
    volatility: stable
    edges:
      - { to: sequencer, type: requires }
      - { to: soft-confirmation, type: deepens }
    sources: [arbitrum-read-sequencer-feed, arbitrum-inside-nitro]
  - id: soft-confirmation
    title: 'Soft confirmation'
    oneLine: 'A receipt from the sequencer''s own feed, backed by its promise not to reorder and nothing else.'
    statement: >
      A soft confirmation is the receipt a sequencer emits from its own feed after accepting and
      ordering your transaction. It arrives in roughly a second and it is what almost every L2
      wallet and explorer displays as success. Its only backing is the operator's promise not to
      reorder; no L1 contract, no proof and no consensus has yet seen the transaction. On both
      rollup families the soft confirmation arrives at the same early point, so it is not a
      distinguishing feature of either.
    volatility: stable
    edges:
      - { to: sequencer-feed, type: requires }
      - { to: hard-finality, type: contrasts }
    sources: [arbitrum-tx-lifecycle, arbitrum-sequencer]
    misconceptions:
      - belief: 'When my wallet shows an L2 transaction confirmed, it is final.'
        reality: 'That is a soft confirmation from the sequencer''s own feed with no cryptographic backing. Hard finality arrives when the batch containing it finalises on L1, typically minutes later.'
        why: 'L2 UX deliberately hides the difference, because so far sequencers have always behaved.'
        source: arbitrum-tx-lifecycle
  - id: hard-finality
    title: 'Hard finality'
    oneLine: 'The point where the batch containing your transaction is posted to and finalised on L1.'
    statement: >
      Hard finality is reached when the batch containing your transaction has been posted to L1 and
      that L1 block has itself finalised under Ethereum's consensus. Only then is the ordering
      irreversible without breaking Ethereum. Before that point, an L2 block that looked settled
      can be un-settled: a shallow L1 reorg can undo a batch that had been posted but not yet
      finalised. The gap between soft confirmation and hard finality is minutes, and it is the
      window every payments product has to have a policy about.
    volatility: stable
    edges:
      - { to: soft-confirmation, type: requires }
      - { to: rollup, type: requires }
      - { to: epoch-and-finality-timing, type: requires }
      - { to: reorg, type: recommends }
      - { to: unsafe-safe-finalized, type: deepens }
    sources: [arbitrum-tx-lifecycle, arbitrum-chain-finality]
  - id: sequencer-worst-case-is-bounded
    title: 'The sequencer''s worst case is bounded'
    oneLine: 'A hostile sequencer can reorder, delay or censor you; it cannot forge your signature or finalise an invalid state.'
    statement: >
      What a malicious or buggy sequencer can do is reorder transactions, delay them, and censor
      them. What it cannot do is forge a transaction you did not sign, or commit a state transition
      that violates the rollup's rules — the L1 contracts and the proof system reject both. This
      bound is worth stating precisely, because overstating the sequencer's power leads people to
      discount the risks that are real: liveness, MEV extraction, and the upgrade keys that sit
      above all of it.
    volatility: stable
    edges:
      - { to: soft-confirmation, type: requires }
      - { to: forced-inclusion, type: requires }
      - { to: upgrade-key-risk, type: contrasts }
    sources: [arbitrum-sequencer]
    misconceptions:
      - belief: 'A centralised sequencer means the operator can take my money.'
        reality: 'It can reorder, delay or censor. It cannot forge transactions or finalise an invalid state, because the L1 contracts and proof system reject those.'
        why: '"Centralised" gets flattened into "custodial".'
        source: arbitrum-sequencer
  - id: sequencer-liveness-risk
    title: 'Sequencer liveness risk'
    oneLine: 'If the single sequencer stops, the chain stops producing blocks; nobody is robbed and the product is down.'
    statement: >
      With one sequencer, its failure is the chain's failure: no new blocks, no new confirmations,
      no application usable. Funds are not at risk in this scenario — that is the point of the
      escape hatch — but every product on the chain is unavailable, and the escape path runs at
      the granularity of the forced-inclusion delay, measured in hours. Liveness, not theft, is the
      concrete cost of single-operator sequencing, and it is the risk your uptime commitments have
      to price.
    volatility: stable
    edges:
      - { to: sequencer, type: requires }
      - { to: sequencer-worst-case-is-bounded, type: contrasts }
      - { to: sequencing-window, type: deepens }
    sources: [arbitrum-sequencer, op-docs-forced-transaction]
  - id: sequencer-mev
    title: 'Sequencer MEV'
    oneLine: 'Because ordering is unilateral, the sequencer holds all of its chain''s MEV and need not auction any of it.'
    statement: >
      On L1 the right to order transactions is contested every slot and its value is auctioned. On
      an L2 with one sequencer, that right belongs to one party permanently and without a market.
      Whatever value can be extracted by choosing an ordering accrues to the operator by default,
      and whether any of it is auctioned, rebated or simply kept is a policy the operator chooses
      and can change. This is a structural difference from L1, not a temporary one.
    volatility: evolving
    edges:
      - { to: sequencer, type: requires }
      - { to: mev-solver-competition, type: recommends }
    sources: [arbitrum-sequencer]
  - id: l2-gross-vs-net-revenue
    title: 'Gross versus net L2 revenue'
    oneLine: 'Gross revenue is user gas fees; net revenue is that minus the L1 cost of posting data and proofs, and the second number is the business.'
    statement: >
      The fee a user pays an OP Stack chain has two parts by construction: an execution gas fee for
      running the transaction on L2, and an L1 data fee that recovers the cost of publishing that
      transaction's data to Ethereum, with the proceeds split across separate fee vaults. Gross
      revenue is the whole of what users pay. Net revenue is that minus what the chain actually
      spends on L1 — blob or calldata costs for posting batches, gas for state roots, and for a
      validity rollup the compute bill for proving. A headline revenue figure that does not say
      which of the two it is tells you nothing about durability, so when you evaluate a chain, ask
      for the number after L1 costs.
    volatility: evolving
    edges:
      - { to: sequencer, type: requires }
      - { to: blob, type: requires }
      - { to: proving-cost, type: deepens }
    sources: [op-docs-transaction-fees, optimism-fusaka-is-live]
    misconceptions:
      - belief: 'L2s print money, because gas is cheap for users and blobs are cheap for them.'
        reality: 'Part of what a user pays is explicitly an L1 data fee passed through, and cheap data cuts what an L2 can charge as well as what it pays.'
        why: 'The fee a user sees is one number, and its L1 component is invisible in the wallet.'
        source: op-docs-transaction-fees
  - id: blob-collapsed-l2-margins
    title: 'Cheap data collapsed per-transaction margin'
    oneLine: 'Once blobs made data posting cheap and then abundant, per-transaction margin fell and L2 economics became a volume game.'
    statement: >
      Before EIP-4844, posting data to L1 was the dominant L2 cost and the main thing an operator
      could out-engineer. Blobs moved that data into a separate resource with its own market, whose
      price is set by demand for blobs rather than by competition for execution gas, and the later
      blob parameter increases raised the supply again. The squeeze on margin follows from how the
      cost is charged onward: an OP Stack user's fee contains an explicit L1 data component sized to
      what publishing that transaction costs, so when the L1 data cost falls, the fee the chain can
      justify charging falls with it. Both sides of the spread move together. Treat that direction
      as well supported and any specific margin figure as un-established — it moves with blob demand
      week to week. The structural consequence is that an L2's economics now lean on volume and on
      costs other than data, rather than on arbitraging the data cost.
    volatility: hot
    edges:
      - { to: l2-gross-vs-net-revenue, type: requires }
      - { to: blob, type: requires }
      - { to: da-cost-no-longer-dominant, type: deepens }
    claimKind: empirical
    sources: [op-docs-transaction-fees, eip-4844, optimism-fusaka-is-live]
  - id: shared-sequencer
    title: 'Shared sequencer'
    oneLine: 'An external sequencing network several rollups outsource ordering to, buying cross-rollup atomicity and shared liveness at the cost of a new dependency.'
    statement: >
      A shared sequencer, as originally proposed, is a separate network that orders transactions for
      several rollups at once. The claimed benefits are cross-rollup atomicity — a transaction can
      span two chains — and liveness that does not depend on any one operator. The cost is a new
      dependency and a new trust assumption outside the rollup's own contracts. The adoption record
      matters more than the design here, and it is discouraging: Astria, one of the two leading
      efforts, shut down in December 2025, and Espresso's own documentation now describes its
      network as settlement and fast-finality infrastructure that integrated chains plug into while
      keeping their own execution environment and their own sequencer. Read shared sequencing as a
      design that has repeatedly failed to displace the single operator, not as the next step.
    volatility: hot
    edges:
      - { to: sequencer, type: requires }
      - { to: based-sequencing, type: contrasts }
    claimKind: empirical
    sources: [espresso-docs, espresso-sequencer, orochi-sequencer-centralisation]
    misconceptions:
      - belief: 'Shared sequencers are the obvious fix and are being adopted.'
        reality: 'Astria shut down in December 2025, and Espresso now documents itself as a settlement layer for chains that keep their own sequencer. The constraint has been adoption, not the technology.'
        why: 'Roadmap documents outnumber deployments.'
        source: espresso-docs
  - id: based-sequencing
    title: 'Based sequencing'
    oneLine: 'Let the L1 proposer sequence the rollup directly, so it inherits L1 liveness and censorship resistance instead of running its own sequencer set.'
    statement: >
      In based sequencing the rollup has no sequencer of its own: L1 validators order the rollup's
      transactions as part of building L1 blocks, so there is no separate consensus, no sequencer
      committee and no external coordination layer, and the rollup inherits Ethereum's ordering
      directly. The term was coined by Justin Drake for exactly this delegation. What it gives up
      is a soft confirmation from an operator the chain controls, which is why production based
      rollups add a preconfirmation layer on top; Taiko's current fork runs a preconf-whitelisted
      fast proposing path with a permissionless forced-inclusion fallback behind it. Taiko is the
      usual production example, and the design remains a minority one among live L2s.
    volatility: hot
    edges:
      - { to: sequencer, type: requires }
      - { to: shared-sequencer, type: contrasts }
    sources: [taiko-based-rollups, ethresearch-based-rollups, orochi-sequencer-centralisation]
  - id: decentralised-sequencer-does-not-fix-upgrade-keys
    title: 'Decentralising sequencing does not touch the upgrade keys'
    oneLine: 'Rotating sequencing to a committee changes liveness and censorship properties only; who can upgrade the bridge contracts is untouched.'
    statement: >
      Sequencing and upgrade authority are separate powers held by separate mechanisms. Moving
      sequencing to a committee, a shared network or the L1 proposer set improves liveness and
      censorship resistance and does nothing else: the same multisig can still replace the bridge,
      the verifier and the dispute game. This is why L2BEAT's stage framework grades governance and
      exits rather than sequencing, and why a chain can decentralise its sequencer and remain
      Stage 0.
    volatility: evolving
    edges:
      - { to: shared-sequencer, type: requires }
      - { to: upgrade-key-risk, type: requires }
      - { to: proofs-do-not-imply-trustless, type: deepens }
    sources: [l2beat-stages, l2beat-stages-intro]
    misconceptions:
      - belief: 'Decentralising the sequencer would make an L2 trustless.'
        reality: 'It addresses liveness and censorship only. Upgrade keys are a separate and usually larger risk, and they are what the stage framework grades.'
        why: 'Both get bundled under the single word "decentralisation".'
        source: l2beat-stages
