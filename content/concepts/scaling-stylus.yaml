moduleId: scaling-stylus
concepts:
  - id: stylus
    title: 'Stylus'
    oneLine: 'An Arbitrum Nitro upgrade adding a second WASM VM, so Rust, C and C++ contracts run on the same chain and state as Solidity ones.'
    statement: >
      Stylus is an ArbOS upgrade — introduced from ArbOS 32 — that adds a WebAssembly VM to
      Arbitrum Nitro alongside the EVM. Contracts compiled to WASM from Rust, C or C++ are deployed
      to the same chain, hold the same kind of accounts, and read and write the same storage as
      Solidity contracts. It runs on Arbitrum One, Nova and Arbitrum chains, and it is an
      Arbitrum-family feature: code written for it is not portable to other L2s.
    volatility: evolving
    edges:
      - { to: rollup, type: requires }
      - { to: coequal-wasm-vm, type: deepens }
    sources: [arbitrum-stylus-gentle-intro, arbitrum-stylus-vm-differences]
  - id: coequal-wasm-vm
    title: 'A coequal VM, not a replacement'
    oneLine: 'Stylus does not replace or transpile to the EVM; it runs a separate WASM VM sharing the same state, accounts and storage.'
    statement: >
      Stylus code is not compiled to EVM bytecode and does not run inside the EVM. It executes in a
      separate WebAssembly VM that sits beside the EVM with equal standing, and the two share one
      account space, one storage layer and one set of balances. Solidity contracts are entirely
      unaffected by the presence of Stylus. Getting this right is the difference between reasoning
      about a second machine on shared state and reasoning about a compiler target, and only the
      first is accurate.
    volatility: stable
    edges:
      - { to: stylus, type: requires }
      - { to: evm-execution-loop, type: contrasts }
    sources: [arbitrum-stylus-gentle-intro, arbitrum-stylus-vm-differences]
    misconceptions:
      - belief: 'Stylus is Rust compiled down to EVM bytecode.'
        reality: 'It is a separate WASM VM running alongside the EVM on the same state. Nothing is transpiled.'
        why: 'Every previous "write contracts in language X" tool was a compiler to EVM bytecode.'
        source: arbitrum-stylus-gentle-intro
      - belief: 'Stylus replaces the EVM on Arbitrum.'
        reality: 'It is a second, coequal VM. Solidity contracts are unaffected and the two call each other freely.'
        why: '"New VM" reads as "migration".'
        source: arbitrum-stylus-gentle-intro
  - id: stylus-solidity-interop
    title: 'Stylus and Solidity interop'
    oneLine: 'Solidity can call a Stylus contract and vice versa using ordinary calls; from the caller''s side there is no observable difference.'
    statement: >
      Calls between Solidity and Stylus contracts are ordinary contract calls. The caller does not
      know or need to know which VM will execute the callee: same address space, same call
      semantics, same return data. This makes incremental adoption realistic — you can replace one
      compute-heavy component with a Rust implementation and leave every caller untouched — and it
      means the boundary between the two VMs is not a place where you need special tooling.
    volatility: stable
    edges:
      - { to: coequal-wasm-vm, type: requires }
      - { to: abi-is-the-boundary, type: deepens }
    sources: [arbitrum-stylus-gentle-intro, cargo-stylus]
    misconceptions:
      - belief: 'Calling a Rust contract from Solidity needs special tooling.'
        reality: 'It is an ordinary call. `cargo stylus export-abi` gives you a Solidity interface to import, and nothing else changes.'
        source: cargo-stylus
  - id: abi-is-the-boundary
    title: 'The ABI is the boundary'
    oneLine: 'Interop works because both VMs speak the same ABI and address space; `cargo stylus export-abi` emits a Solidity interface for a Rust contract.'
    statement: >
      What actually makes the two VMs interchangeable to a caller is that both encode calls and
      returns with the same ABI and live in the same address space. The tooling makes this concrete:
      `cargo stylus export-abi` generates a Solidity interface for a Rust contract, which you import
      and call like any other. The boundary is also not Rust-specific — anything that compiles to
      WASM and speaks the ABI can participate, and the docs describe how to add a language.
    volatility: stable
    edges:
      - { to: stylus-solidity-interop, type: requires }
      - { to: abi-function-selector, type: recommends }
    sources: [cargo-stylus, arbitrum-stylus-new-languages]
    misconceptions:
      - belief: 'Stylus only supports Rust.'
        reality: 'Anything compiling to WASM — Rust, C, C++ — with a documented path for adding further languages.'
        source: arbitrum-stylus-new-languages
  - id: ink
    title: 'Ink'
    oneLine: 'Stylus''s fine-grained metering unit for WASM instructions, far smaller than gas, converted to gas at execution time.'
    statement: >
      Stylus meters WASM execution in ink, a unit much finer than gas, and converts the total to
      gas when the call completes. The finer granularity is what lets individual WASM instructions
      be priced according to their real cost rather than rounded into EVM-sized units, and it is
      the mechanism behind the compute saving. Ink pricing is a chain parameter, so the ink-to-gas
      conversion is something to read from the chain rather than assume.
    volatility: evolving
    edges:
      - { to: stylus, type: requires }
      - { to: gas, type: requires }
    sources: [arbitrum-stylus-gas, arbitrum-stylus-gas-metering]
  - id: compute-is-cheap-storage-is-not
    title: 'Compute is cheap, storage is not'
    oneLine: 'Stylus makes compute dramatically cheaper, but storage reads and writes cost the same gas as the EVM.'
    statement: >
      This is the fact that decides whether Stylus is worth using. Arbitrum's own documentation
      states that storage reads and writes cost the same gas in Stylus as in the EVM; the saving is
      on computation only, quoted by Arbitrum at roughly 10 to 100 times depending on the program —
      a vendor figure with no independent benchmark, so measure it yourself. A workload whose cost
      is dominated by SLOAD and SSTORE therefore gains essentially nothing, and pays the activation
      overhead on top.
    volatility: evolving
    edges:
      - { to: ink, type: requires }
      - { to: storage-slot, type: recommends }
      - { to: stylus-use-case-shape, type: deepens }
    sources: [arbitrum-stylus-vm-differences, arbitrum-stylus-gas]
    misconceptions:
      - belief: 'Stylus makes my ERC-20 much cheaper.'
        reality: 'A token is storage-bound and storage costs the same. You gain nothing and add an activation step.'
        why: 'The headline "10 to 100 times cheaper" is quoted without the word "compute".'
        source: arbitrum-stylus-vm-differences
      - belief: 'Stylus makes everything cheaper.'
        reality: 'It makes computation cheaper. Storage is identical, so the benefit depends entirely on your workload''s shape.'
        source: arbitrum-stylus-vm-differences
  - id: stylus-storage-caching
    title: 'Storage caching in the SDK'
    oneLine: 'The SDK caches repeated storage reads within a call and flushes at call boundaries, so repeated reads are cheaper than in Solidity.'
    statement: >
      Although the per-access price is the same as the EVM's, the Stylus SDK caches storage within
      a call and flushes at call boundaries, so a value read several times in one call is fetched
      once. Solidity leaves that optimisation to the developer, who must hoist the read into a
      local variable. The practical effect is that naive Stylus code can beat naive Solidity code
      on storage-touching paths, while carefully written Solidity closes the gap.
    volatility: evolving
    edges:
      - { to: compute-is-cheap-storage-is-not, type: requires }
    sources: [arbitrum-stylus-vm-differences]
  - id: page-based-memory
    title: 'Page-based memory'
    oneLine: 'Stylus memory grows in 64 KB pages at near-linear cost, versus the EVM''s 32-byte words with quadratic expansion.'
    statement: >
      The EVM charges for memory with a quadratic term, which makes large working sets rapidly
      unaffordable and forces algorithms to be rewritten around the cost model. Stylus allocates
      memory in 64 KB pages priced near-linearly, with programs able to use up to 8 MB. That single
      change is what makes memory-heavy algorithms — large intermediate buffers, cryptographic
      workspaces, sizeable in-memory structures — feasible on-chain at all.
    volatility: evolving
    edges:
      - { to: stylus, type: requires }
      - { to: memory-expansion-quadratic, type: contrasts }
    sources: [arbitrum-stylus-vm-differences]
  - id: activation
    title: 'Activation'
    oneLine: 'Stylus code must be activated once on-chain — the WASM is compiled to native code and cached — which is why execution is fast and deployment has an extra step.'
    statement: >
      Deploying Stylus code is two operations, not one. After the WASM is posted, it must be
      activated: the chain compiles it to native code and caches the result, which is what makes
      subsequent execution fast. Activation costs gas and is a distinct transaction your deployment
      script has to perform and your runbook has to know about. The cost was not verifiable from
      documentation, so measure it on a testnet deployment before budgeting for it.
    volatility: evolving
    edges:
      - { to: stylus, type: requires }
      - { to: reactivation, type: deepens }
    sources: [arbitrum-stylus-gentle-intro, arbitrum-stylus-vm-differences]
  - id: reactivation
    title: 'Reactivation'
    oneLine: 'Activated programs expire and must be reactivated periodically or after chain upgrades; a deployed Stylus contract is not permanently live the way a Solidity one is.'
    statement: >
      An activated Stylus program does not stay activated forever. Arbitrum's documentation states
      that programs need reactivating periodically and after chain upgrades, which creates an
      ongoing operational obligation with no Solidity equivalent — a contract can stop being
      callable because nobody performed a maintenance transaction. The exact cadence is described
      ambiguously in the docs and was not resolved during research, so confirm the current rule
      before relying on any interval.
    volatility: evolving
    edges:
      - { to: activation, type: requires }
    sources: [arbitrum-stylus-gentle-intro, arbitrum-stylus-troubleshooting]
    misconceptions:
      - belief: 'A deployed Stylus contract stays live forever, like a Solidity one.'
        reality: 'Activated programs need reactivation periodically and after chain upgrades. It is a maintenance obligation, not a one-time deployment.'
        why: 'EVM deployment is genuinely permanent, so nobody thinks to ask.'
        source: arbitrum-stylus-gentle-intro
  - id: missing-evm-features
    title: 'What does not survive the port'
    oneLine: 'No inline assembly, no `selfdestruct`, no Solidity modifiers — idioms carried straight over from Solidity will not compile.'
    statement: >
      Stylus is a different machine with a different language, and several Solidity idioms have no
      counterpart: inline assembly, `selfdestruct`, and modifiers among them, with storage layout
      and access patterns expressed differently in the SDK. A mechanical port therefore does not
      work; the code has to be rewritten around Rust's own structure. Note also that the two
      Arbitrum documentation pages give different maximum contract sizes — one states 96 KB, the
      other a MaxWasmSize default of 128 KB raised to 256 KB at ArbOS 61 and above — and they
      appear to measure different things, so check against the chain you are deploying to.
    volatility: evolving
    edges:
      - { to: coequal-wasm-vm, type: requires }
    sources: [arbitrum-stylus-vm-differences, arbitrum-stylus-troubleshooting]
    misconceptions:
      - belief: 'I can port my Solidity contract to Rust mechanically.'
        reality: 'No inline assembly, no `selfdestruct`, no modifiers, and different storage idioms. It is a rewrite.'
        source: arbitrum-stylus-vm-differences
  - id: stylus-use-case-shape
    title: 'The shape of a good Stylus use case'
    oneLine: 'Stylus wins where the workload is compute- or memory-bound and wins nothing where it is storage-bound.'
    statement: >
      The decision rule follows directly from the cost model. Compute- and memory-bound workloads —
      proof verification, custom cryptography, unusual pricing curves, on-chain games and
      generative art — are where the cheaper compute and linear memory pricing pay for themselves.
      Storage-bound workloads — a standard token, an NFT, ordinary vault accounting — gain nothing
      and pay the activation overhead. Mixed products should split at the ABI boundary rather than
      choosing one language for everything.
    volatility: evolving
    edges:
      - { to: compute-is-cheap-storage-is-not, type: requires }
      - { to: page-based-memory, type: requires }
      - { to: abi-is-the-boundary, type: applies }
    sources: [arbitrum-stylus-gentle-intro, arbitrum-stylus-vm-differences]
  - id: rust-does-not-mean-safe-contracts
    title: 'Rust removes memory-safety bugs, not blockchain bugs'
    oneLine: 'Rust gives memory safety and the SDK guards the storage cache; access control and oracle manipulation are untouched by either.'
    statement: >
      Rust's guarantees are about memory safety, a different failure class from the one that empties
      contracts. The Stylus SDK does add one contract-level protection: its high-level `call`,
      `static_call` and `delegate_call` flush or clear the storage cache before invoking another
      contract, so cached values cannot go stale across reentry, and the older `reentrant` feature
      flag and `deny_reentrant` guard are deprecated as of SDK 0.10.5. Read what that protection
      actually claims — the documentation says it protects your storage and is only part of
      defending against exploits, and still directs you to checks-effects-interactions and to
      auditing reentrant code. Missing access control and oracle manipulation are outside its scope
      entirely and behave exactly as they do in Solidity.
    volatility: evolving
    edges:
      - { to: stylus, type: requires }
      - { to: reentrancy-classic, type: recommends }
      - { to: access-control-failure, type: recommends }
    sources: [arbitrum-stylus-rust-sdk-guide, arbitrum-stylus-vm-differences]
    misconceptions:
      - belief: 'Writing contracts in Rust makes them safer.'
        reality: 'Rust eliminates memory-safety bugs, a class that was never the cause of DeFi losses. The SDK''s reentrancy handling protects the storage cache, not your invariants, and access control and oracle bugs are identical to Solidity''s.'
        why: 'Rust''s safety reputation transfers by association.'
        source: arbitrum-stylus-rust-sdk-guide
