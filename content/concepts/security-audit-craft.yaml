moduleId: security-audit-craft
concepts:
  - id: finding-anatomy
    title: Anatomy of a finding
    oneLine: Title, severity, difficulty, type, target at a commit, description, exploit scenario, recommendation, client response.
    statement: >
      A finding has a fixed structure because each part does a different job. The title names the defect
      rather than the symptom. Severity, difficulty and type let a reader triage without reading further.
      The target pins file, lines and commit hash. The description explains what the code does and why that
      is wrong. The exploit scenario supplies the narrative. The recommendation gives a short-term fix and a
      long-term change to the reason the bug was possible. The client response closes the loop.
    volatility: stable
    edges:
      - { to: post-mortem-reading, type: contrasts }
    sources: [tob-publications-repo, cyfrin-audit-reports-repo]

  - id: exploit-scenario
    title: Exploit scenario
    oneLine: A concrete narrative — who, with what capability, in what order, gains what — that turns a concern into a finding.
    statement: >
      The exploit scenario names an actor, states the capability that actor holds, gives the ordering of
      actions, and states what the actor obtains. It is the section that converts an argument about code
      into a claim about consequences, which is what a client can prioritise against. A finding whose
      scenario cannot be written concretely is usually either informational or not yet understood.
    volatility: stable
    edges:
      - { to: finding-anatomy, type: requires }
      - { to: threat-scenario, type: requires }
    sources: [tob-publications-repo, tob-blockchain-maturity]

  - id: poc-as-proof
    title: Proof of concept as proof
    oneLine: A runnable reproduction turns an argument into a fact, and is now expected for high-severity findings.
    statement: >
      A runnable proof of concept - typically a Foundry test against the client's repository at the audited
      commit - removes the argument about whether the finding is real. It is increasingly expected for high
      severity, and on competitive platforms a high-severity claim without one is routinely downgraded or
      dismissed. The proof of concept also becomes the regression test the fix is validated against.
    volatility: evolving
    edges:
      - { to: exploit-scenario, type: requires }
      - { to: shrinking, type: applies }
    sources: [cyfrin-audit-reports-repo, code4rena-awarding]

  - id: severity-vs-difficulty
    title: Severity versus difficulty
    oneLine: Two independent axes — how bad if exploited, and how hard to exploit — that collapse into one only at a cost.
    statement: >
      Severity answers how bad the consequence is if the issue fires; difficulty answers how hard it is to
      make it fire. Trail of Bits reports them as separate axes with difficulty rated Low when the pattern
      is commonly exploited with public tooling, Medium when the attacker must write an exploit or hold
      in-depth knowledge, High when privileged access or the discovery of further weaknesses is required,
      and Undetermined when not assessed. Collapsing the two into a single risk score discards exactly the
      information a client needs to sequence remediation.
    volatility: stable
    edges:
      - { to: finding-anatomy, type: requires }
      - { to: impact-likelihood-matrix, type: contrasts }
    sources: [tob-blockchain-maturity, tob-publications-repo]
    misconceptions:
      - belief: Severity and likelihood are the same axis.
        reality: A High severity with Low difficulty and a High severity with High difficulty demand different responses on different timelines.
        why: Most risk registers outside this field carry one number.
        source: tob-blockchain-maturity

  - id: impact-likelihood-matrix
    title: Impact-by-likelihood matrix
    oneLine: The competitive-audit convention, where severity is derived from impact times likelihood — and it does not translate.
    statement: >
      Competitive platforms derive a single severity from impact and likelihood. This is a different
      function of different inputs from the firm convention of severity by difficulty, and the two do not
      translate cleanly: an issue that is catastrophic but requires privileged access lands in different
      places under each. A reader of any report must therefore know which convention produced its labels
      before comparing severities across reports.
    volatility: evolving
    edges:
      - { to: severity-vs-difficulty, type: requires }
      - { to: judging-and-escalation, type: applies }
    sources: [sherlock-judging, code4rena-awarding]

  - id: informational-vs-finding
    title: Informational versus finding
    oneLine: Style, gas and hardening notes are real value, and inflating them into vulnerabilities destroys a report's credibility.
    statement: >
      Observations that do not describe a path to loss belong in an informational or code-quality section,
      not in the findings list. Mixing them in inflates the count, trains the client to skim, and devalues
      the findings that matter. The incentive to inflate comes from contests that score on volume, and it
      transfers badly into professional work where the reader is one engineer deciding what to fix this
      week.
    volatility: stable
    edges:
      - { to: finding-anatomy, type: requires }
      - { to: severity-inflation, type: contrasts }
    sources: [tob-publications-repo, secureum-audit-techniques]

  - id: false-positive-cost
    title: The cost of a wrong finding
    oneLine: A wrong finding costs the client engineering time and costs you credibility on the next one.
    statement: >
      Verifying a finding before reporting it is part of the craft, because a false positive is not neutral:
      it consumes the client's engineering time, and it lowers the prior they apply to everything else you
      submit. The practical control is that anything you would rate high or medium gets a reproduction
      first, and anything you cannot reproduce gets reported as a question rather than as a claim.
    volatility: stable
    edges:
      - { to: exploit-scenario, type: requires }
      - { to: poc-as-proof, type: requires }
    sources: [tob-publications-repo, secureum-audit-techniques]
    misconceptions:
      - belief: A good auditor finds the most bugs.
        reality: A good auditor produces findings that get fixed, with correct severity and a reproduction; a wrong or inflated finding has negative value.
        why: Contests score on finding count, which distorts the perception of the job.

  - id: code-maturity-assessment
    title: Codebase maturity assessment
    oneLine: A separate deliverable rating the codebase by category, so a client with zero criticals still learns whether they were lucky.
    statement: >
      The maturity assessment is a second deliverable alongside the findings, rating the codebase across a
      fixed set of categories with evidence for each rating. It exists because a finding count is a poor
      measure of a codebase's health: a project can produce no critical findings in a short engagement and
      still rate weak on testing, documentation and decentralisation, which predicts the next engagement's
      results better than this one's count does.
    volatility: stable
    edges:
      - { to: finding-anatomy, type: requires }
    sources: [tob-blockchain-maturity, tob-publications-repo]
    misconceptions:
      - belief: Zero critical findings means the codebase is healthy.
        reality: That is precisely why the maturity assessment exists; a codebase with no findings can still rate weak on testing, documentation and decentralisation.
        why: A finding count is the only number in the report that looks like a score.
        source: tob-blockchain-maturity

  - id: maturity-category
    title: Maturity categories
    oneLine: A fixed set of axes — arithmetic, monitoring, access control, complexity, decentralisation, documentation, ordering risk, low-level code, testing.
    statement: >
      The assessment uses a fixed category list so ratings are comparable across engagements and across
      codebases. Trail of Bits publishes the set it rates against as nine: arithmetic, auditing,
      authentication and access controls, complexity management, decentralization, documentation,
      low-level manipulation, transaction ordering risks, and testing and verification. Read as
      questions, those ask: are rounding directions consistent and reasoned about; are events emitted
      for everything an incident responder would need; is there an enumerable role and capability
      matrix; can a reviewer hold a function in their head; what can the admin key do and how fast; do
      the specifications state invariants or only the happy path; is the protocol safe under adversarial
      ordering; is low-level code justified and reviewed; and do the tests encode invariants or only
      paths. That list is one firm's, adjusted per engagement by its own account; category names vary
      between firms and should be copied verbatim from the report you are working under.
    volatility: evolving
    edges:
      - { to: code-maturity-assessment, type: requires }
    sources: [tob-publications-repo, tob-blockchain-maturity]

  - id: maturity-rating
    title: Maturity ratings
    oneLine: Each category rated on an ordinal scale — and the scale's exact values are a property of the report, not of the industry.
    statement: >
      Each category receives an ordinal rating. Trail of Bits describes its scale as weak, moderate,
      satisfactory or strong. Reports in circulation also show values outside that four, for categories
      that were not applicable to the scope or that the engagement did not examine, and this track could
      not establish a single authoritative list. Treat the scale as report-local: read every rating
      against the legend printed in the report that produced it, and never read a category's absence as
      a pass.
    volatility: evolving
    edges:
      - { to: maturity-category, type: requires }
    sources: [tob-publications-repo, tob-blockchain-maturity]

  - id: scope-statement
    title: Scope statement
    oneLine: What was reviewed, at which commit, under which assumptions — the part of a report that defines what audited means.
    statement: >
      The scope statement fixes the files reviewed, the commit hash, the chains and configurations
      considered, and the assumptions granted - typically that the admin is honest, that the oracle is
      correct, that dependencies are as published. Everything outside it was not looked at. It is the first
      section a reader should open and the one most often skipped, because it converts audited from a badge
      into a checkable claim.
    volatility: stable
    edges:
      - { to: finding-anatomy, type: requires }
      - { to: trust-assumption-inventory, type: requires }
    sources: [tob-publications-repo, cyfrin-audit-reports-repo]
    misconceptions:
      - belief: Audited is a property of a protocol.
        reality: It is a property of a commit, under a scope, for a number of engineer-weeks; the deployed code may differ from the reviewed code entirely.
        why: The word is used in marketing without any of its qualifiers.
        source: tob-publications-repo

  - id: engineer-weeks
    title: Engineer-weeks
    oneLine: Effort published on the report, and the single best available proxy for how much assurance the engagement bought.
    statement: >
      Trail of Bits states the engineer-weeks spent on every published report, which makes effort
      comparable across engagements. The comparison is instructive: a six engineer-week review of a novel,
      extremely high-value codebase and a forty-seven engineer-week review of a different system are
      different products, and the difference explains more about finding density than the firm's name does.
      Reading effort alongside scope is how a reader forms an expectation before opening the findings.
    volatility: stable
    edges:
      - { to: scope-statement, type: requires }
    sources: [tob-publications-repo, tob-reports-index]
    misconceptions:
      - belief: A more expensive firm produces a better outcome.
        reality: Engineer-weeks, scope, and the maturity of the codebase going in explain more of the variance than the logo does.
        why: Firm reputation is visible and effort figures are inside the report.
        source: tob-publications-repo

  - id: fix-review
    title: Fix review
    oneLine: The follow-up pass confirming the fixes are correct and introduced nothing new.
    statement: >
      A fix review re-examines each reported issue against the remediation commit, confirms the fix is
      correct and complete, and checks that it introduced no new issue. Without one, the report describes a
      commit that no longer exists, and the most common failure mode is a fix that resolves the reported
      instance while leaving the same pattern elsewhere in the codebase.
    volatility: stable
    edges:
      - { to: scope-statement, type: requires }
    sources: [tob-publications-repo, cyfrin-audit-reports-repo]

  - id: audit-is-not-a-guarantee
    title: An audit bounds risk, it does not remove it
    oneLine: A time-boxed review of a specific commit under a specific scope by humans with a budget.
    statement: >
      An audit is a sampling process with a deadline. It bounds risk by the amount of expert attention
      purchased, within a declared scope, at one commit. Bugs persist past audits and past contests, which
      is the empirical case for running a bug bounty afterwards rather than treating the report as
      completion. The correct reading of a clean report is that a specified amount of skilled attention
      found nothing in a specified place.
    volatility: stable
    edges:
      - { to: scope-statement, type: requires }
      - { to: bug-bounty, type: applies }
    sources: [tob-publications-repo, immunefi-long-running-programs]
    misconceptions:
      - belief: A protocol that has been audited is done with security.
        reality: Vendor research on long-running bounty programs reports that the overwhelming majority eventually surfaced a critical bug, so bugs persist past audits and contests.
        why: The report arrives as a deliverable, which reads as completion.
        source: immunefi-long-running-programs
