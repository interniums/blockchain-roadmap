moduleId: security-contests
concepts:
  - id: audit-contest
    title: Audit contest
    oneLine: A fixed prize pool, a fixed window, a frozen commit, and a pool split across everyone who found each valid bug.
    statement: >
      An audit contest opens a frozen pre-deployment commit to any participant for a window of roughly one
      to four weeks, then splits a fixed pool according to what each participant found. Judging decides
      validity, severity and duplication, and the award calculation takes those as inputs. Because the pool
      is fixed and shared, the marginal value of a finding depends on how many other people found it, which
      is the structural difference from every other form of security work.
    volatility: hot
    edges:
      - { to: finding-anatomy, type: requires }
      - { to: bug-bounty, type: contrasts }
    sources: [code4rena-awarding, sherlock-protocols-how-it-works]

  - id: bug-bounty
    title: Bug bounty
    oneLine: An open-ended program against live deployed code where the first valid reporter of a bug takes the whole payout.
    statement: >
      A bug bounty runs continuously against code that is deployed and holding funds, and pays one reporter
      per bug rather than splitting. There is no window, no frozen commit, and no duplicate split - only a
      race. The optimal strategy is therefore the opposite of a contest's: depth on a single target over a
      long period, with a working exploit, rather than breadth across a codebase inside a deadline.
    volatility: hot
    edges:
      - { to: audit-contest, type: requires }
      - { to: audit-is-not-a-guarantee, type: requires }
    sources: [immunefi-bug-bounty, immunefi-payouts]
    misconceptions:
      - belief: Contests and bug bounties are interchangeable ways to get paid for finding bugs.
        reality: Contests split a fixed pool across all finders of frozen pre-deployment code; bounties pay one reporter for a bug in live code, and the optimal strategy differs completely.
        why: Both are described as getting paid to find bugs.
        source: immunefi-bug-bounty

  - id: contest-as-training
    title: Contests as training
    oneLine: For most participants the realistic return is calibration and reputation, not income.
    statement: >
      Two structural facts set a newcomer's expectation. A contest's award for an issue is divided among
      everyone who reported it and reduced further by a decay factor, so the findings a first-timer is
      most likely to reach are the ones worth least. And the platforms publish leaderboards of top
      earners but no distribution of participant outcomes, so nobody can tell you the odds. What a
      contest reliably returns instead is a calibrated sense of what the severity labels mean, a set of
      findings you can show, and the experience of reading the final report against your own submissions
      - particularly the findings you saw and dismissed. CodeHawks makes that reading explicit by running
      a tier with no monetary pool at all. Budget a first contest as a course rather than as freelance
      work.
    volatility: evolving
    edges:
      - { to: audit-contest, type: requires }
    sources: [code4rena-awarding, codehawks-first-flights-docs, audit-competitions-guide]
    misconceptions:
      - belief: Competitive auditing is a reliable income source for a newcomer.
        reality: No trustworthy figures on participant outcomes exist, and the duplicate arithmetic means common findings pay almost nothing; treat the first attempts as training.
        why: Published leaderboards show top earners and not the distribution.

  - id: duplicate-split
    title: Duplicate split
    oneLine: Everyone who reports the same bug shares that bug's award, so a popular finding pays far less than a rare one.
    statement: >
      When several participants report the same issue, that issue's award is divided among them. The
      obvious findings in any contest are duplicated many times over, so their per-person value collapses,
      while a valid finding nobody else reported retains the whole slice. This is why submitting more
      findings is not a strategy, and why the last day of a contest is better spent going deeper on one
      area than skimming another.
    volatility: hot
    edges:
      - { to: audit-contest, type: requires }
    sources: [code4rena-awarding, code4rena-awarding-process]

  - id: share-formula
    title: The share formula
    oneLine: The mechanical rule converting severity and duplicate count into a payout slice — read it from the platform, not from a summary.
    statement: >
      Each platform publishes an award calculation whose inputs are the risk level, the validity ruling, the
      number of duplicates, and a ranking of submission quality. On at least one platform the per-person
      value decays faster than one over the duplicate count, because a decay factor is applied in addition
      to the division, and the submission selected for inclusion in the report receives a bonus slice - so
      write-up quality is directly monetised. The exact coefficients circulate in secondary summaries that
      this track could not confirm against the platform's own awarding documentation, so read the formula
      from the source before relying on it.
    volatility: hot
    edges:
      - { to: duplicate-split, type: requires }
      - { to: poc-as-proof, type: applies }
    sources: [code4rena-awarding, code4rena-awarding-process]
    misconceptions:
      - belief: More submissions means more money.
        reality: The award is divided by the duplicate count and reduced further by a decay factor, so common findings pay almost nothing and one solo Medium can beat ten duplicated ones.
        why: Volume is the only input a participant fully controls.
        source: code4rena-awarding-process
      - belief: Writing quality does not affect the payout.
        reality: The submission selected for the report receives a bonus slice, and judges rank submissions for quality as an input to the calculation.
        why: The finding is assumed to be the product, and the write-up merely its packaging.
        source: code4rena-awarding-process

  - id: solo-finding
    title: Solo finding
    oneLine: A valid finding with no duplicates — the entire economics of contest participation rests on these.
    statement: >
      A solo finding is one nobody else reported, and it retains an undivided slice. Since the widely
      reachable bugs are duplicated heavily, expected return is driven almost entirely by whether you found
      something in a place other participants did not look. That makes target selection - an unglamorous
      integration, a migration path, an edge of the state space - a more consequential decision than
      reviewing speed.
    volatility: evolving
    edges:
      - { to: duplicate-split, type: requires }
    sources: [code4rena-awarding-process, audit-competitions-guide]

  - id: known-issues-exclusion
    title: Known issues exclusion
    oneLine: Anything already listed in known issues, prior audits, or the automated-findings appendix is invalid.
    statement: >
      Contests publish a known-issues list, links to prior audit reports, and an appendix of findings
      already produced by automated tooling, and anything appearing there is out of scope regardless of
      severity. Reading those documents before the code is the single highest-value hour in a contest,
      because a large share of first-time submissions are invalidated here rather than on technical merit.
    volatility: evolving
    edges:
      - { to: scope-statement, type: requires }
      - { to: audit-contest, type: requires }
    sources: [code4rena-awarding, sherlock-protocols-how-it-works]
    misconceptions:
      - belief: Anything you find in the code counts.
        reality: Known issues, prior-audit findings and the automated-findings appendix are all excluded, and that invalidates a large share of first-timer submissions.
        why: Nobody reads the contest README to the end.

  - id: first-flight
    title: First Flight
    oneLine: A beginner tier of small, deliberately approachable codebases that pays in experience points rather than money.
    statement: >
      CodeHawks runs First Flights: competitions on smaller codebases with, in the platform's own words,
      different reward mechanisms from its standard competitions - no monetary prize pool, only experience
      earned by submitting findings and a leaderboard position. The programme is stated to increase in
      complexity over time. That makes it the correct entry point, because a three-thousand-line contest
      is not a beginner exercise - it is a way to spend two weeks and submit nothing valid. The cadence
      and structure of the programme change, so check the platform before planning around it.
    volatility: hot
    edges:
      - { to: contest-as-training, type: requires }
    sources: [codehawks-first-flights-docs, sch-competitions-tracker]

  - id: judging-and-escalation
    title: Judging and escalation
    oneLine: A post-submission phase where validity, severity and duplication are decided, and where decisions can be contested at a cost.
    statement: >
      After submissions close, judging determines validity, severity and duplication, and participants may
      formally contest rulings within a bounded window. Sherlock's timeline is volume-scaled and published:
      real-time judging runs for the issue count divided by one hundred in days with a two-day minimum, lead
      judging for the count divided by two hundred with the same minimum, escalation is a twenty-four-hour
      window after preliminary results, and final judgments run for the controversial-issue count divided by
      twenty, again with a two-day minimum. On platforms where judges are paid from the pool, judging is a
      scalable role rather than volunteer work.
    volatility: hot
    edges:
      - { to: audit-contest, type: requires }
      - { to: impact-likelihood-matrix, type: requires }
    sources: [sherlock-judging, sherlock-community-judging]

  - id: signal-score
    title: Signal score
    oneLine: A reputation currency spent to escalate and to comment, which makes frivolous escalation expensive.
    statement: >
      Sherlock prices participation in judging with a reputation currency: escalating a ruling and
      commenting on other participants' issues both draw on it. The design consequence is the one worth
      internalising - being right is not sufficient, you must also be able to afford to argue, so escalation
      should be reserved for cases where you have a mechanism the judge missed rather than a disagreement
      about severity. The specific costs and thresholds come from secondary summaries this track could not
      confirm against the platform docs.
    volatility: hot
    edges:
      - { to: judging-and-escalation, type: requires }
    sources: [sherlock-watsons, sherlock-judging]

  - id: severity-inflation
    title: Severity inflation
    oneLine: Submitting Lows as Highs to fish for a favourable ruling — visible to judges across your history, and penalised.
    statement: >
      Severity inflation is deliberately overstating a finding's severity in the hope that a judge settles
      somewhere favourable. On platforms with reputation scoring the pattern is visible across a
      participant's history and is penalised, and in professional work the same habit destroys the
      credibility of every subsequent finding. The counter-discipline is to state severity as you believe it
      and to argue only with a mechanism.
    volatility: evolving
    edges:
      - { to: informational-vs-finding, type: requires }
      - { to: false-positive-cost, type: requires }
    sources: [sherlock-watsons, sherlock-judging]

  - id: primacy-of-impact
    title: Primacy of impact
    oneLine: A bug's severity follows the demonstrated impact on assets, even where the specific asset or path was not enumerated in scope.
    statement: >
      Under primacy of impact, a report is judged by the impact demonstrated against assets rather than by
      whether the specific contract or code path appeared in the program's enumerated scope. Severity may
      still be reduced where exploitation requires elevated privileges or unusual user interaction. It is
      the rule that makes a bounty program's scope a floor rather than a ceiling, and whether it applies is
      stated per program.
    volatility: evolving
    edges:
      - { to: bug-bounty, type: requires }
      - { to: primacy-of-rules, type: contrasts }
    sources: [immunefi-bug-bounty]

  - id: primacy-of-rules
    title: Primacy of rules
    oneLine: The opposite default — the program's written terms bound what is payable regardless of impact.
    statement: >
      Under primacy of rules, the program's own written terms determine what is in scope and payable, and a
      demonstrated impact outside those terms is not rewarded. Every bounty program declares which of the
      two defaults it operates under, and reading that declaration before spending time on a target is the
      difference between research and unpaid work.
    volatility: evolving
    edges:
      - { to: primacy-of-impact, type: requires }
    sources: [immunefi-bug-bounty]

  - id: proof-of-assets-vault
    title: Proof-of-assets vault
    oneLine: An on-chain vault letting a program prove it holds the funds it advertises, with payouts executed on-chain.
    statement: >
      A proof-of-assets vault holds the program's advertised bounty funds on-chain, so a researcher can
      verify before starting that the ceiling is backed, and payouts execute on-chain from the same
      dashboard. It addresses the historical complaint that advertised maximum bounties were aspirational.
      Lifetime payout totals published by bounty platforms conflict between sources and are not stated here.
    volatility: hot
    edges:
      - { to: bug-bounty, type: requires }
    sources: [immunefi-payouts, immunefi-bug-bounty]
