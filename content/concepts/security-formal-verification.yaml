moduleId: security-formal-verification
concepts:
  - id: smt-solver
    title: SMT solver
    oneLine: The engine that decides whether the accumulated constraints have a satisfying assignment; every verification tool compiles into one.
    statement: >
      A satisfiability-modulo-theories solver decides whether a formula over bit-vectors, arrays and
      arithmetic has a satisfying assignment. Every formal verification tool in this space is a compiler
      from code plus specification into such a formula, so the solver's capabilities and its failure modes
      are the tool's capabilities and failure modes. It returns one of three answers - satisfiable with a
      witness, unsatisfiable, or no answer within the resources given.
    volatility: stable
    edges:
      - { to: symbolic-execution, type: requires }
      - { to: formal-verification, type: requires }
    sources: [certora-gentle-intro, a16z-halmos-repo]

  - id: counterexample
    title: Counterexample
    oneLine: The solver's witness when a property fails — a concrete input and state that violates it.
    statement: >
      When the negation of a property is satisfiable, the solver returns a concrete assignment: the input
      values and starting state under which the property is false. In practice this is the main output of
      formal verification, more useful day to day than the proofs, because it converts an abstract claim
      into a reproducible test case. A counterexample that turns out to be unreachable in the real system
      is a signal that the specification's preconditions are too weak, not that the tool is wrong.
    volatility: stable
    edges:
      - { to: smt-solver, type: requires }
      - { to: poc-as-proof, type: applies }
    sources: [a16z-halmos-post, certora-gentle-intro]

  - id: bounded-verification
    title: Bounded verification
    oneLine: Verification up to N loop iterations and N call depth — sound inside the bound, silent outside it.
    statement: >
      Bounded verification unrolls loops and call chains to a fixed depth and proves the property over that
      truncated execution tree. Within the bound the result is a genuine proof over all inputs; beyond it
      there is no claim at all. The bound is therefore part of the result and must be reported with it - a
      report saying a property was verified without saying to what depth has not said anything checkable.
    volatility: stable
    edges:
      - { to: symbolic-execution, type: requires }
      - { to: unbounded-verification, type: contrasts }
    sources: [a16z-halmos-post, kontrol-docs]
    misconceptions:
      - belief: Halmos does full formal verification.
        reality: It is explicitly bounded; it verifies up to the loop and call-depth limits you supply, and says nothing past them.
        why: Both bounded and unbounded tools report the same word, verified.
        source: a16z-halmos-post

  - id: unbounded-verification
    title: Unbounded verification
    oneLine: Reasoning about loops through invariants rather than unrolling, so the result covers arbitrary iteration counts.
    statement: >
      Unbounded verification proves a property for any number of iterations by reasoning inductively over a
      loop invariant rather than by enumerating iterations. The result is stronger than any bound, and the
      cost is that somebody must supply the invariant, or the tool must infer one. This is the structural
      difference between the heavyweight prover and the bounded symbolic testers, and it is why they are
      not syntax variants of each other.
    volatility: stable
    edges:
      - { to: bounded-verification, type: requires }
      - { to: certora-prover, type: applies }
    sources: [certora-gentle-intro, certora-prover-repo]
    misconceptions:
      - belief: Halmos and Certora do the same thing with different syntax.
        reality: Halmos is bounded; Certora reasons unbounded and quantifies rules over all methods, so they prove structurally different statements.
        why: Both accept properties and both emit counterexamples.
        source: a16z-halmos-post

  - id: loop-invariant
    title: Loop invariant
    oneLine: The hand-supplied property that makes unbounded loop reasoning possible — and the main manual cost.
    statement: >
      A loop invariant is a property true before the loop, preserved by every iteration, and strong enough
      together with the exit condition to imply what you want after the loop. Supplying one is what lets a
      prover discharge a loop without unrolling it, and writing one for non-trivial arithmetic is where
      most of the expert time in a verification engagement goes.
    volatility: stable
    edges:
      - { to: unbounded-verification, type: requires }
    sources: [kontrol-docs, certora-gentle-intro]

  - id: spec-language-cost
    title: The specification is the cost
    oneLine: Running the tool has an install command; writing a specification that is both true and non-trivial does not.
    statement: >
      The dominant cost of formal verification is authoring a specification that is simultaneously true of
      the intended system and strong enough to be worth proving, then keeping it correct as the code
      changes. A dedicated specification language is a separate language with its own semantics to learn.
      An unmaintained specification is worse than none, because it produces confidence about a contract
      that no longer exists.
    volatility: stable
    edges:
      - { to: formal-verification, type: requires }
      - { to: invariant-as-spec, type: requires }
    sources: [certora-gentle-intro, allthingsfuzzy-fv-practice]
    misconceptions:
      - belief: The hard part of formal verification is running the tool.
        reality: The hard parts are writing a specification that is both true and non-trivial, and keeping it alive as the code changes.
        why: The tool has an install command; the specification does not.

  - id: spec-as-test-reuse
    title: Specification by test reuse
    oneLine: Turn existing Foundry tests into specifications by making their inputs symbolic — near-zero adoption cost, weaker properties.
    statement: >
      Tools that take an existing test suite and replace concrete inputs with symbolic ones let a project
      start proving things in an afternoon, with no new language and no licence. The properties obtained
      are only as strong as the assertions the tests already contained, which are typically about specific
      scenarios rather than about the system, so the technique upgrades an existing suite rather than
      producing a specification.
    volatility: evolving
    edges:
      - { to: spec-language-cost, type: requires }
      - { to: halmos, type: applies }
      - { to: parametric-rule, type: contrasts }
    sources: [a16z-halmos-post, kontrol-docs]
    misconceptions:
      - belief: Reusing Foundry tests makes Kontrol as cheap to adopt as Halmos.
        reality: Reaching non-trivial results in a KEVM-based tool usually requires lemmas and loop invariants, which is a real expertise cost.
        why: Both advertise the same entry point, your existing tests.
        source: kontrol-docs

  - id: parametric-rule
    title: Parametric rule
    oneLine: A rule quantified over all public methods, so new functions are covered automatically as the codebase grows.
    statement: >
      A parametric rule states a property over an arbitrary method of the contract rather than over a named
      one - for example that no method other than mint may increase total supply. Its value is temporal: a
      function added six months later is inside the rule's scope without anyone remembering to extend the
      specification, which is exactly where hand-written property lists rot.
    volatility: stable
    edges:
      - { to: spec-language-cost, type: requires }
      - { to: certora-prover, type: requires }
    sources: [certora-gentle-intro, certora-prover-repo]

  - id: ghost-and-hook
    title: Ghosts and hooks
    oneLine: Track a quantity the contract does not store by hooking its storage writes — the prover's analogue of a fuzz ghost variable.
    statement: >
      A ghost is specification-level state, and a hook updates it whenever the contract performs a matching
      storage operation. Together they let a rule refer to quantities the contract never computes, such as
      the running sum of all balances, which is what makes conservation properties expressible at all. It
      is the same idea as a ghost variable in a fuzz harness, moved into the specification layer.
    volatility: stable
    edges:
      - { to: ghost-variable, type: requires }
      - { to: parametric-rule, type: requires }
    sources: [certora-gentle-intro]

  - id: summarization
    title: Summarization
    oneLine: Replacing a called function's body with a specified approximation so the solver can finish — and moving that function outside the proof.
    statement: >
      A summary substitutes an approximation for a called function's behaviour so the formula stays
      tractable. It is standard practice and often unavoidable, and it has a precise consequence: the
      summarized function is no longer being verified, and its real behaviour is now an assumption you own.
      Every summary in a report is a hole in the region the proof covers, and the report's list of them is
      more informative than its list of passing rules.
    volatility: stable
    edges:
      - { to: formal-verification, type: requires }
    sources: [certora-gentle-intro]
    misconceptions:
      - belief: Summarizing a called contract is a harmless performance trick.
        reality: It moves the summarized function outside the proof; every summary is an assumption you have taken on.
        why: It is the standard advice for making a proof terminate.
        source: certora-gentle-intro

  - id: optimistic-assumption
    title: Optimistic assumption
    oneLine: A flag that assumes a hard case away — proofs succeed more often and mean less.
    statement: >
      An optimistic assumption is a tool setting that discharges a difficult obligation by assuming it
      holds: that loops terminate within the unroll bound, that hashes do not collide, that a dispatched
      call resolves to a known implementation. Each one converts a case the solver could not decide into a
      case it does not consider. Enumerating which ones were enabled is part of reading any verification
      result.
    volatility: evolving
    edges:
      - { to: summarization, type: requires }
      - { to: bounded-verification, type: requires }
    sources: [certora-prover-changelog, certora-gentle-intro]

  - id: verification-timeout
    title: Verification timeout
    oneLine: The dominant practical failure mode — the solver does not say false, it says nothing.
    statement: >
      A timeout is not a weak pass. The solver has returned no information about the property, and the only
      valid responses are to decompose the property, summarize something, tighten a bound, or change the
      encoding. Treating a timeout as probably fine is how an unverified property ends up listed among the
      verified ones, and timeouts look like flaky infrastructure, which is what makes the mistake easy.
    volatility: stable
    edges:
      - { to: smt-solver, type: requires }
    sources: [certora-gentle-intro, symbolic-execution-survey-2025]
    misconceptions:
      - belief: If the prover times out, the property is probably fine.
        reality: A timeout carries no information; the correct response is to decompose, summarize or bound, not to proceed.
        why: Timeouts resemble infrastructure flakiness rather than a result.

  - id: fv-scope-boundary
    title: The scope boundary of proving
    oneLine: Formal verification proves properties of code; it cannot see oracles, governance, key custody or the signing path.
    statement: >
      A proof covers the code inside the model. Everything outside it - the honesty and liveness of an
      oracle, the behaviour of governance, who holds the upgrade key, how a transaction is presented to a
      signer, what the compiler emitted - is outside the model by construction. Since the largest losses of
      2025 and 2026 occurred at exactly those boundaries, the highest assurance tier available for code is
      not the highest assurance tier available for a protocol.
    volatility: evolving
    edges:
      - { to: trust-boundary, type: requires }
      - { to: formal-verification, type: requires }
    sources: [tob-bybit-threat-model, certora-gentle-intro]
    misconceptions:
      - belief: Formal verification is the top assurance tier, so it subsumes audits and fuzzing.
        reality: It cannot see oracles, governance, key custody, upgrade procedure or front ends, which is where the largest recent losses occurred.
        why: The word proof implies completeness.
        source: tob-bybit-threat-model
      - belief: A verified contract cannot be exploited.
        reality: Euler had formal verification work behind it and still lost heavily through a path outside the specification.
        why: Verification is reported as a property of the contract rather than of the specification.

  - id: fv-roi
    title: When proving pays
    oneLine: It pays on stable, arithmetic-heavy, high-value code, and not where the risk is economic, operational or still changing weekly.
    statement: >
      Verification is worth its cost on fixed-point and arithmetic libraries, standard conformance,
      access-control matrices, small enumerable state machines, storage-layout safety, and frozen
      high-value code. It is not worth it on code that changes weekly, on systems whose risk sits in
      oracles, governance or key custody, or on teams who cannot maintain the specification after the
      engagement ends. Published cost figures for specification effort are practitioner folklore rather
      than measured results, so treat any hours-per-property number as an order of magnitude.
    volatility: evolving
    edges:
      - { to: fv-scope-boundary, type: requires }
      - { to: tool-stack-not-tool, type: requires }
    sources: [allthingsfuzzy-fv-practice, certora-gentle-intro]
