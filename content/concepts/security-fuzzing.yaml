moduleId: security-fuzzing
concepts:
  - id: invariant-testing
    title: Invariant testing
    oneLine: Stateful fuzzing where the oracle is a system-level invariant checked after every call in the sequence.
    statement: >
      Invariant testing drives random sequences of calls against accumulated state and evaluates a
      system-level invariant after each call. The invariant is the oracle: it is what makes the campaign
      capable of failing at all. A run that reports a pass is a statement about the states the sequence
      generator reached, so coverage, not the pass, is the number that carries information.
    volatility: stable
    edges:
      - { to: stateful-fuzzing, type: requires }
      - { to: system-level-invariant, type: requires }
    sources: [crytic-building-secure-contracts, crytic-echidna]
    misconceptions:
      - belief: A green fuzz campaign means the invariant holds.
        reality: It means no counterexample was found in the states reached; unreached states are unconstrained.
        why: The runner prints a pass, and passes are what test suites are read for.
        source: allthingsfuzzy-stateless-stateful

  - id: property-mode
    title: Property mode
    oneLine: Zero-argument boolean functions checked between calls, with state reverted after each check.
    statement: >
      In property mode the property is a function taking no arguments and returning a boolean, evaluated
      between generated calls, with the state change from the property evaluation itself discarded. It
      produces clean, readable properties about the state as a whole, and it cannot observe anything that
      exists only during a call - intermediate values, arguments, or mid-call inconsistency.
    volatility: stable
    edges:
      - { to: invariant-testing, type: requires }
      - { to: assertion-mode, type: contrasts }
    sources: [crytic-echidna, crytic-building-secure-contracts]

  - id: assertion-mode
    title: Assertion mode
    oneLine: Properties expressed as assertions inside the call, so mid-call state and the call's own arguments are in scope.
    statement: >
      In assertion mode the property is an assertion placed inside the code path being exercised, which
      makes the call's arguments and its intermediate state available to the check. This is what lets you
      state relational properties - that an output is a function of an input, that a value never decreases
      across this specific operation - which are invisible to a between-calls boolean.
    volatility: stable
    edges:
      - { to: property-mode, type: requires }
    sources: [crytic-echidna, crytic-medusa]

  - id: optimization-mode
    title: Optimization mode
    oneLine: Ask the fuzzer to maximise a value rather than to falsify a boolean — the question becomes how bad, not whether.
    statement: >
      Optimization mode instructs the fuzzer to search for the call sequence maximising a returned value,
      such as attacker profit, instead of searching for a violation of a boolean. For economic properties
      this is strictly more informative: it quantifies severity in the same run that finds the issue, and it
      reports something useful even when profit is bounded but non-zero, where an assertion that profit is
      exactly zero would simply fail.
    volatility: stable
    edges:
      - { to: assertion-mode, type: requires }
      - { to: economic-property, type: applies }
    sources: [crytic-echidna]

  - id: handler-contract
    title: Handler contract
    oneLine: A wrapper that restricts the fuzzer to realistic actions by realistic actors instead of raw external functions.
    statement: >
      A handler is a test-only contract that exposes a curated set of actions to the fuzzer, choosing the
      acting address from a bounded actor set, ordering prerequisites such as approvals, and recording
      ghost state. Without one, the fuzzer explores a call surface no real integration has, and reports
      counterexamples nobody can reach. Handlers look like they weaken the test; in practice they are what
      makes a campaign's findings actionable.
    volatility: stable
    edges:
      - { to: stateful-fuzzing, type: requires }
      - { to: invariant-testing, type: requires }
    sources: [crytic-building-secure-contracts, cyfrin-foundry-invariants]
    misconceptions:
      - belief: You should point the fuzzer directly at the deployed contracts.
        reality: Without a handler restricting actors and actions, the fuzzer explores an unrealistic call surface and produces findings nobody can reach.
        why: A handler feels like it hides part of the attack surface.
        source: cyfrin-foundry-invariants

  - id: input-clamping
    title: Input clamping
    oneLine: Bound fuzzed inputs to plausible ranges so the campaign spends its budget in reachable state rather than on reverts.
    statement: >
      Clamping maps an unconstrained fuzzed value into a plausible range - a deposit within the actor's
      balance, an index within an existing array, a timestamp within a sane window - using a bounding
      helper rather than rejecting the input. Rejection wastes the run; bounding reuses it. Over-clamping
      is the opposite failure, and is why the clamp bounds belong in the review of the harness alongside
      the properties.
    volatility: stable
    edges:
      - { to: handler-contract, type: requires }
    sources: [cyfrin-foundry-invariants, crytic-building-secure-contracts]

  - id: revert-blindness
    title: Revert blindness
    oneLine: A campaign where most calls revert has effectively no throughput; the revert rate is the first diagnostic.
    statement: >
      If the majority of generated calls revert, the campaign is executing almost no state transitions
      regardless of how many runs it reports. Measuring the revert rate and the coverage before extending
      the run time is therefore the first diagnostic step, and it is nearly always cheaper to fix the
      harness than to buy more compute.
    volatility: stable
    edges:
      - { to: input-clamping, type: requires }
    sources: [crytic-building-secure-contracts, cyfrin-foundry-invariants]
    misconceptions:
      - belief: The fuzzer will find it if you run it long enough.
        reality: An unclamped harness spends its whole budget on reverting calls; measuring revert rate and coverage beats adding runs.
        why: Run count is the visible knob and harness quality is not.
        source: crytic-building-secure-contracts

  - id: economic-property
    title: Economic property
    oneLine: An invariant about value rather than about data — solvency, no free money, fee monotonicity, path independence.
    statement: >
      An economic property constrains value flow rather than data structure: that the protocol can always
      meet its claims, that no sequence returns more than it put in, that fees never decrease with size,
      that splitting an operation never beats performing it whole. Most economic bugs are catchable with
      four such properties and need no agent simulation or price model, which is the opposite of the usual
      expectation.
    volatility: stable
    edges:
      - { to: system-level-invariant, type: requires }
      - { to: solvency-invariant, type: deepens }
    sources: [tob-invariant-driven-development, crytic-building-secure-contracts]
    misconceptions:
      - belief: Economic bugs require economic simulation to find.
        reality: Most are caught by solvency, conservation, monotonicity and path independence; the November 2025 Balancer V2 exploit was a path-independence and rounding violation.
        why: The word economic suggests agents and price models.
        source: blocksec-balancer-v2

  - id: path-independence
    title: Path independence
    oneLine: Splitting an operation into steps must never beat doing it in one, or the protocol has a free-money path.
    statement: >
      Path independence states that the result of an operation does not depend on how it was subdivided: n
      small deposits must never yield more shares than one deposit of the same total, and a swap split
      across several calls must never return more than the single swap. Violations are usually rounding
      asymmetries, they are cheap to express as a property, and repetition inside one transaction is what
      turns them into a loss.
    volatility: stable
    edges:
      - { to: economic-property, type: requires }
      - { to: rounding-direction-invariant, type: requires }
    sources: [blocksec-balancer-v2, crytic-building-secure-contracts]

  - id: round-trip-property
    title: Round-trip property
    oneLine: Decoding an encoding returns the original, and withdrawing a deposit never returns more than was put in.
    statement: >
      A round-trip property asserts that composing an operation with its inverse returns to the starting
      point, or fails safely in the protocol's favour. These need no domain knowledge, apply to encoding,
      share accounting, and any conversion pair, and are the highest yield per minute of any property
      family - which makes them the right first thing to write against unfamiliar code.
    volatility: stable
    edges:
      - { to: differential-fuzzing, type: contrasts }
      - { to: economic-property, type: requires }
    sources: [crytic-building-secure-contracts]

  - id: differential-fuzzing
    title: Differential fuzzing
    oneLine: Run the same inputs through two implementations and assert equal outputs; the oracle is the other implementation.
    statement: >
      Differential fuzzing removes the need to write a property by hand: feed identical inputs to two
      implementations of the same function and assert their outputs agree. Any disagreement is a bug in one
      of them. It is the cheapest way to test arithmetic you cannot easily characterise, and the standard
      application is comparing a new version of an upgradeable contract against the version it replaces.
    volatility: stable
    edges:
      - { to: stateless-fuzzing, type: requires }
      - { to: invariant-testing, type: contrasts }
    sources: [tob-diffusc, crytic-building-secure-contracts]

  - id: reference-model
    title: Reference model
    oneLine: The second implementation in a differential test — a prior version, a trusted library, or a model in another language.
    statement: >
      The reference does not have to be a full second implementation. It can be one library function, the
      previous version of the same contract, or an executable model written in another language; for the
      upgrade case the harness calling both versions with identical inputs can be generated automatically.
      Choosing the reference is choosing what you are willing to treat as correct, which is the real
      decision in a differential test.
    volatility: stable
    edges:
      - { to: differential-fuzzing, type: requires }
    sources: [crytic-diffusc, tob-diffusc]
    misconceptions:
      - belief: Differential fuzzing needs two full implementations.
        reality: The reference can be a single library function, a model in another language, or the previous version of the same contract.
        why: The word differential suggests two comparable systems.
        source: tob-diffusc

  - id: coverage-guided-fuzzing
    title: Coverage-guided fuzzing
    oneLine: Mutate the inputs that reached new code, rather than sampling blindly.
    statement: >
      A coverage-guided fuzzer records which code was reached by each input or sequence and preferentially
      mutates the ones that reached something new. This is the difference between a campaign that finds a
      multi-step bug in hours and one that never finds it, because reaching deep state by uniform random
      sampling is exponentially unlikely.
    volatility: stable
    edges:
      - { to: stateful-fuzzing, type: requires }
    sources: [crytic-medusa, tob-unleashing-medusa]

  - id: corpus-reuse
    title: Corpus reuse
    oneLine: Persist the interesting call sequences so the next campaign starts where the last one ended.
    statement: >
      The corpus is the saved set of inputs and call sequences that reached new coverage. Persisting it to
      a directory and reloading it on the next run turns each campaign into a continuation rather than a
      restart, which is the single largest practical speedup available and the reason a fuzzing job belongs
      in CI with a cached corpus rather than as an occasional manual run.
    volatility: stable
    edges:
      - { to: coverage-guided-fuzzing, type: requires }
    sources: [crytic-medusa, crytic-echidna]

  - id: sequence-length
    title: Sequence length
    oneLine: The depth knob — too short and multi-step bugs are unreachable, too long and each run wastes budget in explored state.
    statement: >
      Sequence length bounds how many calls make up one generated sequence. Bugs requiring k coordinated
      steps are unreachable below k, and every call past the point where the state stops changing
      meaningfully is spent budget. Sweeping this parameter at a fixed total call budget produces a
      time-to-detection curve whose two ends favour different bug classes, which is why the right value is
      a property of the target rather than a default.
    volatility: stable
    edges:
      - { to: stateful-fuzzing, type: requires }
      - { to: coverage-guided-fuzzing, type: requires }
    sources: [crytic-echidna, crytic-medusa]

  - id: shrinking
    title: Shrinking
    oneLine: Reducing a failing sequence to a minimal reproducer; without it, a finding is unreadable.
    statement: >
      Shrinking repeatedly removes calls and reduces argument magnitudes from a failing sequence while
      checking that it still fails, producing the smallest reproducer. A two-hundred-call counterexample
      is not a finding because nobody can read it; a six-call one is. Shrinking budget is a configurable
      limit and running out of it silently is a common reason a genuine finding gets dismissed.
    volatility: stable
    edges:
      - { to: invariant-testing, type: requires }
      - { to: poc-as-proof, type: applies }
    sources: [crytic-echidna, crytic-medusa]

  - id: onchain-fuzzing
    title: On-chain fuzzing
    oneLine: Fuzzing against forked chain state, so real balances, real oracles and real integrations are in scope.
    statement: >
      On-chain fuzzing points the campaign at forked state from a real network at a pinned block, so the
      target runs against actual balances, actual price feeds and actual integrating contracts rather than a
      synthetic fixture. It is what makes fuzzing usable against a protocol you did not write and did not
      deploy, and the cost is throughput, because every uncached state access is a network round trip.
    volatility: evolving
    edges:
      - { to: stateful-fuzzing, type: requires }
      - { to: fork-cheatcodes, type: applies }
    sources: [crytic-echidna, tob-onchain-echidna, allthingsfuzzy-onchain-benchmark]
