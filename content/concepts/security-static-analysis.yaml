moduleId: security-static-analysis
concepts:
  - id: static-analysis
    title: Static analysis
    oneLine: Analysing source or bytecode without executing it — fast, and inherently prone to false positives.
    statement: >
      Static analysis inspects code without running it, matching structural patterns over an abstract syntax
      tree, a control-flow graph, or bytecode. Because it reasons about all paths approximately rather than
      any path exactly, it over-reports: a detector that never misses a real instance of its pattern will
      also flag instances that are unreachable or intended. Its correct role is a fast first pass whose
      output is triaged, not a gate whose green result means anything.
    volatility: stable
    edges:
      - { to: symbolic-execution, type: contrasts }
    sources: [crytic-building-secure-contracts]
    misconceptions:
      - belief: A clean static-analysis run means the contract is secure.
        reality: Static analysis cannot infer intent, and intent bugs - access control and business logic - top the smart-contract vulnerability loss rankings.
        why: A tool that prints nothing looks like a tool that found nothing to find.
        source: sok-1b-loss

  - id: slither
    title: Slither
    oneLine: Trail of Bits' Python static analyser, built around a large detector suite and designed to run in CI.
    statement: >
      Slither compiles Solidity to an intermediate representation and runs a large library of detectors over
      it, each detector reporting a named pattern with an impact and a confidence. It is the conventional
      first pass: it runs in seconds, it integrates into CI, and its printers double as code-comprehension
      tools for an unfamiliar codebase. Its detector count changes between releases and is not pinned here.
    volatility: evolving
    edges:
      - { to: static-analysis, type: requires }
    sources: [crytic-slither, crytic-building-secure-contracts]

  - id: aderyn
    title: Aderyn
    oneLine: Cyfrin's Rust static analyser — traverses the AST, reports in markdown, JSON or SARIF, and is positioned for signal over coverage.
    statement: >
      Aderyn is a Rust static analyser for Solidity that parses the codebase into an abstract syntax tree
      through its own compiler backend and emits a report in markdown, JSON or SARIF. Its vendor positions
      it differently from Slither: fewer detectors, tuned for signal, on the argument that the scarce
      resource in a review is reviewer attention rather than analysis time. No neutral benchmark comparing
      the two exists, so running both on the same target and comparing which findings each surfaces is how
      you form your own view of that trade.
    volatility: evolving
    edges:
      - { to: static-analysis, type: requires }
      - { to: slither, type: contrasts }
    sources: [cyfrin-aderyn, cyfrin-audit-tools]
    misconceptions:
      - belief: More detectors is better.
        reality: False positives consume reviewer attention, which is the scarce resource; a lower-coverage, higher-signal analyser can be the better tool for a review.
        why: Detector count is the one number that is easy to compare.
        source: cyfrin-audit-tools

  - id: symbolic-execution
    title: Symbolic execution
    oneLine: Explore paths with symbolic rather than concrete inputs, so a result covers a whole class of inputs at once.
    statement: >
      Symbolic execution runs code with unconstrained symbols in place of values, accumulating a path
      constraint at each branch, and asks a solver whether any assignment satisfying those constraints
      violates an assertion. One symbolic run therefore reasons about every concrete input that takes the
      same path. The costs are path explosion, loops, and the solver's willingness to terminate.
    volatility: stable
    edges:
      - { to: static-analysis, type: requires }
      - { to: property-fuzzing, type: contrasts }
    sources: [symbolic-execution-survey-2025, a16z-halmos-repo]

  - id: halmos
    title: Halmos
    oneLine: a16z's bounded symbolic testing tool — reuses Foundry tests as specifications, with no new language and no licence.
    statement: >
      Halmos takes Solidity test functions, replaces their concrete inputs with symbolic ones, and checks
      that no assertion can be violated within a stated loop and call-depth bound, producing either a proof
      within that bound or a concrete counterexample. Its adoption cost is close to zero for a project that
      already has a Foundry suite, which is what makes it the on-ramp to formal methods; the bound is the
      price.
    volatility: evolving
    edges:
      - { to: symbolic-execution, type: requires }
      - { to: bounded-verification, type: deepens }
    sources: [a16z-halmos-repo, a16z-halmos-post]

  - id: property-fuzzing
    title: Property-based fuzzing
    oneLine: Generate inputs to break an author-stated property — probabilistic, never exhaustive.
    statement: >
      Property-based fuzzing generates inputs, or sequences of calls, and checks an author-written property
      after each. Its output is asymmetric: a counterexample is proof of a bug, while the absence of one is
      evidence only about the states the campaign reached. It finds bugs cheaply and says nothing about the
      unexplored state space, which is why coverage rather than pass or fail is the number to read.
    volatility: stable
    edges:
      - { to: invariant-as-spec, type: requires }
      - { to: formal-verification, type: contrasts }
    sources: [crytic-echidna, crytic-building-secure-contracts]

  - id: echidna
    title: Echidna
    oneLine: Trail of Bits' property-based fuzzer — the original, and still the reference for optimization mode and forked-state campaigns.
    statement: >
      Echidna is a Haskell property-based fuzzer for EVM contracts supporting property, assertion,
      optimization, overflow and exploration test modes, and able to run against forked chain state over an
      RPC endpoint. It is actively maintained; the claim that it has been superseded is wrong. Its
      distinguishing capability among the current fuzzers is optimization mode, which maximises a value
      instead of falsifying a boolean.
    volatility: evolving
    edges:
      - { to: property-fuzzing, type: requires }
      - { to: optimization-mode, type: deepens }
    sources: [crytic-echidna, echidna-issta-2020]

  - id: medusa
    title: Medusa
    oneLine: A Go, geth-based parallel fuzzer with coverage-guided input generation and an HTML coverage report.
    statement: >
      Medusa is a parallel, coverage-guided fuzzer built on geth, supporting both assertion and property
      testing, with mutational value generation informed by static analysis and a coverage report. Trail of
      Bits, who maintain both it and Echidna, report internally that the two perform similarly on coverage
      and corpus size - a vendor benchmark on both of the tools compared. The honest teaching line is that
      the choice between them is about ergonomics, parallelism and CI fit rather than bug-finding power.
    volatility: evolving
    edges:
      - { to: echidna, type: requires }
      - { to: coverage-guided-fuzzing, type: deepens }
    sources: [crytic-medusa, tob-unleashing-medusa]
    misconceptions:
      - belief: Medusa replaced Echidna.
        reality: Both are maintained, and the maintainers' own benchmark reports similar coverage and corpus size; Medusa wins on parallelism and Go tooling, Echidna on optimization mode and maturity.
        why: The newer tool gets the launch post.
        source: tob-unleashing-medusa

  - id: formal-verification
    title: Formal verification
    oneLine: Proving a property holds for every input in a modelled state space, rather than sampling it.
    statement: >
      Formal verification establishes that a property holds on all executions within a model of the system,
      by reducing the code and the property to a logical formula and discharging it with a solver. What is
      proved is a specific property, under a specific configuration, with specific functions replaced by
      approximations and specific loops bounded. The claim "formally verified" is therefore a claim about a
      specification under a configuration, not about a contract.
    volatility: stable
    edges:
      - { to: symbolic-execution, type: requires }
      - { to: property-fuzzing, type: contrasts }
    sources: [certora-gentle-intro, certora-prover-repo]
    misconceptions:
      - belief: Fuzzing and formal verification are competing choices.
        reality: Fuzzing finds counterexamples cheaply and formal verification proves their absence expensively; the working order is fuzz first, then verify the property once it is stable.
        why: Both consume a property and both report a verdict.
        source: tob-invariant-driven-development

  - id: certora-prover
    title: Certora Prover
    oneLine: The heavyweight prover — a separate specification language, unbounded reasoning, and coverage beyond the EVM.
    statement: >
      The Certora Prover compiles a contract's bytecode together with rules written in its own specification
      language into a formula for an SMT solver, and supports unbounded reasoning through invariants and
      rules quantified over all public methods. Its source is now published, which invalidates the older
      teaching that formal verification requires a licence and a vendor engineer, and its coverage extends
      beyond the EVM to Solana and Stellar/Soroban. The version series is documented in an official
      changelog, which is where any version claim should be taken from.
    volatility: hot
    edges:
      - { to: formal-verification, type: requires }
      - { to: parametric-rule, type: deepens }
    sources: [certora-prover-repo, certora-prover-changelog, certora-cvlr-solana]

  - id: tool-stack-not-tool
    title: A stack, not a tool
    oneLine: Professional practice sequences static analysis, symbolic testing, fuzzing and proving; no single tool has adequate coverage.
    statement: >
      A review runs static analysis first because it is cheap and orients you in the codebase, symbolic
      testing on the arithmetic, stateful fuzzing on the accounting and economic properties, and proving on
      the small number of properties that are stable and valuable enough to justify a specification. Each
      tier answers a question the others cannot, and none of them sees oracles, governance, key custody or
      the signing path. Choosing a stack is therefore a scoping decision about where the risk actually is.
    volatility: evolving
    edges:
      - { to: slither, type: requires }
      - { to: echidna, type: requires }
      - { to: certora-prover, type: requires }
      - { to: halmos, type: requires }
      - { to: fv-scope-boundary, type: deepens }
    sources: [hacken-audit-tools, crytic-building-secure-contracts]
