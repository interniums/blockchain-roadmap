moduleId: security-threat-modeling
concepts:
  - id: trust-zone
    title: Trust zone
    oneLine: A group of components that share purpose, ownership or blast radius and are treated as equally trusted inside the group.
    statement: >
      A trust zone is a set of components grouped because they share purpose, owner, or blast radius, and
      inside which no further authorisation is performed. Zones are drawn by asking "if this component is
      compromised, what else is automatically compromised?" A protocol has several zones — deployed
      contracts, admin key custody, off-chain relayers and keepers, the front end and signing UI, the CI
      and build pipeline — and the zone boundaries, not the contract boundaries, are where security work
      belongs.
    volatility: stable
    edges:
      - { to: trust-boundary, type: contrasts }
    sources: [scsvs-v1-architecture, tob-bybit-threat-model]
    misconceptions:
      - belief: A trust zone is the same thing as a deployment or a repository.
        reality: Zones are drawn by blast radius, so one repository can span several zones and one zone can span several repositories.
        why: Deployment units are visible in tooling; blast radius is not.
        source: tob-bybit-threat-model

  - id: trust-boundary
    title: Trust boundary
    oneLine: The edge between two trust zones, where privilege changes and therefore authentication or authorisation must happen.
    statement: >
      A trust boundary is the edge between two trust zones. Because privilege changes when data or control
      crosses it, every crossing must either authenticate the caller, validate the data, or explicitly
      accept the risk. Boundary controls are the general-IT concept the blockchain case inherits: NIST
      SP 800-53's boundary-protection family is the catalogue that firms draw from. Most protocol trust
      boundaries are not Solidity function signatures.
    volatility: stable
    edges:
      - { to: trust-zone, type: requires }
      - { to: contract-boundary, type: contrasts }
    sources: [nist-sp-800-53, tob-bybit-threat-model, scsvs-v1-architecture]

  - id: contract-boundary
    title: Contract boundary
    oneLine: The external and public Solidity surface — one trust boundary among many, and usually not the interesting one.
    statement: >
      The contract boundary is the set of external and public entry points of the deployed contracts. It is
      a strict subset of the protocol's trust boundaries. Reviewing only this surface leaves signing
      interfaces, key custody, upgrade procedure, oracle feeds, bridges, relayers, CI and deployment scripts
      entirely unexamined — which is where the largest losses of 2025 and 2026 occurred.
    volatility: stable
    edges:
      - { to: trust-boundary, type: requires }
      - { to: abi-dispatch, type: deepens }
    sources: [tob-bybit-threat-model, scsvs-v1-architecture]
    misconceptions:
      - belief: Threat modeling is about the smart contracts.
        reality: The contract surface is one trust boundary among many; signing UIs, workstations, CI, oracles, bridges and deployment keys are all inside the perimeter.
        why: Contracts are the visible, auditable part, so they absorb all the attention.
        source: tob-bybit-threat-model

  - id: actor-enumeration
    title: Actor enumeration
    oneLine: Listing every party that can touch the system before reasoning about any of them.
    statement: >
      Actor enumeration is the exhaustive list of parties who can cause the system to do something: users,
      admins, keepers, sequencers, relayers, oracle publishers, block builders and searchers, integrating
      protocols, and the attacker who compromises any of the above. The list is produced before analysis,
      not during it, because analysis started from an incomplete list silently scopes out whole attacks.
    volatility: stable
    edges:
      - { to: trust-zone, type: requires }
    sources: [scsvs-v1-architecture, tob-bybit-threat-model]

  - id: capability-not-role
    title: Capability, not role
    oneLine: Model what an actor can cause to happen, not the job title the documentation gives it.
    statement: >
      An actor must be modelled by capability — the set of state changes it can cause, alone or in
      combination, and how fast — rather than by role. "The multisig" is a role; "can replace the
      implementation with arbitrary code in a single transaction with no timelock" is a capability. Role
      lists come free from the code's modifiers, which is exactly why they feel complete and are not: they
      omit capabilities that arise from composition, from emergency powers, and from an actor being
      compromised.
    volatility: stable
    edges:
      - { to: actor-enumeration, type: requires }
      - { to: access-control-failure, type: contrasts }
      - { to: access-roles, type: contrasts }
    sources: [tob-beyond-private-key-risk, scsvs-v1-architecture]
    misconceptions:
      - belief: Listing roles — owner, user, keeper — is actor enumeration.
        reality: Roles hide capabilities; you need what each party can cause, including combinations and the attacker who compromises one of them.
        why: Role lists come free from the code's modifiers, so they feel complete.
        source: tob-beyond-private-key-risk

  - id: trust-assumption-inventory
    title: Trust assumption inventory
    oneLine: The written list of everything assumed honest, live or correct — each one a thing you lose to if it misbehaves.
    statement: >
      The trust assumption inventory enumerates every component or party assumed honest, available, or
      correct: oracle feeds, admin and upgrade keys, bridge verifiers, off-chain relayers, sequencers,
      block builders, the compiler and libraries, and the signing interface. "Trusted" does not mean
      "benign" — it means "if it misbehaves, you lose". The purpose of listing assumptions is to price
      them, not to bless them, and each entry should carry what breaks downstream if it fails.
    volatility: stable
    edges:
      - { to: actor-enumeration, type: requires }
      - { to: toolchain-trust, type: deepens }
    sources: [scsvs-v1-architecture, tob-beyond-private-key-risk]
    misconceptions:
      - belief: Marking something "trusted" means it has been judged safe.
        reality: It means the system has no defence if that component misbehaves; the label records exposure, not assurance.
        why: The word "trusted" reads as an endorsement.
        source: tob-bybit-threat-model

  - id: data-flow-crossing
    title: Data-flow crossing
    oneLine: Every point where data moves across a trust boundary is a place to ask what happens if an attacker chose that data.
    statement: >
      A data-flow crossing is a numbered point where a value moves from one trust zone into another. At each
      one the analysis asks: who chooses this value, what is validated on arrival, what is the worst
      admissible value, and what happens if the producer is compromised. Numbering the crossings turns
      threat modeling from a free-form discussion into an enumerable checklist, because each numbered
      crossing indexes a row in the scenario table.
    volatility: stable
    edges:
      - { to: trust-boundary, type: requires }
      - { to: abi-decode-validates, type: applies }
    sources: [tob-bybit-threat-model, nist-sp-800-53]

  - id: offchain-attack-surface
    title: Off-chain attack surface
    oneLine: Workstations, CI, front ends, signing UIs and deployment pipelines are inside the protocol's perimeter even though they contain no Solidity.
    statement: >
      The off-chain attack surface comprises every system whose compromise changes what the on-chain system
      does: developer workstations, build and CI infrastructure, dependency supply chain, the front end,
      the transaction-signing interface, RPC endpoints, and key custody procedure. These are inside the
      trust perimeter and outside the audit scope of a contract review, which is the gap the 2025 and 2026
      loss data sits in.
    volatility: evolving
    edges:
      - { to: trust-zone, type: requires }
      - { to: dprk-threat-actor, type: deepens }
    sources: [tob-bybit-threat-model, nist-sp-800-53]

  - id: blind-signing
    title: Blind signing
    oneLine: A signer approving a transaction whose real effect they cannot see on the device they are trusting.
    statement: >
      Blind signing is any approval flow where the signer's view of the transaction is produced by a system
      that could itself be compromised, so the displayed intent and the signed payload can differ. It is a
      trust-boundary failure invisible to contract review: the contracts execute exactly what was signed.
      Defences are structural — independent verification of the payload on a separate device, decoded
      calldata display, and air-gapped signing — not contractual. ERC-7730 exists precisely because
      an ABI or an EIP-712 type is not by itself enough to render a payload's effect to a human, and
      specifies the extra metadata a wallet needs to display one.
    volatility: evolving
    edges:
      - { to: trust-boundary, type: requires }
      - { to: signer-ui-compromise, type: deepens }
    sources: [erc-7730, eip-712, tob-bybit-threat-model]

  - id: invariant-as-spec
    title: Invariant as specification
    oneLine: A statement that must hold on every state and every execution path — the machine-checkable form of a security requirement.
    statement: >
      An invariant is a statement about a program that must hold regardless of its state or execution path.
      Written as a single boolean over state with no "should" or "usually", it is the specification itself,
      not a testing technique. Testing, formal verification and runtime monitoring are three consumers of
      the same statement; prose requirements that cannot be reduced to such a boolean are not yet
      specifications.
    volatility: stable
    edges:
      - { to: invariant, type: deepens }
    sources: [tob-invariant-driven-development, crytic-building-secure-contracts]
    misconceptions:
      - belief: Invariants are a testing technique.
        reality: They are the specification; testing, formal verification and monitoring are three consumers of the same statement.
        why: Most people meet invariants first as invariant_ functions in a fuzz harness.
        source: tob-invariant-driven-development

  - id: function-level-invariant
    title: Function-level invariant
    oneLine: A property of a single computation with no state change — for example, that a pure pricing function is monotonic.
    statement: >
      A function-level invariant constrains one computation in isolation: monotonicity, bounds, rounding
      direction, or algebraic identities of a pure or view function. It is cheap to state, cheap to check,
      and the natural first target for symbolic tools because the state space is small. It says nothing
      about how the function is composed with others.
    volatility: stable
    edges:
      - { to: invariant-as-spec, type: requires }
    sources: [tob-invariant-driven-development, crytic-building-secure-contracts]

  - id: system-level-invariant
    title: System-level invariant
    oneLine: A property spanning contracts and state transitions — solvency, conservation, or supply accounting.
    statement: >
      A system-level invariant constrains the whole protocol across state transitions: the sum of balances
      equals total supply, total claimable never exceeds total held, protocol solvency never decreases
      outside of accounted fees. These are the properties that catch accounting and ordering bugs, they
      require accumulated state to check, and they are the class that stateful fuzzing and unbounded
      verification exist to attack.
    volatility: stable
    edges:
      - { to: invariant-as-spec, type: requires }
      - { to: function-level-invariant, type: contrasts }
      - { to: solvency-invariant, type: applies }
    sources: [tob-invariant-driven-development, crytic-building-secure-contracts]

  - id: invariant-driven-development
    title: Invariant-driven development
    oneLine: Write the invariants first, then let fuzzers, provers and runtime monitors all consume the same statements.
    statement: >
      Invariant-driven development makes the invariant list the primary artifact and derives the assurance
      activities from it: the same statement becomes a fuzz property, a prover rule, and a monitoring
      alert. The practical consequence is that tool choice is downstream of specification quality, and that
      a protocol with no written invariants cannot be meaningfully fuzzed, verified or monitored regardless
      of budget.
    volatility: evolving
    edges:
      - { to: system-level-invariant, type: requires }
      - { to: invariant-testing, type: applies }
      - { to: invariant-monitoring, type: applies }
    sources: [tob-invariant-driven-development, crytic-building-secure-contracts]
    misconceptions:
      - belief: If an invariant holds, the protocol is safe.
        reality: Empirical study of real exploits found invariant effectiveness varies sharply by class, and some invariants that would have stopped an exploit are too expensive to enforce on-chain.
        why: The word "invariant" implies totality.
        source: trace2inv-fse24

  - id: threat-scenario
    title: Threat scenario
    oneLine: A named attack story tied to one boundary crossing plus one violated assumption, with an impact and a mitigation.
    statement: >
      A threat scenario names an actor, a capability, a numbered boundary crossing, the assumption it
      falsifies, the resulting impact, and the proposed mitigation. That structure is what separates a
      finding from a worry: a free-floating "what if the oracle is wrong" is not a scenario, whereas "a
      relayer with publish capability posts a price outside the deviation bound at crossing 7, and
      liquidations execute against it" is one, because every clause is checkable.
    volatility: stable
    edges:
      - { to: data-flow-crossing, type: requires }
      - { to: capability-not-role, type: requires }
      - { to: exploit-scenario, type: applies }
    sources: [scsvs-v1-architecture, tob-bybit-threat-model]

  - id: threat-model-document
    title: Threat model document
    oneLine: The living artifact — component inventory, zone diagram, data-flow map, assumption list, scenario table, residual risk.
    statement: >
      The threat model document collects the component inventory, the trust-zone diagram, the numbered
      data-flow map, the actor and capability table, the trust-assumption inventory, the scenario table,
      and an explicit residual-risk statement naming what the team has decided to accept. Its value is that
      the residual-risk section forces an accepted-risk decision to be made by name rather than by
      omission.
    volatility: stable
    edges:
      - { to: threat-scenario, type: requires }
      - { to: trust-assumption-inventory, type: requires }
    sources: [scsvs-v1-architecture, tob-bybit-threat-model]

  - id: threat-model-cadence
    title: Threat model cadence
    oneLine: A model refreshed only at launch describes a system that no longer exists.
    statement: >
      A threat model decays as the system changes. OWASP's guidance is that a threat model is not
      performed once and never again — it is maintained, updated and refined alongside the system, as
      a step in the normal development process rather than an add-on. Trail of Bits puts a number on
      that for this domain, recommending updates quarterly or semi-annually as well as after
      significant architectural changes, new feature launches, or changes in operations — a new
      integration, a new keeper, a new signer, a new chain. Cadence is the difference between threat
      modeling as a process and a threat model as a launch deliverable.
    volatility: stable
    edges:
      - { to: threat-model-document, type: requires }
    sources: [owasp-threat-modeling-cheatsheet, tob-bybit-threat-model]
    misconceptions:
      - belief: A threat model is a document you write once before launch.
        reality: It decays; Trail of Bits recommends refreshing quarterly or semi-annually and after any architectural, feature, or operational change.
        why: The artifact looks like a deliverable rather than a process.
        source: tob-bybit-threat-model
