moduleId: solidity-abi-selectors
concepts:
  - id: abi-function-selector
    title: Function selector
    oneLine: "The first four bytes of calldata: the high-order four bytes of keccak256 of the canonical signature."
    statement: >
      Every ordinary contract call begins with a four-byte function selector, defined as the first
      four bytes — the high-order bytes — of the Keccak-256 hash of the function's canonical
      signature. The argument encoding follows immediately after it. Anything a contract does with
      an incoming call starts by comparing those four bytes.
    volatility: stable
    edges:
      - { to: hash-function, type: requires }
      - { to: abi-encoding, type: requires }
      - { to: sol-function-visibility, type: requires }
      - { to: abi-head-tail, type: contrasts }
    sources: [solidity-abi-spec]
    misconceptions:
      - belief: "The selector is a hash of the function name."
        reality: "It hashes the full canonical signature including the parameter types, which is exactly what makes overloading resolvable."
        why: "cast sig \"transfer\" looks like it ought to work."
        source: solidity-abi-spec

  - id: abi-canonical-signature
    title: Canonical signature
    oneLine: "name(type1,type2) with no spaces, no parameter names, no data locations and no return types."
    statement: >
      The canonical signature is the function name followed by the parenthesised, comma-separated
      list of its parameter types, with no spaces, no parameter names, no data-location keywords and
      no return types. Types are written in canonical form: uint becomes uint256, int becomes int256,
      an enum becomes uint8, a contract type becomes address, a user-defined value type becomes its
      underlying type, and a struct becomes a parenthesised tuple of its members.
    volatility: stable
    edges:
      - { to: abi-function-selector, type: requires }
    sources: [solidity-abi-spec]
    misconceptions:
      - belief: "uint and uint256 produce different selectors."
        reality: "uint is an alias; the canonical signature always spells uint256, so hashing f(uint) gives the wrong selector."
        why: "The alias is legal Solidity, so people paste it straight into a hashing tool."
        source: solidity-abi-spec

  - id: abi-return-type-not-in-selector
    title: Return types are excluded
    oneLine: "Return types are deliberately outside the signature, so call resolution is context-independent."
    statement: >
      The canonical signature contains no return types. This is deliberate: it makes resolving a
      call independent of the context the result is used in. The direct consequence is that two
      functions differing only in return type cannot be overloaded, because they would have
      identical selectors.
    volatility: stable
    edges:
      - { to: abi-canonical-signature, type: requires }
    sources: [solidity-abi-spec]

  - id: abi-selector-space
    title: The selector space is small
    oneLine: "Selectors live in a 2**32 space, so collisions are cheap to find and cheap to mine."
    statement: >
      A selector is 32 bits, so the space holds about 4.3 billion values. By the birthday bound a
      random corpus of roughly 2**16 signatures already contains a collision with meaningful
      probability, and an attacker who controls a function name can brute-force a name whose
      selector equals any chosen four bytes in seconds. Four bytes are an identifier, never a
      security boundary.
    volatility: stable
    edges:
      - { to: abi-function-selector, type: requires }
      - { to: abi-selector-collision-risk, type: contrasts }
    sources: [solidity-abi-spec, philogy-selector-switches]

  - id: abi-selector-collision-risk
    title: Where a selector collision is dangerous
    oneLine: "Collisions matter only where two separately compiled dispatch surfaces overlap, classically a proxy."
    statement: >
      Within a single contract the compiler rejects two functions with the same selector, so no
      collision can hide there. The danger is where two independently compiled dispatchers see the
      same calldata: a proxy's own admin function and an implementation function are separate
      compilations, so nothing stops one from shadowing the other, and a malicious implementation
      can mine a function name to do it on purpose. The transparent proxy pattern exists to split
      dispatch by caller precisely because of this.
    volatility: stable
    edges:
      - { to: abi-selector-space, type: requires }
      - { to: abi-dispatch, type: contrasts }
      - { to: transparent-proxy, type: applies }
    sources: [nomic-proxy-backdoors, eip-2535]
    misconceptions:
      - belief: "Two functions with the same selector cannot exist."
        reality: "The compiler rejects them within one contract, but a proxy and its implementation are separate compilations, and selectors can be deliberately mined to collide."
        why: "The compiler error creates confidence that the whole system is checked."
        source: nomic-proxy-backdoors

  - id: abi-dispatch
    title: The dispatcher
    oneLine: "solc's legacy codegen emits a binary search over selectors sorted as integers, not a jump table."
    statement: >
      The dispatcher a contract begins with is ordinary compiled code. In solc's legacy code
      generator it is a recursive binary search over the contract's selectors sorted as integers:
      it emits DUP1, PUSH4 pivot, GT, JUMPI splits, and falls back to a linear chain of EQ and JUMPI
      comparisons for four or fewer selectors and whenever the optimizer-runs setting does not
      justify the extra deployed bytes. The via-IR pipeline instead emits a Yul switch on the
      selector and leaves lowering to the Yul code transform; whether the two pipelines produce the
      same shape or the same gas profile has not been established.
    volatility: evolving
    edges:
      - { to: abi-function-selector, type: requires }
      - { to: abi-fallback-receive, type: contrasts }
    sources: [solc-contractcompiler-source, solc-irgenerator-source, solidity-abi-spec]
    misconceptions:
      - belief: "Function dispatch is a jump table, so every function costs the same to reach."
        reality: "solc's legacy dispatcher is a binary search over sorted selectors, with a linear chain for four or fewer functions, so dispatch gas depends on selector value and function count."
        why: "The word switch implies constant time."
        source: solc-contractcompiler-source

  - id: abi-dispatch-gas-not-uniform
    title: Dispatch gas is not uniform
    oneLine: "Because dispatch is a search, gas to reach a function depends on where its selector sorts."
    statement: >
      A function selector is the first four bytes of the hash of its canonical signature, so renaming a
      function gives it a different selector and moves it in any ordering built from selectors. In
      solc's legacy code generator the dispatcher is a search over sorted selectors rather than an
      index, which makes the gas spent before your function body starts depend on where its selector
      sorts and on how many selectors the contract has - two functions with identical bodies need not
      cost the same to call. Nothing in the ABI specification fixes dispatcher shape, so this is a
      property of one compiler pipeline: whether via-IR produces the same shape or the same gas
      profile is not established, and should be measured on the pipeline you actually ship.
    volatility: evolving
    edges:
      - { to: abi-dispatch, type: requires }
      - { to: gas-folklore, type: contrasts }
    sources: [solidity-abi-spec, solc-contractcompiler-source, philogy-selector-switches]

  - id: abi-fallback-receive
    title: fallback and receive
    oneLine: "Unmatched calldata goes to fallback(); empty calldata with value goes to receive() if it exists."
    statement: >
      If no selector matches, execution falls through to fallback() when the contract defines one,
      and otherwise reverts. A call carrying value with empty calldata goes to receive() if defined,
      otherwise to a payable fallback() if defined, otherwise it reverts. This is not an error path:
      it is the mechanism every proxy and every generic router is built on.
    volatility: stable
    edges:
      - { to: abi-dispatch, type: requires }
    sources: [solidity-docs-contracts, solidity-abi-spec]
    misconceptions:
      - belief: "A call with unknown calldata reverts."
        reality: "It reaches fallback() if one exists, which is exactly how proxies and generic routers work."
        why: "Typed-language intuition about calling a method that does not exist."
        source: solidity-abi-spec

  - id: abi-static-vs-dynamic
    title: Static versus dynamic types
    oneLine: "bytes, string, T[] and any tuple containing a dynamic member are dynamic; everything else is static."
    statement: >
      A type is dynamic if it is bytes, string, an unbounded array T[], a fixed-size array T[k] whose
      element type is dynamic, or a tuple with at least one dynamic member. Every other type is
      static and encodes in place with a known, fixed width. A fixed-size array of a static type is
      itself static: it is inlined with no offset and no length word.
    volatility: stable
    edges:
      - { to: abi-function-selector, type: requires }
      - { to: abi-head-tail, type: contrasts }
    sources: [solidity-abi-spec]
    misconceptions:
      - belief: "uint256[3] is encoded like uint256[]."
        reality: "A fixed-size array of a static type is itself static and is inlined in the head with no offset and no length word."
        why: "Both of them look like arrays in the source."
        source: solidity-abi-spec

  - id: abi-head-tail
    title: Head and tail encoding
    oneLine: "All heads first, then all tails: static values inline, dynamic values as a 32-byte offset."
    statement: >
      An encoded argument list is head(X1)..head(Xk) followed by tail(X1)..tail(Xk). A static
      argument's head is its value, encoded in place, and its tail is empty. A dynamic argument's
      head is a 32-byte byte-offset and its tail holds the content. Reading a calldata blob is
      therefore always the same procedure: walk the fixed-width head, follow each offset into the
      tail.
    volatility: stable
    edges:
      - { to: abi-static-vs-dynamic, type: requires }
      - { to: abi-encoding, type: deepens }
    sources: [solidity-abi-spec]

  - id: abi-offsets-relative
    title: Offsets are relative to the enclosing block
    oneLine: "An offset counts bytes from the start of its enclosing encoding block, not from calldata zero."
    statement: >
      Offsets are measured in bytes from the beginning of the enclosing encoding block. For
      top-level arguments that beginning is the first byte after the four-byte selector. For a
      dynamic type nested inside another dynamic type, it is the start of the nested block. The
      top-level case makes absolute and relative look identical, which is why nested structures are
      where hand-decoding goes wrong.
    volatility: stable
    edges:
      - { to: abi-head-tail, type: requires }
    sources: [solidity-abi-spec]
    misconceptions:
      - belief: "Offsets in calldata are absolute positions in msg.data."
        reality: "They are relative to the start of the enclosing block — the byte after the selector for top-level arguments, and the start of the nested array or tuple for nested dynamic types."
        why: "For a single level of nesting the two interpretations coincide."
        source: solidity-abi-spec

  - id: abi-dynamic-array-layout
    title: Dynamic array and bytes tails
    oneLine: "A dynamic array's tail is length then elements; bytes and string are length then raw padded bytes."
    statement: >
      The tail of a dynamic array is its element count followed by the encoded elements in order.
      The tail of bytes or string is its byte length followed by the raw bytes, right-padded with
      zeroes to a multiple of 32. Nothing in the encoding records the type, so decoding depends
      entirely on the ABI you decode against.
    volatility: stable
    edges:
      - { to: abi-head-tail, type: requires }
      - { to: abi-packed-encoding, type: contrasts }
    sources: [solidity-abi-spec]

  - id: abi-decode-validates
    title: abi.decode validates
    oneLine: "abi.decode re-runs the encoding rules in reverse and reverts on malformed input."
    statement: >
      abi.decode applies the encoding rules in reverse and reverts when the bytes do not satisfy
      them: offsets pointing outside the data, lengths running past the end, dirty high bits in a
      narrow type, a bool that is not 0 or 1. Reading return data with hand-written assembly skips
      every one of those checks, which is why raw returndata should be decoded rather than mloaded.
    volatility: stable
    edges:
      - { to: abi-head-tail, type: requires }
      - { to: abi-strict-mode-not-enforced, type: contrasts }
    sources: [solidity-abi-spec]

  - id: abi-strict-mode-not-enforced
    title: Strict encoding is not enforced on decode
    oneLine: "Solidity's encoder always emits strict encoding; its decoder does not require it."
    statement: >
      Strict encoding mode requires offsets to be minimal and the encoding to contain no gaps, so
      that every value has exactly one valid encoding. Solidity's encoder always produces strict
      encoding, but its decoder does not enforce it. More than one byte string can therefore decode
      to the same values, which matters whenever raw calldata or return data is hashed, compared or
      used as an identity.
    volatility: stable
    edges:
      - { to: abi-decode-validates, type: requires }
    sources: [solidity-abi-spec]
    misconceptions:
      - belief: "If abi.decode succeeds, the bytes were canonically encoded."
        reality: "Solidity's decoder does not enforce strict mode, so non-minimal offsets and gaps can decode successfully; only the encoder is strict."
        why: "The spec defines one encoding, so people assume it is the only accepted one."
        source: solidity-abi-spec

  - id: abi-packed-encoding
    title: abi.encodePacked
    oneLine: "Packed mode drops padding and array lengths, so different argument tuples can produce identical bytes."
    statement: >
      abi.encodePacked concatenates values without padding and without array length prefixes. Two
      different argument tuples can therefore produce identical bytes: the classic case is two
      dynamic arguments whose contents can be re-split at a different boundary. Packed output must
      never be fed to a hash that is used as an identity, a commitment or a signature digest when
      more than one dynamic argument is present; abi.encode is the correct choice there.
    volatility: stable
    edges:
      - { to: abi-dynamic-array-layout, type: requires }
      - { to: packed-hash-collision, type: deepens }
      - { to: abi-encode-vs-packed, type: deepens }
    sources: [solidity-abi-spec]
    misconceptions:
      - belief: "abi.encodePacked is just a cheaper abi.encode."
        reality: "It drops padding and array lengths, so the argument pairs (a, bc) and (ab, c) hash identically — a real signature and commitment forgery class."
        why: "The name suggests a pure size optimisation with no semantic difference."
        source: solidity-abi-spec

  - id: abi-msg-data-msg-sig
    title: msg.data and msg.sig
    oneLine: "msg.data is the whole calldata byte array; msg.sig is its first four bytes."
    statement: >
      msg.data exposes the complete calldata of the current call as a bytes array, and msg.sig
      exposes its first four bytes. Both are readable from pure functions. They are what a generic
      forwarder, a multicall router or a proxy inspects, and what a meta-transaction relayer has to
      re-append the original sender to.
    volatility: stable
    edges:
      - { to: abi-function-selector, type: requires }
      - { to: sol-calldata-immutable, type: contrasts }
    sources: [solidity-docs-global-vars, solidity-abi-spec]
