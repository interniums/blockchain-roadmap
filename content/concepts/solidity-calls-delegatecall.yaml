moduleId: solidity-calls-delegatecall
concepts:
  - id: evm-message-call
    title: Every interaction is a message call
    oneLine: "Contracts share no address space; every contract-to-contract interaction opens a new frame."
    statement: >
      Contracts do not call each other's functions the way objects call methods. Every
      contract-to-contract interaction is a message call that opens a new execution frame with its
      own gas budget, its own memory, its own address(this) and its own storage. There is no shared
      address space, no shared stack, and no way to pass a pointer. The only thing that crosses the
      boundary is a byte string in and a byte string out.
    volatility: stable
    edges:
      - { to: call-frame, type: requires }
      - { to: abi-function-selector, type: requires }
      - { to: sol-delegatecall-context, type: contrasts }
    sources: [solidity-docs-global-vars, eip-7]

  - id: evm-call-context
    title: CALL context
    oneLine: "Under CALL the callee is address(this), msg.sender is the caller, and the callee's storage is written."
    statement: >
      Under CALL, address(this) inside the callee is the callee's own address, msg.sender is the
      contract that made the call, msg.value is the value attached to this particular call, balance
      queries read the callee's balance, and every storage write lands in the callee's storage.
      This is the default and the case every other variant is described against.
    volatility: stable
    edges:
      - { to: evm-message-call, type: requires }
      - { to: sol-delegatecall-context, type: contrasts }
    sources: [eip-7, solidity-docs-global-vars]

  - id: sol-delegatecall-context
    title: DELEGATECALL context
    oneLine: "Only the code comes from the target; address, storage, balance, msg.sender and msg.value stay the caller's."
    statement: >
      Under DELEGATECALL only the code is taken from the target address. address(this), the storage
      being read and written, the balance, msg.sender and msg.value all remain those of the calling
      contract, propagated unchanged from the parent frame. EIP-7 states it directly: caller and
      value behave in the callee's environment exactly as they do in the caller's. Logs emitted
      during a delegatecall are attributed to the calling contract's address.
    volatility: stable
    edges:
      - { to: evm-call-context, type: requires }
      - { to: delegatecall-is-the-proxy-primitive, type: deepens }
      - { to: evm-call-context, type: contrasts }
    sources: [eip-7]
    misconceptions:
      - belief: "msg.sender inside a delegatecalled implementation is the proxy."
        reality: "It is whoever called the proxy, because DELEGATECALL propagates CALLER unchanged."
        why: "Every other kind of call rewrites msg.sender to the immediate caller."
        source: eip-7
      - belief: "address(this) inside a delegatecalled implementation is the implementation."
        reality: "It is the proxy — and so is address(this).balance, and so is the address that appears on emitted logs."
        why: "this reads as the code I am currently inside."
        source: eip-7

  - id: delegatecall-storage-is-the-risk
    title: Storage matching is the whole risk
    oneLine: "Delegatecall matches storage by slot position, never by variable name."
    statement: >
      A delegatecalled implementation writes the caller's storage by slot number. Names do not
      cross the boundary, so renaming a variable is free while reordering, inserting or changing a
      type's packing silently redirects a write to a different variable. This — not value transfer
      and not reentrancy — is why delegatecall is dangerous: the target can overwrite the caller's
      implementation pointer and its owner slot, and everything else follows from that.
    volatility: stable
    edges:
      - { to: sol-delegatecall-context, type: requires }
      - { to: storage-slot, type: requires }
      - { to: delegate-storage-collision, type: deepens }
    sources: [eip-7, solidity-docs-global-vars]
    misconceptions:
      - belief: "delegatecall is dangerous because the callee can steal your Ether."
        reality: "The callee runs as the caller and writes the caller's storage, including the implementation-address slot and the owner slot; the Ether follows from owning the storage."
        why: "The word call makes people think about value transfer first."
        source: eip-7
      - belief: "Storage variables are matched by name across a delegatecall."
        reality: "They are matched by slot number, so reordering, inserting or repacking silently corrupts state."
        why: "Solidity source presents them as named fields on both sides."
        source: solidity-docs-global-vars

  - id: delegatecall-no-code-succeeds
    title: A call to an address with no code succeeds
    oneLine: "The EVM returns success with empty data when the target has no code; low-level calls skip Solidity's check."
    statement: >
      Calling an address that holds no code is not an error at the EVM level: it returns success
      with empty return data. Solidity inserts an EXTCODESIZE check before typed external calls so
      the high-level form reverts, but .call, .delegatecall and .staticcall have no such check. A
      proxy pointing at address(0) or at an EOA therefore reports every call as successful while
      doing nothing at all.
    volatility: stable
    edges:
      - { to: sol-delegatecall-context, type: requires }
      - { to: extcode-vs-code-asymmetry, type: applies }
      - { to: evm-message-call, type: contrasts }
    sources: [solidity-docs-global-vars]
    misconceptions:
      - belief: "Calling a nonexistent contract reverts."
        reality: "The EVM treats it as success with empty return data; Solidity's inserted extcodesize check covers typed calls only, and low-level calls do not have it."
        why: "The compiler's hidden check masks the EVM behaviour until you drop to the low-level form."
        source: solidity-docs-global-vars

  - id: this-dot-f-is-external
    title: this.f() is a real external call
    oneLine: "this.f() is a full CALL back into the same contract, and it resets msg.sender to address(this)."
    statement: >
      Writing this.f() does not call f internally. It performs a real message call to the contract's
      own address, paying the account-access and call costs, and inside f msg.sender is
      address(this) rather than the original caller. Authorisation that compares msg.sender is
      therefore defeated by routing through this., and any state changes are still made in the same
      contract, so the pattern is easy to mistake for a no-op.
    volatility: stable
    edges:
      - { to: evm-call-context, type: requires }
      - { to: sol-function-visibility, type: contrasts }
    sources: [solidity-docs-contracts]
    misconceptions:
      - belief: "this.f() is a cheap internal call."
        reality: "It is a full external CALL, priced as an account access plus the call, and it resets msg.sender to the contract's own address."
        why: "The this. prefix reads like Java, where it is free."
        source: solidity-docs-contracts

  - id: staticcall-context
    title: STATICCALL context
    oneLine: "STATICCALL is CALL with value forced to zero plus a static flag that propagates into every subcall."
    statement: >
      STATICCALL executes like CALL with value fixed at zero and a static flag set for the whole
      subtree. Inside a static context, SSTORE, LOG0 through LOG4, CREATE, CREATE2, SELFDESTRUCT,
      and any CALL carrying non-zero value throw. The flag propagates into every nested call, so no
      contract reached from a static frame can write state either. EIP-214's enumerated list
      predates transient storage; TSTORE is believed to throw as well, but that is not confirmed
      against the EIP-1153 text.
    volatility: evolving
    edges:
      - { to: evm-call-context, type: requires }
      - { to: sol-view-pure, type: contrasts }
    sources: [eip-214, eip-1153]

  - id: staticcall-is-the-enforcement
    title: Staticcall turns a promise into a guarantee
    oneLine: "Solidity compiles external view calls to STATICCALL, which is what makes the promise enforceable."
    statement: >
      Solidity compiles an external call to a view function into STATICCALL. That is what converts
      a compile-time annotation into a runtime guarantee, and it is why calling a view function on
      an untrusted contract cannot re-enter and write your state. It does not make the result
      trustworthy: a view function can still report state that is mid-update, which is what
      read-only reentrancy against price oracles exploits.
    volatility: stable
    edges:
      - { to: staticcall-context, type: requires }
      - { to: sol-view-pure, type: deepens }
      - { to: cei-insufficient, type: applies }
    sources: [eip-214, solidity-docs-contracts]
    misconceptions:
      - belief: "staticcall prevents reentrancy in general."
        reality: "It prevents state-changing reentrancy in that subtree; read-only reentrancy — calling back into a view function that reports stale intermediate state — is still possible and has been exploited against price oracles."
        why: "The word static sounds total."
        source: eip-214

  - id: low-level-call-returns-bool
    title: A low-level call returns a boolean
    oneLine: ".call, .delegatecall and .staticcall return (bool success, bytes returndata) — and do not revert."
    statement: >
      The low-level forms return a tuple of a success flag and the raw return data. A failing
      subcall sets success to false and execution continues in the current frame; only an unhandled
      revert in the current frame reverts the transaction. Since 0.8 the compiler warns about an
      unused return value but does not stop you, so an unchecked success flag is a silent-failure
      bug that compiles cleanly.
    volatility: stable
    edges:
      - { to: evm-message-call, type: requires }
      - { to: call-returns-a-boolean, type: deepens }
      - { to: sol-custom-error, type: contrasts }
    sources: [solidity-docs-global-vars]
    misconceptions:
      - belief: "A failed low-level call reverts the transaction."
        reality: ".call returns false and execution continues; only an unhandled revert in the current frame reverts."
        why: "High-level typed calls auto-revert, and the two forms look almost identical at the call site."
        source: solidity-docs-global-vars

  - id: revert-bubbling
    title: Bubbling a revert reason
    oneLine: "Re-throwing a subcall's reason requires re-reverting the raw returndata yourself."
    statement: >
      A failed subcall's revert data sits in the returndata bytes and goes nowhere unless you put it
      there. require(success) discards it and replaces it with a bare failure. Preserving the
      callee's error means re-reverting the raw bytes, which in practice means a small assembly
      helper that calls revert with the returndata pointer and length. Done correctly, a custom
      error thrown several frames down reaches the top-level caller with its selector and arguments
      intact.
    volatility: stable
    edges:
      - { to: low-level-call-returns-bool, type: requires }
      - { to: revert-data-encoding, type: requires }
      - { to: abi-decode-validates, type: contrasts }
    sources: [eip-211, solidity-docs-global-vars]
    misconceptions:
      - belief: "require(success) after a low-level call gives the user a useful error."
        reality: "It replaces the callee's revert reason with a bare failure; you must re-revert the raw returndata to preserve it."
        why: "The reason bytes are sitting in a variable most call sites ignore."
        source: eip-211

  - id: try-catch-external-only
    title: try/catch works on external calls only
    oneLine: "try/catch covers external calls and contract creation, split into Error, Panic and raw bytes clauses."
    statement: >
      try/catch applies only to external function calls and to contract creation. Its clauses are
      catch Error(string) for the built-in string revert, catch Panic(uint) for compiler-inserted
      panics, and catch (bytes) for everything else including custom errors. It cannot catch a
      failure inside the current frame, and it cannot catch an out-of-gas that consumed the whole
      remaining budget.
    volatility: stable
    edges:
      - { to: low-level-call-returns-bool, type: requires }
      - { to: sol-builtin-error-selectors, type: applies }
    sources: [solidity-docs-control-structures]

  - id: returndata-bomb
    title: The returndata bomb
    oneLine: "A hostile callee can return megabytes and make the caller pay for the memory expansion."
    statement: >
      Both Solidity's high-level calls and the .call form copy the entire return data into the
      caller's memory. A hostile callee can return an arbitrarily large buffer and force the caller
      to pay quadratically growing memory-expansion gas for data it never reads, which turns a
      routine external call into a griefing vector. The defence is a low-level assembly call with
      out_size set to zero followed by a bounded RETURNDATACOPY, the shape popularised by
      ExcessivelySafeCall.
    volatility: stable
    edges:
      - { to: low-level-call-returns-bool, type: requires }
      - { to: "63-64-rule", type: requires }
      - { to: memory-expansion-quadratic, type: requires }
      - { to: gas-griefing, type: applies }
      - { to: revert-bubbling, type: contrasts }
    sources: [eip-211, excessively-safe-call]
    misconceptions:
      - belief: "gas: g guarantees the callee receives g gas."
        reality: "A subcall is capped at all but one sixty-fourth of the remaining gas, so requesting more silently gives less, and you can neither force a callee to run out at a chosen point nor guarantee it has enough."
        why: "The syntax reads like an exact allocation."
        source: eip-150

  - id: proxy-storage-slots
    title: Proxies keep their state out of the numbered range
    oneLine: "Proxy state lives at pseudorandom slots such as keccak256('eip1967.proxy.implementation') - 1."
    statement: >
      Because a proxy and its implementation both number their variables from slot 0, a proxy that
      declares ordinary state variables will collide with the implementation's. EIP-1967 solves it
      by fixing the implementation, admin and beacon addresses at pseudorandom slots derived as
      keccak256 of a namespaced string minus one, which sequential compiler-assigned slots cannot
      reach. ERC-7201 generalises the same idea into named storage namespaces.
    volatility: stable
    edges:
      - { to: delegatecall-storage-is-the-risk, type: requires }
      - { to: erc-1967-slots, type: deepens }
    sources: [eip-1967, eip-7201]

  - id: library-linking
    title: "Library calls: inlined or delegatecalled"
    oneLine: "internal library functions are inlined with a JUMP; public ones are deployed and DELEGATECALLed."
    statement: >
      A library's internal functions are compiled into the calling contract's own bytecode and
      reached with a plain JUMP, so they cost nothing extra and see the caller's storage directly.
      A library's public or external functions are deployed as a separate contract and reached by
      DELEGATECALL, which means the library address must be substituted into the bytecode at link
      time and the call carries real message-call cost.
    volatility: stable
    edges:
      - { to: sol-delegatecall-context, type: requires }
      - { to: sol-library-view-not-enforced, type: contrasts }
    sources: [solidity-docs-contracts]

  - id: tx-origin-not-eoa
    title: tx.origin no longer identifies an EOA
    oneLine: "Since EIP-7702 a delegated EOA runs contract code in its own top-level frame."
    statement: >
      The checks msg.sender == tx.origin and addr.code.length == 0 no longer prove that a caller is
      a plain externally owned account. EIP-7702 lets an EOA install a 23-byte delegation designator
      of the form 0xef0100 followed by an address, so EXTCODESIZE on it returns 23 and it executes
      contract code in its own top-level transaction. The code-length check was already broken in
      the other direction, since a contract in its constructor has zero code length.
    volatility: evolving
    edges:
      - { to: evm-call-context, type: requires }
      - { to: delegation-designator, type: requires }
      - { to: code-length-check-broken, type: deepens }
      - { to: delegatecall-no-code-succeeds, type: contrasts }
    sources: [eip-7702]
    misconceptions:
      - belief: "Checking addr.code.length == 0 proves the caller is an EOA."
        reality: "After EIP-7702 a delegated EOA carries 23 bytes of code, and a contract inside its constructor still has zero code length; both directions of the check are broken."
        why: "The check was standard, correct advice for roughly a decade."
        source: eip-7702
      - belief: "An attacker can brick your proxy by selfdestructing the implementation."
        reality: "Since EIP-6780 SELFDESTRUCT only removes code when executed in the same transaction as the contract's creation; otherwise it just moves the balance."
        why: "The 2017 Parity multisig incident is still the standard teaching example."
        source: eip-6780
