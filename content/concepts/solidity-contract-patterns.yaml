moduleId: solidity-contract-patterns
concepts:
  - id: cei-order
    title: Checks-Effects-Interactions
    oneLine: "Validate, then write all state, then call outside contracts last, so re-entry sees final state."
    statement: >
      Checks-Effects-Interactions orders a function as: validate inputs and permissions, write every
      state change the call implies, and only then call any other contract. Because the external
      call is last, a re-entrant call arriving through it observes the function's final state rather
      than a half-updated one. The Solidity docs' own security guidance states the ordering and the
      matching withdrawal pattern.
    volatility: stable
    edges:
      - { to: evm-message-call, type: requires }
      - { to: storage-slot, type: requires }
      - { to: cei-insufficient, type: contrasts }
    sources: [solidity-docs-security]

  - id: cei-insufficient
    title: What CEI does not cover
    oneLine: "CEI protects one function; cross-function, cross-contract and read-only reentrancy survive it."
    statement: >
      CEI guarantees only that the function it is applied to is internally consistent when re-entered.
      An attacker can re-enter a different function of the same contract that shares the invariant,
      re-enter through a second contract that reads your state, or — the case nothing on this list
      covers — call a view getter from inside the callback while an invariant is temporarily broken
      and act on the wrong answer. Read-only reentrancy has been exploited against price oracles.
    volatility: stable
    edges:
      - { to: cei-order, type: requires }
      - { to: staticcall-is-the-enforcement, type: applies }
      - { to: reentrancy-guard, type: contrasts }
    sources: [solidity-docs-security, cyfrin-reentrancy-checklist]
    misconceptions:
      - belief: "CEI alone makes a contract reentrancy-safe."
        reality: "It protects that one function; cross-function, cross-contract and read-only reentrancy all survive it."
        why: "Tutorials demonstrate the single-function withdraw bug and stop there."
        source: cyfrin-reentrancy-checklist

  - id: reentrancy-guard
    title: Reentrancy guard
    oneLine: "A mutex flag that blocks re-entry into any guarded function of the same contract."
    statement: >
      A reentrancy guard is a mutex: a flag set on entry and cleared on exit, with a check that
      reverts if the flag is already set. OpenZeppelin's nonReentrant modifier is the standard
      implementation. It covers every guarded function of one contract, which fixes cross-function
      reentrancy within that contract. It does nothing about a different contract reading your state
      mid-update, and nothing about a second contract in the same system.
    volatility: stable
    edges:
      - { to: cei-order, type: requires }
      - { to: cei-insufficient, type: contrasts }
    sources: [oz-docs-access-api, solidity-docs-security]

  - id: reentrancy-guard-transient
    title: Transient reentrancy guard
    oneLine: "Holding the mutex in EIP-1153 transient storage makes the guard roughly an order of magnitude cheaper."
    statement: >
      ReentrancyGuardTransient keeps the mutex in EIP-1153 transient storage using TSTORE and TLOAD,
      which never touch the state trie and never pay the cold-slot penalty. Measured on forge 1.7.1
      with solc 0.8.36 and the optimizer off, the transient guard added 284 gas to a call while the
      storage guard added 3,104 gas with a warm slot. The storage guard's cost is cold- and
      warm-dependent and ranges from roughly 3,100 to roughly 7,100; the transient guard is flat.
      Do not quote a single number for the storage guard — teach the range and measure your own.
      Note the guard is transaction-scoped, not call-scoped.
    volatility: evolving
    edges:
      - { to: reentrancy-guard, type: requires }
      - { to: transient-storage, type: requires }
      - { to: transient-reentrancy-guard, type: deepens }
      - { to: reentrancy-guard, type: contrasts }
    sources: [eip-1153, measured-gas-constants, oz-docs-access-api]

  - id: pattern-pull-payments
    title: Pull payments
    oneLine: "Record a credit and let the recipient call withdraw(), instead of pushing value out mid-logic."
    statement: >
      The pull pattern replaces sending value during your own logic with recording a credit balance
      the recipient later withdraws themselves. It moves the external call out of your critical path
      entirely, makes each recipient responsible for their own failure, and turns one unbounded loop
      into N independent transactions. It is the Solidity docs' own recommended withdrawal pattern.
    volatility: stable
    edges:
      - { to: evm-message-call, type: requires }
      - { to: cei-order, type: applies }
      - { to: push-payment-dos, type: contrasts }
    sources: [solidity-docs-security]

  - id: push-payment-dos
    title: Push payments are a liveness bug
    oneLine: "One recipient that reverts or burns gas can brick a whole distribution loop for everyone."
    statement: >
      Pushing funds inside a loop makes every recipient a dependency of every other. A recipient
      that reverts, that consumes all forwarded gas, or that is a contract with no payable fallback
      makes the whole distribution fail permanently. Since EIP-7825 capped a single L1 transaction
      at roughly 16.78M gas, a batch distribution that grows past that ceiling becomes unlandable
      rather than merely expensive — the failure mode is now a wall, not a cost curve.
    volatility: evolving
    edges:
      - { to: pattern-pull-payments, type: requires }
      - { to: gas-griefing, type: applies }
      - { to: pattern-pull-payments, type: contrasts }
    sources: [solidity-docs-security]

  - id: transfer-stipend-obsolete
    title: transfer and send are obsolete
    oneLine: "The fixed 2300-gas stipend is a compatibility bug, and solc 0.8.31 deprecated both functions."
    statement: >
      address.transfer and address.send forward a fixed 2300-gas stipend. Because gas costs are
      repriced by hard forks — EIP-1884 repriced SLOAD in 2019 — a fixed stipend is a compatibility
      constraint rather than a security control, and it breaks smart-contract wallets, account
      abstraction wallets and now EIP-7702 delegated EOAs. solc 0.8.31 deprecated both with a
      warning and the docs describe them as scheduled for removal. The current answer is
      call{value: x}("") with a checked return value, behind CEI and a guard.
    volatility: evolving
    edges:
      - { to: pattern-pull-payments, type: requires }
      - { to: low-level-call-returns-bool, type: requires }
      - { to: cei-order, type: contrasts }
    sources: [solidity-docs-security, solidity-changelog]
    misconceptions:
      - belief: "The 2300-gas stipend on .transfer() is a reentrancy defence."
        reality: "Gas costs are repriced by hard forks, so a fixed stipend is a compatibility bug rather than a security control, and it bricks multisig and account-abstraction wallets."
        why: "It was correct advice before 2019 and the advice outlived the pricing it depended on."
        source: solidity-docs-security
      - belief: "Pushing ETH to an EOA cannot execute code."
        reality: "Since EIP-7702 a delegated EOA runs contract code on receipt, so any anti-contract guard built on that assumption is unsound."
        why: "The EOA-cannot-execute rule held for a decade."
        source: eip-7702

  - id: access-ownable
    title: Ownable
    oneLine: "A single-address privilege bit; OZ 5.x requires the initial owner as a constructor argument."
    statement: >
      Ownable stores one privileged address and gates functions with an onlyOwner modifier. In
      OpenZeppelin 5.x the constructor takes an initialOwner argument explicitly — it no longer
      defaults to msg.sender — and unauthorised calls revert with the custom error
      OwnableUnauthorizedAccount. One address means one point of compromise and one point of loss.
    volatility: evolving
    edges:
      - { to: sol-modifier-placeholder, type: requires }
      - { to: access-roles, type: contrasts }
    sources: [oz-docs-access-control, oz-docs-access-api]

  - id: access-ownable2step
    title: Ownable2Step
    oneLine: "Transfer is split into a pending transferOwnership and an acceptOwnership by the new owner."
    statement: >
      Ownable2Step splits ownership transfer into two transactions: the current owner nominates a
      pending owner, and that address must call acceptOwnership to take over. A typo'd or
      unreachable address therefore costs one wasted transaction instead of permanently losing
      control of the contract.
    volatility: stable
    edges:
      - { to: access-ownable, type: requires }
      - { to: access-ownable, type: contrasts }
    sources: [oz-docs-access-api]

  - id: access-roles
    title: AccessControl
    oneLine: "Per-contract bytes32 roles, each with an admin role; DEFAULT_ADMIN_ROLE administers itself."
    statement: >
      AccessControl gives a contract a set of bytes32 role identifiers, each with an admin role that
      may grant and revoke it. DEFAULT_ADMIN_ROLE is its own admin, which makes it the root key of
      the contract: whoever holds it can grant themselves every other role. It should therefore be a
      multisig or a timelock rather than an EOA, and that decision is yours, not the library's.
    volatility: stable
    edges:
      - { to: access-ownable, type: requires }
      - { to: access-manager, type: contrasts }
    sources: [oz-docs-access-control, oz-docs-access-api]

  - id: access-manager
    title: AccessManager
    oneLine: "One contract holding permissions per (target, function selector) for a whole protocol, with per-role delays."
    statement: >
      AccessManager, added in OpenZeppelin 5.0, centralises authorisation for a whole protocol in a
      single contract. Roles are granted against a (target contract, function selector) pair rather
      than per contract, and each role can carry an execution delay, which provides timelock
      behaviour without a separate timelock contract. Whether it or AccessControl dominates real
      2026 deployments is not established; the OpenZeppelin docs recommend it, which is a vendor
      position rather than adoption evidence.
    volatility: evolving
    edges:
      - { to: access-roles, type: requires }
      - { to: abi-function-selector, type: requires }
      - { to: access-roles, type: contrasts }
    sources: [oz-docs-access-control, oz-docs-access-api]

  - id: access-control-is-top-loss
    title: Access control is where the money goes
    oneLine: "Access-control failure costs far more than reentrancy in every published count — though counts disagree on whether it is the single largest loss category, because they disagree on what to count."
    statement: >
      Two things must be said separately here, because the sources agree on one and disagree on the
      other. They agree on the comparison that matters to a contract author: access-control failure
      costs far more than reentrancy. OWASP's 2025 Smart Contract Top 10, ranking 149 documented 2024
      incidents by realised loss, puts access control first at $953.2M against reentrancy's $35.7M,
      and a systematic root-cause mapping of real-world smart-contract attacks reaches the same
      ordering. They disagree on the headline. A four-year study of 218 incidents totalling $7.76B
      puts private-key compromise first ($1,894M) and phishing and social engineering second
      ($1,511M), with access control third at $994M. The disagreement is about scope rather than
      arithmetic: the first two count smart-contract vulnerability categories, the third counts every
      documented incident including operational compromise. State the ordering both support; do not
      state either headline as the fact. Note that access control leads reentrancy in the wider count
      too, by roughly four times. The concrete bugs are mundane on any accounting: a missing modifier,
      an unprotected initializer, an over-privileged or compromised owner key. Reentrancy dominates
      curricula because it is the most teachable bug, not because it is the most costly one.
    volatility: evolving
    edges:
      - { to: access-roles, type: requires }
      - { to: cei-order, type: contrasts }
    claimKind: empirical
    sources: [sok-root-cause-losses, owasp-scs-top-10-2025, arxiv-audit-gap-2026]
    misconceptions:
      - belief: "Reentrancy is the top cause of smart-contract loss."
        reality: "Every published count puts access-control failure far above it — by roughly 27x in OWASP's 2024 incident data and by roughly 4x in a four-year, 218-incident study."
        why: "Reentrancy is the most teachable bug, so it dominates curricula rather than incident data."
        source: owasp-scs-top-10-2025
      - belief: "Access control is the number one category of crypto loss, full stop."
        reality: "Only among smart-contract vulnerability categories. Widen the count to all incidents and stolen keys and phishing both rank above it."
        why: "Rankings are quoted without their inclusion criteria, and the two populations are not the same population."
        source: arxiv-audit-gap-2026

  - id: pausability
    title: Pausable
    oneLine: "Pausable supplies whenNotPaused and whenPaused modifiers and ships with no access control at all."
    statement: >
      OpenZeppelin's Pausable provides the whenNotPaused and whenPaused modifiers and the internal
      _pause and _unpause functions. It deliberately ships with no authorisation on those internal
      functions: exposing them and deciding who may call them is your job. Forgetting to gate the
      pause entry point is a recurring real audit finding.
    volatility: stable
    edges:
      - { to: access-roles, type: requires }
      - { to: pause-is-centralisation, type: contrasts }
    sources: [oz-docs-access-api]
    misconceptions:
      - belief: "Pausable protects the pause function."
        reality: "OpenZeppelin ships _pause and _unpause as internal with no authorisation; you must add it, and forgetting to is a real audit finding."
        why: "The module name implies a complete, self-contained feature."
        source: oz-docs-access-api

  - id: pause-is-centralisation
    title: A pause switch is a trust assumption
    oneLine: "Pausing is a live centralisation vector users must be told about, not a neutral safety feature."
    statement: >
      A pause switch lets one party stop the protocol, which is exactly the power an attacker wants
      and exactly the power a user did not sign up for. Treat it as a disclosed trust assumption:
      say who holds it, put it behind a multisig, define an explicit unpause path, and decide in
      advance which functions stay open while paused — withdrawals usually should.
    volatility: stable
    edges:
      - { to: pausability, type: requires }
      - { to: pausability, type: contrasts }
    sources: [oz-docs-access-api, solidity-docs-security]

  - id: factory-create-vs-create2
    title: CREATE versus CREATE2
    oneLine: "CREATE derives the address from deployer and nonce; CREATE2 from deployer, salt and initcode hash."
    statement: >
      CREATE derives the new contract's address from the deployer address and its nonce, so the
      address depends on deployment history and cannot be known in advance of the ordering. CREATE2
      derives it from 0xff, the deployer, a salt and keccak256 of the initcode, so the address is
      computable before deployment — but it changes if the constructor arguments or the bytecode
      change, since both are inside the initcode hash.
    volatility: stable
    edges:
      - { to: create-address-from-nonce, type: requires }
      - { to: create2-address, type: requires }
      - { to: clone-eip1167, type: contrasts }
    sources: [oz-docs-proxy-api, solidity-docs-contracts]

  - id: clone-eip1167
    title: EIP-1167 minimal proxy
    oneLine: "A fixed 45-byte runtime that delegatecalls every call to one hard-coded implementation address."
    statement: >
      An EIP-1167 minimal proxy is a standardised, fixed 45-byte runtime — 55 bytes of creation code
      — that forwards every call by DELEGATECALL to one implementation address embedded in its
      bytecode, and returns whatever comes back. It turns a multi-thousand-byte deployment into a
      tiny one. How much gas that saves depends entirely on the implementation's size, and no
      canonical figure exists; measure it for your own contract.
    volatility: stable
    edges:
      - { to: sol-delegatecall-context, type: requires }
      - { to: factory-create-vs-create2, type: requires }
      - { to: delegatecall-proxy, type: contrasts }
    sources: [eip-1167, oz-docs-proxy-api]

  - id: clone-tradeoff
    title: The clone tradeoff
    oneLine: "Cheap to deploy, permanently more expensive to call — one extra delegatecall on every call forever."
    statement: >
      A clone trades a large one-time deployment saving for a permanent per-call cost: every call
      pays the proxy's own dispatch plus a DELEGATECALL before reaching any logic. That makes clones
      a clear win for many instances of the same contract and a clear loss for a singleton. The
      break-even instance count is a measurement, not a rule of thumb.
    volatility: stable
    edges:
      - { to: clone-eip1167, type: requires }
      - { to: clone-eip1167, type: contrasts }
    sources: [oz-docs-proxy-api, eip-1167]
    misconceptions:
      - belief: "Clones are strictly cheaper."
        reality: "Cheaper to deploy and permanently more expensive to call, because every call pays the proxy's dispatch plus a delegatecall."
        why: "Published benchmarks quote deployment gas only."
        source: oz-docs-proxy-api

  - id: clone-no-constructor
    title: A clone runs no constructor
    oneLine: "State must be set by an initialize() callable exactly once, and the implementation must disable its own."
    statement: >
      A clone's own bytecode is the 45-byte forwarder, so the implementation's constructor never
      runs in the clone's context. Initial state must be set by an initialize() function protected
      so it can be called exactly once. The implementation contract itself must call
      _disableInitializers() in its own constructor; otherwise anyone can initialise the
      implementation and take ownership of it. OpenZeppelin 5.6.0 closed the equivalent proxy
      footgun by making ERC1967Proxy revert with ERC1967ProxyUninitialized when deployed with no
      initializer.
    volatility: evolving
    edges:
      - { to: clone-eip1167, type: requires }
      - { to: initcode-vs-runtime-code, type: requires }
      - { to: factory-create-vs-create2, type: contrasts }
    sources: [oz-docs-proxy-api, oz-changelog]
    misconceptions:
      - belief: "An uninitialized implementation behind clones is harmless because nobody uses it directly."
        reality: "Anyone can call initialize() on the implementation and become its owner; historically that has been chained into delegatecall or selfdestruct to damage every clone."
        why: "The implementation feels like an abstract class rather than a live deployed contract."
        source: oz-docs-proxy-api

  - id: clone-not-upgradeable
    title: A clone is not upgradeable
    oneLine: "The implementation address is immutable bytecode inside the clone: cheap, and frozen."
    statement: >
      An EIP-1167 clone hard-codes its implementation address into its own runtime bytecode, which
      cannot be changed. Clones are a cheap-deployment pattern, not an upgrade pattern. Upgrading
      each instance independently needs an ERC-1967 proxy; upgrading all instances at once needs a
      beacon proxy.
    volatility: stable
    edges:
      - { to: clone-eip1167, type: requires }
      - { to: beacon-proxy, type: contrasts }
    sources: [eip-1167, oz-docs-proxy-api]
    misconceptions:
      - belief: "An EIP-1167 clone is an upgradeable proxy."
        reality: "The implementation address is immutable bytecode in the clone; it is a cheap deployment pattern, not an upgrade pattern."
        why: "Both use delegatecall, so the two patterns get collapsed into one."
        source: eip-1167
