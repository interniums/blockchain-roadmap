moduleId: solidity-errors-events
concepts:
  - id: sol-custom-error
    title: Custom error
    oneLine: "An error declared like an event and thrown with revert; its data is an ABI-encoded call to a same-named function."
    statement: >
      A custom error is declared like an event, for example error Unauthorized();, and raised with
      revert Unauthorized();. The revert data it produces is exactly the ABI encoding of a call to a
      function with the same name and parameter types: a four-byte selector followed by the encoded
      arguments. That is the whole mechanism — nothing about errors is a separate encoding.
    volatility: stable
    edges:
      - { to: abi-canonical-signature, type: requires }
      - { to: revert-data-encoding, type: deepens }
      - { to: sol-revert-string, type: contrasts }
    sources: [solidity-blog-custom-errors, solidity-abi-spec]

  - id: sol-error-selector
    title: Error selector
    oneLine: "An error's selector is derived exactly like a function selector, from its canonical signature."
    statement: >
      An error's selector is the first four bytes of keccak256 of its canonical signature, derived
      by exactly the same rule as a function selector. Unauthorized() is 0x82b42900 and
      InsufficientBalance(uint256,uint256) is 0xcf479181. The ABI spec reserves 0x00000000 and
      0xffffffff for future use. solc 0.8.32 fixed error and event selectors not being treated as
      compile-time constants, so pin 0.8.32 or later if you use MyError.selector in a constant
      expression.
    volatility: evolving
    edges:
      - { to: sol-custom-error, type: requires }
      - { to: abi-function-selector, type: requires }
    sources: [solidity-abi-spec, solidity-blog-custom-errors, solidity-changelog]

  - id: sol-revert-string
    title: Revert strings cost bytes twice
    oneLine: "A revert string is a selector plus a full ABI-encoded string, and the literal also sits in deployed bytecode."
    statement: >
      revert("Unauthorized") produces the Error(string) selector followed by a complete ABI-encoded
      string: an offset word, a length word and the padded bytes. The compiler team's own worked
      example needs 100 bytes of revert data where revert Unauthorized() needs 4. The string
      literal also has to be stored in the deployed bytecode, so the reliable, unconditional saving
      from custom errors is at deployment; the runtime saving only materialises when the revert
      actually fires. No trustworthy published gas figure exists for the runtime comparison, so
      measure it in your own build rather than quoting one.
    volatility: stable
    edges:
      - { to: sol-custom-error, type: requires }
      - { to: sol-custom-error, type: contrasts }
    sources: [solidity-blog-custom-errors]
    misconceptions:
      - belief: "Custom errors save gas at runtime, so they always save gas."
        reality: "The runtime saving only appears when the revert fires; the unconditional saving is in deploy cost, because revert string literals live in the deployed bytecode."
        why: "Gas reports foreground the revert path, which is the path you test."
        source: solidity-blog-custom-errors

  - id: sol-builtin-error-selectors
    title: Error(string) and Panic(uint256)
    oneLine: "Two selectors are built in: 0x08c379a0 for string reverts and 0x4e487b71 for panics."
    statement: >
      Two error signatures are built into the language. Error(string), selector 0x08c379a0, is what
      require(cond, "msg") and revert("msg") produce. Panic(uint256), selector 0x4e487b71, is what
      assert and every compiler-inserted safety check produce. A client that special-cases only
      these two can decode most reverts from older contracts and none of the custom ones.
    volatility: stable
    edges:
      - { to: sol-error-selector, type: requires }
      - { to: sol-custom-error, type: contrasts }
    sources: [solidity-docs-control-structures, solidity-abi-spec]

  - id: sol-panic-codes
    title: Panic codes
    oneLine: "A panic code names which compiler-inserted check fired: 0x11 overflow, 0x12 divide by zero, 0x32 index out of bounds."
    statement: >
      The uint256 carried by Panic classifies which compiler-detected condition fired: 0x01 a failed
      assert, 0x11 arithmetic overflow or underflow, 0x12 division or modulo by zero, 0x21 an
      out-of-range enum conversion, 0x22 a malformed storage byte array, 0x31 pop on an empty array,
      0x32 an out-of-bounds index, 0x41 an allocation that is too large, 0x51 a call through an
      uninitialised internal function pointer. A panic signals a condition properly functioning code
      should never create, so reaching one from valid external input is itself the bug.
    volatility: stable
    edges:
      - { to: sol-builtin-error-selectors, type: requires }
    sources: [solidity-docs-control-structures]
    misconceptions:
      - belief: "Receiving Panic(0x11) means the overflow guard is working correctly."
        reality: "A Panic means the compiler caught a condition that properly functioning code should never create; reaching one from valid external input is the bug, not the safety net doing its job."
        why: "The 0.8 checked-arithmetic revert is introduced as a safety feature, which it is — but it is a last resort, not an input validator."
        source: solidity-docs-control-structures
      - belief: "assert and require are two flavours of the same thing."
        reality: "assert produces Panic(uint256) and signals a bug in your own code; require produces Error(string) or your custom error and signals bad input. Since 0.8.0 assert no longer consumes all remaining gas, which removed the cost argument but not the semantic one."
        why: "Both take a boolean and both stop execution."
        source: solidity-docs-control-structures

  - id: sol-require-no-data
    title: require with no message returns no data
    oneLine: "require(bool) reverts with zero bytes — not even a selector — so there is nothing to decode."
    statement: >
      require(cond) with no second argument reverts with no return data at all: no selector, no
      arguments, nothing. Clients print a generic execution reverted message because that is all
      they have. It is strictly the worst option for debuggability, and worse than either a string
      or a custom error.
    volatility: stable
    edges:
      - { to: sol-builtin-error-selectors, type: requires }
      - { to: sol-revert-string, type: contrasts }
    sources: [solidity-docs-control-structures]
    misconceptions:
      - belief: "require(cond) gives the client a generic execution reverted message."
        reality: "It reverts with zero bytes of data, so there is nothing to decode; the generic message is the client inventing text for an empty payload."
        why: "Clients print a string that looks like it came from the contract."
        source: solidity-docs-control-structures

  - id: sol-require-with-error
    title: require with a custom error
    oneLine: "require(cond, CustomError(args)) has been supported since 0.8.26 via-IR and 0.8.27 legacy."
    statement: >
      The overload require(bool, error) has existed since solc 0.8.26 on the via-IR pipeline and
      0.8.27 on the legacy pipeline. The widely repeated advice that custom errors force you to
      write if (!cond) revert CustomError(); is obsolete. The canonical 2021 Solidity blog post
      still says the feature does not exist and has never been amended, which is why the stale claim
      persists. 0.8.35 additionally preserves custom-error arguments under --revert-strings strip.
    volatility: evolving
    edges:
      - { to: sol-custom-error, type: requires }
      - { to: sol-revert-string, type: contrasts }
    sources: [solidity-changelog, solidity-docs-control-structures]
    misconceptions:
      - belief: "You cannot use require with a custom error."
        reality: "require(bool, error) has existed since 0.8.26 on via-IR and 0.8.27 on the legacy pipeline."
        why: "The canonical 2021 Solidity blog post says so and has never been corrected."
        source: solidity-changelog

  - id: sol-require-args-eager
    title: require arguments are evaluated eagerly
    oneLine: "require's second argument is evaluated unconditionally, including on the happy path."
    statement: >
      Both arguments to require are evaluated before the check runs. require(cond,
      CustomError(compute())) calls compute() every time, including when cond is true. That costs
      gas on the success path and, if the expression has side effects or can itself revert, changes
      behaviour. Short-circuit intuition from && does not apply.
    volatility: stable
    edges:
      - { to: sol-require-with-error, type: requires }
      - { to: sol-modifier-placeholder, type: contrasts }
    sources: [solidity-docs-control-structures]
    misconceptions:
      - belief: "require(cond, CustomError(compute())) only calls compute() on failure."
        reality: "require arguments are evaluated unconditionally, so compute() runs on the happy path too, costing gas and possibly causing side effects."
        why: "Boolean short-circuit intuition from && and ||."
        source: solidity-docs-control-structures

  - id: error-data-untrusted
    title: Error data is untrusted input
    oneLine: "Any contract can return bytes matching any error signature, so a decoded name is a claim."
    statement: >
      Revert data travels up the call chain unlabelled — it carries no address and no proof of
      origin. Any contract can return bytes that match any error's selector and argument types, so
      decoding the data tells you what the bytes say, never which contract failed or whether the
      failure was genuine. The ABI spec states this as an explicit warning.
    volatility: stable
    edges:
      - { to: sol-error-selector, type: requires }
      - { to: revert-bubbling, type: contrasts }
    sources: [solidity-abi-spec]
    misconceptions:
      - belief: "Decoding an error name tells you which contract reverted."
        reality: "Error data bubbles up unlabelled and any contract can return bytes matching any error signature; the name is a claim, not provenance."
        why: "The client renders a tidy MyError(1, 2) with no address attached, which reads like a stack frame."
        source: solidity-abi-spec

  - id: error-client-surfacing
    title: How a client surfaces a revert
    oneLine: "Clients receive raw revert bytes on the JSON-RPC error and must match the selector against an ABI."
    statement: >
      A revert reaches a client as raw bytes in the data field of a JSON-RPC error. The client can
      only name the failure by matching the leading four bytes against an ABI it holds. viem raises
      ContractFunctionRevertedError carrying the decoded data, errorName and args, special-cases
      Error and Panic, and when the selector is absent from the ABI reports only the raw signature
      and points at a 4-byte directory.
    volatility: hot
    edges:
      - { to: sol-error-selector, type: requires }
      - { to: abi-decode-validates, type: contrasts }
    sources: [solidity-abi-spec, viem-contract-errors]

  - id: errors-not-in-abi-when-forwarded
    title: Forwarded errors are missing from the ABI
    oneLine: "A contract's ABI JSON lists its own errors, not errors thrown by contracts it calls."
    statement: >
      The compiler emits a contract's own error definitions into its ABI JSON, but not the errors of
      contracts it calls and forwards. A frontend holding only the entrypoint's ABI will therefore
      fail to name any error thrown deeper in the call stack. Multi-contract systems need a merged
      error ABI on the client, assembled deliberately rather than derived from one artifact.
    volatility: stable
    edges:
      - { to: error-client-surfacing, type: requires }
      - { to: error-data-untrusted, type: contrasts }
    sources: [solidity-blog-custom-errors, solidity-abi-spec]
    misconceptions:
      - belief: "The frontend will decode any revert my system produces."
        reality: "The ABI JSON contains only the contract's own errors, not those forwarded from contracts it calls, so multi-contract systems need a merged error ABI on the client."
        why: "Single-contract tutorials never reach the case."
        source: solidity-blog-custom-errors

  - id: sol-event-topics
    title: Event topics
    oneLine: "topics[0] is keccak256 of the event's canonical signature; up to three indexed parameters follow."
    statement: >
      A non-anonymous event's topics[0] is the Keccak-256 hash of its canonical signature, and up to
      three further parameters may be declared indexed, becoming topics[1] through topics[3]. An
      anonymous event omits topics[0] and may therefore index four parameters, at the cost of being
      undecodable without out-of-band knowledge of which event it is.
    volatility: stable
    edges:
      - { to: abi-canonical-signature, type: requires }
      - { to: topic0-is-the-signature, type: deepens }
      - { to: sol-error-selector, type: contrasts }
    sources: [solidity-abi-spec, solidity-docs-contracts]
    misconceptions:
      - belief: "Renaming an event parameter is as risky as any other event edit."
        reality: "Parameter names are not part of the signature, so renaming is safe; reordering, retyping or adding a parameter changes topics[0] and silently breaks every deployed indexer and filter."
        why: "The two edits look equally cosmetic in a diff."
        source: solidity-abi-spec

  - id: sol-event-data
    title: Event data
    oneLine: "Non-indexed parameters are ABI-encoded into the log's data field: readable, not filterable."
    statement: >
      Parameters not marked indexed are ABI-encoded — same head and tail rules as a function call —
      into the log's data field. They can be read by anyone who fetches the log and decodes it
      against the ABI, but they cannot be filtered on by a node, because eth_getLogs matches on
      topics only.
    volatility: stable
    edges:
      - { to: sol-event-topics, type: requires }
      - { to: abi-head-tail, type: requires }
      - { to: event-indexed-reference-types, type: contrasts }
    sources: [solidity-abi-spec]

  - id: events-are-not-readable-onchain
    title: Logs are not state
    oneLine: "Logs go to the receipt, never to state; no contract, not even the emitter, can read one back."
    statement: >
      Logs are written into the transaction receipt, not into the state trie. There is no opcode
      that reads a log, so no contract — including the one that emitted it — can ever read its own
      past events. Anything a contract needs to consult later must be in storage. Events exist for
      off-chain consumers only.
    volatility: stable
    edges:
      - { to: sol-event-data, type: requires }
      - { to: log-record-shape, type: deepens }
      - { to: storage-slot, type: contrasts }
    sources: [solidity-abi-spec, solidity-docs-contracts]
    misconceptions:
      - belief: "A contract can read its own past events."
        reality: "Logs go to the receipt trie, never to state, and no opcode reads them back."
        why: "Emitting an event sounds like writing a record somewhere durable and queryable."
        source: solidity-abi-spec

  - id: event-indexed-reference-types
    title: Indexed dynamic values are hashed
    oneLine: "An indexed string, bytes, array or struct stores its Keccak hash in the topic, not the value."
    statement: >
      When a parameter of dynamic type — string, bytes, an array, or a struct — is declared indexed,
      the topic holds keccak256 of the encoded value rather than the value itself. You can test
      whether it equals a known value, but you can never recover it from the log. The standard fix
      when you need both filtering and readability is to emit the same value twice, once indexed and
      once not.
    volatility: stable
    edges:
      - { to: sol-event-topics, type: requires }
      - { to: indexed-dynamic-is-hashed, type: deepens }
      - { to: sol-event-data, type: contrasts }
    sources: [solidity-abi-spec]
    misconceptions:
      - belief: "An indexed string can be read from the log."
        reality: "You get keccak256 of the value; you can test equality against a candidate but never recover the original."
        why: "The ABI still shows the parameter's declared type as string."
        source: solidity-abi-spec

  - id: log-gas-model
    title: What a log costs
    oneLine: "375 base, 375 per topic, 8 per byte of data, plus memory expansion."
    statement: >
      A LOG operation costs 375 gas base, 375 gas per topic, and 8 gas per byte of data, on top of
      any memory expansion needed to stage the data. The per-topic increment was measured at 375 on
      solc 0.8.36 and matches the execution-spec constants for the osaka fork. Indexing is therefore
      a per-field purchase, and moving a field from data into a topic is not free.
    volatility: evolving
    edges:
      - { to: sol-event-topics, type: requires }
      - { to: memory-expansion-quadratic, type: applies }
      - { to: sol-revert-string, type: contrasts }
    sources: [execution-specs-osaka-gas, measured-gas-constants]
    misconceptions:
      - belief: "Index everything so it can all be filtered."
        reality: "Each topic costs 375 gas, only three are available on a non-anonymous event, and indexing a string, bytes or array replaces the value with its hash so you can no longer read it back."
        why: "The word indexed reads like a database index, which is a pure win at query time and free at write time."
        source: solidity-abi-spec
