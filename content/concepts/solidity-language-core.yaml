moduleId: solidity-language-core
concepts:
  - id: sol-value-type
    title: Value type
    oneLine: "A type that is always copied on assignment and carries no data-location annotation."
    statement: >
      Value types — uint/int, bool, address, address payable, bytesN, enum, contract types,
      user-defined value types and function types — are always copied when assigned or passed.
      They take no storage/memory/calldata annotation because a value-typed local lives on the
      stack. Two value-typed names can therefore never alias the same underlying data.
    volatility: stable
    edges:
      - { to: sol-reference-type, type: contrasts }
    sources: [solidity-docs-types]

  - id: sol-reference-type
    title: Reference type
    oneLine: "A type accessed through a name that points at data elsewhere, so two names can alias it."
    statement: >
      Reference types — structs, arrays including bytes and string, and mappings — are handled
      through a name that refers to data held somewhere else. Because the name is a reference,
      two names can refer to the same data, and a write through one is visible through the other.
      This is why every reference-type variable must say where its data lives.
    volatility: stable
    edges:
      - { to: sol-value-type, type: requires }
      - { to: sol-value-type, type: contrasts }
    sources: [solidity-docs-types]

  - id: sol-data-location
    title: Data location
    oneLine: "Every reference-type variable is storage, memory or calldata, and there is no default."
    statement: >
      Every reference-type variable must be annotated storage, memory or calldata. There has been
      no implicit default since Solidity 0.5.0. storage is the contract's persistent state, memory
      is a per-call scratch area, and calldata is the read-only region holding the current external
      call's arguments. transient is a state-variable modifier for value types only; it is not
      a data location you can put on a struct, array, bytes or string.
    volatility: evolving
    edges:
      - { to: sol-reference-type, type: requires }
      - { to: storage-is-the-expensive-one, type: applies }
      - { to: memory-is-per-frame, type: applies }
      - { to: calldata-is-read-only, type: applies }
    sources: [solidity-docs-types]
    misconceptions:
      - belief: "transient is a data location you can put on a struct or an array."
        reality: "EIP-1153 transient storage is available for value-typed state variables only; transient is explicitly not supported as a data location for reference types."
        why: "TSTORE and TLOAD get taught as storage but cheap, which invites treating transient as a fourth location."
        source: solidity-docs-types

  - id: sol-assignment-copy-rules
    title: Assignment copies or aliases
    oneLine: "storage<->memory and calldata->anything deep-copy; memory->memory and storage->local-storage alias."
    statement: >
      Assignment between data locations follows four rules. Assignments between storage and memory,
      and from calldata to anything, always create an independent deep copy. Assignments from memory
      to memory only create a reference, so changes through one name are visible through the other.
      An assignment from storage to a local storage variable also only assigns a reference. Every
      other assignment into storage copies. Choosing a data location therefore changes what the
      program means, not merely what it costs.
    volatility: stable
    edges:
      - { to: sol-data-location, type: requires }
      - { to: sol-value-type, type: contrasts }
    sources: [solidity-docs-types]
    misconceptions:
      - belief: "memory versus storage is a performance hint."
        reality: "It changes assignment semantics — a storage-to-local-storage assignment aliases while a storage-to-memory assignment copies — so it changes program meaning, not just gas."
        why: "Learners map it onto stack-versus-heap intuition from C, where the choice is about lifetime and cost, not aliasing."
        source: solidity-docs-types

  - id: sol-calldata-immutable
    title: Calldata parameters
    oneLine: "calldata is the non-modifiable, non-persistent region holding this external call's raw arguments."
    statement: >
      calldata holds the raw arguments of the current external call. It cannot be written and does
      not persist beyond the call. Declaring a parameter calldata rather than memory avoids the copy
      that memory forces, so a function that only reads a few elements of a large array does not pay
      to materialise the whole thing. Calldata structs and arrays can be passed on and returned, but
      never allocated. Since 0.6.9 both memory and calldata are allowed at any visibility, so the
      old rule that external is cheaper than public is really a statement about forced copies.
    volatility: stable
    edges:
      - { to: sol-data-location, type: requires }
      - { to: calldata-is-read-only, type: deepens }
    sources: [solidity-docs-types]
    misconceptions:
      - belief: "external is always cheaper than public, so mark everything external."
        reality: "Since 0.6.9 both memory and calldata are allowed on parameters at any visibility, so a public function with calldata parameters gets the same argument handling; the old gas gap was about forced memory copies."
        why: "Pre-0.6.9 advice was never retired and still appears in style guides."
        source: solidity-docs-types

  - id: sol-storage-pointer-hazard
    title: Local storage pointer
    oneLine: "A local T storage p is a slot pointer: reassigning p retargets it, p.field = x writes state."
    statement: >
      A local variable declared T storage p holds a reference to a storage location, not a copy of
      the data. Assigning to p itself retargets the pointer and touches no state. Assigning through
      it, as in p.field = x, writes into contract storage. The two look almost identical in a diff,
      which is what makes the hazard worth naming explicitly.
    volatility: stable
    edges:
      - { to: sol-assignment-copy-rules, type: requires }
      - { to: sol-calldata-immutable, type: contrasts }
    sources: [solidity-docs-types]

  - id: sol-state-var-visibility
    title: State variable visibility
    oneLine: "State variables are public, internal or private; external is not allowed on them."
    statement: >
      A state variable may be public, internal or private. public makes the compiler generate a
      getter function — a getter only, never a setter. internal is the default and allows access
      from the contract and contracts derived from it. private restricts access to the declaring
      contract only, and derived contracts cannot see it. external is not a legal visibility for a
      state variable.
    volatility: stable
    edges:
      - { to: sol-function-visibility, type: contrasts }
    sources: [solidity-docs-contracts]

  - id: sol-function-visibility
    title: Function visibility
    oneLine: "external, public, internal, private — and external functions are reachable only by message call."
    statement: >
      An external function can only be called by a message call, so f() from inside the contract
      fails to compile while this.f() works, at the cost of a real external call. A public function
      is callable both ways. internal functions are callable from the contract and its descendants
      and can take mappings and storage references as parameters. private functions are the same but
      invisible to derived contracts.
    volatility: stable
    edges:
      - { to: sol-state-var-visibility, type: requires }
      - { to: sol-state-var-visibility, type: contrasts }
    sources: [solidity-docs-contracts]

  - id: sol-visibility-not-privacy
    title: Visibility is not privacy
    oneLine: "private and internal restrict which contracts may read state, never which humans may."
    statement: >
      Visibility keywords constrain what other contracts' code can reach at execution time. They do
      not hide anything from a person. Every slot of every contract's storage is world-readable off
      chain through eth_getStorageAt or by reading the state trie directly, whatever the declaration
      says. Storing a secret in a private variable publishes it.
    volatility: stable
    edges:
      - { to: sol-state-var-visibility, type: requires }
      - { to: state-as-keyvalue, type: applies }
    sources: [solidity-docs-contracts]
    misconceptions:
      - belief: "private means the data is hidden."
        reality: "All contract storage is publicly readable off-chain via eth_getStorageAt; visibility only constrains other contracts' code."
        why: "The keyword is borrowed from languages where private is an encapsulation boundary, and people read it as a security boundary."
        source: solidity-docs-contracts

  - id: sol-view-pure
    title: view and pure
    oneLine: "view promises no state modification and is enforced by STATICCALL; pure additionally promises no state reads."
    statement: >
      A view function promises not to modify state, and for external calls the compiler enforces this
      by using STATICCALL, which has been available since Byzantium. A pure function additionally
      promises not to read state, so it may not touch storage, balances, or most block, tx and msg
      members — msg.sig and msg.data are the exceptions, and reading an immutable can itself be a
      non-pure operation.
    volatility: stable
    edges:
      - { to: sol-function-visibility, type: requires }
      - { to: sol-payable, type: contrasts }
    sources: [solidity-docs-contracts]
    misconceptions:
      - belief: "pure means the function reads nothing external at all."
        reality: "A pure function may still read msg.sig and msg.data, and reading an immutable variable can be a non-pure operation."
        why: "The mathematical sense of pure over-generalises to everything outside the function body."
        source: solidity-docs-contracts

  - id: sol-payable
    title: payable
    oneLine: "A function must be marked payable to accept Ether; unmarked functions reject value-bearing calls."
    statement: >
      Only a function marked payable will accept a call carrying Ether. A call with non-zero value
      to a non-payable function reverts. payable is incompatible with view and pure, since accepting
      value changes the contract's balance.
    volatility: stable
    edges:
      - { to: sol-view-pure, type: requires }
      - { to: sol-view-pure, type: contrasts }
    sources: [solidity-docs-contracts]

  - id: sol-library-view-not-enforced
    title: Library view is compile-time only
    oneLine: "Library view functions are reached by DELEGATECALL, so the EVM never enforces their promise."
    statement: >
      A public or external library function is invoked with DELEGATECALL rather than STATICCALL.
      DELEGATECALL carries no static flag, so the runtime does not prevent state modification. The
      no-state-change promise of a library view function is therefore enforced by the compiler's
      static check alone, with no EVM-level guard behind it.
    volatility: stable
    edges:
      - { to: sol-view-pure, type: requires }
      - { to: sol-delegatecall-context, type: contrasts }
    sources: [solidity-docs-contracts]
    misconceptions:
      - belief: "view functions cannot change state, full stop."
        reality: "Library view functions are reached by DELEGATECALL, not STATICCALL, so the EVM does not enforce it at runtime — only the compiler's static check does."
        why: "The docs mention this only in a Note, and the enforcement story for ordinary contracts is airtight."
        source: solidity-docs-contracts

  - id: sol-modifier-placeholder
    title: The modifier placeholder
    oneLine: "_; marks where the function body is spliced in; a path that never reaches _; skips the body silently."
    statement: >
      A modifier's body wraps the function it decorates, and _; marks the point where the function
      body is spliced in. Code before _; is a precondition and code after it is a postcondition. If
      control reaches the end of the modifier without passing through _; — for example when the
      placeholder sits inside an if — the function body never runs, the call does not revert, and
      the function returns its declared types' zero values.
    volatility: stable
    edges:
      - { to: sol-function-visibility, type: requires }
      - { to: sol-custom-error, type: contrasts }
    sources: [solidity-docs-contracts]
    misconceptions:
      - belief: "A modifier that fails just reverts."
        reality: "A modifier that reaches its end without hitting _; — for example if (cond) { _; } — silently skips the function body and returns zero values with no revert."
        why: "The Solidity docs' own costs(uint price) example does exactly this, so the shape is widely copied."
        source: solidity-docs-contracts

  - id: sol-modifier-order
    title: Modifier ordering
    oneLine: "Multiple modifiers run left to right as written, each nesting inside the previous."
    statement: >
      When several modifiers decorate one function they execute in the order written, left to right,
      with each subsequent modifier nested inside the previous one's _;. The function body runs only
      when every modifier has reached its placeholder. Reordering modifiers can therefore change
      which check runs first and which revert a caller sees.
    volatility: stable
    edges:
      - { to: sol-modifier-placeholder, type: requires }
      - { to: sol-c3-linearisation, type: contrasts }
    sources: [solidity-docs-contracts]
    misconceptions:
      - belief: "virtual modifiers are the way to make modifiers overridable."
        reality: "Virtual modifiers are deprecated as of solc 0.8.31 and emit a warning; composing internal functions is the current answer."
        why: "The docs page still documents Modifier Overriding, so the feature looks current."
        source: solidity-changelog

  - id: sol-c3-linearisation
    title: C3 linearisation
    oneLine: "Bases are listed most base-like first — the reverse of Python — and lookup runs right to left."
    statement: >
      Solidity resolves multiple inheritance with C3 linearisation. Direct base contracts are listed
      from most base-like to most derived, which is the reverse of Python's convention. Name lookup
      searches the bases right to left, depth first, skipping bases already searched. An ordering
      that cannot be linearised is a compile error, not a silent choice.
    volatility: stable
    edges:
      - { to: sol-function-visibility, type: requires }
      - { to: sol-modifier-order, type: contrasts }
    sources: [solidity-docs-contracts, solidity-changelog]
    misconceptions:
      - belief: "You list base contracts in is A, B in any order you like."
        reality: "The order is semantic — most base-like first, most derived last, the reverse of Python — and a wrong order produces Linearization of inheritance graph impossible."
        why: "Most languages treat the base list as an unordered set."
        source: solidity-docs-contracts

  - id: sol-constructor-order
    title: Base constructor order
    oneLine: "Base constructors run in linearised order, whatever order you supplied their arguments in."
    statement: >
      Base constructors always execute in the linearised order of the inheritance graph, regardless
      of the order in which the derived contract supplies their arguments. The argument list looks
      like a call sequence and is not one. If a base's constructor depends on state set by another
      base, only the linearisation determines whether that dependency is satisfied.
    volatility: stable
    edges:
      - { to: sol-c3-linearisation, type: requires }
      - { to: sol-modifier-order, type: contrasts }
    sources: [solidity-docs-contracts]
    misconceptions:
      - belief: "Base constructors run in the order you pass their arguments."
        reality: "They always run in linearised order regardless of argument order."
        why: "The argument list in the inheritance clause reads like a sequence of calls."
        source: solidity-docs-contracts

  - id: sol-override-virtual
    title: virtual and override
    oneLine: "Overridable functions must be virtual, and a function inherited from several bases needs override(A, B)."
    statement: >
      A function can only be overridden if it is marked virtual, and an overriding function must be
      marked override. A function inherited from more than one base without a unique most-derived
      implementation must be explicitly overridden, naming every base it overrides as override(A, B).
      Interface functions are implicitly virtual. solc 0.8.36 fixed a bug present from 0.8.31 in
      which the linearizedBaseContracts annotation could be unintentionally reversed, affecting
      analysis and code generation that depend on inheritance order.
    volatility: evolving
    edges:
      - { to: sol-c3-linearisation, type: requires }
      - { to: sol-interface-vs-abstract, type: contrasts }
    sources: [solidity-docs-contracts, solidity-changelog]

  - id: sol-interface-vs-abstract
    title: Interface versus abstract contract
    oneLine: "An interface may hold no state, no constructor and no modifiers, and every function must be external."
    statement: >
      An interface may contain no function implementations, no state variables, no constructor and
      no modifiers, may inherit only from other interfaces, and all of its functions must be
      external. An abstract contract may have state variables, a constructor, modifiers and partial
      implementations, but cannot be deployed directly because at least one function is unimplemented.
    volatility: stable
    edges:
      - { to: sol-override-virtual, type: requires }
    sources: [solidity-docs-contracts]
    misconceptions:
      - belief: "An interface is just an abstract contract with no bodies."
        reality: "Interfaces additionally cannot declare state variables, constructors or modifiers, cannot inherit from contracts, and every function must be external."
        why: "The Java and TypeScript analogy is close enough to feel exact."
        source: solidity-docs-contracts
