moduleId: solidity-openzeppelin
concepts:
  - id: oz-is-the-stdlib
    title: The de facto standard library
    oneLine: "Solidity ships no standard library, so OpenZeppelin Contracts fills that role by convention."
    statement: >
      The Solidity language ships no standard library. OpenZeppelin Contracts occupies that position
      by convention rather than by mandate: it is the most audited, most deployed and most forked
      body of Solidity, and reading it is how most engineers learn what idiomatic Solidity looks
      like. That position is social, not technical — nothing in the toolchain requires it.
    volatility: stable
    edges:
      - { to: sol-c3-linearisation, type: requires }
      - { to: sol-interface-vs-abstract, type: requires }
      - { to: oz-not-a-framework, type: contrasts }
    sources: [oz-releases, oz-docs-access-control]

  - id: oz-not-a-framework
    title: A library, not a framework
    oneLine: "You inherit and compose its base contracts; it never runs your contract or makes decisions for it."
    statement: >
      OpenZeppelin Contracts is a set of base contracts and libraries you inherit from and compose.
      It is not a framework: it does not run anything, does not deploy anything, and makes no
      deployment, upgrade or governance decision on your behalf. Every privileged address in a
      contract built on it is a choice you made, not a default it supplied.
    volatility: stable
    edges:
      - { to: oz-is-the-stdlib, type: requires }
      - { to: oz-nonprovision, type: contrasts }
    sources: [oz-docs-access-control]

  - id: oz-v5-line
    title: The 5.x line
    oneLine: "5.7.0 shipped 29 July 2026; 5.0 (October 2023) remains the last breaking major, and there is no 6.0."
    statement: >
      The current line is 5.x, with 5.7.0 released 29 July 2026. The cadence in this line has been
      roughly quarterly: 5.2.0 in January 2025, 5.3.0 in April 2025, 5.4.0 in July 2025, 5.5.0 in
      October 2025, 5.6.0 and 5.6.1 in February 2026, and 5.7.0 in July 2026. 5.0, released October
      2023, is still the last breaking major; no 6.0 exists as of August 2026. Minor releases have
      nevertheless carried breaking changes, so read the changelog per bump rather than trusting
      semver alone.
    volatility: hot
    edges:
      - { to: oz-is-the-stdlib, type: requires }
      - { to: oz-v4-differences, type: contrasts }
    sources: [oz-changelog, oz-releases]

  - id: oz-v4-differences
    title: What changed from 4.x to 5.x
    oneLine: "Custom errors replaced revert strings, Ownable takes initialOwner, hooks collapsed to _update, gaps became namespaces."
    statement: >
      Migrating from 4.x to 5.x is not mechanical. Revert strings became typed custom errors.
      Ownable's constructor now requires an explicit initialOwner instead of defaulting to
      msg.sender. The ERC-20 before and after transfer hooks collapsed into a single _update.
      Counters, increaseAllowance and decreaseAllowance were deleted. Upgradeable storage moved from
      reserved gap arrays to ERC-7201 namespaces. Each of these breaks code, tests or a live
      deployment in a different way.
    volatility: evolving
    edges:
      - { to: oz-v5-line, type: requires }
      - { to: oz-v5-line, type: contrasts }
    sources: [oz-changelog, oz-contracts-5-announcement]

  - id: oz-custom-errors
    title: Custom errors throughout
    oneLine: "5.x reverts with typed errors like OwnableUnauthorizedAccount, not with strings to regex."
    statement: >
      OpenZeppelin 5.x replaced revert strings with typed custom errors across the library:
      OwnableUnauthorizedAccount, AccessControlUnauthorizedAccount, ERC20InsufficientBalance,
      EnforcedPause, ExpectedPause and so on. They are cheaper to deploy and give a client a
      decodable selector instead of a string to match on. Tests written against 4.x revert strings
      fail against 5.x and must be rewritten to assert selectors.
    volatility: stable
    edges:
      - { to: oz-v4-differences, type: requires }
      - { to: sol-custom-error, type: applies }
    sources: [oz-contracts-5-announcement, oz-changelog]
    misconceptions:
      - belief: "require(cond, \"Not owner\") is the OpenZeppelin style."
        reality: "5.x is custom errors throughout; string reverts are the 4.x style and cost more deploy gas."
        why: "The string form is what every older tutorial shows."
        source: oz-contracts-5-announcement

  - id: oz-safe-defaults
    title: The safe defaults
    oneLine: "The simple, widely deployed, hard-to-misuse contracts: tokens, access, guards, SafeERC20, Clones, ECDSA."
    statement: >
      The contracts treated as safe defaults are the ones that are simple, widely deployed and hard
      to misuse: ERC20, ERC721, ERC1155, Ownable and Ownable2Step, AccessControl, Pausable,
      ReentrancyGuard and ReentrancyGuardTransient, SafeERC20, Clones, MerkleProof, ECDSA and
      EIP712, SafeCast, and Address. Reaching outside that set is a decision that deserves a reason.
    volatility: evolving
    edges:
      - { to: oz-is-the-stdlib, type: requires }
      - { to: oz-draft-contracts, type: contrasts }
    sources: [oz-releases, oz-docs-access-control]

  - id: oz-draft-contracts
    title: draft- and mocks/ carry a weaker promise
    oneLine: "draft-prefixed files track non-Final EIPs and mocks/ is test scaffolding that must never ship."
    statement: >
      Files under contracts/mocks are test scaffolding and must never appear in a deployment.
      Anything with a draft- prefix tracks an EIP that is not Final and carries a weaker stability
      and audit promise; the prefix is removed only when the underlying EIP finalizes, and that
      removal changes import paths. It is all one npm package, so the distinction is visible only in
      the path.
    volatility: evolving
    edges:
      - { to: oz-safe-defaults, type: requires }
      - { to: oz-safe-defaults, type: contrasts }
    sources: [oz-releases, oz-changelog]
    misconceptions:
      - belief: "Everything in the repository carries the same guarantee."
        reality: "draft-prefixed files track non-Final EIPs and can change; mocks/ is test scaffolding and must never ship."
        why: "It arrives as a single npm package with a single version number."
        source: oz-releases

  - id: oz-upgradeable-package
    title: contracts-upgradeable is transpiled
    oneLine: "It is machine-generated from the main package, replacing constructors with __Contract_init."
    statement: >
      @openzeppelin/contracts-upgradeable is not a separate codebase. It is produced by a
      transpiler from the main package, mechanically replacing constructors with __Contract_init
      initializer functions. The two packages must be installed together and at the same version;
      mixing versions produces contracts compiled against mismatched assumptions.
    volatility: evolving
    edges:
      - { to: oz-v5-line, type: requires }
      - { to: delegatecall-proxy, type: requires }
      - { to: clone-no-constructor, type: applies }
    sources: [oz-docs-upgradeable, oz-upgradeable-changelog]
    misconceptions:
      - belief: "contracts-upgradeable is a hand-maintained alternate library."
        reality: "It is transpiled from the main package; the two must be used at the same version, and stateless contracts are no longer transpiled at all."
        why: "Two npm packages look like two projects."
        source: oz-docs-upgradeable

  - id: oz-stateless-not-transpiled
    title: Stateless contracts are no longer transpiled
    oneLine: "From 5.5.0, contracts with no storage are imported from the main package even in upgradeable projects."
    statement: >
      From 5.5.0 onward, contracts that hold no storage are not transpiled at all —
      ReentrancyGuard, ReentrancyGuardTransient, ERC721Holder, ERC1155Holder, and since then
      Initializable and UUPSUpgradeable. In an upgradeable project you import them from the main
      package. A contract with no state has nothing for the initializer transformation to do, so
      the transpiled copy was pure duplication.
    volatility: evolving
    edges:
      - { to: oz-upgradeable-package, type: requires }
      - { to: oz-upgradeable-package, type: contrasts }
    sources: [oz-upgradeable-changelog, oz-changelog]

  - id: oz-storage-gaps
    title: Storage gaps
    oneLine: "The pre-5.0 idiom reserved trailing slots with __gap arrays so a base could add variables later."
    statement: >
      Before 5.0 the upgradeable contracts reserved trailing slots with a declaration such as
      uint256[50] private __gap, so a base contract could add a state variable in a later version
      without shifting every derived contract's variables. It worked and it broke the moment anyone
      miscounted, and it is why upgrading a live proxy from 4.x to 5.x is storage-incompatible.
    volatility: stable
    edges:
      - { to: oz-upgradeable-package, type: requires }
      - { to: storage-slot, type: requires }
      - { to: oz-namespaced-storage, type: contrasts }
    sources: [oz-pr-4534, oz-docs-upgradeable]
    misconceptions:
      - belief: "Storage gaps are still the recommended upgradeable pattern."
        reality: "ERC-7201 namespaced storage replaced them in 5.0 and removes the whole class of gap-miscount bugs."
        why: "Gaps dominated tutorials for about five years."
        source: oz-pr-4534

  - id: oz-namespaced-storage
    title: Namespaced storage in 5.x
    oneLine: "Each upgradeable contract's state lives in a struct at an ERC-7201 hashed slot."
    statement: >
      Since 5.0 the upgradeable variants place each contract's state in a struct rooted at a hashed
      slot, annotated @custom:storage-location erc7201:<id>, instead of reserving trailing gap
      slots. Adding a field extends that struct inside its own namespace and shifts nothing
      elsewhere, so inheritance order no longer constrains what you may add.
    volatility: evolving
    edges:
      - { to: oz-upgradeable-package, type: requires }
      - { to: erc-7201-namespaced-storage, type: requires }
      - { to: oz-storage-gaps, type: contrasts }
    sources: [oz-pr-4534, eip-7201, oz-docs-upgradeable]

  - id: oz-upgrade-unsafe-across-majors
    title: 4.x to 5.x on a live proxy is unsafe
    oneLine: "The layout model changed from gaps to namespaces, so the upgrade corrupts state rather than failing to compile."
    statement: >
      Upgrading a deployed proxy from a 4.x implementation to a 5.x implementation is unsafe by
      default because the storage layout model changed. This is a data-corruption class of bug, not
      a compile error: the new implementation compiles cleanly and reads the old bytes under a
      different interpretation. A documented case ended with a live contract permanently deadlocked.
    volatility: evolving
    edges:
      - { to: oz-storage-gaps, type: requires }
      - { to: oz-namespaced-storage, type: requires }
      - { to: layout-migration-hazard, type: deepens }
    sources: [oz-issue-6362, oz-docs-upgradeable, 51nodes-v4-v5-unsafe]
    misconceptions:
      - belief: "You can bump a deployed proxy's implementation from OpenZeppelin 4.x to 5.x."
        reality: "The storage model changed from gap reservations to ERC-7201 namespaces, so the layouts are incompatible and the upgrade silently corrupts state."
        why: "It compiles, and semver 4 to 5 reads like a routine dependency bump."
        source: 51nodes-v4-v5-unsafe

  - id: oz-upgrades-plugins
    title: The upgrades plugins are the enforcement layer
    oneLine: "They diff storage layouts between versions and refuse an upgrade that would corrupt state."
    statement: >
      The @openzeppelin/upgrades-core plugins for Hardhat and Foundry are what actually prevents a
      corrupting upgrade. They diff the storage layout of the new implementation against the
      recorded layout of the deployed one and refuse the upgrade if it would shift or retype
      anything, and they flag constructors, immutable variables, selfdestruct and delegatecall in
      implementations. An upgrade performed outside them has no such check.
    volatility: evolving
    edges:
      - { to: oz-upgradeable-package, type: requires }
      - { to: oz-upgrade-unsafe-across-majors, type: applies }
    sources: [oz-docs-writing-upgradeable, oz-docs-upgradeable]

  - id: oz-account-abstraction-modules
    title: First-party account abstraction
    oneLine: "Since 5.4 and 5.5 the library ships Account, ERC-7579 modules, signer modules and, in 5.7, paymasters."
    statement: >
      OpenZeppelin now ships a first-party account-abstraction stack: Account and AccountERC7579,
      signer modules including ECDSA, P256, RSA and WebAuthn passkeys, ERC-7913 multi-signer
      verification, and paymaster implementations added in 5.7. This is genuinely new and post-dates
      most tutorials, so the claim that OpenZeppelin provides nothing for account abstraction is now
      wrong.
    volatility: hot
    edges:
      - { to: oz-v5-line, type: requires }
      - { to: oz-nonprovision, type: contrasts }
    sources: [oz-changelog, oz-releases]

  - id: oz-crosschain-modules
    title: Crosschain primitives
    oneLine: "5.6 and 5.7 added ERC-7786 gateways, token bridges, interoperable addresses and a TrieProof library."
    statement: >
      Releases 5.6 and 5.7 added crosschain primitives: ERC-7786 messaging gateway interfaces,
      bridge contracts for ERC-20, ERC-721 and ERC-1155, CrosschainLinked and ERC20Crosschain,
      GovernorCrosschain, ERC-7930 interoperable addresses, and a TrieProof library. Together with
      the account work, this is the library's direction of travel over the last 18 months — away
      from tokens, which were already solved.
    volatility: hot
    edges:
      - { to: oz-v5-line, type: requires }
      - { to: oz-nonprovision, type: contrasts }
    sources: [oz-changelog, oz-releases]

  - id: oz-nonprovision
    title: What OpenZeppelin deliberately does not provide
    oneLine: "No DEX, no oracle, no stablecoin, no automation, no deployment scripts, and no policy decisions."
    statement: >
      OpenZeppelin deliberately provides no DEX or AMM, no oracles or price feeds, no stablecoin, no
      keepers or automation, no off-chain infrastructure, no opinionated deployment scripts and no
      testing framework. It also decides none of your policy: not your access-control model, not who
      may pause, not who may upgrade. Those require market design, off-chain infrastructure or
      organisational judgement, which a library cannot supply.
    volatility: stable
    edges:
      - { to: oz-not-a-framework, type: requires }
      - { to: oz-account-abstraction-modules, type: contrasts }
    sources: [oz-docs-access-control, oz-releases]
    misconceptions:
      - belief: "OpenZeppelin provides an oracle or price feed you can inherit."
        reality: "It deliberately does not; oracles require off-chain infrastructure or market design, which a library cannot supply."
        why: "It covers so much that people assume it covers everything."
        source: oz-docs-access-control

  - id: oz-audit-is-not-your-audit
    title: Their audit is not your audit
    oneLine: "The library is audited in isolation; your composition, roles and business logic are not."
    statement: >
      OpenZeppelin's code being audited says nothing about your assembly of it. The overwhelming
      majority of exploits in systems built on OpenZeppelin are in application logic and in how
      privileges were assigned, not in the library. Audit coverage is also per release and per
      report: do not claim a specific version is audited without a link to the report for that
      version.
    volatility: stable
    edges:
      - { to: oz-is-the-stdlib, type: requires }
      - { to: access-control-is-top-loss, type: requires }
      - { to: oz-safe-defaults, type: contrasts }
    sources: [sok-root-cause-losses, oz-releases]
    misconceptions:
      - belief: "OpenZeppelin is audited, so a contract built on it is safe."
        reality: "The library is audited in isolation; your composition, your privileged roles and your business logic are not, and that is where nearly all losses occur."
        why: "The audit badge transfers emotionally but not technically."
        source: sok-root-cause-losses

  - id: oz-wizard
    title: The Contracts Wizard
    oneLine: "Generates a compiling, idiomatic starting point from checkboxes — and a set of privileged roles you must staff."
    statement: >
      The Contracts Wizard generates a compiling contract from a checkbox selection of token type,
      mintable, pausable, votes and upgradeable. It is the fastest way to see what idiomatic
      composition against the current version looks like, and a good oracle for what good looks like
      when you are unsure. What it produces is scaffolding: every privileged role it emits is a
      decision you still have to make and an address you still have to choose.
    volatility: evolving
    edges:
      - { to: oz-safe-defaults, type: requires }
      - { to: oz-audit-is-not-your-audit, type: contrasts }
    sources: [oz-wizard-tool, oz-docs-access-control]
