moduleId: solidity-proxies-upgrades
concepts:
  - id: delegatecall-proxy
    title: The delegatecall proxy
    oneLine: "The proxy holds the storage and the balance; the implementation supplies only the code."
    statement: >
      A proxy is a contract whose fallback forwards every call by DELEGATECALL to an implementation
      address it stores. Because delegatecall keeps the caller's context, the state and the balance
      live in the proxy and only the code comes from the implementation. Users interact with one
      stable address, and changing behaviour means changing one stored pointer.
    volatility: stable
    edges:
      - { to: sol-delegatecall-context, type: requires }
      - { to: storage-slot, type: requires }
      - { to: abi-fallback-receive, type: requires }
    sources: [eip-1967, rareskills-erc1967]
    misconceptions:
      - belief: "An upgradeable contract is safer because bugs can be fixed."
        reality: "It adds an admin key, which is a trust assumption and an attack surface that an immutable contract does not have."
        why: "Fixability is a visible benefit and the added key is an invisible cost."
        source: zealynx-upgrade-patterns

  - id: storage-collision
    title: Storage collision
    oneLine: "If both sides number their variables from slot 0, implementation writes overwrite proxy control state."
    statement: >
      The proxy and the implementation are compiled separately, and each numbers its own state
      variables from slot 0. Under delegatecall the implementation's writes land in the proxy's
      storage at those same slot numbers, so an implementation write to its first variable
      overwrites whatever the proxy keeps in slot 0 — classically the implementation address itself.
      Nothing warns you; the write succeeds and the contract silently changes identity.
    volatility: stable
    edges:
      - { to: delegatecall-proxy, type: requires }
      - { to: slot-packing, type: requires }
      - { to: delegate-storage-collision, type: deepens }
    sources: [eip-1967, rareskills-erc1967]

  - id: erc-1967-slots
    title: ERC-1967 storage slots
    oneLine: "Standardised pseudorandom slots such as keccak256('eip1967.proxy.implementation') - 1."
    statement: >
      EIP-1967 fixes the proxy's implementation, admin and beacon addresses at slots derived as the
      keccak256 of a namespaced string minus one. The derivation puts them at pseudorandom positions
      that the compiler's sequential slot assignment cannot reach, so proxy state and implementation
      state can never collide. The minus one is what makes the slot value not a preimage of any
      known hash. Every major block explorer reads these slots to show a proxy's implementation.
    volatility: stable
    edges:
      - { to: storage-collision, type: requires }
      - { to: hash-function, type: requires }
      - { to: proxy-storage-slots, type: deepens }
    sources: [eip-1967, rareskills-erc1967]
    misconceptions:
      - belief: "ERC-1967 makes storage collisions impossible."
        reality: "It removes proxy-versus-implementation collisions. Collisions between one implementation and the next one you deploy remain entirely possible."
        why: "The standard is described as solving the storage collision problem, which is true of one of the two problems."
        source: oz-issue-6362

  - id: transparent-proxy
    title: Transparent proxy
    oneLine: "Admin calls go to the proxy and everything else to the implementation, so selectors cannot clash."
    statement: >
      A transparent proxy resolves the selector-clash problem by splitting on caller: calls from the
      admin address are handled by the proxy's own admin functions, and calls from anyone else are
      always forwarded to the implementation. No selector is ever ambiguous, at the cost of an extra
      check on every call and an admin that cannot use the contract normally.
    volatility: stable
    edges:
      - { to: erc-1967-slots, type: requires }
      - { to: abi-selector-collision-risk, type: applies }
      - { to: uups-proxy, type: contrasts }
    sources: [rareskills-transparent-proxy, nomic-proxy-backdoors, eip-1967]

  - id: uups-proxy
    title: UUPS proxy
    oneLine: "The upgrade function lives in the implementation, making the proxy cheaper and the future riskier."
    statement: >
      A UUPS proxy puts the upgrade logic in the implementation rather than the proxy, so the proxy
      itself is minimal and every call avoids the transparent pattern's admin check. The cost is
      that upgradeability now depends on the implementation: every future implementation you ship
      must itself contain a correctly authorised upgrade function.
    volatility: stable
    edges:
      - { to: erc-1967-slots, type: requires }
      - { to: transparent-proxy, type: contrasts }
    sources: [zealynx-upgrade-patterns, eip-1967]
    misconceptions:
      - belief: "UUPS is simply the better modern choice."
        reality: "It is cheaper per call, and it moves the bricking risk into every future implementation you ship."
        why: "Gas comparisons are one-dimensional and the risk is conditional on a future mistake."
        source: zealynx-upgrade-patterns

  - id: beacon-proxy
    title: Beacon proxy
    oneLine: "Many proxies read their implementation from one beacon, so a single upgrade moves them all."
    statement: >
      A beacon proxy stores the address of a beacon contract rather than an implementation, and
      queries the beacon for the implementation on every call. Upgrading the beacon upgrades every
      proxy pointing at it in one transaction, which is the right shape for many identical instances
      — and it concentrates the blast radius of a bad upgrade or a compromised beacon key into a
      single action.
    volatility: stable
    edges:
      - { to: erc-1967-slots, type: requires }
      - { to: clone-not-upgradeable, type: contrasts }
    sources: [eip-1967, zealynx-upgrade-patterns]

  - id: uups-bricking-risk
    title: UUPS bricking
    oneLine: "Ship one implementation without a working upgrade function and the contract is permanently locked."
    statement: >
      Because the upgrade entry point lives in the implementation, an implementation that omits it,
      or guards it with an authorisation check that can never pass, removes the only route to
      another implementation. The proxy keeps working and can never be changed again. This is not
      recoverable by any on-chain transaction, which is why the OpenZeppelin upgrade plugins refuse
      an upgrade to an implementation with no upgrade path.
    volatility: stable
    edges:
      - { to: uups-proxy, type: requires }
      - { to: access-roles, type: requires }
    sources: [zealynx-upgrade-patterns, oz-docs-writing-upgradeable]

  - id: erc-7201-namespaced-storage
    title: ERC-7201 namespaced storage
    oneLine: "Each component's state lives in a struct at a derived root slot instead of the sequential range."
    statement: >
      ERC-7201 places a component's state in a single struct rooted at a slot derived from a
      namespace identifier, annotated in source as @custom:storage-location. Adding a field extends
      the struct within its own namespace and shifts nothing anywhere else, which removes the whole
      class of bugs that sequential layouts and reserved gap arrays exist to manage. solc exposes
      the derivation as an erc7201 builtin from 0.8.35.
    volatility: evolving
    edges:
      - { to: storage-collision, type: requires }
      - { to: mapping-slot-derivation, type: requires }
      - { to: erc-1967-slots, type: contrasts }
    sources: [eip-7201, solidity-docs-storage-layout, oz-pr-4534]

  - id: layout-migration-hazard
    title: Migrating between layout schemes can brick a live contract
    oneLine: "A v4-to-v5 layout migration deadlocked a live BNB Chain proxy: it can no longer be initialized, upgraded or administered."
    statement: >
      Moving a live proxy from one storage-layout scheme to another can place a leftover value into
      a slot the new scheme interprets differently, and if that violates a Solidity encoding
      invariant the contract becomes unusable. A documented case on BNB Smart Chain: an
      OpenZeppelin v4 contract's _initialized flag, holding 0x01, landed in the slot that v5's first
      ERC-7201 string field occupies. A string slot whose low bit is set means a long string with a
      length derived from that word, so the encoding is malformed and every path that touches it
      reverts. The contract cannot be initialized, upgraded or administered by any on-chain
      transaction.
    volatility: evolving
    edges:
      - { to: erc-7201-namespaced-storage, type: requires }
      - { to: uups-bricking-risk, type: requires }
      - { to: dynamic-array-layout, type: requires }
      - { to: oz-upgrade-unsafe-across-majors, type: applies }
    sources: [oz-issue-6362, eip-7201]
    misconceptions:
      - belief: "Upgrading to a newer OpenZeppelin major version is routine maintenance."
        reality: "The v4-to-v5 layout scheme change permanently deadlocked a live contract; it compiles and it corrupts."
        why: "Semver reads as a dependency bump, and the compiler has nothing to check across two separate deployments."
        source: oz-issue-6362
