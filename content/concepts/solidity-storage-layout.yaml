moduleId: solidity-storage-layout
concepts:
  - id: storage-slot
    title: Storage slot
    oneLine: "Contract storage is a mapping from a 256-bit slot number to a 32-byte word."
    statement: >
      A contract's storage is a mapping from 2**256 slot numbers to 32-byte values. Statically sized
      state variables are assigned slots by the compiler starting at slot 0, in declaration order.
      A slot that has never been written reads as zero and occupies nothing; there is no allocation
      step. Slot assignment is a compiler decision, and it is the only identity a delegatecall or a
      raw storage read has to work with.
    volatility: stable
    edges:
      - { to: key-value-state, type: requires }
      - { to: state-as-keyvalue, type: applies }
      - { to: zero-slot-is-absent, type: deepens }
    sources: [solidity-docs-storage-layout]

  - id: slot-packing
    title: Slot packing
    oneLine: "Contiguous variables smaller than 32 bytes share one slot when they fit, lower-order first."
    statement: >
      When several contiguously declared state variables each need fewer than 32 bytes, the compiler
      packs them into a single slot, starting from the low-order end. A variable that does not fit
      in the remaining space starts a new slot. Reading or writing one packed field costs extra
      masking and shifting work on top of the slot access, because the EVM only ever loads and
      stores whole words.
    volatility: stable
    edges:
      - { to: storage-slot, type: requires }
    sources: [solidity-docs-storage-layout]
    misconceptions:
      - belief: "Packing always saves gas."
        reality: "Reading one variable out of a shared slot requires masking, and writing one requires a read-modify-write; a packed layout can cost more when the fields are accessed independently and often."
        why: "Deployment-time slot counts are easy to compare and runtime access patterns are not."
        source: solidity-docs-storage-layout

  - id: packing-order-matters
    title: Declaration order determines slot count
    oneLine: "uint128, uint128, uint256 takes two slots; uint128, uint256, uint128 takes three."
    statement: >
      Because packing only combines contiguously declared variables, the order in which you declare
      them decides how many slots the contract uses. uint128, uint128, uint256 occupies two slots;
      the same three variables declared uint128, uint256, uint128 occupies three. Declaration order
      is therefore a gas decision on both deployment and every write, not a stylistic one.
    volatility: stable
    edges:
      - { to: slot-packing, type: requires }
      - { to: sstore-dynamic-pricing, type: applies }
    sources: [solidity-docs-storage-layout]
    misconceptions:
      - belief: "Declaration order is stylistic."
        reality: "It directly determines how many slots the contract uses and therefore what deployment and writes cost."
        why: "In every other language field order is a formatting choice."
        source: solidity-docs-storage-layout

  - id: struct-array-new-slot
    title: Structs and arrays start a new slot
    oneLine: "Struct and array data always begins a new slot and packs tightly only within itself."
    statement: >
      The elements of a struct and the elements of an array always start at a fresh slot boundary,
      and the items following a struct or array also start a new slot. Packing happens inside the
      struct or array according to the same contiguity rule, but never across its boundary. This is
      why moving a small variable above or below a struct can change the whole contract's slot map.
    volatility: stable
    edges:
      - { to: slot-packing, type: requires }
    sources: [solidity-docs-storage-layout]

  - id: mapping-slot-derivation
    title: Mapping slot derivation
    oneLine: "A mapping value lives at keccak256(key concatenated with the mapping's declared slot)."
    statement: >
      For a mapping declared at slot p, the value for key k is stored at keccak256(h(k) . p), where
      the key and the slot number are each padded to 32 bytes and h is the identity for value types.
      Slot p itself stays empty. It still has to exist and be reserved, because it is what makes two
      adjacent mappings produce different hash distributions rather than colliding.
    volatility: stable
    edges:
      - { to: storage-slot, type: requires }
      - { to: hash-function, type: requires }
    sources: [solidity-docs-storage-layout]
    misconceptions:
      - belief: "A mapping's declared slot holds data."
        reality: "It stays empty; it exists to seed the hash derivation so that two adjacent mappings get different distributions."
        why: "Every other declared variable occupies the slot it is assigned."
        source: solidity-docs-storage-layout

  - id: dynamic-array-layout
    title: Dynamic array layout
    oneLine: "The declared slot holds the length; elements run contiguously from keccak256(slot)."
    statement: >
      For a dynamic array declared at slot p, slot p holds the number of elements and the element
      data starts at keccak256(p), running contiguously and packing according to the normal rules.
      bytes and string are special-cased: short values up to 31 bytes are stored inline in slot p
      together with a length marker, and only longer values move out to the hashed region.
    volatility: stable
    edges:
      - { to: mapping-slot-derivation, type: requires }
    sources: [solidity-docs-storage-layout]

  - id: no-in-between-storage
    title: Why the hashing is necessary
    oneLine: "Mappings and dynamic arrays cannot be sized at compile time, so they cannot sit between their neighbours."
    statement: >
      The compiler assigns slots to statically sized variables in a single pass, which requires
      knowing each variable's size. A mapping or a dynamic array has no compile-time size, so it
      cannot occupy a contiguous run of slots between the variables declared around it. Placing its
      data at a keccak-derived address is what lets the rest of the layout stay static.
    volatility: stable
    edges:
      - { to: mapping-slot-derivation, type: requires }
      - { to: dynamic-array-layout, type: deepens }
    sources: [solidity-docs-storage-layout]

  - id: transient-storage-layout
    title: Transient storage layout
    oneLine: "Transient storage is a second slot-numbered space with its own layout and its own counter."
    statement: >
      EIP-1153 transient storage is a separate slot-numbered address space reached by TSTORE and
      TLOAD, cleared at the end of every transaction. Solidity gives it its own layout, documented
      alongside persistent storage: transient state variables are numbered from their own slot 0 and
      do not share numbering with persistent variables. transient is available for value-typed state
      variables only. solc 0.8.34 fixed a high-severity bug in which a persistent storage variable
      could be cleared instead of the transient variable at the same layout position, so pin 0.8.34
      or later before using it.
    volatility: evolving
    edges:
      - { to: storage-slot, type: requires }
      - { to: transient-storage, type: requires }
      - { to: transient-storage-middle-tier, type: deepens }
    sources: [solidity-docs-storage-layout, eip-1153, solidity-changelog]
