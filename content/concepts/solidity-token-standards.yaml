moduleId: solidity-token-standards
concepts:
  - id: erc20-is-a-ledger
    title: An ERC-20 is one contract's ledger
    oneLine: "A token is not an object a user holds; it is a balanceOf mapping inside one contract."
    statement: >
      An ERC-20 token is a single contract holding a mapping from address to balance. Sending a
      token is that contract decrementing one number and incrementing another; the sender's account
      stores nothing about the token at all. A wallet showing you a balance is reading the token
      contract's storage, not yours. Everything about token integration follows from this: the token
      contract is the source of truth and it is code you did not write.
    volatility: stable
    edges:
      - { to: storage-slot, type: requires }
      - { to: mapping-slot-derivation, type: requires }
      - { to: erc721-ownership, type: contrasts }
    sources: [eip-20]

  - id: erc20-allowance-model
    title: The allowance model
    oneLine: "Spending someone else's tokens takes two transactions: approve on the token, then transferFrom."
    statement: >
      To let a contract move your tokens you call approve(spender, amount) on the token contract,
      which records a number in the token's own storage, and the spender then calls transferFrom.
      The approval lives in the token, not in the dapp, so revoking it means going back to the
      token. An allowance is a standing authorisation that persists until spent or changed.
    volatility: stable
    edges:
      - { to: erc20-is-a-ledger, type: requires }
      - { to: erc2612-permit, type: contrasts }
    sources: [eip-20]
    misconceptions:
      - belief: "approve then transferFrom is the token moving itself."
        reality: "The token contract only edits its own mappings; the approval is a number in the token's storage that the spender later spends."
        why: "Wallet UIs say give permission to access your tokens, which sounds like a filesystem permission on something you own."
        source: eip-20

  - id: erc20-approve-race
    title: The approve race
    oneLine: "Changing a non-zero allowance to another non-zero value is front-runnable for old plus new."
    statement: >
      If a spender already holds a non-zero allowance and the holder submits a transaction setting
      it to a different non-zero value, the spender can observe that transaction, spend the old
      allowance first, and then spend the new one after it lands — extracting the sum. The ERC-20
      specification itself carries this warning, which makes it the best possible citation for it.
    volatility: stable
    edges:
      - { to: erc20-allowance-model, type: requires }
      - { to: erc20-approve-race-mitigations, type: contrasts }
    sources: [eip-20]

  - id: erc20-approve-race-mitigations
    title: Mitigating the approve race
    oneLine: "Approve to zero first, use safeIncreaseAllowance or forceApprove, or avoid standing allowances."
    statement: >
      The mitigations are: set the allowance to zero and then to the new value, which USDT enforces
      by reverting otherwise; use SafeERC20's safeIncreaseAllowance and safeDecreaseAllowance, which
      change the allowance by a delta; use forceApprove, which handles the approve-from-zero tokens
      automatically; or avoid standing allowances by using signature-based approvals. Note that
      OpenZeppelin 5.x removed increaseAllowance and decreaseAllowance from ERC20 itself — they were
      never in the standard and most deployed tokens do not have them.
    volatility: evolving
    edges:
      - { to: erc20-approve-race, type: requires }
      - { to: safe-erc20, type: applies }
      - { to: erc2612-permit, type: contrasts }
    sources: [oz-changelog, eip-20]
    misconceptions:
      - belief: "Use increaseAllowance to avoid the approve race — it is the OpenZeppelin way."
        reality: "OpenZeppelin removed it from ERC20 in 5.0; it is non-standard and most tokens on chain do not implement it. The equivalents survive only in SafeERC20."
        why: "It was the OpenZeppelin 4.x recommendation for years."
        source: oz-changelog

  - id: erc20-approve-race-is-overrated
    title: The race is rated low for a reason
    oneLine: "It requires a spender you already approved and are willing to be robbed by; phishing loses far more."
    statement: >
      Exploiting the approve race requires the victim to have already granted a non-zero allowance
      to a spender willing to steal from them, and to then change that allowance. Auditors
      consistently rate it low severity relative to the failure that actually drains users:
      standing infinite approvals granted to a malicious contract, or a signature phished from the
      user. Knowing which risks are real is part of reading an audit report honestly.
    volatility: stable
    edges:
      - { to: erc20-approve-race, type: requires }
      - { to: erc20-approve-race-mitigations, type: contrasts }
    sources: [eip-20]

  - id: erc2612-permit
    title: EIP-2612 permit
    oneLine: "The holder signs an EIP-712 allowance off-chain and the spender submits it, collapsing two transactions into one."
    statement: >
      EIP-2612 adds a permit function letting a holder authorise an allowance with an EIP-712
      signature instead of a transaction, so the spender can submit the approval and the spend
      together. Replay is prevented by a per-owner nonce and a domain separator bound to the chain
      id and the token contract. It only works for tokens that implement it, which is a minority of
      deployed supply.
    volatility: stable
    edges:
      - { to: erc20-allowance-model, type: requires }
      - { to: eip-712-typed-data, type: requires }
      - { to: domain-separated-hashing, type: requires }
      - { to: permit2, type: contrasts }
    sources: [eip-2612]

  - id: permit2
    title: Permit2
    oneLine: "One canonical contract adding signature-based, expiring, per-spender allowances on top of any ERC-20."
    statement: >
      Permit2 is a single deployed contract that layers signature-based approvals over tokens that
      do not implement permit themselves. The user grants Permit2 one large approval on the token,
      and thereafter signs short-lived, per-spender permits that Permit2 enforces. It concentrates
      the standing approval in one audited contract instead of spreading it across every protocol,
      and it makes that one contract a very large target.
    volatility: evolving
    edges:
      - { to: erc2612-permit, type: requires }
      - { to: erc2612-permit, type: contrasts }
    sources: [uniswap-permit2-docs, eip-2612]

  - id: erc20-missing-return
    title: Tokens that return nothing
    oneLine: "USDT and others return no data from transfer, so a bool-typed call reverts on the empty returndata."
    statement: >
      The ERC-20 interface declares transfer and transferFrom as returning bool, but several of the
      largest deployed tokens — USDT, BNB, OMG among them — return no data at all. A Solidity call
      typed to return bool decodes the return data and reverts when there is none, so a naive
      integration simply does not work with those tokens. The code compiles; it fails on mainnet
      against one specific asset.
    volatility: stable
    edges:
      - { to: erc20-is-a-ledger, type: requires }
      - { to: abi-decode-validates, type: requires }
      - { to: safe-erc20, type: contrasts }
    sources: [eip-20, weird-erc20]
    misconceptions:
      - belief: "IERC20(token).transfer(...) works for every ERC-20."
        reality: "USDT and others return no data, so the ABI decode reverts; you need SafeERC20."
        why: "The interface file compiles, so the bug only appears against a specific token in production."
        source: weird-erc20

  - id: safe-erc20
    title: SafeERC20
    oneLine: "Wraps the call in a low-level call and treats no returndata plus code at the address as success."
    statement: >
      SafeERC20 performs the token call at the low level and interprets the result itself: empty
      return data from an address that has code counts as success, a decoded false is a revert, and
      a decoded true is a success. The whole difference between supporting USDT and not is those
      three lines. It also supplies forceApprove and the safeIncrease and safeDecrease allowance
      helpers.
    volatility: stable
    edges:
      - { to: erc20-missing-return, type: requires }
      - { to: low-level-call-returns-bool, type: requires }
      - { to: delegatecall-no-code-succeeds, type: applies }
    sources: [oz-safe-erc20-source, oz-changelog]

  - id: fee-on-transfer-tokens
    title: Fee-on-transfer tokens
    oneLine: "Some tokens tax or burn on transfer, so the amount received is less than the amount sent."
    statement: >
      Some tokens deduct a percentage on every transfer, so a transferFrom of 100 delivers less
      than 100. A contract that credits the requested amount rather than the amount that actually
      arrived becomes insolvent by the fee on every single deposit, and the boolean return value
      says nothing about it — success reports that the transfer happened, not how much moved.
    volatility: stable
    edges:
      - { to: erc20-is-a-ledger, type: requires }
      - { to: balance-delta-pattern, type: contrasts }
    sources: [uniswap-v2-router02-docs, weird-erc20, eip-20]
    misconceptions:
      - belief: "After transferFrom(user, address(this), amount) succeeds, the contract received amount."
        reality: "Fee-on-transfer tokens deliver less; you have to measure the balance delta."
        why: "The boolean return says success, not how much."
        source: weird-erc20

  - id: balance-delta-pattern
    title: Credit the measured delta
    oneLine: "Record balanceOf(this) before and after the transfer and credit the difference."
    statement: >
      The general fix for any token whose transfer does not move exactly the requested amount is to
      read balanceOf(address(this)) immediately before and immediately after the transfer and credit
      the difference. It handles fee-on-transfer tokens, tokens with transfer hooks that move
      additional value, and any future behaviour you have not anticipated, because it measures the
      outcome instead of trusting the request.
    volatility: stable
    edges:
      - { to: fee-on-transfer-tokens, type: requires }
      - { to: internal-accounting-vs-balanceof, type: contrasts }
    sources: [uniswap-v2-router02-docs, weird-erc20]

  - id: rebasing-tokens
    title: Rebasing tokens
    oneLine: "Balances change with no transfer and no Transfer event, so a stored amount is wrong the next day."
    statement: >
      A rebasing token — stETH and AMPL-style designs — changes every holder's balance without a
      transfer occurring and without emitting a Transfer event. A contract that stored user
      deposited 100 has a stale number the next day, and an indexer that derives balances from
      events drifts as well. The fixes are to store shares rather than amounts, or to integrate the
      wrapped non-rebasing version such as wstETH.
    volatility: stable
    edges:
      - { to: erc20-is-a-ledger, type: requires }
      - { to: shares-vs-assets, type: applies }
      - { to: balance-delta-pattern, type: contrasts }
    sources: [eip-20]
    misconceptions:
      - belief: "A user's balance only changes when a transfer happens."
        reality: "Rebasing tokens change balances with no transfer and no Transfer event, so stored amounts and event-derived indexes both drift."
        why: "Every other token teaches that a balance change implies an event."
        source: eip-20

  - id: weird-erc20-taxonomy
    title: The weird-ERC-20 taxonomy
    oneLine: "ERC-20 compliant is a spectrum, and each deviation breaks a different integration assumption."
    statement: >
      Deployed tokens deviate from the standard in catalogued ways: missing return values, fees on
      transfer, rebasing balances, blocklists, pausable transfers, upgradeable implementations,
      decimals other than 18, reverting on zero-value transfers, and multiple entry points to one
      balance in proxied tokens. Each breaks a different assumption, so integration safety is a
      per-token question answered by reading the deployed source, not by trusting the interface.
    volatility: stable
    edges:
      - { to: erc20-missing-return, type: requires }
      - { to: fee-on-transfer-tokens, type: requires }
      - { to: rebasing-tokens, type: requires }
      - { to: safe-erc20, type: contrasts }
    sources: [weird-erc20, eip-20]

  - id: erc721-ownership
    title: ERC-721 ownership
    oneLine: "A tokenId-to-owner mapping plus per-token approvals and a blanket setApprovalForAll."
    statement: >
      ERC-721 tracks ownership per item: a mapping from tokenId to owner, a per-token approval for a
      single operator, and setApprovalForAll granting an operator control of every token the caller
      owns in that collection. Marketplace integrations run on the blanket approval, which is why a
      single malicious signature can cost a user an entire collection.
    volatility: stable
    edges:
      - { to: erc20-is-a-ledger, type: requires }
      - { to: erc1155-semantics, type: contrasts }
    sources: [eip-721]

  - id: erc721-safe-transfer-callback
    title: The onERC721Received hook
    oneLine: "safeTransferFrom calls the recipient contract and requires the magic selector back."
    statement: >
      safeTransferFrom checks whether the recipient is a contract and, if so, calls
      onERC721Received on it and requires the standard magic value in return. The purpose is to stop
      tokens being sent to contracts that cannot move them again. The mechanism is an external call
      to an address the sender does not control, made in the middle of a transfer.
    volatility: stable
    edges:
      - { to: erc721-ownership, type: requires }
      - { to: evm-message-call, type: requires }
      - { to: erc721-callback-reentrancy, type: contrasts }
    sources: [eip-721]

  - id: erc721-callback-reentrancy
    title: safeMint reentrancy
    oneLine: "The receiver hook lets an attacker re-enter your mint before the counter is written."
    statement: >
      Because onERC721Received hands arbitrary code execution to the recipient in the middle of a
      mint or transfer, calling _safeMint before writing minted[msg.sender] lets an attacker recurse
      into mint with the counter still stale and exceed a per-wallet cap. The check genuinely is
      first; the effect is not. This is the most common NFT exploit and it has been traced in
      production, notably the HypeBears incident.
    volatility: stable
    edges:
      - { to: erc721-safe-transfer-callback, type: requires }
      - { to: cei-order, type: requires }
      - { to: reentrancy-guard, type: applies }
    sources: [eip-721, blocksec-hypebears, ackee-erc721-reentrancy]
    misconceptions:
      - belief: "safeTransferFrom is the safe version, so prefer it."
        reality: "It is safe for the recipient, preventing stranded tokens, and dangerous for the sending contract, because it yields execution to the recipient; it must be the last thing you do."
        why: "The word safe is in the name and does not say safe for whom."
        source: ackee-erc721-reentrancy
      - belief: "A mint cap enforced by require(minted[msg.sender] < CAP) before _safeMint is enforced."
        reality: "If the counter is written after the mint, the receiver's callback re-enters and mints again with the counter still stale."
        why: "The check is first, so the code reads as if it follows Checks-Effects-Interactions."
        source: blocksec-hypebears

  - id: erc1155-semantics
    title: ERC-1155 semantics
    oneLine: "Many token ids in one contract, with balanceOf(account, id) covering fungible and non-fungible alike."
    statement: >
      ERC-1155 puts many token ids inside a single contract with a two-dimensional balance mapping,
      balanceOf(account, id). The same interface and the same deployment therefore express fungible,
      semi-fungible and non-fungible assets. Operator approval is all-ids-or-nothing: there is no
      per-id approval in the standard.
    volatility: stable
    edges:
      - { to: erc721-ownership, type: requires }
      - { to: erc6909, type: contrasts }
    sources: [eip-1155]

  - id: erc1155-batch-atomicity
    title: Batch transfers are all or nothing
    oneLine: "safeBatchTransferFrom reverts entirely if any leg fails, and emits one TransferBatch, not N TransferSingle."
    statement: >
      safeBatchTransferFrom takes matching-length id and amount arrays and is atomic: unequal
      lengths revert, and a failure in any single transfer reverts the whole call. It emits one
      TransferBatch event rather than N TransferSingle events, so an indexer that only handles
      TransferSingle silently loses every batch. OpenZeppelin 5.6.0 additionally changed a
      single-item batch transfer to call onERC1155BatchReceived rather than onERC1155Received, which
      is a live break for receivers implementing only the single hook.
    volatility: evolving
    edges:
      - { to: erc1155-semantics, type: requires }
      - { to: sol-event-topics, type: requires }
      - { to: erc1155-callback, type: contrasts }
    sources: [eip-1155, oz-changelog]
    misconceptions:
      - belief: "ERC-1155 batch transfers can partially succeed."
        reality: "The whole call reverts if any leg fails, and the arrays must be equal length."
        why: "Batch suggests independent items in most non-blockchain APIs."
        source: eip-1155
      - belief: "An indexer that handles TransferSingle covers ERC-1155."
        reality: "Batch transfers emit only TransferBatch, so single-event indexers silently lose data."
        why: "The single-transfer path is what tutorials demonstrate."
        source: eip-1155

  - id: erc1155-callback
    title: ERC-1155 receiver hooks
    oneLine: "Two hooks, onERC1155Received and onERC1155BatchReceived, with the same hand-over-control hazard."
    statement: >
      ERC-1155 has the same receiver-hook design as ERC-721, with two entry points:
      onERC1155Received for single transfers and onERC1155BatchReceived for batches. Both hand
      execution to the recipient mid-transfer, so a contract that implements only one of them can be
      unreachable by the other path, and any state your transfer depends on must be settled before
      the hook fires.
    volatility: stable
    edges:
      - { to: erc1155-semantics, type: requires }
      - { to: erc721-callback-reentrancy, type: requires }
      - { to: erc6909, type: contrasts }
    sources: [eip-1155]

  - id: erc6909
    title: ERC-6909
    oneLine: "A stripped-down multi-token interface with no receiver callbacks and per-(id, spender) allowances."
    statement: >
      ERC-6909 is a minimal multi-token interface: no receiver callbacks, no mandatory batching, and
      an approval model of per-(id, spender) allowances plus a global operator flag. Uniswap v4 ships
      it as its internal claim-token layer, which is where its weight comes from. Its EIP status is
      contested across sources — treat it as the standard the largest AMM ships, and check the EIP
      page before describing it as finalized.
    volatility: hot
    edges:
      - { to: erc1155-semantics, type: requires }
      - { to: erc1155-callback, type: contrasts }
    sources: [eip-6909, uniswap-v4-erc6909-docs]
    misconceptions:
      - belief: "ERC-6909 is a finalized replacement for ERC-1155."
        reality: "Its weight comes from Uniswap v4 shipping it rather than from standardization, and sources disagree about its current EIP status."
        why: "Production usage by a major protocol reads as endorsement and finality."
        source: eip-6909

  - id: token-callbacks-are-the-vector
    title: Every safety callback is a code-execution point
    oneLine: "ERC-777 send hooks, onERC721Received and the ERC-1155 receivers are all attacker-controlled execution inside your transaction."
    statement: >
      Every hook the token standards added for recipient safety is a point at which attacker-chosen
      code runs inside your transaction. ERC-777's send hooks are the historical extreme: they
      caused the Uniswap v1 and imBTC and the Lendf.me incidents and killed the design, and ERC-777
      is now the canonical example of why callbacks in a fungible token were a mistake. ERC-1363
      transferAndCall exists as the opt-in alternative. Treat any transfer that can call out as an
      interaction in the Checks-Effects-Interactions sense.
    volatility: stable
    edges:
      - { to: erc721-callback-reentrancy, type: requires }
      - { to: erc1155-callback, type: requires }
      - { to: cei-order, type: applies }
      - { to: erc6909, type: contrasts }
    sources: [eip-1155, eip-721]

  - id: erc-4626-vault
    title: ERC-4626 tokenized vault
    oneLine: "A standard interface for depositing assets, receiving shares, and redeeming them later."
    statement: >
      ERC-4626 standardises the interface of a tokenized yield vault: deposit or mint to put assets
      in and receive shares, withdraw or redeem to convert shares back, plus preview and max
      functions so integrators can quote and bound an operation. The share token is itself an
      ERC-20. The standard defines an interface; it does not define safe arithmetic.
    volatility: stable
    edges:
      - { to: erc20-is-a-ledger, type: requires }
    sources: [eip-4626, oz-erc4626-docs]
    misconceptions:
      - belief: "Using the ERC-4626 interface makes a vault safe."
        reality: "The standard defines an interface, not safe math; vaults without inflation mitigations have lost funds in production."
        why: "A standard with the word safe-adjacent semantics reads as a vetted implementation."
        source: oz-erc4626-inflation-defense

  - id: shares-vs-assets
    title: Shares versus assets
    oneLine: "Shares are claims on a growing pool; the rate is totalAssets divided by totalSupply."
    statement: >
      A vault's share is a proportional claim on whatever the vault holds. The conversion rate is
      totalAssets over totalSupply, so yield accrues by the pool growing while the share count stays
      fixed, and every holder's claim grows without any transfer. This is the same accounting that
      makes a share-based wrapper the correct integration for a rebasing token.
    volatility: stable
    edges:
      - { to: erc-4626-vault, type: requires }
      - { to: rebasing-tokens, type: contrasts }
    sources: [eip-4626, oz-erc4626-docs]

  - id: rounding-direction
    title: Rounding direction is a security property
    oneLine: "Every conversion must round in the vault's favour; rounding toward the user is a slow drain."
    statement: >
      Because shares and assets convert by integer division, every conversion drops a remainder, and
      who receives that remainder is a design decision. Rounding must always favour the vault:
      shares minted round down, shares burned on withdrawal round up. Rounding toward the user turns
      each operation into a tiny withdrawal, and an attacker who can perform many operations turns
      that into a drain.
    volatility: stable
    edges:
      - { to: shares-vs-assets, type: requires }
    sources: [eip-4626, oz-erc4626-docs]
    misconceptions:
      - belief: "Rounding is a precision nicety."
        reality: "Rounding direction is a security property; rounding toward users is exploitable by repetition."
        why: "In ordinary accounting a sub-unit remainder is genuinely negligible; here the operation can be repeated for free."
        source: oz-erc4626-inflation-defense

  - id: donation-attack
    title: Donation attack
    oneLine: "Sending assets directly to the contract, bypassing its accounting entry point, moves the ratio."
    statement: >
      Any contract that computes a ratio from balanceOf(address(this)) can have that ratio moved by
      a plain token transfer straight to its address, with no call to deposit and no shares minted.
      For a vault this inflates totalAssets while totalSupply is unchanged, so the price per share
      jumps. It requires no flash loan, no privilege and no special access — only an ERC-20 transfer.
    volatility: stable
    edges:
      - { to: shares-vs-assets, type: requires }
      - { to: erc20-is-a-ledger, type: requires }
      - { to: internal-accounting-vs-balanceof, type: contrasts }
    sources: [oz-erc4626-inflation-defense, eip-4626]
    misconceptions:
      - belief: "The donation attack needs a flash loan or special access."
        reality: "It needs a plain ERC-20 transfer to the target address."
        why: "Exploits are assumed to require exotic capabilities."
        source: oz-erc4626-inflation-defense

  - id: inflation-first-depositor-attack
    title: First-depositor inflation attack
    oneLine: "Deposit 1 wei, donate a large amount, and the next depositor's shares round down to zero."
    statement: >
      Against an empty vault the attacker deposits one wei and receives one share, then donates a
      large amount of the asset directly to the vault. The price per share is now enormous, so the
      next depositor's share calculation — deposit times totalSupply divided by totalAssets —
      rounds down to zero. The victim holds no shares, the attacker holds the only one, and
      redeeming it returns the whole pool including the victim's deposit.
    volatility: stable
    edges:
      - { to: donation-attack, type: requires }
      - { to: rounding-direction, type: requires }
    sources: [oz-erc4626-inflation-defense, eip-4626]

  - id: virtual-shares-offset
    title: Virtual shares and the decimal offset
    oneLine: "Include virtual shares and assets in the conversion so an empty vault still has a defined rate."
    statement: >
      The mitigation OpenZeppelin designed adds virtual shares and virtual assets to both sides of
      the conversion, so an empty vault has a well-defined exchange rate instead of an undefined one
      and rounding-to-zero cannot occur. A decimal offset scales the virtual amounts, and the size
      of that offset determines how much residual value an attacker could still extract — larger
      offset, smaller residual. Seeding the vault with a first deposit raises the attack's cost but
      does not address the mechanism.
    volatility: stable
    edges:
      - { to: inflation-first-depositor-attack, type: requires }
    sources: [oz-erc4626-inflation-defense, oz-erc4626-docs]
    misconceptions:
      - belief: "Seeding the vault with a first deposit fully solves the inflation attack."
        reality: "It raises the attack's cost; virtual offsets or internal accounting address the mechanism itself."
        why: "The published exploit uses an empty vault, so filling it looks like the fix."
        source: oz-erc4626-inflation-defense

  - id: internal-accounting-vs-balanceof
    title: Internal accounting removes the donation surface
    oneLine: "Track deposits in your own variable instead of reading balanceOf(this), and donations do nothing."
    statement: >
      A vault that maintains its own totalAssets counter, updated only by its own deposit and
      withdraw paths, cannot be moved by a direct transfer at all: a donation increases the token
      contract's balance and changes nothing the vault reads. The tradeoff is that the contract's
      view of its holdings can then diverge from its actual balance, so any genuine external
      inflow needs an explicit, permissioned entry point to be recognised.
    volatility: stable
    edges:
      - { to: donation-attack, type: requires }
      - { to: balance-delta-pattern, type: contrasts }
    sources: [oz-erc4626-inflation-defense, eip-4626]
