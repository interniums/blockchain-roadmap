moduleId: solidity-vyper
concepts:
  - id: vyper-design-goal
    title: Optimised for the auditor
    oneLine: "Vyper optimises for the reader, not the writer: features that hide control flow are candidates for removal."
    statement: >
      Vyper's stated design goal is that a human auditor should be able to read a function top to
      bottom and know what it does. Any feature that makes control flow harder to follow by reading
      — inheritance, modifiers, overloading, recursion, inline assembly — is a candidate for
      removal, even where it costs expressiveness. The tradeoff is deliberate and it is the whole
      argument of the language.
    volatility: stable
    edges:
      - { to: vyper-python-syntax, type: contrasts }
    sources: [vyper-docs-structure, vyper-release-notes]

  - id: vyper-python-syntax
    title: Pythonic, but not Python
    oneLine: "Python syntax, implemented in Python, compiling to EVM bytecode with the same ABI as Solidity."
    statement: >
      Vyper uses Python-like syntax and its compiler is written in Python, but the language is not
      Python: no classes, no runtime, no dynamic typing, no recursion, no unbounded collections. It
      compiles to ordinary EVM bytecode and uses the same ABI encoding as Solidity, so Vyper and
      Solidity contracts call each other with no special handling at all.
    volatility: stable
    edges:
      - { to: vyper-design-goal, type: requires }
      - { to: abi-canonical-signature, type: applies }
    sources: [vyper-docs-structure]
    misconceptions:
      - belief: "Vyper is Python, so I already know it."
        reality: "No classes, no inheritance, no recursion, no dynamic typing and no unbounded collections; the syntax is familiar and the semantics are not."
        why: "Indentation and decorators look identical."
        source: vyper-docs-structure
      - belief: "Vyper contracts cannot call or be called by Solidity contracts."
        reality: "Both emit standard EVM bytecode with the same ABI encoding, so they interoperate with no special handling."
        why: "A different language sounds like a different platform."
        source: vyper-docs-structure

  - id: vyper-no-inheritance
    title: No inheritance, explicit modules instead
    oneLine: "There is no contract inheritance and no linearization; 0.4.0 added an explicit module system."
    statement: >
      Vyper has no contract inheritance, so there is no C3 linearization, no super, and no question
      about which base's implementation runs. A function body is the whole story. Code reuse since
      0.4.0 is done with an explicit module system using import together with initializes:, uses:
      and exports: declarations, which states the relationship rather than implying it through a
      method-resolution order.
    volatility: evolving
    edges:
      - { to: vyper-design-goal, type: requires }
      - { to: sol-c3-linearisation, type: contrasts }
    sources: [vyper-docs-structure, vyper-release-notes]
    misconceptions:
      - belief: "No inheritance means no code reuse."
        reality: "0.4.0 added a module system with explicit initializes:, uses: and exports: declarations — reuse without an implicit method-resolution order."
        why: "Object-oriented practice conflates reuse with inheritance."
        source: vyper-release-notes

  - id: vyper-no-modifiers
    title: No function modifiers
    oneLine: "A modifier can inject arbitrary code behind a keyword, so Vyper makes you write the guard inline."
    statement: >
      Vyper has no Solidity-style function modifiers. The reasoning is that a modifier can inject
      arbitrary code — including state changes and early returns — at a call site that shows only a
      keyword, so a reader who has not opened the modifier's definition does not know what the
      function does. Guards are written inline, where they are visible in the function body.
    volatility: stable
    edges:
      - { to: vyper-design-goal, type: requires }
      - { to: sol-modifier-placeholder, type: contrasts }
    sources: [vyper-docs-structure]

  - id: vyper-no-overloading
    title: No overloading
    oneLine: "One name means one function, and there is no operator overloading either."
    statement: >
      Vyper permits neither function overloading nor operator overloading. One name resolves to one
      function, so a diff cannot silently change which implementation a call site reaches and a
      surprising plus operator cannot exist. It also removes a class of selector ambiguity, since
      each name maps to exactly one signature.
    volatility: stable
    edges:
      - { to: vyper-design-goal, type: requires }
      - { to: abi-canonical-signature, type: applies }
    sources: [vyper-docs-structure]

  - id: vyper-no-inline-assembly
    title: No inline assembly
    oneLine: "There is no assembly escape hatch, so the compiler always knows the full semantics of what it emits."
    statement: >
      Vyper offers no inline assembly and no Yul equivalent. The consequence is that the compiler
      knows the complete semantics of every instruction in the output, so no hand-written opcode can
      violate the language's invariants about memory, bounds or arithmetic. The cost is that
      patterns needing raw EVM behaviour require dedicated builtins rather than an escape hatch.
    volatility: stable
    edges:
      - { to: vyper-design-goal, type: requires }
      - { to: vyper-ecosystem-cost, type: applies }
    sources: [vyper-docs-structure]

  - id: vyper-bounded-loops
    title: Every loop is bounded
    oneLine: "Loops carry a compile-time bound and there is no recursion, so every function has a static gas ceiling."
    statement: >
      Every Vyper loop must carry a compile-time bound, written as for i: uint256 in range(n,
      bound=MAX). There is no recursion. Together with bounded types, this gives every function a
      static upper bound on the work it can do. That is a liveness guarantee, not a gas
      optimisation: an unbounded loop can make a function permanently uncallable once its collection
      grows, and since EIP-7825 a single L1 transaction is hard-capped at roughly 16.78M gas.
    volatility: stable
    edges:
      - { to: vyper-design-goal, type: requires }
      - { to: push-payment-dos, type: applies }
      - { to: gas-is-a-countdown, type: requires }
    sources: [vyper-docs-structure]
    misconceptions:
      - belief: "Bounded loops are just a gas optimisation."
        reality: "They are a liveness guarantee — an unbounded loop can make a function permanently uncallable once the collection grows past a transaction's gas ceiling."
        why: "Gas is taught as a cost, not as a correctness constraint."
        source: vyper-docs-structure

  - id: vyper-bounded-types
    title: Dynamic types carry their maximum
    oneLine: "DynArray[uint256, 100], String[64], Bytes[1024] — there is no unbounded bytes, string or array."
    statement: >
      Vyper's dynamic types carry their maximum size in the type itself: DynArray[uint256, 100],
      String[64], Bytes[1024]. There is no unbounded bytes, string or array. That is what makes gas
      boundable and storage layout fully known at compile time. Note that the 0.5.0 alpha release
      notes advertise unbounded types, which would soften this rule; treat the bounded-types
      guarantee as version-dependent and check before relying on it under 0.5.x.
    volatility: evolving
    edges:
      - { to: vyper-bounded-loops, type: requires }
      - { to: vyper-bounded-loops, type: contrasts }
    sources: [vyper-docs-structure, vyper-release-notes]

  - id: vyper-explicit-visibility
    title: Decorators are mandatory
    oneLine: "@external, @internal, @deploy, @payable, @view, @pure, @nonreentrant — no defaults to remember."
    statement: >
      Every Vyper function carries explicit decorators: @external or @internal for visibility,
      @deploy for the constructor, and @payable, @view, @pure and @nonreentrant as applicable. There
      is no default a reader has to recall. Since 0.4.0 the reentrancy lock is a single unnamed
      global lock per contract rather than a set of named keys — a direct simplification in response
      to the 2023 bug class.
    volatility: evolving
    edges:
      - { to: vyper-python-syntax, type: requires }
      - { to: vyper-no-modifiers, type: contrasts }
    sources: [vyper-docs-structure, vyper-release-notes]

  - id: vyper-safety-by-default
    title: Checks on by default, unsafe named at the call site
    oneLine: "Overflow, bounds and division checks are always on; the escape hatches are named unsafe_add and friends."
    statement: >
      Overflow and underflow checks, array bounds checks and division-by-zero checks are always
      enabled. The escape hatches are explicit builtins — unsafe_add, unsafe_sub, unsafe_mul,
      unsafe_div — so opting out of a check is visible at the exact expression that does it, rather
      than at the top of a block the way Solidity's unchecked is.
    volatility: stable
    edges:
      - { to: vyper-design-goal, type: requires }
      - { to: sol-panic-codes, type: contrasts }
    sources: [vyper-docs-structure]

  - id: vyper-compiler-was-the-bug
    title: The 2023 nonreentrant lock regression
    oneLine: "Vyper 0.2.15, 0.2.16 and 0.3.0 gave different functions different lock slots, so correct source compiled to a bypassable guard."
    statement: >
      In July 2023 it emerged that Vyper 0.2.15, 0.2.16 and 0.3.0 mis-assigned storage slots for
      @nonreentrant locks, so two functions that should have shared one lock were given different
      slots. Correct source therefore compiled to bytecode with a cross-function reentrancy hole,
      and several Curve pools were drained through it. Loss totals reported across sources range
      widely and a large but unquantified fraction was later returned, so the number is disputed;
      the mechanism is not.
    volatility: stable
    edges:
      - { to: vyper-explicit-visibility, type: requires }
      - { to: reentrancy-guard, type: requires }
      - { to: storage-slot, type: requires }
      - { to: vyper-safety-by-default, type: contrasts }
    sources: [vyper-ghsa-reentrancy-lock, vyper-postmortem, blocksec-curve-compiler, somnus-vyper-bypass]
    misconceptions:
      - belief: "The Curve exploit was a Curve bug."
        reality: "Curve's Vyper source was correct; three specific compiler versions emitted a broken reentrancy guard from it."
        why: "Incidents get named after the protocol that lost the money."
        source: blocksec-curve-compiler
      - belief: "Vyper is safer than Solidity."
        reality: "Vyper narrows the space of source-level mistakes; it does not make the toolchain safer, and its worst incident was the compiler producing wrong bytecode from correct source."
        why: "Fewer features gets conflated with fewer bugs."
        source: vyper-postmortem

  - id: compiler-is-part-of-tcb
    title: The compiler is in your trusted computing base
    oneLine: "The compiler version is a security-relevant deployment parameter: pin it, record it, check advisories against it."
    statement: >
      The 2023 Vyper incident generalises far beyond Vyper. Your trusted computing base includes
      your code, your libraries, the compiler, the client and the consensus rules; a defect anywhere
      in that stack is your problem. Practically: pin the compiler version, record it with the
      deployment, check it against known-bad ranges before shipping, and reproduce the deployed
      bytecode from source independently. Solidity has shipped its own security fixes recently,
      including a high-severity transient-storage clearing bug patched in 0.8.34.
    volatility: stable
    edges:
      - { to: vyper-compiler-was-the-bug, type: requires }
      - { to: oz-audit-is-not-your-audit, type: contrasts }
    sources: [vyper-postmortem, solidity-changelog]
    misconceptions:
      - belief: "Pinning a compiler version is a reproducibility nicety."
        reality: "It is a security control; the affected Vyper range is exactly what a version pin plus an advisory check catches."
        why: "In web development compiler versions rarely carry security semantics."
        source: vyper-postmortem

  - id: vyper-audit-policy
    title: Only major releases carry the audit promise
    oneLine: "Vyper's stated policy audits x.0.0 releases; point releases carry no such guarantee."
    statement: >
      Vyper's published versioning guideline states that major x.0.0 releases receive an external
      audit before release, with reported moderate and severe findings addressed. Point releases
      carry no such guarantee. Version choice is therefore a risk decision with a documented policy
      behind it, not just a feature decision.
    volatility: stable
    edges:
      - { to: compiler-is-part-of-tcb, type: requires }
      - { to: vyper-compiler-was-the-bug, type: contrasts }
    sources: [vyper-versioning]
    misconceptions:
      - belief: "Every Vyper release is audited."
        reality: "The policy covers major x.0.0 releases; point releases do not carry that guarantee."
        why: "Vyper is audited gets repeated without the qualifier."
        source: vyper-versioning

  - id: venom-backend
    title: Venom
    oneLine: "Vyper's SSA-based IR and optimizer pipeline, progressively replacing the older code generator."
    statement: >
      Venom is Vyper's newer SSA-based intermediate representation and optimizer pipeline, replacing
      the original code generator incrementally. Much of the 0.4.x line's work has gone into
      maturing it, and the 0.5.0 alphas compile directly to Venom. Whether it is the default or
      still behind a flag in a given release is version-specific; check the release notes for the
      version you are pinning.
    volatility: hot
    edges:
      - { to: vyper-design-goal, type: requires }
      - { to: vyper-python-syntax, type: contrasts }
    sources: [vyper-release-notes, vyper-releases-gh]

  - id: vyper-ecosystem-cost
    title: The price of the omissions
    oneLine: "Far smaller library ecosystem, fewer auditors, fewer tools, and patterns that need dedicated builtins."
    statement: >
      Vyper's omissions carry a real cost: there is no OpenZeppelin equivalent, the auditor supply
      is smaller, tooling is thinner, and patterns that Solidity expresses with assembly need
      dedicated language features instead — raw_create() arrived in 0.4.2 for generic factories and
      @raw_return in 0.4.3 for forwarding contracts. Its production footprint is concentrated, with
      Curve as the flagship. That concentration is a legitimate input to a should-we-use-it decision.
    volatility: evolving
    edges:
      - { to: vyper-no-inline-assembly, type: requires }
      - { to: oz-is-the-stdlib, type: contrasts }
    sources: [vyper-release-notes, curvefi-contracts]
    misconceptions:
      - belief: "Vyper has no way to write a factory or a proxy without leaving the language."
        reality: "raw_create() in 0.4.2 and @raw_return in 0.4.3 exist specifically to close that gap."
        why: "The absence of inline assembly was true and its consequences were assumed permanent."
        source: vyper-release-notes

  - id: vyper-transferable-lessons
    title: What reading Vyper teaches a Solidity engineer
    oneLine: "How much control flow inheritance and modifiers hide, that unbounded loops are a liveness bug, and that the compiler can be wrong."
    statement: >
      You do not have to ship Vyper to profit from reading it. Three lessons transfer directly: how
      much of a Solidity function's behaviour is hidden in inherited code and modifiers you cannot
      see from the body; that an unbounded loop is a liveness bug rather than a gas optimisation;
      and that the compiler is an assumption, not a fact. Each of these changes how you read a
      Solidity contract afterwards.
    volatility: stable
    edges:
      - { to: vyper-no-inheritance, type: requires }
      - { to: vyper-no-modifiers, type: requires }
      - { to: vyper-bounded-loops, type: requires }
      - { to: compiler-is-part-of-tcb, type: requires }
      - { to: vyper-design-goal, type: contrasts }
    sources: [vyper-docs-structure, vyper-postmortem]
