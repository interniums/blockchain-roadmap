moduleId: toolchain-ci
concepts:
  - id: ci-pipeline-shape
    title: The baseline Foundry job
    oneLine: Checkout with submodules, install a pinned toolchain, build, test — on pushes to the default branch and on pull requests.
    statement: >
      The official shape is: check out the repository with submodules, install Foundry with the
      foundry-rs toolchain action, run `forge build`, then run `forge test`, triggered on pushes to
      the main branch and on pull requests. Everything else in this module is a layer added on top of
      those four steps, and each additional layer should earn its runtime.
    volatility: evolving
    edges:
      - { to: forge-role, type: requires }
    sources: [foundry-ci, foundry-toolchain-action]
  - id: submodule-checkout
    title: Checkout must recurse submodules
    oneLine: Forge dependencies are git submodules, so a checkout without submodules fails at compile time with confusing missing-import errors.
    statement: >
      Because `forge install` vendors dependencies as git submodules under lib/, a checkout that does
      not fetch them produces an empty lib/ and a compile failure reporting that an import cannot be
      found. The error names the Solidity import, not the missing checkout step, so the first CI
      failure of every new Foundry repository is this one and it reads like a remappings problem.
    volatility: stable
    edges:
      - { to: ci-pipeline-shape, type: requires }
      - { to: dependency-management-choice, type: requires }
    sources: [foundry-ci]
  - id: format-and-lint-gates
    title: Cheap deterministic gates go first
    oneLine: forge fmt --check and forge lint --deny warnings are seconds long and never flaky, so they belong before the expensive job.
    statement: >
      `forge fmt --check` fails on unformatted source and `forge lint` — a first-party linter shipped
      in the Foundry binary, with severity selection — fails on findings you choose to deny. Both are
      fast and deterministic. Running them as a separate job that gates the expensive one means a
      pull request with a formatting mistake fails in under a minute instead of after the full suite.
    volatility: evolving
    edges:
      - { to: ci-pipeline-shape, type: requires }
    sources: [foundry-ci, measured-forge-1-7-1]
  - id: foundry-version-pinning
    title: Pin the toolchain in CI
    oneLine: The toolchain action defaults to a channel, not a build, so "latest" makes CI a pipeline that changes without a commit.
    statement: >
      Installing a channel rather than an exact version means the binary running your tests can change
      between two runs of the same commit. Because cheatcode semantics, config defaults and gas
      accounting have all moved within the 1.x line, that turns an unrelated Foundry release into a
      red build — or worse, into a green build that hides a behaviour change. Pin an exact version and
      bump it deliberately.
    volatility: hot
    edges:
      - { to: ci-pipeline-shape, type: requires }
      - { to: toolchain-pinning-in-ci, type: requires }
    sources: [foundry-toolchain-action, foundry-ci]
    misconceptions:
      - belief: Installing nightly in CI is good because you get the latest fixes.
        reality: It makes the pipeline nondeterministic — the same commit can pass and then fail with no change to the repository.
        why: On application stacks, taking the newest patch release is usually the safe default.
        source: foundry-ci
  - id: ci-profile
    title: The ci profile
    oneLine: FOUNDRY_PROFILE=ci selects a profile that raises effort — more fuzz runs, more invariant runs, higher verbosity — so local runs stay fast.
    statement: >
      Setting `FOUNDRY_PROFILE: ci` in the workflow selects a foundry.toml profile that raises the
      budgets: higher verbosity so a failure is diagnosable from the log, and larger fuzz and
      invariant run counts than anyone would tolerate on their laptop. The specific numbers in
      circulation are conventions rather than evidence-backed recommendations, and sources disagree;
      choose them from your own runtime budget and the depth your bugs need.
    volatility: evolving
    edges:
      - { to: ci-pipeline-shape, type: requires }
      - { to: foundry-profiles, type: requires }
    sources: [foundry-ci]
  - id: action-supply-chain
    title: Actions are code with access to your secrets
    oneLine: A third-party action runs arbitrary code in the job that holds your secrets, and a version tag is mutable — only a commit SHA is a pin.
    statement: >
      Every third-party action in a workflow executes with the job's environment, including any secret
      that job can read. Referencing one by tag pins nothing: tags are mutable and can be repointed at
      new code, which is why GitHub's own hardening guidance states that pinning to a full-length
      commit SHA is currently the only way to use an action as an immutable release. Pin actions to a
      full commit SHA, and give each job only the secrets it needs.
    volatility: evolving
    edges:
      - { to: ci-pipeline-shape, type: requires }
    sources: [github-actions-security-hardening, foundry-ci, step-security-foundry-toolchain]
    misconceptions:
      - belief: Referencing an action at @v1 is a safe pin.
        reality: Tags are mutable and can be repointed at new code; only a commit SHA is immutable.
        why: Semantic version tags feel like immutable releases, as they are on most package registries.
        source: step-security-foundry-toolchain
  - id: fork-cache
    title: Caching Foundry's RPC cache in CI
    oneLine: The foundry-toolchain action's cache option persists ~/.foundry/cache — RPC and explorer responses — which is what makes fork tests affordable.
    statement: >
      The foundry-rs toolchain action can persist Foundry's cache directory between runs, covering
      fetched RPC state and explorer responses. For a repository with a forked integration suite this
      is the difference between paying a provider on every commit and running almost offline. It only
      pays off for suites that pin their fork block, because the cache is keyed on it.
    volatility: evolving
    edges:
      - { to: ci-pipeline-shape, type: requires }
      - { to: fork-testing-purpose, type: requires }
      - { to: fork-cache-keying, type: requires }
    sources: [foundry-toolchain-action, foundry-ci]
  - id: fuzz-seed-in-ci
    title: The cache does not help an unseeded fuzzer
    oneLine: Unseeded fuzzing makes different calls each run, touching different state, so the cache misses and gas numbers move.
    statement: >
      Caching is keyed by the requests actually issued. If the fuzzer draws different inputs each run
      it calls different code paths, touches different accounts and slots, and misses the cache it was
      supposed to hit — while also producing gas numbers that cannot be compared run to run. A fixed
      fuzz seed is what makes both the cache and the gas diff work; the cost is that the seeded job
      searches the same points every time, so it wants an unseeded companion somewhere.
    volatility: evolving
    edges:
      - { to: fork-cache, type: requires }
      - { to: fuzz-seed-determinism, type: requires }
    sources: [foundry-toolchain-action]
    misconceptions:
      - belief: Caching makes fork tests in CI deterministic.
        reality: Unseeded fuzzing changes which calls are made, so the cache misses and results still vary.
        why: The cache is keyed by the requests issued, which people picture as fixed by the test file.
        source: foundry-toolchain-action
  - id: fork-pr-secrets
    title: Fork pull requests get no secrets
    oneLine: Workflows triggered by pull requests from forks cannot read repository secrets, so RPC-dependent jobs must degrade or be skipped.
    statement: >
      With the exception of GITHUB_TOKEN, secrets are not passed to the runner when a workflow is
      triggered from a forked repository, so an outside contributor's pull request cannot exfiltrate
      your RPC key. The consequence for a contract repository is that any job needing an endpoint
      either fails or silently skips for exactly the contributors you most want to help. Design that
      boundary explicitly: skip with a clear message, or run the forked suite only on trusted events.
    volatility: stable
    edges:
      - { to: fork-cache, type: requires }
    sources: [github-actions-using-secrets, foundry-ci]
  - id: gas-diff-comment
    title: Gas as a pull-request comment
    oneLine: A bot re-runs the gas report on base and head and comments the delta, turning gas into review feedback instead of a hidden regression.
    statement: >
      A gas-diff job runs the report on the base branch and on the head, and posts the per-function
      delta as a comment. That puts the economic consequence of a change in front of a reviewer at the
      moment they are reading it, without blocking the merge. It is the highest-value gas mechanism in
      CI precisely because it informs rather than gates.
    volatility: evolving
    edges:
      - { to: gas-snapshot-file, type: requires }
      - { to: ci-pipeline-shape, type: requires }
    sources: [rubilmax-gas-diff, foundry-gas-tracking]
  - id: snapshot-check-gate
    title: Gating on the snapshot
    oneLine: forge snapshot --check hard-fails on any gas change — useful for a frozen gas suite, hostile when the suite churns.
    statement: >
      Making `forge snapshot --check` a required check hard-fails a pull request whose numbers moved.
      The failure mode is that adding a test, with no production change at all, moves the numbers and
      turns the gate red — a pure false positive that trains reviewers to regenerate the file
      reflexively. It works when the gas suite is small, frozen and separate from the functional
      suite; the tolerance flag softens it, and a diff comment is usually the better instrument.
    volatility: evolving
    edges:
      - { to: snapshot-diff-vs-check, type: requires }
      - { to: gas-diff-comment, type: contrasts }
    sources: [forge-snapshot-reference, rubilmax-gas-diff]
    misconceptions:
      - belief: A red gas diff means the pull request made things worse.
        reality: Adding or renaming a test changes the numbers with no production change at all, because snapshots key off test names and call counts.
        why: The diff is presented as a property of the code rather than of the suite that measured it.
        source: rubilmax-gas-diff
  - id: coverage-lcov
    title: Coverage output
    oneLine: forge coverage --report lcov emits LCOV, which downstream tooling filters, renders as a comment and thresholds.
    statement: >
      `forge coverage` supports several report formats; LCOV is the one downstream tooling consumes.
      The standard treatment is to drop `test/` and `script/` from the report — otherwise your test
      files inflate the number — then render the result as a pull-request comment. Doing that much is
      cheap and genuinely useful for spotting a file nobody tested at all.
    volatility: evolving
    edges:
      - { to: ci-pipeline-shape, type: requires }
    sources: [forge-coverage-reference, scopelift-foundry-template]
  - id: coverage-via-ir-breakage
    title: Coverage breaks on via-IR projects
    oneLine: forge coverage regularly fails with stack-too-deep on projects that need --via-ir, and the --ir-minimum workaround degrades source-map accuracy.
    statement: >
      Coverage instrumentation compiles differently from your production build. On projects that
      require the IR pipeline it frequently fails with stack-too-deep, and the documented workaround
      compiles with minimal optimisation, which distorts the source maps the report is built from.
      These are long-lived, unfixed issues in both Foundry and the compiler. If your project needs
      via-IR, expect coverage to be approximate at best.
    volatility: evolving
    edges:
      - { to: coverage-lcov, type: requires }
      - { to: via-ir-pipeline, type: requires }
    sources: [foundry-coverage-guide, foundry-issue-3357, foundry-issue-6592, solidity-issue-15775]
    misconceptions:
      - belief: A green coverage number reflects the code you ship.
        reality: Coverage may be compiled with different optimizer and via-IR settings than your build, and the minimal-IR workaround distorts source maps.
        why: Coverage looks like an observation of the same binary, not a separate compilation.
        source: foundry-issue-6592
  - id: coverage-is-not-correctness
    title: Coverage measures execution, not assertion
    oneLine: A suite can hit every line while asserting almost nothing, so coverage is a floor on effort and never evidence of correctness.
    statement: >
      Line coverage counts which lines executed. A test that calls every function and asserts nothing
      scores perfectly. Coverage is therefore useful in one direction only — a file at zero percent is
      genuinely untested — and misleading in the other. Every coverage threshold in circulation is
      folklore; no source links a percentage to defect rates in smart contracts, so do not gate merges
      on one.
    volatility: stable
    edges:
      - { to: coverage-lcov, type: requires }
      - { to: invariant, type: contrasts }
    sources: [forge-coverage-reference]
    misconceptions:
      - belief: High coverage means well tested.
        reality: Coverage measures execution, not assertion; property and invariant tests catch classes of bug that full line coverage misses entirely.
        why: It is the only testing metric that produces a single comparable number.
        source: forge-coverage-reference
  - id: campaign-tiering
    title: Tier the campaigns by budget
    oneLine: A short bounded run gates the pull request; a long scheduled campaign runs nightly and files an issue when it finds something.
    statement: >
      Fuzzing and invariant testing are searches whose value grows with time spent, and a pull request
      cannot wait hours. Split them: a short, bounded, seeded run as a required check, and a scheduled
      long campaign that runs overnight and opens an issue on a finding. The pull-request tier answers
      "did this change break something obvious"; the nightly tier answers "is there anything here at
      all", and only one of those questions belongs on the critical path.
    volatility: evolving
    edges:
      - { to: invariant, type: requires }
      - { to: ci-profile, type: requires }
    sources: [foundry-ci, echidna-action]
  - id: corpus-persistence
    title: A campaign only compounds if the corpus is kept
    oneLine: Coverage-guided fuzzers accumulate a corpus; without caching it between runs every nightly campaign restarts the search from zero.
    statement: >
      Coverage-guided engines such as Echidna and Medusa build a corpus of inputs that reach
      interesting states, and each subsequent run starts from it. If the corpus directory is not
      persisted between CI runs, every night's campaign begins from nothing and never gets deeper than
      one night's budget. Caching the corpus is what turns a nightly job into a search that compounds.
    volatility: evolving
    edges:
      - { to: campaign-tiering, type: requires }
    sources: [echidna-action, create-chimera-app]
    misconceptions:
      - belief: A nightly fuzz campaign is just the pull-request job with a longer timeout.
        reality: Without a persisted corpus each run restarts the search from scratch and never reaches deeper states.
        why: The command line looks identical; only the accumulated state differs.
        source: echidna-action
  - id: flaky-gate-hazard
    title: A random search makes a bad required check
    oneLine: Randomised gates produce red builds unrelated to the diff, which makes them a poor required check.
    statement: >
      Fuzzing is nondeterministic across runs unless `[fuzz] seed` is pinned, so an unseeded fuzz or
      invariant campaign used as a required check can go red on a change that did not cause the
      failure. A gate that fails for reasons unrelated to the diff gives a reviewer nothing to act on
      while still competing for attention with the checks that do. Either seed the gating tier and
      accept a narrower search, or move the search off the critical path and report findings
      asynchronously.
    volatility: stable
    edges:
      - { to: campaign-tiering, type: requires }
      - { to: snapshot-check-gate, type: contrasts }
    sources: [foundry-testing-config, foundry-ci]
  - id: junit-machine-output
    title: --junit is the machine-readable output
    oneLine: forge test --junit emits JUnit XML with per-test results; --json still interleaves non-JSON on stdout, and that defect is open.
    statement: >
      For programmatic consumption of test results — a CI annotation, a dashboard, an exercise grader
      — use `forge test --junit`, which emits a stable, widely-parsed XML schema carrying per-test-case
      pass or fail, timing and failure messages. The `--json` path writes compiler diagnostics and
      other non-JSON to stdout alongside the JSON, so it cannot be piped to a parser reliably; the
      issue is long-standing and still open. Treat a non-zero exit with no parseable XML as "could not
      run", which is a different outcome from a failing test.
    volatility: evolving
    edges:
      - { to: ci-pipeline-shape, type: requires }
      - { to: test-filtering, type: requires }
    sources: [forge-test-reference, foundry-issue-3001, foundry-issue-2210, measured-forge-1-7-1]
    misconceptions:
      - belief: forge test --json is the machine-readable output format.
        reality: Its stream is polluted by non-JSON stdout, so parsing it needs heuristics; --junit is the reliable path.
        why: JSON is the default assumption for machine-readable CLI output.
        source: foundry-issue-3001
