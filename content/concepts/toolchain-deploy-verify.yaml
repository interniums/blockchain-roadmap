moduleId: toolchain-deploy-verify
concepts:
  - id: forge-script
    title: A deploy script is a contract
    oneLine: forge script executes a Solidity contract with a run() entrypoint, so deployment logic is written in the same language as the contracts.
    statement: >
      A Foundry deployment script is a Solidity contract, conventionally `script/Deploy.s.sol` with a
      `run()` entrypoint, executed by `forge script`. Deployment logic therefore shares the language,
      the types, the libraries and the cheatcodes of the contracts it deploys — no separate
      JavaScript program with its own ABI encoding to get wrong. One constraint to keep in view since
      Fusaka: a single transaction is capped at 2^24 gas by EIP-7825, so a script that deploys a large
      system must split across transactions rather than assume one will do.
    volatility: evolving
    edges:
      - { to: tests-in-solidity, type: requires }
      - { to: cheatcode-families, type: requires }
    sources: [foundry-deploying, forge-script-reference, eip-7825]
  - id: broadcast-cheatcode
    title: startBroadcast marks what becomes real
    oneLine: Only calls between vm.startBroadcast() and vm.stopBroadcast() become transactions; everything else is local computation.
    statement: >
      Inside a script, `vm.startBroadcast()` and `vm.stopBroadcast()` delimit the calls that are
      collected into real transactions. Everything outside that region — reading config, computing
      addresses, assembling constructor arguments, assertions — runs locally and the chain never sees
      it. This is what lets a script contain arbitrary logic without that logic costing gas.
    volatility: evolving
    edges:
      - { to: forge-script, type: requires }
    sources: [foundry-deploying]
  - id: simulate-then-broadcast
    title: One flag separates a rehearsal from the real thing
    oneLine: Without --broadcast the script simulates against the RPC's state and sends nothing; with it, the transactions are irreversible.
    statement: >
      `forge script` without `--broadcast` is a dry run: it simulates the script against the
      endpoint's current state, reports what would happen and writes artifacts, but sends no
      transactions. Adding `--broadcast` sends them. The same command does both, distinguished by one
      flag, which is why rehearsing on a fork and then adding the flag is the standard discipline —
      and why the flag deserves to be typed deliberately every single time.
    volatility: evolving
    edges:
      - { to: forge-script, type: requires }
      - { to: broadcast-cheatcode, type: contrasts }
    sources: [foundry-deploying]
    misconceptions:
      - belief: Running forge script deploys the contract.
        reality: Without --broadcast it only simulates; with --broadcast it is irreversible.
        why: The same command does both and only one flag distinguishes them.
        source: foundry-deploying
  - id: broadcast-artifacts
    title: What broadcast/ records
    oneLine: Results land in broadcast/<Script>.s.sol/<chainId>/run-latest.json — each transaction, its receipt, and the deployed contractAddress.
    statement: >
      A broadcast run writes JSON under `broadcast/<Script>.s.sol/<chainId>/`, with `run-latest.json`
      naming the most recent one and dry runs kept separately. Each entry records the transaction as
      sent, its receipt, and for a deployment the resulting `contractAddress`. This is the only local
      record of what you actually did, which is why it is committed and why deleting it after a
      partial failure destroys your recovery path.
    volatility: evolving
    edges:
      - { to: simulate-then-broadcast, type: requires }
      - { to: foundry-project-layout, type: requires }
    sources: [foundry-deploying]
    misconceptions:
      - belief: The broadcast directory is disposable build output.
        reality: --resume and downstream scripts read it; it is the only local record of which transactions were sent.
        why: It sits next to out/ and cache/, which genuinely are disposable.
        source: foundry-deploying
  - id: broadcast-as-source-of-truth
    title: Reading addresses back out
    oneLine: Later scripts parse deployed addresses out of the broadcast JSON, so the file is deployment state rather than a log.
    statement: >
      A follow-up script reads an address it needs out of the broadcast artifact — for example with
      `vm.parseJsonAddress(json, ".transactions[0].contractAddress")` — instead of taking it as a
      hardcoded constant or an environment variable someone pasted. That makes the deployment record
      the single source of truth for what exists where, and makes a multi-step deployment resumable
      and auditable rather than dependent on someone's terminal scrollback.
    volatility: evolving
    edges:
      - { to: broadcast-artifacts, type: requires }
    sources: [foundry-deploying]
  - id: resume-and-slow
    title: resume and slow
    oneLine: --resume continues a partially-broadcast run from the artifacts; --slow sends one transaction at a time and waits for each receipt.
    statement: >
      When a multi-transaction script fails halfway, `--resume` continues it using the broadcast
      artifacts rather than redeploying what already succeeded. `--slow` sends transactions
      sequentially, waiting for each receipt before the next, which some chains and sequencers require
      and which trades throughput for a much clearer failure point. Both exist because a deployment is
      a distributed operation that can fail in the middle.
    volatility: evolving
    edges:
      - { to: broadcast-artifacts, type: requires }
    sources: [foundry-deploying, forge-script-reference]
  - id: signer-selection
    title: How to sign
    oneLine: Use --account with an imported keystore, or --ledger; --private-key puts a live key in shell history and process arguments.
    statement: >
      The taught default is a keystore: `cast wallet import` once, then `--account <name>` at
      deployment time, or `--ledger` for a hardware signer. `--private-key $PK` places a live key in
      shell history, in the process argument list visible to anything on the machine, and in CI logs
      if anyone echoes it. It works, which is exactly the problem — it builds a habit that leaks the
      first time it is used against mainnet.
    volatility: evolving
    edges:
      - { to: forge-script, type: requires }
    sources: [foundry-deploying]
  - id: chain-flag-trap
    title: --chain does not choose the network
    oneLine: --chain only sets block.chainid inside the EVM; the network you actually talk to is whatever --rpc-url points at.
    statement: >
      `--chain` sets the chain id the EVM reports, which affects contract logic and signature domains.
      It does not select a destination. The network the transaction is sent to is decided entirely by
      `--rpc-url`. The two are separately configurable and the naming invites exactly the wrong
      inference, which is how a transaction intended for one chain arrives on another.
    volatility: evolving
    edges:
      - { to: forge-script, type: requires }
    sources: [foundry-deploying]
    misconceptions:
      - belief: "`--chain base` sends the transaction to Base."
        reality: --chain only sets block.chainid in the EVM; --rpc-url selects the network.
        why: The flag is named after the thing you think you are choosing.
        source: foundry-deploying
  - id: create-address-derivation
    title: Where a CREATE address comes from
    oneLine: A plain CREATE address is keccak256(rlp(sender, nonce))[12:] — it depends on the deployer's nonce, so it cannot be reproduced once nonces diverge.
    statement: >
      An ordinary deployment derives its address from the deployer and that deployer's nonce:
      `keccak256(rlp(sender, nonce))[12:]`. Because the nonce advances with every transaction the
      account sends, the same deployer produces a different address on a chain where it has done
      anything else first. That is why "deploy the same contract to five chains and get the same
      address" fails as soon as one chain saw a test transaction.
    volatility: stable
    edges:
      - { to: account-nonce-eoa, type: requires }
      - { to: create2-address, type: contrasts }
    sources: [foundry-create2-guide]
  - id: initcode-hash-fragility
    title: The initcode hash includes more than you think
    oneLine: Constructor arguments and compiler settings are part of the initcode hash, so one changed argument silently changes the CREATE2 address.
    statement: >
      A CREATE2 address is a hash of the deployer, the salt and the initcode — and the initcode is the
      creation bytecode with the ABI-encoded constructor arguments appended. Change one constructor
      argument, one optimizer setting, or the solc version, and the hash changes and so does the
      address. Every real "why is the address different on chain B" incident reduces to one of those
      three.
    volatility: stable
    edges:
      - { to: create2-address, type: requires }
      - { to: solc-pinning, type: requires }
    sources: [foundry-create2-guide]
    misconceptions:
      - belief: CREATE2 guarantees the same address on every chain.
        reality: Only if deployer, salt and initcode hash are all identical, and initcode includes constructor arguments and compiler settings.
        why: The pitch is "deterministic addresses", which is true of the function and not of your process.
        source: foundry-create2-guide
  - id: create3-pattern
    title: CREATE3
    oneLine: CREATE2 a tiny proxy which then CREATEs the real contract, making the final address independent of the initcode.
    statement: >
      CREATE3 is a two-step pattern: CREATE2-deploy a minimal deployer contract, whose address depends
      only on deployer and salt because its own initcode is fixed, and have it CREATE the real
      contract at nonce one. The final address then depends on the salt alone, so constructor
      arguments and compiler settings may differ per chain while the address stays identical. The
      cost is an extra deployment and a second contract in the trust path.
    volatility: evolving
    edges:
      - { to: initcode-hash-fragility, type: requires }
      - { to: create-address-derivation, type: requires }
    sources: [solady-create3, foundry-create2-guide]
  - id: deterministic-deployer-proxy
    title: The 0x4e59 deployer
    oneLine: 'A community CREATE2 factory exists at the same address on most chains, and Foundry routes salted new C{salt: s}() through it by default.'
    statement: >
      The deterministic deployment proxy at 0x4e59b44847b379578588920cA78FbF26c0B4956C exists at the
      same address on most chains, which is what makes cross-chain address determinism practical: you
      do not need to control an account with a matching nonce anywhere. Foundry's salted creation
      syntax routes through it by default, overridable with the `create2_deployer` config key or
      `--create2-deployer`.
    volatility: evolving
    edges:
      - { to: create2-address, type: requires }
    sources: [foundry-create2-guide]
  - id: nicks-method
    title: Why that factory is at the same address everywhere
    oneLine: It was deployed by a keyless, pre-EIP-155 signed transaction anyone can replay — which is also why some chains do not have it.
    statement: >
      The factory's cross-chain address comes from Nick's method: a transaction signed with a made-up
      signature, from an address nobody controls, with the gas price and gas limit sealed into the
      signed payload and no chain id. Anyone can fund the derived sender and replay it, so the
      contract lands at the same address on any chain that accepts it. Chains that require EIP-155
      replay protection, or that use a different gas schedule, reject it — so the factory is not
      universal, in a specific and predictable way.
    volatility: evolving
    edges:
      - { to: deterministic-deployer-proxy, type: requires }
      - { to: erc-7955-factory, type: contrasts }
    sources: [erc-7955]
    misconceptions:
      - belief: The 0x4e59 factory exists on every chain.
        reality: It cannot be deployed by Nick's method on chains that mandate EIP-155 replay protection or use a different gas schedule, and several chains lack it.
        why: It is present on every chain most developers have used.
        source: erc-7955
  - id: erc-7955-factory
    title: ERC-7955, the proposed replacement
    oneLine: A Draft ERC for a permissionless CREATE2 factory bootstrapped with EIP-7702 instead of Nick's method — proposed, not shipped.
    statement: >
      ERC-7955 proposes a permissionless CREATE2 factory at a standardised address, bootstrapped using
      an EIP-7702 delegation rather than a keyless pre-EIP-155 transaction, precisely to fix the chains
      where Nick's method cannot work. As of August 2026 it is Draft: the address in the draft text may
      change, and the 0x4e59 proxy remains the practical answer. Teach it as the named problem and the
      proposed fix, not as current practice.
    volatility: hot
    edges:
      - { to: nicks-method, type: requires }
      - { to: delegation-designator, type: requires }
    sources: [erc-7955]
  - id: verification-is-bytecode-matching
    title: What verification actually is
    oneLine: The explorer recompiles your source with your stated settings and checks the output matches the deployed bytecode. That is all it proves.
    statement: >
      "Verified source" means an explorer took your source and your declared compiler settings,
      recompiled, and got bytecode matching what is deployed. It establishes correspondence between
      the code you published and the code that runs. It says nothing about whether that code is
      correct, safe, or benign — malicious contracts verify perfectly, because they are exactly what
      their source says they are.
    volatility: stable
    edges:
      - { to: solc-pinning, type: requires }
    sources: [etherscan-verify-with-foundry, forge-verify-contract-reference]
    misconceptions:
      - belief: A verified contract is a safe contract.
        reality: Verification proves the published source compiles to the deployed bytecode, nothing more.
        why: The green checkmark reads as an endorsement rather than as a correspondence check.
        source: etherscan-verify-with-foundry
  - id: metadata-hash-match
    title: Exact versus partial matching
    oneLine: Solidity appends a metadata hash to bytecode; matching it too is a stronger match than matching only the executable part.
    statement: >
      The compiler appends a metadata hash covering the source files, their paths and the compiler
      settings to the end of the deployed bytecode. Matching the executable portion but not that tail
      is a weaker result: the code behaves identically, while comments, file paths or settings may
      differ from the source you are reading. Matching the tail as well pins the exact sources.
      Verification services label these two outcomes differently and have renamed the labels over
      time, so read what a given service means rather than trusting a remembered term.
    volatility: evolving
    edges:
      - { to: verification-is-bytecode-matching, type: requires }
    sources: [etherscan-verify-with-foundry]
  - id: etherscan-v2-single-key
    title: One Etherscan key, not twelve
    oneLine: Etherscan consolidated its explorers behind one V2 endpoint with a chainid parameter, so a single API key covers the family.
    statement: >
      Etherscan's V2 API serves every Etherscan-family explorer from one endpoint with a `chainid`
      parameter, so one key verifies on Etherscan, Arbiscan, Basescan, Polygonscan and the rest. For a
      chain Foundry does not know natively, pass `--verifier etherscan --verifier-url` with the
      chainid query parameter and the same key. Any tutorial telling you to collect a separate key per
      explorer predates the consolidation.
    volatility: hot
    edges:
      - { to: verification-is-bytecode-matching, type: requires }
    sources: [etherscan-verify-with-foundry, foundry-issue-9196, foundry-issue-2435]
    misconceptions:
      - belief: Verification failing means the deployment failed.
        reality: The usual cause is that the explorer has not indexed the transaction yet, which is why --watch and retry exist.
        why: Broadcast and indexing are asynchronous, and the error message describes the symptom.
        source: foundry-issue-2435
  - id: sourcify-alternative
    title: Verifiers other than Etherscan
    oneLine: Sourcify is the open, chain-agnostic verification service, selected with --verifier sourcify; Blockscout explorers are a third target.
    statement: >
      `forge verify-contract` accepts a `--verifier`, of which Etherscan is only one option. Sourcify
      is open and chain-agnostic and stores the full source and metadata rather than a rendering of it;
      Blockscout-based explorers are common on L2s and app-chains. Verifying to more than one service
      costs one extra command and removes a single point of failure from the record of what you
      deployed.
    volatility: evolving
    edges:
      - { to: verification-is-bytecode-matching, type: requires }
      - { to: etherscan-v2-single-key, type: contrasts }
    sources: [forge-verify-contract-reference]
  - id: same-address-not-same-contract
    title: Same address is not same contract
    oneLine: Identical addresses across chains say nothing about identical code or identical configuration; each chain must be verified on its own.
    statement: >
      An address is a hash of deployment inputs, not a certificate. Two chains can hold different code
      at the same address — different constructor arguments, a different compiler, a different
      implementation entirely behind the same proxy address. Every chain therefore needs its own
      verification, its own configuration review and its own ownership check. Users, and quite a lot of
      tooling, assume otherwise.
    volatility: stable
    edges:
      - { to: create2-address, type: requires }
      - { to: verification-is-bytecode-matching, type: requires }
    sources: [layerzero-uniform-address, foundry-create2-guide]
    misconceptions:
      - belief: Deploy once to mainnet, then repeat the same script per chain and you are done.
        reality: Chain-specific constructor arguments break address determinism, and every chain needs its own verification and its own ownership and permission setup.
        why: The script is the same file, so the outcome feels like it must be the same.
        source: layerzero-uniform-address
