moduleId: toolchain-fork-testing
concepts:
  - id: fork-testing-purpose
    title: What fork testing is for
    oneLine: Running your contracts against the real deployed state of a live chain instead of against mocks you wrote yourself.
    statement: >
      A fork test executes your contracts in a local EVM whose state is backed by a real chain at a
      chosen block, so calls into Uniswap, Aave or USDC hit the actual deployed bytecode and the
      actual balances. The value is not realism for its own sake: a mock encodes your belief about how
      the dependency behaves, and integration bugs live precisely in the gap between that belief and
      the deployed code.
    volatility: stable
    edges:
      - { to: tests-in-solidity, type: requires }
    sources: [foundry-fork-testing]
  - id: lazy-state-fetch
    title: State is fetched lazily, per slot
    oneLine: The local EVM starts empty and fetches accounts, code and storage slots over RPC the first time each is touched.
    statement: >
      Forking downloads nothing up front. The local EVM begins empty and, on the first access to an
      account, its code, or a storage slot, issues an RPC request for exactly that item and caches the
      result. Starting a fork is therefore nearly free, and the cost of a fork test is proportional to
      how much distinct state it touches, not to the size of the chain.
    volatility: stable
    edges:
      - { to: fork-testing-purpose, type: requires }
    sources: [foundry-fork-testing]
    misconceptions:
      - belief: Forking downloads the chain locally.
        reality: State is fetched lazily per account and per slot on first access, then cached.
        why: '"Fork the chain" sounds like cloning a repository.'
        source: foundry-fork-testing
  - id: fork-mode-cli
    title: Forking the whole run
    oneLine: forge test --fork-url with --fork-block-number, or eth_rpc_url and fork_block_number in foundry.toml, forks every test in the run.
    statement: >
      The command-line mode puts the entire test run on one fork: `forge test --fork-url <rpc>
      --fork-block-number <n>`, or the equivalent `eth_rpc_url` and `fork_block_number` keys in
      foundry.toml. Every test sees the same forked state, which is simple and is the right choice
      when a whole suite is an integration suite. It gives no per-test control and no way to hold two
      chains at once.
    volatility: evolving
    edges:
      - { to: fork-testing-purpose, type: requires }
      - { to: fork-cheatcodes, type: contrasts }
    sources: [foundry-fork-testing]
  - id: fork-cheatcodes
    title: Forking from inside a test
    oneLine: vm.createFork returns a fork id, vm.selectFork activates one, vm.createSelectFork does both, vm.activeFork reports the current one.
    statement: >
      The cheatcode API gives per-test control: `vm.createFork(url[, block])` creates a fork and
      returns its id without activating it, `vm.selectFork(id)` makes one active, `vm.createSelectFork`
      does both in one step, and `vm.activeFork()` reports which is current. This is the flexible
      mode and the only way to hold more than one chain in a single test.
    volatility: evolving
    edges:
      - { to: fork-mode-cli, type: requires }
    sources: [foundry-cheatcode-create-fork, foundry-cheatcode-create-select-fork]
  - id: rpc-endpoints-aliases
    title: Naming your endpoints
    oneLine: "[rpc_endpoints] maps aliases to URLs with ${ENV_VAR} interpolation, so tests say `mainnet` instead of embedding a keyed URL."
    statement: >
      The `[rpc_endpoints]` table in foundry.toml maps short aliases to endpoint URLs and supports
      `${ENV_VAR}` interpolation, so a test or a CI job refers to `mainnet` while the actual keyed URL
      lives in the environment. This keeps API keys out of source control and makes switching
      providers a one-line change rather than a search and replace across the suite.
    volatility: evolving
    edges:
      - { to: foundry-toml, type: requires }
      - { to: fork-mode-cli, type: requires }
    sources: [foundry-config-overview, foundry-fork-testing]
  - id: multi-fork-testing
    title: Several forks in one test
    oneLine: Multiple forks coexist with independent state, so one test can compare or coordinate across chains.
    statement: >
      Forks created in a test coexist; each holds its own state and the active-fork pointer moves
      between them. This is what makes a single test able to check that an L1 and an L2 deployment
      agree, or that a message-passing flow behaves on both sides. Only one fork is active at a time,
      so cross-chain logic is expressed as a sequence of switches rather than as concurrency.
    volatility: evolving
    edges:
      - { to: fork-cheatcodes, type: requires }
      - { to: fork-mode-cli, type: contrasts }
    sources: [foundry-cheatcode-create-fork, foundry-fork-testing]
  - id: fork-state-isolation
    title: Switching forks switches the whole world
    oneLine: Each fork id carries its own state, so a contract deployed while fork A was active does not exist under fork B.
    statement: >
      Fork state is per-fork and complete. Selecting another fork replaces every account, balance and
      storage slot with that fork's version, so a helper contract you deployed a moment ago simply is
      not there afterwards. What makes this confusing in practice is that the test contract itself does
      survive the switch, so the world looks intact right up until the first call into something that
      did not.
    volatility: evolving
    edges:
      - { to: multi-fork-testing, type: requires }
    sources: [foundry-cheatcode-make-persistent, foundry-fork-testing]
    misconceptions:
      - belief: Contracts you deployed in the test are still there after vm.selectFork.
        reality: Each fork has its own state; only persistent accounts survive a switch.
        why: The test contract itself does survive, so it looks like everything does.
        source: foundry-cheatcode-make-persistent
  - id: make-persistent
    title: Persistent accounts
    oneLine: vm.makePersistent(addr) marks accounts whose state survives fork switches; by default only the test contract and the caller are persistent.
    statement: >
      `vm.makePersistent(addr)` declares that an account's state should be carried across fork
      switches rather than replaced. The documented default persistent set is the test contract and
      the caller. The fix for "my helper disappeared after selectFork" is therefore a persistence
      declaration, not a redeployment — and knowing which accounts are persistent is the difference
      between a two-line fix and a confusing rewrite.
    volatility: evolving
    edges:
      - { to: fork-state-isolation, type: requires }
    sources: [foundry-cheatcode-make-persistent]
  - id: create-select-fork-duplicates
    title: createSelectFork is not idempotent
    oneLine: Every call creates a NEW fork, so calling it twice with the same URL gives two independent forks, each starting clean.
    statement: >
      `vm.createSelectFork` creates a fresh fork on every invocation. Calling it twice with the same
      URL does not reconnect to the first fork; it produces a second one with clean state, silently
      discarding anything the test did under the first. Keep and reuse the returned fork id with
      `vm.selectFork` instead.
    volatility: evolving
    edges:
      - { to: fork-cheatcodes, type: requires }
    sources: [foundry-cheatcode-create-select-fork]
    misconceptions:
      - belief: Calling vm.createSelectFork(url) twice gives you the same fork back.
        reality: It creates a second, independent fork with clean state.
        why: It reads like "connect to mainnet", which is naturally idempotent.
        source: foundry-cheatcode-create-select-fork
  - id: roll-fork
    title: rollFork moves the fork, roll does not
    oneLine: vm.rollFork(n) moves a fork to another block and changes the real state it reads; vm.roll only rewrites block.number locally.
    statement: >
      `vm.rollFork(n)` moves a fork to a different block, so the underlying real state it reads
      changes. Given a transaction hash instead of a number, it rolls to that transaction's block and
      replays the transactions preceding it, reconstructing the exact state immediately before that
      transaction. `vm.roll` does none of this: it sets `block.number` in the local EVM and leaves the
      forked state untouched. The names are one character apart and the behaviours are unrelated.
    volatility: evolving
    edges:
      - { to: fork-cheatcodes, type: requires }
      - { to: warp-and-roll, type: contrasts }
    sources: [foundry-cheatcode-roll-fork]
    misconceptions:
      - belief: vm.roll and vm.rollFork are the same thing.
        reality: vm.roll sets block.number in the local EVM; vm.rollFork moves the fork to a different block and changes the state it reads.
        why: Near-identical names for unrelated operations.
        source: foundry-cheatcode-roll-fork
  - id: vm-transact
    title: Replaying a real transaction
    oneLine: vm.transact(txHash) executes a real historical transaction inside the fork, so a test can reproduce an exploit verbatim.
    statement: >
      `vm.transact(txHash)` executes an actual historical transaction inside the active fork. Combined
      with rolling to the right block, it lets a test reconstruct a real incident from real chain
      state with no mocks: roll to just before the exploit, replay it, and assert on the balance
      changes. It is the most direct way to study an attack, and the same technique reproduces a
      user's failing transaction when support says "it reverts for me".
    volatility: evolving
    edges:
      - { to: roll-fork, type: requires }
    sources: [foundry-cheatcode-transact]
  - id: block-pinning
    title: Pin the block
    oneLine: An unpinned fork tracks latest, so the same test runs against different state every hour and goes red for reasons unrelated to your code.
    statement: >
      Without `--fork-block-number` (or `fork_block_number`) a fork tracks the chain's latest block.
      The same commit then runs against different state on every execution: balances move, prices
      move, and a green suite goes red overnight with no code change. Pinning is the difference
      between a test and an observation.
    volatility: stable
    edges:
      - { to: fork-mode-cli, type: requires }
    sources: [foundry-fork-testing]
    misconceptions:
      - belief: Not pinning a block just means testing against the newest state, which is more realistic.
        reality: It makes the test non-reproducible and defeats the block-keyed cache, so every run refetches over RPC and can fail for reasons unrelated to your change.
        why: '"Latest" sounds more real than a number from last month.'
        source: foundry-fork-testing
  - id: fork-cache-keying
    title: The cache is keyed by chain and block
    oneLine: Cached state is keyed by chain id and block number, so an unpinned "latest" fork essentially never hits cache.
    statement: >
      Fetched fork data is cached under a key that includes both the chain id and the block number.
      A pinned fork therefore collapses onto one cache key and is served locally after the first run;
      an unpinned fork produces a new key every time the chain advances and refetches everything on
      every run. This makes pinning a performance and cost decision at least as much as a
      determinism one.
    volatility: evolving
    edges:
      - { to: block-pinning, type: requires }
      - { to: lazy-state-fetch, type: requires }
    sources: [foundry-fork-testing]
  - id: fork-cache-location
    title: Where the fork cache lives
    oneLine: Fetched state persists under ~/.foundry/cache; deleting that tree forces a refetch and is the documented fix for a poisoned cache.
    statement: >
      Fork data is cached on disk under `~/.foundry/cache`, organised by chain and block. Foundry's
      documentation has described the exact subdirectory layout two different ways across versions —
      with and without an intervening `rpc/` segment — so read the path off your own machine before
      writing a CI cache key against it. What is stable is the remedy: when a fork test fails in a way
      that makes no sense, clearing the cache tree and refetching is the documented first move.
    volatility: hot
    edges:
      - { to: fork-cache-keying, type: requires }
    sources: [foundry-fork-testing, foundry-troubleshooting]
    misconceptions:
      - belief: A stale or broken fork test means the chain state changed underneath you.
        reality: It is often a poisoned local RPC cache; clearing the cache directory is the documented first step.
        why: Caching is invisible right up until it is wrong.
        source: foundry-troubleshooting
  - id: storage-caching-config
    title: Controlling what gets cached
    oneLine: no_storage_caching disables RPC caching entirely; the [rpc_storage_caching] block selects which chains and which endpoints are cached.
    statement: >
      Caching is configurable: `no_storage_caching` turns it off completely, and an
      `[rpc_storage_caching]` block narrows which chains and which endpoints are cached. The reason to
      touch either is usually debugging — proving that a failure is or is not cache-related — or
      deliberately refusing to cache a local endpoint whose state you are mutating between runs.
    volatility: evolving
    edges:
      - { to: fork-cache-location, type: requires }
    sources: [foundry-testing-config, foundry-config-overview]
  - id: archive-node-requirement
    title: Old blocks need an archive node
    oneLine: Reading state at a block outside a node's retention window requires an archive node; pruned and free public endpoints error out.
    statement: >
      A full node keeps recent state and prunes older state. Reading a storage slot as it stood at a
      block beyond that retention window requires an archive node. The failure is unhelpful: the RPC
      accepts the request and fails deep in the call with a missing-trie-node style error, which reads
      like a bug in your test. Pinning an old block therefore constrains which providers you can use.
    volatility: evolving
    edges:
      - { to: block-pinning, type: requires }
    sources: [ethereum-org-nodes-clients, foundry-fork-testing]
  - id: rpc-cost-model
    title: Fork tests are billed per slot, not per test
    oneLine: A forked suite issues a request for every uncached account, code and storage slot it touches, which is how it exhausts free tiers.
    statement: >
      Because state is fetched lazily per item, a broad forked suite issues a large number of small
      requests rather than one connection. That is what burns through a provider's compute-unit
      budget and trips rate limits, and it scales with how much distinct state the suite touches. The
      cache is the primary mitigation, which is another reason pinning matters. Provider-specific
      limits and prices change constantly and are not worth memorising.
    volatility: evolving
    edges:
      - { to: lazy-state-fetch, type: requires }
      - { to: fork-cache-keying, type: requires }
    sources: [foundry-fork-testing]
    misconceptions:
      - belief: A fork test hits the RPC once, when it connects.
        reality: It issues a request per uncached account, code blob and storage slot touched.
        why: It feels like establishing one connection to a chain.
        source: foundry-fork-testing
  - id: ci-cache-restore
    title: Restoring the fork cache in CI
    oneLine: Persisting ~/.foundry/cache keyed on the pinned block turns a forked suite from a per-run RPC bill into a nearly offline run.
    statement: >
      A CI job that restores Foundry's cache directory, keyed on the pinned fork block, serves almost
      all state locally after the first run. The pinned block is what makes the key stable, so this
      only works for suites that pin. The observable success criterion is a cache hit plus a
      materially lower runtime or request count on the second run — not merely that the step is
      configured.
    volatility: evolving
    edges:
      - { to: fork-cache-keying, type: requires }
      - { to: rpc-cost-model, type: requires }
      - { to: fork-cache, type: applies }
    sources: [foundry-ci, foundry-toolchain-action]
  - id: fork-tests-are-slow
    title: Keep the forked suite thin
    oneLine: Even cached, forked tests are far slower than local ones, so the pattern is a fast local suite plus a small, separately-tagged fork suite.
    statement: >
      Fork tests are slower than local tests by a wide margin even with a warm cache, and they depend
      on a network service. The working pattern is a fast local unit and fuzz suite that runs on every
      save, plus a deliberately small forked integration suite kept in its own directory and selected
      with `--match-path`, run less often. Fork tests complement a local suite; they do not replace it.
    volatility: stable
    edges:
      - { to: rpc-cost-model, type: requires }
      - { to: test-filtering, type: requires }
    sources: [foundry-fork-testing]
    misconceptions:
      - belief: Fork tests replace unit tests because they are more real.
        reality: They are slow, network-dependent and hard to make exhaustive; they cover integration risk that unit tests cannot, and nothing else.
        why: Realism is seductive and mocks feel like cheating.
        source: foundry-fork-testing
