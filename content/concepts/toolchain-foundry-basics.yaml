moduleId: toolchain-foundry-basics
concepts:
  - id: foundry-toolchain
    title: The Foundry toolchain
    oneLine: One Rust toolchain of four binaries — forge, cast, anvil, chisel — installed and versioned together by foundryup.
    statement: >
      Foundry is a single Rust-native EVM toolchain that ships four binaries: forge, cast, anvil and
      chisel. They are not separate projects and are not installed separately; foundryup installs and
      version-manages all four as a set, into ~/.foundry/bin. The curriculum pins forge 1.7.1
      (commit 4072e487, built 2026-05-08) with solc 0.8.36, both verified on the authoring machine.
    volatility: hot
    edges:
      - { to: two-toolchain-world, type: contrasts }
    sources: [foundry-installation, measured-forge-1-7-1]
    misconceptions:
      - belief: forge, cast, anvil and chisel are separate projects you install separately.
        reality: They are one toolchain with one installer; foundryup installs and versions all four together.
        why: Each has its own name and its own docs section, so they read as independent tools.
        source: foundry-installation
  - id: forge-role
    title: What forge is for
    oneLine: forge is the build-and-test driver — it compiles, runs Solidity tests, formats, lints and reports gas.
    statement: >
      forge compiles the project, runs the Solidity test suite inside an in-process EVM, formats
      source (`forge fmt`), lints it (`forge lint`), and produces gas and coverage reports. It is the
      binary you live in; it needs no RPC endpoint for local work, because the EVM it runs against is
      part of the process.
    volatility: evolving
    edges:
      - { to: foundry-toolchain, type: requires }
      - { to: cast-role, type: contrasts }
      - { to: anvil-role, type: contrasts }
      - { to: chisel-role, type: contrasts }
    sources: [foundry-writing-tests, forge-test-reference]
  - id: cast-role
    title: What cast is for
    oneLine: cast is a stateless CLI for talking to a chain and for encoding and decoding EVM data.
    statement: >
      cast performs one-shot operations against a chain or against pure data: `cast call` and
      `cast send` for reads and writes, `cast storage` for raw slots, `cast sig` and `cast 4byte` for
      selectors, `cast abi-encode`/`abi-decode` for calldata, and `cast run` to replay a transaction
      with a trace. It holds no state of its own between invocations.
    volatility: evolving
    edges:
      - { to: foundry-toolchain, type: requires }
      - { to: forge-role, type: contrasts }
    sources: [foundry-installation, foundry-troubleshooting]
  - id: anvil-role
    title: What anvil is for
    oneLine: anvil is a local EVM node that instant-mines, funds ten deterministic dev accounts, and exposes RPC methods for rewriting state.
    statement: >
      anvil is a local development chain. It mines instantly by default, pre-funds ten accounts derived
      from a fixed mnemonic, and exposes a non-standard `anvil_*` RPC namespace for setting balances,
      code, storage, block number and time. It is what you point a frontend or a deploy script at when
      you want a real JSON-RPC endpoint; it is not where unit tests run, because forge has its own EVM.
    volatility: evolving
    edges:
      - { to: foundry-toolchain, type: requires }
      - { to: forge-role, type: contrasts }
      - { to: fork-mode-cli, type: contrasts }
    sources: [foundry-installation, foundry-deploying]
  - id: chisel-role
    title: What chisel is for
    oneLine: chisel is a Solidity REPL for evaluating an expression without creating a project or writing a throwaway test.
    statement: >
      chisel evaluates Solidity statements interactively and prints the resulting values with their
      types, so questions like "what is `type(uint128).max`" or "what does this abi.encodePacked
      produce" are answered in seconds rather than by writing, compiling and running a scratch test.
      It is a thinking tool, not part of any build.
    volatility: evolving
    edges:
      - { to: foundry-toolchain, type: requires }
      - { to: forge-role, type: contrasts }
    sources: [foundry-installation]
  - id: tests-in-solidity
    title: Tests are Solidity, run inside the EVM
    oneLine: Foundry's defining choice — test code is a Solidity contract executing in the same EVM as the code under test.
    statement: >
      A Foundry test is a Solidity contract whose functions are executed by an EVM inside the forge
      process. There is no JavaScript harness, no RPC round trip and no serialisation boundary between
      the assertion and the code under test, which is why tests are fast enough to fuzz and why the
      test can reach into EVM-level facilities (raw storage, precise revert data, gas accounting)
      that an out-of-process runner has to reconstruct.
    volatility: stable
    edges:
      - { to: forge-role, type: requires }
      - { to: two-toolchain-world, type: contrasts }
    sources: [foundry-writing-tests]
  - id: foundry-project-layout
    title: The conventional project layout
    oneLine: src/ test/ script/ lib/ are committed; out/ cache/ broadcast/ are generated — and broadcast/ is not disposable.
    statement: >
      A conventional Foundry project puts contracts in src/, tests in test/ as `*.t.sol`, deployment
      scripts in script/ as `*.s.sol`, and dependencies in lib/. forge generates out/ (compilation
      artifacts, one JSON per contract carrying ABI, bytecode and compiler settings), cache/ (build and
      fuzz-failure cache) and broadcast/ (records of transactions actually sent). The first three plus
      foundry.toml are committed; out/ and cache/ are not; broadcast/ usually is, because later runs
      and later scripts read it.
    volatility: evolving
    edges:
      - { to: forge-role, type: requires }
      - { to: broadcast-artifacts, type: deepens }
    sources: [foundry-installation, foundry-deploying]
  - id: remappings
    title: Remappings
    oneLine: A remapping rewrites an import prefix to a filesystem path, so import strings don't encode where you vendored the dependency.
    statement: >
      A remapping is a rule of the form `prefix/=path/`, for example
      `@openzeppelin/=lib/openzeppelin-contracts/`. Solidity's import strings are resolved against the
      merged set of remappings before the file system is touched, which is what lets the same import
      string work whether a dependency is a git submodule under lib/ or installed somewhere else.
    volatility: stable
    edges:
      - { to: foundry-project-layout, type: requires }
      - { to: remapping-vs-node-resolution, type: contrasts }
    sources: [foundry-solc-config]
  - id: remapping-resolution-order
    title: Where remappings come from
    oneLine: Three sources merge — auto-detected lib/ contents, remappings.txt, and foundry.toml — and `forge remappings` prints the winner.
    statement: >
      Remappings are assembled from up to three places at once: automatic detection of lib/ contents
      (`auto_detect_remappings`, default true — confirmed on forge 1.7.1), an optional remappings.txt,
      and the `remappings` key in foundry.toml. Because they merge rather than replace, the set that
      actually applies is often not written down anywhere; `forge remappings` prints the resolved set
      and is the only reliable answer to "why did this import resolve there".
    volatility: evolving
    edges:
      - { to: remappings, type: requires }
      - { to: foundry-toml, type: requires }
    sources: [foundry-solc-config, foundry-issue-5258, measured-forge-1-7-1]
    misconceptions:
      - belief: Remappings live in remappings.txt.
        reality: They can come from auto-detection of lib/, from remappings.txt, and from foundry.toml, all merged.
        why: remappings.txt is the dapptools inheritance and is what most editor plugins and LSPs read, so it looks canonical.
        source: foundry-solc-config
  - id: dependency-management-choice
    title: Submodules or Soldeer
    oneLine: Dependencies are git submodules under lib/ by default; `forge soldeer` offers a registry alternative in the same binary.
    statement: >
      `forge install` vendors a dependency as a git submodule under lib/, which is why lib/-shaped
      remappings are the default and why a clone without `--recurse-submodules` fails to compile.
      Foundry also ships Soldeer, a registry-based package manager, as a first-class subcommand.
      Submodules remain the default and are what almost all public repositories use.
    volatility: evolving
    edges:
      - { to: remappings, type: requires }
      - { to: submodule-checkout, type: applies }
    sources: [foundry-dependencies]
  - id: foundry-toml
    title: foundry.toml and how it is found
    oneLine: One config file, discovered by walking up from the working directory, with a global fallback and an env override.
    statement: >
      foundry.toml is the project's single configuration file. forge finds it by walking up from the
      current working directory to the filesystem root, falls back to ~/.foundry/foundry.toml, and
      honours FOUNDRY_CONFIG to override the search entirely. This means the config that applies
      depends on where you ran the command from, not only on which repository you are in.
    volatility: evolving
    edges:
      - { to: foundry-project-layout, type: requires }
    sources: [foundry-config-overview]
  - id: config-precedence
    title: Config precedence
    oneLine: Built-in defaults, then foundry.toml, then FOUNDRY_/DAPP_ environment variables — environment wins.
    statement: >
      Configuration resolves in a fixed order: built-in defaults are overridden by foundry.toml, which
      is overridden by `FOUNDRY_*` and `DAPP_*` environment variables. Environment variables having the
      last word is how a CI image or a shell profile changes build behaviour without any commit.
      `forge config` prints the fully merged result and is the diagnostic for every "but I set that in
      the file" argument.
    volatility: evolving
    edges:
      - { to: foundry-toml, type: requires }
    sources: [foundry-config-overview]
    misconceptions:
      - belief: What is written in foundry.toml is what applies.
        reality: FOUNDRY_* and DAPP_* environment variables override the file.
        why: Config files usually beat defaults, so people assume they beat everything.
        source: foundry-config-overview
  - id: foundry-profiles
    title: Profiles and inheritance
    oneLine: Every setting lives under a profile; non-default profiles inherit `[profile.default]` and are selected with FOUNDRY_PROFILE.
    statement: >
      Every key in foundry.toml belongs to a profile table. `[profile.default]` is the base, and every
      other profile inherits from it, so `[profile.ci]` needs only the deltas — and silently picks up
      any later change to the default. The active profile is chosen at runtime with the FOUNDRY_PROFILE
      environment variable.
    volatility: evolving
    edges:
      - { to: foundry-toml, type: requires }
      - { to: config-precedence, type: deepens }
    sources: [foundry-config-overview]
    misconceptions:
      - belief: A profile is a self-contained config block.
        reality: Non-default profiles inherit from `[profile.default]`, so they carry every key you did not restate.
        why: TOML tables look visually independent of one another.
        source: foundry-config-overview
  - id: profile-use-cases
    title: What profiles are actually for
    oneLine: Cheap and fast locally, thorough and slow in CI — the same repository, two effort levels.
    statement: >
      The practical use of profiles is to decouple the inner loop from the gate. A default profile
      keeps the optimizer off and fuzz runs low so `forge test` is fast; a `ci` profile raises fuzz and
      invariant budgets, turns the optimizer or via-IR on, and raises verbosity. Anything that makes a
      local run painful belongs in the ci profile, and anything CI must not skip belongs in default.
    volatility: evolving
    edges:
      - { to: foundry-profiles, type: requires }
      - { to: ci-profile, type: applies }
    sources: [foundry-ci, foundry-config-overview]
  - id: solc-pinning
    title: Pinning the compiler
    oneLine: Setting `solc` in foundry.toml disables per-file auto-detection and forces one compiler for the whole project.
    statement: >
      By default `auto_detect_solc` is true (confirmed on forge 1.7.1) and forge picks a compiler per
      file from its pragma, which can resolve differently on two machines and produce different
      bytecode and different gas. Setting `solc = "0.8.36"` in foundry.toml disables detection and
      forces one compiler across the project. Reproducible builds require this pin; verification on an
      explorer later requires knowing exactly which compiler produced the bytecode.
    volatility: hot
    edges:
      - { to: foundry-toml, type: requires }
      - { to: verification-is-bytecode-matching, type: applies }
    sources: [foundry-solc-config, solidity-0836-release, measured-forge-1-7-1]
    misconceptions:
      - belief: Not pinning solc is fine, because Foundry auto-detects a working compiler.
        reality: Auto-detection resolves per file from pragmas and can select a different compiler on a different machine, changing bytecode and gas.
        why: Auto-detect is the default and usually produces something that compiles.
        source: foundry-solc-config
  - id: evm-version-config
    title: Pinning the EVM ruleset
    oneLine: '`evm_version` selects the hardfork ruleset used both to compile and to run tests — on forge 1.7.1 it defaults to "osaka".'
    statement: >
      `evm_version` in foundry.toml chooses which hardfork's opcode set and gas schedule the compiler
      targets and the test EVM enforces. On forge 1.7.1 with solc 0.8.36 the resolved default is
      "osaka" (verified with `forge config`). Deploying to a chain that is behind mainnet — many L2s
      and sidechains are — means pinning this deliberately, or shipping bytecode containing opcodes
      the target chain will reject.
    volatility: hot
    edges:
      - { to: foundry-toml, type: requires }
      - { to: solc-pinning, type: recommends }
    sources: [foundry-solc-config, measured-forge-1-7-1]
  - id: foundryup-channels
    title: foundryup channels
    oneLine: Bare `foundryup` installs the latest stable; nightlies and exact versions are opt-in.
    statement: >
      `foundryup` with no arguments installs the current stable release. Nightlies and specific
      versions are explicit: `foundryup --install nightly`, `foundryup --install 1.7.1`, or a
      nightly-<sha>; `--branch` and `--commit` build from source. Before Foundry v1.0 (Feb 2025) there
      was no stable channel at all and every install was a nightly, which is why pre-2025 material
      treats "foundryup" and "latest master" as synonyms.
    volatility: hot
    edges:
      - { to: foundry-toolchain, type: requires }
    sources: [foundry-installation, foundry-v1-migration, foundry-versions-reference]
    misconceptions:
      - belief: Running foundryup gives you the newest Foundry code.
        reality: Bare foundryup installs the latest stable release; the newest code is `foundryup --install nightly`.
        why: Pre-v1.0 Foundry was nightly-only, so the old mental model was that foundryup meant latest master.
        source: foundry-installation
  - id: toolchain-pinning-in-ci
    title: Pin the toolchain, not just the compiler
    oneLine: Cheatcode behaviour and config defaults change between Foundry versions, so CI must install one named version.
    statement: >
      Foundry's own defaults and cheatcode semantics move between releases — internal-revert
      expectations, isolation behaviour and gas accounting have all changed inside the 1.x line. A CI
      job that installs "latest" or "nightly" is therefore a pipeline whose behaviour changes without a
      commit. Pin an exact Foundry version in CI the same way you pin solc, and record both in the
      repository so a failure a year from now is reproducible.
    volatility: hot
    edges:
      - { to: foundryup-channels, type: requires }
      - { to: solc-pinning, type: requires }
      - { to: foundry-version-pinning, type: applies }
    sources: [foundry-installation, foundry-ci, foundry-releases]
