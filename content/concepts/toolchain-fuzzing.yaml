moduleId: toolchain-fuzzing
concepts:
  - id: property-vs-example-testing
    title: Properties versus examples
    oneLine: A unit test asserts an outcome for one input you chose; a fuzz test asserts a property that must hold for inputs you did not choose.
    statement: >
      An example-based test encodes both the input and the expected output, so it can only fail in the
      ways you imagined. A property test states a relationship that must hold for every input in a
      domain — balances are conserved, a round trip is the identity, a monotone function never
      decreases — and delegates input selection to the fuzzer. The work moves from inventing cases to
      articulating what must always be true, which is a different and harder skill.
    volatility: stable
    edges:
      - { to: test-discovery-by-prefix, type: requires }
    sources: [foundry-writing-tests, foundry-testing-config]
  - id: stateless-fuzzing
    title: Stateless fuzzing
    oneLine: testFuzz calls one function with random arguments from a fresh post-setUp state each run — it cannot find sequence bugs.
    statement: >
      A stateless fuzz test calls a single function with randomised arguments, starting each run from
      the same post-setUp state. That is its power and its ceiling: it explores the argument domain
      thoroughly and the state space not at all. Bugs that require deposit-then-manipulate-then-
      withdraw, or any ordering across transactions, are structurally out of reach and belong to
      stateful invariant testing.
    volatility: stable
    edges:
      - { to: property-vs-example-testing, type: requires }
      - { to: setup-runs-per-test, type: requires }
      - { to: stateful-fuzzing, type: contrasts }
    sources: [foundry-writing-tests, foundry-invariant-testing]
    misconceptions:
      - belief: Stateless fuzzing would have caught the big protocol hacks.
        reality: Most of those require an ordered multi-call sequence across accumulated state, which is invariant territory; stateless fuzzing restarts from the same state every run.
        why: Headlines say "fuzzing found it" without saying which kind of fuzzing.
        source: foundry-invariant-testing
  - id: fuzz-parameters-are-the-trigger
    title: Parameters are what make a test fuzzed
    oneLine: Any test function that takes arguments is fuzzed; the testFuzz prefix is a convention for humans.
    statement: >
      forge fuzzes any test function that declares parameters, regardless of its name. The `testFuzz`
      prefix is a readability convention, not the mechanism. The practical consequence is that adding
      a parameter to a `test_` function silently converts it into a 256-run campaign, and removing one
      silently converts a property test back into a single case.
    volatility: stable
    edges:
      - { to: stateless-fuzzing, type: requires }
      - { to: test-discovery-by-prefix, type: contrasts }
    sources: [foundry-writing-tests]
  - id: fuzz-runs-default
    title: 256 runs is a smoke test
    oneLine: The default is 256 runs per fuzz test — 256 samples over a 2^256 domain is evidence, not proof.
    statement: >
      `[fuzz] runs` defaults to 256, confirmed by `forge config` on forge 1.7.1. Two hundred and
      fifty-six pseudo-random samples drawn from a 2^256 input space cover a vanishing fraction of it.
      A passing fuzz test means "no counterexample was found at this budget with this seed", which is
      a statement about your search, not about your contract. Raising runs raises confidence
      sub-linearly and raises CI time linearly.
    volatility: evolving
    edges:
      - { to: stateless-fuzzing, type: requires }
      - { to: formal-verification, type: contrasts }
    sources: [foundry-testing-config, measured-forge-1-7-1]
    misconceptions:
      - belief: A passing fuzz test proves the property.
        reality: It means no counterexample was found within the configured runs and seed.
        why: The output prints PASS with no confidence qualifier attached.
        source: foundry-testing-config
  - id: fuzz-output-line
    title: Reading the fuzz result line
    oneLine: "(runs: N, μ: …, ~: …) — μ and ~ are mean and median gas, and say nothing about correctness."
    statement: >
      A passing fuzz test prints the number of runs together with two gas statistics: μ, the mean gas
      across runs, and ~, the median. Neither carries correctness information. They are useful as a
      cheap distribution signal — a large gap between mean and median means some inputs take a very
      different path — and misleading if read as confidence.
    volatility: evolving
    edges:
      - { to: fuzz-runs-default, type: requires }
    sources: [foundry-testing-config]
    misconceptions:
      - belief: The μ figure in the fuzz output says something about how well the property held.
        reality: μ and ~ are mean and median gas across runs.
        why: Greek letters read as statistical confidence.
        source: foundry-testing-config
  - id: fuzz-dictionary
    title: The fuzzer does not sample uniformly
    oneLine: A weighted dictionary of boundary values, storage contents and PUSH-byte constants is mixed into the random stream.
    statement: >
      Foundry mixes a dictionary of "interesting" values into the input stream: boundary numbers,
      values scraped from the contract's storage, and constants recovered from PUSH bytes in the
      bytecode. `dictionary_weight` defaults to 40 and both `include_storage` and `include_push_bytes`
      default to true (confirmed on forge 1.7.1). This is why a fuzzer finds the magic number in your
      code far more often than uniform sampling would predict — and why removing a constant from the
      source can make a previously-found bug stop being found.
    volatility: evolving
    edges:
      - { to: stateless-fuzzing, type: requires }
    sources: [foundry-testing-config, measured-forge-1-7-1]
    misconceptions:
      - belief: The fuzzer picks uniformly random values.
        reality: A weighted dictionary injects boundary values plus constants scraped from storage and the contract's own bytecode.
        why: '"Random input" is the textbook one-line definition of fuzzing.'
        source: foundry-testing-config
  - id: vm-assume-rejection
    title: assume discards the run
    oneLine: vm.assume(cond) throws away the current run when cond is false and starts another — it filters by retrying.
    statement: >
      `vm.assume(cond)` does not constrain generation; it discards the current run when the condition
      is false and draws again. Every rejected run costs a draw and produces no test coverage. For a
      narrow exclusion that rejects one value in 2^160 that is free; for a range constraint that
      rejects almost everything it is catastrophic, and the documentation says so explicitly.
    volatility: evolving
    edges:
      - { to: stateless-fuzzing, type: requires }
      - { to: bound-remapping, type: contrasts }
    sources: [foundry-cheatcode-assume]
  - id: max-test-rejects
    title: Too many rejections fails the test
    oneLine: Rejections are capped at max_test_rejects (default 65536) and exceeding the cap fails the test with a rejection error, not a property violation.
    statement: >
      `max_test_rejects` defaults to 65536 across a whole test (confirmed on forge 1.7.1). Once
      assume has discarded that many runs, forge fails the test and reports a rejection error. The
      failure output looks like something went wrong with your contract, so the first skill is
      recognising a rejection failure on sight and reading it as "my constraint is wrong", not "my
      code is wrong".
    volatility: evolving
    edges:
      - { to: vm-assume-rejection, type: requires }
    sources: [foundry-testing-config, measured-forge-1-7-1]
    misconceptions:
      - belief: An assume that rejects a lot just makes the test slower.
        reality: Past max_test_rejects the test fails outright, reported as a rejection error.
        why: Rejection is completely invisible while the test still passes.
        source: foundry-testing-config
  - id: bound-remapping
    title: bound maps instead of rejecting
    oneLine: forge-std's bound(x, min, max) maps any input into the range, so every generated value produces a real run.
    statement: >
      `bound(x, min, max)` from forge-std's StdUtils transforms an arbitrary input into a value inside
      the range rather than rejecting it. No draws are wasted, the rejection cap is never approached,
      and every run exercises the contract. It is the tool for range constraints; assume is the tool
      for excluding a handful of specific values.
    volatility: evolving
    edges:
      - { to: stateless-fuzzing, type: requires }
      - { to: vm-assume-rejection, type: contrasts }
    sources: [forge-std-repo, foundry-cheatcode-assume]
  - id: bound-preferred-over-assume
    title: Prefer bound for ranges — this is documented, not folklore
    oneLine: The vm.assume reference itself recommends bound or modulo for range constraints and reserves assume for narrow exclusions.
    statement: >
      Foundry's own cheatcode reference recommends `bound` or modulo for constraining a value to a
      range, and reserves `vm.assume` for narrow exclusions, on the grounds that broad assume
      conditions slow tests significantly and can abort them. Material teaching
      `vm.assume(x > 0 && x < 1e18)` as the standard idiom is teaching the pattern the documentation
      discourages.
    volatility: evolving
    edges:
      - { to: bound-remapping, type: requires }
      - { to: vm-assume-rejection, type: requires }
    sources: [foundry-cheatcode-assume]
    misconceptions:
      - belief: vm.assume is the normal way to constrain a fuzzed input to a range.
        reality: The documentation recommends bound or modulo for ranges, because assume rejects and re-draws.
        why: assume reads like a precondition and is the first fuzzing cheatcode most people meet.
        source: foundry-cheatcode-assume
  - id: assume-legitimate-uses
    title: What assume is still right for
    oneLine: Excluding a handful of specific addresses — zero, the cheatcode address, the test contract — where the rejection rate is negligible.
    statement: >
      assume remains correct when the excluded set is tiny relative to the domain: address(0), the
      cheatcode address 0x7109709ECfa91a80626fF3989D68f67F5b1DD12D, the test contract itself, and
      already-deployed addresses you must not collide with. Rejecting a handful of points out of 2^160
      costs essentially nothing. The rule of thumb is that assume is fine when you can count the
      excluded values.
    volatility: stable
    edges:
      - { to: vm-assume-rejection, type: requires }
      - { to: cheatcode-address-in-fuzzing, type: requires }
      - { to: bound-preferred-over-assume, type: contrasts }
    sources: [foundry-cheatcode-assume, foundry-cheatcodes-overview]
  - id: naive-bound-bias
    title: Clamping is not bounding
    oneLine: "`if (x > max) x = max;` piles a huge share of the probability mass exactly on max and never tests the interior."
    statement: >
      Hand-rolled clamping maps every out-of-range input onto the boundary, so for a wide type most
      runs test exactly one value. `bound` distributes inputs across the range instead. Modulo is
      cheaper than bound and less biased than clamping, but still skews toward the low end when the
      range does not divide the domain evenly. All three "keep x in range"; only one of them keeps the
      distribution useful.
    volatility: stable
    edges:
      - { to: bound-remapping, type: requires }
    sources: [forge-std-repo, foundry-cheatcode-assume]
    misconceptions:
      - belief: "`if (x > max) x = max;` is equivalent to bound."
        reality: Clamping concentrates most inputs exactly on the boundary and never exercises the interior of the range.
        why: Both descriptions are "keep x in range".
        source: forge-std-repo
  - id: overconstraining-hazard
    title: Overconstraining
    oneLine: Every assume and bound narrows the search, so a heavily constrained fuzz test can pass while never reaching the region where the bug lives.
    statement: >
      Constraints are part of the specification, not scaffolding around it. A test that bounds amounts
      to `1e18` never sees the overflow at `type(uint256).max`; one that assumes a non-zero recipient
      never sees the burn path. Because the constraints are written by the same person who wrote the
      code, they tend to encode the same blind spots. Reviewing a fuzz test means reading its
      constraints at least as carefully as its assertion.
    volatility: stable
    edges:
      - { to: bound-remapping, type: requires }
      - { to: vm-assume-rejection, type: requires }
    sources: [foundry-cheatcode-assume, foundry-testing-config]
  - id: fuzz-fixtures
    title: Fixtures
    oneLine: A fixture is a named dataset; a table test runs once per entry, so known-nasty values get tried by construction rather than by luck.
    statement: >
      A fixture is a storage array or a function whose name starts with `fixture`, holding a dataset of
      values. A test whose name starts with `table` takes parameters that are resolved by name against
      the available fixtures, and is executed once per entry. That is deterministic enumeration rather
      than sampling, which is what makes it the right home for the boundary values a domain expert
      knows matter — zero, one wei, the maximum, the exact threshold in a fee table. Those get tried by
      construction instead of being left to whether the fuzzer's dictionary happens to produce them.
    volatility: evolving
    edges:
      - { to: fuzz-dictionary, type: requires }
    sources: [foundry-forge-testing, foundry-testing-config]
  - id: fuzz-seed-reproducibility
    title: Seeds trade flakiness for coverage
    oneLine: Without a pinned [fuzz] seed each run draws fresh inputs; pinning makes CI reproducible and freezes the search.
    statement: >
      Fuzzing is nondeterministic across runs unless `[fuzz] seed` is set. An unseeded suite can go
      red on unchanged code, which is the fuzzer doing its job rather than flakiness to be suppressed.
      Pinning a seed makes CI reproducible and makes gas numbers comparable, at the cost of searching
      exactly the same points every time — so a pinned seed wants a companion unseeded campaign
      somewhere.
    volatility: evolving
    edges:
      - { to: fuzz-runs-default, type: requires }
      - { to: fuzz-seed-in-ci, type: applies }
    sources: [foundry-testing-config]
    misconceptions:
      - belief: A fuzz test that passed in CI will pass again on the same commit.
        reality: Without a pinned seed each run draws fresh inputs, so a failure can legitimately appear on unchanged code.
        why: CI is expected to be deterministic.
        source: foundry-testing-config
  - id: failure-persistence
    title: Failures are persisted and replayed
    oneLine: Failing inputs are written to cache/fuzz and replayed on later runs, so a fixed bug stays regression-tested.
    statement: >
      When a fuzz test fails, the failing input is persisted — `failure_persist_dir` defaults to
      `cache/fuzz` on forge 1.7.1 — and replayed ahead of fresh random draws on subsequent runs. A
      "flaky" failure is therefore reproducible locally without copying anything by hand, and a fix is
      automatically re-checked against the exact input that broke it. Deleting the cache directory
      discards that regression coverage.
    volatility: evolving
    edges:
      - { to: fuzz-seed-reproducibility, type: requires }
    sources: [foundry-testing-config, measured-forge-1-7-1]
  - id: counterexample-reading
    title: Working a counterexample
    oneLine: A failure prints the concrete arguments that broke the property; the workflow is to promote them into a named unit test, then fix.
    statement: >
      A failing fuzz run reports the concrete arguments alongside the assertion that broke. The
      productive loop is: copy those arguments into a plain `test_` case so the failure is
      deterministic and readable, confirm it fails, fix the contract, then confirm both the named test
      and the fuzz campaign pass. The named test is what a reviewer a year later will actually
      understand.
    volatility: evolving
    edges:
      - { to: stateless-fuzzing, type: requires }
      - { to: failure-persistence, type: recommends }
    sources: [foundry-fuzz-corpus-guide, foundry-forge-testing, foundry-testing-config]
  - id: inline-fuzz-config
    title: Inline config comments are profile-scoped
    oneLine: "`/// forge-config: default.fuzz.runs = 10000` above a function applies to the default profile only — and does nothing under FOUNDRY_PROFILE=ci."
    statement: >
      Per-test overrides are written as a `/// forge-config: <profile>.fuzz.<key> = <value>` comment
      above the function, with keys including runs, max-test-rejects and show-logs; everything not
      overridden is inherited from the profile. The trap is the profile qualifier: a comment naming
      `default` is silently inert when CI runs with FOUNDRY_PROFILE=ci, so the expensive test you
      thought you had pinned at ten thousand runs quietly runs at the ci profile's value.
    volatility: evolving
    edges:
      - { to: foundry-profiles, type: requires }
      - { to: fuzz-runs-default, type: requires }
    sources: [foundry-inline-test-config]
    misconceptions:
      - belief: "A `/// forge-config: default.fuzz.runs = 10000` comment raises runs everywhere."
        reality: It applies to the default profile only; a run under another profile ignores it.
        why: The word "default" reads as "always" rather than as a profile name.
        source: foundry-inline-test-config
