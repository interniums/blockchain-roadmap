moduleId: toolchain-gas-profiling
concepts:
  - id: gas-report
    title: The gas report
    oneLine: forge test --gas-report prints per contract a deployment cost and size row plus min / avg / median / max / call-count per function.
    statement: >
      `forge test --gas-report` aggregates every call made during the test run into a table: one row
      per contract giving deployment cost and deployed size, then one row per function giving the
      minimum, average, median and maximum gas observed and how many calls contributed. It measures
      the calls the suite happened to make, from inside the test harness, which is the source of every
      caveat in this module.
    volatility: evolving
    edges:
      - { to: forge-role, type: requires }
      - { to: gas-is-a-countdown, type: requires }
    sources: [foundry-gas-tracking]
  - id: gas-report-is-test-shaped
    title: The report describes your test suite
    oneLine: Those numbers are the distribution of calls your tests make, not the distribution real users will make.
    statement: >
      Every statistic in the gas report is computed over the calls your suite executed. Adding one
      test that exercises a cheap path moves the average; deleting a test that exercised an expensive
      one moves it back. Nothing about the numbers is a property of the contract alone. Median and the
      min/max spread carry more information than the average, because they at least tell you the shape
      of the distribution you sampled.
    volatility: stable
    edges:
      - { to: gas-report, type: requires }
    sources: [foundry-gas-tracking]
    misconceptions:
      - belief: The avg column in the gas report is what users will pay.
        reality: It is the mean over the calls your own tests made, which you control entirely.
        why: Test suites over-sample cheap paths and warm state, and the column is simply labelled "avg".
        source: foundry-gas-tracking
  - id: gas-report-filtering
    title: Reporting only on what you ship
    oneLine: gas_reports and gas_reports_ignore in foundry.toml keep the table to the contracts that actually get deployed.
    statement: >
      By default the report covers everything compiled, including test contracts, mocks and scripts,
      which buries the rows you care about. `gas_reports = ["Token"]` restricts it to named contracts
      and `gas_reports_ignore = ["Test", "Script"]` removes the noise. On forge 1.7.1 the defaults are
      `gas_reports = ["*"]` with an empty ignore list, so this is opt-in.
    volatility: evolving
    edges:
      - { to: gas-report, type: requires }
      - { to: foundry-toml, type: requires }
    sources: [foundry-gas-tracking, measured-forge-1-7-1]
  - id: gas-snapshot-file
    title: The gas snapshot file
    oneLine: forge snapshot writes one line per test to .gas-snapshot, a committed text file that turns gas into a reviewable diff.
    statement: >
      `forge snapshot` records the gas used by each test into `.gas-snapshot`, one line per test. The
      file is committed, so a change in gas shows up in a pull request as a diff a reviewer can read
      alongside the code change that caused it. It is the cheapest possible gas-regression mechanism:
      no service, no bot, just a text file under version control.
    volatility: evolving
    edges:
      - { to: gas-report, type: requires }
    sources: [foundry-gas-tracking, forge-snapshot-reference]
  - id: snapshot-diff-vs-check
    title: diff versus check
    oneLine: --diff prints the delta and exits 0; --check exits non-zero on a mismatch, which is the CI-gating form.
    statement: >
      `forge snapshot --diff` compares against the committed snapshot, prints the per-test deltas and
      exits successfully — informational. `forge snapshot --check` prints the same delta and exits
      non-zero when the numbers do not match, which is what makes it usable as a required CI check.
      forge 1.7.1 also accepts `--tolerance`, so a gate can allow small movements instead of failing
      on every one-gas change.
    volatility: evolving
    edges:
      - { to: gas-snapshot-file, type: requires }
      - { to: snapshot-check-gate, type: applies }
    sources: [forge-snapshot-reference, measured-forge-1-7-1]
  - id: fuzz-seed-determinism
    title: Fuzz tests make gas snapshots noisy
    oneLine: Fuzzed tests move gas run to run, so a snapshot without a pinned seed diffs against itself.
    statement: >
      A fuzz test's gas figures depend on which inputs were drawn, so an unseeded fuzz test produces a
      different snapshot line on every run and every diff is noise. The two workable answers are to
      pin `--fuzz-seed` for the snapshot run, or to keep a small dedicated non-fuzz gas suite that the
      snapshot covers and let the fuzz campaign live outside it.
    volatility: evolving
    edges:
      - { to: gas-snapshot-file, type: requires }
      - { to: fuzz-seed-reproducibility, type: requires }
    sources: [foundry-testing-config, forge-snapshot-reference, foundry-toolchain-action, rubilmax-gas-diff]
  - id: snapshot-cheatcodes
    title: Named snapshots inside a test
    oneLine: vm.startSnapshotGas("name") and vm.stopSnapshotGas() measure a region of one test, excluding the harness around it.
    statement: >
      The snapshot cheatcodes bracket a region inside a test and record the gas used between them
      under a name, so setup, assertions and other harness work are excluded from the figure. Since
      Foundry 1.0 two snapshot mechanisms coexist — the whole-test `forge snapshot` file and these
      named regions — and a repository usually uses one or the other. Say which one you are reading
      before comparing numbers with anybody.
    volatility: evolving
    edges:
      - { to: gas-snapshot-file, type: requires }
      - { to: cheatcode-families, type: requires }
    sources: [foundry-gas-tracking]
  - id: gas-metering-control
    title: Pausing the meter
    oneLine: vm.pauseGasMetering, vm.resumeGasMetering and vm.resetGasMetering exclude setup from a measurement; gasleft() deltas do it by hand.
    statement: >
      When the thing you want to measure is preceded by expensive preparation inside the same test,
      the metering cheatcodes let you pause the meter across the preparation and resume it for the
      operation. The manual equivalent is reading `gasleft()` before and after and subtracting, which
      gives you full control and requires you to account for the harness's own overhead — on the
      authoring machine, two `GAS` opcodes plus the surrounding stack work cost about sixteen to
      seventeen gas.
    volatility: evolving
    edges:
      - { to: snapshot-cheatcodes, type: requires }
    sources: [foundry-gas-tracking, measured-forge-1-7-1]
  - id: gas-probe-dead-code-elimination
    title: A gas probe that measures nothing
    oneLine: A read whose result is unused is eliminated as dead code even with the optimizer off — so every read must be assigned into a sink.
    statement: >
      The classic hand-rolled probe wraps an operation in `gasleft()` deltas. For a read this silently
      fails: `pop(sload(0))` has no observable effect and is removed before it ever executes, even
      with the optimizer disabled, so every read measures the same tiny constant. On the authoring
      machine every read measured nine gas until each result was assigned into a storage sink that the
      compiler could not prove unnecessary. Any gas probe of a read must consume its result; if your
      measurements are suspiciously uniform, this is why.
    volatility: evolving
    edges:
      - { to: gas-metering-control, type: requires }
    claimKind: empirical
    sources: [measured-forge-1-7-1]
    misconceptions:
      - belief: With the optimizer turned off, the compiler emits exactly what you wrote, so a gasleft probe measures the operation.
        reality: Code with no observable effect is still eliminated with the optimizer off; a read whose value is discarded may never execute.
        why: '"Optimizer off" is read as "no transformations at all".'
        source: measured-forge-1-7-1
  - id: isolate-mode
    title: Isolation mode
    oneLine: --isolate runs each top-level external call as its own transaction, restoring realistic cold/warm accounting at the cost of modelling one multi-call transaction.
    statement: >
      With isolation on, every top-level external call the test makes executes in its own transaction
      context, so access lists reset and cold-versus-warm accounting resembles what a user's separate
      transactions would pay. The trade is real: a test that legitimately models several calls inside
      one transaction — where warmth persisting is the point — now measures something else. On
      forge 1.7.1 the resolved default is `isolate = false`.
    volatility: hot
    edges:
      - { to: cold-vs-warm-access, type: requires }
      - { to: gas-report, type: requires }
      - { to: call-isolation-default, type: deepens }
    sources: [foundry-forge-testing, measured-forge-1-7-1]
    misconceptions:
      - belief: Isolation makes tests more realistic, so it should always be on.
        reality: It also breaks tests that legitimately depend on warmth persisting across calls within a single transaction.
        why: '"More realistic" is heard as strictly better rather than as a different model.'
        source: foundry-forge-testing
  - id: test-warmth-bias
    title: Foundry gas numbers under-report
    oneLine: Setup warms accounts and slots and the report measures the call, not the transaction — so your numbers are systematically below mainnet.
    statement: >
      Two effects push measured gas below what a user pays. Setup code touches accounts and storage
      slots, and whether that warmth carries into the measured call depends on call isolation —
      Foundry documents `--no-isolate` / `isolate = false` for tests that need warmth to persist
      across repeated calls in one context — while there is no cheatcode to force a slot cold again.
      And the report measures the call, not the transaction, so the intrinsic cost and the calldata
      cost of getting that call on chain, which EIP-7623 prices, sit outside the figure entirely. The
      bias is one-directional: real cost is higher, never lower.
    volatility: evolving
    edges:
      - { to: isolate-mode, type: requires }
      - { to: cold-vs-warm-access, type: requires }
      - { to: intrinsic-gas, type: requires }
    sources: [foundry-forge-testing, eip-7623, foundry-issue-5494, forge-gas-metering]
    misconceptions:
      - belief: Foundry gas numbers match what the transaction will cost on mainnet.
        reality: They under-report, because setup leaves state warm and the intrinsic and calldata costs sit outside the measured call.
        why: The number is precise, and precision reads as accuracy.
        source: foundry-issue-5494
  - id: storage-dominates
    title: Storage dominates everything
    oneLine: How many distinct slots you touch dwarfs every opcode-level trick — measured cold SLOAD 2100 versus warm 100, SSTORE 20000 versus 2900.
    statement: >
      Measured on forge 1.7.1 with solc 0.8.36, optimizer off: a cold SLOAD costs 2100 and a warm one
      100; SSTORE from zero to non-zero costs 20000 and non-zero to non-zero 2900, each plus 2100 when
      the slot is cold; a warm no-op SSTORE costs 100; TSTORE and TLOAD are 100 each; cold account
      access via BALANCE or EXTCODESIZE is 2600, warm 100; and each LOG topic adds 375. Against those
      magnitudes, the number of distinct slots a function touches determines its cost and almost
      nothing else does.
    volatility: evolving
    edges:
      - { to: cold-vs-warm-access, type: requires }
      - { to: storage-slot, type: requires }
      - { to: transient-storage, type: recommends }
    sources: [measured-forge-1-7-1, foundry-gas-optimization-guide]
    misconceptions:
      - belief: Swapping a storage reentrancy guard for a transient one saves about seven thousand gas.
        reality: Measured on forge 1.7.1 the storage guard's overhead was 3104 gas with a warm lock slot against 284 for the transient guard; the ~7100 figure assumes a cold slot, which is true only on the first guarded call in a transaction. Teach the range, roughly 3100 to 7100, and the reason for it.
        why: A single headline number circulated widely without the cold/warm qualifier attached.
        source: measured-forge-1-7-1
  - id: refund-cap
    title: The refund cap
    oneLine: Clearing storage refunds gas, but EIP-3529 caps the total refund at one fifth of the transaction's gas used.
    statement: >
      Setting a non-zero storage slot back to zero earns a refund, but EIP-3529 capped the total
      refund at one fifth of the gas the transaction used and reduced the per-slot refund amount. That
      change killed the gas-token business, and it bounds any design whose economics depend on
      reclaiming cost by clearing state: you cannot refund your way below eighty percent of what you
      spent.
    volatility: stable
    edges:
      - { to: storage-dominates, type: requires }
    sources: [eip-3529]
  - id: calldata-cost-model
    title: Calldata is not flat any more
    oneLine: Four gas per zero byte and sixteen per non-zero byte, plus a floor price introduced by EIP-7623 for data-heavy, computation-light transactions.
    statement: >
      The classic model prices calldata at 4 gas per zero byte and 16 per non-zero byte. EIP-7623,
      shipped in Pectra, added a floor: a transaction that is mostly data and does little computation
      pays a minimum derived from its data, so the old model under-prices exactly the transactions
      rollups and data-posting contracts send. Read the current constants from the EIP rather than
      from any lesson, including this one; the shape of the model is what matters here.
    volatility: evolving
    edges:
      - { to: intrinsic-gas, type: requires }
      - { to: storage-dominates, type: contrasts }
    sources: [eip-7623]
  - id: l2-cost-inversion
    title: On a rollup the cost model inverts
    oneLine: Publishing data to L1 dominates execution, so shrinking calldata beats saving opcodes by orders of magnitude.
    statement: >
      A rollup's fee is mostly the cost of making its data available on L1, not the cost of executing
      the transaction. That inverts the optimisation ranking: a change that adds execution steps but
      shrinks the calldata footprint is a large win on an L2 and a small loss on L1. Optimising a
      contract without knowing which chain it runs on is therefore not a well-defined task.
    volatility: evolving
    edges:
      - { to: calldata-cost-model, type: requires }
      - { to: rollup, type: requires }
    sources: [eip-7623]
    misconceptions:
      - belief: Gas optimisation is the same job on L1 and on an L2.
        reality: On a rollup, data availability usually dominates execution, so calldata size is the thing to optimise.
        why: Both charge "gas", and the unit hides two very different cost structures.
        source: eip-7623
  - id: gas-folklore
    title: Gas folklore, measured
    oneLine: Most repeated tips are worth single-digit gas, already done by the optimizer, or net-negative.
    statement: >
      The standard checklist — use `uint8` for small numbers, prefer `++i` to `i++`, cache
      `array.length` — is mostly noise. The EVM word is 256 bits, so narrow types add masking
      instructions unless they enable slot packing; the IR pipeline already eliminates the increment
      temporary; the optimizer already hoists the length read. These items cost review time on every
      pull request forever in exchange for savings that do not survive measurement. The honest
      response to a tip is to measure it on your contract and publish the number.
    volatility: evolving
    edges:
      - { to: storage-dominates, type: contrasts }
    sources: [foundry-gas-optimization-guide]
    misconceptions:
      - belief: uint8 costs less than uint256.
        reality: The EVM word is 256 bits; narrow types add masking unless they let several values share one slot. The saving comes from packing, not from the type.
        why: Smaller type, smaller number, smaller cost is an intuition imported from other languages.
        source: foundry-gas-optimization-guide
  - id: optimizer-runs-tradeoff
    title: optimizer_runs trades deployment against runtime
    oneLine: A low value shrinks bytecode and deployment cost; a high value inlines more and makes calls cheaper at the cost of size.
    statement: >
      `optimizer_runs` tells the compiler how often you expect each function to be called over the
      contract's lifetime. Low values favour small bytecode and cheap deployment; high values favour
      inlining and cheap execution at the cost of size, which matters against the deployed-code size
      limit. On forge 1.7.1 the optimizer is off by default with `optimizer_runs = 200`, so any gas
      number you measure without turning it on is not the number your production build will produce.
    volatility: evolving
    edges:
      - { to: gas-report, type: requires }
      - { to: solc-pinning, type: requires }
    sources: [foundry-solc-config, measured-forge-1-7-1]
