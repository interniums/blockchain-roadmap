moduleId: toolchain-hardhat-literacy
concepts:
  - id: two-toolchain-world
    title: Two toolchains, one Solidity
    oneLine: Foundry is Solidity-native and CLI-first; Hardhat is a TypeScript program that orchestrates compilation, testing and deployment.
    statement: >
      The EVM ecosystem has two mainstream toolchains. Foundry is a set of Rust binaries driven from
      the command line, where tests are Solidity and configuration is declarative TOML. Hardhat is a
      Node program: the project is defined by TypeScript, and the toolchain is extended by writing
      code. Most repositories contain one of them; a meaningful number contain both, deliberately.
    volatility: evolving
    edges:
      - { to: forge-script, type: contrasts }
      - { to: foundry-toolchain, type: contrasts }
    sources: [hardhat-home]
  - id: hardhat-config-is-code
    title: The config is a program
    oneLine: hardhat.config.ts is a TypeScript module, not a declarative file, so behaviour can depend on arbitrary code.
    statement: >
      A Hardhat project is defined by `hardhat.config.ts`, which is executed. It can read the
      environment, branch, compute values and import other modules, so answering "what will this
      project do" may require reading a program rather than a table of keys. That is the source of
      both Hardhat's flexibility and the difficulty of auditing an unfamiliar Hardhat repository.
    volatility: evolving
    edges:
      - { to: two-toolchain-world, type: requires }
      - { to: foundry-toml, type: contrasts }
    sources: [hardhat-migrate-from-2]
  - id: hardhat3-edr
    title: EDR, the Rust simulation layer
    oneLine: Hardhat's EVM simulation is EDR, a Rust rewrite of Hardhat Network first shipped in Hardhat 2.21.
    statement: >
      The part of Hardhat that executes EVM code is EDR, a Rust component that replaced the original
      JavaScript Hardhat Network and first shipped in Hardhat 2.21. The JavaScript that remains is
      orchestration. "Hardhat is slow because it is JavaScript" describes a version of the tool that
      no longer exists — though published speed comparisons between the toolchains disagree with each
      other and none of the ones surveyed showed their methodology, so treat any multiplier you read
      as unverified.
    volatility: evolving
    edges:
      - { to: hardhat3-solidity-tests, type: requires }
    sources: [nomic-rust-hardhat, hardhat-home]
    misconceptions:
      - belief: Hardhat is slow because it is written in JavaScript.
        reality: The simulation layer is Rust; the JavaScript is orchestration around it.
        why: The bottleneck was real before EDR, and the reputation outlived it.
        source: nomic-rust-hardhat
  - id: hardhat3-esm-only
    title: ESM only
    oneLine: Hardhat 3 dropped CommonJS config loading — type module, export default, import — and this alone blocks many Hardhat 2 projects.
    statement: >
      Hardhat 3 loads configuration as an ES module: `"type": "module"` in package.json,
      `export default`, and `import` rather than `require`. Since a project's scripts and helpers
      usually share that module system, converting the config tends to pull the rest of the project
      with it. In practice this is the single most disruptive change in the release and the reason
      many Hardhat 2 projects have not moved.
    volatility: evolving
    edges:
      - { to: hardhat-config-is-code, type: requires }
    sources: [hardhat-migrate-from-2, gembait-hardhat-esm]
  - id: hardhat3-explicit-plugins
    title: Plugins are registered, not imported for effect
    oneLine: Hardhat 3 requires plugins and tasks to be declared in the config rather than installing themselves via import side effects.
    statement: >
      In Hardhat 2 importing a plugin registered it through side effects, so what a project actually
      did was distributed across import statements. Hardhat 3 requires explicit registration in the
      config, which means the set of active plugins and tasks is readable from one file. For someone
      inheriting a repository this is the change that most improves comprehensibility.
    volatility: evolving
    edges:
      - { to: hardhat-config-is-code, type: requires }
    sources: [hardhat-migrate-from-2]
  - id: hardhat3-hooks
    title: Hooks replaced monkey-patching
    oneLine: extendConfig and subtask overriding are gone; extension points are declared through a hooks system.
    statement: >
      Hardhat 2 extended behaviour by patching: `extendConfig` and overriding subtasks. Hardhat 3
      replaces that with a hooks system, so extension points are declared rather than intercepted.
      The practical consequence is that a Hardhat 2 plugin is not merely recompiled for Hardhat 3 —
      the extension mechanism it was written against no longer exists, which is why the ecosystem
      port took time.
    volatility: evolving
    edges:
      - { to: hardhat3-explicit-plugins, type: requires }
    sources: [hardhat-migrate-from-2, oz-migrate-from-hardhat2]
  - id: hardhat3-network-connections
    title: There is no global network any more
    oneLine: hre.network is gone as a singleton; you call await hre.network.create() and can hold several concurrent connections in one process.
    statement: >
      Hardhat 2 exposed one ambient network on the runtime environment. Hardhat 3 makes connections
      explicit objects created on demand, so a single process can hold several at once. Any script or
      test written against the old singleton needs rewriting, and any tutorial that says
      "hre.network is the network" describes the previous major version.
    volatility: evolving
    edges:
      - { to: hardhat3-explicit-plugins, type: requires }
    sources: [hardhat-migrate-from-2]
  - id: hardhat2-eol
    title: Hardhat 2 is a decaying option
    oneLine: Hardhat 2 has an announced end-of-life policy, driven by the Node ecosystem moving off CommonJS.
    statement: >
      Nomic Foundation has announced an end-of-life policy for Hardhat 2, motivated by the wider Node
      ecosystem moving past CommonJS. The exact end date was not established in this research, so do
      not quote one. What is safe to conclude is directional: staying on Hardhat 2 is a deferral with
      an expiry, not a stable choice, and Hardhat 2 tutorials should be read as historical.
    volatility: hot
    edges:
      - { to: hardhat3-esm-only, type: requires }
    sources: [hardhat-migrate-from-2, hardhat-beta-status]
  - id: hardhat3-solidity-tests
    title: Solidity tests are first-class in Hardhat 3
    oneLine: Hardhat 3 runs Solidity tests alongside TypeScript tests in one project and one command.
    statement: >
      Hardhat 3 treats Solidity tests as first-class and expects mixed suites: Solidity tests for
      contract-level behaviour, TypeScript tests for anything that has to drive application code. The
      old framing — Hardhat means JavaScript tests, Foundry means Solidity tests — no longer describes
      either tool, and choosing a toolchain on that basis is choosing on an obsolete axis.
    volatility: evolving
    edges:
      - { to: two-toolchain-world, type: requires }
      - { to: tests-in-solidity, type: contrasts }
    sources: [hardhat-home, hardhat-migrate-mocha]
    misconceptions:
      - belief: Choosing Hardhat means writing your tests in TypeScript.
        reality: Hardhat 3 runs Solidity tests as first-class citizens and expects mixed suites.
        why: It was true of Hardhat 2, which is what most existing material describes.
        source: hardhat-home
  - id: hardhat3-multichain
    title: What Hardhat means by multichain
    oneLine: Holding several live network connections in one process, with chain-aware simulation such as OP Stack — not forking several chains.
    statement: >
      Hardhat 3's multichain support means concurrent network connections in a single process plus
      simulation that is aware of chain-specific behaviour, notably OP Stack chains. That is a
      different thing from Foundry's multi-fork testing, which switches one active fork at a time over
      real historical state. The configuration key names for chain-type selection were not confirmed
      in this research; read them from the current documentation rather than from a lesson.
    volatility: hot
    edges:
      - { to: hardhat3-network-connections, type: requires }
      - { to: multi-fork-testing, type: contrasts }
    sources: [hardhat-home, hardhat-migrate-from-2]
  - id: hardhat3-build-profiles
    title: Build profiles
    oneLine: Named build profiles let one project compile differently for development and production instead of branching inside the config.
    statement: >
      Hardhat 3 offers named build profiles so a project can compile one way for the development loop
      and another for production, rather than branching on an environment variable inside the config
      program. They are declared under `solidity.profiles` in the config, and each profile accepts the
      full Solidity compiler configuration. The idea maps directly onto Foundry's profiles.
    volatility: hot
    edges:
      - { to: hardhat-config-is-code, type: requires }
      - { to: foundry-profiles, type: contrasts }
    sources: [hardhat-build-profiles, hardhat-330-release]
  - id: hardhat-ignition
    title: Ignition
    oneLine: Hardhat's declarative deployment system — describe the desired deployment as modules and it handles ordering, resumption and reconciliation.
    statement: >
      Ignition is Hardhat 3's deployment story, replacing imperative deploy scripts. You describe the
      deployment as modules of desired state with declared dependencies, and Ignition works out the
      order, resumes an interrupted run, and reconciles the description against what is already
      deployed. `forge script` is the opposite model: an imperative program whose recovery mechanism
      is the broadcast artifacts it wrote on the way. Different execution models, different failure
      modes.
    volatility: evolving
    edges:
      - { to: two-toolchain-world, type: requires }
      - { to: forge-script, type: contrasts }
      - { to: broadcast-artifacts, type: contrasts }
    sources: [hardhat-home]
    misconceptions:
      - belief: Ignition is forge script with different syntax.
        reality: forge script is imperative and recovers through broadcast artifacts; Ignition is declarative and reconciles a desired-state module against what is already deployed.
        why: Both are "the deployment thing" in their respective toolchains.
        source: hardhat-home
  - id: directory-translation
    title: Translating the layout
    oneLine: contracts/ is src/, artifacts/ plus cache/ are out/, test/*.ts is test/*.t.sol, ignition/modules/ is script/, node_modules is lib/.
    statement: >
      Reading a Hardhat repository as a Foundry user is mostly a mapping exercise. Sources live in
      contracts/ rather than src/; compiled output in artifacts/ and cache/ rather than out/; tests are
      TypeScript files under test/ alongside or instead of Solidity ones; deployments live in
      ignition/modules/ rather than script/; and dependencies are npm packages in node_modules rather
      than git submodules in lib/. Once the mapping is internalised most Hardhat repositories become
      legible in minutes.
    volatility: stable
    edges:
      - { to: two-toolchain-world, type: requires }
      - { to: foundry-project-layout, type: contrasts }
    sources: [hardhat-home, hardhat-migrate-from-2]
  - id: remapping-vs-node-resolution
    title: Two resolvers, one import string
    oneLine: Foundry resolves imports through remappings; Hardhat resolves them through Node module resolution — the same string can mean different files.
    statement: >
      Foundry rewrites an import prefix through the merged remapping set and then hits the filesystem.
      Hardhat hands the import string to Node's module resolution over node_modules. The same
      `import "@openzeppelin/contracts/token/ERC20/ERC20.sol"` can therefore resolve to two different
      files, at two different versions, in a repository that contains both toolchains — which is the
      subtle failure mode of coexistence and the first thing to check when the two disagree.
    volatility: stable
    edges:
      - { to: directory-translation, type: requires }
      - { to: remappings, type: contrasts }
    sources: [hardhat-migrate-from-2, foundry-solc-config]
    misconceptions:
      - belief: A Foundry test will just work in a Hardhat repository because the sources are the same Solidity.
        reality: Import resolution differs — remappings versus Node resolution — so the same import string can resolve to a different file or a different version.
        why: The Solidity source is genuinely identical; only the resolver differs.
        source: hardhat-migrate-from-2
  - id: ts-coupling-justification
    title: When Hardhat earns its place
    oneLine: When the contract system is inseparable from TypeScript — shared types with an app, tests that drive both, an existing TS monorepo, or a plugin that only exists for Hardhat.
    statement: >
      Hardhat is justified by coupling, not by preference. The concrete conditions are: types shared
      between contracts and a frontend or backend, integration tests that must drive application code
      and contracts together, an existing TypeScript monorepo whose tooling the project must live
      inside, or a required plugin with no Foundry equivalent. Any of those makes the second
      dependency tree worth its cost. "The team knows JavaScript" does not, since Hardhat 3 runs
      Solidity tests anyway.
    volatility: evolving
    edges:
      - { to: two-toolchain-world, type: requires }
    sources: [hardhat-home, oz-migrate-from-hardhat2]
  - id: foundry-default-otherwise
    title: Foundry is the default absent that coupling
    oneLine: Without a TypeScript coupling reason, Solidity-native tests, fuzzing and invariants are the faster loop and the smaller surface.
    statement: >
      Absent one of the coupling conditions, Foundry is the default: the test loop is faster, fuzzing
      and invariant testing are in the box, cheatcodes reach EVM-level state directly, and there is
      one dependency tree and one mental model to maintain. Adding a toolchain has an ongoing cost
      paid by everyone who joins the project, so it should be a decision with a stated reason.
    volatility: evolving
    edges:
      - { to: ts-coupling-justification, type: contrasts }
    sources: [hardhat-home]
  - id: coexistence-pattern
    title: Running both, on purpose
    oneLine: Foundry for unit, fuzz and invariant testing; Hardhat for TypeScript integration tests, deployment plugins and ecosystem tooling.
    statement: >
      Many production repositories run both toolchains over the same src/ directory, and this is a
      supported arrangement rather than a mess. The division that works is by strength: Foundry for
      contract-level unit, fuzz and invariant testing, Hardhat for TypeScript integration tests and
      for plugins that only exist there. The cost to watch is import resolution, since the two
      resolvers can disagree about which file an import names.
    volatility: evolving
    edges:
      - { to: two-toolchain-world, type: requires }
      - { to: remapping-vs-node-resolution, type: requires }
    sources: [hardhat-home]
    misconceptions:
      - belief: You have to pick one toolchain.
        reality: Running Foundry for fuzz and invariant work alongside Hardhat for TypeScript integration and deployment plugins is a common, supported setup.
        why: Toolchain choice is usually framed as a tribal identity rather than as a division of labour.
        source: hardhat-home
