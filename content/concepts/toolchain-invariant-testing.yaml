moduleId: toolchain-invariant-testing
concepts:
  - id: unit-vs-fuzz-vs-invariant
    title: The three engines and what each can reach
    oneLine: Unit tests check known paths, fuzz tests check input ranges, invariant tests check properties across all call sequences.
    statement: >
      The three testing engines cover three different shapes of state space. A unit test checks one
      point: one input, one path. A stateless fuzz test checks a line: one call, many inputs, always
      from the same starting state. An invariant test checks a region: many calls in many orders,
      accumulating state, with a property re-checked after each step. Bugs are found by the engine
      whose shape matches them, which is why a suite of only unit tests can be large and still miss
      an entire class.
    volatility: stable
    edges:
      - { to: stateless-fuzzing, type: requires }
    sources: [foundry-invariant-testing, rareskills-invariant-testing]
    misconceptions:
      - belief: Invariant testing is just fuzzing with more runs.
        reality: Fuzzing randomises the arguments of one call; invariant testing randomises the sequence of calls, which is where state-dependent bugs live.
        why: Both are described as "fuzzing" and both are configured with a runs number.
        source: rareskills-invariant-testing
  - id: stateful-fuzzing
    title: Stateful fuzzing
    oneLine: State persists across calls within a run, so the fuzzer builds interaction sequences instead of testing one call in isolation.
    statement: >
      In a stateful campaign the contract's state carries over from call to call within a run, so the
      fuzzer is constructing transaction sequences: deposit, then transfer, then withdraw, then
      deposit again, with randomised arguments at each step. Each run starts fresh from post-setUp
      state and then walks; the walk is what distinguishes it from stateless fuzzing and what lets it
      reach accounting states no single call could produce.
    volatility: stable
    edges:
      - { to: unit-vs-fuzz-vs-invariant, type: requires }
      - { to: stateless-fuzzing, type: contrasts }
    sources: [foundry-invariant-testing]
  - id: invariant
    title: An invariant
    oneLine: A property that must hold after any sequence of valid operations, re-checked after every call in the campaign.
    statement: >
      An invariant is a predicate over contract state that must be true after every valid operation,
      no matter what came before. forge re-evaluates each `invariant*` function after each call in a
      sequence, so a violation is reported with the exact call sequence that produced it. Writing one
      forces you to say what the system guarantees rather than what a particular function does — which
      is usually the first time anyone on the team has written that down.
    volatility: stable
    edges:
      - { to: stateful-fuzzing, type: requires }
      - { to: invariant-testing, type: deepens }
    sources: [foundry-invariant-testing]
    misconceptions:
      - belief: A passing invariant campaign proves the property holds.
        reality: It failed to find a counterexample within runs times depth; that is evidence at a budget, not proof. Formal verification proves.
        why: The pass line looks identical to a unit test's pass line.
        source: foundry-invariant-testing
  - id: solvency-invariant
    title: The solvency invariant
    oneLine: Assets held are at least liabilities owed — the first invariant to write for any pool, vault or lending market.
    statement: >
      `assets >= liabilities`, or equivalently "total claimable never exceeds total held", is the
      highest-value first invariant for any contract that custodies value. It maps directly onto what
      an attacker wants: every drain, inflation and rounding exploit ends with claims exceeding
      holdings. It is also cheap to state, because both sides are usually already tracked, and it
      catches errors of accounting arithmetic that no unit test of an individual function will.
    volatility: stable
    edges:
      - { to: invariant, type: requires }
    sources: [foundry-invariant-testing, patrick-fuzz-bare-minimum]
  - id: handler-pattern
    title: The handler
    oneLine: A thin wrapper that bounds inputs and only makes calls that can plausibly succeed, so the campaign explores reachable states.
    statement: >
      Pointed straight at a contract, a campaign spends most of its budget on calls that revert on
      unmet preconditions — withdrawing from an empty balance, transferring to address zero — and
      therefore explores almost nothing. A handler is a test-only contract that wraps the target,
      bounds each argument into a plausible range, selects among actors, and skips calls that cannot
      succeed. The fuzzer targets the handler; the handler is where all the engineering is.
    volatility: evolving
    edges:
      - { to: stateful-fuzzing, type: requires }
      - { to: bound-remapping, type: requires }
    sources: [foundry-invariant-testing, cyfrin-fuzz-guide]
    misconceptions:
      - belief: You can just point the fuzzer at the contract and let it work.
        reality: Without a handler most generated calls revert on unmet preconditions and the campaign explores a tiny slice of the state space.
        why: The setup looks complete once the target is declared, and the run still reports as passing.
        source: foundry-invariant-testing
  - id: ghost-variable
    title: Ghost variables
    oneLine: A tally kept by the handler of what the contract should hold, so the invariant compares against an independent model.
    statement: >
      A ghost variable is test-only state the handler maintains alongside the real contract — total
      ever deposited, total ever withdrawn, a per-actor sum — recording what the contract ought to
      hold. The invariant then compares contract state against that independently-computed model
      rather than against the contract's own accounting, which is the only way to catch a bug where
      the contract's internal bookkeeping is itself wrong.
    volatility: evolving
    edges:
      - { to: handler-pattern, type: requires }
      - { to: solvency-invariant, type: applies }
    sources: [foundry-invariant-testing, rareskills-invariant-testing]
  - id: runs-and-depth
    title: runs and depth
    oneLine: runs is how many sequences are generated, depth is how many calls per sequence — on forge 1.7.1 the defaults are 256 and 500.
    statement: >
      A campaign has two budget dimensions. `runs` is the number of independent sequences generated;
      `depth` is the number of calls within each sequence. `forge config` on forge 1.7.1 reports
      `[invariant] runs = 256, depth = 500`. Depth is what reaches deep states, runs is what varies
      the path taken to get there, and a bug that needs a fifty-call setup is invisible at depth ten
      no matter how many runs you buy. Published CI values vary widely between sources and are
      conventions rather than evidence-backed recommendations.
    volatility: evolving
    edges:
      - { to: stateful-fuzzing, type: requires }
    sources: [foundry-testing-config, measured-forge-1-7-1]
  - id: revert-metrics
    title: Revert metrics
    oneLine: show_metrics reports which handler functions revert or get discarded; a high revert rate means the campaign tested almost nothing.
    statement: >
      Turning on the campaign's metrics reports, per handler function, how many calls succeeded,
      reverted or were discarded. This is the only honest measure of whether a campaign did any work:
      a run that reports a ninety percent revert rate passed because it barely executed the contract,
      not because the property holds. Checking metrics before believing a green invariant result is
      the habit that separates a real campaign from a decorative one.
    volatility: evolving
    edges:
      - { to: handler-pattern, type: requires }
    sources: [foundry-invariant-testing, threesigma-invariant]
    misconceptions:
      - belief: A high run count means a thorough campaign.
        reality: Runs count sequences attempted, not states reached; with a high revert rate most of those sequences did nothing.
        why: The runs number is printed and the revert rate is not, unless you ask for it.
        source: foundry-invariant-testing
