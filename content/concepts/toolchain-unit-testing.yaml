moduleId: toolchain-unit-testing
concepts:
  - id: test-discovery-by-prefix
    title: Discovery by function-name prefix
    oneLine: forge decides what to run from the function name, not from an annotation — and the prefix chooses the engine.
    statement: >
      forge discovers tests by function-name prefix. `test` / `test_` are unit tests, `testFuzz` marks
      a fuzzed test, `invariant*` and `statefulFuzz*` are stateful campaigns, `table*` are
      data-driven cases, and `check*` / `prove*` run only under `--symbolic`. The prefix selects which
      engine executes the function, so renaming a function changes how it is run. `testFail*` is gone
      from the documented set: the modern idiom is `test_RevertWhen_<Condition>` with an explicit
      expectRevert, because testFail hid which revert happened.
    volatility: evolving
    edges:
      - { to: tests-in-solidity, type: requires }
    sources: [foundry-writing-tests]
    misconceptions:
      - belief: A `testFail_` prefix is the way to assert that something reverts.
        reality: testFail is no longer in the documented prefix set; it passed on any revert, including a compile-adjacent one you did not mean.
        why: It was the dapptools-era idiom and is still all over old tutorials.
        source: foundry-writing-tests
  - id: test-contract-is-the-fixture
    title: The test contract is the fixture
    oneLine: A test file is a contract inheriting forge-std Test; its state variables are the fixture and its prefixed functions are the cases.
    statement: >
      A Foundry test file declares a contract, conventionally inheriting `Test` from forge-std, which
      supplies the `vm` cheatcode interface, the assertion helpers and the address utilities. The
      contract's state variables are the fixture, and its public or external prefix-matching functions
      are the individual cases. There is no separate test-runner configuration: the contract is the
      configuration.
    volatility: stable
    edges:
      - { to: test-discovery-by-prefix, type: requires }
    sources: [foundry-writing-tests, forge-std-repo]
  - id: test-filtering
    title: Filtering the run
    oneLine: --match-test, --match-contract and --match-path — plus their --no-match inverses — are the inner loop.
    statement: >
      `--match-test`, `--match-contract` and `--match-path` (with `--no-match-*` inverses) restrict
      which tests execute. The productive debugging loop is to narrow with a filter first and only
      then raise verbosity, not to run `-vvvv` across the whole suite. The same filters are what a
      practice harness uses to run exactly the file an exercise is graded on.
    volatility: evolving
    edges:
      - { to: test-discovery-by-prefix, type: requires }
    sources: [foundry-writing-tests, forge-test-reference]
  - id: setup-runs-per-test
    title: setUp runs before every test
    oneLine: setUp() executes before each test function, and nothing one test mutates is visible to the next.
    statement: >
      `setUp()` runs before each individual test function, not once per contract. State changes made
      inside a test are discarded before the next one begins, so test cases cannot share mutated
      state and cannot be made order-dependent. This is the opposite of a `beforeAll` hook, and it is
      the single most common false assumption carried in from JavaScript or JUnit habits.
    volatility: stable
    edges:
      - { to: test-contract-is-the-fixture, type: requires }
    sources: [foundry-writing-tests]
    misconceptions:
      - belief: setUp() runs once for the whole test contract.
        reality: It runs before every test function; tests cannot share mutated state.
        why: beforeAll/beforeEach habits from JS and JUnit test runners.
        source: foundry-writing-tests
  - id: setup-snapshot-model
    title: What each test inherits from setUp
    oneLine: Every case starts from the post-setUp state — including any prank, warp or roll left active there.
    statement: >
      Isolation works by re-establishing the state as it stood at the end of setUp before each case.
      That state includes environment changes cheatcodes made during setUp: a `vm.startPrank` never
      stopped, a `vm.warp` to a future timestamp, or a `vm.roll` all persist into every test. So the
      right mental model is not "each test starts clean" but "each test starts from setUp's ending
      conditions, whatever those were".
    volatility: evolving
    edges:
      - { to: setup-runs-per-test, type: requires }
      - { to: prank-scope, type: deepens }
    sources: [foundry-writing-tests]
  - id: call-isolation-default
    title: Isolation mode, and why gas numbers are not comparable across versions
    oneLine: With --isolate each top-level external call is metered as its own transaction; on forge 1.7.1 the default is isolate = false.
    statement: >
      Isolation mode makes every top-level external call from a test execute as a separate transaction
      in a separate EVM context, which restores realistic cold/warm access accounting. On forge 1.7.1
      `forge config` reports `isolate = false`, so isolation is opt-in via `--isolate` or
      `isolate = true` on this version; the documentation has framed it both ways across releases, so
      check `forge config` rather than trusting a tutorial. The consequence for teaching is fixed
      either way: gas figures from a blog post are only comparable to yours if the isolation setting
      and the Foundry version match.
    volatility: hot
    edges:
      - { to: setup-runs-per-test, type: requires }
      - { to: isolate-mode, type: deepens }
      - { to: cold-vs-warm-access, type: requires }
    sources: [foundry-forge-testing, measured-forge-1-7-1]
    misconceptions:
      - belief: Gas numbers printed by forge match the numbers in Foundry blog posts and older tutorials.
        reality: Isolation and metering behaviour have changed within the 1.x line, so cross-version gas comparisons are invalid unless both settings are stated.
        why: Gas feels like a property of the contract rather than of the harness that measured it.
        source: foundry-forge-testing
  - id: vm-cheatcode-mechanism
    title: A cheatcode is a CALL to a magic address
    oneLine: '`vm` is a typed interface to address 0x7109709ECfa91a80626fF3989D68f67F5b1DD12D, which Foundry''s EVM intercepts.'
    statement: >
      Cheatcodes are ordinary ABI-encoded CALLs to the fixed address
      0x7109709ECfa91a80626fF3989D68f67F5b1DD12D. Foundry's EVM intercepts calls to that address and
      performs the effect instead of executing code there. `vm` is nothing but a Solidity interface
      whose selectors happen to be routed there, which is why cheatcodes are typed, why forge-std's
      Vm.sol is the authoritative signature list, and why the address matters when fuzzing.
    volatility: stable
    edges:
      - { to: tests-in-solidity, type: requires }
      - { to: abi-function-selector, type: requires }
    sources: [foundry-cheatcodes-overview, forge-std-repo]
  - id: cheatcode-families
    title: The cheatcode families
    oneLine: Environment, assertions, fuzzer, forking, external, signing, files, RPC, snapshots, utilities — ten groups worth knowing by shape.
    statement: >
      Cheatcodes group into families: environment (warp, roll, prank, deal, store), assertions
      (expectRevert, expectEmit, expectCall), fuzzer control (assume, bound), forking, external
      interaction (ffi, env, JSON and TOML parsing), signing, file access, RPC, state snapshots, and
      utilities (label, addr, makeAddr). Knowing the families is more useful than memorising names:
      when you need something, you look in the right family rather than searching the whole reference.
    volatility: evolving
    edges:
      - { to: vm-cheatcode-mechanism, type: requires }
    sources: [foundry-cheatcodes-overview]
  - id: cheatcode-address-in-fuzzing
    title: The cheatcode address is a valid fuzzed address
    oneLine: A fuzzed address parameter can land on 0x7109...D12D and produce nonsense; exclude it explicitly.
    statement: >
      Nothing stops the fuzzer generating the cheatcode address as a value for an `address` parameter.
      A test that then calls into that address gets cheatcode behaviour instead of contract behaviour,
      and the resulting failure looks like a contract bug. The documentation explicitly recommends
      assuming fuzzed addresses away from 0x7109709ECfa91a80626fF3989D68f67F5b1DD12D, alongside the
      usual exclusions of address(0) and the test contract itself.
    volatility: stable
    edges:
      - { to: vm-cheatcode-mechanism, type: requires }
      - { to: assume-legitimate-uses, type: applies }
    sources: [foundry-cheatcodes-overview]
  - id: prank-scope
    title: prank versus startPrank
    oneLine: vm.prank overrides msg.sender for exactly the next external call; vm.startPrank overrides it until stopPrank.
    statement: >
      `vm.prank(x)` sets msg.sender to x for exactly one subsequent external call and then expires.
      `vm.startPrank(x)` sets it for every subsequent external call until `vm.stopPrank()`. The
      failure mode is asymmetric: a forgotten stopPrank does not error, it quietly changes the caller
      for later assertions in the same test — and for every test, if it happened in setUp.
    volatility: stable
    edges:
      - { to: cheatcode-families, type: requires }
    sources: [foundry-cheatcode-prank]
    misconceptions:
      - belief: vm.prank and vm.startPrank differ only in style.
        reality: prank covers exactly one external call and then expires; startPrank covers everything until stopPrank.
        why: Both are described as "set msg.sender".
        source: foundry-cheatcode-prank
  - id: prank-tx-origin-form
    title: The two-argument prank
    oneLine: Only vm.prank(sender, origin) sets tx.origin as well — and after EIP-7702 that no longer proves anything about EOAs.
    statement: >
      The single-argument prank leaves tx.origin at the default test origin, so `msg.sender ==
      tx.origin` is false under a plain prank. The two-argument overload `vm.prank(sender, origin)`
      sets both, and is the only way to exercise code that compares them. Note what that code is
      usually trying to do: since EIP-7702 a delegated EOA can carry code and can be msg.sender, so a
      contract asserting `msg.sender == tx.origin` to mean "not a contract" is testing a broken
      invariant, and your test faithfully reproducing it does not make it sound.
    volatility: evolving
    edges:
      - { to: prank-scope, type: requires }
      - { to: tx-origin-not-eoa, type: contrasts }
      - { to: tx-origin-check-broken, type: contrasts }
    sources: [foundry-cheatcode-prank]
    misconceptions:
      - belief: vm.prank also changes tx.origin.
        reality: Only the two-argument overload does; the one-argument form leaves tx.origin alone.
        why: On a real chain an EOA sets both at once, so they feel inseparable.
        source: foundry-cheatcode-prank
  - id: prank-delegatecall-form
    title: Pranking a delegatecall
    oneLine: A boolean overload extends a prank to delegate calls, but a delegate call cannot be pranked from an EOA.
    statement: >
      `vm.prank` has an overload taking a `delegateCall` boolean, which lets the prank apply when the
      next call is a DELEGATECALL. The documented restriction is that a delegate call cannot be
      pranked from an EOA — the source of the prank must be a contract — which matters when testing
      proxy and delegation code paths.
    volatility: evolving
    edges:
      - { to: prank-scope, type: requires }
      - { to: delegatecall-is-the-proxy-primitive, type: applies }
    sources: [foundry-cheatcode-prank]
  - id: deal-cheatcode
    title: deal sets a balance, it does not add to one
    oneLine: vm.deal(addr, amount) overwrites an ETH balance; forge-std's deal(token, to, amount) overwrites an ERC-20 balance slot.
    statement: >
      `vm.deal(addr, amount)` sets the address's ETH balance to amount, discarding whatever was there;
      it is not a top-up. forge-std separately provides `deal(token, to, amount)`, a StdCheats helper
      that locates and overwrites the token's balance storage slot. The two are different tools with
      the same name, and the token variant depends on the token storing balances in a conventional
      layout.
    volatility: evolving
    edges:
      - { to: cheatcode-families, type: requires }
    sources: [foundry-cheatcodes-overview, forge-std-repo]
    misconceptions:
      - belief: vm.deal(alice, 1 ether) tops Alice up by one ether.
        reality: It sets her balance to exactly one ether, discarding the previous balance.
        why: The word "deal" sounds additive, like dealing another card.
        source: foundry-cheatcodes-overview
  - id: warp-and-roll
    title: warp and roll are independent
    oneLine: vm.warp sets block.timestamp, vm.roll sets block.number, and neither moves the other.
    statement: >
      `vm.warp(ts)` sets block.timestamp and `vm.roll(n)` sets block.number. They are completely
      independent: rolling forward a hundred blocks leaves the timestamp unchanged, and warping a week
      leaves the block number unchanged. On a real chain the two advance together at roughly twelve
      seconds a block, so tests of time-based accrual written with roll alone silently accrue nothing.
    volatility: stable
    edges:
      - { to: cheatcode-families, type: requires }
      - { to: roll-fork, type: contrasts }
    sources: [foundry-cheatcodes-overview]
    misconceptions:
      - belief: vm.roll(block.number + 100) also moves time forward.
        reality: warp and roll are independent; rolling leaves block.timestamp untouched.
        why: On a real chain blocks imply the passage of about twelve seconds each.
        source: foundry-cheatcodes-overview
  - id: expect-revert-next-call
    title: expectRevert binds to the next call
    oneLine: vm.expectRevert applies to the next external call only, and internal reverts need an opt-in config comment.
    statement: >
      `vm.expectRevert` registers an expectation that is consumed by the next call, and by default
      only by an external one. A revert raised inside an internal function is not matched unless the
      test opts in with `/// forge-config: default.allow_internal_expect_revert = true`. A revert that
      is caught by a try/catch inside the callee never propagates out and is therefore never observed.
      Older material claiming expectRevert simply works on internal functions predates that opt-in.
    volatility: evolving
    edges:
      - { to: cheatcode-families, type: requires }
    sources: [foundry-cheatcode-expect-revert]
    misconceptions:
      - belief: expectRevert catches a revert anywhere inside the next call tree.
        reality: It matches the revert that propagates out of the next call; internal reverts need opt-in and caught reverts are invisible.
        why: It reads like a try/catch wrapper around the statement.
        source: foundry-cheatcode-expect-revert
  - id: expect-revert-argument-nesting
    title: The nested-argument trap
    oneLine: In target.f(other.g()) the next call is g, not f — so the expectation attaches to the wrong call and the test passes for free.
    statement: >
      Solidity evaluates arguments before making the outer call, so in
      `vm.expectRevert(); target.f(other.g());` the next call is `other.g()`. The expectation binds
      there and the assertion about `f` is never made. The test then passes whether or not `f` is
      correct. The fix is mechanical: hoist the inner call into a local variable on the line before,
      so the statement after expectRevert contains exactly one call.
    volatility: stable
    edges:
      - { to: expect-revert-next-call, type: requires }
    sources: [foundry-cheatcode-expect-revert]
    misconceptions:
      - belief: "vm.expectRevert(); target.f(other.g()); tests that f reverts."
        reality: The next call is other.g(), so that is where the expectation binds; the test can pass with a perfectly healthy f.
        why: People read the statement outside-in while the EVM evaluates arguments first.
        source: foundry-cheatcode-expect-revert
  - id: expect-revert-selector-vs-data
    title: How precisely to match a revert
    oneLine: Match a bare revert, a bytes4 selector, full revert data, a specific reverter, or a count — count 0 asserts no revert at all.
    statement: >
      expectRevert has overloads of increasing strictness: bare (any revert), a `bytes4` custom-error
      selector, the full ABI-encoded revert data including arguments, a form pinning the reverting
      address, and a `uint64` count — where count 0 asserts that no revert occurs.
      `expectPartialRevert` matches only the selector of a parameterised custom error when the
      arguments are not worth pinning. Choosing the loosest overload that still fails when the wrong
      error is raised is the actual skill.
    volatility: evolving
    edges:
      - { to: expect-revert-next-call, type: requires }
      - { to: revert-data-encoding, type: requires }
    sources: [foundry-cheatcode-expect-revert]
  - id: low-level-call-status-trap
    title: The low-level call status trap
    oneLine: Around a low-level .call, the returned success boolean reports whether the expectation was met — not whether the call reverted.
    statement: >
      When `vm.expectRevert` wraps a low-level `.call()`, the boolean the call returns no longer
      reports the callee's outcome; it reports whether the expectation was satisfied. So after a
      correctly-predicted revert, `success` is true. Writing `assertFalse(success)` — the intuitive
      assertion — makes the test fail even though the contract behaved exactly as intended.
    volatility: evolving
    edges:
      - { to: expect-revert-next-call, type: requires }
    sources: [foundry-cheatcode-expect-revert]
    misconceptions:
      - belief: After expectRevert around a low-level call, success == false confirms the revert.
        reality: success reports whether the expectation was met, so it comes back true.
        why: Normally .call returns the callee's own success flag.
        source: foundry-cheatcode-expect-revert
  - id: expect-emit-ordering
    title: expectEmit is order-sensitive
    oneLine: Register the expectation, emit the expected event, then make the call — and expected events must appear in the actual order.
    statement: >
      The `vm.expectEmit(...)` idiom is three statements: the cheatcode, then an `emit` of the event
      you expect (which supplies the values to compare against), then the call under test. When
      several expectations are registered, the actual log stream must contain them in the same
      relative order; skipping unmatched logs is allowed, reordering is not. An intervening unrelated
      call can consume or void an outstanding expectation.
    volatility: evolving
    edges:
      - { to: cheatcode-families, type: requires }
      - { to: log-record-shape, type: requires }
    sources: [foundry-cheatcode-expect-emit]
    misconceptions:
      - belief: You can register several expectEmits up front and let the call satisfy them in any order.
        reality: Expected events must appear in the actual order; skips are allowed, reversals are not.
        why: Assertions usually commute, so order-sensitivity is surprising.
        source: foundry-cheatcode-expect-emit
  - id: expect-emit-topic-flags
    title: What the four booleans actually check
    oneLine: The booleans are topics 1-3 and the data body; topic0 is always checked and the emitter is only checked by the address overload.
    statement: >
      The four boolean arguments are checkTopic1, checkTopic2, checkTopic3 — the indexed parameters —
      and checkData, the non-indexed body. Topic0, the event signature hash, is always checked and is
      not one of the booleans. The emitting address is checked only by the overload that takes an
      address. Consequently `vm.expectEmit(true, true, true, true)` reads as maximally strict but will
      happily be satisfied by an identical event emitted from a completely different contract.
    volatility: evolving
    edges:
      - { to: expect-emit-ordering, type: requires }
    sources: [foundry-cheatcode-expect-emit]
    misconceptions:
      - belief: "vm.expectEmit(true, true, true, true) checks everything, including which contract emitted."
        reality: The booleans cover topics 1-3 and the data; the emitter is checked only in the address overload.
        why: '"All true" reads as "strictest possible".'
        source: foundry-cheatcode-expect-emit
