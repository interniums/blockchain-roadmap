moduleId: zk-commitments-kzg
concepts:
  - id: commitment-scheme
    title: Commitment scheme
    oneLine: A short, binding, optionally hiding stand-in for data you have not sent.
    statement: >
      A commitment scheme lets you publish a short value C standing for some data, with two properties:
      binding, meaning you cannot later claim C stood for different data, and hiding, meaning C on its
      own reveals nothing about the data. The two are separate properties and a scheme can be useful
      with only one of them. Every proof system is built out of commitments, because the whole reason
      a proof is small is that the large objects are never transmitted — only committed to, and then
      opened at a few points.
    volatility: stable
    edges:
      - { to: commitment, type: requires }
      - { to: hash-commitment, type: requires }
      - { to: polynomial-commitment, type: deepens }
    sources: [c-kzg-4844, eip-4844]

  - id: polynomial-commitment
    title: Polynomial commitment
    oneLine: Commit to a polynomial once, then prove any single evaluation p(z) = y without revealing p.
    statement: >
      A polynomial commitment commits to a polynomial p and later lets the committer prove a claim of
      the form p(z) = y at any chosen point z, with an opening proof the verifier can check against the
      commitment alone. This is the primitive that gives proof systems their succinctness: an entire
      execution trace becomes a handful of polynomials, and the verifier checks the whole thing by
      demanding evaluations at random points instead of reading the trace. Where a Merkle path grows
      with the data, a good polynomial commitment's opening does not.
    volatility: stable
    edges:
      - { to: commitment-scheme, type: requires }
      - { to: hash-commitment, type: contrasts }
      - { to: merkle-inclusion-proof, type: contrasts }
      - { to: arithmetization, type: requires }
    sources: [c-kzg-4844, eip-4844]

  - id: data-as-polynomial
    title: Data is the evaluations of a polynomial
    oneLine: Arbitrary bytes are read as a polynomial's values over a fixed domain — a blob is exactly 4096 field elements.
    statement: >
      To commit to raw data with a polynomial commitment, the data is interpreted as the evaluations of
      a polynomial over a fixed domain rather than as its coefficients. An Ethereum blob is exactly
      4096 field elements of 32 bytes each, that is 131,072 bytes or 128 KiB, and those 4096 elements
      are 4096 evaluations. Once data is a polynomial, every algebraic tool — openings at random
      points, degree bounds, erasure extension — becomes available to it.
    volatility: stable
    edges:
      - { to: polynomial-commitment, type: requires }
      - { to: blob, type: applies }
    sources: [eip-4844, c-kzg-4844]

  - id: kzg-scheme
    title: KZG commitments
    oneLine: Commit to a polynomial of any degree as a single 48-byte curve point, with a 48-byte opening proof.
    statement: >
      KZG commits to a polynomial as one elliptic-curve group element. On BLS12-381 as Ethereum uses
      it, the commitment is a 48-byte compressed G1 point and an opening proof is another 48-byte G1
      point, and both sizes are independent of the polynomial's degree. Constant size is what makes
      blobs workable: 128 KiB of data is represented on-chain by a fixed, small commitment regardless
      of content. The price is that KZG requires a pairing-friendly curve and a structured reference
      string produced by a trusted setup.
    volatility: stable
    edges:
      - { to: polynomial-commitment, type: requires }
      - { to: pairing, type: requires }
      - { to: bls12-381, type: requires }
      - { to: trusted-setup, type: requires }
      - { to: structured-reference-string, type: deepens }
    sources: [eip-4844, c-kzg-4844]
    misconceptions:
      - belief: KZG commitments are hiding, so blobs are private.
        reality: The blob itself is broadcast publicly; the hiding property of the commitment scheme is irrelevant to blob privacy.
        why: The word "commitment" implies concealment.
        source: eip-4844

  - id: kzg-opening-proof
    title: KZG opening proof
    oneLine: An opening for p(z) = y is a commitment to the quotient (p(X) − y)/(X − z), checked with one pairing equation.
    statement: >
      To prove p(z) = y, the prover commits to the quotient polynomial q(X) = (p(X) − y) / (X − z),
      which is a polynomial exactly when the claim is true. The verifier checks a single pairing
      equation relating the commitment to p, the commitment to q, the point z and the value y. That one
      equation is the entire verification: constant work, constant proof size, no matter how large the
      committed data was.
    volatility: stable
    edges:
      - { to: kzg-scheme, type: requires }
      - { to: pairing-buys-one-multiplication, type: requires }
      - { to: merkle-inclusion-proof, type: contrasts }
    sources: [eip-4844, c-kzg-4844]
    misconceptions:
      - belief: A KZG proof proves the data is available.
        reality: KZG proves consistency — that a claimed piece matches the commitment. Availability comes from the sampling and networking layer, not from the commitment scheme.
        why: The two are always introduced together.
        source: eip-7594

  - id: structured-reference-string
    title: Structured reference string
    oneLine: KZG's public parameters are encrypted powers of a secret τ; whoever knows τ can open a commitment to anything.
    statement: >
      KZG requires a public structured reference string consisting of the group elements
      [1]G, [τ]G, [τ²]G, … for a secret scalar τ, up to the maximum degree supported. Anyone who knows
      τ can produce valid-looking openings for values the polynomial does not take, which destroys
      binding entirely. τ is therefore never allowed to exist in one place: it is only ever the product
      of many participants' secrets, each of which is destroyed.
    volatility: stable
    edges:
      - { to: kzg-scheme, type: requires }
      - { to: trusted-setup, type: requires }
      - { to: transparent-setup, type: contrasts }
    sources: [kzg-ceremony-specs, eip-4844]

  - id: powers-of-tau-ceremony
    title: Powers-of-tau ceremony
    oneLine: A multi-party computation where each participant multiplies in their own secret and destroys it; one honest participant is enough.
    statement: >
      The structured reference string is produced by a sequential multi-party computation. Each
      participant takes the running string, multiplies in randomness only they know, publishes the
      result with a proof that they transformed it correctly, and destroys their secret. The combined τ
      is the product of every contribution, so it is unknown unless every single participant colluded
      or leaked. This is a one-of-N honest assumption, and it is why ceremony design focuses on
      breadth of participation and on public verifiability of each contribution.
    volatility: stable
    edges:
      - { to: structured-reference-string, type: requires }
      - { to: trusted-setup, type: deepens }
    sources: [kzg-ceremony-specs, kzg-ceremony-faq]
    misconceptions:
      - belief: A trusted setup means a small group holds a key that could break the system.
        reality: The setup secret only survives if every contributor colludes; a single honest participant who deleted their contribution makes the parameters safe.
        why: '"Trusted setup" wording, plus memory of small early ceremonies with a handful of participants.'
        source: kzg-ceremony-faq

  - id: kzg-ceremony-ethereum
    title: Ethereum's KZG ceremony
    oneLine: The Summoning ceremony ran January to April 2023 and produced the SRS still used by blob commitments today.
    statement: >
      Ethereum ran its KZG Summoning Ceremony from January to April 2023, open to the public, with a
      contributor count widely reported as over 140,000 — a figure repeated in secondary write-ups
      rather than counted from the transcript, so verify it against the ceremony repository before
      quoting it. The output is the structured reference string used by blob commitments and intended
      to serve a larger data-availability design later. No re-ceremony has occurred since; the
      long-run roadmap direction implies KZG will eventually be replaced rather than re-ceremonied.
    volatility: stable
    edges:
      - { to: powers-of-tau-ceremony, type: requires }
      - { to: kzg-scheme, type: applies }
    sources: [kzg-ceremony-specs, kzg-ceremony-faq]

  - id: point-evaluation-precompile
    title: Point-evaluation precompile
    oneLine: The precompile at 0x0A takes exactly 192 bytes and verifies that a committed polynomial evaluates to y at z.
    statement: >
      The point-evaluation precompile lives at address 0x0A and takes exactly 192 bytes of input: a
      32-byte versioned hash, the 32-byte evaluation point z, the 32-byte claimed value y, the 48-byte
      KZG commitment, and the 48-byte opening proof. It performs two checks — that the commitment
      hashes to the supplied versioned hash, and that the opening is valid for p(z) = y — and charges a
      fixed gas amount defined in the EIP. It is the only route by which the EVM learns anything at all
      about blob contents.
    volatility: stable
    edges:
      - { to: versioned-hash, type: requires }
      - { to: kzg-opening-proof, type: requires }
      - { to: blob-not-in-evm, type: requires }
    sources: [eip-4844]
    misconceptions:
      - belief: A smart contract can read blob data.
        reality: The EVM sees only the 32-byte versioned hash returned by BLOBHASH; any statement about blob contents must be proved through the point-evaluation precompile.
        why: Blobs are described as "cheap data on Ethereum", which sounds like calldata.
        source: eip-4844

  - id: proof-of-equivalence
    title: Proof of equivalence
    oneLine: Commit to the same data twice — once as a blob, once inside your proof system — and prove both commitments agree at a random point.
    statement: >
      A rollup posts its data as a blob, which is committed with KZG, but proves its state transition
      inside a proof system with a different commitment scheme. Proof of equivalence bridges the two:
      both sides open their commitment at the same challenge point derived from the transcript, and the
      point-evaluation precompile checks the blob side on-chain. If both openings agree, the data the
      proof was about is the data that was published. Whether any given production rollup uses this
      pattern rather than proving and posting separately should be checked per system rather than
      assumed.
    volatility: evolving
    edges:
      - { to: point-evaluation-precompile, type: requires }
      - { to: non-interactivity-fiat-shamir, type: requires }
      - { to: validity-proof, type: applies }
    sources: [eip-4844]

  - id: erasure-coding-extension
    title: Erasure extension makes withholding detectable
    oneLine: Each blob is Reed–Solomon extended twofold, so hiding any part of the data requires hiding more than half of it.
    statement: >
      Before distribution, blob data is Reed–Solomon extended to twice its length, so any half of the
      extended data reconstructs the original. The purpose is not redundancy in the storage sense: it
      is that an adversary who wants to withhold even one byte of the original must withhold more than
      half of the extended data, which random sampling detects quickly. Erasure coding is what turns an
      unfalsifiable claim — "the data is out there" — into something a small sampler can check
      probabilistically.
    volatility: stable
    edges:
      - { to: data-as-polynomial, type: requires }
      - { to: data-availability, type: applies }
    sources: [eip-7594]
    misconceptions:
      - belief: Erasure coding here is about redundancy and backup.
        reality: It exists to make withholding detectable — to hide any part of the data you must hide more than half of it, which random sampling catches.
        why: Reed–Solomon coding is normally taught in a storage-durability context.
        source: eip-7594

  - id: cell-and-column
    title: Cells and columns
    oneLine: Extended blob data is split into cells; a column is the same cell index across every blob in the block, and that is what a node samples.
    statement: >
      PeerDAS divides each extended blob into fixed-size cells and defines a column as the same cell
      index taken across all blobs in a block — 128 columns in the current design. A sampling node
      downloads columns, not blobs, so its bandwidth is independent of how many blobs the block
      carries. Read the exact cell size and column count from the consensus specifications rather than
      from summaries, and note the consumer-facing consequence: since this change, blob transactions
      carry per-cell proofs rather than one proof per blob, which broke libraries written against the
      earlier one-proof-per-blob wrapper.
    volatility: evolving
    edges:
      - { to: erasure-coding-extension, type: requires }
      - { to: peerdas, type: applies }
      - { to: blob-transaction, type: applies }
    sources: [eip-7594, c-kzg-4844]
    misconceptions:
      - belief: A blob transaction carries one KZG proof per blob.
        reality: Since PeerDAS, blob transactions carry per-cell KZG proofs so fragments can be verified independently; the old one-to-one-to-one blobs/commitments/proofs triple is outdated.
        why: The original blob-transaction mental model persisted for two years before the wrapper changed.
        source: eip-7594
