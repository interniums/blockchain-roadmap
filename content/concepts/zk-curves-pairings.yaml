moduleId: zk-curves-pairings
concepts:
  - id: ec-group
    title: The elliptic-curve group
    oneLine: Points on a curve over a finite field form a group where repeated addition is easy and undoing it is not.
    statement: >
      An elliptic curve over a finite field gives a group: points can be added, and adding a point to
      itself a times gives the scalar multiple [a]G. Scalar multiplication is the only operation the
      cryptography uses, and it is cheap to compute forwards. Every construction in this track —
      commitments, signatures, pairings — is built by putting secrets into scalars and publishing the
      resulting points.
    volatility: stable
    edges:
      - { to: keypair, type: requires }
      - { to: discrete-log-hardness, type: deepens }
    sources: [eth2book-bls12-381]

  - id: discrete-log-hardness
    title: Discrete-log hardness
    oneLine: Given G and [a]G, recovering a is believed infeasible — that single one-way step carries the whole construction.
    statement: >
      Security rests on the elliptic-curve discrete logarithm problem: given a generator G and the
      point [a]G, find a. No efficient classical algorithm is known for well-chosen curves, and the
      difficulty is what makes a published point safe to treat as a commitment to a hidden scalar.
      A curve's security level in bits is an estimate of the best known attack's cost, and that
      estimate can move downward as attacks improve — which is exactly what happened to one of the
      curves Ethereum deployed.
    volatility: stable
    edges:
      - { to: ec-group, type: requires }
      - { to: bn254, type: applies }
      - { to: pairing-and-post-quantum, type: deepens }
    sources: [eth2book-bls12-381, ietf-pairing-friendly-curves]

  - id: scalar-field-vs-base-field
    title: Scalar field versus base field
    oneLine: A curve has two moduli — coordinates live in Fp, witnesses and circuit values live in Fr — and confusing them is the classic ZK integration bug.
    statement: >
      Every curve carries two distinct finite fields. The base field Fp is where point coordinates
      live; the scalar field Fr, of order equal to the group order, is where scalars, witnesses and
      circuit values live. They have different moduli and different bit lengths. Circuit values that
      overflow Fr wrap silently, hashes reduced into the wrong field produce values that are not
      uniform, and a value valid in one field is not automatically valid in the other. This is the most
      common source of integration bugs when wiring a proving system to on-chain code.
    volatility: stable
    edges:
      - { to: ec-group, type: requires }
      - { to: field-arithmetic-default, type: deepens }
    sources: [eth2book-bls12-381]

  - id: pairing
    title: Pairing
    oneLine: A bilinear map e(P, Q) from G1 × G2 into a third group, satisfying e([a]P, [b]Q) = e(P, Q)^(ab).
    statement: >
      A pairing is an efficiently computable bilinear map taking a point in G1 and a point in G2 to an
      element of a target group GT. Bilinearity means scalars can be moved across the map and
      multiplied: e([a]P, [b]Q) equals e(P, Q) raised to the power ab. That identity lets a verifier
      confirm a relationship between two hidden scalars without learning either, which is the check at
      the heart of Groth16, PLONK and KZG verification.
    volatility: stable
    edges:
      - { to: ec-group, type: requires }
      - { to: pairing-buys-one-multiplication, type: deepens }
      - { to: kzg-opening-proof, type: applies }
    sources: [eth2book-bls12-381, eip-197]
    misconceptions:
      - belief: Pairings are what make a proof zero-knowledge.
        reality: A pairing provides a verifiable multiplication; zero-knowledge comes from blinding the witness, and many pairing-based proofs are not zero-knowledge at all.
        why: SNARK, pairing and zero-knowledge are usually introduced as one package.
        source: eip-197

  - id: pairing-buys-one-multiplication
    title: A pairing buys exactly one multiplication
    oneLine: Without pairings a verifier can check linear relations on hidden values; a pairing adds one degree, which is enough for quadratic constraints and KZG quotients.
    statement: >
      Group operations alone let a verifier check linear combinations of hidden scalars. A pairing adds
      exactly one degree of multiplication — no more — and that single extra degree is precisely what
      is needed to verify quadratic constraint systems and to check the KZG quotient identity. Anything
      requiring higher degree must be reached by other means: recursion, or a hash-based commitment
      scheme that does not depend on the algebraic structure at all.
    volatility: stable
    edges:
      - { to: pairing, type: requires }
      - { to: kzg-opening-proof, type: applies }
      - { to: recursion, type: contrasts }
    sources: [eth2book-bls12-381, eip-197]

  - id: pairing-friendly-curve
    title: Pairing-friendly curves are a special construction
    oneLine: Most curves have astronomically large embedding degree, making pairings uncomputable; BN and BLS families are built to be small there.
    statement: >
      A pairing is only computable when the curve's embedding degree — the extension of the base field
      in which the target group lives — is small. Generic curves have embedding degrees so large the
      pairing is unevaluable, which is a security feature for ordinary signature use. Pairing-friendly
      curves are deliberately constructed families, principally the BN and BLS families, chosen to make
      pairings efficient. The curve Ethereum accounts use for signatures is not among them, and no
      amount of implementation effort would make pairings on it possible.
    volatility: stable
    edges:
      - { to: pairing, type: requires }
      - { to: bn254, type: deepens }
      - { to: bls12-381, type: deepens }
    sources: [ietf-pairing-friendly-curves, eth2book-bls12-381]
    misconceptions:
      - belief: You can do pairings on secp256k1.
        reality: secp256k1 has a huge embedding degree; pairings on it are not computable. Pairing-friendliness is a deliberate construction, not a property most curves have.
        why: All curves look alike from an API surface.
        source: eth2book-bls12-381

  - id: g1-g2-asymmetry
    title: G1 and G2 are not interchangeable
    oneLine: G2 elements are about twice the size and much costlier to operate on, so protocols place the frequently transmitted object in G1.
    statement: >
      The two source groups of a pairing differ sharply in cost. On BLS12-381 a compressed G1 point is
      48 bytes while a G2 point is 96; in the EVM precompile encoding the difference is 128 bytes
      against 256, and the gas for a G2 addition or multi-scalar multiplication is correspondingly
      higher than for G1. Protocol designers therefore choose deliberately which object lives in which
      group: whatever is transmitted or stored often goes in G1, and the rarely-touched object goes in
      G2.
    volatility: stable
    edges:
      - { to: pairing, type: requires }
      - { to: bls-precompiles, type: applies }
    sources: [eip-2537, eth2book-bls12-381]
    misconceptions:
      - belief: G1 and G2 are interchangeable — they are both just curve points.
        reality: G2 elements are roughly twice the size and far more expensive to operate on; the BLS precompiles price G2 multi-scalar multiplication well above G1.
        why: Both are described as "points on the curve".
        source: eip-2537

  - id: bn254
    title: BN254
    oneLine: The curve behind Ethereum's original pairing precompiles, now assessed at roughly 100-bit security rather than the 128 originally claimed.
    statement: >
      BN254, also called alt_bn128, is the pairing-friendly curve implemented by Ethereum's original
      pairing precompiles and still the default for cheap on-chain SNARK verification. It was
      originally believed to offer 128-bit security; improvements to the extended tower number field
      sieve reduced that assessment to approximately 100 bits. Published figures differ — 100, 102 and
      103 bits all appear across sources — so state it as approximately 100 bits, down from an original
      128-bit claim, rather than picking a number.
    volatility: stable
    edges:
      - { to: pairing-friendly-curve, type: requires }
      - { to: discrete-log-hardness, type: requires }
      - { to: bls12-381, type: contrasts }
    sources: [ietf-pairing-friendly-curves, eip-197]
    misconceptions:
      - belief: BN254 gives 128-bit security.
        reality: Roughly 100 bits after improvements to the exTNFS attack; the original parameter choice targeted 128 and the label stuck for a decade.
        why: Curricula and library documentation repeated the original claim long after the reassessment.
        source: ietf-pairing-friendly-curves

  - id: bls12-381
    title: BLS12-381
    oneLine: The curve of Ethereum consensus signatures and blob commitments, designed with modern attacks in mind.
    statement: >
      BLS12-381 uses a 381-bit base field and was parameterised with the exTNFS attack already known,
      so its security estimate has held. Sources quote its level variously as around 126 bits, slightly
      below 128, or as a 128-bit target; they disagree, so describe it as targeting roughly 128-bit
      security and commonly assessed slightly under, rather than publishing a single figure. Ethereum
      uses it for consensus signatures and for blob KZG commitments, and since the Pectra upgrade it is
      also available to the EVM through dedicated precompiles.
    volatility: stable
    edges:
      - { to: pairing-friendly-curve, type: requires }
      - { to: bn254, type: contrasts }
      - { to: kzg-scheme, type: applies }
    sources: [eip-2537, eth2book-bls12-381, ietf-pairing-friendly-curves]

  - id: curve-security-vs-speed
    title: Curve choice is a security-cost trade
    oneLine: BN254 is faster and cheaper on-chain but weaker; BLS12-381 is stronger but larger and more expensive. Neither is strictly better.
    statement: >
      BN254 has a smaller field, so proving over it is faster and its precompiles have been cheap since
      2019 — which is why most deployed verifiers use it. BLS12-381 offers a security level that has
      survived scrutiny, at the cost of larger points and higher on-chain gas. The choice is a
      deliberate trade, and it is being forced by a third factor: standards work aiming at 128-bit
      provable security for L1-facing systems structurally disfavours BN254 regardless of its gas
      advantage.
    volatility: evolving
    edges:
      - { to: bn254, type: requires }
      - { to: bls12-381, type: requires }
      - { to: argument-of-knowledge, type: requires }
      - { to: groth16-verifier-cost, type: applies }
    sources: [eip-2537, ef-zkevm-security-foundations]
    misconceptions:
      - belief: Ethereum uses one elliptic curve.
        reality: At least four are in play — secp256k1 for accounts, BN254 for the SNARK precompiles, BLS12-381 for consensus and blobs, and secp256r1 for passkey-style signatures.
        why: '"The Ethereum curve" is a common shorthand.'
        source: eip-2537

  - id: bn254-precompiles
    title: The BN254 precompiles
    oneLine: Addresses 0x06, 0x07 and 0x08 implement BN254 addition, scalar multiplication and pairing — and a 2019 repricing made on-chain SNARK verification affordable.
    statement: >
      Ethereum exposes BN254 point addition at 0x06, scalar multiplication at 0x07, and a pairing check
      at 0x08. Their gas costs were cut by roughly an order of magnitude in the Istanbul upgrade once
      implementations improved, and that repricing is what made on-chain SNARK verification
      economically viable. Read the current constants from the EIP rather than from summaries: the
      figures circulating in course material for the post-Istanbul pairing cost are recalled rather
      than verified.
    volatility: stable
    edges:
      - { to: bn254, type: requires }
      - { to: bls-precompiles, type: contrasts }
      - { to: pairings-dominate-gas, type: applies }
    sources: [eip-1108, eip-197, eip-196]

  - id: bls-precompiles
    title: The BLS12-381 precompiles
    oneLine: EIP-2537 added seven BLS12-381 operations at 0x0b–0x11, with padded uncompressed encodings that differ from the 48-byte compressed form.
    statement: >
      Since the Pectra upgrade in May 2025 the EVM exposes seven BLS12-381 operations at addresses
      0x0b through 0x11: G1ADD, G1MSM, G2ADD, G2MSM, PAIRING_CHECK, MAP_FP_TO_G1 and MAP_FP2_TO_G2.
      Verified gas from the EIP: G1ADD 375, G2ADD 600, PAIRING_CHECK 32600·k + 37700, MAP_FP_TO_G1
      5500, MAP_FP2_TO_G2 23800, and the multi-scalar multiplications priced as
      (k · base · discount(k)) / 1000 with base 12000 for G1 and 22500 for G2. The encodings are padded
      and uncompressed — Fp is 64 bytes, Fp2 is 128, a G1 point is 128, a G2 point is 256, a scalar is
      32 — which is not the compressed form used elsewhere on the same curve.
    volatility: stable
    edges:
      - { to: bls12-381, type: requires }
      - { to: bn254-precompiles, type: contrasts }
      - { to: g1-g2-asymmetry, type: requires }
    sources: [eip-2537, execution-spec-tests-eip2537]
    misconceptions:
      - belief: A BLS12-381 G1 point is 48 bytes on-chain.
        reality: 48 bytes is the compressed serialization used by KZG commitments and consensus signatures; the EIP-2537 precompiles take 128-byte zero-padded uncompressed G1 points.
        why: The same curve appears with two different encodings in two different Ethereum subsystems.
        source: eip-2537

  - id: msm-multi-scalar-multiplication
    title: Multi-scalar multiplication
    oneLine: Computing a sum of many scalar multiples at once, with a volume discount — the dominant cost inside provers and the reason the precompiles expose it directly.
    statement: >
      Multi-scalar multiplication computes the sum of [a_i]P_i over many pairs in a single operation,
      and specialised algorithms make it substantially cheaper per term than repeating scalar
      multiplication. It is the dominant cost inside almost every prover, which is why prover
      performance work concentrates there and why GPU acceleration pays off. The BLS precompiles expose
      MSM rather than plain multiplication and price it with an explicit per-k discount function, which
      must be read from the EIP's table rather than extrapolated.
    volatility: stable
    edges:
      - { to: ec-group, type: requires }
      - { to: bls-precompiles, type: applies }
      - { to: cpu-vs-gpu-proving, type: deepens }
    sources: [eip-2537]

  - id: hash-to-curve
    title: Hash-to-curve
    oneLine: Mapping bytes to a curve point needs a specified map; hash-and-retry breaks the security proofs of what is built on top.
    statement: >
      Turning arbitrary bytes into a curve point is a cryptographic operation with its own
      requirements: the result must be indistinguishable from a uniformly random point, and naive
      approaches such as hashing to an x-coordinate and retrying leak structure and invalidate the
      security proofs of the signature schemes built above. Standardised maps exist and Ethereum
      exposes them as precompiles precisely so that integrators do not improvise.
    volatility: stable
    edges:
      - { to: ec-group, type: requires }
      - { to: bls-precompiles, type: requires }
      - { to: hash-function, type: requires }
    sources: [eip-2537]
    misconceptions:
      - belief: Hashing to a curve point is just hash-then-interpret-as-x.
        reality: Naive maps leak structure and break the security proofs; standardised maps exist and are exposed as precompiles for that reason.
        why: The naive approach appears to work in tests.
        source: eip-2537

  - id: bls-signature-aggregation
    title: BLS signature aggregation
    oneLine: Many BLS signatures compress into one, verified with a constant number of pairings — which is why Ethereum consensus chose this curve.
    statement: >
      BLS signatures over a pairing-friendly curve aggregate: many signatures can be combined into one
      short signature, verified with a constant number of pairings rather than one verification per
      signer. That property is what makes a consensus layer with very large validator sets tractable,
      and it is the reason Ethereum consensus uses BLS12-381. Aggregation has its own pitfalls,
      notably rogue-key attacks, which are handled by proof-of-possession or by message distinctness
      rather than by the pairing itself.
    volatility: stable
    edges:
      - { to: pairing, type: requires }
      - { to: bls12-381, type: requires }
      - { to: bls-precompiles, type: applies }
    sources: [eth2book-bls12-381, zellic-bls-signatures]

  - id: pairing-and-post-quantum
    title: Pairings are a transitional dependency
    oneLine: A large enough quantum computer breaks pairing-based cryptography; hash-based systems survive, which is why the roadmap drifts away from pairings.
    statement: >
      Pairing-based cryptography rests on discrete-log-style assumptions that a sufficiently large
      quantum computer would break. Hash-based systems — STARKs, FRI, hash-based signatures — rest only
      on the security of a hash function and are not broken by the same attack. This is the structural
      reason Ethereum's long-horizon direction moves toward hash-only assumptions, and the reason a
      2026 curriculum should present pairings as load-bearing today and transitional over a decade.
      Nothing has been removed and no removal is scheduled; treat it as direction, not as a date.
    volatility: evolving
    edges:
      - { to: pairing, type: requires }
      - { to: transparent-setup, type: requires }
    sources: [ethereum-org-quantum-resistance]
