moduleId: zk-noir-circuits
concepts:
  - id: circuit-vs-zkvm-tradeoff
    title: Circuit versus zkVM
    oneLine: A hand-written circuit encodes one relation with far fewer constraints than the same logic inside a zkVM, at the price of expert effort and a sharper failure mode.
    statement: >
      A zkVM pays constraints for generality: every useful operation is expressed through the VM's
      instruction semantics. A hand-written circuit expresses the relation directly and therefore
      carries far fewer constraints for the same statement — the ratio is workload-dependent and no
      uniform 2026 measurement across systems exists, so measure your own rather than quoting a
      multiplier. What you buy with the saving is paid for in author expertise, and in the fact that a
      soundness mistake in a bespoke circuit has no VM-level constraint system standing behind it.
    volatility: evolving
    edges:
      - { to: zkvm-vs-circuit, type: requires }
      - { to: circuits-are-the-descent, type: requires }
      - { to: when-circuit-wins, type: deepens }
    sources: [noir-docs-quickstart, succinct-sp1-docs]

  - id: when-circuit-wins
    title: When a circuit is the right choice
    oneLine: Small, fixed statements proved constantly favour a circuit; large, changing, or already-written programs favour a zkVM.
    statement: >
      Circuits win when the statement is small, stable, and proved at high volume — Merkle membership,
      a signature check, a range proof, one application-specific predicate. zkVMs win when the program
      is large, still changing, or already written in a general-purpose language. A useful test: if the
      relation would fit on one page and will not change this quarter, a circuit is worth costing out;
      otherwise the zkVM's overhead is cheaper than the engineering time.
    volatility: stable
    edges:
      - { to: circuit-vs-zkvm-tradeoff, type: requires }
      - { to: zkvm, type: contrasts }
    sources: [noir-docs-quickstart, succinct-sp1-docs]

  - id: noir-language
    title: Noir
    oneLine: A Rust-like DSL for writing circuits, designed to hide field arithmetic and backend details behind ordinary-looking code.
    statement: >
      Noir is a domain-specific language for writing zero-knowledge circuits, developed by Aztec, with
      syntax deliberately modelled on Rust. Its purpose is to let an engineer express a relation in
      readable code while the compiler handles the translation into constraints and the choice of
      backend. The resemblance to Rust is a deliberate on-ramp and also the source of the language's
      most persistent misunderstanding, because the execution model underneath is not imperative at all.
    volatility: evolving
    edges:
      - { to: arithmetization, type: requires }
      - { to: everything-is-a-constraint, type: deepens }
      - { to: acir, type: deepens }
    sources: [noir-docs-quickstart]

  - id: everything-is-a-constraint
    title: Everything you write becomes constraints
    oneLine: There is no runtime control flow — an `if` costs both branches, loops need compile-time bounds, and every line is paid for on every proof.
    statement: >
      A circuit is a fixed system of constraints, not a program that runs. A conditional is compiled
      into arithmetic that evaluates and selects between both branches, so both are paid for. Loops
      must have bounds known at compile time, and a loop bounded at 1000 costs 1000 iterations' worth
      of constraints regardless of the data. There is no early return that saves work. Cost is a
      property of the code, not of the input.
    volatility: stable
    edges:
      - { to: noir-language, type: requires }
      - { to: arithmetization, type: requires }
    sources: [noir-docs-unconstrained, noir-docs-quickstart]
    misconceptions:
      - belief: Noir is Rust, so Rust performance intuitions apply.
        reality: Every line becomes constraints — a loop bounded at 1000 costs 1000 iterations regardless of data, and both branches of an `if` are paid for.
        why: The syntax is deliberately Rust-like.
        source: noir-docs-unconstrained

  - id: field-arithmetic-default
    title: Field elements are not integers
    oneLine: Noir's default numeric type wraps modulo the backend curve's scalar field order, not at a power of two.
    statement: >
      The default numeric type in a circuit is a field element in the backend curve's scalar field.
      It wraps at the field modulus — roughly 254 bits for BN254-based backends — not at 2^256 and not
      at 2^64. Overflow, comparison, division and bit operations all behave differently from the
      integer types an application engineer expects, and comparisons in particular require explicit
      range decomposition that costs constraints. Integer intuitions carried over from Solidity or Rust
      will be wrong in ways that compile cleanly.
    volatility: stable
    edges:
      - { to: scalar-field-vs-base-field, type: requires }
      - { to: everything-is-a-constraint, type: requires }
    sources: [noir-docs-quickstart]
    misconceptions:
      - belief: Field elements behave like uint256.
        reality: They wrap modulo the curve's scalar field order, so overflow, comparison and bit operations all behave differently.
        why: Both are described as "big numbers" and both print as hex.
        source: noir-docs-quickstart

  - id: acir
    title: ACIR
    oneLine: Noir compiles to a backend-agnostic constraint intermediate representation, which is what makes it portable in principle.
    statement: >
      Noir compiles to ACIR, an abstract circuit intermediate representation describing constraints
      without committing to a proving backend. ACIR is the layer at which a backend consumes the
      circuit, and it is the reason Noir is described as backend-portable. Treat that portability as a
      design property rather than a demonstrated one: whether non-default backends are production-viable
      is not established.
    volatility: evolving
    edges:
      - { to: noir-language, type: requires }
      - { to: arithmetization, type: requires }
      - { to: barretenberg-backend, type: deepens }
    sources: [noir-docs-quickstart, noir-docs-nargo-commands]

  - id: barretenberg-backend
    title: Barretenberg
    oneLine: Aztec's proving backend and the de-facto default for Noir; UltraHonk is its general-purpose scheme.
    statement: >
      Barretenberg, invoked as `bb`, is the C++ proving backend that consumes ACIR and produces proofs,
      and it is the default for Noir in practice. Its general-purpose proving scheme for standalone
      circuits is UltraHonk; a separate variant targets Aztec's private contracts. The older
      PLONK-family backend naming found in 2023-era tutorials is outdated. `bb` versions independently
      of the Noir compiler, and mismatched versions are a routine first-hour failure.
    volatility: hot
    edges:
      - { to: acir, type: requires }
      - { to: noir-maturity, type: deepens }
    sources: [barretenberg-docs, noir-docs-quickstart]

  - id: noir-maturity
    title: Noir has not shipped 1.0
    oneLine: As of August 2026 Noir is on the 1.0.0-beta series with daily nightlies, so pinned versions are mandatory.
    statement: >
      Noir has no stable 1.0 release. The tagged line is the 1.0.0-beta series and the release feed is
      dominated by dated nightlies; the exact current beta number should be read from `noirup --version`
      or the releases page rather than from any lesson text, because reports of it disagree. Breaking
      changes between betas are normal. Any material that ships a Noir example must pin both `nargo`
      and `bb`, because they version independently and a mismatch fails confusingly.
    volatility: hot
    edges:
      - { to: noir-language, type: requires }
      - { to: barretenberg-backend, type: requires }
    sources: [noir-releases, noir-docs-quickstart]
    misconceptions:
      - belief: Noir 1.0 is out.
        reality: It is on the 1.0.0-beta series with daily nightlies as of August 2026, and no stable 1.0 date has been committed.
        why: The "1.0.0-" prefix reads as 1.0 in changelogs and package managers.
        source: noir-releases

  - id: private-vs-public-inputs
    title: Private and public inputs
    oneLine: Public inputs are visible to the verifier and are part of what the on-chain contract checks; private inputs are witness only.
    statement: >
      Every circuit input is either private — known only to the prover and used to satisfy constraints —
      or public, meaning it travels with the proof, appears in the verifier's calldata, and is part of
      the statement the verifier attests to. The split defines what leaks and what the verifier can
      bind to. Getting it wrong is a privacy bug rather than a compile error: a value marked public is
      simply published, with no warning at any stage.
    volatility: stable
    edges:
      - { to: noir-language, type: requires }
      - { to: zero-knowledge-property, type: requires }
      - { to: proof-system-relation, type: requires }
      - { to: public-inputs-binding, type: deepens }
    sources: [noir-docs-quickstart, barretenberg-docs]
    misconceptions:
      - belief: If a value is not marked public, it is private end-to-end.
        reality: Privacy also depends on what the application publishes — nullifiers, amounts, timing and the verifier's calldata all leak. The circuit boundary is not the privacy boundary.
        why: The visibility keyword looks like the whole story.
        source: noir-docs-quickstart

  - id: unconstrained-functions
    title: Unconstrained functions
    oneLine: Code that runs outside the constraint system so the prover can compute a hint cheaply, which the circuit must then verify.
    statement: >
      An unconstrained function executes during witness generation but contributes no constraints. It
      exists so the prover can compute something that is expensive to derive inside a circuit but cheap
      to check there — a square root, a quotient, a sorted permutation, the position of an element.
      The circuit then constrains the returned value. Nothing about the unconstrained body is proved;
      only the check that follows it is.
    volatility: stable
    edges:
      - { to: everything-is-a-constraint, type: requires }
      - { to: compute-vs-verify-asymmetry, type: deepens }
      - { to: unconstrained-is-untrusted, type: deepens }
    sources: [noir-docs-unconstrained, aztec-unconstrained-blog]

  - id: compute-vs-verify-asymmetry
    title: Compute unconstrained, verify constrained
    oneLine: Never compute inside the circuit what you can compute outside and cheaply check inside.
    statement: >
      The central circuit optimisation is to replace an expensive in-circuit computation with a cheap
      in-circuit check of an externally supplied answer. Division becomes a multiplication check;
      inversion becomes a product-equals-one check; sorting becomes a permutation-plus-ordering check;
      search becomes an index-plus-equality check. The saving comes from the gap between deriving an
      answer and confirming one, and recognising that gap is most of what circuit optimisation is.
    volatility: stable
    edges:
      - { to: unconstrained-functions, type: requires }
      - { to: constraint-counting, type: applies }
    sources: [noir-docs-unconstrained, aztec-unconstrained-blog]

  - id: unconstrained-is-untrusted
    title: Unconstrained output is attacker-controlled
    oneLine: A hint the circuit forgets to constrain is a value the prover chose — and a proof of a false statement.
    statement: >
      Whatever an unconstrained function returns is chosen by the prover, because the prover controls
      witness generation and can substitute any value. If the circuit omits the constraint that pins
      the hint down, the prover can supply a wrong answer and still produce a proof the verifier
      accepts. This is a trust boundary, not an optimisation detail, and it is the failure mode most
      likely to appear in a hand-written circuit. Treat the docs' framing of unconstrained functions as
      a performance feature as an incomplete description.
    volatility: stable
    edges:
      - { to: unconstrained-functions, type: requires }
      - { to: argument-of-knowledge, type: requires }
    sources: [noir-docs-unconstrained, aztec-unconstrained-blog]
    misconceptions:
      - belief: Unconstrained functions are just a performance optimisation.
        reality: They are a trust boundary — their outputs are prover-chosen, and a missing constraint on the returned hint is a soundness hole.
        why: The documentation frames them as an optimisation because that is the motivation for using them.
        source: aztec-unconstrained-blog

  - id: constraint-counting
    title: Counting constraints
    oneLine: Gate count is the number that predicts proving time, memory, and whether a circuit fits inside a recursive step.
    statement: >
      The Noir toolchain reports the size of a compiled circuit, and the backend gate count is the
      figure that predicts proving wall-clock, peak memory, and whether the circuit can be verified
      inside another circuit for recursion. Reading the gate count before optimising, and again after,
      is the only way to know whether a change helped. A circuit's cost is fixed at compile time, so
      this number is available before a single proof is generated.
    volatility: evolving
    edges:
      - { to: acir, type: requires }
      - { to: barretenberg-backend, type: requires }
      - { to: acir-opcodes-vs-backend-gates, type: deepens }
    sources: [noir-docs-nargo-commands, barretenberg-docs]

  - id: acir-opcodes-vs-backend-gates
    title: ACIR opcodes are not backend gates
    oneLine: The two counts measure different things and do not move together; proving cost tracks gates.
    statement: >
      The toolchain reports both an ACIR opcode count and a backend gate count. They measure different
      layers — one the backend-agnostic IR, the other the constraints the prover actually processes —
      and an optimisation can reduce one while raising the other. Proving time and memory track the
      backend gate count. Reading only the first column, which is the one presented first, produces
      confident conclusions that are wrong.
    volatility: evolving
    edges:
      - { to: constraint-counting, type: requires }
    sources: [noir-docs-nargo-commands]
    misconceptions:
      - belief: Fewer ACIR opcodes means a faster proof.
        reality: ACIR opcode count and backend gate count are different measures; proving cost tracks gates.
        why: The tooling shows both and the first column is read first.
        source: noir-docs-nargo-commands

  - id: noir-verifier-generation
    title: Generating a Solidity verifier
    oneLine: The backend emits a verifier contract for a compiled circuit, whose public inputs must line up exactly with the circuit's.
    statement: >
      Barretenberg can emit a Solidity verifier contract for a compiled circuit, which is how a Noir
      proof reaches an EVM chain. The generated contract's public-input layout is derived from the
      circuit and must be fed in exactly that order and encoding by the calling contract; a mismatch
      produces a rejected proof or, worse, a verified proof about a statement other than the one
      intended. Gas for the default UltraHonk verifier is not established in public benchmarks —
      measure it in your own harness rather than looking for a published figure.
    volatility: hot
    edges:
      - { to: private-vs-public-inputs, type: requires }
      - { to: verifier-contract, type: requires }
      - { to: public-inputs-binding, type: applies }
    sources: [barretenberg-docs, noir-docs-quickstart]

  - id: noirjs
    title: NoirJS and client-side proving
    oneLine: Proving in the browser via WebAssembly makes client-side private proofs practical — and makes proving time a UX constraint.
    statement: >
      NoirJS runs circuit execution and proving in the browser through WebAssembly. This is what makes
      genuinely client-side privacy possible: the witness never leaves the user's machine, so no server
      is trusted with the private inputs. The cost is that proving time becomes something a user waits
      through, and the WASM bundle becomes something they download, so circuit size stops being a
      backend concern and becomes a product one.
    volatility: evolving
    edges:
      - { to: noir-language, type: requires }
      - { to: constraint-counting, type: requires }
      - { to: private-execution-vs-private-state, type: applies }
    sources: [noir-docs-noirjs]
