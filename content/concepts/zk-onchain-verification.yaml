moduleId: zk-onchain-verification
concepts:
  - id: verifier-contract
    title: Verifier contract
    oneLine: A stateless pure function on-chain that takes a proof plus public inputs and returns true or false — nothing more.
    statement: >
      A verifier is deployed code with no state and no side effects: given a proof and its public
      inputs, it returns a boolean. It holds no funds, grants no permissions, and knows nothing about
      the application. All meaning lives in the contract that calls it and decides what a true return
      entitles the caller to. Reading a verifier and reading the contract that consumes it are two
      different audits, and only the second one finds the bugs that lose money.
    volatility: stable
    edges:
      - { to: succinctness, type: requires }
      - { to: onchain-verification, type: requires }
      - { to: public-inputs-binding, type: deepens }
    sources: [eip-8079, barretenberg-docs]

  - id: public-inputs-binding
    title: Binding the public inputs
    oneLine: The verifier attests only to the statement in the public inputs; the caller must bind those inputs to the thing it actually cares about.
    statement: >
      A proof is about its public inputs and nothing else. If a calling contract accepts a state root,
      a recipient, an epoch, or a nonce from the transaction sender and passes it straight through as a
      public input, the proof is valid for whatever the attacker chose. Binding means the caller
      substitutes its own trusted values — the root it has stored, the recipient it computed, the nonce
      it tracks — for anything an attacker could otherwise supply. Most exploitable ZK integration bugs
      are missing bindings, not broken cryptography.
    volatility: stable
    edges:
      - { to: verifier-contract, type: requires }
      - { to: private-vs-public-inputs, type: requires }
      - { to: proof-replay, type: deepens }
    sources: [eip-8079]
    misconceptions:
      - belief: More public inputs barely matters, since the proof size is constant.
        reality: Public-input count is a real design lever — in pairing-based verifiers each input adds group operations, and the per-input slope differs sharply between proof systems.
        why: Proof size is constant, so people assume verification cost is too.
        source: orbiter-verifier-gas

  - id: proof-replay
    title: Proof replay
    oneLine: A proof is just bytes; the same valid proof can be submitted twice unless the caller enforces a nullifier or state progression.
    statement: >
      Nothing about a proof prevents it being resubmitted. If the consuming contract pays out, mints,
      or advances a state on a true return without recording that this particular statement has already
      been settled, a valid proof can be replayed for repeated effect. The fixes are the same as
      elsewhere in contract engineering — a nullifier set, a monotonic state root, an expiring nonce
      bound into the public inputs — and their absence is a standard finding. "Proof verified" never
      means "action authorised".
    volatility: stable
    edges:
      - { to: public-inputs-binding, type: requires }
      - { to: nullifier, type: applies }
    sources: [eip-8079]
    misconceptions:
      - belief: If the verifier returns true, the action is authorised.
        reality: Verification says only that some witness exists for the given public inputs; replay protection and binding are the caller's job.
        why: A boolean return from a contract called "verifier" reads like an authorisation check.
        source: eip-8079

  - id: groth16-verifier-cost
    title: What a Groth16 verifier costs
    oneLine: Roughly a couple of hundred thousand gas on BN254, dominated by the pairing check, plus a per-public-input term.
    statement: >
      A Groth16 verifier over BN254 lands in the low hundreds of thousands of gas, dominated by the
      pairing precompile, with an additional cost per public input from the scalar multiplications
      needed to fold the inputs. The precise per-input formulas circulating in the ecosystem come from
      a single 2024 community analysis rather than from a specification; they are widely repeated but
      not independently confirmed, so treat any published constant as indicative and measure the
      verifier you actually deploy.
    volatility: evolving
    edges:
      - { to: verifier-contract, type: requires }
      - { to: bn254-precompiles, type: requires }
      - { to: pairings-dominate-gas, type: deepens }
      - { to: plonk-verifier-cost, type: contrasts }
    sources: [eip-1108, orbiter-verifier-gas]

  - id: plonk-verifier-cost
    title: What a PLONK-family verifier costs
    oneLine: Short constant verification like Groth16 and the same dominating pairing check, bought with a larger proof and a universal setup instead of a per-circuit ceremony.
    statement: >
      A PLONK-family verifier, including the FFLONK variants several rollups use, has a short and
      constant verification time and, on a pairing-based instantiation, still finishes with the same
      pairing check that dominates a Groth16 verifier's gas. What you trade for that is documented
      by the implementations themselves: the setup becomes universal and updatable instead of
      circuit-specific, at the price of a proof that is larger and slower to generate. Where the two
      families genuinely differ on-chain is in how they fold public inputs, and the per-input gas
      constants circulating for both come from a single community analysis rather than a
      specification — so treat the slope as a real design axis and measure the verifier you actually
      deploy rather than quoting a formula.
    volatility: evolving
    edges:
      - { to: verifier-contract, type: requires }
      - { to: universal-vs-circuit-specific-setup, type: requires }
      - { to: groth16-verifier-cost, type: contrasts }
    sources: [gnark-schemes-curves, eip-1108, orbiter-verifier-gas]

  - id: pairings-dominate-gas
    title: Pairings dominate verifier gas
    oneLine: Almost all verifier gas is pairing operations; every other step is noise, which is why optimisation targets pairing count.
    statement: >
      Inside a pairing-based verifier, the pairing check consumes the overwhelming majority of gas.
      Field arithmetic, calldata and hashing are rounding errors next to it. This is why the gas
      pricing of the pairing precompile determines the economics of on-chain verification, why the 2019
      repricing of those precompiles mattered so much, and why every cost optimisation in this area —
      batching, aggregation, curve choice — is ultimately about performing fewer pairings.
    volatility: stable
    edges:
      - { to: pairing, type: requires }
      - { to: groth16-verifier-cost, type: requires }
      - { to: bn254-precompiles, type: requires }
    sources: [eip-1108]

  - id: batch-pairing-check
    title: Batched pairing checks
    oneLine: Many independent pairing equations fold into one randomised check, so per-proof pairing count grows far more slowly than verifying each proof separately.
    statement: >
      The BN254 pairing precompile does not evaluate one pairing; it takes k point pairs and checks
      whether the product of their pairings equals one, and its gas is priced per pair on top of a
      fixed base. That shape is what makes batching possible: independent pairing equations can be
      combined with random coefficients into a single such product check, so the terms that are
      constant across proofs are paid once instead of once per proof. Soundness is preserved because
      a forged individual equation survives the random combination only with negligible probability.
      This requires no recursion, only that the proofs share a verification key. The exact pairing
      count depends on the proof system, and vendor-published per-proof figures should be re-derived
      against the precompile's own pricing rather than quoted.
    volatility: stable
    edges:
      - { to: pairings-dominate-gas, type: requires }
      - { to: proof-aggregation, type: contrasts }
    sources: [eip-197, eip-1108, aligned-whitepaper]

  - id: recursive-aggregation-onchain
    title: Recursive aggregation
    oneLine: Fold N proofs into one off-chain so L1 verifies exactly once, at the cost of waiting for the batch.
    statement: >
      Instead of batching verification on-chain, N proofs can be recursively folded off-chain into a
      single proof, so the chain verifies once no matter how large N is. Gas per underlying proof falls
      toward zero as N grows. The costs are aggregation latency — a proof must wait for its batch — and
      the additional proving work of the recursive steps, which does not appear in the gas number at
      all.
    volatility: evolving
    edges:
      - { to: recursion, type: requires }
      - { to: verifier-contract, type: requires }
      - { to: batch-pairing-check, type: contrasts }
    sources: [ef-zkevm-security-foundations, aligned-whitepaper]

  - id: aggregation-layer
    title: Aggregation services
    oneLine: Third-party layers batch heterogeneous proofs between app provers and L1, adding latency and sometimes a different security assumption.
    statement: >
      Several services sit between application provers and L1, collecting proofs from different systems
      and settling them together. Choosing one is a security decision before it is a pricing decision:
      some designs produce a proof that Ethereum itself verifies, inheriting Ethereum's security, while
      others attest through a restaked validator set, which is a different and weaker assumption. All
      of them add latency. Vendor cost multiples should be treated as marketing until measured.
    volatility: hot
    edges:
      - { to: recursive-aggregation-onchain, type: requires }
      - { to: proof-aggregation, type: requires }
    claimKind: empirical
    sources: [aligned-whitepaper, aligned-verification-vs-aggregation]
    misconceptions:
      - belief: Aggregation is free savings.
        reality: It buys gas with latency, and for validator-set-based designs with a different security assumption than Ethereum's.
        why: Marketing leads with the gas multiple and omits both.
        source: aligned-verification-vs-aggregation

  - id: verify-vs-reexecute
    title: Verify versus re-execute
    oneLine: Re-executing costs gas proportional to the work; verifying a proof costs a near-constant amount. Proofs win only above the crossover.
    statement: >
      The economic core of on-chain proof verification is a comparison of two curves: re-execution
      costs gas that rises with the amount of work, while proof verification costs a roughly constant
      amount regardless of it. Proofs win once the proved computation exceeds that constant. Below it,
      re-executing is simply cheaper, and you would additionally be paying prover cost that never
      appears in the gas figure. Finding the crossover for your workload is a measurement, not a
      principle.
    volatility: stable
    edges:
      - { to: prover-verifier-asymmetry, type: requires }
      - { to: verifier-contract, type: requires }
      - { to: verification-floor, type: deepens }
    sources: [arxiv-cost-effective-zk-rollups, ethereum-org-zkevm-roadmap]

  - id: verification-floor
    title: The verification floor
    oneLine: Verification has a fixed gas floor, so proving is uneconomic below a threshold of work — the rule is not "always use ZK".
    statement: >
      Because a pairing-based verification costs a fixed amount whatever it proves, there is a floor
      below which proving cannot pay. A computation cheaper to run on-chain than that floor should
      simply be run on-chain. The correct framing for a product decision is therefore a threshold —
      use a proof above N gas of work — rather than a preference. The floor also means that adding a
      proof to a small operation makes it strictly more expensive and strictly more complex.
    volatility: stable
    edges:
      - { to: verify-vs-reexecute, type: requires }
      - { to: groth16-verifier-cost, type: requires }
    sources: [eip-1108, arxiv-cost-effective-zk-rollups]
    misconceptions:
      - belief: ZK proofs are always cheaper than doing the work on-chain.
        reality: There is a fixed verification floor; below it re-execution is cheaper, and you also pay prover cost that never appears in the gas number.
        why: '"Constant-time verification" gets taught without the constant.'
        source: arxiv-cost-effective-zk-rollups

  - id: data-cost-vs-proof-cost
    title: Data, not proofs, dominates rollup cost
    oneLine: For a rollup, publishing data is usually the larger L1 line item; blobs changed rollup economics far more than proof-cost improvements did.
    statement: >
      For a production rollup, the L1 bill splits between publishing data and verifying proofs, and
      since blob transactions arrived the data side has been the term that moves. Verification gas has
      been a comparatively minor line for most rollups since 2024. Material that presents proof
      verification as the rollup bottleneck is describing the pre-blob picture. The exact ratio varies
      per rollup and per week with blob pricing, so measure a specific system rather than quoting a
      proportion.
    volatility: evolving
    edges:
      - { to: verify-vs-reexecute, type: requires }
      - { to: blob, type: requires }
      - { to: da-cost-no-longer-dominant, type: contrasts }
    sources: [eip-4844, arxiv-zk-rollup-bottlenecks]
    misconceptions:
      - belief: Proof verification is the main cost of a ZK rollup.
        reality: Since blobs, data publication and prover infrastructure dominate; verification gas is often a small fraction.
        why: Most explainers were written against the pre-blob picture and were never revised.
        source: arxiv-zk-rollup-bottlenecks

  - id: proving-cost-not-gas-cost
    title: Three costs, only one of which is gas
    oneLine: Prover hardware and time, data availability, and L1 verification are three separate lines; optimising only the gas misreads the P&L.
    statement: >
      A proving system has at least three cost lines: the machines, energy and wall-clock time to
      produce proofs, the cost of publishing the data the proof is about, and the L1 gas to verify.
      Each is metered by a different mechanism. Blob data has its own fee market and its own gas
      accounting, separate from ordinary execution gas. Prover cost is not metered on-chain at all,
      which is why the Ethereum Foundation had to express its proving requirement as a capital and
      power budget — a CAPEX ceiling and a kilowatt ceiling — rather than as a gas number. Because
      the three move independently and are paid by potentially different parties, an optimisation
      that halves verification gas while tripling prover hardware is a loss. Any cost claim about a
      proving system should state which of the three it covers, in what unit, on what hardware.
    volatility: evolving
    edges:
      - { to: verify-vs-reexecute, type: requires }
      - { to: cpu-vs-gpu-proving, type: requires }
      - { to: data-cost-vs-proof-cost, type: requires }
    sources: [ef-realtime-proving, eip-4844, arxiv-cost-effective-zk-rollups, arxiv-crowdprove]

  - id: verifier-upgradeability-risk
    title: An upgradeable verifier is not a cryptographic guarantee
    oneLine: If a key can replace the verifier, the proof guarantees nothing the key holder does not allow — which is why a live validity proof does not by itself lift a rollup off the lowest trust stage.
    statement: >
      A verifier behind an upgradeable proxy controlled by centralised keys can be swapped for one that
      accepts anything, so the cryptographic guarantee is bounded by the governance around it. The
      independent stage framework is built on exactly this distinction: it grades how far a project is
      from being controlled by code rather than by a few entities, with Stage 0 meaning full control by
      those entities, and it is explicit that the grade measures decentralisation rather than security —
      a project can be unsafe and highly staged, or proof-carrying and Stage 0. Check which rollups sit
      where against the live classification rather than a remembered snapshot. A verifier contract is
      necessary for trustlessness and nowhere near sufficient.
    volatility: evolving
    edges:
      - { to: verifier-contract, type: requires }
      - { to: upgrade-key-risk, type: requires }
      - { to: l2beat-stage-0, type: applies }
      - { to: proofs-do-not-imply-trustless, type: applies }
    sources: [l2beat-stages, l2beat-glossary, l2beat-native-rollups]
    misconceptions:
      - belief: A rollup with validity proofs is trustless.
        reality: Major validity-proof rollups are classified at the lowest trust stage because upgrade keys can replace the verifier outright.
        why: The proof is the visible mechanism; the governance is not.
        source: l2beat-native-rollups

  - id: native-rollups
    title: Native rollups
    oneLine: A proposed L1 precompile that would let Ethereum check an L2 state transition using its own execution rules, making bespoke verifiers optional.
    statement: >
      EIP-8079 proposes an EXECUTE precompile through which L1 could validate an L2 state transition
      against Ethereum's own execution rules, rather than each rollup maintaining a bespoke proof
      system and verifier contract. Sources describe its semantics differently — some as literal L1
      re-execution, others as an enshrined interface eventually discharged by proofs — and that
      difference is unresolved, so read the EIP rather than a summary. A working prototype was
      demonstrated on a client implementation in March 2026. It has no fork assignment and no date.
    volatility: hot
    edges:
      - { to: verify-vs-reexecute, type: requires }
      - { to: verifier-contract, type: contrasts }
    sources: [eip-8079, l2beat-native-rollups]
    misconceptions:
      - belief: Native rollups are shipping soon.
        reality: The proposal has a 2026 proof-of-concept and no fork assignment; the next scheduled upgrade's headline items are unrelated.
        why: The demonstration got heavy coverage and demos read as roadmaps.
        source: eip-8079
