moduleId: zk-privacy-applications
concepts:
  - id: account-model-leaks-everything
    title: The account model publishes everything
    oneLine: Sender, recipient, amount and timing are structural properties of an account-model transfer, so privacy cannot be retrofitted above it.
    statement: >
      An account-model transfer works by decrementing one balance and incrementing another, which
      requires naming both accounts and the amount in public state. Timing is published by the block
      itself. No application-layer measure changes this, because the leak is in the data model rather
      than in the interface: any system that wants privacy has to stop representing value as a named
      balance. This is why privacy on Ethereum arrives as a different state model rather than as a
      feature flag.
    volatility: stable
    edges:
      - { to: account, type: requires }
      - { to: note-commitment-model, type: contrasts }
    sources: [aztec-docs]

  - id: note-commitment-model
    title: Notes instead of balances
    oneLine: Value becomes a set of notes, each published only as a commitment in an append-only tree; the tree is public, the contents are not.
    statement: >
      Private systems represent value as discrete notes, closer to unspent outputs than to balances.
      Each note is published only as a commitment appended to a public Merkle tree; the amount, owner
      and any other content stay off-chain with the owner. Anyone can see that notes exist and how many
      there are; nobody can see what any of them says. Ownership is proved by demonstrating knowledge
      of the secret behind a note in the tree, which is exactly the kind of statement a circuit is
      good at.
    volatility: stable
    edges:
      - { to: commitment-scheme, type: requires }
      - { to: merkle-tree, type: requires }
      - { to: account-model-leaks-everything, type: contrasts }
      - { to: nullifier, type: deepens }
    sources: [aztec-docs, railgun-docs]

  - id: nullifier
    title: Nullifier
    oneLine: Spending a note publishes a one-way, deterministic value derived from its secret, which prevents double-spends without revealing which note was spent.
    statement: >
      Because notes are never revealed, the contract cannot mark one as spent. Instead the spender
      publishes a nullifier: a value derived deterministically from the note's secret through a one-way
      function, which the contract records in a set. A second attempt to spend the same note produces
      the same nullifier and is rejected. The nullifier is uncorrelatable with the note's commitment,
      so the link between deposit and spend is exactly what the proof hides.
    volatility: stable
    edges:
      - { to: note-commitment-model, type: requires }
      - { to: hash-function, type: requires }
      - { to: proof-replay, type: applies }
    sources: [aztec-docs, railgun-docs]

  - id: nullifier-must-be-deterministic-and-hiding
    title: Both nullifier properties are load-bearing
    oneLine: Determined by the note or double-spends become possible; uncorrelated with the commitment or the privacy is gone.
    statement: >
      A nullifier must satisfy two independent requirements. It must be uniquely determined by the note
      and its spending secret, or a spender could derive several distinct nullifiers for one note and
      spend it repeatedly. And it must be computationally uncorrelatable with the note's commitment, or
      an observer can match deposits to withdrawals and the pool provides no privacy at all. Deriving a
      nullifier from the commitment rather than from the spending key satisfies the first requirement
      and destroys the second — a mistake that has been made in real systems.
    volatility: stable
    edges:
      - { to: nullifier, type: requires }
      - { to: keypair, type: requires }
    sources: [aztec-docs]
    misconceptions:
      - belief: A nullifier is just a spent-flag with a hash on it, so any one-way function of the note will do.
        reality: It must be both uniquely determined by the note and uncorrelatable with its commitment; deriving it from the commitment links deposit to withdrawal.
        why: The double-spend requirement is obvious and the unlinkability requirement is not.
        source: aztec-docs

  - id: shielded-pool
    title: Shielded pool
    oneLine: One contract holds all deposited value, and a proof asserts "I own an unspent note in this tree worth X" without saying which.
    statement: >
      A shielded pool is the contract that custodies deposited value on behalf of everyone in it.
      Deposits append note commitments; withdrawals present a proof that the spender knows a note in the
      tree, that the note has not been nullified, and that the requested amount is consistent with it.
      The pool boundary is the privacy boundary: inside it, transfers are invisible; crossing it in
      either direction is a public event whose timing and amount are observable.
    volatility: stable
    edges:
      - { to: note-commitment-model, type: requires }
      - { to: nullifier, type: requires }
      - { to: zero-knowledge-property, type: requires }
      - { to: zk-rollups-are-not-zk, type: contrasts }
    sources: [aztec-docs, railgun-docs]

  - id: anonymity-set
    title: Anonymity is a liquidity property
    oneLine: Privacy is bounded by the set of participants you could plausibly be — a pool with a handful of users gives none, whatever the cryptography.
    statement: >
      A privacy proof hides which member of a set you are. Its value is therefore bounded by the size
      and homogeneity of that set, not by the strength of the cryptography. In a pool with a small
      number of deposits, or where your deposit is distinguishable by amount or timing, a perfect proof
      still leaves you identifiable. Anonymity is an economic and liquidity property that the protocol
      can encourage but cannot manufacture, and early-stage privacy systems routinely have anonymity
      sets small enough to make this decisive.
    volatility: evolving
    edges:
      - { to: shielded-pool, type: requires }
      - { to: zero-knowledge-property, type: contrasts }
      - { to: fixed-denominations, type: deepens }
    claimKind: empirical
    sources: [privacy-pools-paper, arxiv-ethereum-deanonymization]
    misconceptions:
      - belief: A zero-knowledge proof makes my transaction anonymous.
        reality: Anonymity is bounded by the anonymity set; with few participants and distinctive amounts or timing, the proof is perfect and the privacy is not.
        why: Cryptographic guarantees are absolute, statistical ones are not, and only the first is taught.
        source: privacy-pools-paper

  - id: fixed-denominations
    title: Fixed denominations
    oneLine: Early mixers used fixed deposit sizes because unique amounts destroy the anonymity set; variable-amount pools must hide amounts as well.
    statement: >
      If deposits and withdrawals carry arbitrary amounts, the amount itself identifies the
      transaction, and the anonymity set collapses to the deposits that happen to match. Fixed
      denominations were the earliest answer: everyone deposits the same size, so amounts carry no
      information. The alternative is to hide the amounts, and the shape of that alternative is
      specified rather than folkloric — a shielded protocol commits to each value homomorphically
      and then proves that inputs balance outputs by checking those commitments, so the balance
      property holds without any amount being revealed. That is a strictly harder construction for
      a strictly better user experience.
    volatility: stable
    edges:
      - { to: anonymity-set, type: requires }
      - { to: private-vs-public-inputs, type: requires }
    sources: [zcash-protocol-spec, privacy-pools-paper]

  - id: metadata-leakage
    title: Deanonymisation is a metadata problem
    oneLine: Timing, IP address, gas funding, RPC provider and the destination address deanonymise users far more often than any cryptographic weakness.
    statement: >
      Real deanonymisation of privacy-system users comes from around the cryptography rather than
      through it. Published academic work on Ethereum has linked mixing parties using exactly this
      class of signal — time-of-day activity patterns, transaction-fee behaviour, address reuse and
      other quasi-identifiers that characterise only a small set of users — without touching the
      proofs at all. Add to that the address that funded the withdrawing account's gas, the RPC
      endpoint and IP the transaction was submitted from, and withdrawal to an exchange account
      already tied to an identity. A threat model that stops at the proof is not a threat model, and
      the practical consequence is that operational discipline matters more to a user's privacy than
      the choice of proof system.
    volatility: stable
    edges:
      - { to: anonymity-set, type: requires }
      - { to: relayer, type: deepens }
    claimKind: empirical
    sources: [arxiv-ethereum-deanonymization, privacy-pools-paper]
    misconceptions:
      - belief: Deanonymisation happens by breaking the cryptography.
        reality: It happens through metadata — gas funding, timing correlation, network-level identifiers, address reuse and the destination account.
        why: The cryptography is the visible part of the system.
        source: privacy-pools-paper

  - id: relayer
    title: Relayer
    oneLine: A fresh withdrawal address has no gas, so a third party submits the transaction for a fee — solving one leak and introducing a censor.
    statement: >
      Withdrawing to a brand-new address creates a problem: that address has no ETH, and funding it
      from an address you control recreates exactly the link the pool was supposed to break. A relayer
      submits the withdrawal transaction on the user's behalf and takes its fee from the withdrawn
      amount. This removes the gas-funding leak and introduces a party that can censor withdrawals,
      sees the withdrawal before anyone else, and knows the destination. Sponsored-transaction
      mechanisms from the account-abstraction world address the same problem with different trust.
    volatility: evolving
    edges:
      - { to: metadata-leakage, type: requires }
      - { to: paymaster, type: contrasts }
    sources: [railgun-docs]

  - id: private-execution-vs-private-state
    title: Private state is not private execution
    oneLine: Hiding what state you touched is a different problem from hiding what code ran, and systems differ in which they conceal.
    statement: >
      Concealment comes in layers. A shielded pool hides balances and the deposit-to-withdrawal link
      while the contract logic remains entirely public. A privacy-first L2 additionally executes
      contract logic on the client, so which function ran and on which private state is also concealed,
      with only a proof and the public effects published. These are different products with different
      programming models: private execution means the developer writes contracts split across a private
      client-side part and a public chain-side part, which is not a configuration change.
    volatility: evolving
    edges:
      - { to: shielded-pool, type: requires }
      - { to: noirjs, type: requires }
      - { to: note-commitment-model, type: contrasts }
    sources: [aztec-docs]
    misconceptions:
      - belief: Privacy L2s are just rollups with encryption.
        reality: They change the state model — notes instead of balances, client-side execution, nullifier sets — and therefore change how contracts are written, not just how data is stored.
        why: '"Private L2" sounds like a configuration flag.'
        source: aztec-docs

  - id: viewing-key
    title: Viewing key
    oneLine: A key that lets a chosen party decrypt your history without gaining any authority to spend.
    statement: >
      A viewing key separates the ability to read from the ability to act. Handing it to an auditor, a
      counterparty, or a tax authority lets them decrypt the user's transaction history while granting
      no spend authority whatsoever. It is the simplest form of selective disclosure and the one most
      products reach for first. Its weakness is granularity: a viewing key typically reveals everything
      it covers, with no way to disclose one fact and withhold the rest.
    volatility: stable
    edges:
      - { to: shielded-pool, type: requires }
      - { to: keypair, type: requires }
      - { to: selective-disclosure, type: deepens }
    sources: [aztec-docs, railgun-docs]

  - id: selective-disclosure
    title: Selective disclosure
    oneLine: Prove a predicate about your history instead of revealing it — the compliance story that zero-knowledge systems actually offer.
    statement: >
      Rather than surrendering a history, a user proves a specific statement about it: that funds did
      not originate from a listed source, that a threshold was not exceeded, that tax owed was paid,
      that the holder is over an age. The verifier learns the predicate's truth and nothing else, and
      no party holds a master key. This inverts the usual framing of the privacy-compliance debate,
      because the disclosure is voluntary, specific, and initiated by the user rather than compelled
      by a key holder.
    volatility: evolving
    edges:
      - { to: viewing-key, type: requires }
      - { to: proof-system-relation, type: requires }
      - { to: zero-knowledge-property, type: requires }
    sources: [privacy-pools-paper, railgun-docs]
    misconceptions:
      - belief: Compliance requires a backdoor.
        reality: Selective disclosure inverts it — the user proves a predicate voluntarily and nobody holds a master key.
        why: The privacy-versus-compliance debate is usually framed as binary.
        source: privacy-pools-paper

  - id: association-set
    title: Association sets
    oneLine: Prove membership in a curated subset of deposits, so honest users can voluntarily exclude themselves from tainted funds.
    statement: >
      In the Privacy Pools design, a user proves membership not in the full deposit set but in a chosen
      subset curated by an Association Set Provider. The proof still hides which deposit is theirs
      within that subset, while establishing that the funds came from within it. The deployed
      implementation makes the shape concrete: an ASP layer maintains the current set of approved
      deposit labels as a distinct layer alongside the pool contracts and the withdrawal circuit, and
      withdrawal proofs are checked against it. Reported usage figures are small and dated, and should
      be checked rather than quoted, because their smallness is itself the anonymity-set lesson.
    volatility: hot
    edges:
      - { to: selective-disclosure, type: requires }
      - { to: anonymity-set, type: requires }
    sources: [privacy-pools-docs, privacy-pools-paper, theblock-privacy-pools]

  - id: privacy-compliance-equilibrium
    title: The practical equilibrium argument
    oneLine: If honest users can cheaply prove separation from illicit deposits, they will — leaving bad actors in a small and conspicuous set.
    statement: >
      The argument behind association sets is a game-theoretic one rather than a cryptographic one, and
      it is one paper's argument rather than a finding: the 2023 Privacy Pools paper reasons that if
      excluding yourself from tainted deposits is cheap and the resulting proof is what counterparties
      accept, honest users will do it voluntarily, so illicit funds concentrate in whatever remains,
      which is both small and visible. Its authors claim this yields privacy and compliance
      simultaneously with no backdoor. Attribute it that way. Nothing here has been shown to happen at
      scale on a deployed pool - this concept rests on a single source, and deliberately so, because
      what it describes is an argument rather than an observation. A second source could only corroborate
      that the argument was made, not that the equilibrium holds.
    volatility: hot
    edges:
      - { to: association-set, type: requires }
      - { to: mechanism-design, type: requires }
    claimKind: empirical
    sources: [privacy-pools-paper]

  - id: asp-centralisation-risk
    title: The curator is a trusted party
    oneLine: Whoever decides which deposits count as clean holds de-facto censorship power, with no cryptographic constraint on their judgement.
    statement: >
      An association set provider decides who is included, and nothing in the cryptography constrains
      that decision. The deployed protocol says so in its own architecture: the ASP layer maintains the
      approved-deposit set and updates that state through authorised accounts, and the Entrypoint that
      coordinates the pools is an upgradeable contract. That is a centralised, censorable curator by
      construction — it can exclude a lawful user, it depends on upstream list data of unexamined
      provenance, and it can be compelled. Association sets therefore move the trust problem from a key
      holder to a list curator rather than removing it. A full trust inventory for such a system names
      at least the curator, the source of its list data, the upgrade authority, and the relayer.
    volatility: hot
    edges:
      - { to: association-set, type: requires }
      - { to: privacy-compliance-equilibrium, type: contrasts }
    sources: [privacy-pools-docs, privacy-pools-paper, theblock-privacy-pools]
    misconceptions:
      - belief: Association sets make privacy pools trustlessly compliant.
        reality: A provider decides who is clean — a centralised, censorable role with no cryptographic constraint on its judgement.
        why: The proof looks like the whole mechanism.
        source: theblock-privacy-pools

  - id: developer-liability-risk
    title: Shipping privacy software carries legal exposure
    oneLine: Sanctions status and criminal liability are two separate stories, and the second one is not resolved.
    statement: >
      Publishing privacy software has produced real criminal exposure in the United States, and the
      two threads must not be collapsed. On the sanctions side, the Treasury's Office of Foreign
      Assets Control published a cyber-related designation removal dated 21 March 2025 deleting
      Tornado Cash and its associated digital-currency addresses from the Specially Designated
      Nationals list, following an appellate decision holding that immutable smart contracts are not
      property of a sanctioned person. Separately, a criminal
      prosecution of a developer produced a split verdict in August 2025 — conviction on conspiracy to
      operate an unlicensed money transmitting business, with the jury hung on the remaining counts —
      and the subsequent procedural status is unresolved as of this writing, so do not state an
      outcome. Delisting did not make writing this software legally safe.
    volatility: hot
    edges:
      - { to: shielded-pool, type: requires }
      - { to: relayer, type: requires }
    sources: [ofac-tornado-delisting, venable-tornado-delisting, mayer-brown-tornado-verdict, defi-education-fund-storm-2026]
    misconceptions:
      - belief: Tornado Cash is OFAC-sanctioned.
        reality: The contract addresses were delisted on 21 March 2025 after the Van Loon appellate decision.
        why: The 2022 designation was heavily covered; the 2025 reversal was not.
        source: venable-tornado-delisting
      - belief: The sanctions being lifted means writing privacy software is legally safe.
        reality: A separate criminal prosecution produced a conviction on unlicensed money transmission and unresolved remaining counts. Sanctions law and money-transmission law are different exposures.
        why: Both stories involve the same protocol, so coverage of one reads as resolution of the other.
        source: mayer-brown-tornado-verdict
      - belief: You need privacy technology only for illicit use.
        reality: Salary payments, treasury operations, trading intent and asset transfers all have ordinary confidentiality requirements that a public ledger cannot meet.
        why: Coverage of these systems is dominated by enforcement stories.
        source: theblock-pragmatic-privacy
