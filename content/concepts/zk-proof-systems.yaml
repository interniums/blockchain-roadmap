moduleId: zk-proof-systems
concepts:
  - id: proof-system-relation
    title: Statement, witness, relation
    oneLine: A proof system proves membership in a relation R(x, w) — public statement x, secret witness w.
    statement: >
      Every proof system is defined over a relation R. The verifier holds the public statement x; the
      prover claims to know a witness w such that R(x, w) holds, and convinces the verifier of exactly
      that claim and nothing more. Naming x and w precisely is the first design step of any ZK feature,
      because everything downstream — what leaks, what is bound on-chain, what an attacker can choose —
      follows from which values sit on which side of that line.
    volatility: stable
    edges:
      - { to: hash-function, type: requires }
      - { to: argument-of-knowledge, type: deepens }
      - { to: private-vs-public-inputs, type: applies }
    sources: [sok-zk-snarks-arxiv, ethereum-org-zkevm-roadmap]

  - id: argument-of-knowledge
    title: Argument of knowledge, not proof
    oneLine: Soundness holds only against computationally bounded provers, and only up to the system's claimed security bits.
    statement: >
      SNARKs and STARKs are arguments, not proofs in the information-theoretic sense: a prover with
      unbounded computation could forge one. "Of knowledge" means a successful prover must in principle
      have a witness that could be extracted from it. The practical consequence is that every deployed
      system has a security level in bits, and those levels differ. The Ethereum Foundation's 2026
      zkEVM programme made this explicit by requiring provable rather than conjectured security bits
      and by publishing a tool for computing them; conjectured-security claims that passed as normal
      marketing in 2023 and 2024 are no longer acceptable for L1-facing systems.
    volatility: evolving
    edges:
      - { to: proof-system-relation, type: requires }
      - { to: non-interactivity-fiat-shamir, type: deepens }
    sources: [ef-zkevm-security-foundations, sok-zk-snarks-arxiv]
    misconceptions:
      - belief: A SNARK proves the computation is correct, absolutely.
        reality: It is an argument — soundness holds only against computationally bounded adversaries and only up to the claimed security bits, which several deployed systems set below 128.
        why: The word "proof" is in the name, and conjectured versus provable security was rarely distinguished before 2026.
        source: ef-zkevm-security-foundations

  - id: succinctness
    title: Succinctness
    oneLine: Proof size and verification time are sublinear in the size of the computation being proved.
    statement: >
      Succinct means the verifier's work — and the proof it must read — grows far more slowly than the
      computation being proved, in practice near-constant or polylogarithmic. This is the property that
      lets an L1 contract accept the result of a computation it could never afford to run. It is
      independent of privacy: a fully public computation can be proved succinctly, and most are.
    volatility: stable
    edges:
      - { to: proof-system-relation, type: requires }
      - { to: zero-knowledge-property, type: contrasts }
      - { to: verify-vs-reexecute, type: applies }
    sources: [ethereum-org-zkevm-roadmap, ef-realtime-proving]

  - id: zero-knowledge-property
    title: Zero-knowledge is an optional add-on
    oneLine: Zero-knowledge means the proof reveals nothing about the witness beyond the truth of the statement — and it is orthogonal to succinctness.
    statement: >
      A proof is zero-knowledge when a verifier learns nothing from it beyond the fact that the
      statement is true — formally, when the proof could have been simulated without the witness.
      Zero-knowledge is achieved by blinding the witness inside the protocol, and it is orthogonal to
      succinctness: systems exist that are succinct without being zero-knowledge, and the overwhelming
      majority of production deployments on Ethereum are exactly that.
    volatility: stable
    edges:
      - { to: proof-system-relation, type: requires }
      - { to: succinctness, type: contrasts }
      - { to: shielded-pool, type: applies }
    sources: [ethereum-org-zkevm-roadmap, sok-zk-snarks-arxiv]

  - id: zk-rollups-are-not-zk
    title: '"ZK rollups" are validity rollups'
    oneLine: Production ZK rollups publish all transaction data and use only succinctness; they are compression, not privacy.
    statement: >
      A production "ZK rollup" posts its transaction data publicly and proves that its state transition
      followed the rules. It uses succinctness for compression and does not use the zero-knowledge
      property at all — anyone can read every transaction. The accurate name is validity rollup. The
      exceptions are the handful of systems explicitly built for private state, which change the state
      model rather than just adding a proof.
    volatility: stable
    edges:
      - { to: succinctness, type: requires }
      - { to: zero-knowledge-property, type: requires }
      - { to: validity-proof, type: applies }
      - { to: shielded-pool, type: contrasts }
    sources: [ethereum-org-zkevm-roadmap]
    misconceptions:
      - belief: ZK rollups are private.
        reality: Production validity rollups publish all transaction data; only succinctness is used, not zero-knowledge.
        why: The marketing name "ZK rollup" conflates two independent properties.
        source: ethereum-org-zkevm-roadmap

  - id: arithmetization
    title: Arithmetization
    oneLine: Turning a computation into polynomial constraints over a finite field — the step where most engineering effort and most bugs live.
    statement: >
      Before anything can be proved, the computation is re-expressed as algebraic constraints over a
      finite field: R1CS, PLONKish gates, or an AIR trace table. The proof system then proves that a
      satisfying assignment to those constraints exists. This translation is where the semantics of the
      original program can silently diverge from the semantics of the constraint system, which is why
      arithmetization is both the largest engineering surface and the largest bug surface in the stack.
      Different zkEVMs arithmetize identical EVM semantics in materially different ways.
    volatility: evolving
    edges:
      - { to: proof-system-relation, type: requires }
      - { to: everything-is-a-constraint, type: deepens }
      - { to: acir, type: applies }
    sources: [ef-zkevm-security-foundations, zkevm-constraint-design-arxiv]

  - id: non-interactivity-fiat-shamir
    title: Fiat–Shamir
    oneLine: Replace the verifier's random challenges with hashes of the transcript so far — and hash the whole transcript, or the system is unsound.
    statement: >
      Interactive proof protocols are made non-interactive by the Fiat–Shamir transform: wherever the
      verifier would have sent fresh randomness, the prover instead derives the challenge by hashing
      the transcript up to that point, so the hash function stands in for an honest verifier. What
      goes into that hash is normative, not cosmetic. The standardised non-interactive Schnorr proof
      fixes the challenge as a hash over the generator, the prover's commitment, a unique prover
      identifier and further contextual data, and its security considerations require exactly that
      binding — replay is prevented by the identifier being in the hash, and other contextual values
      must be included whenever the surrounding protocol makes them attackable. Omitting a
      prover-controlled or context-fixing value from the hashed transcript is therefore a soundness
      failure, and it is a recurring real-world implementation bug rather than a theoretical one.
    volatility: stable
    edges:
      - { to: argument-of-knowledge, type: requires }
      - { to: hash-function, type: requires }
      - { to: domain-separated-hashing, type: applies }
    sources: [rfc-8235, sok-zk-snarks-arxiv]
    misconceptions:
      - belief: Fiat–Shamir is a mechanical step with no security content.
        reality: It is a soundness-critical step; a transcript that omits any prover-chosen value lets the prover search for a favourable challenge.
        why: It appears in write-ups as a one-line transformation with no failure mode attached.
        source: sok-zk-snarks-arxiv

  - id: trusted-setup
    title: Trusted setup
    oneLine: Public parameters generated from secret randomness; whoever keeps the secret can forge proofs.
    statement: >
      Pairing-based SNARKs need public parameters — a structured reference string — derived from secret
      randomness. Anyone retaining that secret, the "toxic waste", can produce convincing proofs of
      false statements. The mitigation is a multi-party ceremony in which each participant mixes in
      their own secret and destroys it: the result is safe if at least one participant was honest,
      which is why the trust assumption is one-of-N rather than trust-a-party.
    volatility: stable
    edges:
      - { to: succinctness, type: requires }
      - { to: transparent-setup, type: contrasts }
      - { to: structured-reference-string, type: deepens }
      - { to: powers-of-tau-ceremony, type: deepens }
    sources: [kzg-ceremony-faq, kzg-ceremony-specs]
    misconceptions:
      - belief: Trusted setup means there is one party you have to trust.
        reality: Modern ceremonies are multi-party and one-of-N honest — a single participant who deleted their contribution makes the parameters safe.
        why: The phrase "trusted setup" implies a trusted party.
        source: kzg-ceremony-faq

  - id: universal-vs-circuit-specific-setup
    title: Universal versus circuit-specific setup
    oneLine: Groth16 needs a fresh ceremony per circuit; PLONK-style systems reuse one universal, updatable SRS for any circuit up to a size bound.
    statement: >
      Setups differ in how much they bind. A circuit-specific setup, as Groth16 uses, produces
      parameters tied to one constraint system, so changing the circuit means running a new ceremony.
      A universal setup produces one structured reference string usable by any circuit up to a degree
      bound, and it is updatable: new participants can extend it later, preserving the one-of-N
      argument. This is an operational property, not a cryptographic nicety — it decides whether
      shipping a circuit change means re-running a ceremony.
    volatility: stable
    edges:
      - { to: trusted-setup, type: requires }
      - { to: transparent-setup, type: contrasts }
      - { to: structured-reference-string, type: deepens }
    sources: [gnark-schemes-curves, kzg-ceremony-specs]

  - id: transparent-setup
    title: Transparent setup
    oneLine: STARK and FRI-based systems need no secret; their randomness is publicly derivable, and they rest only on hash assumptions.
    statement: >
      A transparent system has no setup secret at all: every parameter is publicly derivable, so there
      is no toxic waste and no ceremony to organise. Because such systems rest only on the security of
      a hash function rather than on a discrete-log or pairing assumption, they are plausibly
      post-quantum. This is the structural reason Ethereum's long-run roadmap drifts toward hash-only
      assumptions and away from pairing-based setups.
    volatility: evolving
    edges:
      - { to: trusted-setup, type: contrasts }
      - { to: hash-function, type: requires }
      - { to: pairing-and-post-quantum, type: deepens }
    sources: [ethereum-org-quantum-resistance]
    misconceptions:
      - belief: STARKs are strictly better because they need no trusted setup.
        reality: They trade the setup away for much larger proofs and higher verification cost, which is why nearly everyone wraps a STARK in a SNARK before touching L1.
        why: Transparency is easy to explain and market; the proof-size cost is not.
        source: ef-realtime-proving

  - id: proof-size-verify-cost-tradeoff
    title: Proof size versus setup, and the wrapping pattern
    oneLine: Small pairing-based proofs are cheapest to verify but need a setup; transparent proofs need none but are far larger — so production does both.
    statement: >
      Pairing-based SNARK proofs are a few hundred bytes and the cheapest thing to verify on-chain, at
      the cost of a trusted setup. Transparent hash-based proofs need no setup but run to tens or
      hundreds of kilobytes, which is expensive to post and verify on L1. The standard production shape
      is therefore a pipeline rather than a single system: prove the bulk of the work with a transparent
      STARK, then recursively wrap the result in a small pairing-based SNARK purely so that the final
      on-chain verification is cheap.
    volatility: evolving
    edges:
      - { to: succinctness, type: requires }
      - { to: transparent-setup, type: requires }
      - { to: recursion, type: requires }
      - { to: groth16-verifier-cost, type: applies }
    sources: [ef-realtime-proving]

  - id: prover-verifier-asymmetry
    title: The prover/verifier asymmetry is the whole economic point
    oneLine: Proving is orders of magnitude more expensive than the original computation; verification is cheap and roughly constant.
    statement: >
      The economics of every proof system come from one asymmetry: the prover pays a large multiple of
      the original computation's cost, once, while every verifier pays a small and roughly constant
      cost. The overhead multiple is an order-of-magnitude intuition rather than a measured constant —
      it varies by system, workload and hardware, and no uniform 2026 benchmark across systems exists.
      Whenever you see a proving-time or proving-cost figure, insist on its unit and its machine.
    volatility: evolving
    edges:
      - { to: succinctness, type: requires }
      - { to: proof-vs-execution-cost, type: deepens }
      - { to: verify-vs-reexecute, type: applies }
    sources: [ef-realtime-proving]
    misconceptions:
      - belief: Proving is roughly as expensive as running the code.
        reality: Proving carries orders-of-magnitude overhead; the design point is that you pay it once, off-chain, so that many parties verify cheaply.
        why: Real-time-proving headlines hide the hardware footprint behind them.
        source: ef-realtime-proving

  - id: recursion
    title: Recursion
    oneLine: Express a verifier as a circuit, and one proof can attest that other proofs verified.
    statement: >
      If the verification algorithm is itself arithmetized, a proof can assert "I checked these other
      proofs and they were valid". That single move gives constant-size proofs over unbounded
      computation, incremental proving as new work arrives, and parallel distributed proving where
      many machines prove fragments that are then folded together. It is also the mechanism behind the
      STARK-then-SNARK wrapping pattern.
    volatility: evolving
    edges:
      - { to: arithmetization, type: requires }
      - { to: argument-of-knowledge, type: requires }
      - { to: proof-aggregation, type: deepens }
    sources: [ef-zkevm-security-foundations]

  - id: proof-aggregation
    title: Aggregation
    oneLine: Batching many independent proofs into one verification; recursion is the general mechanism, aggregation is the specific use.
    statement: >
      Aggregation combines many independent proofs so that a verifier checks once instead of N times,
      amortising on-chain verification cost across the batch. Recursion is the general capability that
      makes it possible, but aggregation is not synonymous with recursion: some designs batch without
      full recursive verification, for example by batching low-degree tests. Aggregation always buys
      gas with latency, because the batch has to fill before it can be proved.
    volatility: evolving
    edges:
      - { to: recursion, type: requires }
      - { to: batch-pairing-check, type: contrasts }
      - { to: aggregation-layer, type: applies }
    sources: [ef-zkevm-security-foundations]
    misconceptions:
      - belief: Recursion and aggregation are the same thing.
        reality: Recursion is the general capability of verifying a proof inside a circuit; aggregation is one application of it, and can also be achieved without full recursion.
        why: Both reduce to "many proofs become one" in casual explanation.
        source: ef-zkevm-security-foundations

  - id: zkvm-vs-circuit
    title: zkVM versus hand-written circuit
    oneLine: A zkVM proves a general VM's execution trace; a circuit encodes one relation with far fewer constraints and far more expert effort.
    statement: >
      A zkVM arithmetizes the instruction set of a general-purpose machine once, so any program
      compiled for that machine becomes provable — you pay for the generality in constraints per useful
      operation. A hand-written circuit arithmetizes exactly one relation, which removes that overhead
      but requires the author to reason directly in constraints and to get every soundness check right
      by hand. The trade is generality and blast-radius against constraint count.
    volatility: evolving
    edges:
      - { to: arithmetization, type: requires }
      - { to: zkvm, type: requires }
      - { to: circuit-vs-zkvm-tradeoff, type: deepens }
    sources: [succinct-sp1-docs, noir-docs-quickstart]
