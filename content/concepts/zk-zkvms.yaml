moduleId: zk-zkvms
concepts:
  - id: zkvm
    title: zkVM
    oneLine: A machine that proves a program executed correctly, so you write ordinary Rust instead of a circuit.
    statement: >
      A zkVM is a virtual machine whose execution can be proved. You compile an ordinary program —
      in practice Rust, targeting RISC-V in both SP1 and RISC Zero — run it on real inputs, and the
      prover emits a proof that this program, on these public inputs, produced this output. The
      verifier checks the proof without re-running the program and without seeing the private inputs.
      The point is that the constraint system is written once, by the zkVM authors, for the VM's
      instruction set; the application developer never writes constraints.
    volatility: evolving
    edges:
      - { to: commitment, type: requires }
      - { to: hash-function, type: requires }
      - { to: zkvm-vs-circuit, type: deepens }
      - { to: arithmetization, type: deepens }
    sources: [sp1-repo, succinct-sp1-docs]
    misconceptions:
      - belief: Using zero-knowledge proofs means learning circuit programming.
        reality: The 2026 mainstream path is a zkVM that takes ordinary Rust; circuits are a specialisation you descend into later.
        why: Circuit-first pedagogy predates viable zkVMs, and most tutorials were written before 2023.
        source: succinct-sp1-docs
      - belief: Zero-knowledge means the computation is private.
        reality: In zkVM deployments the property being bought is almost always succinctness, not privacy — most proved computations are entirely public.
        why: The name "zero-knowledge" is applied to the whole field, including systems that use none of it.
        source: ethereum-org-zkevm-roadmap

  - id: guest-program
    title: Guest program
    oneLine: The code whose execution is proved, compiled to the zkVM's instruction set rather than to your host machine.
    statement: >
      The guest program is the code inside the proof boundary. It is compiled to the zkVM's target
      architecture (RISC-V for both SP1 and RISC Zero), reads its inputs from the zkVM's input stream
      rather than from argv or the network, and commits its public outputs explicitly. Everything the
      guest reads that is not committed publicly is a private witness. The host program — ordinary
      code on your machine — supplies inputs, invokes the prover, and receives the proof plus the
      committed public values.
    volatility: evolving
    edges:
      - { to: zkvm, type: requires }
      - { to: private-vs-public-inputs, type: deepens }
    sources: [succinct-sp1-docs, sp1-repo]
    misconceptions:
      - belief: A guest program can call out to the network, read files, or use system time.
        reality: Anything not fed in through the zkVM's input stream cannot be proved; non-determinism must be passed in as a witness and then constrained.
        why: The guest is written in ordinary Rust, so the standard library's shape suggests the standard library's capabilities.
        source: succinct-sp1-docs

  - id: proof-vs-execution-cost
    title: Proving costs far more than executing
    oneLine: Proving a computation is orders of magnitude more expensive than running it; the saving is entirely on the verifier's side.
    statement: >
      Producing a proof carries a large multiple of the cost of simply executing the program — an
      order-of-magnitude intuition, not a benchmark, and the multiple has fallen sharply for zkVMs
      without disappearing. Verification, by contrast, is cheap and roughly constant in the size of
      the proved computation. Proof systems are therefore never a way to make computation cheaper;
      they are a way to move a cost from many verifiers to one prover. The design question is always
      whether the verification savings, multiplied by the number of verifiers, exceed the proving
      cost paid once.
    volatility: evolving
    edges:
      - { to: zkvm, type: requires }
      - { to: prover-verifier-asymmetry, type: deepens }
      - { to: verify-vs-reexecute, type: deepens }
    sources: [ef-realtime-proving]
    misconceptions:
      - belief: ZK proofs make computation cheaper.
        reality: Proving is far more expensive than executing. The saving is in verification, paid once on-chain for arbitrarily large off-chain work.
        why: '"Succinct" and "cheap to verify" get compressed into "cheap".'
        source: ef-realtime-proving
      - belief: Real-time proving means proving is now nearly free.
        reality: Published real-time-proving results are stated together with a hardware and power budget — a rack of GPUs, not a laptop. The headline hides the footprint.
        why: Latency figures are reported without the machine that produced them.
        source: ef-realtime-proving

  - id: onchain-verification
    title: On-chain verification is what makes off-chain work trustworthy
    oneLine: An L1 contract checks the proof, so a chain can accept the result of a computation it never ran.
    statement: >
      A zkVM proof only matters on-chain because a contract can check it. The verifier is deployed
      code that takes the proof plus its public values and returns true or false; a calling contract
      then acts on that boolean. This is what converts "I ran something off-chain" into a statement
      the chain will act on, and it is the reason every design decision in this track eventually
      lands on proof size and verification gas.
    volatility: stable
    edges:
      - { to: zkvm, type: requires }
      - { to: verifier-contract, type: deepens }
      - { to: validity-proof, type: applies }
    sources: [succinct-sp1-docs, ethereum-org-zkevm-roadmap]
    misconceptions:
      - belief: If the on-chain verifier returns true, the requested action is authorised.
        reality: Verification says only that a witness exists for the given public inputs. Binding those inputs to the intended state, and preventing replay, is the caller's job.
        why: A boolean return from a contract named "verifier" reads like an access-control check.
        source: eip-8079

  - id: sp1
    title: SP1
    oneLine: Succinct's RISC-V zkVM, the most common starting point for proving Rust in 2026.
    statement: >
      SP1 is an open-source zkVM from Succinct that proves RISC-V execution and has been audited by
      multiple independent firms. It compiles ordinary Rust guest programs, supports proving on CPU
      as well as GPU, and emits proofs that can be wrapped for cheap on-chain verification. It is the
      default reference implementation used throughout this track because its toolchain runs without
      specialised hardware.
    volatility: evolving
    edges:
      - { to: zkvm, type: requires }
      - { to: risc-zero, type: contrasts }
    sources: [sp1-repo, succinct-sp1-docs]

  - id: risc-zero
    title: RISC Zero
    oneLine: The other production RISC-V zkVM, with its own proof system and the option to buy proving from a marketplace instead of owning hardware.
    statement: >
      RISC Zero is an independent zkVM that proves correct execution of arbitrary Rust: the guest
      program compiles to an ELF binary, an executor records the run, and a prover turns that into a
      receipt anyone can verify against an ImageID identifying the expected binary. Proofs can be
      generated on your own machines or requested from Boundless, a proving marketplace where
      permissionless provers produce them on your behalf — so the hardware question is a purchasing
      decision as much as an engineering one. It targets the same developer experience as SP1 — Rust
      in, proof out — but differs in proof system, memory behaviour on large programs, and hardware
      expectations. Treat the pair as two implementations of one interface, and choose between them
      by measurement rather than by published comparison.
    volatility: evolving
    edges:
      - { to: zkvm, type: requires }
      - { to: sp1, type: contrasts }
    sources: [risc0-zkvm-docs, theblock-risc-zero-production]

  - id: sp1-hypercube
    title: SP1 Hypercube and real-time block proving
    oneLine: The multilinear-proof-system generation of SP1, reported to prove most Ethereum blocks within seconds on a GPU cluster.
    statement: >
      SP1 Hypercube is the generation of SP1 that moved from univariate STARKs over Plonky3-style AIRs
      to a multilinear, sumcheck-based polynomial IOP. Succinct reports proving the large majority of
      Ethereum mainnet blocks in under twelve seconds. The hardware is the part usually dropped: the
      announcement post puts a cluster capable of real-time proving over 90% of mainnet blocks at
      ~160 RTX 4090 GPUs, buildable for ~$300-400k. The exact percentage differs between Succinct's
      own posts and between hardware configurations, so state the hardware and the source post rather
      than a single figure. The
      Ethereum Foundation's stated bar for an L1 zkEVM is expressed the same way — a latency target,
      a proof-size ceiling, and explicit hardware and power budgets — because a proving time without
      a machine attached is not a number.
    volatility: hot
    edges:
      - { to: sp1, type: requires }
      - { to: proof-vs-execution-cost, type: deepens }
    sources: [succinct-sp1-hypercube, ef-realtime-proving]
    misconceptions:
      - belief: Published zkVM block-proving percentages are a single settled number.
        reality: Succinct's own posts report different percentages at different latency thresholds and hardware counts; the figure is under-specified unless the machine and the post are named.
        why: Headlines quote the percentage and drop the hardware.
        source: succinct-sp1-hypercube

  - id: cpu-vs-gpu-proving
    title: The hardware requirement drives the cost gap
    oneLine: Whether a prover runs acceptably on CPU or wants GPUs is a first-order driver of delivered cost and latency, and the vendors say so themselves.
    statement: >
      Two zkVMs with similar asymptotics can differ by a large factor in delivered cost because of
      where they run. This is not a subtle effect the vendors hide: SP1's own documentation states
      that CUDA acceleration on Nvidia GPUs gives dramatically better latency and cost than the CPU
      prover even when the CPU has AVX512, and RISC Zero's documentation offers buying proofs from a
      marketplace as an alternative to owning the hardware at all. So the practical question about a
      zkVM is what machine it needs to hit your latency, and whether you intend to own that machine.
      Per-proof dollar figures circulating for these systems are vendor-adjacent, undated and
      workload-specific; do not carry them across workloads. Re-measure on your own guest program and
      report wall-clock seconds, peak RAM in gigabytes, proof size in bytes, and cost in dollars, each
      with its unit and its hardware.
    volatility: hot
    edges:
      - { to: sp1, type: requires }
      - { to: risc-zero, type: requires }
      - { to: proving-cost-not-gas-cost, type: deepens }
    sources: [sp1-docs-hardware-acceleration, risc0-zkvm-docs, sp1-repo]
    misconceptions:
      - belief: Published zkVM benchmarks settle which prover to use.
        reality: Results vary by workload, and the CPU-versus-GPU requirement usually dominates real cost more than the algorithmic difference does.
        why: Benchmarks are published by the parties being compared, on programs they chose.
        source: succinct-sp1-hypercube

  - id: circuits-are-the-descent
    title: Circuits are the descent, not the entrance
    oneLine: Hand-written circuits are what you go down to when you need to know why the proof is small — not where a 2026 learner starts.
    statement: >
      A hand-written circuit encodes one specific relation directly as constraints. It can be far
      cheaper to prove than the same logic inside a zkVM, and it demands expert effort and carries a
      much sharper failure mode. In 2026 the correct default for general computation is a zkVM;
      circuits earn their cost for small, fixed predicates that are proved constantly. This track is
      sequenced accordingly: you get a proof working first, then descend into proof systems,
      commitments, curves, and circuits in order to answer the question the first module raises —
      why is the proof small, and what is it actually resting on?
    volatility: stable
    edges:
      - { to: zkvm, type: requires }
      - { to: proof-vs-execution-cost, type: requires }
      - { to: circuit-vs-zkvm-tradeoff, type: deepens }
      - { to: when-circuit-wins, type: deepens }
    sources: [noir-docs-quickstart, succinct-sp1-docs]
    misconceptions:
      - belief: You should hand-write circuits for anything involving proofs.
        reality: For general computation a zkVM is the correct default; circuits pay off for small, hot, fixed predicates.
        why: Circuit-first pedagogy predates viable zkVMs and still dominates older course material.
        source: succinct-sp1-hypercube
