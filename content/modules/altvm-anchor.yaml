id: altvm-anchor
trackId: altvm
order: 3
title: Anchor, and the checks it writes for you
summary: >
  Solidity gives you `msg.sender`, a type system over storage, and a compiler that will not let you read a
  Vault as a Config. Raw Solana gives you a byte buffer and a list of accounts an attacker chose. Anchor
  exists to close that gap: three macros that generate, at compile time, the on-chain checks a Solana program
  would otherwise have to write by hand - owner, discriminator, signer, seed derivation, relational
  constraints. This module reads those macros as what they are, generated `if` statements that burn compute
  units, and treats the IDL as Solana's ABI, including the ways it can under-describe a program and produce a
  silently wrong client. It ends on cost: what the convenience is measured in, and how to test without a
  validator.
layout: { lane: left, row: 1203 }
teaches:
