reflectionPrompt: >
  For one product you would actually build, compare three deployment shapes - a contract on a shared L1, a
  rollup, and a sovereign appchain - along four axes: who provides security and what it costs, who controls
  upgrades, what the fee token is, and how long until launch. Then name the single assumption that, if it
  turned out false, would flip your answer.
