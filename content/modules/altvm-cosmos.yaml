id: altvm-cosmos
trackId: altvm
order: 8
title: Cosmos, where the app is the chain
status: stub
summary: >
  Everything else in this track is about the machine that runs your code on somebody else's chain. Cosmos
  argues you should not be renting block space at all: build your application as a state machine, compile it
  into its own chain, and get your own fee token, validator set, upgrade schedule and full block space. The
  price is that you now have to bootstrap security, which is the exact weakness rollups exist to avoid. This
  is a stub node covering the argument, the three-layer stack, and IBC - which is not a bridge with a
  committee but a light client of the counterparty, and is the most transferable idea in the ecosystem. A
  full treatment would need its own research pass.
