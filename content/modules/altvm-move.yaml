id: altvm-move
trackId: altvm
order: 7
title: Move, where the asset is a type
summary: >
  Solidity represents a token as a number in a mapping, and every safety property about that number is a
  property of the code you wrote around it. Move takes the opposite route: a resource is a type the compiler
  refuses to copy or silently discard, so "you cannot duplicate an asset" is checked at compile time and
  re-checked by a bytecode verifier at deployment. Four lessons, scoped to what pays off immediately for an
  engineer arriving from the EVM: that Move is two diverging languages, and that Solana, Aptos and Sui
  parallelise by three genuinely different mechanisms. Move as a language would need its own track; this is
  the comparison, and the practice is where you build all three schedulers and watch them fail differently.
layout: { lane: left, row: 1207 }
teaches:
  - move-origin
  - move-resources-are-linear
  - move-abilities
  - move-bytecode-verifier
  - move-two-dialects
