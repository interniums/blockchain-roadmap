reflectionPrompt: >
  Solana asks the developer to declare access, Aptos executes optimistically and re-runs the losers, Sui
  partitions by object ownership and skips consensus where it can. Pick one workload - a popular NFT mint, or
  a single AMM pool everyone is trading against - and write down what each of the three does under that
  contention, and which failure the user actually experiences in each case.
