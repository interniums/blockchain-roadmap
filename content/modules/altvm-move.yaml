id: altvm-move
trackId: altvm
order: 7
title: Move, where the asset is a type
status: stub
summary: >
  Solidity represents a token as a number in a mapping, and every safety property about that number is a
  property of the code you wrote around it. Move takes the opposite route: a resource is a type the compiler
  refuses to copy or silently discard, so "you cannot duplicate an asset" is checked at compile time and
  re-checked by a bytecode verifier at deployment. This is a stub node - enough to orient an engineer coming
  from the EVM and to make the one comparison that pays off immediately, which is that Move is two diverging
  languages and that Solana, Aptos and Sui parallelise by three genuinely different mechanisms. A full
  treatment would need its own track.
layout: { lane: left, row: 1207 }
