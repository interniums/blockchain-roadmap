reflectionPrompt: >
  Take an application you know - a DEX, a lending market, a mint - and identify the single account that every
  user's transaction must write. Given a 12M compute-unit ceiling on that one account per block, how many
  users per block can it serve? Then write down what you would change in the data model to remove that
  account from the write path, and what you would lose by doing so.
