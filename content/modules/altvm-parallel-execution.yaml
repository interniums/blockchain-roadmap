id: altvm-parallel-execution
trackId: altvm
order: 2
title: Locks instead of retries
summary: >
  Ethereum executes a block one transaction at a time and prices state access by how warm it is. Solana takes
  reader/writer locks derived from each transaction's declared account list and runs everything that does not
  overlap at once - pessimistically, with no abort-and-retry anywhere in the design. This module works
  through what that buys, what it costs, and the fee market that falls out of it: compute units you pay for
  by request rather than by consumption, a 12M compute-unit ceiling under every single writable account, and
  local fee markets that are real but leakier than the slogan. It closes on the failure mode EVM developers
  consistently misread - a transaction that never landed at all is not a transaction that reverted.
layout: { lane: left, row: 1202 }
teaches:
