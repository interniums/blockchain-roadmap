id: altvm-pinocchio
trackId: altvm
order: 4
title: Pinocchio, and what the framework was costing
summary: >
  Solidity developers optimise gas inside their own logic. The largest saving available on Solana was not in
  anyone's logic at all - it was the fixed cost of deserializing the runtime's input buffer on every single
  invocation. Pinocchio removes that by treating accounts as pointers into the buffer instead of values
  copied out of it, and by letting a program drop the allocator and panic handler it never needed. This
  module follows the idea to its conclusion: p-token, the SPL Token program rewritten this way, cutting a
  transfer from thousands of compute units to about a hundred, and swapped in behind the same address so
  every existing caller got the saving without changing a line. It ends on the decision itself - who should
  write Pinocchio, and what they give up.
layout: { lane: left, row: 1204 }
