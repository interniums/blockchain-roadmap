reflectionPrompt: >
  p-token's saving came almost entirely from framework overhead rather than from program logic, and it
  reached every user without any of them changing code. Where else in a system you work on is the dominant
  cost a fixed per-invocation overhead nobody has measured? Write down how you would measure it, and what
  would have to be true for the fix to be deployable underneath your callers rather than in front of them.
