reflectionPrompt: >
  Pick one contract you have written or read that keeps a mapping of per-user state. Write down what its
  Solana equivalent would look like: which accounts exist, which are PDAs and under what seeds, who signs for
  each, and who pays the rent deposit. Then answer the harder question - which of your contract's operations
  could two users have run at the same time under that design, and which would still have serialized?
