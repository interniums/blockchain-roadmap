id: altvm-solana-accounts
trackId: altvm
order: 1
title: Where the state went
summary: >
  On Ethereum a contract's state lives inside the contract, and the machine discovers which slots a
  transaction touched by running it. Solana inverted both halves of that: every piece of state is its own
  addressable account sitting outside a stateless program, and every transaction names the accounts it will
  read and write before it executes. This module establishes that single contrast and follows its
  consequences - program-derived addresses instead of mappings, a refundable rent deposit instead of
  unbounded free state growth, and parallel execution as the payoff for declaring access up front. It ends
  where the two designs converge: EIP-7928 brings block-level declared access to Ethereum by a different
  route, for the same reason.
layout: { lane: left, row: 1201 }
teaches:
  - solana-account
  - state-externalized
  - program-is-stateless
  - pda
  - rent-exemption
  - declared-account-access
  - sealevel
  - parallelism-requires-declaration
