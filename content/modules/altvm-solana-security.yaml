id: altvm-solana-security
trackId: altvm
order: 6
title: Three questions about every account
summary: >
  The EVM answers "who is calling" for you and its type system answers "what is this". Solana answers
  neither: every account in an instruction is attacker-chosen data, and the runtime guarantees only that the
  signatures are valid and that a program cannot write accounts it does not own. Almost every classic Solana
  exploit is a missing answer to one of three questions - who owns this account, did it sign, and is it the
  specific instance this operation is about. This module works the taxonomy with its canonical post-mortems
  attached, then does the thing a 2022 curriculum will not: it follows where the money actually went in 2025
  and 2026, which was collateral design and the operational compromise of privileged signers, in protocols
  whose audited contracts were never broken at all.
