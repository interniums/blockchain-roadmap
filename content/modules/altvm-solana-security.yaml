reflectionPrompt: >
  Take the three questions - who owns this, did it sign, is it the right instance - and apply them to every
  account in one instruction of a program you have read. Then step outside the code entirely: for the same
  protocol, write down who can sign an administrative action today, what they would see on their screen
  before signing it, and how long a signature they produce stays executable. Which of those two exercises
  would have caught more of 2026's losses?
