id: altvm-token-2022
trackId: altvm
order: 5
title: Token-2022, and the mint that changes the rules
summary: >
  ERC-20 is an interface: a token is whatever contract implements it, and the weird-token taxonomy exists
  because each implementation can do anything. Token-2022 inverts that - one deployed program, a fixed menu
  of extensions, and a mint that declares which ones it turned on. That should make integration safer, and
  for some things it does, because you can read a mint and know its rules. But the extensions include fees
  withheld inside the recipient's account, arbitrary third-party code CPI'd into every transfer, an address
  that can drain any account of that mint forever, and a close-and-reinitialize path that changes the rules
  after you listed it. This module is organised the way an auditor organises it: extension by extension, each
  paired with the integration that breaks.
layout: { lane: left, row: 1205 }
teaches:
