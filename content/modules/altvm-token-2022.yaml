reflectionPrompt: >
  Take a protocol you understand that holds user tokens in a vault. Go through the current Token-2022
  extension list and put every extension into exactly one bucket: reject the mint outright, support it with
  specific extra handling, or harmless. For every extension in the middle bucket, name the code you would
  have to write and where it would have to run. Then answer the question that decides whether the exercise
  was worth anything - what stops a mint moving between your buckets after you listed it?
