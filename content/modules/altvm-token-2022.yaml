  - amount-sent-is-not-amount-received
  - transfer-checked-is-mandatory
  - transfer-hook-extension
  - extra-account-meta-list
  - hook-must-verify-transferring-flag
  - permanent-delegate-extension
  - non-transferable-and-default-frozen
  - rebasing-extensions
  - mint-close-and-reinit-hazard
  - confidential-transfer-extension
  - confidential-pending-balance-counter
  - allowlist-mints-not-programs
