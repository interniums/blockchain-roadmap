id: app-account-abstraction
trackId: app
order: 5
title: ERC-4337, and who pays for the first transaction
summary: >
  ERC-4337 builds an alternative transaction pipeline entirely in contracts and off-chain infrastructure: a
  UserOperation instead of a transaction, bundlers instead of the public mempool, a singleton EntryPoint that
  validates and executes, and an optional paymaster that pays. This module is about what each actor can and
  cannot do to you, why the paymaster is the piece with an attacker-shaped hole in it, and how 4337 and
  EIP-7702 relate - they compose, and only one of them requires the user to move to a new address.
layout: { lane: right, row: 5 }
teaches:
  - user-operation
  - bundler
  - entrypoint
  - paymaster
  - paymaster-risk
  - session-key
  - 7702-vs-4337
lessons:
  - id: app-account-abstraction-a-transaction-that-isnt
    order: 1
    title: A transaction that is not a transaction
    teaches: [user-operation, bundler]
    assumes: [mempool-is-a-public-broadcast, eip-2718-envelope]
    readingMin: 15
    status: outlined
  - id: app-account-abstraction-entrypoint
    order: 2
    title: The singleton everything goes through
    teaches: [entrypoint]
    assumes: [evm-message-call, contract-account]
    readingMin: 12
    status: outlined
  - id: app-account-abstraction-someone-else-pays
    order: 3
    title: Someone else pays the gas, and can be made to pay for nothing
    teaches: [paymaster, paymaster-risk]
    assumes: [tx-gas-limit-vs-used]
    readingMin: 16
    status: outlined
  - id: app-account-abstraction-two-roads
    order: 4
    title: Two roads to a programmable account
    teaches: [7702-vs-4337, session-key]
    assumes: [delegation-designator, detect-delegated-eoa]
    readingMin: 14
    status: outlined
practices:
  - app-account-abstraction-scoped-paymaster
  - app-account-abstraction-drain-a-paymaster
  - app-account-abstraction-read-paymaster-scoping
reflectionPrompt: >
  You are sponsoring the first action of every new user. Write down the maximum amount your paymaster can lose
  in one hour if every rule you wrote is respected and every sponsored user is an attacker. If you cannot
  compute that number from your scoping rules, the rules are not scoped.
