id: app-eoa-upgrade
trackId: app
order: 4
title: Upgrading an account the user already has
summary: >
  EIP-7702 lets an existing EOA point at contract code without changing address, which is the only account
  upgrade a product can ship without asking users to migrate anything. The protocol mechanics belong to the EVM
  track; this module is the app-layer half - how you sign an authorization from TypeScript, how you detect that
  the address you are talking to is now delegated, who chooses the delegate in a wallet-mediated flow, and what
  the consent screen owes the user given that the change persists until it is explicitly cleared.
layout: { lane: right, row: 4 }
teaches:
  - viem-sign-authorization
  - 7702-upgrade-consent
  - detect-delegated-eoa
  - wallet-chooses-the-delegate
lessons:
  - id: app-eoa-upgrade-signing-an-authorization
    order: 1
    title: One signature that changes what an address can do
    teaches: [viem-sign-authorization, 7702-upgrade-consent]
    assumes: [authorization-tuple, set-code-transaction, tx-type-4-setcode, delegation-clearing]
    readingMin: 16
  - id: app-eoa-upgrade-detecting-delegation
    order: 2
    title: Finding out what you are actually talking to
    teaches: [detect-delegated-eoa, wallet-chooses-the-delegate]
    assumes: [delegation-designator, code-length-check-broken, viem-public-client]
    readingMin: 14
practices:
  - app-eoa-upgrade-delegate-and-clear
  - app-eoa-upgrade-detect-delegation-in-ui
reflectionPrompt: >
  A user of your app has a delegated EOA and does not know it - the wallet upgraded them. Which of your existing
  assumptions about that address are now wrong, and which of them would fail loudly rather than silently? Write
  the list, then mark the ones you could detect at runtime today.
