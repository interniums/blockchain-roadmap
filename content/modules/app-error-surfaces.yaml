id: app-error-surfaces
trackId: app
order: 9
title: Turning revert bytes into something a person can act on
summary: >
  A revert is raw bytes. Every error message you have ever seen from a contract is an application-level
  convention layered on top of those bytes, and the convention changed - strings gave way to custom-error
  selectors, which carry no text at all. This module covers the four shapes revert data can take, why gas
  estimation fails for at least four unrelated reasons that all look identical, and how to end up with a
  triage function whose output names the next action instead of printing hex at a user.
layout: { lane: right, row: 9 }
teaches:
  - revert-data-is-abi-encoded
  - four-revert-shapes
  - error-string-legacy
  - solidity-custom-errors
  - panic-codes
  - panic-means-bug
  - empty-revert-data
  - selector-only-4-bytes
  - decode-needs-the-right-abi
  - viem-decode-error-result
  - estimategas-is-a-search
  - estimategas-nonmonotonic
  - estimategas-63-64
  - estimategas-failure-modes
  - estimategas-is-not-simulation
  - provider-error-shape-drift
  - error-triage-taxonomy
  - error-message-must-name-the-next-action
