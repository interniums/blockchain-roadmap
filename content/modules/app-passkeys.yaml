id: app-passkeys
trackId: app
order: 7
title: Passkeys, and what the device actually signed
summary: >
  A passkey is a WebAuthn credential on the wrong curve for Ethereum, signing the wrong bytes for Ethereum, and
  since Fusaka it is nevertheless the cheapest good onboarding a consumer product has. This module works through
  the three gaps you have to close: the curve gap, which forces the account to be a contract; the payload gap,
  which means the contract must rebuild what the authenticator signed before verifying it; and the recovery gap,
  which is where passkey wallets brick users if nobody designed for it at account-creation time.
layout: { lane: right, row: 7 }
teaches:
  - passkey-definition
  - passkey-ux-win
  - passkey-curve-mismatch
  - passkey-needs-smart-account
  - webauthn-signed-payload
  - webauthn-challenge-binding
  - webauthn-onchain-reconstruction
  - webauthn-clientdata-checks
  - eip-7951-precompile
  - p256-precompile-vs-solidity
  - eip-7951-no-low-s
  - passkey-rp-id-binding
  - passkey-sync-vs-device-bound
  - passkey-recovery-is-mandatory
  - passkey-recovery-mechanisms
  - passkey-pubkey-must-be-registered
lessons:
  - id: app-passkeys-what-a-passkey-is
    order: 1
    title: What a passkey actually is
    teaches: [passkey-definition, passkey-ux-win]
    assumes: [keypair, hash-function]
    readingMin: 12
  - id: app-passkeys-wrong-curve
    order: 2
    title: Wrong curve, therefore not an EOA
    teaches: [passkey-curve-mismatch, passkey-needs-smart-account]
    assumes: [ecdsa-secp256k1, secp256r1-p256, ecrecover]
    readingMin: 14
  - id: app-passkeys-what-gets-signed
    order: 3
    title: What WebAuthn signs, and where your hash went
    teaches: [webauthn-signed-payload, webauthn-challenge-binding]
    assumes: [user-operation]
    readingMin: 17
  - id: app-passkeys-onchain-verification
    order: 4
    title: Rebuilding the signed bytes inside a contract
    teaches: [webauthn-onchain-reconstruction, webauthn-clientdata-checks]
    assumes: [abi-encoding]
    readingMin: 17
  - id: app-passkeys-the-precompile
    order: 5
    title: The verifier at 0x100 and why it changed the economics
    teaches: [eip-7951-precompile, p256-precompile-vs-solidity]
    assumes: [p256verify-precompile]
    readingMin: 14
  - id: app-passkeys-two-valid-signatures
    order: 6
    title: Two valid signatures for the same message
    teaches: [eip-7951-no-low-s]
    assumes: [signature-malleability, low-s-normalisation]
    readingMin: 12
  - id: app-passkeys-domain-is-custody
    order: 7
    title: Your domain is part of the custody model
    teaches: [passkey-rp-id-binding, passkey-sync-vs-device-bound]
    assumes: [passkey-definition]
    readingMin: 13
  - id: app-passkeys-recovery
    order: 8
    title: Designing for the day the device is gone
    teaches: [passkey-recovery-is-mandatory, passkey-recovery-mechanisms, passkey-pubkey-must-be-registered]
    assumes: [passkey-needs-smart-account]
    readingMin: 17
practices:
  - app-passkeys-reconstruct-the-digest
  - app-passkeys-malleable-replay
  - app-passkeys-recovery-state-table
reflectionPrompt: >
  Draw every state a passkey account of yours can be in - one credential, several, none, lost OS account, changed
  domain - and the exit from each. Any state whose only exit is "unrecoverable" must either gain an exit or be
  written down as an accepted risk with the words "the user loses everything" in it. Which did you choose, and why?
