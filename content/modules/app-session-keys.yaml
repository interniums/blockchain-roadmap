id: app-session-keys
trackId: app
order: 6
title: Session keys, and the cost of not re-prompting
summary: >
  A session key removes the per-transaction prompt by giving a scoped key authority to act. Everything that
  matters is in the word "scoped": which dimensions the policy constrains, whether the account enforces it
  on-chain or your client merely checks it, what happens between the user clicking revoke and the revocation
  landing, and where the key material actually sits. The standards here - ERC-7715 and ERC-7710 on top of
  ERC-7579 modules - are drafts shipped experimentally, so this module teaches the shape of the problem and
  treats every implementation as one wallet's answer to it.
layout: { lane: right, row: 6 }
teaches:
  - session-key-definition
  - session-key-needs-programmable-account
  - session-key-policy-dimensions
  - session-key-enforced-on-chain
  - erc-7579-validator-vs-executor
  - session-key-4337-validation-limits
  - erc-7715-grant-permissions
  - erc-7710-delegation-manager
  - session-key-expiry-is-free
  - session-key-revocation-costs-gas
  - session-key-revocation-race
  - session-key-blast-radius
  - session-key-material-location
  - session-key-vs-token-approval
  - session-key-consent-moves-not-disappears
lessons:
  - id: app-session-keys-what-it-is
    order: 1
    title: What a session key is, and what has to exist for it to work
    teaches: [session-key-definition, session-key-needs-programmable-account]
    assumes: [session-key, delegation-designator]
    readingMin: 14
  - id: app-session-keys-policy-dimensions
    order: 2
    title: A policy is a list of dimensions, and the account has to enforce it
    teaches: [session-key-policy-dimensions, session-key-enforced-on-chain]
    assumes: [entrypoint]
    readingMin: 16
  - id: app-session-keys-modules
    order: 3
    title: Who validates, who executes, and what validation is allowed to look at
    teaches: [erc-7579-validator-vs-executor, session-key-4337-validation-limits]
    assumes: [delegatecall-is-the-proxy-primitive, user-operation]
    readingMin: 16
  - id: app-session-keys-asking-the-wallet
    order: 4
    title: Asking the wallet for a permission instead of a signature
    teaches: [erc-7715-grant-permissions, erc-7710-delegation-manager]
    assumes: [wallet-capabilities]
    readingMin: 15
  - id: app-session-keys-expiry-vs-revocation
    order: 5
    title: Expiry is free, revocation is a race
    teaches: [session-key-expiry-is-free, session-key-revocation-costs-gas, session-key-revocation-race]
    assumes: [mempool-is-a-public-broadcast]
    readingMin: 16
  - id: app-session-keys-blast-radius
    order: 6
    title: Sizing the blast radius before you size the convenience
    teaches: [session-key-blast-radius, session-key-material-location, session-key-vs-token-approval]
    assumes: [erc20-allowance-model]
    readingMin: 17
  - id: app-session-keys-consent-moved
    order: 7
    title: Consent moved, it did not disappear
    teaches: [session-key-consent-moves-not-disappears]
    assumes: [7702-upgrade-consent]
    readingMin: 11
practices:
  - app-session-keys-scoped-validator
  - app-session-keys-bypass-your-own-policy
  - app-session-keys-measure-revocation-window
reflectionPrompt: >
  Write the one sentence you would show a user at grant time for the most useful session key your product could
  issue - naming the contract, the actions, the cap, and the expiry - in under sixty words. Then write the
  sentence you would have to show them if the key leaked. If the second sentence is worse than "you lost X",
  the policy is too wide.
