id: app-transaction-ux
trackId: app
order: 8
title: The transaction lifecycle your UI has to model
summary: >
  Sending a transaction returns a hash and nothing else. Success, failure and never-happened are all discovered
  later, they are three different outcomes, and most applications render all three as a spinner that eventually
  gives up. This module builds the actual state machine - pending, replaced, dropped, reverted, confirmed,
  reorged - and then asks the product question the state machine forces: how sure do you need to be before you
  do something in the real world that you cannot take back.
layout: { lane: right, row: 8 }
teaches:
  - tx-lifecycle-states
  - tx-is-not-request-response
  - tx-receipt-status-zero
  - tx-nonce-is-a-sequence
  - tx-stuck-from-fee-cap
  - tx-dropped
  - tx-replacement-same-nonce
  - tx-cancel-is-a-replacement
  - tx-replacement-reasons
  - tx-replacement-changes-the-hash
  - tx-simulate-before-send
  - tx-confirmations-vs-finality
  - tx-confirmation-policy-is-a-product-decision
  - tx-reorg-effects
  - tx-l2-confirmation-tiers
  - tx-one-intent-many-transactions
  - tx-optimistic-ui-boundary
lessons:
  - id: app-transaction-ux-no-200-ok
    order: 1
    title: There is no 200 OK
    teaches: [tx-lifecycle-states, tx-is-not-request-response, tx-receipt-status-zero]
    assumes: [mempool-is-a-public-broadcast, tx-type-2-1559]
    readingMin: 17
  - id: app-transaction-ux-stuck-and-gone
    order: 2
    title: Stuck, parked, and simply gone
    teaches: [tx-nonce-is-a-sequence, tx-stuck-from-fee-cap, tx-dropped]
    assumes: [nonce-ordering, eip-1559-fee-fields, nonce-gap]
    readingMin: 17
  - id: app-transaction-ux-cancel-is-a-race
    order: 3
    title: You cannot cancel, you can only race
    teaches: [tx-replacement-same-nonce, tx-cancel-is-a-replacement, tx-replacement-reasons]
    assumes: [transaction-replacement]
    readingMin: 17
  - id: app-transaction-ux-hash-is-not-an-id
    order: 4
    title: The hash is not a stable identifier for what the user did
    teaches: [tx-replacement-changes-the-hash]
    assumes: [tx-replacement-same-nonce]
    readingMin: 11
  - id: app-transaction-ux-simulate-first
    order: 5
    title: Simulating first deletes most of your error states
    teaches: [tx-simulate-before-send]
    assumes: [viem-simulate-before-send]
    readingMin: 10
  - id: app-transaction-ux-how-sure-do-you-need-to-be
    order: 6
    title: How sure do you need to be
    teaches: [tx-confirmations-vs-finality, tx-confirmation-policy-is-a-product-decision]
    assumes: [casper-ffg, finality-is-a-spectrum]
    readingMin: 17
  - id: app-transaction-ux-reorgs-and-l2-tiers
    order: 7
    title: What a reorg does to your screen, and what confirmed means on an L2
    teaches: [tx-reorg-effects, tx-l2-confirmation-tiers]
    assumes: [reorg, log-record-shape]
    readingMin: 16
  - id: app-transaction-ux-one-intent
    order: 8
    title: One intent, several transactions, one thing the user is waiting for
    teaches: [tx-one-intent-many-transactions, tx-optimistic-ui-boundary]
    assumes: [erc-5792-sendcalls]
    readingMin: 15
practices:
  - app-transaction-ux-six-state-component
  - app-transaction-ux-replace-and-cancel-on-anvil
  - app-transaction-ux-survive-a-reorg
reflectionPrompt: >
  Name the most irreversible thing your product does off-chain in response to a transaction - shipping, crediting,
  emailing, paying out. Write the confirmation policy that gates it, in the form "we act after X because the worst
  case if we are wrong is Y". If Y is larger than you are comfortable saying out loud, X is too small.
