id: app-viem
trackId: app
order: 1
title: viem, and what each line actually does
summary: >
  viem 2.x is the default way a TypeScript program talks to an EVM chain. This module takes it apart into
  the three pieces it is really made of - actions, clients, transports - so you can say for any line of your
  code whether it hits the network, whether it holds a key, and what it does when the node is wrong. It ends
  on the two habits that separate a working integration from a shipping one: simulate before you ask for a
  signature, and read the error's cause chain instead of its message.
layout: { lane: right, row: 1 }
teaches:
  - viem-client-vs-transport
  - viem-actions-are-functions
  - viem-public-client
  - viem-wallet-client
  - viem-account-kinds
  - viem-transport-fallback
  - viem-multicall-batching
  - viem-abi-const-inference
  - viem-bigint-boundary
  - viem-simulate-before-send
  - viem-simulation-is-not-a-guarantee
  - viem-error-hierarchy
  - viem-typed-revert
  - viem-sync-send
lessons:
  - id: app-viem-same-call-any-wire
    order: 1
    title: Why the same call works over HTTP, a socket, and a browser wallet
    teaches: [viem-client-vs-transport, viem-actions-are-functions]
    assumes: [rpc-endpoints-aliases]
    readingMin: 12
    status: outlined
  - id: app-viem-which-client-holds-the-key
    order: 2
    title: The two clients, and which one can spend your money
    teaches: [viem-public-client, viem-wallet-client, viem-account-kinds]
    assumes: [eoa, keypair]
    readingMin: 15
    status: outlined
  - id: app-viem-one-endpoint-is-a-spof
    order: 3
    title: One RPC endpoint is a single point of failure
    teaches: [viem-transport-fallback, viem-multicall-batching]
    assumes: [rpc-cost-model]
    readingMin: 13
    status: outlined
  - id: app-viem-types-and-integers
    order: 4
    title: The types you get for free, and the integers you must not round
    teaches: [viem-abi-const-inference, viem-bigint-boundary]
    assumes: [abi-encoding, function-selector]
    readingMin: 14
    status: outlined
  - id: app-viem-simulate-then-write
    order: 5
    title: Ask the chain before you ask the user
    teaches: [viem-simulate-before-send, viem-simulation-is-not-a-guarantee]
    assumes: [mempool-pending-is-not-a-queue]
    readingMin: 15
    status: outlined
  - id: app-viem-reading-an-error
    order: 6
    title: Reading a viem error instead of printing it
    teaches: [viem-error-hierarchy, viem-typed-revert]
    assumes: [sol-custom-error]
    readingMin: 14
    status: outlined
  - id: app-viem-sync-send
    order: 7
    title: Send and wait in one call, and the chains where that is a lie
    teaches: [viem-sync-send]
    assumes: [tx-type-2-1559]
    readingMin: 10
    status: outlined
practices:
  - app-viem-two-client-round-trip
  - app-viem-error-with-and-without-abi
  - app-viem-multicall-vs-loop
reflectionPrompt: >
  Pick one function in your own codebase that sends a transaction. Which of its lines touch the network,
  which hold a key, and which could return a value that was already stale when it arrived? Write the answer
  for each line, then say what you would have to change to make a wrong answer impossible rather than unlikely.
