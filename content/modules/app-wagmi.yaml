id: app-wagmi
trackId: app
order: 2
title: wagmi, caching, and the state you forgot was shared
summary: >
  wagmi 3.x is a thin React layer: viem does the chain I/O, TanStack Query does the caching, and wagmi adds
  connectors and a config store. Almost every wagmi bug is a cache bug or a state-location bug, so this module
  spends its time on the two things the docs assume you already understand - how a query key is built and
  invalidated, and where connection state lives when the server renders your page first. It closes on the two
  silent-wrong-answer traps: connected is not authenticated, and the wallet's chain is not your hook's chain.
layout: { lane: right, row: 2 }
teaches:
  - wagmi-is-viem-plus-query
  - wagmi-config-object
  - wagmi-read-hooks-are-queries
  - wagmi-write-hooks-are-mutations
  - wagmi-no-auto-invalidation
  - wagmi-querykey-shape
  - wagmi-bigint-serialization
  - wagmi-connector-abstraction
  - wagmi-eip6963-discovery
  - wagmi-connection-not-authentication
  - wagmi-ssr-hydration-mismatch
  - wagmi-cookie-storage
  - wagmi-provider-is-client-component
  - wagmi-chain-mismatch
lessons:
  - id: app-wagmi-three-libraries
    order: 1
    title: Three libraries wearing one trench coat
    teaches: [wagmi-is-viem-plus-query, wagmi-config-object]
    assumes: [viem-client-vs-transport]
    readingMin: 12
  - id: app-wagmi-reads-and-writes
    order: 2
    title: Reads are cached questions, writes are one-shot mutations
    teaches: [wagmi-read-hooks-are-queries, wagmi-write-hooks-are-mutations, wagmi-no-auto-invalidation]
    assumes: [viem-public-client, viem-wallet-client]
    readingMin: 17
  - id: app-wagmi-invalidating-the-exact-key
    order: 3
    title: Invalidating the exact key, not a key that looks like it
    teaches: [wagmi-querykey-shape, wagmi-bigint-serialization]
    assumes: [viem-bigint-boundary]
    readingMin: 13
  - id: app-wagmi-what-a-connector-is
    order: 4
    title: What a connector actually is
    teaches: [wagmi-connector-abstraction, wagmi-eip6963-discovery]
    assumes: [wagmi-config-object]
    readingMin: 13
  - id: app-wagmi-connected-is-not-logged-in
    order: 5
    title: Connected is not logged in
    teaches: [wagmi-connection-not-authentication]
    assumes: [ecdsa-secp256k1, eip-712-typed-data]
    readingMin: 11
  - id: app-wagmi-ssr-flash
    order: 6
    title: Why the wallet state flashes on refresh
    teaches: [wagmi-ssr-hydration-mismatch, wagmi-cookie-storage, wagmi-provider-is-client-component]
    assumes: [wagmi-config-object]
    readingMin: 17
  - id: app-wagmi-chain-mismatch
    order: 7
    title: The chain in the wallet is not the chain in your hook
    teaches: [wagmi-chain-mismatch]
    assumes: [chain-id-scoping]
    readingMin: 11
practices:
  - app-wagmi-ssr-no-flash
  - app-wagmi-make-the-balance-update
  - app-wagmi-count-the-requests
reflectionPrompt: >
  Every wagmi read hook in your app answers a question that was true at some point in the past. Pick the three
  reads whose staleness would hurt a user most, and for each one write down how stale it is allowed to be and
  what event should make it refetch. Then say which of the three you cannot currently answer without guessing.
