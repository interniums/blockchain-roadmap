id: app-wallet-capabilities
trackId: app
order: 3
title: Asking the wallet what it can do
summary: >
  Wallets stopped being interchangeable the moment some of them could batch, sponsor, and upgrade accounts.
  The wrong answer is to detect the vendor and branch; the right answer is a capability query, which is what
  ERC-5792 standardises alongside `wallet_sendCalls`. This short module covers the negotiation, the batched
  send, the fallback that keeps old wallets working, and the one property you must never assume from batching.
layout: { lane: right, row: 3 }
teaches:
  - wallet-capabilities
  - use-capabilities
  - erc-5792-sendcalls
  - sendcalls-fallback
  - batching-is-not-atomicity
lessons:
  - id: app-wallet-capabilities-ask-do-not-guess
    order: 1
    title: Ask the wallet, do not guess the wallet
    teaches: [wallet-capabilities, use-capabilities]
    assumes: [wagmi-connector-abstraction]
    readingMin: 12
  - id: app-wallet-capabilities-one-button-many-calls
    order: 2
    title: One button, several calls
    teaches: [erc-5792-sendcalls, sendcalls-fallback]
    assumes: [viem-wallet-client]
    readingMin: 15
  - id: app-wallet-capabilities-batched-is-not-atomic
    order: 3
    title: Batched is not the same as all-or-nothing
    teaches: [batching-is-not-atomicity]
    assumes: [call-returns-a-boolean]
    readingMin: 10
practices:
  - app-wallet-capabilities-batch-with-fallback
  - app-wallet-capabilities-partial-batch-failure
reflectionPrompt: >
  Your app supports one wallet that batches atomically, one that batches without atomicity, and one that cannot
  batch at all. Describe the single code path that serves all three, and name the one user-visible promise you
  can make in every case. If there is no such promise, say what your UI shows instead.
