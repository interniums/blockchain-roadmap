id: defi-amm-math
trackId: defi
order: 1
title: The curve that prices without a counterparty
summary: >
  An automated market maker replaces the order book with an invariant. Everything a trader
  experiences — the quoted price, the price impact of size, the fee — falls out of that one
  equation, and everything a liquidity provider experiences falls out of it too. This module
  derives the constant-product curve, shows where price impact and impermanent loss come from,
  contrasts it with the flatter StableSwap invariant used for assets that should trade near
  parity, and introduces the flash loan, because from here on every attack in this track starts
  with borrowed capital that costs nothing to obtain.
layout: { lane: right, row: 801 }
teaches:
  - constant-product
  - price-impact
  - slippage-tolerance
  - impermanent-loss
  - stableswap-invariant
  - flash-loan
lessons:
  - id: defi-amm-math-why-a-curve-can-quote
    order: 1
    title: How a curve quotes a price with nobody on the other side
    teaches: [constant-product]
    assumes: [erc20-is-a-ledger]
    readingMin: 12
  - id: defi-amm-math-size-moves-the-price
    order: 2
    title: Why your large trade gets a worse price than your small one
    teaches: [price-impact, slippage-tolerance]
    assumes: [constant-product]
    readingMin: 14
  - id: defi-amm-math-what-lps-actually-lose
    order: 3
    title: What a liquidity provider actually loses, and why impermanent is the wrong word
    teaches: [impermanent-loss]
    assumes: [constant-product, price-impact]
    readingMin: 14
  - id: defi-amm-math-flatter-curves-for-parity-assets
    order: 4
    title: A flatter curve for assets that are supposed to trade one for one
    teaches: [stableswap-invariant]
    assumes: [constant-product, price-impact]
    readingMin: 12
  - id: defi-amm-math-borrowing-with-no-collateral
    order: 5
    title: Borrowing millions with no collateral, for the length of one transaction
    teaches: [flash-loan]
    assumes: [constant-product]
    readingMin: 10
practices: [defi-amm-math-build-cpmm]
reflectionPrompt: >
  A pool quotes you a price and a slippage tolerance box sits next to it. Write down, in your own
  words, exactly what number you are authorising when you widen that box — and who receives it if
  the trade fills at your limit rather than at the quote.
