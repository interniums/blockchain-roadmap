practices: [defi-concentrated-liquidity-position-amounts]
reflectionPrompt: >
  You provided liquidity in a narrow range and the price walked out of it. Describe the position's
  composition before, during and after, in terms of the virtual reserves — and say what you were
  paid for accepting that outcome.
