id: defi-concentrated-liquidity
trackId: defi
order: 2
title: Concentrated liquidity, and the integers that make it work
summary: >
  Uniswap v3 is not a new kind of market maker. It is the same constant-product curve with the
  liquidity switched on and off at preset price levels, and almost all of its apparent complexity
  is the fixed-point integer arithmetic needed to run that idea without floating point. This
  module builds the mental model in the order that makes it collapse: virtual reserves first,
  then ticks and square-root prices as the storage representation, then L as the single number
  describing a position, and finally the framing that makes every v3 formula obvious.
layout: { lane: right, row: 802 }
teaches:
  - virtual-reserves
  - tick
  - sqrt-price-x96
  - liquidity-l
  - v3-is-v2-piecewise
