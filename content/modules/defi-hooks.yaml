id: defi-hooks
trackId: defi
order: 3
title: Hooks, and the pool you have to trust
summary: >
  Uniswap v4 keeps every pool in one contract, settles balances net at the end of a locked
  sequence, and lets each pool attach a hook contract that the PoolManager calls at fixed
  lifecycle points. The first two changes are gas and composability wins. The third changes the
  security model of trading itself: choosing which pool to route through is now choosing whose
  code runs inside your swap. This module builds the architecture and then spends its last lesson
  on the checklist that follows from it.
layout: { lane: right, row: 803 }
teaches:
  - singleton-poolmanager
  - v4-flash-accounting
  - hook
  - hook-permission-bits
  - hook-is-trusted-code
lessons:
  - id: defi-hooks-one-contract-every-pool
    order: 1
    title: Why creating a pool stopped being a deployment
    teaches: [singleton-poolmanager]
    assumes: [constant-product, v3-is-v2-piecewise]
    readingMin: 10
    status: outlined
  - id: defi-hooks-settle-once-at-the-end
    order: 2
    title: Owing the pool instead of paying it — flash accounting
    teaches: [v4-flash-accounting]
    assumes: [singleton-poolmanager, transient-storage, flash-accounting]
    readingMin: 12
    status: outlined
  - id: defi-hooks-code-inside-your-swap
    order: 3
    title: Code that runs inside someone else's swap, and the address that authorises it
    teaches: [hook, hook-permission-bits]
    assumes: [singleton-poolmanager, v4-flash-accounting, create2-address]
    readingMin: 16
    status: outlined
  - id: defi-hooks-choosing-a-pool-is-choosing-a-hook
    order: 4
    title: Choosing a pool means trusting its hook
    teaches: [hook-is-trusted-code]
    assumes: [hook, hook-permission-bits, slippage-tolerance]
    readingMin: 12
    status: outlined
practices: [defi-hooks-malicious-hook]
reflectionPrompt: >
  A router offers you a better quote on a v4 pool you have never seen before. Write the checks you
  would run on that pool's hook before taking the quote, ordered by how much of your position each
  missing check puts at risk.
