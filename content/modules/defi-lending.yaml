    assumes: [lend-health-factor, lend-utilisation, lend-isolated-vs-pooled]
    readingMin: 18
practices: [defi-lending-kinked-rate-model, defi-lending-shared-oracle-breaks-isolation]
reflectionPrompt: >
  Pick a live lending market and write down, before checking, which single parameter change would
  most reduce the protocol's worst-case loss from that market. Then check what the parameter
  actually is, and say what the DAO gave up to keep it where it is.
