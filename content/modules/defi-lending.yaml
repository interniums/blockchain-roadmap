    order: 1
    title: Why a permissionless lender can only ever make one kind of loan
    teaches: [lend-overcollateralisation]
    assumes: [erc20-is-a-ledger]
    readingMin: 10
  - id: defi-lending-two-numbers-not-one
    order: 2
