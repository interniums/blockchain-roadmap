    assumes: [lend-overcollateralisation]
    readingMin: 16
  - id: defi-lending-leverage-on-a-correlation-bet
    order: 3
    title: Buying leverage by betting that two prices stay together
    teaches: [lend-emode, lend-correlation-break]
    assumes: [lend-ltv-vs-liquidation-threshold, lend-health-factor]
    readingMin: 14
  - id: defi-lending-utilisation-is-two-things
    order: 4
    title: Utilisation is the price of money and the exit door at the same time
    teaches: [lend-utilisation, lend-rate-kink]
