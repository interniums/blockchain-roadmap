id: defi-lending
trackId: defi
order: 4
title: Lending design, and the losses it is built to absorb
summary: >
  An on-chain lending pool is four decisions wearing a user interface: how much you may borrow
  against what, how the price of money is set, how interest is accounted for without iterating
  over users, and who eats the loss when a listing turns out to be wrong. This module derives each
  one from first principles — including the supply rate, which nobody sets and everybody
  misquotes — and then follows the loss all the way to whoever absorbs it, using the 2026 case
  where the protocol's own code was never exploited at all.
layout: { lane: right, row: 804 }
teaches:
  - lend-overcollateralisation
  - lend-ltv-vs-liquidation-threshold
  - lend-health-factor
  - lend-emode
  - lend-correlation-break
  - lend-utilisation
  - lend-rate-kink
  - lend-supply-rate-derivation
  - lend-index-accounting
  - lend-caps-and-ceilings
  - lend-isolated-vs-pooled
  - lend-curated-vaults
  - lend-bad-debt
  - lend-bad-debt-is-a-bank-run
  - lend-backstop
lessons:
