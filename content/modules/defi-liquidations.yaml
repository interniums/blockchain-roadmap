id: defi-liquidations
trackId: defi
order: 5
title: Liquidations, and the assumption that fails when you need it
summary: >
  A lending protocol never sells anything. It exposes a function and hopes a profitable third
  party calls it, which means solvency is outsourced to an incentive and to the liveness of a
  competitive keeper set. This module derives the incentive, shows the three ways it is paid
  (fixed discount, close factor, descending auction), then works through the failure modes that
  all arrive together during a crash. It ends on Curve's LLAMMA, which replaces the discrete
  liquidation with a continuous one — and on the two 2026 incidents that show what LLAMMA moved
  rather than removed.
layout: { lane: right, row: 805 }
teaches:
