id: defi-mev
trackId: defi
order: 8
title: MEV, and who really orders your transaction
summary: >
  Ordering is a discretionary resource, so it has a price. This module builds the taxonomy that
  actually distinguishes the cases — extraction that requires a specific user to be worse off,
  versus capture of a public inconsistency — and then follows a swap through the full supply
  chain from wallet to proposer, naming at every hop who can see it and who can reorder it. It
  ends on the four live responses (private orderflow, orderflow auctions, intents, trusted
  execution) and on what has and has not actually shipped at the protocol level.
