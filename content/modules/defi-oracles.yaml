id: defi-oracles
trackId: defi
order: 6
title: Oracles, and what it costs to move one
summary: >
  A blockchain has no native notion of the price of anything. Every valuation in every protocol in
  this track is a number some off-chain process wrote into a contract, which makes the oracle the
  trust boundary of the whole system. This module covers the two delivery models and their
  distinct failure modes, the arithmetic of manipulation cost and why proof of stake changed it,
  the 2026 attack surface that is no longer spot prices but protocol functions used as rates, and
  the defensive integration patterns that actually help.
layout: { lane: right, row: 806 }
teaches:
  - orac-price-feed
  - orac-push-model
  - orac-deviation-and-heartbeat
  - orac-staleness-check
  - orac-pull-model
  - orac-pull-verification
  - orac-confidence-interval
  - orac-spot-price-is-not-an-oracle
  - orac-twap
  - orac-twap-lag
  - orac-manipulation-cost
  - orac-multiblock-mev
  - orac-multiblock-is-probabilistic
  - orac-lp-token-and-rate-oracles
  - orac-sanity-bounds
  - orac-rate-limit
  - orac-oev
lessons:
  - id: defi-oracles-no-price-on-a-blockchain
    order: 1
    title: There is no price on a blockchain
    teaches: [orac-price-feed]
    assumes: [lend-health-factor]
    readingMin: 10
  - id: defi-oracles-push-feeds
    order: 2
    title: Push feeds — deviation, heartbeat, and the gap in between
    teaches: [orac-push-model, orac-deviation-and-heartbeat, orac-staleness-check]
    assumes: [orac-price-feed]
    readingMin: 18
  - id: defi-oracles-pull-feeds
    order: 3
    title: Pull feeds — the consumer pays, and the consumer is liable
    teaches: [orac-pull-model, orac-pull-verification, orac-confidence-interval]
    assumes: [orac-price-feed, orac-push-model, ecrecover]
    readingMin: 16
  - id: defi-oracles-spot-is-not-a-price
    order: 4
    title: Why reading a pool's price gets you drained
    teaches: [orac-spot-price-is-not-an-oracle]
    assumes: [orac-price-feed, constant-product, flash-loan]
    readingMin: 12
  - id: defi-oracles-twap-buys-time
    order: 5
    title: A TWAP buys time and pays for it in staleness
    teaches: [orac-twap, orac-twap-lag]
    assumes: [orac-spot-price-is-not-an-oracle]
    readingMin: 14
  - id: defi-oracles-what-manipulation-costs
    order: 6
    title: What manipulation actually costs, and what proof of stake did to the bill
    teaches: [orac-manipulation-cost, orac-multiblock-mev, orac-multiblock-is-probabilistic]
    assumes: [orac-twap, orac-twap-lag, flash-loan]
    readingMin: 18
  - id: defi-oracles-functions-as-oracles
    order: 7
    title: When a protocol function quietly becomes an oracle
    teaches: [orac-lp-token-and-rate-oracles]
    assumes: [orac-spot-price-is-not-an-oracle, erc-4626-vault, donation-attack]
    readingMin: 12
  - id: defi-oracles-hardening
    order: 8
    title: Hardening a feed you do not control
    teaches: [orac-sanity-bounds, orac-rate-limit]
    assumes: [orac-staleness-check, orac-twap-lag]
    readingMin: 14
  - id: defi-oracles-the-block-after-the-update
    order: 9
    title: The block right after the price update
    teaches: [orac-oev]
    assumes: [orac-push-model, liq-fixed-discount]
    readingMin: 10
practices: [defi-oracles-harden-price-getter, defi-oracles-twap-attack-cost]
reflectionPrompt: >
  Take one protocol you have read the code of and write down every value it treats as a price,
  including the ones that do not look like prices. For each, name who can move it, how fast, and
  what it would cost them.
