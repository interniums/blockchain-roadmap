id: defi-stablecoins
trackId: defi
order: 7
title: Stablecoins, and the arbitrage that holds the peg
summary: >
  No contract can set a market price. A stablecoin's peg is always the outcome of somebody's
  arbitrage against a redemption or minting right, so every design question reduces to what trade
  a deviation creates, who is allowed to make it, and what it costs them. This module walks the
  designs in that frame — fiat-backed, CDP with a peg module and a rate lever, algorithmic,
  delta-neutral synthetic — and then covers the category the standard three-way taxonomy has no
  slot for, which is where the 2025 failures actually happened.
layout: { lane: right, row: 807 }
