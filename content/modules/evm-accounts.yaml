reflectionPrompt: >
  Pick a product you have built or used that treats "the caller is a human wallet" as a
  meaningful category — an airdrop, a fee discount, a bot filter, a rewards gate. Write down
  what that category was actually protecting, then describe what a delegated EOA does to that
  protection and what you would put in its place. If you conclude nothing changes, say precisely
  why the delegated account cannot reach the behaviour you were guarding.
