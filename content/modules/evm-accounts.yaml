id: evm-accounts
trackId: evm
order: 1
title: Accounts & delegation
summary: >
  An Ethereum account is a record in one global map, and since Pectra (May 2025) that record can
  carry code while still being controlled by a private key. This module teaches accounts as they
  are in 2026: nonce, balance, storage root, code hash — plus a delegation designator that points
  the EVM at somebody else's code. The old "EOA versus contract account" split is taught only as
  the historical claim that EIP-7702 broke, because a large amount of deployed code still depends
  on it and is now wrong. By the end you can say what a delegated account can do, why delegating
  is closer to handing over a key than to granting an allowance, and which checks in a pre-2025
  codebase stopped meaning what their author thought.
layout: { lane: spine, row: 1 }
teaches:
