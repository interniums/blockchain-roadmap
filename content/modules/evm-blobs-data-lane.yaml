reflectionPrompt: >
  A colleague proposes storing your application's user-generated content as blobs because "blob gas
  is much cheaper than calldata". Write the reply. Be specific about what a contract can and cannot
  do with a blob, what happens to the data after the retention window, and what question you would
  ask them before deciding whether their idea is wrong or merely mis-stated.
