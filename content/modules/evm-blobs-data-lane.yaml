id: evm-blobs-data-lane
trackId: evm
order: 8
title: Blobs & the data lane
summary: >
  Blobs are a second lane through Ethereum that the EVM cannot see. A blob transaction carries
  128 KiB chunks that are committed to, propagated, sampled and then deliberately forgotten — the
  chain guarantees the data was *available* for a window, not that it is stored. This module builds
  that idea from the blob's structure up: what a KZG commitment compresses, what the 32-byte
  versioned hash a contract can actually read is good for, why blob gas is a separate market, and
  why blobs are pruned after roughly eighteen days. It ends with PeerDAS, live since Fusaka, which
  is the reason no node downloads every blob any more and the reason blob capacity can grow without
  every node's bandwidth growing with it.
layout: { lane: spine, row: 8 }
