id: evm-execution
trackId: evm
order: 5
title: EVM execution
summary: >
  The EVM is a plain interpreter loop, and almost everything surprising about smart contracts falls
  out of three facts: a call opens a new machine, gas you forward is a ceiling rather than a
  promise, and there are three different ways to leave a frame with three different consequences.
  This module walks the loop, then the call frame and its four variants, then the gas-forwarding
  rule that killed the call-depth attack and created gas griefing, then failure and revert data,
  and finally deployment — initcode versus runtime code, the two address derivations, and why
  SELFDESTRUCT stopped deleting things. It is the module that makes proxies, upgradeability and
  silent call failures stop being mysterious.
