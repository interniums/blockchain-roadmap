reflectionPrompt: >
  DELEGATECALL is one instruction that underwrites upgradeable proxies, library patterns and
  EIP-7702 delegation alike. Write down, in your own words, exactly what it borrows and exactly
  what it keeps — then describe the bug class each of those two halves creates, and which of the
  three patterns above you would be least comfortable shipping without an audit.
