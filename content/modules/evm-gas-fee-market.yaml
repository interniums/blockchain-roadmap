id: evm-gas-fee-market
trackId: evm
order: 4
title: Gas & the fee market
summary: >
  Gas is the mechanism that makes a shared, untrusted computer terminate and pay for itself. This
  module teaches what you are actually buying: the fixed intrinsic charge before a single opcode
  runs, the per-operation costs that are not constants at all, and the two ceilings that arrived in
  2025 and 2026 and that most gas material has not caught up with. Every number here was measured
  on a pinned toolchain rather than copied from a table, because the widely circulated figures for
  cold storage reads and for reentrancy guards turned out to be wrong or unqualified. The habit
  this module is trying to install is: measure, then teach the number.
layout: { lane: spine, row: 4 }
teaches:
  - gas
  - tx-gas-limit-vs-used
  - intrinsic-gas
  - cold-vs-warm-access
  - sstore-dynamic-pricing
  - access-list
  - calldata-floor-price
  - per-transaction-gas-cap
lessons:
  - id: evm-gas-fee-market-a-countdown-you-prepay
    order: 1
    title: A countdown you prepay and mostly get back
    teaches: [gas, tx-gas-limit-vs-used, intrinsic-gas]
    assumes: [eip-1559-tfm, base-fee-burn, tx-type-2-1559]
    readingMin: 14
    status: outlined
  - id: evm-gas-fee-market-no-opcode-has-one-price
    order: 2
    title: No opcode has a single price
    teaches: [cold-vs-warm-access, sstore-dynamic-pricing, access-list]
    assumes: [intrinsic-gas, per-account-storage-trie, zero-slot-is-absent, tx-type-1-access-list]
    readingMin: 18
    status: outlined
  - id: evm-gas-fee-market-two-new-ceilings
    order: 3
    title: The two ceilings that were not there in 2024
    teaches: [calldata-floor-price, per-transaction-gas-cap]
    assumes: [intrinsic-gas, gas]
    readingMin: 13
    status: outlined
practices:
  - evm-gas-fee-market-cold-warm-probe
  - evm-gas-fee-market-access-list-breakeven
reflectionPrompt: >
  You measured cold and warm access costs yourself in this module rather than reading them from a
  table, and the first attempt at that measurement produced garbage because the compiler deleted
  the operation being measured. Write down the general rule you now apply before believing any gas
  number — your own or somebody else's — and name one number in your current codebase's assumptions
  that you have never verified.
