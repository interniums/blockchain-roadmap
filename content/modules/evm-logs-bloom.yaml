reflectionPrompt: >
  Take an event from a contract you know and treat its signature as a published API. Write down who
  the consumers are, what happens to each of them the day you add a parameter, and what your
  migration would look like given that no compiler and no type system will warn anyone. Then decide
  whether the event should have been designed differently in the first place.
