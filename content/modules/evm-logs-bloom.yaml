id: evm-logs-bloom
trackId: evm
order: 7
title: Logs & bloom filters
summary: >
  Logs are the only channel that runs out of the chain and never back in: no opcode anywhere can
  read a log, which is why an event is useless to contract logic and indispensable to everything
  off-chain. This module covers the log record itself — address, up to four 32-byte topics, and a
  data blob — the rules that decide which parameters you can search for, what emitting one costs,
  and the fact that logs are Merkle-committed through the receipts root and are therefore provably
  part of the chain. It then covers the 2048-bit bloom filter: how it works, why saturation has
  made it useless in practice, and what is proposed to replace it. It ends on the part that costs
  teams real money — an event signature is an API contract with no compiler guarding it.
layout: { lane: spine, row: 7 }
teaches:
