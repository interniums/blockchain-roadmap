id: evm-opcodes-memory
trackId: evm
order: 6
title: Opcodes & the memory model
summary: >
  Bytes can live in six places inside the EVM — stack, memory, calldata, return data, code and
  storage — plus transient storage since Dencun. They have different lifetimes, different
  addressing, and prices separated by three orders of magnitude, and almost every gas surprise in
  a Solidity codebase is a value sitting in the wrong one. This module makes the six regions
  concrete: why every stack item is 32 bytes and why that makes `uint8` cost more, what "stack too
  deep" really means, what a megabyte of memory costs and why you can never give it back,
  Solidity's memory map and how assembly corrupts it, and where transient storage fits — including
  why a cheap reentrancy guard is not automatically a better one.
