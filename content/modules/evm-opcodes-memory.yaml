reflectionPrompt: >
  Pick one value in a contract you have written and argue it into each of the four writable
  locations in turn — stack, memory, calldata, storage — plus transient storage. For each, say what
  the lifetime buys you and what the price is. Then say which one you would actually choose and
  what measurement would change your mind.
