id: evm-state-tries
trackId: evm
order: 2
title: State & tries
summary: >
  Ethereum's blocks do not store balances. They store transactions and a handful of 32-byte roots,
  and the balances live in a Merkle Patricia Trie that every node maintains independently. This
  module builds that picture from the account record up: why the state is a trie of tries, why
  every key is hashed before use, why writing zero to a slot is a deletion, and what the four
  roots in a block header each commit to. It ends where it matters in practice — with
  `eth_getProof`, the exact sense in which a Merkle proof proves something, and the state-growth
  pressure that is driving a replacement for the trie itself.
layout: { lane: spine, row: 2 }
teaches:
