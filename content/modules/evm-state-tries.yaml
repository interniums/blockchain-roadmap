reflectionPrompt: >
  You are asked to build a feature that needs to know, on-chain, every non-zero storage slot a
  contract holds. Explain why the state structure makes this impossible over standard JSON-RPC,
  what you would have to build instead, and what that tells you about which questions the trie was
  designed to answer cheaply and which it was not.
