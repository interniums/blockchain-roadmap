id: evm-transaction-types
trackId: evm
order: 3
title: Transaction types
summary: >
  There is no such thing as "the" Ethereum transaction format. Five envelope types coexist on
  mainnet in 2026, and anything that signs, decodes, indexes or simulates transactions has to
  handle all of them. This module works through the typed-transaction envelope introduced by
  EIP-2718 and then through each type in turn — legacy, access list, 1559, blob and set-code —
  showing what each one added and what problem it was added for. It closes with two consequences
  that bite in production: blob gas and execution gas are separate markets that do not compete,
  and a sender's transactions execute in strict nonce order, so one stuck transaction blocks
  everything behind it.
layout: { lane: spine, row: 3 }
teaches:
  - eip-2718-envelope
  - tx-type-0-legacy
  - tx-type-1-access-list
  - tx-type-2-1559
  - tx-type-4-setcode
  - tx-type-3-blob
  - separate-fee-markets
  - nonce-ordering
