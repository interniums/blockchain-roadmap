reflectionPrompt: >
  Take a piece of transaction-handling code you have written or read — a signer, an indexer, a
  simulator, a nonce manager. Which of the five envelope types does it silently assume? Write down
  what would break the first time it met each of the other four, and decide whether the fix is to
  handle them or to reject them loudly.
