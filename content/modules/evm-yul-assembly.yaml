reflectionPrompt: >
  Write the rule you would put in your own team's contributing guide for inline assembly: which
  categories are permitted, what evidence a pull request must carry to justify a block, and who has
  to review it. Then apply your own rule to the last assembly block you saw in a real codebase and
  say whether it would have passed.
