id: evm-yul-assembly
trackId: evm
order: 9
title: Yul & inline assembly
summary: >
  Inline assembly is where you stop describing what you want and start telling the machine what to
  do — and where every guarantee Solidity gives you switches off at once. This module covers Yul as
  a language, what the safety net actually contained so you know what you are giving up, Solidity's
  memory conventions as a contract you can violate from inside an assembly block, and the
  `memory-safe` annotation, which is an unchecked promise to the optimizer rather than a check. It
  closes on judgement: the narrow set of cases where assembly is defensible, and the argument that
  its real price is paid in review hours rather than in gas.
layout: { lane: spine, row: 9 }
