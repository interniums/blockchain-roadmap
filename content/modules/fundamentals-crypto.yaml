reflectionPrompt: >
  Pick one authorisation flow in a product you have shipped — a password reset link, a signed
  upload URL, an API token. Write down exactly what its signature or token proves, and what it
  does not. Then name the one assumption that, if wrong, would let someone replay it. Which of
  the three failures in this module is it closest to: a missing domain separator, a non-unique
  identifier, or a proof of membership in a set nobody checked the shape of?
