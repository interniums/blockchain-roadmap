id: fundamentals-crypto
trackId: fundamentals
order: 1
title: Cryptographic primitives
summary: >
  Three primitives carry almost all of the weight in this system: a hash, a signature, and a
  Merkle root. Each one proves something narrower than people assume, and every well-known
  bug class in later tracks is someone acting on the wider assumption. This module fixes the
  exact guarantee of each, then breaks it — the malleable signature that is not a unique
  identifier, the `ecrecover` that returns zero instead of reverting, the Merkle proof for a
  leaf that was never in the tree. It ends with the two structures that make signatures safe
  to show a human (EIP-712) and cheap to produce from a phone (secp256r1 passkeys).
layout: { lane: spine, row: 1 }
