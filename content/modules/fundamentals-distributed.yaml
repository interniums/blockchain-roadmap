id: fundamentals-distributed
trackId: fundamentals
order: 4
title: Distributed systems
summary: >
  A blockchain is a replicated state machine with hostile replicas, and almost every design
  decision in Ethereum falls out of that sentence. This module establishes why replication
  requires strict determinism — the reason the EVM has no clock, no floating point and no
  iteration-order surprises — then separates the two properties a consensus protocol can
  offer and shows why a partitioned network forces a choice between them. It ends with
  Ethereum's actual answer: not a choice at all, but two protocols running at once, an
  available chain and a finalised one. After this, "confirmed" stops being a boolean and
  becomes a question with a number attached.
