id: fundamentals-encoding
trackId: fundamentals
order: 2
title: Data & encoding
summary: >
  Every byte that crosses a boundary in this system — into a contract, onto the wire, into a
  hash — went through one of three encodings, and which one it went through changes what the
  bytes mean. This module takes the 32-byte word as the starting axiom and derives ABI
  encoding, RLP and SSZ from it, then shows the failure that connects all three: an encoding
  that is ambiguous is an encoding you cannot safely hash, and an encoding that is not
  canonical is a consensus split waiting for two clients to disagree. You will finish able to
  hand-decode a real transaction and to explain why `abi.encodePacked` is a vulnerability
  class rather than an optimisation.
layout: { lane: spine, row: 2 }
teaches:
  - byte-word-32
  - endianness
  - abi-encoding
  - function-selector
  - abi-encode-vs-packed
  - packed-hash-collision
  - rlp
  - ssz
  - ssz-merkleization
  - canonical-serialization
