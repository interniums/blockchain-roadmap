reflectionPrompt: >
  Find a place in your own systems where you hash or sign a concatenation of values — a cache
  key, a webhook signature, an idempotency key. Write out whether two different inputs could
  produce the same concatenation, and what would happen if they did. Then decide: would you fix
  it by adding a delimiter, by length-prefixing, or by hashing each field separately? Say why
  the other two are worse.
