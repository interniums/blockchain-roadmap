reflectionPrompt: >
  Pick the largest amount of value your product would ever hold or move in a single on-chain
  action. Write the sentence a risk reviewer would need: "an attacker who wanted to reverse
  this would have to do X, which costs Y, and would gain at most Z." If Z is larger than Y,
  say what you would change — the confirmation policy, the size limit, or the design that
  concentrates that much value in one place.
