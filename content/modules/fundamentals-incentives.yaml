id: fundamentals-incentives
trackId: fundamentals
order: 6
title: Incentives & economics
summary: >
  Nothing in this system is enforced by an authority, so everything has to be arranged so that
  the behaviour you want is also the behaviour that pays. That is mechanism design, and this
  module treats it as engineering rather than economics: what property an auction has, why the
  textbook answer breaks when the auctioneer is also allowed to bid, and why burning the base
  fee is a mechanism requirement rather than a monetary-policy choice. The second half turns
  the same lens on the chain itself and prices attacks — what a third of the stake buys, what a
  half buys, what a slashing actually costs, and why "finalised" is an economic claim with a
  number behind it rather than a mathematical one.
