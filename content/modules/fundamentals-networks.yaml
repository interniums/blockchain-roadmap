id: fundamentals-networks
trackId: fundamentals
order: 3
title: Networks
summary: >
  There is no Ethereum server. Every node holds connections to a handful of peers, and the
  network is nothing but the union of those links, which means every fact a node believes
  arrived through peers it chose from a discovery protocol. This module builds that picture
  from the bottom — discovery, the execution layer's transport, the consensus layer's gossip —
  and then draws the two consequences that break product assumptions: propagation takes
  hundreds of milliseconds so ordering is a local opinion, and "the mempool" is not a queue
  and not global. It closes on the attack that follows directly from the topology: control
  every one of a victim's peers and you control everything the victim believes.
