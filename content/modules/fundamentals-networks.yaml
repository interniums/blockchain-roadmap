reflectionPrompt: >
  Your product shows a user "transaction pending". Write down precisely what your backend
  observed to justify that word, which node observed it, and what would have to be true for a
  different node to disagree. Then state the shortest change to your UI copy that would still
  be true if the node you queried had been eclipsed.
