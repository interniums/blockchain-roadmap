id: fundamentals-state
trackId: fundamentals
order: 5
title: State & data structures
summary: >
  Ethereum's entire world state — every account, every storage slot — is committed to by one
  32-byte number in each block header, and that number is produced by a structure with no
  design freedom left in it. This module builds the Merkle Patricia Trie from the axiom that
  two independent clients must reach byte-identical nodes: four node types and no fifth,
  nibble paths, the hex-prefix encoding that packs an odd path into whole bytes, and the
  inlining rule that quietly breaks most from-scratch implementations. It ends where the
  structure pays for itself — proving one account's balance to somebody holding nothing but a
  block header — and with an honest account of what is replacing it, which is not what the
  2023 roadmap said.
