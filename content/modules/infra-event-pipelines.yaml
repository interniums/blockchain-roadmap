reflectionPrompt: >
  List every irreversible thing your product does in response to an on-chain event - emails, push
  notifications, fiat payouts, exports, third-party API calls, anything a user can see or a regulator can
  read. For each one, say which zone of the chain it is currently triggered from, and what a two-block reorg
  would mean for it today. Then decide which of them you would move behind the finality gate, and what the
  product loses in latency by moving them.
