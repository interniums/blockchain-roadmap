id: infra-event-pipelines
trackId: infra
order: 5
title: Getting indexed data into your product without lying to users
summary: >
  Modern frameworks handle reorgs for you, which moved the interesting failure one layer downstream. This
  module is about the layer they do not cover: your database, your notifications, your exports, your payouts.
  You will build the small number of primitives that make ingestion correct by construction - the right
  natural key, an idempotent write, a cursor committed in the same transaction as the rows it describes - and
  then learn the boundary that decides which of your features may read the tip and which must wait for
  finality. The failure that still costs teams real money in 2026 is not a corrupted table. It is an email
  that went out about a transaction that stopped existing.
layout: { lane: left, row: 1305 }
