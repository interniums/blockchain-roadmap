reflectionPrompt: >
  Assume the compromise is your own admin key, so every privileged path you would normally use to respond is
  now the attacker's path too. Write the first five actions you would take in that world, in order, and name
  for each one what it costs your users if you are wrong about the compromise. Then say which of those five
  you could actually execute today, and what is missing for the rest.
