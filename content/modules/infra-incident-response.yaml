id: infra-incident-response
trackId: infra
order: 8
title: The first fifteen minutes
summary: >
  On-chain incident response has no rollback, no firewall rule and no session to revoke. Once a transaction
  is included the funds are gone, so the entire discipline is about stopping the next transaction rather than
  undoing the last one - under a clock that runs in seconds while human decisions take minutes. This module
  covers the war-room structure that makes parallel work possible, the full containment ladder rather than
  just its top rung, pause designed as a bounded power instead of a safety feature, the preparedness items
  teams discover they lack only during an incident, and the post-mortem that the ecosystem now expects. It
  ends where the track began: with things you should have written down before you needed them.
