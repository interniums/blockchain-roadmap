reflectionPrompt: >
  Name the indexer you would choose for a product you actually want to build, and defend the choice without
  using the word fast. Then answer the harder question: if that project's steward changed direction or shut
  the service down in eighteen months, what would you have to rewrite, how long would it take, and what would
  your users see during the switchover.
