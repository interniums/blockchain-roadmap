id: infra-indexer-selection
trackId: infra
order: 4
title: Choosing an indexer you will not regret
summary: >
  The indexer market became genuinely plural after the hosted service closed, which turned a non-decision
  into a real one. This module is the decision. It covers the three programming models on offer, where the
  speed differences actually come from, why benchmark rankings invert between workloads, and why capability
  gaps - traces, factory contracts, calls inside handlers, chain coverage - decide more selections than
  minutes ever do. It also treats an axis most comparisons leave out: who owns the project. Two of the four
  main options changed steward between late 2025 and early 2026, and a data layer you cannot replace is a
  dependency worth understanding before you build on it.
