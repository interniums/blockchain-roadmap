reflectionPrompt: >
  Write down one query your product needs that no JSON-RPC method can answer, in the exact form the product
  needs it - filters, sort order and all. Then describe the fold that would produce it: which events feed it,
  what the derived table looks like, and what has to happen to that table when the last two blocks are
  replaced by different ones. If your answer to the last part is "nothing", say what your users would see.
