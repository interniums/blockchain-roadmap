id: infra-indexing
trackId: infra
order: 3
title: Turning events into something you can query
summary: >
  A chain has no query engine. It will tell you what a storage slot holds right now and it will not tell you
  which users opened positions last week, sorted by size. An indexer is what closes that gap, and this module
  is about what one actually is: a deterministic fold over an ordered event stream into a database. That
  framing is not decoration - every hard part of indexing follows from the fact that the input stream can be
  rewritten underneath you. The module also carries a fact that invalidates most published tutorials: The
  Graph's free hosted service is gone, so any guide beginning with a hosted deploy describes a path that no
  longer exists.
