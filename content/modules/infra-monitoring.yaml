reflectionPrompt: >
  Write the single alert you would keep if you were allowed only one for a protocol you know well. State the
  predicate precisely enough to implement, say which of the three signal layers it lives on, how often you
  expect it to fire when nothing is wrong, and what the person receiving it at 3am is supposed to do in the
  first sixty seconds. Then say what class of incident your one alert would completely miss.
