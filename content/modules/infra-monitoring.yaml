id: infra-monitoring
trackId: infra
order: 6
title: Watching a protocol you have already shipped
summary: >
  An audit is a point-in-time check of code. Monitoring is a continuous check of state and behaviour, and it
  covers exactly the categories an audit structurally cannot - key compromise, access-control misuse, an
  oracle going stale, a dependency upgrading underneath you, economic drift. This module orders alerting by
  where the losses actually are rather than by what is easy to instrument, which puts privileged actions
  first and clever-Solidity-bug detection well down the list. It also treats the two properties nobody puts
  in a monitoring pitch: a channel that fires on noise is a channel nobody reads during a real incident, and
  a monitor that has silently died is indistinguishable from a healthy protocol.
