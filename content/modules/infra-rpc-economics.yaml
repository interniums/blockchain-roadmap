reflectionPrompt: >
  Take one screen of a product you have built or used - a portfolio page, a position list, a transaction
  history - and enumerate every RPC call one refresh of it makes. For each call say whether it is a tip read
  or a historical read, whether it is standard JSON-RPC or provider-specific, and what happens to the screen
  if that one call returns a 429. Then say which single change would cut the cost of that screen the most,
  and what it would cost you in correctness or freshness.
