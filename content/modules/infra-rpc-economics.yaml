id: infra-rpc-economics
trackId: infra
order: 2
title: What the endpoint costs you
summary: >
  The RPC endpoint is the hardest dependency an on-chain product has and the most common source of its
  outages, and almost nobody prices it before shipping. This module takes the endpoint apart on three axes:
  money, limits and trust. You will learn why a plan measured in millions of units is not a plan measured in
  millions of calls, why two providers with identical headline prices can differ tenfold on your workload,
  why an app can be far under quota and still be throttled, and why a load-balanced provider can hand you a
  block height that moves backwards. It closes on the build-versus-buy decision, priced in the currency that
  actually decides it, which is engineering time rather than hardware.
