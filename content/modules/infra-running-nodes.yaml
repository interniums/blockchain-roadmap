id: infra-running-nodes
trackId: infra
order: 1
title: Running the thing everything else talks to
summary: >
  Every other module in this track assumes something is serving JSON-RPC. This one is about what that
  something actually is: two processes, not one, joined by an authenticated API on a port nobody documents
  until it breaks. You will choose a sync mode knowing exactly which questions it makes unanswerable,
  understand why an archive node costs terabytes when the entire block history does not, and learn why the
  disk - specifically its random-read latency - decides whether your node keeps up with head. The 2026
  material here is genuinely different from the 2022 material: history expiry means a node may legally
  forget things, and blob data was never on the execution side to begin with.
layout: { lane: left, row: 1301 }
teaches:
  - node-two-process-model
  - el-client-landscape
  - cl-client-landscape
  - client-diversity-risk
  - sync-mode-snap
  - sync-mode-full-exec
  - sync-mode-archive
  - checkpoint-sync
  - archive-cost-is-state-not-blocks
  - history-expiry-4444
  - blob-storage-is-separate
  - peerdas-node-impact
  - disk-is-the-bottleneck
  - offline-pruning-treadmill
