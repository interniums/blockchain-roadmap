  - id: infra-running-nodes-two-programs
    order: 1
    title: An Ethereum node is two programs
    teaches: [node-two-process-model, el-client-landscape, cl-client-landscape]
    assumes: [validator, block-header-is-the-block]
    readingMin: 14
  - id: infra-running-nodes-which-client
