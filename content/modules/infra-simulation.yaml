reflectionPrompt: >
  Describe a transaction you would be genuinely nervous to send - an upgrade, a large migration, a governance
  execution. Write down what you would simulate before sending it, in what environment, and what specific
  observation would make you send it anyway. Then write down the thing that could still go wrong after a
  perfectly green rehearsal, and say whether you would accept that risk or design it away.
