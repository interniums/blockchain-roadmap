id: infra-simulation
trackId: infra
order: 7
title: Finding out before you send it
summary: >
  Simulation is executing a transaction against a chosen state without broadcasting it, and the biggest
  change since 2024 is that it stopped being a vendor capability. Multi-transaction, multi-block simulation
  with state and block overrides is now a standardised execution-API method, which means the teaching moved
  from "how do I simulate" to "what does a green simulation actually prove". This module builds the ladder
  from a plain call up to a hosted, persistent fork a whole team can point at, and then applies it to the two
  places it pays for itself: rehearsing a proxy upgrade against live storage, and rehearsing a governance
  proposal end to end so voters can see what the calldata really does.
