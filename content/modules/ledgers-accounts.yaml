id: ledgers-accounts
trackId: ledgers
order: 2
title: The account model
summary: >
  An Ethereum account is four fields. Not a row with an address column, not a container holding
  code and storage — four fields, sitting under a key derived from an address it does not itself
  store. This module takes that record apart field by field and shows what each one actually
  buys: why the nonce silently imposes a total order on everything one sender does, why ETH is
  not a token and never was, why storage and code are pointed at rather than contained, and why
  the sentence "EOAs have no code" stopped being true in May 2025 and took a common security
  check down with it.
layout: { lane: spine, row: 2 }
teaches:
  - account-four-fields
  - account-address-not-stored
  - account-storage-root
  - account-code-hash
  - accounts-enable-stateful-contracts
  - account-balance-wei
  - empty-account-clearing
  - account-nonce-eoa
  - account-nonce-contract
  - nonce-total-ordering
  - nonce-replay-protection
  - eip-155-chain-id-replay
  - eoa-contract-line-is-blurred
  - utxo-vs-account-tradeoff
