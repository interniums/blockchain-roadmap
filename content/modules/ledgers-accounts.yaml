reflectionPrompt: >
  You are designing a backend that sends transactions from one hot wallet on behalf of many users.
  Given what the nonce actually is, write down what must be true of your system for it to send
  fifty transactions per minute without ever producing a gap or a collision. Then say which part
  of that design you would be most worried about at three in the morning, and why.
