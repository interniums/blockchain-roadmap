reflectionPrompt: >
  Pick one header field that exists only because removing it would have broken the encoding, and
  one that was added to let contracts see something they previously could not. Write down what
  each tells you about how this protocol changes. Then answer: if you were designing the header
  today with no compatibility obligations, which currently-live field would you drop first, and
  what would break?
