id: ledgers-blocks
trackId: ledgers
order: 3
title: Blocks, headers and the chain
summary: >
  A block is not a container of transactions that happens to have a hash. The header is the block:
  it is the only part that is hashed and linked, and everything in the body reaches consensus by
  being committed to through a root inside that header. This module reads a modern mainnet header
  field by field and asks of each one what it commits to, when it was added, and whether it is
  still alive — because roughly a fifth of the header is now archaeology kept only so the encoding
  never had to change. It also separates two counters that developers routinely confuse: block
  numbers, which never skip, and slots, which do.
layout: { lane: spine, row: 3 }
teaches:
