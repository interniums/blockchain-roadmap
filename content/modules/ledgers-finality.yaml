reflectionPrompt: >
  Pick a product you have actually shipped or would like to ship. Write down the largest single
  amount of value one user action can move through it, and then decide what that action must wait
  for: one slot, several slots, or finality. Defend the choice against the cost of reversing the
  chain at that depth. Then say what your answer implies about the user experience, and whether you
  would still ship it.
