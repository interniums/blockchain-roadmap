id: ledgers-finality
trackId: ledgers
order: 6
title: Finality, reorgs and who really builds blocks
summary: >
  "Confirmed" is not one thing. Ethereum gives you three distinct confidence levels — head,
  justified and finalized — each with a different and quantifiable cost to reverse, and choosing
  between them is a product decision, not a technical one. The second half of this module is the
  part nobody expects: the validator whose name is on a block usually did not build it. Roughly
  nine blocks in ten are assembled by an external builder, escrowed through a relay, and signed
  blind by the proposer. That pipeline is how Ethereum handles extractable value today, and it is
  also where the chain is most concentrated.
layout: { lane: spine, row: 6 }
teaches:
