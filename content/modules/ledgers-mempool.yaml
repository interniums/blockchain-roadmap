id: ledgers-mempool
trackId: ledgers
order: 4
title: The mempool, and where transactions really go
summary: >
  Almost every wrong intuition a product engineer has about Ethereum lives here. There is no global
  mempool — every node keeps its own, and two of them legitimately disagree. Pending is not a
  queue, so arriving early buys nothing. There is no cancel, only a race at the same nonce. And in
  2026 the public pool is no longer even the main route to inclusion: a large share of valuable
  order flow goes straight to builders through private endpoints, which is simultaneously the best
  user-level MEV protection available and the mechanism concentrating block building into very few
  hands. This module is the one that changes how you build transaction UX.
layout: { lane: spine, row: 4 }
teaches:
