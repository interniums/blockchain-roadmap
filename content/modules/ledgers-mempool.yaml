reflectionPrompt: >
  Write the "your transaction is pending" screen for a consumer app, given that pending is a set
  rather than a queue and that the transaction may be invisible in every public pool. Specify what
  the user sees at fifteen seconds, two minutes and ten minutes, and say exactly what your retry
  button does at the protocol level. Then name the one thing your design is lying to the user about,
  because every design here lies about something.
