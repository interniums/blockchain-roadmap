reflectionPrompt: >
  The correlation penalty means the same mistake costs one operator almost nothing and costs a
  large coordinated group everything. Write down what behaviour that design is trying to price,
  and then apply it: if you were running validators, name the three specific operational choices
  this changes, and the one you would still get wrong because the cheaper option is so much easier.
