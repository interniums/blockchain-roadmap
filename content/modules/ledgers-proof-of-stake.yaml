id: ledgers-proof-of-stake
trackId: ledgers
order: 5
title: Proof of stake, from the validator's seat
summary: >
  Proof of stake is easier to understand as an economics problem than as a cryptography problem.
  A validator posts capital, gains the duty to propose and to vote, and is paid for participating
  and punished for defecting — but the two punishments are wildly different in kind. Being offline
  leaks a little. Signing two contradictory messages is slashable, and the amount you lose depends
  almost entirely on how many other validators did the same thing at the same time. This module
  builds the slot and epoch clock, the committee sampling that keeps voting affordable, and then
  the three slashable offences and the correlation curve that prices them.
layout: { lane: spine, row: 5 }
teaches:
  - validator
  - slot-and-epoch
  - slot-timing
  - attestation
  - committee
  - slashing
  - double-proposal-slashing
  - double-vote-slashing
  - surround-vote-slashing
  - correlation-penalty
  - slashing-timeline
