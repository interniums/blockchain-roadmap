id: ledgers-utxo
trackId: ledgers
order: 1
title: The other way to build a ledger
summary: >
  Bitcoin does not have accounts and does not have balances. Its state is a set of discrete
  unspent outputs, each locked by a predicate, and a transaction destroys some and creates others.
  This module is conceptual only — no Bitcoin tooling, no wallets, no node. Its single job is to
  put a second, fully working design on the table before you meet Ethereum's, so that the account
  model reads as a decision with costs rather than as the obvious way to do it. Everything you
  later find awkward about Ethereum — global ordering, nonces, contention, MEV — is the bill for
  that decision, and everything you find easy is what it bought.
layout: { lane: spine, row: 1 }
