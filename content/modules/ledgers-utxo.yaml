practices: [ledgers-utxo-escrow-in-two-ledgers]
reflectionPrompt: >
  Pick something your product needs to do with money — a subscription, a refund, an escrow, a
  split payment. Describe how you would represent it in each model. Then answer honestly: which
  of the two would you rather implement it in, and which of the two would you rather audit it in?
  If those are different answers, say why.
