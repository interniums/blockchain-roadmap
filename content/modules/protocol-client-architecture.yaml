id: protocol-client-architecture
trackId: protocol
order: 1
title: Two processes pretending to be a node
summary: >
  A full Ethereum node has been two independently written programs since the Merge, joined by one
  private authenticated channel that nobody outside the machine is supposed to reach. This module
  takes that channel apart: what the execution client owns, what the consensus client owns, which
  of them decides what is canonical, and the three Engine API calls that carry every block between
  them. It ends on client diversity, treated not as an ideology but as a blast-radius calculation
  with two specific thresholds — and on why the client-share figures most courses quote cannot all
  be true at once.
