id: protocol-consensus-specs
trackId: protocol
order: 2
title: The specification is a program you can run
summary: >
  Ethereum's consensus specification is not prose that clients interpret. It is Python inside
  markdown, extracted by tooling into a package you can import, execute and debug — and the test
  vectors every client runs in CI are generated by executing it. This module teaches you to work
  the specs the way core developers do: build the pyspec, advance a beacon state by hand under the
  minimal preset, understand why each fork's document is a diff over the last, and read a protocol
  change across all four artifacts that describe it. It also fixes the naming confusion that taxes
  every newcomer — star names on one layer, city names on the other.
