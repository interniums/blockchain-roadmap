id: protocol-contributing
trackId: protocol
order: 7
title: Getting your name into a client
summary: >
  Everything in this track is written by people you can go and work alongside. This module is the
  practical route in: which codebases exist and how to pick one by language and review process
  rather than prestige, where a first contribution actually gets merged — tests, tooling, docs,
  reproductions, not consensus-critical code — how to read All Core Devs before writing anything,
  and how the Ethereum Protocol Fellowship and the open study group relate to each other. It is
  deliberately unromantic about what protocol work is: mostly systems engineering, and only
  occasionally cryptography.
