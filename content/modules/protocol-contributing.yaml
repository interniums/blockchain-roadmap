reflectionPrompt: >
  Protocol work is mostly systems engineering — networking, databases, sync, concurrency,
  performance — and only occasionally cryptography. Take an honest inventory against that list: what
  you already do well, what you would have to learn, and how long that would take you. Then name the
  one client repository you would commit to for six months and say what specifically made you choose
  it over the others, in terms you would be willing to defend to its maintainers.
