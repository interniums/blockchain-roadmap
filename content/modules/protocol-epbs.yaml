reflectionPrompt: >
  ePBS removes the relay from the block supply chain and leaves building as concentrated as it
  found it. Decide whether you consider that a success or a half-measure, and write the argument.
  Your answer must name what the relay was actually protecting against, say who bears the risk once
  it is gone, and state what would have to change for building itself to decentralise — including
  whether you believe any protocol change could do it.
