id: protocol-epbs
trackId: protocol
order: 4
title: Enshrining the block builder, and the upgrade that carries it
summary: >
  Roughly nine in ten mainnet blocks are built by someone other than the validator who proposes
  them, and the escrow that makes that safe is a handful of trusted relays. EIP-7732 moves the
  arrangement into the protocol: builders become staked in-protocol entities, the proposer commits
  to a bid rather than a payload, payment happens whether or not the payload appears, and a new
  committee votes on nothing but timeliness. This module also carries the surrounding upgrade
  politics — block-level access lists, the inclusion-list proposal that was cut, and the discipline
  of scoping an upgrade. Everything here is unshipped and moves; treat every parameter as a draft.
