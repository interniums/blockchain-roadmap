id: protocol-fork-choice
trackId: protocol
order: 3
title: Choosing the head, and the attacks on choosing it
summary: >
  Fork choice answers one question every slot: given every block and vote I have seen, which block
  is the head? This module works through Gasper — LMD-GHOST picking the head inside the branch
  Casper FFG has justified — and then spends most of its length on what goes wrong. Proposer boost
  is a dial with two failure modes and no setting that removes both. Ex-ante and ex-post reorgs
  attack from opposite sides of the moment a block is published. Balancing attacks split the
  network without a majority. The module closes on the proposals that would replace the whole
  arrangement, and on the confirmation rule that gives useful confidence long before finality.
layout: { lane: left, row: 1103 }
