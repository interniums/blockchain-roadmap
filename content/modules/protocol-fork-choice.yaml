reflectionPrompt: >
  Proposer boost cannot be set to a value that prevents both ex-ante and ex-post reorgs. Pick the
  side you would err towards if the decision were yours, and defend it in terms of who is harmed in
  each failure: name the party that loses in your chosen failure mode, how often it would happen,
  and what they could do about it. Then say what evidence would change your mind.
