id: protocol-peerdas
trackId: protocol
order: 5
title: Nobody downloads the blobs any more
summary: >
  Since Fusaka, a mainnet node does not download whole blobs at all. Blobs are erasure-extended into
  a matrix, sliced into columns, and each node keeps only the columns its own node id assigns it,
  sampling a handful more to convince itself the rest exists. This module works through the
  mechanism at spec level: the constants, the derivation from node id to custody group to column,
  the probability argument that makes eight samples enough network-wide, and the reconstruction and
  cross-seeding rules that let a partially withheld block heal. It ends where it has to — on the
  fact that sampling has to finish before the attestation deadline.
