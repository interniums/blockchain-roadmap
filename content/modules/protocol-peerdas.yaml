reflectionPrompt: >
  Before PeerDAS, a node that said the data was available had downloaded it. Now it means the node
  holds its assigned columns and its samples passed. Write down what your own service actually needs
  from that statement — reconstructability by someone, retrievability by you, or retrievability by
  you in eighteen months — and say which of the three PeerDAS gives you, which it does not, and what
  you would have to run yourself to cover the gap.
