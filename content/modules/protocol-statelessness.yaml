reflectionPrompt: >
  You have just discovered that a design you taught, wrote about or built on for four years was
  cancelled, and that the reasons had nothing to do with whether it worked. Write the process change
  you would adopt so that the next cancellation reaches you earlier: name the specific artifact you
  would watch, how often, and what signal in it would have told you first. Then say honestly what
  that process costs you every week it finds nothing.
