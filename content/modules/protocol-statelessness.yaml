id: protocol-statelessness
trackId: protocol
order: 6
title: The state tree, and the plan that got cancelled
summary: >
  Ethereum's state is hundreds of gigabytes and only grows, and it is the real reason running a node
  is expensive. The plan to fix that was Verkle trees, taught in every roadmap article for four
  years, and it has been dropped. This module teaches what statelessness actually requires, why
  witness size is the blocker, why a vector commitment was the obvious answer and why it stopped
  being one, and what replaced it: a hash-based binary tree with a unified key space and a migration
  that freezes the old tree instead of converting it. It also holds the competing route — real-time
  proving — without declaring a winner, because the sources do not.
