id: scaling-blobs-peerdas
trackId: scaling
order: 4
title: Posting a batch, and paying for it
summary: >
  This is the rollup side of blobs: the component that actually posts, the transaction type it
  posts with, and the second gas market it has to trade against. You will learn why the batcher
  is not the sequencer, why posting data and posting a state root are separate submissions with
  separate failure modes, and how the blob base fee moves independently of execution gas — which
  is why a batcher must re-decide between blobs and calldata on every batch. It closes on the
  capacity schedule: since EIP-7892, blob target and max move on their own fork cadence, and the
  values most curricula teach are stale.
