reflectionPrompt: >
  Your batcher has been posting on a fixed schedule since launch and nobody has looked at it since.
  Write down the two market regimes it must survive — blob fee at the floor, and blob fee spiking
  while execution gas is calm — and say what your current configuration does wrong in each.
