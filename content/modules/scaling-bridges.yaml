id: scaling-bridges
trackId: scaling
order: 7
title: Bridges, ranked by what they ask you to trust
summary: >
  Every bridge is the rollup's own bridge plus something extra, and the something extra is the
  whole subject. This module starts with the native bridge — whose security is just the rollup's
  — and the structural asymmetry that makes deposits fast and withdrawals slow. It then adds each
  extra trust assumption in turn: pooled liquidity, a solver, an attester, a committee. The second
  half is the exploit record, which is unusually well documented and unusually consistent: the
  headline losses came from stolen keys, missing access control, and verification code that did
  not verify. None of them were cryptography failures.
