id: scaling-data-availability
trackId: scaling
order: 3
title: Where the data goes decides what the chain is
summary: >
  Data availability is the most misunderstood guarantee in the stack. It is a claim about
  publication at a moment in time, not about storage, and it says nothing at all about whether
  the state transition was correct. This module separates availability from retrievability and
  from validity, shows how sampling makes withholding detectable, and then uses the answer to
  one question — where does the data go — to sort chains into rollups, validiums and optimiums.
  It ends on the withholding attack: a valid proof over data nobody has, with funds nobody can
  reach and no misbehaviour anyone can prove on L1.
layout: { lane: right, row: 3 }
