id: scaling-forced-inclusion
trackId: scaling
order: 6
title: Getting out past a sequencer that will not help you
summary: >
  Forced inclusion is the mechanism that makes a rollup escapable, and almost every description
  of it oversells what it does. This module walks the L1 path concretely — the queue, the
  permissionless call that drains it, the delay you must wait through and why that delay exists —
  in both the Arbitrum and OP Stack shapes. It then widens out to the part curricula skip: getting
  ordered is one of four chokepoints, a whitelisted state-root proposer can freeze withdrawals
  independently, an instantly upgradeable contract gives you an exit window of zero, and every
  escape path needs L1 gas at exactly the moment everyone else wants it too.
layout: { lane: right, row: 6 }
