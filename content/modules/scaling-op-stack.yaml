id: scaling-op-stack
trackId: scaling
order: 8
title: Running an OP Stack chain, and what the Superchain actually shares
summary: >
  The OP Stack is the concrete rollup you can stand up and take apart. The central idea is
  derivation: L2 blocks are a deterministic function of L1 data, so L2 nodes run no consensus
  among themselves and the sequencer only influences the function's input. That single fact
  explains the three block labels, why history survives a dead sequencer, and why forced
  inclusion works at all. The module then covers what joining the Superchain means — shared
  contracts, standards and governance, with interop still in development — and closes on the
  operations a deployment guide will not tell you about.
