reflectionPrompt: >
  You have deployed the chain. Write down a named human owner for each of these: running the
  batcher, running the proposer, running the challenger, holding the upgrade key, deciding when to
  adopt a contract release, and answering a user who cannot withdraw. Any blank is a risk you are
  currently carrying without knowing it.
