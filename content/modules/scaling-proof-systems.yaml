id: scaling-proof-systems
trackId: scaling
order: 5
title: Fraud proofs and validity proofs, compared honestly
summary: >
  Both proof families are live in production in 2026, which invalidates most of the material
  written about them before 2025. This module teaches the fraud-proof mechanism properly —
  bisection down to a single instruction, executed inside an on-chain VM — and then the
  assumptions it rests on, which are about people rather than code: someone watching, funded,
  and able to reach L1. It gives validity proofs the same treatment, including the recurring
  compute bill and the proving latency that the phrase "instant finality" hides. It closes by
  arguing that proof type does not determine trust level, which is where the track began.
layout: { lane: right, row: 5 }
