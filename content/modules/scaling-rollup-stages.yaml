id: scaling-rollup-stages
trackId: scaling
order: 1
title: What a rollup is, and what it is not
summary: >
  A rollup moves execution off Ethereum and posts enough to Ethereum that anyone can check the
  result and leave without permission. That is the promise. This module separates the promise
  from what any specific chain has actually shipped. You will learn the two proof families, the
  two properties that make a rollup escapable, and L2BEAT's stage framework — which grades chains
  on governance and exit guarantees, not on proof type. The point the whole track hangs on lands
  here: zkSync Era and Linea run validity proofs and are still Stage 0, because a multisig that
  can replace the verifier outranks the verifier.
layout: { lane: right, row: 1 }
