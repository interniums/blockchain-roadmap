id: scaling-sequencers
trackId: scaling
order: 2
title: The one process every L2 depends on
summary: >
  Every major L2 in 2026 is ordered by a single company-run process. This module makes that
  concrete: where your transaction goes first, why the green tick in your wallet is a promise
  rather than a proof, and exactly which harms a hostile sequencer can and cannot do to you.
  It then follows the money — gross fees minus L1 posting cost is the whole business — and
  looks honestly at the three proposed fixes, including which of them shut down. The closing
  point is that decentralising sequencing changes liveness and censorship only; it does not
  touch the upgrade keys.
