id: scaling-stylus
trackId: scaling
order: 9
title: A second VM on the same chain
summary: >
  Arbitrum Stylus adds a WASM VM that runs alongside the EVM on the same state, so Rust, C and C++
  contracts share accounts, storage and the ABI with Solidity ones. The interesting part is not the
  language, it is the cost profile: compute gets dramatically cheaper, storage costs exactly what it
  costs in the EVM, and memory is priced per page instead of quadratically. That combination decides
  what Stylus is for and — more usefully — what it is not for. The module also covers the operational
  obligation Solidity developers have no equivalent for: on-chain activation, and reactivation.
