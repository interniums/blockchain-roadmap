id: security-audit-craft
trackId: security
order: 7
title: Audit craft
summary: >
  The core skill of auditing is not finding bugs, it is writing findings that get fixed. A finding is a
  persuasive document with a reproduction, an impact, and a fix, addressed to an engineer who does not want
  to believe you. This module teaches the finding template, the two incompatible severity conventions in
  daily use, the codebase maturity assessment that exists so a client with zero criticals still learns
  something, and how to read the parts of a public report that determine what audited actually means -
  scope, commit, and engineer-weeks.
layout: { lane: spine, row: 7 }
teaches:
  - finding-anatomy
  - exploit-scenario
  - poc-as-proof
  - severity-vs-difficulty
  - impact-likelihood-matrix
  - informational-vs-finding
  - false-positive-cost
  - code-maturity-assessment
  - maturity-category
  - maturity-rating
  - scope-statement
  - engineer-weeks
  - fix-review
  - audit-is-not-a-guarantee
lessons:
  - id: security-audit-craft-what-a-finding-must-do
    order: 1
    title: What a finding has to do to a reader who disagrees with it
    teaches: [finding-anatomy, exploit-scenario, poc-as-proof]
    assumes: [threat-scenario, shrinking]
    readingMin: 17
    status: outlined
  - id: security-audit-craft-two-severity-systems
    order: 2
    title: Two severity systems, and a High that means different things
    teaches: [severity-vs-difficulty, impact-likelihood-matrix]
    assumes: [finding-anatomy]
    readingMin: 15
    status: outlined
  - id: security-audit-craft-findings-that-are-not-findings
    order: 3
    title: The findings that should not be findings
    teaches: [informational-vs-finding, false-positive-cost]
    assumes: [severity-vs-difficulty]
    readingMin: 12
    status: outlined
  - id: security-audit-craft-rating-a-clean-codebase
    order: 4
    title: Rating a codebase that produced no critical findings
    teaches: [code-maturity-assessment, maturity-category, maturity-rating]
    assumes: [finding-anatomy, invariant-as-spec]
    readingMin: 18
    status: outlined
  - id: security-audit-craft-what-audited-bought
    order: 5
    title: Reading a report for what the engagement actually bought
    teaches: [scope-statement, engineer-weeks, fix-review, audit-is-not-a-guarantee]
    assumes: [code-maturity-assessment]
    readingMin: 18
    status: outlined
practices:
