id: security-contests
trackId: security
order: 8
title: Competitive contests and bug bounties
summary: >
  Two different games are usually taught as one. An audit contest splits a fixed pool across everyone who
  found each bug in frozen pre-deployment code; a bug bounty pays a single reporter for a bug in live code.
  The incentives, the skills and the realistic outcomes differ completely. This module covers the payout
  arithmetic that makes breadth-without-depth unprofitable, the scope rules that invalidate a large share of
  first submissions, the judging and escalation mechanisms that make being right insufficient, and an
  honest account of what a first contest actually returns.
