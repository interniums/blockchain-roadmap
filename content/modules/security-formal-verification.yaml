id: security-formal-verification
trackId: security
order: 6
title: Formal verification, and what its green checkmark excludes
summary: >
  Formally verified is a claim about a specification under a configuration, not about a contract. This
  module teaches the machinery - solver, path constraints, counterexample - then spends most of its time on
  the three things that determine what a proof actually means: whether reasoning was bounded, which called
  functions were replaced by approximations, and which optimistic assumptions were switched on to make the
  run terminate. Reading a verification report for its assumptions section is the transferable skill; the
  three tools in current use prove structurally different statements and are compared on that basis.
layout: { lane: spine, row: 6 }
teaches:
  - smt-solver
  - counterexample
  - bounded-verification
  - unbounded-verification
  - loop-invariant
  - spec-language-cost
  - spec-as-test-reuse
  - parametric-rule
  - ghost-and-hook
  - summarization
  - optimistic-assumption
  - verification-timeout
  - fv-scope-boundary
  - fv-roi
lessons:
  - id: security-formal-verification-solver-and-counterexample
    order: 1
    title: Constraints go in, a witness comes out
    teaches: [smt-solver, counterexample]
    assumes: [symbolic-execution, formal-verification]
    readingMin: 15
  - id: security-formal-verification-bounded-or-not
    order: 2
    title: How far the proof reaches, and how you would know
    teaches: [bounded-verification, unbounded-verification, loop-invariant]
    assumes: [smt-solver, halmos]
    readingMin: 18
  - id: security-formal-verification-writing-a-spec
    order: 3
    title: The two ways to say what must be true
    teaches: [spec-language-cost, spec-as-test-reuse, parametric-rule, ghost-and-hook]
    assumes: [certora-prover, ghost-variable, invariant-as-spec]
    readingMin: 19
  - id: security-formal-verification-what-is-excluded
    order: 4
    title: Everything the green checkmark did not cover
    teaches: [summarization, optimistic-assumption, verification-timeout]
    assumes: [unbounded-verification, spec-language-cost]
    readingMin: 17
  - id: security-formal-verification-where-it-pays
    order: 5
    title: Deciding whether to buy a proof at all
    teaches: [fv-scope-boundary, fv-roi]
    assumes: [trust-boundary, tool-stack-not-tool]
    readingMin: 14
practices:
  - security-formal-verification-halmos-on-existing-tests
  - security-formal-verification-loop-bound-sweep
  - security-formal-verification-summarization-hole
  - security-formal-verification-read-an-fv-appendix
reflectionPrompt: >
  Pick one property in a system you care about. Would you rather have a proof of it under three
  summarizations you chose yourself, or a fuzz campaign with no summarizations and no proof? Defend the
  answer in terms of what each one would have missed.
