id: security-fuzzing
trackId: security
order: 5
title: Fuzzing for bugs
summary: >
  Track 05 taught you to run a fuzzer. This module is about making one find something. The controlling
  claim is that property quality dominates tool choice: a weak property under the best fuzzer finds
  nothing, and a sharp property under Foundry's built-in runner finds the bug. So the sequence is
  properties first, then the harness that lets the fuzzer reach real state, then the knobs that make a
  campaign converge, and only at the end the question of which of Foundry, Echidna and Medusa to run it
  under.
layout: { lane: spine, row: 5 }
teaches:
  - invariant-testing
  - property-mode
  - assertion-mode
  - optimization-mode
  - handler-contract
  - input-clamping
  - revert-blindness
  - economic-property
  - path-independence
  - round-trip-property
  - differential-fuzzing
  - reference-model
  - coverage-guided-fuzzing
  - corpus-reuse
  - sequence-length
  - shrinking
  - onchain-fuzzing
lessons:
  - id: security-fuzzing-the-oracle-problem
    order: 1
    title: The fuzzer generates inputs; you supply the reason to care
    teaches: [invariant-testing, property-mode, assertion-mode, optimization-mode]
    assumes: [stateful-fuzzing, system-level-invariant, invariant]
    readingMin: 18
  - id: security-fuzzing-harness-and-clamping
    order: 2
    title: Making the fuzzer spend its budget somewhere reachable
    teaches: [handler-contract, input-clamping, revert-blindness]
    assumes: [invariant-testing]
    readingMin: 17
  - id: security-fuzzing-properties-worth-writing
    order: 3
    title: Four properties that catch most economic bugs
    teaches: [economic-property, path-independence, round-trip-property]
    assumes: [solvency-invariant, ghost-variable, rounding-direction-invariant]
    readingMin: 17
  - id: security-fuzzing-differential
    order: 4
    title: When the oracle is another implementation
    teaches: [differential-fuzzing, reference-model]
    assumes: [assertion-mode]
    readingMin: 14
  - id: security-fuzzing-making-campaigns-converge
    order: 5
    title: Why a campaign that ran all night found nothing
    teaches: [coverage-guided-fuzzing, corpus-reuse, sequence-length, shrinking]
    assumes: [handler-contract, revert-blindness]
    readingMin: 19
  - id: security-fuzzing-against-real-state
    order: 6
    title: Fuzzing a protocol you did not write, against the state it actually has
    teaches: [onchain-fuzzing]
    assumes: [coverage-guided-fuzzing, fork-cheatcodes]
    readingMin: 12
practices:
  - security-fuzzing-vault-invariant-suite
  - security-fuzzing-unclamp-and-remeasure
  - security-fuzzing-differential-math
  - security-fuzzing-optimization-mode-profit
reflectionPrompt: >
  Take one property you wrote in this module. If the campaign had passed for a week, what would you
  actually be entitled to believe - and what would you still need to check another way?
