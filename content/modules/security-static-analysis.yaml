    readingMin: 16
    status: outlined
  - id: security-static-analysis-symbols-instead-of-numbers
    order: 2
    title: Running the code with symbols instead of numbers
    teaches: [symbolic-execution, halmos]
    assumes: [static-analysis]
    readingMin: 15
    status: outlined
  - id: security-static-analysis-generating-inputs
    order: 3
    title: Generating inputs until an author-stated property breaks
