id: security-static-analysis
trackId: security
order: 4
title: Static analysis and the tool landscape
summary: >
  A map of the assurance tools before any of them is used in anger: what each category of tool actually
  reasons about, what it structurally cannot see, and how a review team sequences them. Static analysis is
  fast and prone to false positives; symbolic execution reasons about input classes; property fuzzing
  samples; formal verification proves under assumptions. The closing point is the one that survives every
  tool release - no single tool has adequate coverage, and the scarce resource being spent is reviewer
  attention rather than compute.
layout: { lane: spine, row: 4 }
teaches:
  - static-analysis
  - slither
  - aderyn
  - symbolic-execution
  - halmos
  - property-fuzzing
  - echidna
  - medusa
  - formal-verification
  - certora-prover
  - tool-stack-not-tool
