id: security-threat-modeling
trackId: security
order: 1
title: Threat modeling
summary: >
  The design-time half of security. Before asking which bugs exist, ask what would have to be true for
  this system to be safe and who is in a position to falsify it. You learn to cut a protocol into trust
  zones, enumerate actors by capability rather than job title, follow data across every boundary, and
  write the assumptions down as invariants that a fuzzer, a prover and a monitor can all consume. The
  anchor case is the February 2025 Bybit theft, in which no Solidity was wrong and every failure sat at
  a boundary outside the contracts.
layout: { lane: spine, row: 1 }
teaches:
  - trust-zone
  - trust-boundary
  - contract-boundary
  - actor-enumeration
  - capability-not-role
  - trust-assumption-inventory
  - data-flow-crossing
  - offchain-attack-surface
  - blind-signing
  - invariant-as-spec
  - function-level-invariant
  - system-level-invariant
  - invariant-driven-development
  - threat-scenario
  - threat-model-document
  - threat-model-cadence
lessons:
  - id: security-threat-modeling-where-money-leaves
    order: 1
    title: Where the money actually leaves
    teaches: [trust-zone, trust-boundary, contract-boundary]
    assumes: [call-frame, account]
    readingMin: 14
  - id: security-threat-modeling-actors-by-capability
    order: 2
    title: Everyone who can touch the system, listed by what they can cause
    teaches: [actor-enumeration, capability-not-role, trust-assumption-inventory]
    assumes: [trust-zone, access-ownable]
    softAssumes: [upgrade-key-risk]
    readingMin: 16
  - id: security-threat-modeling-following-the-data
    order: 3
    title: Following one value across a boundary until someone else chooses it
    teaches: [data-flow-crossing, offchain-attack-surface, blind-signing]
    assumes: [trust-boundary, delegatecall-proxy]
    readingMin: 15
  - id: security-threat-modeling-invariants-are-the-spec
    order: 4
    title: Invariants are the specification, not a kind of test
    teaches: [invariant-as-spec, function-level-invariant, system-level-invariant, invariant-driven-development]
    assumes: [invariant, trust-assumption-inventory]
    readingMin: 18
  - id: security-threat-modeling-scenarios-and-cadence
    order: 5
    title: Turning a boundary crossing into an attack somebody can argue with
    teaches: [threat-scenario, threat-model-document, threat-model-cadence]
    assumes: [data-flow-crossing, capability-not-role]
    readingMin: 16
practices:
  - security-threat-modeling-boundary-map
  - security-threat-modeling-tx-origin-7702
  - security-threat-modeling-invariant-gas-placement
reflectionPrompt: >
  Pick the system you know best. Which of its trust assumptions would you be least willing to defend in
  writing to someone who lost money when it failed, and what would it cost to stop assuming it?
