reflectionPrompt: >
  You now know that a selector is four bytes of a hash and that a proxy and its implementation are
  compiled separately. Write down the argument you would make to a team that wants to add an admin
  function to a proxy contract: what could go wrong, what evidence would you ask for, and what
  design would you propose instead.
