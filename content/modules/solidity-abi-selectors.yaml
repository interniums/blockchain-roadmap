id: solidity-abi-selectors
trackId: solidity
order: 3
title: The ABI, selectors and calldata
summary: >
  A contract call is a byte string. Four bytes name the function, the rest is a precisely specified
  encoding of the arguments, and a contract's dispatcher is ordinary compiled code that searches for
  a match. This module makes that byte string readable: derive a selector by hand, walk head and
  tail offsets in a nested encoding, and understand why two functions can share four bytes and why
  abi.encodePacked can forge a hash. Everything you decode later — proxies, multicall routers,
  malicious backdoors — is this module applied.
layout: { lane: spine, row: 3 }
teaches:
  - abi-function-selector
  - abi-canonical-signature
  - abi-return-type-not-in-selector
  - abi-selector-space
  - abi-selector-collision-risk
  - abi-dispatch
  - abi-dispatch-gas-not-uniform
  - abi-fallback-receive
  - abi-static-vs-dynamic
  - abi-head-tail
  - abi-offsets-relative
  - abi-dynamic-array-layout
  - abi-decode-validates
  - abi-strict-mode-not-enforced
  - abi-packed-encoding
  - abi-msg-data-msg-sig
