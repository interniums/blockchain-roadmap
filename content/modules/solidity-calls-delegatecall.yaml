id: solidity-calls-delegatecall
trackId: solidity
order: 4
title: Whose context are you in?
summary: >
  There is no function call across contracts. Every contract-to-contract interaction is a message
  call with its own frame, and the three variants differ in exactly which parts of the caller's
  context the callee inherits. Getting that table right is the difference between a working proxy
  and a drained one — delegatecall matches storage by slot number and nothing else, and the largest
  category of on-chain loss by value is access control, of which proxy-admin mistakes are a part.
  This module also covers what a low-level call gives back and how much of it you should copy.
layout: { lane: spine, row: 4 }
teaches:
  - evm-message-call
  - evm-call-context
  - sol-delegatecall-context
  - delegatecall-storage-is-the-risk
  - delegatecall-no-code-succeeds
  - this-dot-f-is-external
  - staticcall-context
  - staticcall-is-the-enforcement
  - low-level-call-returns-bool
  - revert-bubbling
  - try-catch-external-only
  - returndata-bomb
  - proxy-storage-slots
  - library-linking
  - tx-origin-not-eoa
lessons:
  - id: solidity-calls-delegatecall-no-call-across-contracts
    order: 1
    title: There is no function call across contracts
    teaches: [evm-message-call, evm-call-context]
    assumes: [call-frame, abi-function-selector, memory-is-per-frame]
    readingMin: 13
  - id: solidity-calls-delegatecall-borrowed-code-kept-storage
    order: 2
    title: Delegatecall borrows the code and keeps your storage
    teaches: [sol-delegatecall-context, delegatecall-storage-is-the-risk]
    assumes: [delegatecall-is-the-proxy-primitive, storage-slot, evm-call-context]
    readingMin: 17
  - id: solidity-calls-delegatecall-call-to-nothing-succeeds
    order: 3
    title: Why a call to nothing succeeds, and why this.f() is not free
    teaches: [delegatecall-no-code-succeeds, this-dot-f-is-external]
    assumes: [evm-call-context, code-length-check-broken]
    readingMin: 13
  - id: solidity-calls-delegatecall-staticcall-makes-view-real
    order: 4
    title: Staticcall is what makes view real
    teaches: [staticcall-context, staticcall-is-the-enforcement]
    assumes: [sol-view-pure, evm-call-context]
    readingMin: 13
  - id: solidity-calls-delegatecall-boolean-and-bytes
    order: 5
    title: The boolean and the bytes a low-level call hands back
    teaches: [low-level-call-returns-bool, revert-bubbling, try-catch-external-only]
    assumes: [call-returns-a-boolean, revert-data-encoding]
    readingMin: 16
  - id: solidity-calls-delegatecall-gas-and-returndata
    order: 6
    title: Gas you cannot guarantee and returndata you should not copy
    teaches: [returndata-bomb]
    assumes: ["63-64-rule", memory-expansion-quadratic, gas-griefing]
    readingMin: 12
  - id: solidity-calls-delegatecall-identity-and-slots
    order: 7
    title: Where a proxy hides its own state, and what code identity means now
    teaches: [proxy-storage-slots, library-linking, tx-origin-not-eoa]
    assumes: [delegatecall-storage-is-the-risk, delegation-designator]
    readingMin: 17
practices:
  - solidity-calls-delegatecall-context-table
  - solidity-calls-delegatecall-slot-zero-takeover
reflectionPrompt: >
  Write the CALL / DELEGATECALL / STATICCALL context table from memory, then find one contract in
  the wild that uses delegatecall and say, from its source alone, what would have to be true about
  the target's storage layout for it to be safe. If you cannot tell from the source, say what you
  would need to see.
