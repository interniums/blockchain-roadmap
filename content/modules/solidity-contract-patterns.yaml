id: solidity-contract-patterns
trackId: solidity
order: 6
title: Patterns that survive contact with an attacker
summary: >
  A handful of shapes recur in every production contract: order your writes before your calls, let
  people pull money instead of pushing it, decide who holds which key, and deploy the same logic
  many times cheaply. Each one exists because of a specific failure. This module teaches the pattern
  and the failure together, including the two facts that reorder the usual curriculum — access
  control, not reentrancy, is where the money goes, and EIP-7702 broke the EOA checks half these
  patterns were built on.
layout: { lane: spine, row: 6 }
teaches:
  - cei-order
  - cei-insufficient
  - reentrancy-guard
  - reentrancy-guard-transient
  - pattern-pull-payments
  - push-payment-dos
  - transfer-stipend-obsolete
  - access-ownable
  - access-ownable2step
  - access-roles
  - access-manager
  - access-control-is-top-loss
  - pausability
  - pause-is-centralisation
  - factory-create-vs-create2
  - clone-eip1167
  - clone-tradeoff
  - clone-no-constructor
  - clone-not-upgradeable
lessons:
  - id: solidity-contract-patterns-order-so-reentry-sees-truth
    order: 1
    title: Order the function so a re-entrant call sees the truth
    teaches: [cei-order, cei-insufficient]
    assumes: [evm-message-call, storage-slot, staticcall-is-the-enforcement]
    readingMin: 15
  - id: solidity-contract-patterns-guards-and-their-scope
    order: 2
    title: Guards, and the exact scope of what they guard
    teaches: [reentrancy-guard, reentrancy-guard-transient]
    assumes: [cei-order, transient-storage, transient-reentrancy-guard]
    readingMin: 14
  - id: solidity-contract-patterns-pull-not-push
    order: 3
    title: Never push money you can let people pull
    teaches: [pattern-pull-payments, push-payment-dos, transfer-stipend-obsolete]
    assumes: [low-level-call-returns-bool, tx-origin-not-eoa]
    readingMin: 16
  - id: solidity-contract-patterns-authorization-you-can-rotate
    order: 4
    title: Picking an authorization model you can still rotate
    teaches: [access-ownable, access-ownable2step, access-roles, access-manager]
    assumes: [sol-modifier-placeholder, sol-function-visibility]
    readingMin: 18
  - id: solidity-contract-patterns-where-the-money-actually-goes
    order: 5
    title: The bug class that actually takes the money
    teaches: [access-control-is-top-loss, pausability, pause-is-centralisation]
    assumes: [access-roles]
    readingMin: 14
  - id: solidity-contract-patterns-deploying-the-same-logic-often
    order: 6
    title: Deploying the same logic a thousand times
    teaches: [factory-create-vs-create2, clone-eip1167, clone-tradeoff]
    assumes: [create-address-from-nonce, create2-address, sol-delegatecall-context]
    readingMin: 16
  - id: solidity-contract-patterns-clone-has-no-constructor
    order: 7
    title: A clone has no constructor and no future
    teaches: [clone-no-constructor, clone-not-upgradeable]
    assumes: [clone-eip1167, initcode-vs-runtime-code]
    readingMin: 13
practices:
  - solidity-contract-patterns-reentrancy-then-cei
  - solidity-contract-patterns-push-to-pull-conversion
reflectionPrompt: >
  For a protocol you would ship, list every privileged action and the address type that will hold
  it — EOA, multisig, timelock, AccessManager. For each, write what happens the day that key is
  compromised and the day it is lost. If any row has no answer, that row is the design work you
  have not done yet.
