id: solidity-errors-events
trackId: solidity
order: 5
title: Failing and reporting, on the wire
summary: >
  A revert and an emit are both just bytes leaving your frame, and both have a precise wire format
  that decides what a client can show a user and what an indexer can find. This module covers the
  revert-data anatomy of require, revert and assert; the selector arithmetic that makes a custom
  error decodable; the topic and data split in a log; and the two things people consistently get
  wrong — that a decoded error name proves who failed, and that indexing is free.
layout: { lane: spine, row: 5 }
teaches:
  - sol-custom-error
  - sol-error-selector
  - sol-revert-string
  - sol-builtin-error-selectors
  - sol-panic-codes
  - sol-require-no-data
  - sol-require-with-error
  - sol-require-args-eager
  - error-data-untrusted
  - error-client-surfacing
  - errors-not-in-abi-when-forwarded
  - sol-event-topics
  - sol-event-data
  - events-are-not-readable-onchain
  - event-indexed-reference-types
  - log-gas-model
lessons:
