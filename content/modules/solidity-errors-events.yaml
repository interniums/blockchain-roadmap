    order: 1
    title: Failure has a wire format
    teaches: [sol-custom-error, sol-error-selector, sol-revert-string]
    assumes: [abi-canonical-signature, revert-data-encoding]
    readingMin: 14
    status: outlined
  - id: solidity-errors-events-the-two-builtin-errors
    order: 2
    title: The two errors the compiler throws for you
    teaches: [sol-builtin-error-selectors, sol-panic-codes]
    assumes: [sol-error-selector]
    readingMin: 14
    status: outlined
  - id: solidity-errors-events-require-revert-assert-today
    order: 3
    title: Choosing between require, revert and assert in 2026
    teaches: [sol-require-no-data, sol-require-with-error, sol-require-args-eager]
    assumes: [sol-builtin-error-selectors, sol-custom-error]
    readingMin: 14
    status: outlined
  - id: solidity-errors-events-name-is-a-claim
    order: 4
    title: An error name is a claim, not provenance
    teaches: [error-data-untrusted, error-client-surfacing, errors-not-in-abi-when-forwarded]
    assumes: [sol-error-selector, revert-bubbling]
    readingMin: 15
    status: outlined
  - id: solidity-errors-events-what-a-log-actually-is
    order: 5
    title: What a log actually is
    teaches: [sol-event-topics, sol-event-data, events-are-not-readable-onchain]
    assumes: [log-record-shape, topic0-is-the-signature, abi-head-tail]
    readingMin: 14
