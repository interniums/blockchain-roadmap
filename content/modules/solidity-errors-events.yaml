    readingMin: 13
    status: outlined
practices:
  - solidity-errors-events-revert-data-anatomy
  - solidity-errors-events-indexed-string-is-a-hash
reflectionPrompt: >
  Design the failure surface of a two-contract system you would actually ship: name every error a
  user can hit, decide which contract declares each one, and say how the frontend will decode the
  ones thrown by the inner contract. Then say which event signature in that system you are
  committing never to change, and why.
