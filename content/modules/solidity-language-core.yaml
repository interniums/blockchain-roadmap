id: solidity-language-core
trackId: solidity
order: 1
title: Types, locations, visibility, inheritance
summary: >
  Solidity looks like a curly-brace language with classes, and that resemblance is the source of
  most early bugs. This module fixes the four places the resemblance breaks: a reference type's
  data location changes assignment semantics rather than performance, visibility keywords constrain
  contracts and never humans, a modifier is a textual splice and not a check, and multiple
  inheritance is resolved by C3 linearisation in an order that is the reverse of Python's. Every
  claim here is read off the current compiler docs against solc 0.8.36.
layout: { lane: spine, row: 1 }
teaches:
  - sol-value-type
  - sol-reference-type
  - sol-data-location
  - sol-assignment-copy-rules
  - sol-calldata-immutable
  - sol-storage-pointer-hazard
  - sol-state-var-visibility
  - sol-function-visibility
  - sol-visibility-not-privacy
  - sol-view-pure
  - sol-payable
  - sol-library-view-not-enforced
  - sol-modifier-placeholder
  - sol-modifier-order
  - sol-c3-linearisation
  - sol-constructor-order
  - sol-override-virtual
  - sol-interface-vs-abstract
lessons:
  - id: solidity-language-core-data-location-changes-meaning
    order: 1
    title: Why a variable's data location changes what your code means
    teaches: [sol-value-type, sol-reference-type, sol-data-location, sol-assignment-copy-rules]
    assumes: [storage-is-the-expensive-one, memory-is-per-frame, calldata-is-read-only]
    readingMin: 16
    status: outlined
  - id: solidity-language-core-calldata-and-storage-pointers
    order: 2
    title: The copy you did not ask for, and the pointer that looks like data
    teaches: [sol-calldata-immutable, sol-storage-pointer-hazard]
    assumes: [sol-assignment-copy-rules]
    readingMin: 13
    status: outlined
  - id: solidity-language-core-who-can-call-who-can-read
    order: 3
    title: Who can call this, and who can read it
    teaches: [sol-state-var-visibility, sol-function-visibility, sol-visibility-not-privacy]
    assumes: [state-as-keyvalue]
    readingMin: 14
    status: outlined
  - id: solidity-language-core-what-view-and-pure-promise
    order: 4
    title: What view and pure actually promise
    teaches: [sol-view-pure, sol-payable, sol-library-view-not-enforced]
    assumes: [sol-function-visibility]
    readingMin: 14
    status: outlined
  - id: solidity-language-core-modifiers-are-a-splice
    order: 5
    title: A modifier is a splice, not a check
    teaches: [sol-modifier-placeholder, sol-modifier-order]
    assumes: [sol-function-visibility]
    readingMin: 12
    status: outlined
  - id: solidity-language-core-reading-a-diamond
    order: 6
    title: Reading an inheritance diamond the way the compiler does
    teaches: [sol-c3-linearisation, sol-constructor-order, sol-override-virtual]
    assumes: [sol-function-visibility]
    readingMin: 18
    status: outlined
  - id: solidity-language-core-interface-or-abstract
    order: 7
    title: When to reach for an interface and when for an abstract contract
    teaches: [sol-interface-vs-abstract]
    assumes: [sol-override-virtual]
    readingMin: 9
    status: outlined
practices:
  - solidity-language-core-assignment-rules-gas
  - solidity-language-core-diamond-order-prediction
reflectionPrompt: >
  Pick one contract you have read this week. For every reference-type variable in it, write down
  whether an assignment to that variable copies or aliases, and what would break if the compiler
  had chosen the other rule. Then say which of Solidity's four "looks like another language"
  resemblances misled you most, and what you will check first next time.
