id: solidity-openzeppelin
trackId: solidity
order: 9
title: OpenZeppelin, and what it will not do for you
summary: >
  Solidity ships no standard library, so one third-party package fills the role by convention.
  Knowing OpenZeppelin means three things: knowing which files carry a stability promise and which
  do not, knowing precisely how 5.x differs from the 4.x that most tutorials still teach, and
  knowing the boundary — the library makes no decision about who holds your keys, and its audits
  say nothing about your composition of it. This module is written against 5.7.0, released
  29 July 2026.
layout: { lane: spine, row: 9 }
teaches:
  - oz-is-the-stdlib
  - oz-not-a-framework
  - oz-v5-line
  - oz-v4-differences
  - oz-custom-errors
  - oz-safe-defaults
  - oz-draft-contracts
  - oz-upgradeable-package
  - oz-stateless-not-transpiled
  - oz-storage-gaps
  - oz-namespaced-storage
  - oz-upgrade-unsafe-across-majors
  - oz-upgrades-plugins
  - oz-account-abstraction-modules
  - oz-crosschain-modules
  - oz-nonprovision
  - oz-audit-is-not-your-audit
  - oz-wizard
lessons:
  - id: solidity-openzeppelin-the-stdlib-that-never-shipped
    order: 1
    title: The standard library Solidity never shipped
    teaches: [oz-is-the-stdlib, oz-not-a-framework]
    assumes: [sol-c3-linearisation, sol-interface-vs-abstract]
    readingMin: 10
  - id: solidity-openzeppelin-reading-the-5x-line
    order: 2
    title: Reading the 5.x line, and what 4.x taught you wrong
    teaches: [oz-v5-line, oz-v4-differences, oz-custom-errors]
    assumes: [sol-custom-error, access-ownable]
    readingMin: 16
  - id: solidity-openzeppelin-which-files-carry-a-promise
    order: 3
    title: Which files carry a promise
    teaches: [oz-safe-defaults, oz-draft-contracts]
    assumes: [oz-v5-line]
    readingMin: 11
  - id: solidity-openzeppelin-transpiler-output
    order: 4
    title: The upgradeable package is a transpiler output
    teaches: [oz-upgradeable-package, oz-stateless-not-transpiled]
    assumes: [delegatecall-proxy, clone-no-constructor]
    readingMin: 12
  - id: solidity-openzeppelin-gaps-namespaces-corruption
    order: 5
    title: Gaps, namespaces, and the upgrade that corrupts state
    teaches: [oz-storage-gaps, oz-namespaced-storage, oz-upgrade-unsafe-across-majors, oz-upgrades-plugins]
    assumes: [erc-7201-namespaced-storage, layout-migration-hazard, storage-slot]
    readingMin: 18
  - id: solidity-openzeppelin-accounts-and-crosschain
    order: 6
    title: Where the library is going — accounts and crosschain
    teaches: [oz-account-abstraction-modules, oz-crosschain-modules]
    assumes: [oz-v5-line]
    readingMin: 12
  - id: solidity-openzeppelin-decisions-it-will-not-make
    order: 7
    title: The decisions the library will not make for you
    teaches: [oz-nonprovision, oz-audit-is-not-your-audit, oz-wizard]
    assumes: [access-control-is-top-loss, pause-is-centralisation]
    readingMin: 14
practices:
  - solidity-openzeppelin-port-4x-to-5x
  - solidity-openzeppelin-unauthorized-internals-audit
reflectionPrompt: >
  Generate a contract in the Contracts Wizard with pausing, roles and upgradeability turned on.
  For every privileged function it produced, name the address type that will hold it and what
  happens if that key is lost or compromised. Then delete every option you could not justify, and
  say what you gave up.
