id: solidity-proxies-upgrades
trackId: solidity
order: 7
title: Proxies, and the ways an upgrade goes wrong
summary: >
  An upgradeable contract is two accounts pretending to be one: a proxy that holds the storage and
  an implementation that holds the logic, joined by delegatecall. Every proxy pattern is an answer
  to the same question — how do the two agree on a storage layout, and who is allowed to change the
  logic. This module works through the three mainstream patterns and their failure modes, ending on
  a documented 2026 incident where a live proxy was permanently deadlocked by a layout migration.
layout: { lane: spine, row: 7 }
teaches:
  - delegatecall-proxy
  - storage-collision
  - erc-1967-slots
  - transparent-proxy
  - uups-proxy
  - beacon-proxy
  - uups-bricking-risk
  - erc-7201-namespaced-storage
  - layout-migration-hazard
