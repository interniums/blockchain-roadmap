    order: 1
    title: Splitting a contract into storage here and logic there
    teaches: [delegatecall-proxy, storage-collision]
    assumes: [sol-delegatecall-context, delegatecall-storage-is-the-risk, slot-packing]
    readingMin: 15
  - id: solidity-proxies-upgrades-slots-nobody-lands-on
    order: 2
    title: Slots nobody can accidentally land on
    teaches: [erc-1967-slots]
    assumes: [storage-collision, proxy-storage-slots, hash-function]
    readingMin: 11
  - id: solidity-proxies-upgrades-three-patterns-three-costs
    order: 3
