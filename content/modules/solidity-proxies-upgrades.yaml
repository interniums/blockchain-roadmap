  - solidity-proxies-upgrades-upgrade-both-patterns
reflectionPrompt: >
  Write the case against upgradeability for a contract you would build: what does the admin key buy
  you, what does it cost your users, and what would have to be true for you to ship immutable
  instead. Then, assuming you do ship upgradeable, write the one-page checklist that a future
  engineer must complete before proposing an implementation change.
