id: solidity-storage-layout
trackId: solidity
order: 2
title: Where your state actually lives
summary: >
  Storage is a flat mapping from a 256-bit slot number to a 32-byte word, and the compiler decides
  which of your variables lands where. That decision is not an implementation detail: it determines
  gas, it determines whether a proxy upgrade corrupts state, and it is the only thing a delegatecall
  matches on. This module makes the layout rules explicit enough that you can compute any variable's
  slot by hand and then confirm it against a live chain.
layout: { lane: spine, row: 2 }
teaches:
  - storage-slot
  - slot-packing
  - packing-order-matters
  - struct-array-new-slot
  - mapping-slot-derivation
  - dynamic-array-layout
  - no-in-between-storage
  - transient-storage-layout
lessons:
  - id: solidity-storage-layout-where-a-variable-lives
    order: 1
    title: Where a state variable actually lives
    teaches: [storage-slot, slot-packing]
    assumes: [key-value-state, state-as-keyvalue, zero-slot-is-absent]
    readingMin: 13
  - id: solidity-storage-layout-order-is-a-gas-decision
    order: 2
    title: Declaration order is a gas decision
    teaches: [packing-order-matters, struct-array-new-slot]
    assumes: [slot-packing, sstore-dynamic-pricing]
    readingMin: 13
  - id: solidity-storage-layout-hashed-elsewhere
    order: 3
    title: Why mappings and dynamic arrays live somewhere else entirely
    teaches: [mapping-slot-derivation, dynamic-array-layout, no-in-between-storage]
    assumes: [hash-function, storage-slot]
    readingMin: 17
  - id: solidity-storage-layout-transient-is-separate
    order: 4
    title: Transient storage is a separate address space with its own layout
    teaches: [transient-storage-layout]
    assumes: [transient-storage, storage-slot]
    readingMin: 10
practices:
  - solidity-storage-layout-hand-derive-slots
  - solidity-storage-layout-packing-gas-measurement
reflectionPrompt: >
  Take a contract you would ship. Draw its slot map by hand, then reorder the declarations to use
  the fewest slots. Now argue the other side: name a realistic access pattern under which your
  packed layout costs more gas than the unpacked one, and say which layout you would actually
  choose and why.
