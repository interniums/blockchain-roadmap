id: solidity-token-standards
trackId: solidity
order: 8
title: Token standards and how integrations break
summary: >
  A token is a mapping inside someone else's contract, and every standard is an interface agreement
  about how that mapping may be edited. This module covers ERC-20, ERC-721, ERC-1155, ERC-6909 and
  ERC-4626 as an integrator rather than an issuer: the approval models and their races, the tokens
  that do not honour the interface they claim, the receiver hooks that hand execution to an
  attacker mid-transfer, and the share-accounting arithmetic that decides whether a vault can be
  drained by its first depositor.
layout: { lane: spine, row: 8 }
teaches:
