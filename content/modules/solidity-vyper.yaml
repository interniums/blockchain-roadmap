id: solidity-vyper
trackId: solidity
order: 10
title: Vyper, or what a language leaves out on purpose
summary: >
  Vyper is the control experiment for everything you just learned. It removes inheritance,
  modifiers, overloading, inline assembly and unbounded loops, and for each removal you can name the
  class of Solidity bug that disappears with it. It also supplies this track's most important
  lesson about trust: in July 2023 three Vyper releases compiled correct source into a bypassable
  reentrancy guard, and the compiler is therefore inside your trusted computing base whether you
  chose to put it there or not.
layout: { lane: spine, row: 10 }
teaches:
  - vyper-design-goal
  - vyper-python-syntax
  - vyper-no-inheritance
  - vyper-no-modifiers
  - vyper-no-overloading
  - vyper-no-inline-assembly
  - vyper-bounded-loops
  - vyper-bounded-types
  - vyper-explicit-visibility
  - vyper-safety-by-default
  - vyper-compiler-was-the-bug
  - compiler-is-part-of-tcb
  - vyper-audit-policy
  - venom-backend
  - vyper-ecosystem-cost
  - vyper-transferable-lessons
lessons:
  - id: solidity-vyper-designed-for-the-reader
    order: 1
    title: A language designed for the person reading it
    teaches: [vyper-design-goal, vyper-python-syntax]
    assumes: [abi-canonical-signature]
    readingMin: 10
  - id: solidity-vyper-what-each-removal-kills
    order: 2
    title: What Vyper removed, and which bug class each removal kills
    teaches: [vyper-no-inheritance, vyper-no-modifiers, vyper-no-overloading, vyper-no-inline-assembly]
    assumes: [sol-c3-linearisation, sol-modifier-placeholder, abi-selector-collision-risk]
    readingMin: 18
  - id: solidity-vyper-bounded-everything
    order: 3
    title: Bounded everything, and why that is a liveness property
    teaches: [vyper-bounded-loops, vyper-bounded-types]
    assumes: [push-payment-dos, gas-is-a-countdown]
    readingMin: 13
  - id: solidity-vyper-explicit-by-default
    order: 4
    title: Explicit by default
    teaches: [vyper-explicit-visibility, vyper-safety-by-default]
    assumes: [sol-function-visibility, sol-view-pure]
    readingMin: 12
  - id: solidity-vyper-compiler-in-your-tcb
    order: 5
    title: The compiler is inside your trusted computing base
    teaches: [vyper-compiler-was-the-bug, compiler-is-part-of-tcb, vyper-audit-policy]
    assumes: [reentrancy-guard, storage-slot]
    readingMin: 17
  - id: solidity-vyper-minority-language-costs
    order: 6
    title: What it costs to be a minority language
    teaches: [venom-backend, vyper-ecosystem-cost, vyper-transferable-lessons]
    assumes: [oz-is-the-stdlib, clone-eip1167]
    readingMin: 14
practices:
  - solidity-vyper-same-token-two-languages
  - solidity-vyper-nonreentrant-slot-regression
reflectionPrompt: >
  Write the compiler-risk section of a deployment runbook: which compiler and version, where the
  pin lives in the repository, which advisories were checked and by whom, and whether the deployed
  bytecode was independently reproduced from source. Then say which line of that runbook your last
  project would have failed.
