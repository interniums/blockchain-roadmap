id: toolchain-ci
trackId: toolchain
order: 8
title: CI that people trust
summary: >
  A contract pipeline carries four feedback loops with four different latencies: lint in seconds,
  tests in minutes, a bounded fuzz gate in tens of minutes, a nightly campaign in hours. Getting them
  right is mostly about what NOT to gate on — coverage numbers that lie, gas snapshots that flag
  test-only changes, and randomised searches used as required checks. Plus the two things that
  quietly break a Foundry pipeline: unpinned versions and unpinned actions.
layout: { lane: spine, row: 8 }
teaches:
  - ci-pipeline-shape
  - submodule-checkout
  - format-and-lint-gates
  - foundry-version-pinning
  - ci-profile
  - action-supply-chain
  - fork-cache
  - fuzz-seed-in-ci
  - fork-pr-secrets
  - gas-diff-comment
  - snapshot-check-gate
  - coverage-lcov
  - coverage-via-ir-breakage
  - coverage-is-not-correctness
  - campaign-tiering
  - corpus-persistence
  - flaky-gate-hazard
  - junit-machine-output
lessons:
  - id: toolchain-ci-the-baseline-job
    order: 1
    title: The job that has to work before anything else does
    teaches: [ci-pipeline-shape, submodule-checkout, format-and-lint-gates]
    assumes: [dependency-management-choice, forge-role]
    readingMin: 12
  - id: toolchain-ci-no-drift
    order: 2
    title: A pipeline whose behaviour does not drift
    teaches: [foundry-version-pinning, ci-profile, action-supply-chain]
    assumes: [toolchain-pinning-in-ci, profile-use-cases]
    readingMin: 14
  - id: toolchain-ci-forks-in-ci
    order: 3
    title: Making forked tests affordable in CI
    teaches: [fork-cache, fuzz-seed-in-ci, fork-pr-secrets]
    assumes: [ci-cache-restore, fuzz-seed-reproducibility]
    readingMin: 13
  - id: toolchain-ci-gas-as-review
    order: 4
    title: Gas as review feedback rather than as a wall
    teaches: [gas-diff-comment, snapshot-check-gate]
    assumes: [snapshot-diff-vs-check, gas-report-is-test-shaped]
    readingMin: 10
  - id: toolchain-ci-coverage-is-a-signal
    order: 5
    title: Coverage is a signal, not a gate
    teaches: [coverage-lcov, coverage-via-ir-breakage, coverage-is-not-correctness]
    assumes: [ci-pipeline-shape, via-ir-pipeline]
    readingMin: 13
  - id: toolchain-ci-budgeting-random-search
    order: 6
    title: Budgeting a random search
    teaches: [campaign-tiering, corpus-persistence, flaky-gate-hazard, junit-machine-output]
    assumes: [runs-and-depth, ci-profile]
    readingMin: 15
practices:
  - toolchain-ci-four-job-pipeline
  - toolchain-ci-false-positive-gate
reflectionPrompt: >
  List every required check on a repository you work in. For each one, say what a red result actually
  tells a reviewer, and how often it is red for a reason unrelated to the change. Any check that fails
  that second question is training your team to click re-run without reading.
