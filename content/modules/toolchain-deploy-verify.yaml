reflectionPrompt: >
  Write the deployment runbook for a two-chain launch of something you would actually ship. Name the
  address strategy, who holds the signing key at each step, how verification is confirmed on each
  chain, and — the step teams forget — how ownership is handed over and how that handover is checked
  on chain afterwards.
