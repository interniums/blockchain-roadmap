id: toolchain-deploy-verify
trackId: toolchain
order: 7
title: Getting it on chain, and proving what you put there
summary: >
  Deployment as a Solidity program: what forge script simulates, what it broadcasts, and why the
  broadcast directory is state rather than logs. Then the two questions every multichain deployment
  runs into — where does an address come from, and what does a green "verified" badge actually
  certify. The recurring theme is that all four things determining a CREATE2 address are easy to
  change by accident, and that verification proves correspondence, never safety.
layout: { lane: spine, row: 7 }
teaches:
  - forge-script
  - broadcast-cheatcode
  - simulate-then-broadcast
  - broadcast-artifacts
  - broadcast-as-source-of-truth
  - resume-and-slow
  - signer-selection
  - chain-flag-trap
  - create-address-derivation
  - initcode-hash-fragility
  - create3-pattern
  - deterministic-deployer-proxy
  - nicks-method
  - erc-7955-factory
  - verification-is-bytecode-matching
  - metadata-hash-match
  - etherscan-v2-single-key
  - sourcify-alternative
  - same-address-not-same-contract
