reflectionPrompt: >
  Fork tests are the most realistic and the least reliable tests you will write. Decide, for a project
  you care about, exactly which behaviours you are willing to depend on a third-party RPC endpoint to
  verify — and what you would do the morning that endpoint stops serving your pinned block.
