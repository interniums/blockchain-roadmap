id: toolchain-fork-testing
trackId: toolchain
order: 5
title: Testing against the real chain
summary: >
  Running your contracts against the actual deployed state of a live network, so integrations are
  tested against real Uniswap, real USDC and real balances instead of mocks you wrote to agree with
  yourself. The mechanism is lazy per-slot RPC fetching with a block-keyed cache, and almost every
  practical property of fork testing — reproducibility, speed, cost, whether it works in CI at all —
  follows from pinning a block number.
layout: { lane: spine, row: 5 }
teaches:
