id: toolchain-foundry-basics
trackId: toolchain
order: 1
title: forge, cast, anvil, chisel
summary: >
  Four binaries, one installer, one config file. This module gets you from "I can write Solidity"
  to "I have a project that builds the same way on my machine, my colleague's machine and in CI."
  The real content is not the command list: it is import resolution, config precedence and version
  pinning — the three things that silently make two builds of the same source produce different
  bytecode. Everything later in the track assumes you can answer "which layer set this value?"
  without guessing.
layout: { lane: spine, row: 1 }
