id: toolchain-fuzzing
trackId: toolchain
order: 3
title: Fuzzing one function properly
summary: >
  Moving from "this input produces that output" to "this property holds for every input", and then
  discovering that the interesting question is not how to write the property but how to constrain the
  inputs without accidentally excluding the bug. bound versus assume, the weighted dictionary, seeds,
  persisted counterexamples. The module ends where stateless fuzzing ends: it cannot find anything
  that needs a particular sequence of transactions, which is what the next module is for.
layout: { lane: spine, row: 3 }
teaches:
  - property-vs-example-testing
  - stateless-fuzzing
  - fuzz-parameters-are-the-trigger
  - fuzz-runs-default
  - fuzz-output-line
  - fuzz-dictionary
  - vm-assume-rejection
  - max-test-rejects
  - bound-remapping
  - bound-preferred-over-assume
  - assume-legitimate-uses
  - naive-bound-bias
  - overconstraining-hazard
  - fuzz-fixtures
  - fuzz-seed-reproducibility
  - failure-persistence
  - counterexample-reading
  - inline-fuzz-config
lessons:
  - id: toolchain-fuzzing-from-example-to-property
