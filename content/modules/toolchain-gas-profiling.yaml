    readingMin: 10
practices:
  - toolchain-gas-profiling-three-numbers
  - toolchain-gas-profiling-guard-swap
reflectionPrompt: >
  Find a gas-optimisation tip you believe. Measure it on a real contract with a probe that cannot be
  eliminated, under a stated isolation setting, and write down the number. Then say whether you would
  still take the change if it cost you one unit of readability per gas saved.
