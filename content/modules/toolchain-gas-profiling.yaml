    title: Reading a gas report without being misled by it
    teaches: [gas-report, gas-report-is-test-shaped, gas-report-filtering]
    assumes: [gas-is-a-countdown, test-contract-is-the-fixture]
    readingMin: 13
  - id: toolchain-gas-profiling-reviewable-diff
    order: 2
    title: Turning gas into a reviewable diff
    teaches: [gas-snapshot-file, snapshot-diff-vs-check, fuzz-seed-determinism]
    assumes: [gas-report, fuzz-seed-reproducibility]
    readingMin: 13
  - id: toolchain-gas-profiling-measuring-a-region
    order: 3
    title: Measuring a region, not a whole test
    teaches: [snapshot-cheatcodes, gas-metering-control, gas-probe-dead-code-elimination]
    assumes: [gas-snapshot-file, cheatcode-families]
    readingMin: 15
  - id: toolchain-gas-profiling-under-reporting
