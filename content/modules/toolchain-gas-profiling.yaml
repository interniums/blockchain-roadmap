id: toolchain-gas-profiling
trackId: toolchain
order: 6
title: Measuring gas honestly
summary: >
  How to get a gas number, how to turn it into a reviewable diff, and — the part most material skips
  — which of your numbers mainnet will not reproduce and why. Foundry's gas report systematically
  under-reports, your test suite's call distribution is what the averages describe, and a naive gas
  probe measures nothing at all because the compiler eliminates it. The module ends on what actually
  costs money, which is storage and calldata, not the opcode tricks the folklore is about.
layout: { lane: spine, row: 6 }
teaches:
  - gas-report
  - gas-report-is-test-shaped
  - gas-report-filtering
  - gas-snapshot-file
  - snapshot-diff-vs-check
  - fuzz-seed-determinism
  - snapshot-cheatcodes
  - gas-metering-control
  - gas-probe-dead-code-elimination
  - isolate-mode
  - test-warmth-bias
  - storage-dominates
  - refund-cap
  - calldata-cost-model
  - l2-cost-inversion
  - gas-folklore
  - optimizer-runs-tradeoff
