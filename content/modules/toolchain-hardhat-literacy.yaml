practices:
  - toolchain-hardhat-literacy-same-test-twice
reflectionPrompt: >
  Write the one-page memo a team would need to decide their toolchain. It must name conditions, not
  preferences — the specific things that would have to be true of the project for the second
  dependency tree to be worth its maintenance cost.
