id: toolchain-hardhat-literacy
trackId: toolchain
order: 9
title: Reading a Hardhat repository
summary: >
  You will inherit Hardhat projects, and half the ecosystem's plugins still assume one. This module
  is literacy, not migration: what Hardhat 3 actually is after the rewrite, the mapping from its
  layout to the Foundry one you know, why the same import string can resolve to different files in
  the two toolchains, and the specific conditions under which adding Hardhat to a project is the
  right call rather than a second dependency tree to maintain.
layout: { lane: spine, row: 9 }
teaches:
  - two-toolchain-world
  - hardhat-config-is-code
  - hardhat3-edr
  - hardhat3-esm-only
  - hardhat3-explicit-plugins
  - hardhat3-hooks
  - hardhat3-network-connections
  - hardhat2-eol
  - hardhat3-solidity-tests
  - hardhat3-multichain
  - hardhat3-build-profiles
  - hardhat-ignition
  - directory-translation
  - remapping-vs-node-resolution
  - ts-coupling-justification
  - foundry-default-otherwise
  - coexistence-pattern
