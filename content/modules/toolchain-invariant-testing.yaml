practices:
  - toolchain-invariant-testing-vault-solvency
  - toolchain-invariant-testing-fix-revert-rate
reflectionPrompt: >
  Write down five invariants for a system you know. For each one, say what an attacker would gain by
  breaking it, and whether a stateless fuzz test could have found the violation. If the answer to the
  second question is yes for all five, your invariants are probably too weak.
