id: toolchain-invariant-testing
trackId: toolchain
order: 4
title: Properties that survive any sequence
summary: >
  Stateful fuzzing: instead of one call with random arguments, random sequences of calls against
  accumulated state. This is where ordering and accounting bugs live, and it is the only automated
  technique in this track that reaches them. The engineering is almost entirely in the handler — a
  campaign pointed at a raw contract mostly reverts and tests nothing, and the metrics that tell you
  so are off by default.
layout: { lane: spine, row: 4 }
teaches:
  - unit-vs-fuzz-vs-invariant
  - stateful-fuzzing
  - invariant
  - solvency-invariant
  - handler-pattern
  - ghost-variable
  - runs-and-depth
  - revert-metrics
lessons:
  - id: toolchain-invariant-testing-three-kinds-of-test
    order: 1
    title: Three kinds of test, three kinds of bug
    teaches: [unit-vs-fuzz-vs-invariant, stateful-fuzzing]
    assumes: [stateless-fuzzing, property-vs-example-testing]
    readingMin: 11
    status: outlined
  - id: toolchain-invariant-testing-writing-the-property
    order: 2
    title: Writing a property an attacker would want to break
    teaches: [invariant, solvency-invariant]
    assumes: [stateful-fuzzing]
    readingMin: 12
    status: outlined
  - id: toolchain-invariant-testing-handler
    order: 3
    title: Making the campaign spend its budget on states that exist
    teaches: [handler-pattern, ghost-variable, runs-and-depth, revert-metrics]
