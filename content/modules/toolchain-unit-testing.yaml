id: toolchain-unit-testing
trackId: toolchain
order: 2
title: Tests that fail for the right reason
summary: >
  How forge decides what a test is, what setUp does and does not carry between cases, and what a
  cheatcode actually is at the EVM level. Then the assertion cheatcodes — expectRevert and
  expectEmit — taught mostly through the ways they silently pass for the wrong reason. A test that
  passes when the contract is broken is worse than no test, and every trap in this module is a
  documented instance of exactly that.
layout: { lane: spine, row: 2 }
teaches:
  - test-discovery-by-prefix
  - test-contract-is-the-fixture
  - test-filtering
  - setup-runs-per-test
  - setup-snapshot-model
  - call-isolation-default
  - vm-cheatcode-mechanism
  - cheatcode-families
  - cheatcode-address-in-fuzzing
  - prank-scope
  - prank-tx-origin-form
  - prank-delegatecall-form
  - deal-cheatcode
  - warp-and-roll
  - expect-revert-next-call
  - expect-revert-argument-nesting
  - expect-revert-selector-vs-data
  - low-level-call-status-trap
  - expect-emit-ordering
  - expect-emit-topic-flags
lessons:
  - id: toolchain-unit-testing-what-is-a-test
    order: 1
    title: How forge decides what is a test
    teaches: [test-discovery-by-prefix, test-contract-is-the-fixture, test-filtering]
    assumes: [tests-in-solidity]
    readingMin: 11
  - id: toolchain-unit-testing-every-test-starts-clean
    order: 2
    title: Every test starts from the same place
    teaches: [setup-runs-per-test, setup-snapshot-model, call-isolation-default]
    assumes: [test-contract-is-the-fixture]
    readingMin: 13
  - id: toolchain-unit-testing-what-is-a-cheatcode
    order: 3
    title: What a cheatcode actually is
    teaches: [vm-cheatcode-mechanism, cheatcode-families, cheatcode-address-in-fuzzing]
    assumes: [tests-in-solidity, abi-function-selector]
    readingMin: 12
  - id: toolchain-unit-testing-controlling-the-world
    order: 4
    title: Controlling who is calling and what the world looks like
    teaches: [prank-scope, prank-tx-origin-form, prank-delegatecall-form, deal-cheatcode, warp-and-roll]
    assumes: [vm-cheatcode-mechanism, tx-origin-not-eoa]
    readingMin: 18
  - id: toolchain-unit-testing-asserting-on-failure
    order: 5
    title: Asserting on failure without lying to yourself
    teaches: [expect-revert-next-call, expect-revert-argument-nesting, expect-revert-selector-vs-data, low-level-call-status-trap]
    assumes: [cheatcode-families, revert-data-encoding]
    readingMin: 16
  - id: toolchain-unit-testing-asserting-on-events
    order: 6
    title: Asserting on events, and what the four booleans do not cover
    teaches: [expect-emit-ordering, expect-emit-topic-flags]
    assumes: [cheatcode-families, log-record-shape]
    readingMin: 10
practices:
  - toolchain-unit-testing-nested-expect-revert
  - toolchain-unit-testing-decoy-emitter
reflectionPrompt: >
  Pick the test in your own suite that you would be least surprised to learn passes for the wrong
  reason. Write down the specific mechanism by which it could pass while the contract is broken,
  then go and check whether it does.
