id: zk-commitments-kzg
trackId: zk
order: 3
title: Committing to data you never send
summary: >
  Second descent: why is the proof small? Because nothing large is ever transmitted — only
  commitments and openings. This module builds the commitment ladder from a plain hash to a
  polynomial commitment, lands on KZG as the scheme Ethereum actually deployed, and follows it into
  the EVM, where a contract can check a claim about blob data it is structurally unable to read. It
  ends with the reason blobs are stretched before they are shared: erasure coding exists to make
  withholding detectable, not to provide backup.
