reflectionPrompt: >
  A commitment proves consistency; it never proves that anyone can get the data. Write down, for a
  rollup you have read about, exactly which mechanism supplies each of the two guarantees, and what an
  operator would have to do to satisfy one while failing the other. Then say which of the two failures
  a user would notice first.
