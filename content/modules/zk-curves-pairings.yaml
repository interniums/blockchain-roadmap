id: zk-curves-pairings
trackId: zk
order: 4
title: The curve underneath
summary: >
  Third descent, and the bottom of the mathematics. A KZG opening is checked with one pairing
  equation — so what is a pairing, why can only special curves have one, and what exactly does it buy
  that a hash cannot? This module builds the group, names the two fields that ZK integrators
  constantly confuse, and then gets concrete: which curve Ethereum uses where, what the precompiles
  cost, and why the same BLS12-381 point has two different byte encodings in two different Ethereum
  subsystems. It closes on the reason pairings are a transitional dependency rather than a permanent
  one.
