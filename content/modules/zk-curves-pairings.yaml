reflectionPrompt: >
  You are asked to add an on-chain verifier to a product that must still be secure in fifteen years.
  Write down which curve you would deploy on today, what would have to be true for you to migrate,
  and what in your contract design makes that migration possible at all. If your answer is "we would
  redeploy", say who is allowed to point users at the new deployment and what that does to the
  trust story.
