reflectionPrompt: >
  Every unconstrained function in a circuit is a place where you decided to trust the prover and then
  promised to check the result. Take the circuit you wrote in this module and list every such place,
  what the check is, and what a malicious prover would gain if the check were removed. If any entry
  reads "nothing", explain why the hint exists at all.
