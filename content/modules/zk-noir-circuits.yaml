id: zk-noir-circuits
trackId: zk
order: 5
title: Writing the circuit yourself
summary: >
  The bottom of the descent, reached on purpose rather than by default. Having seen what a zkVM costs
  and what a proof rests on, you now write constraints directly. Noir is the vehicle: Rust-shaped
  syntax over a constraint system that behaves nothing like Rust. The module's centre of gravity is
  the unconstrained-hint pattern — compute outside the circuit, verify inside it — because it is both
  the main optimisation available and the main way circuits become unsound. You finish by generating a
  Solidity verifier and reading the gate bill that predicts what proving will cost.
