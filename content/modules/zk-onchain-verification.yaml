id: zk-onchain-verification
trackId: zk
order: 6
title: The proof meets the chain
summary: >
  Back up from the mathematics to the place where proofs are actually consumed. A verifier contract
  is a pure function; every bug worth having in this area is in the contract that calls it. This
  module covers input binding and replay first, because they are where real money is lost, then the
  gas: where it goes, how batching and recursive aggregation move it, and where the break-even against
  simply re-executing sits. It ends by correcting the two most common economic misreadings — that
  verification is a rollup's dominant cost, and that a verifier contract makes a system trustless.
