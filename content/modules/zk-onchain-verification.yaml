reflectionPrompt: >
  Find a live proof-consuming contract on a block explorer and answer three questions in writing: what
  do its public inputs bind to, who can replace the verifier and after what delay, and what fraction
  of the system's L1 cost is verification versus data. Then say which of the three you would have got
  wrong before this module, and why.
