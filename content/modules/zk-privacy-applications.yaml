reflectionPrompt: >
  Design the privacy story for a payroll product: write down what is hidden, from whom, what a viewing
  key would grant and to whom, and what a regulator would actually be shown. Then name every party
  that still has to be trusted and what each of them could do if they turned hostile. If your list is
  shorter than three parties, you have missed some.
