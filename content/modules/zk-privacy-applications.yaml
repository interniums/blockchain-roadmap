id: zk-privacy-applications
trackId: zk
order: 7
title: The one place zero-knowledge is actually used
summary: >
  Everything up to here used succinctness. This module is about the other property. Privacy on a
  public ledger cannot be added at the application layer, because the account model publishes sender,
  recipient, amount and timing by construction; private systems replace balances with notes and
  spend them by publishing nullifiers. The hard part is not the cryptography. It is that anonymity is
  a liquidity property, that most real deanonymisation is metadata, and that the compliance story —
  selective disclosure, association sets — moves trust rather than removing it. The legal exposure of
  shipping this is a design input, not a footnote.
