id: zk-proof-systems
trackId: zk
order: 2
title: What the proof is actually claiming
summary: >
  The first descent. Having made a proof and verified it on-chain, you now need to know what it
  asserts and what it does not. This module separates the two properties that the word "ZK" welds
  together — succinctness and zero-knowledge — and shows that production validity rollups use only
  the first. It then walks the pipeline every system shares: arithmetize the computation, commit to
  polynomials, make the protocol non-interactive, and decide whether your public parameters come from
  a ceremony or from public randomness. It ends with recursion, which is how one small proof comes to
  stand for unbounded work.
layout: { lane: right, row: 102 }
