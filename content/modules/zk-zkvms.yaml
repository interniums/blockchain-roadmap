reflectionPrompt: >
  Pick a feature in a product you have actually shipped. Write down what it would cost to prove
  rather than re-execute — not just the on-chain gas, but the machine that does the proving and the
  latency your user would feel. Then answer honestly: would you ship it? If the answer is no, say
  what would have to change about the workload for the answer to become yes.
