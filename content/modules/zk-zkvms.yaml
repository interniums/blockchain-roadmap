id: zk-zkvms
trackId: zk
order: 1
title: Proving that a program ran
summary: >
  The entry point to the whole track, and deliberately the opposite of how ZK used to be taught.
  A zkVM lets you write an ordinary Rust program, run it off-chain, and hand an L1 contract a short
  proof that it executed correctly. No circuit, no field arithmetic, no ceremony — not yet. This
  module establishes the one economic fact that makes any of it worth doing (proving is far more
  expensive than executing; verification is cheap and roughly constant), gets a proof onto a chain,
  and sets up the question that drives the rest of the track: why is the proof small?
