kind: break
title: Remove Anchor's checks one at a time and steal something with each
difficulty: 4
concepts: [anchor-purpose, anchor-three-macros, eight-byte-discriminator, account-wrapper-does-three-checks, typed-account-wrappers, constraints-are-generated-code, anchor-error-codes, seeds-bump-constraint, has-one-links-accounts, init-vs-init-if-needed, idl-is-the-abi, idl-published-on-chain, anchor-costs-compute, anchor-zero-copy-escape-hatch]
spec: >
  Anchor's whole value is the code it generates that you did not write. Prove it by removing each generated
  check and taking something with the gap.

  WHAT IT GENERATES. Take one Anchor program and dump the expanded macro output. Identify, in the generated
  code, the three checks the account wrapper performs. Quote them.

  THE DISCRIMINATOR. Remove or bypass it and read a Vault as a Config. Show the state you obtain and what you
  can then do with it. Then restore it and show the failure, quoting the error code.

  THE SEEDS. Drop the seeds-and-bump constraint and pass a PDA the program did not derive. Take over whatever
  it guards. Restore and show the constraint rejecting it.

  THE LINK. Drop a has_one and pass an account belonging to someone else. This is the one that maps directly
  to an access-control bug on Ethereum, and the write-up should say so in one sentence.

  THE RESET. Demonstrate the init_if_needed hazard: reinitialise an account that already held state and show
  what was lost. Then state the condition under which init_if_needed is safe, and whether your program met it.

  THE ABI. Fetch the program's on-chain IDL and use it to build a call from a client with no local source.
  Then find something the IDL does not describe — a constraint, an error, a remaining_accounts convention —
  and state what a client built only from the IDL would get wrong.

  THE PRICE. Measure the compute cost of the generated checks: same logic with and without Anchor's wrappers,
  reported in compute units. Then use the zero-copy escape hatch on one account and report what it saved and
  what it gave up.

  Every exploit must have a restored, passing version beside it. The pair is the deliverable.
acceptance:
  command: 'true'
  criteria:
    - Expanded macro output is dumped and the account wrapper's three checks are quoted from the generated code
    - A Vault is read as a Config with the discriminator bypassed, with the obtainable state and its consequence shown
    - Restoring the discriminator produces a quoted Anchor error code
    - A PDA the program did not derive is accepted with the seeds constraint removed, and rejected with it restored
    - An account belonging to another owner is accepted with has_one removed, with one sentence mapping it to an Ethereum access-control bug
    - The init_if_needed reset is demonstrated with the lost state shown, and the safe condition stated with a verdict on this program
    - The on-chain IDL is fetched and used to build a call with no local source
    - Something the IDL does not describe is identified with what an IDL-only client would get wrong
    - Compute cost is measured with and without the generated checks, in compute units
    - Zero-copy is applied to one account with the saving and the sacrifice reported
    - Every exploit has a restored passing counterpart
hints:
  - Dump the expanded macros before anything else. Every exploit in this list is you removing one line of code you can read in that output, and it stops feeling like magic immediately.
  - The has_one exploit is the one to spend time on. It is the same bug as a missing owner check in Solidity, and seeing it in two ecosystems is what makes it stick.
  - For the compute measurement, keep the business logic byte-identical between the two versions. Any other difference and you are measuring your rewrite rather than Anchor.
