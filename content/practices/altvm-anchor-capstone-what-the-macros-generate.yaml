id: altvm-anchor-capstone-what-the-macros-generate
moduleId: altvm-anchor
grain: module
writeUp: >
  Anchor's constraints are the parts of a Solidity compiler that Solana does not have, re-implemented as macros that emit runtime checks. Write down three guarantees your Solidity habits rely on that no Anchor constraint gives you, and for each one say what you would have to write yourself - and where in the program it would have to run.
