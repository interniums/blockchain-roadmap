id: altvm-anchor-delete-the-has-one
moduleId: altvm-anchor
kind: break
title: Delete one constraint and steal the account
concepts: [has-one-links-accounts, constraints-are-generated-code, account-wrapper-does-three-checks, typed-account-wrappers]
spec: >
  Start from a working Anchor program whose `update` instruction is guarded by `has_one = authority` and a
  `Signer` authority. Remove the `has_one` constraint and nothing else. Write an attacker test that passes the
  victim's config account together with the attacker's own signer, and takes over the config. The test must
  pass - the exploit must genuinely succeed - and it must assert on the resulting state, not merely that the
  transaction confirmed. Then restore the constraint and show the same test now fails at the constraint.
  Finally, write a short note in the test file explaining why the owner check and the discriminator check both
  passed during the successful exploit, and what class of bug that makes this.
acceptance:
  command: anchor test
  criteria:
    - With the constraint removed, the exploit test passes and asserts the attacker's key is now stored as the config's authority
    - With the constraint restored, the same test fails with a constraint error and the assertion is never reached
    - A test-file comment states that the owner and discriminator checks passed throughout, and names the vulnerability class
hints:
  - The attacker does not need a special account - a legitimate config of exactly the right type, belonging to someone else, is the whole attack.
  - Signer only proves that whoever signed holds that key; it says nothing about that key having any relationship to the account being modified.
  - Run the exploit test with and without the constraint from the same test file so the diff between the two runs is exactly one line of program source.
difficulty: 2
