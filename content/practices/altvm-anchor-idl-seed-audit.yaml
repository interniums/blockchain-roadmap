id: altvm-anchor-idl-seed-audit
moduleId: altvm-anchor
kind: read
title: Check whether your IDL actually describes your PDAs
concepts: [idl-is-the-abi, idl-published-on-chain, seeds-bump-constraint]
spec: >
  Take a program with at least two PDA accounts - one declared with `seeds` plus `bump` alone, and one
  declared with `init` together with `seeds` - and build it. Open the emitted IDL and, for every account in
  every instruction, record whether a PDA description with its seeds is present. Then write a generator check:
  a script that reads the IDL and, for each account the program declares as a PDA, attempts to derive the
  address from the IDL's own seed description and compares it with the address your client derives from the
  source. Report which accounts the IDL describes completely, which it under-describes, and what a generated
  client would do wrong in each under-described case. Record the Anchor version you used, because this
  behaviour is version-dependent.
acceptance:
  command: anchor build && node scripts/idl-seed-audit.mjs target/idl
  criteria:
    - The script exits non-zero and names each account for which the program declares seeds but the IDL carries no derivable seed description
    - The report states, per under-described account, whether a generated client could derive the address at all
    - The report records the exact Anchor version, since the presence of the defect depends on it
hints:
  - Compare against the program source rather than against the IDL alone - the failure mode is an IDL that is internally consistent and incomplete.
  - Seeds that reference a field inside another account are the case most likely to be missing, because the IDL has to describe a runtime lookup.
  - If `anchor build` fails outright on a seeds constraint rather than emitting a partial IDL, that is a finding too - record which construct triggered it.
difficulty: 3
