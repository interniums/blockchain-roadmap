id: altvm-anchor-pda-config-and-authority
moduleId: altvm-anchor
grain: block
kind: implement
title: A PDA config only its authority can move
concepts: [anchor-three-macros, seeds-bump-constraint, has-one-links-accounts, constraints-are-generated-code, anchor-error-codes]
spec: >
  Build a two-instruction Anchor program. `initialize` creates a config account at a PDA derived from
  `seeds = [b"config", authority.key().as_ref()]` with `bump`, storing the authority pubkey and the canonical
  bump inside the account. `update` mutates a value in that config and must accept it only from the stored
  authority - enforced by the `seeds` and `bump` constraints plus `has_one = authority` together with a
  `Signer` authority, and by nothing you wrote by hand inside the handler body. Write tests for four cases:
  the happy path, a second user calling `update` with the victim's config and their own signer, a caller
  passing a config account at a non-canonical bump, and a caller passing an account of the right size owned by
  a different program. For each failing case, assert on the specific error, and record in a comment which of
  the three questions - owner, signer, correct instance - that error answers.
acceptance:
  command: anchor test
  criteria:
    - The happy-path test confirms the update and reads back the new value
    - The wrong-authority test fails with a constraint error identifiable by name or code, and the handler body contains no manual authority comparison
    - The non-canonical-bump test fails at the seeds constraint rather than succeeding against a second valid address
    - The foreign-owned-account test fails before deserialization, and the test comment names which check rejected it
hints:
  - Every constraint you write expands into a runtime check with its own error - so the test can assert on which check fired, not merely that something failed.
  - Storing the bump at initialization and using `bump = config.bump` on update is both cheaper and stricter than re-deriving it each time.
  - The foreign-owned account fails inside the typed wrapper's construction, before any constraint of yours runs - which tells you the order the generated code executes in.
difficulty: 2
