id: altvm-cosmos-abci-in-one-file
moduleId: altvm-cosmos
grain: block
kind: implement
title: The seam between consensus and your application
difficulty: 4
concepts: [cosmos-three-layers, cometbft-instant-finality, sdk-modules, cosmwasm-is-optional]
spec: >
  ABCI is a strict request/response interface between the consensus engine and the application.
  Three calls carry the work: CheckTx validates transactions before they enter the mempool,
  FinalizeBlock is invoked after consensus is reached and is where state transitions occur, and
  Commit persists the finalised state to local disk.

  Implement that seam. Write a consensus driver that calls those three in order and an application
  that implements them, with one SDK-style module owning a slice of state and its own message
  handler. Make the boundary real: the application must not be able to reach the mempool, and the
  driver must not know what a message means.

  Then show what instant finality is. A block that has been committed is final; there is no
  confirmation depth to wait for and no probabilistic reasoning to do. Assert that, and contrast
  it with a reorg test your driver should be unable to perform. Finally, add a second module that
  interprets a message as arbitrary bytecode rather than a typed message, and note in a comment
  why that layer is optional here when it is mandatory on a shared chain.
acceptance:
  command: npx vitest run test/abci-lifecycle.test.ts
  criteria:
    - CheckTx, FinalizeBlock and Commit are implemented as separate functions, and a test asserts a transaction rejected by CheckTx never reaches FinalizeBlock
    - State transitions happen only in FinalizeBlock, asserted by checking state is unchanged after CheckTx alone
    - Commit persists a state root, and a test asserts a committed block cannot be reverted by the driver
    - One SDK-style module owns its slice of state and its own handler, and a test asserts the driver never inspects message contents
    - A second module interprets a message as bytecode rather than a typed message, with a comment on why that layer is optional here
    - A test asserts a committed height is final with no confirmation depth, and a second test shows the reorg the driver cannot perform
hints:
  - Write CheckTx rejecting something first. It is the only one of the three whose whole job is to not change state, so it is where the boundary is easiest to get wrong and easiest to assert.
  - Keep the driver ignorant on purpose. If it needs to know a message type to route it, your module registry is doing too little and the seam is not really a seam.
  - 'Instant finality is a negative claim, so test it negatively: the interesting assertion is the operation your driver has no method for, not the one it performs.'
