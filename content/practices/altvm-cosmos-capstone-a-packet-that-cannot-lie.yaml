id: altvm-cosmos-capstone-a-packet-that-cannot-lie
moduleId: altvm-cosmos
grain: module
kind: implement
title: One packet, end to end, and every way it could have been forged
difficulty: 5
concepts: [appchain-thesis, appchain-tradeoff, interchain-security-and-shared-security, cosmos-three-layers, cometbft-instant-finality, sdk-modules, cosmwasm-is-optional, ibc-light-client-trust, ibc-relayers-are-permissionless, ibc-classic-vs-v2, ibc-beyond-cosmos]
coversConcepts: [appchain-thesis, appchain-tradeoff, interchain-security-and-shared-security, cosmos-three-layers, cometbft-instant-finality, sdk-modules, cosmwasm-is-optional, ibc-light-client-trust, ibc-relayers-are-permissionless, ibc-classic-vs-v2, ibc-beyond-cosmos]
spec: >
  Put the whole module under load at once: an application that is its own chain, the seam it runs
  on, and a packet crossing to a counterparty whose consensus you verify rather than trust.

  Build two chains as state machines, each with the ABCI-shaped seam and one SDK-style module.
  Give each a light client of the other, with the validity and misbehaviour predicates from
  earlier in this module. Then move a packet: update the client, prove the packet commitment
  against the tracked root, receive it on the counterparty, and write an acknowledgement back.

  Now attack it. Have two permissionless relayers race to deliver the same packet and assert it is
  received exactly once. Let a packet time out and assert the sender can reclaim without the
  counterparty cooperating. Submit a packet whose commitment proof does not match the tracked root
  and assert refusal. Freeze one client with an equivocation proof and assert in-flight packets on
  that path stop while the other path keeps working.

  Finally, the two things that make this transferable. Implement the same path twice, once with a
  handshake establishing the channel and once without one, and record what the second removes.
  Then point the client at a counterparty that is not a Cosmos chain at all, with a different
  consensus rule behind the same predicate interface, and say which part of your code had to
  change.
acceptance:
  command: npx vitest run test/ibc-packet.test.ts
  criteria:
    - Two chains run as state machines with the ABCI-shaped seam and one module each, with a test asserting each reaches a committed height independently
    - Each chain holds a light client of the other, using the validity predicate from earlier in this module
    - A packet is committed on one chain, proved against the tracked root, received on the other, and acknowledged back, with each step asserted
    - Two permissionless relayers racing to deliver the same packet result in exactly one receipt, asserted by a counter
    - A timed-out packet is reclaimed by the sender without any cooperation from the counterparty
    - A packet whose commitment proof does not match the tracked root is refused, and the test names the failing check
    - An equivocation proof freezes one client, and a test asserts packets on that path stop while the other path still delivers
    - The same path is implemented with and without a channel handshake, and the write-up records exactly what the second version removes
    - The client is pointed at a non-Cosmos counterparty behind the same predicate interface, and the write-up names which code changed and which did not
    - The write-up states which of the attacks above would have succeeded against a committee-based bridge instead
writeUp: >
  Two tables and one paragraph. First table: each attack, what refused it, and which layer that
  check lives in. Second: the handshake version against the handshake-free one, by messages
  exchanged and state stored per channel. Then a paragraph on the non-Cosmos counterparty, naming
  the code that changed. If the answer is only the predicate, say so plainly, because that is the
  claim the whole design rests on and it is worth stating as a result rather than an aspiration.
hints:
  - Build the happy path end to end before any attack. Five attacks against a packet flow you have not completed yet will tell you nothing about which check caught what.
  - The relayer race is the criterion that finds real bugs. Deliver the same packet twice through genuinely separate code paths, not by calling one function twice.
  - 'Do the non-Cosmos counterparty last but design for it from the start: keep every consensus assumption behind the predicate interface, and the final criterion is a short diff instead of a rewrite.'
