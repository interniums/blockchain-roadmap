id: altvm-cosmos-the-shape-you-would-ship
moduleId: altvm-cosmos
grain: block
kind: write
title: Three deployment shapes, four axes, and the assumption that flips it
difficulty: 3
concepts: [appchain-thesis, appchain-tradeoff, interchain-security-and-shared-security]
spec: >
  The appchain argument is that you should not be renting block space at all: build the
  application as a state machine, compile it into its own chain, and get your own fee token,
  validator set, upgrade schedule and full block space. The price is that you now have to
  bootstrap security, which is the exact weakness rollups exist to avoid.

  Take one product you would actually build and compare three deployment shapes against each
  other: a contract on a shared L1, a rollup, and a sovereign appchain. Four axes, and they are
  not interchangeable: who provides security and what it costs, who controls upgrades, what the
  fee token is, and how long until launch.

  Then do the part that makes this an engineering document rather than an essay. Name the single
  assumption that, if it turned out false, would flip your answer, and say what you would measure
  to find out whether it is true. Cover interchain security explicitly: renting a validator set is
  a fourth option that sits between the rollup and the sovereign chain, and leaving it out makes
  the comparison easier than it is.
acceptance:
  command: npx markdownlint-cli2 docs/appchain-decision.md && grep -c '^|' docs/appchain-decision.md
  criteria:
    - A named product is stated in one sentence before any comparison begins, concrete enough that the axes have something to bite on
    - A markdown table compares three deployment shapes across all four axes, with no cell left as an unqualified better or worse
    - The security axis states who provides it and what it costs, in units, not as a ranking
    - Interchain or shared security is treated as its own option rather than folded into one of the other three
    - A single assumption is named that would flip the recommendation if false, with what you would measure to test it
    - The document is one page or under, and every axis appears in the table rather than only in prose
hints:
  - Pick the product first and keep it small. A comparison written about a category rather than a product produces four columns of received opinion.
  - 'The fee-token axis looks like the boring one and is usually where the decision actually lives: it determines who has to acquire something before they can use your product.'
  - The flip assumption is the whole document. If you cannot name one, the recommendation was not a judgement, and the honest version of this write-up says so.
