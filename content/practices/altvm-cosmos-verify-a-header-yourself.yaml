id: altvm-cosmos-verify-a-header-yourself
moduleId: altvm-cosmos
grain: block
kind: implement
title: A light client, and the lie it is built to catch
difficulty: 4
concepts: [ibc-light-client-trust, ibc-relayers-are-permissionless]
spec: >
  This is the idea in the ecosystem most worth taking with you: IBC is not a bridge with a
  committee. Chain A does not trust a multisig about chain B, and it does not re-run chain B
  either. It tracks chain B's validator set and verifies a commit against it, which is signature
  arithmetic rather than execution.

  Implement a validity predicate. Given a trusted header, a validator set with voting powers, and
  a new header carrying a commit, accept the new header only when signatures from more than two
  thirds of voting power support it. Reject a commit that reaches exactly two thirds, because
  more-than is the rule and off-by-one here is the whole security argument.

  Then implement the misbehaviour predicate, which is what separates this from a bridge. Two
  signed headers at the same height with different commitment roots is equivocation and must
  freeze the client, after which no subsequent consensus state can be generated. Show a frozen
  client refusing an update that would otherwise be valid.

  Last, show why the relayer needs no trust: have two independent relayers submit the same valid
  header and assert the outcome is identical, then have an untrusted relayer submit a forged one
  and assert it is refused on the arithmetic alone.
acceptance:
  command: npx vitest run test/light-client.test.ts
  criteria:
    - A validity predicate accepts a header supported by more than two thirds of voting power and rejects one at exactly two thirds
    - Verification is signature arithmetic against a tracked validator set, with a comment noting it re-executes nothing
    - A misbehaviour predicate detects two signed headers at the same height with different commitment roots
    - Detected misbehaviour freezes the client, and a test asserts a frozen client refuses an otherwise-valid update
    - Two independent relayers submitting the same valid header produce an identical outcome, asserted rather than assumed
    - An untrusted relayer submitting a forged header is refused, and the test names which check refused it
hints:
  - Write the exactly-two-thirds rejection test first. It is the one an implementation gets wrong, and it is the difference between a security argument and a plausible-looking one.
  - Voting power is not validator count. Give your validators unequal powers from the start or the off-by-one test will pass for the wrong reason.
  - Freezing is a state change on the client, not a rejected message. If your frozen client still accepts updates you have implemented a warning rather than a predicate.
