id: altvm-move-capstone-three-schedulers-one-workload
moduleId: altvm-move
grain: module
kind: implement
title: Three schedulers, one contended workload, three different failures
difficulty: 5
concepts: [move-origin, move-resources-are-linear, move-abilities, move-bytecode-verifier, move-two-dialects, aptos-global-storage, sui-object-model, sui-owned-vs-shared, aptos-block-stm, three-parallelism-strategies, sui-ptb]
coversConcepts: [move-origin, move-resources-are-linear, move-abilities, move-bytecode-verifier, move-two-dialects, aptos-global-storage, sui-object-model, sui-owned-vs-shared, aptos-block-stm, three-parallelism-strategies, sui-ptb]
spec: >
  Solana, Aptos and Sui parallelise by three genuinely different mechanisms, and the difference
  reaches users as three different failures. Build all three over one workload and find out which.

  Implement three schedulers in TypeScript against a common transaction interface. The first takes
  reader/writer locks from a declared access list and never co-schedules conflicting transactions;
  there is no abort-and-retry step in this model at all, which is the detail most ports of the
  mental model get wrong. The second executes speculatively, records what each transaction read
  and wrote, detects where a lower-indexed transaction invalidated a read, and re-executes the
  losers, so the output is exactly what sequential execution in the block's preset order would
  have produced. The third partitions by object ownership and takes a path that skips consensus
  for single-owner transactions.

  Then run one contended workload through all three, a popular mint or one pool everybody is
  trading against, and report throughput, wasted work, and the failure the user actually
  experiences. Add a transaction batch touching several objects in sequence, so the third model
  has something to schedule beyond the trivial case.
acceptance:
  command: npx vitest run test/three-schedulers.test.ts
  criteria:
    - Three schedulers implement a common interface, and a test asserts all three produce the same final state for an uncontended workload
    - The lock-based scheduler is shown never re-executing a transaction, with a re-execution counter asserted to be zero
    - The optimistic scheduler is shown re-executing at least one transaction, and a test asserts its output equals sequential execution in the preset order
    - The ownership-partitioned scheduler takes a consensus-skipping path for a single-owner transaction and does not take it for a shared one, with both asserted
    - A multi-object batch is scheduled, so the ownership model is exercised beyond a single object
    - One contended workload runs through all three, reporting throughput and wasted work as measured numbers
    - The write-up names, per scheduler, the failure the user experiences under that contention, as a symptom rather than a mechanism
    - A comment states which of the three degrades worst if the workload doubles, and which measurement supports that
writeUp: >
  A table with one row per scheduler and columns for throughput, re-executions, transactions that
  never ran, and the user-visible symptom. Then one paragraph on the row you did not expect. The
  interesting claim is not that the three differ but which failure each one converts contention
  into: a queue, wasted work, or a transaction that was never admitted.
hints:
  - Write the uncontended equivalence test first. Three schedulers that disagree on an uncontended workload have a bug, and you want to know that before interpreting any contention numbers.
  - The lock model has no retry. If you find yourself writing a retry loop in it, you have ported the optimistic model onto it, which is the exact misconception the lesson names.
  - Block-STM is not searching for an order, it is reproducing a preset one in parallel. So the test for it is an equality against sequential execution, not a check that the answer looks plausible.
