id: altvm-move-linear-by-construction
moduleId: altvm-move
grain: block
kind: implement
title: Borrow a compiler's opinion about assets, then find where it stops
difficulty: 3
concepts: [move-origin, move-resources-are-linear, move-abilities]
spec: >
  Move's claim is that a resource can never be copied or implicitly discarded, only moved between
  program storage locations. Rust makes a weaker version of the same claim with ownership. Build
  the comparison in the language you have.

  Define a Rust type representing a coin whose value cannot be duplicated or silently dropped.
  Rust gives you move semantics for free, so the copy half is easy; the drop half is not, because
  Rust runs Drop and Move simply refuses to compile a discard. Make discarding a compile-time
  error rather than a runtime one, and say in a comment which of Move's four abilities you have
  actually reproduced and which you have only approximated.

  Then do the part that matters more than the mechanism. The security track ranked vulnerability
  classes by realised loss. Re-run that ranking against this guarantee: write a test per class
  showing which ones linearity removes and which it leaves exactly as dangerous. Accidental
  double-credit and credit-without-debit should fall. Access control on a privileged mint should
  not.
acceptance:
  command: cargo test -p move-linearity --test abilities -- --nocapture
  criteria:
    - A coin type is defined that cannot be duplicated, with a test asserting the duplicate cannot be constructed rather than that it is rejected at runtime
    - Discarding a coin without settling it is a compile-time failure, shown by a commented-out line and a note recording what the compiler said
    - A comment maps each of Move's four abilities onto what Rust does or does not give you, naming copy, drop, store and key individually
    - A test shows an accidental double-credit being impossible to express against the linear type
    - A test shows credit-without-debit being impossible to express against the linear type
    - A test shows an access-control bug on a privileged mint remaining fully exploitable, with a comment stating why linearity does not touch it
hints:
  - Start from the ranking, not the type. Write the type first and you will build something elegant that proves nothing about which bugs it removes.
  - Rust gives you move semantics and also gives you Drop, which is where the analogy leaks. A newtype with no Drop impl and a consuming settle method is the closest honest approximation.
  - The last criterion is the point of the exercise. When your access-control test passes, you have shown that a language guarantee about assets says nothing about who was allowed to call the function.
