id: altvm-move-one-language-two-state-models
moduleId: altvm-move
grain: block
kind: measure
title: One language, two places state lives
difficulty: 3
concepts: [move-two-dialects, aptos-global-storage, sui-object-model]
spec: >
  There is no single Move. The Aptos lineage keeps global storage keyed by account address, where
  a module reaches into an account and reads a resource stored under it. Sui has no such storage:
  everything is an object with an id and an owner, and a transaction names the objects it touches.

  Model both. Implement two small state stores in TypeScript, one address-keyed and one object-
  keyed with an owner field, then run the same three operations through each: create an asset,
  transfer it, and read a third party's asset. Record, for each operation in each model, what the
  transaction has to name up front and whose signature it needs.

  The third-party read is where the models diverge most visibly, so make that the row you can
  explain. Then write down which of the two you would find easier to reason about as an auditor,
  in one sentence that does not use the word simpler.
acceptance:
  command: npx vitest run test/move-state-models.test.ts
  criteria:
    - Two state stores are implemented, one keyed by account address and one keyed by object id with an explicit owner field
    - The same three operations run against both models, with tests asserting the outcome of each
    - A table records, per operation per model, what the transaction must name up front and whose signature it requires
    - A test shows the third-party read behaving differently between the models, with the difference asserted rather than described in prose
    - One sentence states which model is easier to audit and why, without using the word simpler
hints:
  - The owner field is not decoration. Put it in the object model from the first line, because every difference you are trying to show comes from it.
  - Do the third-party read before the transfer. It is where the two models disagree most, so it tells you soonest whether your models genuinely differ or are one thing spelled twice.
  - If both models need the same things for all three operations, you have modelled one thing twice. Go back to what a transaction must declare before it runs.
