id: altvm-move-verify-the-bytecode
moduleId: altvm-move
grain: block
kind: implement
title: Check a program you did not compile
difficulty: 4
concepts: [move-bytecode-verifier, move-resources-are-linear]
spec: >
  Move's guarantee does not rest on its compiler. Bytecode is re-checked at publication by a
  verifier that trusts no source language, because the source language is not what gets deployed.
  Build a small version of that argument.

  Define a stack machine with perhaps eight instructions, one of which duplicates the top of the
  stack and two of which move a resource handle. Write a verifier that walks the instruction list
  and rejects any program in which a resource handle is consumed twice or left on the stack at
  return. Then write the attack: a hand-assembled instruction list that a well-behaved compiler
  would never emit, and show your verifier refusing it.

  Finally, state the property your verifier actually establishes and the one it does not. A
  linear-use check is not a proof of functional correctness, and being clear about that boundary
  is most of the value here.
acceptance:
  command: cargo test -p move-linearity --test verifier -- --nocapture
  criteria:
    - A stack machine is defined with at least one instruction that duplicates the top of the stack and at least two that move a resource handle
    - A verifier walks a program and rejects double-consumption of a resource handle, reporting the offending instruction index
    - The verifier rejects a program that returns with an unconsumed resource handle still on the stack
    - A hand-assembled program no compiler would emit is shown being refused, demonstrating the check does not depend on the source language
    - At least one well-formed program is accepted, so the verifier is not simply refusing everything
    - A comment states the property the verifier establishes and names one class of bug it cannot see
hints:
  - The error needs the instruction index. A verifier that says only invalid is not one you can debug, and the real one reports a location.
  - Write the accepting test before the rejecting ones. A verifier that rejects everything satisfies four of these six criteria, and finding that out early is cheaper.
  - Track, per stack slot, whether it holds a live handle. The whole check is a small abstract interpretation, and thinking of it that way stops you special-casing instructions.
