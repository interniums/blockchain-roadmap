kind: measure
title: Find the hot account's ceiling, and watch a fee market leak
difficulty: 4
concepts: [sealevel-declared-access, account-lock-semantics, conflict-is-static-not-dynamic, declared-access-is-a-tax, banking-stage-pipeline, central-scheduler, greedy-scheduler-default, compute-unit-budget, priority-fee-formula, fees-charged-on-failure, per-account-write-cu-cap, local-fee-market, local-fee-markets-are-leaky, contention-failure-modes, stake-weighted-qos]
spec: >
  Build a contended account and measure everything that happens around it. This module's claims are all
  measurable and most of them surprise people.

  THE LOCK. Show conflict decided statically: two transactions that would not actually touch the same data
  at runtime, but whose declared account lists overlap, and demonstrate they serialise anyway. Then show the
  converse — two that look related and run in parallel because their declarations do not overlap.

  THE TAX. Take one instruction and add three accounts to its declared list that it never touches. Measure
  what that costs: in transaction size, in scheduling, and in throughput under contention. That is the tax
  the module names, quantified.

  THE CEILING. Hammer one account with writes and find the per-account write compute cap. Report the number
  you measured and the number in the documentation, and reconcile them. Plot throughput against offered load
  and mark where it flattens.

  THE FEE FORMULA. Compute what a transaction should cost from the priority fee formula and the compute unit
  budget, then compare against what it was actually charged. Explain any difference. Then demonstrate the
  fact that catches Ethereum developers hardest: get a transaction charged for failing, and say what it was
  charged for.

  ASKED VERSUS USED. Show that you pay for the compute you requested rather than what you consumed: submit
  the same instruction with a generous budget and a tight one and report both charges.

  THE LEAK. The local fee market is supposed to keep congestion on one account from pricing everyone else
  out. Demonstrate the leak: saturate one account and measure the effect on unrelated transactions. Report
  the degradation and name the mechanism that causes it.

  DID NOT LAND. Finally, produce all the contention failure modes you can and classify them: reverted,
  dropped, never scheduled, expired. Say which are visible to a client and which look identical from
  outside — because "your transaction did not revert, it never landed" is the sentence this module exists
  for.
acceptance:
  criteria:
    - Two transactions with overlapping declarations but no real data overlap are shown serialising, and two related-looking ones with disjoint declarations running in parallel
    - Three unused declared accounts are added and their cost measured in size, scheduling and contended throughput
    - The per-account write compute cap is measured, reported against the documented figure, and reconciled
    - Throughput is plotted against offered load with the flattening point marked
    - Predicted fee from the formula is compared against the actual charge with any difference explained
    - A transaction is charged for failing, with what it was charged for stated
    - The same instruction is charged differently under a generous and a tight compute budget, both reported
    - Saturating one account is shown degrading unrelated transactions, with the degradation measured and the mechanism named
    - Contention failure modes are produced and classified, with those indistinguishable from outside identified
hints:
  - Do the static-conflict demonstration first. It is the cheapest way to internalise that the scheduler never looks at what your code does, only at what your transaction claimed.
  - For the cap, ramp the load rather than jumping to saturation. The shape of the curve as it flattens is more informative than the ceiling value, and it tells you whether you are hitting the account cap or something else.
  - The leak is the finding worth carrying. Local fee markets are described as isolating congestion, and measuring how much they do not is more useful than any explanation of how they are meant to.
