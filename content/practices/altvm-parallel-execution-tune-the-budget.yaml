id: altvm-parallel-execution-tune-the-budget
moduleId: altvm-parallel-execution
grain: block
kind: implement
title: Pay for the compute you actually need
concepts: [compute-unit-budget, priority-fee-formula, fees-charged-on-failure, contention-failure-modes]
spec: >
  Write a TypeScript script that builds the same transfer twice at the same compute-unit price. The first
  version sets no ComputeBudget instruction at all. The second calls `simulateTransaction` first, reads the
  units consumed from the simulation, and sets `setComputeUnitLimit` to that value plus a stated margin.
  Print, for both, the requested limit, the simulated consumption, and the resulting prioritization fee
  computed as price times requested limit. Then add a third path that submits the tuned transaction and
  classifies its outcome into exactly one of four buckets: confirmed, confirmed-but-failed, never included
  before the blockhash expired, or never submitted. The classifier must distinguish an on-chain program error
  from a transaction that has no on-chain record at all.
acceptance:
  command: pnpm vitest run test/compute-budget.test.ts
  criteria:
    - The test asserts the tuned transaction's computed prioritization fee is strictly lower than the untuned one at the same compute-unit price
    - The test asserts the tuned limit is greater than the simulated consumption, so a small consumption increase does not fail the transaction
    - The test drives an intentionally reverting instruction and asserts the classifier reports confirmed-but-failed, not expired
    - The test drives a transaction with a deliberately stale blockhash and asserts the classifier reports expiry with no on-chain record
hints:
  - The priority fee is price times the limit you requested; consumption never enters the formula, so the saving comes entirely from asking for less.
  - Simulation returns the units consumed for that exact account state - a margin exists because the state can change before you land.
  - A transaction that was never included has no receipt to inspect, so the classifier has to reason from blockhash validity rather than from an error object.
difficulty: 2
