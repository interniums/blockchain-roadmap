id: altvm-parallel-execution-write-lock-census
moduleId: altvm-parallel-execution
kind: measure
title: Count who is holding the write locks
concepts: [account-lock-semantics, sealevel-declared-access, per-account-write-cu-cap, local-fee-market, local-fee-markets-are-leaky]
spec: >
  Pull 200 consecutive recent blocks from a public RPC with `getBlock` at
  `maxSupportedTransactionVersion: 0`. For every transaction, extract the account keys marked writable -
  including keys resolved through address lookup tables - and the compute units the transaction consumed.
  Aggregate two distributions: write-lock count per account, and consumed compute units per writable account
  per block. Produce a report naming the five most write-contended accounts in your sample, the largest share
  of a single block's compute that any one writable account took, and how close that came to the 12M
  per-account ceiling. Then take the single hottest account and one cold account and chart
  `getRecentPrioritizationFees` for both over at least an hour, and state - with the numbers - whether the two
  had materially different fee floors.
acceptance:
  command: pnpm vitest run test/write-lock-census.test.ts
  criteria:
    - The test runs the collector against a fixture of at least 50 captured blocks and asserts the top-five ranking is reproducible from that fixture
    - The test asserts the reported per-account per-block compute maximum never exceeds 12,000,000
    - The report file records the observed prioritization-fee floors for the hot and cold account and states a conclusion about locality
hints:
  - Writable keys are not all in `message.accountKeys` - versioned transactions resolve some through `loadedAddresses`, and omitting those undercounts exactly the busiest accounts.
  - Consumed compute units are in the transaction meta, not the message; attribute a transaction's consumption to every writable account it holds.
  - A fair hot-versus-cold comparison needs the same sampling times for both accounts, because the network-wide fee level moves underneath you.
difficulty: 3
