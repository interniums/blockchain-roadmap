id: altvm-pinocchio-observe-p-token-cu
moduleId: altvm-pinocchio
kind: measure
title: Watch the token program cost a hundred compute units
concepts: [p-token-case-study, protocol-level-swap, cu-headroom-is-the-real-prize, when-pinocchio-pays]
spec: >
  Fetch a recent mainnet SPL token transfer over a public RPC and read the `consumed X of Y compute units`
  line for the token program's invocation out of the transaction logs. Do the same for a
  `transfer_checked`. Record both figures against the pre-swap numbers of roughly 4,645 and 6,200 compute
  units. Then do the part that matters: take the 12M per-writable-account block ceiling and compute how many
  token transfers touching one hot account fit into a single block at the old cost and at the new cost, and
  write two sentences stating what that changes for a protocol whose users all write the same pool account.
  The transaction you sample must be one you found on chain, and its signature must be recorded in the output.
acceptance:
  command: pnpm vitest run test/p-token-cu.test.ts
  criteria:
    - The test parses the compute units consumed by the token program from a captured real mainnet transaction and asserts the figure is on the order of a hundred rather than thousands
    - The output records the transaction signature and the instruction sampled, so the measurement is reproducible
    - The report states the transfers-per-block figure under the 12M per-account ceiling at both the old and the new cost
hints:
  - The logs report consumption per invoked program, so find the token program's own invocation rather than the transaction total.
  - A transfer inside a swap is a CPI, and CPI depth is exactly where the fixed overhead used to be paid repeatedly.
  - The interesting number is not the fee saved - it is how many more users one writable account can serve inside a single block.
difficulty: 2
