id: altvm-pinocchio-same-program-twice
moduleId: altvm-pinocchio
kind: implement
title: The same counter, twice, and the compute difference
concepts: [pinocchio-what-it-is, pinocchio-zero-copy, no-automatic-validation, entrypoint-is-the-big-win, repr-c-state-casting]
spec: >
  Write the same trivial program twice: increment a counter held in a PDA, owned by the caller. Version one is
  Anchor, using `seeds`/`bump` and `has_one`. Version two is Pinocchio, with a `#[repr(C)]` state struct cast
  onto the account data and every check written by hand - owner equals program id, account is writable, the
  authority signed, the PDA re-derives from the expected seeds, and the account is the caller's instance. Run
  both against the same test suite covering the happy path and each of the four attacker cases. Then record
  the compute units each version consumes for the same successful increment, taken from the program logs, and
  produce a table mapping every hand-written check in the Pinocchio version to the Anchor constraint that
  generated it.
acceptance:
  command: cargo test-sbf -- --nocapture
  criteria:
    - Both programs pass an identical set of tests including the happy path and at least four attacker cases
    - The test output prints the compute units consumed by each version for the same increment, and the Pinocchio figure is the lower of the two
    - A committed table maps each hand-written Pinocchio check to its Anchor constraint, with no unmatched rows in either direction
hints:
  - Write the checks in the same order Anchor generates them - owner, then discriminator or type tag, then deserialize, then relational constraints - so the mapping table is one-to-one.
  - A `#[repr(C)]` struct cast onto account bytes needs its alignment and padding thought about explicitly; a struct that works on your machine can still be wrong.
  - Compute units consumed appear in the program invocation log line, and an in-process SVM harness gives them to you far faster than a validator will.
difficulty: 4
