id: altvm-pinocchio-the-flat-buffer
moduleId: altvm-pinocchio
grain: block
kind: measure
title: Read the runtime's buffer without copying it, and measure what you saved
difficulty: 3
concepts: [runtime-input-buffer, deserialize-vs-borrow]
spec: >
  The runtime hands a program one flat buffer. What you do with it in the first few instructions decides most
  of the program's compute cost.

  THE BUFFER. Take one instruction and dump the raw input the runtime provides. Lay out its structure by hand:
  where the account count is, where each account's metadata and data begin, and where the instruction payload
  sits. Label every region with its offset.

  TWO WAYS TO READ IT. Implement the same instruction twice. Once deserialising into owned structures, and once
  borrowing directly from the buffer with no copy. Report compute units for both, and the difference as a
  percentage of the instruction's total budget.

  Then scale it: report both numbers for an instruction touching two accounts and one touching ten. Plot the
  gap. The point is not that borrowing is cheaper but how the gap grows, and one measurement cannot show that.

  WHAT BORROWING COSTS YOU. Then the honest half. State what the borrowing version gives up: which mistakes the
  compiler no longer catches for you, and what happens if you read a region you have not validated. Demonstrate
  one such mistake and the failure it produces. Then state the rule you would follow to make borrowing safe in
  a program you had to maintain.
acceptance:
  criteria:
    - The raw input buffer is dumped with every region labelled by offset
    - The same instruction is implemented deserialising and borrowing
    - Compute units are reported for both, with the difference as a percentage of the budget
    - Both are measured for a two-account and a ten-account instruction, with the gap plotted
    - What the borrowing version gives up is stated, including which compiler checks are lost
    - One mistake from reading an unvalidated region is demonstrated with its failure
    - A maintainability rule for safe borrowing is stated
hints:
  - Lay out the buffer on paper from the dump before writing the borrowing version. Every bug in this exercise is an offset, and having the map makes them one-line fixes.
  - Measure at two and ten accounts, not one. The interesting result is the slope, and a single data point hides it.
  - The failure from an unvalidated read is often not a crash. That is why the maintainability rule matters, and saying so is the point of the last section.
