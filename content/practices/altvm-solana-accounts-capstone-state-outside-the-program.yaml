id: altvm-solana-accounts-capstone-state-outside-the-program
moduleId: altvm-solana-accounts
grain: module
writeUp: >
  Pick one contract you have written or read that keeps a mapping of per-user state. Write down what its Solana equivalent would look like: which accounts exist, which are PDAs and under what seeds, who signs for each, and who pays the rent deposit. Then answer the harder question - which of your contract's operations could two users have run at the same time under that design, and which would still have serialized?
coversConcepts:
  - solana-account
  - state-externalized
  - program-is-stateless
  - pda
  - rent-exemption
  - declared-account-access
  - sealevel
  - parallelism-requires-declaration
kind: implement
title: Put the state outside the program, and declare every touch in advance
difficulty: 4
concepts: [solana-account, state-externalized, program-is-stateless, pda, rent-exemption, declared-account-access, sealevel, parallelism-requires-declaration]
spec: >
  Build the same small application twice — once as you would on Ethereum, once as Solana requires — and let
  the difference make the argument.

  THE APPLICATION. A per-user counter with an admin-settable global config. Small enough to hold in your
  head, big enough to have both per-user and shared state.

  THE ETHEREUM SHAPE. Write it in Solidity. Note where the state lives and how the machine learns which
  slots you touched.

  THE SOLANA SHAPE. Write it as a stateless program with externalised accounts. Every piece of state is its
  own account. Derive the per-user account address as a PDA and write out the seeds; a comment states why
  the program can control an address it holds no key for.

  PAY TO EXIST. Fund the accounts to rent exemption. Report the lamports required and what determines the
  amount. Then demonstrate what happens to an account that is not exempt.

  DECLARE IT. Show the transaction naming every account it will read and write before execution. Then break
  it deliberately: omit one account the instruction needs and show the failure, and mark one account
  read-only that the program writes and show that failure. Both errors, quoted.

  PARALLELISM, MEASURED. Send N transactions that touch disjoint per-user accounts and N that all touch the
  config, and show the throughput difference. Report both numbers. Then state the rule that produced the
  difference in one sentence.

  THE CONVERGENCE. Close with two paragraphs: Ethereum's access lists are the same idea arriving from the
  other direction. State what each design gets that the other does not, and one thing Ethereum cannot adopt
  without changing something fundamental.
acceptance:
  command: 'true'
  criteria:
    - The same application is implemented in Solidity and as a stateless Solana program with externalised accounts
    - The per-user address is derived as a PDA with the seeds written out and a comment on control without a key
    - Rent exemption lamports are reported with what determines the amount, and a non-exempt account's fate demonstrated
    - A transaction is shown declaring every account it reads and writes before execution
    - Omitting a required account and mis-marking a written account read-only both produce quoted errors
    - Throughput is measured for disjoint-account and shared-account transaction sets, with both numbers reported
    - One sentence states the rule producing the throughput difference
    - Two paragraphs compare access lists to declared access, naming what each design gets and one thing Ethereum cannot adopt without a fundamental change
hints:
  - Write the Solidity version first even though it feels like a detour. The Solana shape only reads as a decision once you have the version that does not need declarations sitting next to it.
  - Derive the PDA by hand once before using the helper. The seeds and the bump are the whole mechanism and the helper hides both.
  - For the throughput comparison, keep the transaction bodies identical and change only which accounts they name. Any other difference and you are measuring something else.
