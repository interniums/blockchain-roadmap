id: altvm-solana-accounts-map-a-token-balance
moduleId: altvm-solana-accounts
grain: block
kind: measure
title: Find where a wallet's token balance physically lives
concepts: [solana-account, state-externalized, program-is-stateless, pda, rent-exemption]
spec: >
  Pick any wallet with a token balance on Solana mainnet. Write a TypeScript script that, over a public RPC,
  fetches the wallet account itself and then the associated token account holding that balance. For each of
  the two accounts print the address, the owner program, the lamport balance, the data length, and the
  rent-exempt minimum for that data length. Then derive the associated token account address locally from the
  wallet, the mint and the token program id, and assert it equals the address you fetched - proving the
  address is a deterministic function of its inputs and not a registry lookup. Finally, print the token
  program's own account and show that its data is executable code and that it holds none of the balances it
  governs. Write a four-line comment at the top of the file stating where the equivalent state would live on
  Ethereum and which of these five printed values would have no Ethereum counterpart.
acceptance:
  command: pnpm vitest run test/account-map.test.ts
  criteria:
    - The test asserts the locally derived associated token account address equals the address actually holding the balance
    - The test asserts the token account's owner is the token program and that the wallet is not the owner field
    - The test asserts the token account's lamport balance is at least the rent-exempt minimum for its data length
    - The test asserts the token program account is executable and that its data length is nonzero
hints:
  - The owner field of a token account is the token program, not the human who controls it - the controlling wallet is a field inside the data.
  - The associated token account is a program-derived address; its seeds are the wallet, the token program id, and the mint, in that order.
  - Rent-exempt minimums come from the RPC itself - ask for the minimum balance for the data length you observed rather than hardcoding a number.
difficulty: 2
