id: altvm-solana-accounts-redesign-a-mapping
moduleId: altvm-solana-accounts
grain: block
kind: write
title: Redesign a Solidity mapping as accounts
concepts: [state-externalized, program-is-stateless, pda, declared-account-access, rent-exemption]
spec: >
  Take a small Solidity contract holding per-user state - a staking contract with `mapping(address => uint256)
  balances` plus a global `totalStaked` is ideal. Produce a design document, committed to the repository as
  `docs/solana-redesign.md`, that specifies the Solana equivalent. It must name every account that exists in
  the design, state for each one whether it is a PDA and under exactly which seeds, who pays its rent deposit
  and who can close it, and which accounts each instruction declares as writable. It must then answer the
  question the account model forces: which pairs of user operations can run in parallel under your design and
  which serialize, naming the writable account that decides each case. Include one section titled "what I
  moved to the client", listing every address the client must now derive before it can build a transaction.
acceptance:
  command: node scripts/check-redesign.mjs docs/solana-redesign.md
  criteria:
    - The checker asserts the document contains a table with one row per account and non-empty seeds or "not a PDA" for each
    - The checker asserts every instruction section lists at least one writable account and identifies the rent payer
    - The checker asserts the parallelism section names at least one pair that serializes and one pair that does not
hints:
  - There is no mapping. A mapping key becomes a seed, and each mapping entry becomes its own account with its own rent deposit.
  - Any field every user writes - a global total, a counter - is a writable account every user's transaction needs, and it will serialize all of them.
  - If two users' operations must serialize in your design, ask whether the global value can be reconstructed by reading per-user accounts instead of being maintained on write.
difficulty: 3
