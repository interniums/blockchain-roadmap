id: altvm-solana-security-collide-two-pdas
moduleId: altvm-solana-security
grain: block
kind: implement
title: Reach one user's account through another user's parameters
concepts: [pda-seed-collision, canonical-bump-matters, seeds-bump-constraint]
spec: >
  Write a program whose PDA is derived from two variable-length string seeds concatenated without delimiters -
  for example a user name and a pool name. Then find a colliding pair: two distinct (user, pool) inputs whose
  concatenation is byte-identical, so both derive the same address. Demonstrate the consequence with a test in
  which one user's state is written through the other user's parameters. Fix it with fixed-width or
  length-prefixed seeds and show the collision is no longer constructible. In the same program, add an
  instruction that takes the bump as a user-supplied argument and derives from it, and show you can find a
  non-canonical bump that yields a second valid address for the same logical key - then fix that by storing
  and using the canonical bump.
acceptance:
  command: cargo test-sbf -- --nocapture
  criteria:
    - A test produces two distinct seed tuples that derive an identical address and asserts equality of the two derived keys
    - A test writes state through the colliding tuple and asserts the victim's account was modified
    - After the length-prefixed fix, a search over the same input space finds no collision and the test asserts that
    - A test finds a non-canonical bump producing a second valid address for one logical key, and the fixed version rejects it
hints:
  - Collisions in concatenated seeds do not need cryptography - moving one character across the boundary between two strings is enough.
  - Length-prefixing each seed, or padding to a fixed width, makes the concatenation injective, which is the actual property you need.
  - Deriving with a supplied bump uses a different call than finding the canonical one; the difference between those two calls is the whole vulnerability.
difficulty: 3
