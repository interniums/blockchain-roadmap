id: altvm-solana-security-revive-a-closed-account
moduleId: altvm-solana-security
grain: block
kind: break
title: Close an account and bring it back in the same transaction
concepts: [account-revival-attack, reinitialization-attack, duplicate-mutable-accounts, rust-overflow-not-automatic]
spec: >
  Implement a close instruction the naive way - transfer the account's lamports out and return. In a single
  transaction, call it and then transfer rent back into the same account, and show that after the transaction
  the account still exists and still holds its old data. Fix it by zeroing the data and writing a closed
  discriminator, and show the revival now fails. In the same program, add two more defects and their tests: an
  instruction using `init_if_needed` on an account holding a balance, called twice to reset live state; and a
  transfer instruction that does not check that its source and destination differ, driven with the same
  account passed twice to inflate a balance. Finally, build the program with overflow checks disabled and show
  a subtraction wrapping, then enable them and show it aborting.
acceptance:
  command: cargo test-sbf -- --nocapture
  criteria:
    - The revival test asserts the account's stale data is readable after the transaction that closed it
    - The fixed close makes the same revival test fail, and the test asserts the data is zeroed
    - The reinitialization test asserts a live balance was reset, and the guarded version rejects the second call
    - The aliasing test asserts a balance increased with no corresponding decrease, and the fixed version rejects equal keys
    - One test demonstrates a wrapping subtraction with overflow checks off and the same operation aborting with them on
hints:
  - Garbage collection happens at the end of the transaction, so everything the attacker needs to do fits inside it.
  - Zeroing the data is not enough on its own if your program will happily reinitialize a zeroed account - the closed discriminator is what makes the state unmistakable.
  - Aliasing bugs disappear the moment you load both accounts through the same code path, which is why they survive tests that always pass distinct accounts.
difficulty: 4
