id: altvm-solana-security-where-the-money-left
moduleId: altvm-solana-security
grain: block
kind: read
title: Account for real losses, most of which were not code bugs
difficulty: 3
concepts: [not-all-exploits-are-code, durable-nonce-as-attack-surface]
spec: >
  Read where the money actually went, and let the answer be uncomfortable.

  THE LEDGER. Take at least six real incidents from 2025 and 2026 and classify each by root cause: a program
  bug, a key compromise, a supply-chain compromise, a signing-interface deception, or an operational mistake.
  Report the loss for each and the total per category. Then state the share that were program bugs — it is
  smaller than a curriculum implies, and the number is the finding.

  For each non-code incident, state what a code audit would have done about it. In most cases the answer is
  nothing, and saying so plainly is the point.

  THE DURABLE NONCE. Then one mechanism that is a real attack surface and is not a bug. Explain what a durable
  nonce is for and why it exists. Then construct the attack shape: a signed transaction that stays valid
  indefinitely, and what an attacker who obtains one can do with it later. State the two conditions that make
  it dangerous.

  Then defend against it: state what a wallet, a program, and a user can each do to reduce the exposure. Three
  parties, three different mitigations, and note which of the three is usually the only one anybody implements.

  Close with the review checklist you would actually use, ordered by expected loss rather than by how
  interesting each item is.
acceptance:
  criteria:
    - At least six real 2025-2026 incidents are classified by root cause with losses reported per incident and per category
    - The share that were program bugs is stated as a number
    - For each non-code incident, what a code audit would have done is stated
    - The durable nonce's purpose is explained
    - The attack shape is constructed with what a later attacker can do and the two conditions that make it dangerous
    - Mitigations are given for a wallet, a program and a user, with the one usually implemented identified
    - A review checklist ordered by expected loss
hints:
  - Include the losses in the classification table. The category shares look different weighted by money than by incident count, and money is the ordering that matters.
  - For the audit question, be blunt. A code audit does nothing about a compromised signing key and pretending otherwise is why these keep happening.
  - The durable nonce is not a vulnerability, it is a feature whose lifetime assumption differs from a normal transaction's. Frame it that way.
