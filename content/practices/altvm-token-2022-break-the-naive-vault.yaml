id: altvm-token-2022-break-the-naive-vault
moduleId: altvm-token-2022
kind: break
title: Make a vault insolvent with a fee, then with a permanent delegate
concepts: [amount-sent-is-not-amount-received, transfer-fee-extension, permanent-delegate-extension, allowlist-mints-not-programs]
spec: >
  Write a deliberately naive vault program that credits a depositor with the amount named in the deposit
  instruction and lets depositors withdraw their credited balance. Run two attacks against it. First, deposit
  a fee-bearing Token-2022 mint and show the vault is insolvent by exactly the accumulated fees - the last
  withdrawer cannot be paid. Fix it by crediting the vault's measured balance delta and prove the same attack
  now fails. Second, create a mint with a permanent delegate, deposit it, and use the delegate to move the
  tokens out of the vault's own token account, leaving credited balances backed by nothing. Then write the
  mint-validation function you would run before listing any mint, and show it rejects the permanent-delegate
  mint and accepts a plain one.
acceptance:
  command: cargo test-sbf -- --nocapture
  criteria:
    - Against the naive vault, the fee test proves a shortfall equal to the total fees withheld and the final withdrawal fails
    - After the delta-measurement fix, the same fee test passes with every depositor able to withdraw
    - The permanent-delegate test drains the vault's token account while credited balances remain nonzero
    - The mint-validation function rejects the permanent-delegate mint and accepts a mint with no hazardous extensions, with both cases asserted
hints:
  - Measure the vault token account's balance before and after the transfer and credit the difference; every other approach is a special case that breaks on the next extension.
  - The permanent delegate does not need the vault's cooperation or signature, which is the whole point - no amount of care inside your program prevents it.
  - Validation has to unpack the mint's extension list rather than checking its size or its owning program, because the program is the same for safe and unsafe mints alike.
difficulty: 4
