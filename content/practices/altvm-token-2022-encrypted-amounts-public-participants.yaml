id: altvm-token-2022-encrypted-amounts-public-participants
moduleId: altvm-token-2022
grain: block
kind: implement
title: Hide the amount, then enumerate everything still visible
difficulty: 3
concepts: [confidential-transfer-extension, confidential-pending-balance-counter]
spec: >
  Confidential transfers hide one field. This exercise is to hide it correctly and then be precise about
  everything that is still public.

  MAKE ONE. Configure a mint with the confidential extension, deposit into the confidential balance, and
  transfer confidentially between two accounts. Show, from chain data alone, that the amount is not readable.
  Then decrypt it as the owner and show it is the value you sent.

  WHAT IS STILL PUBLIC. Now enumerate it: sender, recipient, timing, the fact that a transfer occurred, and
  the mint. For each, state what an observer can infer from it. Then construct the inference that makes the
  limitation concrete: given a small set of participants and public timing, show how much can be reconstructed
  about who paid whom without ever reading an amount.

  THE COUNTER. The pending balance has a counter, and it is not decoration. Establish what it is for, then hit
  its limit: send enough confidential transfers into one account without applying them and show what happens to
  the next one. Report the limit. Then state what the recipient must do and what that means for a product
  receiving many payments — this is the operational trap in the feature and it belongs in the write-up.

  Close with one paragraph on when this extension is the right tool: name a use where hiding the amount alone
  is sufficient, and one where it plainly is not.
acceptance:
  criteria:
    - A mint is configured with the confidential extension and a confidential transfer is made between two accounts
    - The amount is shown unreadable from chain data and then decrypted by the owner to the sent value
    - Sender, recipient, timing, transfer occurrence and mint are enumerated as still public, each with what it lets an observer infer
    - An inference is constructed showing how much is reconstructable from a small participant set and public timing
    - The pending balance counter's purpose is established
    - Its limit is reached by unapplied transfers, with the behaviour and the limit reported
    - What the recipient must do is stated, with the consequence for a product receiving many payments
    - One paragraph names a use where hiding amounts suffices and one where it does not
hints:
  - Do the enumeration before you build anything. Writing down what confidentiality does not cover keeps the exercise from becoming a feature tutorial.
  - The pending counter limit is the thing that breaks products in practice. Hit it deliberately in a test rather than discovering it in production.
  - "For the sufficient-use example, payroll is the clean case: participants are known and the amount is the secret."
