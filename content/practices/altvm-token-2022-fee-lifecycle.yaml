id: altvm-token-2022-fee-lifecycle
moduleId: altvm-token-2022
grain: block
kind: implement
title: Follow a transfer fee all the way to the withdraw authority
concepts: [transfer-fee-extension, transfer-checked-is-mandatory, extensions-are-tlv-state, token-program-id-is-a-seed]
spec: >
  Against a local validator or an in-process SVM, create a Token-2022 mint with the transfer fee extension,
  create token accounts for two holders, mint a supply, and transfer between them with `transfer_checked`.
  Print, for that one transfer, four numbers: the sender's debit, the amount named in the instruction, the
  recipient's spendable credit, and the amount withheld inside the recipient's account. Then harvest the
  withheld amounts and withdraw them to the withdraw authority, printing the balance movement at each step.
  Separately, derive the associated token account address for one holder twice - once with the Token-2022
  program id as a seed and once with the legacy token program id - and print both, showing they differ. Also
  attempt the same transfer with plain `transfer` and record what happens.
acceptance:
  command: pnpm vitest run test/transfer-fee-lifecycle.test.ts
  criteria:
    - The test asserts the recipient's spendable credit is strictly less than the amount named in the transfer instruction, by exactly the withheld amount
    - The test asserts the sum of spendable credit and withheld amount equals the sender's debit
    - The test asserts the harvested and withdrawn total equals the withheld amount, ending in the withdraw authority's account
    - The test asserts the two derived associated token account addresses differ, and that plain transfer does not succeed on this mint
hints:
  - The withheld amount is stored inside the recipient's token account as extension state - read it from the account, do not compute it from the fee basis points and trust the arithmetic.
  - Harvesting and withdrawing are two separate steps with two different authorities; conflating them hides where the money actually sits between them.
  - The associated token account derivation takes the token program id as a seed, which is why the legacy derivation returns a real but unrelated address.
difficulty: 3
