id: altvm-token-2022-mint-onboarding-checklist
moduleId: altvm-token-2022
kind: write
title: A listing checklist that covers every extension
concepts: [allowlist-mints-not-programs, mint-close-and-reinit-hazard, non-transferable-and-default-frozen, rebasing-extensions, hook-must-verify-transferring-flag]
spec: >
  Produce `docs/mint-onboarding.md` for a hypothetical DEX that wants to support Token-2022. Enumerate every
  extension in the current Token-2022 documentation and place each in exactly one of three buckets: reject the
  mint, support with specific handling, or harmless. Every entry needs a one-sentence reason tied to what the
  DEX actually does with the token, and every entry in the middle bucket needs the concrete check or code
  change named. Add a section on the mint close-and-reinitialize hazard stating what your process does about
  a mint whose extension set can change after listing. Write a companion script that reads a mint account over
  RPC, decodes its enabled extensions, and prints the bucket for each - failing if it encounters an extension
  the document does not mention.
acceptance:
  command: node scripts/mint-check.mjs --doc docs/mint-onboarding.md --mint <MINT_ADDRESS>
  criteria:
    - The script exits non-zero for any enabled extension that does not appear in exactly one bucket in the document
    - Run against a plain mint, a fee-bearing mint and a permanent-delegate mint, the script prints a different verdict for each
    - The document contains a stated policy for mints whose close authority allows the extension set to change after listing
hints:
  - Start from the extension list in the current documentation rather than from a blog post, because the newest extensions are exactly the ones older write-ups omit.
  - Calling an extension harmless is a claim about your specific protocol - metadata is harmless to a DEX and not to a wallet that renders it.
  - A mint that can be closed and rebuilt is not a static input, so the honest policy is either to reject a close authority or to re-check before every use.
difficulty: 3
