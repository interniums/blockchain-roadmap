id: app-account-abstraction-drain-a-paymaster
moduleId: app-account-abstraction
kind: break
title: Empty a generous paymaster
concepts: [paymaster-risk, paymaster, bundler]
spec: >
  Deploy a paymaster that sponsors any UserOperation from any account - the shape that appears in most
  "gasless onboarding" demos. From an unrelated account, drain its EntryPoint deposit by submitting valid,
  expensive, sponsored operations. Measure how much you extracted and how many operations it took. Then apply
  the scoping from the previous exercise and show the same attack fails.
acceptance:
  command: forge test --match-path test/PaymasterDrain.t.sol -vv
  criteria:
    - A test drives the permissive paymaster's deposit to zero from an account with no relationship to the application, and asserts the amount extracted
    - The same attack against the scoped paymaster reverts during validation
    - The test reports the number of operations required, and a comment states what that number would be at mainnet gas prices
hints:
  - Nothing here is an exploit in the usual sense - you are using the paymaster exactly as written.
  - The cheapest drain is not the most valuable call; it is the most expensive one the paymaster will pay for.
  - Ask what stopped you, and whether it was the paymaster's rules or your own imagination.
difficulty: 3
