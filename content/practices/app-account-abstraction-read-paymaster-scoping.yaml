id: app-account-abstraction-read-paymaster-scoping
moduleId: app-account-abstraction
grain: block
kind: read
title: Three ways to scope a paymaster wrong
concepts: [paymaster-risk, paymaster]
spec: >
  Read the OtterSec analysis of EVM paymasters. Produce a written list of three distinct scoping mistakes it
  identifies, and for each one write the concrete failure - who loses what, and what an attacker has to do. Then
  audit your own paymaster from the earlier exercise against all three and state which ones it is exposed to.
acceptance:
  command: test -s docs/paymaster-scoping-review.md && npx markdownlint docs/paymaster-scoping-review.md
  criteria:
    - The document names three distinct mistakes, each with its own failure mode rather than a restatement of "it can be drained"
    - Each entry states what an attacker must control or supply to trigger it
    - The self-audit section states, for each of the three, whether the learner's own paymaster is exposed and on what evidence
hints:
  - A scoping mistake and its consequence are different sentences; write both.
  - Look for the ones that are not about money directly - reputation, rate, and griefing count.
  - "Auditing your own code against a list you just wrote is the point; \"not applicable\" needs a reason."
difficulty: 2
