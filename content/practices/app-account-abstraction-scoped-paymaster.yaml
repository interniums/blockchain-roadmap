id: app-account-abstraction-scoped-paymaster
moduleId: app-account-abstraction
kind: implement
title: Sponsor exactly one thing
concepts: [paymaster, user-operation, entrypoint]
spec: >
  Write and deploy a paymaster that sponsors UserOperations only when the call targets one specific contract
  and one specific function selector, with a per-account cap on how much gas it will cover in a period.
  Fund its deposit at the EntryPoint. Then submit three UserOperations through a bundler against a local node:
  the intended call, the same call to a different contract, and a different function on the intended contract.
  Only the first may be sponsored.
acceptance:
  command: forge test --match-path test/ScopedPaymaster.t.sol -vv
  criteria:
    - The intended call is sponsored and the sending account's ETH balance is unchanged
    - Both the wrong-target and wrong-selector operations are rejected during validation, not during execution
    - A fourth test proves the per-account cap is enforced by exhausting it and showing the next operation is refused
hints:
  - The paymaster's validation function is the only place a rule becomes real.
  - Decode the target and the first four bytes of the calldata out of the operation, and compare both.
  - The cap needs storage, and the validation phase limits what storage a paymaster may touch - read those rules before designing where the counter lives.
difficulty: 4
