id: app-account-abstraction-two-roads-to-an-account
moduleId: app-account-abstraction
grain: block
kind: measure
title: Give one user a programmable account twice, by both routes
difficulty: 3
concepts: [7702-vs-4337, session-key]
spec: >
  There are two ways to give an ordinary user an account that can do more than sign, and they are not
  interchangeable. Build both for the same user and the same capability.

  THE CAPABILITY. Pick one: batch three calls behind one approval, or let a scoped key act for a period
  without re-prompting.

  ROUTE ONE. Deliver it by delegating an existing EOA. Report what the user had to sign, what now exists
  on chain at their address, and what happens to their old signing key.

  ROUTE TWO. Deliver it through the alternative pipeline: a separate account contract and its own
  submission path. Report what the user had to sign, what was deployed and who paid for it, and how the
  operation reached the chain.

  THE COMPARISON. Then a table with real figures: cost to set up, cost per subsequent operation, what
  happens if the supporting infrastructure disappears, and whether the user's address changed. That last
  row is the one that decides most product decisions and it is easy to omit.

  THE SCOPED KEY. Add a session key under whichever route you prefer, and demonstrate one thing it may do
  and one it may not. Then state what has to exist for it to work at all — because a scoped key on a plain
  EOA is not a thing that can exist, and saying why is the point.
acceptance:
  criteria:
    - The same capability is delivered by both routes for the same user
    - "For the delegation route: what the user signed, what exists at their address, and the fate of their old key"
    - "For the alternative pipeline: what the user signed, what was deployed, who paid, and how the operation reached the chain"
    - A table gives setup cost, per-operation cost, infrastructure-failure behaviour, and whether the address changed
    - A session key is added with one permitted and one refused action demonstrated
    - What must exist for a scoped key to work is stated, with why a plain EOA cannot have one
hints:
  - Keep the user's address in the comparison table. Route one preserves it and route two usually does not, and for a product with existing users that single row often decides everything.
  - For the infrastructure-failure row, actually turn the supporting service off and see what the user can still do. The answers differ sharply between the routes.
  - The reason a plain EOA cannot hold a scoped key is that there is nowhere to put the policy. Say it that plainly.
