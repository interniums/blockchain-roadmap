id: app-eoa-upgrade-delegate-and-clear
moduleId: app-eoa-upgrade
kind: implement
title: Upgrade an account, then take it back
concepts: [viem-sign-authorization, 7702-upgrade-consent]
spec: >
  On Anvil, take a funded EOA and delegate it to a minimal batch-executor contract using viem's
  `signAuthorization` and a type-0x4 transaction carrying an `authorizationList`. Do it twice: once with a
  separate sponsor account paying for the transaction, and once with the authorizing account submitting its own
  upgrade - getting the nonce right in each case. Then execute a two-call batch through the delegated account.
  Finally, clear the delegation with an authorization pointing at the zero address and prove the account's code
  is empty again.
acceptance:
  command: forge test --match-path test/Eip7702Upgrade.t.sol && pnpm vitest run test/sign-authorization.test.ts
  criteria:
    - After the sponsored upgrade the account's code is the delegation designator naming the executor, and the sponsor paid the gas
    - The self-submitted upgrade succeeds, and the test documents which nonce value the authorization had to use and why it differs from the sponsored case
    - After clearing, the account's code length is zero and the batch call reverts
hints:
  - The authorization names a chain, a delegate address, and a nonce - and the nonce belongs to the authorizing account, not the sender.
  - A transaction consumes the sender's nonce before authorizations are processed; that matters only when the two accounts are the same one.
  - Clearing is not a special operation - it is the same authorization with the delegate set to the zero address.
difficulty: 4
