id: app-eoa-upgrade-detect-delegation-in-ui
moduleId: app-eoa-upgrade
grain: block
kind: fix
title: The check that used to mean "this is a person"
concepts: [detect-delegated-eoa, wallet-chooses-the-delegate]
spec: >
  You are given an app with a code path that treats an address as a user account when its code length is zero
  and as a contract otherwise, and which renders a different flow for each. Point it at a delegated EOA and show
  that it takes the wrong branch. Then replace the check with a proper detection that reads the account's code,
  recognises the delegation designator prefix, extracts the delegate address, and returns one of three answers:
  plain EOA, delegated EOA, or contract. Render all three distinctly, and show the delegate address for the
  middle case.
acceptance:
  command: pnpm vitest run test/detect-delegation.test.ts
  criteria:
    - A test case with a delegated EOA fixture asserts the original check returns "contract" and the new one returns "delegated" with the correct delegate address extracted
    - Plain EOA and ordinary contract fixtures still classify correctly under the new check
    - The new implementation does not branch on code length alone anywhere
hints:
  - Read the code, not its length.
  - The designator has a fixed reserved prefix and then twenty bytes; both parts matter.
  - Three answers, not two - a UI that collapses "delegated" into either of the other two is the bug you are fixing.
difficulty: 2
