id: app-error-surfaces-exact-estimate-fails
moduleId: app-error-surfaces
grain: module
writeUp: >
  Take the last chain error a real user reported to you. Which of the four triage buckets did it belong to, what did your interface show them, and what should it have shown? Then say what in your code would have had to exist for the right message to be produced automatically.
coversConcepts:
  - revert-data-is-abi-encoded
  - four-revert-shapes
  - error-string-legacy
  - solidity-custom-errors
  - panic-codes
  - panic-means-bug
  - empty-revert-data
  - selector-only-4-bytes
  - decode-needs-the-right-abi
  - viem-decode-error-result
  - estimategas-is-a-search
  - estimategas-nonmonotonic
  - estimategas-63-64
  - estimategas-failure-modes
  - estimategas-is-not-simulation
  - provider-error-shape-drift
  - error-triage-taxonomy
  - error-message-must-name-the-next-action
kind: break
title: A perfect estimate that still runs out of gas
concepts: [estimategas-63-64, estimategas-is-a-search, estimategas-nonmonotonic, estimategas-is-not-simulation]
spec: >
  Build a contract with several nested calls where an inner frame branches on `gasleft()`. Estimate its gas,
  send it with exactly the estimated limit, and show it failing. Explain the failure via the 63/64 rule, then
  find the headroom multiplier that makes it pass reliably. Separately, demonstrate the non-monotonicity: find
  a gas limit at which the call succeeds and a larger one at which it does not, and show what the estimator
  returns for it.
acceptance:
  command: forge test --match-path test/EstimateGasTraps.t.sol -vv
  criteria:
    - A test sends with exactly the estimated limit and asserts an out-of-gas failure inside a nested frame
    - A test finds and asserts a pair of limits where the smaller succeeds and the larger fails
    - The headroom multiplier that makes the first case pass is recorded, with a comment explaining why it is a compensation for a documented rule rather than superstition
hints:
  - Nest deeper than you think you need to; one level of 63/64 is not visible.
  - The non-monotonic branch needs to do something different when gas is plentiful, not merely fail sooner.
  - Ask what a bisection search returns when the success region is not an interval.
difficulty: 4
