id: app-error-surfaces-five-failure-paths
moduleId: app-error-surfaces
grain: block
kind: break
title: Five failures, five byte strings
concepts: [four-revert-shapes, error-string-legacy, solidity-custom-errors, panic-codes, empty-revert-data]
spec: >
  Deploy a contract exposing five failure paths: a `require` with a string message, a custom error carrying
  arguments, a failed `assert`, an out-of-bounds array read, and a call to an address holding no code. Capture
  the raw revert bytes for each. Build a five-row table mapping raw hex to selector to decoded meaning, using
  `cast sig`, `cast decode-error` and viem's `decodeErrorResult`, and explain why exactly one row has no
  selector at all.
acceptance:
  command: forge test --match-path test/FiveReverts.t.sol -vv && pnpm vitest run test/decode-five.test.ts
  criteria:
    - Both toolchains produce the same error name and arguments for every decodable row
    - The table records the two builtin selectors explicitly and identifies which panic code each panic row produced
    - The written explanation identifies the no-selector row and lists at least three other causes that produce the same empty data
hints:
  - Use a low-level call so you receive the revert bytes instead of having them bubble and revert your test.
  - Two of the five share a selector family that is not a custom error at all.
  - The empty row is the interesting one - the point is that its emptiness tells you nothing about which of several causes produced it.
difficulty: 3
