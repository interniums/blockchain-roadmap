id: app-error-surfaces-to-user-message
moduleId: app-error-surfaces
grain: block
kind: implement
title: One function from any error to one next action
concepts: [error-triage-taxonomy, error-message-must-name-the-next-action, viem-decode-error-result, decode-needs-the-right-abi, provider-error-shape-drift]
spec: >
  Write `toUserMessage(error)`. It walks a viem error's cause chain, decodes custom errors against a supplied
  set of ABIs covering every contract in your call path, classifies the failure into one of the four triage
  buckets, and returns a message that names what failed and the one thing the reader should do. Cover at least
  eight distinct failures: a decodable custom error, an undecodable one from a contract whose ABI you withheld,
  panic 0x11, panic 0x32, an empty revert, insufficient funds, user rejection, and an RPC timeout.
acceptance:
  command: pnpm vitest run test/to-user-message.test.ts
  criteria:
    - Eight table-driven cases each map to a distinct message, and every message names a next action
    - No output contains raw hex, a four-byte selector, or the string "execution reverted"
    - The panic cases produce an app-bug message rather than a business message, and the test asserts an alert hook was called for them
hints:
  - Classify first, phrase second - the message is a rendering of the bucket, not the other way round.
  - The undecodable case is the one that proves your function is honest; it must still produce a usable message.
  - Run at least one case against a hosted provider as well as a local node and see whether your classification survives.
difficulty: 3
