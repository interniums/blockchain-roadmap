id: app-passkeys-malleable-replay
moduleId: app-passkeys
grain: module
writeUp: >
  Draw every state a passkey account of yours can be in - one credential, several, none, lost OS account, changed domain - and the exit from each. Any state whose only exit is "unrecoverable" must either gain an exit or be written down as an accepted risk with the words "the user loses everything" in it. Which did you choose, and why?
coversConcepts:
  - passkey-definition
  - passkey-ux-win
  - passkey-curve-mismatch
  - passkey-needs-smart-account
  - webauthn-signed-payload
  - webauthn-challenge-binding
  - webauthn-onchain-reconstruction
  - webauthn-clientdata-checks
  - eip-7951-precompile
  - p256-precompile-vs-solidity
  - eip-7951-no-low-s
  - passkey-rp-id-binding
  - passkey-sync-vs-device-bound
  - passkey-recovery-is-mandatory
  - passkey-recovery-mechanisms
  - passkey-pubkey-must-be-registered
kind: break
title: The same signature, twice
concepts: [eip-7951-no-low-s, webauthn-clientdata-checks, eip-7951-precompile]
spec: >
  Take a valid P-256 signature from the previous exercise and compute its counterpart with `s` replaced by
  `n - s`. Show the precompile accepts both. Then build an account whose replay protection keys off the
  signature bytes and demonstrate a double execution. Fix it two ways - normalise to low-s on the way in, and
  key replay protection off the nonce instead - and say which fix you would ship. Separately, verify only the
  P-256 signature while skipping the clientDataJSON checks, and replay an assertion harvested from a different
  ceremony.
acceptance:
  command: forge test --match-path test/P256Malleability.t.sol -vv
  criteria:
    - A test asserts that both (r, s) and (r, n - s) return one from the precompile
    - A test shows the naive account executing the same authorised action twice, and both fixes preventing it
    - A further test shows the signature-only verifier accepting an assertion from another ceremony and the hardened verifier rejecting it on the type or challenge check
hints:
  - The curve order is a constant you can paste; the second signature is arithmetic, not a new ceremony.
  - Ask what your account uses as the identity of "this operation" - if the answer involves the signature, that is the bug.
  - The second half of this exercise needs an assertion made for a different challenge; produce one and reuse it verbatim.
difficulty: 4
