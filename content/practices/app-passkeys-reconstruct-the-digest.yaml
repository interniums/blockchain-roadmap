id: app-passkeys-reconstruct-the-digest
moduleId: app-passkeys
kind: implement
title: Rebuild what the authenticator signed
concepts: [webauthn-signed-payload, webauthn-onchain-reconstruction, eip-7951-precompile]
spec: >
  In a browser page, register a credential with `navigator.credentials.create()` and then obtain an assertion
  with `navigator.credentials.get()` using a 32-byte challenge you choose. Dump `authenticatorData`,
  `clientDataJSON` and the signature. Decode the DER signature into `r` and `s`. In TypeScript, reconstruct the
  signed digest as `SHA-256(authenticatorData ‖ SHA-256(clientDataJSON))` and verify it locally. Then write a
  Foundry test that staticcalls `0x100` with the resulting 160-byte payload on a fork with the precompile active.
acceptance:
  command: forge test --match-path test/P256Precompile.t.sol -vv && pnpm vitest run test/webauthn-digest.test.ts
  criteria:
    - The TypeScript test verifies the reconstructed digest against the credential's public key and locates the challenge bytes inside the raw clientDataJSON
    - The Foundry test asserts a valid payload returns 32 bytes whose value is one
    - Flipping one byte of r makes the Foundry test assert a zero-length return, and the assertion is on returndatasize rather than on call success
hints:
  - Your challenge is not what was signed; find it inside the JSON first and the rest follows.
  - DER is length-prefixed and can carry a leading zero byte on r or s - strip it before you build the 32-byte words.
  - The precompile signals failure by returning nothing; a test that checks only `success` will pass on garbage.
difficulty: 4
