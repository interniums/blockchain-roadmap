id: app-passkeys-recovery-state-table
moduleId: app-passkeys
kind: write
title: Every state, and the way out of it
concepts: [passkey-recovery-is-mandatory, passkey-recovery-mechanisms, passkey-pubkey-must-be-registered, passkey-sync-vs-device-bound, passkey-rp-id-binding]
spec: >
  Design the recovery model for a passkey wallet your product could ship. Enumerate every state the account can
  be in - one credential, several credentials, zero working credentials, synced credentials with a lost OS
  account, a changed or lost relying-party domain - and for each state give the exact exit: who authorises it,
  what transaction it requires, and how long it takes. Then state, for each recovery mechanism you chose, who
  else can take the account under it.
acceptance:
  command: test -s docs/passkey-recovery.md && npx markdownlint docs/passkey-recovery.md && grep -c '^|' docs/passkey-recovery.md
  criteria:
    - Every enumerated state has a named exit, or is explicitly marked as an accepted total-loss risk in those words
    - The zero-credential state is addressed with a mechanism that does not require an existing credential
    - A section names, for each mechanism chosen, the parties who could seize the account and what they would have to collude on
hints:
  - Start from the states, not from the mechanisms - mechanisms chosen first always leave a state uncovered.
  - Registering a credential is a transaction the account must authorise; that constraint eliminates several tempting answers.
  - The domain is a state too, and it is the one nobody writes down.
difficulty: 3
