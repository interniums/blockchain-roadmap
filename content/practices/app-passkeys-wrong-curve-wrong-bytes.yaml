id: app-passkeys-wrong-curve-wrong-bytes
moduleId: app-passkeys
grain: block
kind: implement
title: Onboard with a passkey, and account for both things that are wrong about it
difficulty: 3
concepts: [passkey-definition, passkey-ux-win, passkey-curve-mismatch, passkey-needs-smart-account]
spec: >
  A passkey is on the wrong curve and signs the wrong bytes, and it is still the best consumer onboarding
  available. Build it and be precise about both problems.

  WHAT IT IS. Create a passkey credential and report exactly what exists afterwards: where the private key
  lives, what can move it, and what unlocks it. Then state the onboarding win in concrete steps — count
  the steps a user takes with a passkey and with a seed phrase, and report both numbers.

  THE WRONG CURVE. Show that the credential's public key cannot be an Ethereum address: attempt the
  derivation and state where it fails. Then state the consequence — that the account must be a contract —
  and demonstrate the minimum: an account contract that verifies a passkey signature and acts on it.

  THE WRONG BYTES. Show what the authenticator actually signed. It is not your message: reconstruct the
  signed payload from its parts and show your message is one field inside a hash inside it. Then verify
  that reconstruction on chain and assert it matches what the device produced.

  Then the failure that follows: alter one field of the payload that is not your message, and show the
  signature still verifying over a different meaning. State what a contract must check beyond the
  signature.
acceptance:
  command: forge test --junit --match-path test/Passkey.t.sol
  criteria:
    - A passkey credential is created with where the key lives, what can move it and what unlocks it all reported
    - Onboarding steps are counted for a passkey and a seed phrase, both reported
    - Deriving an Ethereum address from the credential is attempted with the failure point stated
    - An account contract verifies a passkey signature and acts on it
    - The signed payload is reconstructed from its parts, showing the message as one field inside it
    - The reconstruction is verified on chain against what the device produced
    - Altering a non-message field leaves the signature valid over a different meaning
    - What a contract must check beyond the signature is stated
hints:
  - Reconstruct the signed payload before trying to verify anything. Almost every failed passkey integration is a payload assembly bug presented as a signature bug.
  - The step count is worth doing honestly, including recovery. Passkeys win on first use and the recovery story is where the comparison gets interesting.
  - "The final demonstration is the important one: a valid signature over a payload you did not fully constrain is the whole class of bug here."
