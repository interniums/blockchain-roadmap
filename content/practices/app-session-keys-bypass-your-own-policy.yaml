id: app-session-keys-bypass-your-own-policy
moduleId: app-session-keys
grain: block
kind: break
title: Break the module you just wrote
concepts: [session-key-enforced-on-chain, session-key-policy-dimensions, session-key-blast-radius]
spec: >
  Attack your own validator from the previous exercise with at least three approaches: replay the same session
  authorisation on a second chain id; exhaust the value cap and then replay an earlier accepted call to spend
  past it; and invoke a different function whose selector you can influence. Find at least one working bypass.
  Then patch it, name the policy dimension that was missing, and add the regression test.
acceptance:
  command: forge test --match-path test/SessionKeyBypass.t.sol -vv
  criteria:
    - At least one test demonstrates a working bypass against the original module and is marked as such
    - After the patch, that test asserts a revert instead, and the previously passing legitimate-use tests still pass
    - A comment in the test file names the policy dimension the bypass exploited
hints:
  - Ask what the signature commits to, and then ask what it does not commit to.
  - A cumulative cap that is not persisted is not a cumulative cap.
  - Chain id is a policy dimension, and it is the one people forget because their tests only ever run on one chain.
difficulty: 4
