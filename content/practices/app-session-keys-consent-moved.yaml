id: app-session-keys-consent-moved
moduleId: app-session-keys
grain: block
kind: implement
title: Ask the wallet for a permission, and show where the consent went
difficulty: 3
concepts: [session-key-definition, session-key-needs-programmable-account, erc-7715-grant-permissions, erc-7710-delegation-manager, session-key-consent-moves-not-disappears]
spec: >
  A session key removes a prompt. It does not remove the decision the prompt was asking about, and this
  exercise is to locate where that decision went.

  WHAT IT IS. Implement the smallest working session key: a scoped key that may perform one action within
  one limit. State the three things that had to exist for it to work at all, and then demonstrate the
  negative case — attempt the same setup against an account that is not programmable and show precisely
  where it fails.

  ASK, DO NOT ASSUME. Rather than constructing the grant yourself, request the permission from the wallet
  through the standard flow. Show the request, the wallet's response, and what the user was actually shown.
  Then use the delegation manager path to redeem it, and report what that intermediary is trusted for.

  WHERE THE CONSENT WENT. Now the argument. Enumerate every decision the user made at grant time, and every
  decision they are no longer being asked about. Then construct the scenario that makes the trade concrete:
  something the key does that the user would have declined if prompted, but which is inside the policy they
  granted. Report it and state which dimension of the policy was too loose.

  Close with the grant you would actually ship — the scope, the limit, the duration — and what you decided
  the user does not need to see again.
acceptance:
  criteria:
    - A minimal scoped session key performs one permitted action within one limit
    - The three prerequisites for it to work are stated
    - The same setup is attempted against a non-programmable account with the exact failure point shown
    - The permission is requested through the standard wallet flow, with the request, response and what the user saw all reported
    - The delegation manager path is used to redeem it, with what the intermediary is trusted for stated
    - Every decision made at grant time and every decision no longer asked about are enumerated
    - A scenario is constructed where the key does something the user would have declined but which the policy permits, with the loose dimension named
    - A shippable grant is specified with scope, limit and duration, and what the user will not be asked again
hints:
  - Build the key by hand before requesting one through the standard flow. Knowing what the grant contains makes the wallet's response readable rather than opaque.
  - The negative case is worth doing properly. Watching the setup fail on a plain EOA is what makes the prerequisite concrete instead of a sentence.
  - For the too-loose scenario, look at the dimension you constrained least. It is usually duration or aggregate value, and the exercise is noticing which one you were casual about.
