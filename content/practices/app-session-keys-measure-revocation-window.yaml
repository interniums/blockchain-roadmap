id: app-session-keys-measure-revocation-window
moduleId: app-session-keys
kind: measure
title: How long a revoked key stays alive
concepts: [session-key-revocation-costs-gas, session-key-revocation-race, session-key-expiry-is-free]
spec: >
  Instrument the revocation path for your session-key module. Measure the gas cost of uninstalling the module
  or otherwise invalidating the session, and the wall-clock time from the moment a user would press revoke to
  the moment the transaction is mined on a public testnet. Then, on Anvil with auto-mining disabled, demonstrate
  the race directly: broadcast the revocation, and from the session key broadcast an operation at a higher fee.
  Mine and record which landed.
acceptance:
  command: forge test --match-path test/RevocationWindow.t.sol --gas-report && pnpm tsx scripts/revocation-latency.ts --out latency.json
  criteria:
    - The gas report contains a measured cost for the revocation path, quoted from the report rather than estimated
    - latency.json records click-to-receipt seconds on a testnet and converts it into a window expressed in blocks
    - The Anvil race test shows the session-key operation being included ahead of the revocation and asserts it succeeded
hints:
  - Disable auto-mining before you try to observe an ordering.
  - The window you care about is measured in blocks, not seconds - convert it.
  - Compare the whole exercise against doing nothing and simply letting a short expiry lapse.
difficulty: 3
