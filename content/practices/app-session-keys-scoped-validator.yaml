id: app-session-keys-scoped-validator
moduleId: app-session-keys
grain: module
writeUp: >
  Write the one sentence you would show a user at grant time for the most useful session key your product could issue - naming the contract, the actions, the cap, and the expiry - in under sixty words. Then write the sentence you would have to show them if the key leaked. If the second sentence is worse than "you lost X", the policy is too wide.
coversConcepts:
  - session-key-definition
  - session-key-needs-programmable-account
  - session-key-policy-dimensions
  - session-key-enforced-on-chain
  - erc-7579-validator-vs-executor
  - session-key-4337-validation-limits
  - erc-7715-grant-permissions
  - erc-7710-delegation-manager
  - session-key-expiry-is-free
  - session-key-revocation-costs-gas
  - session-key-revocation-race
  - session-key-blast-radius
  - session-key-material-location
  - session-key-vs-token-approval
  - session-key-consent-moves-not-disappears
kind: implement
title: A policy the account actually enforces
concepts: [session-key-policy-dimensions, session-key-enforced-on-chain, erc-7579-validator-vs-executor, session-key-expiry-is-free]
spec: >
  On Anvil, stand up a modular smart account - or an EOA delegated to modular account code under EIP-7702 - and
  install a validator module that accepts a session key only when the call targets one address, uses one
  function selector, carries a value at or below a cap, and arrives before a `validUntil` timestamp. Write the
  policy as data, not as hardcoded constants, so a second session with different bounds can be installed
  alongside the first.
acceptance:
  command: forge test --match-path test/SessionKeyValidator.t.sol -vv
  criteria:
    - Four tests pass - the allowed call succeeds; a call to a different target reverts; a call over the value cap reverts; a call after validUntil reverts
    - A fifth test installs a second session with different bounds and proves the two do not interfere
    - No test passes because of a check performed off-chain
hints:
  - Start by writing the policy struct; the validation function falls out of it.
  - Expiry is a comparison against the block timestamp and costs you nothing to add - do it first.
  - If you can construct a call by hand that your validator accepts and your intended policy forbids, the policy is not the one you wrote.
difficulty: 4
