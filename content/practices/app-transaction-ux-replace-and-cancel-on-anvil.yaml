id: app-transaction-ux-replace-and-cancel-on-anvil
moduleId: app-transaction-ux
kind: break
title: Two transactions, one nonce
concepts: [tx-replacement-same-nonce, tx-cancel-is-a-replacement, tx-replacement-changes-the-hash, tx-nonce-is-a-sequence]
spec: >
  On Anvil with auto-mining disabled, send a transaction at a low fee. Then send a same-nonce replacement at a
  higher fee, and separately a same-nonce zero-value self-send. Mine and observe. Record both hashes, which
  transaction landed, and what happened to the account's nonce. Then repeat with a second transaction queued
  behind the first and show what the stuck head does to it.
acceptance:
  command: pnpm vitest run test/replacement.test.ts
  criteria:
    - The test asserts exactly one of the same-nonce transactions is present in a block and the account nonce advanced by one, not two
    - Both transaction hashes are recorded and shown to differ while the nonce is identical
    - A further assertion shows the queued higher-nonce transaction was not included while the lower nonce was unmined
hints:
  - "`evm_setAutomine` off first, or you will never see two transactions coexist."
  - Nodes require a minimum fee increase to accept a replacement, and that threshold is client policy - find the one your node applies rather than assuming a number.
  - Watch the nonce, not the hashes, if you want to know what the user actually did.
difficulty: 3
