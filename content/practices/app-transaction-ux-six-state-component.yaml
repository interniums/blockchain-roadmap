id: app-transaction-ux-six-state-component
moduleId: app-transaction-ux
kind: implement
title: A transaction component with six real states
concepts: [tx-lifecycle-states, tx-receipt-status-zero, tx-replacement-reasons, tx-simulate-before-send, tx-is-not-request-response]
spec: >
  Build a transaction-status component that renders six distinct states - simulating, awaiting signature,
  pending, replaced with its reason, reverted, and confirmed at N - driven by `simulateContract` then
  `writeContract` then `waitForTransactionReceipt` with an `onReplaced` handler. Each state must have its own
  copy and its own affordances; a spinner counts as one state, not three. Make every one of the six reachable
  on Anvil.
acceptance:
  command: pnpm playwright test tests/tx-status-states.spec.ts
  criteria:
    - Six tests each drive the component into one state and assert on its distinct rendered text
    - The replaced state displays which of repriced, cancelled or replaced occurred
    - The reverted state is reached via a receipt with a reverted status, and is rendered differently from the simulation-failure state
hints:
  - Disable auto-mining on Anvil so pending is a state you can hold rather than a frame you miss.
  - "`onReplaced` gives you the reason and the new transaction - both belong on screen."
  - A revert caught at simulation and a revert seen in a receipt are different events with different messages; if your component cannot tell them apart, it has five states.
difficulty: 3
