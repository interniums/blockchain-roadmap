id: app-transaction-ux-survive-a-reorg
moduleId: app-transaction-ux
kind: fix
title: A backend that survives a reorg
concepts: [tx-reorg-effects, tx-replacement-changes-the-hash, tx-confirmation-policy-is-a-product-decision, tx-optimistic-ui-boundary]
spec: >
  You are given a backend that stores `tx_hash` as the primary key for an order and marks the order paid on the
  first receipt it sees. Reorganise the chain under it on a local node - by mining a competing branch, or with
  the node's reorg cheatcode if your Foundry build provides one - and show the order marked paid for a
  transaction that no longer exists. Then fix it: key on `(address, chainId, nonce)`, wait a configurable
  confirmation count before crediting, and un-credit when a log arrives with the removed flag set.
acceptance:
  command: pnpm vitest run test/reorg-safety.test.ts
  criteria:
    - A test reproduces the original bug - an order in the paid state after the transaction was reorged out
    - After the fix the same scenario leaves the order unpaid, and the test asserts the un-credit path ran
    - A test proves a replaced transaction updates the existing order rather than creating a second one
hints:
  - Confirm the reorg tooling your Foundry build actually provides before designing the test around it; mining a competing branch works everywhere.
  - The bug is not the reorg, it is that the primary key was never stable.
  - Un-crediting is easy in your database and impossible in the outside world - which is why the confirmation count exists.
difficulty: 4
