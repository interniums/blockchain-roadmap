id: app-viem-capstone-every-line-accounted-for
moduleId: app-viem
grain: module
writeUp: >
  Pick one function in your own codebase that sends a transaction. Which of its lines touch the network, which hold a key, and which could return a value that was already stale when it arrived? Write the answer for each line, then say what you would have to change to make a wrong answer impossible rather than unlikely.
