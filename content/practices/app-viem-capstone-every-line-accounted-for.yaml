kind: implement
title: An integration where you can say what every line does to the network
difficulty: 4
concepts: [viem-client-vs-transport, viem-public-client, viem-wallet-client, viem-account-kinds, viem-transport-fallback, viem-multicall-batching, viem-abi-const-inference, viem-bigint-boundary, viem-simulate-before-send, viem-simulation-is-not-a-guarantee, viem-error-hierarchy, viem-typed-revert, viem-sync-send]
spec: >
  Build a small TypeScript program that reads from and writes to a contract, and then annotate it so
  that for every line you can say three things: whether it hits the network, whether it can spend
  money, and what it does when the node is wrong.

  THE TWO CLIENTS. Use both a public client and a wallet client, and write a test that fails if a
  read-only code path is ever handed something that can sign. Demonstrate at least two account kinds.

  THE TRANSPORT IS NOT THE CLIENT. Configure a fallback across three transports and prove it works by
  making the first fail. Then prove the client is unchanged by swapping HTTP for a socket transport
  with no other edit.

  BATCHING. Turn ten independent reads into one multicall and count the requests before and after.
  Then find the case where batching is wrong — a read whose result the next read depends on — and show
  what happens if you batch it anyway.

  THE INTEGER BOUNDARY. Take a uint256 value that does not fit in a JavaScript number, carry it through
  your whole program, and assert it is exact at the far end. Then deliberately round it and show the
  test catching that. Name every place in your program where a bigint could become a number.

  TYPES FROM THE ABI. Show your ABI producing real types: a wrong argument type must fail at compile
  time, not at runtime. Include one commit where it does fail, so the mechanism is visible.

  SIMULATE, THEN DO NOT TRUST IT. Simulate before sending. Then construct a case where the simulation
  succeeds and the real send fails, and state why — this is the module's sharpest point and the write-up
  has to make it.

  ERRORS. Trigger four distinct error classes and handle each by its type rather than by string
  matching, including one typed revert decoded to its custom error and arguments.

  THE LAST TRAP. Use the send-and-wait convenience, then name a chain where waiting for one confirmation
  is not the same as being confirmed, and say what you would do there instead.
acceptance:
  criteria:
    - Both client kinds are used, with a test that fails if a read-only path receives a signing-capable client
    - At least two account kinds are demonstrated
    - A three-transport fallback is proven by failing the first, and a transport swap requires no other code change
    - Ten reads are batched into one multicall with request counts before and after
    - A dependent read is shown to break when batched
    - A uint256 too large for a JavaScript number survives the whole program exactly, and a deliberate rounding is caught by test
    - Every place a bigint could become a number is named
    - A wrong ABI argument type fails at compile time, with the failing state visible in a commit
    - A simulation that succeeds while the real send fails is constructed and explained
    - Four error classes are handled by type rather than string, including one typed revert decoded to its custom error and arguments
    - A chain is named where one confirmation is not confirmation, with the alternative stated
hints:
  - Put the public and wallet clients in different modules and never export the wallet one from the read layer. The test then becomes a type-level check rather than a runtime one, which is the version that actually holds.
  - For the simulation divergence, change the state between simulate and send. A simulation is a statement about a block that has already passed, and making that concrete is the whole lesson.
  - Search your code for Number( and for arithmetic on anything that came off the chain. That search is the bigint boundary audit, and it is usually shorter than people expect and never empty.
