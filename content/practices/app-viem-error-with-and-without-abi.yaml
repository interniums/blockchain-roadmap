id: app-viem-error-with-and-without-abi
moduleId: app-viem
kind: break
title: The same revert, decoded and undecoded
concepts: [viem-error-hierarchy, viem-typed-revert, viem-simulate-before-send]
spec: >
  Deploy a contract declaring `error InsufficientBalance(uint256 available, uint256 required)` and a function
  that reverts with it. From TypeScript, trigger that revert twice: once passing viem the full ABI, and once
  passing an ABI with the error definition stripped out. In both cases catch the thrown error and walk its
  `cause` chain rather than reading `error.message`. Record what you get in each case, and write one paragraph
  explaining the difference in terms of where decoding information lives.
acceptance:
  command: pnpm vitest run test/typed-revert.test.ts
  criteria:
    - With the full ABI, the test asserts the walked error is a `ContractFunctionRevertedError` whose `data.errorName` is `InsufficientBalance` and whose `data.args` are the two expected numbers
    - With the stripped ABI, the test asserts no `errorName` is available and the raw revert data is present as hex
    - Neither branch of the test matches on any substring of `error.message`
hints:
  - The error you catch is not the error that carries the data; something is wrapping it.
  - "`error.walk(e => e instanceof ContractFunctionRevertedError)` returns the link you want, or null."
  - Decoding is driven entirely by the ABI you passed to the action - viem has no other source of error definitions, which is exactly what the second case demonstrates.
difficulty: 3
