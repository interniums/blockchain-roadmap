id: app-viem-multicall-vs-loop
moduleId: app-viem
kind: measure
title: Twenty reads, two ways
concepts: [viem-multicall-batching, viem-transport-fallback]
spec: >
  Pick a token with at least twenty holders you can enumerate. Read `balanceOf` for all twenty against the same
  node, first as twenty sequential `readContract` calls and then as one `multicall`. Measure wall-clock time for
  each, and count the JSON-RPC requests actually issued - from the node's own log if you run Anvil, or from a
  request-counting transport wrapper. Report both numbers and explain the difference in terms of round trips
  rather than compute.
acceptance:
  command: pnpm tsx scripts/multicall-benchmark.ts --out results.json && pnpm vitest run test/multicall-benchmark.test.ts
  criteria:
    - results.json contains wall-clock milliseconds and an issued-request count for both strategies
    - The test asserts the multicall path issued strictly fewer requests than the sequential path
    - The written explanation states that both strategies execute the same twenty reads on-chain and identifies the saving as network round trips
hints:
  - Wrap the transport, or run against Anvil and read its request log - do not estimate the count.
  - "`http()` batches eligible requests by default, so disable batching first if you want the sequential path to be genuinely sequential."
  - The interesting number is not the ratio, it is what happens to the ratio when the node is far away rather than on localhost.
difficulty: 2
