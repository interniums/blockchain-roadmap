id: app-viem-two-client-round-trip
moduleId: app-viem
kind: implement
title: Read with one client, write with the other
concepts: [viem-public-client, viem-wallet-client, viem-multicall-batching, viem-simulate-before-send, viem-bigint-boundary]
spec: >
  Against a local Anvil node, write a TypeScript script that does the whole round trip for an ERC-20 transfer.
  Create a public client over `http()` and read the token's `decimals` and the sender's `balanceOf` in a single
  `multicall`. Format the balance for display with `formatUnits` - no floating-point arithmetic anywhere in the
  file. Create a wallet client from one of Anvil's private keys as a local account. Call `simulateContract` for
  the transfer, pass the returned `request` straight to `writeContract`, then `waitForTransactionReceipt`, and
  print the formatted balance again. The script must contain no call to `writeContract` that is not preceded by
  a successful `simulateContract` on the same line of reasoning.
acceptance:
  command: pnpm vitest run test/two-client-round-trip.test.ts
  criteria:
    - The test starts Anvil, runs the script, and asserts the printed before and after balances differ by exactly the transferred amount
    - A grep assertion in the test proves the source file contains no `Number(` or `parseFloat` applied to a chain value
    - Removing the `simulateContract` call and pointing the transfer at an amount exceeding the balance makes the test fail with a reverted receipt rather than a pre-signature error
hints:
  - The public client and the wallet client are two separate objects, and only one of them takes an account.
  - "`multicall` wants an array of `{ address, abi, functionName, args }` - the same shape `readContract` takes, one per entry."
  - "`simulateContract` returns `{ result, request }`; `writeContract(request)` is the whole handoff, and the ABI must be declared `as const` for `request` to type-check."
difficulty: 2
