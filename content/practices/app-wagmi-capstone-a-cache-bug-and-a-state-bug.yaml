id: app-wagmi-capstone-a-cache-bug-and-a-state-bug
moduleId: app-wagmi
grain: module
writeUp: >
  Every wagmi read hook in your app answers a question that was true at some point in the past. Pick the three reads whose staleness would hurt a user most, and for each one write down how stale it is allowed to be and what event should make it refetch. Then say which of the three you cannot currently answer without guessing.
