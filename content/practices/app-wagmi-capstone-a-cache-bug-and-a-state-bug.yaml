kind: fix
title: Reproduce the two bugs every wagmi app has, then fix them
difficulty: 4
concepts: [wagmi-is-viem-plus-query, wagmi-config-object, wagmi-read-hooks-are-queries, wagmi-write-hooks-are-mutations, wagmi-no-auto-invalidation, wagmi-querykey-shape, wagmi-bigint-serialization, wagmi-connector-abstraction, wagmi-eip6963-discovery, wagmi-connection-not-authentication, wagmi-ssr-hydration-mismatch, wagmi-cookie-storage, wagmi-provider-is-client-component, wagmi-chain-mismatch]
spec: >
  Almost every wagmi bug is a cache bug or a state-location bug. Build an app that has one of each,
  reproduce both reliably, then fix them — and prove the fixes with tests rather than by clicking.

  THE CACHE BUG. Build a page that reads a balance and a page that writes to the same contract. After
  the write succeeds, the read is stale. Reproduce it deterministically. Then fix it by invalidating
  the exact query key — and demonstrate the near-miss: invalidate a key that LOOKS right, show the
  stale value survives, and print both keys side by side so the difference is visible.

  THE STATE BUG. Server-render the page. Reproduce the hydration mismatch where the wallet state
  flashes or the markup differs. Fix it with cookie storage, and show the before and after: what the
  server rendered, what the client rendered, and why they now agree.

  THE SERIALISATION TRAP. Put a bigint in query data and serialise it across the SSR boundary. Show it
  failing. Fix it, and say what your fix costs in precision or in code.

  READS AND WRITES ARE DIFFERENT THINGS. Demonstrate that a read hook retries and a write hook does not,
  and say why that asymmetry is correct.

  CONNECTORS. Show EIP-6963 discovery finding more than one wallet, and handle the case where the user
  has none. Then demonstrate the distinction that causes real security bugs: connected is not
  authenticated. Construct a flow that treats a connected address as proof of identity, show why that
  is wrong, and fix it.

  THE CHAIN MISMATCH. Finally: the chain in the wallet is not the chain in your hook. Reproduce a write
  sent to the wrong chain, and fix it with a guard that fails loudly.
acceptance:
  criteria:
    - A stale-read-after-write bug is reproduced deterministically
    - A near-miss invalidation is shown failing, with both query keys printed side by side
    - The correct invalidation fixes it, proven by test
    - An SSR hydration mismatch is reproduced, then fixed with cookie storage, with server and client output shown before and after
    - A bigint in query data fails across the SSR boundary and is fixed, with the cost of the fix stated
    - A read hook is shown retrying and a write hook not, with the asymmetry justified
    - EIP-6963 discovery finds more than one wallet, and the no-wallet case is handled
    - A flow treating a connected address as identity is constructed, shown wrong, and fixed
    - A write sent to the wrong chain is reproduced and prevented by a guard that fails loudly
hints:
  - Print the query key rather than reasoning about it. It is an array with more in it than you expect, and the near-miss invalidation stops being mysterious the moment you can see both keys.
  - For the hydration mismatch, render on the server with no cookie present. That is the state real first-time visitors are in, and the one people forget to test.
  - Connected-is-not-authenticated is the finding worth carrying out of this module. An address in a connector is a claim by the browser, not a signature, and the fix is to ask for one.
