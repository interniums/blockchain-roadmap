id: app-wagmi-count-the-requests
moduleId: app-wagmi
grain: block
kind: measure
title: Five components, how many requests
concepts: [wagmi-read-hooks-are-queries, wagmi-chain-mismatch]
spec: >
  Render the same `useReadContract` call in five separate components on one page against a local Anvil node.
  Count the RPC requests Anvil actually receives. Then change one argument in one of the five components and
  count again. Finally, remove the explicit `chainId` from all five while the wallet is on a different chain
  than the config's default, and record what the components display. Write down the request counts and what
  changed the answer.
acceptance:
  command: pnpm tsx scripts/count-rpc.ts --report report.json && pnpm vitest run test/count-rpc.test.ts
  criteria:
    - report.json records the request count for the identical-args case and for the varied-args case, and the test asserts the first is strictly smaller
    - The report states which fields of the query key changed between the two runs
    - The report records what the five components displayed in the chain-mismatch case and whether any error was surfaced
hints:
  - Anvil logs every request it receives; that log is your ground truth, not the browser network tab alone.
  - Deduplication is a property of the key, so ask what is in the key.
  - In the last part, look for whether anything at all told you the data came from a chain the user is not on.
difficulty: 2
