id: app-wagmi-make-the-balance-update
moduleId: app-wagmi
kind: fix
title: The balance that never changes
concepts: [wagmi-no-auto-invalidation, wagmi-querykey-shape, wagmi-read-hooks-are-queries]
spec: >
  You are given an app that reads a balance with `useReadContract` and never updates it after a transfer.
  Make it update. Use `useBlockNumber({ watch: true })` together with
  `queryClient.invalidateQueries({ queryKey })`, where the query key is built from the exported
  `get<X>QueryOptions(config, args)` rather than hand-written. Prove it works by transferring from a second
  Anvil account outside the app entirely, so nothing in your own code path could have triggered the refresh.
acceptance:
  command: pnpm playwright test tests/balance-invalidation.spec.ts
  criteria:
    - The test transfers tokens from a second account via a direct cast or viem call, and asserts the rendered balance changes within two blocks without any user interaction
    - Replacing the derived query key with a hand-written string key makes the same test fail
    - The fix does not use polling with a fixed interval
hints:
  - Nothing on the chain notifies your cache; something in your app has to notice a new block.
  - An invalidate call that matches no key succeeds silently - that is why the key must be derived rather than written.
  - "`getBalanceQueryOptions(config, args).queryKey` and its siblings give you exactly the array the hook used."
difficulty: 3
