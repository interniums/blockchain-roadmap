id: app-wagmi-ssr-no-flash
moduleId: app-wagmi
kind: implement
title: A connected address in the first paint
concepts: [wagmi-ssr-hydration-mismatch, wagmi-cookie-storage, wagmi-provider-is-client-component, wagmi-config-object]
spec: >
  Build a Next.js App Router page that shows a connect button and, once connected, the account address and an
  ERC-20 balance. Configure wagmi with `ssr: true` and `storage: createStorage({ storage: cookieStorage })`,
  read the request's cookie header on the server, and pass `cookieToInitialState(config, cookie)` into
  `WagmiProvider`. Put `WagmiProvider` and `QueryClientProvider` in a `"use client"` component and create the
  `QueryClient` per mount rather than at module scope. Hard-refresh while connected: the address must be in the
  server-rendered HTML.
acceptance:
  command: pnpm playwright test tests/ssr-no-flash.spec.ts
  criteria:
    - The test connects a mock wallet, reloads, and asserts the address string is present in the initial HTML response body before any client JavaScript runs
    - The test asserts the browser console contains no React hydration mismatch warning during the reload
    - A source assertion proves the QueryClient is constructed inside a component, not at module scope
hints:
  - The server can only know what the request carries, and localStorage is not in the request.
  - "`ssr: true` alone changes when the client store is read; it does not put anything in the HTML."
  - "`cookieToInitialState` needs the raw cookie header string from the server component, threaded down as a prop into the client provider."
difficulty: 3
