id: app-wallet-capabilities-batch-with-fallback
moduleId: app-wallet-capabilities
kind: implement
title: One code path, two generations of wallet
concepts: [wallet-capabilities, use-capabilities, erc-5792-sendcalls, sendcalls-fallback]
spec: >
  Build an approve-then-deposit flow that submits both calls through `sendCalls` with
  `experimental_fallback` enabled, after querying the connected wallet's capabilities and rendering what it
  reported. Run the same build against two connectors: one wallet that implements `wallet_sendCalls` and one
  that does not. The application code must be identical in both runs - all branching happens on the capability
  response and inside viem's fallback, not on the wallet's name.
acceptance:
  command: pnpm playwright test tests/sendcalls-fallback.spec.ts --project=capable --project=legacy
  criteria:
    - Both projects reach the same success state and the test asserts the final on-chain state matches
    - The test asserts one wallet prompt in the capable run and two in the legacy run
    - A source assertion proves no branch in the application code inspects a wallet name, id, or user agent
hints:
  - Query capabilities first and render them - you cannot reason about a negotiation you cannot see.
  - Treat an unknown or still-loading capability as absent rather than present.
  - The fallback changes the number of prompts, not the code path you wrote - which is the whole point of the exercise.
difficulty: 3
