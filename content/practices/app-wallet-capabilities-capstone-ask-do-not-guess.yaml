id: app-wallet-capabilities-capstone-ask-do-not-guess
moduleId: app-wallet-capabilities
grain: module
writeUp: >
  Your app supports one wallet that batches atomically, one that batches without atomicity, and one that cannot batch at all. Describe the single code path that serves all three, and name the one user-visible promise you can make in every case. If there is no such promise, say what your UI shows instead.
coversConcepts:
  - wallet-capabilities
  - use-capabilities
  - erc-5792-sendcalls
  - sendcalls-fallback
  - batching-is-not-atomicity
kind: implement
title: One button, three wallets, no vendor sniffing anywhere
difficulty: 4
concepts: [wallet-capabilities, use-capabilities, erc-5792-sendcalls, sendcalls-fallback, batching-is-not-atomicity]
spec: >
  Build one flow that needs three calls — approve, deposit, stake — behind a single button, and make it
  work correctly against three wallets with different capabilities. The constraint is the exercise:
  nowhere in your code may you branch on which wallet it is.

  NEGOTIATE. Query capabilities before you decide anything. Log what each wallet reported. Then write
  the decision as a function of capabilities only, and add a test that fails if any vendor name,
  connector id or user-agent string appears in the decision path.

  THE BATCHED PATH. For a wallet that supports it, send all three as one batch and show the user
  approved once. Report the number of prompts.

  THE FALLBACK PATH. For a wallet that does not, send three sequential calls with three prompts, and
  handle the user rejecting the second — which is the case that matters, because the first has already
  landed. Say what state the system is in and what your UI tells the user.

  THE TRAP. Now the point of the module: prove that batched is not atomic. Construct a batch where the
  second call reverts, and show the first is still applied. Then say what you would have to do to get
  atomicity, and what that costs.

  THE STATUS. Track the batch to completion and surface a real status, including the partial-failure
  case. A spinner that resolves to "done" when one of three calls reverted is the bug this module
  exists to prevent, and your write-up should say what you show instead.
acceptance:
  command: 'true'
  criteria:
    - Capabilities are queried before any send, and what each of three wallets reported is logged
    - A test fails if any vendor name, connector id or user-agent string appears in the decision path
    - A capable wallet batches three calls behind one approval, with the prompt count reported
    - A non-capable wallet runs three sequential calls, with the user rejecting the second handled and the resulting state described
    - A batch whose second call reverts is shown to leave the first applied
    - What atomicity would require, and what it would cost, is stated
    - Batch status distinguishes success from partial failure, and the write-up says what the UI shows for the latter
hints:
  - Write the capability-only decision function first and unit test it against three fake capability responses. Once it exists you will not be tempted to sniff, because there is nowhere left to put the branch.
  - The rejected-second-call case is the one real users hit. Design what you show them before you write the happy path, or you will bolt it on badly.
  - For non-atomicity, make the second call revert on a condition you control from the test rather than by running out of gas. Gas exhaustion has a different failure shape and muddies the demonstration.
