id: app-wallet-capabilities-partial-batch-failure
moduleId: app-wallet-capabilities
grain: block
kind: break
title: Half a batch
concepts: [batching-is-not-atomicity, sendcalls-fallback, erc-5792-sendcalls]
spec: >
  Take the flow from the previous exercise and make the second call fail - insufficient allowance, a paused
  contract, whatever is convenient. Run it once against an account that executes the batch atomically and once
  through the sequential fallback. Capture the on-chain state after each. Then write the UI copy for the state
  the sequential run leaves the user in, and add the code that detects it.
acceptance:
  command: pnpm playwright test tests/partial-batch.spec.ts && forge test --match-path test/PartialBatch.t.sol
  criteria:
    - The Foundry test proves the atomic account leaves no trace of the first call after the second fails
    - The Playwright test proves the sequential run leaves the first call applied and the second not
    - The app detects the half-applied state and renders a distinct message naming what did and did not happen
hints:
  - Check the allowance after each run before you look at anything else.
  - The status query reports on the group; you still have to ask what each call did.
  - If your UI has no state for "the approval went through and the deposit did not", that is the finding.
difficulty: 3
