id: defi-amm-math-build-cpmm
moduleId: defi-amm-math
grain: block
kind: implement
title: Build a constant-product AMM whose invariant you can prove
concepts: [constant-product, price-impact, impermanent-loss]
spec: >
  Write a two-token constant-product pool in Solidity with addLiquidity, removeLiquidity and
  swapExactIn. Charge a 30 basis point fee on the input amount before the invariant check. Mint LP
  shares proportional to the contributed value on the first deposit and proportional to the
  existing supply thereafter. Do not use any external library for the swap maths; derive the output
  formula yourself. Then write a Foundry invariant test with a handler that performs random
  deposits, withdrawals and swaps of bounded size, and a ghost accumulator tracking every fee
  charged. The invariant to assert is that reserve0 times reserve1 never decreases across any
  operation that is not a liquidity removal, and that the LP share price is non-decreasing.
acceptance:
  command: forge test --match-path test/ConstantProduct.t.sol -vv
  criteria:
    - An invariant run of at least 256 runs with depth 50 shows k non-decreasing across every swap
    - A unit test reproduces a hand-computed output for a known input, reserves and fee, to the wei
    - A test demonstrates that a swap of 10 percent of reserves pays a materially worse average price than ten swaps of 1 percent
    - A test opens an LP position, moves the price by a factor of four through swaps, closes it, and asserts the withdrawn value is less than simply having held the two original amounts
hints:
  - Write the invariant equation for the swap before you write any Solidity. The fee goes on the input side, so it is the fee-adjusted input that enters the product.
  - Your ghost accumulator should track fees separately from reserves, otherwise you cannot tell a fee-driven k increase from a liquidity-driven one, and your invariant will be vacuous.
  - For the impermanent-loss test, compute the hold-value baseline from the initial amounts marked at the final pool price, not at the initial price. Comparing against the initial value measures price movement, not divergence loss.
difficulty: 2
