id: defi-amm-math-capstone-derive-the-curve
moduleId: defi-amm-math
grain: module
writeUp: >
  A pool quotes you a price and a slippage tolerance box sits next to it. Write down, in your own words, exactly what number you are authorising when you widen that box — and who receives it if the trade fills at your limit rather than at the quote.
coversConcepts:
  - constant-product
  - price-impact
  - slippage-tolerance
  - impermanent-loss
  - stableswap-invariant
  - flash-loan
kind: implement
title: Derive every number a trader and an LP see from one equation
difficulty: 4
concepts: [constant-product, price-impact, slippage-tolerance, impermanent-loss, stableswap-invariant, flash-loan]
spec: >
  Implement a constant-product pool from the invariant up, then use it to produce every figure a
  trader and a liquidity provider experience — each derived rather than looked up.

  THE CURVE. Implement swap, add and remove against the invariant. A test asserts the invariant holds
  or grows across every operation, never shrinks, including with fees.

  PRICE IMPACT. Quote the same trade at four sizes spanning three orders of magnitude, and plot
  execution price against size. Derive the closed form for price impact from the invariant and assert
  your implementation matches it to a stated tolerance. Then answer, with a number: at what fraction of
  the reserves does a trade lose more to impact than to fees?

  SLIPPAGE IS A BUDGET. Set a slippage tolerance and show a trade filling at a worse price than quoted
  but inside tolerance. Then show what a 50% tolerance permits, and state in one sentence what a
  slippage parameter actually is from an attacker's point of view.

  WHAT AN LP LOSES. Compute impermanent loss for a price move you choose, and separate it into the two
  components: divergence from holding, and fees earned. Show the break-even price move at which the
  fees cover the divergence. Then say in one sentence why "impermanent" is the wrong word.

  A FLATTER CURVE. Implement the stableswap invariant and compare it against constant product on the
  same trade near parity and far from it. Show the amplification parameter moving where the curve stops
  behaving like a stablecoin curve, with the number at which it flips.

  THE UNCOLLATERALISED LOAN. Take a flash loan, use it to move your own pool's price, and show the
  quote another contract reads mid-transaction. Then state what that means for anyone treating a pool
  reserve as a price.
acceptance:
  command: forge test --junit --match-path test/capstone/AmmMath.t.sol
  criteria:
    - The invariant is asserted never to shrink across swaps, adds and removes, including with fees
    - Execution price is plotted against trade size over three orders of magnitude
    - A closed-form price-impact derivation is stated and matched by the implementation to a stated tolerance
    - The reserve fraction at which impact exceeds fees is given as a number
    - A trade fills worse than quoted but within tolerance, and what a 50% tolerance permits is shown
    - Impermanent loss is split into divergence and fees, with the break-even price move computed
    - One sentence explains why "impermanent" is the wrong word
    - Stableswap and constant product are compared near and far from parity, with the amplification value where behaviour flips
    - A flash loan moves the pool price and another contract's mid-transaction quote is shown
    - The consequence for treating a reserve as a price is stated
hints:
  - Derive the price-impact formula on paper before implementing it. If you only have the implementation you cannot tell a bug from a rounding difference, and the tolerance assertion is what makes the derivation worth having.
  - For impermanent loss, hold the comparison portfolio explicitly in the test. The formula is easy to get subtly wrong and a side-by-side simulation is not.
  - The flash-loan demonstration is the one that transfers. Every oracle-manipulation exploit you will read about later is this test with a bigger loan.
