id: defi-concentrated-liquidity-position-amounts
moduleId: defi-concentrated-liquidity
grain: module
writeUp: >
  You provided liquidity in a narrow range and the price walked out of it. Describe the position's composition before, during and after, in terms of the virtual reserves — and say what you were paid for accepting that outcome.
coversConcepts:
  - virtual-reserves
  - tick
  - sqrt-price-x96
  - liquidity-l
  - v3-is-v2-piecewise
kind: implement
title: Compute a concentrated-liquidity position's token amounts and match a live pool
concepts: [virtual-reserves, tick, sqrt-price-x96, liquidity-l]
spec: >
  Implement, in Solidity, a pure function that takes a lower tick, an upper tick, a current
  sqrtPriceX96 and a liquidity L, and returns the amounts of token0 and token1 the position holds.
  Handle all three cases: current price below the range, inside it, and above it. Do the tick to
  sqrtPrice conversion yourself rather than calling a library, and reproduce the protocol's rounding
  direction. Then, on a mainnet fork, pick a real Uniswap v3 position, read its ticks and liquidity
  from the position manager and the pool's slot0, and compare your computed amounts against the
  amounts the protocol itself reports for that position.
acceptance:
  command: forge test --match-path test/PositionAmounts.t.sol --fork-url $ETH_RPC_URL -vv
  criteria:
    - Your computed token0 and token1 for a live position match the protocol's own figures to within one wei per token
    - Unit tests cover price below range (all token0), above range (all token1) and inside the range
    - A test asserts your tick-to-sqrtPrice conversion matches the protocol's for at least ten ticks spread across the usable range, including negative ticks
hints:
  - Start from the two amount formulas in terms of L and square roots of price, then substitute the boundary square roots for the out-of-range cases. Out of range, one of the two terms collapses.
  - Ticks can be negative and the exponent is fractional in real terms but exact in fixed point. Compare your conversion against the protocol's for negative ticks specifically — that is where naive implementations break.
  - When your answer is off by a few wei, you have the maths right and the rounding wrong. Find which direction the protocol rounds each amount and match it, rather than adjusting your formula.
difficulty: 4
