id: defi-concentrated-liquidity-v3-is-v2-piecewise
moduleId: defi-concentrated-liquidity
grain: block
kind: measure
title: Rebuild a concentrated pool as a stack of constant-product curves
difficulty: 3
concepts: [v3-is-v2-piecewise]
spec: >
  Concentrated liquidity is not a new market maker. Demonstrate that by rebuilding one out of the old one.

  Take a real concentrated-liquidity pool and read its current liquidity and its active range. Then
  implement a plain constant-product pool parameterised so that, within that range, it quotes the same
  prices. Compare quotes across ten trade sizes inside the range and report the difference — it should be
  at rounding level, and if it is not, find out why.

  Then cross a boundary. Take a trade large enough to exhaust the active range and show your single-curve
  model diverging from the real pool. Report where the divergence begins, and then extend your model to a
  piecewise one: two curves with a switch at the boundary. Show the divergence disappear.

  Finally state the claim precisely, in one paragraph: what is identical between the two designs and what
  is genuinely new. The new part is not the pricing.
acceptance:
  command: forge test --junit --match-path test/V3Piecewise.t.sol
  criteria:
    - A real pool's current liquidity and active range are read
    - A single constant-product curve is parameterised to match it within that range
    - Quotes are compared across ten trade sizes inside the range with the difference reported at rounding level
    - A trade exhausting the active range shows the single-curve model diverging, with the divergence point reported
    - A piecewise model with a boundary switch removes the divergence
    - One paragraph states what is identical between the designs and what is genuinely new
hints:
  - Match inside the range before attempting the boundary. If your single curve does not agree there, the parameterisation is wrong and the boundary work will be uninterpretable.
  - The divergence point should be exactly the range edge. If it is not, you have the tick-to-price conversion slightly off, which is the usual bug here.
  - The genuinely new part is capital efficiency and the position bookkeeping it requires, not the curve. Say that.
