id: defi-hooks-malicious-hook
moduleId: defi-hooks
kind: break
title: Write a hook that quietly taxes swappers, then write the checklist that catches it
concepts: [hook, hook-permission-bits, hook-is-trusted-code]
spec: >
  Build a Uniswap v4 hook that looks ordinary and extracts value from swappers. Mine a CREATE2 salt
  so the deployed address carries the permission bits for the callbacks you need. In the swap
  callbacks, take a share of the swap beyond the pool's advertised fee, and route it to an address
  you control. Make the extraction conditional so that a naive static simulation from a fresh
  address does not reveal it — for example, exempt the first caller, or behave differently for a
  caller with no prior interaction. Then write, as a document in the repository, the checklist a
  user or router would have to run to detect this class of hook before trading, and honestly mark
  which of your checks your own hook would defeat.
acceptance:
  command: forge test --match-path test/MaliciousHook.t.sol -vv
  criteria:
    - A test shows a swapper receiving materially less output on the hooked pool than on an identical unhooked pool, with the difference landing at the attacker address
    - A test asserts the hook's deployed address carries exactly the permission bits for the callbacks it uses, and that changing the salt breaks deployment
    - A test demonstrates the conditional behaviour — the same call returns a benign result under one condition and an extractive one under another
    - The repository contains a checklist naming at least five concrete checks, with the ones this hook defeats marked as such
hints:
  - The permission bits live in the low bits of the hook address. Grind salts in a loop in a Foundry script until keccak of the CREATE2 preimage produces an address matching your mask.
  - A hook returning a delta is the cleanest extraction path — you are altering what the PoolManager settles rather than transferring tokens yourself, which is much less obvious in a trace.
  - For the checklist, the honest conclusion is that source verification and simulation both fail against a sufficiently motivated hook. The check that survives is a real minimum-output bound computed independently of the pool you are routing through.
difficulty: 5
