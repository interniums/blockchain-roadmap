id: defi-hooks-owing-the-pool
moduleId: defi-hooks
grain: block
kind: implement
title: Owe the pool instead of paying it, and create a pool without deploying one
difficulty: 3
concepts: [singleton-poolmanager, v4-flash-accounting]
spec: >
  Two structural changes that alter what integrating with a pool means.

  NO DEPLOYMENT. Create a new pool and show that nothing was deployed: report the address you interact
  with, before and after, and show it unchanged. Then state what that does to two things — the gas cost of
  creating a pool, and the way you would index pools in a product. Report the creation cost, and say what
  an indexer keyed on contract addresses would now miss.

  OWE, DO NOT PAY. Implement a sequence that takes tokens out, does something, and settles at the end
  rather than paying per step. Show the intermediate state: a point at which you hold tokens you have not
  paid for, with the accounting recording a debt. Then fail to settle and show what happens.

  Then use it for something that was previously impossible or expensive: chain two swaps and a liquidity
  operation with a single net settlement, and compare the token transfer count against the same sequence
  done pay-as-you-go. Report both counts and the gas difference.

  Close with the risk this introduces: state what an integrator must now check that it did not have to
  before, given that the balance changes it observes mid-sequence do not mean what they used to.
acceptance:
  command: forge test --junit --match-path test/Hooks.t.sol
  criteria:
    - A new pool is created with the interaction address shown unchanged before and after
    - Pool creation cost is reported
    - What an address-keyed indexer would miss is stated
    - A sequence holds tokens it has not paid for, with the debt visible in the accounting
    - Failing to settle is shown with its outcome
    - Two swaps and a liquidity operation are chained with one net settlement
    - Transfer counts and gas are compared against the pay-as-you-go equivalent
    - What an integrator must now check, given mid-sequence balances have changed meaning, is stated
hints:
  - Report the interaction address explicitly even though it feels trivial. It is the fact that breaks most existing tooling assumptions and it is easy to state and easy to overlook.
  - The unsettled-debt failure is the safety property of the whole design. Trigger it deliberately and read the error.
  - For the integrator warning, think about a contract that reads its own token balance mid-sequence. That is the code that silently breaks.
