id: defi-lending-kinked-rate-model
moduleId: defi-lending
grain: block
kind: implement
title: Build the kinked rate model and prove suppliers never earn the borrow rate
concepts: [lend-utilisation, lend-rate-kink, lend-supply-rate-derivation]
spec: >
  Implement a KinkedRateModel contract with configurable base rate, slope1, slope2, optimal
  utilisation and reserve factor, exposing borrowRate(U) and supplyRate(U). Use ray or wad fixed
  point throughout and document your unit convention at the top of the file. Then write a Foundry
  fuzz suite that establishes the model's properties rather than spot-checking values: monotonicity
  of the borrow rate in utilisation, continuity at the kink, and the relationship between supply and
  borrow rates. Finally add a test that instantiates the parameters of a real Aave v3 reserve and
  reproduces its published borrow and supply rates at that reserve's current utilisation.
acceptance:
  command: forge test --match-path test/KinkedRateModel.t.sol -vv
  criteria:
    - A fuzz test over U in [0, 1e18] and reserveFactor in [0, 1e4] proves supplyRate is always less than or equal to borrowRate
    - A fuzz test proves borrowRate is monotonically non-decreasing in U
    - A test proves the function is continuous at the kink, with the left and right limits differing by at most one unit of last place
    - A test using a real reserve's parameters reproduces its published borrow and supply APY to within one basis point
hints:
  - Decide wad versus ray before writing a line and put the convention in a comment. Most bugs in this exercise are a factor of 1e9.
  - Continuity at the kink is the test that catches an off-by-one in your excess-utilisation denominator. Evaluate at U_opt minus one and U_opt plus one, not at U_opt itself.
  - When the real-reserve test is close but wrong, check whether the published figure is an APR or a compounded APY, and whether the reserve factor is expressed in basis points or in ray.
difficulty: 3
