id: defi-lending-one-kind-of-loan
moduleId: defi-lending
grain: block
kind: write
title: Explain why a permissionless lender can only make one kind of loan
difficulty: 2
concepts: [lend-overcollateralisation]
spec: >
  Every on-chain lending pool makes overcollateralised loans, and the reason is not conservatism. Establish
  it from first principles and then test the reasoning against the exceptions.

  THE ARGUMENT. Write it out: what does a lender need in order to make an undercollateralised loan, and
  which of those things is unavailable to a contract that does not know who you are? Be specific — there
  are at least three requirements and the interesting one is not identity.

  THE NUMBERS. For one live pool, read the actual collateral factors for three assets and explain the
  ordering. Then compute, for one of them, the price move that would leave a position underwater, and the
  price move that triggers liquidation. The gap between those two numbers is what the collateral factor
  buys, and stating it in percent is the exercise.

  THE EXCEPTIONS. Find two designs that appear to lend undercollateralised — a flash loan, and one other.
  For each, say what replaced the collateral. A flash loan is the clean case: name the mechanism that makes
  it safe with no collateral at all, and then state why that mechanism cannot extend beyond one
  transaction.

  Close with the sentence a product person needs: what would have to change about the chain, not about the
  protocol, for undercollateralised lending to be possible permissionlessly.
acceptance:
  criteria:
    - At least three requirements for undercollateralised lending are named, with which are unavailable to an anonymous lender
    - Collateral factors for three assets in a live pool are read with the ordering explained
    - The price move to underwater and the price move to liquidation are both computed for one asset, with the gap stated in percent
    - A flash loan is analysed with the mechanism that makes zero collateral safe named
    - Why that mechanism cannot extend beyond one transaction is stated
    - A second apparent exception is analysed with what replaced the collateral
    - One sentence states what would have to change about the chain for permissionless undercollateralised lending
hints:
  - The requirement people miss is not identity, it is recourse. A lender needs something to do when you do not pay, and a contract has no court.
  - Compute both price moves rather than one. The gap between liquidation and insolvency is the whole design and it is invisible if you only calculate one of them.
  - Atomicity is the flash loan's collateral. Saying it that way makes the one-transaction limit obvious rather than arbitrary.
