id: defi-lending-shared-oracle-breaks-isolation
moduleId: defi-lending
grain: module
writeUp: >
  Pick a live lending market and write down, before checking, which single parameter change would most reduce the protocol's worst-case loss from that market. Then check what the parameter actually is, and say what the DAO gave up to keep it where it is.
coversConcepts:
  - lend-overcollateralisation
  - lend-ltv-vs-liquidation-threshold
  - lend-health-factor
  - lend-emode
  - lend-correlation-break
  - lend-utilisation
  - lend-rate-kink
  - lend-supply-rate-derivation
  - lend-index-accounting
  - lend-caps-and-ceilings
  - lend-isolated-vs-pooled
  - lend-curated-vaults
  - lend-bad-debt
  - lend-bad-debt-is-a-bank-run
  - lend-backstop
kind: break
title: Prove that two isolated markets sharing an input are not isolated
concepts: [lend-isolated-vs-pooled, lend-bad-debt, lend-caps-and-ceilings]
spec: >
  Build a minimal isolated lending market: one collateral token, one loan token, a pluggable oracle,
  a fixed liquidation LTV, and a liquidate function that repays debt and seizes collateral at an
  incentive. Deploy two instances that share the same collateral token but read different oracles,
  one of which lags or can be moved. Write a test showing an attacker profitably borrowing against
  the market with the more favourable oracle and leaving that market with bad debt, while the other
  market's suppliers are untouched in accounting terms and yet exposed through the shared collateral
  they hold. Then add a supply cap to the affected market and measure exactly how much the loss is
  reduced.
acceptance:
  command: forge test --match-path test/IsolationBreak.t.sol -vv
  criteria:
    - A test drives one market's oracle until a position is under water past the incentive and asserts a rational liquidator declines, leaving quantified bad debt
    - A test asserts the loss lands only on the affected market's suppliers, demonstrating accounting isolation
    - A second test shows an attacker exploiting the divergence between the two markets' oracles for net profit
    - Adding a supply cap reduces the realised loss, and the test asserts the new loss equals the cap times the price gap rather than merely being smaller
hints:
  - Model the liquidator explicitly as a contract that computes profit and reverts when negative. If your test just calls liquidate directly, you have assumed away the entire failure mode.
  - The interesting bad debt is not the position going under water; it is the position going under water past the incentive so that no rational actor will finish it.
  - For the cap test, assert an exact expected loss derived from the cap and the price gap. A test that only asserts the loss got smaller passes even when the cap is wired up wrong.
difficulty: 4
