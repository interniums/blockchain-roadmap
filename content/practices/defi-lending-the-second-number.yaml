id: defi-lending-the-second-number
moduleId: defi-lending
grain: block
kind: measure
title: Find the number your dashboard is not showing, then break a correlation
difficulty: 3
concepts: [lend-ltv-vs-liquidation-threshold, lend-health-factor, lend-emode, lend-correlation-break]
spec: >
  A borrower sees one ratio. Two govern their position, and the gap between them is the only warning they get.

  TWO RATIOS. For one live market and one asset, read both: the maximum you may borrow against collateral, and
  the level at which you are liquidated. State both, and the gap in percent. Then compute what price move takes
  a position from freshly opened at maximum to liquidated. That number is the borrower's entire margin of
  safety, and most interfaces do not show it.

  ONE NUMBER INSTEAD. Compute the health factor for three positions — one comfortable, one marginal, one about
  to close — and show how it moves with a price change. Then find its weakness: construct two positions with
  the same health factor and very different actual risk, and say what the single number is hiding. Collateral
  liquidity is the usual answer; establish it rather than asserting it.

  THE CORRELATION BET. Then the mode that lets you borrow far more against assets assumed to move together.
  Read its parameters from a live market and report the leverage it permits against the standard mode.

  Then break it. Take a real historical moment when two supposedly correlated assets diverged — a staked
  derivative against its underlying, or two stablecoins — and compute what a maximum-leverage position in that
  mode would have experienced. Report the divergence in percent, whether it exceeded the safety gap, and what
  the position was worth afterwards. Close with the sentence a borrower needs: the mode is a bet on a
  correlation, and it is priced as if the correlation cannot break.
acceptance:
  criteria:
    - Maximum borrow ratio and liquidation threshold are both read for a live market with the gap in percent
    - The price move from freshly opened at maximum to liquidated is computed
    - Health factor is computed for three positions and shown moving with price
    - Two positions with equal health factor and different real risk are constructed, with what the number hides established rather than asserted
    - The correlated-asset mode's parameters are read from a live market with the leverage it permits against standard mode
    - A real historical divergence is used to compute the outcome for a maximum-leverage position
    - The divergence percentage, whether it exceeded the safety gap, and the resulting position value are reported
hints:
  - Compute the price-move-to-liquidation number first. It is one line of arithmetic and it reframes every other figure in the exercise.
  - For the equal-health-factor pair, vary collateral depth rather than size. Two positions can look identical and liquidate at wildly different effective prices.
  - Use a real divergence, not a hypothetical one. The historical numbers are more alarming than anything you would invent, which is the point.
