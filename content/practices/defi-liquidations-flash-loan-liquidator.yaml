id: defi-liquidations-flash-loan-liquidator
moduleId: defi-liquidations
kind: implement
title: Build a capital-free liquidator, then make it unprofitable
concepts: [liq-flash-loan-liquidator, liq-incentive, liq-gas-price-coupling, flash-loan]
spec: >
  On a mainnet fork, write a liquidator contract that in a single transaction flash-borrows the debt
  asset, calls a lending protocol's liquidation function on an eligible position, receives the
  discounted collateral, swaps it back to the debt asset on a DEX, repays the flash loan with its
  fee, and keeps the remainder. Drive a real position under water by manipulating the fork's oracle
  answer rather than waiting for one. Then re-run the same liquidation with progressively worse exit
  execution and with progressively higher gas prices, and record the point at which the trade turns
  negative for a given position size.
acceptance:
  command: forge test --match-path test/FlashLiquidator.t.sol --fork-url $ETH_RPC_URL -vv
  criteria:
    - The successful test ends with a strictly positive balance of the debt asset at the liquidator and the borrower's health factor restored above one
    - Re-running with roughly three percent of injected exit slippage makes the same liquidation net-negative, and the test asserts the revert or the loss
    - A sweep over position size at fixed gas and incentive reports the minimum profitable position size
    - The test suite reports the dust threshold below which no liquidation of that position is profitable
hints:
  - Move the oracle rather than the market. Overriding the feed's stored answer on the fork is a single cheatcode and avoids you needing to move a deep pool.
  - Make the profit assertion on the contract's balance delta over the whole transaction, not on an intermediate value. The flash loan fee and the swap fee are both easy to leave out of the arithmetic.
  - For the slippage sweep, inject the slippage in the swap route rather than reducing the incentive. The lesson is that the incentive is a slippage budget, and that only shows if slippage is the variable.
difficulty: 5
