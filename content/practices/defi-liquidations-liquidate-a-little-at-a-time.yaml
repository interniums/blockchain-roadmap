id: defi-liquidations-liquidate-a-little-at-a-time
moduleId: defi-liquidations
grain: block
kind: measure
title: Hold a position through a soft liquidation and measure what smoothness cost
difficulty: 4
concepts: [llamma-bands, llamma-soft-liquidation, llamma-a-parameter, llamma-soft-liquidation-loss]
spec: >
  Soft liquidation replaces a cliff with a slope. The slope is not free, and this exercise is to measure
  the bill.

  THE BANDS. Implement or model the banded mechanism: collateral distributed across price bands, converted
  gradually as the price moves through them. Take one position and one price path down and back up, and
  report the state after each band crossing — how much collateral was converted, at what price, and what
  the position holds at the end.

  THE ROUND TRIP. Now the finding: the price returns to where it started and the position does not. Report
  the loss as a percentage of the original position, and account for where it went — who received it.

  THE DIAL. Sweep the amplification parameter. For at least four values, report the maximum leverage it
  permits and the round-trip loss under the same price path. Plot both against the parameter. State the
  trade in one sentence, with numbers in it.

  Then find the regime where the mechanism is worse than a hard liquidation: a price path under which a
  borrower would have preferred to be liquidated once. Describe the path and report both outcomes.

  Close with the parameter value you would choose for a lender, and the price behaviour you are assuming
  when you choose it.
acceptance:
  command: forge test --junit --match-path test/SoftLiquidation.t.sol
  criteria:
    - A banded mechanism is implemented or modelled with collateral distributed across price bands
    - State after each band crossing is reported with amount converted and price
    - A round-trip price path is shown leaving the position worse off, with the loss as a percentage and the recipient identified
    - The amplification parameter is swept over at least four values with maximum leverage and round-trip loss reported for each
    - Both are plotted against the parameter with a one-sentence trade statement containing numbers
    - A price path is found under which hard liquidation would have been preferable, with both outcomes reported
    - A parameter choice is made with the assumed price behaviour stated
hints:
  - Use a price path that oscillates rather than one that falls and recovers once. The loss compounds with crossings and a single round trip understates it.
  - Account for where the loss went. It is not burned, and identifying the recipient turns an abstract cost into a transfer you can reason about.
  - The regime where hard liquidation wins is a sharp single drop followed by a full recovery. Construct it deliberately.
