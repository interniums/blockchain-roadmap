id: defi-liquidations-rate-oracle-hard-liquidation
moduleId: defi-liquidations
kind: break
title: Turn a vault exchange rate into a weapon, then blunt it
concepts: [llamma-oracle-coupling, orac-lp-token-and-rate-oracles, liq-bad-debt-threshold]
spec: >
  Reproduce the shape of the March 2026 LlamaLend sDOLA incident locally. Build an ERC-4626-style
  savings vault whose share-to-asset conversion rate is used directly as a lending oracle by a
  minimal borrow market. Give the vault an unpermissioned entry point — a stake or a direct
  donation of assets — that any caller may use and that moves the conversion rate within a single
  transaction. Then write a test that makes a healthy borrower hard-liquidatable inside one block
  using only unpermissioned calls, and quantify the attacker's profit against their cost. Finally
  implement a defence — a rate-limited or checkpointed exchange rate that can move only a bounded
  amount per unit time — and show the same attack test now fails.
acceptance:
  command: forge test --match-path test/RateOracleAttack.t.sol -vv
  criteria:
    - A test moves the vault's conversion rate in one transaction using only calls any address may make
    - The same test asserts a previously healthy position becomes hard-liquidatable in that block and reports the attacker's net profit
    - After swapping in the rate-limited oracle, the attack test fails and a separate test asserts the exact bound the limiter enforces
    - A test demonstrates the cost of the defence — a genuine large rate move is reported late by the limiter, and the test quantifies the lag
hints:
  - The attacker profits from being the liquidator, not from the rate move itself. Wire the liquidation into the same transaction or the profit will not appear.
  - A direct token transfer into the vault is usually enough; you do not need a privileged function. That is exactly the point of the exercise.
  - The defence test that matters is the fourth one. A limiter that only ever passes the attack test has not been shown to cost anything, and every real limiter costs accuracy during a genuine move.
difficulty: 4
