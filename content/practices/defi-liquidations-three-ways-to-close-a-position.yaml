id: defi-liquidations-three-ways-to-close-a-position
moduleId: defi-liquidations
grain: block
kind: implement
title: Close the same bad position three ways, and price each for the borrower
difficulty: 3
concepts: [liq-close-factor, liq-fixed-discount, liq-dutch-auction, liq-cascade, liq-cascade-cross-venue]
spec: >
  A liquidation is a forced sale, and the mechanism decides who absorbs the loss. Implement three and
  compare from the borrower's side rather than the liquidator's.

  THREE MECHANISMS. Build the same underwater position and close it three ways: a fixed discount with a
  close factor, a full close at a fixed discount, and a descending-price auction. For each report what the
  borrower lost, what the liquidator gained, and what the protocol was left holding.

  The close factor is the interesting parameter. Sweep it and plot borrower loss against it. Find the value
  at which partial liquidation stops helping the borrower, and say what is happening at that point.

  THE AUCTION. For the descending-price version, report the time to clear and the clearing discount. Then
  make it fail: reduce liquidator competition and show the price falling further than the fixed-discount
  case would have. State the condition under which each mechanism is the better one for the borrower —
  they are different conditions, and naming both is the exercise.

  THE CASCADE. Now make one liquidation cause another. Build two positions sharing a collateral asset, and
  show the first liquidation's price impact pushing the second underwater. Report the size at which it
  triggers. Then extend it across two venues: show a liquidation on one venue moving a price that a second
  venue reads, and state what that means for anyone modelling liquidation risk on a single protocol.
acceptance:
  command: forge test --junit --match-path test/Liquidations.t.sol
  criteria:
    - The same underwater position is closed by fixed discount with a close factor, full fixed discount, and descending-price auction
    - Borrower loss, liquidator gain and protocol residual are reported for all three
    - Close factor is swept with borrower loss plotted, and the value where partial liquidation stops helping identified
    - Auction clear time and clearing discount are reported
    - Reduced liquidator competition is shown driving the auction price below the fixed-discount outcome
    - The condition favouring each mechanism for the borrower is stated, and they differ
    - One liquidation's price impact is shown pushing a second position underwater, with the triggering size reported
    - A cross-venue cascade is demonstrated with the consequence for single-protocol risk models stated
hints:
  - Report from the borrower's side throughout. Liquidation material is almost always written from the liquidator's, and the mechanism comparison comes out differently when you switch.
  - The close-factor sweep has a point where repeated partial liquidations cost more than one full one, because each carries the discount. Find it rather than assuming smaller is kinder.
  - For the cascade, make the shared collateral illiquid enough that the first sale moves the price. If the pool is deep the cascade will not trigger and you will conclude wrongly.
