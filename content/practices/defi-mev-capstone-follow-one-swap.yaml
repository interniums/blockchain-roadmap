id: defi-mev-capstone-follow-one-swap
moduleId: defi-mev
grain: module
writeUp: >
  Draw the path your last on-chain swap actually took, from wallet to proposer, and mark at each hop who could see it and who could reorder it. Then say which single change to that path would most reduce what you paid, and what you would be trusting instead.
coversConcepts:
  - mev-definition
  - mev-searcher
  - mev-atomic-arbitrage
  - mev-arbitrage-is-lvr
  - mev-sandwich
  - mev-slippage-is-the-attack-surface
  - mev-liquidation
  - mev-toxic-vs-benign
  - mev-pbs
  - mev-builder
  - mev-relay-trust
  - mev-private-orderflow
  - mev-orderflow-auction
  - mev-intent
  - mev-solver-competition
  - mev-cow
  - mev-encrypted-mempool
  - mev-tee-block-building
  - mev-oev
  - mev-l2-sequencer
kind: measure
title: Follow one swap from wallet to block, and price every hop that could reorder it
difficulty: 4
concepts: [mev-definition, mev-searcher, mev-atomic-arbitrage, mev-arbitrage-is-lvr, mev-sandwich, mev-slippage-is-the-attack-surface, mev-liquidation, mev-toxic-vs-benign, mev-pbs, mev-builder, mev-relay-trust, mev-private-orderflow, mev-orderflow-auction, mev-intent, mev-encrypted-mempool, mev-oev, mev-l2-sequencer]
spec: >
  Take one real swap that was sandwiched on mainnet. Reconstruct the whole supply chain around it, and
  price every mitigation against it.

  THE ATTACK, RECONSTRUCTED. Fork before the bundle. Reproduce the sandwich: front-run, victim, back-run.
  Compute the attacker's profit and the victim's loss, and show they are not the same number — say where
  the difference went.

  THE BUDGET. Show the victim's slippage tolerance was the attacker's budget: sweep the tolerance and plot
  attacker profit against it. Find the tolerance at which the attack stops being worth it, and state what
  that tolerance would have cost the victim in failed transactions instead.

  THE TAXONOMY, APPLIED. Classify four extractions from the same block — including one atomic arbitrage
  and one liquidation — as requiring a specific user to be worse off, or as capture of a public
  inconsistency. Then take the arbitrage and argue it is loss-versus-rebalancing borne by liquidity
  providers rather than a victimless correction. Name who paid.

  THE SUPPLY CHAIN. For the block your swap landed in, name every hop from wallet to proposer and state,
  per hop, who could see the transaction and who could reorder it. Identify the relay and say what
  trusting it means concretely.

  FOUR MITIGATIONS, PRICED. Private order flow, an intent with solver competition, an encrypted mempool,
  and an oracle-position auction. For each: what it prevents, what it moves rather than prevents, who is
  now trusted instead, and the latency or fee cost. The write-up must say which one you would actually
  ship and what you are accepting.

  THE L2 CASE. Finally, take the same swap on an L2 and say why the analysis collapses to one party, and
  what that means for a user who assumed the mitigations above apply.
acceptance:
  command: forge test --junit --match-path test/capstone/Mev.t.sol
  criteria:
    - A real sandwich is reproduced on a fork with front-run, victim and back-run transactions
    - Attacker profit and victim loss are computed separately, with the difference accounted for
    - Slippage tolerance is swept against attacker profit, with the break-even tolerance and its cost in failed transactions stated
    - Four extractions from one block are classified as user-harming or public-inconsistency capture
    - The atomic arbitrage is argued as loss-versus-rebalancing with the paying party named
    - Every supply-chain hop is named with who can see and who can reorder at each
    - The relay is identified and what trusting it means is stated concretely
    - Four mitigations each have what they prevent, what they merely move, who becomes trusted, and a latency or fee cost
    - A shipping recommendation states what is being accepted
    - The L2 analysis explains the collapse to one party and its consequence for the user
hints:
  - Pick the sandwich from a public MEV dataset so you can check your reconstruction against someone else's numbers before you trust your own.
  - Attacker profit and victim loss differ because of fees paid to the builder and the proposer. Following that gap is how the supply chain stops being abstract.
  - For the mitigations, the useful column is "what it moves rather than prevents". Every one of the four relocates the extraction, and naming where is the finding.
