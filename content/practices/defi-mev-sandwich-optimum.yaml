id: defi-mev-sandwich-optimum
moduleId: defi-mev
grain: block
kind: measure
title: Find the optimal sandwich and the tolerance that kills it
concepts: [mev-sandwich, mev-slippage-is-the-attack-surface, slippage-tolerance, price-impact]
spec: >
  Build a sandwich simulator against a constant-product pool. Given reserves, fee, a victim swap
  size and the victim's minimum-output bound, compute the attacker's profit as a function of
  frontrun size, find the optimum, and identify the frontrun size at which the victim's transaction
  would revert. Then sweep the victim's slippage tolerance from tight to wide and plot attacker
  profit against it. Report the tolerance at which sandwiching stops being profitable for a given
  victim size, and separately report what happens as the victim's own price impact approaches the
  tolerance.
acceptance:
  command: forge test --match-path test/SandwichOptimum.t.sol -vv
  criteria:
    - A test asserts the computed optimal frontrun size is a genuine maximum by checking profit is lower on both sides of it
    - A test asserts attacker profit goes to zero as the victim's slippage tolerance approaches the victim's own price impact
    - A test asserts that at the optimum the victim's realised output is above their stated minimum, so the bundle does not revert
    - A sweep reports the profit curve over at least ten tolerance values, and gas cost is included so the profitability threshold is a real number
hints:
  - The binding constraint is the victim's minimum output, not the pool. The attacker pushes exactly to the edge of what still lets the victim's transaction succeed.
  - Include gas in the profit function from the start. Without it the optimum exists at arbitrarily small victim sizes and the exercise teaches nothing about when sandwiching is actually worth doing.
  - When you sweep tolerance, hold victim size fixed. Sweeping both at once hides the fact that the tolerance is the attacker's budget.
difficulty: 3
