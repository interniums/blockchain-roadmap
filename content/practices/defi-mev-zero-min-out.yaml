id: defi-mev-zero-min-out
moduleId: defi-mev
grain: block
kind: break
title: Drain a router that accepts a zero minimum output, then fix it
concepts:
- mev-sandwich
- mev-slippage-is-the-attack-surface
- slippage-tolerance
spec: 'Deploy a naive DEX router that forwards a user''s swap with amountOutMin set to zero and no deadline.
  Write a Foundry test that sandwiches a user of that router and takes an arbitrarily large share of their
  trade — parameterise the attack so the test can assert that increasing the attacker''s capital increases
  the extraction without bound up to the pool''s depth. Then write a fixed router that computes a minimum
  output from a price obtained independently of the pool it is about to trade against, and enforces a
  deadline. Show the same attack against the fixed router is unprofitable, and state precisely what the
  fixed router now trusts that the broken one did not.

  '
acceptance:
  command: forge test --match-path test/AmountOutMinZero.t.sol -vv
  criteria:
  - A test sandwiches the naive router and asserts the victim receives less than a stated fraction of
    the fair-price output
  - A parameterised test shows extraction rising with attacker capital, demonstrating the absence of any
    bound
  - The same attack against the fixed router either reverts or leaves the attacker net-negative after
    gas
  - A test asserts the fixed router reverts on a stale deadline, and the repository states in one sentence
    what the minimum-output source is now trusted to provide
hints:
- The reference price must not come from the pool being traded against, or you have written a very expensive
  way of reading the same manipulable number.
- Assert on the victim's realised output, not on the attacker's profit. It is the victim's loss that the
  zero bound authorises.
- 'The final sentence is the graded part: the fix does not remove trust, it moves it to whatever supplies
  the reference price, and that thing has its own failure modes.'
difficulty: 3
