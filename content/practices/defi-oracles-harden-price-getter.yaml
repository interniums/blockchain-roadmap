id: defi-oracles-harden-price-getter
moduleId: defi-oracles
grain: block
kind: fix
title: Harden a naive getPrice until every failure mode has a test
concepts: [orac-staleness-check, orac-sanity-bounds, orac-deviation-and-heartbeat]
spec: >
  Start from a getPrice function that returns latestRoundData().answer and nothing else. Harden it
  so that it reverts with a distinct custom error on each of the following: an updatedAt older than
  a configured maximum age, a non-positive answer, an answer at or beyond the aggregator's reported
  minimum or maximum, a feed call that itself reverts, and a divergence beyond a configured basis
  point bound from an independent secondary source. Write one unit test per failure mode using a
  mock aggregator you control, and one fork test against a live feed that asserts the happy path
  still returns a sane value. Document, in a comment, the maximum age you chose and why it is
  larger than that feed's published heartbeat.
acceptance:
  command: forge test --match-path test/HardenedOracle.t.sol -vv
  criteria:
    - Five unit tests, each triggering exactly one failure mode and asserting its specific custom error
    - A fork test against a live feed returns a value within a sane band and does not revert
    - The chosen maxAge is documented and is strictly greater than the feed's published heartbeat, with the reasoning stated
    - A test asserts the divergence check fires in both directions, not only when the primary is high
hints:
  - Build a mock aggregator you can drive into every state, including reverting. You cannot test the revert path against a live feed.
  - The min and max answer bounds are real values on the aggregator, not folklore. Read them rather than hard-coding a plausible range.
  - Choosing maxAge below the heartbeat makes your protocol unusable on a quiet day. The reasoning in your comment is the graded part of this exercise.
difficulty: 2
