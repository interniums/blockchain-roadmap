id: defi-oracles-the-consumer-is-liable
moduleId: defi-oracles
grain: block
kind: implement
title: Verify a pulled price yourself, and act on its confidence interval
difficulty: 3
concepts: [orac-pull-model, orac-pull-verification, orac-confidence-interval]
spec: >
  In a pull model nobody pushes a price on chain for you. You fetch it, you pay for it, and you are
  responsible for checking it — which means the failure modes are yours.

  FETCH AND VERIFY. Retrieve a signed price off chain and verify it on chain yourself: signature, publisher
  identity, and the age of the observation. Report the gas. Then break each check in turn — wrong signer,
  stale timestamp, tampered price — and show each rejected with a distinct error. Three checks, three
  failures, three errors.

  THE STALENESS DECISION. There is no correct maximum age, only a choice. State yours for two different
  uses — a liquidation and a display — and defend both. Then show what happens at the boundary: submit a
  price exactly at your threshold and one just past it.

  THE INTERVAL. The feed reports uncertainty as well as a price, and most integrations ignore it. Read it,
  and then build a contract that actually uses it: refuse to act when the interval is too wide relative to
  the position at risk. Demonstrate a refusal, and report a real moment when the interval widened enough to
  trigger it — or, if you cannot find one, state what conditions would produce it.

  Close with the liability sentence: name every failure in this exercise that a push model would have made
  somebody else's problem, and say whether you would still choose pull.
acceptance:
  command: forge test --junit --match-path test/PullOracle.t.sol
  criteria:
    - A signed price is fetched off chain and verified on chain for signature, publisher and observation age, with the gas reported
    - Wrong signer, stale timestamp and tampered price are each rejected with a distinct error
    - A maximum age is chosen and defended for a liquidation and for a display use
    - Prices exactly at and just past the threshold are both submitted with the outcomes shown
    - The confidence interval is read and used to refuse action when too wide relative to the position
    - A refusal is demonstrated, with a real widening moment reported or the conditions that would produce one stated
    - Every failure in the exercise that a push model would have made someone else's problem is named, with a pull-versus-push verdict
hints:
  - Verify the publisher identity separately from the signature. A valid signature from an unexpected signer is the failure that gets skipped, and it is the one that matters.
  - Choose the two staleness thresholds before implementing either. If you pick one number for both uses you have not done the exercise.
  - The confidence interval is the part almost nobody integrates. Using it is what makes this exercise worth more than a signature-verification tutorial.
