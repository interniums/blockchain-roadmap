id: defi-oracles-there-is-no-price
moduleId: defi-oracles
grain: block
kind: break
title: Read a price four ways, and drain the contract that read it wrong
difficulty: 3
concepts: [orac-price-feed, orac-spot-price-is-not-an-oracle, orac-lp-token-and-rate-oracles, orac-oev]
spec: >
  There is no price on a blockchain, only reports about prices. Get four of them and show what happens when
  you trust the wrong one.

  FOUR SOURCES. For one asset, obtain a price from: a push feed, a pool's spot reserves, a time-weighted
  pool average, and one off-chain reference. Report all four at the same block and the spread between them.
  State which you would use and for what — the answer differs by use, and giving one answer is wrong.

  THE DRAIN. Build a contract that reads a pool's spot price and lends against it. Take a flash loan, move
  the pool, borrow against the moved price, and repay. Report the profit. Then fix it and show the same
  attack failing — and state what your fix costs in responsiveness, because every fix here trades freshness
  for robustness.

  THE ACCIDENTAL ORACLE. Find a protocol function that is not called an oracle and is one: an LP token
  valuation or an exchange-rate getter that another contract reads as truth. Show that manipulating it
  moves a number a third party depends on. Name what makes a function an oracle regardless of its name.

  THE BLOCK AFTER. Then the value nobody budgeted for: for one real price update, examine the block
  immediately after and identify what was extracted from knowing the new price before the protocols reacted.
  State who captured it and who could have.
acceptance:
  command: forge test --junit --match-path test/Oracles.t.sol
  criteria:
    - Four prices for one asset are obtained at the same block with the spread reported
    - A recommendation per use case is given rather than a single answer
    - A spot-price-reading contract is drained via a flash loan with the profit reported
    - The fix defeats the same attack, with its cost in responsiveness stated
    - A protocol function that is an oracle without being called one is identified and shown manipulable, affecting a third party
    - What makes a function an oracle regardless of its name is stated
    - The block after a real price update is examined with the extracted value identified and the capturing and potential parties named
hints:
  - Read all four prices at the same block or the spread means nothing. Timestamp them explicitly in the output.
  - The time-weighted average is not a fix by itself. Report how far back it averages and work out the cost of moving it for that duration — for a shallow pool it is affordable.
  - The accidental oracle is the transferable finding. Any getter another contract trusts is an oracle, and looking for those is a review habit worth building here.
