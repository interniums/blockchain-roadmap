kind: measure
title: Compute what it actually costs to move a TWAP
concepts: [orac-manipulation-cost, orac-twap, orac-twap-lag, orac-multiblock-is-probabilistic]
spec: >
  Implement the cost-of-attack model for a Uniswap-style TWAP as a small Python package. Given a
  pool's current liquidity and fee tier, a TWAP window length and a target distortion, output the
  attacker's expected mark-to-market loss — the fees paid plus the value surrendered to
  arbitrageurs while the distortion is held. Run it for one deep pair and one long-tail pair using
  liquidity read from live pool state, sweeping window length. Report, for each pair, the window at
  which the cost exceeds a stated value-at-risk, and separately report the cost under the
  consecutive-slot case where no arbitrageur intervenes. State the probability weighting you apply
  to that case and where the stake-share number came from.
acceptance:
  command: python3 -m pytest tests/ -q
  criteria:
    - Unit tests assert the model reproduces known limiting behaviour — zero cost at zero distortion, and cost scaling with liquidity depth
    - The package outputs a cost-versus-window curve for a deep pair and for a long-tail pair from live liquidity data
    - The report names the window length at which each pair's manipulation cost exceeds a stated amount secured
    - The consecutive-slot case is reported separately as an expected cost weighted by an explicitly sourced probability, not as a single worst-case number
hints:
  - The dominant term is value handed to arbitrageurs while the price is held away from fair, not the capital used to move it. If your model's cost scales with the trade size rather than with the holding period, you have modelled the wrong quantity.
  - Read live liquidity rather than assuming it. The published 2023 conclusions rest on 2023 depths and reproducing them from stale numbers teaches the wrong lesson.
  - For the consecutive-slot case, resist reporting the unweighted cost. The honest output is expected cost per attempt times the probability of back-to-back proposal at a named stake share.
difficulty: 4
