id: defi-oracles-twap-attack-cost
moduleId: defi-oracles
grain: module
writeUp: >
  Take one protocol you have read the code of and write down every value it treats as a price, including the ones that do not look like prices. For each, name who can move it, how fast, and what it would cost them.
coversConcepts:
  - orac-price-feed
  - orac-push-model
  - orac-deviation-and-heartbeat
  - orac-staleness-check
  - orac-pull-model
  - orac-pull-verification
  - orac-confidence-interval
  - orac-spot-price-is-not-an-oracle
  - orac-twap
