id: defi-stablecoins-capstone-price-every-peg
moduleId: defi-stablecoins
grain: module
writeUp: >
  Take any token you hold that calls itself a dollar. Write down who may redeem it, at what size, at what fee, on what timescale, whether the issuer may refuse, and whether you can verify the backing on chain. Then say what you would have seen, and when, if it had been about to fail.
