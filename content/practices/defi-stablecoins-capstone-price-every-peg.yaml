kind: write
title: For four stablecoins, name the trade that holds the peg and the one that breaks it
difficulty: 4
concepts: [stable-peg-is-not-a-property, stable-redemption-right, stable-secondary-market-peg, stable-fiat-backed, stable-reserve-composition, stable-cdp, stable-psm, stable-monetary-policy, stable-pegkeeper, stable-algorithmic, stable-death-spiral, stable-synthetic-delta-neutral, stable-synthetic-risks, stable-yield-bearing-is-not-a-stablecoin, stable-collateral-contagion, stable-depeg-asymmetry, stable-regulatory-boundary]
spec: >
  No contract sets a market price. Take four live stablecoins, one from each design family — fiat-backed,
  CDP, synthetic delta-neutral, and one that is marketed as a stablecoin and is not — and for each answer
  the same three questions with numbers.

  THE ARBITRAGE. Who is allowed to redeem or mint, at what price, in what size, and what does it cost
  them? Write the trade a one-percent deviation creates as a concrete P&L, including fees and the time
  the leg takes. If the trade is not available to you, say who it is available to — that answer is the
  design.

  THE FAILURE. What has to be true for that arbitrage to stop working? For each coin name the specific
  condition: a reserve that cannot be liquidated at par, a collateral asset correlated with the coin
  itself, a funding rate that inverts, a redemption queue that gates. Then say which direction the peg
  breaks, because depeg is asymmetric and the reason is different in each case.

  THE LEVERS. For the CDP coin, describe its peg module and its rate lever, and find a historical
  moment when each was used. State what the lever actually changes about somebody's trade.

  THE DEATH SPIRAL. For the algorithmic case — historical is fine — write out the loop mechanically: each
  step, what it does to supply, and what it does to the price of the thing backing it. Then identify the
  step at which it becomes irreversible.

  THE FOURTH CATEGORY. For the yield-bearing instrument, state plainly why it is not a stablecoin, and
  what its holders are actually exposed to.

  READ A DEPEG. Take one real depeg event with data and classify it: liquidity gap or solvency gap. Show
  the evidence you used to tell them apart, because they look identical for the first hour.

  THE BOUNDARY. Close with which of your four a regulator would call a dollar, and which it would not.
acceptance:
  command: 'true'
  criteria:
    - Four live coins are chosen, one from each named family, and identified
    - Each has the peg-holding trade written as a concrete P&L including fees and leg time
    - Where the trade is not open to a retail participant, the party it is open to is named
    - Each has a specific failure condition named, with the direction the peg breaks and why
    - The CDP coin's peg module and rate lever are described with a historical moment each was used
    - The algorithmic loop is written out step by step, with the irreversible step identified
    - The yield-bearing instrument's actual exposure is stated, with why it is not a stablecoin
    - One real depeg is classified liquidity or solvency, with the evidence that distinguishes them
    - A verdict on which coins a regulator would call a dollar
hints:
  - Write the P&L in dollars for a concrete size. "Arbitrageurs will restore the peg" is the sentence this exercise exists to replace with a number, and the number is often much less attractive than the sentence implies.
  - The asymmetry question is the one people skip. Redemption rights defend one side of the peg far better than the other, and which side depends on the design — work it out per coin rather than assuming.
  - For the depeg classification, find the redemption volume during the event. A liquidity gap has redemptions clearing at par while the secondary market panics; a solvency gap does not.
