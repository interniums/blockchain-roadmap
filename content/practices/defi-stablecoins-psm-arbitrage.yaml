id: defi-stablecoins-psm-arbitrage
moduleId: defi-stablecoins
grain: block
kind: implement
title: Build a peg stability module and watch the fee become the peg band
concepts:
- stable-psm
- stable-peg-is-not-a-property
- stable-redemption-right
- stable-secondary-market-peg
spec: 'Implement a peg stability module holding a reserve stablecoin, which mints your own stablecoin
  one-for-one on deposit and burns one-for-one on withdrawal, with configurable in and out fees and a
  debt ceiling. Deploy it alongside a constant-product pool trading your stablecoin against the reserve
  asset. Then write tests that push the pool price away from parity and demonstrate an arbitrageur closing
  the gap through the module — proving that the width of the band the price settles into is exactly the
  fee. Finally, exhaust the debt ceiling and show what happens to the peg when the arbitrage is no longer
  available.

  '
acceptance:
  command: forge test --match-path test/PegStabilityModule.t.sol -vv
  criteria:
  - A test pushes the pool price above parity, runs a profit-maximising arbitrage through the module,
    and asserts the resulting price lies inside a band whose width equals the configured fee
  - Doubling the mint fee doubles the measured band width, asserted numerically rather than qualitatively
  - A test exhausts the debt ceiling and shows the pool price departing parity with no profitable arbitrage
    available
  - A test asserts the module's reserve balance equals the outstanding stablecoin minted through it at
    every point, so the balance-sheet effect is visible
hints:
- Write the arbitrageur as a contract that computes its own optimal size against the pool, not as a hard-coded
  amount. The band only appears if the arbitrage is profit-maximising.
- The band is two-sided and the two fees are independent. Test the below-parity direction separately or
  you will only prove half the result.
- 'The ceiling test is the point of the exercise: it shows that a peg mechanism is a bounded bid, and
  the bound is a governance parameter rather than a property of the design.'
difficulty: 3
