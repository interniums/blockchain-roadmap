id: evm-accounts-code-length-audit
moduleId: evm-accounts
grain: module
writeUp: >
  Pick a product you have built or used that treats "the caller is a human wallet" as a meaningful category — an airdrop, a fee discount, a bot filter, a rewards gate. Write down what that category was actually protecting, then describe what a delegated EOA does to that protection and what you would put in its place. If you conclude nothing changes, say precisely why the delegated account cannot reach the behaviour you were guarding.
coversConcepts:
  - account
  - eoa
  - contract-account
  - delegation-designator
  - set-code-transaction
  - authorization-tuple
  - chain-id-scoping
  - sponsored-relay-griefing
  - delegate-is-total-control
  - delegation-clearing
  - delegate-storage-collision
  - extcode-vs-code-asymmetry
  - delegation-not-chained
  - eoa-vs-contract-binary
  - code-length-check-broken
  - tx-origin-check-broken
kind: read
title: Audit three real contracts for broken "is this a contract" checks
concepts: [code-length-check-broken, tx-origin-check-broken, eoa-vs-contract-binary]
spec: >
  Find three deployed, pre-2025 contracts that gate behaviour on `address.code.length == 0`,
  `extcodesize`, or `msg.sender == tx.origin`. Read each one and decide what property the check was
  actually protecting — anti-bot, anti-flash-loan, reward eligibility, reentrancy heuristic. Then
  encode each verdict as a fork test: write a test that delegates an EOA to a trivial delegate and
  drives the contract through the check, asserting either that the guarded path is now reachable
  when it should not be, or that it is still unreachable and explaining why. Every verdict must be
  a passing assertion, not a comment.
acceptance:
  command: forge test --junit --match-path test/EoaCheckAudit.t.sol
  criteria:
    - Three separate tests, one per contract, each naming the contract address and the exact line of the check
    - At least one test demonstrates a guarded path becoming reachable by a delegated EOA
    - Each test carries a one-sentence comment stating the property the original check was trying to enforce
    - Any contract judged still safe has a test asserting the specific reason it is unaffected
hints:
  - Search verified sources for `extcodesize`, `code.length` and `tx.origin`; airdrop claims, fee discounts and staking rewards are the richest hunting ground.
  - The check being broken is not the same as the contract being exploitable — ask what the attacker gains once the check passes.
  - Use a fork test pinned to a block so the result is reproducible, and delegate a fresh EOA rather than trying to find one already delegated.
difficulty: 4
