id: evm-accounts-delegate-takeover
moduleId: evm-accounts
kind: break
title: Take over a naively delegated EOA
concepts: [delegation-designator, delegate-is-total-control, set-code-transaction, authorization-tuple]
spec: >
  Write a delegate contract with a single function that forwards arbitrary calldata to an arbitrary
  target with no access control at all — the naive "batching" delegate people write first. In a
  Foundry test, fund an anvil EOA, sign an EIP-7702 authorization for that delegate with
  `vm.signAndAttachDelegation` (or `vm.signDelegation` plus `vm.attachDelegation`), and confirm the
  account's code is now the 23-byte designator. Then, from a completely unrelated attacker address,
  call the delegated EOA and drain its entire balance. Finally write a second delegate that
  resists the same attack by requiring that the caller is the account itself, and prove the drain
  now reverts.
acceptance:
  command: forge test --junit --match-path test/DelegateTakeover.t.sol
  criteria:
    - A test asserts the delegated account's code is exactly 23 bytes and begins with 0xef0100 followed by the delegate address
    - A test proves an unrelated third-party address can move the delegated account's entire ETH balance
    - A second test proves the hardened delegate reverts on the identical attacker call
    - The test file contains a comment naming which property the naive delegate failed to enforce
hints:
  - The attacker does not need any signature. Ask yourself what `msg.sender` is inside the delegate when a stranger calls the delegated EOA directly.
  - Delegated code runs with the EOA as `address(this)`, so the delegate's balance is the victim's balance and any `call` it makes spends that balance.
  - The fix is one check comparing `msg.sender` against `address(this)`; write the failing assertion first, then add the check and watch it flip.
difficulty: 3
