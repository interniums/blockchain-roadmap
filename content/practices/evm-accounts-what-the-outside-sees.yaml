id: evm-accounts-what-the-outside-sees
moduleId: evm-accounts
grain: block
kind: break
title: Make a contract look like an EOA and an EOA look like a contract
difficulty: 3
concepts: [account, eoa, contract-account, extcode-vs-code-asymmetry, delegation-not-chained]
spec: >
  An account is four fields, and since delegation arrived, two of the questions people ask about an
  account no longer have the answers they used to.

  THE FOUR FIELDS. For three real accounts — a plain EOA, a contract, and a delegated EOA — print all
  four fields of each and state, for each account, what is different. Then say where the code and the
  storage of the contract actually live, since neither is in the record.

  THE ASYMMETRY. Demonstrate that what an external observer sees is not what executes. For the delegated
  EOA, show the code an `extcodesize`-style check observes and the code that actually runs, and show they
  are not the same object. Then write the check that people use to detect a contract and show it giving
  the wrong answer for this account. Say concretely what breaks in a contract that relies on it.

  NO CHAINING. Show that delegation does not chain: point a delegation at an account that is itself
  delegated, and demonstrate what actually happens rather than what a reader might expect. State the
  rule in one sentence.
acceptance:
  command: forge test --junit --match-path test/AccountShape.t.sol
  criteria:
    - All four fields are printed for a plain EOA, a contract and a delegated EOA, with the differences stated
    - Where a contract's code and storage actually live is stated, given neither is in the record
    - The code an external check observes and the code that executes are shown to differ for a delegated EOA
    - A standard contract-detection check is shown returning the wrong answer, with a concrete consequence
    - Delegation pointed at an already-delegated account is shown not to chain, with the rule stated in one sentence
hints:
  - Print the raw fields rather than using a helper that formats them. The asymmetry is easier to see when you are looking at the code hash next to the code.
  - The detection check that breaks is the one most codebases use. Grep a real project for it before you write your own version.
  - For non-chaining, predict what you expect before running it. The actual behaviour is simple and the prediction is where the learning is.
