id: evm-blobs-data-lane-capstone-the-lane-you-cannot-read
moduleId: evm-blobs-data-lane
grain: module
writeUp: >
  A colleague proposes storing your application's user-generated content as blobs because "blob gas is much cheaper than calldata". Write the reply. Be specific about what a contract can and cannot do with a blob, what happens to the data after the retention window, and what question you would ask them before deciding whether their idea is wrong or merely mis-stated.
coversConcepts:
  - blob
  - blob-not-in-evm
  - versioned-hash
  - kzg-commitment
  - blob-pruning
  - separate-blob-fee-market
  - data-availability-sampling
  - peerdas
  - blob-throughput-scaling
kind: implement
title: Post a blob, read what a contract can see of it, and watch it disappear
difficulty: 4
concepts: [blob, blob-not-in-evm, versioned-hash, kzg-commitment, blob-pruning, separate-blob-fee-market, data-availability-sampling, peerdas, blob-throughput-scaling]
spec: >
  Send a real blob transaction on a testnet and account for the whole life of that data — including
  the part where it stops existing.

  POST IT. Build and send a type-3 transaction carrying at least one blob you constructed. Compute
  the KZG commitment yourself and derive the versioned hash from it, then assert the versioned hash
  the chain reports equals the one you computed. If they differ you have the commitment wrong, and
  the exercise is to find out how.

  READ WHAT THE EVM CAN. Write a contract that reads the versioned hash of the blob in its own
  transaction, and prove — with a test that fails if you are wrong — that it cannot read the blob's
  contents. State in a comment what the 32 bytes it CAN read are actually good for, with one concrete
  use.

  TWO MARKETS. Price the same 100 KiB as calldata and as blob data at live prices, and plot both fee
  markets over at least 200 blocks. Show they move independently — find a block range where one rose
  while the other fell. Say what that independence means for a rollup choosing where to put data.

  AVAILABILITY IS A WINDOW. Explain, with reference to the sampling scheme, why nobody has to
  download every blob for the guarantee to hold — and what the guarantee therefore is, stated as a
  sentence about time rather than about storage. Then demonstrate the consequence: retrieve your
  blob's contents shortly after posting, and state the date after which that request will fail and
  what you would have had to do to still have the data.

  THROUGHPUT. Given the current target and max per block, state the sustained bytes per second the
  lane offers, and what changed most recently to move that number.
acceptance:
  command: forge test --junit --match-path test/capstone/Blobs.t.sol
  criteria:
    - A type-3 transaction with a self-constructed blob is sent on a testnet
    - The KZG commitment is computed locally and the derived versioned hash matches what the chain reports
    - A contract reads its transaction's versioned hash, and a test proves it cannot read the blob contents
    - A comment states what the versioned hash is good for, with one concrete use
    - 100 KiB is priced as calldata and as blob data at live prices
    - Both fee markets are plotted over at least 200 blocks, with a range identified where they moved in opposite directions
    - The availability guarantee is stated as a sentence about time, with reference to the sampling scheme
    - The blob's contents are retrieved, and the date after which retrieval fails is stated along with what would preserve the data
    - Sustained throughput is derived from the current target and max, with the most recent change to it named
hints:
  - Get the commitment right before you send anything. A mismatched versioned hash is the failure mode here, and it is much cheaper to debug against a locally computed pair than against a rejected transaction.
  - For the two markets, plot them on separate axes. They differ by orders of magnitude and a shared axis hides exactly the independence you are trying to show.
  - The retrieval date is not a guess. Find the pruning window in the spec, add it to your transaction's timestamp, and write the date down — that is the deliverable, not an estimate.
