id: evm-blobs-data-lane-cost-comparison
moduleId: evm-blobs-data-lane
grain: block
kind: measure
title: Price 100 KiB as calldata and as a blob, at live prices
concepts: [separate-blob-fee-market, blob, blob-pruning, calldata-floor-price]
spec: >
  Write a script that pulls the current execution base fee and the current blob base fee from a live
  node, then computes what it costs to publish 100 KiB of data three ways: as calldata under the
  standard EIP-2028 rates, as calldata under the EIP-7623 floor, and as a blob. Run it repeatedly
  over a period and record how the ratio moves — the point is to see the two markets diverge rather
  than to capture one number. Finish with a short written note on when each option is correct,
  naming the retention difference explicitly.
acceptance:
  command: npx tsx scripts/blobVsCalldata.ts --bytes 102400 --samples 20
  criteria:
    - Three computed costs per sample, using live base fees rather than hardcoded values
    - At least twenty samples showing the ratio between the two markets changing over time
    - The calldata calculation distinguishes the standard rate from the EIP-7623 floor and states which applies to a data-dominated transaction
    - A written note naming the retention window as a reason to choose calldata even when blobs are cheaper
hints:
  - Blob gas is quantised — a payload smaller than 128 KiB still pays for a whole blob, so 100 KiB and 128 KiB cost the same.
  - Zero bytes and non-zero bytes are priced differently in calldata, so your byte mix changes the answer; state the mix you assumed.
  - The two base fees update from different fields on different rules. If your samples move together, you are probably reading the same field twice.
difficulty: 2
