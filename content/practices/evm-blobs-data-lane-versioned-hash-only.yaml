id: evm-blobs-data-lane-versioned-hash-only
moduleId: evm-blobs-data-lane
grain: block
kind: implement
title: Read a blob's versioned hash from a contract, and prove you cannot read the blob
concepts: [blob, blob-not-in-evm, versioned-hash]
spec: >
  Write a contract that reads the versioned hash at a given index of the current transaction using
  Solidity's `blobhash` builtin, stores it, and exposes it. Test it with Foundry by setting the
  transaction's blob hashes with `vm.blobhashes`, and assert the contract sees exactly what you set.
  Then write the negative half of the exercise: enumerate what the contract can and cannot learn
  about the blob, and encode it as assertions — reading past the number of attached blobs yields
  zero, and there is no path from the versioned hash back to any blob content. Finish with a
  contract that verifies a claimed value at a claimed position using the point-evaluation
  precompile, and note what that does and does not tell you.
acceptance:
  command: forge test --junit --match-path test/BlobHash.t.sol
  criteria:
    - The contract returns exactly the versioned hashes set on the transaction, for at least two indices
    - Reading an index beyond the attached blob count returns zero rather than reverting
    - A test exercises the point-evaluation precompile against a known commitment and opening
    - A comment states, in one sentence, what a contract can prove about a blob and what it cannot
hints:
  - '`vm.blobhashes` sets the hashes for the current transaction context; you do not need a real blob to exercise the opcode path.'
  - A versioned hash is a version byte followed by a truncated hash of the KZG commitment — check the first byte of what you set.
  - The precompile verifies an opening against a commitment. It tells you a claimed evaluation is consistent; it never hands you the blob.
difficulty: 3
