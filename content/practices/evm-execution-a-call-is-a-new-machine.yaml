id: evm-execution-a-call-is-a-new-machine
moduleId: evm-execution
grain: block
kind: implement
title: Hit the depth limit, lose your memory, and find the opcode that stopped working
difficulty: 3
concepts: [evm-execution-loop, gas-is-a-countdown, deterministic-single-threaded, call-frame, memory-is-per-frame, depth-limit-1024, selfdestruct-neutered]
spec: >
  Three properties of the execution model, each demonstrated by hitting its edge.

  MEMORY IS PER FRAME. Write a contract that writes to memory, calls another contract, and reads its
  memory back. Show it unchanged. Then have the callee write to the same offsets and show the caller
  still unaffected. State in one sentence what is shared between frames and what is not.

  THE DEPTH LIMIT. Recurse until you hit it. Report the exact depth at which the call fails, and — the
  part that matters — show how the failure presents to the caller. It is not a revert, and code that
  treats it as one is wrong. Then construct a case where hitting the limit makes a contract behave
  incorrectly rather than merely fail.

  GAS IS A COUNTDOWN. Show that gas forwarded to a call is a ceiling and not a promise: forward a
  specific amount and show the callee receiving less. Report both numbers and name the rule.

  THE NEUTERED OPCODE. Deploy a contract that calls `selfdestruct` and show what now happens: what is
  destroyed, what is not, and under what single circumstance the old behaviour still occurs. Then state
  what breaks in a contract written against the old semantics.
acceptance:
  command: forge test --junit --match-path test/CallFrames.t.sol
  criteria:
    - A caller's memory is shown unaffected by a callee writing the same offsets
    - One sentence states what is shared between frames and what is not
    - The exact depth at which calls begin failing is reported
    - The failure is shown presenting to the caller as something other than a revert
    - A case is constructed where hitting the depth limit makes a contract behave incorrectly rather than merely fail
    - Forwarded gas is shown to be a ceiling, with requested and received amounts reported and the rule named
    - selfdestruct is shown with what is and is not destroyed, and the single remaining circumstance for old behaviour
    - What breaks in a contract written against the old selfdestruct semantics is stated
hints:
  - The depth failure returning false rather than reverting is the finding. Write the naive caller that treats it as success first, and watch it proceed.
  - For the gas ceiling, request an amount larger than 63/64ths of what you hold. The rule is arithmetic and seeing the number confirms which arithmetic.
  - The remaining selfdestruct case is same-transaction creation. Construct it deliberately rather than hoping to stumble on it.
