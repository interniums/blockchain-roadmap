id: evm-execution-create2-factory
moduleId: evm-execution
grain: module
writeUp: >
  DELEGATECALL is one instruction that underwrites upgradeable proxies, library patterns and EIP-7702 delegation alike. Write down, in your own words, exactly what it borrows and exactly what it keeps — then describe the bug class each of those two halves creates, and which of the three patterns above you would be least comfortable shipping without an audit.
coversConcepts:
  - evm-execution-loop
  - gas-is-a-countdown
  - deterministic-single-threaded
  - call-frame
  - memory-is-per-frame
  - depth-limit-1024
  - four-call-variants
  - delegatecall-is-the-proxy-primitive
  - 63-64-rule
  - call-gas-is-a-maximum
  - call-depth-attack-dead
  - gas-griefing
  - three-failure-modes
  - call-returns-a-boolean
  - returndata-buffer
  - revert-data-encoding
  - initcode-vs-runtime-code
  - create-address-from-nonce
  - create2-address
  - code-deposit-and-size-limits
  - selfdestruct-neutered
kind: implement
title: Predict a contract's address before deploying it
concepts: [create2-address, create-address-from-nonce, initcode-vs-runtime-code, code-deposit-and-size-limits]
spec: >
  Build a factory with `deploy(bytes32 salt, bytes memory initcode)` using CREATE2, plus a pure
  `predict(bytes32 salt, bytes32 initcodeHash)` that implements
  `keccak256(0xff ‖ address(this) ‖ salt ‖ initcodeHash)[12:]` by hand in assembly. Prove `predict`
  matches the deployed address for three different salts. Then prove the trap: deploy the same
  contract source with a different constructor argument and show the address changes, and deploy
  through CREATE instead and show the address depends on the factory's nonce rather than on the
  initcode.
acceptance:
  command: forge test --junit --match-path test/Create2Factory.t.sol
  criteria:
    - predict matches the actual deployed address for three distinct salts
    - A test proves changing one constructor argument changes the CREATE2 address
    - A test proves the CREATE address changes when the factory's nonce changes, with identical initcode
    - The assembly implementation of predict does not call any library helper
hints:
  - The 0xff byte, the deployer address, the salt and the initcode hash are 1 + 20 + 32 + 32 = 85 bytes; lay them out in memory before hashing and mind where the free-memory pointer is.
  - Constructor arguments are appended to the creation bytecode, so `type(C).creationCode` alone is not the initcode you are hashing.
  - For the CREATE comparison, deploy something throwaway from the factory first to move its nonce, then deploy the real contract and compare.
difficulty: 4
