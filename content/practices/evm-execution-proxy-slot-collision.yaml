id: evm-execution-proxy-slot-collision
moduleId: evm-execution
grain: block
kind: fix
title: Corrupt a proxy's admin slot, then fix it properly
concepts: [delegatecall-is-the-proxy-primitive, four-call-variants, delegate-storage-collision]
spec: >
  Build a minimal proxy that stores its admin address in storage slot 0 and delegatecalls an
  implementation. Give the implementation its own state variable declared first, so it also lands in
  slot 0. Write a test that calls a perfectly ordinary implementation setter and demonstrates the
  proxy's admin has been overwritten — ideally with an attacker-chosen value. Then fix it by moving
  the admin pointer to an ERC-1967 style fixed hashed slot, and prove the same implementation call
  no longer disturbs it. State in a comment why DELEGATECALL is what made the collision possible.
acceptance:
  command: forge test --junit --match-path test/SlotCollision.t.sol
  criteria:
    - A test that fails on the vulnerable proxy by showing the admin address changed after an implementation call
    - The same test passing against the ERC-1967-style proxy with the admin unchanged
    - A test asserting the ERC-1967 admin slot value equals the specified keccak-minus-one derivation
    - A one-line comment explaining which property of DELEGATECALL created the collision
hints:
  - The implementation addresses storage by slot number using its own layout; it has no idea the proxy exists.
  - 'Take the attacker''s view: which implementation function, called by anyone, writes the colliding slot with a value they control?'
  - ERC-1967 slots are derived as a keccak of a namespaced string minus one, specifically so that no ordinary layout can ever assign them.
difficulty: 3
