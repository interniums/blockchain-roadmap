id: evm-execution-silent-call-failure
moduleId: evm-execution
kind: break
title: Make a transaction succeed while the work it was supposed to do failed
concepts: [call-returns-a-boolean, three-failure-modes, gas-griefing, returndata-buffer]
spec: >
  Write contract `A` that updates its own state and then low-level-calls contract `B`, discarding
  the returned boolean. Make `B` always revert. Write a Foundry test asserting that A's transaction
  succeeds and that A's state changed anyway. Then extend the exercise: leave B non-reverting but
  gas-hungry, and have the test call A while forwarding a gas amount chosen so that B runs out
  while A completes — the same silent failure produced by a different mechanism. Finally fix A so
  both cases revert, and show that the revert payload from B is bubbled up unchanged.
acceptance:
  command: forge test --junit --match-path test/SilentFailure.t.sol
  criteria:
    - A passing test in which the outer transaction succeeds, A's state changed, and B reverted
    - A second passing test producing the same silent failure via insufficient forwarded gas rather than a revert
    - A third test on the fixed version proving it reverts, with B's custom error selector preserved in the bubbled data
    - A comment distinguishing the two failure mechanisms and explaining why the fix catches both
hints:
  - The low-level `call` returns a boolean and nothing else happens automatically. Look at what your code does with that value.
  - For the gas variant, remember the callee receives at most 63/64 of what the caller holds — compute backwards from how much B needs.
  - Bubbling a revert means copying the return-data buffer into memory and re-reverting with it; a bare `revert()` throws away the reason.
difficulty: 3
