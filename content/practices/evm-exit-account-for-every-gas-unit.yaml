id: evm-exit-account-for-every-gas-unit
moduleId: evm-yul-assembly
grain: exit
trackId: evm
kind: measure
title: Account for every unit of gas in one mainnet transaction
difficulty: 5
concepts:
  - assembly-cost-is-review-cost
  - memory-safe-annotation
  - when-assembly-is-justified
  - solidity-memory-model-is-a-contract
spec: >
  Pick one mainnet transaction that costs more than 200,000 gas and touches at least three contracts.
  Produce a post-mortem that accounts for its cost down to the frame, and then a rewrite that is
  measurably cheaper — with the measurement defended rather than asserted.

  SIX parts.

  ONE. Name the envelope type and say what that envelope bought: which fields exist because of it,
  and what the transaction would have paid under the previous one.

  TWO. Attribute the gas. Intrinsic cost, calldata, each frame's execution, each cold and warm
  access, each storage write and its refund. The numbers must sum to the receipt. If they do not,
  the gap is the finding and you say what you have not accounted for.

  THREE. Verify one storage slot the transaction wrote, against the post-state root, without
  trusting the RPC that reported it.

  FOUR. Audit the contracts for "is this a contract" checks. Find every `extcodesize`, `code.length`
  and `isContract` in the reachable code and say, for each, whether a delegated EOA under EIP-7702
  breaks it — and what specifically goes wrong when it does. Nothing to find is an acceptable answer
  only if you show where you looked.

  FIVE. Predict the address of one contract the transaction interacts with, from its deployment
  inputs, and state exactly which single change to those inputs would move it.

  SIX. Take the most expensive frame and rewrite it. For each value it holds, choose between stack,
  calldata, memory, transient storage and storage, and defend the choice with measured gas — then
  state which of your numbers mainnet will not reproduce, and why. If your rewrite uses assembly,
  it carries a memory-safe annotation and you argue the annotation is honest.
acceptance:
  command: forge test --match-path test/exit/GasAccounting.t.sol
  criteria:
    - The gas attribution sums to the receipt, or the unaccounted remainder is stated as a number and named
    - Each cold access, warm access, storage write and refund is attributed to a specific frame rather than to the transaction as a whole
    - One written storage slot verifies against the post-state root using your own trie walk
    - Every contract-detection check in the reachable code is listed with a verdict on whether EIP-7702 breaks it and what fails when it does
    - One contract address is predicted from its deployment inputs and a named single change moves it, demonstrated rather than asserted
    - The rewrite is measurably cheaper under a test that fails if the saving disappears
    - The write-up names at least one measured number mainnet will not reproduce, and says why
    - Any assembly in the rewrite carries a memory-safe annotation with an argument for its honesty
hints:
  - Do the attribution with a trace, not with a gas report. A gas report tells you what a function cost; you need to know which access inside it was cold, and only the trace has that.
  - The refund is where most attributions stop summing. Decide whether you are accounting for gas charged or gas paid, write that down at the top, and be consistent — they are different numbers.
  - For part six, measure the rewrite three ways before you believe it. The number that survives a fork test at a pinned block is the one to quote; the others tell you how much your harness was flattering you.
writeUp: >
  You have now taken one transaction apart completely. Which part of the machine did you find you
  had been reasoning about wrongly, and what did the measurement say that your model did not?
