id: evm-gas-fee-market-access-list-breakeven
moduleId: evm-gas-fee-market
kind: measure
title: Find the point where an access list starts paying
concepts: [access-list, cold-vs-warm-access, intrinsic-gas, tx-gas-limit-vs-used]
spec: >
  Take a call path that touches several external contracts and several storage slots. Send it on
  anvil three ways: as a type-0 transaction, as a type-1 transaction with an access list containing
  exactly the items the call touches, and as a type-1 transaction with an access list that
  over-declares — listing items the call never touches. Record total gas used for each. Then vary
  the number of correctly declared entries and find the break-even point at which the up-front
  charge is repaid by warm pricing. Report the crossover as a number of entries, with the reasoning.
acceptance:
  command: forge test -vv --junit --match-path test/AccessListBreakeven.t.sol
  criteria:
    - Three measured totals for the three transaction shapes, from the learner's own run
    - The over-declared list demonstrably costs more than no list at all
    - A stated break-even entry count with the arithmetic that produces it from the measured per-entry and cold/warm figures
    - A one-sentence rule for when a caller should attach an access list in production
hints:
  - The saving per correctly declared item is the cold price minus the warm price; the cost is the fixed per-entry charge. Break-even is where those balance.
  - An item you declare and then touch twice does not save twice — only the first touch would have been cold.
  - Use `vm.accessList` or send the transaction through anvil with an explicit access list rather than trying to infer one; comparing your handmade list with what `eth_createAccessList` suggests is itself informative.
difficulty: 3
