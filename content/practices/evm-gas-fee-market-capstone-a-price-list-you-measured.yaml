id: evm-gas-fee-market-capstone-a-price-list-you-measured
moduleId: evm-gas-fee-market
grain: module
writeUp: >
  You measured cold and warm access costs yourself in this module rather than reading them from a table, and the first attempt at that measurement produced garbage because the compiler deleted the operation being measured. Write down the general rule you now apply before believing any gas number — your own or somebody else's — and name one number in your current codebase's assumptions that you have never verified.
coversConcepts:
  - gas
  - tx-gas-limit-vs-used
  - intrinsic-gas
  - cold-vs-warm-access
  - sstore-dynamic-pricing
  - access-list
  - calldata-floor-price
  - per-transaction-gas-cap
kind: measure
title: Build the gas price list yourself, and find the table that is wrong
difficulty: 4
concepts: [gas, intrinsic-gas, cold-vs-warm-access, sstore-dynamic-pricing, access-list, calldata-floor-price, per-transaction-gas-cap, tx-gas-limit-vs-used]
spec: >
  Produce a gas price list for the current fork, every number measured on your machine rather than
  copied, and then find at least one widely circulated figure that your measurement contradicts.

  INTRINSIC. Measure the fixed charge before any opcode runs, for a plain transfer, a call with
  calldata, and a contract creation. Separate the base cost from the calldata cost and show the
  calldata floor applying — construct one transaction where the floor binds and one where it does
  not, and state the byte pattern that makes the difference.

  COLD AND WARM. Measure the cold and warm cost of an account access and a storage read,
  independently. This is where the dead-code trap lives: prove your measurement is not being
  optimised away, by showing the same harness produces a different number when you defeat the
  optimiser and by saying which number is the real one.

  SSTORE. Measure all the dynamic cases: zero to non-zero, non-zero to different non-zero, non-zero
  to zero and the refund, and the same slot written twice in one transaction. Report each separately;
  a single "SSTORE costs" number is the mistake.

  ACCESS LISTS. Find the break-even for your own workload: the number of distinct accesses at which
  paying for the list starts to win. State it as a number, and show the two measurements either side
  of it.

  THE CEILINGS. Demonstrate both 2025–2026 ceilings binding. For the per-transaction cap, construct
  a transaction that would have been valid before it and is not now. For the gas-limit-versus-used
  distinction, show a case where the two differ enough to matter to a caller.

  THE CONTRADICTION. Finally, name one figure in circulation — a docs table, a blog post, a cheat
  sheet — that your measurements show is wrong or out of date. Quote it, quote yours, and say why
  they differ.
acceptance:
  command: forge test --junit --match-path test/capstone/GasPriceList.t.sol
  criteria:
    - Intrinsic gas is measured separately for a transfer, a call with calldata and a creation, with base and calldata costs split
    - One transaction where the calldata floor binds and one where it does not, with the byte pattern responsible named
    - Cold and warm costs are measured independently for account access and storage read
    - "The dead-code trap is demonstrated: the same harness yields a different number with the optimiser defeated, and the report says which is real"
    - All four SSTORE dynamic cases are reported separately, including the refund and the same-slot-twice case
    - An access-list break-even is stated as a number with measurements either side of it
    - A transaction valid before the per-transaction gas cap and invalid after it is constructed
    - A case where gas limit and gas used differ enough to matter to a caller is shown
    - One circulating figure is quoted alongside your contradicting measurement, with the discrepancy explained
hints:
  - Defeat the optimiser before you measure anything, not after. Every number you take before you have proved your harness is not being folded away will have to be taken again.
  - Measure SSTORE with the slot's prior value set in a separate transaction. Setting it in the same transaction changes which case you are measuring, and that is the trap in this one.
  - For the contradiction, look at cold storage reads and at reentrancy-guard costs specifically. The widely circulated numbers for both predate a repricing.
