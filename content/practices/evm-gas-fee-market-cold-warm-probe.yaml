id: evm-gas-fee-market-cold-warm-probe
moduleId: evm-gas-fee-market
kind: measure
title: Measure the cold/warm constants yourself, and survive the dead-code trap
concepts: [cold-vs-warm-access, sstore-dynamic-pricing, gas]
spec: >
  Build a gas probe that measures, from your own machine, the cost of a cold SLOAD, a warm SLOAD, a
  cold BALANCE, a warm BALANCE, a cold EXTCODESIZE and a warm EXTCODESIZE. Wrap each operation in
  `gasleft()` deltas inside inline assembly, and first calibrate the harness overhead with an empty
  measurement so you can subtract it. Record your solc version, forge version and optimizer setting
  alongside the numbers, because the numbers are meaningless without them. Your first attempt will
  probably report every read as costing single-digit gas; work out why before reading the hint.
acceptance:
  command: forge test -vv --junit --match-path test/ColdWarm.t.sol
  criteria:
    - Six measured figures produced by the learner's own run, each with the harness overhead subtracted
    - The cold SLOAD figure lands on 2100 and the cold account-access figures land on 2600 after subtracting overhead
    - The test emits the toolchain versions and optimizer setting alongside the numbers
    - A comment explains why an unsunk read measures as near-free and what change fixes it
hints:
  - Compare your first cold-SLOAD number against 2100. If it is nowhere near, the operation you think you measured did not happen.
  - '`pop(sload(0))` has no observable effect. Dead-code elimination removes it even with the optimizer switched off.'
  - Assign every read into a storage `sink` variable so the compiler cannot prove the read is unnecessary, then re-measure and subtract the extra SSTORE from your harness baseline.
difficulty: 3
