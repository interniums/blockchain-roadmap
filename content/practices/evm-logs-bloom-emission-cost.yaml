id: evm-logs-bloom-emission-cost
moduleId: evm-logs-bloom
grain: block
kind: measure
title: Price the same payload as topics, as data, and as storage
concepts: [logs-are-cheap, indexed-means-searchable, indexed-dynamic-is-hashed, storage-is-the-expensive-one]
spec: >
  Emit the same payload three ways in one Foundry test: fully indexed across the available topic
  slots, fully non-indexed in the data field, and written to storage with SSTORE instead. Record gas
  for each. Derive the per-topic increment yourself by emitting LOG0 through LOG4 with an identical
  data field and taking successive differences. Then demonstrate the indexed-dynamic rule: emit an
  event with an `indexed string`, show you cannot recover the string from the log, and show that
  filtering for the exact known string does work.
acceptance:
  command: forge test -vv --junit --match-path test/LogCost.t.sol
  criteria:
    - Three measured totals for indexed, non-indexed and storage versions of the same payload
    - A derived per-topic increment from the learner's own LOG0-to-LOG4 differences, landing on 375
    - A test showing the indexed string is unrecoverable from the log
    - A test showing an exact-value topic filter on that same string matches
hints:
  - Keep the data field identical across LOG0 to LOG4 so the successive differences isolate the per-topic charge and nothing else.
  - Memory expansion for the data buffer is charged too; expand memory before you start measuring so it does not pollute the deltas.
  - A topic is exactly 32 bytes, so the "string" in the topic is its keccak. Hash your known string client-side and filter on that.
difficulty: 2
