id: evm-logs-bloom-rebuild-logsbloom
moduleId: evm-logs-bloom
kind: implement
title: Reproduce a real receipt's logsBloom byte for byte
concepts: [ethereum-bloom-parameters, bloom-filter-idea, block-bloom-is-a-union, bloom-saturation]
spec: >
  Implement Ethereum's bloom construction in TypeScript with no library: for the emitting address
  and for each topic, keccak256 the item, take the low 11 bits of each of the first three byte-pairs
  of the digest, and set those bit positions in a 2048-bit array. OR the per-item results together
  to build a receipt bloom, then OR every receipt bloom in a block to build the header bloom.
  Fetch a real mainnet receipt and a real block over RPC and compare against the `logsBloom` fields
  byte for byte. Then measure saturation: for a range of recent blocks, report the fraction of bits
  set in each header bloom.
acceptance:
  command: npx vitest run test/logsBloom.test.ts
  criteria:
    - Reproduces the logsBloom of a real mainnet receipt byte for byte
    - Reproduces a real block header's logsBloom as the OR of its receipt blooms
    - Reports the fraction of set bits across at least twenty recent blocks
    - A test covers an item whose three 11-bit slices collide, setting fewer than three distinct bits
hints:
  - 'Be precise about bit ordering: the low 11 bits of a big-endian byte pair, indexing into a 2048-bit array whose byte 0 is the first byte of the field. Get this wrong and everything is off by a permutation.'
  - The data field of a log is not entered into the bloom. Only the emitting address and the topics are.
  - Once your saturation numbers are in, work out what false-positive rate that fill fraction implies for a three-bit query — that number is the argument for replacing the filter.
difficulty: 4
