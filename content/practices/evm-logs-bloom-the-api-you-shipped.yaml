id: evm-logs-bloom-the-api-you-shipped
moduleId: evm-logs-bloom
grain: block
kind: break
title: Query your own logs badly, then discover you shipped an API
difficulty: 3
concepts: [logs-are-write-only, log-record-shape, logs-still-committed, logs-revert-with-the-frame, getlogs-topic-semantics, events-are-an-api-contract]
spec: >
  Logs are a one-way channel, and the shape you emit is a contract with everyone downstream whether you
  meant it or not.

  WRITE-ONLY. Write a contract that tries to read one of its own past events and show it cannot. Then
  show that logs are nonetheless committed to by the block, by proving one against the receipts root.
  Both facts are true at once and the pair is the point.

  REVERTS TAKE THEM. Emit an event and then revert the frame. Show the log absent. Then emit in a sub-call
  that reverts while the outer call succeeds, and show what happens to that log. State the rule.

  QUERY IT PROPERLY. Emit fifty events across several blocks with varied indexed arguments. Then write
  four queries against them that demonstrate the topic semantics: match on the first topic only, match on
  a later topic, match either of two values in one position, and a query that returns nothing because the
  positional rule was misunderstood. Explain that last one.

  THE API. Now change the event: reorder two arguments and move one from indexed to unindexed. Show which
  of your four queries break and which silently return wrong results. The silent ones are the finding.
  Close with the versioning rule you would adopt, in one sentence.
acceptance:
  command: forge test --junit --match-path test/LogsApi.t.sol
  criteria:
    - A contract is shown unable to read its own past event
    - A log is proven against the receipts root, showing it is committed to despite being unreadable on chain
    - An event emitted before a revert is shown absent, and one from a reverting sub-call under a succeeding outer call is shown with the rule stated
    - Four queries demonstrate first-topic matching, later-topic matching, either-of-two matching, and a positional misunderstanding returning nothing
    - The positional failure is explained
    - Reordering arguments and unindexing one is shown breaking some queries and silently corrupting others
    - The silently wrong cases are identified as such
    - A one-sentence versioning rule is stated
hints:
  - The either-of-two query is where most people first learn the positional rule properly. Write it before the failing one and the failure becomes obvious.
  - For the silent corruption, watch a consumer that reads by position rather than by name. It keeps working and returns the wrong field, which is why this is an API and not a log.
  - Prove the log against the receipts root even though it feels like a detour. Committed-but-unreadable is a genuinely odd pair of properties and the proof is what makes it concrete.
