id: evm-opcodes-memory-cost-curve
moduleId: evm-opcodes-memory
kind: measure
title: Fit the memory expansion curve from your own measurements
concepts: [memory-expansion-quadratic, memory-highwater-never-shrinks, copy-costs-are-per-word]
spec: >
  Write a test that MSTOREs at increasing offsets — 1 KiB, 16 KiB, 64 KiB, 256 KiB, 1 MiB — and
  records gas used for each expansion step. Plot or tabulate the results and fit them against
  `3·words + floor(words² / 512)`. Identify roughly the buffer size at which the quadratic term
  overtakes the linear one. Then demonstrate the high-water rule: expand memory to a large offset,
  return to working at offset 0x80, allocate again, and show that nothing was refunded. Finally
  compare `bytes calldata` against `bytes memory` for a 32-byte, 1 KiB and 32 KiB argument.
acceptance:
  command: forge test -vv --junit --match-path test/MemoryCurve.t.sol
  criteria:
    - Measured costs match 3·words + words²/512 within rounding at every measured size
    - The learner states the approximate size at which the quadratic term exceeds the linear one, derived from their own data
    - A test proves that touching a high offset and then working low refunds nothing
    - A three-row calldata-versus-memory table naming which term dominates at each size
hints:
  - Charge is the delta from the previous high-water mark, so measure each step in a fresh call rather than cumulatively in one.
  - 'Work in words, not bytes: the formula is in 32-byte words and rounding matters at small sizes.'
  - For the calldata comparison, `memory` copies the whole array — expect copy cost plus expansion, while `calldata` pays neither.
difficulty: 3
