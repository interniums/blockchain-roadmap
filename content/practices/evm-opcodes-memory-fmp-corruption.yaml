kind: break
title: Clobber Solidity's allocator from inside an assembly block
concepts: [solidity-free-memory-pointer, memory-is-a-flat-byte-array, memory-highwater-never-shrinks]
spec: >
  Inside an inline assembly block, deliberately write to memory below 0x80 — first to the
  free-memory pointer at 0x40, then in a second variant to the permanently-zero slot at 0x60. After
  each, allocate a new dynamic array in ordinary Solidity and observe what happens to it. Write
  tests that assert the corruption concretely: an array whose length or contents are wrong, or two
  allocations that overlap. For each variant, name in a comment which reserved region was clobbered
  and which piece of compiler-generated behaviour depended on it. Then write the corrected version
  that allocates properly by reading and advancing the pointer.
acceptance:
  command: forge test --junit --match-path test/FmpCorruption.t.sol
  criteria:
    - A failing-then-passing pair of tests for the 0x40 corruption, with an assertion on the concrete wrong value
    - A second pair for the 0x60 zero-slot corruption
    - Each test names the clobbered region and the compiler behaviour that relied on it
    - The corrected version reads 0x40, uses the bytes it names, and writes the advanced pointer back
hints:
  - Allocate a `bytes memory` after the offending block and print both its pointer and its length; one of them will be somewhere it should not be.
  - The zero slot at 0x60 backs every empty dynamic array. Write to it, then create an empty array and read its length.
  - 'Correct allocation is three steps: read the pointer, write your data at that offset, store pointer + size rounded up to a word back at 0x40.'
difficulty: 4
