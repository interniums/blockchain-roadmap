id: evm-opcodes-memory-guard-benchmark
moduleId: evm-opcodes-memory
grain: block
kind: measure
title: Benchmark a reentrancy guard three ways, cold and warm
concepts: [transient-reentrancy-guard, tstore-tload, cold-vs-warm-access, cheap-reentrancy-economics]
spec: >
  Implement the same trivial function three ways: unguarded, guarded with a storage lock, and
  guarded with a transient lock. Measure the gas of a single call in each case, and compute the
  guard overhead as the difference from the unguarded baseline. Do it twice: once where the storage
  lock slot is cold (first guarded call in the transaction) and once where it is warm. Report four
  overhead figures. Then write one paragraph explaining why publishing a single number for the
  storage guard is misleading, using your own cold and warm figures as evidence.
acceptance:
  command: forge test -vv --junit --match-path test/GuardBench.t.sol
  criteria:
    - Four measured overheads from the learner's own run - storage cold, storage warm, transient, and the unguarded baseline
    - The transient overhead is flat across cold and warm cases and the storage overhead is not
    - The warm storage overhead lands near 3,100 and the transient overhead near 284 on a comparable toolchain
    - A written paragraph explaining why a single published figure for the storage guard cannot be reproduced
hints:
  - The transient lock has no cold surcharge at all, because nothing it touches lives in the state trie. Predict that before measuring, then check.
  - To get the cold case, make it the first guarded call of the transaction; to get the warm case, call the guarded function twice and measure the second.
  - Pin solc to at least 0.8.34 — earlier versions shipped a transient-storage clearing bug that will make your numbers wrong in an interesting but unhelpful way.
difficulty: 3
