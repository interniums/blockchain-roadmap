id: evm-opcodes-memory-six-places-a-byte-can-live
moduleId: evm-opcodes-memory
grain: block
kind: measure
title: Put the same byte in six places and price each one
difficulty: 3
concepts: [word-is-256-bits, stack-depth-1024, stack-reach-16, stack-too-deep, calldata-is-read-only, calldata-priced-at-the-edge, four-data-locations, storage-is-the-expensive-one, packing-helps-storage-only]
spec: >
  One value, six locations, six prices. Establish the table by measurement.

  THE WORD. Show that the machine's unit is 256 bits by storing a single byte and measuring what it cost.
  Then show packing working where it works and not working where it does not: pack four small values into
  one storage slot and measure the saving, then pack the same four in memory and show there is no saving.
  State the rule that explains the difference.

  THE STACK. Hit both stack limits. Reach past the sixteenth item and show the compiler failing rather
  than the machine — quote the error. Then push past the depth limit at runtime and show what the machine
  does instead. Two different failures, two different layers, and the write-up says which is which.

  CALLDATA. Show calldata is read-only by attempting to write it. Then show it is priced at the edge:
  send the same logical argument as a long calldata payload and as a short one that the contract expands,
  and report both total costs including the intrinsic charge. State which is cheaper and at what size the
  answer flips.

  THE TABLE. Close with the six-row table: stack, calldata, memory, storage, transient storage, and
  returndata. Cost to read, cost to write, and lifetime for each — every number measured, none copied.
acceptance:
  command: forge test --junit --match-path test/DataLocations.t.sol
  criteria:
    - Storing a single byte is measured, demonstrating the 256-bit word
    - Packing four small values is measured in storage with a saving, and in memory with none
    - The rule explaining the difference is stated
    - Reaching past the sixteenth stack item produces a quoted compiler error
    - Exceeding stack depth at runtime is shown with the machine's behaviour, and the two failures attributed to different layers
    - Calldata is shown read-only by a failed write attempt
    - A long calldata payload and a short expanded one are both costed including intrinsic gas, with the flip size stated
    - A six-row table gives read cost, write cost and lifetime for each location, all measured
hints:
  - Do the packing comparison in one commit with both versions present. The memory case producing no saving is the surprising half and it only lands next to the storage case.
  - Stack-too-deep is a compiler error and depth exhaustion is a runtime one. Keeping them in separate tests stops the write-up conflating them, which is the usual mistake.
  - For the six-row table, measure returndata last. It is the one people leave out and the one whose lifetime rule is least obvious.
