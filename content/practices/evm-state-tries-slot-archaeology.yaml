id: evm-state-tries-slot-archaeology
moduleId: evm-state-tries
grain: block
kind: measure
title: Find an ERC-20 holder's balance without calling balanceOf
concepts: [per-account-storage-trie, zero-slot-is-absent, account-record-four-fields]
spec: >
  For a deployed ERC-20 on a pinned fork, compute the storage slot holding a chosen holder's
  balance as `keccak256(abi.encode(holder, balancesSlot))` and read it with `vm.load`. Compare it
  against what `balanceOf` returns, for three different holders. Then measure the gas of three
  storage transitions on a scratch contract in the same test run — zero to non-zero, non-zero to a
  different non-zero, and non-zero to zero — recording the numbers from your own run rather than
  from a table. Make sure each measured read or write is assigned into a storage sink so the
  compiler cannot eliminate it as dead code.
acceptance:
  command: forge test -vv --junit --match-path test/SlotDerivation.t.sol
  criteria:
    - The derived slot value equals balanceOf for three distinct holders
    - The test emits three measured gas figures for the three SSTORE transitions from the learner's own run
    - A test asserts that a slot that has never been written and a slot explicitly written to zero read identically
    - The test file states the slot formula in a comment, written from memory rather than pasted
hints:
  - The mapping's declaration slot is not always 0. Find it by trying candidates until the derived slot matches balanceOf, then write down how you would find it for an unfamiliar contract.
  - '`pop(sload(slot))` measures nothing — the optimizer removes it even when the optimizer is off. Assign every read into a storage variable.'
  - Wrap each operation in `gasleft()` deltas and subtract the harness overhead you measure with an empty block.
difficulty: 3
