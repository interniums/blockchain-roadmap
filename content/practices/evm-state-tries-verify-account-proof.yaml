id: evm-state-tries-verify-account-proof
moduleId: evm-state-tries
kind: implement
title: Verify a mainnet account against a state root you fetched separately
concepts: [merkle-patricia-trie, trie-node-kinds, secure-trie-hashed-keys, eth-getproof, proof-vs-trust]
spec: >
  Write `verifyAccountProof(stateRoot, address, proof)` in TypeScript with no Merkle library. Walk
  the RLP-encoded node list returned by `eth_getProof`: at each step, keccak256 the node, check the
  hash equals the reference held by its parent (the state root for the first node), decode the node,
  and consume nibbles of keccak256(address) to choose the next child. Return the decoded
  `[nonce, balance, storageRoot, codeHash]`. Fetch the proof from one public RPC provider and the
  block header's stateRoot from a different one, so the verification is genuinely cross-checked.
  Then add negative tests: flip a single byte in any node, and swap in a leaf belonging to a
  different account.
acceptance:
  command: npx vitest run test/verifyAccountProof.test.ts
  criteria:
    - Verifies a real mainnet account against a stateRoot obtained from a different provider than the proof
    - Rejects the proof when any single byte of any node is flipped
    - Rejects a proof whose final leaf belongs to a different account
    - Handles all three node kinds (leaf, extension, branch) and asserts which kind each proof node was
hints:
  - Start by printing the length of the proof array and the depth of keccak256(address) in nibbles; they should be related in a way you can explain.
  - A branch node RLP-decodes to 17 items; a leaf and an extension both decode to 2, and only the first nibble of the compact-encoded path tells them apart.
  - Your two rejection tests should fail for different reasons — one breaks the hash chain, the other reaches a leaf whose remaining path does not match. Assert on the distinct reasons.
difficulty: 5
