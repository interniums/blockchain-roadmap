id: evm-state-tries-what-the-header-commits-to
moduleId: evm-state-tries
grain: block
kind: measure
title: Show the state root is an output, and measure what makes it expensive
difficulty: 3
concepts: [state-root-is-post-execution, three-block-tries, tx-and-receipt-tries-are-index-keyed, receipt-contents, state-growth-problem]
spec: >
  Two facts about the header's roots that change how you read a block, and one measurement that explains
  why nodes are expensive.

  AN OUTPUT, NOT AN INPUT. Take a real block and show that its state root is the state AFTER executing
  it, not before. Do it by computing the root at both points and showing which one the header carries.
  Then state the consequence: what a client must do before it can check the header at all.

  THREE TRIES, TWO KEY SPACES. For the same block, identify all three roots and state what each commits
  to. Then show the keying difference concretely: look up a transaction by index and an account by
  address, and say what you cannot do with an index-keyed trie that you can with an account-keyed one.
  Print one receipt's full contents and label every field.

  WHY IT IS THE BOTTLENECK. Measure state growth: take the state size at two points at least a year
  apart and report the growth rate. Then separate it from history growth and state which of the two a
  node operator can prune and which they cannot. Close with one sentence on why this is the reason
  running a node is expensive, in terms of the two numbers you measured.
acceptance:
  criteria:
    - The header's state root is shown to be the post-execution state, by computing the root at both points
    - What a client must do before it can check the header is stated
    - All three roots are identified with what each commits to
    - A transaction lookup by index and an account lookup by address are both performed
    - One thing an index-keyed trie cannot do is stated
    - One receipt's full contents are printed with every field labelled
    - State growth is measured across at least a year with a rate reported
    - State growth is separated from history growth, with which is prunable stated
    - One sentence explains node cost in terms of the two measured numbers
hints:
  - The post-execution point is easiest to show with a block that changes a balance you can name. Compute the root before and after that one change and see which the header matches.
  - "The index-keyed limitation is the interesting one: you cannot prove anything about a transaction without knowing where it sat."
  - Get state and history sizes from the same client at both time points, or the growth rate will include a client difference you cannot separate out.
