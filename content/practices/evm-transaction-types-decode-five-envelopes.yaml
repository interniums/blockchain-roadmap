id: evm-transaction-types-decode-five-envelopes
moduleId: evm-transaction-types
kind: implement
title: Decode all five transaction envelopes from raw hex
concepts: [eip-2718-envelope, tx-type-0-legacy, tx-type-1-access-list, tx-type-2-1559, tx-type-3-blob, tx-type-4-setcode]
spec: >
  Write a decoder in TypeScript that takes a raw transaction hex string, identifies its envelope
  type from the leading byte (remembering that a legacy transaction has no type byte at all), and
  decodes the correct field set for that type. Do not use a library's transaction parser — RLP
  decoding is fine, field interpretation is yours. Collect one real mainnet transaction of each of
  the five types with `cast tx --raw` and use them as fixtures. Produce a table of which fields each
  type carries, generated from your decoder rather than written by hand.
acceptance:
  command: npx vitest run test/decodeEnvelope.test.ts
  criteria:
    - Correctly decodes one real mainnet transaction of each of the five types
    - Distinguishes a legacy transaction from a typed one without being told which it is
    - The generated field table shows exactly what each type adds relative to the one before it
    - A test asserts the decoder rejects a type byte outside 0x00-0x7f
hints:
  - Look at the first byte. RLP list encodings start at 0xc0 or above, which is exactly why typed transactions were restricted to 0x00-0x7f.
  - The access list is a list of `[address, [storageKey, ...]]` pairs and appears in every type from 0x01 onward, including 0x03 and 0x04.
  - A type-3 transaction as broadcast in the mempool is wrapped with its blobs and proofs; the form you get from a mined block is the unwrapped one. Decide which you are decoding before you start.
difficulty: 4
