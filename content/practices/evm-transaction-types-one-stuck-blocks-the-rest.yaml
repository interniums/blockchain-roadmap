id: evm-transaction-types-one-stuck-blocks-the-rest
moduleId: evm-transaction-types
grain: block
kind: break
title: Stick one transaction and watch every later one stop
difficulty: 2
concepts: [nonce-ordering]
spec: >
  Nonces are strictly sequential per account, and the consequence is that one unincludable transaction
  is a queue-wide outage for that account.

  Submit three transactions from one account at consecutive nonces, where the first cannot be included —
  underpriced at the current base fee. Show the two behind it pending indefinitely even though both are
  individually includable. Report how long you waited before concluding they were stuck.

  Then fix it two ways and report the cost of each. Replace the stuck transaction with one that can be
  included, and separately cancel it with a no-op at the same nonce. State what each costs and which one
  a product should reach for.

  Finally, break the intuition that this is a fee problem: construct a stuck transaction whose problem is
  not the fee at all — one that will always revert during validation, or that is invalid for another
  reason — and show that raising the fee cannot rescue it. Say what does.
acceptance:
  criteria:
    - Three transactions at consecutive nonces are submitted with the first unincludable
    - The two behind it are shown pending while individually includable, with the wait time reported
    - The stuck transaction is replaced, with the cost reported
    - The stuck transaction is cancelled with a no-op at the same nonce, with the cost reported
    - A recommendation states which a product should reach for
    - A stuck transaction whose problem is not the fee is constructed, with fee increases shown not to help and the actual remedy named
hints:
  - Underprice the first transaction against the base fee rather than the priority fee. A low tip eventually gets included on a quiet block and ruins the demonstration.
  - Replacement requires clearing the endpoint's bump threshold, which is not the protocol minimum. Find your endpoint's actual threshold before concluding replacement does not work.
  - For the non-fee case, an invalid signature or a nonce already used elsewhere is enough. The point is that the queue is blocked by validity, not by price.
