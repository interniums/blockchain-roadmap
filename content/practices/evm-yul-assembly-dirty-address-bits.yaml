id: evm-yul-assembly-dirty-address-bits
moduleId: evm-yul-assembly
kind: fix
title: Make two identical addresses compare unequal, then fix it
concepts: [dirty-upper-bits, assembly-removes-the-safety-net, signed-vs-unsigned-opcodes]
spec: >
  Write an assembly block that compares two `address` values with `eq` and no masking, and construct
  a case where one word carries non-zero garbage in its upper twelve bytes so the comparison returns
  false for what is logically the same address. Then show the second half of the same problem: hash
  the unmasked word and show the digest differs from the digest of the clean address. Fix both by
  masking, deriving the mask in code from the type's width rather than pasting a hex constant. Add a
  third case using `lt` where `slt` was meant, and show it silently produces the wrong branch.
acceptance:
  command: forge test --junit --match-path test/DirtyBits.t.sol
  criteria:
    - A test that fails before the fix by showing two logically equal addresses comparing unequal
    - A test showing keccak256 of the dirty word differs from keccak256 of the clean one
    - The same tests passing after masking, with the mask derived rather than hardcoded
    - A third test showing lt versus slt producing different branches for a negative value
hints:
  - Getting dirty bits deliberately is the hard part; assembly arithmetic and hand-built calldata are the two easiest sources.
  - The mask for an N-byte value is `sub(shl(mul(8, N), 1), 1)` — write it that way so the width is visible.
  - For the signed case, encode -1 as a word and compare it against 1 with both `lt` and `slt`; the disagreement is total, not marginal.
difficulty: 3
