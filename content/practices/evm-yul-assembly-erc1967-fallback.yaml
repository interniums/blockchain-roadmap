id: evm-yul-assembly-erc1967-fallback
moduleId: evm-yul-assembly
kind: implement
title: Write a proxy fallback in assembly and justify every line of it
concepts: [when-assembly-is-justified, assembly-storage-access, memory-safe-annotation, raw-call-no-existence-check]
spec: >
  Implement an ERC-1967-style proxy fallback in inline assembly: copy the whole of calldata into
  memory, `delegatecall` the implementation read from the ERC-1967 slot, copy the return data back,
  and either `return` or `revert` with it unchanged. Decide whether the block can honestly carry
  the `("memory-safe")` annotation and write a comment justifying the decision against the
  documented permitted regions — quoting them, not paraphrasing. Add the code-existence check that
  raw `delegatecall` does not perform, and explain in a comment why the high-level equivalent would
  have inserted it for you.
acceptance:
  command: forge test --junit --match-path test/Erc1967Fallback.t.sol
  criteria:
    - Forwards a function taking dynamic arguments and returns a dynamic return value unchanged
    - Bubbles a custom-error revert from the implementation with its selector and arguments intact
    - A test proves the proxy reverts rather than silently succeeding when the implementation slot points at an address with no code
    - A comment justifies the memory-safe decision against the documented permitted regions
hints:
  - '`calldatacopy(0, 0, calldatasize())` writes over the scratch space and the free-memory pointer — think about whether that is permitted before you annotate.'
  - '`returndatacopy` reverts on an out-of-bounds read, so size your copy from `returndatasize()` and nothing else.'
  - The success flag from `delegatecall` decides between `return` and `revert`; both take the same memory range, which is the whole trick.
difficulty: 4
