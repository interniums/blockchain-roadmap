id: evm-yul-assembly-false-memory-safe
moduleId: evm-yul-assembly
grain: module
writeUp: >
  Write the rule you would put in your own team's contributing guide for inline assembly: which categories are permitted, what evidence a pull request must carry to justify a block, and who has to review it. Then apply your own rule to the last assembly block you saw in a real codebase and say whether it would have passed.
coversConcepts:
  - yul-is-the-middle-layer
  - via-ir-pipeline
  - verbatim-escape-hatch
  - assembly-removes-the-safety-net
  - dirty-upper-bits
  - signed-vs-unsigned-opcodes
  - raw-call-no-existence-check
  - solidity-memory-model-is-a-contract
  - assembly-storage-access
  - memory-safe-annotation
  - unannotated-assembly-disables-optimizations
  - annotation-is-unverified
  - when-assembly-is-justified
  - assembly-cost-is-review-cost
kind: break
title: Lie to the optimizer and find the configuration where it costs you
concepts: [annotation-is-unverified, memory-safe-annotation, unannotated-assembly-disables-optimizations]
spec: >
  Write an assembly block that writes past the free-memory pointer without updating it, annotate it
  `("memory-safe")`, and place a Solidity memory allocation after it. Compile and run the same test
  under several configurations: legacy codegen, `--via-ir`, and `--via-ir` at different optimizer
  `runs` settings. Find at least one configuration where the output is wrong and at least one where
  it is accidentally correct. Then remove the annotation and record what happens to the gas of
  unrelated functions in the same file, to see the cost of the conservative choice.
acceptance:
  command: FOUNDRY_PROFILE=viair forge test --junit --match-path test/FalseMemorySafe.t.sol
  criteria:
    - The same test produces different results under at least two documented compiler configurations
    - The learner names the configuration in which the false annotation caused corruption
    - A gas comparison shows unrelated functions in the same file getting worse when the annotation is removed
    - A written explanation of why a passing test suite is not evidence the annotation was true
hints:
  - The optimizer only spills stack values into memory when it believes it is safe to do so; the annotation is exactly what grants that belief.
  - Vary `optimizer_runs` widely — the spilling decision is sensitive to it, and one setting may hide the bug entirely.
  - Set up Foundry profiles for each configuration rather than editing foundry.toml between runs, so the comparison is reproducible.
difficulty: 5
