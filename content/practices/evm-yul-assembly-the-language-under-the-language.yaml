id: evm-yul-assembly-the-language-under-the-language
moduleId: evm-yul-assembly
grain: block
kind: read
title: Read the Yul your Solidity compiles to, and find the pipeline's fingerprint
difficulty: 3
concepts: [yul-is-the-middle-layer, via-ir-pipeline, verbatim-escape-hatch]
spec: >
  Solidity does not compile to bytecode directly, and reading the layer in between changes how you read
  the language above it.

  DUMP IT. Take one contract of moderate size and emit its Yul. Find, in that output, three things you
  wrote in Solidity and name what the middle layer turned each into — a modifier, a require, and a
  mapping access are a good set. Quote the Yul for each.

  TWO PIPELINES. Compile the same source with and without the IR pipeline. Report both bytecode sizes and
  both gas figures for one function, and then find one behavioural or structural difference in the output
  that is not just a size change. State which pipeline you would ship and why.

  THE ESCAPE HATCH. Use `verbatim` to emit one instruction the Yul dialect does not otherwise expose.
  Show it in the output. Then state plainly what you gave up by using it — what the compiler can no
  longer do for that code — and one situation in which the trade is worth it.
acceptance:
  criteria:
    - Yul output is emitted for a real contract
    - A modifier, a require and a mapping access are each located in the Yul with the generated code quoted
    - The same source is compiled with and without the IR pipeline, with both bytecode sizes and a function's gas reported
    - One difference beyond size is identified between the two pipelines
    - A pipeline choice is stated with a reason
    - verbatim is used to emit an otherwise unavailable instruction, shown in the output
    - What the compiler can no longer do for that code is stated, with one situation where the trade is worth it
hints:
  - Start with the mapping access. It is the one whose Yul is shortest and most recognisable, and finding it teaches you to read the rest of the output.
  - The non-size pipeline difference is usually in how the stack is managed. Compare the same function's Yul between the two rather than diffing the whole file.
  - For verbatim, pick an instruction you can verify executed. Emitting something you cannot observe proves the syntax worked and nothing else.
