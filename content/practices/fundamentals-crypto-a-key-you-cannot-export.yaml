id: fundamentals-crypto-a-key-you-cannot-export
moduleId: fundamentals-crypto
grain: block
kind: implement
title: Sign with a curve Ethereum could not verify until recently, then commit to a secret
difficulty: 3
concepts: [secp256r1-p256, p256verify-precompile, commitment, hash-commitment]
spec: >
  Two things a contract can now do that it could not before, and one property that binds them.

  THE OTHER CURVE. Produce a P-256 signature — from a device secure element if you have one, otherwise
  from a library — and verify it on chain through the precompile. Report the gas. Then verify the same
  signature the old way, in Solidity without the precompile, and report that gas too. State the ratio,
  because that ratio is the entire reason this is newly practical.

  Then say precisely what a P-256 key held in a phone's secure element gives you that a secp256k1 key
  in application memory does not, and what it takes away.

  THE COMMITMENT. Implement a hash commitment: commit now, reveal later, verify the reveal matches.
  Then break a naive version — commit to a value from a small set and recover it by brute force — and
  fix it. A comment states which of the two commitment properties your naive version failed, and which
  the fix restored.
acceptance:
  command: forge test --junit --match-path test/P256AndCommit.t.sol
  criteria:
    - A P-256 signature verifies on chain through the precompile, with the gas reported
    - The same signature verifies via Solidity without the precompile, with the gas reported and the ratio stated
    - The write-up states what a secure-element key gains and what it costs, against a key in application memory
    - A hash commitment is implemented with commit, reveal and verification
    - A naive commitment over a small value set is broken by brute force
    - A comment names which commitment property failed and which the fix restored
hints:
  - Get the precompile call working with a known-good test vector before you generate your own signature. Two things can be wrong at once otherwise and they look identical.
  - The gas ratio is the finding. Quote both numbers rather than saying the precompile is cheaper.
  - For the naive commitment, do not add a salt yet. Watch the brute force succeed first — the fix means much more once you have seen what it is fixing.
