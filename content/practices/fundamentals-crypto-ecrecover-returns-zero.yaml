id: fundamentals-crypto-ecrecover-returns-zero
moduleId: fundamentals-crypto
grain: block
kind: fix
title: Authorise yourself as an owner who was never set
concepts: [ecrecover, ecdsa-secp256k1, domain-separator]
spec: >
  You are given a contract with an `owner` address that is left unset in one deployment path,
  and an `execute(bytes32 hash, uint8 v, bytes32 r, bytes32 s)` function that calls `ecrecover`
  and requires the result to equal `owner`. Write a failing test that authorises a privileged
  call using a signature that is not valid at all — a malformed `v`, or an `s` above the curve
  order — exploiting the fact that `ecrecover` returns `address(0)` rather than reverting.
  Then fix the contract so the same call reverts, and add a second test showing that a
  correctly signed call by the real owner still succeeds. State in a comment which of the two
  defects you fixed — the missing zero check, or the uninitialised owner — and why fixing only
  one is insufficient.
acceptance:
  command: forge test --match-path test/EcrecoverZero.t.sol -vvv
  criteria:
    - A test proves a privileged call succeeds with a signature that recovers to address(0)
    - The test asserts explicitly that the recovered address is address(0)
    - After the fix, the same call reverts with a named error
    - A separate test proves a genuine owner signature still authorises the call after the fix
hints:
  - Read the return type of `ecrecover` and then ask what it returns when it cannot recover anything. It does not revert.
  - A `v` outside {27, 28}, or an `s` greater than the curve order, is enough. You do not need a valid key.
  - The minimal fix is `if (recovered == address(0) || recovered != owner) revert`. The real fix also refuses to deploy or initialise with a zero owner.
difficulty: 2
