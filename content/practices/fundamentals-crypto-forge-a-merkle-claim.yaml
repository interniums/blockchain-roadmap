id: fundamentals-crypto-forge-a-merkle-claim
moduleId: fundamentals-crypto
grain: module
writeUp: >
  Pick one authorisation flow in a product you have shipped — a password reset link, a signed upload URL, an API token. Write down exactly what its signature or token proves, and what it does not. Then name the one assumption that, if wrong, would let someone replay it. Which of the three failures in this module is it closest to: a missing domain separator, a non-unique identifier, or a proof of membership in a set nobody checked the shape of?
coversConcepts:
  - hash-function
  - preimage-resistance
  - second-preimage-resistance
  - collision-resistance
  - keccak-vs-sha3
  - keypair
  - ecdsa-secp256k1
  - ecrecover
  - signature-malleability
  - low-s-normalisation
  - eip-712-typed-data
  - domain-separator
  - secp256r1-p256
  - p256verify-precompile
  - commitment
  - hash-commitment
  - merkle-tree
  - merkle-inclusion-proof
  - merkle-second-preimage
  - sorted-pair-hashing
  - domain-separated-hashing
kind: break
title: Claim an airdrop for an address that was never in the tree
concepts: [merkle-second-preimage, merkle-inclusion-proof, sorted-pair-hashing, domain-separated-hashing]
spec: >
  Build a Merkle airdrop in Foundry. Leaves are `keccak256(abi.encode(address, uint256))` —
  64 bytes of pre-image — internal nodes are `keccak256(left ‖ right)` with sorted pairs, and
  the contract accepts `(address, amount, bytes32[] proof)` and pays out if the proof verifies
  against a stored root. Populate a small tree with real recipients. Then, acting as an
  attacker who has only the public tree, construct a claim whose "leaf" is actually an internal
  node of the tree, and drain a payout for a recipient the tree never contained. Finally fix it
  by domain-separating the leaf hash and prove the same forgery now reverts. Do not change the
  proof-verification loop; the fix belongs in the leaf encoding.
acceptance:
  command: forge test --match-path test/MerkleForgery.t.sol -vvv
  criteria:
    - A test proves a forged claim succeeds against the naive tree and transfers tokens to an address absent from the recipient list
    - The test names, in an assertion or comment, which internal node was reused as the forged leaf
    - After the fix, the identical forged calldata reverts while every legitimate recipient still claims successfully
    - The fix is in the leaf encoding, not in the proof loop or in an address allowlist
hints:
  - Count the bytes that go into a leaf hash and the bytes that go into an internal node hash. If both are 64, what stops one being read as the other?
  - You do not need to find a hash collision. Pick an existing internal node, treat its two children as your proof, and work out what `(address, amount)` pair would have to encode to that node's pre-image.
  - Prefix the leaf pre-image with a byte that can never appear at the start of an internal node's pre-image — `keccak256(bytes.concat(0x00, abi.encode(addr, amt)))` — or double-hash the leaf. Then re-run the attack unchanged.
difficulty: 4
