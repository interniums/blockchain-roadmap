id: fundamentals-crypto-malleable-double-spend
moduleId: fundamentals-crypto
grain: block
kind: break
title: Spend one approval twice by mirroring its signature
concepts: [signature-malleability, low-s-normalisation, ecrecover]
spec: >
  Write a Foundry test against a small payout contract that verifies an owner's signature with
  `ecrecover` and records `usedSignatures[keccak256(signature)] = true` as its replay guard.
  Produce a valid signature with `vm.sign`, spend once, then derive the mirrored signature
  `(r, n − s)` with the flipped recovery byte and spend a second time against the same
  approval. `n` is the secp256k1 curve order. Then fix the contract two ways and keep both
  fixes: reject any signature whose `s` exceeds half the curve order, and move the replay key
  off the signature bytes onto a message-derived nonce. Show that each fix alone blocks the
  mirrored signature, and explain in a comment why only the second one also blocks a genuine
  re-submission of the original bytes.
acceptance:
  command: forge test --match-path test/Malleability.t.sol -vvv
  criteria:
    - A test spends the same approval twice using two different signature byte strings and asserts the balance moved twice
    - Both signatures are shown to recover to the same signer address
    - A test asserts the mirrored signature reverts once low-s rejection is added
    - A test asserts that replaying the original signature bytes still succeeds under low-s-only, and fails once the nonce-based replay key is in place
hints:
  - Both signatures are valid over the same digest and recover to the same address. Only the bytes differ, and the guard keys on the bytes.
  - The secp256k1 order `n` is `0xFFFFFFFF FFFFFFFF FFFFFFFF FFFFFFFE BAAEDCE6 AF48A03B BFD25E8C D0364141`. Compute `n - s` and flip `v` between 27 and 28.
  - Low-s rejection is `require(uint256(s) <= n / 2)`. That closes the mirror but not resubmission — for that, key the guard on an incrementing nonce that is part of the signed digest.
difficulty: 3
