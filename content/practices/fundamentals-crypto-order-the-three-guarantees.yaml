id: fundamentals-crypto-order-the-three-guarantees
moduleId: fundamentals-crypto
grain: block
kind: measure
title: Rank the three hash guarantees by what it costs to break each
difficulty: 2
concepts: [hash-function, preimage-resistance, second-preimage-resistance, collision-resistance, keccak-vs-sha3]
spec: >
  The three properties a hash offers are not equally strong, and the weakest one is the one most
  protocol code depends on. Establish the ordering with numbers rather than adjectives.

  For a 256-bit digest, state the expected work to break preimage, second-preimage and collision
  resistance, and show the arithmetic — including why the collision figure is half the digest length
  rather than the whole of it. Then, for each of three real uses of a digest in Ethereum — a
  transaction hash, a Merkle root, a storage key — say which of the three properties that use actually
  depends on, and what an attacker who broke it could do.

  Then the identity trap. Hash the same input with `keccak256` and with SHA3-256 and show the digests
  differ. Print both, and name the specific difference in the construction that causes it.
acceptance:
  command: forge test --junit --match-path test/HashGuarantees.t.sol
  criteria:
    - Expected work for all three properties is stated for a 256-bit digest, with the arithmetic shown
    - The write-up explains why collision resistance is half the digest length
    - Three real uses of a digest are each mapped to the property they depend on, with the consequence of breaking it
    - A test shows keccak256 and SHA3-256 producing different digests for the same input, with both printed
    - The construction difference responsible is named specifically
hints:
  - Do the arithmetic before looking up the numbers. The birthday bound is the whole reason the ordering exists and deriving it once makes the ordering impossible to forget.
  - For the three uses, the interesting one is the storage key. Work out what an attacker gains from a collision there rather than assuming it is the same as for a transaction hash.
  - The difference between the two functions is one padding rule. Find it in the spec rather than in a blog post, because most secondary sources describe it as a version change.
