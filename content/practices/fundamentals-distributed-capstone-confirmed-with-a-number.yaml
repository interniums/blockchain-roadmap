id: fundamentals-distributed-capstone-confirmed-with-a-number
moduleId: fundamentals-distributed
grain: module
writeUp: >
  Choose one irreversible action your product takes in response to an on-chain event — shipping goods, crediting a balance, releasing a file. Write the confirmation policy you would defend to a risk reviewer: how many blocks, or finalised only, and what the number is derived from. Then state what you would do differently if the same action were worth a hundred times more.
coversConcepts:
  - state-machine-replication
