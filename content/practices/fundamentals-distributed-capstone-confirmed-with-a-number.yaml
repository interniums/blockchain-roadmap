kind: write
title: Turn "confirmed" into a number, for three products that need different ones
difficulty: 4
concepts: [state-machine-replication, determinism-requirement, byzantine-fault, safety-property, liveness-property, availability-finality-dilemma, finality-is-a-spectrum, casper-ffg, lmd-ghost, ebb-and-flow]
spec: >
  Three products, three confirmation policies, one document that defends all three from the same
  first principles.

  THE PRODUCTS. A game that mints an item worth about a dollar. An exchange crediting a deposit worth
  about fifty thousand. A bridge releasing about five million on the other side.

  For each, choose head, justified or finalized, name a depth, and state the cost of reversal at that
  depth as a number in ETH. Three different answers, or you have not done the exercise.

  THEN THE PART THAT IS ACTUALLY THIS MODULE. For each policy, say which property you are trading:
  under what partition does it fail safety, and under what partition does it fail liveness? You are
  not allowed to claim both. Name the protocol — Casper FFG or LMD-GHOST — that governs the guarantee
  you are relying on in each case, and say what the other one is doing meanwhile.

  DETERMINISM. Take three real incidents where clients disagreed. Classify each as a safety failure,
  a liveness failure, or neither, and for each say which determinism requirement was violated or
  which one held and prevented worse. "Neither" is a legitimate and common answer.

  MEASURE. Instrument one node for an hour and report the actual distance between head and finalized,
  as a distribution rather than a number. Then say whether any of your three policies would have
  behaved differently during that hour than your document claims.
acceptance:
  command: 'true'
  criteria:
    - Three products get three different policies, each with a level, a depth and a reversal cost in ETH
    - Each policy names the property it trades and the partition under which it fails, and never claims both safety and liveness
    - Each policy names whether Casper FFG or LMD-GHOST governs the guarantee it relies on, and what the other is doing at the time
    - Three real client-disagreement incidents are each classified safety, liveness or neither, with the determinism requirement involved named
    - Head-to-finalized distance over an hour is reported as a distribution, from your own instrumentation
    - The document says whether the measured hour would have changed any of the three policies, rather than assuming it would not
hints:
  - Write the bridge policy first. It is the one where the honest answer is uncomfortable, and having it on the page keeps the other two from drifting into optimism.
  - When you catch yourself claiming a policy is both safe and live under partition, you have found the availability-finality dilemma in your own reasoning. Say which one you are giving up.
  - For the incidents, look for the ones where nothing bad happened. A near-miss tells you which determinism requirement was load-bearing far more clearly than an outage does.
