id: fundamentals-distributed-classify-three-incidents
moduleId: fundamentals-distributed
grain: block
kind: write
title: Classify three real chain incidents as safety, liveness, or neither
concepts: [safety-property, liveness-property, availability-finality-dilemma, byzantine-fault]
spec: >
  Pick three documented incidents on Ethereum or any L2 — a finalisation stall, a deep reorg, a
  client consensus bug, a sequencer outage. For each, write a page that states exactly what was
  violated: which property, whose guarantee, and what the observable evidence was. Classify
  each as a safety failure, a liveness failure, or neither, and defend the classification
  against the most plausible counter-reading. Explicitly say for each whether an ordinary user
  could have detected it from an RPC endpoint alone. The exercise fails if any of the three
  analyses uses the phrase "the chain went down" without saying which property that maps to.
acceptance:
  command: npx markdownlint docs/incidents/*.md && node scripts/check-incident-writeup.mjs docs/incidents
  criteria:
    - Three separate write-ups exist, each citing a primary post-mortem or client release note
    - Each names the violated property explicitly and defends the classification against one counter-reading
    - At least one incident is classified as neither, with the reasoning given
    - Each write-up states whether the failure was observable from a single RPC endpoint
hints:
  - Start from the definitions, not the incident. Safety is "two conflicting things were both finalised". Liveness is "nothing progressed". Most incidents are neither.
  - A client bug that made one implementation compute a different state root is not automatically a safety failure of the protocol — ask what actually finalised.
  - The "neither" case is usually a degradation of a service built on top of the chain rather than of the chain itself. Say whose guarantee broke.
difficulty: 3
