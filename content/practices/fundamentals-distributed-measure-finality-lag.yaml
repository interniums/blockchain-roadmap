id: fundamentals-distributed-measure-finality-lag
moduleId: fundamentals-distributed
grain: block
kind: measure
title: Measure the gap between the head and what is actually finalised
concepts: [finality-is-a-spectrum, casper-ffg, ebb-and-flow]
spec: >
  Sample `latest`, `safe` and `finalized` block numbers from an RPC endpoint once per slot for
  at least one hour. Report the observed lag from head to finalised in both blocks and seconds,
  as a distribution rather than an average, and note any sample where the gap exceeded the
  nominal two-epoch expectation. Then take the set of transactions included in blocks that were
  in the gap at some sample and state, for each of three hypothetical product actions of
  increasing value, which of the three markers you would gate on and why. The deliverable is
  the distribution plus a confirmation-policy recommendation with the number attached.
acceptance:
  command: node scripts/finality-lag.mjs --minutes 60 --out results/finality-lag.json
  criteria:
    - At least 250 samples of (latest, safe, finalized) with local timestamps are recorded
    - Head-to-finalized lag is reported as a distribution in both blocks and seconds, not a single mean
    - Any sample exceeding the nominal two-epoch expectation is flagged with its timestamp
    - A written recommendation gates three product actions on named markers, each justified by a number from the data
hints:
  - '`eth_getBlockByNumber` accepts the string tags `safe` and `finalized`; you do not need a beacon API for this.'
  - Convert the block gap to seconds using observed timestamps rather than assuming a fixed slot time, so a missed slot shows up in your data.
  - A recommendation of "wait for finalized" for everything is not an answer. Say what latency that costs your user and where the trade stops being worth it.
difficulty: 2
