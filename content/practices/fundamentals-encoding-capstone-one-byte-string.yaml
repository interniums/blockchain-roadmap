id: fundamentals-encoding-capstone-one-byte-string
moduleId: fundamentals-encoding
grain: module
writeUp: >
  Find a place in your own systems where you hash or sign a concatenation of values — a cache key, a webhook signature, an idempotency key. Write out whether two different inputs could produce the same concatenation, and what would happen if they did. Then decide: would you fix it by adding a delimiter, by length-prefixing, or by hashing each field separately? Say why the other two are worse.
coversConcepts:
  - byte-word-32
  - endianness
  - abi-encoding
  - function-selector
  - abi-encode-vs-packed
  - packed-hash-collision
  - rlp
  - ssz
  - ssz-merkleization
  - canonical-serialization
kind: implement
title: Three encodings, one byte string, and the collision that connects them
difficulty: 4
concepts: [abi-encoding, rlp, ssz, canonical-serialization, packed-hash-collision, function-selector, endianness, byte-word-32]
spec: >
  Write a single codec library that speaks all three of this module's encodings, and then use it to
  demonstrate the failure that connects them.

  ABI. Encode and decode a call with a dynamic argument — a `bytes` and a `string[]` — from scratch.
  Head and tail, offsets in words, right-padding for bytes and left-padding for numbers. Round-trip
  a real mainnet calldata blob and assert you reproduce it byte for byte, selector included, with the
  selector derived from the signature rather than looked up.

  RLP. Encode and decode the same transaction envelope. Prove your implementation rejects a
  non-canonical encoding: a length prefix that could have been shorter, and a leading zero on an
  integer. Both must fail, and your error must say which rule they broke.

  SSZ. Encode a fixed-size container and a variable-size one, and compute the Merkle root of each.
  Show that the root of a container with one field changed differs, and that the root of the same
  logical value encoded twice does not.

  THE COLLISION. Construct two distinct argument tuples whose `abi.encodePacked` output is
  byte-identical, and use them to pass a check that hashes the packed bytes. Then show the same two
  tuples produce different `abi.encode` output and fail the same check. This is the whole module in
  one test: an ambiguous encoding is one you cannot safely hash.
acceptance:
  command: forge test --junit --match-path test/capstone/Encoding.t.sol
  criteria:
    - Real mainnet calldata with at least one dynamic argument round-trips byte-for-byte through your own ABI codec, with the selector derived from the signature
    - A real transaction round-trips through your own RLP codec byte-for-byte
    - A non-minimal length prefix and a leading-zero integer are both rejected, each with an error naming the canonicality rule broken
    - SSZ Merkle roots change when a field changes and are stable across two encodings of the same value
    - Two distinct argument tuples produce identical abi.encodePacked bytes, demonstrated rather than asserted
    - Those two tuples pass a check that hashes the packed bytes, and fail the same check under abi.encode
    - No test uses a library encoder or decoder for the format it is testing
hints:
  - Do RLP first. It is two rules and a length prefix, it round-trips or it does not, and getting it right teaches you to read the ABI spec's offsets as the same kind of object.
  - For the ABI dynamic case, encode by hand on paper once. The head/tail split stops being confusing the moment you have written out where each offset points and counted the words yourself.
  - The collision is easiest with two dynamic arguments whose contents can be shifted across the boundary between them. You are looking for a pair where the concatenation is the same and the split is different.
