id: fundamentals-encoding-collide-a-packed-authorisation
moduleId: fundamentals-encoding
kind: break
title: Pass an authorisation check with the wrong arguments
concepts: [packed-hash-collision, abi-encode-vs-packed, function-selector]
spec: >
  Write a contract that grants a role when `keccak256(abi.encodePacked(scope, action))` matches
  a stored permission hash, where both `scope` and `action` are `string`. Register the
  permission for one pair. Then, in a Foundry test, call the function with a different pair
  that packs to the same bytes and obtain the role you were not granted. Measure and record the
  calldata size and gas of both `abi.encode` and `abi.encodePacked` for the same arguments, so
  the saving being traded away is a number rather than a feeling. Fix the contract with
  `abi.encode` and prove the colliding pair now fails while the legitimate pair still passes.
acceptance:
  command: forge test --match-path test/PackedCollision.t.sol -vvv --gas-report
  criteria:
    - A test grants the role using a (scope, action) pair different from the registered one, and asserts the role was granted
    - The test asserts the two packed encodings are byte-identical while the two argument tuples are not
    - A recorded gas and byte-size comparison of abi.encode versus abi.encodePacked for the same inputs is present in the test output
    - After switching to abi.encode, the colliding pair reverts and the legitimate pair still succeeds
hints:
  - Packed encoding writes each string's bytes with no length prefix and no separator. What does that make the boundary between two of them?
  - '`("ADMIN", "WITHDRAW")` and `("ADMINWITH", "DRAW")` are the shape you are looking for.'
  - '`abi.encode` length-prefixes every dynamic argument, which is what restores the boundary. Take the gas measurement before you switch so you can state what the fix costs.'
difficulty: 2
