id: fundamentals-encoding-rlp-roundtrip-a-real-tx
moduleId: fundamentals-encoding
kind: implement
title: Write RLP from scratch and round-trip a real mainnet transaction
concepts: [rlp, canonical-serialization, byte-word-32]
spec: >
  Implement an RLP encoder and decoder in TypeScript with no serialization dependency. Support
  byte strings and nested lists, both short and long length forms. Reject non-canonical input
  on decode: leading zero bytes in a length, a long-form prefix used where the short form
  applies, and trailing bytes after a complete item. Then fetch a real mainnet transaction's
  raw bytes with `cast tx <hash> --raw`, decode it into its field list, re-encode it, and
  assert byte equality with what the node returned. Include a property test that round-trips
  ten thousand randomly generated nested structures, and a table of at least six rejected
  non-canonical inputs with the reason each was rejected.
acceptance:
  command: npx vitest run test/rlp.test.ts
  criteria:
    - Encoding the decoded fields of a real raw transaction reproduces the original bytes exactly
    - A property test round-trips 10,000 random nested byte-string/list structures with no mismatch
    - At least six distinct non-canonical encodings are rejected, each with a distinguishable error
    - The decoder never allocates based on an unvalidated length prefix
hints:
  - There are only two types. Everything else is a length-prefix rule keyed on the first byte's range.
  - The awkward cases are the single-byte value below 0x80, which encodes as itself, and the empty string, which is 0x80.
  - For the canonicality tests, take a valid encoding and re-encode it deliberately wrong — long form for a 3-byte string, a length with a leading zero — then assert your decoder rejects each.
difficulty: 3
