id: fundamentals-exit-verify-without-trust
moduleId: fundamentals-incentives
grain: exit
trackId: fundamentals
kind: implement
title: Believe a number about mainnet without trusting anyone who told you it
difficulty: 5
concepts:
  - cost-of-attack
  - security-is-a-price
  - confirmation-policy
  - attack-cost-is-not-attack-profit
spec: >
  Build one command-line tool, `attest`, that takes an address, a slot and a block number and prints
  a balance, a storage value and a confirmation verdict — where every line of that output is
  something you verified rather than something an RPC asserted.

  It has four parts, and they are the six modules of this track in one artefact.

  ONE. Fetch `eth_getProof` for the address and slot at that block, and verify the account proof
  against the block's `stateRoot` and the storage proof against the account's `storageRoot`, walking
  the trie yourself. Not a library that says "valid" — your code has to hash the nodes, follow the
  nibbles, and reach the root. It must also verify an ABSENCE: prove that an address you pick has no
  account, and say which node type ends that walk.

  TWO. Get the block header by RPC, re-hash it yourself, and confirm it matches the block hash you
  asked for. If it does not, you have caught the node lying and the tool must say so and stop.

  THREE. Take one transaction from that block and decode it from raw bytes with no ABI decoder:
  envelope type, then selector, then arguments. Re-encode the arguments and assert you get the same
  bytes back. A round trip that does not reproduce the input is a failure, not a rounding error.

  FOUR. Print a confirmation verdict for a stated value at risk, which the caller passes in. Not
  "12 blocks" — a depth, plus the ETH an attacker would have to destroy to reverse it, plus the
  sentence that says whether that is more or less than the value at risk. If the attack is cheaper
  than the prize, the tool says the value is not safe at any depth it can offer.
acceptance:
  command: forge test --match-path test/exit/Attest.t.sol
  criteria:
    - A valid eth_getProof response verifies against the block's stateRoot with the trie walk implemented in your own code, not delegated to a library
    - Mutating any single byte of the proof, the account value or the root causes verification to fail rather than to pass or to throw an unhandled error
    - A non-existent address produces a proof of absence that verifies, and the tool names the node type that terminates the walk
    - The block header re-hashes to the requested block hash, and a deliberately corrupted header is reported as the node lying rather than as a bug in the tool
    - One real transaction round-trips: raw bytes to envelope type, selector and typed arguments, and back to byte-identical calldata
    - The confirmation verdict states a depth AND the ETH destroyed to reverse it AND whether that exceeds the value at risk the caller passed
    - For a value at risk above the cost of reversal, the tool refuses to certify any depth and says why
hints:
  - Do the storage proof before the account proof. It is the same walk with a shorter key, and it fails in more legible ways while you are still getting the nibble handling right.
  - The absence case is where most implementations quietly pass by accident. Decide up front what your walk returns when it runs out of path, and make the empty node its own explicit result rather than a null.
  - The confirmation verdict is not a lookup table. It is the finality-reversal cost model from the last module, evaluated with today's stake — which means the tool has to read the current validator set size from somewhere and say where it got it.
writeUp: >
  Every number your tool prints is now traceable to something you checked. Pick the one you are
  least comfortable defending, and say what you would have to build next to stop trusting whatever
  it still rests on.
