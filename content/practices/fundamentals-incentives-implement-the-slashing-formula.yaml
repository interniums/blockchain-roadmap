kind: implement
title: Code the slashing arithmetic and find where the curve is undecided
concepts: [slashing-initial-penalty, slashing-correlation-penalty, slashing-is-anti-correlation-not-anti-error, accountable-safety]
spec: >
  Implement `penalty(effectiveBalanceGwei, slashedBalanceInWindowGwei, totalBalanceGwei)`
  returning the initial and correlation terms separately, with the constants read out of
  `ethereum/consensus-specs` rather than from any blog post — cite the file and function you
  took each from. Then plot the total penalty as a fraction of effective balance against the
  fraction of total stake slashed in the window, from zero to one third, under both candidate
  correlation formulas: the linear form and the quadratic form. Report where the two curves
  diverge and where they coincide, and state which one your reading of `process_slashings`
  says is live — or, honestly, that you could not tell and what evidence would settle it.
acceptance:
  command: npx vitest run test/slashing.test.ts
  criteria:
    - Every constant used is annotated with the consensus-specs file and symbol it came from
    - The function returns effectiveBalance exactly when slashedBalanceInWindow equals totalBalance divided by three, under both candidate formulas
    - A generated plot or table shows both curves from 0 to 1/3 of total stake and marks where they diverge
    - The write-up states which formula the specs indicate is live, or states plainly that it is unresolved and names the evidence that would settle it
hints:
  - Start from `slash_validator` for the initial term and `process_slashings` for the correlation term; the window constant and the midpoint at which the correlation penalty is applied both live in the spec constants.
  - The two published candidate forms are `3 * EB * SB / TB` and `9 * EB * SB^2 / TB^2`. Substitute `SB = TB/3` into both before you plot anything.
  - Integer arithmetic in Gwei with the spec's increment rounding is part of the exercise. Floating point will pass your own tests and disagree with the spec at the edges.
difficulty: 4
