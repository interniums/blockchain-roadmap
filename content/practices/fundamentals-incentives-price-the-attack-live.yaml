id: fundamentals-incentives-price-the-attack-live
moduleId: fundamentals-incentives
grain: block
kind: measure
title: Price a finality reversal from live data, in ETH, refusing to guess
concepts: [finality-reversal-cost-model, cost-of-corruption-vs-cost-of-capital, security-is-a-price, attack-cost-is-not-attack-profit]
spec: >
  Write a script that fetches the current total staked ETH and active validator count from a
  live source — a beacon node's validator aggregate, or a public beacon-chain API — and
  computes the one-third-of-stake finality-reversal cost in ETH, stamped with the fetch time
  and the source URL. The script must refuse to print any fiat figure unless an explicit price
  argument is supplied, and when one is supplied it must label the output as a derived estimate
  with the price and timestamp attached. Alongside the number, produce a one-page memo naming
  a specific application — a bridge, an exchange deposit flow, an L2 exit — and stating which
  threshold each of its trust assumptions actually depends on: cheap unfinalised reorg,
  majority-stake censorship, or finality reversal.
acceptance:
  command: node scripts/attack-cost.mjs --source beacon --out results/attack-cost.json
  criteria:
    - Output contains total staked ETH, validator count, the derived one-third figure in ETH, the fetch timestamp and the source URL
    - Running without a --eth-price argument prints no fiat figure and exits successfully
    - Running with --eth-price labels the fiat output as derived and echoes the price and timestamp used
    - The memo maps at least three distinct trust assumptions of one named application onto the three attack thresholds, each with a number
hints:
  - Do not multiply validator count by 32. Since EIP-7251, effective balances range up to 2048 ETH, so count and stake have decoupled — read the aggregate balance instead.
  - Reported August 2026 staked totals disagree between sources. Record which source you used and its timestamp in the output rather than picking the number you like.
  - 'The memo is the harder half. For each assumption ask: would this break if a single unfinalised block were reorged? If transactions were censored for an hour? Only the third question is about finality reversal.'
difficulty: 3
