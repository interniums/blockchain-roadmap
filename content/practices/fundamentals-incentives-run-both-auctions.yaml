id: fundamentals-incentives-run-both-auctions
moduleId: fundamentals-incentives
grain: block
kind: measure
title: Run both auctions against a strategic bidder and watch one of them fail
difficulty: 3
concepts: [mechanism-design, incentive-compatibility, first-price-auction, second-price-auction, dsic, mmic, oca-proofness]
spec: >
  Simulate both auction formats with bidders who lie when lying pays, and show which format survives.

  THE SIMULATION. Implement a first-price and a second-price auction over the same private valuations.
  Give each bidder two strategies: bid your true value, or shade it. Run both formats and report, for
  each: revenue, allocation efficiency, and how much a shading bidder gained over a truthful one.

  In the first-price auction, shading pays. Show by how much, and show that the amount depends on
  beliefs about other bidders — which is the practical objection, not the theoretical one.

  In the second-price auction, show truthful bidding is optimal for a bidder against any opponent
  strategy you try. That is incentive compatibility, demonstrated rather than asserted.

  THEN WHY IT IS STILL A TRAP HERE. One party in a blockchain fee auction is also the auctioneer.
  Add a bidder who runs the auction: let them see all bids and insert their own afterwards. Show the
  second-price guarantee collapsing, and state which of the three properties — DSIC, MMIC, OCA-proofness
  — that violates. Then say which of the three the other two formats each fail, so all three properties
  have been distinguished by a concrete failure rather than by definition.
acceptance:
  command: forge test --junit --match-path test/Auctions.t.sol
  criteria:
    - Both auction formats are simulated over identical private valuations
    - Revenue, allocation efficiency and the shading bidder's gain are reported for each format
    - First-price shading gain is quantified and shown to depend on beliefs about other bidders
    - Truthful bidding is shown optimal in the second-price format against several opponent strategies
    - An auctioneer who bids last is shown collapsing the second-price guarantee
    - That collapse is attributed to a specific one of DSIC, MMIC or OCA-proofness
    - Each of the three properties is distinguished by a concrete failure rather than by definition
hints:
  - Implement the bidders as strategies rather than as numbers. The whole point is that a bidder responds to the format, and hard-coded bids cannot show that.
  - The belief-dependence of first-price shading is the practical finding. Run it with bidders who guess wrong about the field and watch efficiency fall.
  - For the auctioneer-bidder, do not model it as cheating. Model it as being allowed to bid last with full information, which is exactly the position a block builder is in.
