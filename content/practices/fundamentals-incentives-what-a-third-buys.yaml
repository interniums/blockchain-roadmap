id: fundamentals-incentives-what-a-third-buys
moduleId: fundamentals-incentives
grain: block
kind: measure
title: Price what each fraction of the stake buys, and where the fee actually goes
difficulty: 3
concepts: [base-fee-burn, eip-1559-tfm, attack-threshold-one-third, attack-threshold-one-half, cheap-reorgs-exist]
spec: >
  Two questions about where value moves, answered with live numbers.

  THE BURN. For a block you choose, compute how much of the total fee paid was burned and how much
  reached a validator. Show the arithmetic from the base fee, the priority fee and the gas used. Then
  answer the design question: what would go wrong if the base fee were paid to the proposer instead?
  Name the specific behaviour it would create — this is the fee mechanism's whole reason for burning.

  THE THRESHOLDS. Compute, from live stake figures, what it costs in ETH to reach one third and one
  half of the stake. For each, state what that fraction actually buys: which specific guarantee stops
  holding, and whether the attacker keeps their stake afterwards.

  THEN THE UNCOMFORTABLE PART. Show that a reorg of small depth does not require anything like a third.
  Find the actual requirement for a one-block or two-block reorg, state it as a fraction and as ETH, and
  say what that means for a product that treats one confirmation as settled. That gap between the
  headline thresholds and the cheap case is the thing this exercise exists to surface.
acceptance:
  criteria:
    - Burned and validator-received fee amounts are computed for a real block with the arithmetic shown
    - The write-up names the specific behaviour that paying base fee to the proposer would create
    - The ETH cost of reaching one third and one half of the stake is computed from live figures
    - For each threshold the guarantee that stops holding is named, along with whether the attacker retains their stake
    - The requirement for a shallow reorg is stated as both a fraction and an ETH figure
    - The consequence for a product treating one confirmation as settled is stated
hints:
  - Get the base fee and the priority fee for the block separately. If you only have the effective gas price you cannot split the burn from the tip, which is the whole first half.
  - For the thresholds, use the actual staked total rather than a round number. The cost is large enough that a 10% error changes how the sentence reads.
  - The shallow-reorg number is much smaller than people expect and it is the one worth remembering. Find it from the fork-choice rule rather than from the slashing thresholds.
