id: fundamentals-networks-capstone-own-a-nodes-reality
moduleId: fundamentals-networks
grain: module
writeUp: >
  Your product shows a user "transaction pending". Write down precisely what your backend observed to justify that word, which node observed it, and what would have to be true for a different node to disagree. Then state the shortest change to your UI copy that would still be true if the node you queried had been eclipsed.
coversConcepts:
  - p2p-overlay
  - devp2p
  - discv5
  - gossipsub
  - propagation-latency
  - mempool-is-not-a-queue
  - eclipse-attack
  - sybil-resistance
kind: measure
title: Own everything one node believes, and prove the mempool is a rumour
difficulty: 4
concepts: [p2p-overlay, discv5, gossipsub, propagation-latency, mempool-is-not-a-queue, eclipse-attack, sybil-resistance, devp2p]
spec: >
  Stand up two nodes you control and produce a report, backed by captured data, on how differently
  the same network looks from two places in it.

  ONE. Map the overlay from both nodes: peer count, peer churn over an hour, and what fraction of
  each node's peers the other also has. Say which discovery protocol produced each peer set.

  TWO. Measure propagation. For fifty blocks, record the millisecond each node learned about it and
  plot the distribution of the gap. State the median and the worst case, and say which one a product
  would have to design against.

  THREE. Diff the mempools once a second for ten minutes. Report how many transactions were in
  exactly one of the two, how long the median disagreement lasted, and the largest single-moment
  divergence. Then state plainly what "the mempool" can and cannot mean to code that reads it.

  FOUR. Demonstrate the eclipse in miniature. Without attacking anything real: configure one node to
  peer only with peers you control, feed it a view of the chain that differs from the other node's,
  and show it acting on that view. State how many peers you had to control and what would have made
  that harder — which is the sybil-resistance question, answered with your own number.
acceptance:
  criteria:
    - Peer sets from both nodes are captured with churn over at least an hour and the overlap between them stated as a fraction
    - Each peer set is attributed to the discovery protocol that produced it
    - Propagation gaps across fifty blocks are recorded in milliseconds with a median and a worst case, and the report says which one a product must design against
    - Mempool diffs over ten minutes report transactions present in exactly one node, the median disagreement duration, and the largest divergence
    - The report states what code reading "the mempool" can and cannot rely on, in terms of the measurements taken
    - A node peered only with peers you control acts on a view of the chain the other node does not share, demonstrated with captured evidence
    - The number of peers required for that is stated, along with what would have made it harder
hints:
  - Run both nodes on different networks if you can — two nodes in the same datacentre share too much of their peer set and the propagation gap collapses to noise.
  - For the mempool diff, log transaction hashes with timestamps rather than snapshots. The interesting number is how long a disagreement lasted, and snapshots cannot tell you that.
  - The eclipse does not need many peers, and that is the finding. Count them and compare against the node's configured maximum before you conclude anything about how hard it would be.
