id: fundamentals-networks-diff-two-mempools
moduleId: fundamentals-networks
kind: measure
title: Prove the mempool is a local opinion by diffing two of them
concepts: [mempool-is-not-a-queue, p2p-overlay, propagation-latency]
spec: >
  Snapshot the pending transaction set from two independent nodes at as close to the same
  instant as you can manage, repeatedly, for at least twenty samples. For each sample compute
  the intersection, the two disjoint sets, and the Jaccard overlap. Then take the transactions
  that appeared in only one pool and check, once they land, how long they took to be included
  compared with those seen by both. Write up what the numbers say about the phrase "the
  mempool", and state what your product would have to do differently if it currently treats
  one provider's pending set as the truth.
acceptance:
  command: node scripts/mempool-diff.mjs --samples 20 --out results/mempool-diff.json
  criteria:
    - Twenty or more paired snapshots are recorded with per-sample intersection and disjoint counts
    - Jaccard overlap is reported per sample with a summary statistic across samples
    - Inclusion latency is compared between transactions seen by both pools and transactions seen by only one
    - The write-up names one specific behaviour change for a product that currently trusts a single pending view
hints:
  - '`txpool_content` is not available on every endpoint. A pending-transaction subscription plus a rolling window is a workable substitute — say which you used and why.'
  - The two snapshots will never be truly simultaneous. Bound the skew and report it, rather than pretending it is zero.
  - Expect the disjoint sets to be dominated by low-fee and recently-arrived transactions. Segment your comparison by fee to make that visible.
difficulty: 3
