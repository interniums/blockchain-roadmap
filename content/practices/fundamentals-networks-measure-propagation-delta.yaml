id: fundamentals-networks-measure-propagation-delta
moduleId: fundamentals-networks
grain: block
kind: measure
title: Measure how much later one node learns things than another
concepts: [propagation-latency, p2p-overlay, gossipsub]
spec: >
  Subscribe to new heads from two independent RPC endpoints at once — two different providers,
  or one provider and your own node — and record the local arrival timestamp for each block
  hash on each connection. Run for at least 200 blocks. Produce the distribution of the
  arrival delta per block hash: median, p95, max, and the fraction of blocks where each
  endpoint won. Write a short conclusion stating what the observed spread implies for a
  product that shows "confirmed" the instant its provider reports a block, and what it implies
  for any latency-sensitive action keyed off block arrival.
acceptance:
  command: node scripts/propagation-delta.mjs --blocks 200 --out results/propagation.json
  criteria:
    - The output file contains one record per block hash with a timestamp from each endpoint
    - Median, p95 and max deltas are reported in milliseconds, along with each endpoint's win rate
    - At least 200 distinct block hashes were observed on both endpoints
    - A written conclusion states a concrete product consequence, not a restatement of the numbers
hints:
  - Key on the block hash, not the block number — the number can be reused across a reorg and will silently pair the wrong observations.
  - Timestamp on receipt in your own process, and do not use any timestamp inside the block payload; you are measuring delivery, not block time.
  - If both endpoints are behind the same infrastructure the deltas will collapse to near zero. That is itself a finding worth reporting, but pick genuinely independent endpoints for the real run.
difficulty: 2
