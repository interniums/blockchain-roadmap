id: fundamentals-state-compact-encoding-from-scratch
moduleId: fundamentals-state
grain: block
kind: implement
title: Implement hex-prefix encoding until the vectors match exactly
concepts: [hex-prefix-encoding, hp-flag-nibble-table, hp-even-padding, mpt-nibble-path]
spec: >
  Write `compactEncode(nibbles: number[], isLeaf: boolean): Uint8Array` and its exact inverse in
  TypeScript, with no dependency on an existing trie library. The flag nibble is
  `2 * isLeaf + isOdd`; even-length paths take a zero padding nibble after the flag, odd-length
  paths put the first real nibble there instead. Verify against the four published vectors:
  `[1,2,3,4,5]` with `isLeaf = false` gives `0x112345`; `[0,1,2,3,4,5]` with `isLeaf = false`
  gives `0x00012345`; `[0,f,1,c,b,8,10]` as a leaf gives `0x200f1cb8`; `[f,1,c,b,8,10]` as a
  leaf gives `0x3f1cb8`. Then property-test `decode(encode(x)) === x` over ten thousand random
  nibble arrays of both parities, recovering the leaf flag as well as the path.
acceptance:
  command: npx vitest run test/compact-encoding.test.ts
  criteria:
    - All four published vectors are reproduced byte-for-byte in both directions
    - A property test round-trips 10,000 random nibble arrays covering both parities and both flag values
    - Decoding recovers the isLeaf flag as well as the nibble list
    - Every input nibble is validated to be in 0..15, with a distinguishable error otherwise
hints:
  - Write down the four flag values and what each says before writing any code. Two bits, two meanings.
  - The parity of the nibble count decides whether a padding nibble is inserted. Get that branch wrong and the even vectors fail while the odd ones pass.
  - The last element of the leaf vectors is the terminator marker as it appears in the published examples — decide explicitly whether your representation carries it, and be consistent between encode and decode.
difficulty: 2
