id: fundamentals-state-one-root-every-client
moduleId: fundamentals-state
grain: block
kind: break
title: Make two clients disagree about a root, then find which rule you broke
difficulty: 3
concepts: [mpt-canonical-root, state-root, verkle-trie]
spec: >
  The trie has no design freedom left in it, and this exercise is to find out why by removing some.

  Take your trie implementation and insert the same key-value set in two different orders. Assert the
  roots are identical. Then deliberately break canonicality in three ways, one at a time, and show each
  producing a different root from the same logical data: skip the inlining threshold, allow a non-minimal
  path encoding, and permit an extension node with an empty path. For each, name the rule you violated
  and state what would happen on a live network if two clients disagreed that way.

  Then connect it to the header: show that your root changes when any single account in the set changes,
  and that it does not change when the insertion order does. That pair of facts is what the state root
  in a block header is for.

  Close with two sentences on the replacement that did not happen: what Verkle promised about this
  structure, and what is being pursued instead.
acceptance:
  command: forge test --junit --match-path test/CanonicalRoot.t.sol
  criteria:
    - The same key-value set inserted in two orders produces an identical root
    - Three distinct canonicality violations each produce a different root from the same logical data
    - Each violation names the rule broken and the live-network consequence of two clients disagreeing that way
    - A single account change is shown changing the root
    - Insertion order is shown not to change the root
    - Two sentences state what Verkle promised and what replaced it
hints:
  - Break one rule at a time and revert between them. Two violations at once produce a wrong root for reasons you cannot separate.
  - The order-independence test is the one that catches real bugs in an implementation. If your roots differ by insertion order, the bug is in your node-splitting rather than in your hashing.
  - The empty-path extension node is the subtlest violation. Work out why it is forbidden rather than just observing that it changes the root.
