kind: read
title: Verify a real account proof by hand against the block's state root
concepts: [storage-proof, mpt-proof-is-node-list, mpt-secure-trie, mpt-child-reference-rule, exclusion-proof]
spec: >
  Pick a mainnet account and one of its storage slots. Fetch the proof with
  `cast rpc eth_getProof <address> '["<slot>"]' <blockNumber>` and fetch the block header's
  `stateRoot` separately. Then verify the proof without a library: RLP-decode each returned
  node, identify its type from the item count and the first nibble of item 0, walk the nibbles
  of `keccak256(address)` through the path, and check at each step that the reference held by
  the parent equals the keccak256 of the child's RLP — remembering that a child under 32 bytes
  is inlined rather than hashed. Repeat for the storage proof against the account's
  `storageRoot`. Finally, request a proof for a storage slot the contract has never written and
  annotate how the returned nodes prove absence rather than a stored zero.
acceptance:
  command: node scripts/verify-getproof.mjs --address <address> --slot <slot> --block <block>
  criteria:
    - The script recomputes the state root bottom-up from the returned account-proof nodes and asserts equality with the header's stateRoot
    - Each node in both proofs is annotated as branch, extension or leaf, with the deciding evidence stated
    - The nibble path of keccak256(address) is printed alongside the slot chosen at each branch node
    - A third run against an unwritten slot is annotated to show where the path terminates and why that constitutes an exclusion proof
hints:
  - The path is not the address. Hash it first, then split into nibbles.
  - Item count separates a branch (17) from the other two (2); the first nibble of item 0 separates extension (0 or 1) from leaf (2 or 3).
  - If your recomputed root is right for some accounts and wrong for others, you are almost certainly hashing a child whose RLP is under 32 bytes and should have been inlined.
difficulty: 4
