id: fundamentals-state-verify-a-real-getproof
moduleId: fundamentals-state
grain: module
writeUp: >
  The trie gives you exclusion proofs — proof that a key is absent — and a plain Merkle tree does not. Name one thing in a system you have built where you needed to prove absence rather than presence, and say how you did it. Then describe what would change if the party asking for that proof did not trust your database.
