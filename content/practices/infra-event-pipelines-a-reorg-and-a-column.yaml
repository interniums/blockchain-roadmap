id: infra-event-pipelines-a-reorg-and-a-column
moduleId: infra-event-pipelines
grain: block
kind: fix
title: Reorg a pipeline that already wrote the rows, then add one column
difficulty: 3
concepts: [reorg-definition, reorg-depth-reality, schema-change-means-rebackfill]
spec: >
  Two things happen to every event pipeline that survives contact with production, and both are cheaper to
  learn about deliberately.

  WRITE THEN UNWRITE. Build a small pipeline that reads events and writes rows. Then reorg the chain under it
  and show the damage: rows that describe transactions that no longer happened. Report how many, and how long
  the pipeline served wrong answers before noticing.

  Then fix it, and be specific about which strategy you chose: wait for a depth before writing, write and
  correct on detection, or keep both versions and mark one canonical. Implement one, and state what the other
  two would have cost. Report the freshness penalty your choice imposes, because every one of the three trades
  freshness against correctness.

  HOW DEEP, REALLY. Then get the number from data rather than from a default. Measure observed reorg depths
  over a window and report the distribution. State the depth you chose to wait for and the fraction of observed
  reorgs it covers. A default of one block is a decision and it should be defended with your distribution.

  ONE NEW COLUMN. Now the other inevitability. Add one field to an event your pipeline reads and establish what
  it takes to populate it historically. State whether the data is derivable from what you already stored or
  requires re-reading the chain, then measure the re-backfill: wall-clock, RPC cost, and whether the pipeline
  can serve queries while it runs.

  Close with the schema decision that would have made this cheaper, and what it would have cost up front.
acceptance:
  criteria:
    - A pipeline writes rows and a reorg is shown invalidating some, with the count and the duration of wrong answers reported
    - One of the three correction strategies is implemented, with the cost of the other two stated
    - The freshness penalty of the chosen strategy is reported
    - Observed reorg depths are measured over a window and reported as a distribution
    - The chosen wait depth is stated with the fraction of observed reorgs it covers
    - One field is added, with whether it is derivable or requires re-reading established
    - The re-backfill is measured for wall-clock, RPC cost, and whether queries can be served during it
    - The cheaper schema decision is named with its up-front cost
hints:
  - Induce the reorg locally rather than waiting for one. You need it on demand and repeatably, and a local chain gives you both.
  - Measure the depth distribution before choosing a wait. The common case is shallow and the tail is what decides your number.
  - The schema answer is usually to store the raw event alongside the derived rows. Price the storage before recommending it, because that is the trade.
