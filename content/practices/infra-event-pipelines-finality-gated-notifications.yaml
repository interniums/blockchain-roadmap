id: infra-event-pipelines-finality-gated-notifications
moduleId: infra-event-pipelines
kind: implement
title: A notification that can never fire for an event that stopped existing
concepts: [two-tier-read-model, side-effects-are-unrollbackable, finality-vs-confirmations, indexer-handles-reorgs-your-db-does-not, gap-detection-monitoring]
spec: >
  Extend the ingester with two read paths over the same rows: a pending view computed from the tip, and a
  finalized table whose rows only appear once the consensus layer's finalized block has passed the row's
  block number. Wire a notification job that reads exclusively from the finalized table and records every
  notification it sends. Then build a reorg simulator on a local chain - mine, snapshot, revert, mine a
  different branch containing different events - and run the whole pipeline across it. Add the two invariant
  queries from the module as a scheduled check running in a separate process.
acceptance:
  command: pnpm vitest run tests/finality-gate --reporter=junit
  criteria:
    - After the induced reorg, the pending view matches the canonical branch and no row from the abandoned branch survives anywhere
    - The notification log contains zero entries corresponding to events that existed only on the abandoned branch
    - A test proves the notification job cannot read the pending view, by construction rather than by convention
    - The contiguity and cursor-lag checks run in a separate process, return zero rows on a healthy run, and fire on an injected gap
hints:
  - Take the finalized block from the consensus layer rather than subtracting a constant from the head; the constant is the thing this practice exists to unteach.
  - Enforce the read separation with database permissions or separate connections, so a future developer cannot casually widen it.
  - The interesting assertion is the empty notification log - design the reorg so a naive pipeline would definitely have sent one.
difficulty: 4
