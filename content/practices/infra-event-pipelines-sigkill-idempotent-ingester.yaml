id: infra-event-pipelines-sigkill-idempotent-ingester
moduleId: infra-event-pipelines
kind: implement
title: An ingester that does not care when you kill it
concepts: [log-natural-key, idempotency-via-upsert, cursor-checkpointing, backfill-chunking, at-least-once-is-the-default]
spec: >
  Build a minimal TypeScript ingester: chunked log backfill into Postgres, writing rows with an on-conflict
  clause keyed on chain id, block number and log index, and updating the cursor row inside the same database
  transaction as the inserts it accounts for. Run it once to completion over a fixed block range and take a
  checksum of the resulting table. Then run it again from empty, sending SIGKILL at ten randomly chosen points
  and restarting each time. The final table must checksum identically. Then break it deliberately: move the
  cursor update into a second transaction, repeat the SIGKILL run, and demonstrate and name the resulting
  failure.
acceptance:
  command: pnpm vitest run tests/ingester-crash-safety --reporter=junit
  criteria:
    - The interrupted run's table checksum is byte-identical to the uninterrupted run's over the same range
    - A test asserts the inserts and the cursor update share one transaction, and fails if they are separated
    - The two-transaction variant is shown to produce either duplicate rows or a permanent gap, and the test names which
    - A contiguity query over the ingested range returns zero missing block numbers after every run
hints:
  - Kill with SIGKILL, not SIGTERM - a graceful shutdown path would hide exactly the bug you are testing for.
  - Checksum the ordered result set including the key columns, so a reordering or a collapsed duplicate shows up.
  - The permanent-gap variant is the one worth dwelling on; it produces no duplicates and no errors, which is why it survives to production.
difficulty: 3
