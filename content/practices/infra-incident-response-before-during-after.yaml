id: infra-incident-response-before-during-after
moduleId: infra-incident-response
grain: block
kind: write
title: Write the three documents you will not have time to write during an incident
difficulty: 3
concepts: [seal-911, whitehat-safe-harbor, comms-during-incident, postmortem-purpose, postmortem-content, blameless-but-specific]
spec: >
  Everything useful in an incident was written beforehand. Write the three things, for a real or realistic
  protocol.

  BEFORE — WHO YOU CALL. Produce the contact and authority document. Who is called, in what order, and who is
  authorised to act without waiting for consensus. Include the external routes: the emergency channel for
  protocol security, and what it needs from you to be useful. Then the part most teams skip: publish a safe
  harbour so that someone who finds a live exploit has a lawful way to tell you and a stated outcome for doing
  so. Write the actual terms, not an intention to have them — scope, what a finder may and may not do, and what
  they receive.

  DURING — WHAT YOU SAY. Write the communications plan as templates, not principles. A first message within
  minutes when you know almost nothing, an update cadence, and the sentence you use when you cannot yet say
  whether funds are lost. Then state what you never say during an incident and why. Include who is authorised
  to speak.

  AFTER — THE POST-MORTEM. Write one, for a real incident from another protocol, in the form you would publish.
  Then account for its three audiences: users deciding whether to return, engineers wanting the technical chain,
  and the wider ecosystem looking for a transferable lesson. Show where each is served.

  The last constraint is the hard one: blameless and specific at once. Name every decision that contributed
  without naming a person to blame for it — and note that "a process allowed it" is only acceptable when you
  also say which process and what changed.
acceptance:
  criteria:
    - A contact and authority document names who is called in what order and who may act without consensus
    - The external emergency route is included with what it requires to be useful
    - Safe harbour terms are written out with scope, permitted and prohibited actions, and what a finder receives
    - Communications templates cover a first message, an update cadence, and the unknown-losses sentence
    - What is never said during an incident is stated with the reason, along with who may speak
    - A publishable post-mortem is written for a real incident from another protocol
    - Each of the three audiences is shown where it is served
    - Every contributing decision is named without naming a person, and any process attribution names the process and what changed
hints:
  - Write the safe harbour terms as terms. An intention to be reasonable is not something a finder can rely on, and the ones who most need it are the ones who will not contact you without it.
  - The unknown-losses sentence is the hardest one to write calmly and the one you will most need. Draft it now.
  - Blameless and specific is achievable by attributing to decisions rather than to people. Keep every decision in the account and remove every name.
