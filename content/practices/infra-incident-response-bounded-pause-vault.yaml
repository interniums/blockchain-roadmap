id: infra-incident-response-bounded-pause-vault
moduleId: infra-incident-response
grain: block
kind: implement
title: A pause nobody can turn into a permanent freeze
concepts: [pause-design-patterns, pause-is-a-two-sided-risk, containment-ladder, pause-efficacy-declines]
spec: >
  Implement a vault with the mature pause pattern: a low-threshold guardian multisig can pause immediately;
  only governance can unpause early; the pause expires automatically after a fixed window and the protocol
  resumes without anyone acting; and a cooldown after expiry prevents an immediate re-pause. Add one rung
  below full pause - a per-block withdrawal cap that the guardian can lower without stopping the protocol -
  so the drill in this module has more than one option. Prove all of it in Foundry, including the adversarial
  property: a guardian acting in bad faith cannot keep user funds frozen indefinitely.
acceptance:
  command: forge test --junit --match-path test/BoundedPause.t.sol
  criteria:
    - A test proves the guardian can pause at the low threshold and cannot unpause
    - A test proves the pause expires without any transaction being sent, and withdrawals succeed immediately after expiry
    - A test proves a guardian re-pausing during the cooldown reverts, and computes the maximum fraction of time a bad-faith guardian can keep the protocol paused
    - A test proves the withdrawal cap can be lowered by the guardian while the protocol stays live, and that honest users can still exit at the reduced rate
hints:
  - Model expiry as a timestamp comparison rather than a transaction someone must send - the whole point is that inaction resumes service.
  - Write the adversarial test first; it is the property the design exists for and it will shape the other three.
  - The withdrawal cap is the interesting rung - decide explicitly what happens to a user whose withdrawal exceeds it, and test that path.
difficulty: 3
