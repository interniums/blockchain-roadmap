id: infra-incident-response-red-team-drill
moduleId: infra-incident-response
kind: break
title: Time yourself losing money
concepts: [clock-is-the-adversary, war-room-roles, parallel-not-serial, guardian-key-operational-readiness, wargames-rehearsal]
spec: >
  Run a two-sided drill on a forked mainnet. One participant has a scripted drain against a deployed test
  protocol and executes it without warning at a time the other does not know. The other must detect it from
  their own monitoring, decide, and get a pause transaction signed and included. Record wall-clock times for
  every hop - first malicious transaction, detection, decision, calldata ready, signatures collected,
  inclusion - and the percentage of value that left in that window. Then run it a second time with the pause
  calldata pre-built and pre-simulated and sitting in a ready-to-sign multisig transaction, and compare. State
  which hop was the bottleneck before and after.
acceptance:
  command: bash drills/red-team.sh --fork $RPC_URL --record drills/timeline.json && pnpm tsx drills/report.ts
  criteria:
    - The recorded timeline contains all six hops with wall-clock timestamps and block numbers for the on-chain ones
    - Value lost during the window is reported as an absolute figure and as a percentage of the protocol's value at drill start
    - The second run shows a measurably shorter time to inclusion, and the report names the bottleneck hop in each run
    - The report names at least one preparedness item the drill revealed as missing, which was not in the runbook beforehand
hints:
  - The defender must not know the start time, or you have measured reaction to a countdown rather than to an incident.
  - Record the decision hop separately from the detection hop - people conflate them and the decision is usually the longer one.
  - The most valuable output is the item you discovered was missing, not the timing; write that one down first.
difficulty: 4
