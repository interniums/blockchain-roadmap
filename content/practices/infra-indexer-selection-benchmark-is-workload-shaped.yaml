id: infra-indexer-selection-benchmark-is-workload-shaped
moduleId: infra-indexer-selection
grain: block
kind: measure
title: Benchmark two indexers on your workload and watch the ranking flip
difficulty: 3
concepts: [benchmark-is-workload-shaped]
spec: >
  Published indexer benchmarks keep changing which tool wins, and the reason is that the benchmark is a
  workload. Prove it by constructing two workloads that rank the same tools in opposite orders.

  DEFINE YOUR WORKLOAD FIRST. Before touching a tool, write down what your product actually asks: which
  entities, which access patterns, how much historical depth, how fresh the data must be, and the read-to-write
  ratio. This document is the deliverable that outlives the benchmark.

  RUN TWO. Pick two indexers and run both against the same chain data. Measure: backfill time for a fixed block
  range, steady-state lag at the head, query latency at the median and the tail, and resource usage. Report
  every number with the hardware it was measured on.

  FLIP IT. Now construct a second workload that reverses the ranking — heavier on historical aggregation rather
  than head freshness, or on a wide entity graph rather than a narrow one. Show tool A winning the first and
  tool B the second, and state which property of the workload caused the flip. If you cannot make it flip, say
  so and state what that tells you.

  THE REORG CASE. Then a dimension benchmarks usually omit: introduce a reorg and measure how each tool
  handles it — detection time, whether it rewrote or duplicated rows, and how long until correct. A tool that
  is fast and wrong after a reorg is not fast.

  Close with your choice and the workload assumption that would invalidate it.
acceptance:
  criteria:
    - The workload is documented before any tool is run, covering entities, access patterns, depth, freshness and read-to-write ratio
    - Two indexers are run against the same chain data
    - Backfill time, head lag, median and tail query latency, and resource usage are reported with the hardware stated
    - A second workload reverses the ranking, with the causal property named, or the failure to flip is reported with its implication
    - A reorg is introduced with detection time, row behaviour and time-to-correct measured for each tool
    - A choice is stated along with the workload assumption that would invalidate it
hints:
  - Write the workload document first and do not revise it after seeing results. It is the only part of this that stays valid when both tools release new versions.
  - Measure tail latency, not just median. Indexers differ far more at the tail and that is what users notice.
  - The reorg dimension is the one that separates tools that are correct from tools that are quick. Include it even though no published benchmark will have given you a baseline.
