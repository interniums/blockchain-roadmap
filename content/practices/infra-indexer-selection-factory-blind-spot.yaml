id: infra-indexer-selection-factory-blind-spot
moduleId: infra-indexer-selection
kind: break
title: Lose half your data to a factory you forgot to register
concepts: [capability-gaps-matter-more-than-speed, trace-completeness-limit, ponder-model, envio-model]
spec: >
  Deploy a factory contract and several child contracts created by it on a local chain, and have the children
  emit swap-like events. Write an indexer that registers only the factory's creation event and not the
  children, so the child events are never subscribed to. Show exactly which events go missing and quantify
  them. Then fix it with the platform's dynamic-contract or template mechanism so children created at runtime
  are indexed from their creation block. Finally, add a value transfer that moves ETH through an internal
  call emitting no event, and demonstrate whether your chosen platform can see it at all.
acceptance:
  command: forge script script/DeployFactory.s.sol --broadcast && pnpm vitest run tests/factory-indexing --reporter=junit
  criteria:
    - A test reports the exact count and identity of child-contract events missed by the unregistered version
    - After adding dynamic registration, every child event from its creation block onward appears in the table
    - A written finding states whether the platform can observe the event-less internal transfer, with the evidence
    - The write-up maps each finding onto one of the four capability gates and says which platforms it would eliminate
hints:
  - Create at least one child after the indexer has already started, or you will accidentally test the easy case.
  - The missed rows are the interesting artifact - report them as a list, not as a count.
  - For the internal transfer, check whether your platform exposes traces at all before assuming your handler is wrong.
difficulty: 4
