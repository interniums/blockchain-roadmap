id: infra-indexer-selection-migration-plan
moduleId: infra-indexer-selection
grain: block
kind: write
title: Write the migration plan, including the cutover gate
concepts: [migration-cost-shape, managed-vs-self-hosted-indexer, decentralisation-tradeoff, sqd-rezolve-status, ponder-monad-ownership]
spec: >
  Take one real public subgraph - its manifest, schema and mappings - and write the plan to move it to a
  different framework. The plan must separate what translates mechanically from what is rewritten, estimate
  backfill duration from a measured sample rather than a guess, specify the dual-run period with the exact
  diff query you would run against both datasets, and state a numeric cutover criterion. It must also include
  a steward-risk section naming who currently controls each candidate and what your exit would be if that
  changed. Run the diff query for real against a short block range with both systems populated, and include
  the output.
acceptance:
  command: pnpm tsx scripts/dual-run-diff.ts --range 10000 --fail-on-diff && test -f docs/migration-plan.md
  criteria:
    - The diff script returns zero rows over the sampled range and exits non-zero if any row differs
    - Backfill duration is extrapolated from a measured sample, with the sample size and measured rate stated
    - The cutover criterion is numeric and time-bounded, not "when it looks right"
    - A steward-risk section names the controlling entity for each candidate and gives a concrete exit path
hints:
  - Derived fields are where the mechanical translation stops - list them first and budget for them separately.
  - The diff query is the deliverable, not the prose; write it before you write the plan around it.
  - An exit path that requires a full re-backfill is still an exit path - say how long it would take.
difficulty: 3
