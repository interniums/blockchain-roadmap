id: infra-indexing-break-it-with-a-reorg
moduleId: infra-indexing
grain: block
kind: break
title: Corrupt your own indexer with a two-block reorg
concepts: [reorg-safe-indexing, indexer-is-a-deterministic-fold, backfill-vs-live]
spec: >
  Write the naive indexer first: a loop that reads logs from the tip and appends derived rows, with no notion
  of the branch a row came from. Point it at a local Anvil chain. Mine a few blocks containing token transfers,
  snapshot, then revert to the snapshot and mine a different branch containing different transfers to the same
  addresses. Show that the naive indexer's table now contains rows from the abandoned branch alongside rows
  from the canonical one, and that nothing in the process logged an error. Then fix it: record the block hash
  with every row, detect the common ancestor when the parent hash of a new block does not match the hash you
  stored, delete every row above it, and reapply.
acceptance:
  command: forge script script/ReorgDrill.s.sol && pnpm vitest run tests/reorg-indexer --reporter=junit
  criteria:
    - A test proves the naive indexer's final table differs from the canonical chain's true state, and names the exact rows that should not be there
    - A test proves the naive run exited zero and logged no error while producing that wrong table
    - After the fix, the table matches the canonical branch exactly, with no rows attributable to the abandoned blocks
    - The fixed indexer is shown to be idempotent - rerunning it over the same range produces an identical table
hints:
  - Store the block hash alongside every derived row; without it you cannot tell which branch a row came from.
  - The detection signal is a new block whose parent hash is not the hash you recorded for the previous block number.
  - Deleting and reapplying is correct and boring - resist the urge to compute a minimal diff before you have the boring version passing.
difficulty: 4
