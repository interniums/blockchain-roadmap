id: infra-indexing-two-indexers-one-answer
moduleId: infra-indexing
grain: module
writeUp: >
  Write down one query your product needs that no JSON-RPC method can answer, in the exact form the product needs it - filters, sort order and all. Then describe the fold that would produce it: which events feed it, what the derived table looks like, and what has to happen to that table when the last two blocks are replaced by different ones. If your answer to the last part is "nothing", say what your users would see.
coversConcepts:
  - indexing
  - indexer-is-a-deterministic-fold
  - subgraph
  - hosted-service-retired
  - graph-compatible-alternatives
  - backfill-vs-live
  - reorg-safe-indexing
  - non-evm-indexing
  - indexer-choice-axes
kind: implement
title: Index one contract twice and make the answers agree
concepts: [indexing, indexer-is-a-deterministic-fold, subgraph, backfill-vs-live, indexer-choice-axes]
spec: >
  Pick one ERC-20 and a 200,000 block window. Index its Transfer events two ways: once as a subgraph deployed
  to a host that still exists in 2026, and once with a self-hosted framework of your choice writing to
  Postgres. Both must answer the same product question - the top 100 holders by balance at the end of the
  window - and both must be checksummable. Write a comparison script that pulls the result from each and
  diffs them row by row. Record wall-clock backfill time for each run and the setup effort in your own hours,
  and state which axis from the selection list each of your two candidates won on.
acceptance:
  command: pnpm tsx scripts/compare-indexers.ts --window 200000 --assert-identical
  criteria:
    - Both indexers return identical top-100 holder rows, verified by a checksum over the ordered result set
    - Wall-clock backfill time is reported for each, with the block window and the data source each used
    - The comparison names at least three selection axes and scores both candidates on each, not on speed alone
    - No step of either deployment targets The Graph's retired hosted service
hints:
  - Fix the end block explicitly in both runs, or you are diffing two different questions.
  - The checksum should cover ordering as well as values - a set comparison hides the bug you are looking for.
  - Time your own setup effort honestly; for most teams it dominates the difference in backfill minutes.
difficulty: 4
