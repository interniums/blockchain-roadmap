id: infra-monitoring-a-noisy-channel-is-unread
moduleId: infra-monitoring
grain: block
kind: implement
title: Build an alert you would still be reading in three months
difficulty: 3
concepts: [anomaly-heuristics, false-positive-budget]
spec: >
  An alert nobody reads is worse than no alert, because it looks like coverage. Build one that survives.

  THE BUDGET FIRST. Before writing any detector, state your false-positive budget as a number: how many alerts
  per week can fire without being real before this channel is ignored. Write it down. Everything after this is
  measured against it.

  THREE DETECTORS. Implement three heuristics over real chain data for one protocol — a volume anomaly, a
  balance or invariant deviation, and a liveness gap. Run each over at least a month of history and report, per
  detector: how many times it fired, how many of those were real, and the resulting rate per week.

  Then compare against your budget. Any detector over it is either retuned or removed, and the write-up says
  which and why. Removing a detector is a legitimate outcome and pretending otherwise is how channels die.

  TUNE ONE. Take your worst detector and tune it. Report the threshold before and after, the change in
  false-positive rate, and — the number that matters — what you now miss. A quieter detector that misses the
  event you built it for is not an improvement, so establish its detection rate against known historical
  incidents.

  THE ROUTING. Finally, state for each surviving detector where it goes and who is expected to act: a page, a
  channel, or a dashboard nobody watches. Then state the response for each, because an alert without a runbook
  is a notification.

  Close with what you deliberately do not alert on, and why.
acceptance:
  criteria:
    - A false-positive budget is stated as a number before any detector is built
    - Three detectors are implemented over at least a month of real history
    - Fire count, true-positive count and weekly rate are reported per detector
    - Each detector is compared against the budget with a retune-or-remove decision and reason
    - One detector is tuned with before and after thresholds and false-positive rates
    - The tuned detector's detection rate against known historical incidents is established
    - Each surviving detector has a destination, an expected actor and a stated response
    - What is deliberately not alerted on is stated with the reason
hints:
  - State the budget as a number before you look at any data. Chosen afterwards it becomes whatever your detectors happened to produce.
  - Backtest over a month at minimum. A detector tuned on a quiet week fires constantly on a busy one.
  - The what-you-now-miss measurement is the one people skip. Tuning down is easy and its cost is invisible unless you check against real incidents.
