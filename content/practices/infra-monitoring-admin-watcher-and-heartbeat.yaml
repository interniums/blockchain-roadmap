id: infra-monitoring-admin-watcher-and-heartbeat
moduleId: infra-monitoring
kind: implement
title: Watch every privileged action, and prove your watcher is alive
concepts: [admin-action-alerting, timelock-queue-is-the-alert, dependency-monitoring, monitoring-the-monitor, offchain-liveness-signals]
spec: >
  Build a watcher for a real mainnet protocol that subscribes to every privileged event on its contracts -
  ownership transfer, role granted and revoked, proxy upgraded, paused and unpaused - plus the queue event of
  its timelock, and decodes each into human-readable form including the new implementation or role holder.
  Extend it to the protocol's dependency set: enumerate the external contracts it trusts and watch the same
  events on each. Then add a heartbeat: the watcher writes a timestamp every block, and a separate process
  with its own RPC endpoint pages if the heartbeat goes stale, distinguishing "watcher down" from "RPC down".
  Verify everything by replaying historical blocks containing a real upgrade.
acceptance:
  command: pnpm vitest run tests/admin-watcher --reporter=junit
  criteria:
    - Replaying the historical block range containing a real upgrade produces a decoded alert naming the new implementation address
    - The timelock queue event alerts, and a test asserts the alert fires on queue rather than on execute
    - The dependency list is enumerated in a checked-in file and every contract on it is covered by the same event set
    - Killing the watcher produces a page from the independent checker within the configured window, and killing the RPC produces a distinguishably different alert
hints:
  - Replay historical blocks rather than waiting for a live upgrade; the test needs to be repeatable.
  - The dependency list is the deliverable people skip - write it down before you write any code, and count how many entries surprise you.
  - Run the heartbeat checker on different infrastructure with a different endpoint, or you have built a switch that dies with the thing it watches.
difficulty: 3
