id: infra-monitoring-invariant-to-production
moduleId: infra-monitoring
kind: implement
title: Ship the same invariant to your test suite and to mainnet
concepts: [invariant-monitoring, invariants-are-the-same-artifact-as-fuzzing, three-signal-layers, alert-enrichment]
spec: >
  Take a simple vault and write a Foundry invariant test asserting that total assets are never less than the
  sum of user shares valued at the current rate. Then write a TypeScript monitor that evaluates the identical
  predicate against a forked chain every block, batching its reads through multicall so one block costs one
  round trip. The predicate must exist in exactly one place - export it from a shared module or generate both
  from one definition - so the two cannot drift. Corrupt the vault's accounting on the fork with a storage
  write, and show the monitor reporting failure within one block. Make the failure output enriched: which
  term of the predicate broke, by how much, and the balance deltas that produced it.
acceptance:
  command: forge test --junit --match-path test/VaultInvariant.t.sol && pnpm vitest run tests/invariant-monitor --reporter=junit
  criteria:
    - The Foundry invariant test passes against the healthy vault and the monitor prints PASS every block on a healthy fork
    - After the storage corruption, the monitor reports FAIL within one block, and a test asserts the detection latency
    - A test proves the predicate is defined once, failing if the two implementations diverge
    - The failure output names the broken term, the magnitude of the breach, and the per-address balance deltas
hints:
  - Batch every read for one block through a single multicall, or your monitor's own latency becomes the detection latency.
  - Corrupt the accounting with a direct storage write rather than a legitimate call - you are testing the detector, not the vault's access control.
  - The enrichment is not cosmetic; write the output you would want to read at 3am and then implement that.
difficulty: 4
