kind: measure
title: Price your hardest dependency before it prices you
difficulty: 4
concepts: [rpc-is-the-only-door, privacy-of-rpc, credit-unit-pricing, method-cost-asymmetry, flat-request-pricing, rate-limit-two-axes, websocket-vs-poll, getlogs-is-the-cost-driver, archive-query-definition, trace-vs-debug-namespace, provider-failover-pattern, rpc-consistency-hazard, enhanced-apis-lock-in, self-host-tco, self-host-does-not-remove-provider]
spec: >
  Take one real or realistic product workload and produce the document nobody writes before shipping: what
  the endpoint costs, where it fails, and what switching would take.

  THE WORKLOAD. Define it concretely: which methods, at what rate, at what times. Then instrument and count
  actual calls for a representative period. Predicted versus actual goes in the report, because the gap is
  always the finding.

  WHAT IT COSTS. Price the workload on two providers with different models — one credit-unit, one flat-request.
  Show the method cost asymmetry: rank your methods by share of the bill and note that the ranking is not the
  same as the ranking by call count. Name the method writing most of your bill.

  THE COST DRIVER. It will probably be log queries. Take your heaviest one and optimise it — narrower range,
  tighter topics, pagination — and report the before and after in both cost and latency. Then state what you
  gave up.

  TWO LIMITS. Establish both axes of rate limiting and produce a distinct failure for each. Report what your
  client saw in both cases, because they look different and one is much harder to detect.

  SOCKETS VERSUS POLLING. Implement the same subscription both ways. Report the cost and the latency of each
  and the failure mode of each — including what happens to a socket that silently dies.

  ARCHIVE, PRECISELY. Establish what this provider counts as an archive query, by finding the boundary
  experimentally rather than by reading the tier page. Then state what a trace namespace call costs relative
  to a plain one, and whether the provider offers trace, debug, or something in between.

  FOR THE PROVIDER THAT IS DOWN. Implement failover across two providers. Then find the hazard: get the two
  providers to disagree — different head, or a receipt on one and not the other — and say what your code does.
  A failover that assumes both providers agree is the bug in most implementations.

  THE EXIT. List every enhanced API you used, and for each state what replacing it would take. Then price
  self-hosting properly: hardware, bandwidth, an engineer's time, and the fact that you would still need a
  provider for something. Conclude with a recommendation and the assumption it rests on.
acceptance:
  command: 'true'
  criteria:
    - A concrete workload is defined and actual calls counted for a representative period, with predicted versus actual reported
    - The workload is priced on a credit-unit and a flat-request provider
    - Methods are ranked by share of bill and shown to differ from the ranking by call count, with the top cost driver named
    - The heaviest log query is optimised with before and after cost and latency, and what was given up stated
    - Both rate-limit axes produce distinct failures, with what the client saw in each and which is harder to detect
    - The same subscription is implemented over sockets and polling with cost, latency and failure mode for each, including a silently dead socket
    - The archive-query boundary is established experimentally rather than from documentation
    - Trace-namespace cost relative to a plain call is reported, with which namespaces the provider actually offers
    - Failover across two providers is implemented, and a real disagreement between them is produced with the client's behaviour stated
    - Every enhanced API used is listed with what replacing it would take
    - Self-hosting is priced including hardware, bandwidth and engineering time, and acknowledging the residual provider need
    - A recommendation states the assumption it rests on
hints:
  - Count your actual calls before pricing anything. Every workload estimate written from the design rather than from instrumentation is wrong in the same direction, and log queries are usually the reason.
  - "The two rate limits fail differently: one rejects you and one queues you. The queued one is the dangerous one because it looks like slowness rather than an error, and finding that is the exercise."
  - Producing a real provider disagreement is easier than it sounds — poll two providers for the head at high frequency and wait. Then decide what your code should do, because the default is to believe whichever answered.
