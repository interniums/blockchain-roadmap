id: infra-rpc-economics-failover-and-pin
moduleId: infra-rpc-economics
kind: implement
title: Survive a dead provider and a height that moves backwards
concepts: [provider-failover-pattern, rpc-consistency-hazard, rate-limit-two-axes]
spec: >
  Build a small dashboard backend that reads four values per refresh - a balance, a contract read, a log
  slice and the current head. Give it a fallback transport ranking two independent providers, with backoff
  and jitter on 429. Then implement the pinned-block pattern: read the block number once per refresh cycle
  and issue every subsequent read at that explicit number rather than at `latest`. Write two test harnesses:
  one that stubs provider A to return 429 for every request, and one that stubs a fleet whose reported head
  oscillates between two heights across consecutive calls. The application must serve correct, mutually
  consistent data under both.
acceptance:
  command: pnpm vitest run tests/rpc-resilience --reporter=junit
  criteria:
    - With provider A returning 429 for every request, the endpoint still returns correct data sourced from provider B
    - All four reads in a single refresh cycle carry the same explicit block number, asserted at the transport layer
    - Against the oscillating-head stub, no refresh returns a mix of values from two different blocks
    - The retry path is asserted to use exponential backoff with jitter, and a test proves it does not retry immediately on 429
hints:
  - Assert the pinning at the transport, not in the application - the point is that no code path can forget.
  - The oscillating-head stub is the interesting test; a fallback transport alone does not fix that failure.
  - Decide explicitly what the pinned block should be when the two providers disagree about the head, and write the rule down.
difficulty: 3
