id: infra-rpc-economics-predict-the-bill
moduleId: infra-rpc-economics
kind: measure
title: Predict the invoice before the provider sends it
concepts: [credit-unit-pricing, method-cost-asymmetry, getlogs-is-the-cost-driver, flat-request-pricing]
spec: >
  Write a TypeScript script using viem that fetches every Transfer log for a busy ERC-20 across a 100,000
  block range, chunked to stay inside your provider's block-range and result-size caps. Wrap the transport so
  every outbound request is counted by method name. When the run finishes, multiply your per-method counts by
  the provider's own currently published unit table to produce a predicted unit total, and separately price
  the same call counts under a flat per-million-request plan. Compare the predicted credit total against the
  provider dashboard's actual figure for that window, and report the gap. Record the chunk size you used and
  the cap that bounded it.
acceptance:
  command: pnpm tsx scripts/rpc-cost-report.ts --blocks 100000 --compare-dashboard
  criteria:
    - The report lists calls per method, a predicted unit total, and the actual dashboard figure, with the gap under 10 percent
    - The same call counts are priced under a flat per-request plan and the cheaper family for this workload is named
    - The chunk size is stated along with which provider cap set it - block range or result size
    - The unit multipliers used are quoted from the provider's own current table with the date they were read, not from memory
hints:
  - Count requests in the transport, not in your application code, so retries and internal batching are included.
  - The log query dominates the total so heavily that mispricing every other method barely moves the answer - find out by how much.
  - If your predicted total is low, look for retries; if it is high, look for batching the provider counted as one request.
difficulty: 3
