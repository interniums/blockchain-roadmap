id: infra-running-nodes-break-the-jwt
moduleId: infra-running-nodes
kind: break
title: Make a healthy node stop advancing, and prove why
concepts:
- node-two-process-model
- sync-mode-snap
- disk-is-the-bottleneck
spec: 'Take the working pair from the previous practice and break it in the way real deployments break:
  replace the consensus client''s copy of the JWT secret with a different 32-byte value, so the two halves
  disagree while both keep running. Restart and observe. Capture the exact log lines from each side that
  indicate the failure, and capture the JSON-RPC responses your node gives while in this state. Then restore
  the shared secret and confirm recovery. Write up why this failure mode looks like a stalled node rather
  than a crashed one, and what a health check would have to assert to catch it - process liveness alone
  will not.

  '
acceptance:
  command: bash scripts/jwt-break-drill.sh --capture logs/ --assert-stalled --assert-recovered
  criteria:
  - The captured logs contain the specific authentication-failure line from both the execution client
    and the consensus client, quoted with the client name and version
  - Evidence that both processes remained running and that `eth_blockNumber` stopped advancing while the
    secret was mismatched
  - After restoring the shared secret the node returns to within 2 blocks of a public endpoint without
    a resync
  - A written health-check assertion is given that would have detected this, and it is not "the process
    is up"
hints:
- Break only the consensus client's copy; leaving the execution client untouched is what produces the
  realistic symptom.
- Note what `eth_syncing` returns during the failure - the answer is the reason naive health checks miss
  this.
- 'The lesson generalises: any check that would pass on a node frozen at a block is not a health check.'
difficulty: 2
