id: infra-running-nodes-bring-up-a-pair
moduleId: infra-running-nodes
grain: block
kind: implement
title: Bring up an execution and consensus client that actually reach head
concepts: [node-two-process-model, el-client-landscape, cl-client-landscape, checkpoint-sync, client-diversity-risk]
spec: >
  Stand up a paired execution and consensus client on a current Ethereum testnet using docker compose.
  Generate a 32-byte hex JWT secret with `openssl rand -hex 32` and mount the same file into both
  containers. Wire the Engine API on 8551 and keep it bound to the container network only; expose JSON-RPC
  on 8545 to localhost. Point the consensus client at a public checkpoint-sync URL. Deliberately choose a
  minority client for at least one of the two halves and record which one and why. Write a small script
  `scripts/node-health.sh` that queries your node and a public endpoint for the same testnet and prints both
  block numbers plus the `eth_syncing` result.
acceptance:
  command: bash scripts/node-health.sh --require-synced --max-lag 2
  criteria:
    - "`eth_syncing` returns false against your own endpoint"
    - Your node's `eth_blockNumber` is within 2 blocks of a public endpoint for the same network
    - The compose file mounts one shared jwtsecret path into both services and does not publish 8551 outside the container network
    - A written note names which half of the pair is the minority client and the network-level reason for that choice
hints:
  - Bring the execution client up alone first and read its logs; it will tell you it is waiting to be driven rather than failing.
  - The checkpoint-sync URL belongs to the consensus client only - the execution client has no equivalent shortcut.
  - If both processes are running and neither logs an error but the block number never moves, the problem is almost always the shared secret, not the network.
difficulty: 3
