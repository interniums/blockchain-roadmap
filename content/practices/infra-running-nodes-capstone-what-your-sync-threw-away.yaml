id: infra-running-nodes-capstone-what-your-sync-threw-away
moduleId: infra-running-nodes
grain: module
writeUp: >
  You are asked to run one node for a product that shows users their current balances and, once a month, their balance at the first block of the previous month. Name the sync mode you would run, the single question that choice makes your node unable to answer, and how you would answer it anyway. Then say what changes about your answer if the monthly report has to cover the last five years.
