title: Run the node, then find the questions your sync mode cannot answer
difficulty: 4
concepts: [node-two-process-model, el-client-landscape, cl-client-landscape, client-diversity-risk, sync-mode-snap, sync-mode-full-exec, sync-mode-archive, checkpoint-sync, archive-cost-is-state-not-blocks, history-expiry-4444, blob-storage-is-separate, peerdas-node-impact, disk-is-the-bottleneck, offline-pruning-treadmill]
spec: >
  Stand up a full node — both processes — and then establish, by asking it, exactly what it cannot tell you.

  BOTH PROGRAMS. Get an execution client and a consensus client running and talking. State which you chose
  and why, and then the part that matters: look up the current network share of each and say what your choice
  did to the network's blast radius. If you picked the most popular one, say so and justify it.

  CHECKPOINT SYNC. Use it, and state plainly what you are trusting when you do. Then say what it would take
  to verify that trust after the fact, and whether you did.

  THREE SYNC MODES, THREE SETS OF UNANSWERABLE QUESTIONS. For snap, full-execution and archive: state what
  each one keeps and what it discards, and then demonstrate it. Write three concrete RPC queries — a balance
  at a historical block, a trace of an old transaction, a receipt from years ago — and show which of them your
  node answers and which it refuses. The refusals are the deliverable.

  WHY ARCHIVE IS BIG. Report the on-disk size of your node's state versus its blocks. Then state, from those
  two numbers, why an archive node is enormous even though the blocks are not — the answer is one of the two
  columns and the write-up should point at it.

  THE BLOBS WERE NEVER THERE. Ask your execution client for a blob from a recent block. Explain the result.
  State where blobs actually live, how long, and what changes about that under the sampling scheme.

  HISTORY EXPIRY. State what your client will stop serving and when, and where a user is expected to get it
  instead.

  THE DISK. Measure it: IOPS and latency under sync, and again at the head. Then report your pruning
  situation — how much the database grew over your run, how long a prune takes, and what the node cannot do
  during one. Conclude with whether your hardware keeps up, defended with the numbers.
acceptance:
  criteria:
    - Both clients are running and communicating, with the choice justified and its effect on network blast radius stated from current share figures
    - Checkpoint sync is used with what is being trusted stated, along with what verifying it afterwards would require and whether it was done
    - Snap, full-execution and archive are each described by what they keep and discard
    - Three concrete historical RPC queries are run, with which succeed and which are refused reported
    - On-disk state and block sizes are reported separately, with archive size attributed to the correct one
    - A blob request for a recent block is made and its result explained, with where blobs live, for how long, and the sampling scheme's effect
    - What the client will stop serving under history expiry, when, and the alternative source are stated
    - Disk IOPS and latency are measured under sync and at the head
    - Database growth over the run, prune duration, and what the node cannot do while pruning are reported
    - A defended conclusion on whether the hardware keeps up
hints:
  - Write the three historical queries before you choose a sync mode. Choosing the mode first biases you toward queries it can answer, and the refusals are the point.
  - Separate state size from block size in your reporting from the first measurement. Every confusion about archive-node cost is those two numbers added together.
  - Measure the disk at the head as well as during sync. Sync is bursty and forgiving; keeping up at the head is the constraint that actually decides whether your hardware is adequate.
