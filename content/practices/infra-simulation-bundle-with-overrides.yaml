id: infra-simulation-bundle-with-overrides
moduleId: infra-simulation
grain: block
kind: implement
title: Simulate a two-step bundle with a balance you do not have
concepts: [eth-simulatev1, state-overrides, bundle-simulation, estimategas-is-a-simulation]
spec: >
  Using a public endpoint that exposes `eth_simulateV1`, simulate an ERC-20 approval followed by a swap on a
  live DEX, from an address holding neither the token nor the ETH. Use a state override to give that address
  the token balance, and show that the second call succeeds only because the first executed in the same
  bundle - prove it by also simulating the swap alone and capturing the revert. Print the decoded logs and
  the balance deltas for the successful bundle. Then compare three gas figures for the same swap:
  `eth_estimateGas`, the gas reported inside the simulation result, and the gas used when the same call
  executes on a local fork, and explain any divergence in terms of cold and warm storage access.
acceptance:
  command: pnpm tsx scripts/simulate-bundle.ts --assert-isolated-call-reverts --report-gas
  criteria:
    - The bundled run succeeds and prints decoded logs plus per-address balance deltas
    - The same swap simulated without the preceding approval reverts, and the captured revert reason is reported
    - The state override is shown to be what supplies the token balance, by rerunning without it and capturing that failure too
    - All three gas figures are reported side by side with a written explanation of the divergence referencing cold versus warm access
hints:
  - Check first whether your endpoint actually exposes the method and what limits it applies - support still varies by provider.
  - Override the token balance by writing the balance mapping slot, not by trying to override the token contract's code.
  - The three gas numbers should not match; if they do, you have probably measured the same execution three times.
difficulty: 3
