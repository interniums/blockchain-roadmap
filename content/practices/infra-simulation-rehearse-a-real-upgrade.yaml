id: infra-simulation-rehearse-a-real-upgrade
moduleId: infra-simulation
grain: module
writeUp: >
  Describe a transaction you would be genuinely nervous to send - an upgrade, a large migration, a governance execution. Write down what you would simulate before sending it, in what environment, and what specific observation would make you send it anyway. Then write down the thing that could still go wrong after a perfectly green rehearsal, and say whether you would accept that risk or design it away.
coversConcepts:
  - simulation-definition
  - eth-call-is-the-primitive
  - estimategas-is-a-simulation
  - eth-simulatev1
  - state-overrides
  - bundle-simulation
  - pre-send-ux
  - simulation-is-not-a-guarantee
  - fork-testing-foundry
  - anvil-fork
  - cheatcodes-for-rehearsal
  - tenderly-virtual-testnets
  - upgrade-rehearsal
  - governance-rehearsal
  - calldata-verification
  - simulation-in-ci
  - simulation-for-incident-triage
kind: implement
title: Rehearse a proxy upgrade against live state, then break it on purpose
concepts: [upgrade-rehearsal, fork-testing-foundry, cheatcodes-for-rehearsal, governance-rehearsal, simulation-in-ci]
spec: >
  Write a Foundry fork test that rehearses a proxy upgrade at a pinned recent block: fork, impersonate the
  proxy admin, execute the real upgrade calldata, then run an existing integration test against the upgraded
  proxy and diff the storage layout of the old and new implementations. Extend it into a full governance
  rehearsal - grant voting power by writing storage, propose, vote, queue, advance past the timelock,
  execute - and assert the target parameter holds its new value at the end. Then deliberately introduce a
  storage-layout shift in the new implementation and show the rehearsal catching it. Wire the whole thing
  into CI, pinned and cached.
acceptance:
  command: forge test --junit --match-path test/UpgradeRehearsal.t.sol --fork-url $RPC_URL
  criteria:
    - The integration suite passes against the upgraded proxy on a pinned fork, and the pin is a literal block number in the test
    - The governance path reaches execute and asserts the target parameter's new value, with the timelock delay skipped rather than removed
    - Introducing a storage-layout shift makes the rehearsal fail, and the failure names the shifted slot rather than a generic revert
    - The CI job runs the same test with a warm fork cache and the second run is measurably faster than the first
hints:
  - Pin the block as a literal, not as "recent" - a moving fork makes every failure unreproducible.
  - Take the real upgrade calldata from a historical transaction rather than composing your own; composing it hides the encoding failures this practice exists to catch.
  - The layout shift should be subtle - reorder two same-size fields rather than deleting one - so the test has to actually diff rather than notice a size change.
difficulty: 4
