id: infra-simulation-what-green-does-not-prove
moduleId: infra-simulation
grain: block
kind: break
title: Show the user a green simulation and then have it fail
difficulty: 3
concepts: [pre-send-ux, simulation-is-not-a-guarantee]
spec: >
  A simulation is a statement about a block that has already passed. Build the flow that depends on it and then
  break it four ways.

  THE FLOW. Simulate before sending and show the user what will happen: the state changes, the balance
  differences, and the cost. Report what your interface displays and what it deliberately does not.

  FOUR DIVERGENCES. Then make the simulation green and the send fail, four different ways. State changed between
  simulation and inclusion. A dependency on the block number or timestamp. A price or rate that moved. And a
  transaction ahead of yours in the same block that changed what yours found. For each: show the green
  simulation, show the failure, and name the assumption the simulation made.

  WHAT TO SHOW INSTEAD. Now the design question. For each divergence, state what your interface should have told
  the user — not "this might fail", which is noise, but the specific conditional the outcome depends on. Then
  implement it for the one you consider most likely and show the improved display.

  THE HONEST BOUNDARY. Finally, state what a simulation can guarantee and what it cannot, as two short lists.
  Then answer the product question: given it cannot guarantee the outcome, what is it actually for? There is a
  good answer and it is not "confidence".
acceptance:
  criteria:
    - A pre-send simulation displays state changes, balance differences and cost, with what is deliberately not shown stated
    - Four divergences are demonstrated, each with a green simulation, a real failure, and the named assumption
    - For each divergence, the specific conditional the interface should have surfaced is stated
    - The improved display is implemented for the most likely divergence
    - What a simulation can and cannot guarantee are given as two lists
    - A stated answer to what simulation is actually for, other than confidence
hints:
  - The same-block-ahead-of-you case is the one people never test. Construct it with two transactions you control and order them deliberately.
  - Avoid generic warnings in the improved display. "This depends on the pool price staying within 1%" is useful; "this may fail" trains users to ignore you.
  - The good answer to the last question is that simulation catches the errors that are already certain. That is a large fraction of them and it is worth stating plainly.
