id: ledgers-accounts-defeat-the-origin-guard
moduleId: ledgers-accounts
grain: module
writeUp: >
  You are designing a backend that sends transactions from one hot wallet on behalf of many users. Given what the nonce actually is, write down what must be true of your system for it to send fifty transactions per minute without ever producing a gap or a collision. Then say which part of that design you would be most worried about at three in the morning, and why.
coversConcepts:
  - account-four-fields
  - account-address-not-stored
  - account-storage-root
  - account-code-hash
  - accounts-enable-stateful-contracts
  - account-balance-wei
  - empty-account-clearing
  - account-nonce-eoa
  - account-nonce-contract
  - nonce-total-ordering
  - nonce-replay-protection
  - eip-155-chain-id-replay
  - eoa-contract-line-is-blurred
  - utxo-vs-account-tradeoff
kind: break
title: Walk a contract through a "no contracts allowed" guard
concepts: [eoa-contract-line-is-blurred, account-code-hash, account-nonce-eoa]
spec: >
  Write a contract with the classic anti-contract guard, `require(msg.sender == tx.origin, "no
  contracts")`, protecting a function that should only ever be callable by a human — a mint, a
  claim, whatever fits. Then defeat it. Have an EOA sign a delegation to an attacker contract using
  Foundry's `vm.signAndAttachDelegation`, and call the guarded function from that account. The
  guard will pass, because the caller really is the transaction origin, while arbitrary attacker
  code executes as that caller. Prove both halves in `test/OriginGuard.t.sol`: one test showing a
  plain contract caller is correctly rejected, and one showing the delegated EOA sails through and
  runs code. Finish by writing a second guard that actually expresses the property the first one
  was reaching for, and a test that your bypass fails against it.
acceptance:
  command: forge test --match-path test/OriginGuard.t.sol -vvv
  criteria:
    - A test proves a normal contract caller is rejected by the guard
    - A test proves a delegated EOA passes the same guard while attacker contract code executes
    - The delegated test asserts that `EXTCODESIZE` on the caller is non-zero at the moment the guard passes
    - A replacement check is implemented and a test proves the same bypass fails against it
    - A comment states what property the replacement check actually enforces, in one sentence
hints:
  - Foundry ships cheatcodes for signing and attaching EIP-7702 delegations. You want the one that both signs and attaches in a single call, so the authority's nonce moves the way it would on mainnet.
  - "The guard passes because `tx.origin` is still the EOA — the delegation does not change who originated the transaction, only whose code runs when that account is called."
  - "There is no on-chain check that recovers the old meaning of the guard, because the old meaning no longer corresponds to anything the EVM can see. The honest replacement expresses an actual requirement — an allowlist, a signature over the specific action, or a rate limit — rather than trying to detect codelessness."
difficulty: 4
