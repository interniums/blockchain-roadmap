id: ledgers-accounts-rebuild-the-account-record
moduleId: ledgers-accounts
grain: block
kind: implement
title: Rebuild an account record from a proof and hash it yourself
concepts: [account-four-fields, account-address-not-stored, account-storage-root, account-code-hash]
spec: >
  Write a script that, given any mainnet address, calls `eth_getProof` for it, pulls `nonce`,
  `balance`, `storageHash` and `codeHash` out of the response, RLP-encodes those four values in
  spec order yourself, keccak-256s the result, and compares that hash against the account leaf
  value carried inside the returned `accountProof`. Do the RLP encoding by hand rather than by
  calling a library helper that takes an account object — the point is to discover that the record
  really is four fields and that nothing else is in it. Run it against three targets: a plain EOA
  that has sent transactions, a deployed contract with non-empty storage, and an address that has
  never been touched. Report what the third one returns and why. Write the tests in
  `test/account-record.test.mjs` so all three cases are asserted.
acceptance:
  command: node --test test/account-record.test.mjs
  criteria:
    - The computed hash matches the account leaf in `accountProof` for the EOA case
    - The computed hash matches for the contract case, and the test asserts `storageHash` differs from the empty-trie root
    - The never-touched address case is asserted explicitly, and the test states in a message what the node returned for it
    - The RLP encoding is written in the exercise's own code, not delegated to a library function that accepts an account struct
    - No test hard-codes an expected hash literal; every expectation is derived from the proof response
hints:
  - "`eth_getProof` returns the four fields you need at the top level of its result, and the account leaf you are trying to match is the last element of `accountProof`."
  - "The leaf is `[compactEncodedPathRemainder, value]` where the value is the RLP of the four-field list. You want to compare against that inner value, not against the leaf node itself."
  - "For the untouched address the node returns zeros and the two well-known empty hashes, and hashing that record gives you the value the trie would hold if the account existed. It does not exist — that is exactly the point of EIP-161, and the proof will show you an exclusion rather than an inclusion."
difficulty: 3
