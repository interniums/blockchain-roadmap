id: ledgers-accounts-three-layers-of-replay
moduleId: ledgers-accounts
grain: block
kind: break
title: Replay a transaction three ways, and find which layer stops each
difficulty: 3
concepts: [account-balance-wei, empty-account-clearing, nonce-replay-protection, eip-155-chain-id-replay, utxo-vs-account-tradeoff]
spec: >
  Replay protection is three separate mechanisms, and knowing which one stops what is the difference
  between a working integration and a drained one.

  THREE REPLAYS, THREE OUTCOMES. Take one signed transaction and attempt to replay it: on the same chain
  at the same nonce, on the same chain at a different nonce, and on a different chain with the same
  nonce. For each, say which layer rejected it — the nonce, the chain id, or nothing — and show the
  rejection.

  Then find the case that is not protected. Construct a message signed for one purpose and accepted for
  another, where no nonce and no chain id is involved because it never became a transaction. Name what
  would have prevented it.

  THE ASYMMETRY. Separately, show that ETH is not a token: transfer ETH and transfer an ERC-20 to the
  same recipient and enumerate every difference in what the receiving code can observe and control.
  Then demonstrate empty-account clearing: create an account, empty it, and show what happens to the
  record.

  Close with one sentence naming the thing this account model made cheap that the UTXO model made
  expensive, and one naming the reverse.
acceptance:
  command: forge test --junit --match-path test/ReplayLayers.t.sol
  criteria:
    - Three replay attempts are made and each attributed to the layer that rejected it, or to nothing
    - An unprotected signed message is accepted for a purpose it was not signed for, with the prevention named
    - Every observable difference between receiving ETH and receiving an ERC-20 is enumerated
    - Empty-account clearing is demonstrated on an account created and then emptied
    - One sentence names what the account model made cheap and one what it made expensive, against UTXO
hints:
  - Do the cross-chain replay against two local chains with different ids. It is the layer people forget exists, and seeing it reject a transaction is worth more than reading the EIP.
  - The unprotected case is a signature used off-chain. Nonces and chain ids protect transactions, not signatures, and that distinction is the finding.
  - For the ETH-versus-token list, include what happens when the recipient is a contract that reverts. The two cases diverge sharply there.
