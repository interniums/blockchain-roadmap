id: ledgers-blocks-count-the-missed-slots
moduleId: ledgers-blocks
grain: block
kind: measure
title: Prove that block number is not a clock
concepts: [slot-vs-block, epoch-and-finality-timing, block-gas-limit, blob-gas-fields]
spec: >
  Sample 1,000 consecutive slots from a beacon API and, over the same range, the execution blocks
  they produced. Count the missed slots, and show that the slot delta and the block-number delta
  across the sample are different numbers. Then chart, for the same range,
  `gasUsed / gasLimit`, `baseFeePerGas`, `blobGasUsed` and the blob base fee derived from
  `excessBlobGas`. Report the observed gas limit and say whether it matches the current default.
  Write the collector so the numbers are reproducible: cache the raw responses, and emit a JSON
  summary at `out/slot-sample.json` containing the miss count, the two deltas, the observed gas
  limit, and the correlation between the execution base fee and the blob base fee over the sample.
  Assertions live in `test/slot-sample.test.mjs` and run against the emitted summary.
acceptance:
  command: node scripts/sample-slots.mjs --slots 1000 && node --test test/slot-sample.test.mjs
  criteria:
    - The summary reports a missed-slot count and the sample covers at least 1,000 consecutive slots
    - A test asserts the slot delta and the block-number delta across the sample are not equal
    - The observed `gasLimit` is reported and compared against the current default rather than assumed
    - Both fee series are present per block, and the reported correlation between them is close to zero rather than close to one
    - Raw API responses are cached so a rerun produces an identical summary without new network calls
hints:
  - The beacon `/eth/v1/beacon/headers` range gives you slots; a missed slot is one with no header, which is an absence rather than a flag you can read.
  - The blob base fee is derived from `excessBlobGas` by the EIP-4844 exponential formula. Implement it rather than reading a precomputed field, because the derivation is the part worth understanding.
  - "If your two fee series look correlated, check whether you accidentally plotted `blobGasUsed` against `gasUsed` instead of the derived blob base fee against `baseFeePerGas`. Utilisation and price move very differently, and only the price comparison shows the two markets are independent."
difficulty: 3
