id: ledgers-blocks-rebuild-the-block-hash
moduleId: ledgers-blocks
kind: implement
title: Recompute a mainnet block hash from its header
concepts: [block-hash-is-header-hash, block-header-is-the-block, post-merge-fossil-fields, requests-hash]
spec: >
  Fetch a recent mainnet block with `eth_getBlockByNumber`, take every header field, RLP-encode
  them in the order the execution specs declare them, keccak-256 the encoding, and assert the
  result equals the block's reported `hash`. Take the field order from the `Header` dataclass in
  ethereum/execution-specs for the fork your block belongs to — not from a blog post and not from
  this exercise, because the ordering is the thing being tested and an RLP list is order-sensitive.
  Then make the exercise teach its own lesson: add a test that omits one field and asserts the hash
  no longer matches, and a test that swaps two adjacent fields and asserts the same. Finally, print
  the three post-Merge fossil fields and assert their values are the constants they are frozen at.
  Tests go in `test/header-hash.test.mjs`.
acceptance:
  command: node --test test/header-hash.test.mjs
  criteria:
    - The recomputed hash equals the reported block hash for a post-Pectra mainnet block
    - A negative test omits one field and asserts the hash differs
    - A negative test swaps two adjacent fields and asserts the hash differs
    - '`difficulty` and the header `nonce` are asserted to be their frozen post-Merge values'
    - A comment records the execution-specs path and fork the field order was read from
hints:
  - Quantities are RLP-encoded as minimal big-endian byte strings with no leading zeros, and zero encodes as the empty string rather than as a zero byte. Getting that wrong is the most common cause of a mismatch.
  - The JSON-RPC response gives you hex strings for everything; decide once whether your encoder takes numbers or bytes and be consistent, because a field encoded as a fixed-width 32-byte value where a quantity was expected will fail silently and look like an ordering bug.
  - "If the hash is wrong and every field looks right, print the length of your RLP payload and compare it against a known-good encoding of the same block from a library. A length difference of one or two bytes points at a quantity; a large difference points at a missing field."
difficulty: 4
