id: ledgers-blocks-three-roots-and-a-window
moduleId: ledgers-blocks
grain: block
kind: implement
title: Prove a receipt to someone who was not there, using only the header
difficulty: 3
concepts: [state-root-commits-to-all-accounts, transactions-root, receipts-root, logs-bloom, parent-beacon-block-root]
spec: >
  A header commits to three separate tries, and each one lets you prove a different thing to someone who
  has only the header. Build the proof for one of them.

  THE PROOF. For a real block, take one transaction receipt and construct a Merkle proof of it against
  the header's receipts root. Verify it with only the header and the proof — no node, no RPC. Then
  corrupt one byte of the receipt and show verification fail.

  THREE ROOTS, THREE JOBS. State what each of the three roots commits to, and demonstrate the key
  difference: the state root is keyed by account and is an output of execution, while the transactions
  and receipts roots are keyed by index. Show one consequence of index-keying that account-keying does
  not have.

  THE BLOOM. Use the block's logs bloom to test for an event that is present and one that is not. Then
  show the property that makes it a filter and not an index: construct a query the bloom says might match
  and the block does not actually contain. State what a client must do next, and what that means for
  anyone treating the bloom as an answer.

  THE WINDOW. Finally, read the parent beacon block root from inside a contract and say what having it
  makes possible that was not possible before it existed.
acceptance:
  command: forge test --junit --match-path test/ReceiptProof.t.sol
  criteria:
    - A real receipt is proven against a real header's receipts root using only the header and the proof
    - Corrupting one byte of the receipt causes verification to fail
    - All three roots are described by what they commit to, with state-root keying contrasted against index-keying
    - One consequence of index-keying that account-keying lacks is demonstrated
    - The bloom is queried for a present and an absent event
    - A false-positive bloom query is constructed, with what the client must do next and the consequence for treating the bloom as an answer
    - The parent beacon block root is read from a contract, with one capability it enables stated
hints:
  - Build the receipt proof before the state proof if you have done neither. Index keys are simpler than hashed account keys and the proof machinery is the same.
  - The index-keying consequence worth finding is what happens when you want to prove something about a transaction whose position you do not know.
  - False positives in the bloom are easy to find by trying enough random topics. Once you have one, the sentence about what the bloom is for writes itself.
