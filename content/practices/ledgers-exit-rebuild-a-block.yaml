id: ledgers-exit-rebuild-a-block
moduleId: ledgers-finality
grain: exit
trackId: ledgers
kind: measure
title: Rebuild a mainnet block from its header, and name everyone who touched it
difficulty: 5
concepts:
  - confirmation-policy
  - searcher-builder-relay-proposer
  - head-vs-justified-vs-finalized
  - reorg-depth-in-practice
spec: >
  Pick one mainnet block from the last month. Produce a written report and a test suite that,
  together, account for that block completely: what it contains, how it was assembled, who could
  have lied at each step, and how deep you would wait before believing a payment inside it.

  FIVE things have to be in it.

  ONE. Reconstruct the block hash from the header fields yourself. List every field, and mark each
  one live, or a post-Merge fossil that exists only because the structure could not change. A test
  asserts your reconstruction equals the real hash.

  TWO. For four accounts touched by that block, print the four fields of each account record, and
  say where the code and the storage of each actually live — not "in the account", which is the
  answer this track exists to break.

  THREE. Take six transactions and diagnose each: which of the six failure modes it hit, or that it
  succeeded. At least one must be a transaction that vanished or stuck rather than reverting, and
  your diagnosis has to come from raw RPC output rather than from a block explorer's label.

  FOUR. Trace the build path: searcher, builder, relay, proposer. Name the actual parties where you
  can identify them, and for each hop state what that party could have done that nobody downstream
  would detect.

  FIVE. Choose a confirmation policy for a hypothetical product that settles a payment from this
  block, and defend it against the concrete cost of reversing the chain at that depth. State the
  value at risk you assumed, because the answer is meaningless without it.
acceptance:
  command: forge test --match-path test/exit/BlockReport.t.sol
  criteria:
    - A test reconstructs the chosen block's hash from its header fields and fails if any field is altered
    - Every header field is listed and marked live or post-Merge fossil, with the fossils named specifically rather than counted
    - Four account records are printed with all four fields, and the report states where code and storage actually live rather than implying they are in the record
    - Six transactions are each diagnosed to a named failure mode or to success, from raw RPC output, and at least one is a stuck or vanished transaction rather than a revert
    - Every hop of searcher, builder, relay and proposer is named, with a concrete undetectable action stated for each
    - The confirmation policy names a depth, the value at risk it assumes, and the cost of reversal at that depth
    - A reader who does not have your RPC access can follow the report and reach the same conclusions from the data you quote
hints:
  - Start from the header, not the transactions. Getting the hash to reproduce is a hard yes-or-no signal that you have the field set and the encoding right, and everything else in the report is easier to trust once it does.
  - For the vanished transaction, stop looking at the transaction. Look at the mempool's view and at what replaced it — the evidence is in what is not there.
  - The undetectable action at each hop is the whole point of part four. If you cannot name one for a hop, you have not found that hop's trust assumption yet; you have found its happy path.
writeUp: >
  You now know what one block cost, who assembled it, and how much it would cost to undo. Which of
  the four trust assumptions you named would you actually be unwilling to accept in a product, and
  what would you build or buy to remove it?
