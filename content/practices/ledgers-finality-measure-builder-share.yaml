id: ledgers-finality-measure-builder-share
moduleId: ledgers-finality
kind: measure
title: Measure who is actually building blocks right now
concepts: [builder-centralization, mev-boost, searcher-builder-relay-proposer, relay-escrow]
spec: >
  Do not take a published builder-share figure on faith — the two most-cited 2026 numbers name
  different builder pairs and cannot both be current. Measure it. Over the last 1,000 mainnet
  blocks, identify the builder for each block and compute the share held by the top one, top two
  and top four. For the same sample, determine how many blocks were delivered through a relay at
  all, which gives you the MEV-Boost share. Then take one block and trace its value flow end to
  end: find it on a relay, identify the builder, and identify the payment from the builder to the
  proposer, stating where in the block that payment appears. Emit `out/builder-share.json` with the
  distribution, the sample range, and the source you measured from, and record how your top-two
  figure compares with the two published claims.
acceptance:
  command: node scripts/builder-share.mjs --blocks 1000 && node --test test/builder-share.test.mjs
  criteria:
    - The distribution covers 1,000 consecutive blocks and names the top four builders with their shares
    - The relay-delivered share of the sample is reported separately from the builder distribution
    - One block is traced from relay bid to on-chain proposer payment, and the payment's location in the block is named
    - The output records both published top-two claims alongside the measured figure and states which, if either, the measurement supports
    - The sample range and the data source are recorded so the measurement can be repeated
hints:
  - The builder is usually identifiable from the block's `extraData` or from a relay's own delivered-payload endpoint. The relay route is more reliable, because `extraData` is free text.
  - "Blocks not delivered by any relay are locally built. Counting them is how you get the MEV-Boost share, and it is a different denominator from the builder distribution."
  - "The proposer payment is normally the last transaction in the block, from the builder's address to the proposer's fee recipient. If you do not find one, check whether the block instead paid via the coinbase directly, which some builders do."
difficulty: 3
