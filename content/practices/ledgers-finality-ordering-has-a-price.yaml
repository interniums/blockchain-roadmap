id: ledgers-finality-ordering-has-a-price
moduleId: ledgers-finality
grain: block
kind: measure
title: Put a number on what ordering was worth in one block
difficulty: 3
concepts: [mev, pbs]
spec: >
  Ordering is a resource with a price, and the price is observable. Measure it for one block.

  Pick a recent mainnet block. Establish how much the proposer was paid beyond the ordinary fees — the
  payment from the builder — and where in the block that payment appears. Report it in ETH and as a
  multiple of the block's total priority fees.

  Then find where the value came from. Identify at least two transactions in the block whose position
  mattered, and for each say what would have changed had it been ordered differently. At least one must
  be a case where somebody is worse off because of the ordering, and one where nobody in particular is.

  Then the structural half: name the separation that makes this measurable at all. Say which party
  chooses the contents, which signs, and what the signer knows about the contents when they sign.
  Report, for the last hundred blocks, what fraction were built externally rather than by the proposer.

  Close with one sentence on why the payment appears where it does in the block rather than in a fee
  field.
acceptance:
  criteria:
    - The proposer's payment beyond ordinary fees is reported in ETH for a real block, with its location in the block identified
    - That payment is expressed as a multiple of the block's total priority fees
    - Two transactions whose position mattered are identified with the consequence of reordering each
    - One is a case with a specific party worse off and one where nobody in particular is
    - The content-chooser and the signer are named separately, with what the signer knows at signing time
    - The externally built fraction of the last hundred blocks is reported
    - One sentence explains why the payment appears where it does rather than in a fee field
hints:
  - The proposer payment is usually the last transaction in the block. Find it by looking for a transfer to the fee recipient rather than by parsing fee fields.
  - For the two transactions, an arbitrage and a sandwich are the clean pair. One has an identifiable victim and one does not, and that distinction is the taxonomy the track is building.
  - The externally built fraction is high enough to be the point. Get the actual number rather than the one in an article from last year.
