id: ledgers-finality-three-confirmation-policies
moduleId: ledgers-finality
kind: write
title: Write and defend three different confirmation policies
concepts: [confirmation-policy, head-vs-justified-vs-finalized, reorg-depth-in-practice]
spec: >
  Choose a confirmation policy for three products with very different exposure — an in-game action
  worth a few cents, a ten-dollar consumer payment, and a ten-million-dollar institutional
  settlement. For each, state exactly what the backend waits for before it treats the action as
  done: a number of slots, a justified checkpoint, or a finalized checkpoint. Defend each choice
  against the cost of reversing the chain to that depth, and be specific about what that cost is in
  ETH rather than in confidence adjectives. Then handle the part most designs skip: for each
  product, say what the system does when a reorg happens after it acted — not what it shows the
  user, what it does to the data. Finally, state one thing each policy gets wrong that you are
  accepting on purpose. Deliverable is `answers/confirmation-policies.md`.
acceptance:
  command: npx markdownlint-cli2 answers/confirmation-policies.md && grep -Ec '^## ' answers/confirmation-policies.md
  criteria:
    - Each of the three products has an explicit wait condition expressed in protocol terms, not in "confirmations"
    - Each choice is defended against a reversal cost stated in ETH, with the reasoning shown
    - The three policies are not the same policy with different numbers; at least two different confidence levels are used
    - Each product has a stated rollback behaviour describing what happens to already-written data
    - Each policy names one accepted weakness, and none of the three is "we might be slow"
hints:
  - Start from the attacker's side. For each product, ask what the largest single payout is that reversing your chain would earn someone, then require a wait whose reversal cost exceeds it.
  - "A one- or two-slot reorg costs an attacker essentially nothing, so any policy shorter than a justified checkpoint is accepting that it will occasionally be wrong. That can be entirely correct — say so explicitly rather than pretending otherwise."
  - "The rollback question is the one that separates a real policy from a paragraph. Notifications sent, payouts made and exports written do not roll back when your database does, so the honest design either delays those side effects to the confirmation boundary or accepts a compensating action."
difficulty: 3
