id: ledgers-mempool-find-the-bump-threshold
moduleId: ledgers-mempool
kind: implement
title: Discover your endpoint's replacement threshold instead of assuming it
concepts: [transaction-replacement, price-bump-rule, cancellation-is-a-replacement, blob-pool-different-rules]
spec: >
  Write a replacement helper that takes a stuck transaction hash and a bump percentage, and
  constructs a same-sender, same-nonce replacement with both fee fields raised by that percentage.
  Then use it to measure rather than assume: binary-search the smallest bump your RPC endpoint
  actually accepts, by submitting replacements at increasing percentages and recording which are
  rejected with an underpriced error. Do not hard-code a threshold anywhere in the helper — read it
  from the measurement, and note in the output which client and endpoint you measured, because this
  is client policy and differs. Then repeat the measurement for a type-3 blob transaction on the
  same endpoint and show the two thresholds are not the same. Emit `out/bump-threshold.json` with
  both measured thresholds, the endpoint identity, and every rejected attempt with its error string.
acceptance:
  command: node scripts/measure-bump.mjs && node --test test/bump-threshold.test.mjs
  criteria:
    - The measured legacy-pool threshold is derived from observed accept/reject boundaries, not from a constant in the source
    - At least one attempt below the measured threshold is recorded with the node's verbatim rejection error
    - The blob-transaction threshold is measured on the same endpoint and asserted to be strictly larger than the legacy one
    - The output records the endpoint and, where obtainable, the client name and version
    - A test asserts the helper raises both `maxFeePerGas` and `maxPriorityFeePerGas`, not only one of them
hints:
  - A replacement must beat the incumbent on both fee fields. Bumping only the tip is the most common way to get an underpriced rejection while believing you raised the price.
  - Binary-search on integers, not on percentages of a float, and recompute the absolute fee values each round from the incumbent's — rounding down at the boundary is exactly where the rejections cluster.
  - "For the blob case you also have to satisfy the blob pool's fee floor, and nonce gaps are rejected outright rather than queued, so build the blob test from a clean, contiguous nonce or you will be measuring the wrong rejection."
difficulty: 4
