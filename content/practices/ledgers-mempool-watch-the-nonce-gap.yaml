id: ledgers-mempool-watch-the-nonce-gap
moduleId: ledgers-mempool
grain: block
kind: break
title: Create a nonce gap and watch it not resolve
concepts: [nonce-gap, pending-vs-queued, mempool-view-is-node-local, pool-limits-and-eviction]
spec: >
  On a testnet, from an account you control, send the transaction at nonce N+1 first, without ever
  sending N. Poll `txpool_content` and record where the transaction sits. Then, without sending N,
  try to make it go through: raise the priority fee to an absurd level via a replacement, wait
  several blocks, and record that nothing changes. Then send N and capture the moment both promote
  and land. Do the whole run against two different RPC endpoints simultaneously and diff what each
  reports about the same transaction hash at the same wall-clock moments. Emit a timeline to
  `out/nonce-gap.json` with, for each poll, the timestamp, each endpoint's answer, and the pool
  bucket the transaction was in. Assertions go in `test/nonce-gap.test.mjs`.
acceptance:
  command: node scripts/nonce-gap.mjs && node --test test/nonce-gap.test.mjs
  criteria:
    - The timeline shows the transaction in the queued bucket for at least ten consecutive polls before N is sent
    - A test asserts the fee increase did not move the transaction out of the queued bucket
    - The timeline records at least one poll where the two endpoints disagree about the transaction's state
    - The promotion from queued to pending is captured in the timeline within one block of N being sent
    - The write-up states, in one sentence, why the wallet UI would have said "pending" for the entire run
hints:
  - '`txpool_content` reports pending and queued as separate maps keyed by sender. Read the bucket, not the presence.'
  - "The fee bump has to itself be a valid replacement — same sender, same nonce, enough of a bump to be accepted — otherwise you are measuring a rejected replacement rather than an ineligible transaction."
  - "If both endpoints always agree, you are probably talking to the same infrastructure twice. Point one at a node you run yourself, or at a provider on a different network path, and poll fast enough that propagation is visible."
difficulty: 3
