id: ledgers-mempool-where-it-really-goes
moduleId: ledgers-mempool
grain: block
kind: measure
title: Send the same transaction publicly and privately, and watch who saw it
difficulty: 3
concepts: [eip-1559-fee-fields, mempool-pending-is-not-a-queue, mempool-is-a-public-broadcast, private-orderflow, order-flow-auctions, private-orderflow-centralises-building]
spec: >
  Send one transaction two ways and report the difference in who could see it and what it cost.

  WHAT YOU ARE BIDDING. First get the fee fields right. For one transaction, state the max fee, the max
  priority fee, and the base fee at inclusion, and compute what was actually paid and what was refunded.
  Then construct a transaction that is valid but will not be included at the current base fee, and say
  which field made it unincludable.

  PUBLIC. Broadcast to the public mempool and observe it from a second vantage point — another node or a
  public mempool stream. Record the time between broadcast and third-party visibility. That number is
  the window in which anyone can act on your intent.

  PRIVATE. Send the same kind of transaction through a private route. Show it not appearing in the public
  mempool before inclusion, and report the inclusion latency against the public path.

  NOT A QUEUE. Demonstrate that pending is a set rather than a queue: submit two transactions where the
  later-submitted one is included first, and explain why from the fee fields.

  THE COST. Close with the trade: name who now sees your transaction on the private path that did not
  before, and state the concentration consequence — private order flow does not remove the observer, it
  changes which one, and the write-up must say which.
acceptance:
  criteria:
    - Max fee, max priority fee and base fee at inclusion are reported, with amount paid and refunded computed
    - A valid but unincludable transaction is constructed with the responsible field named
    - Time from public broadcast to third-party visibility is measured
    - A private submission is shown absent from the public mempool before inclusion, with inclusion latency compared against public
    - Two transactions are included out of submission order, explained from their fee fields
    - The party that observes the private path is named, with the concentration consequence stated
hints:
  - Observe from a node you do not control if you can. Watching your own mempool tells you the transaction arrived, not that anyone else could see it.
  - The refund calculation is where the fee fields become concrete. Compute it by hand once and the difference between max fee and priority fee stops being a naming problem.
  - For the closing trade, follow the transaction to the builder. The honest sentence is that you swapped a public observer for a privileged one, and naming that party is the exercise.
