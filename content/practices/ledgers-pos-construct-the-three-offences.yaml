id: ledgers-pos-construct-the-three-offences
moduleId: ledgers-proof-of-stake
grain: block
kind: write
title: Construct each slashable offence by hand
concepts: [double-proposal-slashing, double-vote-slashing, surround-vote-slashing, attestation]
spec: >
  Write out a concrete worked example of each of the three slashable offences, using real numbers
  rather than prose. For the two attestation offences give the actual source and target epochs of
  both messages and show why the pair is contradictory — for the surround vote, show the
  containment in both directions and confirm it holds either way. For the double proposal, give the
  slot and the two block roots. Then write the operational half, which is the part that matters:
  for each offence, name the specific operator mistake that produces it accidentally, and name the
  file or mechanism a validator client uses to prevent it. Finish by explaining why a validator
  that loses its slashing-protection database cannot safely resume immediately, and what it must do
  instead. Deliverable is `answers/slashing-offences.md`.
acceptance:
  command: npx markdownlint-cli2 answers/slashing-offences.md && grep -Ec '^### ' answers/slashing-offences.md
  criteria:
    - All three offences have a worked example with concrete epoch or slot numbers
    - The surround-vote example shows the span relationship explicitly and states that it is slashable in either direction
    - Each offence names a realistic accidental cause, and none of the three causes is "the operator was malicious"
    - The slashing-protection mechanism is named for each offence
    - The final section explains why a lost protection database requires waiting rather than restarting, and says what is being waited for
hints:
  - Draw the two attestations as intervals on an epoch axis. Double vote is two intervals with the same right endpoint; surround is one interval strictly containing the other.
  - Every accidental cause reduces to the same thing — two processes holding the same key, or one process with no memory of what it signed before.
  - "The reason you must wait rather than restart is that you cannot prove to yourself what you already signed, and any vote you now cast might surround or contradict one of them. What you are waiting for is enough epochs to pass that no new vote of yours can conflict with a vote from before the loss."
difficulty: 2
