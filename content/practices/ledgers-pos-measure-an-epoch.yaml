id: ledgers-pos-measure-an-epoch
moduleId: ledgers-proof-of-stake
kind: measure
title: Measure a real epoch's participation
concepts: [slot-and-epoch, committee, attestation, validator]
spec: >
  Query a beacon API for one recent finalized epoch and report what actually happened in it: the
  participation rate, the number of distinct committees, the committee size, how many slots were
  missed, and any slashings recorded. Then do the arithmetic that makes the design visible —
  multiply committee size by committees per slot by slots per epoch and check it against the active
  validator count, so you can see for yourself that each validator attests exactly once per epoch.
  Report the total active stake in ETH rather than in validator count, and state why those two
  numbers no longer track each other. Emit `out/epoch-report.json` and assert its contents in
  `test/epoch-report.test.mjs`.
acceptance:
  command: node scripts/epoch-report.mjs --epoch finalized && node --test test/epoch-report.test.mjs
  criteria:
    - The report contains participation rate, committee count, committee size, missed slots and slashings for one epoch
    - A test asserts committee size times committees per slot times 32 is within rounding of the active validator count
    - Total active stake is reported in ETH and is not derived by multiplying validator count by 32
    - A test asserts the epoch spans exactly 32 slots and that missed slots are counted as absences rather than as errors
    - The report records which beacon endpoint answered, since participation figures are node-local until finalized
hints:
  - The committees endpoint for an epoch gives you the assignment directly; you do not have to derive it from the shuffling.
  - Participation is a ratio of attesting balance to total active balance, not a ratio of attester count to validator count. Those differ now that effective balances vary.
  - "If your committee arithmetic is off by a large factor, check whether you used committees per slot or committees per epoch. The spec caps committees per slot, so the per-epoch number is that cap times 32."
difficulty: 3
