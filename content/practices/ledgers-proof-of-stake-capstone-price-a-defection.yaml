id: ledgers-proof-of-stake-capstone-price-a-defection
moduleId: ledgers-proof-of-stake
grain: module
writeUp: >
  The correlation penalty means the same mistake costs one operator almost nothing and costs a large coordinated group everything. Write down what behaviour that design is trying to price, and then apply it: if you were running validators, name the three specific operational choices this changes, and the one you would still get wrong because the cheaper option is so much easier.
coversConcepts:
  - validator
  - slot-and-epoch
  - slot-timing
  - attestation
  - committee
  - slashing
  - double-proposal-slashing
  - double-vote-slashing
  - surround-vote-slashing
  - correlation-penalty
  - slashing-timeline
kind: measure
title: Price every way a validator can defect, alone and in a crowd
difficulty: 4
concepts: [validator, slot-and-epoch, slot-timing, attestation, committee, slashing, double-proposal-slashing, double-vote-slashing, surround-vote-slashing, correlation-penalty, slashing-timeline]
spec: >
  Build a slashing calculator, and use it to make the argument this module exists to make: that the
  penalty is not for being wrong, it is for being wrong together.

  CONSTRUCT ALL THREE OFFENCES. Produce, as concrete signed message pairs against a real chain
  config, one double proposal, one double vote and one surround vote. For the surround vote,
  demonstrate a pair that is slashable and a pair that looks similar and is not, with the source and
  target epochs of each written out.

  THE CALCULATOR. Given a validator's balance and the number of validators slashed in the same
  window, compute the initial penalty, the correlation penalty, and the total — and the timeline over
  which each is applied. Test it against the real values for at least two historical slashing events.

  THE CURVE. Plot total loss against the number of correlated offenders, from one validator to a
  third of the set. Mark the point where the loss becomes total. State the number of validators at
  that point, and what fraction of the set it is.

  THE ARGUMENT. In one page: why is the penalty structured this way rather than as a fixed fine?
  Answer it in terms of what a fixed fine would fail to deter. Then state what it costs an honest
  operator who runs two clients badly and gets slashed alone — and whether you think that number is
  correct.

  THE CLOCK. Finally, show why slot timing makes some of this unavoidable: given the slot and epoch
  structure and the committee sampling, say how long an operator has to notice a misconfiguration
  before it becomes slashable, and whether that window is long enough.
acceptance:
  command: forge test --junit --match-path test/capstone/Slashing.t.sol
  criteria:
    - All three slashable offences are constructed as concrete signed message pairs against a real chain config
    - A slashable and a non-slashable surround-vote pair are both given, with source and target epochs written out for each
    - The calculator reproduces the real total penalty for at least two historical slashing events
    - Initial penalty, correlation penalty and application timeline are computed separately rather than as one figure
    - The loss curve is plotted from one offender to a third of the set, with the point of total loss marked and stated as both a count and a fraction
    - A one-page argument explains the structure in terms of what a fixed fine would fail to deter
    - The cost to an honest operator slashed alone is stated as a number, with a judgement on whether it is correct
    - The window an operator has to notice a misconfiguration before it becomes slashable is derived from slot and epoch structure
hints:
  - Build the surround-vote checker before the calculator. It is the offence people get wrong, and having a checker that says yes or no to a pair makes the rest of the exercise concrete.
  - The correlation penalty is not the initial penalty scaled. Read the formula twice and note which balance it is a fraction of, because getting that wrong produces numbers that look plausible and are not.
  - For the honest-operator question, find a real one. There are public post-mortems from operators who were slashed by their own tooling, and the number in them is more persuasive than yours.
