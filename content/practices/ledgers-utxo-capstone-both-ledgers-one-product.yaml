id: ledgers-utxo-capstone-both-ledgers-one-product
moduleId: ledgers-utxo
grain: module
writeUp: >
  Pick something your product needs to do with money — a subscription, a refund, an escrow, a split payment. Describe how you would represent it in each model. Then answer honestly: which of the two would you rather implement it in, and which of the two would you rather audit it in? If those are different answers, say why.
coversConcepts:
  - utxo
  - utxo-inputs-outputs
  - utxo-model
  - locking-script
  - unlocking-script
  - script-vm
  - no-global-state
  - utxo-parallelism
  - utxo-privacy
  - why-ethereum-chose-accounts
kind: write
title: Design one product twice, once in each ledger, and price the difference
difficulty: 4
concepts: [utxo, utxo-inputs-outputs, utxo-model, locking-script, unlocking-script, script-vm, no-global-state, utxo-parallelism, utxo-privacy, why-ethereum-chose-accounts]
spec: >
  Take one product that is not an escrow — a subscription that pays out monthly, a shared treasury
  with three signers, or a coupon that can be redeemed once by anyone holding a secret. Design it
  fully in both ledger models and write up what each one cost you.

  IN THE UTXO MODEL. Specify the state as a set of outputs. For every output, write the locking
  predicate in words precise enough to implement, and the unlocking witness that satisfies it. Show
  the transaction graph for the happy path and for one failure. Say what the script VM must be able
  to do, and — this is the part that bites — what it must NOT be able to do for your design to remain
  safe.

  IN THE ACCOUNT MODEL. Specify the same product as contract state and functions. Show the storage
  layout and the call sequence.

  THEN THE FOUR COMPARISONS, each with a concrete claim rather than a generality.

  PARALLELISM. Name two operations in your product that two users could do simultaneously in the UTXO
  design and could not in the account design, and say what the account design must do instead.

  PRIVACY. State exactly what an observer learns from each design about who is doing what. Be
  specific: not "UTXO is more private" but which field reveals which fact.

  CONTENTION. Find the place your account design has a hotspot — a single slot many users write — and
  say what happens under load. Then say whether the UTXO design has an equivalent, and if not, what
  it pays instead.

  THE BILL. Conclude with the one thing your product genuinely could not do in the UTXO model, and
  the one thing it could do more cheaply. If you cannot find both, you have designed one of them
  badly.
acceptance:
  command: 'true'
  criteria:
    - The UTXO design specifies every output's locking predicate and unlocking witness precisely enough to implement
    - It states what the script VM must not be able to do for the design to stay safe
    - Transaction graphs are given for the happy path and for at least one failure
    - The account design specifies storage layout and call sequence for the same product
    - Two concretely named operations are parallel in one model and serialised in the other, with the account design's workaround stated
    - Privacy is compared by naming which field reveals which fact, not by ranking the models
    - A hotspot in the account design is identified with its behaviour under load, and the UTXO equivalent named or its absence explained
    - The write-up names one thing the product could not do in UTXO and one it could do more cheaply
hints:
  - Pick the coupon. It is the design where the UTXO version is genuinely nicer, which stops the exercise turning into a list of reasons accounts won.
  - Write the locking predicate as if you were implementing it, not describing it. "Requires a signature" is not a predicate; the predicate is what it checks the signature against and what stops it being replayed.
  - The hotspot question is the one that transfers. Every account-model contract you write later has one, and this is the cheapest place to learn to look for it.
