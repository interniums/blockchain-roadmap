id: ledgers-utxo-escrow-in-two-ledgers
moduleId: ledgers-utxo
kind: write
title: Model one escrow in both ledgers
concepts: [utxo-model, utxo-inputs-outputs, locking-script, why-ethereum-chose-accounts, no-global-state]
spec: >
  Take one concrete arrangement: Alice locks 10 units for Bob, either party may claim after a
  deadline, and until the deadline it takes both signatures to release. Write it out twice.
  First as UTXO: name every output that exists at each stage, its amount, and the predicate on it —
  including the change output and who holds it. Second as an account-model contract: name the
  storage variables, who calls what, and what the deadline check reads. Then answer three questions
  with specifics rather than adjectives. Which representation makes it easier for a third party to
  verify the escrow's current state without trusting anyone? Which makes it easier for ten
  unrelated escrows to be settled concurrently? And what would you have to add to the UTXO version
  to let a stranger deposit into an existing escrow, which the account version gets for free?
  Deliverable is a single markdown file at `answers/escrow-two-ledgers.md` with four headed
  sections: `## UTXO`, `## Accounts`, `## Comparison`, `## What I got wrong first`.
acceptance:
  command: npx markdownlint-cli2 answers/escrow-two-ledgers.md && grep -c '^## ' answers/escrow-two-ledgers.md
  criteria:
    - The UTXO section names every output at every stage with its amount and predicate, including change
    - The account section names the storage variables and states which one the deadline check reads
    - The comparison answers all three questions with a specific mechanism, not a general adjective
    - The third question is answered by naming what UTXO must add for third-party deposits, not by asserting it is impossible
    - The final section records at least one thing the author believed at the start of the module and no longer believes
hints:
  - Start with the UTXO version and force yourself to draw the outputs at three moments — before funding, after funding, after release. The number of outputs at each moment is the whole answer.
  - "There is no way to add value to an existing output. Adding a deposit means spending the escrow output and creating a new, larger one — which means whoever does that must satisfy the existing predicate."
  - "The account version gets third-party deposits free because the escrow has a stable address that anyone can send to, and its storage is mutated in place. That is exactly the property the UTXO version has to simulate with a re-spend, and simulating it is what forces a specific party to be online."
difficulty: 2
