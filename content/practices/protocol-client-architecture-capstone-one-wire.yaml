id: protocol-client-architecture-capstone-one-wire
moduleId: protocol-client-architecture
grain: module
writeUp: >
  Your team runs one node behind every product surface you ship, and it runs the same execution and consensus clients as almost everyone else you know. Write down what specifically happens to your product — not to Ethereum — in each of two scenarios: your consensus client is part of a buggy 33% that stalls finality, and your consensus client is part of a buggy 66% that finalises an invalid chain. Then say which of the two you can engineer around, and what that engineering costs.
