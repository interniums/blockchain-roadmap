kind: measure
title: Watch the one wire between the two programs, for a hundred slots
difficulty: 4
concepts: [el-cl-split, execution-client-role, consensus-client-role, engine-api, engine-api-jwt, engine-newpayload, engine-forkchoiceupdated, engine-getpayload, cl-drives-el, slot-phases, validator-duties, client-diversity-thresholds, supermajority-client-risk]
spec: >
  Run a node and instrument the Engine API. Everything in this module is visible on that one channel, and
  the deliverable is a hundred slots of it, read.

  THE CHANNEL. Capture Engine API traffic for at least a hundred slots. Establish first that it is
  authenticated: show a request rejected without the JWT, and state where the secret file lives and what
  its permissions are. Then say what an attacker with that file could do.

  THE THREE CALLS. Classify every captured message. For each of newPayload, forkchoiceUpdated and
  getPayload: how many did you see per slot, in what order, and what does each one actually ask? Produce
  the per-slot sequence as a diagram from your own capture, not from a spec.

  WHO IS DRIVING. Prove the direction: show that the consensus client initiates and the execution client
  answers, and find one message that demonstrates the consensus client telling the execution client what
  is canonical. State what the execution client would believe without it.

  THE SLOT, SECOND BY SECOND. Overlay your captured timestamps onto the slot phases. Mark where the
  attestation deadline falls and where your node's messages actually landed relative to it. Report how
  often you were late, if ever.

  DUTIES. If you run a validator client separately, show the split: which process holds the key, and what
  the consensus client asks it for. If you do not, state exactly which of your captured messages would
  have come from a validator client instead.

  DIVERSITY AS BLAST RADIUS. Look up the current client distribution on both layers. State the two
  thresholds that matter and what happens at each. Then compute it for your own setup: if your execution
  client had a consensus bug tomorrow, what fraction of the network goes with you, and what happens to
  your stake — the answer differs sharply above and below one of those thresholds.
acceptance:
  criteria:
    - Engine API traffic is captured over at least a hundred slots
    - A request is shown rejected without the JWT, with the secret's location and permissions stated
    - What an attacker holding that file could do is stated
    - Every message is classified, with per-slot counts and ordering for newPayload, forkchoiceUpdated and getPayload
    - A per-slot sequence diagram is produced from the capture rather than from the spec
    - One message is identified that demonstrates the consensus client declaring what is canonical, with what the execution client would believe without it
    - Captured timestamps are overlaid on slot phases with the attestation deadline marked and lateness reported
    - The validator-client split is shown, or the messages that would come from one are named
    - Current client distribution is given for both layers with the two thresholds and their consequences
    - The blast radius of your own client choice is computed, including the effect on stake either side of a threshold
hints:
  - Capture before you read the spec section again. The per-slot message pattern is not quite what the prose implies, and finding the difference yourself is the exercise.
  - The JWT rejection is worth doing properly. It is the only authentication on a channel that can tell your node what to believe, and seeing it refuse is more instructive than reading that it exists.
  - For the blast radius, get the actual percentages rather than the rounded ones in articles. Whether you are above or below the threshold changes the answer completely, and some clients sit close to it.
