id: protocol-client-architecture-engine-handshake
moduleId: protocol-client-architecture
grain: block
kind: implement
title: Speak the Engine API yourself, then break the handshake on purpose
concepts: [engine-api, engine-api-jwt, engine-newpayload, engine-forkchoiceupdated, engine-getpayload]
spec: >
  Stand up an execution client in dev mode locally (Reth or Geth, both expose the Engine API on
  8551) with a jwt.hex secret you generate yourself. Then write a small TypeScript client that does
  what a consensus client does, without a consensus client: mint an HS256 JWT from that secret with
  a current iat claim, call engine_forkchoiceUpdatedVn with payload attributes to start a build,
  take the returned payloadId, wait, call engine_getPayloadVn, and feed the result back in with
  engine_newPayloadVn. Assert the status you get. Then add two failure tests: one that signs the JWT
  with a different secret, and one that signs with a correct secret but an iat skewed far into the
  past. Record which HTTP status and which error body each produces, and what the execution client
  logs in each case. Finally, call engine_getPayloadVn twice for the same payloadId with a delay
  between the calls and compare the block values.
acceptance:
  command: npx vitest run test/engine-handshake.test.ts
  criteria:
    - A test drives forkchoiceUpdated with attributes, receives a payloadId, retrieves a payload and gets a VALID status back from newPayload
    - A test with a wrong JWT secret asserts the exact rejection the execution client returns, and the assertion names the status code rather than matching on any error
    - A test with a stale iat claim is rejected, proving the failure is time-bound and not only secret-bound
    - A test calls getPayload twice for one payloadId and asserts the later call returns a block with a value greater than or equal to the earlier one
hints:
  - The JWT payload needs only an iat claim, and clients enforce a tight window around it — that is what the second failure test is probing.
  - forkchoiceUpdated without payload attributes only communicates the head; you must pass attributes to get a payloadId back at all.
  - A dev-mode execution client with no consensus client attached will report itself as SYNCING until you give it a forkchoice update naming a head it has — start from its genesis hash.
difficulty: 3
