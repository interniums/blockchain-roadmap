id: protocol-client-architecture-slot-arrival-histogram
moduleId: protocol-client-architecture
kind: measure
title: Measure how close blocks come to the attestation deadline
concepts: [slot-phases, validator-duties, cl-drives-el]
spec: >
  Using a public beacon-chain HTTP API or your own synced node, sample at least 200 consecutive
  recent slots. For each slot record whether a block exists at all, and for those that do, the
  wall-clock arrival time relative to the start of the slot — derive slot start from the genesis
  time and the 12-second slot length reported by the node's config endpoint, not from a hardcoded
  constant. Produce a histogram of arrival times with the four-second attestation deadline drawn on
  it, and state your observed missed-slot rate. Then answer in writing: what fraction of blocks
  arrived after the deadline, and what would you expect to happen to those blocks in fork choice.
acceptance:
  command: npx tsx src/sample-slots.ts --slots 200 --out out/arrivals.json && npx vitest run test/arrivals.test.ts
  criteria:
    - out/arrivals.json contains one record per sampled slot, each either marked missed or carrying an arrival offset in milliseconds from slot start
    - Slot start is computed from the chain's genesis time and configured seconds-per-slot fetched from the node, and a test asserts this rather than a literal
    - A test asserts the sample covers a contiguous slot range with no gaps, so the missed-slot rate is a real rate and not an artefact of skipped queries
    - The written answer states the observed missed-slot rate and the fraction of blocks arriving after four seconds
hints:
  - Beacon APIs return a 404 for a slot with no block; that is your missed-slot signal, not an error to retry.
  - Arrival time is not in the block. You have to observe it, or use a source that recorded it — say plainly which one you used and what that does to your numbers.
  - A block arriving after the attestation deadline does not vanish; it loses the votes of everyone who had already attested to its parent.
difficulty: 2
