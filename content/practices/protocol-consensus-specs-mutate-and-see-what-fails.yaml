id: protocol-consensus-specs-mutate-and-see-what-fails
moduleId: protocol-consensus-specs
grain: block
kind: break
title: Change one line of the spec and find out which clients would fork
concepts: [test-vector-generation, consensus-spec-tests, fork-layered-specs, spec-release-channels]
spec: >
  With the pyspec built, introduce exactly one mutation into the specification's own source — a
  changed divisor in a penalty calculation, or a reordering of two steps inside epoch processing.
  Rebuild and run the reference test suite for that fork. Record which test vectors fail, in which
  categories, and with what kind of mismatch. Then answer in writing: would this mutation, shipped
  in a real client, cause a chain split, a slashing event, or nothing observable? Repeat with a
  second mutation chosen so that it fails a different category of vector than the first. Finally,
  make a mutation you predict will fail nothing, run the suite, and explain what that says about
  test coverage.
acceptance:
  command: uv run pytest tests/core/pyspec --preset minimal -q --junitxml=out/results.xml
  criteria:
    - out/results.xml from the unmutated build is green, establishing a clean baseline before any mutation
    - Each mutation run records the failing vector names and categories, and the two chosen mutations fail different categories
    - A written analysis states, per mutation, whether a client shipping it would split the chain, get its validators slashed, or diverge invisibly
    - The deliberately-undetected mutation is documented with an argument about what the vector corpus does not cover
hints:
  - Mutate the built spec module, not your copy of the test — a mutation the tests import is the whole point.
  - Categories matter more than counts. A failure in operations vectors and a failure in fork-choice vectors mean very different things about blast radius.
  - The vectors were generated by running the spec. Ask yourself what that implies about a mutation that no vector exercises.
difficulty: 4
