id: protocol-consensus-specs-read-a-change
moduleId: protocol-consensus-specs
grain: block
kind: read
title: Read one protocol change across both specifications
difficulty: 3
concepts: [consensus-specs-repo, execution-specs-repo, cl-fork-codenames, reading-a-spec-change]
spec: >
  There is no single Ethereum specification, and reading a change means reading in two places and knowing
  which one is authoritative for what.

  THE TWO REPOSITORIES. State what each of the two specifications covers and, for four concrete questions,
  which one answers it — a gas cost, an attestation rule, a transaction encoding, a fork-choice tiebreak.
  Then explain the naming: what the consensus-layer fork codenames are, how they pair with the
  execution-layer names, and how to tell from a codename alone which layer someone is talking about.

  ONE CHANGE, FOLLOWED. Pick a single change from a recent fork and follow it end to end. Where was it
  proposed. What did the specification diff actually say — quote it. Which layer's specification changed, and
  did the other need a corresponding change. What tests came with it, and where do they live. Which clients
  implemented it and were there disagreements about the reading.

  Then the reviewer's question: find something in that diff that is not obvious from the proposal — a case
  the specification handles that the proposal did not discuss. Every non-trivial change has one.

  Close with the reading order you would give someone approaching a fork for the first time: which document
  first, what to skip, and where the authoritative answer lives when two sources disagree.
acceptance:
  criteria:
    - Both specifications are described by what they cover
    - Four concrete questions are each assigned to the specification that answers them
    - Consensus-layer codenames are explained with their pairing to execution-layer names and how to tell them apart
    - One real change is followed from proposal through specification diff, with the diff quoted
    - Which layer changed is stated, along with whether the other required a corresponding change
    - The tests accompanying the change are located
    - Implementing clients are named with any disagreement over the reading
    - Something in the diff not obvious from the proposal is identified
    - A first-time reading order is given, including where authority lies on disagreement
hints:
  - Pick a change small enough to read completely. A one-parameter repricing teaches the process better than a headline feature you can only skim.
  - The tests are the part people skip and the part that resolves ambiguity. Find them before forming a view on what the change means.
  - The non-obvious case is usually an edge condition at a boundary — an empty value, a first block of a fork. That is where specifications earn their length.
