kind: implement
title: Advance a beacon state by hand, inside the specification
concepts: [executable-spec, pyspec-build, state-transition-function, minimal-preset, presets-vs-configs]
spec: >
  Clone ethereum/consensus-specs, build the pyspec with the repository's current tooling, and then
  write a Python script that imports the built module for the latest stable fork under the minimal
  preset. In that script: construct a genesis state, advance it several slots with the per-slot
  processing function, apply at least one empty block through the state transition, and run far
  enough to cross an epoch boundary so epoch processing fires. Print, at each step, the slot, the
  latest block header, and the justified and finalized checkpoints. Then repeat the epoch crossing
  under the mainnet preset and record how long each takes. Write down, for every printed field,
  which specification document and which function produced it.
acceptance:
  command: uv run python solutions/advance_state.py --preset minimal --slots 40 --out out/trace.json
  criteria:
    - out/trace.json records slot, latest block header root, and the justified and finalized checkpoint epochs at every step
    - The trace crosses at least one epoch boundary and shows the justified checkpoint advancing, proving epoch processing ran
    - The script imports the built spec module rather than reimplementing any rule, and a written note names the spec function behind each printed field
    - A recorded timing comparison shows the same epoch crossing under the minimal and mainnet presets, with the ratio stated
hints:
  - The build step is a make target; run it before importing anything, and import the fork module rather than the markdown-facing package.
  - Advancing slots and applying blocks are different entry points — one moves time, the other consumes a block. You need both to reach an epoch boundary with a non-trivial state.
  - Justification will not advance without attestations in your blocks; either include them or explain in writing exactly why your finalized checkpoint stays at genesis.
difficulty: 4
