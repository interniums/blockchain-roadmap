id: protocol-consensus-specs-run-the-spec
moduleId: protocol-consensus-specs
grain: module
writeUp: >
  You have just found behaviour on mainnet that you believe contradicts what you were taught about the beacon chain. Write down, in order, the artifacts you would consult to find out who is wrong — and for each one, say what kind of question it can and cannot answer. Then say which of them you would trust over a client's own documentation, and why.
