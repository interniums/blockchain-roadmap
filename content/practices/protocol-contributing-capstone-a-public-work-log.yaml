kind: write
title: Land one contribution in a client, and leave a work log behind
difficulty: 4
concepts: [client-codebase-landscape, geth, reth, lighthouse, prysm, spec-conformance-as-entry-point, good-first-issue-labels, non-code-contributions, acd-process, devnets-and-interop, epf, epf-study-group, epf-wiki, epf-selection-signal, public-work-log]
spec: >
  This module's deliverable is the only one in the curriculum that has to exist outside this repository: a
  real contribution and a public record of the work that produced it.

  PICK BY LANGUAGE AND PROCESS. Survey the client landscape and choose one — execution or consensus — on the
  basis of the language you are actually good at and the review process you can actually sustain. Write down
  the reasoning in two paragraphs, including which one you rejected and why. Prestige is not a reason and
  saying it is disqualifies the paragraph.

  READ THE ROOM FIRST. Read the last three All Core Devs calls' notes before writing any code, and summarise
  what is currently contentious in the area you are touching. If nothing in your area is contentious, say
  that — it is a good sign for a first contribution.

  FIND THE REAL ENTRY POINT. Look at where first contributions actually get merged rather than where you
  wish they did: spec conformance, tests, tooling, docs, reproductions. Identify three candidate issues and
  say why you picked the one you did. At least one candidate must be non-code.

  LAND IT. Open the pull request. Address the review. Get it merged, or — if it is not merged — document the
  reason honestly, because "closed as out of scope after a maintainer explained why" is a real outcome and
  worth more than a merged typo fix.

  THE DEVNET. Separately, join one devnet or interop exercise as an observer and report one thing you saw
  that is not in any written summary of it.

  THE LOG. Publish a running work log: what you tried, what you misunderstood, what a maintainer corrected.
  This is the artefact the fellowship selection process actually reads, and the exercise is to have one
  before you need it.

  THE ROUTE IN. Close with a page on the fellowship and study group: the timeline, what the selection
  signal actually is, and — from your own log — what you would still need to show.
acceptance:
  criteria:
    - A client is chosen with two paragraphs of reasoning naming the rejected alternative, on language and review-process grounds rather than prestige
    - The last three All Core Devs calls are summarised for what is contentious in the touched area, or its absence stated
    - Three candidate issues are identified with a stated choice, at least one of them non-code
    - A pull request is opened and reviewed, and either merged or documented with the honest reason it was not
    - One devnet or interop exercise is observed with one reported detail absent from written summaries
    - A public work log exists recording attempts, misunderstandings and maintainer corrections
    - A closing page covers the fellowship timeline, the actual selection signal, and what your own log still lacks
hints:
  - Choose the codebase by which review process you can survive, not by which chain you like. A first contribution that stalls for three months teaches you less than a smaller one that lands in two weeks.
  - Read the ACD notes before the issue tracker. Half of what looks like an easy fix is a decision someone is still arguing about, and walking into that as a first contribution goes badly.
  - Write the work log as you go, publicly, including the parts where you were wrong. Retroactively cleaned-up logs are obvious and worth less than honest ones — the corrections are the evidence you can be reviewed.
