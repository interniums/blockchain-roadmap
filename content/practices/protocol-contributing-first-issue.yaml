id: protocol-contributing-first-issue
moduleId: protocol-contributing
grain: block
kind: fix
title: Get two clients building, then take one issue to a pull request
concepts: [client-codebase-landscape, reth, lighthouse, good-first-issue-labels]
spec: >
  Clone one execution client and one consensus client whose languages you can actually work in, get
  both building from source and their test suites passing locally, and keep a friction log while you
  do it: every step that failed, every undocumented prerequisite, how long each build took, and what
  you had to search for. That log is a deliverable, not a side effect — it is the raw material for a
  documentation contribution. Then pick one issue from either repository's newcomer-labelled list,
  confirm on the issue that it is still wanted, and open a pull request. If the issue turns out to
  be stale or already fixed, say so on the issue and pick another — that comment is itself a
  contribution.
acceptance:
  command: cargo test --workspace --no-fail-fast 2>&1 | tee out/build-log.txt
  criteria:
    - Both repositories build from source locally and their default test suites run, with the command output captured
    - A friction log records every failure, its cause and its fix, with timings for each build
    - A pull request is open against one of the two repositories, linked from the log, addressing a specific issue
    - The write-up names the label taxonomy each repository actually uses, verified in the repository rather than assumed
hints:
  - Check each repository's own contributing guide for the toolchain version it expects before you start; a mismatched compiler version is the most common first failure and the least interesting one.
  - Comment on the issue before writing code. Stale newcomer issues are common and finding out after two days of work is avoidable.
  - If the build friction log is long, that is the contribution. Open a documentation pull request from it before the code one.
difficulty: 3
