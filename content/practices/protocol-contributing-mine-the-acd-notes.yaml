id: protocol-contributing-mine-the-acd-notes
moduleId: protocol-contributing
kind: read
title: Mine three months of All Core Devs for work that needs doing
concepts: [acd-process, devnets-and-interop, epf-selection-signal, upgrade-scoping]
spec: >
  Read the last three months of execution and consensus All Core Devs notes. Extract, into a
  structured file, every item that was flagged as needing help, blocked on implementation, or
  deferred for lack of capacity — with the call date, the item, the named person or team, and the
  linked issue or pull request if one exists. Then narrow to a shortlist of three workstreams a new
  contributor could plausibly join, and for each write what the first week's work would be. Finally,
  cross-check your list against what actually shipped or was cut in the most recent upgrade, and
  note any item you extracted that has since been resolved — the staleness rate is information about
  how fast this record moves.
acceptance:
  command: npx vitest run test/acd-extract.test.ts
  criteria:
    - A structured file lists extracted items with call date, description, named owner and a link, and a test asserts no entry is missing a date or a source link
    - A test asserts every linked issue or pull request URL resolves
    - A shortlist of three joinable workstreams is written, each with a concrete first week of work
    - The staleness cross-check reports how many extracted items were already resolved by the time of writing
hints:
  - The notes name people. An item with no named owner is usually not a real opening, however loudly it was discussed.
  - Deferred and blocked are different states. Deferred means nobody is doing it; blocked means someone is waiting on someone else.
  - Cross-check against the upgrade's own record, not against news coverage, or your staleness figure measures the press rather than the process.
difficulty: 2
