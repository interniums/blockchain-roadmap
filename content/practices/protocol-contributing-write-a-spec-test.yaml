id: protocol-contributing-write-a-spec-test
moduleId: protocol-contributing
kind: implement
title: Write a spec test for an edge case nobody covered
concepts: [spec-conformance-as-entry-point, consensus-spec-tests, non-code-contributions]
spec: >
  Pick an execution-layer edge case you understand well — a transient storage interaction, a
  delegation edge case, a precompile boundary condition — and check whether the execution spec test
  repository already covers it. If it does, pick another until you find a genuine gap. Write the
  test case in that repository's own framework, run it against at least two execution clients
  through the repository's tooling, and confirm they agree. Then write down which client behaviours
  your test would catch a divergence in, and why that divergence would matter. Submit it.
acceptance:
  command: uv run pytest tests -k your_case_name -v --junitxml=out/results.xml
  criteria:
    - The new test case runs within the repository's own framework and passes against at least two execution clients
    - A search of the existing corpus is documented, showing the case was not already covered and naming what the nearest existing cases do cover
    - A written note states which class of client divergence the test would catch and what the consequence of that divergence would be on mainnet
    - The case is submitted as a pull request, or a written explanation is given for why it was withdrawn
hints:
  - Coverage gaps are easiest to find at boundaries between features — an opcode introduced in one fork interacting with one introduced in another.
  - Run against two clients, not one. A test that only ever ran against a single implementation proves nothing about divergence.
  - If your case turns out to be covered, the search you did is worth writing up; that is how you learn the corpus.
difficulty: 3
