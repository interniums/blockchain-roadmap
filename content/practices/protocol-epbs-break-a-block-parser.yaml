id: protocol-epbs-break-a-block-parser
moduleId: protocol-epbs
kind: break
title: Find every field access that breaks when the payload leaves the block
concepts: [payload-bid, payload-envelope, payload-availability-bit, ptc]
spec: >
  Write or take a beacon-block parser that works against the current fork — something that pulls a
  block from a beacon API and extracts its transactions, blob commitments, fee recipient and gas
  used. Then build a fixture of a post-ePBS block shape from the EIP's container definitions: a
  beacon block body with the payload bid and payload attestations, and no execution payload, blob
  commitments or execution requests. Run the parser against it and enumerate every field access that
  raises or silently returns the wrong thing. Add a second fixture representing a slot whose payload
  was never revealed, and check what your parser reports for it. Deliver the migration note an
  indexing team would act on.
acceptance:
  command: npx vitest run test/epbs-parser.test.ts
  criteria:
    - A test runs the existing parser against a current-fork block fixture and passes, establishing the baseline
    - A test runs it against the post-ePBS fixture and asserts a specific list of at least five failing or wrong field accesses, named individually
    - A test covers the no-payload-revealed case and asserts the parser distinguishes it from a missed slot rather than conflating the two
    - The migration note lists each breakage with the replacement source of that data under the new shape, or states plainly that the data now lives in a second network object
hints:
  - Build the fixture from the EIP's container definitions rather than inventing a shape; the field names are the deliverable.
  - Silent wrongness is worth more than exceptions here — look for accesses that return an empty list instead of raising.
  - A slot with no revealed payload and a slot with no block at all are different states with different downstream consequences. Your parser must not report them the same way.
difficulty: 3
