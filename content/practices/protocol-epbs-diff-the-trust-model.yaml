id: protocol-epbs-diff-the-trust-model
moduleId: protocol-epbs
kind: read
title: Put the relay's job in a table, then delete the row
concepts: [relay-trust-assumption, mev-boost-today, epbs, unconditional-payment]
spec: >
  Read the current builder API specification and the MEV-Boost flow it defines, then read EIP-7732's
  specification section. Produce a machine-checkable comparison as JSON: for each step of block
  delivery, record who holds the payload, who can withhold it, who can censor at that step, who must
  be trusted, and what happens if that party fails. Do this once for the out-of-protocol flow and
  once for the enshrined flow, using the same step vocabulary for both so the two are diffable.
  Then write the diff: which rows vanish, which rows change hands, and which rows are unchanged.
  Cite the specific container or endpoint name behind each row.
acceptance:
  command: npx vitest run test/trust-model.test.ts
  criteria:
    - A JSON model of both flows exists with the same step keys in each, so a structural diff is possible
    - A test asserts every row carries a citation field naming a real container or endpoint from the two specifications
    - A test asserts that the enshrined flow has no step whose trusted party is a relay, and that at least one step changed which party can withhold
    - The written diff explicitly identifies the row that unconditional payment removes, and the new risk that appears in its place
hints:
  - Use the same step names in both models — bid, commitment, signature, reveal, payment — or the diff will be a naming exercise rather than a trust analysis.
  - 'The question "who can withhold" and the question "who must be trusted" are different, and sometimes have different answers at the same step. Keep the columns separate.'
  - The enshrined flow does not have zero risk rows. If yours does, you have not modelled what happens when the payload never arrives.
difficulty: 2
