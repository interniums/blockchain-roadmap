id: protocol-epbs-four-phases-and-what-it-does-not-fix
moduleId: protocol-epbs
grain: block
kind: read
title: Walk the proposed slot, and say what enshrining does not fix
difficulty: 4
concepts: [epbs-slot-structure, deferred-execution, epbs-and-scaling, epbs-does-not-fix-centralisation, block-level-access-list, bal-enables-parallelism, focil, upgrade-scoping]
spec: >
  A proposal that restructures the slot, and a claim about it that does not hold. Read both carefully.

  THE SLOT. Diagram the proposed slot phase by phase, from the current specification rather than from an
  article. For each phase state what is published, who publishes it, and what the deadline is. Then state
  what changes about validation timing, and why deferring execution widens the budget — that is the
  mechanism the scaling argument rests on and it should be one clear paragraph.

  THE SCALING CLAIM. Establish what the wider budget is actually spent on, and what it would allow that is
  not possible now. Give a number if one exists in the specification or in a devnet result; if not, say the
  number does not exist yet and name what would produce it.

  WHAT IT DOES NOT FIX. Then the argument. Enshrining the separation removes a trusted intermediary. State
  precisely which one, and then establish what remains concentrated afterwards — who still builds, and what
  advantage they still have. Name the specific advantage rather than saying centralisation persists.

  THE REST OF THE PACKAGE. Two adjacent pieces travel with this. For the block-level access list, state what
  it enables and how it relates to declared access in other execution models. For the inclusion-list
  mechanism, state what censorship problem it addresses and what it does not. Then note what was cut from
  the scope and why scoping a fork is itself a design decision.
acceptance:
  criteria:
    - The proposed slot is diagrammed phase by phase from the specification, with publisher and deadline per phase
    - What changes about validation timing is stated, with why deferring execution widens the budget in one paragraph
    - What the wider budget enables is stated with a number, or the absence of a number is named along with what would produce it
    - The trusted intermediary that enshrining removes is named precisely
    - What remains concentrated afterwards is established, with the specific retained advantage named
    - The block-level access list's effect is stated and related to declared access elsewhere
    - The inclusion-list mechanism's target censorship problem is stated along with what it does not address
    - What was cut from the fork's scope is noted, with why scoping is a design decision
hints:
  - Diagram from the specification, not from a diagram. Second-hand slot diagrams are frequently a version behind and the phase deadlines are the part that moves.
  - The retained advantage is access to order flow. Naming it that specifically is what makes the section an argument rather than a caveat.
  - The access list is the same idea as declared access in a parallel-execution VM. Making that connection explicitly is worth more than describing it in isolation.
