kind: implement
title: Work out when a builder is better off not revealing
concepts: [free-option-problem, unconditional-payment, payload-availability-bit]
spec: >
  Model the builder's decision after signing a bid. The builder has committed to pay a value V and
  holds a block whose realised profit depends on prices that keep moving during the reveal window.
  Simulate price movement over that window with a volatility parameter, and at the reveal deadline
  compare the payoff of revealing against the payoff of withholding — remembering that V is paid
  either way. Sweep volatility and bid size, and produce the withholding rate for each combination.
  State the break-even condition in closed form and check your simulation agrees with it. Then
  answer: at what withholding rate does the availability bitvector stop being an edge case for
  downstream tooling?
acceptance:
  command: npx vitest run test/free-option.test.ts && npx tsx src/sweep-option.ts --out out/withholding.json
  criteria:
    - A test asserts the payoff function pays the bid in both branches, so withholding is never modelled as avoiding payment
    - A test checks the simulated withholding rate against the analytically derived break-even condition at a fixed parameter set, within a stated tolerance
    - out/withholding.json contains withholding rates across a sweep of volatility and bid size, and the rate rises with volatility
    - A written answer states the withholding rate at which empty-payload slots become common enough that tooling must handle them as normal
hints:
  - The bid is sunk at decision time. If your model ever lets the builder avoid paying by withholding, the option has been priced as something else entirely.
  - What the builder gives up by withholding is the block's realised value, not the bid; what it avoids is a loss relative to that value.
  - The window is short. Volatility over seconds, not days — scale your parameter accordingly and say what you scaled it from.
difficulty: 4
