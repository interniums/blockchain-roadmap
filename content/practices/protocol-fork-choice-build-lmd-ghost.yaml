id: protocol-fork-choice-build-lmd-ghost
moduleId: protocol-fork-choice
kind: implement
title: Write the head rule, then make the boost flip it
concepts: [weight-is-stake, latest-message-only, proposer-boost, gasper]
spec: >
  Implement LMD-GHOST from scratch in TypeScript. You need three things: a block tree with parent
  links, a map from validator index to that validator's latest attestation and effective balance,
  and a getHead function that starts at the justified root and repeatedly descends into the child
  whose subtree carries the most attesting weight. Weight must be summed effective balance, not a
  count of votes or of blocks. Then add proposer boost as a temporary weight applied to one node for
  the duration of one slot, and a way to remove it. Build a fixture in which a late block plus the
  boost outweighs an earlier sibling: your implementation must pick the late block with the boost
  applied and the earlier one with it removed. Add a second fixture in which a validator re-votes
  and the head moves as a result, with no new blocks and no new validators.
acceptance:
  command: npx vitest run test/lmd-ghost.test.ts
  criteria:
    - A test asserts the head over a fixed tree matches a hand-computed answer, with validators of unequal effective balance so weight cannot be a vote count
    - A test proves that applying proposer boost flips the head and removing it flips the head back, on the same tree
    - A test proves the head changes when a single validator replaces its own earlier attestation, with no other input changing
    - A test asserts that a block outside the subtree of the justified checkpoint is never returned as head, however much weight points at it
hints:
  - Compute subtree weights bottom-up once per call rather than re-walking the tree per child; the naive version is correct but will not survive the attack simulations you build next.
  - Latest-message means the map holds exactly one attestation per validator. If your data structure lets a validator appear twice, you have implemented the wrong rule.
  - The boost is a percentage of one committee's weight, not of total stake, and it must be gone by the time the next slot is evaluated.
difficulty: 3
