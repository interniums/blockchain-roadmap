id: protocol-fork-choice-count-real-reorgs
moduleId: protocol-fork-choice
kind: measure
title: Count what actually reorgs on mainnet in a week
concepts: [honest-reorg-of-late-blocks, confirmation-rule, fork-choice-purpose]
spec: >
  Using a public beacon API, walk at least one week of slots and reconstruct the canonical chain by
  parent root. Detect reorgs by finding slots whose block was later replaced, and record the depth
  of each. Separately, sample the head and finalized checkpoints at regular intervals and record the
  gap between them over the same period. Produce two outputs: a table of reorg depths with counts,
  and a time series of head-minus-finalized distance. Then write the decision note an exchange would
  use: given your measured reorg depth distribution, how many slots would you wait before crediting
  a deposit, and what does the confirmation rule change about that answer compared with picking a
  depth from your histogram?
acceptance:
  command: npx tsx src/scan-reorgs.ts --days 7 --out out/reorgs.json && npx vitest run test/reorgs.test.ts
  criteria:
    - out/reorgs.json lists every detected reorg with its depth and the slots involved, plus the total slots scanned
    - A test verifies the reconstructed chain is internally consistent — every block's parent root resolves to the block recorded at an earlier slot
    - The head-minus-finalized series is recorded over the same window and its maximum is stated
    - The written credit policy names a slot count, the reorg depth distribution it was derived from, and what assumption the confirmation rule would let it replace
hints:
  - Missing slots are not reorgs. A slot with no block was never canonical and must not appear in your depth histogram.
  - You cannot detect a reorg you did not observe live unless the API exposes orphaned blocks — say which method you used and what it can miss.
  - The gap between head and finalized should sit near two epochs almost all the time; any excursion is worth a sentence in your note.
difficulty: 3
