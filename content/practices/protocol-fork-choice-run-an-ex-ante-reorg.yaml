id: protocol-fork-choice-run-an-ex-ante-reorg
moduleId: protocol-fork-choice
kind: break
title: Find the adversarial stake fraction that reorgs an honest block
concepts: [ex-ante-reorg, ex-post-reorg, proposer-boost-tradeoff, balancing-attack]
spec: >
  Using the LMD-GHOST implementation you built, script both reorg attacks against it. For the
  ex-ante attack, have the adversary withhold a block and a chosen number of attestations, let an
  honest block be published and attested, then release the withheld fork and check whether the head
  moves. For the ex-post attack, have the adversary propose in the following slot on the honest
  block's parent, with its own proposer boost and any withheld votes. For each attack, sweep the
  adversarial stake fraction and the boost value and record the minimum fraction that succeeds.
  Plot both curves on one chart against boost value. The two curves must move in opposite
  directions; if they do not, your simulation is wrong.
acceptance:
  command: npx vitest run test/reorg-attacks.test.ts && npx tsx src/sweep.ts --out out/thresholds.json
  criteria:
    - A test demonstrates a successful ex-ante reorg at a stated adversarial fraction and boost value, and its failure one step below that fraction
    - A test demonstrates a successful ex-post reorg at a stated adversarial fraction and boost value
    - out/thresholds.json contains the success threshold for both attacks across a sweep of boost values, and the two series move in opposite directions
    - A written conclusion names the boost value that minimises the worse of the two thresholds under your own stated definition of worse
hints:
  - The adversary in the ex-ante case does not need to be the proposer of the honest slot; it needs to have been an earlier proposer whose block it never published.
  - Run each configuration deterministically with a seeded ordering of message delivery, or your thresholds will be noise.
  - If raising the boost helps both attacks in your results, you have almost certainly applied the boost to the wrong block in one of the two scenarios.
difficulty: 4
