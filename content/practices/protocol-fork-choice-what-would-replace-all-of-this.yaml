id: protocol-fork-choice-what-would-replace-all-of-this
moduleId: protocol-fork-choice
grain: block
kind: read
title: Read the proposals that would make three-slot finality possible
difficulty: 4
concepts: [view-merge, rlmd-ghost, three-slot-finality, orbit-ssf]
spec: >
  Today's confirmation ladder exists because finality is slow. Read the proposals that would collapse it and
  say what each one has to solve.

  THE TARGET. State what three-slot finality would change for a product: the current time to finality against
  the proposed one, both as numbers, and what confirmation policies would become unnecessary. That is the
  prize, and stating it first makes the rest legible.

  THE PIECES. For each proposal — the view-reconciliation mechanism, the revised fork-choice rule, and the
  single-slot approach with rotating participation — answer three questions from the specification or research
  post rather than from a summary. What problem does it solve that the current design has. What does it
  require that does not exist today. And what is the strongest published objection to it.

  THE ARITHMETIC THAT FORCES THE DESIGN. Single-slot finality is hard for one measurable reason: the number of
  signatures that would have to be aggregated per slot. Compute it from the current validator count and state
  what it implies. Then state how the rotating-participation approach changes that number, and what it gives up
  to do so.

  THE HONEST CLOSE. State which of these you expect to ship first and what you are basing that on. Then name
  what would have to be true for none of them to ship, because the current ladder existing in five years is a
  real possibility and a reader deserves it named.
acceptance:
  criteria:
    - Current and proposed time to finality are both stated as numbers, with the confirmation policies that become unnecessary
    - Each of the three proposals is covered with the problem it solves, what it requires that does not exist, and the strongest published objection
    - Signatures per slot for single-slot finality are computed from the current validator count with the implication stated
    - How rotating participation changes that number is stated, along with what it gives up
    - A prediction of what ships first with its basis
    - What would have to be true for none of them to ship
hints:
  - Compute the signature count early. It is one multiplication and it explains why the whole family of proposals exists, which makes each one easier to read.
  - Find the objections in the research forum rather than in the proposals. Proposals state their own tradeoffs generously.
  - The no-change scenario is worth taking seriously. Naming it keeps the section from reading as a roadmap summary.
