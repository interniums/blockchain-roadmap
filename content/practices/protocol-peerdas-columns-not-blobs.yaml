id: protocol-peerdas-columns-not-blobs
moduleId: protocol-peerdas
grain: block
kind: measure
title: Custody a column, hold no blob whole, and answer fork choice anyway
difficulty: 4
concepts: [data-availability-problem, blob-baseline, data-matrix, column-not-row-custody, is-data-available]
spec: >
  Nobody can be made to download everything, and the design that follows from that changes what a node holds
  and what a node can say.

  THE PROBLEM, QUANTIFIED. State the availability problem as arithmetic: at the current blob target and max,
  how much data per slot, per day, and what that is per year. Then compare against a home connection's
  sustained bandwidth and a reasonable disk budget. That comparison is why the rest exists and it should be
  three numbers rather than an assertion.

  THE MATRIX. Describe the layout: blobs as rows, extended and cut into columns. For one real slot, state the
  dimensions — how many rows, how many columns, and the size of a cell. Then compute what a node custodying
  its assigned columns actually stores per slot, and show it is a fraction of the total. Report the fraction.

  NO BLOB WHOLE. Then the consequence people find surprising: demonstrate or establish that a node holding
  its columns holds no complete blob. State what it must do to serve one, and who it must ask.

  FORK CHOICE. Finally, the question that matters for consensus: what does a node answer when asked whether
  the data for a block is available, and on what basis, given it has only sampled? State the condition under
  which it votes for the block, and then the failure case — what happens if enough nodes cannot get their
  columns. Say whether that is a liveness or a safety problem and defend the answer.
acceptance:
  criteria:
    - Data per slot, per day and per year are computed at current target and max
    - Those are compared against a home connection's bandwidth and a disk budget, as numbers
    - The matrix layout is described with real dimensions for one slot and a cell size
    - Per-slot custody storage is computed and expressed as a fraction of the total
    - A node holding its columns is shown or established to hold no complete blob, with what it must do to serve one and who it must ask
    - The basis on which a node answers the availability question is stated, with the condition for voting for the block
    - The failure case is described and classified liveness or safety with a defence
hints:
  - Do the yearly figure. The per-slot number sounds manageable and the annual one is what makes the design necessary.
  - The no-whole-blob property is the one to state plainly. It surprises people who think of custody as keeping a subset of blobs rather than a slice of all of them.
  - The failure case is liveness, and the reason is that nothing incorrect gets finalised — it just does not finalise. Defend it that way.
