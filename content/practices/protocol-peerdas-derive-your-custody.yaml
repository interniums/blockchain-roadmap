id: protocol-peerdas-derive-your-custody
moduleId: protocol-peerdas
kind: implement
title: Compute which columns your node is obliged to keep
concepts:
- custody-groups
- deterministic-custody-from-nodeid
- custody-requirement
- column-subnets
spec: 'Implement the spec''s custody derivation in TypeScript: given a node id and a custody group count,
  produce the set of custody groups, and from those the set of column indices and the gossip subnets the
  node must subscribe to. Follow the specification''s algorithm exactly — repeated hashing of an incrementing
  value derived from the node id, taken modulo the group count, deduplicated until enough groups are collected.
  Verify against any test vectors the spec provides. Then run your implementation over 10,000 random node
  ids at the plain full-node requirement and measure the distribution: how many nodes cover each custody
  group, and what the least-covered group gets. Repeat with the validator requirement and state how the
  picture changes.

  '
acceptance:
  command: npx vitest run test/custody.test.ts && npx tsx src/coverage.ts --nodes 10000 --out out/coverage.json
  criteria:
  - A test asserts the derivation matches the specification's published test vectors, or if none exist,
    that it matches a hand-worked example documented in the test
  - A test asserts the derived group set is deduplicated and has exactly the requested size for several
    requirement levels including the supernode cap
  - out/coverage.json reports, per custody group, how many of 10,000 simulated nodes hold it, and the
    minimum and maximum are stated
  - A written note explains why coverage is roughly even without any coordinator, and what would happen
    to reconstruction if it were not
hints:
- Hash the node id with an incrementing counter, not the counter alone — otherwise every node derives
  the same groups and the distribution collapses.
- 'Groups and columns are separate: derive groups first, then map each group to its columns. Both counts
  being 128 in the current spec hides the two-step structure.'
- The subnet for a column is a function of the column index. Getting subnets from groups directly will
  look right and be wrong the first time the two counts diverge.
difficulty: 3
