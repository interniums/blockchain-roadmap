id: protocol-peerdas-erasure-recovery-boundary
moduleId: protocol-peerdas
kind: implement
title: Find the exact point where recovery stops working
concepts: [erasure-extension, reconstruction-rule, cross-seeding, cell]
spec: >
  Implement one-dimensional Reed-Solomon extension and recovery over a small prime field. Take a
  vector of n values, extend it to 2n, then delete a random subset and attempt recovery. Prove
  empirically that recovery succeeds with exactly n known values and fails with n minus one,
  whatever the pattern of deletions. Then model cross-seeding: simulate a set of nodes each holding
  a random slice, have any node that reaches the recovery threshold reconstruct and republish the
  columns it recovered, and measure how many rounds it takes for the whole network to hold what it
  needs when the adversary withholds various fractions below one half.
acceptance:
  command: npx vitest run test/erasure.test.ts
  criteria:
    - A test recovers the original vector from exactly half the extended values, repeated over many random deletion patterns
    - A test asserts recovery fails deterministically at one value below the threshold, rather than returning a wrong answer silently
    - A cross-seeding simulation reports the number of gossip rounds to full network coverage for at least three withholding fractions below one half
    - A written note connects the recovery threshold to why the spec's reconstruct-and-republish rule triggers at the fraction it does
hints:
  - Work over a small prime field with straightforward interpolation before reaching for a production library; the boundary behaviour is the deliverable, not the throughput.
  - Recovery failing must be an explicit failure. A system that returns plausible garbage below the threshold is worse than one that errors.
  - In the cross-seeding simulation, a node that reconstructs is required to republish before it is allowed to discard. Model both steps or the network never heals.
difficulty: 4
