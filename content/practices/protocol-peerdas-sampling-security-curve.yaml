id: protocol-peerdas-sampling-security-curve
moduleId: protocol-peerdas
grain: block
kind: measure
title: Show why eight samples is weak per node and strong per network
concepts: [sampling, das-security-argument, erasure-extension]
spec: >
  Compute and chart the detection probability for a withholding adversary. For a matrix of 128
  columns with more than half withheld, plot the probability that a single node drawing k random
  columns notices, for k from 1 to 32. On the same chart, plot the probability that at least one
  node out of N notices, for several values of N up to a realistic network size. Mark the spec's
  per-slot sample count on both curves. Then run a Monte Carlo simulation as an independent check:
  build a 128-column matrix, withhold exactly 64 columns, simulate 5,000 nodes each sampling the
  spec count, and count how many fail to detect it. Compare the simulated failure count with the
  analytic prediction.
acceptance:
  command: npx vitest run test/sampling-security.test.ts && npx tsx src/curves.ts --out out/curves.json
  criteria:
    - out/curves.json contains the per-node detection curve for k in 1 to 32 and the network-wide curve for at least three network sizes
    - A test asserts the analytic per-node value at the spec sample count matches the closed-form expression to a stated tolerance
    - A Monte Carlo run of 5,000 simulated nodes produces an undetected count consistent with the analytic prediction, and the test asserts the agreement rather than printing it
    - A written conclusion states the per-node failure probability plainly and explains why that number is acceptable given the network-wide one
hints:
  - The adversary must withhold more than half the columns to make the data unrecoverable. Withholding less is not an attack, it is a delay.
  - Independence is the assumption doing all the work in the network-wide curve. Say in writing where it might not hold.
  - Sampling is done without replacement within a slot; at k of 128 the difference from the simple formula is small but you should state it rather than ignore it.
difficulty: 3
