kind: measure
title: Measure the witness, and see why the plan changed
difficulty: 4
concepts: [ethereum-state, state-vs-history, witness, statelessness, witness-size-is-the-blocker, vector-commitment, verkle-tree, verkle-is-off-the-roadmap, binary-state-tree, hash-choice-tbd, unified-key-space, stem-and-suffix, frozen-mpt-migration, pbt, state-expiry, statelessness-vs-zk]
spec: >
  Statelessness is blocked on one number. Measure it, then reason about the design change that followed.

  STATE VERSUS HISTORY. From your own node, report the on-disk size of state and of history separately, and
  state which one grows with usage and which with time. Then say which of the two an archive node's size is
  actually made of.

  BUILD A WITNESS. For one real block, construct the witness a stateless verifier would need: every account
  and slot touched, with the proof material to verify each against the state root. Report its size in bytes.
  Then report the block's own size for comparison, and the ratio.

  WHY IT IS THE BLOCKER. Extrapolate: at that ratio, what does the witness do to bandwidth per slot? State
  the number and compare it against what a home connection provides. That comparison is the whole reason
  this part of the roadmap moved.

  ARITY. Explain, with your own measurement or arithmetic, why a binary tree wins when the commitment is a
  hash while a wide tree wins when it is a vector commitment. Show the proof-size arithmetic for both at the
  same key count.

  WHAT WAS DROPPED AND WHY. State what Verkle promised, what it required — and name the specific cost that
  removed it from the roadmap. Then state what replaced it, and note honestly which part of the replacement
  is not yet decided.

  ONE KEY SPACE. Explain the unified key space and the stem-and-suffix structure, and demonstrate the
  locality consequence: construct two access patterns over the same number of slots where one produces a
  much smaller witness. Report both sizes.

  THE MIGRATION. Explain why freezing the old tree is preferred over converting it, in terms of what a
  conversion would require of every node at once.

  THE ALTERNATIVE. Close with two sentences on how a zk approach reaches a verifier that holds no state by a
  different route, and what it trades for that.
acceptance:
  command: 'true'
  criteria:
    - State and history on-disk sizes are reported separately from a real node, with which grows with usage and which with time
    - An archive node's size is attributed to the correct one of the two
    - A witness for one real block is constructed with its size in bytes and the ratio to the block's own size
    - Bandwidth per slot at that ratio is extrapolated and compared against a home connection
    - Proof-size arithmetic is shown for binary and wide trees at the same key count, explaining the arity result
    - What Verkle promised and the specific cost that removed it are stated, along with its replacement and the part still undecided
    - The unified key space and stem-and-suffix structure are explained
    - Two access patterns over the same slot count produce different witness sizes, both reported
    - Why the old tree is frozen rather than converted is explained in terms of what conversion demands of every node
    - Two sentences contrast the zk route to a stateless verifier and what it trades
hints:
  - Measure state and history from the same node in the same units before anything else. Most confusion about why nodes are expensive is these two numbers being added together.
  - The witness ratio is the number to get right. Build it for a block with a lot of distinct storage touches rather than a quiet one, and say which you chose.
  - "The locality demonstration is easy to construct once you understand stems: touch many slots under one stem, versus one slot under many stems. Same count, very different witness."
