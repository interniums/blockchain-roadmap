id: protocol-statelessness-hexary-versus-binary
moduleId: protocol-statelessness
grain: block
kind: implement
title: Build both trees and settle the deeper-means-bigger intuition
concepts: [binary-state-tree, unified-key-space, stem-and-suffix, witness]
spec: >
  Implement a hexary Merkle tree and a binary Merkle tree over the same set of 2^16 leaves, with the
  same hash function. For each, produce inclusion proofs for a random sample of leaves and measure
  proof size and verification time. Then implement the proposed key derivation: given an address and
  a storage slot, compute the stem and suffix, and demonstrate that several adjacent storage slots of
  one contract share a stem. Show that a multi-slot proof under a shared stem costs one branch
  opening rather than one per slot, and quantify the saving for a contract that reads a run of
  adjacent slots.
acceptance:
  command: npx vitest run test/trees.test.ts
  criteria:
    - A test asserts both trees commit to the same leaf set and that every generated proof verifies against its own root
    - Measured proof sizes for both arities are recorded, and a test asserts the binary-to-hexary size ratio falls in a stated range with the reasoning documented
    - A test proves that adjacent storage slots of one contract derive the same stem and different suffixes
    - A test compares the total proof bytes for N adjacent slots under a shared stem against N independent proofs, and asserts the saving grows with N
hints:
  - Use the same hash and the same leaf encoding for both trees, or you are measuring your encoding rather than the arity.
  - Verification time and proof size do not move in the same direction between the two designs. Report both and say which one the protocol actually cares about.
  - The stem is the first 31 bytes of the derived key. If your derivation puts the slot index anywhere in the stem, adjacent slots will not share one.
difficulty: 3
