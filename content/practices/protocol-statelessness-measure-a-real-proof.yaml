id: protocol-statelessness-measure-a-real-proof
moduleId: protocol-statelessness
kind: measure
title: Measure a real state proof, then estimate its replacement
concepts: [witness, witness-size-is-the-blocker, merkle-patricia-trie, binary-state-tree]
spec: >
  Using a public archive RPC, fetch state proofs for a set of real storage slots — pick a widely used
  ERC-20 and prove several balance-mapping slots, plus a few account-level proofs. Measure the actual
  encoded byte size of each returned proof, and decompose it: how many bytes are the values, and how
  many are sibling hashes. Then compute what the same set of proofs would cost in a binary tree with
  the same number of leaves, from the sibling arithmetic alone. Finally, pull a recent mainnet block,
  count the distinct accounts and storage slots it touched, and produce an estimated full-block
  witness size under each structure. State clearly which of your numbers are measured and which are
  derived.
acceptance:
  command: npx tsx src/measure-proofs.ts --slots config/slots.json --out out/proofs.json && npx vitest run test/proofs.test.ts
  criteria:
    - out/proofs.json records, per proof, the measured encoded byte size and the split between values and sibling hashes
    - A test asserts the sibling-byte count is consistent with the trie's arity and the observed path depth, so the decomposition is checked rather than asserted
    - A binary-tree estimate is computed for the same leaf count and the ratio to the measured hexary size is reported
    - A full-block witness estimate is produced from a real block's touched-state count, with measured and derived figures labelled separately
hints:
  - The proof endpoint returns RLP-encoded nodes; measure the encoded bytes, not the JSON, or your numbers will be inflated by hex expansion.
  - A hexary branch node carries up to fifteen siblings per level; a binary one carries exactly one. The comparison is that arithmetic, plus a depth that differs between the two.
  - Whole-block witness size is not the sum of independent proofs — paths share prefixes near the root. Say whether you deduplicated, and by how much it changed the answer.
difficulty: 3
