id: protocol-statelessness-write-the-correction-sheet
moduleId: protocol-statelessness
kind: write
title: Correct a course that still teaches Verkle
concepts: [verkle-is-off-the-roadmap, verkle-tree, binary-state-tree, state-expiry, statelessness-vs-zk]
spec: >
  Find real published teaching material — a course module, a documentation page, a widely cited
  article — that presents Verkle trees as Ethereum's upcoming state-tree upgrade. Write the
  correction sheet a maintainer could apply. For each claim you correct, produce a structured entry:
  the original claim, its status now (cancelled, superseded, never scheduled, or still true), the
  replacement claim, and the primary source for the replacement. Cover the tree itself, the reason
  for the change, the migration approach, the status of state expiry, and the existence of a
  competing route through proving. Every status must be defensible from a specification or project
  document, not from press coverage, and where the sources genuinely do not settle a question your
  entry must say so rather than pick a side.
acceptance:
  command: npx vitest run test/correction-sheet.test.ts
  criteria:
    - The sheet is machine-readable, with every entry carrying original claim, status, replacement and source URL, and a test asserts no entry is missing a source
    - A test asserts every source URL resolves and that at least one entry per claim cites a specification or project document rather than press coverage
    - The entry for why Verkle was dropped states the reasons as given in the successor proposal's rationale and discussion, and marks that no single announcement exists
    - At least one entry is marked unsettled rather than corrected, with the disagreement between sources described
hints:
  - Cancelled and delayed are different statuses and the distinction is the whole point of the exercise. Do not soften one into the other.
  - The branch-size figures quoted in the successor proposal are for a single path, not a whole-block witness. If your sheet repeats them, label them correctly.
  - Where a question has no primary source — the exact status of state expiry, for instance — an entry saying so is more useful than a confident answer.
difficulty: 2
