kind: measure
title: Make the batcher's decision, every batch, for a day
difficulty: 4
concepts: [batcher, batch-vs-state-commitment, batch-compression, blob-transaction, blob-gas-market, blob-target-vs-max, blob-base-fee-floor, dual-market-batching-decision, batch-posting-cadence-tradeoff, bpo-fork, peerdas-enables-more-blobs, da-cost-no-longer-dominant]
spec: >
  Build the decision engine a batcher runs, backtest it over a day of real fee data, and report what it
  would have cost.

  TWO SUBMISSIONS, NOT ONE. First establish the distinction: find, for one real L2, the transaction that
  posted a batch of data and the separate transaction that posted the state commitment. Give both hashes
  and state the failure modes of each independently — what breaks if the data lands and the commitment
  does not, and vice versa.

  COMPRESS. Take a real batch of L2 transactions and measure your compression ratio. Report bytes before
  and after, and state which field types compressed worst.

  THE DECISION. Implement the choice: for a given batch size and the live prices in both markets, blob or
  calldata? Derive the break-even size at a given price pair, then backtest over 24 hours of real fee data
  and report how many batches would have gone each way. Plot the decision boundary against the two prices.

  TWO MARKETS, ONE WORD. Show the blob base fee and the execution base fee moving independently over your
  day, and identify the period where the correct decision flipped. Then show the blob base fee at its
  floor and state what that floor does to the decision.

  CADENCE. Model the tradeoff: post more often for lower latency to hard finality, or less often for
  cheaper amortised cost. Produce the cost-versus-latency curve for your day and pick a point, defending
  it in terms of what the L2's users need.

  CAPACITY. State the current target and max blobs per block, name the most recent fork that changed
  either, and say what the sampling scheme has to do with why that change was possible. Then close with
  the claim to test: is data cost still the dominant term in this L2's economics? Answer with your
  numbers.
acceptance:
  command: 'true'
  criteria:
    - Both the data-posting and state-commitment transactions are identified by hash for one real L2
    - Independent failure modes of each submission are stated
    - A real batch's compression ratio is measured with bytes before and after, and the worst-compressing field types named
    - A break-even batch size is derived for a stated price pair
    - The decision is backtested over 24 hours of real fee data with counts each way
    - The decision boundary is plotted against both prices
    - Both fee markets are shown moving independently, with the period where the correct decision flipped identified
    - The blob base fee is shown at its floor with the effect on the decision stated
    - A cost-versus-latency curve is produced and a cadence chosen with a defence in terms of user needs
    - Current target and max blobs are stated with the fork that changed them and the sampling scheme's role
    - A numeric verdict on whether data cost is still the dominant term
hints:
  - Get the two submission transactions first. Many people who have used a rollup for years have never noticed they are separate, and the failure-mode question only makes sense once you have both hashes in front of you.
  - Backtest before you optimise. The decision rule is simple; the interesting output is how often it flipped over a real day, and that is data, not design.
  - For the dominance question, put the L1 data cost next to the L2's gross fee revenue for the same period. The answer has changed recently and quoting an older figure is the trap.
