id: scaling-blobs-peerdas-capstone-the-batchers-decision
moduleId: scaling-blobs-peerdas
grain: module
writeUp: >
  Your batcher has been posting on a fixed schedule since launch and nobody has looked at it since. Write down the two market regimes it must survive — blob fee at the floor, and blob fee spiking while execution gas is calm — and say what your current configuration does wrong in each.
coversConcepts:
  - batcher
  - batch-vs-state-commitment
  - batch-compression
  - blob-transaction
  - blob-gas-market
  - blob-target-vs-max
  - blob-base-fee-floor
