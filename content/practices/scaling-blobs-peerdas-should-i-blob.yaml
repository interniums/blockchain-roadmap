id: scaling-blobs-peerdas-should-i-blob
moduleId: scaling-blobs-peerdas
kind: implement
title: Build the cost oracle a batcher needs before every submission
concepts: [blob-gas-market, dual-market-batching-decision, blob-base-fee-floor, batch-compression]
spec: >
  Implement a function that decides, for a given batch, whether posting it as a type-3 blob
  transaction or as type-2 calldata is cheaper right now. It takes the compressed batch bytes and
  reads the current execution base fee and blob base fee from a public RPC. For the blob path it
  must account for whole-blob granularity — a batch smaller than one blob still pays for one blob,
  and a batch larger than one blob pays for several. For the calldata path it must price the bytes
  at the current execution base fee including the calldata floor rules. Return the cheaper path and
  both costs. Then test it against three fixtures: blob base fee pinned at its 1 wei floor, blob
  base fee spiking with execution gas calm, and the reverse. Prove the decision flips.
acceptance:
  command: npx vitest run test/blob-vs-calldata.test.ts
  criteria:
    - Live mode reads both base fees from an RPC and returns a decision with both costs
    - Blob costing uses whole-blob granularity, and a test proves a tiny batch still pays for a full blob
    - Three fixtures covering floor, blob spike and execution spike each produce the correct path, and at least one flips the decision
    - A test asserts the crossover batch size at a fixed pair of base fees, so the boundary is pinned rather than approximated
hints:
  - Blob gas is charged per blob, not per byte; the byte count only determines how many blobs you need.
  - "The blob base fee floor is 1 wei, so at the floor the blob path is essentially free and the only real cost is the type-3 transaction's own execution gas."
  - Compressed size is the input, not raw size — state your compression ratio as a parameter so the crossover can be recomputed for a different transaction mix.
difficulty: 3
