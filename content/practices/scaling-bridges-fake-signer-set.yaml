id: scaling-bridges-fake-signer-set
moduleId: scaling-bridges
grain: module
writeUp: >
  Take the bridge your product would actually use. List every party who, acting alone or in collusion of size k, could mint an unbacked token or drain the escrow. State k. Then compare it to the native bridge's k and say what the difference bought you.
coversConcepts:
  - native-bridge
  - cross-domain-messenger
  - deposit-is-fast-withdrawal-is-slow
  - third-party-bridge
  - lock-and-mint
  - liquidity-bridge
  - storage-proof-bridge
  - header-verification-problem
  - intent-bridge
  - erc-7683
  - bridge-is-the-honeypot
  - signature-verification-failure
  - key-compromise-failure
  - initialisation-failure
kind: break
title: Forge a cross-chain message by supplying your own signer set
concepts: [signature-verification-failure, bridge-is-the-honeypot, key-compromise-failure]
spec: >
  Write a message verifier that checks a threshold of signatures from a guardian set, but reads
  the guardian set from an address or struct supplied by the caller rather than from immutable
  storage — the shape of the Wormhole failure. Demonstrate the exploit: construct your own
  guardian set, sign an arbitrary mint message with your own keys, pass both to the verifier, and
  have it accept. Then fix it by binding the guardian set to storage the caller cannot influence,
  and prove the same call now reverts. Add a second test showing that even the fixed verifier is
  defeated if enough real guardian keys are compromised, and state the threshold at which that
  happens.
acceptance:
  command: forge test --match-path test/FakeSignerSet.t.sol -vvv
  criteria:
    - A test forges a message accepted by the broken verifier using an attacker-controlled guardian set
    - The fixed verifier reverts on the identical call, with the guardian set bound to immutable or contract-controlled storage
    - A test parameterised on threshold shows the number of compromised keys required to defeat the fixed verifier
    - The write-up distinguishes the two failure classes in one sentence each: verification that does not verify, versus key compromise
hints:
  - The bug is not in the signature check itself — recover the signers correctly, then ask where the list you compare against came from.
  - "Foundry's `vm.sign` lets you produce real signatures from keys you control, which is all the attacker needed."
  - For the threshold test, loop the compromised count and assert where acceptance flips; that number is the bridge's actual security parameter.
difficulty: 4
