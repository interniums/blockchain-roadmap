id: scaling-bridges-nomad-zero-root
moduleId: scaling-bridges
kind: break
title: Reproduce the zero-root bug and make every message valid
concepts: [initialisation-failure, bridge-is-the-honeypot, lock-and-mint]
spec: >
  Build a minimal message bridge in Solidity: a `Home` contract that commits messages into a
  Merkle tree, and a `Replica` that accepts a message if a supplied proof verifies against a
  trusted root stored at initialisation. Deploy the `Replica` behind a proxy and perform an upgrade
  that reinitialises it, leaving the trusted root at zero. Then prove an arbitrary message —
  including one that mints an unbacked token to an address you choose — and show it is accepted
  without any valid proof. Fix it in one line, and write the regression test that would have caught
  it. Finally, add a post-upgrade invariant check to the deployment script that asserts the trusted
  root is non-zero and matches the expected value.
acceptance:
  command: forge test --match-path test/BridgeInitFailure.t.sol -vvv
  criteria:
    - A test proves an unauthorised message is accepted while the trusted root is zero, minting to an attacker-chosen address
    - A second test proves the same message is rejected after the one-line fix
    - A third test runs the same exploit against a second, unrelated message and passes, demonstrating the bug was copy-pasteable rather than message-specific
    - The deployment script asserts a non-zero trusted root after upgrade and the test proves that assertion fails on the broken deployment
hints:
  - The bug is that a zero root makes the empty proof verify; you do not need a clever proof, you need no proof.
  - Reinitialisation is the realistic delivery mechanism — write the upgrade the way a team actually would, then notice what it left out.
  - "The fix is a guard on the value, not on the caller; ask what invariant the contract should have refused to start without."
difficulty: 3
