id: scaling-bridges-three-ways-across
moduleId: scaling-bridges
grain: block
kind: measure
title: Move value across three ways, and rank what you trusted each time
difficulty: 3
concepts: [native-bridge, cross-domain-messenger, deposit-is-fast-withdrawal-is-slow, storage-proof-bridge, header-verification-problem, intent-bridge, erc-7683]
spec: >
  Three mechanisms, three trust assumptions, one asset. Move it and report.

  THE NATIVE BRIDGE. Deposit and then withdraw through the rollup's own bridge. Report both durations and
  explain the asymmetry from the mechanism — a deposit and a withdrawal are not the same operation reversed,
  and saying why is the exercise. Then find the messenger contract and describe what a message consists of
  and who can deliver one.

  PROVE A SLOT INSTEAD. Build or examine a bridge that verifies a storage proof rather than trusting an
  attester set. State what it needs from the source chain and then name the hard part: verifying a header
  from one chain on another is not free, and the write-up should say how the design you examined solves or
  sidesteps it. Report the gas of one verification.

  SIGN THE OUTCOME. Use an intent-based route: state what you signed, who filled it, what risk the filler
  took, and what happens if nobody fills. Report the fill time and the spread you paid against the native
  route.

  THE RANKING. Then a table: for each of the three, what must not happen for you to keep your money. Rank
  them by that rather than by speed, and note where speed and safety point in opposite directions —
  because they do, and the fast one is the one a user will pick.
acceptance:
  criteria:
    - A deposit and a withdrawal are both made through a native bridge with durations reported and the asymmetry explained from the mechanism
    - The messenger contract is identified with what a message consists of and who can deliver one
    - A storage-proof bridge is built or examined with what it requires from the source chain stated
    - The header verification problem is named with how the examined design handles it, and one verification's gas reported
    - An intent route is used with what was signed, who filled, the filler's risk and the no-fill outcome all stated
    - Fill time and the spread against the native route are reported
    - A table ranks all three by what must not happen, with the divergence between speed and safety noted
hints:
  - Do the withdrawal on a testnet and start it early. The delay is the point and you cannot compress it, so begin the exercise with that step.
  - The header verification problem is the crux of proof-based bridging. If the design you look at avoids it, find out what it trusts instead.
  - For the ranking, phrase each row as a negative event rather than a property. "The attester set must not collude" is checkable; "it is trust-minimised" is not.
