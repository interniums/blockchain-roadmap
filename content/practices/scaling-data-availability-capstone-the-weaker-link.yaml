id: scaling-data-availability-capstone-the-weaker-link
moduleId: scaling-data-availability
grain: module
writeUp: >
  Write the one-paragraph risk disclosure you would put in a product's docs to distinguish a rollup from a validium. Test it on someone non-technical: after reading it, can they say who would have to misbehave for their funds to become unreachable?
