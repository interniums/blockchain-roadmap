kind: read
title: Classify four chains by where their data goes, and find the weaker link
difficulty: 4
concepts: [data-availability, da-does-not-imply-correctness, da-is-not-storage, retrievability, ethereum-blob-da, erasure-coding-for-da, alt-da, rollup-vs-validium, data-availability-committee, da-bridge, validium-withholding-risk, security-is-the-weaker-link]
spec: >
  One question decides whether a chain is a rollup, a validium or an optimium: where the data goes. Take
  four live chains that answer it differently and produce the comparison.

  THE CLASSIFICATION. For each chain, establish from primary sources where data is published and what
  publishes it. Then assign the label — rollup, validium, optimium — and state the single fact that
  decides it. If a chain's own marketing uses a different word than your classification, note the
  discrepancy and say which is accurate.

  THREE PROPERTIES, KEPT APART. For each chain, answer separately: is the data available, is it
  retrievable, and is the state transition valid? These are three different guarantees with three
  different mechanisms, and conflating any two is the mistake this module exists to prevent. Give the
  mechanism for each, per chain.

  AVAILABILITY IS NOT STORAGE. For the chain using Ethereum blobs, state the exact window and the date
  the data for a block you choose stops being served. Then answer: who is expected to have kept it, and
  what happens to a user who needs it after that?

  SAMPLING. Explain how a light node establishes availability without downloading the data, using the
  erasure-coding structure. Then state the withholding fraction the scheme detects and what an attacker
  must do to defeat it.

  THE COMMITTEE AND THE BRIDGE. For the alt-DA chain, name the committee: who is on it, how many must
  collude, and what the on-chain DA bridge actually verifies — a signature over a claim, or the data
  itself. Then state what a user loses if the committee withholds.

  THE WEAKER LINK. Close with the argument: for each of the four, state the security of the whole system
  as the weakest of its parts, and name that part. A validity proof over data nobody has is the case to
  reason through explicitly.
acceptance:
  command: 'true'
  criteria:
    - Four chains are classified rollup, validium or optimium from primary sources, each with the single deciding fact
    - Any discrepancy with a chain's own marketing term is noted with a verdict
    - Availability, retrievability and validity are answered separately per chain, each with its mechanism
    - For the blob chain, the exact window and the date a chosen block's data stops being served are given
    - Who is expected to retain that data, and the consequence for a user needing it later, are stated
    - Sampling is explained via the erasure-coding structure, with the detectable withholding fraction stated
    - The alt-DA committee's membership, collusion threshold, and what its bridge actually verifies are established
    - What a user loses under committee withholding is stated
    - Each chain's security is stated as its weakest part, with that part named
hints:
  - Establish what publishes the data before you classify anything. The label follows from that one fact, and a lot of published comparisons get it wrong by reading the proof system instead.
  - Keep availability and retrievability in separate columns from the start. They collapse into each other in casual writing, and the whole pruning discussion is incoherent once they have.
  - For the DA bridge, read what the contract verifies rather than what the docs say it guarantees. A signature over a claim about data is a very different object from the data.
