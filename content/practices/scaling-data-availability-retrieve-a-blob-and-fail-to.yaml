id: scaling-data-availability-retrieve-a-blob-and-fail-to
moduleId: scaling-data-availability
kind: measure
title: Retrieve one blob, then fail to retrieve an older one
concepts: [data-availability, da-is-not-storage, retrievability, ethereum-blob-da]
spec: >
  Find a recent blob-carrying transaction on Ethereum mainnet from a rollup's batcher address.
  Read its versioned hashes from the execution layer, then fetch the corresponding blob sidecars
  from a beacon API and verify that the KZG commitment of what you fetched hashes to the versioned
  hash you read on-chain. Then do exactly the same thing for a blob-carrying transaction from
  well outside the retention window, and capture the failure precisely — the status code, the
  error body, and whether the execution-layer transaction still exists. Write two paragraphs: what
  data availability guaranteed about the old blob at the time it was posted, and what property you
  were actually relying on when you tried to fetch it today.
acceptance:
  command: npx tsx scripts/fetch-blob.ts --tx $RECENT_BLOB_TX && npx tsx scripts/fetch-blob.ts --tx $OLD_BLOB_TX
  criteria:
    - One blob retrieved, with the recomputed versioned hash matching the one read from the execution layer
    - One blob demonstrably unavailable, with the exact beacon API response captured
    - The write-up states that the old transaction still exists on the execution layer while its sidecar does not
    - The write-up names the 1-of-N archiver assumption as the thing being relied on after the retention window
hints:
  - "A versioned hash is `0x01` followed by the last 31 bytes of `sha256(commitment)` — that is the check to reproduce."
  - The beacon API endpoint for sidecars is indexed by slot, not by transaction hash; map the execution block to its slot first.
  - If the old fetch succeeds, you did not go back far enough — retention is roughly eighteen days.
difficulty: 3
