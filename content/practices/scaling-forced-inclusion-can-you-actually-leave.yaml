id: scaling-forced-inclusion-can-you-actually-leave
moduleId: scaling-forced-inclusion
grain: block
kind: read
title: Try to leave an L2 as if the sequencer never came back
difficulty: 3
concepts: [sequencing-window, exit-window, walkaway-test, escape-hatch-requires-l1-liveness]
spec: >
  Run the walkaway test on a real chain: assume the sequencer is gone for good and find out, from the
  contracts, whether you can get your assets out.

  THE WINDOW. First establish what kind of guarantee the chain offers. Find the sequencing window in the
  contracts and state precisely what it bounds — it is a window rather than a queue, and the difference
  decides what happens to a transaction submitted inside it. Report the duration and what forcing a
  transaction costs.

  THE EXIT. Now write the exit as an executable sequence: every call, in order, with the contract, the
  function, who pays and how long each step waits. Then check the sequence for the disqualifying property:
  does any step require the sequencer to be alive or cooperative? If one does, you have not found an escape
  hatch, and saying so is the correct result.

  Report the total wall-clock time from decision to assets in hand on L1, and the total L1 gas cost.

  THE PRECONDITION. Then the fact the module ends on: your exit depends on L1 liveness and on your ability
  to pay L1 fees at the time you need to. Construct the scenario that makes that concrete — a period when
  L1 fees are high and everyone is exiting at once — and state what happens to a small position. Compute the
  position size below which exiting costs more than the position is worth.
acceptance:
  criteria:
    - The sequencing window is found in the contracts with its duration and what it bounds stated
    - The cost of forcing a transaction is reported
    - The exit is written as an executable call sequence with contract, function, payer and wait per step
    - Each step is checked for dependence on sequencer liveness, with any dependence reported as disqualifying
    - Total wall-clock time and total L1 gas cost for the exit are reported
    - A congested mass-exit scenario is constructed with its effect on a small position
    - The position size below which exiting costs more than it is worth is computed
hints:
  - Write the sequence as calls, not as prose. Descriptions of escape hatches hide the steps that need somebody else to act.
  - The window-versus-queue distinction decides what happens to a transaction you submitted just before the sequencer stopped. Work that case out explicitly.
  - The uneconomic-exit threshold is the finding most users never hear. Compute it at a realistic congested gas price rather than today's.
