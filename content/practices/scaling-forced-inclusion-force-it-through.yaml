id: scaling-forced-inclusion-force-it-through
moduleId: scaling-forced-inclusion
kind: implement
title: Force a transaction past the sequencer, and prove the delay is real
concepts: [delayed-inbox, force-include-call, force-inclusion-delay, forced-inclusion-is-not-forced-execution]
spec: >
  Write a Foundry test against a mainnet or testnet fork of an Arbitrum-family chain's L1
  contracts. First, read the live force-inclusion parameters straight from the SequencerInbox
  contract rather than from documentation, and assert on the values you find. Then queue a message
  through the delayed inbox, attempt the force-include call immediately and assert that it reverts,
  warp past the delay with `vm.warp` and `vm.roll`, and assert that the same call now succeeds.
  Do this for two different Arbitrum-family chains and show that the parameter differs between
  them. Finally, add a test showing that a forced transaction which would have succeeded at queue
  time reverts after the delay because the state moved — for example an allowance that was revoked.
acceptance:
  command: forge test --match-path test/ForceInclude.t.sol --fork-url $ETH_RPC_URL -vvv
  criteria:
    - Force-inclusion parameters are read from the SequencerInbox contract on-chain and asserted, not hard-coded from docs
    - The force-include call reverts before the delay elapses and succeeds after it
    - Two Arbitrum-family chains are covered and the test output shows their parameters differ
    - One test demonstrates that inclusion is not the outcome — a forced transaction lands and reverts because state moved during the delay
hints:
  - "`cast call` against the SequencerInbox will tell you the parameter names and values before you write any Solidity."
  - Both block number and timestamp matter — warp and roll together, or the delay check may not move.
  - For the last test, the simplest state change is a revoked ERC-20 allowance; queue the transfer first, revoke, then warp.
difficulty: 4
