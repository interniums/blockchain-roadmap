id: scaling-op-stack-derive-it-yourself
moduleId: scaling-op-stack
kind: implement
title: Stand up an OP Stack devnet and rebuild its chain from L1 alone
concepts: [derivation, derivation-is-the-security-model, unsafe-safe-finalized, two-client-node, deposit-transaction]
spec: >
  Bring up a local OP Stack devnet — op-geth, op-node, batcher and proposer against an L1 devnet —
  and send a transaction end to end. Locate the L1 transaction carrying the batch that contains
  your L2 block. Then start a second op-node from genesis with no connection to the sequencer at
  all and confirm it derives a byte-identical L2 chain, matching block hashes. Next, kill the
  sequencer and record which of the three heads stops advancing and which keep moving. With the
  sequencer still dead, submit a deposit on L1 and confirm it eventually lands on L2. Write up which
  component each observation implicates.
acceptance:
  command: make devnet-up && cast rpc optimism_syncStatus --rpc-url http://localhost:7545
  criteria:
    - An L2 transaction is traced to the specific L1 transaction carrying its batch
    - A second op-node started from genesis, with no sequencer connection, derives identical block hashes
    - With the sequencer killed, the write-up names which of unsafe, safe and finalized stops advancing and why
    - A deposit submitted on L1 during the sequencer outage lands on L2, with its L2 transaction hash recorded
hints:
  - The optimism monorepo ships a devnet target; use it rather than assembling the components by hand.
  - "`optimism_syncStatus` on op-node reports all three heads at once — that is the single call this whole exercise revolves around."
  - The second node proves the point only if it never talks to the sequencer; check its peer configuration before believing the result.
difficulty: 5
