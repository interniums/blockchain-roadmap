id: scaling-op-stack-messaging-without-a-bridge
moduleId: scaling-op-stack
grain: block
kind: read
title: Send a message between two chains with no bridge in the middle
difficulty: 3
concepts: [superchain-interop, dependency-set, op-supernode]
spec: >
  Interop between chains in one cluster is not a bridge. Establish what replaces it and what the replacement
  assumes.

  THE MECHANISM. For a cluster that supports it, establish from the contracts and the specification how a
  message from chain A becomes actionable on chain B without a third-party attester or a proof of A's
  header. Then state plainly what B is trusting instead — there is something, and naming it is the exercise.

  THE DEPENDENCY SET. Find it. Which chains does a given chain accept messages from, and who decides that
  list, and how does it change? Then answer the risk question: if one chain in the set produces an invalid
  message, what is the blast radius? Say whether the set is a trust union or an intersection and support the
  answer.

  THE NODE. Establish what a participant must run to serve this. Report the resource cost against running a
  single chain's node, and say what that does to who can independently verify the cluster.

  Then send one message if you can, and report the latency. If you cannot, say what access you would need.

  Close with a comparison: for a product deploying to two chains in the same cluster versus two chains in
  different ones, state what interop changes about the design, and what it does not — the second half is the
  one people skip.
acceptance:
  criteria:
    - How a message becomes actionable across chains without an attester or header proof is established from primary sources
    - What the receiving chain trusts instead is named
    - The dependency set is found with who controls it and how it changes
    - The blast radius of one invalid message is stated, with a supported trust-union-or-intersection verdict
    - What a participant must run is established with its resource cost against a single-chain node
    - The effect on who can independently verify the cluster is stated
    - One message is sent with latency reported, or the required access is named
    - A comparison states what interop changes and what it does not for a two-chain deployment
hints:
  - The thing being trusted is the shared sequencing or derivation guarantee rather than a signature. Getting that sentence right is most of the exercise.
  - Trust union versus intersection is the question that decides whether interop is safe to use. Work it out from what happens on an invalid message rather than from marketing.
  - The node cost is the practical finding. If verifying the cluster requires far more than verifying one chain, the decentralisation story changes and few write-ups say so.
