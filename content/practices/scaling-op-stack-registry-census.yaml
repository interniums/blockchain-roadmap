id: scaling-op-stack-registry-census
moduleId: scaling-op-stack
kind: read
title: Census the Superchain Registry and find the chains that are not rollups
concepts: [superchain-registry, standard-rollup-charter, configurability-is-not-freedom]
spec: >
  Clone the superchain-registry repository and write a script that reads its configuration data and
  outputs, for every chain, its name, whether it is `governed_by_optimism`, its `data_availability_type`, and its
  gas token. Sort the output so that non-standard chains and chains not posting to Ethereum blobs
  are visible immediately. Then take one chain that claims standard status and check it against the
  Standard Rollup Charter item by item, producing a completed checklist. Finish with a short note:
  how many chains in the registry are `governed_by_optimism = true`, how many use a data availability
  setting that would stop L2BEAT calling them a rollup, and what that says about the phrase
  "an OP Stack chain".
acceptance:
  command: node scripts/registry-census.mjs --repo ./superchain-registry
  criteria:
    - Output is a table of every registry chain with name, governed_by_optimism, data_availability_type and gas token
    - Chains that are not superchain_level 2, and chains not using Ethereum blob DA, are separately counted
    - One chain is checked line by line against the Standard Rollup Charter, with each item marked met or not met from registry data
    - The closing note states what registry membership does and does not attest to
hints:
  - The registry data is plain configuration files in the repo; read them rather than scraping any website.
  - "`superchain_level` is the field that distinguishes a Standard Rollup from a chain that merely joined the index."
  - If every chain in your table looks identical, you are reading the wrong file — the interesting variation is in DA and gas token settings.
difficulty: 2

# NOTE 2026-08-26: retargeted from `superchain_level`, which no longer appears in the
# registry TOMLs. The machine-readable data now exposes governed_by_optimism, superchain_time
# and data_availability_type. Verified against superchain/configs/mainnet/op.toml.
