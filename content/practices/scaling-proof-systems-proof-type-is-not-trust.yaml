id: scaling-proof-systems-proof-type-is-not-trust
moduleId: scaling-proof-systems
grain: block
kind: read
title: Price both proof families, then show the type tells you almost nothing
difficulty: 3
concepts: [fraud-proof, validity-proof, challenge-window, one-honest-challenger-assumption, permissionless-challenging, proving-cost, proving-latency, proof-type-is-not-trust-level]
spec: >
  Two ways to convince L1 that an execution happened, and a conclusion most comparisons get wrong.

  THE TWO MECHANISMS. For one chain of each family, establish from the contracts what actually gets posted
  and what L1 verifies. Then state the cost each imposes: for the fraud-proof chain, the delay before a
  withdrawal is final; for the validity-proof chain, the proving cost and latency per batch. Report real
  numbers for both.

  WHAT THE WINDOW IS FOR. The delay is widely described as time to compute a proof. Establish that it is
  not: state what the window actually budgets for, and then test the assumption it rests on. Find out, from
  the contracts, whether anyone may challenge or only a permitted set. Then answer the question that
  follows: how many honest challengers does the system need, and what happens if that number is zero for the
  length of the window?

  PROVING COSTS. For the validity chain, find the actual per-batch proving cost and latency. Then state who
  pays it and how it reaches the user — it is not a gas fee and it does not appear in one.

  THE CONCLUSION. Now the module's point. Take a chain from each family and rank them by how much a user
  must trust, using evidence other than the proof type: who can upgrade, who can sequence, whether the
  escape hatch works, whether challenging is open. Show that the ranking does not follow the proof type.
  If in your two chains it does, find a third that breaks it — and say so.
acceptance:
  criteria:
    - For one chain of each family, what is posted and what L1 verifies is established from the contracts
    - The withdrawal delay is reported for the fraud-proof chain and proving cost and latency for the validity-proof chain, with real numbers
    - What the challenge window actually budgets for is stated, distinguished from proving time
    - Whether challenging is permissionless is established from the contracts
    - The required number of honest challengers is stated, with the consequence of zero for a full window
    - Per-batch proving cost is reported with who pays and how it reaches the user
    - Two or more chains are ranked by trust required using evidence other than proof type, and the ranking is shown not to follow the proof type
hints:
  - Read the challenge contract to find out who may challenge. Several chains describe challenging as permissionless and restrict it in code, and that gap is the finding.
  - The window budgets for censorship, not computation. Once you have that, the seven-day figure stops looking arbitrary.
  - For the ranking, upgrade keys will dominate. That is the expected result and it is the whole reason the module ends where it does.
