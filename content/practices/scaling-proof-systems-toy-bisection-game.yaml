id: scaling-proof-systems-toy-bisection-game
moduleId: scaling-proof-systems
kind: implement
title: Build a bisection game and make an honest party win it
concepts: [interactive-bisection, one-step-proof, delay-attack, bonded-challenging]
spec: >
  In Foundry, implement a minimal dispute game over an execution trace. Both parties commit to a
  Merkle root over the trace of a simple deterministic step function. The challenger disputes the
  final state; each round, the contract asks both sides for their claimed state at the midpoint of
  the disputed range and narrows to the half where they first disagree. When the range is a single
  step, the contract executes that one step on-chain and awards the loser's bond to the winner.
  Write tests proving an honest party beats a dishonest one, that the number of on-chain rounds
  grows logarithmically with trace length, and that a party who stops responding loses on timeout.
  Then add a delay attacker who always responds at the last permitted moment, and measure how long
  the honest party is forced to stay engaged.
acceptance:
  command: forge test --match-path test/BisectionGame.t.sol -vvv
  criteria:
    - An honest party defeats a dishonest one and receives the forfeited bond
    - Round count is asserted to grow logarithmically as trace length goes from 2^8 to 2^20
    - The one-step resolution executes exactly one step of the trace on-chain, asserted by a gas or event check
    - A party who stops responding loses on timeout, including the case where both sides stop
    - A delay-attacker test reports the total wall-clock the honest party must remain engaged
hints:
  - Store only the Merkle root on-chain; the trace itself never goes on-chain, which is the point.
  - The disputed range needs both endpoints agreed and the midpoint contested — track which side each party claims at each committed index.
  - "For the timeout case, decide up front what happens when neither party moves; the OP dispute game spec handles this explicitly and is worth reading first."
difficulty: 5
