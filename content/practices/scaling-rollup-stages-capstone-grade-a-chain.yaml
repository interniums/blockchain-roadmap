id: scaling-rollup-stages-capstone-grade-a-chain
moduleId: scaling-rollup-stages
grain: module
writeUp: >
  Pick the L2 you would actually put your own money on. Name the single party or key set whose compromise would cost you that money, and say what would have to change on that chain — not on L2BEAT's site, on the chain — before that party stopped mattering.
coversConcepts:
  - rollup
  - sequencer
  - optimistic-rollup
  - validity-rollup
  - forced-inclusion
  - escape-hatch
  - upgrade-key-risk
  - proofs-do-not-imply-trustless
  - l2beat-stage-0
  - l2beat-stage-1
  - l2beat-stage-2
kind: read
title: Grade a live rollup yourself, and find the key that outranks its proofs
difficulty: 4
concepts: [rollup, sequencer, optimistic-rollup, validity-rollup, forced-inclusion, escape-hatch, upgrade-key-risk, proofs-do-not-imply-trustless, l2beat-stage-0, l2beat-stage-1, l2beat-stage-2]
spec: >
  Pick a live L2 and produce your own stage assessment from primary sources — the contracts, not the
  marketing site or the aggregator. Then compare your grade to the published one and account for any
  difference.

  THE PROMISE VERSUS THE DEPLOYMENT. State which proof family it uses, and then find the actual verifier
  or challenge contract on L1 and confirm it. If proofs are not live, or are live but not enforced, say
  so with the contract address and the state that shows it.

  THE TWO ESCAPE PROPERTIES. Find the forced-inclusion mechanism in the contracts and answer, from the
  code: how long must the sequencer censor you before you can force your transaction, and what does
  forcing it cost? Then find the escape hatch and answer: if the sequencer stops forever, what is the
  exact sequence of calls that gets your assets out, and how long does it take? Write the sequence, not
  a description of it.

  THE KEY. Find the upgrade path. Who can change the verifier, the bridge, or the challenge parameters,
  under what delay, and with what quorum? Then state plainly the thing this module exists to make
  unavoidable: whether that key can override every proof the system produces, and therefore what the
  proofs are worth to a user who does not trust the key holder.

  YOUR GRADE. Assign a stage from your own evidence, with the specific requirement that caps it. Then
  compare to L2BEAT's grade. If they differ, find out why — a stale entry, a recent upgrade, or your
  own error. Any of the three is a legitimate finding as long as you establish which.

  WHAT THE RUNG BUYS. Close with one paragraph on what moving this chain one stage up would actually
  change for a user with money on it — in terms of what someone can do to them, not in terms of the
  label.
acceptance:
  criteria:
    - The proof family is stated and confirmed against a named L1 contract address, including whether proofs are enforced
    - The forced-inclusion delay and cost are derived from the contracts, with the values given
    - The escape-hatch exit is written as an exact call sequence with a duration, not a description
    - The upgrade path names who can change what, under what delay and quorum
    - A plain statement of whether the upgrade key can override the proofs, and what that leaves the proofs worth
    - A stage is assigned from your own evidence with the specific requirement that caps it
    - Any difference from L2BEAT's grade is investigated and attributed to staleness, a recent upgrade, or your own error
    - One paragraph states what a one-stage improvement would change in terms of what someone can do to a user
hints:
  - Read the contracts before you read anything else, including the docs. Every part of this exercise is answerable from them, and reading the docs first tells you what to expect rather than what is there.
  - The escape hatch is where descriptions and reality diverge most. Trace the actual calls, including the one that needs an L1 transaction you have to pay for, and note anything that requires the sequencer to cooperate — that would not be an escape hatch.
  - When your grade matches L2BEAT's, still write down the capping requirement in your own words. Agreeing for the wrong reason is the failure mode this exercise is checking for.
