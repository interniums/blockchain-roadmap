id: scaling-rollup-stages-who-can-upgrade-this
moduleId: scaling-rollup-stages
grain: block
kind: read
title: Find out from chain data who can upgrade three L2s
concepts: [upgrade-key-risk, l2beat-stage-0, l2beat-stage-1, proofs-do-not-imply-trustless]
spec: >
  Pick three L2s that differ deliberately: one validity rollup currently rated Stage 0, one
  optimistic rollup currently rated Stage 1, and one chain outside the top ten. For each, find the
  main L1 rollup/bridge proxy address from L2BEAT's project page, then read the upgrade authority
  directly from mainnet rather than from documentation: the EIP-1967 admin slot, and then the owner
  of whatever contract that admin turns out to be. Follow the chain of ownership until you reach an
  externally owned account or a multisig, and record the multisig's threshold and signer count.
  Then write, for each chain, a short gap analysis: what specifically would have to change — which
  contract, which role, which key — for it to reach the next stage. Name the L2BEAT stage you found
  alongside the proof type, and say in one sentence why those two facts are independent.
acceptance:
  command: cast admin $ROLLUP_PROXY --rpc-url $ETH_RPC_URL && cast call $PROXY_ADMIN "owner()(address)" --rpc-url $ETH_RPC_URL
  criteria:
    - Three chains covered, each with the L1 proxy address and its admin read from mainnet, not copied from a doc
    - The ownership chain is followed to a terminal account, with multisig threshold and signer count recorded where one is reached
    - Each chain's proof type and current L2BEAT stage are stated together, with one sentence explaining why one does not determine the other
    - Each gap analysis names a specific contract, role or key that would have to change to reach the next stage
hints:
  - L2BEAT's project page lists the contracts by name, including which proxy is the one that matters.
  - "`cast admin` reads the EIP-1967 admin slot directly; if it returns a contract, that contract usually has an `owner()`."
  - A Safe multisig exposes `getThreshold()` and `getOwners()`; those two numbers are the real security parameter, not the word "multisig".
difficulty: 2
