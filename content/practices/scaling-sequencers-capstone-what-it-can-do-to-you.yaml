kind: measure
title: Bound what one hostile sequencer can do to you, and price its business
difficulty: 4
concepts: [sequencer-feed, soft-confirmation, hard-finality, sequencer-worst-case-is-bounded, sequencer-liveness-risk, sequencer-mev, l2-gross-vs-net-revenue, blob-collapsed-l2-margins, shared-sequencer, based-sequencing, decentralised-sequencer-does-not-fix-upgrade-keys]
spec: >
  One company-run process orders every transaction on the L2 you use. Produce a document that bounds what
  it can do to you and prices whether it can afford to keep running.

  THE TWO CONFIRMATIONS. Measure both. Send a transaction and record the time to soft confirmation from
  the sequencer feed, and the time to hard finality on L1. Report both distributions over at least twenty
  transactions. Then state, in one sentence a product manager would understand, what the green tick in the
  wallet actually promised.

  THE HARM TABLE. Enumerate what a hostile sequencer can do: reorder, delay, censor, extract. For each,
  state the bound — how long, how much, and what stops it. Then enumerate what it cannot do, and say what
  prevents each. The distinction between bounded harm and unbounded harm is the whole safety argument, and
  it must come out as a table.

  LIVENESS. What happens if it simply stops? Give the timeline: when do you notice, when can you force
  inclusion, when can you exit. Then say which of those depends on the sequencer being alive, because if
  any does, the answer is not an exit.

  EXTRACTION. Measure sequencer MEV on this chain over a window you choose, or establish that you cannot
  and say precisely what data is missing. Both are real answers.

  THE BUSINESS. Compute gross fee revenue and subtract L1 posting cost for a period, and report the net.
  Then compare against the same figure before blobs, and state what happened to the margin. Conclude with
  whether this chain's economics work at its current volume, and what volume it needs.

  THREE DECENTRALISATIONS. Shared sequencing, based sequencing, and a decentralised sequencer set. For each,
  say which harm from your table it removes — and then the module's closing point: state which harm all
  three leave completely untouched, and why.
acceptance:
  criteria:
    - Soft-confirmation and hard-finality times are measured over at least twenty transactions and reported as distributions
    - One plain sentence states what the wallet's confirmation actually promised
    - A table enumerates what a hostile sequencer can do with a bound for each, and what it cannot with the reason
    - A liveness timeline gives notice, forced inclusion and exit, with any step depending on sequencer cooperation flagged
    - Sequencer MEV is measured over a stated window, or the missing data is named precisely
    - Gross revenue minus L1 posting cost is computed for a period and compared against the pre-blob figure
    - A conclusion states whether the economics work at current volume and what volume is needed
    - Each of the three decentralisation approaches is mapped to the harm it removes
    - The harm all three leave untouched is named with the reason
hints:
  - Measure both confirmations from the same client and clock. The interesting number is the gap, and two different sources make the gap meaningless.
  - Build the harm table before you research the mitigations. Otherwise you will grade the mitigations against what they claim to fix rather than against what can actually be done to you.
  - The untouched harm is the upgrade key. Every decentralisation story in this module is about ordering, and none of them is about who can replace the contracts.
