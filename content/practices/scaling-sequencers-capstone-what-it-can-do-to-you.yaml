id: scaling-sequencers-capstone-what-it-can-do-to-you
moduleId: scaling-sequencers
grain: module
writeUp: >
  You are building a payments product on an L2. Choose the moment you credit a user's account — soft confirmation, batch posted, or L1 finalised — and write down, in money, the loss you are accepting by choosing it. Then say what would make you move the line.
