id: scaling-sequencers-soft-versus-hard
moduleId: scaling-sequencers
grain: block
kind: measure
title: Time the gap between the sequencer saying yes and L1 saying yes
concepts: [sequencer-feed, soft-confirmation, hard-finality]
spec: >
  Write a small TypeScript watcher, using viem, that connects to both an L2 RPC and an L1 RPC for
  the same rollup. Send one transaction on the L2 and record three wall-clock timestamps for it:
  when the L2 RPC first returns a receipt (the sequencer's soft confirmation), when the batch
  containing that L2 block appears in an L1 transaction from the chain's batcher address, and when
  that L1 block reaches finalised status. Print the three timestamps and the two deltas. Then
  extend the tool so that, for any L2 block number you give it, it answers a single question:
  has the batch containing this block reached L1 yet, or is the sequencer the only source
  claiming it exists.
acceptance:
  command: npx tsx src/finality-watch.ts --tx $TX_HASH
  criteria:
    - Output is a three-row table with real wall-clock timestamps for soft confirmation, batch posted to L1, and L1 finalisation
    - The two deltas are printed and the soft/hard boundary is labelled explicitly
    - Given any L2 block number, the tool reports whether L1 has seen its batch, distinguishing "sequencer says yes" from "L1 says yes"
    - The batcher address used is read from the chain's published configuration and stated in the output
hints:
  - Batches arrive as L1 transactions from a known batcher address to the chain's inbox contract; watch that address.
  - "viem's `getBlock` accepts `blockTag: 'finalized'` on L1 — that is your third timestamp, not the block being mined."
  - Poll rather than subscribe for the L1 side; finality is minutes away and a websocket adds nothing.
difficulty: 3
