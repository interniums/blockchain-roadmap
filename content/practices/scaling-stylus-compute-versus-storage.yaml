id: scaling-stylus-compute-versus-storage
moduleId: scaling-stylus
grain: module
writeUp: >
  You have a product with a custom pricing curve and a standard token. Decide which half, if either, belongs in Stylus. Justify the split by cost profile rather than by language preference, and state the operational cost the Stylus half adds to your deployment runbook.
coversConcepts:
  - stylus
  - coequal-wasm-vm
  - stylus-solidity-interop
  - abi-is-the-boundary
  - ink
  - compute-is-cheap-storage-is-not
  - stylus-storage-caching
  - page-based-memory
  - activation
  - reactivation
  - missing-evm-features
  - stylus-use-case-shape
  - rust-does-not-mean-safe-contracts
kind: measure
title: Measure where Stylus wins and where it does not
concepts: [compute-is-cheap-storage-is-not, ink, activation, stylus-use-case-shape, page-based-memory]
spec: >
  Write the same two contracts twice, once in Solidity and once in Rust with the Stylus SDK. The
  first is compute-bound: a loop of hash or fixed-point curve evaluations with a single storage
  write at the end. The second is storage-bound: a loop writing to a mapping. Deploy all four to
  Arbitrum Sepolia, activate the Stylus contracts, and measure gas for each. Record the activation
  cost separately as a real number from your own deployment, since it is not documented. Then add
  a third pair that allocates a large memory buffer and grows it, to see the page-based pricing
  against the EVM's quadratic expansion. Report a table of ratios and state, in one sentence per
  row, which cost component explains it.
acceptance:
  command: cargo stylus check && forge test --match-path test/StylusGas.t.sol --fork-url $ARB_SEPOLIA_RPC_URL -vvv
  criteria:
    - Gas measured for compute-bound, storage-bound and memory-heavy workloads in both Solidity and Stylus, reported as a table of ratios
    - The storage-bound row shows little or no saving, with the reason stated in one sentence
    - Activation cost is recorded as a measured number from an actual deployment, with the transaction hash
    - A Foundry test on the fork has a Solidity contract call the Rust contract through the interface produced by `cargo stylus export-abi`, and read a return value
hints:
  - Keep exactly one storage write in the compute-bound case so that storage is not what you are measuring.
  - "`cargo stylus export-abi` gives you the Solidity interface; import it and call the Stylus contract like any other address."
  - Do not quote the vendor's "10 to 100 times" range in your write-up — your own measured ratio for your own workload is the answer.
difficulty: 4
