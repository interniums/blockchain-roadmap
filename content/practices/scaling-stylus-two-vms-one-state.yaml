id: scaling-stylus-two-vms-one-state
moduleId: scaling-stylus
grain: block
kind: implement
title: Have Rust and Solidity call each other over the same state
difficulty: 3
concepts: [stylus, coequal-wasm-vm, stylus-solidity-interop, abi-is-the-boundary]
spec: >
  A second VM on the same state, and the only thing between them is the ABI.

  BOTH DIRECTIONS. Write one contract in Rust and one in Solidity, and have each call the other. Not a
  wrapper: a real call in each direction with arguments and a return value, including one dynamic type.
  Assert the values round-trip.

  COEQUAL, NOT NESTED. Demonstrate that the Rust contract is a first-class contract rather than something
  hosted: show it holding its own state, being called directly from an EOA, and appearing as an ordinary
  address to the Solidity contract. State what, if anything, distinguishes it from the outside.

  THE BOUNDARY. Then find where the abstraction is real work rather than free. Pick a type that does not map
  cleanly between the two languages and show what crossing costs — an encoding step, a copy, or a loss of
  type information. Report the gas for the same logical operation done entirely in Solidity, entirely in
  Rust, and split across the boundary. Three numbers, and the split one should not be the cheapest.

  WHEN IT IS WORTH IT. Close by finding a workload where the Rust side wins substantially, and one where it
  does not. Report both, and state the property that distinguishes them — it is a property of the
  computation, and naming it is what makes this reusable.
acceptance:
  criteria:
    - A Rust contract and a Solidity contract call each other in both directions with arguments and return values, including one dynamic type, and values are asserted to round-trip
    - The Rust contract is shown holding its own state, called directly from an EOA, and appearing as an ordinary address
    - What distinguishes it from the outside, if anything, is stated
    - A type that does not map cleanly is identified with what crossing it costs
    - Gas is reported for the operation done entirely in Solidity, entirely in Rust, and split across the boundary
    - A workload where Rust wins substantially and one where it does not are both reported
    - The property of the computation that distinguishes them is named
hints:
  - Do the Solidity-calling-Rust direction first. It is the one where the ABI does all the work and it establishes that the address is ordinary before you rely on that.
  - The awkward type is usually a nested dynamic structure. Pick one deliberately rather than hoping to hit it.
  - The distinguishing property is compute intensity relative to state access. Rust wins where the work is arithmetic and loses where it is storage, and having both numbers makes that concrete.
