id: security-audit-craft-double-severity
moduleId: security-audit-craft
grain: block
kind: write
title: Rate the same findings under both severity systems
concepts: [severity-vs-difficulty, impact-likelihood-matrix, informational-vs-finding]
spec: >
  Take three findings you have written - ideally including one that is catastrophic but requires privileged
  access, and one that is minor but trivially triggerable by anyone. Classify each twice: once as severity
  by difficulty under a firm convention, once as a single severity derived from impact and likelihood under
  a competitive-platform convention. Produce docs/severity-comparison.md with both classifications and, for
  each finding, the sentence explaining what each system throws away. At least one finding must land in a
  place where the two systems disagree; if none does, you have chosen three findings that are too similar.
acceptance:
  command: |-
    bash -c 'set -e; f=docs/severity-comparison.md; grep -qF "## Firm convention" "$f"; grep -qF "## Platform convention" "$f"; grep -qF "## Where they disagree" "$f"; test $(grep -coE "^### Finding" "$f") -ge 3'
  criteria:
    - Three findings classified under both conventions, with the reasoning for each label
    - At least one documented disagreement between the two systems, explained mechanically
    - A statement per finding of what information each convention discards
hints:
  - The disagreement you are looking for usually involves privileged access, which raises difficulty and lowers likelihood at once.
  - Do not translate one label into the other; derive each from the underlying facts independently.
  - The finding that is trivially triggerable but minor is the other end of the same tension - include it.
difficulty: 2
