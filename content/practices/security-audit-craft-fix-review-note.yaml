id: security-audit-craft-fix-review-note
moduleId: security-audit-craft
kind: fix
title: Reproduce a published finding, fix it, and write the fix review
concepts: [fix-review, poc-as-proof, false-positive-cost, finding-anatomy]
spec: >
  Choose a medium-severity finding from a public audit report where the affected code is available. Check
  out the audited commit, reproduce the issue as a failing Foundry test, apply the recommended fix, and
  confirm the test passes. Then write the fix-review note the auditor would have written: whether the fix is
  correct, whether it is complete - specifically whether the same pattern exists anywhere else in the
  codebase - and whether it introduced anything new. Search for the pattern elsewhere and report what you
  found, including finding nothing.
acceptance:
  command: |-
    bash -c 'set -e; forge test --junit --match-path test/FixReview.t.sol; f=docs/fix-review.md; grep -qF "## Correct" "$f"; grep -qF "## Complete" "$f"; grep -qF "## Introduced nothing new" "$f"; grep -qF "## Pattern search" "$f"'
  criteria:
    - A test that fails at the audited commit and passes after the fix
    - A completeness check that searched the whole codebase for the same pattern, with the search recorded
    - An explicit statement about regressions introduced by the fix
    - The note is written for the client, not for yourself
hints:
  - Reproduce before you fix; a fix you did not watch fail first is a fix you cannot vouch for.
  - Completeness is the part most fix reviews get wrong - the reported instance is rarely the only one.
  - Record the search you ran, including its query, so a reader can judge whether it would have found a second instance.
difficulty: 3
