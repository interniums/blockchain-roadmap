id: security-audit-craft-full-report
moduleId: security-audit-craft
grain: module
writeUp: >
  Think of a review comment of yours that was ignored. Which part of the finding anatomy was missing, and would supplying it have changed the outcome, or was the problem that the finding was not true?
coversConcepts:
  - finding-anatomy
  - exploit-scenario
  - poc-as-proof
  - severity-vs-difficulty
  - impact-likelihood-matrix
  - informational-vs-finding
  - false-positive-cost
  - code-maturity-assessment
  - maturity-category
  - maturity-rating
  - scope-statement
  - engineer-weeks
  - fix-review
  - audit-is-not-a-guarantee
kind: write
title: Audit three hundred lines and produce a real report
concepts: [finding-anatomy, exploit-scenario, poc-as-proof, code-maturity-assessment, maturity-rating]
spec: >
  Take a roughly three-hundred-line contract you did not write and produce a complete report in
  docs/audit-report.md. It must open with a scope statement naming the files, the commit hash and the
  assumptions granted. Every finding follows the full anatomy - title naming the defect, severity,
  difficulty, type, target with file, line range and commit, description, exploit scenario with a named
  actor and an ordering, and a recommendation split into a short-term fix and a long-term change. Every
  high and medium finding has a runnable Foundry proof of concept in test/findings. The report closes with
  a nine-category maturity table where every rating cites specific evidence in the code.
acceptance:
  command: |-
    bash -c 'set -e; forge test --junit --match-path "test/findings/*.t.sol"; f=docs/audit-report.md; grep -qF "## Scope" "$f"; grep -qF "## Findings" "$f"; grep -qF "## Codebase maturity" "$f"; test $(grep -coE "^Severity: " "$f") -ge 3; test $(grep -coE "^Difficulty: " "$f") -eq $(grep -coE "^Severity: " "$f"); test $(grep -coE "^\| *(Arithmetic|Auditing|Authentication|Complexity|Decentralization|Documentation|Transaction|Low-level|Testing)" "$f") -ge 9'
  criteria:
    - Every finding carries both a severity and a difficulty, never a single combined score
    - Every high and medium finding has a passing proof-of-concept test that fails on the unfixed code
    - Every recommendation is split into short term and long term
    - All nine maturity categories are rated and each rating cites a specific location in the code
    - Informational and gas observations are in their own section, not in the findings list
hints:
  - Write the scope statement first; it is what stops you from reporting issues in code you were not asked about.
  - If you cannot name an actor and an ordering for a finding, it is informational until you can.
  - The maturity table is where a report with few findings still earns its fee - do not fill it in last and quickly.
difficulty: 4
