id: security-audit-craft-report-teardown
moduleId: security-audit-craft
kind: read
title: Predict a report's findings from its scope and effort alone
concepts: [scope-statement, engineer-weeks, code-maturity-assessment, audit-is-not-a-guarantee]
spec: >
  Pick one public report from a firm that publishes engineer-weeks. Read only three things - the scope
  statement, the effort figure, and the maturity table - then stop. Write your predicted findings into
  docs/report-prediction.md before reading them: how many, in which categories, and at which severities,
  with your reasoning tied to specific maturity ratings. Then read the findings and write the analysis of
  your misses. Repeat the whole exercise with a second report from the same firm whose effort figure
  differs from the first by at least a factor of four, and write what the effort difference bought.
acceptance:
  command: |-
    bash -c 'set -e; f=docs/report-prediction.md; grep -qF "## Report A prediction" "$f"; grep -qF "## Report A actual" "$f"; grep -qF "## Report B prediction" "$f"; grep -qF "## Report B actual" "$f"; grep -qF "## What the effort difference bought" "$f"; git log --oneline -- "$f" | wc -l | grep -qvE "^ *1$"'
  criteria:
    - Predictions were committed before the findings were read, visible in the file's history
    - Each prediction cites specific maturity ratings as its reasoning
    - The two reports differ in effort by at least a factor of four
    - A written conclusion about what the extra effort produced, in findings and in confidence
hints:
  - The maturity table is a better predictor than the protocol's complexity; a weak testing rating predicts a particular kind of finding.
  - Commit the prediction before you scroll; the exercise has no value if you can quietly revise it.
  - When comparing the two reports, normalise by codebase size before concluding anything about density.
difficulty: 2
