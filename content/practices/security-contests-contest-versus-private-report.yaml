id: security-contests-contest-versus-private-report
moduleId: security-contests
kind: read
title: Diff a contest's output against a private report on the same protocol
concepts: [audit-contest, solo-finding, code-maturity-assessment, audit-is-not-a-guarantee]
spec: >
  Find a protocol that has both a public competition report and a private firm audit. Verify first whether
  the two covered the same commit and scope - if they did not, say so and reframe the comparison
  accordingly, because that itself is the finding. Produce docs/contest-vs-audit.md with a table of findings
  unique to each side and findings in common, and then the hypothesis the exercise exists for: state what
  competitions systematically find that a private engagement does not, and what a private engagement
  produces that no competition will.
acceptance:
  command: |-
    bash -c 'set -e; f=docs/contest-vs-audit.md; grep -qF "## Scope comparison" "$f"; grep -qF "## Unique to the competition" "$f"; grep -qF "## Unique to the private report" "$f"; grep -qF "## In common" "$f"; grep -qF "## Hypothesis" "$f"; test $(grep -coE "^\|" "$f") -ge 10'
  criteria:
    - The two scopes and commits are compared explicitly before any finding is compared
    - Three populated lists - unique to each side, and in common
    - A stated hypothesis about the systematic difference, with at least two findings cited as evidence
    - The maturity assessment and any architectural observations are accounted for in the comparison
hints:
  - Check the commit hashes first; if they differ, the interesting comparison is what changed between them.
  - Competitions are dense on reachable code and thin on architecture and off-chain concerns - look for that pattern before assuming it.
  - The private report's non-finding deliverables are part of what it produced; do not compare finding counts alone.
difficulty: 3
