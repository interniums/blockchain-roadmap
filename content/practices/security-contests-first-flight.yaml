id: security-contests-first-flight
moduleId: security-contests
kind: implement
title: Run a beginner competition end to end and audit your own misses
concepts: [first-flight, contest-as-training, known-issues-exclusion, judging-and-escalation]
spec: >
  Complete one beginner-tier competition from start to finish: read the scope documents in order, get the
  test suite green before writing anything, submit findings in the platform's required format with a
  proof of concept for anything above low severity, and stop when the window closes. When the results are
  published, produce docs/first-flight-retro.md listing every finding you missed, and for each one the
  reason you missed it, chosen from a fixed set - never looked at that file, looked and did not understand,
  saw it and judged it safe, saw it and could not write it up in time. The distribution across those four
  reasons is the deliverable.
acceptance:
  command: |-
    bash -c 'set -e; forge test --junit; f=docs/first-flight-retro.md; grep -qF "## Submitted" "$f"; grep -qF "## Missed" "$f"; grep -qF "## Reason distribution" "$f"; test $(grep -coE "never looked|did not understand|judged it safe|could not write it up" "$f") -ge 3'
  criteria:
    - At least one valid submission, in the platform's required format
    - Every published finding you did not submit is listed with one of the four miss reasons
    - The reason distribution is summarised and one concrete change to your process follows from it
    - The competition's test suite runs green in your local checkout
hints:
  - Get the test suite running before you read any contract; without it you cannot write a proof of concept under time pressure.
  - Saw it and judged it safe is the most valuable category and the one people underreport - be honest about it.
  - Submit the finding you are unsure about as the severity you actually believe, and note what would have made you certain.
difficulty: 3
