id: security-contests-payout-curve
moduleId: security-contests
grain: block
kind: measure
title: Plot what a duplicate actually costs you
concepts: [share-formula, duplicate-split, solo-finding]
spec: >
  Read the award calculation from the platform's own awarding documentation - not from a summary, since the
  coefficients circulating in secondary write-ups could not be confirmed for this track. Implement it in a
  script, then plot payout per participant against duplicate count for both High and Medium at a fixed pool
  size, and overlay the two curves. Produce docs/payout-curve.md with the chart, the formula exactly as the
  documentation states it with a link, and the strategy conclusion: at what duplicate count does an
  additional common finding stop being worth the hour, and what should the last twenty percent of contest
  time go to instead.
acceptance:
  command: |-
    bash -c 'set -e; python3 scripts/payout_curve.py --pool 100000 --out docs/payout-curve.svg; test -s docs/payout-curve.svg; test -s docs/payout-curve.md; grep -q "docs.code4rena.com" docs/payout-curve.md'
  criteria:
    - The formula is quoted from the platform documentation with a link, not from a third-party summary
    - Curves for both High and Medium at a fixed pool size, on the same axes
    - The break-even duplicate count is computed, not eyeballed
    - A stated strategy conclusion about where to spend the last portion of contest time
hints:
  - If the documentation and the summaries disagree, the documentation wins and the disagreement is worth a line in your write-up.
  - Plot per-participant value, not the issue's total slice; they behave very differently as duplicates rise.
  - The break-even point is where an extra duplicated finding earns less than the hour would earn spent going deeper elsewhere.
difficulty: 2
