id: security-contests-scope-brief
moduleId: security-contests
grain: block
kind: write
title: Write the scope brief before reading the first contract
concepts: [known-issues-exclusion, scope-statement, solo-finding]
spec: >
  Pick a live contest and, before opening any contract, produce docs/scope-brief.md containing the in-scope
  file list with the commit hash, the complete known-issues list, links to every prior audit report with the
  findings they already reported, the automated-findings appendix, the protocol's own stated invariants, and
  the three areas you will actually spend your time on with the reason each was chosen. The last section is
  the one that matters: your three areas should be places where you expect few other participants to look,
  and you should be able to say why.
acceptance:
  command: |-
    bash -c 'set -e; f=docs/scope-brief.md; grep -qF "## In scope" "$f"; grep -qF "## Commit" "$f"; grep -qF "## Known issues" "$f"; grep -qF "## Prior audits" "$f"; grep -qF "## Automated findings" "$f"; grep -qF "## Stated invariants" "$f"; grep -qF "## My three areas" "$f"; git log --diff-filter=A --format=%H -- "$f" | head -1 | xargs -I{} git show --stat {} | grep -qv "\.sol"'
  criteria:
    - The brief was committed before any contract file was opened, visible in the repository history
    - Known issues, prior audits and the automated appendix are enumerated rather than linked
    - The protocol's stated invariants are transcribed as booleans over state, not quoted as prose
    - Three target areas, each with a reason grounded in where other participants are unlikely to look
hints:
  - The invariant transcription is the part that pays; a protocol's prose usually contains three or four checkable claims.
  - An area is a good target if it is boring, recently changed, or at the seam between two systems.
  - If your three areas are the three largest contracts, you have chosen where everyone else is going.
difficulty: 2
