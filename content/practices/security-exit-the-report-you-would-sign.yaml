id: security-exit-the-report-you-would-sign
moduleId: security-contests
grain: exit
trackId: security
kind: read
title: Audit a real codebase and write the report you would put your name on
difficulty: 5
concepts:
  - primacy-of-impact
  - severity-inflation
  - known-issues-exclusion
  - signal-score
  - proof-of-assets-vault
spec: >
  Choose a real, deployed codebase between 500 and 2,000 lines that you have not read before, and
  audit it. The deliverable is a report you would sign — which means every finding is defensible and
  every non-finding is a decision you made rather than a thing you missed.

  IN ORDER, because the order is the method.

  BEFORE READING BUSINESS LOGIC. Score the codebase on a nine-category maturity rubric. Test
  coverage, documentation, access control structure, dependency hygiene, upgradeability, monitoring,
  incident history, verification, code complexity. This comes first because it tells you where to
  spend the rest of your time, and doing it after you have read the code contaminates it.

  TRUST BOUNDARIES. Draw them. For every crossing, state what an attacker controls on the other
  side. A diagram plus a table.

  RANKED CLASSES. List the vulnerability classes you looked for, ranked by what actually loses money
  in this codebase — not by the order a curriculum rehearses them. Say which you ruled out and how.

  FOUR TOOLS, FOUR BLIND SPOTS. Run static analysis, symbolic execution, fuzzing and a prover over
  the same code. For each, state what it could not see. Reporting only what they found is the
  mistake this exercise exists to prevent.

  INVARIANT SUITE. Write a handler-based campaign that reaches accounting states unit tests do not.
  Report what it found, or report that it found nothing and what that does and does not tell you.

  FINDINGS. Each with a severity, an exploitability difficulty, a named exploit scenario, and a
  runnable proof of concept. Severity uses impact first. If you have no high-severity findings, say
  so plainly — a report that inflates a low into a high to look productive is the failure mode here.

  ONE FORMAL REPORT. Read a published formal-verification report for a different project and
  summarise its assumptions and its summaries, not its checkmarks. One page.

  CONTEST ARITHMETIC. Finally: if this had been a contest, state which of your findings would have
  been duplicated, which would have been invalidated by scope or known-issues rules, and what the
  payout arithmetic would actually have produced.
acceptance:
  command: forge test --match-path test/exit/Audit.t.sol
  criteria:
    - The nine-category maturity score is dated before the business-logic read, and the report says how it redirected the audit
    - A trust-boundary diagram and table state, for every crossing, what an attacker controls
    - Vulnerability classes are ranked by money at risk in this codebase, with ruled-out classes named and the method for ruling them out stated
    - All four tool categories were run, and each has a stated blind spot rather than only a result
    - A handler-based invariant campaign runs against the target with its revert rate reported
    - Every finding has a severity, an exploitability difficulty, a named exploit scenario, and a proof of concept that runs
    - Severity is assigned impact-first, and any finding below high says so rather than being inflated
    - A one-page summary of a published formal-verification report covers its assumptions and summaries, not its checkmarks
    - The contest arithmetic names likely duplicates, likely rule-based invalidations, and a payout figure
hints:
  - Do the maturity rubric before you open a single business-logic file, and timestamp it. It is the one part of this that is worthless if done in the wrong order, and it is also the part that tells you where the bugs probably are.
  - When a tool finds nothing, that is the interesting case. Write down what it was structurally incapable of seeing in this codebase before you move on, because that is where you now have to look by hand.
  - Write the contest arithmetic last but honestly. If most of your findings would have been duplicates or out of scope, that is the real signal about the audit, and pretending otherwise is the habit this exercise is meant to break.
writeUp: >
  You have a report you would sign. Now argue against yourself: what is the most likely way this
  codebase gets exploited despite everything you just wrote, and what stopped you from finding it?
