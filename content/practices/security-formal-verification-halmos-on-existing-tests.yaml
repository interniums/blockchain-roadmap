id: security-formal-verification-halmos-on-existing-tests
moduleId: security-formal-verification
kind: implement
title: Turn a test suite into proofs in an afternoon
concepts: [spec-as-test-reuse, counterexample, bounded-verification, smt-solver]
spec: >
  Take an existing Foundry test suite for a fixed-point maths library. Convert its tests into symbolic
  checks - rename them to the tool's check prefix, replace every concrete literal with a symbolic
  parameter, and add the preconditions that make the original scenario a special case rather than the whole
  claim. Run the checker with an explicit loop bound. Find at least one input class the concrete tests never
  covered, reproduce the counterexample as an ordinary Foundry test so it is readable by someone who does
  not use the tool, and record the bound you ran under next to each result.
acceptance:
  command: |-
    bash -c 'set -e; halmos --match-contract MathSpec --loop 4 | tee halmos.log; forge test --junit --match-path test/Counterexamples.t.sol'
  criteria:
    - Every converted check has symbolic inputs and explicit preconditions rather than literals
    - At least one counterexample is found that the original concrete suite passes on
    - Each counterexample is reproduced as a plain Foundry test that fails on the unfixed code
    - Every result is recorded together with the loop bound it was obtained under
hints:
  - Convert one test at a time and keep the original next to it; the diff is the lesson.
  - When a check fails on an input you consider impossible, the missing piece is a precondition, not a bug.
  - A result without its bound is not a result - write the bound into the same line as the verdict.
difficulty: 3
