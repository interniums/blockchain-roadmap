id: security-formal-verification-loop-bound-sweep
moduleId: security-formal-verification
grain: block
kind: measure
title: Find the bound where verification stops terminating
concepts: [bounded-verification, verification-timeout, smt-solver]
spec: >
  Take one property over a loop and verify it at increasing bounds, recording verification time and outcome
  at each. Continue until the solver stops returning an answer within your chosen budget. Produce
  docs/bound-sweep.md with the table, the growth shape of the time series, and the sentence that matters -
  a precise statement of which executions your best terminating result does and does not cover, written so
  it could go into a report's assumptions section unedited.
acceptance:
  command: |-
    bash -c 'set -e; for n in 1 2 4 8 16; do echo bound=$n; timeout 900 halmos --match-contract LoopSpec --loop $n || echo no-answer; done | tee bound-sweep.log; test -s docs/bound-sweep.md'
  criteria:
    - A table of bound against time and outcome, including the first bound with no answer
    - A statement of the growth shape, supported by the timings rather than asserted
    - A one-paragraph exclusion statement fit to paste into a report's assumptions section
hints:
  - Distinguish a timeout from a refutation in your log; they are different results and the script must record which occurred.
  - The interesting number is the largest bound that terminated, not the first one that did not.
  - Write the exclusion statement in terms of executions, not in terms of the flag you passed.
difficulty: 3
