id: security-formal-verification-read-an-fv-appendix
moduleId: security-formal-verification
grain: block
kind: read
title: Extract everything a verification appendix did not prove
concepts: [summarization, optimistic-assumption, fv-roi, fv-scope-boundary]
spec: >
  Take a public audit report whose scope included formal verification - several in the public Cyfrin report
  repository qualify - and read only its verification appendix. Produce docs/fv-appendix-review.md listing,
  separately, the rules that were proven, the functions that were summarized, the assumptions that were
  declared, the bounds that were set, and the functions in scope that no rule mentions. The intended result
  is that the not-proven list is longer than the proven one; if it is not, say so and say why.
acceptance:
  command: |-
    bash -c 'set -e; f=docs/fv-appendix-review.md; grep -qF "## Proven" "$f"; grep -qF "## Summarized" "$f"; grep -qF "## Assumptions" "$f"; grep -qF "## Bounds" "$f"; grep -qF "## Unmentioned in any rule" "$f"; grep -qF "## What I would ask the authors" "$f"'
  criteria:
    - All five lists are present and populated from the appendix rather than from the report's summary
    - Functions in scope that no rule mentions are identified by name
    - At least three questions you would put to the authors, each tied to a specific assumption or summary
hints:
  - Start from the scope list and subtract; the interesting set is what the rules never mention.
  - An assumption stated once in a footnote applies to every rule after it - check whether the report says which.
  - Your questions should be answerable yes or no, otherwise they will be answered with reassurance.
difficulty: 3
