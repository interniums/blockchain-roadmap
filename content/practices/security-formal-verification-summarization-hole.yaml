id: security-formal-verification-summarization-hole
moduleId: security-formal-verification
grain: module
writeUp: >
  Pick one property in a system you care about. Would you rather have a proof of it under three summarizations you chose yourself, or a fuzz campaign with no summarizations and no proof? Defend the answer in terms of what each one would have missed.
coversConcepts:
  - smt-solver
  - counterexample
  - bounded-verification
  - unbounded-verification
  - loop-invariant
  - spec-language-cost
  - spec-as-test-reuse
  - parametric-rule
  - ghost-and-hook
  - summarization
  - optimistic-assumption
  - verification-timeout
  - fv-scope-boundary
  - fv-roi
kind: break
title: Pass a verification run on an exploitable contract
concepts: [summarization, optimistic-assumption, fv-scope-boundary]
spec: >
  Start from a small contract with a passing specification. Introduce an external call and summarize it so
  the run still terminates and still passes. Then plant a bug inside the summarized function such that the
  system is exploitable while the specification continues to pass, and write a proof-of-concept test that
  drains it. The deliverable is the two-sentence explanation an auditor would put in a report: what the
  proof covered, and what the summary moved outside it.
acceptance:
  command: |-
    bash -c 'set -e; certoraRun conf/Vault.conf | tee certora.log; forge test --junit --match-path test/SummarizedExploit.t.sol'
  criteria:
    - The specification passes on the version containing the exploitable behaviour
    - A Foundry test drains the same deployment the specification was run against
    - The written explanation names the summarized function and the assumption the summary created
    - The report-style note distinguishes what was proven from what was assumed
hints:
  - Put the bug in the behaviour the summary approximates, not in the code the prover still sees.
  - A summary that returns an unconstrained value is the honest one; a summary that returns a convenient constant is where the hole opens.
  - If your specification fails, you have summarized too little - that is the correct failure to have first.
difficulty: 5
