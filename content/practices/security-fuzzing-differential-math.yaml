id: security-fuzzing-differential-math
moduleId: security-fuzzing
grain: block
kind: implement
title: Fuzz your arithmetic against somebody else's
concepts: [differential-fuzzing, reference-model, assertion-mode, round-trip-property]
spec: >
  Write your own fixed-point helpers - a full-precision mulDiv, a square root, and one of exp or log - then
  build an assertion-mode differential harness comparing each against an established library implementation
  over the same symbolic inputs. Where the two disagree, decide which is right and write down why; where you
  believe they cannot disagree, write the argument. Add round-trip properties on the pairs that have
  inverses. The deliverable is either at least one genuine disagreement, or a written argument for
  equivalence precise enough that someone could attack it.
acceptance:
  command: forge test --junit --match-path test/DifferentialMath.t.sol
  criteria:
    - Each of your implementations is compared against a named reference over the same fuzzed inputs
    - At least one disagreement is found and adjudicated, or an explicit equivalence argument is written for each pair
    - Round-trip properties are present for every operation that has an inverse
    - Edge inputs - zero, one, the maximum value, and the value just below an overflow - are exercised rather than left to chance
hints:
  - Disagreements cluster at the extremes; make sure the fuzzer sees the maximum and the values adjacent to it.
  - Rounding direction is the usual source of a one-unit difference, and one unit is a real disagreement, not noise.
  - If you find nothing, your inputs are probably clamped somewhere you forgot about.
difficulty: 3
