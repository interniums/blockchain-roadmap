id: security-fuzzing-optimization-mode-profit
moduleId: security-fuzzing
grain: block
kind: measure
title: Ask how much an attacker can take, not whether they can take anything
concepts: [optimization-mode, economic-property, onchain-fuzzing, sequence-length]
spec: >
  Take a lending pool that reads a manipulable price source. Write the naive property first - that attacker
  profit is never positive - and run it. Then rewrite the same question in optimization mode, asking the
  fuzzer to maximise the attacker's ending balance, and run it under the same call budget. Report both
  outcomes plus the maximising sequence, and sweep sequence length across at least three values to show
  where the maximum stops improving. Conclude with the severity statement the optimization run supports and
  the assertion run did not.
acceptance:
  command: |-
    bash -c 'set -e; echidna . --contract AttackerHarness --test-mode optimization --config echidna.yaml | tee opt.log; test -s opt.log; test -s docs/profit-report.md'
  criteria:
    - Both the boolean property and the optimization property are present and were run at the same budget
    - A reported maximum profit figure with the call sequence that achieved it
    - A sequence-length sweep across at least three values with the maximum recorded at each
    - A written severity statement that cites the profit figure
hints:
  - Optimization mode maximises a returned value, so your harness needs a function that returns the number you care about.
  - The naive boolean property will fail instantly and tell you nothing about how bad it is - that contrast is the lesson.
  - If the maximum keeps rising with sequence length, you have not yet found the bound; say so rather than reporting the last number you saw.
difficulty: 4
