id: security-fuzzing-unclamp-and-remeasure
moduleId: security-fuzzing
kind: fix
title: Rescue a campaign in which ninety percent of calls revert
concepts: [revert-blindness, input-clamping, handler-contract, coverage-guided-fuzzing]
spec: >
  Start from a deliberately bad harness - the fuzzer pointed straight at the target's external functions,
  unbounded arguments, a single acting address, no approvals - and measure it: revert rate, line coverage,
  and time to first counterexample against a known planted bug. Then fix it in three separate commits, one
  change per commit - add a handler, add clamping, add an actor set - and re-measure after each. Report all
  three metrics at all four points in docs/harness-measurements.md and state which single change bought the
  most.
acceptance:
  command: |-
    bash -c 'set -e; forge test --junit --match-path test/invariant/Clamped.invariant.t.sol; forge coverage --match-path test/invariant/Clamped.invariant.t.sol --report summary | tee coverage.txt; test -s docs/harness-measurements.md; test $(git rev-list --count HEAD ^HEAD~3) -eq 3'
  criteria:
    - Revert rate falls below twenty percent and coverage strictly increases at the same call budget
    - Three separate commits, each isolating one change, with metrics recorded after each
    - The planted bug is found in the fixed harness and was not found in the original within the same budget
    - A written statement of which change mattered most, supported by the measurements
hints:
  - Measure before you change anything, or you will have no baseline to defend the work with.
  - The revert rate is visible in the invariant run summary; do not estimate it.
  - One change per commit is the point of the exercise - the answer to which change mattered is usually not the one people guess.
difficulty: 3
