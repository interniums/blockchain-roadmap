id: security-fuzzing-vault-invariant-suite
moduleId: security-fuzzing
grain: module
writeUp: >
  Take one property you wrote in this module. If the campaign had passed for a week, what would you actually be entitled to believe - and what would you still need to check another way?
coversConcepts:
  - invariant-testing
  - property-mode
  - assertion-mode
  - optimization-mode
  - handler-contract
  - input-clamping
  - revert-blindness
  - economic-property
  - path-independence
  - round-trip-property
  - differential-fuzzing
  - reference-model
  - coverage-guided-fuzzing
  - corpus-reuse
  - sequence-length
  - shrinking
  - onchain-fuzzing
kind: implement
title: Build an invariant suite that finds a rounding bug in a vault
concepts: [invariant-testing, handler-contract, input-clamping, economic-property, path-independence]
spec: >
  Take an ERC-4626 vault implementation and build a handler-based Foundry invariant suite for it. The
  handler exposes deposit, mint, withdraw, redeem and a donation of assets straight to the vault, selects
  the acting address from a fixed actor set, clamps every amount to what that actor can actually supply,
  and maintains ghost accumulators for total deposited and total withdrawn. Write three invariants - a
  solvency invariant that total assets always cover total claimable, a conservation invariant over the
  ghost accumulators, and a path-independence property asserting that n small deposits never yield more
  shares than one deposit of the same total. Then invert one rounding direction in the share calculation
  and confirm that the path-independence property, and only that property, fails.
acceptance:
  command: forge test --junit --match-path test/invariant/Vault.invariant.t.sol
  criteria:
    - All three invariants pass on the correct implementation
    - Line coverage of the vault from the invariant runner alone exceeds seventy percent
    - Inverting one rounding direction makes the path-independence property fail and leaves the other two passing
    - The handler clamps rather than rejects, and the reported revert rate is below twenty percent
hints:
  - Write the solvency invariant first; it is the one that will catch a mistake in your own handler.
  - Ghost variables live on the handler, not on the vault - the vault must not know it is being tested.
  - The donation entry point is what makes the suite interesting; without it the vault only ever sees balanced accounting.
difficulty: 4
