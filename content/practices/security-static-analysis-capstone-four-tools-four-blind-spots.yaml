kind: measure
title: Plant four bugs, one for each tool's blind spot
difficulty: 4
concepts: [static-analysis, slither, aderyn, symbolic-execution, halmos, property-fuzzing, echidna, medusa, formal-verification, certora-prover, tool-stack-not-tool]
spec: >
  The point of this module is that no single tool is enough, and the way to internalise it is to build
  the counterexample yourself: one codebase, four bugs, each chosen so that exactly one tool category
  finds it and at least one other structurally cannot.

  THE BUGS. Plant four, and before running anything, predict for each which of the four categories will
  find it and which will miss it. Sixteen predictions, written down.

    - one a pattern matcher finds immediately and a fuzzer is unlikely to reach
    - one that needs reasoning about an input class rather than sampled values
    - one that needs a specific sequence of calls, so only a stateful campaign reaches it
    - one that is only provable — where sampling can never establish the absence you care about

  RUN ALL FOUR. Static analysis with at least two tools, symbolic execution, property fuzzing with at
  least two engines, and a prover. Record what each found and what it reported that was not a bug.

  THE FALSE POSITIVES. Static analysis will produce noise. Count it, and classify each finding as true,
  false, or true-but-irrelevant. The third category is the one that determines whether a team keeps
  running the tool.

  THE BLIND SPOTS. For each tool, write one sentence on what it could not see in THIS codebase — not in
  general. The general answer is in the lesson; the specific answer is the exercise.

  THE PROVER'S ASSUMPTIONS. For the fourth bug, state what the prover assumed in order to prove
  anything, and construct a violation of one of those assumptions. A proof under an assumption you
  have violated is worth nothing, and knowing that is the point of the last lesson.

  THE SEQUENCE. Close with the order you would run these in on a real review, and why — including which
  one you would run first even though it finds the least.
acceptance:
  criteria:
    - Four bugs are planted, each chosen for a different tool category, with sixteen find/miss predictions recorded before any run
    - At least two static analysers, one symbolic executor, at least two fuzzing engines and one prover are all run
    - Every prediction is scored against the actual result, with wrong predictions kept and explained
    - Static-analysis findings are counted and classified true, false, or true-but-irrelevant
    - Each tool gets one sentence on what it could not see in this specific codebase
    - The prover's assumptions are stated, and one of them is violated to show the proof no longer holds
    - A recommended sequence is given with reasons, including which tool to run first despite finding least
hints:
  - Predict before you run, and keep the wrong predictions. The exercise is calibrating your sense of what each category can see, and you only get that from being wrong on paper.
  - The provable-only bug is the hardest to design. You want a property about all possible states, not about a hard-to-reach one — reachability is what fuzzing is for.
  - The true-but-irrelevant pile is the one to think about longest. It is why teams turn tools off, and deciding what to suppress is a real skill this exercise can give you cheaply.
