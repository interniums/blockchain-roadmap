id: security-static-analysis-false-positive-triage
moduleId: security-static-analysis
grain: block
kind: implement
title: Make an analyser useful on a codebase that is drowning in its output
concepts: [static-analysis, slither, tool-stack-not-tool, false-positive-cost]
spec: >
  Point Slither at a real, non-trivial repository with dependencies and take the raw finding count. Then do
  the work that makes the tool usable: exclude dependency paths, disable detectors whose pattern is not a
  risk in this codebase, and record for each disabled detector a one-line written justification. Commit the
  resulting configuration so a future contributor can see why each suppression exists. Report the before and
  after counts and, critically, verify you did not suppress anything real by re-running the full detector
  set once and diffing.
acceptance:
  command: |-
    bash -c 'set -e; slither . --json before.json || true; slither . --config-file slither.config.json --json after.json || true; test -s slither.config.json; test -s docs/suppressions.md; test $(wc -c < after.json) -lt $(wc -c < before.json)'
  criteria:
    - A committed analyser configuration, not a set of inline suppression comments
    - Every suppressed detector has a written justification naming why that pattern is not a risk here
    - Before and after finding counts are reported
    - A diff against a full unsuppressed run shows nothing real was hidden
hints:
  - Start by excluding dependencies; in most repositories that is the majority of the noise and costs nothing.
  - A justification of "noisy" is not a justification; say why the pattern cannot cause loss in this design.
  - Keep the full unsuppressed run in CI as a non-blocking job so a suppression that becomes wrong is still visible.
difficulty: 3
