id: security-static-analysis-two-analysers
moduleId: security-static-analysis
grain: block
kind: measure
title: Run two analysers on the same code and judge every finding
concepts: [static-analysis, slither, aderyn, tool-stack-not-tool]
spec: >
  Take one deliberately vulnerable contract set - the not-so-smart-contracts corpus in the Trail of Bits
  handbook is the intended target - and run both Slither and Aderyn over it with default configuration.
  Produce docs/tool-comparison.md with one row per unique finding, columns for each tool's verdict, your own
  judgement of true positive, false positive or unreachable, and the reason. Count and report four numbers
  per tool: total findings, true positives, false positives, and true positives the other tool missed.
  Finish with a recommendation about which one you would put in CI as a blocking check and which as an
  advisory report, and why they are not the same decision.
acceptance:
  command: |-
    bash -c 'set -e; slither . --json slither.json || true; aderyn . -o aderyn.md; test -s slither.json; test -s aderyn.md; test -s docs/tool-comparison.md; test $(grep -coE "^\|" docs/tool-comparison.md) -ge 12'
  criteria:
    - Both tools ran to completion and their raw output is committed alongside the comparison
    - Every finding carries an explicit true positive, false positive, or unreachable judgement with a reason
    - The four counts are reported per tool, including findings unique to each
    - A stated CI recommendation distinguishing a blocking check from an advisory report
hints:
  - Judge each finding against the code, not against the other tool; agreement between two analysers is not evidence.
  - An unreachable true pattern is its own category and is the most common source of argument in a real review.
  - The CI question is about what a failing build should mean, which is a team decision before it is a tooling one.
difficulty: 2
