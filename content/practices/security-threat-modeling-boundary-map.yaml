id: security-threat-modeling-boundary-map
moduleId: security-threat-modeling
grain: block
kind: write
title: Threat model a protocol you did not write
concepts: [trust-zone, trust-boundary, data-flow-crossing, threat-scenario, threat-model-document]
spec: >
  Pick a small real Foundry repository you did not write — roughly 500 lines of Solidity, a staking vault
  or a single-purpose protocol. Produce docs/threat-model.md containing, under exactly these headings:
  "## Components" (every deployed and off-chain component), "## Trust zones" (each component assigned to a
  zone, with the blast-radius reason), "## Data flows" (every crossing numbered DF-1, DF-2, ... with
  producer, consumer, and what is validated on arrival), "## Actors" (a table of actor by capability, not
  by role), "## Assumptions" (each entry naming what breaks downstream if it fails), "## Scenarios" (at
  least eight, each citing one DF number and one assumption, with impact and mitigation), and
  "## Residual risk" (what you would accept, by name). At least three scenarios must be ones no static
  analyser could surface, and at least one must live entirely off-chain.
acceptance:
  command: |-
    bash -c 'set -e; for s in "## Components" "## Trust zones" "## Data flows" "## Actors" "## Assumptions" "## Scenarios" "## Residual risk"; do grep -qF "$s" docs/threat-model.md; done; test $(grep -coE "DF-[0-9]+" docs/threat-model.md) -ge 14'
  criteria:
    - Every scenario cites a numbered data-flow crossing and one falsified assumption
    - At least three scenarios describe attacks no static analyser could infer
    - At least one scenario is entirely off-chain
    - The residual-risk section names accepted risks explicitly rather than omitting them
hints:
  - Draw the zones before writing any prose; the zone diagram determines what counts as a crossing.
  - For each crossing ask only one question - who chooses this value, and what is the worst value they may choose.
  - Your off-chain scenario almost certainly involves the deployment key, the signing interface, or CI; pick the one this project actually uses and trace it.
difficulty: 3
