id: security-threat-modeling-capstone-the-document-before-the-bugs
moduleId: security-threat-modeling
grain: module
writeUp: >
  Pick the system you know best. Which of its trust assumptions would you be least willing to defend in writing to someone who lost money when it failed, and what would it cost to stop assuming it?
coversConcepts:
  - trust-zone
  - trust-boundary
  - contract-boundary
  - actor-enumeration
  - capability-not-role
  - trust-assumption-inventory
  - data-flow-crossing
  - offchain-attack-surface
  - blind-signing
  - invariant-as-spec
  - function-level-invariant
  - system-level-invariant
  - invariant-driven-development
  - threat-scenario
  - threat-model-document
  - threat-model-cadence
kind: write
title: Write the threat model, then let a fuzzer try to falsify it
difficulty: 4
concepts: [trust-zone, trust-boundary, contract-boundary, actor-enumeration, capability-not-role, trust-assumption-inventory, data-flow-crossing, offchain-attack-surface, blind-signing, invariant-as-spec, function-level-invariant, system-level-invariant, invariant-driven-development, threat-scenario, threat-model-document, threat-model-cadence]
spec: >
  Take a protocol of at least three contracts — yours or a real one — and produce a threat model
  document that a fuzzer can consume. The test of a threat model is not that it reads well; it is that
  its assumptions are written precisely enough for a machine to attack.

  ZONES AND BOUNDARIES. Cut the system into trust zones and draw every boundary, including the ones
  that leave the chain: the frontend, the signer, the keeper, the oracle feed. For each crossing, say
  what an attacker on the far side controls.

  ACTORS BY CAPABILITY. Enumerate every actor by what they can cause, not by what they are called. "The
  owner" is a job title; "can change the fee recipient without a timelock" is a capability. Anyone who
  can cause the same thing is the same actor for this purpose, and saying so is often the finding.

  FOLLOW ONE VALUE. Pick a single value — a price, an amount, an address — and follow it across every
  boundary from where it originates to where it is trusted. At each hop, name who chose it. The first
  hop where the answer is "someone outside the trust zone" is where the model has to say something.

  THE OFF-CHAIN SURFACE. Include what a user is actually shown before signing. Construct one blind-
  signing scenario where the transaction a user approves does something other than what the interface
  said, and say what would have prevented it.

  ASSUMPTIONS AS INVARIANTS. Write the trust assumption inventory as invariants: at least four
  function-level and two system-level, each expressed as a predicate rather than a sentence.

  THEN FALSIFY THEM. Feed those invariants to a handler-based campaign. Report which held, which broke,
  and — most usefully — which could not be expressed as written and had to be sharpened. A model that
  survives contact unchanged was probably too vague to break.

  CADENCE. Close with when this document must be revisited, tied to specific events rather than to a
  calendar.
acceptance:
  command: forge test --junit --match-path test/capstone/ThreatModel.t.sol
  criteria:
    - Trust zones and every boundary are drawn, including at least two that leave the chain
    - Each crossing states what an attacker on the far side controls
    - Actors are enumerated by capability, and any two actors sharing a capability are identified as equivalent
    - One value is followed across every boundary with the chooser named at each hop, and the first out-of-zone hop identified
    - A blind-signing scenario is constructed where the approved transaction differs from what the interface showed, with the prevention named
    - At least four function-level and two system-level invariants are written as predicates
    - A handler-based campaign runs against those invariants and reports which held, which broke, and which had to be sharpened
    - The document names the events that require revisiting it, not a calendar interval
hints:
  - Enumerate by capability before you name anyone. The moment you write "the owner" you will stop looking, and the interesting finding is usually that two roles you thought were separate can cause the same thing.
  - The invariant that has to be sharpened is the valuable output of this exercise. Keep the original wording next to the sharpened one, because the gap between them is what vagueness looks like.
  - For blind signing, build the scenario from a real interface pattern rather than a contrived one. An approval whose amount is displayed in a different unit than it is signed in is enough.
