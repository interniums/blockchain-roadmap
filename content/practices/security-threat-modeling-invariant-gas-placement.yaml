id: security-threat-modeling-invariant-gas-placement
moduleId: security-threat-modeling
grain: block
kind: measure
title: Price one invariant and decide where it belongs
concepts: [system-level-invariant, invariant-driven-development, trust-assumption-inventory]
spec: >
  Take one system-level invariant from a protocol you have modelled - a solvency or conservation statement
  - and implement it three ways: as an on-chain runtime check inside the state-changing function, as an
  invariant_ property in a Foundry invariant suite, and as the pseudocode of a monitoring alert with its
  data source and threshold. Measure the gas the on-chain form adds to a realistic call, using a gasleft()
  delta harness that assigns each read into a storage sink so the read is not eliminated as dead code.
  Then argue in writing which of the three placements this invariant should have, and why.
acceptance:
  command: forge test --junit --match-path test/InvariantPlacement.t.sol -vv
  criteria:
    - A reported gas figure for the on-chain check on a realistic call path, with the harness overhead subtracted
    - The same invariant expressed as a passing Foundry invariant_ property
    - A written placement decision that cites the gas number and the failure mode the invariant is meant to catch
hints:
  - Measure the guarded and unguarded call separately and subtract; do not read a number off a total.
  - A read whose result is never used is deleted even with the optimizer off - assign it to a storage sink.
  - The deciding question is how fast you need to know, not how certain you need to be.
difficulty: 3
