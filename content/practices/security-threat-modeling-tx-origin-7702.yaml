id: security-threat-modeling-tx-origin-7702
moduleId: security-threat-modeling
kind: break
title: Defeat an anti-contract guard with a delegated EOA
concepts: [capability-not-role, trust-assumption-inventory, threat-scenario]
spec: >
  Write a contract whose sensitive function is guarded by require(msg.sender == tx.origin), stated in its
  comments as meaning "callers must not be contracts". On a Pectra-or-later fork, use an EIP-7702
  delegation to make an EOA execute attacker-supplied contract logic while still satisfying the guard, and
  drain or otherwise misuse the guarded function. Then write the one-paragraph threat-model consequence:
  which assumption in a pre-Pectra trust-assumption inventory this invalidates, and what the guard should
  have been checking instead.
acceptance:
  command: forge test --junit --match-path test/TxOriginGuard.t.sol
  criteria:
    - A test proves the guarded function executes attacker logic through a delegated EOA
    - A second test shows the same attack failing against a guard that checks an explicit allowlist or capability instead
    - The written note names the invalidated assumption, not just the failing line
hints:
  - The guard is checking a property of the caller's account type; EIP-7702 severed the link between account type and executable code.
  - Foundry can install a delegation designator directly; you do not need a relayer to reproduce this.
  - The correct fix is not a better origin check - it is deciding which capability you actually meant to restrict.
difficulty: 3
