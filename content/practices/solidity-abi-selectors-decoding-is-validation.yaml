id: solidity-abi-selectors-decoding-is-validation
moduleId: solidity-abi-selectors
grain: block
kind: break
title: Pass a value the decoder should have rejected
difficulty: 3
concepts: [abi-decode-validates, abi-strict-mode-not-enforced, abi-packed-encoding, abi-msg-data-msg-sig]
spec: >
  Decoding is where the ABI checks your arguments, and packing is where that checking is thrown away.

  WHAT DECODING CATCHES. Hand-craft calldata with an out-of-range value for a narrow type — a `uint8`
  carrying a value above 255, or a `bool` that is neither 0 nor 1. Call a normal function with it and show
  the decoder rejecting it. Report what the revert looks like.

  WHAT IT DOES NOT. Now show strict mode is not enforced: craft calldata that violates the encoding rules
  — trailing junk after the arguments, or an offset that points somewhere unexpected — and get it accepted.
  For each case, state what a strict decoder would have rejected and why the one you called did not.

  PACKED THROWS IT AWAY. Take the same arguments and encode them packed. Show there is no length
  information and therefore nothing to validate, and demonstrate the consequence: two different argument
  tuples whose packed encoding is identical, used to pass a check that hashes them.

  FROM THE INSIDE. Finally, write a function that reads the raw call itself: recover the selector from
  the calldata and compare it against the built-in, then decode one argument by hand from a byte offset
  you compute. Assert both match what the normal decoding produced.
acceptance:
  command: forge test --junit --match-path test/AbiValidation.t.sol
  criteria:
    - Hand-crafted calldata with an out-of-range narrow-type value is rejected by the decoder, with the revert reported
    - Calldata violating strict encoding rules is accepted, with what a strict decoder would have rejected stated for each case
    - Packed encoding is shown to carry no length information
    - Two distinct argument tuples produce identical packed bytes and pass a hash-based check
    - A function recovers the selector from raw calldata and matches it against the built-in
    - One argument is decoded by hand from a computed offset and matches normal decoding
hints:
  - Craft the calldata as a hex string in the test rather than through an encoder. An encoder will not let you build the invalid cases, which are the whole exercise.
  - Trailing junk is the easiest strict-mode violation to get accepted. Add bytes after a complete argument list and watch nothing complain.
  - For the hand decode, do a dynamic argument. Static types are one word at a fixed offset and teach you nothing the head/tail split does not.
