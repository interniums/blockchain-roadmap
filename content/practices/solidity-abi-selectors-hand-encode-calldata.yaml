id: solidity-abi-selectors-hand-encode-calldata
moduleId: solidity-abi-selectors
grain: module
writeUp: >
  You now know that a selector is four bytes of a hash and that a proxy and its implementation are compiled separately. Write down the argument you would make to a team that wants to add an admin function to a proxy contract: what could go wrong, what evidence would you ask for, and what design would you propose instead.
coversConcepts:
  - abi-function-selector
  - abi-canonical-signature
  - abi-return-type-not-in-selector
  - abi-selector-space
  - abi-selector-collision-risk
  - abi-dispatch
  - abi-dispatch-gas-not-uniform
  - abi-fallback-receive
  - abi-static-vs-dynamic
  - abi-head-tail
  - abi-offsets-relative
  - abi-dynamic-array-layout
  - abi-decode-validates
  - abi-strict-mode-not-enforced
  - abi-packed-encoding
  - abi-msg-data-msg-sig
kind: implement
title: Encode a nested call by hand and diff it against cast
concepts: [abi-function-selector, abi-canonical-signature, abi-head-tail, abi-offsets-relative, abi-dynamic-array-layout]
spec: >
  Working from the ABI specification alone, write an encoder for
  f(uint256,uint32[],bytes10,bytes) in a language of your choice, then diff its output byte for
  byte against cast calldata for the same arguments. Repeat for a nested signature such as
  g(uint256[][],string[]) so that the inner offsets restart from the inner block. Then write a
  Foundry test that feeds your bytes to a deployed contract with a raw call and asserts the decoded
  arguments come back correct, and a second test asserting that hashing the signature with uint
  instead of uint256 produces a different, wrong selector.
acceptance:
  command: forge test --junit --match-path test/HandEncoded.t.sol
  criteria:
    - The hand-produced calldata for both signatures is embedded as a literal in the test and a raw call with it succeeds and returns the expected values
    - A test asserts that keccak256("f(uint,uint32[],bytes10,bytes)") does not equal the real selector
    - The file annotates each 32-byte word of the nested example as head, tail, offset or length
hints:
  - Lay the blob out as a column of 32-byte words before you write any code. Every offset points at a word boundary.
  - Top-level offsets are counted from the byte after the four-byte selector, not from byte zero of the calldata.
  - For the nested case, the inner array's offsets restart at the start of the inner block. If you get the same answer either way, your test case is not nested deeply enough.
difficulty: 4
