id: solidity-abi-selectors-mine-a-clashing-selector
moduleId: solidity-abi-selectors
grain: block
kind: break
title: Mine a selector that shadows a proxy's admin function
concepts: [abi-selector-space, abi-selector-collision-risk, abi-dispatch, abi-fallback-receive]
spec: >
  Brute-force a function name of the form attack_<n>() whose four-byte selector equals the selector
  of upgradeTo(address). Deploy a minimal proxy whose fallback forwards to an implementation, give
  the implementation your mined function, and show that a call the admin believes goes to the
  proxy's upgrade path instead reaches the implementation, or the reverse, depending on which
  dispatcher sees the calldata first. Then swap in a transparent-proxy-style caller split and
  re-run the same test to show the clash is no longer reachable.
acceptance:
  command: forge test --junit --match-path test/SelectorClash.t.sol
  criteria:
    - The mined function name is in the test source and a test asserts its selector equals the target selector
    - A test proves a single calldata payload reaches the wrong code path on the naive proxy
    - The same test passes safely against the caller-splitting proxy, with an assertion that the admin path and the user path now differ
hints:
  - Four bytes is 2**32. A trivial loop over an incrementing suffix finds a preimage in seconds; you do not need anything clever.
  - The compiler will only reject duplicate selectors within one compilation unit. The proxy and the implementation are two.
  - Once it works, ask which of the two dispatchers ran first and why. That ordering is exactly what the transparent pattern controls.
difficulty: 4
