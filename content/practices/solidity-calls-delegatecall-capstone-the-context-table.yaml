id: solidity-calls-delegatecall-capstone-the-context-table
moduleId: solidity-calls-delegatecall
grain: module
writeUp: >
  Write the CALL / DELEGATECALL / STATICCALL context table from memory, then find one contract in the wild that uses delegatecall and say, from its source alone, what would have to be true about the target's storage layout for it to be safe. If you cannot tell from the source, say what you would need to see.
coversConcepts:
  - evm-message-call
  - evm-call-context
  - sol-delegatecall-context
  - delegatecall-storage-is-the-risk
  - delegatecall-no-code-succeeds
  - this-dot-f-is-external
  - staticcall-context
  - staticcall-is-the-enforcement
  - low-level-call-returns-bool
  - revert-bubbling
  - try-catch-external-only
  - returndata-bomb
  - proxy-storage-slots
  - library-linking
  - tx-origin-not-eoa
kind: break
title: Fill in the context table from a running system, then drain it
difficulty: 4
concepts: [evm-message-call, evm-call-context, sol-delegatecall-context, delegatecall-storage-is-the-risk, delegatecall-no-code-succeeds, staticcall-context, staticcall-is-the-enforcement, low-level-call-returns-bool, revert-bubbling, returndata-bomb, proxy-storage-slots, tx-origin-not-eoa, this-dot-f-is-external]
spec: >
  Build a small proxied system, derive the full context table from it by running code rather than by
  reading a doc, and then exploit the row that matters.

  THE TABLE. For CALL, DELEGATECALL and STATICCALL, and for each of `address(this)`, `msg.sender`,
  `msg.value` and whose storage is written: predict every cell in a comment, then assert it. Twelve
  cells, twelve predictions written before the run.

  CALL TO NOTHING. Show that a delegatecall to an address with no code succeeds and returns true.
  Then write the check that would have caught it, and say why that check is now unreliable under
  EIP-7702.

  THIS.F() IS NOT FREE. Demonstrate that `this.f()` is an external call: show the context difference
  and the gas difference against calling `f()` directly.

  STATICCALL ENFORCES. Show that `view` is not what makes a view function safe by making a `view`
  function attempt a state change and observing where it fails — and then show the same code
  succeeding when not reached through a staticcall.

  THE BOOLEAN AND THE BYTES. Make a low-level call fail and ignore the boolean, so the caller proceeds
  as if it succeeded. Then bubble the revert properly and show the difference in what the caller
  learns. Then send a returndata bomb and show what naive returndata copying costs — with a number.

  THE DRAIN. Finally: overwrite the proxy's implementation pointer from a function that was never
  meant to touch it, using nothing but slot arithmetic, and take control. A comment names the slot
  and says how the collision arose from the two contracts' layouts.

  THE GUARD THAT IS NOT ONE. Add a `tx.origin` check somewhere and show it does not mean what it
  looks like it means.
acceptance:
  command: forge test --junit --match-path test/capstone/CallContext.t.sol
  criteria:
    - All twelve cells of the context table are predicted in comments before being asserted
    - A delegatecall to a codeless address returns true, and the check that would catch it is written with a note on why EIP-7702 makes it unreliable
    - this.f() is shown to differ from f() in both context and gas, with the gas difference reported
    - A view function's state change is shown failing under staticcall and succeeding when not reached through one
    - An ignored low-level-call boolean lets the caller proceed after a failure, and proper revert bubbling is contrasted with it
    - A returndata bomb's cost to a naive caller is measured as a number
    - The implementation pointer is overwritten from an unrelated setter, with the colliding slot and its origin named in a comment
    - A tx.origin check is shown not to mean what it appears to mean
hints:
  - Fill the table before you build the exploit. The drain is a consequence of one row of it, and you will find the row yourself if you have written all twelve cells down honestly.
  - For the returndata bomb, measure with and without a bounded copy. The number only makes the point if you have both.
  - "The slot collision is easier to construct deliberately than to discover: choose which variable in the logic contract you want to land on the proxy's implementation slot, then write the declarations that put it there."
