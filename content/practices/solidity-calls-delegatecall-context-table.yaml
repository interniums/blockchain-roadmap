id: solidity-calls-delegatecall-context-table
moduleId: solidity-calls-delegatecall
grain: block
kind: implement
title: Build the context table from a running contract
concepts: [evm-message-call, evm-call-context, sol-delegatecall-context, staticcall-context, this-dot-f-is-external]
spec: >
  Write Caller and Target, where Target.probe() reports address(this), msg.sender, msg.value and
  address(this).balance. Invoke it five ways from Caller: a typed external call, a low-level .call,
  a .delegatecall, a .staticcall, and this.probe() on a copy of the function inside Caller itself.
  Before running, fill in a five-row by four-column prediction table in a comment. Then assert every
  cell in a Foundry test. The staticcall row cannot report by emitting, since LOG is forbidden in a
  static context — returning the values instead is part of the exercise.
acceptance:
  command: forge test --junit --match-path test/ContextTable.t.sol
  criteria:
    - Every cell of the five-by-four table is asserted, and the assertions match the prediction comment
    - A test proves that emitting a log inside the staticcall path reverts, and the passing version returns the values instead
    - A test asserts msg.sender inside the delegatecalled probe is the original caller and not the Caller contract
hints:
  - Delegatecall propagates CALLER and VALUE unchanged. Two of your four columns therefore have the same value in the CALL row and the DELEGATECALL row for different reasons.
  - LOG0 through LOG4 throw under the static flag. If your staticcall test reverts, that is the lesson, not a bug in your code.
  - this.probe() is a real message call. Predict what it does to msg.sender before you run it.
difficulty: 3
