id: solidity-calls-delegatecall-slot-zero-takeover
moduleId: solidity-calls-delegatecall
kind: break
title: Overwrite an implementation pointer from an ordinary setter
concepts: [delegatecall-storage-is-the-risk, delegatecall-no-code-succeeds, proxy-storage-slots]
spec: >
  Build a proxy whose slot 0 holds address implementation and an implementation whose slot 0 holds
  uint256 totalSupply. Call, through the proxy, a perfectly ordinary function that sets
  totalSupply = 1. Prove that the proxy's implementation pointer is now address(0x01), and then
  prove the more unsettling half: every subsequent call through the proxy returns success with
  empty return data, because the target has no code. Then move the proxy's state to the EIP-1967
  slot with inline assembly and re-run the identical breaking test.
acceptance:
  command: forge test --junit --match-path test/SlotZeroTakeover.t.sol
  criteria:
    - A test asserts vm.load of the proxy's slot 0 changed to the value written by the implementation
    - A test asserts a later call through the corrupted proxy returns success with zero-length returndata
    - The same breaking test run against the EIP-1967 version leaves the implementation slot unchanged, verified with vm.load of 0x360894a13ba1a3210667c828492db98dca3e2076cc3735a920a3ca505d382bbc
hints:
  - Nothing in either contract is wrong on its own. The bug is entirely in the pair.
  - Check the return of the low-level delegatecall after the corruption. success == true is the part most people do not expect.
  - The EIP-1967 slot is keccak256("eip1967.proxy.implementation") minus one. Write it as a constant and read it back with vm.load to prove you got it right.
difficulty: 3
