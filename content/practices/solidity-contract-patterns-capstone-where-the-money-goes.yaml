id: solidity-contract-patterns-capstone-where-the-money-goes
moduleId: solidity-contract-patterns
grain: module
writeUp: >
  For a protocol you would ship, list every privileged action and the address type that will hold it — EOA, multisig, timelock, AccessManager. For each, write what happens the day that key is compromised and the day it is lost. If any row has no answer, that row is the design work you have not done yet.
coversConcepts:
  - cei-order
  - cei-insufficient
  - reentrancy-guard
  - reentrancy-guard-transient
  - pattern-pull-payments
  - push-payment-dos
  - transfer-stipend-obsolete
  - access-ownable
  - access-ownable2step
  - access-roles
  - access-manager
  - access-control-is-top-loss
  - pausability
  - pause-is-centralisation
  - factory-create-vs-create2
  - clone-eip1167
  - clone-tradeoff
  - clone-no-constructor
  - clone-not-upgradeable
kind: break
title: Build the bank every pattern exists for, break it four ways, then fix it
difficulty: 4
concepts: [cei-order, cei-insufficient, reentrancy-guard, reentrancy-guard-transient, pattern-pull-payments, push-payment-dos, access-ownable, access-ownable2step, access-roles, access-manager, access-control-is-top-loss, pausability, pause-is-centralisation, factory-create-vs-create2, clone-eip1167, clone-no-constructor, clone-not-upgradeable]
spec: >
  Build a deliberately naive bank that pays out to a list of recipients, then attack it four times,
  then rebuild it. Each attack corresponds to one pattern in this module, and the order is the
  argument: the one that takes the most money is not the one curricula put first.

  ATTACK ONE — REENTRANCY. Drain it. Then fix with CEI and show the drain fails. Then demonstrate what
  CEI does not cover, with a second attack that survives correct ordering. Add a guard, and compare
  the storage guard against the transient one with measured gas.

  ATTACK TWO — PUSH PAYMENT DOS. Add one recipient that reverts on receive and brick the whole
  distribution. Convert to pull payments and show the same recipient now harms only itself. State what
  the conversion cost in gas and in interface complexity.

  ATTACK THREE — ACCESS CONTROL. This is the one that actually takes the money, and the exercise is to
  treat it that way. Find or plant a privileged-function mistake and take the bank with it. Then
  implement three authorization models over the same contract — Ownable2Step, roles, and a manager —
  and for each state the blast radius of every key: what its holder can take, and what they can
  destroy that cannot be recovered.

  ATTACK FOUR — THE PAUSE. Add pausability. Then argue against it: state exactly who can now freeze
  the contract, and construct the scenario where the pause is the attack rather than the defence.

  THE FACTORY. Deploy the fixed bank a thousand times with clones. Show a clone has no constructor and
  demonstrate what goes wrong if you assume it does. Compare CREATE and CREATE2 for this, and say
  which you chose and why. Then state, in one sentence, what a clone cannot do that a full deployment
  can.
acceptance:
  command: forge test --junit --match-path test/capstone/Bank.t.sol
  criteria:
    - A reentrancy drain succeeds against the naive bank and fails after CEI ordering
    - A second attack survives correct CEI ordering, demonstrating what CEI does not cover
    - Storage and transient reentrancy guards are compared with measured gas
    - One reverting recipient bricks the push distribution, and the pull version confines the damage to that recipient
    - The cost of the pull conversion is stated in gas and in interface complexity
    - An access-control mistake is exploited to take the bank
    - Three authorization models are implemented, each with the blast radius of every key stated as what it can take and what it can irrecoverably destroy
    - A scenario is constructed where the pause is the attack rather than the defence, with the freezing party named
    - Clones are deployed, shown to have no constructor, and the failure from assuming otherwise is demonstrated
    - CREATE and CREATE2 are compared with a stated choice, and one sentence names what a clone cannot do
hints:
  - Do the access-control attack second, not last, even though the spec lists it third. It is the one that transfers to real work, and doing it while you still have attention for it is worth more than finishing the reentrancy section perfectly.
  - For "what CEI does not cover", look across functions rather than within one. A single function can be perfectly ordered and still leave a cross-function invariant broken between two calls.
  - The clone-has-no-constructor failure is best shown with an initialiser you forget to call. Deploy one uninitialised, then let someone else initialise it.
