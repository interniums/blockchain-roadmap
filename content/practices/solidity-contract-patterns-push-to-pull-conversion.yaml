id: solidity-contract-patterns-push-to-pull-conversion
moduleId: solidity-contract-patterns
kind: fix
title: Convert a distribution loop that one recipient can brick
concepts:
- pattern-pull-payments
- push-payment-dos
- transfer-stipend-obsolete
spec: 'Start from a distribute(address[] recipients) that pushes ETH inside a loop using .transfer. Prove
  three separate failures against it: a recipient whose receive() reverts blocks everyone, a recipient
  whose receive() burns gas blocks everyone, and a smart-contract wallet whose receive() legitimately
  costs more than 2300 gas fails even though nothing is wrong with it. Convert to pull payments with a
  credits mapping and a withdraw() using call{value:}("") with a checked return, and prove all three now
  succeed for everyone else.

  '
acceptance:
  command: forge test --junit --match-path test/PullPayments.t.sol
  criteria:
  - Three tests each prove a distinct failure of the push version — reverting recipient, gas-burning recipient,
    and a recipient needing more than the 2300-gas stipend
  - The same three scenarios all pass against the pull version, with every other recipient paid
  - A test asserts the pull version checks the return value of the low-level call and reverts on failure
hints:
- Make the third recipient a contract whose receive() writes a storage slot. That alone exceeds the stipend,
  and nothing about it is malicious.
- .transfer forwards a fixed 2300 gas. Gas costs were repriced in 2019 and again since; that number was
  never a security property.
- 'After converting, check the failure blast radius: in the pull version, whose transaction fails when
  a recipient misbehaves?'
difficulty: 2
