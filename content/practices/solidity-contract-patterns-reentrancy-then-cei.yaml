id: solidity-contract-patterns-reentrancy-then-cei
moduleId: solidity-contract-patterns
kind: break
title: Drain a bank, fix it with CEI, then show what the fix does not cover
concepts: [cei-order, cei-insufficient, reentrancy-guard, reentrancy-guard-transient]
spec: >
  Write a VulnerableBank whose withdraw sends ETH before zeroing the balance, and an attacker whose
  receive() re-enters it. Prove the drain. Reorder to Checks-Effects-Interactions and prove the same
  attack fails. Then extend to read-only reentrancy: add a second contract that prices something
  from bank.totalAssets(), have the attacker query it from inside the callback, and show that the
  CEI-fixed and nonReentrant-guarded bank still hands the observer a wrong number. Finish by
  benchmarking no guard, ReentrancyGuard and ReentrancyGuardTransient on the same function.
acceptance:
  command: forge test --junit --match-path test/Reentrancy.t.sol
  criteria:
    - A test proves the attacker's ending balance exceeds its deposit against the vulnerable version and does not against the CEI version
    - A test proves the observer contract reads an incorrect price during the callback even with CEI and nonReentrant both applied
    - Measured guard overheads are recorded for all three variants with the solc version and optimizer setting stated
hints:
  - The attacker's receive() must re-enter before the first frame updates state. If it does not drain, check whether your withdraw zeroes the balance first.
  - Read-only reentrancy needs a third contract. The victim is not the bank; it is whoever trusts the bank's view function mid-transaction.
  - Do not expect the storage guard to match any number you have read. It depends on whether the lock slot is cold or warm; report the range you measured and say which case you were in.
difficulty: 3
