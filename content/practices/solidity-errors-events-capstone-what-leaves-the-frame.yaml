id: solidity-errors-events-capstone-what-leaves-the-frame
moduleId: solidity-errors-events
grain: module
writeUp: >
  Design the failure surface of a two-contract system you would actually ship: name every error a user can hit, decide which contract declares each one, and say how the frontend will decode the ones thrown by the inner contract. Then say which event signature in that system you are committing never to change, and why.
coversConcepts:
  - sol-custom-error
  - sol-error-selector
  - sol-revert-string
  - sol-builtin-error-selectors
  - sol-panic-codes
  - sol-require-no-data
  - sol-require-with-error
  - sol-require-args-eager
  - error-data-untrusted
  - error-client-surfacing
  - errors-not-in-abi-when-forwarded
  - sol-event-topics
  - sol-event-data
  - events-are-not-readable-onchain
  - event-indexed-reference-types
  - log-gas-model
kind: implement
title: Design the wire format of every failure and every event, then break a client with it
difficulty: 4
concepts: [sol-custom-error, sol-error-selector, sol-builtin-error-selectors, sol-panic-codes, sol-require-with-error, sol-require-args-eager, error-data-untrusted, errors-not-in-abi-when-forwarded, sol-event-topics, sol-event-data, event-indexed-reference-types, log-gas-model, events-are-not-readable-onchain]
spec: >
  One contract plus one decoder, built together, so that every byte leaving a frame is something you
  chose rather than something the compiler chose for you.

  THE FAILURE CATALOGUE. Make the contract fail in every way it can: a require with no data, a require
  with a string, a require with a custom error, a revert with a custom error carrying arguments, an
  assert, and both compiler-thrown panics you can trigger. For each, capture the exact revert bytes
  and decode them in your own decoder — selector first, then arguments. Tabulate the byte length of
  each, because that is the cost of the choice.

  EAGER ARGUMENTS. Demonstrate that the arguments to a require's error are evaluated even when the
  condition passes, by making one of them expensive and measuring. State what that means for where
  you put a call in a require.

  PROVENANCE IS NOT PROVEN. Have contract A call contract B, where B reverts with an error that A
  also declares. Show that a client decoding the revert cannot tell which contract failed. Then show
  the same error forwarded through a proxy and note that it is not in the proxy's ABI at all — so a
  client working from the ABI cannot decode it.

  THE LOG. Emit events covering: a value type indexed, a value type in data, a dynamic type indexed,
  and the maximum number of indexed arguments. For each, show the topics and the data separately.
  Then prove the point: try to recover the original value of the indexed dynamic argument, fail, and
  fix the event so it is recoverable — stating what the fix costs.

  ON-CHAIN BLINDNESS. Write a test asserting a contract cannot read its own emitted event.

  THE PRICE OF INDEXING. Measure the gas of each event shape and state the per-topic cost you
  measured. Then design the final event schema for this contract, and say in two sentences what
  changing it in v2 would silently break downstream.
acceptance:
  command: forge test --junit --match-path test/capstone/WireFormat.t.sol
  criteria:
    - All six failure modes are triggered, their revert bytes captured, and decoded by your own decoder rather than a library
    - The byte length of each failure mode is tabulated
    - Eager evaluation of a require's error arguments is demonstrated by measurement, with the consequence for placing calls in a require stated
    - A client is shown unable to determine which of two contracts declaring the same error actually failed
    - An error forwarded through a proxy is shown to be absent from the proxy's ABI, and therefore undecodable from it
    - Four event shapes are emitted with topics and data shown separately for each
    - Recovering an indexed dynamic argument's original value fails, and the fixed event makes it recoverable with the cost stated
    - A test asserts a contract cannot read its own emitted event
    - Per-topic gas cost is measured, and the final schema comes with two sentences on what a v2 change would silently break
hints:
  - Write the decoder before the contract. Once you can turn revert bytes into a selector and arguments, every part of this exercise becomes a question you can answer by looking.
  - For the eager-argument measurement, put a storage read in the error argument and pass the condition. The gas difference against an empty argument is the whole finding.
  - The indexed dynamic argument is not truncated, it is hashed. Say that in your write-up, because "truncated" is the wrong mental model and it leads people to think a longer topic would help.
