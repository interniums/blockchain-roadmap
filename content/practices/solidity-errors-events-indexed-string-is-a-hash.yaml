id: solidity-errors-events-indexed-string-is-a-hash
moduleId: solidity-errors-events
grain: block
kind: break
title: Try to read back an indexed string, then fix the event
concepts: [event-indexed-reference-types, sol-event-topics, sol-event-data, log-gas-model]
spec: >
  Emit an event with an indexed string parameter and try to reconstruct the original string from
  the logs. You cannot: the topic is a hash. Fix it by emitting the value twice, once indexed and
  once not, and show that filtering by topic and reading the value both now work. In the same test
  file, emit one four-field event with 0, 1, 2 and 3 indexed parameters and record the gas of each
  so you can decompose the total into base, per-topic and per-byte components.
acceptance:
  command: forge test --junit --match-path test/EventIndexing.t.sol
  criteria:
    - A test asserts the indexed-string topic equals keccak256 of the string and that the string itself appears nowhere in the log
    - A test filters by the indexed topic and separately reads the plain value from the data field, both succeeding on the fixed event
    - Measured per-topic gas deltas land near 375 and the file decomposes one emit into base, topics and data bytes
hints:
  - vm.recordLogs gives you the raw topics and data. Look at them directly rather than through a decoded helper.
  - topics[0] is the event signature hash, so an indexed string lands in topics[1].
  - Before measuring, predict the deltas. 375 per topic is a published constant and it was measured again on solc 0.8.36.
difficulty: 2
