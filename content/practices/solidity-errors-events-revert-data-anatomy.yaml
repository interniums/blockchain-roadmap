id: solidity-errors-events-revert-data-anatomy
moduleId: solidity-errors-events
kind: measure
title: Measure what each way of failing puts on the wire
concepts: [sol-custom-error, sol-error-selector, sol-revert-string, sol-require-no-data, sol-require-with-error]
spec: >
  Build four contracts identical except for the failure path: require(cond) with no message,
  require(cond, "Insufficient balance for this transfer"), revert InsufficientBalance(a, b), and
  require(cond, InsufficientBalance(a, b)). For each, capture the exact revert data returned by a
  low-level call and record its byte length, plus deployed bytecode size from forge build --sizes
  and happy-path and revert-path gas, with and without --via-ir. Assert the selector of your custom
  error by hand and confirm it equals the first four bytes of the captured data.
acceptance:
  command: forge test --junit --match-path test/RevertAnatomy.t.sol
  criteria:
    - A test asserts the bare require returns exactly zero bytes of revert data
    - A test asserts the first four bytes of the custom-error revert data equal the hand-computed keccak256 of the canonical signature
    - Recorded deploy size and gas numbers state the solc version, optimizer setting and whether via-IR was used
hints:
  - Use a raw .call rather than vm.expectRevert when you want to inspect the bytes; expectRevert asserts and discards.
  - Compare deploy sizes before you compare gas. The unconditional saving from custom errors is in the deployed bytecode, not the revert path.
  - Do not go looking for a published gas figure for custom errors versus strings. There is not a trustworthy one; your own table for your own build is the answer.
difficulty: 2
