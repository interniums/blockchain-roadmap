id: solidity-exit-vault-that-survives
moduleId: solidity-vyper
grain: exit
trackId: solidity
kind: implement
title: Ship an upgradeable vault that survives the attacks that killed the others
difficulty: 5
concepts:
  - vyper-transferable-lessons
  - compiler-is-part-of-tcb
  - vyper-safety-by-default
  - vyper-audit-policy
spec: >
  Build a share-accounting vault, behind a proxy, that takes deposits in an arbitrary ERC-20 and
  survives every failure in this track. This is the track's whole content as one contract, and the
  test suite is the argument.

  What it has to withstand.

  FIRST-DEPOSITOR INFLATION. A first depositor must not be able to make the share price a number that
  rounds every later depositor to zero. State your defence — virtual shares, a dead-share mint, a
  minimum deposit — and prove it with a test that would pass on a naive implementation and fails on
  yours only because the defence is there.

  ROUNDING. Every conversion rounds in the vault's favour. A test asserts that no sequence of
  deposits, withdrawals and donations leaves the vault owing more than it holds.

  WEIRD TOKENS. It must stay solvent against a token that returns no data on success, one that taxes
  transfers, and one that rebases downward overnight. Not "reverts safely" — solvent, with share
  accounting that still means something afterwards.

  UPGRADE. Ship v2 behind the same proxy, adding at least one state variable, without corrupting
  state. Include a slot map before and after. Then include a THIRD version, v2-bad, which bricks the
  contract, and a test that demonstrates the bricking — with a comment naming the slot collision
  from the map that caused it.

  ACCESS. Choose between Ownable, AccessControl and AccessManager, and for every privileged key,
  state its blast radius: exactly what the holder can take or destroy.

  CONTEXT. A test asserts, for one CALL, one DELEGATECALL and one STATICCALL path through your code,
  what `address(this)`, `msg.sender` and `msg.value` are and whose storage is written — predicted in
  a comment before the assertion, not derived from the failure.

  SURFACE. Events and custom errors an indexer and a frontend can still decode after v2. At least
  one event must have an indexed dynamic argument, and a comment stating what is unrecoverable
  because of that.
acceptance:
  command: forge test --match-path test/exit/Vault.t.sol
  criteria:
    - An inflation-attack test passes against a naive vault and fails against yours, with the defence named in a comment
    - An invariant campaign over deposits, withdrawals and donations never leaves the vault owing more than it holds
    - The vault stays solvent and its share accounting stays meaningful against a no-return-data token, a fee-on-transfer token and a downward-rebasing token
    - v2 adds a state variable behind the same proxy with state intact, and slot maps before and after are included
    - A v2-bad upgrade demonstrably bricks the contract, and a comment names the colliding slot from the map
    - Every privileged key is listed with the concrete assets or capabilities its holder can take
    - CALL, DELEGATECALL and STATICCALL paths each have their context predicted in a comment before the assertion that checks it
    - An indexed dynamic event argument is present with a comment stating what it makes unrecoverable
    - Custom errors and events from v1 still decode against the v2 ABI, proven by a test rather than by inspection
hints:
  - Write the naive vault first and break it. The inflation test is much easier to get right when you have watched it succeed, and you need it to fail on your real vault for the right reason rather than because the interface changed.
  - For the weird tokens, mock them rather than forking. You want a token that rebases exactly when you say it does; a real one will not cooperate with your test schedule.
  - v2-bad is the part people skip. Build it from the slot map deliberately — pick the collision first, then write the contract that has it — otherwise you will write a v2-bad that fails for some other reason and prove nothing.
writeUp: >
  Vyper removes several of the features this vault needed care with. Go through your contract and
  name each place where a Vyper constraint would have made the bug you defended against impossible
  to write — and each place where it would just have made the code worse.
