id: solidity-language-core-assignment-rules-gas
moduleId: solidity-language-core
grain: block
kind: measure
title: Make the four assignment rules visible in gas
concepts: [sol-assignment-copy-rules, sol-data-location, sol-calldata-immutable, sol-storage-pointer-hazard]
spec: >
  Write a contract with a storage array uint[] x and three external functions that each take the
  same input a different way: (uint[] memory a), (uint[] calldata a), and (uint[] calldata a) that
  reads only a[0]. Each of the first two assigns into x so the deep copy actually happens. Add a
  fourth function that takes a local uint[] storage pointer into x, reassigns the pointer, and
  writes through it, with assertions proving which of the two operations touched state. Drive all
  four from a Foundry test at input lengths 1, 10 and 100, capturing gas with vm.startSnapshotGas
  or gasleft() deltas, and assert the expected shape of each curve rather than a fixed number.
acceptance:
  command: forge test --junit --match-path test/AssignmentRules.t.sol
  criteria:
    - A test asserts the memory-parameter version's gas grows with input length while the read-only calldata version stays roughly flat
    - A test proves that assigning to a local storage pointer changes no state and that writing through it does
    - Each test name states which of the four assignment rules it exercises
hints:
  - Before running anything, write down for each line whether it copies or aliases. The prediction is the exercise; the gas is the check.
  - A read that is never used gets eliminated even with the optimizer off. Assign every read into a storage sink so it cannot be removed.
  - Compare (uint[] memory a) that stores a with (uint[] calldata a) that reads only a[0]. The first pays for the whole array twice; the second pays for one word.
difficulty: 2
