id: solidity-language-core-capstone-where-the-resemblance-breaks
moduleId: solidity-language-core
grain: module
writeUp: >
  Pick one contract you have read this week. For every reference-type variable in it, write down whether an assignment to that variable copies or aliases, and what would break if the compiler had chosen the other rule. Then say which of Solidity's four "looks like another language" resemblances misled you most, and what you will check first next time.
coversConcepts:
  - sol-value-type
  - sol-reference-type
  - sol-data-location
  - sol-assignment-copy-rules
  - sol-calldata-immutable
  - sol-storage-pointer-hazard
  - sol-state-var-visibility
  - sol-function-visibility
  - sol-visibility-not-privacy
  - sol-view-pure
  - sol-payable
  - sol-library-view-not-enforced
  - sol-modifier-placeholder
  - sol-modifier-order
  - sol-c3-linearisation
  - sol-constructor-order
  - sol-override-virtual
  - sol-interface-vs-abstract
kind: implement
title: Four places Solidity is not the language it looks like, in one contract
difficulty: 4
concepts: [sol-data-location, sol-assignment-copy-rules, sol-storage-pointer-hazard, sol-visibility-not-privacy, sol-view-pure, sol-modifier-placeholder, sol-modifier-order, sol-c3-linearisation, sol-constructor-order, sol-override-virtual, sol-interface-vs-abstract]
spec: >
  One contract, deliberately built so that each of this module's four traps is live in it and provable
  by test. Every prediction goes in a comment BEFORE the assertion that checks it — the exercise is
  predicting, not observing.

  DATA LOCATION. Include one assignment that copies and one that aliases, where the two lines look
  the same. A test shows mutating through one changes the original and the other does not. Then
  include a storage pointer that is dangling after the array it points into shrinks, and demonstrate
  what reading through it returns.

  VISIBILITY IS NOT PRIVACY. Give the contract a `private` state variable holding something that
  looks like a secret, and read it from outside the contract entirely. State in a comment which slot
  you read and how you knew it was that slot.

  VIEW AND PURE PROMISE LESS THAN YOU THINK. Write a `view` function that does something a reader
  would not expect a view function to be able to do, and a `pure` one likewise. Say precisely what
  each keyword does and does not enforce, and where the enforcement actually happens.

  MODIFIERS SPLICE. Write two modifiers whose order changes the outcome, and a third with the
  placeholder in a position that makes the function body run twice. Predict all three behaviours in
  comments first.

  THE DIAMOND. Build a four-contract inheritance diamond. Before running anything, write down in a
  comment the constructor order and the linearised override order the compiler will choose. Then
  assert both. Getting this wrong on the first attempt and leaving the wrong prediction visible, with
  a note on why you expected it, is worth more than getting it right.

  INTERFACE OR ABSTRACT. Finally, refactor one part of the contract to use an interface and one to use
  an abstract contract, and justify each choice in two sentences.
acceptance:
  command: forge test --junit --match-path test/capstone/LanguageCore.t.sol
  criteria:
    - Two visually similar assignments differ in copy-versus-alias behaviour, proven by mutating through one and not the other
    - A dangling storage pointer is demonstrated with what reading through it returns
    - A private state variable is read from outside the contract, with the slot and the derivation named in a comment
    - A view and a pure function each do something the keyword does not prevent, with the actual enforcement point stated
    - Two modifiers whose order changes the outcome, and one whose placeholder position runs the body twice
    - Every behavioural claim has a prediction in a comment placed above the assertion that checks it
    - Constructor order and C3 linearised override order for a four-contract diamond are predicted before being asserted
    - One refactor to an interface and one to an abstract contract, each justified in two sentences
hints:
  - Write the diamond last but predict it first. If you build it before committing to a prediction you will read the answer off the compiler and learn nothing from the exercise.
  - For the private variable, you do not need assembly on the reading side. The slot is computable from the declaration order you wrote yourself, which is the point.
  - The double-run modifier is the one people think is a bug in their test. Put the placeholder in a loop and watch what the compiler does with the body.
