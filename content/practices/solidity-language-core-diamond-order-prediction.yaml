id: solidity-language-core-diamond-order-prediction
moduleId: solidity-language-core
grain: block
kind: implement
title: Predict a diamond's constructor and override order before running it
concepts: [sol-c3-linearisation, sol-constructor-order, sol-override-virtual, sol-modifier-order]
spec: >
  Build four contracts — X, A is X, B is X, C is A, B — where every constructor emits an event
  naming itself and every contract overrides foo() to emit and then call super.foo(). Before
  running, write your predicted constructor emission order and your predicted foo() resolution
  order into a comment at the top of the test file. Then assert both orders in a Foundry test using
  vm.recordLogs. Add a second test proving that declaring contract C is B, A produces a different
  answer, and a compile-failure note showing that contract C is A, X cannot be linearised.
acceptance:
  command: forge test --junit --match-path test/Diamond.t.sol
  criteria:
    - A test asserts the exact constructor emission order and it matches the prediction recorded in the file
    - A test asserts the full super.foo() chain order for both C is A, B and C is B, A
    - A comment records why contract C is A, X fails to compile, in terms of linearisation
hints:
  - Solidity lists bases most base-like first. That is the reverse of Python, so your MRO intuition is probably backwards.
  - Constructors run in linearised order regardless of the order you supply their arguments. Supply them in the wrong order on purpose and prove the emission order does not change.
  - super in a diamond does not mean the direct parent. It means the next contract in the linearisation, which for A can be B.
difficulty: 3
