id: solidity-openzeppelin-capstone-the-boundary
moduleId: solidity-openzeppelin
grain: module
writeUp: >
  Generate a contract in the Contracts Wizard with pausing, roles and upgradeability turned on. For every privileged function it produced, name the address type that will hold it and what happens if that key is lost or compromised. Then delete every option you could not justify, and say what you gave up.
