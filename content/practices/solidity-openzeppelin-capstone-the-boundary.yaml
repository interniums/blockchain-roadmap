kind: read
title: Find the line where the library stops and you are responsible
difficulty: 4
concepts: [oz-is-the-stdlib, oz-not-a-framework, oz-v5-line, oz-v4-differences, oz-custom-errors, oz-draft-contracts, oz-upgradeable-package, oz-stateless-not-transpiled, oz-storage-gaps, oz-namespaced-storage, oz-upgrade-unsafe-across-majors, oz-nonprovision, oz-audit-is-not-your-audit]
spec: >
  Take a real contract that uses OpenZeppelin — one you did not write — and produce an audit of its
  relationship with the library. Not of its business logic: of the boundary.

  THE PROMISE MAP. For every OpenZeppelin file the contract imports, transitively, say whether that
  file carries a stability promise or does not. List the drafts and unaudited paths separately, and
  say what depending on each one means for this contract.

  THE VERSION DELTA. The contract was probably written against a 4.x mental model. Find at least three
  places where 5.x behaves differently from what 4.x-era tutorials teach, and for each say whether
  this contract is affected. Custom errors replacing revert strings is one; find two more that are
  not that.

  THE PORT. Port the contract to 5.7.0 if it is not already there, and prove nothing changed silently:
  a test asserting the same behaviour before and after for at least four functions, including one
  failure path whose revert data changed shape.

  THE UPGRADEABLE TRAP. If the contract is upgradeable, examine its storage handling: gaps, or
  namespaced storage, or neither. Draw the slot layout and say what a major-version bump would do to
  it. If the contract is not upgradeable, make it so, and then demonstrate the corruption a
  cross-major upgrade causes — deliberately, with the colliding slot named.

  THE NON-PROVISION. Finally, the part that is the module's whole point: list every decision the
  library did not make for this contract. Who holds which key, what is pausable and by whom, which
  token behaviours are tolerated, what happens on upgrade. For each, say whether the contract's
  authors made the decision or inherited a default without noticing.

  Close with one sentence on why the library's audit says nothing about this contract.
acceptance:
  criteria:
    - Every transitively imported OpenZeppelin file is classified as carrying a stability promise or not, with drafts and unaudited paths listed separately
    - Three 5.x-versus-4.x behavioural differences are identified, at least two of which are not the custom-errors change, each with a verdict on whether this contract is affected
    - A port to 5.7.0 is proven behaviour-preserving for at least four functions by test
    - One failure path whose revert data changed shape is identified and its new shape shown
    - Storage handling is drawn as a slot layout, with the effect of a major-version bump stated
    - A cross-major upgrade corruption is demonstrated with the colliding slot named
    - Every decision the library did not make is listed, each attributed to a deliberate choice by the authors or an unnoticed default
    - One sentence explains why the library's audit says nothing about this contract
hints:
  - Get the transitive import list mechanically rather than by reading. The interesting files are three levels down, and those are the ones with the draft status nobody checked.
  - For the version delta, do not go looking in the changelog first. Read the contract, guess what it assumes, then check — you will find assumptions the changelog does not flag because they were never documented as behaviour.
  - The non-provision list is the deliverable that matters. Every item on it is a decision someone has to own, and the useful finding is which ones nobody has.
