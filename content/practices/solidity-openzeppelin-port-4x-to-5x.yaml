id: solidity-openzeppelin-port-4x-to-5x
moduleId: solidity-openzeppelin
kind: fix
title: Port a 4.x-era contract to 5.7.0 and prove nothing silently changed
concepts: [oz-v4-differences, oz-custom-errors, oz-v5-line, oz-upgradeable-package, oz-stateless-not-transpiled]
spec: >
  Take a contract written against OpenZeppelin 4.x — Ownable with an implicit owner, Counters, an
  ERC-20 with _beforeTokenTransfer, and a call to increaseAllowance — and port it to 5.7.0. Every
  removal has a different replacement and one of them has none. Rewrite the tests so they assert
  custom-error selectors rather than revert strings. If the contract has an upgradeable variant,
  fix the imports so stateless contracts come from the main package.
acceptance:
  command: forge test --junit --match-path test/OzPort.t.sol
  criteria:
    - The project compiles against openzeppelin-contracts v5.7.0 with no deprecated or removed imports
    - Tests assert OwnableUnauthorizedAccount and at least one other 5.x custom error by selector, not by string
    - A comment records, for each removed 4.x API, what replaced it and where the behaviour is not equivalent
hints:
  - Ownable's constructor takes initialOwner in 5.x. Passing msg.sender explicitly is a decision, not a formality — write down why you chose it.
  - _beforeTokenTransfer and _afterTokenTransfer collapsed into one _update. Check the ordering of your hook logic relative to the balance change.
  - increaseAllowance has no replacement in ERC20. It survives only in SafeERC20, and the reason it was removed is worth writing down.
difficulty: 2
