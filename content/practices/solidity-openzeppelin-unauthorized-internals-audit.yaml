id: solidity-openzeppelin-unauthorized-internals-audit
moduleId: solidity-openzeppelin
grain: block
kind: read
title: Find every place OpenZeppelin expects you to add the authorization
concepts: [oz-safe-defaults, oz-nonprovision, oz-audit-is-not-your-audit, oz-wizard, pausability]
spec: >
  Install openzeppelin-contracts v5.7.0 and read access/Ownable.sol, utils/Pausable.sol,
  proxy/Clones.sol and token/ERC20/ERC20.sol end to end. Produce a list of every internal function
  that performs a privileged state change with no authorization of its own, and for each, the
  authorization you would add. Encode the list as a test: for each entry, write a test that deploys
  a contract exposing that internal function without a guard and proves an arbitrary caller can
  reach it.
acceptance:
  command: forge test --junit --match-path test/UnguardedInternals.t.sol
  criteria:
    - The list names at least _pause, _unpause, _mint and the clone initializer, each with the guard you would add
    - Each entry has a test proving an unprivileged address can invoke it when it is exposed without a guard
    - A written note explains why upgradeable variants use __X_init instead of a constructor, in terms of what a proxy does and does not run
hints:
  - Grep for `internal` in each file and ask, for each hit, who the library thinks is allowed to call it. The answer is always you.
  - Pausable is the sharpest example — the module name promises a feature and ships you two thirds of one.
  - The constructor question answers itself once you remember that a proxy's storage is written by delegatecalled code and a constructor never runs in the proxy's context.
difficulty: 2
