id: solidity-openzeppelin-where-it-is-going
moduleId: solidity-openzeppelin
grain: block
kind: read
title: Read the library's newest modules and decide whether to depend on them yet
difficulty: 3
concepts: [oz-account-abstraction-modules, oz-crosschain-modules]
spec: >
  The library is growing into two areas that did not exist in its 4.x line, and both are places where a
  stability promise matters more than usual.

  Read the account-abstraction modules and the crosschain modules in the current release. For each area,
  answer four questions from the source rather than the docs.

  What does it actually provide — the concrete contracts and what they are responsible for. What does it
  deliberately not provide, so that you would still be writing it yourself. Which files in it carry a
  stability promise and which are draft or unaudited. And what would a major-version bump plausibly change
  about your integration.

  Then build the smallest thing that uses one module from each area — an account with one validation rule,
  and one crosschain message send — and record what you had to write yourself that you expected the library
  to cover.

  Close with a recommendation for each area: depend on it now, wrap it behind your own interface, or wait.
  Each recommendation states the condition that would change it.
acceptance:
  criteria:
    - Both module areas are covered with what they provide and what they deliberately do not, sourced from the code
    - Every file used is classified as carrying a stability promise, draft, or unaudited
    - What a major-version bump would plausibly change about the integration is stated per area
    - A minimal account with one validation rule is built using the library
    - A minimal crosschain message send is built using the library
    - What had to be written by hand despite the expectation is recorded
    - A recommendation per area with the condition that would change it
hints:
  - Check the draft status of every file you import, transitively. These are the newest parts of the library and the proportion of draft code in them is much higher than elsewhere.
  - The gap between what you expected and what you had to write is the deliverable. Note it as you go rather than reconstructing it afterwards.
  - A recommendation to wait is a real answer here, provided you name what you are waiting for.
