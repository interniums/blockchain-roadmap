id: solidity-proxies-upgrades-slot-zero-collision-and-fix
moduleId: solidity-proxies-upgrades
grain: block
kind: break
title: Take control of a proxy through a normal-looking setter
concepts: [delegatecall-proxy, storage-collision, erc-1967-slots]
spec: >
  Build a proxy that keeps its implementation address and its admin address as ordinary declared
  state variables, and an implementation whose first two state variables are an unrelated uint256
  and an unrelated address. Through the proxy, call an ordinary setter on the implementation and
  take over the proxy — first repointing the implementation, then, in a second scenario, becoming
  the admin. Fix by moving both proxy variables to their EIP-1967 slots with inline assembly, and
  re-run both attacks.
acceptance:
  command: forge test --junit --match-path test/ProxyCollision.t.sol
  criteria:
    - A test proves an attacker-chosen address ends up in the proxy's implementation position after calling an innocuous implementation function
    - A second test proves the admin position can be captured the same way
    - Both tests fail to corrupt anything against the EIP-1967 version, verified by reading the two standard slots with vm.load
hints:
  - Write both slot maps side by side before writing any test. The bug is visible on paper.
  - The implementation's setter is not malicious and does not need to be. Any write to its first variable is enough.
  - The EIP-1967 slots are keccak256 of a namespaced string minus one. Reading them back with vm.load is how you prove the fix, not how you hope it worked.
difficulty: 3
