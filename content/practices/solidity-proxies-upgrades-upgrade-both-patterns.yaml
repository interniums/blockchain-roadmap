id: solidity-proxies-upgrades-upgrade-both-patterns
moduleId: solidity-proxies-upgrades
kind: implement
title: Upgrade a transparent proxy and a UUPS proxy, then brick one on purpose
concepts: [transparent-proxy, uups-proxy, uups-bricking-risk, erc-7201-namespaced-storage, layout-migration-hazard]
spec: >
  Write a minimal transparent proxy and a minimal UUPS proxy over the same logic contract. Upgrade
  each once to a V2 that adds a state variable, and prove that state written before the upgrade
  survives it. Then, on the UUPS one, deliberately upgrade to a V3 that omits the upgrade function
  and prove that no further upgrade is possible from any caller. Finally, add a variant where V2
  moves its state into an ERC-7201 namespace while V1 used sequential slots, and show what the old
  bytes look like when read under the new layout.
acceptance:
  command: forge test --junit --match-path test/ProxyUpgrade.t.sol
  criteria:
    - Tests prove pre-upgrade state is readable after upgrade on both the transparent and the UUPS proxy
    - A test proves that after upgrading the UUPS proxy to an implementation with no upgrade function, every upgrade attempt reverts, including from the admin
    - A test reads a variable after the sequential-to-namespaced migration and asserts it does not equal what it held before, with a comment identifying which slot collided
hints:
  - Put the same state variable in V1 and V2 at the same position first, and only then start moving things. You want one variable at a time changing.
  - For the bricking test, assert on the admin's call too. If only the non-admin path reverts you have proved the wrong thing.
  - For the layout migration, look at the first word of the namespace against the value the old layout left there. A leftover 0x01 in a slot the new layout reads as a string is exactly the documented deadlock.
difficulty: 4
