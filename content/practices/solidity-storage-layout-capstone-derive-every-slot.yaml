id: solidity-storage-layout-capstone-derive-every-slot
moduleId: solidity-storage-layout
grain: module
writeUp: >
  Take a contract you would ship. Draw its slot map by hand, then reorder the declarations to use the fewest slots. Now argue the other side: name a realistic access pattern under which your packed layout costs more gas than the unpacked one, and say which layout you would actually choose and why.
coversConcepts:
  - storage-slot
  - slot-packing
  - packing-order-matters
  - struct-array-new-slot
  - mapping-slot-derivation
  - dynamic-array-layout
  - no-in-between-storage
  - transient-storage-layout
kind: implement
title: Derive every slot in a live contract by hand, then price the layout
difficulty: 4
concepts: [storage-slot, slot-packing, packing-order-matters, struct-array-new-slot, mapping-slot-derivation, dynamic-array-layout, no-in-between-storage, transient-storage-layout]
spec: >
  Take a deployed mainnet contract with at least twelve state variables including a mapping, a
  dynamic array, a struct and a packed group. Produce a complete slot map, derived by hand and then
  proved against the chain.

  THE MAP. For every state variable: slot number, byte offset within the slot, and width. Include the
  packed group and show which variables share a slot and why the one after them does not. State the
  rule that ends a slot.

  PROVE IT. For each entry, read the value from the live chain at the slot and offset you computed and
  assert it matches what the contract's own getter returns. A getter that does not exist is not an
  excuse — read the slot and decode it.

  THE DERIVED ONES. Compute, by hand, the slot of one mapping entry and one dynamic array element,
  including a nested mapping and an array inside a struct. Show the hash inputs for each. Then prove
  each against the chain.

  THE GAP. Find a place in the layout where the compiler left part of a slot unused, and say what
  declaration change would have filled it. Then show — measured, not asserted — what that change
  would have saved on a function that writes those variables together.

  REORDER IT. Produce a reordered version of the same declarations that is strictly cheaper for one
  named operation and strictly more expensive for another. Report both numbers. If you cannot make
  something worse, you have not found a real trade.

  TRANSIENT. Finally, add a transient variable and show that its layout is a separate address space:
  same slot number, different value, and gone at the end of the transaction.
acceptance:
  command: forge test --junit --match-path test/capstone/StorageLayout.t.sol
  criteria:
    - Every state variable of a real deployed contract has a slot, byte offset and width, derived by hand
    - The rule that ends a packed slot is stated and demonstrated on the contract's own layout
    - Each map entry is verified by reading the live chain at the computed slot and offset
    - A mapping entry, a nested mapping entry and a dynamic array element are each derived by hand with their hash inputs shown, then proven against the chain
    - An unused portion of a slot is identified with the declaration change that would fill it
    - The saving from that change is measured on a function that writes the variables together
    - A reordered layout is strictly cheaper for one named operation and strictly more expensive for another, with both numbers reported
    - A transient variable is shown to occupy a separate address space from storage at the same slot number, and to be gone after the transaction
hints:
  - Pick the contract before you commit to it — you want twelve variables including the awkward ones, and a lot of well-known contracts are simpler than they look.
  - Derive the mapping slot on paper with the actual bytes written out. Getting the padding and the concatenation order right is the whole difficulty, and a tool will hide it from you.
  - For the reorder, the operation you make worse is usually a single-variable write that used to be alone in its slot. That is the trade, and naming it is the finding.
