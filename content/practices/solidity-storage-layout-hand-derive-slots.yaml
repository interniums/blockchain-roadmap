id: solidity-storage-layout-hand-derive-slots
moduleId: solidity-storage-layout
kind: implement
title: Compute a mapping and array slot by hand, then prove it on chain
concepts: [storage-slot, mapping-slot-derivation, dynamic-array-layout, no-in-between-storage]
spec: >
  Take a contract with a packed pair of small variables, a mapping(address => uint256), a
  mapping(address => mapping(uint256 => uint256)), a dynamic uint256 array and a string that is
  longer than 31 bytes. Compute by hand, on paper, the slot holding each of: the second packed
  variable, myMapping[addr], nested[addr][7], the array's length, the array's third element, and
  the string's first data word. Then write a Foundry test that reads each of those slots with
  vm.load and asserts the value equals what the getter returns, and confirm the same slots from a
  running node with cast storage.
acceptance:
  command: forge test --junit --match-path test/SlotDerivation.t.sol
  criteria:
    - Every hand-computed slot is written as a literal constant in the test and asserted against vm.load
    - The nested mapping case derives the inner slot from the outer derived slot, not from the declared slot
    - A test asserts the mapping's own declared slot reads as zero
hints:
  - The mapping value lives at keccak256 of the key padded to 32 bytes concatenated with the slot number padded to 32 bytes. Order matters.
  - For the nested mapping, apply the rule twice — the result of the first derivation becomes the slot input to the second.
  - A string of 32 bytes or more stores its length in the declared slot and its data from keccak256(slot). Check the low bit of the declared slot to see which encoding you are in.
difficulty: 3
