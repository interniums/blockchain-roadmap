id: solidity-storage-layout-packing-gas-measurement
moduleId: solidity-storage-layout
kind: measure
title: Prove declaration order changes what the contract costs
concepts: [slot-packing, packing-order-matters, struct-array-new-slot]
spec: >
  Deploy two contracts holding identical fields — a uint128, a uint128 and a uint256 — declared in
  two different orders, plus a third variant that inserts a struct between two small fields. For
  each, produce a slot map from forge inspect storage-layout and measure deployment gas and the gas
  of writing all three fields in one transaction and of writing only one field. Then find and
  document an access pattern under which the packed layout is more expensive than the unpacked one.
acceptance:
  command: forge test --junit --match-path test/PackingGas.t.sol
  criteria:
    - A test asserts the two orderings occupy a different number of slots, using values taken from forge inspect storage-layout
    - Measured write-all and write-one gas is recorded for every variant with the environment (solc version, optimizer setting) stated
    - A test demonstrates at least one access pattern where the packed layout costs more, and the file explains why in terms of masking
hints:
  - Run forge inspect <Contract> storage-layout first. Getting the slot count right on paper before you look is the point.
  - Writing one field of a shared slot is a read-modify-write of the whole word, not a write of the field.
  - A struct always starts a new slot, so moving one small variable across a struct boundary can change the whole map.
difficulty: 2
