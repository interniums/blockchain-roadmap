title: Take the second depositor's money out of an empty vault
concepts: [erc-4626-vault, shares-vs-assets, rounding-direction, donation-attack, inflation-first-depositor-attack, virtual-shares-offset]
spec: >
  Implement a naive ERC-4626 vault that computes shares from balanceOf(address(this)) with no
  virtual offset. Run the full first-depositor attack against it: the attacker deposits 1 wei,
  donates a large amount directly to the vault address with a plain transfer, the victim deposits,
  and the attacker redeems. Then add virtual shares and a decimal offset and re-run the identical
  attack, quantifying the attacker's residual profit as a function of the offset. Finally write an
  invariant test asserting no participant can extract more than they put in plus their share of
  yield, and show it fails against the naive version.
acceptance:
  command: forge test --junit --match-path test/VaultInflation.t.sol
  criteria:
    - A test asserts the victim receives zero shares and the attacker withdraws more than they deposited
    - The same attack against the virtual-offset vault leaves the attacker no better off, with the residual quantified in the assertion
    - An invariant test passes on the fixed vault and produces a counterexample against the naive one
hints:
  - The donation is not a deposit. Use a plain ERC-20 transfer straight to the vault address so no shares are minted.
  - The victim's share count is deposit times totalSupply divided by totalAssets. Work out on paper when that rounds to zero before writing the test.
  - When you add the offset, vary it and plot the residual. The offset is a dial on how much an attacker can still take, not an on-off switch.
difficulty: 4
