id: solidity-token-standards-inflation-attack-and-fix
moduleId: solidity-token-standards
grain: module
writeUp: >
  Pick five tokens you would list in a product and classify each against the weird-ERC-20 taxonomy, citing on-chain source rather than a blog post. Then write the integration rule your codebase will follow — measured balance deltas, SafeERC20, share accounting — and say what you will do about the token that breaks the rule you just wrote.
