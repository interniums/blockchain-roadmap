id: solidity-token-standards-safemint-reentrancy-cap
moduleId: solidity-token-standards
kind: break
title: Mint past a per-wallet cap through the receiver callback
concepts: [erc721-safe-transfer-callback, erc721-callback-reentrancy, token-callbacks-are-the-vector, cei-order]
spec: >
  Write an ERC-721 with a per-wallet mint cap enforced by require(minted[msg.sender] < CAP), where
  the counter is incremented after _safeMint. Write an attacker contract whose onERC721Received
  calls mint again. Prove the attacker ends up holding more tokens than the cap allows. Then fix it
  twice, independently: once by moving the counter increment before the mint, and once by adding a
  reentrancy guard, and prove each fix alone reduces the attacker to exactly the cap.
acceptance:
  command: forge test --junit --match-path test/SafeMintReentrancy.t.sol
  criteria:
    - A test asserts balanceOf(attacker) is strictly greater than CAP against the vulnerable contract
    - A test asserts balanceOf(attacker) equals CAP against the CEI-ordered contract with no guard
    - A separate test asserts the same against the guarded contract with the original ordering restored
hints:
  - The check really is first. Look at where the effect is instead.
  - Your attacker's onERC721Received must return the magic selector or the mint reverts before you get to recurse.
  - Bound the recursion depth in the attacker or the test will run out of gas before it proves anything.
difficulty: 3
