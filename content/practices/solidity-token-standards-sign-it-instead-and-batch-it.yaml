id: solidity-token-standards-sign-it-instead-and-batch-it
moduleId: solidity-token-standards
grain: block
kind: implement
title: Approve by signature, then move ten ids in one call
difficulty: 3
concepts: [erc2612-permit, permit2, erc1155-semantics, erc1155-batch-atomicity, erc1155-callback]
spec: >
  Two ways to reduce the transaction count, and the failure each one introduces.

  PERMIT. Implement a flow that takes a signed allowance instead of an approval transaction. Show the
  signature verifying and the allowance appearing without the owner having sent anything. Then break it
  twice: replay the same signature and show it rejected, and alter one field of the signed data and show
  it rejected. Name the mechanism that stops each.

  Then find the practical gap: state what happens when the token does not implement permit, and name the
  intermediary approach that covers that case and what it requires the user to trust.

  BATCHES. Implement a multi-id transfer moving ten different token ids in one call. Then demonstrate the
  property people assume and should check: make one id in the batch fail and show whether the others
  applied. State the rule, and say what a caller must do if the answer is not what they wanted.

  THE HOOK. Give a receiver a callback and use it to reject a specific id mid-batch. Then use the same
  callback to re-enter the sender. Show what the sender's state looks like at that moment, and state what
  ordering would have made the re-entry harmless.
acceptance:
  command: forge test --junit --match-path test/PermitAndBatch.t.sol
  criteria:
    - A signed allowance produces an allowance with no transaction from the owner
    - Replaying the signature is rejected, and altering one signed field is rejected, with the mechanism named for each
    - What happens on a token without permit is stated, with the intermediary approach and what it asks the user to trust
    - Ten token ids move in one call
    - One id in a batch is made to fail, with whether the others applied shown and the rule stated
    - What a caller must do if the atomicity rule is not what they wanted
    - A receiver callback rejects a specific id mid-batch
    - The callback re-enters the sender, with the sender's state at that moment shown and the safe ordering stated
hints:
  - Get the typed-data hash right before anything else. A permit that will not verify is almost always a domain separator or a field ordering problem, not a signature problem.
  - For batch atomicity, do not assume from the name. Make one transfer in the middle revert and read the resulting balances.
  - The re-entrancy through the receiver hook is the same bug as any other re-entrancy, and saying so in the write-up is worth more than the exploit itself.
