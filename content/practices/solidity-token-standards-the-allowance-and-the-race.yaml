id: solidity-token-standards-the-allowance-and-the-race
moduleId: solidity-token-standards
grain: block
kind: break
title: Run the approve race, then decide honestly whether it matters
difficulty: 3
concepts: [erc20-is-a-ledger, erc20-allowance-model, erc20-approve-race, erc20-approve-race-mitigations, erc20-approve-race-is-overrated]
spec: >
  A token is a mapping in someone else's contract, and an allowance is a second mapping that a great deal
  of received wisdom is built on. Test the wisdom.

  THE LEDGER. Demonstrate that your balance is a row in a contract you do not control: change a token's
  balance mapping directly in a test and show the "your" balance follow. State what that means for any
  code treating a token balance as an asset it holds.

  THE RACE. Execute it. Set an allowance, then have the spender front-run a change to that allowance and
  extract both the old and the new amount. Report the total taken and show it exceeding either individual
  approval.

  THE MITIGATIONS. Implement two: approve-to-zero-first, and an increase/decrease pair. For each, show it
  preventing your attack, and then state what it costs — in transactions, in gas, and in what happens if
  the first of two transactions lands and the second does not.

  THE HONEST CONCLUSION. Now argue against the exercise. The race requires the spender to already be
  approved and hostile. State what an already-approved hostile spender can do anyway without the race, and
  then answer the question this module actually asks: is the approve race where the money goes? Support the
  answer with what the alternative failure would cost.
acceptance:
  command: forge test --junit --match-path test/ApproveRace.t.sol
  criteria:
    - A token balance is changed by writing the token's mapping directly, with the consequence for treating a balance as a held asset stated
    - The approve race is executed with the total extracted exceeding either individual approval
    - Approve-to-zero-first and increase/decrease are both implemented and shown preventing the attack
    - Each mitigation's cost is stated in transactions, gas, and the partial-failure case
    - What an already-approved hostile spender can do without the race is stated
    - A supported answer to whether the approve race is where the money goes
hints:
  - Do the direct mapping write first. It reframes everything after it, because once you have seen the balance move you stop thinking of the token as yours.
  - The race needs the spender to be watching the mempool. Simulate that explicitly rather than hand-ordering the transactions, or the demonstration hides the precondition.
  - For the conclusion, compare against a plain unlimited approval to a contract that later turns hostile. That is the failure that actually loses money, and the comparison is the point.
