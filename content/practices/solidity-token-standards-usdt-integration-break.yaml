id: solidity-token-standards-usdt-integration-break
moduleId: solidity-token-standards
grain: block
kind: break
title: Break a vault on USDT, then on a fee-on-transfer token
concepts: [erc20-missing-return, safe-erc20, fee-on-transfer-tokens, balance-delta-pattern, weird-erc20-taxonomy]
spec: >
  On a mainnet fork, write a vault that moves tokens with the plain IERC20 interface and deposit
  USDT into it. Prove the call reverts, and prove that swapping in SafeERC20 makes the identical
  test pass. Then, locally, implement a 2 percent fee-on-transfer mock from the weird-erc20
  catalogue, have three users deposit into a vault that credits the requested amount, and have them
  withdraw in sequence. Prove the last withdrawal fails for insufficient balance, and prove the
  balance-delta version does not.
acceptance:
  command: forge test --junit --match-path test/WeirdTokens.t.sol
  criteria:
    - A forked test asserts the plain IERC20 transfer against USDT reverts and the SafeERC20 version succeeds
    - A test proves the naive vault becomes insolvent after three fee-on-transfer deposits and that the last withdrawal reverts
    - The balance-delta vault passes the same three-user sequence with every user able to withdraw what they are owed
hints:
  - USDT's transfer returns no data at all. A call typed to return bool decodes nothing and reverts; that is the whole bug.
  - Read SafeERC20.sol before you use it. It distinguishes three cases — empty returndata, decoded false, and no code at the address — and each matters.
  - For fee-on-transfer, credit balanceOf(address(this)) after minus before. The boolean says the transfer happened, not how much arrived.
difficulty: 3
