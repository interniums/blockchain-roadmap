id: solidity-vyper-nonreentrant-slot-regression
moduleId: solidity-vyper
kind: break
title: Reproduce the compiler bug that broke a reentrancy guard
concepts: [vyper-compiler-was-the-bug, compiler-is-part-of-tcb, vyper-audit-policy]
spec: >
  In an isolated virtual environment, install Vyper 0.3.0 and compile a contract with two
  @nonreentrant functions. Inspect the emitted storage layout and identify the slot each lock was
  assigned. Compile the identical source with a current 0.4.x release and compare. Then write a
  test demonstrating that under the 0.3.0 bytecode a call can re-enter the second function while
  the first holds its lock, and that under the current bytecode it cannot. Record the affected
  version range and where a version pin for it would live in a real repository.
acceptance:
  command: forge test --junit --match-path test/VyperLockRegression.t.sol
  criteria:
    - The storage layout output from both compilers is captured in the repository and the differing lock slots are identified by number
    - A test proves cross-function re-entry succeeds against the 0.3.0 bytecode and reverts against the current one
    - A written note names the affected version range and states the mechanism without quoting a loss figure
hints:
  - Use vyper -f layout to get the storage layout out of the compiler rather than inferring it from the bytecode.
  - The source is identical in both compilations. If you find yourself editing it to make the attack work, you have left the exercise.
  - Reported loss totals for this incident disagree across sources and a large fraction was returned. Describe the mechanism; do not publish a number.
difficulty: 4
