id: solidity-vyper-same-token-two-languages
moduleId: solidity-vyper
kind: implement
title: Write the same token twice and drive both through one ABI
concepts: [vyper-python-syntax, vyper-explicit-visibility, vyper-no-inheritance, vyper-bounded-types, vyper-ecosystem-cost]
spec: >
  Implement the same ERC-20 twice: once in Vyper against the version you pin, and once in Solidity
  0.8.36 using OpenZeppelin. Drive both from one Foundry test suite through the ABI, so the same
  tests run against both deployments. Record deployed bytecode size for each. Then write down, for
  the Solidity version, every behaviour that comes from an inherited function or a modifier you
  cannot see from the function body, and what the Vyper version writes inline instead.
acceptance:
  command: forge test --junit --match-path test/TwoLanguageToken.t.sol
  criteria:
    - One test contract runs the same assertions against both deployments, addressed only through the shared ABI
    - Deployed bytecode size is recorded for both, with the exact compiler versions named
    - A written list names at least three behaviours the Solidity version inherits and where the Vyper version states them inline
hints:
  - Pin the Vyper version explicitly and record it. Which version you are on is part of the exercise, not a detail.
  - Vyper's dynamic types carry a maximum in the type. Deciding String[32] versus String[64] for the token name is a real decision the Solidity version never made explicitly.
  - Use vm.deployCode or a precompiled artifact to get the Vyper contract into the Foundry test; the ABI is identical, so nothing else changes.
difficulty: 3
