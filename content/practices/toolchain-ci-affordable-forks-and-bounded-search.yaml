id: toolchain-ci-affordable-forks-and-bounded-search
moduleId: toolchain-ci
grain: block
kind: implement
title: Make forked tests and a fuzz campaign both affordable and non-flaky in CI
difficulty: 3
concepts: [fork-cache, fuzz-seed-in-ci, fork-pr-secrets, campaign-tiering, corpus-persistence, flaky-gate-hazard, junit-machine-output]
spec: >
  Two expensive kinds of test, both of which teams disable rather than fix. Fix them.

  FORKS. Get a forked suite running in CI with a restored cache. Report the wall-clock cold and warm, and
  the RPC request count for each. Then handle the case that blocks most teams: a pull request from a fork
  of the repository cannot see the RPC secret. Say what your pipeline does — skip, use a public endpoint,
  or run against a recorded fixture — and what each option costs in coverage.

  THE CAMPAIGN. Build two tiers: a bounded gate that runs on every push and a longer campaign that runs on
  a schedule. State the time budget for each and how you chose it. Persist the corpus between runs and
  show a later run reaching a state an earlier one found — that is what persistence buys, and without
  showing it you have only added storage.

  NOT FLAKY. Then the property that decides whether anyone keeps the gate: run the gate ten times on
  unchanged code and show zero failures. If it flakes, find out whether the cause is an unpinned seed, a
  fork-state dependency, or a real intermittent bug — all three are common and they are fixed differently.

  MACHINE OUTPUT. Emit results in a machine-readable form and show something consuming it, so a failure
  names the test rather than requiring someone to read a log.
acceptance:
  criteria:
    - A forked suite runs in CI with a restored cache, with cold and warm wall-clock and RPC counts reported
    - The pull-request-without-secrets case is handled with the chosen option and its coverage cost stated
    - A bounded gate and a scheduled campaign both exist with stated time budgets and the reasoning for each
    - Corpus persistence is shown letting a later run reach a state an earlier run found
    - The gate runs ten times on unchanged code with zero failures
    - Any flake is diagnosed as an unpinned seed, a fork-state dependency, or a real intermittent bug
    - Results are emitted machine-readably and consumed so failures name the test
hints:
  - Solve the secrets problem before the caching one. If pull requests cannot run the suite at all, a faster suite helps nobody.
  - Demonstrating corpus persistence needs a target with a state that is genuinely hard to reach. A shallow one will be found in both runs and prove nothing.
  - Run the gate ten times before you believe it. Flakiness at one run in ten is invisible in a single green build and fatal to trust in the gate.
