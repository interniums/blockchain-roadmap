id: toolchain-ci-false-positive-gate
moduleId: toolchain-ci
grain: block
kind: break
title: Make a gas gate go red without changing any production code
concepts: [snapshot-check-gate, gas-diff-comment, gas-report-is-test-shaped, coverage-is-not-correctness]
spec: >
  Set up `forge snapshot --check` as a gate over a repository. Now add a single new test that
  exercises an existing function on a cheap path, changing no production code at all, and show the
  gate failing. Explain precisely why. Then implement the fix that keeps the signal without the false
  positive: move gas measurement into a small frozen suite under `test/gas/` whose contents change
  only deliberately, pin its fuzz seed, and gate on that file alone while the functional suite is
  free to churn. Prove the new arrangement by adding another functional test and showing the frozen
  numbers do not move. As a coda, add a test that executes every line of a contract and asserts
  nothing, and report the coverage number it produces.
acceptance:
  command: forge test --junit --match-path test/gas/Frozen.t.sol
  criteria:
    - The frozen gas suite passes with its recorded numbers before and after an unrelated functional test is added
    - A written explanation states why the original gate failed on a change with no production effect
    - The frozen suite pins a fuzz seed, or contains no fuzz tests at all, and says which
    - The assertion-free coverage test is reported with its coverage percentage, as evidence that coverage measures execution rather than checking
hints:
  - Snapshot lines are keyed by test name and the numbers aggregate the calls made. Ask what adding a test does to both.
  - The fix is not to loosen the gate; it is to gate on something that only changes when you mean it to.
  - A test that calls everything and asserts nothing is a legitimate program. Run coverage on it and read the number without flinching.
difficulty: 3
