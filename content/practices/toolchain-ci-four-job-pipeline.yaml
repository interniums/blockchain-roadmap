id: toolchain-ci-four-job-pipeline
moduleId: toolchain-ci
kind: implement
title: Build a pipeline whose cheap jobs fail first
concepts: [ci-pipeline-shape, submodule-checkout, format-and-lint-gates, foundry-version-pinning, action-supply-chain]
spec: >
  Write a `.github/workflows/ci.yml` with four jobs: format and lint, build and test, gas snapshot,
  and coverage. Make the cheap jobs gate the expensive ones so a pull request with a formatting error
  fails in under a minute without compiling the test suite. Check out with submodules, install an
  exact pinned Foundry version rather than a channel, and pin every third-party action to a full
  commit SHA. Then encode those properties as assertions: write a Solidity test that reads the
  workflow file and foundry.toml with `vm.readFile` and asserts them, so the pipeline's own
  invariants are covered by the same harness as everything else. You will need `fs_permissions`
  entries for both files.
acceptance:
  command: forge test --junit --match-path test/CiContract.t.sol
  criteria:
    - A test asserts the workflow contains no action reference pinned by a moving tag, only forty-character commit SHAs
    - A test asserts the Foundry install step names an exact version string rather than a channel name
    - A test asserts the checkout step requests submodules and that foundry.toml defines a ci profile
    - The workflow is demonstrated failing in under sixty seconds on a formatting-only error, without the test job having run
hints:
  - Order the jobs with an explicit dependency so the expensive one does not start until the cheap one has passed.
  - "`vm.readFile` returns the file as a string, and forge-std gives you string search helpers; a full commit SHA has a fixed length you can check for."
  - A tag can be moved to point at new code. Only a commit hash cannot, which is the whole argument.
difficulty: 4
