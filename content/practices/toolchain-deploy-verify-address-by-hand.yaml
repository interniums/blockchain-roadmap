id: toolchain-deploy-verify-address-by-hand
moduleId: toolchain-deploy-verify
grain: module
writeUp: >
  Write the deployment runbook for a two-chain launch of something you would actually ship. Name the address strategy, who holds the signing key at each step, how verification is confirmed on each chain, and — the step teams forget — how ownership is handed over and how that handover is checked on chain afterwards.
coversConcepts:
  - forge-script
  - broadcast-cheatcode
  - simulate-then-broadcast
  - broadcast-artifacts
  - broadcast-as-source-of-truth
  - resume-and-slow
  - signer-selection
  - chain-flag-trap
  - create-address-derivation
  - initcode-hash-fragility
  - create3-pattern
  - deterministic-deployer-proxy
  - nicks-method
  - erc-7955-factory
  - verification-is-bytecode-matching
  - metadata-hash-match
  - etherscan-v2-single-key
  - sourcify-alternative
  - same-address-not-same-contract
kind: measure
title: Predict a CREATE2 address, then change one argument and predict the new one
concepts:
- create-address-derivation
- initcode-hash-fragility
- deterministic-deployer-proxy
- same-address-not-same-contract
spec: 'Compute a CREATE2 address by hand inside a test — `keccak256(0xff ‖ deployer ‖ salt ‖ keccak256(initcode))`
  truncated to twenty bytes, where initcode is the creation bytecode with the ABI-encoded constructor
  arguments appended — and assert it equals the address produced by an actual salted deployment. Then
  change exactly one constructor argument, predict the new address before running, and assert that too.
  Repeat once more changing only the optimizer setting, and confirm the address moves again. Finally,
  deploy with a plain CREATE from an account whose nonce you have advanced, and show the address is unrelated
  to any of them.

  '
acceptance:
  command: forge test --junit --match-path test/AddressDerivation.t.sol
  criteria:
  - A test computes the CREATE2 address from its four inputs and asserts equality with a real salted deployment
  - Changing one constructor argument changes the address, and the new address is predicted before deployment
    rather than read back afterwards
  - A test shows the plain CREATE address depending on the deployer's nonce
  - A written note names the three things that changed the initcode hash across the exercise
hints:
- The initcode is not the runtime bytecode. It is what the transaction carries, and the constructor arguments
  are appended to it.
- '`type(C).creationCode` gives you the creation bytecode; `abi.encodePacked` it with the encoded constructor
  arguments before hashing.'
- 'Foundry''s salted `new C{salt: s}()` routes through a factory, so the deployer in your hash is that
  factory''s address, not yours.'
difficulty: 4
