id: toolchain-deploy-verify-resume-a-broken-deploy
moduleId: toolchain-deploy-verify
kind: fix
title: Recover a five-contract deployment that died halfway
concepts: [simulate-then-broadcast, broadcast-artifacts, broadcast-as-source-of-truth, resume-and-slow]
spec: >
  Write a script that deploys five contracts in sequence against a local anvil, arranged so the
  fourth fails — for example by giving that transaction a gas limit that cannot cover it. Run it
  first without `--broadcast` and note what was written and what was not. Run it with `--broadcast`,
  observe the failure, then recover with `--resume` rather than rerunning from the start. Prove the
  recovery worked by writing a Solidity test that reads
  `broadcast/Deploy.s.sol/31337/run-latest.json` with `vm.readFile` and `vm.parseJson`, asserts
  exactly five deployments with five distinct addresses, and asserts the first three addresses match
  what the failed run had already recorded. You will need an `fs_permissions` entry for the broadcast
  directory.
acceptance:
  command: forge test --junit --match-path test/DeployRecovery.t.sol
  criteria:
    - A test parses run-latest.json and asserts exactly five deployed contract addresses, all distinct
    - The first three addresses are identical before and after the resume, proving nothing was redeployed
    - A test or note distinguishes the dry-run artifacts from the broadcast artifacts by path
    - A follow-up script reads at least one address out of the artifact rather than from a hardcoded constant
hints:
  - The dry run writes somewhere too. Look at what appears under broadcast/ before you ever pass the irreversible flag.
  - Foundry cannot read files outside the paths you permit. Add the broadcast directory to fs_permissions in foundry.toml.
  - "`--resume` reads the artifacts to work out what already succeeded, which is exactly why deleting that directory after a failure destroys your recovery path."
difficulty: 4
