id: toolchain-deploy-verify-right-chain-right-key
moduleId: toolchain-deploy-verify
grain: block
kind: break
title: Deploy to the wrong chain on purpose, then make it impossible
difficulty: 3
concepts: [signer-selection, chain-flag-trap]
spec: >
  Two ways a deployment goes wrong that have nothing to do with the contract.

  THE WRONG CHAIN. Set up a script that can deploy to two chains, and get it to deploy to the wrong one by
  the mechanism the module names — a chain flag that is not doing what it appears to. Show the deployment
  landing where you did not intend, and state exactly which piece of configuration won and which one was
  ignored.

  Then make it impossible: add a guard that fails the run before broadcasting if the resolved chain is not
  the intended one. Prove the guard by attempting the same mistake again.

  THE KEY. Enumerate the ways a signer can be supplied, and for each state what is exposed and to whom —
  the process environment, the shell history, a file on disk, a hardware device. Then demonstrate one
  leak concretely: show a signing secret recoverable from somewhere it should not be, on your own machine,
  and fix it.

  Close with the deployment procedure you would actually use, as a numbered list, with the check that
  makes each step safe to repeat.
acceptance:
  criteria:
    - A deployment lands on the wrong chain via the named mechanism, with the winning and ignored configuration identified
    - A guard fails the run before broadcast when the resolved chain is not the intended one, proven by a repeat attempt
    - Every signer supply method is enumerated with what it exposes and to whom
    - One signing-secret leak is demonstrated on your own machine and fixed
    - A numbered deployment procedure with a per-step safety check
hints:
  - Use two local chains with different ids rather than a testnet. You want the wrong-chain deployment to be free and repeatable.
  - The guard belongs before the broadcast, not after. A post-hoc check tells you what you already did.
  - For the leak, look at shell history first. It is the most common one and the easiest to demonstrate without contriving anything.
