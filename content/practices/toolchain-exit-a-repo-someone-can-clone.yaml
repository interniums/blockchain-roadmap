id: toolchain-exit-a-repo-someone-can-clone
moduleId: toolchain-hardhat-literacy
grain: exit
trackId: toolchain
kind: implement
title: A repository someone else can clone and get your numbers
difficulty: 5
concepts:
  - foundry-default-otherwise
  - coexistence-pattern
  - two-toolchain-world
  - ts-coupling-justification
spec: >
  The deliverable of this track is the repository itself. Take the practice repo you have been
  working in and make it something a stranger can clone and get identical results from — then prove
  that claim rather than making it.

  EIGHT properties, each with the evidence for it in the repo.

  REPRODUCIBLE. Pinned compiler version, pinned dependencies, committed lockfile. A documented
  command produces byte-identical bytecode, and you show the hash from two runs.

  TESTS THAT FAIL RIGHT. For three tests, demonstrate that each fails for the reason it claims:
  break the thing it tests, show the failure message names that thing, restore it. A test that
  passes when its subject is broken is worse than no test and you find at least one.

  FUZZ TO INVARIANT. Take one suspicion, write it as a fuzz property, then promote it to a stateful
  invariant campaign with handlers. Report the handler revert rate and get it under 15% — a campaign
  that mostly reverts is a campaign that mostly tested nothing.

  FORK, PINNED. One suite runs against real mainnet state at a pinned block, offline after the first
  run, and produces the same numbers on a machine with no network.

  HONEST GAS. A gas report, plus a written statement of which numbers mainnet will not reproduce and
  why. Name at least two.

  MULTICHAIN DEPLOY. Deploy one contract to three chains at the same address, verify on each, and
  then deliberately interrupt a deploy and recover it. The recovery is the deliverable, not the
  deploy.

  CI THAT IS NOT FLAKY. A pipeline that catches gas regressions, format drift and broken invariants.
  Run it ten times on unchanged code with zero failures, and show the runs.

  HARDHAT JUDGEMENT. Read a Hardhat 3 repository and write one page on whether this project needs
  it. "No" is the expected answer and it still has to be argued.
acceptance:
  command: forge test --match-path test/exit/Repo.t.sol
  criteria:
    - A documented command produces byte-identical bytecode across two runs, with both hashes recorded
    - Three tests are each shown to fail for the reason they claim, by breaking and restoring their subject
    - At least one pre-existing test is identified that passed while its subject was broken
    - A stateful invariant campaign runs with a handler revert rate under 15%, with the rate reported
    - A fork suite runs offline at a pinned block and reproduces its numbers with no network access
    - The gas report is accompanied by at least two named numbers mainnet will not reproduce, with reasons
    - One contract is deployed to three chains at one address and verified on each
    - An interrupted deploy is recovered, with the recovery steps and the resume state committed
    - CI runs ten times on unchanged code with zero failures, and the runs are linked or logged
    - A written page argues whether this project needs Hardhat 3, from the repository you read rather than from generalities
hints:
  - Do the reproducible build first and do not move on until two clean clones agree. Every later claim in this list is a claim about numbers, and numbers that are not reproducible are not evidence.
  - The handler revert rate is the single best signal in the whole list. If it is high, your handlers are generating states the contract rejects, and the campaign is exploring a corner of the space rather than the space.
  - For the interrupted deploy, kill it after the first transaction confirms and before the second. That is the state that is actually hard to recover from, and the one that happens in practice.
writeUp: >
  Someone clones this repo on Monday and has to ship a change by Friday. Walk through what they hit
  in order, and name the one thing you left that would cost them the most time.
