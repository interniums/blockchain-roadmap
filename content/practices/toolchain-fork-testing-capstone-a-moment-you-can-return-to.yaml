kind: implement
title: Reproduce one moment on mainnet, offline, twice, and price it
difficulty: 4
concepts: [fork-testing-purpose, lazy-state-fetch, fork-cheatcodes, multi-fork-testing, fork-state-isolation, make-persistent, roll-fork, vm-transact, block-pinning, fork-cache-keying, storage-caching-config, archive-node-requirement, rpc-cost-model, ci-cache-restore, fork-tests-are-slow]
spec: >
  Pick a real event on mainnet — a large swap, a liquidation, an exploit — and build a suite that
  reproduces the moment before it, runs your own code against that state, and does so identically on
  a machine with no network.

  PIN AND REPRODUCE. Fork at the block before your chosen event. Run your code against real deployed
  contracts, not mocks. Then delete the cache, run again with the network on, and assert the same
  result. Then run a third time with the network OFF and assert the same result again. All three
  numbers go in the write-up.

  PROVE IT IS LAZY. Show that a fork is not a download: count the RPC requests your suite makes, then
  add one storage read to your test and show the count go up by a specific amount. State what that
  implies about the cost of a large fork suite.

  TWO WORLDS. Create two forks in one test at different blocks and show their state is isolated —
  the same contract holding different values. Then make one address persistent across both and show
  what changes.

  MOVE THROUGH TIME. Use roll-fork to advance past your event and assert the state changed the way the
  real chain did. Then use vm.transact to replay the actual transaction and compare your prediction
  against what really happened. Any difference is a finding, not an error.

  THE BILL. Report the RPC request count, the wall-clock time cold and warm, and an estimate of what
  running this suite a hundred times a day would cost at your provider's prices. Then state whether an
  archive node was required and why.

  CI. Get the suite green in CI with a restored cache, and report the time saved against a cold run.
acceptance:
  command: forge test --junit --match-path test/capstone/ForkMoment.t.sol
  criteria:
    - The suite forks at a pinned block before a real named event and runs against real deployed contracts
    - The same result is produced cold with network, warm with network, and warm with the network off, with all three recorded
    - RPC request count is reported, and adding one storage read is shown to increase it by a specific amount
    - Two forks at different blocks are shown holding different state for the same contract
    - A persistent address is shown behaving differently from a non-persistent one across those forks
    - roll-fork advances past the event and the state change matches the real chain
    - vm.transact replays the real transaction and any divergence from the prediction is reported as a finding
    - The write-up reports request count, cold and warm wall-clock time, and a cost estimate at provider prices
    - Whether an archive node was required is stated with the reason
    - CI runs the suite green with a restored cache, with the time saved against cold reported
hints:
  - Choose the event before you write anything, and choose one with a public post-mortem. You need to know what really happened to have something to compare your prediction against.
  - Count RPC requests by pointing the fork at a local proxy that logs them. Provider dashboards aggregate too coarsely to show you the per-slot behaviour that makes the laziness visible.
  - The offline run is the one that proves the claim. Turn the network off at the OS level, not by unsetting the URL — an unset URL fails differently and does not test the cache.
