id: toolchain-fork-testing-capstone-a-moment-you-can-return-to
moduleId: toolchain-fork-testing
grain: module
writeUp: >
  Fork tests are the most realistic and the least reliable tests you will write. Decide, for a project you care about, exactly which behaviours you are willing to depend on a third-party RPC endpoint to verify — and what you would do the morning that endpoint stops serving your pinned block.
coversConcepts:
  - fork-testing-purpose
  - lazy-state-fetch
  - fork-mode-cli
  - fork-cheatcodes
  - rpc-endpoints-aliases
  - multi-fork-testing
  - fork-state-isolation
  - make-persistent
  - create-select-fork-duplicates
  - roll-fork
  - vm-transact
