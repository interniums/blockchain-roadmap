id: toolchain-fork-testing-persistent-helper
moduleId: toolchain-fork-testing
grain: block
kind: fix
title: Repair a two-fork test whose helper vanished
concepts: [multi-fork-testing, fork-state-isolation, make-persistent, create-select-fork-duplicates]
spec: >
  You are given a test that creates two forks, deploys a helper contract while the first is active,
  switches to the second, and then reverts on a call into the helper. Diagnose it from the trace and
  fix it with a persistence declaration rather than by redeploying. Then, in the same file, reproduce
  the second trap: call `vm.createSelectFork` twice with the same URL and show that state written
  under the first is invisible afterwards, then fix that by retaining and reusing the fork id. Add an
  assertion documenting which accounts were persistent before you declared anything.
acceptance:
  command: forge test --junit --match-path test/MultiFork.t.sol
  criteria:
    - A test reproduces the failure — a call into a contract that exists on one fork and not the other
    - The repaired test passes and the fix is a persistence declaration, with no second deployment anywhere in the file
    - A test demonstrates that two createSelectFork calls with the same URL yield independent forks, and a fixed version reuses the id instead
    - An assertion or comment records which accounts survive a fork switch by default
hints:
  - Switching forks replaces the whole world. Ask what is still there afterwards, and why the test contract itself seems to be.
  - There is a cheatcode that marks an account as surviving fork switches. Applying it before the switch is the entire fix.
  - "`createSelectFork` creates. Every time. If you want the fork you already had, you need the value it returned the first time."
difficulty: 3
