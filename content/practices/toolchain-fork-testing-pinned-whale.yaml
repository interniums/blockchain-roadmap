id: toolchain-fork-testing-pinned-whale
moduleId: toolchain-fork-testing
kind: implement
title: Test against real mainnet state, twice, offline the second time
concepts: [fork-testing-purpose, lazy-state-fetch, block-pinning, fork-cache-keying, rpc-endpoints-aliases]
spec: >
  Write a test that forks mainnet at an explicitly pinned block, reads a real USDC balance of a known
  large holder through the live token contract, pranks that holder to move funds into a contract of
  yours, and asserts on the result. Reference the endpoint through an `[rpc_endpoints]` alias with
  the URL supplied by an environment variable — no keyed URL in source. Time the first run and the
  second. Then clear Foundry's cache directory and time a third run. Finally, remove the pin, run
  twice, and record what changes.
acceptance:
  command: forge test --junit --match-path test/ForkPinned.t.sol
  criteria:
    - The test passes against a pinned block and the block number appears in foundry.toml or on the command line, never as "latest"
    - Three wall-clock timings are recorded — cold, warm, and after clearing the cache — with the gap explained in terms of per-slot RPC fetches
    - No endpoint URL or API key appears in any committed source file
    - The unpinned variant is shown either producing different results or missing the cache, and the learner can say why CI would be flaky
hints:
  - Nothing is downloaded until it is touched. The first thing your test reads is the first RPC request it makes.
  - "`[rpc_endpoints]` supports `${ENV_VAR}` interpolation, so the alias lives in the repository and the secret does not."
  - The cache key includes the block number. Ask yourself what key an unpinned run produces, and how often it repeats.
difficulty: 3
