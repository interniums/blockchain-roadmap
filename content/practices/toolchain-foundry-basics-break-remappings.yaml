id: toolchain-foundry-basics-break-remappings
moduleId: toolchain-foundry-basics
grain: block
kind: break
title: Break import resolution, then fix it with one line
concepts: [remappings, remapping-resolution-order, dependency-management-choice]
spec: >
  Start from a project that imports OpenZeppelin through the usual `@openzeppelin/contracts/...`
  path and compiles. Record the output of `forge remappings`. Now set
  `auto_detect_remappings = false` in foundry.toml and remove any `remappings` key and
  remappings.txt, then rebuild and read the failure carefully — it names the Solidity import, not the
  configuration that stopped resolving it. Repair it by writing the single minimal explicit remapping
  in foundry.toml, not by re-enabling auto-detection. Keep a test that imports and uses the
  dependency, so a green suite proves resolution actually works rather than that nothing referenced
  it.
acceptance:
  command: forge test --junit --match-path test/RemappingProof.t.sol
  criteria:
    - The suite fails to compile with auto-detection off and no explicit remapping, and the learner can point at the line of foundry.toml responsible
    - The suite compiles and passes with exactly one explicit remapping added and auto-detection still off
    - "`forge remappings` output before and after is captured, and the learner can explain which of the three sources supplied each entry"
    - The test does something with an imported OpenZeppelin symbol, so the import is load-bearing
hints:
  - The compiler error names a file it cannot find. Work backwards from the import string to the path it would have to become.
  - "`forge remappings` in the working project tells you exactly what auto-detection was generating for you. One of those lines is the one you need."
  - "A remapping is `prefix/=path/`, and both halves usually end in a slash. For a submodule under lib/, the path starts with lib/."
difficulty: 2
