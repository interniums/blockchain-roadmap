id: toolchain-foundry-basics-capstone-byte-identical-elsewhere
moduleId: toolchain-foundry-basics
grain: module
writeUp: >
  Your team has one repo and three environments: your laptop, a colleague's laptop, and CI. Name every mechanism in this module by which those three could compile the same commit into different bytecode, and say which of them your current project has actually closed off.
coversConcepts:
  - foundry-toolchain
  - forge-role
  - cast-role
  - anvil-role
  - chisel-role
  - tests-in-solidity
  - foundry-project-layout
