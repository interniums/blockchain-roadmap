kind: measure
title: Make the build byte-identical somewhere that is not your machine
difficulty: 4
concepts: [foundry-toolchain, foundry-project-layout, remappings, remapping-resolution-order, dependency-management-choice, foundry-toml, config-precedence, foundry-profiles, solc-pinning, evm-version-config, foundryup-channels, toolchain-pinning-in-ci]
spec: >
  Take a project and make its build reproducible, then prove it somewhere that is not where you built
  it. The proof is the deliverable; the configuration is just how you got there.

  THE PROOF. Produce identical bytecode hashes from two environments: your machine and a clean
  container, or CI. Record both hashes. If they differ, the difference is the exercise — find it, and
  the write-up says what it was.

  WHAT YOU HAD TO PIN. List everything: compiler version, EVM version, optimiser settings and runs,
  the toolchain channel itself, and every dependency. For each, show what happens if you unpin it —
  actually unpin one and record the resulting hash difference.

  IMPORT RESOLUTION. Diagram where three imports actually resolve to: one from a remapping, one from
  node resolution, one that is ambiguous between them. Then break resolution deliberately and fix it
  with one line, stating which layer you changed.

  WHICH LAYER WON. For four config values, trace which layer set the effective value: the default,
  foundry.toml, a profile, or an environment variable. Prove each with a command whose output shows
  the effective value, not by reading the file.

  PROFILES. Define profiles for a fast local loop and for CI, where they differ in at least two
  settings, and show a measured consequence of the difference — a time, or a gas number that moves.

  THE INSTALLER. State which channel your toolchain is pinned to, and demonstrate the failure mode of
  not pinning it: show two toolchain versions producing different output on the same source, or
  explain precisely why you could not and what that means.
acceptance:
  criteria:
    - Identical bytecode hashes are recorded from two different environments, or the difference is diagnosed and named
    - Compiler version, EVM version, optimiser settings, toolchain channel and every dependency are listed as pinned
    - One pin is deliberately removed and the resulting bytecode hash difference recorded
    - Three imports are diagrammed to their actual resolution, one via remapping, one via node resolution, one ambiguous
    - Resolution is broken deliberately and fixed with one line, with the changed layer named
    - Four config values are each traced to the layer that set them, proven by a command showing the effective value
    - Two profiles differ in at least two settings with a measured consequence
    - The toolchain channel is stated, and the unpinned failure mode is demonstrated or its absence explained
hints:
  - Start with the container, not the config. Until you have a second environment to compare against, "reproducible" is an opinion, and most of the pins you would add are guesses.
  - "The ambiguous import is the interesting one. Construct it on purpose: a path that a remapping and node resolution would both claim, and then find out which wins."
  - When you unpin the compiler and the hash does not change, you have not disproved anything — you have found that your local cache still had the old version. Clear it and try again.
