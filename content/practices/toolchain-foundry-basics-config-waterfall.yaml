id: toolchain-foundry-basics-config-waterfall
moduleId: toolchain-foundry-basics
grain: block
kind: measure
title: Prove which config layer won
concepts: [config-precedence, foundry-profiles, profile-use-cases, inline-fuzz-config]
spec: >
  In a fresh `forge init` project, make the number of fuzz runs observable from inside a test: add
  `test/ConfigLayers.t.sol` with a storage counter that a fuzzed function increments, plus a plain
  test that reads the counter and asserts it equals `vm.envOr("EXPECTED_RUNS", uint256(256))`.
  Because forge runs test functions in declaration order within a contract, the fuzzed function must
  be declared before the asserting one. Then add a `[profile.ci]` to foundry.toml setting a different
  `fuzz.runs`, and run the suite three ways: bare, with FOUNDRY_PROFILE=ci, and with
  FOUNDRY_FUZZ_RUNS set in the shell on top of the ci profile. Record which layer supplied the value
  each time, and confirm against `forge config`. Finally add a
  `/// forge-config: default.fuzz.runs = N` comment above the fuzzed function and show it has no
  effect under the ci profile.
acceptance:
  command: forge test --junit --match-path test/ConfigLayers.t.sol
  criteria:
    - The counter test passes with EXPECTED_RUNS unset, confirming the built-in default of 256
    - The same test passes with FOUNDRY_PROFILE=ci and EXPECTED_RUNS set to the ci profile's value
    - The same test passes with FOUNDRY_PROFILE=ci, FOUNDRY_FUZZ_RUNS and EXPECTED_RUNS both set to a third value, proving the environment variable beat the file
    - An inline forge-config comment naming the default profile is shown to change nothing under FOUNDRY_PROFILE=ci
hints:
  - "`forge config` prints the fully merged configuration, not the file. Run it under each of the three conditions before you run any test."
  - The counter has to survive between test functions, so it cannot be a local variable and it cannot be reset by setUp. Think about what setUp does before each case.
  - Declare the fuzzed incrementing function above the asserting function in the same contract, and give the counter a name that makes clear it is cumulative across the run.
difficulty: 3
