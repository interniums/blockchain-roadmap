id: toolchain-fuzzing-assume-vs-bound
moduleId: toolchain-fuzzing
kind: measure
title: Measure what rejection sampling costs you
concepts: [vm-assume-rejection, max-test-rejects, bound-remapping, bound-preferred-over-assume, naive-bound-bias]
spec: >
  Write the same constraint three ways over a `uint256` parameter — `vm.assume(x >= 1 && x <= 100)`,
  `x = bound(x, 1, 100)`, and hand-rolled clamping with `if (x > 100) x = 100;` — as three fuzz tests
  over one contract. Time each. For the assume version, compute beforehand what fraction of the
  uint256 domain satisfies the condition and predict what will happen; then lower
  `max_test_rejects` to something small and show the test failing with a rejection error rather than
  a property violation. For the clamping version, record the distribution of values the function
  actually saw by writing each one into an array and asserting on how many landed exactly on the
  boundary.
acceptance:
  command: forge test --junit --match-path test/AssumeVsBound.t.sol
  criteria:
    - The bound version passes with the full configured run count and the clamp version passes too
    - A test asserts that under clamping, more than half the observed values equal the upper bound exactly
    - A test configured with a small max_test_rejects fails with a rejection error, and the learner can distinguish that output from a property violation at a glance
    - Wall-clock timings for all three are recorded, with a one-line explanation of the assume version's acceptance probability
hints:
  - Work out the probability that a uniformly random uint256 lands between 1 and 100. Write the exponent down before you run anything.
  - Rejections are counted across the whole test, not per run, and there is a configured ceiling on them. Find the key in the testing config reference.
  - Record every value the function receives into a storage array, then assert on its contents in a separate test function declared after the fuzzed one.
difficulty: 3
