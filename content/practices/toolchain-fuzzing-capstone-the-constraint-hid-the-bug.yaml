kind: measure
title: Plant a bug your own constraints will hide, then find it anyway
difficulty: 4
concepts: [property-vs-example-testing, stateless-fuzzing, fuzz-parameters-are-the-trigger, fuzz-dictionary, vm-assume-rejection, max-test-rejects, bound-remapping, bound-preferred-over-assume, naive-bound-bias, overconstraining-hazard, fuzz-fixtures, fuzz-seed-reproducibility, failure-persistence, counterexample-reading]
spec: >
  The hard part of fuzzing is not writing the property. It is that your input constraints are part of
  the test, and a constraint can exclude the only inputs that would have failed. This exercise makes
  that concrete by planting a bug in a place your first instinct will hide.

  THE TARGET. Write a function with a bug reachable only at a boundary — the maximum of a range, a
  zero, or a value just above a threshold. Write down which input class triggers it before you write
  any test.

  HIDE IT. Write a property test that constrains inputs with `vm.assume` in a way that excludes the
  triggering class. Show it passing at the default run count. Then report the rejection count and show
  that you were near the reject ceiling — the signal that your test was mostly not running.

  HIDE IT AGAIN, DIFFERENTLY. Now use a naive `bound` instead, and demonstrate the bias it introduces:
  show the distribution of values your bound actually produces and where it clusters. Show the test
  still passing.

  FIND IT. Fix the constraints so the test fails. State what you changed and why, in terms of the
  input class you wrote down at the start.

  THE DICTIONARY AND FIXTURES. Add a fuzz dictionary and fixtures containing the boundary values, and
  show the failure is now found in far fewer runs. Report the run count before and after.

  REPRODUCE IT. Capture the counterexample, show it persisted, and reproduce the exact failure from a
  seed on a clean checkout. Read the counterexample out loud in the write-up: what were the inputs,
  and why is that the boundary.

  THE LIMIT. Finally, construct a second bug that stateless fuzzing cannot find no matter how you
  constrain it, and say in one sentence what it needs instead.
acceptance:
  command: forge test --junit --match-path test/capstone/Fuzzing.t.sol
  criteria:
    - The triggering input class is written down before any test exists
    - A vm.assume-constrained property passes while excluding the triggering class, with the rejection count reported and shown near the ceiling
    - A naive bound version also passes, with the actual value distribution shown and its clustering identified
    - Corrected constraints make the test fail, with the change explained in terms of the stated input class
    - A dictionary and fixtures reduce the runs needed to find the failure, with counts before and after
    - The counterexample is persisted and reproduced from a seed on a clean checkout
    - "The write-up reads the counterexample: the inputs, and why they are the boundary"
    - A second bug is constructed that stateless fuzzing cannot reach, with one sentence on what it needs instead
hints:
  - Write the bug and the input class on paper before you open the test file. If you discover the class from a failing test you have lost the whole point of the exercise, which is watching your own constraint hide it.
  - Print the fuzzed values to a file and histogram them. The naive-bound bias is invisible in the pass/fail and obvious in the distribution.
  - The bug fuzzing cannot reach is one that needs two calls in a particular order. That is the sentence, and it is also the reason the next module exists.
