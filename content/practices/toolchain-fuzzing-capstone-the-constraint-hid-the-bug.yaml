id: toolchain-fuzzing-capstone-the-constraint-hid-the-bug
moduleId: toolchain-fuzzing
grain: module
writeUp: >
  Take one fuzz test you have written or read. Draw the full input domain of its parameters, shade the region the test actually exercises after every assume and bound, and say honestly what fraction of the domain you have left untested — and whether the bug you fear lives in it.
