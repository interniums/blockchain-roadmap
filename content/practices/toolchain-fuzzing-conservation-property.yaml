id: toolchain-fuzzing-conservation-property
moduleId: toolchain-fuzzing
grain: block
kind: implement
title: Fuzz a conservation property and then break it on purpose
concepts: [property-vs-example-testing, stateless-fuzzing, assume-legitimate-uses, counterexample-reading, overconstraining-hazard]
spec: >
  Take a minimal ERC-20-like token and fuzz `transfer(address to, uint256 amount)` for the property
  that the sum of the sender's and recipient's balances is unchanged. Exclude only what genuinely
  must be excluded with assume — address(0), the token itself, the test contract, and the cheatcode
  address 0x7109709ECfa91a80626fF3989D68f67F5b1DD12D — and bound the amount rather than assuming it.
  Then introduce a deliberate rounding bug, such as a fee that truncates, and show the fuzzer
  producing a concrete counterexample. Promote those exact arguments into a named `test_` case,
  fix the bug, and confirm both the named case and the campaign pass. Finally, tighten the bounds
  until the same bug stops being found, and write down the bound that hid it.
acceptance:
  command: forge test --junit --match-path test/ConservationFuzz.t.sol
  criteria:
    - The conservation property passes on the correct implementation at the configured run count
    - The property fails on the seeded rounding bug and the failure output names concrete arguments
    - A named unit test carrying those exact arguments fails on the buggy implementation and passes on the fixed one
    - A commented-out or clearly labelled over-tight bound is included, with a note stating which bug it conceals and why
hints:
  - Conservation is about a sum before and after, so capture both balances before the call and compare after. Watch the self-transfer case.
  - The excluded addresses are countable, so assume is the right tool for them; the amount is a range, so it is not.
  - A truncating fee only loses value when the amount is small enough for integer division to round to zero. Your lower bound decides whether the fuzzer can ever reach that.
difficulty: 3
