id: toolchain-gas-profiling-a-reviewable-diff
moduleId: toolchain-gas-profiling
grain: block
kind: implement
title: Turn a gas change into something a reviewer can read in a diff
difficulty: 2
concepts: [gas-snapshot-file, snapshot-diff-vs-check, fuzz-seed-determinism]
spec: >
  A gas number in a terminal is not reviewable. A committed snapshot is.

  Generate a gas snapshot and commit it. Then make a change that moves gas — a storage packing, or a
  guard swap — and produce the diff a reviewer would see. Report the delta per function.

  Then establish the difference between the two modes: one reports the change and one fails on it. Use
  each, and say which belongs in local development and which in CI, and what happens in CI when the
  snapshot is stale but the code is correct.

  THE FLAKINESS. Fuzz tests make gas non-deterministic across runs. Demonstrate it: run the same suite
  twice without pinning the seed and show the snapshot differing. Then pin it and show the difference gone.
  State what pinning costs you — because a pinned seed is a fixed sample of the input space — and how you
  would get both a stable gate and real fuzz coverage.
acceptance:
  criteria:
    - A gas snapshot is generated and committed
    - A gas-moving change produces a per-function delta diff
    - Both snapshot modes are used, with which belongs locally and which in CI stated
    - What happens in CI on a stale snapshot with correct code is stated
    - The same suite is shown producing differing snapshots across runs without a pinned seed
    - Pinning the seed removes the difference
    - The cost of a pinned seed is stated, with an approach that keeps both a stable gate and real fuzz coverage
hints:
  - Commit the snapshot before making the change, in its own commit. The diff is the deliverable and it only exists if the baseline is in history.
  - The stale-snapshot-with-correct-code case is the one that makes teams disable the gate. Decide what you want to happen before it happens to you.
  - For the both-worlds answer, separate the gate from the campaign. A pinned gate and an unpinned nightly run is the usual shape and it is worth arriving at deliberately.
