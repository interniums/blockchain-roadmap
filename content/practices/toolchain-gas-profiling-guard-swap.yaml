id: toolchain-gas-profiling-guard-swap
moduleId: toolchain-gas-profiling
kind: measure
title: Measure the reentrancy guard yourself, and find the range
concepts: [storage-dominates, snapshot-cheatcodes, gas-metering-control, gas-folklore]
spec: >
  Implement the same function twice, once behind a storage-slot reentrancy guard and once behind a
  transient-storage guard, plus an unguarded control. Measure the overhead of each guard as the
  difference against the control, and measure the storage guard twice — once where the lock slot is
  cold on the first guarded call in the transaction, and once where it is already warm. Report a
  range for the storage guard rather than a single number, and explain the range. Then prove both
  guards still work by writing an attacker contract that attempts reentry and asserting it is
  blocked in both cases.
acceptance:
  command: forge test --junit --match-path test/GuardGas.t.sol
  criteria:
    - Measured overheads are reported for the transient guard and for the storage guard in both the cold-slot and warm-slot cases
    - A test asserts the transient guard's overhead is under 400 gas and the warm storage guard's is over 2500, so the ordering is machine-checked rather than asserted in prose
    - A reentrancy attempt is blocked by both implementations, proven by a test that succeeds against the unguarded control
    - The write-up states a range for the storage guard and names the condition that puts you at each end of it
hints:
  - The lock slot is cold exactly once per transaction. Whether your measurement sees a cold slot depends on what ran before it.
  - Transient storage is cleared at the end of the transaction, which is why its write does not carry the cost of persisting anything.
  - The widely quoted saving assumes the cold case and never says so. Measure both and you will see why one number was never honest.
difficulty: 4
