id: toolchain-gas-profiling-three-numbers
moduleId: toolchain-gas-profiling
kind: measure
title: Get three different gas numbers for one function, and justify each
concepts: [gas-report, snapshot-cheatcodes, isolate-mode, test-warmth-bias, gas-probe-dead-code-elimination]
spec: >
  Take one storage-writing function and measure it three ways: from the aggregate gas report, from
  the same run with isolation enabled, and from a named snapshot region bracketing only the call
  itself. Then measure it a fourth way with a hand-rolled `gasleft()` probe — and make the probe
  correct, which for any read means assigning the result into a storage sink so it cannot be
  eliminated. Deliberately write the naive version first, observe that every read costs the same
  implausibly small number, and record that as a finding. Subtract the harness overhead. Write down,
  for each of the four numbers, exactly what is included and what is excluded, and which one is
  closest to what a user pays.
acceptance:
  command: forge test --junit --match-path test/GasThreeWays.t.sol
  criteria:
    - Four numbers are recorded for the same function, with the isolation setting stated for each
    - A test asserts that the naive probe over a read produces a value below a threshold that no real cold read could produce, demonstrating the elimination
    - The sink-based probe reproduces the documented cold and warm read costs to within the harness overhead
    - A written note states which of the four numbers is closest to a mainnet transaction cost and names the two components still missing from it
hints:
  - "Turn the optimizer off and try `pop(sload(slot))` inside a gasleft bracket. Then ask whether the compiler had any reason to keep it."
  - Two GAS opcodes and the surrounding stack work are not free. Measure an empty bracket first and subtract that constant from everything else.
  - The gas report measures the call. A transaction also pays an intrinsic cost and for every byte of its calldata, neither of which appears in any of your four numbers.
difficulty: 4
