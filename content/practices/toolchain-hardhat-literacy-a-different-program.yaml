id: toolchain-hardhat-literacy-a-different-program
moduleId: toolchain-hardhat-literacy
grain: block
kind: read
title: Inherit a Hardhat 2 repository and report what version 3 would break
difficulty: 3
concepts: [hardhat3-esm-only, hardhat3-explicit-plugins, hardhat3-hooks, hardhat3-network-connections, hardhat2-eol]
spec: >
  You will inherit these. This is a literacy exercise, not a migration: read one and write the assessment
  you would hand a team.

  Take a real Hardhat 2 project. Then, for each of the ways version 3 is a different program rather than a
  new version, state what the project would have to change.

  The module system: is the project CommonJS, and what does that mean for its config and every script it
  has? The plugins: list every plugin it relies on implicitly and say which would now need declaring, and
  which have no version-3 equivalent. The lifecycle: find one place the project depends on behaviour that
  is now a hook, and say what it would become. And the network handling: find where it assumes a single
  ambient network and say what an explicit connection model does to that code.

  Then the decision. State whether this project should move, stay, or be ported off Hardhat entirely — and
  price each option in engineering days from what you actually read, not from a general estimate. Note the
  end-of-life status of version 2 as a constraint on the "stay" option rather than as an argument.
acceptance:
  criteria:
    - A real Hardhat 2 project is assessed
    - The module-system change is stated with its effect on the config and scripts
    - Every implicitly relied-on plugin is listed, with which need declaring and which have no version-3 equivalent
    - One dependence on now-hooked behaviour is identified with what it would become
    - One place assuming a single ambient network is identified with the effect of explicit connections
    - A move, stay or port-off decision is made with each option priced in engineering days from what was read
    - Version 2's end-of-life status is treated as a constraint on staying
hints:
  - Enumerate the plugins from the lockfile as well as the config. The implicit ones are the ones that break, and they are not in the config by definition.
  - The single-ambient-network assumption is usually in a deployment script. Look for code that talks about "the network" without naming it.
  - Price the port-off option honestly. For a small project it is often cheaper than the migration, and that is a real finding rather than a bias.
