id: toolchain-hardhat-literacy-same-test-twice
moduleId: toolchain-hardhat-literacy
grain: module
writeUp: >
  Write the one-page memo a team would need to decide their toolchain. It must name conditions, not preferences — the specific things that would have to be true of the project for the second dependency tree to be worth its maintenance cost.
coversConcepts:
  - two-toolchain-world
  - hardhat-config-is-code
  - hardhat3-edr
  - hardhat3-esm-only
  - hardhat3-explicit-plugins
  - hardhat3-hooks
  - hardhat3-network-connections
  - hardhat2-eol
  - hardhat3-solidity-tests
  - hardhat3-multichain
  - hardhat3-build-profiles
  - hardhat-ignition
  - directory-translation
  - remapping-vs-node-resolution
  - ts-coupling-justification
  - foundry-default-otherwise
  - coexistence-pattern
kind: implement
title: Run one src directory under both toolchains
concepts: [two-toolchain-world, directory-translation, remapping-vs-node-resolution, coexistence-pattern, hardhat3-solidity-tests]
spec: >
  Take a small Foundry project and add a Hardhat 3 setup alongside it that compiles the same
  contracts, without duplicating the sources. Configure Hardhat to read from the existing directory
  and make its dependency resolution find the same OpenZeppelin version that the Foundry remappings
  resolve to. Then write the same test twice: once as a Foundry `.t.sol` test and once as a Hardhat
  TypeScript test. Finally, deliberately create the divergence: install a second OpenZeppelin version
  under node_modules while leaving the submodule in lib/ untouched, and demonstrate that the same
  import string now resolves to different files in the two toolchains. Produce a translation table
  mapping every top-level directory and config key to its counterpart.
acceptance:
  command: forge test --junit --match-path test/CrossToolchain.t.sol
  criteria:
    - The Foundry test passes against src/ with the project's existing remappings
    - The Hardhat test command passes against the same sources, and the command used is recorded in the repository README
    - A test asserts on a version- or behaviour-distinguishing constant from the dependency, and the learner shows the two toolchains disagreeing once the versions diverge
    - A translation table covers sources, artifacts, tests, deployments, dependencies and import resolution
hints:
  - Hardhat expects contracts/ by default, but that is configurable. Point it at the directory you already have rather than moving anything.
  - "One resolver rewrites a prefix into a filesystem path; the other walks node_modules. The same string is not the same file."
  - Pick something observable to assert on — a constant, an error selector, a revert string that changed between dependency versions — so the divergence shows up as a failing test rather than as a hunch.
difficulty: 4
