id: toolchain-invariant-testing-fix-revert-rate
moduleId: toolchain-invariant-testing
grain: block
kind: fix
title: Diagnose a campaign that was testing nothing
concepts: [revert-metrics, handler-pattern, runs-and-depth]
spec: >
  You are given a passing invariant campaign whose handler reverts on the overwhelming majority of
  generated calls — unbounded amounts, withdrawals from actors with no balance, transfers to
  address(0). Turn on the campaign metrics and record the per-function revert and discard rates
  before changing anything. Repair the handler so that calls are constructed to be able to succeed:
  bound amounts against the actor's actual balance, select actors from a fixed set, and skip
  operations whose preconditions are unmet rather than letting them revert. Record the rates again,
  and demonstrate that the repaired campaign now reaches a state the original never did by asserting
  on a state variable that only a deep sequence can produce.
acceptance:
  command: forge test --junit --match-path test/HandlerHealth.t.sol
  criteria:
    - Before-and-after revert rates are captured for each handler function
    - After the fix, a test asserts that the campaign reached a state requiring a multi-call sequence, which fails against the original handler
    - The invariant still passes on the correct implementation and still fails on a seeded bug
    - The learner can state, in one sentence, why the original campaign's green result carried almost no information
hints:
  - A green invariant result tells you nothing until you know how many of the generated calls actually executed.
  - The metrics are not on by default. Find the switch in the invariant configuration before you touch the handler.
  - Bounding an amount against a constant is not enough; bound it against what the selected actor actually holds at that moment.
difficulty: 4
