id: toolchain-invariant-testing-vault-solvency
moduleId: toolchain-invariant-testing
grain: module
writeUp: >
  Write down five invariants for a system you know. For each one, say what an attacker would gain by breaking it, and whether a stateless fuzz test could have found the violation. If the answer to the second question is yes for all five, your invariants are probably too weak.
coversConcepts:
  - unit-vs-fuzz-vs-invariant
  - stateful-fuzzing
  - invariant
  - solvency-invariant
  - handler-pattern
  - ghost-variable
  - runs-and-depth
  - revert-metrics
kind: implement
title: Catch a three-call bug that every unit test misses
concepts: [invariant, solvency-invariant, handler-pattern, ghost-variable, stateful-fuzzing]
spec: >
  Build a small deposit-and-withdraw vault, a handler that bounds amounts and picks among three
  actors, and ghost variables tracking total ever deposited and total ever withdrawn. State the
  solvency invariant against the ghosts rather than against the vault's own accounting. Then seed a
  bug that only manifests after a specific three-call sequence — for example a rounding error in
  share conversion that only bites when a withdrawal follows a deposit that followed another actor's
  withdrawal. Write unit tests covering each function individually and show them all passing, then
  show the invariant campaign finding the sequence and reporting it.
acceptance:
  command: forge test --junit --match-path test/VaultInvariant.t.sol
  criteria:
    - Every per-function unit test passes against the buggy implementation
    - The invariant fails against the buggy implementation and the reported call sequence is at least three calls long
    - The same invariant passes against the fixed implementation at the configured runs and depth
    - The invariant compares vault state against ghost variables, not against a value the vault itself computed
hints:
  - If the invariant reads the same number the contract used to decide the transfer, it can only catch a mismatch the contract already knows about.
  - The handler is where the fuzzer is pointed, and it is where every argument gets bounded into a range that can actually succeed.
  - Track deposits and withdrawals as running totals in the handler, and assert on the relationship between those totals and the vault's real token balance.
difficulty: 4
