id: toolchain-unit-testing-capstone-a-suite-that-cannot-lie
moduleId: toolchain-unit-testing
grain: module
writeUp: >
  Pick the test in your own suite that you would be least surprised to learn passes for the wrong reason. Write down the specific mechanism by which it could pass while the contract is broken, then go and check whether it does.
coversConcepts:
  - test-discovery-by-prefix
  - test-contract-is-the-fixture
  - test-filtering
  - setup-runs-per-test
  - setup-snapshot-model
  - call-isolation-default
  - vm-cheatcode-mechanism
  - cheatcode-families
  - cheatcode-address-in-fuzzing
  - prank-scope
  - prank-tx-origin-form
  - prank-delegatecall-form
  - deal-cheatcode
  - warp-and-roll
  - expect-revert-next-call
  - expect-revert-argument-nesting
  - expect-revert-selector-vs-data
  - low-level-call-status-trap
  - expect-emit-ordering
  - expect-emit-topic-flags
kind: fix
title: Build a test suite that cannot pass while the contract is broken
difficulty: 4
concepts: [test-discovery-by-prefix, test-contract-is-the-fixture, setup-runs-per-test, setup-snapshot-model, call-isolation-default, vm-cheatcode-mechanism, prank-scope, prank-tx-origin-form, prank-delegatecall-form, warp-and-roll, expect-revert-next-call, expect-revert-argument-nesting, expect-revert-selector-vs-data, low-level-call-status-trap, expect-emit-ordering, expect-emit-topic-flags]
spec: >
  Every trap in this module is a documented way a test passes while its subject is broken. Build a
  suite that contains one instance of each trap, prove each one passes wrongly, then fix it — and end
  with a mutation check that proves the fixed suite actually holds.

  THE TRAPS, each demonstrated then fixed.

  EXPECT-REVERT ON THE WRONG CALL. Write a test where `expectRevert` catches a revert from a setup
  call rather than the call under test, and passes. Fix it.

  ARGUMENT NESTING. Write one where the reverting call is nested inside another call's arguments, so
  the expectation applies to the outer call. Fix it.

  SELECTOR VERSUS DATA. Write one that asserts on a selector and passes for a revert carrying entirely
  different arguments. Fix it to assert on the data.

  THE LOW-LEVEL STATUS TRAP. Write one where the contract's low-level call fails, the boolean is
  ignored, and the test passes because nothing reverted. Fix it.

  EMIT ORDERING AND FLAGS. Write one where `expectEmit` matches a decoy contract's event, and one
  where the four booleans let a wrong value through. Fix both, and state what the flags do not cover.

  THE FIXTURE. Show that `setUp` runs per test rather than once, and demonstrate one consequence:
  state you expected to carry between tests and does not. Then show the opposite — something that
  does leak, via the snapshot model, and say what.

  PRANKS. Demonstrate all three prank scopes, including the tx.origin form and the delegatecall form,
  and one case where the scope ended earlier than the author expected.

  THE MUTATION CHECK. Finally, break the contract in five distinct ways, one at a time, and show the
  fixed suite catches all five. Any mutation that survives is a hole, and you either close it or
  document why it is acceptable.
acceptance:
  command: forge test --junit --match-path test/capstone/SuiteIntegrity.t.sol
  criteria:
    - Each of the six named traps is demonstrated passing wrongly, then fixed, with both versions retained
    - The selector-versus-data fix asserts on data and fails for a revert with different arguments
    - The low-level status trap is shown passing while the contract's call failed
    - An expectEmit is shown matching a decoy contract, and a topic-flag combination is shown letting a wrong value through
    - What the four topic flags do not cover is stated
    - setUp is shown to run per test, with one consequence demonstrated, and one thing that does leak via the snapshot model identified
    - All three prank scopes are demonstrated, including the tx.origin and delegatecall forms, plus one case where the scope ended early
    - Five distinct contract mutations are each caught by the fixed suite
    - Any surviving mutation is documented with a reason it is acceptable
hints:
  - Keep the broken tests. Delete them and the suite loses its evidence — the pair of a wrongly passing test and its fix is the artefact here, not the fix alone.
  - The decoy emitter is the trap worth internalising. Deploy a second contract that emits the identical event and let your expectation match it; nothing in the assertion says which contract it came from unless you say so.
  - Do the mutations by hand rather than with a tool. Five deliberate, well-chosen breakages teach you more about your suite's blind spots than a hundred random ones.
