id: toolchain-unit-testing-decoy-emitter
moduleId: toolchain-unit-testing
kind: implement
title: Fool your own event assertion with a decoy contract
concepts: [expect-emit-ordering, expect-emit-topic-flags]
spec: >
  Write two tests of the same ERC-20 transfer. The first uses `vm.expectEmit(true, true, true, true)`
  without pinning the emitter. The second uses the overload that takes the emitting address. Then
  deploy a decoy contract that emits a byte-identical `Transfer` event with the same indexed values,
  arrange for the decoy to emit during the call under test, and show that the first assertion is
  satisfied by the decoy while the second is not. Add a third test that registers two expectations in
  the wrong relative order and observe the failure, so you have seen ordering enforced as well as
  emitter blindness.
acceptance:
  command: forge test --junit --match-path test/ExpectEmitStrictness.t.sol
  criteria:
    - A test passes while the real token never emits, because the decoy's identical event satisfied an unpinned expectation
    - The equivalent test using the address overload fails against the decoy and passes against the token
    - A test demonstrates that two expectations registered in reverse order fail, and the same two in actual order pass
    - Comments state which of topic0, topics 1-3, the data body and the emitter each assertion is checking
hints:
  - Count the booleans, then count the things an event has. One of those things is not in the list.
  - "The event signature hash is topic0 and is always checked, which is why a differently named event will not satisfy the assertion — but an identically shaped one from anywhere will."
  - Make the decoy emit from inside the same top-level call, for example by having the token call into it, so both logs land in the same stream the expectation is matched against.
difficulty: 3
