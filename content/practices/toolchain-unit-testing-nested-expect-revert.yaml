id: toolchain-unit-testing-nested-expect-revert
moduleId: toolchain-unit-testing
kind: fix
title: Make a test that always passed actually assert something
concepts: [expect-revert-next-call, expect-revert-argument-nesting, expect-revert-selector-vs-data, low-level-call-status-trap]
spec: >
  You are given a Vault with a `withdraw(uint256)` that reverts with a custom
  `InsufficientBalance(uint256 requested, uint256 available)` error, and a test written as
  `vm.expectRevert(Vault.InsufficientBalance.selector); vault.withdraw(token.balanceOf(user));`.
  First prove the test is worthless: make `withdraw` correct — so that it does not revert at all —
  and show the test still passes. Then repair it by hoisting the inner call, and tighten the
  assertion from a bare selector to the fully ABI-encoded revert data including both arguments.
  Finally add a case that wraps a low-level `.call` in expectRevert and assert on the returned
  boolean correctly, not intuitively.
acceptance:
  command: forge test --junit --match-path test/ExpectRevertTraps.t.sol
  criteria:
    - A test demonstrates that the nested form passes against a withdraw implementation that never reverts
    - The repaired test fails when withdraw stops reverting, and passes when it reverts correctly
    - One test matches the full encoded revert data and fails if either error argument is wrong
    - One test wraps a low-level call and asserts the correct value of the returned success boolean, with a comment explaining what that boolean now means
hints:
  - Solidity evaluates the arguments of a call before making the call. Say out loud, in order, which calls the EVM makes in that one statement.
  - Put the inner call on its own line first and store its result in a local. Now the statement after expectRevert contains exactly one call.
  - "`abi.encodeWithSelector` with both arguments gives you the exact revert data; and after a satisfied expectation, the low-level call's success flag reports the expectation, not the callee."
difficulty: 3
