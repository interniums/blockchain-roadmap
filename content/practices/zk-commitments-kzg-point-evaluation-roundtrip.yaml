id: zk-commitments-kzg-point-evaluation-roundtrip
moduleId: zk-commitments-kzg
kind: implement
title: Commit to a blob, derive its versioned hash by hand, and prove a point through the precompile
concepts: [data-as-polynomial, kzg-scheme, kzg-opening-proof, point-evaluation-precompile]
spec: >
  Using the reference KZG library bindings, take an arbitrary 128 KiB input, pad and encode it as a
  blob of 4096 field elements, compute its KZG commitment, and compute an opening proof at a point z of
  your choosing. Derive the versioned hash yourself as the 0x01 version byte followed by bytes 1..32 of
  the SHA-256 of the commitment, and assert it matches what the library returns. Then write a Foundry
  test that assembles the exact 192-byte input for the precompile at address 0x0A — versioned hash,
  z, y, commitment, proof — via staticcall, asserts success, and records the gas consumed. Add negative
  cases. Read the precompile's gas constant from the EIP and compare it against what you measured
  rather than against any number quoted in a tutorial.
acceptance:
  command: forge test --match-path test/PointEvaluation.t.sol -vvv --gas-report
  criteria:
    - A test asserts the hand-derived versioned hash equals the library-produced one byte for byte
    - A test staticcalls 0x0A with the valid 192-byte tuple and asserts success
    - A test flips one bit of y and asserts the call fails, and a second negative test corrupts the versioned hash and asserts it fails for a different reason
    - The test output records measured gas for the successful call, and the README compares it to the constant read from EIP-4844
hints:
  - The versioned hash is not a hash of the blob. It is a hash of the commitment, with the first byte replaced by the version.
  - The 192 bytes are five fields in a fixed order with fixed widths. Lay them out as a labelled byte ruler on paper before you write the abi.encodePacked.
  - Your two negative tests should fail for different reasons — one breaks the opening equation, the other breaks the commitment-to-versioned-hash check. If you cannot tell them apart, you have not understood what the precompile checks.
difficulty: 4
