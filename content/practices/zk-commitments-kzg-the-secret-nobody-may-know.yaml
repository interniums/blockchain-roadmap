id: zk-commitments-kzg-the-secret-nobody-may-know
moduleId: zk-commitments-kzg
grain: block
kind: implement
title: Commit to a polynomial, then account for the secret in the setup
difficulty: 4
concepts: [commitment-scheme, polynomial-commitment, structured-reference-string, powers-of-tau-ceremony, kzg-ceremony-ethereum, erasure-coding-extension, cell-and-column]
spec: >
  A polynomial commitment does something a hash cannot, and it needs something a hash does not.

  WHAT A HASH CANNOT DO. Commit to a vector with a hash and then try to prove one element of it without
  revealing the rest — and show why the obvious approaches fail or cost linearly. Then commit to the same
  data as a polynomial, open one evaluation, and verify the opening. Report the commitment size, the
  opening size, and the verification cost, and contrast each against the hash-based approach.

  State the two properties every commitment must have, and show your scheme having both: produce a failed
  attempt to open a committed polynomial to a value it does not take.

  THE SECRET. The setup contains a value nobody may know. State what an adversary holding it could produce,
  concretely — not "break soundness" but the specific false thing they could convince a verifier of. Then
  describe the ceremony that generated Ethereum's: how it makes the secret safe, and the minimum condition
  for that safety to hold. Report the participant count.

  STRETCHED FIRST. Finally, connect it to how data is actually shared: show why the data is erasure-coded
  before distribution, and demonstrate the property that buys — reconstruct the original from a subset of
  the extended data, and report what fraction you needed. Then state what a cell and a column are in that
  layout and why the unit of custody is the column rather than the whole thing.
acceptance:
  criteria:
    - A hash commitment is shown unable to prove one element without revealing the rest or paying linearly
    - The same data is committed as a polynomial with one evaluation opened and verified
    - Commitment size, opening size and verification cost are reported and contrasted with the hash approach
    - Both required commitment properties are stated and demonstrated, including a failed false opening
    - What an adversary holding the setup secret could concretely produce is stated
    - The ceremony is described with how it makes the secret safe, the minimum condition, and the participant count
    - Erasure coding is shown enabling reconstruction from a subset, with the required fraction reported
    - Cell and column are defined in the layout with why custody is by column
hints:
  - Try the hash approach honestly first. Watching a Merkle opening cost grow while a polynomial opening stays constant is the whole motivation and it is cheap to demonstrate.
  - The concrete adversary capability is opening a commitment to two different values. Say that rather than naming a property.
  - For reconstruction, delete more than half the extended data and show it still works. The fraction is the interesting number and it is counter-intuitive until you see it.
