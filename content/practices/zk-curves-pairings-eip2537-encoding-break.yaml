id: zk-curves-pairings-eip2537-encoding-break
moduleId: zk-curves-pairings
kind: break
title: Break a BLS12-381 precompile call by sending the compressed encoding
concepts: [bls-precompiles, g1-g2-asymmetry, bls12-381, msm-multi-scalar-multiplication]
spec: >
  In a Foundry project forked to a Pectra-or-later chain, write a contract that calls G1ADD at 0x0b
  and PAIRING_CHECK at 0x0f using vectors taken from the execution-spec-tests for EIP-2537, and assert
  the expected outputs. Then break it deliberately in two ways: send an Fp element as 48 bytes instead
  of the padded 64, and send a G1 point in its 48-byte compressed form instead of the 128-byte padded
  uncompressed form. Assert both revert. Finally measure gas for G1MSM at k equal to 1, 8 and 64 and
  compare each measurement against the EIP's own formula, reading the discount table from the EIP text
  rather than extrapolating from two points.
acceptance:
  command: forge test --match-path test/Bls12381Encoding.t.sol -vvv --gas-report
  criteria:
    - Positive tests call 0x0b and 0x0f with spec-test vectors and assert the documented outputs
    - A test sending an unpadded 48-byte Fp element asserts the precompile call reverts
    - A test sending a compressed 48-byte G1 point asserts the call reverts, with a comment naming which encoding rule was violated
    - Measured G1MSM gas at k = 1, 8 and 64 is recorded and compared in the README against the EIP's formula including its discount table
hints:
  - Take the vectors from the execution-spec-tests rather than generating your own. Getting a valid point is a separate problem from getting the encoding right, and you only want one problem at a time.
  - 48 bytes is the compressed serialization used by KZG commitments and consensus signatures. The precompiles want something different. Same curve, two encodings.
  - Do not fit a line through two MSM measurements. The pricing has an explicit per-k discount table, and interpolating between points will look right and be wrong.
difficulty: 4
