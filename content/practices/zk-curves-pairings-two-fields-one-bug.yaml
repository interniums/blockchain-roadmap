id: zk-curves-pairings-two-fields-one-bug
moduleId: zk-curves-pairings
grain: block
kind: break
title: Mix the two fields on purpose, then aggregate a thousand signatures
difficulty: 4
concepts: [ec-group, discrete-log-hardness, scalar-field-vs-base-field, hash-to-curve, bls-signature-aggregation, pairing-and-post-quantum]
spec: >
  One curve, two fields, and a bug that comes from treating them as one.

  THE ONE-WAY STEP. Demonstrate the asymmetry everything rests on: multiply a point by a scalar cheaply, and
  then show that recovering the scalar is not something you can do. Report the cost of the forward operation
  and state the best known cost of the reverse for this curve, as a number.

  THE TWO FIELDS. Write out the modulus of the scalar field and of the base field and show they differ. Then
  construct the bug: reduce a value modulo the wrong one and produce two distinct inputs that your code
  treats as equal. Use it to make a signature verify for a message it was not signed for, or an equality
  check pass that should fail. A comment names which field the value belonged in.

  ONTO THE CURVE. Hash a message to a curve point correctly, then do it wrongly — hash and retry until you
  land on the curve — and state what the wrong method breaks. It is not correctness of the mapping; it is a
  property the proofs above it depend on, and naming it is the exercise.

  AGGREGATE. Aggregate a thousand signatures into one and verify it. Report the verification cost against
  verifying a thousand individually, and the aggregate signature's size. Then break aggregation: submit an
  aggregate that verifies but does not attest what it claims, and name the check that was missing.

  Close with one paragraph on the clock: state what a quantum adversary does to this construction and which
  part of the stack that threatens first.
acceptance:
  criteria:
    - Scalar multiplication cost is reported alongside the best known cost of the discrete log for this curve
    - Scalar-field and base-field moduli are both written out and shown to differ
    - A wrong-field reduction produces two distinct inputs treated as equal, used to make a check pass that should fail
    - A comment names the field the value belonged in
    - A message is hashed to a curve point correctly and by hash-and-retry, with what the wrong method breaks named
    - A thousand signatures are aggregated and verified, with cost against individual verification and the aggregate size reported
    - An aggregate is constructed that verifies without attesting what it claims, with the missing check named
    - One paragraph states the quantum threat and which part of the stack it reaches first
hints:
  - Print both moduli side by side before writing any code that reduces anything. Most of these bugs are one variable reduced by the wrong constant and the two constants look alike.
  - Hash-and-retry breaks constant-time behaviour, not correctness. That is the property to name.
  - The aggregation break is usually a missing distinctness or domain check on the messages. Construct it deliberately rather than searching for it.
