id: zk-noir-circuits-merkle-membership-to-solidity
moduleId: zk-noir-circuits
kind: implement
title: Take a Noir circuit all the way to a Solidity verifier
concepts: [noir-language, private-vs-public-inputs, noir-verifier-generation, constraint-counting]
spec: >
  Write a Noir circuit proving knowledge of a Merkle-tree leaf preimage: private inputs are the leaf
  preimage and the sibling path, the public input is the root. Compile it, record the ACIR opcode count
  and the backend gate count separately, and generate the Solidity verifier with the backend. Deploy the
  verifier in a Foundry project and write tests exercising it with a real proof. Then measure the
  verifier's gas — no published benchmark for the default proving scheme's verifier exists, so this
  number has to be your own. Pin both toolchain versions in the README and state what breaks if they
  are mismatched by one release.
acceptance:
  command: forge test --match-path test/NoirMerkleVerifier.t.sol -vvv --gas-report
  criteria:
    - A test passes a valid proof with the correct public root and asserts verification succeeds
    - A test passes the same proof with a root differing by one bit and asserts verification fails
    - The gas report records measured verification gas, and the README states it as a measured figure with the toolchain versions that produced it
    - The README lists ACIR opcode count and backend gate count as two separate numbers with a sentence on why they differ
hints:
  - The generated verifier's public-input ordering is derived from the circuit. Feed the inputs in exactly that order, or you will verify a different statement than you intended.
  - Recompiling the circuit changes the verification key baked into the generated contract. Regenerate and redeploy together, always.
  - If the two counts you record move in opposite directions when you optimise, you have found the point of this exercise. Proving cost follows the gate count.
difficulty: 4
