id: zk-noir-circuits-unconstrained-hint-forgery
moduleId: zk-noir-circuits
kind: break
title: Prove a false statement by forgetting to constrain a hint
concepts: [unconstrained-functions, unconstrained-is-untrusted, compute-vs-verify-asymmetry, everything-is-a-constraint]
spec: >
  Write a Noir circuit that takes a public input x and proves the prover knows its square root. Compute
  the root in an unconstrained function and — deliberately — return it without constraining
  result * result == x. Then supply a witness where the unconstrained function returns an arbitrary
  value of your choosing and show the circuit still satisfies and a proof still verifies, meaning you
  have proved a false statement. Add the single missing constraint and show the same witness now fails.
  Keep both circuit versions in the repository. Record the gate count of each version so you can see
  what the missing check actually cost. Pin both the compiler and the backend versions in the README.
acceptance:
  command: nargo test --show-output
  criteria:
    - A test against the unsound circuit passes with a hint value that is not a square root of the public input
    - A test against the fixed circuit asserts the same witness fails
    - A test asserts the fixed circuit still accepts a genuine square root, so the fix did not simply break the circuit
    - The README records the gate count of both versions and the pinned compiler and backend versions
hints:
  - The unconstrained function does not need to be honest. You control witness generation, so make it return something wrong on purpose.
  - Nothing in the toolchain will warn you. The circuit compiles, satisfies, and proves — the statement it proves is just not the one you meant.
  - Compare the two gate counts. The difference is the price of the check you forgot, and it is usually small enough to be embarrassing.
difficulty: 3
