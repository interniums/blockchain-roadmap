id: zk-noir-circuits-when-a-circuit-wins
moduleId: zk-noir-circuits
grain: block
kind: measure
title: Write the same statement twice and find where the circuit beats the machine
difficulty: 4
concepts: [circuit-vs-zkvm-tradeoff, when-circuit-wins, acir, barretenberg-backend, noir-maturity]
spec: >
  A hand-written circuit and a general machine can prove the same statement. Establish, by measurement,
  where each one wins.

  THE SAME STATEMENT, TWICE. Pick something with a tight arithmetic core — a Merkle inclusion proof over a
  fixed depth is ideal. Implement it as a circuit and as a program for a general prover. Report, for both:
  proving time, proof size, verification cost, and the developer time it took you. That last column is data,
  not a joke, and omitting it is how this comparison usually goes wrong.

  THE CROSSOVER. Scale the statement — deeper trees, more inclusions — and plot proving cost for both
  approaches. Find where the lines cross, or establish that they do not, and say which property of the
  computation drives the result.

  WHAT IS UNDER IT. Dump the intermediate representation your circuit compiles to and report its constraint
  count. Then optimise one part of the circuit and show the constraint count fall, with the proving time
  following. That link — constraints down, time down — is what makes circuit work tractable and worth
  seeing directly.

  MATURITY. Then the honest part: record every rough edge you hit — a missing standard-library function, an
  unhelpful error, a breaking change between versions, a gap in the docs. Then state what you would need
  before putting this in production, and whether that is a small list.
acceptance:
  criteria:
    - The same statement is implemented as a circuit and as a program for a general prover
    - Proving time, proof size, verification cost and developer time are reported for both
    - The statement is scaled with proving cost plotted for both approaches
    - The crossover is located or its absence established, with the driving property of the computation named
    - The intermediate representation is dumped with its constraint count reported
    - One optimisation lowers the constraint count with proving time following
    - Every rough edge encountered is recorded
    - A production-readiness list is stated with a verdict on its length
hints:
  - Record developer time as you go. Reconstructing it afterwards always favours whichever you did second, and this comparison is mostly about that column.
  - The constraint count is the number to optimise against, not the proving time. It is deterministic and fast to read, and the time follows it.
  - Keep the rough-edge log honest, including the things that were your fault. A list of only tooling problems is not a maturity assessment.
