id: zk-onchain-verification-capstone-a-proof-is-not-permission
moduleId: zk-onchain-verification
grain: module
writeUp: >
  Find a live proof-consuming contract on a block explorer and answer three questions in writing: what do its public inputs bind to, who can replace the verifier and after what delay, and what fraction of the system's L1 cost is verification versus data. Then say which of the three you would have got wrong before this module, and why.
coversConcepts:
  - verifier-contract
  - public-inputs-binding
  - proof-replay
  - groth16-verifier-cost
  - plonk-verifier-cost
  - pairings-dominate-gas
  - batch-pairing-check
  - recursive-aggregation-onchain
  - aggregation-layer
  - verify-vs-reexecute
  - verification-floor
  - data-cost-vs-proof-cost
  - proving-cost-not-gas-cost
  - verifier-upgradeability-risk
  - native-rollups
kind: break
title: Steal from a contract whose proof verified correctly
difficulty: 4
concepts: [verifier-contract, public-inputs-binding, proof-replay, groth16-verifier-cost, plonk-verifier-cost, pairings-dominate-gas, batch-pairing-check, recursive-aggregation-onchain, verify-vs-reexecute, verification-floor, data-cost-vs-proof-cost, proving-cost-not-gas-cost, verifier-upgradeability-risk]
spec: >
  A verifier is a pure function. Every bug worth having in this area is in the contract that calls it, and
  this exercise is to write both bugs and then price the thing properly.

  THE UNBOUND INPUT. Build a payout contract that verifies a proof and pays out. Leave a public input
  unbound — the recipient, or the amount — and take the money with a proof that verifies perfectly. Then
  fix the binding and show the same attack failing. A comment states which input was unbound and what the
  verifier was and was not asserting.

  THE REPLAY. Now make the proof itself valid, bound, and replayable: claim twice with the same proof.
  Fix it, and state what your fix costs per claim in gas and in storage.

  WHERE THE GAS GOES. Profile the verifier. Report what fraction is pairings, and show the verification
  floor — the gas you pay before any input-specific work. Compare a Groth16 and a PLONK verifier for the
  same statement and report both totals and both floors.

  MANY PROOFS, ONE COST. Implement a batched pairing check over N proofs and plot gas per proof against N.
  State the N at which the batching saves more than it costs in added complexity. Then describe, without
  necessarily implementing it, what recursive aggregation would change about that curve.

  VERIFY VERSUS RE-EXECUTE. For one concrete statement, compute both: the gas to verify a proof, and the
  gas to just re-execute the computation on chain. Say which wins and at what size the answer flips — this
  is the break-even nobody puts on the slide.

  THE OTHER COSTS. Separate three numbers that get conflated: verification gas, the calldata cost of the
  public inputs and the proof, and the off-chain proving cost in dollars. Report all three for one claim.

  THE ADMIN. Finally: find the upgrade path on your own verifier and state what the proofs are worth if the
  verifier can be replaced. Then say what you would do about it.
acceptance:
  command: forge test --junit --match-path test/capstone/ProofConsumption.t.sol
  criteria:
    - A proof that verifies correctly drains the contract via an unbound public input, with the input named in a comment
    - Binding the input makes the same attack fail
    - A bound, valid proof is successfully replayed, then prevented, with the fix's per-claim gas and storage cost stated
    - The verifier is profiled with the pairing fraction and the verification floor reported
    - Groth16 and PLONK verifiers for the same statement are compared on total and floor
    - A batched pairing check is implemented with gas per proof plotted against N and a break-even N stated
    - The effect of recursive aggregation on that curve is described
    - Verification gas and native re-execution gas are computed for one statement, with the size at which the answer flips
    - Verification gas, public-input and proof calldata cost, and off-chain proving cost in dollars are reported separately for one claim
    - The verifier's upgrade path is found and what the proofs are worth under it is stated, with a proposed mitigation
hints:
  - Write the unbound-input exploit before the correct version. The lesson is that the verifier returned true the whole time, and you only feel that if you watched it happen.
  - The verification floor is the number to quote when someone says proofs are cheap. Measure it with the smallest possible statement so the floor is all that is left.
  - Keep proving cost in dollars in a separate column from gas forever. They are paid by different parties in different currencies, and conflating them is how zk cost claims become unfalsifiable.
