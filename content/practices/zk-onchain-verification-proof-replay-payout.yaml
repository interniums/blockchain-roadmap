id: zk-onchain-verification-proof-replay-payout
moduleId: zk-onchain-verification
kind: break
title: Drain a payout contract by replaying a valid proof, then by supplying your own root
concepts: [proof-replay, public-inputs-binding, verifier-contract]
spec: >
  Build a Foundry project with a deployed verifier and a claim contract that pays out when the verifier
  returns true. Introduce two independent defects. First, the claim contract records nothing about
  which proofs it has already honoured, so the same valid proof can be submitted repeatedly. Second,
  the claim contract accepts the Merkle root as a function argument and passes it straight through as a
  public input, instead of using the root it has stored. Write an exploit test for each: one drains the
  contract by resubmitting one proof, the other claims against a root the attacker chose and proved
  against. Then fix both — a nullifier mapping keyed on the proof's binding public input, and reading
  the root from the contract's own storage — and show each exploit now reverts, while an honest claim
  still succeeds.
acceptance:
  command: forge test --match-path test/ProofReplay.t.sol -vvv
  criteria:
    - A test submits one valid proof twice against the vulnerable contract and asserts the balance decreased twice
    - A test claims against an attacker-supplied root on the vulnerable contract and asserts the payout succeeded
    - Against the fixed contract, the replay reverts and the attacker-root claim reverts, each with a distinct revert reason
    - A test asserts an honest first-time claim still succeeds against the fixed contract
hints:
  - The verifier is not the buggy contract. Read the caller.
  - For the second exploit you do not need to break anything cryptographic — you generate a perfectly valid proof, just about a tree you built yourself.
  - Your nullifier has to be derived from something in the public inputs that is unique per claim. If you key it on the proof bytes, ask yourself whether the proof is deterministic.
difficulty: 3
