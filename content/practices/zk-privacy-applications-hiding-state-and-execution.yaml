id: zk-privacy-applications-hiding-state-and-execution
moduleId: zk-privacy-applications
grain: block
kind: implement
title: Build a private balance, then decide who is allowed to look
difficulty: 4
concepts: [account-model-leaks-everything, note-commitment-model, private-execution-vs-private-state, viewing-key, selective-disclosure, association-set, privacy-compliance-equilibrium, asp-centralisation-risk, developer-liability-risk]
spec: >
  Privacy cannot be added to a balance, and this exercise is to find out why by trying and then doing it
  properly.

  WHY NOT. Take a plain balance mapping and enumerate everything an observer learns from one transfer:
  amounts, parties, timing, and what they learn about future transfers. Then try to hide it with encryption
  alone and state what still leaks — the leak is structural rather than cryptographic and naming it is the
  point.

  NOTES INSTEAD. Implement a note-commitment model: value held as commitments, spent by publishing a
  one-way derived value, with the link between spend and note unrevealed. Transfer twice and show an
  observer cannot connect the two. Report what they can still see.

  TWO DIFFERENT THINGS. Then separate the properties: build one flow where the state is hidden but the
  computation is public, and one where the computation is hidden too. State what each requires and what each
  costs, and give an application that needs the second and one that only needs the first.

  WHO MAY LOOK. Implement a viewing key: a third party who can read your history and cannot spend. Then
  selective disclosure — prove one property of your history without revealing the rest. Then the harder
  design question: implement membership in an association set and state who defines that set, what it costs
  to be excluded, and what happens to a user excluded wrongly.

  THE LIABILITY. Close with what you take on by shipping it: state the centralisation risk in the set
  operator and the exposure of the person who deployed the contract. Two paragraphs, specific rather than
  hedged.
acceptance:
  criteria:
    - Everything an observer learns from one plain transfer is enumerated, including what it reveals about future transfers
    - Encryption alone is shown insufficient with the structural leak named
    - A note-commitment model is implemented with two transfers an observer cannot link
    - What the observer can still see is reported
    - One flow hides state with public computation and one hides computation too, with requirements and costs for each
    - An application needing each is named
    - A viewing key grants read without spend
    - Selective disclosure proves one property without revealing the rest
    - Association-set membership is implemented with who defines the set, the cost of exclusion, and the wrongly-excluded case
    - Two specific paragraphs cover set-operator centralisation and deployer exposure
hints:
  - Do the enumeration before writing any privacy code. The list is longer than people expect and it is what the rest of the exercise is trying to shorten.
  - The structural leak is the graph, not the contents. Encryption hides amounts and leaves the shape.
  - The wrongly-excluded user is the design question that decides whether this is shippable. Answer it concretely rather than noting it as future work.
