id: zk-privacy-applications-link-your-own-withdrawal
moduleId: zk-privacy-applications
kind: break
title: Deanonymise your own shielded pool two different ways
concepts: [nullifier, nullifier-must-be-deterministic-and-hiding, metadata-leakage, anonymity-set, relayer]
spec: >
  Build a minimal fixed-denomination shielded pool in Foundry: deposits append a note commitment to an
  on-chain Merkle tree, withdrawals present a proof of membership and publish a nullifier that the
  contract records. Then break it twice. First, cryptographically: implement the nullifier as a hash of
  the note commitment rather than of the spending secret, and write a script that reconstructs the
  deposit-to-withdrawal mapping from public data alone. Second, operationally: with the correct
  nullifier in place, deposit from address A, withdraw to a fresh address B, then fund B's gas from A,
  and write the heuristic that recovers the A-to-B link anyway. Fix the first by deriving the nullifier
  from the spending key, and the second by routing the withdrawal through a relayer. Then compute the
  effective anonymity set for one withdrawal — deposits of the same denomination inside a plausible
  time window — and state your filtering assumptions.
acceptance:
  command: forge test --match-path test/ShieldedPoolLinkage.t.sol -vvv
  criteria:
    - A test asserts an honest withdrawal succeeds and a replayed nullifier reverts
    - A test using the commitment-derived nullifier reconstructs the full deposit-to-withdrawal mapping and asserts it is exactly correct
    - The same test against the key-derived nullifier asserts no such mapping can be built from the emitted events
    - A test or script recovers the A-to-B link from the gas-funding transaction and reports the effective anonymity set as a number smaller than the total deposit count, with the filtering assumptions stated
hints:
  - Both nullifier designs prevent double-spends. Only one of them also prevents an observer matching your deposit to your withdrawal.
  - The second attack needs no cryptanalysis at all. Look at where the withdrawing address got the ETH it paid gas with.
  - When you compute the effective anonymity set, be honest about the time window. Narrowing it from a week to an hour usually does more damage than any cryptographic weakness would.
difficulty: 5
