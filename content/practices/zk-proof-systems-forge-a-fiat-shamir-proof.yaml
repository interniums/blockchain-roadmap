kind: break
title: Forge a proof against a Fiat–Shamir transform that hashes too little
concepts: [non-interactivity-fiat-shamir, argument-of-knowledge, proof-system-relation]
spec: >
  Start from a toy interactive sigma protocol — knowledge of a discrete log is enough — implemented in
  Rust with a deliberately weak Fiat–Shamir transform that derives the challenge by hashing only the
  public statement and omitting the prover's first message. Write a forger that exploits the omission:
  because the challenge no longer depends on the commitment, the forger can pick the challenge first
  and construct a transcript backwards for a statement it does not know a witness for. Show the
  verifier accepting it. Then fix the transform so the challenge hashes the full transcript including
  the prover's first message and any domain separator, and show the same forger now fails. Keep both
  transforms in the codebase behind a flag so the tests can exercise each.
acceptance:
  command: cargo test --test fiat_shamir -- --nocapture
  criteria:
    - A test named for forgery constructs a transcript for a statement with no known witness and asserts the weak verifier accepts it
    - The same forged transcript is asserted to be rejected by the fixed verifier
    - An honest proof is asserted to be accepted by both verifiers, proving the fix did not simply break verification
    - A comment or test name states which value was missing from the hashed transcript
hints:
  - Work out what the prover is still free to choose after the challenge is fixed. That freedom is the attack.
  - The forger does not need the secret. It needs to choose the response first and then solve for a first message that makes the verification equation hold.
  - The fix is not "use a stronger hash". It is "hash everything the prover could still choose", including a domain separator so transcripts from different protocols cannot be confused.
difficulty: 4
