id: zk-proof-systems-forge-a-fiat-shamir-proof
moduleId: zk-proof-systems
grain: module
writeUp: >
  Take a system you have read about that is marketed as "zero-knowledge". Work out which of the two properties it actually uses, and write down what an observer of its on-chain data can learn about an individual user. If the answer is "everything except the execution trace", say why the name is still commercially useful — and what you would call it instead.
