id: zk-proof-systems-prove-with-one-verify-with-another
moduleId: zk-proof-systems
grain: block
kind: measure
title: Find the asymmetry that makes everyone wrap one proof in another
difficulty: 4
concepts: [trusted-setup, universal-vs-circuit-specific-setup, transparent-setup, proof-size-verify-cost-tradeoff, prover-verifier-asymmetry, recursion, proof-aggregation]
spec: >
  Nearly every production system proves with one scheme and verifies with a different one. Establish why
  with numbers.

  THE TRADEOFF TABLE. For at least three schemes, report proof size, verification cost on chain, and prover
  cost for the same statement. Include one with a transparent setup and one requiring a structured one. The
  table should make the asymmetry visible: the scheme that is cheapest to prove with is not the one that is
  cheapest to verify.

  THE SETUP QUESTION. For the scheme requiring a setup, establish who generated the parameters and what
  would follow from that secret having been retained. Then state the difference between a setup usable for
  any circuit and one tied to a specific circuit, in terms of what has to happen when your circuit changes.
  For Ethereum's own ceremony, report the participant count and say what property that number is meant to
  provide.

  THE WRAP. Then do it: take a proof from the prover-friendly scheme and verify it inside a circuit of the
  verifier-friendly one, producing a single outer proof. Report the outer proof's size and verification cost
  against the inner one's. If you cannot run it end to end, report the published figures and state exactly
  which step you could not execute.

  MANY INTO ONE. Finally, aggregate several proofs into one and plot verification cost per proof against
  the number aggregated. State where the curve flattens and what that implies for a system batching
  submissions.
acceptance:
  criteria:
    - Proof size, on-chain verification cost and prover cost are reported for at least three schemes on the same statement
    - At least one transparent-setup and one structured-setup scheme are included
    - The table shows the cheapest to prove with is not the cheapest to verify
    - Who generated the parameters is established, with the consequence of a retained secret
    - Universal and circuit-specific setups are distinguished by what happens when the circuit changes
    - Ethereum's ceremony participant count is reported with the property it is meant to provide
    - A proof is verified inside another scheme's circuit producing a single outer proof, with sizes and costs compared, or the unexecutable step is named
    - Aggregation is plotted as verification cost per proof against count, with the flattening point and its implication stated
hints:
  - Build the table before reading anyone's recommendation. The asymmetry is obvious in the numbers and the recommendations then read as consequences rather than opinions.
  - For the ceremony, the participant count matters because the secret is safe if any single participant was honest. State it that way rather than as a scale claim.
  - If the recursion step is out of reach, say which one precisely. "Could not run recursion" is much less useful than naming the step and the resource it needed.
