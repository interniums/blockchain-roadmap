id: zk-proof-systems-two-properties-not-one
moduleId: zk-proof-systems
grain: block
kind: write
title: Separate succinct from zero-knowledge, and say which one rollups use
difficulty: 3
concepts: [succinctness, zero-knowledge-property, zk-rollups-are-not-zk, arithmetization, zkvm-vs-circuit]
spec: >
  Two properties travel under one prefix and most systems only want one of them. Take them apart.

  DEFINE BOTH SEPARATELY. State succinctness and zero-knowledge as separate claims, each in one sentence,
  and then give a concrete example of a system with each without the other. Both directions exist and both
  examples should be real.

  WHICH ONE ROLLUPS USE. Take a live validity rollup and establish which property it actually relies on.
  Then answer directly: is anything about its transactions hidden? Support the answer with what is posted on
  L1 — if the transaction data is published, say so, and then state what the proof is for. This is the
  naming problem the module exists to fix and the write-up should be blunt about it.

  ARITHMETIZATION. Take one very small computation — a comparison, or a single field operation — and write
  it out as constraints by hand. Show the witness and show one constraint failing for a wrong witness. It
  does not have to be efficient; it has to be yours.

  TWO ROUTES. Then state the difference between expressing that computation as constraints yourself and
  expressing it as a program a general machine proves. Give the cost of each in the two currencies that
  matter — developer effort and proving cost — and name the property of a computation that decides which
  route is right.
acceptance:
  criteria:
    - Succinctness and zero-knowledge are each stated as a separate one-sentence claim
    - A real system with each property but not the other is given, in both directions
    - A live validity rollup is examined with the property it relies on established
    - Whether anything about its transactions is hidden is answered directly, supported by what is posted on L1
    - A small computation is written out as constraints by hand with its witness shown
    - One constraint is shown failing for a wrong witness
    - The two routes are compared in developer effort and proving cost
    - The property of a computation that decides the route is named
hints:
  - Do the hand arithmetization on something genuinely tiny, like proving a value is a bit. Anything larger and you will spend the exercise on bookkeeping rather than on the idea.
  - The blunt answer about rollups is that they use succinctness and publish everything. Write it plainly; the hedged version is how the confusion persists.
  - The deciding property is how regular the computation is. A tight, repeated arithmetic core rewards a circuit; branchy general logic rewards a machine.
