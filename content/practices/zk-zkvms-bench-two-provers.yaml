id: zk-zkvms-bench-two-provers
moduleId: zk-zkvms
grain: block
kind: measure
title: Prove the same program on two zkVMs and publish the numbers with their units
concepts: [cpu-vs-gpu-proving, proof-vs-execution-cost, sp1, risc-zero]
spec: >
  Take one non-trivial guest program — a fixed-iteration hash chain is a good choice because it scales
  cleanly — and implement it for both SP1 and RISC Zero. Run each at three workload sizes on the same
  machine. Record, for every run: proving wall-clock in seconds, peak resident memory in gigabytes,
  proof size in bytes, and the native execution time of the same computation in milliseconds. Record
  the machine: CPU model, core count, RAM, and whether a GPU was used. Emit the results as a CSV plus a
  short written recommendation naming which system you would use for a stated product requirement and
  why. Every number in the output must carry its unit; a table cell reading "12" is a failed run.
acceptance:
  command: cargo run --release --bin bench -- --out results.csv && python3 scripts/check_results.py results.csv
  criteria:
    - results.csv contains one row per (system, workload size) with columns for prove_seconds, peak_mem_gb, proof_bytes, native_exec_ms
    - The checker script fails if any cell is empty, if any column header lacks a unit suffix, or if the hardware block is missing
    - A README section states the CPU, core count, RAM, and GPU presence for the machine that produced the numbers
    - A written recommendation names one product requirement and the system it selects, with the measured figure that decided it
hints:
  - Run native execution first. Without it you have proving times and no idea what multiple of the underlying computation they represent.
  - If one system is dramatically slower, check whether it is falling back to CPU. That single fact usually explains more of the gap than the proof system does.
  - Published per-proof dollar figures are vendor-adjacent and workload-specific. Your own three numbers, with the machine named, are worth more than any of them.
difficulty: 3
