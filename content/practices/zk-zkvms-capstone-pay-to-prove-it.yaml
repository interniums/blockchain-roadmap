kind: measure
title: Find the size of computation where proving beats re-executing
difficulty: 4
concepts: [zkvm, guest-program, proof-vs-execution-cost, onchain-verification, sp1, risc-zero, sp1-hypercube, cpu-vs-gpu-proving, circuits-are-the-descent]
spec: >
  The whole economic case for a zkVM is one inequality: verification is cheap and constant while
  execution is not. Establish where it actually crosses over, with your own numbers.

  THE GUEST. Write one ordinary Rust program whose work you can scale by a parameter — a Merkle root over
  N leaves, or N iterations of a hash. Nothing exotic; the point is that it is ordinary Rust.

  PROVE IT TWICE. Run it under two provers. Report, per prover and per input size: proving wall-clock,
  peak memory, proof size, and verification gas on chain. Six sizes spanning at least two orders of
  magnitude.

  THE CROSSOVER. Plot on-chain verification cost against the gas the same computation would cost executed
  natively in the EVM. State the input size at which proving wins, and state it as a number with the
  assumptions beside it — gas price, proving hardware, prover version.

  WHERE THE PROOF IS CONSUMED. Deploy a verifier and verify one proof on chain. Report the gas. Then show
  the constancy claim: verification gas barely moves across your six input sizes while native execution
  gas grows. That contrast is the module's entire argument and it should be one chart.

  THE BENCHMARKS DISAGREE. Your two provers will not agree with each other or with their own published
  numbers. Pick one discrepancy and explain it: different hardware, a different proof system generation, a
  different definition of what is being timed, or recursion being counted or not.

  CPU VERSUS GPU. Run one configuration on both if you can, and report the ratio. If you cannot, say what
  you would need and what the published ratio claims.

  WHY CIRCUITS COME LATER. Close with one paragraph: for your program, what would writing it as a circuit
  buy, and what would it cost you in effort? This is the argument for the rest of the track.
acceptance:
  criteria:
    - One ordinary Rust guest program with a scalable work parameter
    - Proving time, peak memory, proof size and on-chain verification gas reported for two provers across six input sizes over at least two orders of magnitude
    - Verification cost plotted against native EVM execution cost for the same computation
    - The crossover input size is stated as a number with gas price, hardware and prover version beside it
    - One proof is verified on chain with the gas reported
    - Verification gas is shown near-constant across input sizes while native execution gas grows
    - One discrepancy between prover benchmarks is identified and explained
    - A CPU-versus-GPU ratio is measured, or the requirement to measure it is stated alongside the published claim
    - One paragraph states what writing the program as a circuit would buy and cost
hints:
  - Choose the guest program so its work parameter maps to something the EVM can also do, or you will have nothing to compare the verification cost against.
  - Record the prover version and the exact hardware in the same table as the numbers. Every published zkVM benchmark that is hard to reproduce is hard to reproduce because someone omitted one of those.
  - The near-constant verification cost is the finding. If your measurements show it growing noticeably, check whether you are including calldata for the public inputs — that part does grow, and separating it is the honest presentation.
