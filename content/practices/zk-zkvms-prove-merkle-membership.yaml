id: zk-zkvms-prove-merkle-membership
moduleId: zk-zkvms
kind: implement
title: Prove a Merkle membership off-chain and verify it on-chain
concepts: [zkvm, guest-program, onchain-verification]
spec: >
  Write an SP1 guest program in Rust that takes a leaf value and a Merkle path as private inputs and a
  Merkle root as a public input, recomputes the root from leaf plus path, and asserts it equals the
  public root. Commit the root and a caller-supplied nonce as the program's public values. Build the
  host program that supplies a real path from a tree you construct, generate a proof, and export the
  proof bytes plus public values. Then deploy the generated Solidity verifier in a Foundry project and
  write tests that submit the proof. Pin the SP1 toolchain version in the repository and record it in
  the README, because the guest, the prover and the verifier contract must all come from the same
  release. Report proving wall-clock in seconds, peak memory in gigabytes, and proof size in bytes.
acceptance:
  command: forge test --match-path test/Sp1MerkleVerifier.t.sol -vvv
  criteria:
    - A test submits the real proof and the matching public values and the verifier returns success
    - A second test flips one byte of the proof and asserts the call reverts or returns false
    - A third test submits the unmodified proof with a different Merkle root as the public input and asserts it fails
    - The README records the pinned SP1 version plus proving wall-clock in seconds, peak RSS in GB, and proof size in bytes
hints:
  - The leaf and the path are private; the root is public. Write down which side of that line every value sits on before you write any Rust.
  - The verifier contract checks a proof against a verification key derived from the compiled guest. Recompiling the guest changes that key, so regenerate the key whenever the guest changes.
  - Your third test is the interesting one — it should fail not because the proof is malformed but because the statement it proves is about a different root than the one you supplied.
difficulty: 3
