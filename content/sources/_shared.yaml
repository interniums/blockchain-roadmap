# Sources cited from more than one track.
#
# A source declared in several per-track files was resolved by last-write-wins, so which copy the
# app actually used came down to filename order. That was not academic: 15 of the 28 duplicated EIPs
# carried a hard-fork ACTIVATION date in `publishedAt` where the EIP's own `created:` header says
# otherwise, and the record that won was arbitrary.
#
# Each entry below is the single canonical record. EIP titles and dates come from the `created:` and
# `title:` headers in ethereum/EIPs and ethereum/ERCs. Section detail that used to ride along in a
# title ("— SSZ, Casper FFG, slash_validator") belongs to the citation, not the source.
#
# A source cited by only one track still lives in that track's file. Add here only on the second
# track that needs it.
