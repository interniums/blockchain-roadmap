trackId: fundamentals
sources:
  # New sources introduced by the 2026-08-26 depth pass over the `fundamentals-crypto` module
  # (lessons 2-9; lesson 1 was deepened separately and uses prose-fundamentals-crypto-l1.yaml).
  #
  # Every URL below was fetched with curl on 2026-08-26 and the BODY was read to confirm it
  # contains the claim it is cited for — not merely that it returned 200.
  #
  # Ids already defined elsewhere in content/sources/ are NOT redefined here and are reused by
  # id: yellow-paper, nist-fips-202, nist-fips-186-5, nist-sp-800-107, eip-2, eip-155, eip-191,
  # eip-712, eip-2612, eip-7702, eip-7951, rfc-6962, rfc-6979, sha3-vs-keccak,
  # cyfrin-signature-standards, arxiv-signature-replay, eip-2-malleability-thread,
  # eip-7951-magicians, oz-ecdsa-source, oz-merkleproof-source, oz-merkle-tree-js,
  # oz-merkleproof-issue-3091, rareskills-merkle-second-preimage,
  # nethermind-merkle-second-preimage, nethermind-encodepacked-collisions,
  # scsfg-abi-hash-collisions, c4-merkle-tree-extension, fsa-merkle-airdrop-study,
  # zcash-protocol-spec, w3c-webauthn-3, ethereum-org-history, execution-specs-ecrecover,
  # execution-specs-p256verify, execution-specs-osaka-gas, execution-specs-osaka-transactions,
  # ssz-specs-merkleization.
  #
  # NOT ADDED, and why:
  #   - A Solidity-only P-256 verifier gas figure. No measured number exists in MEASURED.md and
  #     the circulating figures are unattributed. Left as an exercise in the lesson.
  #   - Any RIP-7212 / L2 secp256r1 price. CONFLICTS.md forbids publishing one.
  #   - sciencedirect.com returns 403 to curl, so `fsa-merkle-airdrop-study` (already defined in
  #     fundamentals.yaml) is cited only for the existence and subject of the study, whose title
  #     and venue were re-confirmed on 2026-08-26 via the Crossref record for
  #     DOI 10.1016/j.bcra.2025.100368. No number is taken from it.

  # ---- Normative specs ----

  - id: sec1-ecc
    tier: spec
    title: "SEC 1: Elliptic Curve Cryptography, Version 2.0 (§4.1.6 Public Key Recovery Operation — Q = r⁻¹(sR − eG), several candidate keys, motivated by bandwidth-constrained transmission)"
    url: https://www.secg.org/sec1-v2.pdf
    publishedAt: "2009-05"
    retrievedAt: "2026-08-26"
    verifiedAt: "2026-08-26"
    vendor: false

  - id: sec2-curve-params
    tier: spec
    title: "SEC 2: Recommended Elliptic Curve Domain Parameters, Version 2.0 (§2.4.1 secp256k1 as a Koblitz curve with a=0, b=7; §2.4.2 secp256r1 as verifiably random with a=p−3 and b derived from seed S per ANSI X9.62)"
    url: https://www.secg.org/sec2-v2.pdf
    publishedAt: "2010-01"
    retrievedAt: "2026-08-26"
    verifiedAt: "2026-08-26"
    vendor: false

  - id: eip-1271
    tier: spec
    title: "ERC-1271: Standard Signature Validation Method for Contracts (isValidSignature returns the magic value 0x1626ba7e; contracts do not possess a private key)"
    url: https://eips.ethereum.org/EIPS/eip-1271
    publishedAt: "2018-07"
    retrievedAt: "2026-08-26"
    verifiedAt: "2026-08-26"
    vendor: false

  - id: eip-2098
    tier: spec
    title: "ERC-2098: Compact Signature Representation (64-byte yParityAndS form; the top bit of s is free because of the Homestead low-s constraint)"
    url: https://eips.ethereum.org/EIPS/eip-2098
    publishedAt: "2019-03"
    retrievedAt: "2026-08-26"
    verifiedAt: "2026-08-26"
    vendor: false

  - id: eip-5267
    tier: spec
    title: "ERC-5267: Retrieval of EIP-712 domain (the eip712Domain() accessor and its fields bitmap; EIP-712 never specified how a contract publishes its domain)"
    url: https://eips.ethereum.org/EIPS/eip-5267
    publishedAt: "2022-07"
    retrievedAt: "2026-08-26"
    verifiedAt: "2026-08-26"
    vendor: false

  - id: eip-1803
    tier: spec
    title: "EIP-1803: Rename opcodes for clarity [STAGNANT] (proposes SHA3 (0x20) → KECCAK256; records that the opcode's original mnemonic was wrong)"
    url: https://eips.ethereum.org/EIPS/eip-1803
    publishedAt: "2017-07"
    retrievedAt: "2026-08-26"
    verifiedAt: "2026-08-26"
    vendor: false

  - id: bip-62
    tier: spec
    title: "BIP-62: Dealing with malleability [Closed] (enumerates nine sources of transaction malleability; inherent ECDSA s → n−s is source 5, and sources 8 and 9 cannot be fixed by consensus rules)"
    url: https://github.com/bitcoin/bips/blob/master/bip-0062.mediawiki
    publishedAt: "2014-03"
    retrievedAt: "2026-08-26"
    verifiedAt: "2026-08-26"
    vendor: false

  - id: bip-146
    tier: spec
    title: "BIP-146: Dealing with signature encoding malleability [Closed] (the LOW_S rule: s at most half the curve order, with the explicit replacement S' = curve_order − S)"
    url: https://github.com/bitcoin/bips/blob/master/bip-0146.mediawiki
    publishedAt: "2016-08"
    retrievedAt: "2026-08-26"
    verifiedAt: "2026-08-26"
    vendor: false

  # ---- Canonical docs / library and client source ----

  - id: go-x-crypto-sha3
    tier: canonical-docs
    title: "golang.org/x/crypto/sha3 package reference (NewLegacyKeccak256: 'Only use this function if you require compatibility with an existing cryptosystem that uses non-standard padding')"
    url: https://pkg.go.dev/golang.org/x/crypto/sha3
    publishedAt: "rolling"
    retrievedAt: "2026-08-26"
    verifiedAt: "2026-08-26"
    vendor: false

  - id: solidity-050-breaking
    tier: canonical-docs
    title: "Solidity docs — Solidity v0.5.0 Breaking Changes ('sha3 is now disallowed (in favor of keccak256)')"
    url: https://docs.soliditylang.org/en/latest/050-breaking-changes.html
    publishedAt: "rolling"
    retrievedAt: "2026-08-26"
    verifiedAt: "2026-08-26"
    vendor: true

  - id: bitcoin-core-merkle
    tier: canonical-docs
    title: "Bitcoin Core — src/consensus/merkle.cpp (in-source warning about CVE-2012-2459: duplicating the last hash on odd levels makes two different transaction lists produce the same root)"
    url: https://github.com/bitcoin/bitcoin/blob/master/src/consensus/merkle.cpp
    publishedAt: "rolling"
    retrievedAt: "2026-08-26"
    verifiedAt: "2026-08-26"
    vendor: false

  - id: oz-eip712-source
    tier: canonical-docs
    title: "OpenZeppelin Contracts — EIP712.sol (caches the domain separator as an immutable together with the chain id, and rebuilds it when block.chainid differs)"
    url: https://github.com/OpenZeppelin/openzeppelin-contracts/blob/master/contracts/utils/cryptography/EIP712.sol
    publishedAt: "rolling"
    retrievedAt: "2026-08-26"
    verifiedAt: "2026-08-26"
    vendor: true

  - id: ens-eth-registrar-controller
    tier: canonical-docs
    title: "ENS — ETHRegistrarController.sol (commit-reveal registration: the commitment hashes the whole Registration struct, including owner and a bytes32 secret, and is bounded by minCommitmentAge/maxCommitmentAge)"
    url: https://github.com/ensdomains/ens-contracts/blob/staging/contracts/ethregistrar/ETHRegistrarController.sol
    publishedAt: "rolling"
    retrievedAt: "2026-08-26"
    verifiedAt: "2026-08-26"
    vendor: false

  # ---- Primary analysis ----

  - id: oz-multiproof-advisory
    tier: primary-analysis
    title: "GHSA-wprv-93r4-jj2p / CVE-2023-34459 — MerkleProof multiproofs may allow proving arbitrary leaves for specific trees (OpenZeppelin Contracts; patched in 4.9.2)"
    url: https://github.com/OpenZeppelin/openzeppelin-contracts/security/advisories/GHSA-wprv-93r4-jj2p
    publishedAt: "2023-06"
    retrievedAt: "2026-08-26"
    verifiedAt: "2026-08-26"
    vendor: true

  - id: mtgox-malleability-arxiv
    tier: primary-analysis
    title: "Bitcoin Transaction Malleability and MtGox (Decker & Wattenhofer, ESORICS 2014) — measures the network for over a year and finds no widespread malleability attacks before the MtGox closure"
    url: https://arxiv.org/abs/1403.6676
    publishedAt: "2014-03"
    retrievedAt: "2026-08-26"
    verifiedAt: "2026-08-26"
    vendor: false

  - id: randao-manipulation-arxiv
    tier: primary-analysis
    title: "Optimal RANDAO Manipulation in Ethereum (Alpturer & Weinberg, AFT 2024) — computes the gain from withholding: 5% of stake proposes 5.048% of rounds, 10% proposes 10.19%, 20% proposes 20.68%"
    url: https://arxiv.org/abs/2409.19883
    publishedAt: "2024-09"
    retrievedAt: "2026-08-26"
    verifiedAt: "2026-08-26"
    vendor: false
