trackId: fundamentals
sources:
  # Sources introduced by the depth pass on fundamentals-state (26 Aug 2026).
  #
  # Everything else this module cites is reused by id from fundamentals.yaml,
  # fundamentals-state.yaml, fundamentals-crypto.yaml, evm.yaml, ledgers.yaml,
  # protocol.yaml, infra.yaml and solidity.yaml. Reused ids are NOT redefined here —
  # the loader merges all source files by id and the linter errors on a divergent duplicate.
  #
  # Note on execution-specs: the repository has been restructured since this project's
  # first research pass. `src/ethereum/merkle_patricia_trie.py` (id: execution-specs-mpt)
  # is live and now carries EMPTY_TRIE_ROOT as a literal constant; the state model has
  # been split into the two files below.

  - id: execution-specs-state
    tier: spec
    title: "ethereum/execution-specs — src/ethereum/state.py (commitment-agnostic state model: the PreState protocol, the three-field Account dataclass, EMPTY_CODE_HASH, BlockDiff)"
    url: https://github.com/ethereum/execution-specs/blob/master/src/ethereum/state.py
    publishedAt: "rolling"
    retrievedAt: "2026-08-26"
    verifiedAt: "2026-08-26"
    vendor: false

  - id: execution-specs-state-mpt
    tier: spec
    title: "ethereum/execution-specs — src/ethereum/state_mpt.py (the Merkle-Patricia-Trie-backed implementation of PreState: secured tries, per-trie default values, storage-trie deletion, compute_state_root)"
    url: https://github.com/ethereum/execution-specs/blob/master/src/ethereum/state_mpt.py
    publishedAt: "rolling"
    retrievedAt: "2026-08-26"
    verifiedAt: "2026-08-26"
    vendor: false

  - id: geth-trie-proof
    tier: canonical-docs
    title: "go-ethereum — trie/proof.go (Trie.Prove, VerifyProof, proofToPath; the absence-proof contract and the >=32-bytes-or-root rule for what enters a proof)"
    url: https://github.com/ethereum/go-ethereum/blob/master/trie/proof.go
    publishedAt: "rolling"
    retrievedAt: "2026-08-26"
    verifiedAt: "2026-08-26"
    vendor: false
