trackId: altvm
# Sources added while writing prose for the altvm-move and altvm-cosmos stub modules.
# Every url below was fetched live on 2026-08-26; the recorded url is the POST-REDIRECT url, and
# the body at that url contained the material cited.
#
# REDIRECTS FOUND AND FOLLOWED (recorded here so nobody re-adds the stale form):
#   docs.sui.io reorganised /concepts/* -> /develop/*:
#     /concepts/sui-move-concepts          -> /develop/write-move/sui-move-concepts
#     /concepts/object-ownership           -> /develop/objects/object-ownership
#     /concepts/transactions/prog-txn-blocks -> /develop/transactions/ptbs/prog-txn-blocks
#   aptos.dev drops the /en prefix: /en/network/blockchain/execution -> /network/blockchain/execution
#   aptos.dev/en/build/smart-contracts/book/global-storage-structure 308s OFF-HOST to
#     aptos-labs.github.io/move-book/global-storage.html — recorded at the github.io url.
#   docs.cosmos.network/sdk/v0.53/learn/intro/why-app-specific 30x-es to .../learn/intro/overview;
#     the app-specific argument lives on the overview page, so only the overview url is recorded.
#   docs.cometbft.com/v0.38/* 301s to docs.cosmos.network/cometbft, which does NOT carry the
#     one-third fault-tolerance statement. No CometBFT-docs source was added for that claim; the
#     Tendermint paper is cited instead.
#
# REUSED (defined elsewhere, cited by these modules, NOT redefined here):
#   move-book, move-language-repo, aptos-move-docs, sui-docs-concepts, sui-lutris,
#   cosmos-sdk-docs, cosmos-stack-roadmap-2026, ibc-spec, ibc-go-docs, cosmoslabs-eureka,
