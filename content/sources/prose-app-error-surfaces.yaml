  - id: measured-revert-surfaces-1-7-1
    tier: primary-analysis
    title: 'Measured while authoring `app-error-surfaces` on this machine — anvil / cast / forge 1.7.1 (commit 4072e487, built
      2026-05-08) with solc 0.8.36, optimizer off: raw revert bytes captured through a low-level-call prober for ten failure
      paths (require with a string, `revert CustomError(...)`, `require(cond, CustomError(...))`, bare `revert()`, `require(bool)`
      with no message, failed `assert`, subtraction underflow, division by zero, out-of-bounds index, `.pop()` on an empty
      array), plus a high-level call to an address with no code, a low-level call to the same address, and an out-of-gas call;
      `cast sig`, `cast 4byte` and `cast decode-error` output including the `--help` text naming openchain.xyz (`cast 4byte
      0x00000000` returned 83 signatures); a router measured to substitute its own `SwapFailed()` 0x81ceff30 for a bubbled
      0xcf479181; a proxy with a zero implementation slot measured to return success with zero bytes on a low-level call and
      an empty revert one frame up; `eth_call` and `eth_estimateGas` against an address with no code measured to SUCCEED (0x
      and 0x52a8); a four-byte collision brute-forced in the EVM with transient storage — `Err70699(uint256)` and `Err73134(uint256)`
      both hash to 0xc00eb440, found after 73,134 candidates; a non-monotonic `gasleft()` contract whose success set was bisected
      to [43,325 … 121,181] and [915,457 … ) with `cast estimate` returning 915,457; a self-recursing call chain measured
      at depths 0/5/10/20/40 for consumed gas (127,400 at depth 40) against the minimum gas limit that still succeeds (140,781),
      with real sends at both confirming status 0x0 and 0x1; the same estimate re-run after one successful call (140,781 →
      112,715); eth_call vs eth_estimateGas latency over 20 samples (3.8 ms vs 16.4 ms median); and raw `eth_estimateGas`
      / `eth_call` JSON-RPC error envelopes from anvil for a custom error, an `Error(string)`, a bare revert, an INVALID opcode,
      an unbounded loop and a zero-balance sender'
    url: https://github.com/foundry-rs/foundry/releases/tag/v1.7.1
    publishedAt: '2026-08-26'
    retrievedAt: '2026-08-26'
    verifiedAt: '2026-08-26'
    vendor: false
