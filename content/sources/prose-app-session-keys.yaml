trackId: app
# New sources introduced by the prose for module `app-session-keys`.
#
# Every URL below was fetched with `curl -sSL --max-time 25/30` on 2026-08-26, the FINAL effective
# URL was compared against the path requested, and the BODY was read for the exact claim cited.
# Notes from that pass, because several of them change what the lessons are allowed to say:
#
#   - eips.ethereum.org serves the status banner in the page body. Read directly: ERC-4337 is
#     "🎉 Final"; ERC-7715, ERC-7710, ERC-7579 and ERC-7562 all carry "⚠️ Draft". Nothing in this
#     module may describe the last four as settled.
#   - ERC-7715's method is `wallet_requestExecutionPermissions` in the current spec text. The
#     Ethereum Magicians discussion link on the same page is still titled
#     "erc-7715-grant-permissions-from-wallets", which is where the widely-repeated
#     `wallet_grantPermissions` name comes from. The lessons use the spec's current name and say
#     why both are in circulation.
#   - ERC-7715's prose refers to "redeemDelegation(...)" while its own code example and ERC-7710's
#     normative interface both say `redeemDelegations`. ERC-7710 is the interface owner, so that is
#     the name used. The discrepancy is reported as evidence of draft status, not resolved.
#   - docs.metamask.io is a Docusaurus SPA that returns HTTP 200 with a "Page Not Found" body for
#     paths that do not exist — the exact trap the brief warns about. Two guessed paths
#     (`/smart-accounts-kit/guides/advanced-permissions/` and
#     `/smart-accounts-kit/get-started/supported-permissions/`) were probed as controls and both
#     returned the 200 shell with `<title>Page Not Found`. Every MetaMask URL below was instead
#     taken from the site's own sitemap-derived index at
#     https://docs.metamask.io/llms-all-smart-accounts-kit.txt and read as its `.md` twin, which
#     returns real page text and 404s properly.
#   - The MetaMask docs no longer label this an "experimental" namespace: the shipping product is
#     "Advanced Permissions", versioned per permission type against MetaMask extension versions.
#     The dossier's "experimental namespace" framing is stale; the version floors are what is real.
#   - `openfort-smart-wallet-security` is already defined in content/sources/app.yaml and is reused
#     by id here rather than redefined. Its page is live but has been retitled
#     "Crypto Wallet Security: A Plain-English Guide for Builders" (dated 3 Apr 2026); it is a
#     vendor source and is cited only for its own product's shape, never for a general claim.
