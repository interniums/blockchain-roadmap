# --- Appended 2026-08-26 for `app-viem-reading-an-error` and `app-viem-sync-send`. ---
# Same verification pass as above: each URL fetched with `curl -sSL --max-time 25`, the final
# effective URL compared against the requested path, and the body read for the specific claim.
# Notes from this pass:
#   - All six viem source files are pinned to the `viem@2.55.19` tag for the same reason as the two
#     above: `main` carries 3.x prerelease work.
#   - `src/actions/wallet/sendRawTransactionSync.ts` at 2.55.19 passes `timeout` to the RPC as a raw
#     integer, i.e. issue #4263 (already recorded above) is fixed in this release. The lesson says so
#     rather than repeating the bug as current.
#   - viem's docs page for `sendTransactionSync` lists `eth_sendTransaction` for JSON-RPC accounts and
#     `eth_sendRawTransactionSync` only for local accounts. The action source confirms it: the
#     JSON-RPC branch falls through to `waitForTransactionReceipt` with `checkReplacement: false`.
