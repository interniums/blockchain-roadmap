trackId: app
# New sources introduced by the prose for module `app-viem`.
#
# Every URL below was fetched with `curl -sSL --max-time 30` on 2026-08-26, the FINAL effective URL
# was compared against the path requested, and the BODY was read for the specific claim cited. Notes
# from that pass:
#   - `https://github.com/mds1/multicall` redirects to `https://github.com/mds1/multicall3`. The
#     settled URL is recorded here, not the one viem's docs link to.
#   - `https://www.npmjs.com/package/viem` returns 403 behind a bot check, so the dist-tag claim is
#     cited against the registry API (`https://registry.npmjs.org/viem`), which serves the same data
#     as JSON and returned 200.
#   - The two viem source files are pinned to the `viem@2.55.19` tag rather than `main`, because
#     `main` currently carries 3.x prerelease work and `src/version.ts` 404s there.
#   - Two viem doc pages contradict the module's own concept notes and the docs won here:
#     `http()`'s `batch` default is `false`, and `simulateContract`'s `blockTag` default is
#     `'latest'`, not `'pending'`. Both were re-read to be sure.
