# uniswap-v3-whitepaper, eip-3156).
#
# Every URL below was fetched on 2026-08-26 and the BODY was checked for the text actually cited,
# not just the status line. Notes on what each one was confirmed to say:
#
#   curve-crvusd-controller-docs — confirmed MIN_TICKS=4 / MAX_TICKS=50, the published
#     LTV = 100% - loan_discount - 100*N/(2A) formula, the loan_discount getter returning
#     90000000000000000 (9%), the separate liquidation_discount used "to discount the collateral
#     value when calculating the health for liquidation purposes in order to incentivize
#     liquidators", the _health source (health = get_x_down*(1e18 - liquidation_discount)/debt
#     - 1e18, "Liquidation starts when < 0"), liquidate(user, min_x, use_eth) described as a
#     "bad liquidation (or self-liquidation)" with min_x as sandwich protection,
#     liquidate_extended with a caller-chosen frac and a callbacker, users_to_liquidate(),
#     tokens_to_liquidate(), CALLBACK_LIQUIDATE, and V3's set_extra_health / extra_health.
#
#   darknavy-sdola-llamalend — confirmed the transaction-level trace of the 2 March 2026
#     sDOLA/crvUSD LlamaLend incident: block 24566937 at 03:00:11 UTC, the
#     CryptoFromPoolVaultWAgg oracle calling sDOLA.convertToAssets() as a spot feed, two Morpho
#     Blue flash loans (10,000,000 USDC and 15,986.108 WETH), the sDOLA.redeem of ~10,607,802
#     sDOLA that unstaked ~12,613,130 DOLA and CRASHED convertToAssets(), the 190,777.47 DOLA
#     re-stake, one users_to_liquidate() call followed by 27 liquidate() calls, n_loans on the
#     Controller falling from 30 to 4 across the block, and attacker net token change of
#     +6.737 WETH and +227,325.57 DOLA (~$240,567). Note this analysis says the oracle was moved
#     DOWN; summaries of the (403-gated) governance thread describe it as inflated. The
#     disagreement is stated in the lesson rather than resolved.
