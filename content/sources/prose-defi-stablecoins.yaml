# morpho-bad-debt-docs, coindesk-19b-liquidation, aave-price-cap-adapters).
#
# VERIFICATION NOTE for every entry below: each URL was fetched with
#   curl -sSL --max-time 25 -w '[%{http_code}] %{url_effective}' <url>
# on 2026-08-26 AND the response BODY was read to confirm it contains the cited material.
# Two traps were checked explicitly:
#   * docs.ethena.fi returns HTTP 200 for paths that do not exist. A non-existent path returns a
#     Next.js error document (id="__next_error__", meta robots noindex) with no article content.
#     The three Ethena pages below were confirmed to render real article text, not that error page.
#   * www.congress.gov returns 403 (Cloudflare interstitial) to automated fetches, so the statute is
#     cited from the GPO's published Public Law text at govinfo.gov, whose body was read in full.
