# Sources added while writing prose for module defi-stablecoins (2026-08-26).
# Ids that already exist in content/sources/defi.yaml or gaps-defi.yaml are REUSED by reference and
# deliberately NOT redefined here (curve-crvusd-overview, curve-pegkeepers-docs, dss-psm-source,
# makerdao-psm-docs, ethena-docs, ethena-how-usde-works, ethena-risks-docs, genius-act,
