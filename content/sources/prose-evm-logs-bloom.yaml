trackId: evm
# New sources introduced by the prose for module `evm-logs-bloom`.
#
# Every URL below was fetched with `curl -sSL --max-time 30` on 2026-08-26, the final effective URL
# checked to confirm it still carries the path that was requested, and the response body checked to
# confirm it contains the specific constant, schema field or sentence it is cited for.
#
# Note on the execution-specs URLs: GitHub redirects the `master` path to the repository's current
# default branch (`forks/amsterdam`), but the `src/ethereum/forks/osaka/...` portion of the path
# survives the redirect, so the file served is still the Osaka (Fusaka) fork's normative
# implementation. This matches the convention already used in prose-evm-execution.yaml.
#
# Everything else this module cites is reused by id from evm.yaml, solidity.yaml, ledgers.yaml,
# fundamentals-distributed.yaml, prose-ledgers-blocks.yaml and prose-evm-execution.yaml —
# in particular execution-specs-osaka-bloom, execution-specs-osaka-gas, execution-specs-osaka-system,
# execution-specs-osaka-interpreter, measured-gas-constants, ethereum-org-json-rpc and eip-7708.
