trackId: fundamentals
sources:
  # New sources introduced by the `fundamentals-crypto-what-a-hash-guarantees` lesson prose.
  # Every URL below was fetched with curl on 2026-08-26 and the body confirmed to contain the
  # claim it is cited for — not merely to return 200.
  #
  # Ids already defined elsewhere in content/sources/ are NOT redefined here and are reused by id:
  # nist-sp-800-107 (gaps-fundamentals.yaml), nist-fips-202, yellow-paper, solidity-abi-spec
  # (fundamentals.yaml).
  #
  # REJECTED during verification: https://shattered.io/ returns HTTP 200 but the domain no longer
  # hosts the 2017 SHA-1 collision announcement — it now serves an unrelated content-farm blog.
  # The collision is cited from the authors' IACR ePrint entry instead.

  - id: rfc-6151
    tier: spec
    title: "RFC 6151: Updated Security Considerations for the MD5 Message-Digest and the HMAC-MD5 Algorithms (§2.1 collision attacks in seconds; §2.2 best preimage attack still 2^123.4)"
    url: https://www.rfc-editor.org/rfc/rfc6151
    publishedAt: "2011-03"
    retrievedAt: "2026-08-26"
    verifiedAt: "2026-08-26"
    vendor: false

  - id: sha1-first-collision
    tier: primary-analysis
    title: "The first collision for full SHA-1 (Stevens, Bursztein, Karpman, Albertini, Markov — CRYPTO 2017; two colliding PDFs, 2^63.1 compression-function calls)"
    url: https://eprint.iacr.org/2017/190
    publishedAt: "2017-02"
    retrievedAt: "2026-08-26"
    verifiedAt: "2026-08-26"
    vendor: false

  - id: nist-sha1-retirement
    tier: canonical-docs
    title: "NIST Retires SHA-1 Cryptographic Algorithm (collision attacks named as the cause; phase-out by 31 December 2030)"
    url: https://www.nist.gov/news-events/news/2022/12/nist-retires-sha-1-cryptographic-algorithm
    publishedAt: "2022-12"
    retrievedAt: "2026-08-26"
    verifiedAt: "2026-08-26"
    vendor: false
