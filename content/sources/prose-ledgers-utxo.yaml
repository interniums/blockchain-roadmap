trackId: ledgers
# New sources for the `ledgers-utxo` prose (module 02.1). Every URL below was fetched live on
# 2026-08-26 with `curl -sSL --max-time N -w '[%{http_code}] %{url_effective}'`, the final URL was
# confirmed to still carry the requested path, and the body was confirmed to contain the text the
# lessons cite. Shared ids (bitcoin-whitepaper, bitcoin-devguide-transactions,
# bitcoin-devguide-block-chain, ethereum-whitepaper, bitcoin-programming-survey,
# utxo-debt-representation, bithoven-utxo-contracts, solana-sealevel-note, eip-7928) are reused
# from content/sources/gaps-fundamentals.yaml, ledgers.yaml and altvm.yaml and are NOT redefined
# here.
