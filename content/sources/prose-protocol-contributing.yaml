trackId: protocol
# New sources needed by the protocol-contributing lesson prose. Everything else this module cites is
# reused BY ID from protocol.yaml (go-ethereum-repo, reth-repo, lighthouse-book, prysm-docs,
# ethereum-pm, hive-repo, execution-specs, execution-spec-tests-repo, consensus-specs,
# clientdiversity-org, epf7-announcement, eps-2026, epf-study-group-intro, study-epf-wiki-site,
# epf-wiki-site, protocol-studies-repo, eth-protocol-fellows-org, epf6-recap) and from
# prose-protocol-client-architecture.yaml (eip-7723). Do NOT redefine an id defined elsewhere.
#
# Everything below was fetched and read in the body on 2026-08-26, not merely status-checked. Three
# of the repository URLs a 2024-era reading list would hand a learner now 301 to a different
# organisation, so the org paths here are the ones GitHub resolved to on that date:
#   hyperledger/besu    -> besu-eth/besu
#   ledgerwatch/erigon  -> erigontech/erigon
#   prysmaticlabs/prysm -> OffchainLabs/prysm
