trackId: protocol
sources:
  # New sources introduced by the prose for the protocol-fork-choice module.
  # Every URL below was fetched with curl on 2026-08-26, the final effective URL inspected, and the
  # cited text confirmed present in the returned body (not merely a 200 status line).
  #
  # Sources already defined elsewhere and REUSED BY ID, deliberately NOT redefined here:
  #   fork-choice-spec, fulu-fork-choice, consensus-specs, eip-7732, lighthouse-book,
  #   eth2book-fork-choice, neu-tas-tse-two-attacks, rlmd-ghost-paper, goldfish-paper,
  #   3sf-paper, 3sf-ethresearch, casper-ex-ante-mitigation, vbuterin-lmd-ghost-mitigation,
  #   monnot-reorg-post, ethereum-org-pos-attack-defense, ethereum-org-ssf-roadmap,
  #   three-attacks-pos-ethereum  (defined in depth-fundamentals-incentives.yaml, identical url).
  #
  # NOTE on `consensus-specs-mainnet-config`: that id is already claimed twice elsewhere with two
  # DIFFERENT urls (master vs v1.7.0-alpha.14). This module deliberately uses its own tagged id
  # `fc-config-mainnet-v161` rather than adding a third disagreeing definition.

  # --- consensus-specs at tags: the constants, read out of the spec, not out of an article ---
  # PROPOSER_SCORE_BOOST was 70 here; SAFE_SLOTS_TO_UPDATE_JUSTIFIED = 2**3 (= 8) still present.
  - id: fc-spec-v1-1-10
    tier: spec
    title: "consensus-specs v1.1.10 — phase0/fork-choice.md (PROPOSER_SCORE_BOOST = 70; SAFE_SLOTS_TO_UPDATE_JUSTIFIED = 8)"
    url: https://github.com/ethereum/consensus-specs/blob/v1.1.10/specs/phase0/fork-choice.md
    publishedAt: "2022-03"
    retrievedAt: "2026-08-26"
    verifiedAt: "2026-08-26"
    vendor: false
  # First tag at which PROPOSER_SCORE_BOOST reads 40. SAFE_SLOTS_TO_UPDATE_JUSTIFIED still present.
  - id: fc-spec-v1-2-0
    tier: spec
    title: "consensus-specs v1.2.0 — phase0/fork-choice.md (PROPOSER_SCORE_BOOST reduced to 40)"
    url: https://github.com/ethereum/consensus-specs/blob/v1.2.0/specs/phase0/fork-choice.md
    publishedAt: "2022-08"
    retrievedAt: "2026-08-26"
    verifiedAt: "2026-08-26"
    vendor: false
  - id: fc-phase0-beacon-chain-v161
    tier: spec
    title: "consensus-specs v1.6.1 — phase0/beacon-chain.md (SLOTS_PER_EPOCH, MAX_COMMITTEES_PER_SLOT, TARGET_COMMITTEE_SIZE, MAX_EFFECTIVE_BALANCE)"
    url: https://github.com/ethereum/consensus-specs/blob/v1.6.1/specs/phase0/beacon-chain.md
    publishedAt: "2025-11"
    retrievedAt: "2026-08-26"
    verifiedAt: "2026-08-26"
    vendor: false
  - id: fc-phase0-validator-v161
    tier: spec
    title: "consensus-specs v1.6.1 — phase0/validator.md (ATTESTATION_DUE_BPS, AGGREGATE_DUE_BPS)"
    url: https://github.com/ethereum/consensus-specs/blob/v1.6.1/specs/phase0/validator.md
    publishedAt: "2025-11"
    retrievedAt: "2026-08-26"
    verifiedAt: "2026-08-26"
    vendor: false
  - id: fc-config-mainnet-v161
    tier: spec
    title: "consensus-specs v1.6.1 — configs/mainnet.yaml (fork-choice configuration values as deployed on mainnet)"
    url: https://github.com/ethereum/consensus-specs/blob/v1.6.1/configs/mainnet.yaml
    publishedAt: "2025-11"
    retrievedAt: "2026-08-26"
    verifiedAt: "2026-08-26"
    vendor: false
  - id: fc-electra-beacon-chain-v161
    tier: spec
    title: "consensus-specs v1.6.1 — electra/beacon-chain.md (MIN_ACTIVATION_BALANCE, MAX_EFFECTIVE_BALANCE_ELECTRA)"
    url: https://github.com/ethereum/consensus-specs/blob/v1.6.1/specs/electra/beacon-chain.md
    publishedAt: "2025-11"
    retrievedAt: "2026-08-26"
    verifiedAt: "2026-08-26"
    vendor: false
  # Unshipped. Gloas is the consensus-specs codename for the Glamsterdam upgrade; this file is the
  # fork-choice rewrite that EIP-7732 requires. Cited only for what is PROPOSED, never with a date.
  - id: fc-gloas-fork-choice-v161
    tier: spec
    title: "consensus-specs v1.6.1 — gloas/fork-choice.md (payload status in the fork-choice tree, PTC votes, PAYLOAD_TIMELY_THRESHOLD)"
    url: https://github.com/ethereum/consensus-specs/blob/v1.6.1/specs/gloas/fork-choice.md
    publishedAt: "2025-11"
    retrievedAt: "2026-08-26"
    verifiedAt: "2026-08-26"
    vendor: false

  # The spec change that took PROPOSER_SCORE_BOOST from 70 to 40, and the note it links for rationale.
  - id: fc-specs-pr-2895
    tier: spec
    title: "ethereum/consensus-specs PR #2895 — Update PROPOSER_SCORE_BOOST to 40 percent (merged 2022-05-20)"
    url: https://github.com/ethereum/consensus-specs/pull/2895
    publishedAt: "2022-05-20"
    retrievedAt: "2026-08-26"
    verifiedAt: "2026-08-26"
    vendor: false
  - id: fc-proposer-boost-considerations
    tier: primary-analysis
    title: "Proposer Boost considerations (Francesco D'Amato and Caspar Schwarz-Schilling) — the inequalities behind the chosen value"
    url: https://notes.ethereum.org/@casparschwa/H1T0k7b85
    publishedAt: "2022-05"
    retrievedAt: "2026-08-26"
    verifiedAt: "2026-08-26"
    vendor: false

  # --- research papers: the attacks, and the proposed replacements ---
  - id: fc-neuder-low-cost-attacks
    tier: primary-analysis
    title: "Low-cost attacks on Ethereum 2.0 by sub-1/3 stakeholders (Neuder, Moroz, Rao, Parkes)"
    url: https://arxiv.org/abs/2102.02247
    publishedAt: "2021-02"
    retrievedAt: "2026-08-26"
    verifiedAt: "2026-08-26"
    vendor: false
  - id: fc-fast-confirmation-paper
    tier: primary-analysis
    title: "A Fast Confirmation Rule for the Ethereum Consensus Protocol (Saltini, Kalinin, Zanolini, D'Amato, Asgaonkar, Zhang)"
    url: https://arxiv.org/abs/2405.00549
    publishedAt: "2024-05, latest version 2026-07"
    retrievedAt: "2026-08-26"
    verifiedAt: "2026-08-26"
    vendor: false
  - id: fc-orbit-ssf-ethresearch
    tier: primary-analysis
    title: "Orbit SSF: solo-staking-friendly validator set management for SSF (fradamt, ethresear.ch)"
    url: https://ethresear.ch/t/orbit-ssf-solo-staking-friendly-validator-set-management-for-ssf/19928
    publishedAt: "2024-06-28"
    retrievedAt: "2026-08-26"
    verifiedAt: "2026-08-26"
    vendor: false

  # --- one client's implementation, cited for what shipped and behind which flag ---
  - id: fc-lighthouse-confirmation-pr
    tier: primary-analysis
    title: "sigp/lighthouse PR #8951 — Implement Fast Confirmation Rule (merged 2026-07-13, gated on --enable-fast-confirmation)"
    url: https://github.com/sigp/lighthouse/pull/8951
    publishedAt: "2026-07-13"
    retrievedAt: "2026-08-26"
    verifiedAt: "2026-08-26"
    vendor: true
