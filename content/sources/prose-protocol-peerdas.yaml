trackId: protocol
sources:
  # New sources introduced by the prose for the protocol-peerdas module.
  # Every URL below was fetched with curl on 2026-08-26, the final effective URL confirmed to still
  # carry the path asked for, and the cited text confirmed present in the returned body.
  #
  # Sources already defined elsewhere and REUSED BY ID (not redefined here):
  #   eip-7594, eip-4844, eip-7892, ethereum-org-peerdas, fradamt-das-fork-choice, fulu-fork-choice,
  #   engine-api-spec, engine-api-osaka, consensus-specs-fulu-das-core, consensus-specs-fulu-p2p,
  #   consensus-specs-fulu-validator, consensus-specs-fulu-preset, consensus-specs-mainnet-config.
  #
  # NOTE ON TAGS: the two polynomial-commitments spec files below are 404 on `master` as of
  # 2026-08-26 and therefore MUST be cited at the v1.6.1 tag, which is the release line that carried
  # Fulu. This is not pedantry — it is the whole subject of one lesson in this module.

  - id: consensus-specs-deneb-polynomial-commitments
    tier: spec
    title: "consensus-specs v1.6.1 — deneb/polynomial-commitments.md (Polynomial is 'a polynomial in evaluation form'; KZG_SETUP_G1_LAGRANGE; blob_to_kzg_commitment) — REMOVED from master"
    url: https://github.com/ethereum/consensus-specs/blob/v1.6.1/specs/deneb/polynomial-commitments.md
    publishedAt: "2025-11"
    retrievedAt: "2026-08-26"
    verifiedAt: "2026-08-26"
    vendor: false

