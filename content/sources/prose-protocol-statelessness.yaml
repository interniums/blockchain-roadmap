trackId: protocol
# Sources added while writing prose for protocol-statelessness.
# Every url below was fetched live with curl on 2026-08-26 and its BODY was read, not just its
# status line. Notes for later authors, because this module's paper trail is unusually treacherous:
#
#  - EIP-7748 still carries the title "State conversion to Verkle Tree" and still `Requires`
#    EIP-7612, even though EIP-7864's rationale names EIP-7748 as the migration for the BINARY
#    tree. A status-line check would miss this; only the body shows it.
#  - The EIP-7864 Ethereum Magicians thread (id `eip7864-magicians`, defined in protocol.yaml)
#    has had its FIRST POST edited to open with "Please note EIP-8297 has a new iteration of the
#    BT design!". That edit is the only in-repo signal that EIP-7864 has a successor.
#  - EIP-7864's own parameter table (HEADER_STORAGE_OFFSET 20, CODE_OFFSET 4) contradicts its own
#    prose, EIP-6800, the Stateless Book and Dedaub (all 64 / 128) — and violates the invariant
#    the EIP itself states. Do not quote either pair as settled.
#  - ERC-8147 (locality-preserving storage layout) is listed on the Stateless Book's
#    active-projects page but https://eips.ethereum.org/EIPS/eip-8147 returned 404 on 2026-08-26.
#    It is cited via the book, never as an EIP page.
#
# Ids reused rather than redefined (do NOT redefine them here):
#   eip-7864, eip-6800, eip-7748, eip-4444, eip-7928, eip7864-magicians, dedaub-locality,
#   stateless-fyi-binary-tree, eipsinsight-upgrades   -> content/sources/protocol.yaml
#   eip-1186, eip-2929                                -> content/sources/evm.yaml
#   eip-7612                                          -> content/sources/fundamentals-state.yaml
#   eip-2935                                          -> content/sources/prose-ledgers-blocks.yaml
#   eip-2930                                          -> content/sources/infra.yaml
#   eip-6780, measured-gas-constants                  -> content/sources/solidity.yaml
#   ef-realtime-proving, ef-zkevm-security-foundations -> content/sources/zk.yaml
#   ethproofs                                         -> prose-scaling-proof-systems.yaml
