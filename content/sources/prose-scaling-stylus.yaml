trackId: scaling
# Sources added while writing prose for the scaling-stylus module.
# Every url below was fetched live with curl on 2026-08-26; the final URL kept its path and the
# body contained the material cited. Two redirect notes, both verified this session:
#
#   - `arbitrum-stylus-gas` (scaling.yaml, /stylus/concepts/stylus-gas) now 301s to
#     /stylus/concepts/gas-metering — the SAME page as `arbitrum-stylus-gas-metering`. The prose
#     therefore cites `arbitrum-stylus-gas-metering` only, so no lesson depends on a stale path.
#   - `arbitrum-stylus-new-languages` (scaling.yaml, /stylus/how-tos/adding-support-for-new-languages)
#     now 301s to /stylus/how-tos/deploying-non-rust-wasm-contracts, which is a DIFFERENT page with a
#     different title. Same failure mode as arbitrum-interactive-fraud-proofs. This file therefore
#     adds `arbitrum-stylus-non-rust-wasm` pointing at the real page, and the prose cites that.
#
# Everything under docs.arbitrum.io is first-party vendor documentation for Arbitrum's own product.
# It is the authority for its own chain and it is also the only source for the "10-100x compute"
# and "100-500x memory" figures, which no independent benchmark corroborates. `vendor: true` is set
# on every one of them so that fact stays visible at the point of citation.
