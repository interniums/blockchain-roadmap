trackId: security
sources:
  # --- 06.6 formal verification + 06.7 audit craft: prose-only additions ---
  # Every other source cited by these two modules already exists in security.yaml,
  # gaps-security.yaml, toolchain.yaml or solidity.yaml. Only ids that were genuinely
  # absent are declared here. Each was fetched and its BODY read on 2026-08-26, not
  # merely status-checked.

  # Certora reference documentation. The gentle-intro hackmd (certora-gentle-intro)
  # is the architecture paper; these are the normative pages that carry the flag
  # semantics, the soundness caveat on summaries, and the parametric-rule definition.
  - id: certora-cli-options
    tier: canonical-docs
    title: "Certora Prover — CLI options reference (loop_iter, optimistic_loop, optimistic_hashing, smt_timeout, nondet_difficult_funcs)"
    url: https://docs.certora.com/en/latest/docs/prover/cli/options.html
    publishedAt: "2026"
    retrievedAt: "2026-08-26"
    verifiedAt: "2026-08-26"
    vendor: true

  - id: certora-cvl-methods
    tier: canonical-docs
    title: "CVL — The methods block and summary types, with the soundness caveat on summarization"
    url: https://docs.certora.com/en/latest/docs/cvl/methods.html
    publishedAt: "2026"
    retrievedAt: "2026-08-26"
    verifiedAt: "2026-08-26"
    vendor: true

  - id: certora-cvl-rules
    tier: canonical-docs
    title: "CVL — Rules, parametric rules and rule filters"
    url: https://docs.certora.com/en/latest/docs/cvl/rules.html
    publishedAt: "2026"
    retrievedAt: "2026-08-26"
    verifiedAt: "2026-08-26"
    vendor: true

  - id: certora-cvl-ghosts
    tier: canonical-docs
    title: "CVL — Ghosts and persistent ghosts"
    url: https://docs.certora.com/en/latest/docs/cvl/ghosts.html
    publishedAt: "2026"
    retrievedAt: "2026-08-26"
    verifiedAt: "2026-08-26"
    vendor: true

  - id: certora-cvl-hooks
    tier: canonical-docs
    title: "CVL — Hooks, hook bodies and hook reentrancy"
    url: https://docs.certora.com/en/latest/docs/cvl/hooks.html
    publishedAt: "2026"
    retrievedAt: "2026-08-26"
    verifiedAt: "2026-08-26"
    vendor: true

  # Halmos: the defaults live in source, not in prose. Read directly so the bounds
  # quoted in the lesson are the shipped ones rather than a blog's recollection.
  - id: a16z-halmos-config
    tier: canonical-docs
    title: "a16z/halmos — src/halmos/config.py, the shipped default bounds (--loop, --invariant-depth, array/bytes lengths, solver, solver timeout)"
    url: https://github.com/a16z/halmos/blob/main/src/halmos/config.py
    publishedAt: "2026"
    retrievedAt: "2026-08-26"
    verifiedAt: "2026-08-26"
    vendor: true

  - id: a16z-halmos-getting-started
    tier: canonical-docs
    title: "Halmos — getting started guide (check_ naming convention, symbolic inputs, counterexamples)"
    url: https://github.com/a16z/halmos/blob/main/docs/getting-started.md
    publishedAt: "2026"
    retrievedAt: "2026-08-26"
    verifiedAt: "2026-08-26"
    vendor: true

  # The maturity rubric itself, as opposed to the blog post announcing it. This is the
  # page the blog links to as "codebase maturity criteria", and it carries the rating
  # definitions and the per-category weak/moderate/satisfactory criteria.
  - id: tob-code-maturity-criteria
    tier: canonical-docs
    title: "Building Secure Contracts — Blockchain Maturity Evaluation (rating system and per-category criteria), document version 0.1.0"
    url: https://secure-contracts.com/development-guidelines/code_maturity.html
    publishedAt: "2026"
    retrievedAt: "2026-08-26"
    verifiedAt: "2026-08-26"
    vendor: true

  # Two published reports, cited as primary artifacts rather than through the index.
  # Both were downloaded and read; the effort figures, finding counts, maturity tables
  # and the severity/difficulty/rating appendices are quoted from these files.
  - id: tob-uniswap-v4-core-review
    tier: canonical-docs
    title: "Trail of Bits — Uniswap v4 Core Security Assessment (September 2024, six engineer-weeks)"
    url: https://github.com/trailofbits/publications/blob/master/reviews/2024-07-uniswap-v4-core-securityreview.pdf
    publishedAt: "2024-09"
    retrievedAt: "2026-08-26"
    verifiedAt: "2026-08-26"
    vendor: true

  - id: tob-arbitrum-stylus-review
    tier: canonical-docs
    title: "Trail of Bits — Arbitrum Stylus Security Assessment (June 2024, 47 engineer-weeks)"
    url: https://github.com/trailofbits/publications/blob/master/reviews/2024-05-offchain-arbitrumstylus-securityreview.pdf
    publishedAt: "2024-06"
    retrievedAt: "2026-08-26"
    verifiedAt: "2026-08-26"
    vendor: true

  # Competitive-platform severity criteria, read verbatim. Both pages contradict the
  # loose "impact x likelihood" summary in circulation, in different directions, which
  # is why the lesson quotes them rather than paraphrasing the convention.
  - id: sherlock-issue-validity
    tier: canonical-docs
    title: "Sherlock — Criteria for Issue Validity (High/Medium thresholds; likelihood is not considered)"
    url: https://docs.sherlock.xyz/audits/judging/guidelines
    publishedAt: "2026"
    retrievedAt: "2026-08-26"
    verifiedAt: "2026-08-26"
    vendor: true

  - id: code4rena-severity-classifications
    tier: canonical-docs
    title: "Code4rena — Severity classifications (3-High / 2-Medium / QA, centralization, speculation on future code)"
    url: https://docs.code4rena.com/competitions/severity-categorization
    publishedAt: "2026"
    retrievedAt: "2026-08-26"
    verifiedAt: "2026-08-26"
    vendor: true
