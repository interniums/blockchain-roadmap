trackId: security
# Sources added while writing prose for module `security-fuzzing` (2026-08-26).
#
# VERIFICATION METHOD
# -------------------
# Every URL below was fetched on 2026-08-26 with
#   curl -sSL --max-time 25 -w '\n[%{http_code}] %{url_effective}\n' "<url>"
# the FINAL url was checked to keep the requested path, and the BODY was grepped for the specific
# string the lessons cite. A 200 alone was never accepted as evidence.
#
# Specific body checks performed:
#   secure-contracts.com/.../testing-modes.html      -> "Boolean Properties", "side effects are *not* preserved"
#   secure-contracts.com/.../optimization_mode.html  -> "max value: 1076841", "--test-mode optimization"
#   secure-contracts.com/.../state-network-forking.html -> "ECHIDNA_RPC_URL", "ECHIDNA_RPC_BLOCK", "2.1.0"
#   secure-contracts.com/.../collecting-a-corpus.html -> corpusDir walkthrough, covered.*.txt markers
#   secure-contracts.com/.../fuzzing_tips.html       -> "Filtering Inputs", the `%` remapping idiom
#   secure-contracts.com/.../common-testing-approaches.html -> "Internal Testing" / "External Testing"
#   github.com/crytic/echidna/blob/.../default.yaml  -> seqLen, shrinkLimit, testLimit, corpusDir, rpcUrl
#   github.com/crytic/medusa/blob/.../fuzzing_config.md -> workers, callSequenceLength, corpusDirectory
#   github.com/crytic/medusa/blob/.../testing_config.md -> testPrefixes, panicCodeConfig
#   github.com/crytic/medusa/blob/.../chain_config.md   -> forkModeEnabled, rpcBlock, poolSize
#   blog.trailofbits.com/2024/03/22/...              -> "Writing good invariants is 80% of the work"
#   github.com/crytic/echidna-parade                 -> swarm-testing tool, body present
#
# IDS REUSED BY REFERENCE (defined elsewhere; deliberately NOT redefined here so the linter's
# CONFLICTING-SOURCE / DUP-SOURCE checks stay quiet):
#   security.yaml  — crytic-echidna, crytic-medusa, tob-unleashing-medusa, echidna-issta-2020,
#                    tob-onchain-echidna, tob-diffusc, allthingsfuzzy-stateless-stateful,
#                    allthingsfuzzy-onchain-benchmark, cyfrin-foundry-invariants,
#                    crytic-building-secure-contracts, tob-invariant-driven-development,
#                    blocksec-balancer-v2, monad-ultrafuzz, ackee-guided-fuzzing
#   gaps-security.yaml — crytic-diffusc
#   toolchain.yaml — measured-forge-1-7-1, foundry-testing-config, foundry-invariant-testing,
#                    forge-test-reference, foundry-issue-3001, foundry-ci, echidna-action,
#                    foundry-cheatcode-assume, foundry-fork-testing, foundry-releases
#   prose-toolchain-invariant-testing.yaml — foundry-invariant-guide
#   prose-security-threat-modeling.yaml — crytic-properties
#
# MEASUREMENTS
# ------------
# Every campaign figure quoted in these six lessons was produced on THIS machine on 2026-08-26 with
# forge 1.7.1 (commit 4072e487, built 2026-05-08) and solc 0.8.36, and is attributed to
# `measured-forge-1-7-1`. That covers: the ceil-rounding vault (1 wei -> 999,000,999,000,999,000,999
# wei out); the solvency-passes / no-free-money-fails pair at 128,000 calls; the over-clamped cap
# campaign (128,000 calls in 10.89s, PASS) versus the wide one (FAIL in 130ms, 65 calls shrunk to 2);
# the sequence-length sweep at a fixed 5,000-call budget; the shrink_run_limit sweep
# (5000 -> 65:2 in 476.90ms; 0 -> 65:65 in 7.18ms); the corpus directory layout under `corpus_dir`;
# the mulDiv differential pair (weak harness PASS at 256 runs, strong harness FAIL on run 4); and the
# forked-WETH throughput figures (2,000 calls in 107.97s forked versus 82.94ms against a local twin).
# The contracts and exact command lines are reproduced inside the lessons.
#
# NOT PINNED, DELIBERATELY
# ------------------------
# No Echidna or Medusa version number is stated as current anywhere in this module. CONFLICTS.md
# records that the release pages fetched during the research sweep returned data inconsistent with
# Trail of Bits' own Medusa v1 announcement, and neither tool is installed on this machine, so no
# version could be confirmed here either. The lessons cite behaviour from the projects' own docs and
# tell the reader to check `--version` themselves.
