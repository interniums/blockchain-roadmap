  # --- 06.4 static analysis & the tool landscape: prose-only additions ---
  # Slither, Aderyn, Echidna, Medusa, Halmos, the Certora Prover and its changelog,
  # the symbolic-execution survey, Building Secure Contracts, the Cyfrin and Hacken
  # tool round-ups and the SoK loss paper are all already declared in security.yaml
  # or gaps-security.yaml and are cited by id from there. Only genuinely absent ids
  # are declared below.

  - id: measured-static-analysis-2026-08-26
    tier: primary-analysis
    title: "Observed on this machine on 2026-08-26 with forge 1.7.1 (commit 4072e487, built 2026-05-08) and solc 0.8.36: `forge lint` run at every severity over a probe contract carrying an unauthenticated owner setter, a state-after-call withdrawal, a share-price divisor and an unchecked ERC20 transfer; `forge lint --only-lint` probed against all 91 lint ids indexed by the Foundry documentation, of which 23 were recognised and 68 rejected as Unknown lint ID; forge lint exiting 0 with a warning present and 1 under --deny warnings; `forge config` reporting lint.severity and lint_on_build; `forge test --help` carrying no symbolic or solver flag; forge test rejecting --junit together with --gas-report, and --json emitting a plain-text Warning line to stdout ahead of the JSON object; an invariant campaign of 256 runs and 128000 calls passing with 93347 reverts and only 81 successful withdraw calls, against a sharper property falsified in 28ms and shrunk to a single donate call; solc --model-checker-engine chc runs producing an assertion counterexample, an overflow warning, one condition proved safe and two not proved, plus the model-checker engine, ext-calls and invariants defaults; and a count of the Slither README detector table (100 rows, tabulated by impact and confidence) and of the Aderyn dev-branch detector modules (39 high, 49 low) against its two-variant IssueSeverity enum"
    url: docs/research/MEASURED.md
    publishedAt: "2026-08-26"
    retrievedAt: "2026-08-26"
    verifiedAt: "2026-08-26"
    vendor: false
    internal: true

