trackId: solidity
sources:
  # New sources introduced by the solidity-language-core lesson prose.
  # Every URL below was fetched with curl on 2026-08-26 and the BODY confirmed to contain the
  # claim it is cited for — not merely to return 200. docs.soliditylang.org returns 403 to
  # default automated user agents; it serves normally with a browser UA, and the pages below
  # all render the "Solidity 0.8.37-develop documentation" title, i.e. the develop tree that
  # documents released 0.8.36.
  #
  # Source ids already defined elsewhere in content/sources/ and cited by this module WITHOUT
  # being redefined here (the loader merges every source file by id, and redefining with a
  # different tier/url is a lint ERROR): solidity-docs-types, solidity-docs-contracts,
  # solidity-docs-storage-layout, solidity-docs-control-structures, solidity-docs-global-vars,
  # solidity-changelog, solidity-0836-release, solidity-abi-spec, solidity-050-breaking,
  # eip-7, eip-165, eip-214, eip-1153, eip-2929, measured-gas-constants,
  # execution-apis-eth-state.

  - id: solidity-docs-grammar
    tier: canonical-docs
    title: "Solidity documentation: Language Grammar (state-mutability is a single choice of pure | view | payable; visibility is internal | external | private | public)"
