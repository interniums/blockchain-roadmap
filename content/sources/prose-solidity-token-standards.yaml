trackId: solidity
# Sources added while writing prose for module `solidity-token-standards` (2026-08-26).
#
# Every URL below was fetched with
#   curl -sSL --max-time 30 -w '\n[%{http_code}] %{url_effective}\n' "<url>"
# on 2026-08-26, the FINAL url was checked to still carry the path requested, and the BODY was read
# for the specific claim cited. A 200 alone was not accepted as evidence.
#
# Ids that already exist elsewhere in content/sources are REUSED BY REFERENCE and deliberately not
# redefined here, so the linter's CONFLICTING-SOURCE / DUP-SOURCE checks stay quiet:
#   eip-20, eip-165, eip-721, eip-1155, eip-2612, eip-4626, eip-6909, eip-7702, eip-1153 (solidity.yaml)
#   eip-712 (fundamentals.yaml)
#   oz-changelog, oz-safe-erc20-source, oz-erc4626-docs, oz-erc4626-inflation-defense,
#   weird-erc20, ackee-erc721-reentrancy, blocksec-hypebears, c4-lukso-erc721-reentrancy,
#   uniswap-v4-erc6909-docs, measured-gas-constants (solidity.yaml)
#   uniswap-permit2-docs (gaps-evm-stack.yaml)
#   uniswap-v2-router02-source (gaps-defi.yaml)
#
# NOTE for a future maintainer: `blocksec-hypebears` (medium.com) returned HTTP 403 to an automated
# fetch on 2026-08-26 — a Cloudflare bot challenge, not a dead page. Its body could NOT be read this
# session, so nothing numeric is cited from it anywhere in this module; it is referenced only for the
# existence of the incident, and the mechanism is taught from `ackee-erc721-reentrancy`, whose body
# WAS read.
