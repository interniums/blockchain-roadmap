trackId: toolchain
# New sources introduced by the toolchain-deploy-verify lesson prose.
#
# Every URL below was fetched on 2026-08-26 and the BODY confirmed to contain the claim it is
# cited for — not merely to return 200. Notes on the traps hit while doing that:
#   * docs.soliditylang.org returns 403 to a default automated user agent. It serves normally with
#     a browser UA; the page fetched renders as "Contract Metadata — Solidity 0.8.37-develop
#     documentation", i.e. the develop tree that documents released 0.8.36.
#   * getfoundry.sh silently rewrites some paths. /cast/reference/cast-create2/ 404s after a
#     redirect to /reference/cast/cast-create2; the live path is /reference/cast/create2. Every
#     Foundry URL here is the post-redirect effective URL.
#   * book.getfoundry.sh still serves and redirects into the same content; the new-domain paths
#     below were preferred because they are the ones the docs' own links point at.
#
# Source ids already defined elsewhere in content/sources/ and cited by this module WITHOUT being
# redefined here (the loader merges every source file by id, and redefining one with a different
# tier/url is a lint ERROR): foundry-deploying, forge-script-reference,
# forge-verify-contract-reference, foundry-create2-guide, foundry-cheatcodes-overview,
# foundry-config-overview, foundry-troubleshooting, etherscan-verify-with-foundry,
# layerzero-uniform-address, foundry-issue-2435, foundry-issue-9196, measured-forge-1-7-1,
# solidity-0836-release, erc-7955, eip-7825, eip-1014, eip-155, eip-161, eip-170, eip-7702,
# yellow-paper, solady-create3.

