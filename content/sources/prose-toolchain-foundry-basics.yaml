  - id: measured-foundry-basics-1-7-1
    tier: primary-analysis
    title: 'Observed on this machine on 2026-08-26 with forge/cast/anvil/chisel 1.7.1 (commit 4072e487, built 2026-05-08)
      and solc 0.8.36: all four --version strings, foundryup --list, a fresh `forge init` tree and its .gitignore, foundry.lock,
      `forge config` resolved defaults, the foundry.toml walk-up and FOUNDRY_CONFIG override, `extends`, profile inheritance
      and the optimizer_runs side effect, the four-source remapping merge and its collision order, auto_detect_remappings
      = false, solc and evm_version pinning with the resulting bytecode diff, `forge build --sizes`, the anvil banner and
      anvil_* namespace, `chisel eval`, and the --junit/--gas-report and --profile rejections'
    url: docs/research/MEASURED.md
    internal: true
    publishedAt: '2026-08-26'
    retrievedAt: '2026-08-26'
    verifiedAt: '2026-08-26'
    vendor: false
