trackId: toolchain
# New sources introduced by the prose for module `toolchain-gas-profiling`.
#
# Verification method, 2026-08-26:
#   * Every URL this module cites was fetched with
#     `curl -sSL --max-time 25 -w '\n[%{http_code}] %{url_effective}\n'` and the BODY grepped for
#     the exact claim it is cited for — not merely checked for a 200. The final effective URL was
#     confirmed to still carry the requested path.
#   * EIP-3529 body confirmed to contain `SSTORE_CLEARS_SCHEDULE` = `SSTORE_RESET_GAS +
#     ACCESS_LIST_STORAGE_KEY_COST` (4,800 gas), `MAX_REFUND_QUOTIENT` raised from 2 to 5, and the
#     removal of the SELFDESTRUCT refund.
#   * EIP-7623 body confirmed to contain the parameter table `STANDARD_TOKEN_COST = 4`,
#     `TOTAL_COST_FLOOR_PER_TOKEN = 10`, the definition
#     `tokens_in_calldata = zero_bytes + nonzero_bytes * 4`, and the `max(...)` gasUsed formula.
#   * getfoundry.sh/forge/gas-tracking body confirmed to contain the report table, the
#     `gas_reports` / `gas_reports_ignore` keys, `.gas-snapshot`, `--diff` / `--check`, the
#     `vm.startSnapshotGas` / `vm.stopSnapshotGas` example and the pause/resume/reset metering
#     examples.
#   * getfoundry.sh/reference/forge/snapshot body confirmed to contain `--check` "exiting with
#     code 1", `--tolerance` "Tolerates gas deviations up to the specified percentage", and
#     `--diff-sort`.
#
# Everything else this module cites reuses ids already defined in content/sources/toolchain.yaml
# and content/sources/evm.yaml (foundry-gas-tracking, forge-snapshot-reference,
# foundry-gas-optimization-guide, foundry-forge-testing, forge-test-reference,
# foundry-testing-config, foundry-config-overview, foundry-solc-config, foundry-ci,
# foundry-cheatcodes-overview, foundry-issue-3001, foundry-issue-5494, forge-gas-metering,
# rubilmax-gas-diff, measured-forge-1-7-1, eip-2028, eip-2929, eip-3529, eip-7623, eip-7825).

sources:
  - id: measured-gas-profiling-1-7-1
    tier: primary-analysis
    title: >-
      Measured while authoring `toolchain-gas-profiling` on this machine — forge 1.7.1
      (commit 4072e487, built 2026-05-08) with solc 0.8.36, optimizer off unless stated: a probe
      project covering the dead-code elimination of an unsunk SLOAD, gas-report tables and
      `.gas-snapshot` lines for the same suite, `forge test` with and without `--gas-report` and
      `--isolate`, the `snapshots/<Contract>.json` output of the snapshot cheatcodes,
      `forge snapshot --diff/--check/--tolerance` exit codes, `forge config` resolved defaults,
      the `--junit` / `--gas-report` flag conflict, storage-clearing refunds against the EIP-3529
      cap, and the folklore micro-optimisations measured warm under three compiler pipelines
    url: https://github.com/foundry-rs/foundry/releases/tag/v1.7.1
    publishedAt: "2026-08-26"
    retrievedAt: "2026-08-26"
    verifiedAt: "2026-08-26"
    vendor: false
