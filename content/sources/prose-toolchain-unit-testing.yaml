trackId: toolchain
# New sources introduced by the prose for module `toolchain-unit-testing`.
#
# Verification method, 2026-08-26:
#   * The three forge-std URLs are VERSION-PINNED raw files at tag v1.16.2, fetched with
#     `curl -sSL --max-time 25`, the final effective URL confirmed to still carry the requested
#     path, and the response BODY grepped for the exact declaration or doc comment this module
#     cites it for (VM_ADDRESS in Base.sol; cool/coolSlot, the four prank overloads,
#     expectPartialRevert and the expectEmit caught-revert note in Vm.sol; "optionally adjusting
#     the total supply" in StdCheats.sol). A raw.githubusercontent tag URL is used deliberately
#     rather than the repo root: the repo root is a moving target and this module quotes exact
#     signatures.
#   * The internal source records what was observed by running the binary on this machine, because
#     two claims this module makes cannot be settled from any web page — `forge config` reporting
#     `isolate = false` while the docs say isolation is on by default, and forge rejecting
#     `--junit` together with `--gas-report`.
#
# Everything else this module cites is reused by id from toolchain.yaml (foundry-writing-tests,
# foundry-cheatcodes-overview, foundry-cheatcode-prank, foundry-cheatcode-expect-revert,
# foundry-cheatcode-expect-emit, foundry-cheatcode-assume, foundry-inline-test-config,
# foundry-testing-config, foundry-config-overview, forge-test-reference, foundry-forge-testing,
# forge-std-repo, foundry-issue-5494, measured-forge-1-7-1, solidity-0836-release), from
# solidity.yaml (solidity-abi-spec, solidity-docs-control-structures, eip-7702,
# measured-gas-constants), from evm.yaml (solidity-abi-events) and from ledgers.yaml (eip-7782).
