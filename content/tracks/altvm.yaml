id: altvm
number: 12
kind: elective
title: Alternative VMs
tagline: The same problems, solved by machines that made the opposite choice.
capabilities:
  - Take a Solidity contract with per-user state and redraw it as Solana accounts, naming which are PDAs and who has to sign for each
  - Predict from two transactions' account lists alone whether they will run in parallel or serialize, and say which lock decides it
  - Tune a transaction's compute budget and state what its priority fee will be before you send it, instead of after
  - Read an Anchor account struct and list, in execution order, every runtime check its constraints generate and what each one costs
  - Diagnose a failed Solana transaction as reverted, dropped, or blockhash-expired, and act on the difference
  - Argue whether a program should leave Anchor for Pinocchio in terms of invocation frequency, CU headroom and audit budget rather than speed
  - Audit a Token-2022 mint before your protocol lists it and say which extensions you reject, which you handle, and which are harmless
  - Find the missing check behind a Solana exploit and name the Anchor constraint that would have generated it for free
  - Explain why Solana, Aptos and Sui parallelise by three different mechanisms, and what each does under contention on one hot piece of state
  - State what a Cosmos appchain buys and what it costs, measured against a rollup and against a contract on a shared L1
layout: { lane: left, row: 4 }
entersFrom: [evm]
feedsInto: []
modules:
  - altvm-solana-accounts
  - altvm-parallel-execution
  - altvm-anchor
  - altvm-pinocchio
  - altvm-token-2022
  - altvm-solana-security
  - altvm-move
  - altvm-cosmos
