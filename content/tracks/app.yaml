id: app
number: 7
kind: elective
title: App & Product Layer
tagline: Everything between a user's intent and a receipt.
capabilities:
  - Read and write to any EVM chain from TypeScript with viem 2.x, and say for each line whether it touches the network
  - Simulate a contract call before you ask anyone to sign it, and turn the failure into a sentence naming the next action
  - Build a React app on wagmi 3.x that survives server rendering, a chain switch, and a cache that nothing invalidates for you
  - Ask a wallet what it can do instead of sniffing its vendor, and batch calls so they degrade instead of breaking
  - Ship a sponsored first transaction and explain who paid, what the paymaster is exposed to, and how it gets drained
  - Scope a session key to a policy the account enforces on-chain, and state in one sentence what is lost if the key leaks
  - Verify a passkey assertion on-chain and design a recovery path with no state whose only exit is "bricked"
  - Model a transaction's whole lifecycle in a UI - pending, replaced, dropped, reverted, reorged - instead of a spinner
  - Decode any revert into one of four shapes and route it to the right party - the user, your bug tracker, or a retry
layout: { lane: right, row: 5 }
entersFrom: [toolchain]
feedsInto: [infra]
modules:
  - app-viem
  - app-wagmi
  - app-wallet-capabilities
  - app-eoa-upgrade
  - app-account-abstraction
  - app-session-keys
  - app-passkeys
  - app-transaction-ux
  - app-error-surfaces
