id: defi
number: 8
kind: elective
title: DeFi Mechanics
tagline: Every mechanism, paired with the way it has been broken.
capabilities:
  - Derive the output of a constant-product or concentrated-liquidity swap by hand and check it against the pool's own integer arithmetic
  - Read a Uniswap v4 pool's hook address and state which callbacks that hook receives and what it could do to your swap
  - Recompute a lending position's health factor from raw on-chain reserve data and say which price move liquidates it
  - Derive a lending pool's supply APY from its borrow rate, utilisation and reserve factor instead of trusting the dashboard
  - Size a liquidation incentive against gas, exit slippage and position size, and identify the dust zone where positions become permanently unliquidatable
  - Estimate what it costs an attacker to move a given oracle, and pick a feed design whose failure mode you can live with
  - Classify any token calling itself a dollar by its redemption right, backing verifiability, yield source and freeze powers
  - Trace a swap through the MEV supply chain and name, at every hop, who can see it and who can reorder it
  - Pair each of these mechanisms with the incident that broke it and name the control that failed rather than the symptom
layout: { lane: right, row: 6 }
entersFrom: [toolchain]
feedsInto: []
