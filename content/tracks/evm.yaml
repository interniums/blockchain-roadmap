id: evm
number: 3
kind: core
title: The Ethereum Machine
tagline: The state transition function, opened up.
capabilities:
  - Read any mainnet transaction and say which envelope type it used, what it cost, and where each unit of gas went
  - Verify an account balance or a storage slot against a state root without trusting the RPC that served it
  - Explain what a delegated EOA can do, and audit a codebase for the "is this a contract" checks EIP-7702 broke
  - Predict a contract's address before deploying it, and say exactly what would change that address
  - Choose between stack, calldata, memory, transient storage and storage for a given value, and defend the choice with measured gas
  - Trace a failed call to the frame it failed in, and decode its revert payload by hand
  - Design an event schema an indexer can query, and state what changing it silently breaks downstream
  - Decide whether a payload belongs in calldata or in a blob, and name the guarantee each one actually gives
  - Read inline assembly in review and judge whether its memory-safe annotation is honest
layout: { lane: spine, row: 3 }
entersFrom: [ledgers]
feedsInto: [solidity, scaling, altvm, zk, protocol]
modules:
  - evm-accounts
  - evm-state-tries
  - evm-transaction-types
  - evm-gas-fee-market
  - evm-execution
  - evm-opcodes-memory
  - evm-logs-bloom
  - evm-blobs-data-lane
  - evm-yul-assembly
