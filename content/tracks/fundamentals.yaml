id: fundamentals
number: 1
kind: core
title: Fundamentals
tagline: The six ideas every later track quietly assumes you already have.
capabilities:
  - Predict what a hash, a signature and a Merkle proof can and cannot prove, and name the attack when someone claims more
  - Hand-decode a raw transaction into selector and arguments, and hand-encode a value back to the same bytes
  - Explain why two independent clients must produce byte-identical state roots, and debug a root mismatch from the hash alone
  - Verify an `eth_getProof` response against a block's state root without trusting the node that served it
  - Say what "confirmed" means for a specific product decision, and pick a confirmation policy defensible with a number
  - Price an attack on a chain in ETH destroyed rather than in adjectives, and state what would make that attack rational
  - Read a fee-mechanism or auction design and identify who the auctioneer is and whether they can also bid
layout: { lane: spine, row: 1 }
entersFrom: []
feedsInto: [ledgers, zk]
modules:
  - fundamentals-crypto
  - fundamentals-encoding
  - fundamentals-networks
  - fundamentals-distributed
  - fundamentals-state
  - fundamentals-incentives
