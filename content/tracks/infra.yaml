id: infra
number: 13
kind: elective
title: Infrastructure & Data
tagline: The chain answers "what is this now". Everything else you have to build.
capabilities:
  - Bring up an execution and consensus client pair yourself, and say for the sync mode you chose which questions the node can no longer answer
  - Read a node's disk growth and explain which bytes are block data, which are historical state, and which of them 2026 lets you drop
  - Predict a product's monthly RPC bill from its per-method call mix before you ship it, and name the one method that writes most of that bill
  - Design an RPC layer that survives a provider returning 429s and a load balancer serving you a block height that goes backwards
  - Choose an indexer on capability, chain coverage and who owns it, rather than on whichever benchmark headline you read last
  - Migrate a subgraph off a host that no longer exists, and state what carries over mechanically and what is a rewrite
  - Build an event ingester that produces byte-identical tables after a SIGKILL, a retry, and a two-block reorg
  - Decide, feature by feature, which of your product's reads may use the tip and which must wait for finality before anything irreversible fires
  - Turn a Foundry invariant into a production monitor that evaluates the same predicate against mainnet state every block
  - Rehearse a proxy upgrade or a governance proposal against live state, and publish the human-readable diff of what the calldata does
  - Run the first fifteen minutes of a live incident from a written runbook, and write the post-mortem that follows it
layout: { lane: left, row: 5 }
entersFrom: [toolchain]
feedsInto: []
modules:
  - infra-running-nodes
  - infra-rpc-economics
  - infra-indexing
  - infra-indexer-selection
  - infra-event-pipelines
  - infra-monitoring
  - infra-simulation
  - infra-incident-response
