id: ledgers
number: 2
kind: core
title: Ledgers & Consensus
tagline: Two ways to represent money, and the machinery that agrees on one of them.
capabilities:
  - Argue why Ethereum keeps accounts rather than unspent outputs, in terms of what each model makes easy and what it makes expensive
  - Read any Ethereum account record and say precisely which four fields it holds, and where its code and storage actually live
  - Diagnose a stuck or vanished transaction from raw RPC output and name which of the six failure modes it hit
  - Reconstruct a block hash from its header yourself, and say which header fields are live and which are post-Merge fossils
  - Explain what a validator is slashed for, and why the same offence costs almost nothing alone and everything in a crowd
  - Trace how a 2026 mainnet block was actually built — searcher, builder, relay, proposer — and name the trust assumption at each hop
  - Choose a confirmation policy for a product and defend it against the concrete cost of reversing the chain at that depth
layout: { lane: spine, row: 2 }
entersFrom: [fundamentals]
feedsInto: [evm, protocol]
modules:
  - ledgers-utxo
  - ledgers-accounts
  - ledgers-blocks
  - ledgers-mempool
  - ledgers-proof-of-stake
  - ledgers-finality
