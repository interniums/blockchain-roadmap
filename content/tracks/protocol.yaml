id: protocol
number: 11
kind: elective
title: Protocol Internals
tagline: The machine under the machine — two clients, one executable spec, and live arguments about what ships next.
capabilities:
  - Run a paired execution and consensus client and say, from the logs alone, which side is failing and why
  - Trace a single slot's Engine API calls in order and state what each one is asking the other process for
  - Build the consensus spec locally, advance a beacon state by hand, and point at the exact Python that implements any rule you name
  - Read a protocol change end to end — the EIP, the specs PR, the generated test vectors, and the client PR — and say what each layer added
  - Implement LMD-GHOST with proposer boost, then run an ex-ante and an ex-post reorg against your own implementation
  - Name the fork-choice constant any given attack depends on, and say what breaks when it moves in either direction
  - Say exactly what a beacon block will and will not contain once ePBS ships, and list what that breaks in a block parser
  - Derive which data columns your own node must custody from its node id, and compute the sampling assurance that buys
  - Judge whether a roadmap claim is current, cancelled, or never scheduled — and cite the artifact you checked it against
  - Measure a state proof today and estimate the same proof under the proposed binary tree, from your own numbers
  - Pick a client codebase by language and review process, and carry a first contribution through to a merged PR
layout: { lane: left, row: 3 }
entersFrom: [ledgers, evm]
feedsInto: []
modules:
  - protocol-client-architecture
  - protocol-consensus-specs
  - protocol-fork-choice
  - protocol-epbs
  - protocol-peerdas
  - protocol-statelessness
  - protocol-contributing
