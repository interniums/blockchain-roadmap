id: scaling
number: 9
kind: elective
title: Scaling & L2
tagline: The execution moved off Ethereum. Work out who you now have to trust.
capabilities:
  - Look up any L2 on L2BEAT, then confirm from chain data itself who can upgrade its contracts and who can freeze user funds
  - Explain why a chain with working validity proofs can still be Stage 0, and place a chain on the stage ladder yourself
  - Tell a sequencer's soft confirmation apart from L1 hard finality on a live chain, and write a credit policy that names the loss you are accepting
  - Decide from where a chain's data goes whether it is a rollup, a validium or an optimium, and say who can freeze funds in each case
  - Read the blob base fee and the execution base fee and say which posting path a batcher should take right now
  - Trace a fraud proof from the first bisection round down to the single instruction L1 actually executes
  - Force a transaction onto an L2 from L1, and state the delay you had to wait through and why it exists
  - Rank any bridge you are offered by the trust assumptions it adds on top of the rollup's own
  - Stand up an OP Stack chain end to end and name a human owner for every operational role it needs
  - Decide when Rust on Stylus is worth the activation overhead and when it buys you nothing at all
layout: { lane: right, row: 3 }
entersFrom: [evm]
feedsInto: []
modules:
  - scaling-rollup-stages
  - scaling-sequencers
  - scaling-data-availability
  - scaling-blobs-peerdas
  - scaling-proof-systems
  - scaling-forced-inclusion
  - scaling-bridges
  - scaling-op-stack
  - scaling-stylus
