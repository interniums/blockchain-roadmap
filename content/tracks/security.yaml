id: security
number: 6
kind: core
title: Security
tagline: Where the money actually leaves, and what would have stopped it.
capabilities:
  - Draw a protocol's trust boundaries and say, for each crossing, what an attacker controls
  - Rank vulnerability classes by what actually loses money rather than by what curricula rehearse
  - Reconstruct a real incident from its transaction trace back to the design decision that permitted it
  - Run static analysis, symbolic execution, fuzzing and a prover on the same code and state what each one cannot see
  - Write a handler-based invariant suite that finds accounting bugs a unit-test suite cannot reach
  - Read a formal-verification report for its assumptions and summaries instead of its checkmarks
  - Write an audit finding with a severity, a difficulty, a named exploit scenario and a runnable proof of concept
  - Score a codebase on a nine-category maturity rubric before reading a line of its business logic
  - Enter a competitive audit knowing the payout arithmetic and the scope rules that invalidate most first submissions
layout: { lane: spine, row: 6 }
entersFrom: [toolchain]
feedsInto: []
