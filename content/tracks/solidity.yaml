id: solidity
number: 4
kind: core
title: Solidity & Contracts
tagline: The language that writes the state transition, and everything it hides from you.
capabilities:
  - Read any Solidity contract and say which storage slot every state variable occupies, and whether reordering the declarations would change the gas
  - Derive a function selector by hand and decode a raw calldata blob into typed arguments without reaching for a tool
  - Predict address(this), msg.sender, msg.value and which account's storage is written, for CALL, DELEGATECALL and STATICCALL, before running the code
  - Write a proxy, upgrade it without corrupting state, and explain from a slot map why a proposed upgrade would brick the contract instead
  - Integrate a token that returns no data, taxes transfers, or rebases overnight, without silently making your contract insolvent
  - Choose between Ownable, AccessControl and AccessManager and state the blast radius of each privileged key you create
  - Build a share-accounting vault whose rounding direction and empty-vault price survive a first-depositor inflation attack
  - Design events and custom errors that an indexer and a frontend can still decode after you ship a second version
  - Read production Vyper and name, for each feature it leaves out, the class of bug that omission removes
layout: { lane: spine, row: 4 }
entersFrom: [evm]
feedsInto: [toolchain]
modules:
  - solidity-language-core
  - solidity-storage-layout
  - solidity-abi-selectors
  - solidity-calls-delegatecall
  - solidity-errors-events
  - solidity-contract-patterns
  - solidity-proxies-upgrades
  - solidity-token-standards
  - solidity-openzeppelin
  - solidity-vyper
