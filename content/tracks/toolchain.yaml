id: toolchain
number: 5
kind: core
title: Toolchain
tagline: Build it, test it, measure it, ship it — and know which numbers to trust.
capabilities:
  - Stand up a Foundry project whose build is byte-identical on someone else's machine
  - Write a Solidity test suite that fails for the right reason, and prove that it does
  - Turn a suspicion into a fuzz property, and a fuzz property into a stateful invariant campaign
  - Run your contracts against real deployed mainnet state at a pinned block, offline and repeatably
  - Measure gas honestly, and say out loud which of your numbers mainnet will not reproduce
  - Deploy one contract to several chains at one address, verify it on each, and recover a half-finished deploy
  - Build a CI pipeline that catches gas regressions, format drift and broken invariants without going flaky
  - Read a Hardhat 3 repository and judge whether the project actually needs it
layout: { lane: spine, row: 5 }
entersFrom: [solidity]
feedsInto: [security, app, defi, infra]
modules:
  - toolchain-foundry-basics
  - toolchain-unit-testing
  - toolchain-fuzzing
  - toolchain-invariant-testing
  - toolchain-fork-testing
  - toolchain-gas-profiling
  - toolchain-deploy-verify
  - toolchain-ci
  - toolchain-hardhat-literacy
