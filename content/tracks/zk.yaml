id: zk
number: 10
kind: elective
title: Cryptography & ZK
tagline: Start where the tools are. Descend only when the proof size stops making sense.
capabilities:
  - Decide, for a specific feature, whether to prove it in a zkVM, hand-write a circuit, or just execute it on-chain — and defend the choice with measured numbers
  - Write a Rust guest program, prove its execution, and verify that proof from a Solidity contract
  - Read a deployed verifier contract and state exactly what its public inputs bind, and what a valid proof therefore does not authorise
  - Explain why production "ZK rollups" are not private, and name the systems that actually use the zero-knowledge property
  - Compute a KZG commitment for a blob, derive its versioned hash by hand, and prove a claim about data the EVM cannot read
  - Choose between BN254 and BLS12-381 for an on-chain verifier and justify it on security bits, encoding, and gas
  - Write a Noir circuit, read its gate count, and find the unconstrained hint that lets a prover prove a false statement
  - Estimate the effective anonymity set behind a shielded withdrawal and name the metadata that would collapse it
  - Audit a proof-consuming contract for replay, stale-root binding, and upgrade-key risk
layout: { lane: right, row: 2 }
entersFrom: [fundamentals, evm]
feedsInto: []
modules:
  - zk-zkvms
  - zk-proof-systems
  - zk-commitments-kzg
  - zk-curves-pairings
  - zk-noir-circuits
  - zk-onchain-verification
  - zk-privacy-applications
