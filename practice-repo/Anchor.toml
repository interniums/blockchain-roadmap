# Anchor's half of the repo: the three altvm-anchor practices.
#
# `skip_local_validator` is on because Anchor 1.x tests programs host-side with litesvm — the
# generated tests load the built .so into an in-process VM. No validator, no airdrops, no ports.
skip_local_validator = true

[toolchain]

[features]
resolution = true
skip-lint = false

[programs.localnet]
anchor_has_one = "9L4GDVqGo3DZb3iDSLLmjGYcZF6wciKHskhpJiuGUb4X"
anchor_pda_config = "6gH8deuKefXYbzfFtzKBr5gLHbnsnnC8C9nqh8puPJuN"
anchor_idl_audit = "AL2usjzgqeKTrPok7pf7Lt8Zmqt1UntU4VQZuZ2BU3oG"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
# Scoped to the Anchor packages on purpose. `anchor init` writes a bare `cargo test`, which at this
# repo's workspace root would also build the three SBF exercises and the four host-Rust ones —
# minutes of compilation for a command that is about three programs.
#
# --no-fail-fast because two practices share the bare command `anchor test`. Without it the run
# stops at the first failing program and the other two practices' criteria never print.
test = "cargo test --no-fail-fast -p anchor-has-one -p anchor-pda-config -p anchor-idl-audit"

[hooks]
