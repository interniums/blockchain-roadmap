# One virtual workspace for every Rust exercise in the repo.
#
# It sits at the repo root because that is where the acceptance commands run. `cargo test-sbf`,
# `cargo test --workspace` and `cargo run --bin bench` all resolve from a virtual root with no
# package of its own, which was checked before this file was written rather than assumed.
#
# Three member groups, and the split is load-bearing:
#
#   programs/*  Anchor programs. Anchor finds programs by scanning this directory, so nothing that
#               is not an Anchor program may live here or `anchor build` will try to build it.
#   sbf/*       raw solana-program exercises, built for SBF by `cargo test-sbf` and exercised
#               host-side with litesvm.
#   rust/*      host-only Rust. No Solana runtime, so these compile and test in seconds.
#
# There is deliberately no rust-toolchain.toml. `anchor init` writes one pinning 1.89.0, which
# would make rustup download a second toolchain on first build; the whole workspace was verified
# to build on the installed 1.97.1 instead.
[workspace]
members = ["programs/*", "sbf/*", "rust/*"]
resolver = "2"

# `cargo test-sbf -- --nocapture` is the acceptance command for five practices and it names no
# package. Without this it resolved to whichever member sorted first — anchor-has-one — so all five
# ran somebody else's tests and stopped. default-members scopes every bare cargo command to the
# exercises that have no other way to be selected. The two commands that do select explicitly are
# unaffected: `cargo test --workspace` (protocol-contributing) and Anchor's `cargo test -p ...`.
default-members = ["sbf/*", "rust/*"]

[workspace.package]
edition = "2021"
version = "0.0.0"

# Anchor's own release profile. Solana programs want overflow checks on in release — an unchecked
# overflow in a program is a funds bug, not a performance question.
[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
