# Chainpath practice repo.
# Deliberately plain: one solc version, optimizer off, one remapping.
# Exercises are about semantics, not about build tuning.

[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]

solc = "0.8.36"
optimizer = false
via_ir = false

# forge-std is the only dependency. Nothing else is remapped.
remappings = ["forge-std/=lib/forge-std/src/"]

# Exercises assert on revert reasons; keep traces honest.
verbosity = 2
