[package]
name = "anchor-has-one"
edition.workspace = true
version.workspace = true
description = "What deleting a has_one constraint actually lets through"

[lib]
crate-type = ["cdylib", "lib"]
name = "anchor_has_one"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "1.1.2"

# Anchor 1.x tests programs host-side with litesvm and the split solana-* crates, rather than by
# standing up a validator. `anchor test` runs `cargo test` after building, so these are the deps
# the generated tests under tests/ compile against.
[dev-dependencies]
litesvm = "0.10.0"
solana-message = "3.0.1"
solana-transaction = "3.0.2"
solana-signer = "3.0.0"
solana-keypair = "3.0.1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
