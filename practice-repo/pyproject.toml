# The Python exercises. Four practices, three of them consensus-spec work that upstream drives
# with uv, which is why the commands say `uv run`.
#
# There is no build backend and no package: this is a dependency and pytest declaration for a
# directory of exercises, not a distribution.
[project]
name = "chainpath-practice"
version = "0.0.0"
description = "Python exercises for the Chainpath practice repo"
requires-python = ">=3.9"
dependencies = []

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
# `tests/` also holds TypeScript, because that is where the vitest and playwright acceptance
# commands point. pytest only collects `test_*.py`, so the two coexist; this makes that explicit
# rather than incidental.
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"
