# Its own workspace root: excluded from the repo workspace, so nothing here is inherited.
[workspace]

[package]
name = "stylus-gas"
version = "0.0.0"
description = "Stylus: what compute costs versus what storage costs"

# Not the workspace edition. `cargo stylus new` scaffolds 2024 and the SDK's macros expect it —
# `#[unsafe(no_mangle)]` in the generated main is 2024 syntax. Everything else here is 2021.
edition = "2024"

# cdylib is what cargo-stylus compiles to WASM; lib is what the host-side TestVM tests import.
[lib]
crate-type = ["lib", "cdylib"]

[dependencies]
alloy-primitives = "1.5"
alloy-sol-types = "1.5"
stylus-sdk = "0.10"

# `stylus_sdk::testing::TestVM` lives behind this feature. Without it the host-side test in lib.rs
# does not compile — a gap in what `cargo stylus new` scaffolds, not in this crate.
[dev-dependencies]
stylus-sdk = { version = "0.10", features = ["stylus-test"] }

[features]
default = ["mini-alloc"]
# `cargo stylus export-abi` needs this: criterion 4 calls this contract from Solidity through the
# interface it prints.
export-abi = ["stylus-sdk/export-abi"]
debug = ["stylus-sdk/debug"]
mini-alloc = ["stylus-sdk/mini-alloc"]
# The SDK's macros emit `cfg(feature = "contract-client-gen")`, so the feature has to be declared
# even though nothing here turns it on. Six warnings without it.
contract-client-gen = []
