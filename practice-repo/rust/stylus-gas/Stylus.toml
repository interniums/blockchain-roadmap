# The shape `cargo stylus new` produces for a single contract. All three tables are required —
# cargo-stylus 0.10.9 rejects a Stylus.toml without `[workspace]` even for one contract.
#
# Its workspace mode is not used here, and not by choice: a root Stylus.toml with `[workspace]`
# plus a contract underneath is what `cargo stylus new --workspace` generates, and that layout
# reports "missing Stylus.toml" from both directories. Verified against a pristine scaffold, so it
# is the tool rather than this repo. Hence the contract stands alone and the acceptance command
# enters its directory.
[workspace]

[workspace.networks]

[contract]
