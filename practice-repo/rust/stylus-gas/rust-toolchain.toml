# cargo-stylus requires this, and requires a specific version rather than a channel: the toolchain
# is part of the deployment hash, so `cargo stylus verify` can only reproduce your bytes if it can
# reproduce your compiler.
#
# Pinned to the version this was verified on. A learner on a different rustc will see rustup fetch
# this one — that cost is Stylus's reproducibility requirement, not a choice made here. It is scoped
# to this directory; the rest of the repo builds on whatever you have.
[toolchain]
channel = "1.97.1"
targets = ["wasm32-unknown-unknown"]
profile = "minimal"
