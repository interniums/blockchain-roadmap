[package]
name = "sealevel-attacks"
edition.workspace = true
version.workspace = true
description = "Three exploits from the Sealevel-attacks catalogue, reproduced"

# cdylib is what cargo-build-sbf loads; the lib target is what the host-side tests import.
[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
solana-program = "4"

# litesvm rather than solana-program-test: it runs the same SBF bytecode in-process without
# standing up a validator, which is the difference between a two-second test and a thirty-second one.
[dev-dependencies]
litesvm = "0.10"
solana-sdk = "3"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
